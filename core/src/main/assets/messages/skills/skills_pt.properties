actors.hero.skills.branchskill.invested_all=Na árvore inteira você gastou %1$d pontos, somando habilidades e talentos.
actors.hero.skills.branchskill.invested_tree=Você gastou %1$d pontos nesta árvore: %2$d em habilidades e %3$d em talentos.
