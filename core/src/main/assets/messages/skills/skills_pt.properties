actors.hero.skills.tengusarsenal.chasm=Ela rola para o abismo e some.
actors.hero.skills.hurl.name=Arremessar
actors.hero.skills.hurl.cast=Toma!
actors.hero.skills.hurl.desc=Arremesse a arma da sua mão, girando, contra um inimigo a até 6 quadrados, causando _120%_ do dano da arma, com encantamento e tudo. Depois ela volta voando para a sua mão.\n\n_+1:_ Cada acerto tem _15%_ de chance de quicar para outro inimigo próximo.\n\n_+2:_ A chance de quicar sobe para _30%_.\n\n_+3:_ A chance de quicar sobe para _45%_, e os acertos de Arremessar acumulam _combo_: cada ponto dá _+10%_ de dano ao seu próximo Arremessar, até 5.
actors.hero.skills.hurl.prompt=Escolha um inimigo para arremessar a arma
actors.hero.skills.hurl.no_target=Você precisa de um inimigo à vista a até 6 quadrados.
actors.hero.skills.hurl.no_weapon=Você precisa de uma arma corpo a corpo na mão para arremessar.
actors.hero.skills.pillaroflight.name=Pilar de Luz
actors.hero.skills.pillaroflight.cast=Faça-se a luz!
actors.hero.skills.pillaroflight.desc=Faça descer uma coluna de luz sobre um inimigo à vista a até 8 quadrados. Contra mortos-vivos e demônios ela queima com metade a mais de força, e fica mais forte conforme o seu dano.\n\n_+1:_ O pilar causa _160-320%_ do seu dano.\n\n_+2:_ O pilar causa _220-440%_ do seu dano e cega os inimigos ao lado dele por _2 turnos_.\n\n_+3:_ O pilar causa _280-560%_ do seu dano, e dele se espalha por _2 turnos_ uma estrela de espigões de luz, que atinge inimigos com _140%_ do seu dano e abençoa aliados.
