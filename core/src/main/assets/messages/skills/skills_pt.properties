actors.hero.skills.meteorcall.desc=Marque um quadrado visível e um meteoro cai nele no turno seguinte, explodindo e queimando todos os inimigos numa área 3x3. O centro recebe metade a mais.\n\n_+1:_ Alcance _7_. Causa _240-480%_ do seu dano.\n\n_+2:_ Alcance _9_. Causa _320-640%_ do seu dano.\n\n_+3:_ Alcance _11_. Causa _400-800%_ do seu dano. O impacto aturde, e o chão entra em erupção de novo um turno depois.
