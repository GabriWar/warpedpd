actors.hero.skills.branchskill.branch_maxed=Você não pode mais avançar nesta linha
actors.hero.skills.warriorpassivea.name=Guerreiro
actors.hero.skills.warriorpassivea.desc=O corpo de um Guerreiro se recusa a cair: ele aguenta o golpe, fecha a ferida e continua de pé.
actors.hero.skills.endurance.name=Resiliência
actors.hero.skills.endurance.desc=Fique firme e os golpes endurecem você. Cada golpe que você recebe sem ter se movido no turno anterior soma um acúmulo, e com acúmulos suficientes você finca os pés e pisa forte: o chão racha, os inimigos ao redor ficam enraizados por _3 turnos_ e uma barreira se ergue. Mover-se zera os acúmulos.\n\n_+1:_ Pisa forte depois de _5 golpes_: enraíza inimigos a até _1 quadrado_, barreira de _4%_ da sua vida máxima.\n\n_+2:_ Depois de _4 golpes_: a até _2 quadrados_, barreira de _7%_.\n\n_+3:_ Depois de _3 golpes_: a até _3 quadrados_, barreira de _10%_, e o chão rachado deixa os inimigos _aleijados_ por _6 turnos_.
actors.hero.skills.regeneration.name=Regeneração
actors.hero.skills.regeneration.desc=Matar o último inimigo à vista deixa você recuperar o fôlego e curar parte da vida perdida.\n\n_+1:_ Cura _15%_ da vida perdida.\n\n_+2:_ Cura _25%_ da vida perdida.\n\n_+3:_ Cura _35%_, e recuperar o fôlego também remove _sangramento, veneno e aleijamento_.
actors.hero.skills.toughness.name=Robustez
actors.hero.skills.toughness.desc=Quando um golpe tira _10%_ da sua vida máxima ou mais, você cerra os dentes e segura a dor: em vez de cair de uma vez, o golpe vai entrando em você ao longo dos próximos turnos. Só um golpe pode ser segurado por vez.\n\n_+1:_ O golpe cai ao longo de _2 turnos_.\n\n_+2:_ Ao longo de _3 turnos_.\n\n_+3:_ Ao longo de _4 turnos_, e matar o inimigo que o causou _cancela_ o que falta.
actors.hero.skills.laststand.name=Última Resistência
actors.hero.skills.laststand.desc=Quando um golpe derruba você a um quarto da vida, você finca os pés e ergue uma barreira. Isso pode acontecer de novo depois de _40 turnos_.\n\n_+1:_ Uma barreira de _5%_ da sua vida máxima.\n\n_+2:_ Uma barreira de _10%_.\n\n_+3:_ Uma barreira de _15%_, e você pisa forte no chão, _aturdindo_ todo inimigo ao seu lado por _2 turnos_.
actors.hero.skills.stoneskin.name=Pele de Pedra
actors.hero.skills.stoneskin.desc=Placas de pedra cobrem sua pele. Cada uma segura até _10%_ da sua vida máxima de um golpe e se estilhaça, lançando cacos num atacante adjacente com _40%_ do seu dano; placas quebradas voltam a crescer, uma a cada _10 turnos_.\n\n_+1:_ _1 placa_.\n\n_+2:_ _2 placas_.\n\n_+3:_ _3 placas_, e um golpe que uma placa segura por completo deixa o atacante _aturdido_ por _2 turnos_.
actors.hero.skills.bloodthirst.name=Desmoralizar
actors.hero.skills.bloodthirst.cast=Percam a coragem
actors.hero.skills.bloodthirst.desc=Seus golpes corpo a corpo minam a coragem de um inimigo, e os ataques dele passam a causar menos dano.\n\n_+1:_ _5%_ a menos de dano.\n\n_+2:_ _10%_ a menos de dano.\n\n_+3:_ _20%_ a menos de dano, e depois de _5 golpes seguidos que acertam_, o inimigo fica _Aterrorizado_. Um erro zera a contagem.
actors.hero.skills.warriorpassiveb.name=Corpo a Corpo
actors.hero.skills.warriorpassiveb.desc=Um Guerreiro vence com força bruta e com a arma que tem nas mãos.
actors.hero.skills.firmhand.name=Mão Firme
actors.hero.skills.firmhand.desc=Seu primeiro golpe corpo a corpo num inimigo ileso o deixa _cambaleante_: na próxima vez que um empurrão seu o mover (Empurrão, Estilhaça-Terra, Salto e afins), ele voa mais longe e se arrebenta contra o que o parar.\n\n_+1:_ Cambaleante por _3 turnos_, voa _1 quadrado_ mais longe.\n\n_+2:_ Cambaleante por _5 turnos_, voa _2 quadrados_ mais longe, e o impacto deixa cambaleante o que ele atingir.\n\n_+3:_ Cambaleante por _7 turnos_, e matar um inimigo cambaleante deixa cambaleante _todo inimigo ao lado dele_.
actors.hero.skills.aggression.name=Agressão
actors.hero.skills.aggression.desc=Quando um golpe corpo a corpo mata o alvo, ele segue cortando outro inimigo ao seu lado.\n\n_+1:_ O corte extra causa _40%_ do golpe.\n\n_+2:_ O corte extra causa _60%_ do golpe.\n\n_+3:_ O corte extra causa _80%_, e um corte extra que mata _corta de novo_.
actors.hero.skills.mastery.name=Maestria
actors.hero.skills.mastery.desc=Sua arma mantém os inimigos à distância: quando um inimigo chega ao seu lado, você pode golpeá-lo antes que ele ataque.\n\n_+1:_ _30%_ de chance de golpear primeiro.\n\n_+2:_ _45%_ de chance.\n\n_+3:_ _60%_ de chance, e o inimigo atingido é jogado _1 quadrado_ para trás.
actors.hero.skills.warbreaker.name=Quebra-Guarda
actors.hero.skills.warbreaker.cast=Guarda quebrada!
actors.hero.skills.warbreaker.desc=Golpes corpo a corpo podem despedaçar a guarda de um inimigo: esse golpe causa _30%_ a mais e deixa o inimigo vulnerável.\n\n_+1:_ _6%_ de chance, vulnerável por _4 turnos_.\n\n_+2:_ _12%_ de chance, vulnerável por _5 turnos_.\n\n_+3:_ _18%_ de chance, vulnerável por _6 turnos_, e todo inimigo ao lado do alvo também fica vulnerável.
actors.hero.skills.warrioractive.name=Habilidades
actors.hero.skills.warrioractive.desc=Guerreiros usam força bruta para castigar pesado.
actors.hero.skills.smash.name=Derrubada
actors.hero.skills.smash.cast=Pro chão!
actors.hero.skills.smash.desc=Agarre um inimigo adjacente e escolha onde jogá-lo. Ele sofre _100% do dano da arma_ ao cair. Jogue-o contra outro inimigo para ferir _os dois_ e _paralisar os dois por 1 turno_; o inimigo jogado cai logo antes do outro.\n\n_+1:_ Joga a até _3 quadrados_.\n\n_+2:_ Joga a até _5 quadrados_.\n\n_+3:_ Joga a até _7 quadrados_.\n\nNão afeta chefes, nem em colisões. Inimigos enormes ou imóveis sofrem o golpe no lugar. Arremessos não atravessam paredes. Inimigos jogados em abismos caem normalmente, e armadilhas disparam quando o inimigo cai nelas.
actors.hero.skills.knockback.name=Empurrão
actors.hero.skills.knockback.cast=Empurrão!
actors.hero.skills.knockback.desc=Enquanto ativa, seus golpes corpo a corpo empurram o alvo um quadrado para trás. A mana só é gasta quando o empurrão acontece.\n\n_+1:_ Golpes que empurram causam _10%_ a mais de dano.\n\n_+2:_ Golpes que empurram causam _20%_ a mais de dano.\n\n_+3:_ Golpes que empurram causam _30%_ a mais de dano, e um inimigo sem espaço atrás dele é _esmagado_ e sofre _25%_ a mais no lugar.
actors.hero.skills.rampage.name=Massacre
actors.hero.skills.rampage.cast=Massacre!
actors.hero.skills.rampage.desc=Enquanto ativa, todo golpe corpo a corpo atinge todos os inimigos ao seu redor, incluindo o alvo principal, e custa mana.\n\n_+1:_ Cada inimigo atingido sofre _60%_ do dano.\n\n_+2:_ Cada inimigo atingido sofre _80%_ do dano.\n\n_+3:_ Cada inimigo atingido sofre o dano _completo_ e fica _sangrando_.
actors.hero.skills.earthshatter.name=Estilhaça-Terra
actors.hero.skills.earthshatter.cast=Quebra!
actors.hero.skills.earthshatter.desc=Bata no chão. Todo inimigo a até _2 quadrados_ é ferido e enraizado; depois, anéis de lanças de pedra rolam para fora, cada anel batendo mais forte e empurrando os inimigos à frente da onda, então um inimigo pego na frente dela é atingido por todos os anéis.\n\n_+1:_ A pancada causa _200%_ do seu dano e enraíza por _3 turnos_. Vêm depois _2 anéis_, começando em _100%_ do seu dano e crescendo _20%_ a cada anel.\n\n_+2:_ A pancada causa _280%_ do seu dano e enraíza por _4 turnos_. Vêm depois _3 anéis_, começando em _140%_ e crescendo _40%_.\n\n_+3:_ A pancada causa _360%_ do seu dano e enraíza por _5 turnos_. Vêm depois _4 anéis_, começando em _180%_ e crescendo _60%_, e eles _aleijam_ o que atingem.
actors.hero.skills.ironstance.name=Postura de Ferro
actors.hero.skills.ironstance.cast=Firme!
actors.hero.skills.ironstance.desc=Erga a guarda. Enquanto ativa, você causa _15%_ menos dano, e um golpe corpo a corpo que você apara erra você por completo e custa mana. Sem mana, a guarda cai. Não pode ser escolhida junto com Fúria Imprudente.\n\n_+1:_ _15%_ de chance de aparar um golpe corpo a corpo.\n\n_+2:_ _30%_ de chance de aparar um golpe corpo a corpo.\n\n_+3:_ _45%_ de chance de aparar, e o atacante cambaleia para trás com _vertigem_ por _3 turnos_.
actors.hero.skills.recklessfury.name=Fúria Imprudente
actors.hero.skills.recklessfury.cast=Sem guarda!
actors.hero.skills.recklessfury.desc=Baixe a guarda: enquanto ativa, você sofre _10%_ a mais de dano, e todo golpe que acerta você acumula fúria. Seu próximo golpe corpo a corpo gasta toda ela como dano extra e custa mana. Não pode ser escolhida junto com Postura de Ferro.\n\n_+1:_ A fúria junta _50%_ do dano que você sofre.\n\n_+2:_ A fúria junta _75%_ do dano que você sofre.\n\n_+3:_ A fúria junta _100%_ dele, e se o golpe furioso matar, a fúria que sobrou _passa_ para o seu próximo golpe.
actors.hero.skills.warriorfourth.name=Comando do Senhor da Guerra
actors.hero.skills.warriorfourth.desc=Senhores da guerra quebram as pernas e a coragem do inimigo, depois chamam um escudeiro para segurar a linha de frente.
actors.hero.skills.hamstring.name=Corte no Tendão
actors.hero.skills.hamstring.cast=Fica no chão
actors.hero.skills.hamstring.desc=Seus golpes corpo a corpo podem cortar as pernas de um inimigo e aleijá-lo.\n\n_+1:_ _8%_ de chance de aleijar por _4 turnos_.\n\n_+2:_ _16%_ de chance de aleijar por _5 turnos_.\n\n_+3:_ _24%_ de chance de aleijar por _6 turnos_. Acertar um inimigo que já está aleijado quebra as pernas dele e o enraíza por _2 turnos_.
actors.hero.skills.demoralize.name=Desmoralizar
actors.hero.skills.demoralize.cast=Percam a coragem
actors.hero.skills.demoralize$demoralized.name=Desmoralizado
actors.hero.skills.demoralize$demoralized.desc=A coragem desta criatura está se quebrando: seus ataques causam %1$d%% menos dano.\n\nTurnos restantes: %2$s.
actors.hero.skills.demoralize.desc=Seus golpes corpo a corpo minam a coragem de um inimigo, e os ataques dele passam a causar menos dano.\n\n_+1:_ _5%_ a menos de dano.\n\n_+2:_ _10%_ a menos de dano.\n\n_+3:_ _20%_ a menos de dano, e depois de _5 golpes seguidos que acertam_, o inimigo fica _Aterrorizado_. Um erro zera a contagem.
actors.hero.skills.shieldbearer.name=Escudeiro
actors.hero.skills.shieldbearer.cast=Comigo!
actors.hero.skills.shieldbearer.desc=Chame um escudeiro juramentado para o seu lado. Todo inimigo à vista se volta contra ele. Ele tem vida própria, uma porcentagem da sua vida máxima, e os golpes dele causam uma porcentagem do seu dano. Ele mantém o posto por um dia do jogo e depois desaparece.\n\n_+1:_ Vida máxima igual a _40%_ da sua; golpeia com _40%_ do seu dano.\n\n_+2:_ Vida máxima igual a _55%_ da sua; golpeia com _50%_ do seu dano.\n\n_+3:_ Vida máxima igual a _70%_ da sua; golpeia com _60%_ do seu dano e chega com uma pancada de escudo que joga os inimigos adjacentes _1 quadrado_ para trás.
actors.hero.skills.shieldbearer.no_summons=Você não consegue controlar mais invocações.
actors.hero.skills.magepassivea.name=Mago
actors.hero.skills.magepassivea.desc=O poço interior do Mago: uma reserva de mana mais funda e proteções que a gastam para mantê-lo de pé.
actors.hero.skills.spirituality.name=Espiritualidade
actors.hero.skills.spirituality.desc=Golpes que acertam você soltam mana, nunca mais que a força do golpe.\n\n_+1:_ Cada golpe restaura até _2 de mana_.\n\n_+2:_ Cada golpe restaura até _3 de mana_.\n\n_+3:_ Até _4 de mana_. Com a mana cheia, o solavanco açoita o atacante com esse mesmo valor.
actors.hero.skills.meditation.name=Meditação
actors.hero.skills.meditation.desc=Fique parado sem nenhum inimigo à vista e, a cada _5 turnos_, um pulso calmo restaura mana.\n\n_+1:_ Cada pulso restaura _2 de mana_.\n\n_+2:_ Cada pulso restaura _3 de mana_.\n\n_+3:_ Cada pulso restaura _4 de mana_ e cura suas invocações à vista em _10%_ da vida máxima delas.
actors.hero.skills.spiritarmor.name=Armadura Espiritual
actors.hero.skills.spiritarmor.desc=Enquanto ativa, uma proteção azul paga parte de cada golpe com a sua mana (pelo menos 1 de mana por golpe). Cada _3 de mana_ pagos formam uma centelha que gira ao seu redor, e quando o anel fica cheio cada centelha dispara nos inimigos mais próximos.\n\n_+1:_ A proteção paga _10%_ de cada golpe; o anel comporta _2 centelhas_.\n\n_+2:_ _20%_ de cada golpe; _3 centelhas_.\n\n_+3:_ _30%_ de cada golpe; _4 centelhas_, e cada rajada dá a você _2 turnos_ de Recarregando.
actors.hero.skills.transcendence.name=Transcendência
actors.hero.skills.transcendence.desc=Enquanto ativa, você é meio luz: andar contra um inimigo leva você direto através dele até o quadrado livre do outro lado, por _3 de mana_, e a luz que você deixa dentro dele explode como uma lança.\n\n_+1:_ Atravessa _1 inimigo_; a lança causa _60-120%_ do seu dano.\n\n_+2:_ Atravessa uma fila de até _2 inimigos_; _80-160%_ em cada.\n\n_+3:_ Até _3 inimigos_, _100-200%_ em cada, e a lança _se divide em três_ ao sair pelas suas costas, cortando os inimigos à sua frente com metade do dano.
actors.hero.skills.serenefocus.name=Foco Sereno
actors.hero.skills.serenefocus.desc=Enquanto sua mana estiver em pelo menos _três quartos_, seus disparos deixam lento o inimigo que atingem. Não pode ser escolhida junto com Vontade de Ferro.\n\n_+1:_ Lentidão por _2 turnos_.\n\n_+2:_ Lentidão por _3 turnos_.\n\n_+3:_ Lentidão por _4 turnos_, e os inimigos ao lado do alvo também ficam lentos.
actors.hero.skills.willofiron.name=Vontade de Ferro
actors.hero.skills.willofiron.desc=Uma reserva que se esvazia endurece a sua vontade. Enquanto sua mana estiver abaixo da metade, um golpe de inimigo de pelo menos _5%_ da sua vida máxima é resistido de graça, uma vez por turno, e a força resistida fica guardada no seu cajado: seu próximo disparo ou magia de projétil que cause dano a libera. Não pode ser escolhida junto com Foco Sereno.\n\n_+1:_ Resiste a golpes de _5%_ da sua vida máxima; a força guardada soma _40%_ do seu dano.\n\n_+2:_ Resiste a golpes de _10%_ da sua vida máxima; ela soma _80%_ do seu dano.\n\n_+3:_ Resiste a golpes de _15%_ da sua vida máxima; ela soma _120%_ do seu dano, e você pode guardar _2 golpes resistidos_ de uma vez.
actors.hero.skills.magepassiveb.name=Magia
actors.hero.skills.magepassiveb.desc=Varinhas, feitiçaria pura e os servos que um Mago prende à própria vontade.
actors.hero.skills.wizard.name=Arcanista
actors.hero.skills.wizard.desc=Quando você dispara uma varinha, a carga gasta pode ricochetear no alvo e lançar o mesmo efeito no outro inimigo mais próximo. Se não houver ninguém para onde saltar, ela volta para a varinha.\n\n_+1:_ _15%_ de chance.\n\n_+2:_ _25%_ de chance.\n\n_+3:_ _35%_ de chance, e a _última carga_ de uma varinha sempre ricocheteia se houver outro inimigo perto.
actors.hero.skills.sorcerer.name=Feiticeiro
actors.hero.skills.sorcerer.desc=Seus disparos que causam dano podem sobrecarregar o inimigo atingido: ele estala por um turno, depois descarrega em si mesmo e em todo inimigo ao lado dele com metade do dano da varinha.\n\n_+1:_ _20%_ de chance de sobrecarregar.\n\n_+2:_ _35%_ de chance de sobrecarregar.\n\n_+3:_ _50%_ de chance, e um inimigo sobrecarregado que morre antes de descarregar _explode na hora_, numa área de dois quadrados.
actors.hero.skills.summoner.name=Invocador
actors.hero.skills.summoner.desc=Você pode manter mais servos invocados em campo ao mesmo tempo.\n\n_+1:_ Seu limite de invocações sobe em _1_.\n\n_+2:_ Seu limite de invocações sobe em _2_.\n\n_+3:_ Seu limite de invocações sobe em _3_, e todo servo que você chama é invocado _um nível acima_.
actors.hero.skills.soultether.name=Elo de Almas
actors.hero.skills.soultether.desc=Cada servo invocado que você mantém vivo, até _3_, alimenta suas varinhas com poder. Sem nada em campo, nada se ganha.\n\n_+1:_ Cada servo soma _3%_ de dano de varinha e _2%_ de recarga mais rápida.\n\n_+2:_ Cada servo soma _6%_ de dano de varinha e _4%_ de recarga mais rápida.\n\n_+3:_ Cada servo soma _9%_ de dano de varinha e _6%_ de recarga mais rápida: _+27%_ de dano e _22%_ de recarga mais rápida com três.
actors.hero.skills.mageactive.name=Invocação
actors.hero.skills.mageactive.desc=Magos chamam ratos e esqueletos para lutar ao lado deles e mantêm 3 invocações de uma vez, mais %1$d de Invocador.
actors.hero.skills.summonrat.name=Invocar Rato
actors.hero.skills.summonrat.cast=Levanta, roedor!
actors.hero.skills.summonrat.desc=Um rato sobe arranhando ao seu lado e luta por você. Ele tem vida própria, uma porcentagem da sua vida máxima, e as mordidas dele causam uma porcentagem do seu dano. Como toda invocação, ele dura um dia do jogo e depois desaparece.\n\n_+1:_ Vida máxima igual a _8%_ da sua; morde com _25%_ do seu dano.\n\n_+2:_ Vida máxima igual a _10%_ da sua; morde com _30%_ do seu dano.\n\n_+3:_ Vida máxima igual a _12%_ da sua; morde com _35%_ do seu dano.
actors.hero.skills.spark.name=Faísca
actors.hero.skills.spark.cast=Faísca!
actors.hero.skills.spark.desc=Dispare um raio de magia na primeira coisa no caminho. A força dele acompanha o seu dano.\n\n_+1:_ O raio causa _20-60%_ do seu dano.\n\n_+2:_ O raio causa _40-120%_ do seu dano.\n\n_+3:_ O raio causa _60-180%_ do seu dano, _atravessa_ seus aliados e atinge todo inimigo na linha até a primeira parede.
actors.hero.skills.summonskeleton.name=Invocar Esqueleto
actors.hero.skills.summonskeleton.cast=Os mortos vão obedecer!
actors.hero.skills.summonskeleton.desc=Um esqueleto se ergue ao seu lado, um servo resistente que ignora parte de cada golpe. Ele tem vida própria, uma porcentagem da sua vida máxima, e os golpes dele causam uma porcentagem do seu dano. Como toda invocação, ele dura um dia do jogo e depois desaparece.\n\n_+1:_ Vida máxima igual a _50%_ da sua; golpeia com _50%_ do seu dano e bloqueia até _5%_ da própria vida máxima.\n\n_+2:_ Vida máxima igual a _60%_ da sua; golpeia com _60%_ do seu dano e bloqueia até _10%_.\n\n_+3:_ Vida máxima igual a _70%_ da sua; golpeia com _70%_ do seu dano e bloqueia até _15%_.
actors.hero.skills.summoncrab.name=Invocar Caranguejo
actors.hero.skills.summoncrab.cast=Pinça neles!
actors.hero.skills.summoncrab.desc=Um caranguejo chega andando de lado e luta por você. Ele tem vida própria, uma porcentagem da sua vida máxima, e as pinçadas dele causam uma porcentagem do seu dano. A carapaça bloqueia parte de cada golpe. Como toda invocação, ele dura um dia do jogo e depois desaparece.\n\n_+1:_ Vida máxima igual a _20%_ da sua; pinça com _35%_ do seu dano.\n\n_+2:_ Vida máxima igual a _30%_ da sua; pinça com _40%_ do seu dano.\n\n_+3:_ Vida máxima igual a _40%_ da sua; pinça com _45%_ do seu dano.
actors.hero.skills.souldetonation.name=Detonação de Almas
actors.hero.skills.souldetonation.cast=Me sirva uma última vez!
actors.hero.skills.souldetonation.desc=Sacrifique uma invocação visível, ou até três de uma vez, e ela explode em fogo de alma. Ratos envenenam os inimigos ao redor; esqueletos atingem uma área maior.\n\n_+1:_ Cada explosão causa _7 de dano_ aos inimigos próximos.\n\n_+2:_ Cada explosão causa _10 de dano_.\n\n_+3:_ Cada explosão causa _13 de dano_ e deixa uma centelha de alma por _6 turnos_. Pise nela para recuperar mana.
actors.hero.skills.souldetonation.no_summons=Você não tem nada para detonar.
actors.hero.skills.magefourth.name=Elementalismo
actors.hero.skills.magefourth.desc=Elementalistas lançam fogo, gelo e tempestade puros contra a própria masmorra.
actors.hero.skills.cindertrail.name=Órbita Elemental
actors.hero.skills.cindertrail.cast=Juntem-se!
actors.hero.skills.cindertrail.desc=Invoque _5_ orbes de fogo ou gelo que giram ao seu redor e use de novo para lançá-los um a um a até _7 quadrados_. Cada orbe explode numa área de 3x3, queimando ou gelando inimigos e deixando chamas ou uma nevasca que também podem ferir você. Os orbes ficam maiores e mais fortes quanto mais tempo orbitam.\n\n_+1:_ Os orbes explodem com _60-140%_ do seu dano, o dobro quando estão totalmente crescidos.\n\n_+2:_ Os orbes explodem com _100-200%_ do seu dano, o dobro quando estão totalmente crescidos.\n\n_+3:_ Os orbes explodem com _120-260%_ do seu dano, o dobro quando estão totalmente crescidos. Lançar um orbe totalmente crescido faz todos os outros crescerem um estágio.
actors.hero.skills.frostnova.name=Nova Gélida
actors.hero.skills.frostnova.cast=Fique imóvel.
actors.hero.skills.frostnova.desc=Um anel de gelo explode a partir de você, ferindo e gelando todo inimigo a até _3 quadrados_.\n\n_+1:_ Causa _60-140%_ do seu dano e gela por _5 turnos_.\n\n_+2:_ Causa _80-200%_ do seu dano e gela por _7 turnos_.\n\n_+3:_ Causa _100-260%_ do seu dano e gela por _9 turnos_. Espinhos de gelo cobrem o chão por _4 turnos_, ferindo e gelando os inimigos que andam sobre eles.
actors.hero.skills.frostnova.no_targets=Não há nada perto o bastante para congelar.
actors.hero.skills.stormcall.name=Chamado da Tempestade
actors.hero.skills.stormcall.cast=O céu responde!
actors.hero.skills.stormcall.desc=Chame um raio do céu sobre um alvo. Depois, o raio salta entre inimigos próximos com _60%_ do dano.\n\n_+1:_ Causa _120-240%_ do seu dano e salta para mais _1_ inimigo.\n\n_+2:_ Causa _160-320%_ do seu dano e salta para mais _2_ inimigos.\n\n_+3:_ Causa _200-400%_ do seu dano e salta para mais _3_ inimigos. Tudo o que é atingido fica aturdido por _1 turno_.
actors.hero.skills.stormcall.no_target=Escolha um inimigo que você consiga ver para o raio atingir.
actors.hero.skills.pyreaffinity.name=Piromancia
actors.hero.skills.pyreaffinity.desc=Seus disparos de varinha e magias de projétil podem incendiar os inimigos que ferem. Não pode ser escolhida junto com Criomancia.\n\n_+1:_ _12%%_ de chance de incendiar.\n\n_+2:_ _24%%_ de chance de incendiar.\n\n_+3:_ _36%%_ de chance de incendiar, e as chamas saltam para um inimigo adjacente.
actors.hero.skills.rimeaffinity.name=Criomancia
actors.hero.skills.rimeaffinity.desc=Seus disparos de varinha e magias de projétil podem congelar por completo os inimigos que ferem, por _2 turnos_. Não pode ser escolhida junto com Piromancia.\n\n_+1:_ _10%%_ de chance de congelar.\n\n_+2:_ _20%%_ de chance de congelar.\n\n_+3:_ _30%%_ de chance de congelar, e um disparo num inimigo que já está congelado _estilhaça_ o gelo, causando de novo metade do dano do disparo.
actors.hero.skills.roguepassivea.name=Ladino
actors.hero.skills.roguepassivea.desc=Ladinos vivem de mãos rápidas e pés silenciosos: moedas, fechaduras e sombras.
actors.hero.skills.bandit.name=Bandido
actors.hero.skills.bandit.desc=Seus ataques surpresa batem a carteira do inimigo, uma vez por inimigo, e o que você rouba voa direto para você.\n\n_+1:_ Roube uma bolsa de _ouro_.\n\n_+2:_ Em vez disso, pegue o _item_ que o inimigo carregava, que cai aos seus pés. Ele não vai cair de novo.\n\n_+3:_ _Armas de arremesso e flechas_ também batem carteiras, do outro lado da sala.
actors.hero.skills.stealth.name=Furtividade
actors.hero.skills.stealth.desc=Seus passos são silenciosos. Quando você avista um inimigo novo, um duplo de fumaça surge ao seu lado, uma vez por inimigo. Um inimigo acordado caça o duplo primeiro; um adormecido continua dormindo. O duplo some quando o tempo dele acaba ou assim que algo o atinge.\n\n_+1:_ _+1 de furtividade_; o duplo dura _2 turnos_.\n\n_+2:_ _+2 de furtividade_; o duplo dura _3 turnos_.\n\n_+3:_ _+3 de furtividade_; o duplo dura _4 turnos_, e um inimigo que o atinge fica _cegado_ por 2 turnos.
actors.hero.skills.locksmith.name=Chaveiro
actors.hero.skills.locksmith.cast=Opa!!
actors.hero.skills.locksmith.desc=Você sente a placa de uma armadilha ceder e a trava antes que ela dispare.\n\n_+1:_ _33%_ de chance de travar uma armadilha em que você pisa.\n\n_+2:_ _66%_ de chance de travar uma armadilha em que você pisa.\n\n_+3:_ _99%_ de chance de travar uma armadilha, e ler o mecanismo travado _revela toda armadilha escondida_ a até _3 quadrados_.
actors.hero.skills.masterthief.name=Mestre Ladrão
actors.hero.skills.masterthief.desc=Você esconde na palma parte de cada roubo. Cada pilha de ouro que você pega e cada bolso que você bate fazem _2_ moedas girarem ao seu redor. Quando um inimigo acerta você, você joga uma moeda nos olhos dele e o _cega_ por _2 turnos_.\n\n_+1:_ Guarda até _2 moedas_.\n\n_+2:_ Guarda até _4 moedas_.\n\n_+3:_ Guarda até _6 moedas_, e cada moeda _ricocheteia_ para cegar um segundo inimigo próximo.
actors.hero.skills.roguepassiveb.name=Assassino
actors.hero.skills.roguepassiveb.desc=Ladinos contam com veneno e ataques furtivos para dar mortes rápidas, mas dolorosas.
actors.hero.skills.venom.name=Peçonha
actors.hero.skills.venom.cast=Veneno é a minha especialidade
actors.hero.skills.venom.desc=Sua lâmina está coberta de peçonha, que pode envenenar o que ela corta.\n\n_+1:_ Golpes corpo a corpo têm _10%_ de chance de envenenar por _3 turnos_.\n\n_+2:_ _20%_ de chance de envenenar por _4 turnos_.\n\n_+3:_ _30%_ de chance de envenenar por _5 turnos_, e um golpe corpo a corpo surpresa _sempre_ envenena.
actors.hero.skills.scorpion.name=Escorpião
actors.hero.skills.scorpion.desc=Seu veneno dura mais, e acertar um inimigo envenenado pode ferroá-lo até deixá-lo manco.\n\n_+1:_ O veneno dura _2_ turnos a mais. Golpes em inimigos envenenados têm _10%_ de chance de aleijar.\n\n_+2:_ O veneno dura _4_ turnos a mais, _20%_ de chance de ferroada.\n\n_+3:_ O veneno dura _6_ turnos a mais, _30%_ de chance de ferroada, e ferroar um inimigo que já está aleijado o _paralisa_ por 1 turno.
actors.hero.skills.silentdeath.name=Morte Silenciosa
actors.hero.skills.silentdeath.cast=Sono Eterno
actors.hero.skills.silentdeath.desc=Seu ataque corpo a corpo num inimigo adormecido vai direto na garganta. Se o golpe o deixar com uma parte da vida máxima ou menos, ele morre sem fazer barulho. Chefes e minichefes são imunes.\n\n_+1:_ Mata um inimigo adormecido que fique com _15%_ da vida máxima ou menos.\n\n_+2:_ Com _25%_ ou menos.\n\n_+3:_ Com _35%_ ou menos, e uma morte silenciosa cala a sala: inimigos dormindo a até _4 quadrados_ não podem acordar por _3 turnos_, a não ser que sejam feridos.
actors.hero.skills.necrotoxin.name=Necrotoxina
actors.hero.skills.necrotoxin.cast=Apodreça
actors.hero.skills.necrotoxin.desc=Cada tique de veneno agindo num inimigo dá _7 de mana_ a você.\n\nGolpes num inimigo envenenado também podem romper o veneno: _150%_ do dano restante dele cai de uma vez.\n\n_+1:_ _20%_ de chance de romper.\n\n_+2:_ _35%_ de chance de romper.\n\n_+3:_ _50%_ de chance, e o rompimento envenena os inimigos adjacentes por _5 turnos_.
actors.hero.skills.rogueactive.name=Ninjitsu
actors.hero.skills.rogueactive.desc=Truques, bombas e uma corda: o Ladino nunca luta onde o inimigo espera.
actors.hero.skills.doublestab.name=Elo Sombrio
actors.hero.skills.doublestab.cast=Lento demais
actors.hero.skills.doublestab.desc=Enquanto ativa, cada acerto gasta _6 de mana_ para ligar o alvo ao inimigo mais próximo a até _3 quadrados_ por _8 turnos_, e o dano em um passa para o outro. Sem ninguém por perto, o alvo leva um segundo corte em vez disso. Se faltar mana, o elo se rompe.\n\n_+1:_ Inimigos ligados dividem _40%_ do dano. Um alvo sozinho leva _35%_ a mais.\n\n_+2:_ Inimigos ligados dividem _60%_ do dano. Um alvo sozinho leva _50%_ a mais.\n\n_+3:_ Inimigos ligados dividem _80%_ do dano. Um alvo sozinho leva _70%_ a mais.
actors.hero.skills.ninjabomb.name=Bomba Ninja
actors.hero.skills.ninjabomb.cast=Na fumaça!
actors.hero.skills.ninjabomb.desc=Jogue uma bomba de fumaça. A fumaça esconde você e faz os inimigos próximos dormirem.\n\n_+1:_ Inimigos a até _1 quadrado_ adormecem.\n\n_+2:_ Inimigos a até _2 quadrados_ adormecem.\n\n_+3:_ Inimigos a até _3 quadrados_ adormecem, e um _clone de fumaça_ fica para trás por _5 turnos_ para atraí-los.
actors.hero.skills.shadowclone.name=Gancho
actors.hero.skills.shadowclone.cast=Vamos!
actors.hero.skills.shadowclone.desc=Dispare uma corda e se puxe até onde ela cair. Prenda o gancho em um inimigo para voar até ele e golpear com _150%_ do dano da arma, ou numa parede para cruzar a sala balançando.\n\n_+1:_ Dispare _1 corda_.\n\n_+2:_ Dispare _2 cordas_ em sequência.\n\n_+3:_ Dispare _3 cordas_ em sequência e prenda o gancho em _qualquer quadrado que você vê_: chão aberto, do outro lado de abismos.
actors.hero.skills.shadowclone.too_many=Você não pode controlar mais invocações.
actors.hero.skills.phantomstrike.name=Companhia das Sombras
actors.hero.skills.phantomstrike.cast=Não tem para onde fugir
actors.hero.skills.phantomstrike.desc=Chame do chão sombras vinculadas para lutar ao seu lado. Elas enxergam ao redor de si e dividem essa visão com você, mesmo através de paredes. Cada uma tem a própria vida, uma porcentagem da sua vida máxima, e golpeia com uma porcentagem do seu dano.\n\n_+1:_ Chame até _2 sombras_, cada uma com vida máxima igual a _15%_ da sua, golpeando com _30%_ do seu dano.\n\n_+2:_ Chame até _3 sombras_, cada uma com _30%_ da sua vida máxima, golpeando com _40%_ e de olhar mais aguçado.\n\n_+3:_ Chame até _4 sombras_, cada uma com _40%_ da sua vida máxima, golpeando com _50%_, e use a habilidade em uma delas para _trocar de lugar_ com ela de graça.
actors.hero.skills.phantomstrike.too_far=Isso está longe demais.
actors.hero.skills.phantomstrike.no_target=Não há ninguém ali para golpear.
actors.hero.skills.phantomstrike.no_room=Não sobrou espaço ao lado do seu alvo.
actors.hero.skills.blink.name=Translocar
actors.hero.skills.blink.cast=Lento demais
actors.hero.skills.blink.desc=Enquanto ativa, você se move como um raio: andar contra um inimigo leva você direto através dele até o quadrado livre logo atrás, golpeando-o ao passar, por _4 de mana_. Se você parar ao lado de outro inimigo que ainda não golpeou, atravessa esse também, e assim por diante.\n\n_+1:_ Encadeie até _3 inimigos_, cada um golpeado com _60%_ do dano da sua arma.\n\n_+2:_ Até _4 inimigos_, _80%_ cada.\n\n_+3:_ Até _5 inimigos_, _100%_ cada.\n\nFunciona em chefes também; só um quadrado bloqueado atrás de um inimigo interrompe a sequência.
actors.hero.skills.blooddance.name=Valsa Carmesim
actors.hero.skills.blooddance.cast=Fique perto
actors.hero.skills.blooddance.desc=Você não recua mais. Ganhe adrenalina e, enquanto ela durar, cada acerto corpo a corpo abre um ferimento que sangra.\n\n_+1:_ _7 turnos_ de adrenalina. Acertos causam _2 de sangramento_.\n\n_+2:_ _10 turnos_ de adrenalina. Acertos causam _3 de sangramento_.\n\n_+3:_ _13 turnos_ de adrenalina. Acertos causam _4 de sangramento_, e a dança começa atrás de um escudo de _9%_ da sua vida máxima.
actors.hero.skills.roguefourth.name=Pavor
actors.hero.skills.roguefourth.desc=O pavor quebra a sala antes de matar qualquer coisa, e depois se alimenta do pânico.
actors.hero.skills.creepingdread.name=Pavor Rastejante
actors.hero.skills.creepingdread.cast=Bu.
actors.hero.skills.creepingdread.desc=Seus acertos corpo a corpo podem deixar o alvo aterrorizado com você.\n\n_+1:_ _8%_ de chance de aterrorizar por _4 turnos_.\n\n_+2:_ _16%_ de chance de aterrorizar por _5 turnos_.\n\n_+3:_ _24%_ de chance de aterrorizar por _6 turnos_, e o medo _se espalha_ para todo inimigo ao lado do alvo.
actors.hero.skills.predation.name=Predação
actors.hero.skills.predation.desc=Acertos em um inimigo com _40%_ da vida ou menos podem dilacerá-lo e fazê-lo sangrar.\n\n_+1:_ _25%_ de chance de dilacerar.\n\n_+2:_ _35%_ de chance de dilacerar.\n\n_+3:_ _45%_ de chance, e matar um inimigo que está sangrando cura _3%_ da sua vida máxima.
actors.hero.skills.blackout.name=Apagão
actors.hero.skills.blackout.cast=Apaga a luz
actors.hero.skills.blackout.desc=Jogue escuridão em um ponto. Inimigos a até _2 quadrados_ ficam cegos e aterrorizados, e uma fumaça esconde o ponto. Enquanto ela durar, inimigos que não conseguem ver você são atraídos para lá, e seu primeiro acerto de dentro da fumaça também corta outro inimigo próximo com metade do dano.\n\n_+1:_ Cegueira por _6 turnos_, terror por _3_.\n\n_+2:_ Cegueira por _8 turnos_, terror por _4_.\n\n_+3:_ Cegueira por _10 turnos_, terror por _5_, e a escuridão _cura suas sombras_ próximas em _8%_ da vida máxima delas.
actors.hero.skills.panicharvest.name=Colheita do Pânico
actors.hero.skills.panicharvest.desc=Acertar um inimigo fugindo, aterrorizado, encolerizado ou encantado colhe o medo dele como mana, uma vez por turno.\n\n_+1:_ Recupera _1 de mana_.\n\n_+2:_ Recupera _2 de mana_.\n\n_+3:_ Recupera _2 de mana_, e um inimigo em pânico que você mata aterroriza os inimigos adjacentes por _3 turnos_.
actors.hero.skills.dreadhowl.name=Uivo do Pavor
actors.hero.skills.dreadhowl.cast=Briguem entre si
actors.hero.skills.dreadhowl.desc=Um uivo que transforma medo em loucura. Inimigos aterrorizados à vista a até _5 quadrados_ se voltam contra quem estiver mais perto.\n\n_+1:_ A loucura dura _4 turnos_.\n\n_+2:_ A loucura dura _5 turnos_.\n\n_+3:_ A loucura dura _6 turnos_, e inimigos que ainda não têm medo ficam _aterrorizados_ por 3 turnos, prontos para o próximo uivo.
actors.hero.skills.dreadhowl.no_targets=Nada aqui tem medo de você ainda.
actors.hero.skills.huntresspassivea.name=Caçadora
actors.hero.skills.huntresspassivea.desc=A caçadora lê a natureza: sentidos aguçados, passos silenciosos e paciência para esperar a presa.
actors.hero.skills.fletching.name=Emplumar
actors.hero.skills.fletching.cast=Boas flechas.
actors.hero.skills.fletching.desc=Você recupera as penas de cada flecha que acerta: cada acerto a distância soma uma pena ao anel que gira ao seu redor. Com _3 penas_ você empluma uma flecha que se divide, e seu próximo acerto a distância se parte em hastes farpadas que voam contra inimigos perto do alvo com _30%_ do acerto.\n\n_+1:_ A flecha se divide em _2 hastes_.\n\n_+2:_ Ela se divide em _3 hastes_.\n\n_+3:_ Ela se divide em _4 hastes_, e uma haste que mata devolve sua pena ao anel.
actors.hero.skills.awareness.name=Percepção
actors.hero.skills.awareness.cast=Fácil demais..
actors.hero.skills.awareness.desc=Você lê cada inimigo que chega: o primeiro ataque de cada inimigo contra você, corpo a corpo ou a distância, pode ser evitado, e uma flecha voa direto de volta nele com _metade_ do dano do seu arco.\n\n_+1:_ _20%_ de chance de evitá-lo.\n\n_+2:_ _30%_ de chance de evitá-lo.\n\n_+3:_ _40%_ de chance, e a flecha de volta _prende_ o atacante no chão por _2 turnos_.
actors.hero.skills.hunting.name=Caça
actors.hero.skills.hunting.cast=Pego desprevenido.
actors.hero.skills.hunting.desc=Golpear um inimigo dormindo ou vagando o deixa aturdido com o susto.\n\n_+1:_ Aturde por _2 turnos_.\n\n_+2:_ Aturde por _3 turnos_.\n\n_+3:_ Aturde por _4 turnos_, e matar essa presa revela o inimigo escondido mais próximo por _10 turnos_.
actors.hero.skills.sixthsense.name=Sexto Sentido
actors.hero.skills.sixthsense.desc=A floresta avisa você dos piores golpes: um acerto que tiraria mais de um quarto da sua vida fica limitado a um quarto. O tempo até o próximo aviso aparece na sua barra de buffs.\n\n_+1:_ O aviso volta a cada _40 turnos_.\n\n_+2:_ O aviso volta a cada _30 turnos_.\n\n_+3:_ O aviso volta a cada _20 turnos_, e o atacante fica _atordoado por 3 turnos_.
actors.hero.skills.lonewolf.name=Lobo Solitário
actors.hero.skills.lonewolf.desc=Sem aliados perto de você e sem invocações no andar (suas próprias imagens residuais não contam), cada abate faz você uivar, e os inimigos a até 2 quadrados fogem.\n\n_+1:_ Eles fogem por _2 turnos_.\n\n_+2:_ Eles fogem por _3 turnos_.\n\n_+3:_ Eles fogem por _4 turnos_, e o abate recupera _5%_ da sua vida.
actors.hero.skills.poacher.name=Caçador Furtivo
actors.hero.skills.poacher.desc=Um abate a distância deixa a carcaça como isca: por _5 turnos_ o cheiro atrai inimigos que não conseguem ver você.\n\n_+1:_ O cheiro alcança _4 quadrados_.\n\n_+2:_ O cheiro alcança _5 quadrados_.\n\n_+3:_ O cheiro alcança _6 quadrados_, e um _laço_ fica escondido na carcaça: o primeiro inimigo a chegar nela fica enraizado por _3 turnos_.
actors.hero.skills.huntresspassiveb.name=A Distância
actors.hero.skills.huntresspassiveb.desc=Toda flecha encontra o alvo: a caçadora faz da distância sua vantagem.
actors.hero.skills.accuracy.name=Pontaria
actors.hero.skills.accuracy.desc=Seus acertos a distância podem achar os olhos: um tiro na mosca cega o alvo por 3 turnos.\n\n_+1:_ _10%_ de chance de tiro na mosca.\n\n_+2:_ _20%_ de chance de tiro na mosca.\n\n_+3:_ _30%_ de chance, e seu primeiro acerto a distância em cada inimigo é sempre na mosca.
actors.hero.skills.kneeshot.name=Tiro no Joelho
actors.hero.skills.kneeshot.cast=Alvo fácil
actors.hero.skills.kneeshot.desc=Você mira nas pernas: acertos a distância podem aleijar.\n\n_+1:_ _10%_ de chance de aleijar por _4 turnos_.\n\n_+2:_ _20%_ de chance de aleijar por _5 turnos_.\n\n_+3:_ _30%_ de chance de aleijar por _6 turnos_, e um tiro em um inimigo aleijado faz ele _sangrar_.
actors.hero.skills.irontip.name=Ponta de Ferro
actors.hero.skills.irontip.cast=Não esqueça de dividir...
actors.hero.skills.irontip.desc=Pontas de ferro perfuram: um acerto a distância pode seguir para os inimigos atrás do alvo.\n\n_+1:_ _50%_ de chance de perfurar _1 inimigo_ logo atrás.\n\n_+2:_ _67%_ de chance de perfurar até _2 inimigos_ a até 2 quadrados.\n\n_+3:_ _75%_ de chance de perfurar até _3 inimigos_ a até 3 quadrados, e todo acerto a distância deixa o alvo _vulnerável por 3 turnos_.
actors.hero.skills.heartseeker.name=Caça-Corações
actors.hero.skills.heartseeker.cast=Direto no coração.
actors.hero.skills.heartseeker.desc=Um acerto a distância que deixa um inimigo com menos da metade da vida crava uma flecha no coração dele. Um coração pulsa sobre ele e, na _terceira batida_, explode. Chefes e minichefes sofrem metade.\n\n_+1:_ A explosão causa _8%_ da vida máxima dele.\n\n_+2:_ A explosão causa _15%_ da vida máxima dele.\n\n_+3:_ A explosão causa _22%_, e uma explosão que mata arranca a flecha e a crava no inimigo mais próximo com menos da metade da vida a até _4 quadrados_.
actors.hero.skills.huntressactive.name=Arquearia
actors.hero.skills.huntressactive.desc=A Caçadora deixa o arco falar por ela, com flechas que nunca erram, se dividem em duas, explodem ou caem como chuva.
actors.hero.skills.aimedshot.name=Tiro Mirado
actors.hero.skills.aimedshot.cast=Estou vendo ele
actors.hero.skills.aimedshot.desc=Enquanto ativa, cada acerto a distância gasta mana para prender o alvo no chão. Só uma entre Tiro Mirado, Tiro Duplo e Bomba Viagem pode ficar ativa.\n\n_+1:_ Prende por _2 turnos_.\n\n_+2:_ Prende por _3 turnos_.\n\n_+3:_ Prende por _4 turnos_, e um tiro mirado que mata devolve a mana gasta.
actors.hero.skills.doubleshot.name=Tiro Duplo
actors.hero.skills.doubleshot.cast=Dois por um
actors.hero.skills.doubleshot.desc=Enquanto ativa, seus acertos a distância podem soltar uma segunda flecha em outro inimigo à vista, ou no mesmo se não houver outro. Só uma entre Tiro Mirado, Tiro Duplo e Bomba Viagem pode ficar ativa por vez.\n\n_+1:_ A segunda flecha voa em _50%_ das vezes.\n\n_+2:_ A segunda flecha voa em _75%_ das vezes.\n\n_+3:_ A segunda flecha voa em _todo_ acerto, e você pode _marcar_ o inimigo em que ela mira.
actors.hero.skills.bombvoyage.name=Bomba Viagem
actors.hero.skills.bombvoyage.cast=Bomba Viagem
actors.hero.skills.bombvoyage.desc=Enquanto ativa, suas armas de arremesso e flechas explodem como bombas ao acertar, ferindo todos os inimigos em volta do alvo sem quebrar paredes. Só uma entre Tiro Mirado, Tiro Duplo e Bomba Viagem pode ficar ativa por vez.\n\n_+1:_ A explosão fere todos os inimigos a até _1 quadrado_.\n\n_+2:_ A explosão causa _35%_ mais dano.\n\n_+3:_ Uma explosão que mata dispara uma _segunda explosão, menor,_ onde aquele inimigo estava, uma vez por tiro.
actors.hero.skills.arrowstorm.name=Tempestade de Flechas
actors.hero.skills.arrowstorm.cast=Chuva de flechas!
actors.hero.skills.arrowstorm.desc=Uma ave de rapina espectral faz chover flechas no ponto que você escolher por _3 turnos_, ferindo e aleijando todos os inimigos embaixo.\n\n_+1:_ Cada saraivada cobre uma área _3x3_ com _25%_ do dano do seu arco.\n\n_+2:_ Cada saraivada causa _35%_ e alcança _2 quadrados_ para fora em cruz.\n\n_+3:_ Cada saraivada causa _45%_, e as flechas ficam fincadas no chão por _4 turnos_, ferindo e aleijando quem pisar nelas.
actors.hero.skills.frostarrows.name=Flechas Gélidas
actors.hero.skills.frostarrows.cast=Congele.
actors.hero.skills.frostarrows.desc=Enquanto ativa, seus acertos a distância gelam o alvo.\n\n_+1:_ Acertos gelam por _3 turnos_.\n\n_+2:_ Acertos gelam por _4 turnos_ e causam _15%_ mais dano em alvos gelados.\n\n_+3:_ Acertos gelam por _5 turnos_, causam _15%_ mais em alvos gelados e têm _20%_ de chance de, em vez disso, congelar o alvo por completo por _2 turnos_.
actors.hero.skills.emberarrows.name=Flechas de Brasa
actors.hero.skills.emberarrows.cast=Queime.
actors.hero.skills.emberarrows.desc=Enquanto ativa, seus acertos a distância incendeiam o alvo.\n\n_+1:_ O alvo _pega fogo_.\n\n_+2:_ As chamas também saltam para _1 inimigo_ ao lado do alvo.\n\n_+3:_ Um inimigo em chamas que seu tiro mata _explode_, incendiando todos os inimigos ao lado dele.
actors.hero.skills.huntressfourth.name=Trilha de Armadilhas
actors.hero.skills.huntressfourth.desc=Trilhas de armadilhas fazem o chão lutar por você, armadas um turno antes que alguém caia nelas.
actors.hero.skills.groundwork.name=Preparar o Terreno
actors.hero.skills.groundwork.desc=Um inimigo que você pegou (enraizado, aleijado, aturdido, congelado ou dormindo) fica cercado pelas estacas das suas trilhas de armadilhas. Acertá-lo puxa a linha, e as estacas saltam contra todos os inimigos ao lado dele.\n\n_+1:_ As estacas causam _20%_ do seu acerto.\n\n_+2:_ As estacas causam _35%_ do seu acerto.\n\n_+3:_ As estacas causam _50%_ e aleijam os atingidos por _2 turnos_.
actors.hero.skills.beartrap.name=Armadilha de Urso
actors.hero.skills.beartrap.cast=Cuidado onde pisa.
actors.hero.skills.beartrap.desc=Arme mandíbulas de aço em chão aberto; o quadrado continua livre para andar e brilha para você saber onde elas esperam. O primeiro inimigo que pisar nelas sem voar sangra, manca e fica acorrentado no lugar, e cada puxão contra a corrente o fere até ela arrebentar.\n\n_+1:_ A mordida causa _4_ de sangramento e a corrente segura por _7 turnos_.\n\n_+2:_ A mordida causa _6_ de sangramento e a corrente segura por _9 turnos_.\n\n_+3:_ A mordida causa _8_ de sangramento, a corrente segura por _11 turnos_, e quando ela arrebenta um _leito de espinhos_ desperta onde as mandíbulas morderam.
actors.hero.skills.beartrap.no_ground=Não há onde armar as mandíbulas ali.
actors.hero.skills.beartrap.occupied=Já tem algo armado ali.
actors.hero.skills.deadfall.name=Armadilha de Peso
actors.hero.skills.deadfall.cast=Vai desabar.
actors.hero.skills.deadfall.desc=Arme um peso enorme sobre uma área 3x3 que você vê. A armação range sobre o centro e aguenta por _30 turnos_; o primeiro inimigo a pisar embaixo dela derruba o peso, esmagando e aturdindo todos os inimigos embaixo. Use de novo para cortar a corda antes.\n\n_+1:_ Causa _140-280%_ do seu dano e aturde por _1 turno_.\n\n_+2:_ Causa _200-400%_ do seu dano e aturde por _1 turno_.\n\n_+3:_ Causa _260-520%_ do seu dano e aturde por _2 turnos_. Inimigos já enraizados ou aleijados sofrem dano _dobrado_.
actors.hero.skills.deadfall.no_vision=Você não consegue ver esse ponto.
actors.hero.skills.duelistpassivea.name=Duelista
actors.hero.skills.duelistpassivea.desc=Duelistas dependem de técnica impecável e condicionamento.
actors.hero.skills.conditioning.name=Condicionamento
actors.hero.skills.conditioning.desc=Quando um acerto deixa você abaixo de um terço da vida, seu corpo se recompõe e se cura. Isso nunca salva você de um golpe fatal.\n\n_+1:_ Uma vez por andar, recupere _10%_ da sua vida máxima.\n\n_+2:_ Uma vez por andar, recupere _20%_ da sua vida máxima.\n\n_+3:_ Recupere _30%_, e isso pode acontecer _duas vezes_ por andar.
actors.hero.skills.poise.name=Compostura
actors.hero.skills.poise.desc=Cada abate acalma sua respiração e firma seus pés.\n\n_+1:_ Cada abate cura _1%_ da sua vida máxima.\n\n_+2:_ Cada abate cura _2%_ da sua vida máxima.\n\n_+3:_ Cada abate cura _3%_ da sua vida máxima e dá a você um _breve surto de velocidade_.
actors.hero.skills.parrystance.name=Postura de Aparo
actors.hero.skills.parrystance.desc=Apare com a lâmina os golpes de inimigos adjacentes, desviando-os por completo e revidando na hora com _60%_ do dano da arma.\n\n_+1:_ _10%_ dos golpes deles são aparados.\n\n_+2:_ _15%_ dos golpes deles são aparados.\n\n_+3:_ _20%_ são aparados, e a riposta varre _todos os inimigos_ ao seu lado.
actors.hero.skills.aplomb.name=Aprumo
actors.hero.skills.aplomb.desc=Golpes fracos de criaturas resvalam em você sem deixar marca.\n\n_+1:_ Golpes que causam até _3%_ da sua vida máxima resvalam.\n\n_+2:_ Até _5%_, e um atacante corpo a corpo cujo golpe resvala fica _Atordoado_ por _2 turnos_.\n\n_+3:_ Até _7%_, e o atacante também cambaleia, _perdendo o próximo turno_.
actors.hero.skills.duelistpassiveb.name=Esgrima
actors.hero.skills.duelistpassiveb.desc=Duelistas se destacam com uma lâmina na mão.
actors.hero.skills.precision.name=Precisão
actors.hero.skills.precision.desc=Seu primeiro acerto corpo a corpo em um inimigo ileso acha uma brecha na guarda dele: um brilho de aço o marca, e seus golpes nele ignoram a armadura.\n\n_+1:_ Marcado por _2 turnos_.\n\n_+2:_ Marcado por _3 turnos_.\n\n_+3:_ Marcado por _4 turnos_, e matar um inimigo marcado passa o brilho para o inimigo mais próximo a até _3 quadrados_.
actors.hero.skills.weaponbond.name=Vínculo com a Arma
actors.hero.skills.weaponbond.desc=Um abate corpo a corpo alimenta sua lâmina: ela brilha até sua próxima habilidade de arma, que golpeia mais forte.\n\n_+1:_ A habilidade causa _20%_ a mais; o brilho some após _10 turnos_.\n\n_+2:_ A habilidade causa _35%_ a mais; o brilho some após _10 turnos_.\n\n_+3:_ A habilidade causa _50%_ a mais, o brilho dura até ser gasto, e _acumula duas vezes_.
actors.hero.skills.blademastery.name=Domínio da Lâmina
actors.hero.skills.blademastery.desc=Todo inimigo que você golpeia é lido: uma pequena marca de lâmina aparece nele, e os golpes dele contra você acertam menos.\n\n_+1:_ Os golpes dele erram você _10%_ mais vezes.\n\n_+2:_ _20%_ mais vezes.\n\n_+3:_ _30%_ mais vezes, e ler um inimigo também lê os inimigos ao lado dele.
actors.hero.skills.trueedge.name=Fio Verdadeiro
actors.hero.skills.trueedge.desc=Um acerto crítico corpo a corpo causa _50%_ mais dano, e o corte segue até os inimigos atrás com metade disso.\n\n_+1:_ _5%_ de chance de crítico. O corte alcança _1 quadrado_ atrás.\n\n_+2:_ _10%_ de chance, alcançando _2 quadrados_.\n\n_+3:_ _15%_ de chance, alcançando _3 quadrados_, e tudo o que ele corta _sangra_.
actors.hero.skills.finessegrip.name=Empunhadura Fina
actors.hero.skills.finessegrip.desc=Desarmado ou com uma arma de tier 1-3, seus acertos corpo a corpo podem emendar um segundo corte rápido com _40%_ do acerto.\n\n_+1:_ _15%_ de chance.\n\n_+2:_ _25%_ de chance.\n\n_+3:_ _35%_ de chance, e um segundo corte que acerta pode emendar um _terceiro_ com a mesma chance.
actors.hero.skills.brutalgrip.name=Empunhadura Brutal
actors.hero.skills.brutalgrip.desc=Com uma arma de tier 4-5, seus acertos corpo a corpo podem esmagar com _50%_ mais dano e _aleijar_ o alvo.\n\n_+1:_ _15%_ de chance.\n\n_+2:_ _25%_ de chance.\n\n_+3:_ _35%_ de chance, e inimigos esmagados são arremessados _2 quadrados_ para trás.
actors.hero.skills.duelistactive.name=Técnicas
actors.hero.skills.duelistactive.desc=Avance com estocadas, gire no meio da multidão e faça sua lâmina sair girando da mão e voltar.
actors.hero.skills.lunge.name=Estocada
actors.hero.skills.lunge.cast=Estocada!
actors.hero.skills.lunge.desc=Salte contra um inimigo e golpeie com _125%_ do dano da arma, efeitos da arma incluídos. Depois de uma estocada você precisa de um momento para se recuperar antes da próxima.\n\n_+1:_ Dê estocadas em inimigos a até _3 quadrados_.\n\n_+2:_ Alcance de _4 quadrados_, e encadeie _2 estocadas_ em inimigos diferentes em até 2 turnos antes de se recuperar.\n\n_+3:_ Alcance de _5 quadrados_ e encadeie _3 estocadas_ antes de se recuperar. Cada investida deixa um _corte de lâmina_ que se fecha um turno depois e faz os inimigos sangrarem.
actors.hero.skills.ripostestance.name=Riposta
actors.hero.skills.ripostestance.cast=Riposta!
actors.hero.skills.ripostestance.desc=Assuma uma postura de duelo. Enquanto ela estiver ativa, todo golpe corpo a corpo que erra você é respondido na hora pela sua lâmina, gastando mana.\n\n_+1:_ Ripostas causam _50%_ de uma rolagem da arma.\n\n_+2:_ Ripostas causam _70%_ de uma rolagem da arma.\n\n_+3:_ Ripostas causam _90%_ de uma rolagem da arma, e o inimigo respondido fica _vulnerável_ por 2 turnos.
actors.hero.skills.whirlingflurry.name=Rajada Giratória
actors.hero.skills.whirlingflurry.cast=Rajada!
actors.hero.skills.whirlingflurry.desc=Gire no lugar, cortando todos os inimigos ao seu redor.\n\n_+1:_ Cause _70%_ do dano da arma em cada inimigo adjacente.\n\n_+2:_ Cause _90%_ do dano da arma, e os cortes fazem os inimigos _sangrarem_.\n\n_+3:_ Cause _110%_ do dano da arma, e _sabres espectrais_ giram em volta de você por 3 turnos, cortando inimigos adjacentes.
actors.hero.skills.impalingthrust.name=Estocada Empaladora
actors.hero.skills.impalingthrust.cast=Empalar!
actors.hero.skills.impalingthrust.desc=Dê uma estocada em linha reta, espetando todos os inimigos ao alcance com _80%_ do dano da arma e fazendo-os sangrar.\n\n_+1:_ A estocada alcança _3 quadrados_.\n\n_+2:_ A estocada alcança _4 quadrados_.\n\n_+3:_ A estocada alcança _5 quadrados_, e _lanças espectrais_ brotam ao longo do caminho dela nos 2 turnos seguintes.
actors.hero.skills.impalingthrust.no_target=Nada ao seu alcance.
actors.hero.skills.duelistfourth.name=Jogo de Pés
actors.hero.skills.duelistfourth.desc=O jogo de pés mantém a Duelista em movimento: circule o inimigo, entre e saia rápido e derrube quem tentar recuar.
actors.hero.skills.sidestep.name=Passo Lateral
actors.hero.skills.sidestep.desc=Passe de um quadrado ao lado de um inimigo para outro quadrado ao lado dele e ele golpeia o vazio, ficando _atordoado_.\n\n_+1:_ Atordoado por _1 turno_.\n\n_+2:_ Atordoado por _2 turnos_.\n\n_+3:_ Atordoado por _3 turnos_, e seu próximo acerto em um inimigo que você contornou _não erra_ e causa _30%_ a mais.
actors.hero.skills.fleche.name=Flèche
actors.hero.skills.fleche.cast=En garde!
actors.hero.skills.fleche.desc=Avance contra um inimigo, golpeie com _130%_ do dano da arma e salte de volta ao quadrado de onde saiu. Você não pode correr enquanto estiver enraizado.\n\n_+1:_ Alcance um inimigo a até _4 quadrados_.\n\n_+2:_ Alcance um inimigo a até _5 quadrados_.\n\n_+3:_ Alcance de _6 quadrados_, e uma Flèche que mata o alvo _não custa mana_.
actors.hero.skills.fleche.no_target=Nenhum alvo ao alcance.
actors.hero.skills.fleche.no_room=Sem espaço para se aproximar.
actors.hero.skills.countertime.name=Contratempo
actors.hero.skills.countertime.desc=Acerte o tempo do seu corte contra um inimigo que recua para fora do seu alcance: ele leva meia rolagem da arma ao sair.\n\n_+1:_ _20%_ de chance de cortar um inimigo que recua.\n\n_+2:_ _35%_ de chance.\n\n_+3:_ _50%_ de chance, e o inimigo cortado fica _aleijado_ por 2 turnos.
actors.hero.skills.pirouette.name=Pirueta
actors.hero.skills.pirouette.cast=Fora de alcance!
actors.hero.skills.pirouette.desc=Gire para longe dos inimigos ao seu lado até um quadrado que você escolher, parando atrás de um escudo. Você não pode girar enquanto estiver enraizado.\n\n_+1:_ Gire até _2 quadrados_, parando atrás de um escudo de _3%_ da sua vida máxima.\n\n_+2:_ Até _3 quadrados_, escudo de _6%_.\n\n_+3:_ Até _4 quadrados_, escudo de _9%_, e os inimigos que você deixou ficam com _vertigem_ por 2 turnos.
actors.hero.skills.bladebind.name=Trava de Lâminas
actors.hero.skills.bladebind.cast=Travado!
actors.hero.skills.bladebind.desc=Trave lâminas com um inimigo adjacente: as lâminas se cruzam com um tinido e os golpes dele ficam _enfraquecidos_.\n\n_+1:_ Enfraquecido por _4 turnos_.\n\n_+2:_ Enfraquecido por _6 turnos_.\n\n_+3:_ Enfraquecido por _8 turnos_, e você o tira do equilíbrio com um tranco: o próximo ataque dele _erra_ e o deixa _vulnerável_ por 3 turnos.
actors.hero.skills.bladebind.no_target=Você precisa de um inimigo bem ao seu lado para travar.
actors.hero.skills.clericpassivea.name=Clérigo
actors.hero.skills.clericpassivea.desc=A fé do Clérigo é um poço de mana, e ela responde quando a morte chega perto.
actors.hero.skills.faith.name=Fé
actors.hero.skills.faith.desc=Uma vez por andar, quando um golpe deixa você com menos da metade da vida, um clarão dourado responde à sua prece com mana.\n\n_+1:_ Recupera _8 de mana_.\n\n_+2:_ Recupera _12 de mana_.\n\n_+3:_ Recupera _16 de mana_, e a luz desvia _6 de dano_ desse golpe.
actors.hero.skills.grace.name=Graça
actors.hero.skills.grace.desc=Cada inimigo que você mata solta uma partícula de luz que voa de volta para você como mana.\n\n_+1:_ Cada abate recupera _1 de mana_.\n\n_+2:_ Cada abate recupera _2 de mana_.\n\n_+3:_ Cada abate recupera _3 de mana_. Se sua mana já estiver cheia, a luz cura _3%_ da sua vida máxima em vez disso.
actors.hero.skills.sanctuary.name=Santuário
actors.hero.skills.sanctuary.desc=Enquanto a proteção estiver ativa, ficar no mesmo lugar por _3 turnos_ gasta _3 de mana_ para consagrar um círculo ao seu redor por _3 turnos_: ele cura você e seus aliados e acumula nos inimigos uma luz que explode quando o círculo some.\n\n_+1:_ O círculo alcança _1 quadrado_ ao seu redor.\n\n_+2:_ O círculo alcança _2 quadrados_.\n\n_+3:_ O círculo alcança _2 quadrados_. Desative a proteção para _explodir todos os círculos de uma vez_, arremessando para fora os inimigos dentro deles.
actors.hero.skills.lastrites.name=Extrema-Unção
actors.hero.skills.lastrites.cast=Ainda não!
actors.hero.skills.lastrites.desc=Quando um golpe mataria você e você tem pelo menos _%1$d de mana_, essa mana é gasta e você sobrevive numa coluna de luz.\n\n_+1:_ Você fica com _3 PV_ e abençoado por _10 turnos_.\n\n_+2:_ Você fica com _5 PV_ e abençoado por _15 turnos_.\n\n_+3:_ Você fica com _7 PV_ e abençoado por _20 turnos_. A luz cega todos os inimigos adjacentes por _3 turnos_.
actors.hero.skills.lastrites.trigger=Sua extrema-unção mantém a morte à distância!
actors.hero.skills.asceticvow.name=Voto Ascético
actors.hero.skills.asceticvow.desc=A vida que você recupera rezando com Prece de Cura, Cura em Massa ou Litania volta para você como mana.\n\n_+1:_ Ganhe _1 de mana_ para cada _6 pontos de vida_ recuperados.\n\n_+2:_ Ganhe _1 de mana_ para cada _5 pontos de vida_ recuperados.\n\n_+3:_ Ganhe _1 de mana_ para cada _4 pontos de vida_ recuperados, e cada prece atendida abençoa você por _5 turnos_.
actors.hero.skills.bloodtithe.name=Dízimo de Sangue
actors.hero.skills.bloodtithe.desc=Quando uma habilidade custa mais mana do que você tem, você paga o resto em sangue, sem nunca cair abaixo de 1 de vida.\n\n_+1:_ Pague _3 de vida_ por ponto de mana que faltar.\n\n_+2:_ Pague _2 de vida_ por ponto de mana que faltar.\n\n_+3:_ Pague _2 de vida_ por ponto, e um abate em até _3 turnos_ devolve _metade_ do sangue que você pagou.
actors.hero.skills.clericpassiveb.name=Zelo
actors.hero.skills.clericpassiveb.desc=A arma do Clérigo é um receptáculo de luz sagrada, e golpeia com fervor.
actors.hero.skills.righteousstrikes.name=Golpes Justos
actors.hero.skills.righteousstrikes.desc=A cada _terceiro_ acerto corpo a corpo, uma explosão de luz sagrada salta de inimigo em inimigo, causando _100%_ do seu dano em cada um, o dobro contra mortos-vivos e demônios.\n\n_+1:_ A luz salta para _mais 1 inimigo_.\n\n_+2:_ A luz salta para _mais 2 inimigos_.\n\n_+3:_ A luz salta para _mais 3 inimigos_ e depois _volta para você_, curando _1%_ da sua vida máxima para cada inimigo que atingiu.
actors.hero.skills.zealpassive.name=Fervor
actors.hero.skills.zealpassive.desc=Um abate corpo a corpo acende uma chama sagrada. Seu próximo acerto corpo a corpo em até _5 turnos_ explode em fogo.\n\n_+1:_ A erupção causa _80%_ do seu dano.\n\n_+2:_ Causa _140%_ do seu dano.\n\n_+3:_ Causa _200%_ do seu dano e engole em chamas todos os inimigos ao lado do alvo.
actors.hero.skills.sacredweapon.name=Arma Sagrada
actors.hero.skills.sacredweapon.desc=Um acerto corpo a corpo tem _20%_ de chance de fazer cair do alto uma cópia espectral da sua arma. Ela se crava no chão ao lado do alvo e, por _3 turnos_, corta um inimigo ao lado dela com _35%_ do dano da arma.\n\n_+1:_ Até _1 espada_ fica de pé por vez.\n\n_+2:_ Até _2 espadas_ ficam de pé por vez.\n\n_+3:_ Até _3 espadas_, e uma espada que está sumindo _voa contra o inimigo mais próximo_ a até 4 quadrados com _50%_ do dano da arma.
actors.hero.skills.divinewrath.name=Ira Divina
actors.hero.skills.divinewrath.desc=Enquanto Ira Divina estiver ativa, cada acerto corpo a corpo gasta mana para consagrar o chão. Inimigos sobre chão sagrado queimam com _80%_ do seu dano a cada turno, o dobro para mortos-vivos e demônios, até o chão se apagar após _3 turnos_. Não pode ficar ativa junto com Golpe Sagrado.\n\n_+1:_ O quadrado do alvo é consagrado.\n\n_+2:_ O quadrado do alvo e _todos os quadrados em volta_ são consagrados.\n\n_+3:_ O quadrado do alvo e todos em volta, e inimigos sobre chão sagrado ficam _presos no lugar_.
actors.hero.skills.crusaderszeal.name=Zelo do Cruzado
actors.hero.skills.crusaderszeal.desc=O zelo cresce enquanto você golpeia sem resposta. Cada acerto corpo a corpo seu soma uma chama sobre você, cada chama deixa seus golpes _10%_ mais pesados, e levar um golpe apaga todas.\n\n_+1:_ Até _2 chamas_.\n\n_+2:_ Até _3 chamas_.\n\n_+3:_ Até _4 chamas_, e um golpe dado com o zelo no máximo _explode em luz_, cegando os inimigos ao seu lado por _2 turnos_.
actors.hero.skills.shieldofthefaithful.name=Escudo dos Fiéis
actors.hero.skills.shieldofthefaithful.desc=Um escudo de luz fica entre você e o inimigo mais próximo que você vê, e apara _30%_ de cada golpe desse inimigo. Depois de aparar golpes suficientes, ele se apaga e volta a se formar após _15 turnos_.\n\n_+1:_ O escudo apara _2 golpes_.\n\n_+2:_ O escudo apara _3 golpes_.\n\n_+3:_ O escudo apara _4 golpes_, e os golpes a distância que ele apara são _devolvidos_ a quem atirou.
actors.hero.skills.clericactive.name=Milagres
actors.hero.skills.clericactive.desc=Clérigos fazem descer milagres: luz punitiva, preces de cura e um espírito guardião.
actors.hero.skills.holysmite.name=Golpe Sagrado
actors.hero.skills.holysmite.cast=Castigo!
actors.hero.skills.holysmite.desc=Enquanto Golpe Sagrado estiver ativo, cada golpe corpo a corpo gasta mana para fazer um martelo de luz cair sobre o alvo, puxando inimigos próximos _1 quadrado_ na direção dele. Não pode ficar ativo junto com Ira Divina.\n\n_+1:_ Puxa inimigos a até _2 quadrados_ do alvo.\n\n_+2:_ Puxa inimigos a até _3 quadrados_.\n\n_+3:_ Puxa inimigos a até _3 quadrados_, e todo inimigo pego pelo martelo sofre _metade_ do dano do golpe.
actors.hero.skills.healingprayer.name=Prece de Cura
actors.hero.skills.healingprayer.cast=Cure
actors.hero.skills.healingprayer.desc=Reze sob asas de serafim e suas feridas se fecham na hora.\n\n_+1:_ Recupere _10%_ da sua vida máxima.\n\n_+2:_ Recupere _15%_ da sua vida máxima.\n\n_+3:_ Recupere _20%_ da sua vida máxima. A cura além da vida cheia vira uma _barreira de luz_ de até _20%_ da sua vida máxima.
actors.hero.skills.guardianspirit.name=Espírito Guardião
actors.hero.skills.guardianspirit.cast=Olhe por mim
actors.hero.skills.guardianspirit.desc=Invoque um olho guardião flutuante em um quadrado que você vê a até 6 quadrados. Ele tem a própria vida, dispara nos inimigos lasers que ficam mais fortes com o seu dano, dura _um dia no jogo_ e depois some.\n\n_+1:_ Vida máxima igual a _100%_ da sua; os lasers dele causam _60%_ do seu dano.\n\n_+2:_ Vida máxima igual a _150%_ da sua; os lasers causam _80%_ do seu dano.\n\n_+3:_ Vida máxima igual a _200%_ da sua; os lasers causam _100%_ do seu dano. Você _vê pelo olho dele_, e usar a habilidade de novo, de graça, dá ordens a ele: escolha _qualquer quadrado que você já viu_ no andar e ele se teleporta para lá e guarda o lugar, ou escolha um inimigo a até 6 quadrados dele para disparar um laser com _240%_ do seu dano. Os golpes que ele recebe carregam o halo dele e se somam a esse laser.
actors.hero.skills.avataroflight.name=Avatar da Luz
actors.hero.skills.avataroflight.cast=Seja minha luz!
actors.hero.skills.avataroflight.desc=Torne-se um avatar da luz: você fica abençoado e um halo ardente envolve você. Na primeira vez que cada inimigo entra no halo, um raio o queima com _120%_ do seu dano, o dobro contra mortos-vivos e demônios, e o cega por _3 turnos_.\n\n_+1:_ Dura _7 turnos_, e o halo alcança _1 quadrado_.\n\n_+2:_ Dura _10 turnos_, e o halo alcança _2 quadrados_.\n\n_+3:_ Dura _13 turnos_, e aliados dentro do halo ficam _abençoados_ e recuperam _1%_ da vida máxima deles por turno.
actors.hero.skills.clericfourth.name=Inquisição
actors.hero.skills.clericfourth.desc=Inquisidores julgam os profanos, marcam, queimam e acabam com a coragem deles.
actors.hero.skills.condemn.name=Condenar
actors.hero.skills.condemn.desc=Seus golpes podem marcar um inimigo com luz, deixando-o vulnerável.\n\n_+1:_ Um acerto tem _12%_ de chance de marcar por _4 turnos_.\n\n_+2:_ _24%_ de chance de marcar por _5 turnos_.\n\n_+3:_ _36%_ de chance de marcar por _6 turnos_. Mortos-vivos e demônios são _sempre_ marcados, e a marca os queima com _120%_ do seu dano.
actors.hero.skills.scouringflame.name=Chama Purificadora
actors.hero.skills.scouringflame.cast=Fogo purificador!
actors.hero.skills.scouringflame.desc=Varra com um cone de fogo branco o ponto onde você mirar. Ele queima com o dobro de força contra mortos-vivos e demônios.\n\n_+1:_ O cone alcança _3 quadrados_ e causa _140%_ do seu dano.\n\n_+2:_ O cone alcança _4 quadrados_ e causa _200%_ do seu dano.\n\n_+3:_ O cone alcança _5 quadrados_ e causa _260%_ do seu dano, e deixa os sobreviventes cegos por _3 turnos_.
actors.hero.skills.scouringflame.no_target=Escolha um quadrado para mirar a chama.
actors.hero.skills.reckoning.name=Acerto de Contas
actors.hero.skills.reckoning.cast=Julgamento!
actors.hero.skills.reckoning.desc=O julgamento cai sobre todos os inimigos à vista a até _%1$d quadrados_. Um inimigo sem marca é marcado como vulnerável. Um inimigo já marcado tem a marca _cobrada_: um pilar de luz o queima com _60%%_ do seu dano para cada turno que resta na marca, o dobro contra mortos-vivos e demônios.\n\n_+1:_ Novas marcas duram _4 turnos_.\n\n_+2:_ Novas marcas duram _6 turnos_.\n\n_+3:_ Novas marcas duram _8 turnos_, e um pilar de luz também atinge cada inimigo julgado com _120%%_ do seu dano, o dobro contra mortos-vivos e demônios.
actors.hero.skills.subbranch.berserker.name=Berserker
actors.hero.skills.subbranch.berserker.desc=O berserker troca tudo pela fúria.
actors.hero.skills.subbranch.gladiator.name=Gladiador
actors.hero.skills.subbranch.gladiator.desc=O gladiador é o dono da arena.
actors.hero.skills.subbranch.battlemage.name=Mago de Batalha
actors.hero.skills.subbranch.battlemage.desc=O mago de batalha une aço e magia.
actors.hero.skills.subbranch.warlock.name=Bruxo
actors.hero.skills.subbranch.warlock.desc=O bruxo faz pactos com poderes mais sombrios.
actors.hero.skills.subbranch.assassin.name=Assassino
actors.hero.skills.subbranch.assassin.desc=O assassino acaba com as lutas antes que elas comecem.
actors.hero.skills.subbranch.freerunner.name=Corredor
actors.hero.skills.subbranch.freerunner.desc=O corredor nunca para de se mover.
actors.hero.skills.subbranch.sniper.name=Atiradora
actors.hero.skills.subbranch.sniper.desc=A atiradora faz cada tiro valer.
actors.hero.skills.subbranch.warden.name=Guardiã
actors.hero.skills.subbranch.warden.desc=A guardiã vive em sintonia com a natureza.
actors.hero.skills.subbranch.champion.name=Campeã
actors.hero.skills.subbranch.champion.desc=A campeã lidera na linha de frente.
actors.hero.skills.subbranch.monk.name=Monja
actors.hero.skills.subbranch.monk.desc=A monja não precisa de arma nenhuma.
actors.hero.skills.subbranch.priest.name=Sacerdote
actors.hero.skills.subbranch.priest.desc=O sacerdote mantém todo mundo de pé.
actors.hero.skills.subbranch.paladin.name=Paladino
actors.hero.skills.subbranch.paladin.desc=O paladino é um baluarte da luz.
actors.hero.skills.carnage.name=Carnificina
actors.hero.skills.carnage.desc=A matança alimenta sua ira: cada abate corpo a corpo enche sua fúria.\n\n_+1:_ Um abate soma _10%_ de fúria.\n\n_+2:_ Um abate soma _20%_ de fúria.\n\n_+3:_ Um abate soma _30%_ de fúria, e um abate em modo berserker reforça seu escudo de berserker em _5%_ da sua vida máxima.
actors.hero.skills.bloodrush.name=Investida Sangrenta
actors.hero.skills.bloodrush.cast=SANGUE!
actors.hero.skills.bloodrush.desc=Avance em linha reta, deixando um rastro de sangue. Todo inimigo no seu caminho é jogado para o lado com _50%_ do dano da arma; se um deles não se mexer, a investida para.\n\n_+1:_ Avance até _3 quadrados_.\n\n_+2:_ Avance até _4 quadrados_.\n\n_+3:_ Avance até _5 quadrados_, e a investida livra você de _raízes_, _aleijamento_ e _lentidão_, então você pode avançar mesmo preso.
actors.hero.skills.undyingwill.name=Vontade Imortal
actors.hero.skills.undyingwill.cast=Eu não vou cair
actors.hero.skills.undyingwill.desc=Erga uma proteção carmesim que alimenta sua fúria: cada ponto que ela absorve vira fúria. Quando os golpes a quebram você ruge, e todos os inimigos próximos se voltam contra você.\n\n_+1:_ Uma proteção de _10%_ da sua vida máxima.\n\n_+2:_ Uma proteção de _15%_.\n\n_+3:_ Uma proteção de _20%_, e enquanto ela aguentar, um golpe fatal deixa você com _1 PV_.
actors.hero.skills.comboopener.name=Golpe de Abertura
actors.hero.skills.comboopener.desc=O Gladiador abre toda luta com uma onda de choque: um acerto corpo a corpo em um inimigo com a vida cheia o deixa _Atordoado_ e o joga para trás.\n\n_+1:_ Atordoado por _2 turnos_, jogado _1 quadrado_.\n\n_+2:_ Atordoado por _3 turnos_, jogado _2 quadrados_.\n\n_+3:_ Atordoado por _4 turnos_, e a onda de choque também joga _todos os outros inimigos_ ao seu lado _1 quadrado_ para trás.
actors.hero.skills.warcry.name=Grito de Guerra
actors.hero.skills.warcry.cast=RAAAAH!
actors.hero.skills.warcry.desc=Solte um urro, e todos os inimigos à vista fogem de você aterrorizados.\n\n_+1:_ Os inimigos fogem por _3 turnos_.\n\n_+2:_ Os inimigos fogem por _4 turnos_.\n\n_+3:_ Os inimigos fogem por _5 turnos_ e ficam _enfraquecidos_ pelo mesmo tempo.
actors.hero.skills.finishingblow.name=Golpe Final
actors.hero.skills.finishingblow.cast=Acabe com ele!
actors.hero.skills.finishingblow.desc=Um acerto corpo a corpo que deixaria um inimigo com menos vida do que uma fração do próprio acerto o mata na hora. Chefes e minichefes são imunes.\n\n_+1:_ Executa quando o inimigo ficaria com _20%_ do acerto ou menos.\n\n_+2:_ Com _35%_ do acerto ou menos.\n\n_+3:_ Com _50%_ do acerto ou menos, e a execução espirra sangue que _cega_ os inimigos ao lado por _2 turnos_.
actors.hero.skills.spellblade.name=Lâmina Arcana
actors.hero.skills.spellblade.desc=Seus golpes corpo a corpo podem sugar mana do inimigo, que passa para você em faíscas.\n\n_+1:_ Acertos corpo a corpo têm _15%_ de chance de recuperar _2 de mana_.\n\n_+2:_ Acertos corpo a corpo têm _30%_ de chance de recuperar _3 de mana_.\n\n_+3:_ Acertos corpo a corpo têm _45%_ de chance de recuperar _4 de mana_. Se sua mana já estiver cheia, o acerto causa _4 de dano extra_ em vez disso.
actors.hero.skills.manashield.name=Escudo de Mana
actors.hero.skills.manashield.cast=Proteção arcana
actors.hero.skills.manashield.desc=Envolva-se numa proteção de cristal que absorve dano e some aos poucos. Quando um golpe a quebra, os estilhaços entram na sua arma, e cada um dos seus próximos acertos corpo a corpo gasta um para causar _60-160%_ do seu dano como dano mágico extra.\n\n_+1:_ A proteção bloqueia dano igual a _8%_ da sua vida máxima e carrega _2 acertos_.\n\n_+2:_ _12%_, _3 acertos_.\n\n_+3:_ _16%_, _4 acertos_, e na primeira vez que quebra ela _se refaz_ com metade da força.
actors.hero.skills.arcaneecho.name=Eco Arcano
actors.hero.skills.arcaneecho.desc=Seus golpes corpo a corpo podem ecoar, atingindo de novo com um estalo de relâmpago.\n\n_+1:_ Acertos corpo a corpo têm _10%_ de chance de ecoar com _40-120%_ do seu dano.\n\n_+2:_ Acertos corpo a corpo têm _20%_ de chance de ecoar com _40-160%_ do seu dano.\n\n_+3:_ Acertos corpo a corpo têm _30%_ de chance de ecoar com _40-200%_ do seu dano, e o eco salta para _mais um_ inimigo adjacente.
actors.hero.skills.souldrain.name=Dreno de Almas
actors.hero.skills.souldrain.desc=Almas que você marcou não descansam. Quando um inimigo com alma marcada morre, a alma dele voa até o inimigo mais próximo ao alcance e marca esse também, então seus disparos continuam alimentando você.\n\n_+1:_ A alma voa até _3 quadrados_.\n\n_+2:_ Até _4 quadrados_.\n\n_+3:_ Até _5 quadrados_, e ela _passa por você_ antes, curando _3%_ da sua vida máxima.
actors.hero.skills.hex.name=Enfeitiçar
actors.hero.skills.hex.cast=Sofra
actors.hero.skills.hex.desc=Amaldiçoe um inimigo que você vê para que ele cause menos dano e receba mais.\n\n_+1:_ A maldição dura _5 turnos_.\n\n_+2:_ A maldição dura _7 turnos_.\n\n_+3:_ A maldição dura _9 turnos_ e também aleija o inimigo por _5 turnos_.
actors.hero.skills.darkpact.name=Pacto Sombrio
actors.hero.skills.darkpact.cast=Meu sangue, meu poder
actors.hero.skills.darkpact.desc=Troque um décimo da sua vida máxima por um surto de mana. O pacto recusa um preço que mataria você.\n\n_+1:_ Recupere _15 de mana_.\n\n_+2:_ Recupere _20 de mana_.\n\n_+3:_ Recupere _25 de mana_, e o sangue derramado açoita todos os inimigos adjacentes com metade da vida paga.
actors.hero.skills.ambush.name=Emboscada
actors.hero.skills.ambush.desc=Seu primeiro ataque surpresa em cada inimigo, corpo a corpo ou de arremesso, crava uma estaca de sombra na sombra dele e o _prende_ no lugar.\n\n_+1:_ Preso por _2 turnos_.\n\n_+2:_ Preso por _3 turnos_.\n\n_+3:_ Preso por _4 turnos_, e todo inimigo ao lado do alvo também leva uma _estaca_.
actors.hero.skills.garrote.name=Garrote
actors.hero.skills.garrote.desc=Um arame por trás: um acerto corpo a corpo em um inimigo ocupado lutando com outro (suas sombras, um sósia, um aliado, um inimigo encolerizado) passa em volta do pescoço dele e sempre o faz sangrar.\n\n_+1:_ Sangramento _3_.\n\n_+2:_ Sangramento _4_.\n\n_+3:_ Sangramento _5_, e o estrangulamento o _aleija_ por _2 turnos_.
actors.hero.skills.vanish.name=Sumir
actors.hero.skills.vanish.cast=...
actors.hero.skills.vanish.desc=Entre nas sombras sem gastar um turno. Inimigos caçando você perdem seu rastro, então seu próximo golpe em cada um deles é um ataque surpresa.\n\n_+1:_ Inimigos a até _3 quadrados_ perdem você.\n\n_+2:_ Inimigos a até _5 quadrados_ perdem você.\n\n_+3:_ _Todos os inimigos à vista_ perdem você, e você fica _invisível_ por _3 turnos_.
actors.hero.skills.slipstream.name=Vácuo
actors.hero.skills.slipstream.cast=Me pega!
actors.hero.skills.slipstream.desc=Saia correndo por _6 turnos_, deixando redemoinhos de vento nos quadrados atrás de você por _10 turnos_. Um inimigo que pisa num redemoinho _tropeça_ e perde um turno.\n\n_+1:_ O vento cobre seus últimos _4 quadrados_.\n\n_+2:_ O vento cobre seus últimos _6 quadrados_.\n\n_+3:_ O vento cobre seus últimos _8 quadrados_, e usar a habilidade de novo, de graça, faz você _voltar com o vento_ até a outra ponta, fazendo tropeçar todos os inimigos no caminho.
actors.hero.skills.parkour.name=Parkour
actors.hero.skills.parkour.desc=Um alvo em movimento é difícil de acertar. Se você se moveu no último turno, um golpe corpo a corpo pode errar você por completo quando você _rola um quadrado para longe_ do atacante.\n\n_+1:_ Role para longe de _15%_ desses golpes.\n\n_+2:_ Role para longe de _25%_ desses golpes.\n\n_+3:_ Role para longe de _35%_ desses golpes, e _salte por cima_ do atacante para cair atrás dele quando houver espaço.
actors.hero.skills.momentummaster.name=Mestre do Impulso
actors.hero.skills.momentummaster.desc=Quando um abate corpo a corpo não deixa nenhum inimigo ao seu lado, você salta em arco até o lado do inimigo mais próximo que você vê.\n\n_+1:_ Salte até _2 quadrados_.\n\n_+2:_ Salte até _3 quadrados_.\n\n_+3:_ Salte até _4 quadrados_, e seu próximo acerto corpo a corpo nesse inimigo é um _golpe em queda_ com _+50%_ de dano.
actors.hero.skills.overwatch.name=Vigília
actors.hero.skills.overwatch.desc=Segure a linha: seus acertos a distância podem empurrar o alvo para trás. Um alvo que não pode ser movido sofre todo o impacto onde está.\n\n_+1:_ _20%_ de chance de empurrá-lo _2 quadrados_.\n\n_+2:_ _30%_ de chance de empurrá-lo _2 quadrados_.\n\n_+3:_ _40%_ de chance de empurrá-lo _3 quadrados_, e um alvo jogado contra algo, ou preso onde está, fica aturdido.
actors.hero.skills.headshot.name=Tiro na Cabeça
actors.hero.skills.headshot.cast=Tiro na cabeça!
actors.hero.skills.headshot.desc=De vez em quando um acerto a distância racha o crânio do alvo com _150%_ de dano e o derruba por um turno.\n\n_+1:_ _10%_ de chance de tiro na cabeça.\n\n_+2:_ _15%_ de chance de tiro na cabeça.\n\n_+3:_ _20%_ de chance, e o estalo ecoa: inimigos ao lado do alvo _cambaleiam_ por _3 turnos_.
actors.hero.skills.piercingfocus.name=Foco Penetrante
actors.hero.skills.piercingfocus.cast=Foco...
actors.hero.skills.piercingfocus.desc=Passe a mira por todos os inimigos à vista: cada um pego por ela fica suprimido, acertando e se esquivando só metade do normal.\n\n_+1:_ Suprimido por _5 turnos_.\n\n_+2:_ Suprimido por _7 turnos_.\n\n_+3:_ Suprimido por _9 turnos_, e você sente todos os inimigos do andar por _10 turnos_.
actors.hero.skills.thorns.name=Espinhos
actors.hero.skills.thorns.desc=Suas flechas e armas de arremesso deixam um espinho no que atingem. Na próxima vez que esse inimigo se mover, o espinho brota em vinhas farpadas que o açoitam.\n\n_+1:_ As vinhas açoitam com _40%_ do seu dano.\n\n_+2:_ As vinhas açoitam com _80%_ do seu dano.\n\n_+3:_ As vinhas açoitam com _120%_ do seu dano e o _enraízam_ por _1 turno_.
actors.hero.skills.symbiosis.name=Simbiose
actors.hero.skills.symbiosis.desc=Quando o golpe de um inimigo acerta, há _25%_ de chance de folhas brotarem de você e recuperarem parte da vida que você perdeu nos turnos seguintes.\n\n_+1:_ Recupera _30%_ dela.\n\n_+2:_ Recupera _45%_ dela.\n\n_+3:_ Recupera _60%_, e enquanto as folhas curam você, inimigos que acertam você ficam _lentos_ por _3 turnos_, presos em vinhas.
actors.hero.skills.wildcall.name=Chamado Selvagem
actors.hero.skills.wildcall.cast=Comigo!
actors.hero.skills.wildcall.desc=Marque um inimigo que você vê, e um lobo espiritual salta do mato para caçar só essa presa. Ele não pode ser atingido, morde todo turno e some quando a presa morre ou após _10 turnos_.\n\n_+1:_ O lobo morde com _80-180%_ do seu dano.\n\n_+2:_ O lobo morde com _120-220%_ do seu dano.\n\n_+3:_ O lobo morde com _160-260%_ do seu dano, e quando a presa morre ele _segue o rastro_ do inimigo mais próximo à vista.
actors.hero.skills.banner.name=Estandarte
actors.hero.skills.banner.desc=Todo abate corpo a corpo finca seu estandarte onde o inimigo caiu. A cada turno, você e seus aliados a até _2 quadrados_ dele erguem uma barreira.\n\n_+1:_ O estandarte fica de pé por _6 turnos_. Barreiras crescem até _5%_ da vida máxima.\n\n_+2:_ Fica de pé por _8 turnos_. Barreiras crescem até _10%_.\n\n_+3:_ Fica de pé por _10 turnos_. Barreiras crescem até _15%_, e inimigos perto dele ficam _Atordoados_.
actors.hero.skills.secondwind.name=Segundo Fôlego
actors.hero.skills.secondwind.cast=Segundo fôlego!
actors.hero.skills.secondwind.desc=Recupere o fôlego: suas habilidades de arma recuperam cargas na hora, com um clarão verde.\n\n_+1:_ Recupere _1 carga_.\n\n_+2:_ Recupere _2 cargas_.\n\n_+3:_ Recupere _3 cargas_, e você pode _passar do limite_ de cargas em uma.
actors.hero.skills.challenge.name=Desafiar
actors.hero.skills.challenge.cast=Me enfrente!
actors.hero.skills.challenge.desc=Lance um desafio aos berros: todos os inimigos à vista vêm encarar você, e cada um que responde reforça sua guarda.\n\n_+1:_ Um escudo de _2%_ da sua vida máxima para cada inimigo que responde.\n\n_+2:_ Um escudo de _3%_ para cada.\n\n_+3:_ Um escudo de _4%_ para cada, e cada abate nos próximos _5 turnos_ devolve _2 de mana_.
actors.hero.skills.pressurepoint.name=Ponto de Pressão
actors.hero.skills.pressurepoint.desc=Golpeie os nervos que travam um corpo no lugar.\n\n_+1:_ Acertos corpo a corpo têm _10%_ de chance de paralisar por um turno um inimigo que não seja chefe.\n\n_+2:_ A chance sobe para _15%_.\n\n_+3:_ A chance sobe para _20%_, e acertos em um inimigo paralisado causam _50% a mais_ de dano.
actors.hero.skills.innerpeace.name=Paz Interior
actors.hero.skills.innerpeace.desc=Uma mente calma deixa o mal escorrer. Quando aleijamento, fraqueza, cegueira, vertigem ou terror forem pegar você, você pode soltá-lo num sopro branco. Veneno, sangramento e outros danos contínuos não saem com o sopro.\n\n_+1:_ _15%_ de chance.\n\n_+2:_ _25%_ de chance.\n\n_+3:_ _35%_ de chance, e cada um que você solta recupera _2 de mana_.
actors.hero.skills.dragonkick.name=Chute do Dragão
actors.hero.skills.dragonkick.cast=HWAAA!
actors.hero.skills.dragonkick.desc=Voe contra um inimigo em linha reta e acerte um chute que o lança longe. O corpo chutado atravessa derrubando todos os inimigos no caminho, e cada um sofre o dano do chute e é jogado um quadrado para o lado. Se ele bater numa parede, sofre o chute de novo e fica _atordoado_ por 2 turnos. Ignora sua arma.\n\n_+1:_ Voe até _2 quadrados_; ele é lançado _2 quadrados_; _100-240%_ do seu dano.\n\n_+2:_ Voe até _3 quadrados_; lançado _3 quadrados_; _140-320%_ do seu dano.\n\n_+3:_ Voe até _4 quadrados_; lançado _4 quadrados_; _180-400%_ do seu dano, e onde ele cair os inimigos em volta ficam _atordoados_ por 2 turnos.
actors.hero.skills.litany.name=Litania
actors.hero.skills.litany.desc=Cada habilidade que você usa (as de ativar e desativar não contam) recita um verso: uma nota sobe, e você e seus aliados a até 2 quadrados são curados.\n\n_+1:_ Cura _2%_ da vida máxima.\n\n_+2:_ Cura _4%_ da vida máxima.\n\n_+3:_ Cura _6%_ da vida máxima, e todo _terceiro verso_ também abençoa por _3 turnos_ todos que ele cura.
actors.hero.skills.massheal.name=Cura em Massa
actors.hero.skills.massheal.cast=Sejam curados!
actors.hero.skills.massheal.desc=Asas de serafim pousam sobre você e curam você e todos os aliados a até _2 quadrados_, a cada turno que ficam.\n\n_+1:_ As asas ficam _3 turnos_, curando _4%_ da vida máxima por turno.\n\n_+2:_ Ficam _4 turnos_, e atingem inimigos a até 2 quadrados com _260%_ do seu dano ao sumirem.\n\n_+3:_ Ficam _5 turnos_, e a cura além da vida cheia endurece em _estilhaços de luz_ que aparam parte dos próximos golpes e revidam no inimigo mais próximo.
actors.hero.skills.purify.name=Purificação
actors.hero.skills.purify.cast=Fora!
actors.hero.skills.purify.desc=Um clarão de luz pura queima veneno, sangramento, aleijamento, fraqueza, cegueira e vulnerabilidade.\n\n_+1:_ Purifica você.\n\n_+2:_ Também queima _enfeitiçamento, degradação e muco_, e purifica todos os aliados à vista.\n\n_+3:_ Também tira fogo, terror e lentidão de você, e abençoa você por _2 turnos_.
actors.hero.skills.aegis.name=Égide
actors.hero.skills.aegis.desc=Um escudo de luz apara um golpe corpo a corpo pesado (um décimo da sua vida máxima ou mais), engole _metade_ dele e empurra o atacante para longe. Leva _8 turnos_ para se refazer.\n\n_+1:_ O empurrão joga o atacante _1 quadrado_ para trás.\n\n_+2:_ O empurrão o joga _2 quadrados_ para trás.\n\n_+3:_ O empurrão o joga _3 quadrados_ para trás, e a metade que o escudo engoliu é _devolvida com tudo_ no atacante.
actors.hero.skills.holycharge.name=Investida Sagrada
actors.hero.skills.holycharge.cast=Pela luz!
actors.hero.skills.holycharge.desc=Erga o escudo e avance num rastro de luz. O primeiro inimigo no caminho é empurrado à sua frente até o fim da investida e, se bater numa parede ou criatura, fica _aturdido por 2 turnos_.\n\n_+1:_ Avance até _3 quadrados_.\n\n_+2:_ Avance até _5 quadrados_.\n\n_+3:_ Avance até _7 quadrados_, e a luz _cega_ todos os inimigos ao lado do seu caminho.
actors.hero.skills.retribution.name=Retribuição
actors.hero.skills.retribution.desc=Cada golpe que um inimigo acerta em você deixa nele uma marca dourada de dívida. Seu próximo acerto corpo a corpo nesse inimigo cobra a dívida em luz sagrada, em dobro contra mortos-vivos e demônios.\n\n_+1:_ A dívida é _30%_ do dano que ele causou a você.\n\n_+2:_ A dívida é _45%_.\n\n_+3:_ A dívida é _60%_, e uma dívida de _10_ ou mais explode também em _mais um inimigo_ a até 2 quadrados, com metade do valor.
actors.hero.skills.leap.name=Salto
actors.hero.skills.leap.cast=Hyah!
actors.hero.skills.leap.desc=Salte sobre um inimigo à vista, caia ao lado dele e desça a arma, aturdindo-o por _1 turno_. Você não pode saltar enquanto estiver enraizado.\n\n_+1:_ Salte até _3 quadrados_ e golpeie com _110%_ do dano.\n\n_+2:_ Salte até _4 quadrados_ e golpeie com _120%_ do dano.\n\n_+3:_ Salte até _5 quadrados_ e golpeie com _130%_ do dano. A queda joga todos os outros inimigos ao seu lado _1 quadrado_ para longe.
actors.hero.skills.leap.prompt=Escolha um inimigo para saltar até ele
actors.hero.skills.leap.no_target=Você precisa de um inimigo à vista para saltar.
actors.hero.skills.leap.too_far=Isso está além do seu salto.
actors.hero.skills.leap.no_path=Há uma parede no caminho.
actors.hero.skills.leap.no_room=Não há onde pousar ao lado dele.
actors.hero.skills.chargedshot.name=Tiro Carregado
actors.hero.skills.chargedshot.cast=Disparar!
actors.hero.skills.chargedshot.desc=Fique no lugar puxando a corda do arco por vários turnos, sem poder agir, e então solte uma flecha que não erra. Ela atravessa paredes e todos os inimigos na linha dela, deixando um rastro de luz.\n\n_+1:_ Puxe por _10 turnos_. A flecha voa _10 quadrados_ e causa _150%_ do dano do arco.\n\n_+2:_ Puxe por _7 turnos_. A flecha voa _12 quadrados_ e causa _175%_ do dano do arco.\n\n_+3:_ Puxe por _5 turnos_. A flecha voa _14 quadrados_, causa _200%_ do dano do arco e deixa tudo o que atravessa _vulnerável_ por 3 turnos.
actors.hero.skills.chargedshot.prompt=Escolha a direção do tiro
actors.hero.skills.chargedshot.no_target=Escolha um quadrado para onde atirar.
actors.hero.skills.tengusarsenal.name=Arsenal do Tengu
actors.hero.skills.tengusarsenal.cast=Toma!
actors.hero.skills.tengusarsenal.desc=Truques do Tengu, aprendidos de tanto observá-lo. Escolha uma bomba e arremesse. A bomba de fumaça e o eletrocutador nunca ferem você nem seus aliados, mas as chamas da bomba de fogo queimam qualquer um que fique nelas.\n\n_+1:_ A _bomba de fumaça_ conta três turnos e então explode, atingindo tudo a até _2 quadrados_.\n\n_+2:_ Adiciona a _bomba de fogo_: ela fica onde cai e, por _5 turnos_, continua incendiando os quadrados em volta.\n\n_+3:_ As chamas da bomba de fogo chegam a _2 quadrados_ de distância, e ela termina com a explosão da bomba de fumaça. Adiciona o _eletrocutador_: ele fica onde cai e, por _6 turnos_, solta arcos elétricos nas oito direções, até _2 quadrados_, aturdindo o que atinge, e termina com a mesma explosão.
