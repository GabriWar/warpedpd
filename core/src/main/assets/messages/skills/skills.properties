###warrior

actors.hero.skills.warriorpassivea.name=Warrior
actors.hero.skills.warriorpassivea.desc=A Warrior's body refuses to fall: it takes the blow, closes the wound and keeps standing.

actors.hero.skills.endurance.name=Endurance
actors.hero.skills.endurance.desc=Hold your ground and the blows harden you. Each blow you take while you did not move last turn adds a stack, and at enough stacks you dig in and stomp: the floor cracks, enemies around you are rooted for _3 turns_ and a barrier rises. Moving resets the stacks.\n\n_+1:_ Stomp after _5 blows_: roots enemies within _1 tile_, barrier of _4%_ of your max health.\n\n_+2:_ After _4 blows_: within _2 tiles_, barrier of _7%_.\n\n_+3:_ After _3 blows_: within _3 tiles_, barrier of _10%_, and the cracked ground leaves them _crippled_ for _6 turns_.

actors.hero.skills.regeneration.name=Regeneration
actors.hero.skills.regeneration.desc=Killing the last enemy in sight lets you catch your breath and heal part of your missing health.\n\n_+1:_ Heal _15%_ of missing health.\n\n_+2:_ Heal _25%_ of missing health.\n\n_+3:_ Heal _35%_, and catching your breath also clears _bleeding, poison and cripple_.

actors.hero.skills.toughness.name=Toughness
actors.hero.skills.toughness.desc=When a blow takes _10%_ of your max health or more, you grit your teeth and push the pain back: instead of landing at once, that blow bleeds into you over the next turns. Only one blow can be held back at a time.\n\n_+1:_ The blow lands over _2 turns_.\n\n_+2:_ Over _3 turns_.\n\n_+3:_ Over _4 turns_, and killing the enemy that dealt it _cancels_ what is left.

actors.hero.skills.laststand.name=Last Stand
actors.hero.skills.laststand.desc=When a blow drops you to a quarter of your health, you plant your feet and raise a barrier. It can happen again after _40 turns_.\n\n_+1:_ A barrier of _5%_ of your max health.\n\n_+2:_ A barrier of _10%_.\n\n_+3:_ A barrier of _15%_, and you stomp the ground, _stunning_ every enemy next to you for _2 turns_.

actors.hero.skills.stoneskin.name=Stone Skin
actors.hero.skills.stoneskin.desc=Stone plates cover your skin. Each stops up to _10%_ of your max health from one blow and shatters, spraying shards into an adjacent attacker for _40%_ of your damage; broken plates regrow one every _10 turns_.\n\n_+1:_ _1 plate_.\n\n_+2:_ _2 plates_.\n\n_+3:_ _3 plates_, and a blow a plate stops completely leaves the attacker _stunned_ for _2 turns_.

actors.hero.skills.bloodthirst.name=Bloodthirst
actors.hero.skills.bloodthirst.desc=Your melee hits drink the blood they spill, healing you.\n\n_+1:_ Heal for _4%_ of the melee damage you deal.\n\n_+2:_ Heal for _7%_ of the melee damage you deal.\n\n_+3:_ Heal for _10%_ of the melee damage you deal, and each melee kill bursts in blood that heals you for _5%_ of your max health.

actors.hero.skills.warriorpassiveb.name=Melee
actors.hero.skills.warriorpassiveb.desc=A Warrior wins with brute strength and the weapon in his hands.

actors.hero.skills.firmhand.name=Firm Hand
actors.hero.skills.firmhand.desc=Your first melee blow on an unhurt enemy _staggers_ it: the next time one of your shoves moves it (Knock Back, Smash, Earthshatter, Leap and the like), it flies further and bursts against whatever stops it.\n\n_+1:_ Staggered for _3 turns_, flies _1 tile_ further.\n\n_+2:_ Staggered for _5 turns_, flies _2 tiles_ further, and the burst staggers what it slams into.\n\n_+3:_ Staggered for _7 turns_, and killing a staggered enemy staggers _every enemy beside it_.

actors.hero.skills.aggression.name=Aggression
actors.hero.skills.aggression.desc=When a melee swing kills its target, the blow cleaves on into another enemy beside you.\n\n_+1:_ The cleave deals _40%_ of the blow.\n\n_+2:_ The cleave deals _60%_ of the blow.\n\n_+3:_ The cleave deals _80%_, and a cleave that kills _cleaves again_.

actors.hero.skills.mastery.name=Mastery
actors.hero.skills.mastery.desc=Your weapon keeps enemies at bay: when an enemy steps up next to you, you may strike it before it swings.\n\n_+1:_ _30%_ chance to strike first.\n\n_+2:_ _45%_ chance.\n\n_+3:_ _60%_ chance, and the struck enemy is thrown back _1 tile_.

actors.hero.skills.warbreaker.name=Warbreaker
actors.hero.skills.warbreaker.cast=Guard broken!
actors.hero.skills.warbreaker.desc=Melee hits can shatter an enemy's guard: that blow deals _30%_ more and leaves the foe vulnerable.\n\n_+1:_ _6%_ chance, vulnerable for _4 turns_.\n\n_+2:_ _12%_ chance, vulnerable for _5 turns_.\n\n_+3:_ _18%_ chance, vulnerable for _6 turns_, and every enemy next to the target is left vulnerable too.

actors.hero.skills.warrioractive.name=Skills
actors.hero.skills.warrioractive.desc=Warriors use brute strength to deliver great punishment.

actors.hero.skills.smash.name=Smash
actors.hero.skills.smash.cast=Smash!
actors.hero.skills.smash.desc=A crushing blow on an enemy in reach that sends it flying back.\n\n_+1:_ Strike for _150%_ damage and knock the enemy _1 tile_ back.\n\n_+2:_ Strike for _175%_ damage and knock the enemy _2 tiles_ back.\n\n_+3:_ Strike for _200%_ damage and knock the enemy _3 tiles_ back. If it slams into a wall or another enemy, it takes _half the blow_ again.

actors.hero.skills.knockback.name=KnockBack
actors.hero.skills.knockback.cast=KnockBack!
actors.hero.skills.knockback.desc=While held, your melee hits shove the target a tile back. Mana is only spent when the shove happens.\n\n_+1:_ Shoving hits deal _10%_ more damage.\n\n_+2:_ Shoving hits deal _20%_ more damage.\n\n_+3:_ Shoving hits deal _30%_ more damage, and an enemy with no room behind it is _crushed_ for _25%_ more instead.

actors.hero.skills.rampage.name=Rampage
actors.hero.skills.rampage.cast=Rampage!
actors.hero.skills.rampage.desc=While held, every melee swing hits every enemy around you, the main target included, and costs mana.\n\n_+1:_ Every enemy hit takes _60%_ damage.\n\n_+2:_ Every enemy hit takes _80%_ damage.\n\n_+3:_ Every enemy hit takes _full_ damage and is left _bleeding_.

actors.hero.skills.earthshatter.name=Earthshatter
actors.hero.skills.earthshatter.cast=Break!
actors.hero.skills.earthshatter.desc=Slam the ground. Every enemy within _2 tiles_ is hurt and rooted, then rings of stone spears roll outward, each ring hitting harder and pushing enemies ahead of the wave, so an enemy caught in front of it is struck by every ring.\n\n_+1:_ The slam deals _200%_ of your damage and roots for _3 turns_. _2 rings_ follow, starting at _100%_ of your damage and growing by _20%_ each ring.\n\n_+2:_ The slam deals _280%_ of your damage and roots for _4 turns_. _3 rings_ follow, starting at _140%_ and growing by _40%_.\n\n_+3:_ The slam deals _360%_ of your damage and roots for _5 turns_. _4 rings_ follow, starting at _180%_ and growing by _60%_, _crippling_ what they hit.

actors.hero.skills.ironstance.name=Iron Stance
actors.hero.skills.ironstance.cast=Hold!
actors.hero.skills.ironstance.desc=Raise your guard. While held you deal _15%_ less damage, and a melee blow you parry misses you completely and costs mana. With no mana left, the guard drops. Cannot be taken with Reckless Fury.\n\n_+1:_ _15%_ chance to parry a melee blow.\n\n_+2:_ _30%_ chance to parry a melee blow.\n\n_+3:_ _45%_ chance to parry, and the attacker reels back _dizzy_ for _3 turns_.

actors.hero.skills.recklessfury.name=Reckless Fury
actors.hero.skills.recklessfury.cast=No guard!
actors.hero.skills.recklessfury.desc=Drop your guard: while held you take _10%_ more damage, and every blow that lands on you builds fury. Your next melee hit spends all of it as extra damage and costs mana. Cannot be taken with Iron Stance.\n\n_+1:_ Fury gathers _50%_ of the damage you take.\n\n_+2:_ Fury gathers _75%_ of the damage you take.\n\n_+3:_ Fury gathers _100%_ of it, and if the furious hit kills, the fury it did not need _carries_ into your next hit.

actors.hero.skills.warriorfourth.name=Warlord's Command
actors.hero.skills.warriorfourth.desc=Warlords break the enemy's legs and nerve, then call a shieldbearer to hold the line.

actors.hero.skills.hamstring.name=Hamstring
actors.hero.skills.hamstring.cast=Stay down
actors.hero.skills.hamstring.desc=Your melee hits can cut an enemy's legs, crippling it.\n\n_+1:_ _8%_ chance to cripple for _4 turns_.\n\n_+2:_ _16%_ chance to cripple for _5 turns_.\n\n_+3:_ _24%_ chance to cripple for _6 turns_. Hitting an enemy that is already crippled breaks its legs, rooting it for _2 turns_.

actors.hero.skills.demoralize.name=Demoralize
actors.hero.skills.demoralize.cast=Break their nerve
actors.hero.skills.demoralize.desc=Your melee hits can break an enemy's nerve, weakening it.\n\n_+1:_ _10%_ chance to weaken for _6 turns_.\n\n_+2:_ _20%_ chance to weaken for _8 turns_.\n\n_+3:_ _30%_ chance to weaken for _10 turns_. The fear spreads: every enemy within _2 tiles_ is weakened too.

actors.hero.skills.shieldbearer.name=Shieldbearer
actors.hero.skills.shieldbearer.cast=To me!
actors.hero.skills.shieldbearer.desc=Call a sworn shieldbearer to your side. Every enemy in sight turns on him. He has his own health, a percentage of your max health, and his hits deal a percentage of your damage. He holds his post for one in-game day, then fades.\n\n_+1:_ Max health equal to _40%_ of yours; hits for _40%_ of your damage.\n\n_+2:_ Max health equal to _55%_ of yours; hits for _50%_ of your damage.\n\n_+3:_ Max health equal to _70%_ of yours; hits for _60%_ of your damage, and lands with a shield bash that knocks adjacent enemies _1 tile_ back.
actors.hero.skills.shieldbearer.no_summons=You cannot control more summons.

###mage

actors.hero.skills.magepassivea.name=Mage
actors.hero.skills.magepassivea.desc=The Mage's inner well: a deeper pool of mana, and wards that spend it to keep him standing.

actors.hero.skills.spirituality.name=Spirituality
actors.hero.skills.spirituality.desc=Blows that hit you jolt mana loose, never more than the blow's strength.\n\n_+1:_ Each hit restores up to _2 mana_.\n\n_+2:_ Each hit restores up to _3 mana_.\n\n_+3:_ Up to _4 mana_. With your mana full, the jolt lashes the attacker for that much instead.

actors.hero.skills.meditation.name=Meditation
actors.hero.skills.meditation.desc=Stand still with no enemy in sight and every _5 turns_ a calm pulse restores mana.\n\n_+1:_ Each pulse restores _2 mana_.\n\n_+2:_ Each pulse restores _3 mana_.\n\n_+3:_ Each pulse restores _4 mana_ and mends your summons in sight for _10%_ of their max health.

actors.hero.skills.spiritarmor.name=Spirit Armor
actors.hero.skills.spiritarmor.desc=While active, a blue ward pays part of every blow with your mana (at least 1 mana per blow). Every _3 mana_ it pays forms a mote that circles you, and when the ring is full every mote zaps the nearest enemies.\n\n_+1:_ The ward pays _10%_ of each blow; the ring holds _2 motes_.\n\n_+2:_ _20%_ of each blow; _3 motes_.\n\n_+3:_ _30%_ of each blow; _4 motes_, and each volley gives you _2 turns_ of Recharging.

actors.hero.skills.transcendence.name=Transcendence
actors.hero.skills.transcendence.desc=While active you are half light: walking into an enemy carries you straight through it to the free tile beyond, for _3 mana_, and the light you leave inside bursts as a lance.\n\n_+1:_ Pass through _1 enemy_; the lance deals _60-120%_ of your damage.\n\n_+2:_ Pass through a line of up to _2 enemies_; _80-160%_ each.\n\n_+3:_ Up to _3 enemies_, _100-200%_ each, and the lance _splits into three_ as it leaves your back, cutting the enemies ahead of you for half.

actors.hero.skills.serenefocus.name=Serene Focus
actors.hero.skills.serenefocus.desc=While your mana is at least _three quarters_ full, your zaps slow the enemy they hit. Cannot be taken alongside Will of Iron.\n\n_+1:_ Slows for _2 turns_.\n\n_+2:_ Slows for _3 turns_.\n\n_+3:_ Slows for _4 turns_, and enemies next to the target are slowed too.

actors.hero.skills.willofiron.name=Will of Iron
actors.hero.skills.willofiron.desc=An emptying pool hardens your will. While your mana is below half, a blow of at least _5%_ of your max health from an enemy is braced for free, once per turn, and the braced force is stored in your staff: your next damaging zap or bolt spell carries it out. Cannot be taken alongside Serene Focus.\n\n_+1:_ Brace against _5%_ of your max health; the stored force adds _40%_ of your damage.\n\n_+2:_ Brace against _10%_ of your max health; it adds _80%_ of your damage.\n\n_+3:_ Brace against _15%_ of your max health; it adds _120%_ of your damage, and you can store _2 braces_ at once.

actors.hero.skills.magepassiveb.name=Magic
actors.hero.skills.magepassiveb.desc=Wands, raw sorcery, and the servants a Mage binds to his will.

actors.hero.skills.wizard.name=Wizard
actors.hero.skills.wizard.desc=When you zap a wand, the spent charge can ricochet off your target and cast the same spell at the nearest other enemy. With nobody to leap to, it snaps back into the wand.\n\n_+1:_ _15%_ chance.\n\n_+2:_ _25%_ chance.\n\n_+3:_ _35%_ chance, and a wand's _last charge_ always ricochets if another enemy is near.

actors.hero.skills.sorcerer.name=Sorcerer
actors.hero.skills.sorcerer.desc=Your damaging zaps can overload the enemy they hit: it crackles for a turn, then discharges into itself and every enemy beside it for half the wand's damage.\n\n_+1:_ _20%_ chance to overload.\n\n_+2:_ _35%_ chance to overload.\n\n_+3:_ _50%_ chance, and an overloaded enemy that dies before it discharges _bursts at once_, two tiles wide.

actors.hero.skills.summoner.name=Summoner
actors.hero.skills.summoner.desc=You can keep more summoned servants on the field at once.\n\n_+1:_ Your summon limit rises by _1_.\n\n_+2:_ Your summon limit rises by _2_.\n\n_+3:_ Your summon limit rises by _3_, and every servant you call is summoned _one level higher_.

actors.hero.skills.soultether.name=Soul Tether
actors.hero.skills.soultether.desc=Every summoned servant you keep alive, up to _3_, feeds power into your wands. With nothing on the field, nothing is gained.\n\n_+1:_ Each servant adds _3%_ wand damage and _2%_ faster recharge.\n\n_+2:_ Each servant adds _6%_ wand damage and _4%_ faster recharge.\n\n_+3:_ Each servant adds _9%_ wand damage and _6%_ faster recharge: _+27%_ damage and _22%_ faster recharge with three.

actors.hero.skills.mageactive.name=Summoning
actors.hero.skills.mageactive.desc=Mages call rats and skeletons to fight at their side, holding 3 summons at once plus %1$d from Summoner.

actors.hero.skills.summonrat.name=Summon Rat
actors.hero.skills.summonrat.cast=Rise Rodent!
actors.hero.skills.summonrat.desc=A rat claws its way up beside you and fights for you. It has its own health, a percentage of your max health, and its bites deal a percentage of your damage. Like every summon it lasts one in-game day, then fades.\n\n_+1:_ Max health equal to _8%_ of yours; bites for _25%_ of your damage.\n\n_+2:_ Max health equal to _10%_ of yours; bites for _30%_ of your damage.\n\n_+3:_ Max health equal to _12%_ of yours; bites for _35%_ of your damage.

actors.hero.skills.spark.name=Spark
actors.hero.skills.spark.cast=Spark!
actors.hero.skills.spark.desc=Fire a bolt of magic at the first thing in its path. It grows stronger with your damage.\n\n_+1:_ The bolt deals _20-60%_ of your damage.\n\n_+2:_ The bolt deals _40-120%_ of your damage.\n\n_+3:_ The bolt deals _60-180%_ of your damage, and it _passes through_ your allies and hits every enemy on its line up to the first wall.

actors.hero.skills.summonskeleton.name=Summon Skeleton
actors.hero.skills.summonskeleton.cast=The dead shall obey!
actors.hero.skills.summonskeleton.desc=A skeleton rises beside you, a sturdy servant that shrugs off part of every blow. It has its own health, a percentage of your max health, and its hits deal a percentage of your damage. Like every summon it lasts one in-game day, then fades.\n\n_+1:_ Max health equal to _50%_ of yours; hits for _50%_ of your damage and blocks up to _5%_ of its own max health.\n\n_+2:_ Max health equal to _60%_ of yours; hits for _60%_ of your damage, blocks up to _10%_.\n\n_+3:_ Max health equal to _70%_ of yours; hits for _70%_ of your damage, blocks up to _15%_.

actors.hero.skills.summoncrab.name=Summon Crab
actors.hero.skills.summoncrab.cast=Pinch them!
actors.hero.skills.summoncrab.desc=A crab scuttles up beside you and fights for you. It has its own health, a percentage of your max health, and its pinches deal a percentage of your damage. Its shell blocks part of each blow. Like every summon it lasts one in-game day, then fades.\n\n_+1:_ Max health equal to _20%_ of yours; pinches for _35%_ of your damage.\n\n_+2:_ Max health equal to _30%_ of yours; pinches for _40%_ of your damage.\n\n_+3:_ Max health equal to _40%_ of yours; pinches for _45%_ of your damage.

actors.hero.skills.souldetonation.name=Soul Detonation
actors.hero.skills.souldetonation.cast=Serve me one last time!
actors.hero.skills.souldetonation.desc=Sacrifice a visible summon, or up to three at once, and it explodes in soul fire. Rats poison the enemies around them; skeletons blast a wider area.\n\n_+1:_ Each explosion deals _7 damage_ to nearby enemies.\n\n_+2:_ Each explosion deals _10 damage_.\n\n_+3:_ Each explosion deals _13 damage_ and leaves a soul mote for _6 turns_. Step on it to recover mana.
actors.hero.skills.souldetonation.no_summons=You have nothing to detonate.

actors.hero.skills.magefourth.name=Elementalism
actors.hero.skills.magefourth.desc=Elementalists hurl raw fire, frost and storm at the dungeon itself.

actors.hero.skills.cindertrail.name=Elemental Orbit
actors.hero.skills.cindertrail.cast=Gather!
actors.hero.skills.cindertrail.desc=Summon _5_ orbs of fire or ice that circle you, then cast again to launch them one by one up to _7 tiles_ away. Each orb bursts over a 3x3 area, burning or chilling enemies and leaving flames or a blizzard that can hurt you too. Orbs grow larger and stronger the longer they orbit.\n\n_+1:_ Orbs burst for _60-140%_ of your damage, doubling when fully grown.\n\n_+2:_ Orbs burst for _100-200%_ of your damage, doubling when fully grown.\n\n_+3:_ Orbs burst for _120-260%_ of your damage, doubling when fully grown. Launching a fully grown orb makes every other orb grow a stage.

actors.hero.skills.frostnova.name=Frost Nova
actors.hero.skills.frostnova.cast=Be still.
actors.hero.skills.frostnova.desc=A ring of ice bursts out from you, hurting and chilling every enemy within _3 cells_.\n\n_+1:_ Deals _60-140%_ of your damage and chills for _5 turns_.\n\n_+2:_ Deals _80-200%_ of your damage and chills for _7 turns_.\n\n_+3:_ Deals _100-260%_ of your damage and chills for _9 turns_. Ice spikes cover the ground for _4 turns_, hurting and chilling enemies that walk on them.
actors.hero.skills.frostnova.no_targets=There is nothing close enough to freeze.

actors.hero.skills.stormcall.name=Storm Call
actors.hero.skills.stormcall.cast=The sky answers!
actors.hero.skills.stormcall.desc=Call lightning down from the sky onto a target. The bolt then jumps between nearby enemies for _60%_ damage.\n\n_+1:_ Deals _120-240%_ of your damage and jumps to _1_ more enemy.\n\n_+2:_ Deals _160-320%_ of your damage and jumps to _2_ more enemies.\n\n_+3:_ Deals _200-400%_ of your damage and jumps to _3_ more enemies. Everything struck is stunned for _1 turn_.
actors.hero.skills.stormcall.no_target=Choose an enemy you can see for the lightning to strike.

actors.hero.skills.pyreaffinity.name=Pyromancy
actors.hero.skills.pyreaffinity.desc=Your wand zaps and bolt spells can set the enemies they hurt on fire. Cannot be taken alongside Cryomancy.\n\n_+1:_ _12%%_ chance to ignite.\n\n_+2:_ _24%%_ chance to ignite.\n\n_+3:_ _36%%_ chance to ignite, and the flames leap to one adjacent enemy.

actors.hero.skills.rimeaffinity.name=Cryomancy
actors.hero.skills.rimeaffinity.desc=Your wand zaps and bolt spells can freeze the enemies they hurt solid for _2 turns_. Cannot be taken alongside Pyromancy.\n\n_+1:_ _10%%_ chance to freeze.\n\n_+2:_ _20%%_ chance to freeze.\n\n_+3:_ _30%%_ chance to freeze, and a zap on an enemy that is already frozen _shatters_ the ice for half the zap again.

###rogue

actors.hero.skills.roguepassivea.name=Rogue
actors.hero.skills.roguepassivea.desc=Rogues live by quick hands and quiet feet: coin, locks and shadows.

actors.hero.skills.bandit.name=Bandit
actors.hero.skills.bandit.desc=Your surprise attacks pick the enemy's pocket, once per enemy, and whatever you steal flies straight to you.\n\n_+1:_ Steal a purse of _gold_.\n\n_+2:_ Snatch the _item_ the enemy was carrying instead, which lands at your feet. It won't drop again.\n\n_+3:_ _Thrown weapons and arrows_ pick pockets too, from across the room.

actors.hero.skills.stealth.name=Stealth
actors.hero.skills.stealth.desc=Your steps are quiet. When an enemy notices you anyway, it sees only a smoky double where you stand and hunts that first, once per enemy.\n\n_+1:_ _+1 stealth_; the double lasts _2 turns_.\n\n_+2:_ _+2 stealth_; the double lasts _3 turns_.\n\n_+3:_ _+3 stealth_; the double lasts _4 turns_, and when it vanishes it _blinds_ the enemies next to it.

actors.hero.skills.locksmith.name=Lock Smith
actors.hero.skills.locksmith.cast=Woah!!
actors.hero.skills.locksmith.desc=You feel a trap's plate give and jam it before it springs.\n\n_+1:_ _33%_ chance to jam a trap you step on.\n\n_+2:_ _66%_ chance to jam a trap you step on.\n\n_+3:_ _99%_ chance to jam a trap, and reading the jammed mechanism _reveals every hidden trap_ within _3 tiles_.

actors.hero.skills.masterthief.name=Master Thief
actors.hero.skills.masterthief.desc=You palm part of every take. Each pile of gold you pick up and each pocket you pick sets _2_ coins spinning around you. When an enemy hits you, you flick a coin into its eyes and _blind_ it for _2 turns_.\n\n_+1:_ Hold up to _2 coins_.\n\n_+2:_ Hold up to _4 coins_.\n\n_+3:_ Hold up to _6 coins_, and each coin _bounces_ on to blind a second enemy nearby.

actors.hero.skills.roguepassiveb.name=Assassin
actors.hero.skills.roguepassiveb.desc=Rogues rely on venom and sneak attacks to deal quick but painful deaths.

actors.hero.skills.venom.name=Venom
actors.hero.skills.venom.cast=Poison is my specialty
actors.hero.skills.venom.desc=Your blade is coated in venom that can poison what it cuts.\n\n_+1:_ Melee hits have a _10%_ chance to poison for _3 turns_.\n\n_+2:_ _20%_ chance to poison for _4 turns_.\n\n_+3:_ _30%_ chance to poison for _5 turns_, and a surprise melee hit _always_ poisons.

actors.hero.skills.scorpion.name=Scorpion
actors.hero.skills.scorpion.desc=Your venom runs longer, and hitting a poisoned enemy can sting it lame.\n\n_+1:_ Venom lasts _2_ more turns. Hits on poisoned enemies have a _10%_ chance to cripple.\n\n_+2:_ Venom lasts _4_ more turns, _20%_ sting chance.\n\n_+3:_ Venom lasts _6_ more turns, _30%_ sting chance, and stinging an enemy that is already crippled _paralyzes_ it for 1 turn.

actors.hero.skills.silentdeath.name=Silent Death
actors.hero.skills.silentdeath.cast=Eternal Slumber
actors.hero.skills.silentdeath.desc=Your melee attack on a sleeping enemy goes for the throat. If the blow leaves it at or below a share of its max health, it dies without a sound. Bosses and minibosses are immune.\n\n_+1:_ Kills a sleeping enemy left at _15%_ of its max health or less.\n\n_+2:_ At _25%_ or less.\n\n_+3:_ At _35%_ or less, and a silent kill hushes the room: sleeping enemies within _4 tiles_ can't wake for _3 turns_ unless hurt.

actors.hero.skills.necrotoxin.name=Necrotoxin
actors.hero.skills.necrotoxin.cast=Rot
actors.hero.skills.necrotoxin.desc=Hits on a poisoned enemy can rupture the poison: _150%_ of its remaining damage lands at once.\n\n_+1:_ _20%_ chance to rupture.\n\n_+2:_ _35%_ chance to rupture.\n\n_+3:_ _50%_ chance, and the rupture poisons adjacent enemies for _5 turns_.

actors.hero.skills.rogueactive.name=Ninjitsu
actors.hero.skills.rogueactive.desc=Tricks, bombs and a rope: the Rogue never fights where the enemy expects.

actors.hero.skills.doublestab.name=Shadow Link
actors.hero.skills.doublestab.cast=Too slow
actors.hero.skills.doublestab.desc=Toggle on: each hit spends _6 mana_ to tie your target to the nearest enemy within _3 tiles_ for _8 turns_, and damage to one bleeds into the other. With no one nearby, the target takes a second cut instead. Without the mana, the link breaks.\n\n_+1:_ Linked enemies share _40%_ of damage. A lone target takes _35%_ extra.\n\n_+2:_ Linked enemies share _60%_ of damage. A lone target takes _50%_ extra.\n\n_+3:_ Linked enemies share _80%_ of damage. A lone target takes _70%_ extra.

actors.hero.skills.ninjabomb.name=Ninja Bomb
actors.hero.skills.ninjabomb.cast=Into the smoke!
actors.hero.skills.ninjabomb.desc=Throw a smoke bomb. The smoke hides you and puts nearby enemies to sleep.\n\n_+1:_ Enemies within _1 tile_ fall asleep.\n\n_+2:_ Enemies within _2 tiles_ fall asleep.\n\n_+3:_ Enemies within _3 tiles_ fall asleep, and a _smoke clone_ stays behind for _5 turns_ to draw them off.

actors.hero.skills.shadowclone.name=Grappling Hook
actors.hero.skills.shadowclone.cast=Come on!
actors.hero.skills.shadowclone.desc=Fire a rope and pull yourself to where it lands. Hook an enemy to fly to it and strike for _150%_ weapon damage, or hook a wall to swing across the room.\n\n_+1:_ Fire _1 rope_.\n\n_+2:_ Fire _2 ropes_ in a chain.\n\n_+3:_ Fire _3 ropes_ in a chain, and hook _any tile you can see_: open ground, across pits.
actors.hero.skills.shadowclone.too_many=You cannot control more summons.

actors.hero.skills.phantomstrike.name=Shadow Company
actors.hero.skills.phantomstrike.cast=Nowhere to run
actors.hero.skills.phantomstrike.desc=Call bound shadows out of the ground to fight beside you. They see around themselves and share that sight with you, even through walls. Each has its own health, a percentage of your max health, and strikes for a percentage of your damage.\n\n_+1:_ Call up to _2 shadows_, each with max health equal to _15%_ of yours, striking for _30%_ of your damage.\n\n_+2:_ Call up to _3 shadows_, each with _30%_ of your max health, striking for _40%_, sharper-eyed.\n\n_+3:_ Call up to _4 shadows_, each with _40%_ of your max health, striking for _50%_, and cast on one of them to _trade places_ with it for free.
actors.hero.skills.phantomstrike.too_far=That is too far away.
actors.hero.skills.phantomstrike.no_target=There is nobody there to strike.
actors.hero.skills.phantomstrike.no_room=There is no room left beside your mark.

actors.hero.skills.ashveil.name=Ash Veil
actors.hero.skills.ashveil.cast=You lost me
actors.hero.skills.ashveil.desc=Smoke floods out from your feet and you vanish into it, invisible and quick.\n\n_+1:_ Invisible for _5 turns_, hasted for _3_.\n\n_+2:_ Invisible for _7 turns_, hasted for _4_.\n\n_+3:_ Invisible for _9 turns_, hasted for _5_, and enemies within _3 tiles_ are _blinded_ for 5 turns.

actors.hero.skills.blooddance.name=Crimson Waltz
actors.hero.skills.blooddance.cast=Stay close
actors.hero.skills.blooddance.desc=You stop leaving. Gain adrenaline, and while it lasts every melee hit opens a bleeding wound.\n\n_+1:_ _7 turns_ of adrenaline. Hits inflict _2 bleed_.\n\n_+2:_ _10 turns_ of adrenaline. Hits inflict _3 bleed_.\n\n_+3:_ _13 turns_ of adrenaline. Hits inflict _4 bleed_, and the dance opens behind a shield of _9%_ of your max health.

actors.hero.skills.roguefourth.name=Dread
actors.hero.skills.roguefourth.desc=Dread breaks the room before it kills anything, then feeds on the panic.

actors.hero.skills.creepingdread.name=Creeping Dread
actors.hero.skills.creepingdread.cast=Boo.
actors.hero.skills.creepingdread.desc=Your melee hits can leave the target terrified of you.\n\n_+1:_ _8%_ chance to terrify for _4 turns_.\n\n_+2:_ _16%_ chance to terrify for _5 turns_.\n\n_+3:_ _24%_ chance to terrify for _6 turns_, and the fear _spreads_ to every enemy standing beside the target.

actors.hero.skills.predation.name=Predation
actors.hero.skills.predation.desc=Hits on an enemy at or under _40%_ health can rend it, making it bleed.\n\n_+1:_ _25%_ chance to rend.\n\n_+2:_ _35%_ chance to rend.\n\n_+3:_ _45%_ chance, and killing a bleeding enemy heals you _3%_ of your max health.

actors.hero.skills.blackout.name=Blackout
actors.hero.skills.blackout.cast=Lights out
actors.hero.skills.blackout.desc=Throw darkness at a spot. Enemies within _2 tiles_ go blind and terrified, and smoke hides the spot. While it lingers, enemies that can't see you are drawn towards it, and your first hit from inside the smoke also cuts another enemy nearby for half.\n\n_+1:_ Blind for _6 turns_, terrified for _3_.\n\n_+2:_ Blind for _8 turns_, terrified for _4_.\n\n_+3:_ Blind for _10 turns_, terrified for _5_, and the dark _mends your shadows_ nearby for _8%_ of their max health.

actors.hero.skills.panicharvest.name=Panic Harvest
actors.hero.skills.panicharvest.desc=Hitting a fleeing, terrified, maddened or charmed enemy harvests its fear as mana, once per turn.\n\n_+1:_ Restore _1 mana_.\n\n_+2:_ Restore _2 mana_.\n\n_+3:_ Restore _2 mana_, and a panicked enemy you kill terrifies adjacent enemies for _3 turns_.

actors.hero.skills.dreadhowl.name=Dread Howl
actors.hero.skills.dreadhowl.cast=Turn on each other
actors.hero.skills.dreadhowl.desc=A howl that tips fear into madness. Terrified enemies in sight within _5 tiles_ turn on whoever stands closest.\n\n_+1:_ Madness lasts _4 turns_.\n\n_+2:_ Madness lasts _5 turns_.\n\n_+3:_ Madness lasts _6 turns_, and enemies not yet afraid are _terrified_ for 3 turns, ready for the next howl.
actors.hero.skills.dreadhowl.no_targets=Nothing here is afraid of you yet.

###huntress

actors.hero.skills.huntresspassivea.name=Huntress
actors.hero.skills.huntresspassivea.desc=The huntress reads the wild: keen senses, quiet feet and the patience to wait for her prey.

actors.hero.skills.fletching.name=Fletching
actors.hero.skills.fletching.cast=Good shafts.
actors.hero.skills.fletching.desc=You salvage the fletching of every arrow that lands: each ranged hit adds a feather to the ring circling you. At _3 feathers_ you fletch a split arrow, and your next ranged hit splits into barbed shafts that fly at enemies near the target for _30%_ of the hit.\n\n_+1:_ The arrow splits into _2 shafts_.\n\n_+2:_ It splits into _3 shafts_.\n\n_+3:_ It splits into _4 shafts_, and a shaft that kills gives its feather back to the ring.

actors.hero.skills.awareness.name=Awareness
actors.hero.skills.awareness.cast=Too easy..
actors.hero.skills.awareness.desc=You read each enemy as it comes: the first attack each enemy makes on you, melee or ranged, can be slipped, and an arrow flies straight back at it for _half_ your bow's damage.\n\n_+1:_ _20%_ chance to slip it.\n\n_+2:_ _30%_ chance to slip it.\n\n_+3:_ _40%_ chance, and the return arrow _pins_ the attacker for _2 turns_.

actors.hero.skills.hunting.name=Hunting
actors.hero.skills.hunting.cast=Caught unawares.
actors.hero.skills.hunting.desc=Striking a sleeping or wandering enemy leaves it stunned in shock.\n\n_+1:_ Stuns for _2 turns_.\n\n_+2:_ Stuns for _3 turns_.\n\n_+3:_ Stuns for _4 turns_, and killing that prey reveals the nearest hidden enemy for _10 turns_.

actors.hero.skills.sixthsense.name=Sixth Sense
actors.hero.skills.sixthsense.desc=The forest warns you of the worst blows: a hit that would take more than a quarter of your health is caught at a quarter. The warning's return shows in your buff bar.\n\n_+1:_ The warning returns every _40 turns_.\n\n_+2:_ The warning returns every _30 turns_.\n\n_+3:_ The warning returns every _20 turns_, and the attacker is left _dazed for 3 turns_.

actors.hero.skills.lonewolf.name=Lone Wolf
actors.hero.skills.lonewolf.desc=With no ally near you and no summon on the floor (your own afterimages don't count), each kill makes you howl, and enemies within 2 tiles flee.\n\n_+1:_ They flee for _2 turns_.\n\n_+2:_ They flee for _3 turns_.\n\n_+3:_ They flee for _4 turns_, and the kill mends _5%_ of your health.

actors.hero.skills.poacher.name=Poacher
actors.hero.skills.poacher.desc=A ranged kill leaves the carcass as bait: for _5 turns_ its scent draws in enemies that can't see you.\n\n_+1:_ The scent carries _4 tiles_.\n\n_+2:_ The scent carries _5 tiles_.\n\n_+3:_ The scent carries _6 tiles_, and a _snare_ hides in the carcass: the first enemy to reach it is rooted for _3 turns_.

actors.hero.skills.huntresspassiveb.name=Ranged
actors.hero.skills.huntresspassiveb.desc=Every shaft finds its mark: the huntress turns distance into her advantage.

actors.hero.skills.accuracy.name=Accuracy
actors.hero.skills.accuracy.desc=Your ranged hits can find the eyes: a bullseye blinds the target for 3 turns.\n\n_+1:_ _10%_ chance of a bullseye.\n\n_+2:_ _20%_ chance of a bullseye.\n\n_+3:_ _30%_ chance, and your first ranged hit on each enemy is always a bullseye.

actors.hero.skills.kneeshot.name=Knee Shot
actors.hero.skills.kneeshot.cast=Easy Target
actors.hero.skills.kneeshot.desc=You aim for the legs: ranged hits can cripple.\n\n_+1:_ _10%_ chance to cripple for _4 turns_.\n\n_+2:_ _20%_ chance to cripple for _5 turns_.\n\n_+3:_ _30%_ chance to cripple for _6 turns_, and a shot into a crippled enemy makes it _bleed_.

actors.hero.skills.irontip.name=Iron Tip
actors.hero.skills.irontip.cast=Don't forget to share...
actors.hero.skills.irontip.desc=Iron tips punch through: a ranged hit can carry on into the enemies behind its target.\n\n_+1:_ _50%_ chance to pierce into _1 enemy_ right behind.\n\n_+2:_ _67%_ chance to pierce up to _2 enemies_ within 2 tiles.\n\n_+3:_ _75%_ chance to pierce up to _3 enemies_ within 3 tiles, and every ranged hit leaves its target _vulnerable for 3 turns_.

actors.hero.skills.heartseeker.name=Heartseeker
actors.hero.skills.heartseeker.cast=Through the heart.
actors.hero.skills.heartseeker.desc=A ranged hit that leaves an enemy under half health lodges an arrow in its heart. A heart pulses over it, and on the _third beat_ it bursts. Bosses and minibosses take half.\n\n_+1:_ The burst deals _8%_ of its full health.\n\n_+2:_ The burst deals _15%_ of its full health.\n\n_+3:_ The burst deals _22%_, and a burst that kills tears the arrow free into the nearest enemy under half health within _4 tiles_.

actors.hero.skills.huntressactive.name=Archery
actors.hero.skills.huntressactive.desc=The Huntress lets her bow do the talking, with arrows that never miss, split in two, explode or fall like rain.

actors.hero.skills.aimedshot.name=Aimed Shot
actors.hero.skills.aimedshot.cast=I see him
actors.hero.skills.aimedshot.desc=While on, each ranged hit spends mana to pin its target to the ground. Only one of Aimed Shot, Double Shot and Bombvoyage can be on.\n\n_+1:_ Pins for _2 turns_.\n\n_+2:_ Pins for _3 turns_.\n\n_+3:_ Pins for _4 turns_, and an aimed shot that kills refunds its mana.

actors.hero.skills.doubleshot.name=Double Shot
actors.hero.skills.doubleshot.cast=Two for one
actors.hero.skills.doubleshot.desc=While on, your ranged hits can loose a second arrow at another enemy in view, or at the same one if no other is there. Only one of Aimed Shot, Double Shot and Bombvoyage can be on at a time.\n\n_+1:_ The second arrow flies _50%_ of the time.\n\n_+2:_ The second arrow flies _75%_ of the time.\n\n_+3:_ The second arrow flies on _every_ hit, and you can _mark_ the enemy it flies at.

actors.hero.skills.bombvoyage.name=Bombvoyage
actors.hero.skills.bombvoyage.cast=Bombvoyage
actors.hero.skills.bombvoyage.desc=While on, your thrown weapons and arrows burst like bombs on hit, hurting every enemy around the target without breaking walls. Only one of Aimed Shot, Double Shot and Bombvoyage can be on at a time.\n\n_+1:_ The blast hurts every enemy within _1 tile_.\n\n_+2:_ The blast deals _35%_ more damage.\n\n_+3:_ A blast that kills sets off a _second, smaller blast_ where that enemy stood, once per shot.

actors.hero.skills.arrowstorm.name=Arrow Storm
actors.hero.skills.arrowstorm.cast=Rain of arrows!
actors.hero.skills.arrowstorm.desc=A spectral raptor rains arrows on the spot you choose for _3 turns_, hurting and crippling every enemy under it.\n\n_+1:_ Each volley covers a _3x3_ area for _25%_ of your bow damage.\n\n_+2:_ Each volley deals _35%_ and reaches _2 tiles_ out along a cross.\n\n_+3:_ Each volley deals _45%_, and the arrows stay in the ground for _4 turns_, hurting and crippling anything that steps on them.

actors.hero.skills.frostarrows.name=Frost Arrows
actors.hero.skills.frostarrows.cast=Freeze.
actors.hero.skills.frostarrows.desc=While on, your ranged hits chill their target.\n\n_+1:_ Hits chill for _3 turns_.\n\n_+2:_ Hits chill for _4 turns_ and deal _15%_ more damage to chilled targets.\n\n_+3:_ Hits chill for _5 turns_, deal _15%_ more to chilled targets, and have a _20%_ chance to freeze the target solid for _2 turns_ instead.

actors.hero.skills.emberarrows.name=Ember Arrows
actors.hero.skills.emberarrows.cast=Burn.
actors.hero.skills.emberarrows.desc=While on, your ranged hits set their target ablaze.\n\n_+1:_ The target _catches fire_.\n\n_+2:_ The flames also leap to _1 enemy_ beside the target.\n\n_+3:_ A burning enemy your shot kills _bursts_, setting every enemy next to it alight.

actors.hero.skills.huntressfourth.name=Traplines
actors.hero.skills.huntressfourth.desc=Traplines make the ground fight for you, laid a turn before anything walks into them.

actors.hero.skills.groundwork.name=Groundwork
actors.hero.skills.groundwork.desc=An enemy you have caught (rooted, crippled, stunned, frozen or asleep) is ringed by the stakes of your traplines. Hitting it jerks the line, and the stakes spring into every enemy next to it.\n\n_+1:_ The stakes deal _20%_ of your hit.\n\n_+2:_ The stakes deal _35%_ of your hit.\n\n_+3:_ The stakes deal _50%_ and cripple them for _2 turns_.

actors.hero.skills.beartrap.name=Bear Trap
actors.hero.skills.beartrap.cast=Mind your step.
actors.hero.skills.beartrap.desc=Set steel jaws on open ground; the tile stays walkable and glints so you know where they wait. The first grounded enemy to step in bleeds, limps and is chained to the spot, and every pull against the chain hurts it until the chain snaps.\n\n_+1:_ The bite bleeds for _4_ and the chain holds for _7 turns_.\n\n_+2:_ The bite bleeds for _6_ and the chain holds for _9 turns_.\n\n_+3:_ The bite bleeds for _8_, the chain holds for _11 turns_, and when it snaps a _thorn bed_ wakes where the jaws bit.
actors.hero.skills.beartrap.no_ground=There is nowhere to set the jaws there.
actors.hero.skills.beartrap.occupied=Something is already rigged there.

actors.hero.skills.deadfall.name=Deadfall
actors.hero.skills.deadfall.cast=Down it comes.
actors.hero.skills.deadfall.desc=Rig a heavy weight over a 3x3 area you can see. The rigging creaks over its center and holds for _30 turns_; the first enemy to step under it brings it down, crushing and stunning every enemy beneath. Cast again to cut the line early.\n\n_+1:_ Deals _140-280%_ of your damage and stuns for _1 turn_.\n\n_+2:_ Deals _200-400%_ of your damage and stuns for _1 turn_.\n\n_+3:_ Deals _260-520%_ of your damage and stuns for _2 turns_. Enemies already rooted or crippled take _double_ damage.
actors.hero.skills.deadfall.no_vision=You cannot see that spot.

###duelist

actors.hero.skills.duelistpassivea.name=Duelist
actors.hero.skills.duelistpassivea.desc=Duelists rely on flawless form and conditioning.

actors.hero.skills.conditioning.name=Conditioning
actors.hero.skills.conditioning.desc=When a hit drops you below a third of your health, your body rallies and heals. It never saves you from a killing blow.\n\n_+1:_ Once per floor, heal _10%_ of your max health.\n\n_+2:_ Once per floor, heal _20%_ of your max health.\n\n_+3:_ Heal _30%_, and the rally can happen _twice_ per floor.

actors.hero.skills.poise.name=Poise
actors.hero.skills.poise.desc=Every kill steadies your breath and your footing.\n\n_+1:_ Each kill heals you for _1%_ of your max health.\n\n_+2:_ Each kill heals you for _2%_ of your max health.\n\n_+3:_ Each kill heals you for _3%_ of your max health and gives you a _brief burst of speed_.

actors.hero.skills.parrystance.name=Parry Stance
actors.hero.skills.parrystance.desc=Catch blows from adjacent enemies on your blade, turning them aside completely and striking straight back for _60%_ weapon damage.\n\n_+1:_ _10%_ of their blows are parried.\n\n_+2:_ _15%_ of their blows are parried.\n\n_+3:_ _20%_ are parried, and the riposte sweeps _every enemy_ next to you.

actors.hero.skills.aplomb.name=Aplomb
actors.hero.skills.aplomb.desc=Weak blows from creatures bounce off you without leaving a mark.\n\n_+1:_ Blows dealing up to _3%_ of your max health bounce off.\n\n_+2:_ Up to _5%_, and a melee attacker whose blow bounces is _Dazed_ for _2 turns_.\n\n_+3:_ Up to _7%_, and the attacker also reels, _losing its next turn_.

actors.hero.skills.duelistpassiveb.name=Fencing
actors.hero.skills.duelistpassiveb.desc=Duelists excel with a blade in hand.

actors.hero.skills.precision.name=Precision
actors.hero.skills.precision.desc=Your first melee hit on an unhurt enemy finds a gap in its guard: a steel glint marks it, and your blows on it ignore its armour.\n\n_+1:_ Marked for _2 turns_.\n\n_+2:_ Marked for _3 turns_.\n\n_+3:_ Marked for _4 turns_, and killing a marked enemy sends the glint to the nearest enemy within _3 tiles_.

actors.hero.skills.weaponbond.name=Weapon Bond
actors.hero.skills.weaponbond.desc=A melee kill feeds your blade: it glows until your next weapon ability, which strikes harder.\n\n_+1:_ The ability deals _20%_ more; the glow fades after _10 turns_.\n\n_+2:_ The ability deals _35%_ more; the glow fades after _10 turns_.\n\n_+3:_ The ability deals _50%_ more, the glow lasts until spent, and it _stacks twice_.

actors.hero.skills.blademastery.name=Blade Mastery
actors.hero.skills.blademastery.desc=Every enemy you strike is read: a small blade mark shows it, and its blows against you land less often.\n\n_+1:_ Its blows miss you _10%_ more often.\n\n_+2:_ _20%_ more often.\n\n_+3:_ _30%_ more often, and reading an enemy also reads the enemies beside it.

actors.hero.skills.trueedge.name=True Edge
actors.hero.skills.trueedge.desc=A critical melee hit strikes for _50%_ more damage, and its slash cuts on through to the enemies behind for half as much.\n\n_+1:_ _5%_ chance to crit. The slash reaches _1 tile_ behind.\n\n_+2:_ _10%_ chance, reaching _2 tiles_.\n\n_+3:_ _15%_ chance, reaching _3 tiles_, and everything it cuts _bleeds_.

actors.hero.skills.finessegrip.name=Finesse Grip
actors.hero.skills.finessegrip.desc=Unarmed or with a tier 1-3 weapon, your melee hits can flick in a quick second cut for _40%_ of the hit.\n\n_+1:_ _15%_ chance.\n\n_+2:_ _25%_ chance.\n\n_+3:_ _35%_ chance, and a second cut that lands can flick in a _third_ at the same odds.

actors.hero.skills.brutalgrip.name=Brutal Grip
actors.hero.skills.brutalgrip.desc=With a tier 4-5 weapon, your melee hits can crush for _50%_ more damage and _Cripple_ the target.\n\n_+1:_ _15%_ chance.\n\n_+2:_ _25%_ chance.\n\n_+3:_ _35%_ chance, and crushed enemies are hurled _2 tiles_ back.

actors.hero.skills.duelistactive.name=Techniques
actors.hero.skills.duelistactive.desc=Lunge in, spin through a crowd, and send your blade spinning out of your hand and back again.

actors.hero.skills.lunge.name=Lunge
actors.hero.skills.lunge.cast=Lunge!
actors.hero.skills.lunge.desc=Leap at an enemy and strike it for _125%_ weapon damage, weapon effects included. After a lunge you need a moment to recover before lunging again.\n\n_+1:_ Lunge at an enemy up to _3 tiles_ away.\n\n_+2:_ Reach _4 tiles_, and chain _2 lunges_ at different enemies within 2 turns before recovering.\n\n_+3:_ Reach _5 tiles_ and chain _3 lunges_ before recovering. Each dash leaves a _blade cut_ that closes a turn later and makes enemies bleed.

actors.hero.skills.ripostestance.name=Riposte
actors.hero.skills.ripostestance.cast=Riposte!
actors.hero.skills.ripostestance.desc=Take a dueling stance. While it is on, every melee swing that misses you is answered at once by your blade, spending mana.\n\n_+1:_ Ripostes deal _50%_ of a weapon roll.\n\n_+2:_ Ripostes deal _70%_ of a weapon roll.\n\n_+3:_ Ripostes deal _90%_ of a weapon roll, and the answered enemy is left _vulnerable_ for 2 turns.

actors.hero.skills.whirlingflurry.name=Whirling Flurry
actors.hero.skills.whirlingflurry.cast=Flurry!
actors.hero.skills.whirlingflurry.desc=Spin in place, slashing every enemy around you.\n\n_+1:_ Deal _70%_ weapon damage to each adjacent enemy.\n\n_+2:_ Deal _90%_ weapon damage, and the cuts make enemies _bleed_.\n\n_+3:_ Deal _110%_ weapon damage, and _spectral sabers_ orbit you for 3 turns, slicing adjacent enemies.

actors.hero.skills.impalingthrust.name=Impaling Thrust
actors.hero.skills.impalingthrust.cast=Thrust!
actors.hero.skills.impalingthrust.desc=Thrust in a straight line, skewering every enemy in reach for _80%_ weapon damage and making them bleed.\n\n_+1:_ The thrust reaches _3 tiles_.\n\n_+2:_ The thrust reaches _4 tiles_.\n\n_+3:_ The thrust reaches _5 tiles_, and _spectral lances_ erupt along its path over the next 2 turns.
actors.hero.skills.impalingthrust.no_target=Nothing in your reach.

actors.hero.skills.duelistfourth.name=Footwork
actors.hero.skills.duelistfourth.desc=Footwork keeps the Duelist moving: circle the enemy, dart in and out, and cut down whatever tries to back away.

actors.hero.skills.sidestep.name=Sidestep
actors.hero.skills.sidestep.desc=Step from one tile beside an enemy to another tile beside it and it swings at empty air, left _dazed_.\n\n_+1:_ Dazed for _1 turn_.\n\n_+2:_ Dazed for _2 turns_.\n\n_+3:_ Dazed for _3 turns_, and your next hit on an enemy you circled _can't miss_ and deals _30%_ more.

actors.hero.skills.fleche.name=Fleche
actors.hero.skills.fleche.cast=En garde!
actors.hero.skills.fleche.desc=Dart at an enemy, strike it for _130%_ weapon damage and spring back to the tile you started from. You cannot run while rooted.\n\n_+1:_ Reach an enemy up to _4 tiles_ away.\n\n_+2:_ Reach an enemy up to _5 tiles_ away.\n\n_+3:_ Reach _6 tiles_, and a Fleche that kills its target costs _no mana_.
actors.hero.skills.fleche.no_target=No target within reach.
actors.hero.skills.fleche.no_room=No room to close in.

actors.hero.skills.countertime.name=Counter-Time
actors.hero.skills.countertime.desc=Time your cut against an enemy that steps back out of your reach: it takes half a weapon roll as it goes.\n\n_+1:_ _20%_ chance to cut a retreating enemy.\n\n_+2:_ _35%_ chance.\n\n_+3:_ _50%_ chance, and the cut enemy is _crippled_ for 2 turns.

actors.hero.skills.pirouette.name=Pirouette
actors.hero.skills.pirouette.cast=Out of measure!
actors.hero.skills.pirouette.desc=Spin away from the enemies beside you to a tile you choose, landing behind a shield. You cannot spin while rooted.\n\n_+1:_ Spin up to _2 tiles_, landing behind a shield of _3%_ of your max health.\n\n_+2:_ Up to _3 tiles_, a _6%_ shield.\n\n_+3:_ Up to _4 tiles_, a _9%_ shield, and the enemies you left are _dizzy_ for 2 turns.

actors.hero.skills.bladebind.name=Blade Bind
actors.hero.skills.bladebind.cast=Bound!
actors.hero.skills.bladebind.desc=Lock blades with an adjacent enemy: the blades cross with a clang and its blows are _weakened_.\n\n_+1:_ Weakened for _4 turns_.\n\n_+2:_ Weakened for _6 turns_.\n\n_+3:_ Weakened for _8 turns_, and you wrench it off balance: its next attack _misses_ and leaves it _vulnerable_ for 3 turns.
actors.hero.skills.bladebind.no_target=You need an enemy right beside you to bind.

###cleric

actors.hero.skills.clericpassivea.name=Cleric
actors.hero.skills.clericpassivea.desc=The Cleric's faith is a well of mana, and it answers when death comes near.

actors.hero.skills.faith.name=Faith
actors.hero.skills.faith.desc=Once per floor, when a blow leaves you under half health, a golden flare answers your prayer with mana.\n\n_+1:_ Restores _8 mana_.\n\n_+2:_ Restores _12 mana_.\n\n_+3:_ Restores _16 mana_, and the light turns aside _6 damage_ of that blow.

actors.hero.skills.grace.name=Grace
actors.hero.skills.grace.desc=Every enemy you slay releases a mote of light that flies back to you as mana.\n\n_+1:_ Each kill restores _1 mana_.\n\n_+2:_ Each kill restores _2 mana_.\n\n_+3:_ Each kill restores _3 mana_. If your mana is already full, the light heals you for _3%_ of your max health instead.

actors.hero.skills.sanctuary.name=Sanctuary
actors.hero.skills.sanctuary.desc=While the ward is up, holding your ground for _3 turns_ spends _3 mana_ to consecrate a circle around you for _3 turns_: it mends you and your allies, and gathers light in enemies that bursts when the circle fades.\n\n_+1:_ The circle reaches _1 tile_ around you.\n\n_+2:_ The circle reaches _2 tiles_.\n\n_+3:_ The circle reaches _2 tiles_. Switch the ward off to _burst every circle at once_, hurling the enemies inside outward.

actors.hero.skills.lastrites.name=Last Rites
actors.hero.skills.lastrites.cast=Not yet!
actors.hero.skills.lastrites.desc=When a blow would kill you and you hold at least _%1$d mana_, that mana is spent and you survive in a column of light.\n\n_+1:_ You are left with _3 HP_ and blessed for _10 turns_.\n\n_+2:_ You are left with _5 HP_ and blessed for _15 turns_.\n\n_+3:_ You are left with _7 HP_ and blessed for _20 turns_. The light blinds every adjacent enemy for _3 turns_.
actors.hero.skills.lastrites.trigger=Your last rites hold death at bay!

actors.hero.skills.asceticvow.name=Ascetic Vow
actors.hero.skills.asceticvow.desc=Health you pray back with Healing Prayer, Mass Heal or Litany returns to you as mana.\n\n_+1:_ Gain _1 mana_ for every _6 health_ restored.\n\n_+2:_ Gain _1 mana_ for every _5 health_ restored.\n\n_+3:_ Gain _1 mana_ for every _4 health_ restored, and each answered prayer blesses you for _5 turns_.

actors.hero.skills.bloodtithe.name=Blood Tithe
actors.hero.skills.bloodtithe.desc=When a skill costs more mana than you have, you pay the rest in blood, never dropping below 1 health.\n\n_+1:_ Pay _3 health_ for each missing mana.\n\n_+2:_ Pay _2 health_ for each missing mana.\n\n_+3:_ Pay _2 health_ for each, and a kill within _3 turns_ heals back _half_ the blood you paid.

actors.hero.skills.clericpassiveb.name=Zeal
actors.hero.skills.clericpassiveb.desc=The Cleric's weapon is a vessel of holy light, and it strikes with fervor.

actors.hero.skills.righteousstrikes.name=Righteous Strikes
actors.hero.skills.righteousstrikes.desc=Every _third_ melee hit releases a burst of holy light that leaps from enemy to enemy, dealing _100%_ of your damage to each, twice as much against the undead and demons.\n\n_+1:_ The light leaps to _1 more enemy_.\n\n_+2:_ The light leaps to _2 more enemies_.\n\n_+3:_ The light leaps to _3 more enemies_, then _returns to you_, healing _1%_ of your max health for every enemy it struck.

actors.hero.skills.zealpassive.name=Fervor
actors.hero.skills.zealpassive.desc=A melee kill kindles holy flame. Your next melee hit within _5 turns_ erupts in fire.\n\n_+1:_ The eruption deals _80%_ of your damage.\n\n_+2:_ Deals _140%_ of your damage.\n\n_+3:_ Deals _200%_ of your damage and engulfs every enemy next to the target.

actors.hero.skills.sacredweapon.name=Sacred Weapon
actors.hero.skills.sacredweapon.desc=A melee hit has a _20%_ chance to drop a spectral copy of your weapon from above. It plants itself in the floor beside your target and for _3 turns_ cuts an enemy next to it for _35%_ weapon damage.\n\n_+1:_ Up to _1 sword_ stands at a time.\n\n_+2:_ Up to _2 swords_ stand at a time.\n\n_+3:_ Up to _3 swords_, and a fading sword _flies at the nearest enemy_ within 4 tiles for _50%_ weapon damage.

actors.hero.skills.divinewrath.name=Divine Wrath
actors.hero.skills.divinewrath.desc=While Divine Wrath is on, every melee hit spends mana to consecrate the ground. Enemies standing on holy ground burn for _80%_ of your damage each turn, twice as much for the undead and demons, until it fades after _3 turns_. It cannot be on alongside Holy Smite.\n\n_+1:_ The target's tile is consecrated.\n\n_+2:_ The target's tile and _every tile around it_ are consecrated.\n\n_+3:_ The target's tile and every tile around it, and enemies on holy ground are _held in place_.

actors.hero.skills.crusaderszeal.name=Crusader's Zeal
actors.hero.skills.crusaderszeal.desc=Zeal builds while you strike unopposed. Each melee hit you land adds a flame over you, each flame makes your blows _10%_ heavier, and taking a blow snuffs them all.\n\n_+1:_ Up to _2 flames_.\n\n_+2:_ Up to _3 flames_.\n\n_+3:_ Up to _4 flames_, and a blow struck at full zeal _bursts in light_, blinding the enemies beside you for _2 turns_.

actors.hero.skills.shieldofthefaithful.name=Shield of the Faithful
actors.hero.skills.shieldofthefaithful.desc=A shield of light hangs between you and the nearest enemy you can see, and catches _30%_ of each of that enemy's blows. Once it has caught enough blows it dims away and reforms after _15 turns_.\n\n_+1:_ The shield catches _2 blows_.\n\n_+2:_ The shield catches _3 blows_.\n\n_+3:_ The shield catches _4 blows_, and blows it catches from a distance are _thrown back_ at the shooter.

actors.hero.skills.clericactive.name=Miracles
actors.hero.skills.clericactive.desc=Clerics call down miracles: smiting light, healing prayers and a guardian spirit.

actors.hero.skills.holysmite.name=Holy Smite
actors.hero.skills.holysmite.cast=Smite!
actors.hero.skills.holysmite.desc=While Holy Smite is on, each melee blow spends mana to bring a hammer of light down on its target, dragging nearby enemies _1 tile_ toward it. It cannot be on alongside Divine Wrath.\n\n_+1:_ Drags enemies within _2 tiles_ of the target.\n\n_+2:_ Drags enemies within _3 tiles_.\n\n_+3:_ Drags enemies within _3 tiles_, and every enemy caught by the hammer is struck for _half_ the blow's damage.

actors.hero.skills.healingprayer.name=Healing Prayer
actors.hero.skills.healingprayer.cast=Mend
actors.hero.skills.healingprayer.desc=Pray under seraph wings and your wounds close at once.\n\n_+1:_ Heal _10%_ of your max health.\n\n_+2:_ Heal _15%_ of your max health.\n\n_+3:_ Heal _20%_ of your max health. Healing past full health becomes a _barrier of light_, up to _20%_ of your max health.

actors.hero.skills.guardianspirit.name=Guardian Spirit
actors.hero.skills.guardianspirit.cast=Watch over me
actors.hero.skills.guardianspirit.desc=Summon a floating guardian eye on a tile you can see within 6 tiles. It has its own health, fires lasers at enemies that grow with your damage, lasts _one in-game day_, then fades.\n\n_+1:_ Max health equal to _100%_ of yours; its lasers deal _60%_ of your damage.\n\n_+2:_ Max health equal to _150%_ of yours; lasers deal _80%_ of your damage.\n\n_+3:_ Max health equal to _200%_ of yours; lasers deal _100%_ of your damage. You _see through its eye_, and casting again for free commands it: pick _any tile you have seen_ on the floor and it blinks there to hold it, or pick an enemy within 6 tiles of it to fire a laser for _240%_ of your damage. The blows it takes charge its halo, adding them to that laser.

actors.hero.skills.avataroflight.name=Avatar of Light
actors.hero.skills.avataroflight.cast=Be my light!
actors.hero.skills.avataroflight.desc=Become an avatar of light: you are blessed and a blazing halo surrounds you. The first time each enemy comes inside the halo, a ray sears it for _120%_ of your damage, doubled against the undead and demons, and blinds it for _3 turns_.\n\n_+1:_ Lasts _7 turns_, and the halo reaches _1 tile_.\n\n_+2:_ Lasts _10 turns_, and the halo reaches _2 tiles_.\n\n_+3:_ Lasts _13 turns_, and allies inside the halo are _blessed_ and mend _1%_ of their max health each turn.

actors.hero.skills.clericfourth.name=Inquisition
actors.hero.skills.clericfourth.desc=Inquisitors judge the unholy, brand them, burn them and break their nerve.

actors.hero.skills.condemn.name=Condemn
actors.hero.skills.condemn.desc=Your blows can brand an enemy with light, leaving it vulnerable.\n\n_+1:_ A hit has a _12%_ chance to brand for _4 turns_.\n\n_+2:_ A _24%_ chance to brand for _5 turns_.\n\n_+3:_ A _36%_ chance to brand for _6 turns_. The undead and demons are _always_ branded, and the brand burns them for _120%_ of your damage.

actors.hero.skills.scouringflame.name=Scouring Flame
actors.hero.skills.scouringflame.cast=Burn clean!
actors.hero.skills.scouringflame.desc=Sweep a cone of white fire where you aim. It burns twice as hard against the undead and demons.\n\n_+1:_ The cone reaches _3 tiles_ and deals _140%_ of your damage.\n\n_+2:_ The cone reaches _4 tiles_ and deals _200%_ of your damage.\n\n_+3:_ The cone reaches _5 tiles_ and deals _260%_ of your damage, and leaves its survivors blinded for _3 turns_.
actors.hero.skills.scouringflame.no_target=Pick a tile to aim the flame at.

actors.hero.skills.reckoning.name=Reckoning
actors.hero.skills.reckoning.cast=Judgement!
actors.hero.skills.reckoning.desc=Judgement falls on every enemy in sight within _%1$d tiles_. An unbranded enemy is branded vulnerable. An enemy already branded has its brand _called due_: a pillar of light burns it for _60%_ of your damage per turn left on the brand, doubled against the undead and demons.\n\n_+1:_ New brands last _4 turns_.\n\n_+2:_ New brands last _6 turns_.\n\n_+3:_ New brands last _8 turns_, and a pillar of light also strikes every judged enemy for _120%_ of your damage, doubled against the undead and demons.

###subclass branches

actors.hero.skills.subbranch.berserker.name=Berserker
actors.hero.skills.subbranch.berserker.desc=The berserker trades everything for fury.
actors.hero.skills.subbranch.gladiator.name=Gladiator
actors.hero.skills.subbranch.gladiator.desc=The gladiator owns the arena.
actors.hero.skills.subbranch.battlemage.name=Battlemage
actors.hero.skills.subbranch.battlemage.desc=The battlemage weaves steel and spell.
actors.hero.skills.subbranch.warlock.name=Warlock
actors.hero.skills.subbranch.warlock.desc=The warlock bargains with darker powers.
actors.hero.skills.subbranch.assassin.name=Assassin
actors.hero.skills.subbranch.assassin.desc=The assassin ends fights before they begin.
actors.hero.skills.subbranch.freerunner.name=Freerunner
actors.hero.skills.subbranch.freerunner.desc=The freerunner never stops moving.
actors.hero.skills.subbranch.sniper.name=Sniper
actors.hero.skills.subbranch.sniper.desc=The sniper makes every shot count.
actors.hero.skills.subbranch.warden.name=Warden
actors.hero.skills.subbranch.warden.desc=The warden is one with the wild.
actors.hero.skills.subbranch.champion.name=Champion
actors.hero.skills.subbranch.champion.desc=The champion leads from the front.
actors.hero.skills.subbranch.monk.name=Monk
actors.hero.skills.subbranch.monk.desc=The monk needs no weapon at all.
actors.hero.skills.subbranch.priest.name=Priest
actors.hero.skills.subbranch.priest.desc=The priest keeps everyone standing.
actors.hero.skills.subbranch.paladin.name=Paladin
actors.hero.skills.subbranch.paladin.desc=The paladin is a bulwark of the light.

actors.hero.skills.carnage.name=Carnage
actors.hero.skills.carnage.desc=Slaughter feeds your fury: each melee kill fills your rage.\n\n_+1:_ A kill adds _10%_ rage.\n\n_+2:_ A kill adds _20%_ rage.\n\n_+3:_ A kill adds _30%_ rage, and a kill while berserking tops up your berserk shield by _5%_ of your max health.

actors.hero.skills.bloodrush.name=Blood Rush
actors.hero.skills.bloodrush.cast=BLOOD!
actors.hero.skills.bloodrush.desc=Charge in a straight line, trailing blood. Every enemy in your path is slammed aside for _50%_ weapon damage; one that will not budge stops the charge.\n\n_+1:_ Charge up to _3 tiles_.\n\n_+2:_ Charge up to _4 tiles_.\n\n_+3:_ Charge up to _5 tiles_, and the rush tears you free of _roots_, _cripple_ and _slow_, so you can charge while held.

actors.hero.skills.undyingwill.name=Undying Will
actors.hero.skills.undyingwill.cast=I will not fall
actors.hero.skills.undyingwill.desc=Raise a crimson ward that feeds your rage: every point it soaks fills your fury. When blows break it you roar, and every enemy nearby turns on you.\n\n_+1:_ A ward of _10%_ of your max health.\n\n_+2:_ A ward of _15%_.\n\n_+3:_ A ward of _20%_, and while it holds, a killing blow leaves you at _1 HP_.

actors.hero.skills.comboopener.name=Opening Blow
actors.hero.skills.comboopener.desc=The Gladiator opens every fight with a shockwave: a melee hit on an enemy at full health _Dazes_ it and throws it back.\n\n_+1:_ Dazed for _2 turns_, thrown _1 tile_.\n\n_+2:_ Dazed for _3 turns_, thrown _2 tiles_.\n\n_+3:_ Dazed for _4 turns_, and the shockwave also throws _every other enemy_ next to you _1 tile_ back.

actors.hero.skills.warcry.name=War Cry
actors.hero.skills.warcry.cast=RAAAAH!
actors.hero.skills.warcry.desc=Bellow, and every enemy in sight flees from you in terror.\n\n_+1:_ Enemies flee for _3 turns_.\n\n_+2:_ Enemies flee for _4 turns_.\n\n_+3:_ Enemies flee for _5 turns_ and are _weakened_ for as long.

actors.hero.skills.finishingblow.name=Finishing Blow
actors.hero.skills.finishingblow.cast=Finish him!
actors.hero.skills.finishingblow.desc=A melee hit that would leave an enemy with less health than a share of the hit itself kills it outright. Bosses and minibosses are immune.\n\n_+1:_ Executes when the enemy would be left with _20%_ of the hit or less.\n\n_+2:_ With _35%_ of the hit or less.\n\n_+3:_ With _50%_ of the hit or less, and the execution sprays blood that _blinds_ the enemies beside it for _2 turns_.

actors.hero.skills.spellblade.name=Spell Blade
actors.hero.skills.spellblade.desc=Your melee strikes can drink mana from the foe, sparking into you.\n\n_+1:_ Melee hits have a _15%_ chance to restore _2 mana_.\n\n_+2:_ Melee hits have a _30%_ chance to restore _3 mana_.\n\n_+3:_ Melee hits have a _45%_ chance to restore _4 mana_. If your mana is already full, the hit deals _4 extra damage_ instead.

actors.hero.skills.manashield.name=Mana Shield
actors.hero.skills.manashield.cast=Arcane ward
actors.hero.skills.manashield.desc=Wrap yourself in a crystal ward that soaks up damage and slowly fades. When a blow breaks it, the shards sink into your weapon, and each of your next melee hits spends one for _60-160%_ of your damage as extra magic damage.\n\n_+1:_ The ward blocks damage equal to _8%_ of your max health and charges _2 hits_.\n\n_+2:_ _12%_, _3 hits_.\n\n_+3:_ _16%_, _4 hits_, and the first time it breaks it _reforms_ at half strength.

actors.hero.skills.arcaneecho.name=Arcane Echo
actors.hero.skills.arcaneecho.desc=Your melee blows can echo, striking again with a crack of lightning.\n\n_+1:_ Melee hits have a _10%_ chance to echo for _40-120%_ of your damage.\n\n_+2:_ Melee hits have a _20%_ chance to echo for _40-160%_ of your damage.\n\n_+3:_ Melee hits have a _30%_ chance to echo for _40-200%_ of your damage, and the echo arcs on to _one more_ adjacent enemy.

actors.hero.skills.souldrain.name=Soul Drain
actors.hero.skills.souldrain.desc=Souls you have marked do not rest. When a soul-marked enemy dies, its soul flies to the nearest enemy in reach and marks it too, so your zaps keep feeding you.\n\n_+1:_ The soul flies up to _3 tiles_.\n\n_+2:_ Up to _4 tiles_.\n\n_+3:_ Up to _5 tiles_, and it _passes through you_ first, healing _3%_ of your max health.

actors.hero.skills.hex.name=Hex
actors.hero.skills.hex.cast=Suffer
actors.hero.skills.hex.desc=Curse an enemy you can see so it deals less damage and takes more.\n\n_+1:_ The curse lasts _5 turns_.\n\n_+2:_ The curse lasts _7 turns_.\n\n_+3:_ The curse lasts _9 turns_ and also cripples the enemy for _5 turns_.

actors.hero.skills.darkpact.name=Dark Pact
actors.hero.skills.darkpact.cast=My blood, my power
actors.hero.skills.darkpact.desc=Trade a tenth of your maximum health for a surge of mana. The pact refuses a price that would kill you.\n\n_+1:_ Restore _15 mana_.\n\n_+2:_ Restore _20 mana_.\n\n_+3:_ Restore _25 mana_, and the spilled blood lashes every adjacent enemy for half the health paid.

actors.hero.skills.ambush.name=Ambush
actors.hero.skills.ambush.desc=Your first surprise attack on each enemy, melee or thrown, drives a shadow stake through its shadow and _pins_ it in place.\n\n_+1:_ Pinned for _2 turns_.\n\n_+2:_ Pinned for _3 turns_.\n\n_+3:_ Pinned for _4 turns_, and every enemy next to your target is _staked_ too.

actors.hero.skills.garrote.name=Garrote
actors.hero.skills.garrote.desc=A wire from behind: a melee hit on an enemy busy fighting someone else (your shadows, a double, an ally, a maddened enemy) loops round its throat and always makes it bleed.\n\n_+1:_ Bleeding _3_.\n\n_+2:_ Bleeding _4_.\n\n_+3:_ Bleeding _5_, and the choke _cripples_ it for _2 turns_.

actors.hero.skills.vanish.name=Vanish
actors.hero.skills.vanish.cast=...
actors.hero.skills.vanish.desc=Step into shadow without spending a turn. Enemies hunting you lose your trail, so your next blow on each of them is a surprise attack.\n\n_+1:_ Enemies within _3 tiles_ lose you.\n\n_+2:_ Enemies within _5 tiles_ lose you.\n\n_+3:_ _Every enemy in sight_ loses you, and you stay _invisible_ for _3 turns_.

actors.hero.skills.slipstream.name=Slipstream
actors.hero.skills.slipstream.cast=Catch me!
actors.hero.skills.slipstream.desc=Break into a run for _6 turns_, leaving swirls of wind on the tiles behind you for _10 turns_. An enemy that steps into a swirl is _tripped_ and loses a turn.\n\n_+1:_ The wind holds your last _4 tiles_.\n\n_+2:_ The wind holds your last _6 tiles_.\n\n_+3:_ The wind holds your last _8 tiles_, and casting again for free _rides the wind back_ to its far end, tripping every enemy along the trail.

actors.hero.skills.parkour.name=Parkour
actors.hero.skills.parkour.desc=A moving target is hard to hit. If you moved on your last turn, a melee blow can miss you completely as you _roll one tile away_ from the attacker.\n\n_+1:_ Roll away from _15%_ of those blows.\n\n_+2:_ Roll away from _25%_ of those blows.\n\n_+3:_ Roll away from _35%_ of those blows, and _vault over_ the attacker to land behind it when there is room.

actors.hero.skills.momentummaster.name=Momentum Master
actors.hero.skills.momentummaster.desc=When a melee kill leaves no enemy beside you, you leap in an arc to land beside the nearest enemy you can see.\n\n_+1:_ Leap up to _2 tiles_.\n\n_+2:_ Leap up to _3 tiles_.\n\n_+3:_ Leap up to _4 tiles_, and your next melee hit that lands on that enemy is a _plunging strike_ for _+50%_ damage.

actors.hero.skills.overwatch.name=Overwatch
actors.hero.skills.overwatch.desc=Hold the line: your ranged hits can knock the target back. A target that can't be moved takes the full force where it stands.\n\n_+1:_ _20%_ chance to push it _2 tiles_.\n\n_+2:_ _30%_ chance to push it _2 tiles_.\n\n_+3:_ _40%_ chance to push it _3 tiles_, and a target slammed into something, or pinned where it stands, is stunned.

actors.hero.skills.headshot.name=Head Shot
actors.hero.skills.headshot.cast=Head shot!
actors.hero.skills.headshot.desc=Now and then a ranged hit cracks the target's skull for _150%_ damage and knocks it off its feet for a turn.\n\n_+1:_ _10%_ chance of a head shot.\n\n_+2:_ _15%_ chance of a head shot.\n\n_+3:_ _20%_ chance, and the crack rings out: enemies next to the target _stagger_ about for _3 turns_.

actors.hero.skills.piercingfocus.name=Piercing Focus
actors.hero.skills.piercingfocus.cast=Focus...
actors.hero.skills.piercingfocus.desc=Sweep your sights across every enemy in view: each one caught in them is suppressed, hitting and dodging half as well.\n\n_+1:_ Suppressed for _5 turns_.\n\n_+2:_ Suppressed for _7 turns_.\n\n_+3:_ Suppressed for _9 turns_, and you sense every enemy on the floor for _10 turns_.

actors.hero.skills.thorns.name=Thorns
actors.hero.skills.thorns.desc=Your arrows and thrown weapons leave a thorn in what they hit. The next time that enemy moves, the thorn sprouts barbed vines that lash it.\n\n_+1:_ The vines lash for _40%_ of your damage.\n\n_+2:_ The vines lash for _80%_ of your damage.\n\n_+3:_ The vines lash for _120%_ of your damage and _root_ it for _1 turn_.

actors.hero.skills.symbiosis.name=Symbiosis
actors.hero.skills.symbiosis.desc=When an enemy's blow lands, there is a _25%_ chance leaves burst from you and mend part of the health you lost over the next turns.\n\n_+1:_ Mends _30%_ of it.\n\n_+2:_ Mends _45%_ of it.\n\n_+3:_ Mends _60%_, and while the leaves are mending you, enemies that hit you are _slowed_ by clinging vines for _3 turns_.

actors.hero.skills.wildcall.name=Wild Call
actors.hero.skills.wildcall.cast=To me!
actors.hero.skills.wildcall.desc=Mark an enemy you can see, and a spirit wolf bursts from the brush to hunt only that prey. It can't be struck, bites every turn, and fades when its prey dies or after _10 turns_.\n\n_+1:_ The wolf bites for _80-180%_ of your damage.\n\n_+2:_ The wolf bites for _120-220%_ of your damage.\n\n_+3:_ The wolf bites for _160-260%_ of your damage, and when its prey dies it _picks up the trail_ of the nearest enemy in sight.

actors.hero.skills.banner.name=Banner
actors.hero.skills.banner.desc=Every melee kill plants your banner where the enemy fell. Each turn, you and your allies within _2 tiles_ of it raise a barrier.\n\n_+1:_ The banner stands _6 turns_. Barriers grow to _5%_ of max health.\n\n_+2:_ Stands _8 turns_. Barriers grow to _10%_.\n\n_+3:_ Stands _10 turns_. Barriers grow to _15%_, and enemies near it are _Dazed_.

actors.hero.skills.secondwind.name=Second Wind
actors.hero.skills.secondwind.cast=Second wind!
actors.hero.skills.secondwind.desc=Catch your breath: your weapon abilities regain charges at once, with a green flare.\n\n_+1:_ Regain _1 charge_.\n\n_+2:_ Regain _2 charges_.\n\n_+3:_ Regain _3 charges_, and you can _overfill_ your charges by one.

actors.hero.skills.challenge.name=Challenge
actors.hero.skills.challenge.cast=Face me!
actors.hero.skills.challenge.desc=Roar a challenge: every enemy in sight comes to face you, and each one that answers hardens your guard.\n\n_+1:_ A shield of _2%_ of your max health for every enemy that answers.\n\n_+2:_ A _3%_ shield for each.\n\n_+3:_ A _4%_ shield for each, and every kill in the next _5 turns_ gives you _2 mana_ back.

actors.hero.skills.pressurepoint.name=Pressure Point
actors.hero.skills.pressurepoint.desc=Strike the nerves that lock a body in place.\n\n_+1:_ Melee hits have a _10%_ chance to paralyze a non-boss enemy for a turn.\n\n_+2:_ The chance rises to _15%_.\n\n_+3:_ The chance rises to _20%_, and hits on a paralyzed enemy deal _50% more_ damage.

actors.hero.skills.innerpeace.name=Inner Peace
actors.hero.skills.innerpeace.desc=A calm mind lets harm slide off. When a cripple, weakness, blindness, vertigo or terror would take hold of you, you may breathe it out in a white puff. Poison, bleeding and other harm over time can't be breathed out.\n\n_+1:_ _15%_ chance.\n\n_+2:_ _25%_ chance.\n\n_+3:_ _35%_ chance, and each one you breathe out restores _2 mana_.

actors.hero.skills.dragonkick.name=Dragon Kick
actors.hero.skills.dragonkick.cast=HWAAA!
actors.hero.skills.dragonkick.desc=Fly at an enemy in a straight line and land a kick that launches it. The kicked body bowls through every enemy in its path, each taking the kick's damage and knocked a tile aside. If it slams into a wall it takes the kick again and is _dazed_ for 2 turns. It ignores your weapon.\n\n_+1:_ Fly up to _2 tiles_; it is launched _2 tiles_; _100-240%_ of your damage.\n\n_+2:_ Fly up to _3 tiles_; launched _3 tiles_; _140-320%_ of your damage.\n\n_+3:_ Fly up to _4 tiles_; launched _4 tiles_; _180-400%_ of your damage, and where it comes down the enemies around it are _dazed_ for 2 turns.

actors.hero.skills.litany.name=Litany
actors.hero.skills.litany.desc=Every skill you cast (switches don't count) speaks a verse: a note rises, and you and your allies within 2 tiles are mended.\n\n_+1:_ Heals _2%_ of max health.\n\n_+2:_ Heals _4%_ of max health.\n\n_+3:_ Heals _6%_ of max health, and every _third verse_ also blesses everyone it mends for _3 turns_.

actors.hero.skills.massheal.name=Mass Heal
actors.hero.skills.massheal.cast=Be mended!
actors.hero.skills.massheal.desc=Seraph wings settle over you and mend you and every ally within _2 tiles_, each turn they stay.\n\n_+1:_ The wings stay _3 turns_, mending _4%_ of max health a turn.\n\n_+2:_ They stay _4 turns_, and strike enemies within 2 tiles for _260%_ of your damage as they fade.\n\n_+3:_ They stay _5 turns_, and healing past full hardens into _light shards_ that catch part of the next blows and cut back at the nearest enemy.

actors.hero.skills.purify.name=Purify
actors.hero.skills.purify.cast=Begone!
actors.hero.skills.purify.desc=A flash of pure light burns away poison, bleeding, crippling, weakness, blindness and vulnerability.\n\n_+1:_ Cleanses you.\n\n_+2:_ Also burns away _hex, degradation and ooze_, and cleanses every ally in sight.\n\n_+3:_ Also lifts fire, terror and slowness from you, and blesses you for _2 turns_.

actors.hero.skills.aegis.name=Aegis
actors.hero.skills.aegis.desc=A shield of light catches a heavy melee blow (a tenth of your max health or more), swallows _half_ of it and bashes the attacker away. It takes _8 turns_ to reform.\n\n_+1:_ The bash throws the attacker back _1 tile_.\n\n_+2:_ The bash throws it back _2 tiles_.\n\n_+3:_ The bash throws it back _3 tiles_, and the half the shield swallowed is _slammed back_ into the attacker.

actors.hero.skills.holycharge.name=Holy Charge
actors.hero.skills.holycharge.cast=For the light!
actors.hero.skills.holycharge.desc=Raise your shield and charge in a streak of light. The first enemy in your way is driven ahead of you to the end of the charge, and if it slams into a wall or creature it is _stunned for 2 turns_.\n\n_+1:_ Charge up to _3 tiles_.\n\n_+2:_ Charge up to _5 tiles_.\n\n_+3:_ Charge up to _7 tiles_, and the light _blinds_ every enemy beside your path.

actors.hero.skills.retribution.name=Retribution
actors.hero.skills.retribution.desc=Every blow an enemy lands on you leaves a golden brand of debt on it. Your next melee hit on that enemy pays the debt back as holy light, twice over against the undead and demons.\n\n_+1:_ The debt is _30%_ of the damage it dealt you.\n\n_+2:_ The debt is _45%_.\n\n_+3:_ The debt is _60%_, and a debt of _10_ or more bursts on into _one more enemy_ within 2 tiles for half.

actors.hero.skills.leap.name=Leap
actors.hero.skills.leap.cast=Hyah!
actors.hero.skills.leap.desc=Leap onto an enemy in view, land beside it and bring your weapon down, stunning it for _1 turn_. You cannot leap while rooted.\n\n_+1:_ Leap up to _3 tiles_ and strike for _110%_ damage.\n\n_+2:_ Leap up to _4 tiles_ and strike for _120%_ damage.\n\n_+3:_ Leap up to _5 tiles_ and strike for _130%_ damage. The landing throws every other enemy next to you _1 tile_ away.
actors.hero.skills.leap.prompt=Choose an enemy to leap at
actors.hero.skills.leap.no_target=You need an enemy in view to leap at.
actors.hero.skills.leap.too_far=That is beyond your leap.
actors.hero.skills.leap.no_path=There is a wall in the way.
actors.hero.skills.leap.no_room=There is nowhere to land beside it.

actors.hero.skills.chargedshot.name=Charged Shot
actors.hero.skills.chargedshot.cast=Loose!
actors.hero.skills.chargedshot.desc=Stand and draw your bow for several turns, unable to act, then loose one arrow that cannot miss. It flies straight through walls and every enemy on its line, trailing a beam of light.\n\n_+1:_ Draw for _10 turns_. The arrow flies _10 tiles_ and deals _150%_ bow damage.\n\n_+2:_ Draw for _7 turns_. The arrow flies _12 tiles_ and deals _175%_ bow damage.\n\n_+3:_ Draw for _5 turns_. The arrow flies _14 tiles_, deals _200%_ bow damage and leaves everything it pierces _vulnerable_ for 3 turns.
actors.hero.skills.chargedshot.prompt=Choose a direction for the shot
actors.hero.skills.chargedshot.no_target=Pick a tile to shoot toward.

actors.hero.skills.tengusarsenal.name=Tengu's Arsenal
actors.hero.skills.tengusarsenal.cast=Catch!
actors.hero.skills.tengusarsenal.desc=Tengu's tricks, learned by watching him. Pick a bomb and throw it. The smoke bomb and the shocker never hurt you or your allies, but the fire bomb's flames burn anyone who stands in them.\n\n_+1:_ The _smoke bomb_ ticks down three turns, then blasts everything within _2 tiles_.\n\n_+2:_ Adds the _fire bomb_, which sets the tiles around where it lands ablaze.\n\n_+3:_ Adds the _shocker_: it sits where it lands and arcs lightning for _3 turns_, stunning what it hits.
actors.hero.skills.tengusarsenal.pick=Which of Tengu's toys?
actors.hero.skills.tengusarsenal.opt_smoke=Smoke bomb
actors.hero.skills.tengusarsenal.opt_fire=Fire bomb
actors.hero.skills.tengusarsenal.opt_shock=Shocker
actors.hero.skills.tengusarsenal.prompt=Choose where to throw it
actors.hero.skills.tengusarsenal.no_target=Choose a tile away from yourself.
actors.hero.skills.tengusarsenal.chasm=It tumbles into the chasm and is gone.

actors.hero.skills.hurl.name=Hurl
actors.hero.skills.hurl.cast=Catch!
actors.hero.skills.hurl.desc=Throw the weapon in your hand, spinning, at an enemy up to 6 tiles away for _120%_ weapon damage, enchantment included. Then it flies back to your hand.\n\n_+1:_ Each hit has a _15%_ chance to bounce to another nearby enemy.\n\n_+2:_ The bounce chance rises to _30%_.\n\n_+3:_ The bounce chance rises to _45%_, and Hurl hits build _combo_: each point gives your next Hurl _+10%_ damage, up to 5.
actors.hero.skills.hurl.prompt=Choose an enemy to throw at
actors.hero.skills.hurl.no_target=You need an enemy in view within 6 tiles.
actors.hero.skills.hurl.no_weapon=You need a melee weapon in hand to throw.

actors.hero.skills.pillaroflight.name=Pillar of Light
actors.hero.skills.pillaroflight.cast=Let there be light!
actors.hero.skills.pillaroflight.desc=Call a column of light down on an enemy in view up to 8 tiles away. It burns half again as hard against the undead and demons, and grows stronger with your damage.\n\n_+1:_ The pillar deals _160-320%_ of your damage.\n\n_+2:_ The pillar deals _220-440%_ of your damage, and blinds the enemies beside it for _2 turns_.\n\n_+3:_ The pillar deals _280-560%_ of your damage, and a star of light spires spreads from it for _2 turns_, striking enemies for _140%_ of your damage and blessing allies.
actors.hero.skills.pillaroflight.prompt=Choose an enemy to call the light down on
actors.hero.skills.pillaroflight.no_target=You need an enemy in view within 8 tiles.

