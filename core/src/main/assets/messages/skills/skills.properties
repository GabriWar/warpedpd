actors.hero.skills.skill.pending_choice=This branch now splits: pick %1$s or %2$s yourself, the choice is permanent.

actors.hero.skills.branchskill.invested=You have invested a total of %1$d points in this branch.
actors.hero.skills.branchskill.next_cost=Next advancement will cost you %1$d skill point.
actors.hero.skills.branchskill.branch_maxed=You can no longer advance in this line

###warrior

actors.hero.skills.warriorpassivea.name=Warrior
actors.hero.skills.warriorpassivea.desc=Warriors rely on their physical fitness to gain an advantage.

actors.hero.skills.endurance.name=Endurance
actors.hero.skills.endurance.desc=+5 to health per level. At level 3 you stop feeling the small stuff: every incoming hit is shaved by 1 damage.

actors.hero.skills.regeneration.name=Regeneration
actors.hero.skills.regeneration.desc=Regenerate health faster.

actors.hero.skills.toughness.name=Toughness
actors.hero.skills.toughness.desc=Take less damage from enemy attacks.

actors.hero.skills.laststand.name=Last Stand
actors.hero.skills.laststand.desc=While badly wounded (at or below a third of your health) you take 5% less damage per level, and a blow that would drop you to a quarter of your health raises a 4 per level point barrier. The barrier cannot be raised again until the previous one is spent.

actors.hero.skills.stoneskin.name=Stone Skin
actors.hero.skills.stoneskin.desc=Your hide turns to stone: every incoming hit is shaved by 1 + 1 per level damage, applied after all other reductions. Excellent against swarms, less so against a single heavy blow.

actors.hero.skills.bloodthirst.name=Bloodthirst
actors.hero.skills.bloodthirst.desc=Melee hits drain life: heal for 5% of the damage dealt per level, up to 1 health per level.

actors.hero.skills.warriorpassiveb.name=Melee
actors.hero.skills.warriorpassiveb.desc=Warriors excel in melee combat.

actors.hero.skills.firmhand.name=Firm Hand
actors.hero.skills.firmhand.desc=Increased chance of hitting target when using melee weapons.

actors.hero.skills.aggression.name=Aggression
actors.hero.skills.aggression.desc=Do more damage while using melee weapons. At level 3 your melee swings deal a further 10% damage to anything already Vulnerable, Crippled, Weakened or Bleeding.

actors.hero.skills.mastery.name=Mastery
actors.hero.skills.mastery.desc=Melee weapons receive bonus to level. A fully trained Firm Hand grants one further effective weapon level on top.

actors.hero.skills.warbreaker.name=Warbreaker
actors.hero.skills.warbreaker.cast=Guard broken!
actors.hero.skills.warbreaker.desc=+1 accuracy per level, and melee hits have a 6% chance per level to shatter the target's guard: 30% extra damage on that blow and Vulnerable for 3 + 1 per level turns.

actors.hero.skills.warrioractive.name=Skills
actors.hero.skills.warrioractive.desc=Warriors use brute strength to deliver great punishment.

actors.hero.skills.smash.name=Smash
actors.hero.skills.smash.cast=Smash!
actors.hero.skills.smash.desc=Hits target for more damage.

actors.hero.skills.knockback.name=KnockBack
actors.hero.skills.knockback.cast=KnockBack!
actors.hero.skills.knockback.desc=Hits harder and knocks back target.

actors.hero.skills.rampage.name=Rampage
actors.hero.skills.rampage.cast=Rampage!
actors.hero.skills.rampage.desc=Less damage but hits all enemies around you. At level 3 every enemy the sweep connects with is left Bleeding.

actors.hero.skills.earthshatter.name=Earthshatter
actors.hero.skills.earthshatter.cast=Break!
actors.hero.skills.earthshatter.desc=Slam the ground, hitting every enemy within two tiles for 6 + 4 per level damage and rooting them for 2 + 1 per level turns. Needs no target.

actors.hero.skills.ironstance.name=Iron Stance
actors.hero.skills.ironstance.cast=Hold!
actors.hero.skills.ironstance.desc=Brace behind your guard: blows that land on you deal 12% less damage per level, but you strike 15% softer. Mana is only spent when something actually connects.

actors.hero.skills.recklessfury.name=Reckless Fury
actors.hero.skills.recklessfury.cast=No guard!
actors.hero.skills.recklessfury.desc=Abandon your guard: melee swings deal 15% more damage per level for mana, but you take 10% more damage while the stance is held, mana or not.

actors.hero.skills.warriorfourth.name=Warlord's Command
actors.hero.skills.warriorfourth.desc=Warlords break the enemy's legs and their morale, then field a retinue that holds the line for them.

actors.hero.skills.hamstring.name=Hamstring
actors.hero.skills.hamstring.cast=Stay down
actors.hero.skills.hamstring.desc=Melee hits have an 8% chance per level to cripple the target, halving its movement speed for 3 + 1 per level turns.

actors.hero.skills.demoralize.name=Demoralize
actors.hero.skills.demoralize.cast=Break their nerve
actors.hero.skills.demoralize.desc=Melee hits have a 10% chance per level to leave the target Weakened for 4 + 2 per level turns, and you deal 5% more damage per level to anything already Weakened.

actors.hero.skills.shieldbearer.name=Shieldbearer
actors.hero.skills.shieldbearer.cast=To me!
actors.hero.skills.shieldbearer.desc=Call up a sworn shieldbearer who holds the line for you. Every enemy in sight turns on him the moment he arrives.
actors.hero.skills.shieldbearer.no_summons=You cannot control more summons.


###mage

actors.hero.skills.magepassivea.name=Mage
actors.hero.skills.magepassivea.desc=Mages rely on their magical powers to gain an advantage over others.

actors.hero.skills.spirituality.name=Spirituality
actors.hero.skills.spirituality.desc=+5 to mana per level.

actors.hero.skills.meditation.name=Meditation
actors.hero.skills.meditation.desc=Increased mana regeneration.\nAt level 3 the trance deepens while your mana sits below a quarter of your pool, refilling it faster.

actors.hero.skills.spiritarmor.name=Spirit Armor
actors.hero.skills.spiritarmor.desc=When activated, 10% of damage per level is taken from mana when possible.\nAt level 3, absorbing 3 or more damage has a 20% chance to wash back into your wands, recharging them for 3 turns.

actors.hero.skills.transcendence.name=Transcendence
actors.hero.skills.transcendence.desc=While activated, you shrug off 5% of incoming damage per level, spending 1 mana each time you are hit.\nThe reduction stops paying out once you are out of mana.

actors.hero.skills.serenefocus.name=Serene Focus
actors.hero.skills.serenefocus.desc=Your mana returns far faster, but your body is left wide open: you take 5% more damage per level.\nCannot be taken alongside Will of Iron.

actors.hero.skills.willofiron.name=Will of Iron
actors.hero.skills.willofiron.desc=Always on: eats 2 damage per level from every blow, at a cost of 2 mana per point eaten.\nGrants no regeneration of its own.\nCannot be taken alongside Serene Focus.

actors.hero.skills.magepassiveb.name=Magic
actors.hero.skills.magepassiveb.desc=Mages excel in magic.

actors.hero.skills.wizard.name=Wizard
actors.hero.skills.wizard.desc=Wands recharge faster.

actors.hero.skills.sorcerer.name=Sorcerer
actors.hero.skills.sorcerer.desc=Wands do 10% more damage per level.\nAt level 3 a full mana pool adds a further 10%, fading to nothing as the pool empties.

actors.hero.skills.summoner.name=Summoner
actors.hero.skills.summoner.desc=Summoning limit increases by 1 per level.\nAt level 3 your mark raises every summon one effective level higher.

actors.hero.skills.soultether.name=Soul Tether
actors.hero.skills.soultether.desc=Every summon you keep alive (up to three) feeds your wands: +3% damage and -2% recharge time per level, per summon.\nWorth nothing with no bodies on the field.

actors.hero.skills.mageactive.name=Summoning
actors.hero.skills.mageactive.desc=Mages rely on summoned creatures to do their bidding.\nLimited to 3 (+%1$d bonus from the Summoner skill) active summons

actors.hero.skills.summonrat.name=Summon Rat
actors.hero.skills.summonrat.cast=Rise Rodent!
actors.hero.skills.summonrat.desc=Summons a rat that fights by your side. Stronger with skill level.

actors.hero.skills.spark.name=Spark
actors.hero.skills.spark.cast=Basic training
actors.hero.skills.spark.desc=Casts a spark of lightning at a target, with a 15% chance per level to blind it for 1-2 turns.\nAt level 3 the bolt forks to the closest other enemy within 3 cells for half damage.

actors.hero.skills.summonskeleton.name=Summon Skeleton
actors.hero.skills.summonskeleton.cast=The dead shall obey!
actors.hero.skills.summonskeleton.desc=Summons a skeleton that fights by your side. Stronger with skill level.

actors.hero.skills.summoncrab.name=Summon Crab
actors.hero.skills.summoncrab.cast=Pinch them!
actors.hero.skills.summoncrab.desc=Summons a crab that fights by your side. Stronger with skill level.

actors.hero.skills.souldetonation.name=Soul Detonation
actors.hero.skills.souldetonation.cast=Serve me one last time!
actors.hero.skills.souldetonation.desc=Blows up to three of your summons apart, dealing %1$d-%2$d damage to every enemy beside each of them.\nAt level 3 you also mend 2 health per summon spent.
actors.hero.skills.souldetonation.no_summons=You have nothing to detonate.

actors.hero.skills.magefourth.name=Elementalism
actors.hero.skills.magefourth.desc=Elementalists throw raw fire, frost and storm at the dungeon itself, scaling off nothing but their own skill.

actors.hero.skills.cindertrail.name=Cinder Trail
actors.hero.skills.cindertrail.cast=Let it burn!
actors.hero.skills.cindertrail.desc=Splashes fire onto a cell and everything around it, setting anyone standing there ablaze - yourself included.\nPyromancy makes the blaze fiercer.

actors.hero.skills.frostnova.name=Frost Nova
actors.hero.skills.frostnova.cast=Be still.
actors.hero.skills.frostnova.desc=A ring of ice bursts out around you, damaging and chilling every enemy within 3 cells.\nCryomancy lengthens the chill, and from level 2 widens the ring.
actors.hero.skills.frostnova.no_targets=There is nothing close enough to freeze.

actors.hero.skills.stormcall.name=Storm Call
actors.hero.skills.stormcall.cast=The sky answers!
actors.hero.skills.stormcall.desc=Calls a bolt down on a target, then arcs to one further enemy per level within 4 cells for 60% damage.\nAnything standing in water takes a third more, and at level 3 is briefly paralysed.\nWith Pyromancy at level 2 the first target also catches fire.
actors.hero.skills.stormcall.no_target=There is nothing there for the bolt to strike.

actors.hero.skills.pyreaffinity.name=Pyromancy
actors.hero.skills.pyreaffinity.desc=Your blows, thrown or swung, have a %1$d%% chance to set the target alight.\nCinder Trail burns hotter, and from level 2 Storm Call ignites what it strikes.\nCannot be taken alongside Cryomancy.

actors.hero.skills.rimeaffinity.name=Cryomancy
actors.hero.skills.rimeaffinity.desc=Your blows, thrown or swung, have a %1$d%% chance to chill the target; at level 3 they sometimes freeze it solid instead.\nFrost Nova chills for longer, and from level 2 its radius grows.\nCannot be taken alongside Pyromancy.


###rogue

actors.hero.skills.roguepassivea.name=Rogue
actors.hero.skills.roguepassivea.desc=Rogues rely on stealth and quickness in combat.

actors.hero.skills.bandit.name=Bandit
actors.hero.skills.bandit.desc=10% more gold per level.

actors.hero.skills.stealth.name=Stealth
actors.hero.skills.stealth.desc=Harder to detect: +1 stealth per level.\nAlso a 6% chance per level to slip an attack made from a distance entirely,\nand at level 3 slipping one leaves you invisible for 2 turns.

actors.hero.skills.locksmith.name=Lock Smith
actors.hero.skills.locksmith.cast=Woah!!
actors.hero.skills.locksmith.cast_fail=Need to train in %1$s more...
actors.hero.skills.locksmith.desc=33% per level chance to disable traps.\nAt level 3 a jammed mechanism is stripped for parts: it drops salvaged coin\n(worth more the further Bandit is trained) and returns 2 mana.

actors.hero.skills.masterthief.name=Master Thief
actors.hero.skills.masterthief.desc=An extra 15% gold per level on top of everything else you lift, and +1 stealth per level.\nAt level 3 the coins fund your focus as well: pocketing gold restores mana.

actors.hero.skills.roguepassiveb.name=Assassin
actors.hero.skills.roguepassiveb.desc=Rogues rely on venom and sneak attacks to deal quick but painful deaths.

actors.hero.skills.venom.name=Venom
actors.hero.skills.venom.cast=Poison is my specialty
actors.hero.skills.venom.desc=Chance to poison target.

actors.hero.skills.scorpion.name=Scorpion
actors.hero.skills.scorpion.desc=Poison does more damage to enemies.\nYour hits also carry a sting: 8% chance per level to cripple the target,\ndoubled to 16% per level if it is already poisoned.

actors.hero.skills.silentdeath.name=Silent Death
actors.hero.skills.silentdeath.cast=Eternal Slumber
actors.hero.skills.silentdeath.cast_fail=Almost had him...
actors.hero.skills.silentdeath.desc=10% per level chance to instantly kill a sleeping enemy.

actors.hero.skills.necrotoxin.name=Necrotoxin
actors.hero.skills.necrotoxin.cast=Rot
actors.hero.skills.necrotoxin.desc=Your blade works the poison deeper: +5% damage per level against a poisoned target,\nwith a 20% chance per level to prolong the poison further.

actors.hero.skills.rogueactive.name=Ninjitsu
actors.hero.skills.rogueactive.desc=Rogues are experts in ninja arts.

actors.hero.skills.doublestab.name=Double Strike
actors.hero.skills.doublestab.cast=Too slow
actors.hero.skills.doublestab.desc=Attacks twice with equipped melee weapon.\nAt level 3 the follow-up costs half as much mana against a poisoned target.

actors.hero.skills.ninjabomb.name=Ninja Bomb
actors.hero.skills.ninjabomb.cast=Go to sleep
actors.hero.skills.ninjabomb.desc=Throws a bomb that emits sleeping gas on impact.

actors.hero.skills.shadowclone.name=Shadow Clone
actors.hero.skills.shadowclone.cast=Shadow clone
actors.hero.skills.shadowclone.desc=Summons a shadow clone that fights by your side, with 18/26/34 health.\nIt copies your footwork, and every point spent on Stealth sharpens its evasion further.
actors.hero.skills.shadowclone.too_many=You cannot control more summons.

actors.hero.skills.phantomstrike.name=Phantom Strike
actors.hero.skills.phantomstrike.cast=Nowhere to run
actors.hero.skills.phantomstrike.desc=Blink to the far side of a target within %1$d tiles and open its back.\nThe strike always lands, for 115%%/130%%/145%% of a weapon roll, half again as much\nagainst prey that has not noticed you yet.
actors.hero.skills.phantomstrike.too_far=That is too far away.
actors.hero.skills.phantomstrike.no_target=There is nobody there to strike.
actors.hero.skills.phantomstrike.no_room=There is no room left beside your mark.

actors.hero.skills.ashveil.name=Ash Veil
actors.hero.skills.ashveil.cast=You lost me
actors.hero.skills.ashveil.desc=A bowl of ash goes over the lamp. A spreading smoke screen swallows the line of sight,\nyou turn invisible and hasted, and everything within 3 tiles is left blind.

actors.hero.skills.blooddance.name=Crimson Waltz
actors.hero.skills.blooddance.cast=Stay close
actors.hero.skills.blooddance.desc=You stop leaving. A surge of adrenaline and a shield of 3 per level carry the dance,\nand while it lasts every melee hit opens a bleeding wound and strikes 5% harder per level.

actors.hero.skills.roguefourth.name=Dread
actors.hero.skills.roguefourth.desc=Dread is psychological warfare: you do not kill the room, you break it, then feed on the panic.

actors.hero.skills.creepingdread.name=Creeping Dread
actors.hero.skills.creepingdread.cast=Boo.
actors.hero.skills.creepingdread.desc=8% chance per level that a melee hit leaves the target terrified of you.\nIt deals no extra damage - it makes the prey worth hunting.

actors.hero.skills.predation.name=Predation
actors.hero.skills.predation.desc=+5% damage per level against anything already broken - asleep, fleeing, terrified,\nmaddened, charmed, blinded, paralysed or rooted. Melee and thrown alike.

actors.hero.skills.blackout.name=Blackout
actors.hero.skills.blackout.cast=Lights out
actors.hero.skills.blackout.desc=Snuffs out a whole corner of the room: everything within 2 tiles of the impact is\nblinded and left terrified of something it can no longer see.

actors.hero.skills.panicharvest.name=Panic Harvest
actors.hero.skills.panicharvest.desc=Panic is fuel. +5% damage per level against a fleeing, terrified, maddened or charmed\ntarget, and such a hit restores 1 mana, at most once per turn.

actors.hero.skills.dreadhowl.name=Dread Howl
actors.hero.skills.dreadhowl.cast=Turn on each other
actors.hero.skills.dreadhowl.desc=A howl that tips fear over into madness. Every terrified enemy in sight within 5 tiles\nloses its terror and turns on whatever is closest instead. It creates no fear itself.
actors.hero.skills.dreadhowl.no_targets=Nothing here is afraid of you yet.


###huntress

actors.hero.skills.huntresspassivea.name=Huntress
actors.hero.skills.huntresspassivea.desc=Huntresses rely on ranged attacks and fletching capabilities.

actors.hero.skills.fletching.name=Fletching
actors.hero.skills.fletching.desc=Creates darts with time.

actors.hero.skills.awareness.name=Awareness
actors.hero.skills.awareness.cast=Too easy..
actors.hero.skills.awareness.cast_fail=I am losing my touch...
actors.hero.skills.awareness.desc=10% chance per level to dodge a hostile ranged attack outright, and slipping the shot sets you moving: Haste for 1 + 1 per level turns.

actors.hero.skills.hunting.name=Hunting
actors.hero.skills.hunting.desc=Creates food with time.

actors.hero.skills.sixthsense.name=Sixth Sense
actors.hero.skills.sixthsense.desc=The forest warns you before the blow lands - you take 5% less damage per level from every source, and your wounds close faster.

actors.hero.skills.lonewolf.name=Lone Wolf
actors.hero.skills.lonewolf.desc=You hunt better without company. While no ally stands within eight tiles you deal 7% more damage per level and take 4% less. Any summon at all switches it off.

actors.hero.skills.poacher.name=Poacher
actors.hero.skills.poacher.desc=A working poacher's hands: you fletch your own shafts on the march, and you read a tripwire before you put your weight on it, stripping the mechanism 25% of the time per level.

actors.hero.skills.huntresspassiveb.name=Ranged
actors.hero.skills.huntresspassiveb.desc=Huntresses excel at ranged combat.

actors.hero.skills.accuracy.name=Accuracy
actors.hero.skills.accuracy.desc=Increases chance to hit when using a ranged weapon.

actors.hero.skills.kneeshot.name=Knee Shot
actors.hero.skills.kneeshot.cast=Easy Target
actors.hero.skills.kneeshot.desc=Aims for weak spots, crippling targets 10% of the time per level. At full mastery a shot into a leg that is already dragging opens the wound: 4 turns of bleeding.

actors.hero.skills.irontip.name=Iron Tip
actors.hero.skills.irontip.cast=Don't forget to share...
actors.hero.skills.irontip.desc=Uses iron tips allowing some thrown weapons to pass through their targets and continue their path. Fully forged tips also shred armour on the way through, leaving the target Vulnerable for 3 turns.

actors.hero.skills.heartseeker.name=Heartseeker
actors.hero.skills.heartseeker.cast=Through the heart.
actors.hero.skills.heartseeker.desc=Your shots find the gap between the ribs: +5% ranged damage per level, and any non-boss target already below 3 per level (plus a quarter of your hero level) HP dies outright.

actors.hero.skills.huntressactive.name=Archery
actors.hero.skills.huntressactive.desc=Huntresses are experts in archery.

actors.hero.skills.aimedshot.name=Aimed Shot
actors.hero.skills.aimedshot.cast=I see him
actors.hero.skills.aimedshot.desc=Stronger ranged attack that never misses.

actors.hero.skills.doubleshot.name=Double Shot
actors.hero.skills.doubleshot.cast=Two for one
actors.hero.skills.doubleshot.desc=Shoots two projectiles at the same time.

actors.hero.skills.bombvoyage.name=Bombvoyage
actors.hero.skills.bombvoyage.cast=Bombvoyage
actors.hero.skills.bombvoyage.desc=Attaches a bomb to a thrown weapon. At full mastery whatever survives the blast cannot walk it off, and is crippled for 4 turns.

actors.hero.skills.arrowstorm.name=Arrow Storm
actors.hero.skills.arrowstorm.cast=Rain of arrows!
actors.hero.skills.arrowstorm.desc=Empties the quiver over a patch of ground, striking everything in a 3x3 area for a fraction of a weapon roll and crippling the survivors.

actors.hero.skills.frostarrows.name=Frost Arrows
actors.hero.skills.frostarrows.cast=Freeze.
actors.hero.skills.frostarrows.desc=Rimed arrowheads: every shot chills its target, and shots into an already chilled target hit 8% harder per level. At full mastery the tips sometimes freeze outright.

actors.hero.skills.emberarrows.name=Ember Arrows
actors.hero.skills.emberarrows.cast=Burn.
actors.hero.skills.emberarrows.desc=Pitch-soaked arrowheads: every shot sets its target alight and hits 6% harder per level. Whatever the fire kills burns its own scrolls and rations with it.

actors.hero.skills.huntressfourth.name=Traplines
actors.hero.skills.huntressfourth.desc=Traplines make the ground fight for you: snares, deadfalls and broken legs set a turn before the fight.

actors.hero.skills.groundwork.name=Groundwork
actors.hero.skills.groundwork.desc=Anything that cannot step out of the way is already yours: +5% damage per level, melee or ranged, against rooted, crippled, paralysed, sleeping or frozen targets.

actors.hero.skills.beartrap.name=Bear Trap
actors.hero.skills.beartrap.cast=Mind your step.
actors.hero.skills.beartrap.desc=Sets a steel jaw trap on open ground. Whatever walks into it is rooted, crippled and bleeding; the trap springs once and is spent.
actors.hero.skills.beartrap.no_ground=There is nowhere to set the jaws there.
actors.hero.skills.beartrap.occupied=Something is already rigged there.

actors.hero.skills.deadfall.name=Deadfall
actors.hero.skills.deadfall.cast=Down it comes.
actors.hero.skills.deadfall.desc=Kicks out the prop and brings a propped weight down over a 3x3 patch you can see, crushing and stunning everything under it. You are never caught in your own deadfall.
actors.hero.skills.deadfall.no_vision=You cannot see that spot.


###duelist

actors.hero.skills.duelistpassivea.name=Duelist
actors.hero.skills.duelistpassivea.desc=Duelists rely on flawless form and conditioning.

actors.hero.skills.conditioning.name=Conditioning
actors.hero.skills.conditioning.desc=+5 to health per level. At max level, every blow against you is reduced by 1.

actors.hero.skills.poise.name=Poise
actors.hero.skills.poise.desc=Recover health faster between fights. At max level, and only if you have also invested in Parry Stance, that recovery is faster still.

actors.hero.skills.parrystance.name=Parry Stance
actors.hero.skills.parrystance.desc=Deflect part of every blow.

actors.hero.skills.aplomb.name=Aplomb
actors.hero.skills.aplomb.desc=Unshakeable footing. Every blow that still reaches you after your stance has deflected it is reduced by a further 1 point per level.

actors.hero.skills.duelistpassiveb.name=Fencing
actors.hero.skills.duelistpassiveb.desc=Duelists excel with a blade in hand.

actors.hero.skills.precision.name=Precision
actors.hero.skills.precision.desc=Increased chance of hitting with melee weapons. At max level, the weapon level Blade Mastery grants you counts towards accuracy as well.

actors.hero.skills.weaponbond.name=Weapon Bond
actors.hero.skills.weaponbond.desc=Your bonded blade cuts deeper.

actors.hero.skills.blademastery.name=Blade Mastery
actors.hero.skills.blademastery.desc=Melee weapons receive a bonus to level.

actors.hero.skills.trueedge.name=True Edge
actors.hero.skills.trueedge.desc=You find the true edge of the blade. Melee hits have a 5% chance per level to land as a critical for 75% extra damage, doubled to a maximum of 30% against a target that is vulnerable, crippled or bleeding. Thrown weapons cannot crit.

actors.hero.skills.finessegrip.name=Finesse Grip
actors.hero.skills.finessegrip.desc=A light hand on a light blade. While unarmed or wielding a tier 1-3 melee weapon you deal 5% more damage per level, gain 3 accuracy per level, and have a 3% chance per level to slip aside from an attack made at a distance. Heavier weapons blunt all of it.

actors.hero.skills.brutalgrip.name=Brutal Grip
actors.hero.skills.brutalgrip.desc=Both hands, all your weight. While wielding a tier 4 or 5 melee weapon you deal 7% more damage per level and melee hits have an 8% chance per level to cripple the target, but you take 3% more damage per level for over-committing. Lighter weapons get nothing.

actors.hero.skills.duelistactive.name=Techniques
actors.hero.skills.duelistactive.desc=Duelists win through superior technique.

actors.hero.skills.lunge.name=Lunge
actors.hero.skills.lunge.cast=Lunge!
actors.hero.skills.lunge.desc=A piercing lunge that hits for more damage. At max level, a target you lunge into is left vulnerable for 3 turns.

actors.hero.skills.ripostestance.name=Riposte
actors.hero.skills.ripostestance.cast=Riposte!
actors.hero.skills.ripostestance.desc=Strike and shove your opponent off balance.

actors.hero.skills.whirlingflurry.name=Whirling Flurry
actors.hero.skills.whirlingflurry.cast=Flurry!
actors.hero.skills.whirlingflurry.desc=A whirling flurry - less damage per cut, but every enemy around you is cut open and left bleeding, one point deeper per level.

actors.hero.skills.impalingthrust.name=Impaling Thrust
actors.hero.skills.impalingthrust.cast=Thrust!
actors.hero.skills.impalingthrust.desc=Run everything in a line through. Skewers the first 2 + 1 per level cells ahead of you, dealing 0.65x to 0.95x of a weapon roll to each enemy caught and leaving them bleeding.
actors.hero.skills.impalingthrust.no_target=Nothing in your reach.

actors.hero.skills.duelistfourth.name=Footwork
actors.hero.skills.duelistfourth.desc=Duelists win the distance before they win the fight, punishing every swing that misses.

actors.hero.skills.sidestep.name=Sidestep
actors.hero.skills.sidestep.desc=Win the distance before the blow lands. 4% chance per level to slip an attack made at a distance entirely, before armour is even asked to help.

actors.hero.skills.fleche.name=Fleche
actors.hero.skills.fleche.cast=En garde!
actors.hero.skills.fleche.desc=A running attack that eats the distance. Closes on an enemy up to 3 + 1 per level cells away and opens with 1.15x to 1.45x of a weapon roll.
actors.hero.skills.fleche.no_target=No target within reach.
actors.hero.skills.fleche.no_room=No room to close in.

actors.hero.skills.countertime.name=Counter-Time
actors.hero.skills.countertime.desc=You do not wait out the attack, you time it. 10% chance per level that an adjacent attacker's blow only half lands and takes half of one of your own weapon rolls in return.

actors.hero.skills.pirouette.name=Pirouette
actors.hero.skills.pirouette.cast=Out of measure!
actors.hero.skills.pirouette.desc=Turn out of the duel and let it reset. Unseen for 2 + 1 per level turns and shielded for 3 per level, so you choose when the next exchange starts.

actors.hero.skills.bladebind.name=Blade Bind
actors.hero.skills.bladebind.cast=Bound!
actors.hero.skills.bladebind.desc=Catch the enemy's blade and refuse to let go. A target within 3 cells is crippled for 3 + 2 per level turns and left vulnerable for 3 + 1 per level, and at max level weakened too. It cannot leave the measure you set.
actors.hero.skills.bladebind.no_target=No blade within reach to bind.


###cleric

actors.hero.skills.clericpassivea.name=Cleric
actors.hero.skills.clericpassivea.desc=Clerics draw strength from unshakable faith.

actors.hero.skills.faith.name=Faith
actors.hero.skills.faith.desc=+5 to mana per level. At the third level your reserve is truly devout: while you are below half health, your mana also returns faster.

actors.hero.skills.grace.name=Grace
actors.hero.skills.grace.desc=Increased mana regeneration.

actors.hero.skills.sanctuary.name=Sanctuary
actors.hero.skills.sanctuary.desc=When activated, you take 5% less damage and 10% of the rest per level is taken from mana when possible. At the third level the ward is efficient, soaking two damage for every point of mana it burns.

actors.hero.skills.lastrites.name=Last Rites
actors.hero.skills.lastrites.desc=When a blow would kill you and you hold at least %1$d mana, that much mana is spent to survive at 1 health, mend 2 health per level and bless you for 5 + 5 per level turns.
actors.hero.skills.lastrites.trigger=Your last rites hold death at bay!

actors.hero.skills.asceticvow.name=Ascetic Vow
actors.hero.skills.asceticvow.desc=Your mana returns markedly faster, but the weapon in your hands deals 5% less damage per level.\nTaking this vow locks out Blood Tithe.

actors.hero.skills.bloodtithe.name=Blood Tithe
actors.hero.skills.bloodtithe.desc=A landed melee blow has a 25% chance per level to tithe 1 mana back to you, but you fight with your guard down and take 4% more damage per level.\nTaking this tithe locks out Ascetic Vow.

actors.hero.skills.clericpassiveb.name=Zeal
actors.hero.skills.clericpassiveb.desc=Clerics smite with righteous fervor.

actors.hero.skills.righteousstrikes.name=Righteous Strikes
actors.hero.skills.righteousstrikes.desc=Increased chance of hitting with melee weapons, and your blows bite the undead and the demonic for 2 extra damage per level.

actors.hero.skills.zealpassive.name=Fervor
actors.hero.skills.zealpassive.desc=Holy fervor - melee blows land harder.

actors.hero.skills.sacredweapon.name=Sacred Weapon
actors.hero.skills.sacredweapon.desc=Your weapon is blessed with a bonus to level.

actors.hero.skills.divinewrath.name=Divine Wrath
actors.hero.skills.divinewrath.desc=Every landed blow burns %1$d mana for 2 + 2 per level extra damage, doubled against the undead and the demonic and halved at range. Nothing happens when your mana runs dry.

actors.hero.skills.crusaderszeal.name=Crusader's Zeal
actors.hero.skills.crusaderszeal.desc=Your melee blows land 5% harder per level and have an 8% chance per level to cripple what they hit.\nTaking this zeal locks out Shield of the Faithful.

actors.hero.skills.shieldofthefaithful.name=Shield of the Faithful
actors.hero.skills.shieldofthefaithful.desc=You take 5% less damage per level, and have a 5% chance per level to turn aside an attack from a distance entirely.\nRaising this shield locks out Crusader's Zeal.

actors.hero.skills.clericactive.name=Miracles
actors.hero.skills.clericactive.desc=Clerics channel miracles through prayer.

actors.hero.skills.holysmite.name=Holy Smite
actors.hero.skills.holysmite.cast=Smite!
actors.hero.skills.holysmite.desc=Channel holy wrath into your strikes: while active, every blow burns mana to land 10% harder per level. At the third level a smitten blow also splashes into every adjacent enemy, for a second helping of mana.

actors.hero.skills.healingprayer.name=Healing Prayer
actors.hero.skills.healingprayer.cast=Mend
actors.hero.skills.healingprayer.desc=A prayer that mends your wounds (5 + 5 per level HP).

actors.hero.skills.guardianspirit.name=Guardian Spirit
actors.hero.skills.guardianspirit.cast=Watch over me
actors.hero.skills.guardianspirit.desc=Summons a guardian spirit that fights by your side (15 + 10 health per level). At the third level a choir of two answers instead, when there is room for both, for half again the mana.

actors.hero.skills.avataroflight.name=Avatar of Light
actors.hero.skills.avataroflight.cast=Be my light!
actors.hero.skills.avataroflight.desc=You become a beacon for 4 + 3 per level turns: blessed, hasted and full of adrenaline, behind a barrier of 8 + 7 per level. Every ally in sight is blessed, spurred on and healed for 3 per level.

actors.hero.skills.clericfourth.name=Inquisition
actors.hero.skills.clericfourth.desc=Inquisitors judge the unholy: brand them, burn them, and break their nerve.

actors.hero.skills.condemn.name=Condemn
actors.hero.skills.condemn.desc=Your blows brand their target vulnerable for 3 + 1 per level turns - always against the undead and the demonic, otherwise on a 12% chance per level. The branded unholy also take 2 damage per level.

actors.hero.skills.scouringflame.name=Scouring Flame
actors.hero.skills.scouringflame.cast=Burn clean!
actors.hero.skills.scouringflame.desc=A lance of white fire for 4 + 3 per level damage, doubled against the undead and the demonic, leaving the target blind for 2 + 1 per level turns.
actors.hero.skills.scouringflame.no_target=No target there.

actors.hero.skills.reckoning.name=Reckoning
actors.hero.skills.reckoning.cast=Judgement!
actors.hero.skills.reckoning.desc=Judgement falls on every enemy in sight within %1$d tiles, leaving them vulnerable for 4 turns. The undead and the demonic also take 4 + 4 per level holy damage and flee in terror for 3 + 2 per level turns.


###subclass branches

actors.hero.skills.subbranch.berserker.name=Berserker
actors.hero.skills.subbranch.berserker.desc=The berserker trades everything for fury.
actors.hero.skills.subbranch.gladiator.name=Gladiator
actors.hero.skills.subbranch.gladiator.desc=The gladiator owns the arena.
actors.hero.skills.subbranch.battlemage.name=Battlemage
actors.hero.skills.subbranch.battlemage.desc=The battlemage weaves steel and spell.
actors.hero.skills.subbranch.warlock.name=Warlock
actors.hero.skills.subbranch.warlock.desc=The warlock bargains with darker powers.
actors.hero.skills.subbranch.assassin.name=Assassin
actors.hero.skills.subbranch.assassin.desc=The assassin ends fights before they begin.
actors.hero.skills.subbranch.freerunner.name=Freerunner
actors.hero.skills.subbranch.freerunner.desc=The freerunner never stops moving.
actors.hero.skills.subbranch.sniper.name=Sniper
actors.hero.skills.subbranch.sniper.desc=The sniper makes every shot count.
actors.hero.skills.subbranch.warden.name=Warden
actors.hero.skills.subbranch.warden.desc=The warden is one with the wild.
actors.hero.skills.subbranch.champion.name=Champion
actors.hero.skills.subbranch.champion.desc=The champion leads from the front.
actors.hero.skills.subbranch.monk.name=Monk
actors.hero.skills.subbranch.monk.desc=The monk needs no weapon at all.
actors.hero.skills.subbranch.priest.name=Priest
actors.hero.skills.subbranch.priest.desc=The priest keeps everyone standing.
actors.hero.skills.subbranch.paladin.name=Paladin
actors.hero.skills.subbranch.paladin.desc=The paladin is a bulwark of the light.

actors.hero.skills.carnage.name=Carnage
actors.hero.skills.carnage.desc=+8% melee damage per level.

actors.hero.skills.bloodrush.name=Blood Rush
actors.hero.skills.bloodrush.cast=BLOOD!
actors.hero.skills.bloodrush.desc=A rush of blood - adrenaline surges for 3 + 2 per level turns.

actors.hero.skills.undyingwill.name=Undying Will
actors.hero.skills.undyingwill.cast=I will not fall
actors.hero.skills.undyingwill.desc=Sheer will forms a shield of 5 + 5 per level.

actors.hero.skills.comboopener.name=Combo Opener
actors.hero.skills.comboopener.desc=+2 melee accuracy per level.

actors.hero.skills.warcry.name=War Cry
actors.hero.skills.warcry.cast=RAAAAH!
actors.hero.skills.warcry.desc=A terrifying war cry - enemies in sight flee for 2 + 1 per level turns.

actors.hero.skills.finishingblow.name=Finishing Blow
actors.hero.skills.finishingblow.cast=Finish him!
actors.hero.skills.finishingblow.desc=Melee hits execute enemies below 5% health per level.

actors.hero.skills.spellblade.name=Spell Blade
actors.hero.skills.spellblade.desc=Melee hits have a 15% chance per level to restore 2 mana.

actors.hero.skills.manashield.name=Mana Shield
actors.hero.skills.manashield.cast=Arcane ward
actors.hero.skills.manashield.desc=Weave mana into a shield of 4 + 4 per level.

actors.hero.skills.arcaneecho.name=Arcane Echo
actors.hero.skills.arcaneecho.desc=Melee hits have a 10% chance per level to echo as arcane damage.

actors.hero.skills.souldrain.name=Soul Drain
actors.hero.skills.souldrain.desc=Melee hits have a 10% chance per level to drain 1-3 health.

actors.hero.skills.hex.name=Hex
actors.hero.skills.hex.cast=Suffer
actors.hero.skills.hex.desc=Hexes the nearest enemy in sight - weakened and vulnerable for 3 + 2 per level turns.

actors.hero.skills.darkpact.name=Dark Pact
actors.hero.skills.darkpact.cast=My blood, my power
actors.hero.skills.darkpact.desc=Trade 10% of your max health for 10 + 5 per level mana.

actors.hero.skills.ambush.name=Ambush
actors.hero.skills.ambush.desc=+25% damage per level against sleeping or unaware prey.

actors.hero.skills.garrote.name=Garrote
actors.hero.skills.garrote.desc=Melee hits have a 10% chance per level to cause bleeding.

actors.hero.skills.vanish.name=Vanish
actors.hero.skills.vanish.cast=...
actors.hero.skills.vanish.desc=Melt into the shadows - invisible for 5 + 3 per level turns.

actors.hero.skills.slipstream.name=Slipstream
actors.hero.skills.slipstream.cast=Catch me!
actors.hero.skills.slipstream.desc=A burst of speed - hasted for 5 + 3 per level turns.

actors.hero.skills.parkour.name=Parkour
actors.hero.skills.parkour.desc=Roll with blows - take 5% less damage per level.

actors.hero.skills.momentummaster.name=Momentum Master
actors.hero.skills.momentummaster.desc=Kills grant 2 turns of haste per level.

actors.hero.skills.overwatch.name=Overwatch
actors.hero.skills.overwatch.desc=+8% ranged damage per level.

actors.hero.skills.headshot.name=Head Shot
actors.hero.skills.headshot.cast=Head shot!
actors.hero.skills.headshot.desc=Ranged hits have a 5% chance per level to strike true for double damage.

actors.hero.skills.piercingfocus.name=Piercing Focus
actors.hero.skills.piercingfocus.cast=Focus...
actors.hero.skills.piercingfocus.desc=Total focus - blessed accuracy and evasion for 5 + 5 per level turns.

actors.hero.skills.thorns.name=Thorns
actors.hero.skills.thorns.desc=Attackers take 2 damage per level in return.

actors.hero.skills.symbiosis.name=Symbiosis
actors.hero.skills.symbiosis.desc=Nature mends you - regenerate health faster.

actors.hero.skills.wildcall.name=Wild Call
actors.hero.skills.wildcall.cast=To me!
actors.hero.skills.wildcall.desc=Call a wild beast to fight beside you.

actors.hero.skills.banner.name=Banner
actors.hero.skills.banner.desc=+5% melee damage per level - fight like a champion.

actors.hero.skills.secondwind.name=Second Wind
actors.hero.skills.secondwind.cast=Not yet!
actors.hero.skills.secondwind.desc=Catch your second wind - heal 10% of max health per level.

actors.hero.skills.challenge.name=Challenge
actors.hero.skills.challenge.cast=Face me!
actors.hero.skills.challenge.desc=Challenge everything in sight to come face you.

actors.hero.skills.pressurepoint.name=Pressure Point
actors.hero.skills.pressurepoint.desc=Melee hits have an 8% chance per level to paralyze for a turn.

actors.hero.skills.innerpeace.name=Inner Peace
actors.hero.skills.innerpeace.desc=Increased mana regeneration.

actors.hero.skills.dragonkick.name=Dragon Kick
actors.hero.skills.dragonkick.cast=HWAAA!
actors.hero.skills.dragonkick.desc=A spinning kick - damages and shoves everyone around you.

actors.hero.skills.litany.name=Litany
actors.hero.skills.litany.desc=A healing litany - regenerate health faster.

actors.hero.skills.massheal.name=Mass Heal
actors.hero.skills.massheal.cast=Be mended!
actors.hero.skills.massheal.desc=Heals you and every ally in sight for 5 + 5 per level.

actors.hero.skills.purify.name=Purify
actors.hero.skills.purify.cast=Begone!
actors.hero.skills.purify.desc=Purge poison, crippling, weakness, blindness, bleeding and vulnerability.

actors.hero.skills.aegis.name=Aegis
actors.hero.skills.aegis.desc=Take 5% less damage per level.

actors.hero.skills.holycharge.name=Holy Charge
actors.hero.skills.holycharge.cast=For the light!
actors.hero.skills.holycharge.desc=Charge blessed and hasted into battle.

actors.hero.skills.retribution.name=Retribution
actors.hero.skills.retribution.desc=Attackers suffer 2 holy damage per level in return.

