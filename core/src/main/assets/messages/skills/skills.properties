actors.hero.skills.meteorcall.cast=Fall!
actors.hero.skills.meteorcall.desc=Mark a visible tile and a meteor crashes down on it next turn, blasting and burning every enemy in a 3x3 area. The center takes half again as much.\n\n_+1:_ Range _7_. Deals _240-480%_ of your damage.\n\n_+2:_ Range _9_. Deals _320-640%_ of your damage.\n\n_+3:_ Range _11_. Deals _400-800%_ of your damage. The impact stuns, and the ground erupts again one turn later.
