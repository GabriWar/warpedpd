actors.hero.skills.smash.no_target=Выберите видимого соседнего врага. На боссов приём не действует.
actors.hero.skills.guardianspirit.no_line=Страж не может напрямую поразить этого врага в пределах 6 клеток.
actors.hero.skills.shadowclone.no_target=Верёвке здесь не за что зацепиться или негде безопасно приземлиться.
actors.hero.skills.guardianspirit.too_far=Стража можно призвать только в видимую клетку в пределах 6 клеток.
actors.hero.skills.magepassiveb.desc=Палочки, чистая магия и слуги, подчинённые воле Мага.
actors.hero.skills.skill.fail_advance=Для развития этой ветви не хватает очков навыков.
actors.hero.skills.warriorpassiveb.desc=Воин побеждает грубой силой и оружием в руках.
actors.hero.skills.phantomstrike.prompt=Выберите место появления теней или тень, с которой хотите поменяться местами.
actors.hero.skills.doublestab.marked=Метка: второй удар поразит %s, пока цель остаётся в пределах досягаемости.
actors.hero.skills.magefourth.desc=Повелители стихий обрушивают на подземелье огонь, лёд и бури.
actors.hero.skills.roguepassivea.desc=Разбойники живут ловкими руками и тихими шагами: монеты, замки и тени — их стихия.
actors.hero.skills.smash.landing=Выберите клетку или врага для приземления в пределах %d клеток от схваченной цели.
actors.hero.skills.souldetonation.choose=Выберите видимое призванное существо для жертвоприношения или принесите в жертву сразу до трёх.
actors.hero.skills.roguefourth.desc=Ужас охватывает всех ещё до первого убийства, а затем питается возникшей паникой.
actors.hero.skills.roguepassiveb.desc=Разбойники полагаются на яд и внезапные удары, чтобы убивать быстро и мучительно.
actors.hero.skills.doublestab.link_desc=Урон одному из связанных врагов наносит другому %1$d%% этого урона. Осталось ходов: %2$d.
actors.hero.skills.rogueactive.desc=Уловки, бомбы и верёвка: Разбойник никогда не сражается там, где его ждут.
actors.hero.skills.clericfourth.desc=Инквизиторы судят нечистых, клеймят, сжигают и ломают их волю.
actors.hero.skills.clericpassiveb.desc=Оружие Жреца — сосуд святого света, бьющий с праведным рвением.
actors.hero.skills.doubleshot.marked=Метка: второй выстрел поразит %s, пока к нему есть прямая линия стрельбы.
actors.hero.skills.clericpassivea.desc=Вера Жреца — неиссякаемый источник маны. Она откликается, когда смерть близка.
actors.hero.skills.huntresspassiveb.desc=Каждая стрела находит цель: Охотница превращает расстояние в преимущество.
actors.hero.skills.branchskill.invested_tree=В это древо вложено %1$d очков: %2$d в навыки и %3$d в таланты.
actors.hero.skills.massheal$wings.desc=Крылья света каждый ход исцеляют вас и ближайших союзников.\n\nОсталось ходов: %d
actors.hero.skills.branchskill.invested_all=На всё древо развития потрачено %1$d очков — на навыки и таланты вместе.
actors.hero.skills.wildcall$spirithunt.desc=Духовный волк преследует это существо и кусает его каждый ход.\n\nОсталось ходов: %d
actors.hero.skills.clericactive.desc=Жрецы призывают чудеса: карающий свет, исцеляющие молитвы и духовного стража.
actors.hero.skills.doublestab.focus_desc=Урон этой цели вызывает второй удар с бонусом %1$d%% к урону. Осталось ходов: %2$d.
actors.hero.skills.huntressfourth.desc=Расставленные заранее ловушки заставляют саму землю сражаться за Охотницу.
actors.hero.skills.warriorfourth.desc=Воеводы ломают врагам ноги и волю, а затем призывают щитоносца держать строй.
actors.hero.skills.bandit$pickpocketed.desc=Герой уже обчистил карманы этого существа. Украсть больше нечего.
actors.hero.skills.warriorpassivea.desc=Тело Воина отказывается падать: выдерживает удар, затягивает раны и продолжает сражаться.
actors.hero.skills.sixthsense$warned.desc=Шестое чувство только что предупредило вас об опасности. Ему нужно время, чтобы снова сработать.\n\nОсталось ходов: %d
actors.hero.skills.huntresspassivea.desc=Охотница понимает природу: острое чутьё, тихий шаг и терпение в засаде.
actors.hero.skills.magepassivea.desc=Внутренняя сила Мага: больший запас маны и защитные чары, расходующие её ради выживания.
actors.hero.skills.duelistactive.desc=Рывком вступайте в бой, кружитесь среди врагов, метайте клинок и ловите его на обратном пути.
actors.hero.skills.guardianspirit.command=Выберите уже разведанную клетку для охраны стражем или врага поблизости от него для выстрела лазером.
actors.hero.skills.weaponbond$bonded.desc=Ваш клинок всё ещё гудит после убийства. Следующая способность оружия ударит сильнее.\n\nЗарядов: %d
actors.hero.skills.demoralize$demoralized.desc=Это существо теряет боевой дух: его атаки наносят на %1$d%% меньше урона.\n\nОсталось ходов: %2$s.
actors.hero.skills.sorcerer$overload.desc=Внутри существа потрескивает магическая энергия. На следующем ходу она разрядится в него самого и во всех соседей.
actors.hero.skills.precision$gap.desc=Герой заметил брешь в защите существа. Удары по нему игнорируют броню.\n\nОсталось ходов: %s.
actors.hero.skills.mageactive.desc=Маги призывают крыс и скелетов в помощь. Одновременно можно удерживать 3 призванных существ плюс %1$d за навык «Призыватель».
actors.hero.skills.blademastery$read.desc=Герой разгадал манеру боя этого существа, и его удары теперь реже попадают по герою.\n\nОсталось ходов: %s.
actors.hero.skills.crusaderszeal$zeal.desc=Вокруг вас пылает огонь рвения. Каждый язык пламени усиливает удары в ближнем бою, пока враг не попадёт по вам.\n\nЯзыков пламени: %d
actors.hero.skills.duelistfourth.desc=Работа ног не даёт Дуэлянту стоять на месте: обходите врагов, налетайте и отступайте, рубите тех, кто пытается сбежать.
actors.hero.skills.huntressactive.desc=Охотница говорит при помощи лука: её стрелы не промахиваются, раздваиваются, взрываются или падают на врагов дождём.
actors.hero.skills.toughness$heldpain.desc=Тяжёлый удар, боль от которого вы подавили, всё ещё ранит вас понемногу каждый ход.\n\nОсталось урона: %1$d\n\nОсталось ходов: %2$d
actors.hero.skills.beartrap.trap_desc=Стальные челюсти ловушки удерживаются в раскрытом положении. Достаточно тяжёлое существо нажмёт на пластину — капкан схватит и раздерёт ему ногу.
actors.hero.skills.smash.no_landing=Выберите видимую точку приземления в пределах досягаемости: нужен свободный путь по дуге и место для посадки. В боссов и союзников врезаться нельзя.
actors.hero.skills.manashield$charged.desc=Осколки разрушенного магического щита гудят внутри вашего оружия. Каждый удар в ближнем бою расходует один осколок, нанося дополнительный магический урон.\n\nОсталось усиленных ударов: %d
actors.hero.skills.stoneskin$plates.desc=Некоторые каменные пластины вашей брони раскололись. Они постепенно отрастают по одной.\n\nЦелых пластин: %1$d\n\nСледующая восстановится через: %2$s ходов
actors.hero.skills.warcry.desc=Испустите боевой клич, и все видимые враги в ужасе побегут от вас.\n\n_+1:_ Враги убегают на _3 хода_.\n\n_+2:_ Враги убегают на _4 хода_.\n\n_+3:_ Враги убегают на _5 ходов_ и на столько же получают _ослабление_.
actors.hero.skills.brutalgrip.desc=С оружием 4–5-й ступени ваши удары в ближнем бою могут сокрушать врагов, нанося на _50%_ больше урона и вызывая _увечье_.\n\n_+1:_ Шанс _15%_.\n\n_+2:_ Шанс _25%_.\n\n_+3:_ Шанс _35%_, а сокрушённые враги отлетают назад на _2 клетки_.
actors.hero.skills.secondwind.desc=Переведите дух: способности оружия мгновенно восстановят заряды, вспыхнув зелёным светом.\n\n_+1:_ Восстанавливается _1 заряд_.\n\n_+2:_ Восстанавливается _2 заряда_.\n\n_+3:_ Восстанавливаются _3 заряда_, а запас зарядов можно _превысить на 1_.
actors.hero.skills.hex.desc=Прокляните видимого врага, чтобы он наносил меньше урона и получал больше.\n\n_+1:_ Проклятие действует _5 ходов_.\n\n_+2:_ Проклятие действует _7 ходов_.\n\n_+3:_ Проклятие действует _9 ходов_ и дополнительно калечит врага на _5 ходов_.
actors.hero.skills.predation.desc=Удары по врагу, у которого осталось не больше _40%_ здоровья, могут рвать его плоть и вызывать кровотечение.\n\n_+1:_ Шанс _25%_.\n\n_+2:_ Шанс _35%_.\n\n_+3:_ Шанс _45%_, а убийство истекающего кровью врага восстанавливает _3%_ максимального здоровья.
actors.hero.skills.hunting.desc=Удар по спящему или бродящему врагу оглушает его от неожиданности.\n\n_+1:_ Оглушение на _2 хода_.\n\n_+2:_ Оглушение на _3 хода_.\n\n_+3:_ Оглушение на _4 хода_, а убийство такой добычи раскрывает ближайшего скрытого врага на _10 ходов_.
actors.hero.skills.hurl$hurlcombo.desc=Вы удачно метаете оружие одно за другим. Каждое попадание приёмом «Бросок» увеличивает комбо, повышая урон следующего броска. Промах или 5 ходов без попадания сбрасывают комбо.\n\nКомбо: %1$d (+%2$d%% урона)\n\nОсталось ходов: %3$s
actors.hero.skills.accuracy.desc=Дальние атаки могут попадать врагам в глаза. Точное попадание ослепляет цель на 3 хода.\n\n_+1:_ Шанс точного попадания _10%_.\n\n_+2:_ Шанс _20%_.\n\n_+3:_ Шанс _30%_, а первое дальнее попадание по каждому врагу всегда будет точным.
actors.hero.skills.mastery.desc=Вы держите противников на расстоянии оружием: когда враг подходит вплотную, вы можете ударить прежде, чем он замахнётся.\n\n_+1:_ _30%_ шанс ударить первым.\n\n_+2:_ Шанс _45%_.\n\n_+3:_ Шанс _60%_, а поражённый враг отбрасывается на _1 клетку_.
actors.hero.skills.emberarrows.desc=Пока способность включена, ваши дальние попадания поджигают цель.\n\n_+1:_ Цель _загорается_.\n\n_+2:_ Пламя перекидывается на _1 врага_ рядом с целью.\n\n_+3:_ Горящий враг, убитый выстрелом, _взрывается пламенем_, поджигая всех соседей.
actors.hero.skills.summoner.desc=Вы можете одновременно удерживать больше призванных слуг.\n\n_+1:_ Предел призыва повышается на _1_.\n\n_+2:_ Предел повышается на _2_.\n\n_+3:_ Предел повышается на _3_, а каждый призываемый слуга появляется _на уровень выше_.
actors.hero.skills.faith.desc=Раз за этаж, когда удар оставляет вам меньше половины здоровья, золотая вспышка в ответ на молитву возвращает ману.\n\n_+1:_ Восстанавливает _8 маны_.\n\n_+2:_ Восстанавливает _12 маны_.\n\n_+3:_ Восстанавливает _16 маны_ и отражает _6 единиц урона_ от этого удара.
actors.hero.skills.kneeshot.desc=Вы целитесь по ногам: дальние атаки могут калечить врагов.\n\n_+1:_ _10%_ шанс вызвать увечье на _4 хода_.\n\n_+2:_ _20%_ шанс на _5 ходов_.\n\n_+3:_ _30%_ шанс на _6 ходов_, а попадание по уже покалеченному врагу вызывает _кровотечение_.
actors.hero.skills.carnage.desc=Резня подпитывает ярость: каждое убийство в ближнем бою заполняет запас гнева.\n\n_+1:_ Убийство даёт _10%_ ярости.\n\n_+2:_ Даёт _20%_ ярости.\n\n_+3:_ Даёт _30%_ ярости, а убийство в состоянии берсерка пополняет его щит на _5%_ максимального здоровья.
actors.hero.skills.finessegrip.desc=Без оружия или с оружием 1–3-й ступени ваши удары в ближнем бою могут сопровождаться быстрым вторым выпадом на _40%_ урона основного удара.\n\n_+1:_ Шанс _15%_.\n\n_+2:_ Шанс _25%_.\n\n_+3:_ Шанс _35%_, а удачный второй удар может вызвать _третий_ с тем же шансом.
actors.hero.skills.countertime.desc=Уловите миг, когда враг выходит из вашей досягаемости, и нанесите ему напоследок удар в половину обычной силы оружия.\n\n_+1:_ _20%_ шанс ударить отступающего врага.\n\n_+2:_ Шанс _35%_.\n\n_+3:_ Шанс _50%_, а поражённый враг получает _увечье_ на 2 хода.
actors.hero.skills.panicharvest.desc=Попадание по убегающему, напуганному, обезумевшему или очарованному врагу превращает его страх в ману. Не чаще раза за ход.\n\n_+1:_ Восстанавливает _1 ману_.\n\n_+2:_ Восстанавливает _2 маны_.\n\n_+3:_ Восстанавливает _2 маны_, а убитый в панике враг пугает всех соседей на _3 хода_.
actors.hero.skills.aggression.desc=Если удар в ближнем бою убивает цель, взмах продолжается и поражает другого врага рядом с вами.\n\n_+1:_ Дополнительный удар наносит _40%_ урона.\n\n_+2:_ Наносит _60%_ урона.\n\n_+3:_ Наносит _80%_ урона и _продолжается снова_, если убивает врага.
actors.hero.skills.pressurepoint.desc=Бейте по нервным точкам, чтобы обездвижить противника.\n\n_+1:_ Удары в ближнем бою имеют _10%_ шанс парализовать не-босса на 1 ход.\n\n_+2:_ Шанс повышается до _15%_.\n\n_+3:_ Шанс повышается до _20%_, а удары по парализованным целям наносят _на 50% больше_ урона.
actors.hero.skills.pyreaffinity.desc=Ваши выстрелы палочками и боевые заклинания могут поджигать поражённых врагов. Несовместимо с Криомантией.\n\n_+1:_ Шанс поджечь _12%%_.\n\n_+2:_ Шанс _24%%_.\n\n_+3:_ Шанс _36%%_, а огонь перекидывается на одного соседнего врага.
actors.hero.skills.zealpassive.desc=Убийство в ближнем бою разжигает святое пламя. Следующий удар в течение _5 ходов_ вызовет огненную вспышку.\n\n_+1:_ Вспышка наносит _80%_ вашего урона.\n\n_+2:_ Наносит _140%_ урона.\n\n_+3:_ Наносит _200%_ урона и охватывает всех врагов рядом с целью.
actors.hero.skills.bloodthirst.desc=Ваши удары в ближнем бою подрывают дух врага, уменьшая наносимый им урон.\n\n_+1:_ Урон снижается на _5%_.\n\n_+2:_ На _10%_.\n\n_+3:_ На _20%_, а после _5 успешных ударов подряд_ враг будет _напуган_. Промах сбрасывает счётчик.
actors.hero.skills.demoralize.desc=Ваши удары в ближнем бою подрывают дух врага, уменьшая наносимый им урон.\n\n_+1:_ Урон снижается на _5%_.\n\n_+2:_ На _10%_.\n\n_+3:_ На _20%_, а после _5 успешных ударов подряд_ враг будет _напуган_. Промах сбрасывает счётчик.
actors.hero.skills.spirituality.desc=Полученные удары высвобождают ману, но не больше силы самого удара.\n\n_+1:_ Каждый удар восстанавливает до _2 маны_.\n\n_+2:_ До _3 маны_.\n\n_+3:_ До _4 маны_. Если запас маны полон, энергия вместо этого поражает нападающего на ту же величину.
actors.hero.skills.blademastery.desc=Вы изучаете каждого поражённого врага: на нём появляется небольшая метка клинка, а его атаки реже попадают по вам.\n\n_+1:_ Его удары промахиваются на _10%_ чаще.\n\n_+2:_ На _20%_ чаще.\n\n_+3:_ На _30%_ чаще, а изучение врага также распространяется на соседних противников.
actors.hero.skills.rampage.desc=Пока способность активна, каждый ваш удар в ближнем бою поражает всех соседних врагов, включая основную цель, и расходует ману.\n\n_+1:_ Каждый поражённый враг получает _60%_ урона.\n\n_+2:_ Получает _80%_ урона.\n\n_+3:_ Получает _полный_ урон и начинает _истекать кровью_.
actors.hero.skills.healingprayer.desc=Помолитесь под крыльями серафима, и ваши раны мгновенно затянутся.\n\n_+1:_ Восстановление _10%_ максимального здоровья.\n\n_+2:_ _15%_ максимального здоровья.\n\n_+3:_ _20%_ максимального здоровья. Избыточное лечение превращается в _световой барьер_ прочностью до _20%_ максимального здоровья.
actors.hero.skills.meditation.desc=Стойте неподвижно, пока врагов не видно, и каждые _5 ходов_ спокойный импульс будет восстанавливать ману.\n\n_+1:_ Импульс даёт _2 маны_.\n\n_+2:_ Даёт _3 маны_.\n\n_+3:_ Даёт _4 маны_ и исцеляет видимых призванных существ на _10%_ их максимального здоровья.
actors.hero.skills.venom.desc=Ваш клинок покрыт ядом, способным отравлять поражённые цели.\n\n_+1:_ Удары в ближнем бою имеют _10%_ шанс отравить на _3 хода_.\n\n_+2:_ _20%_ шанс на _4 хода_.\n\n_+3:_ _30%_ шанс на _5 ходов_, а внезапная атака в ближнем бою _всегда_ отравляет.
actors.hero.skills.poise.desc=Каждое убийство успокаивает дыхание и придаёт твёрдости шагам.\n\n_+1:_ Убийство лечит на _1%_ максимального здоровья.\n\n_+2:_ На _2%_ максимального здоровья.\n\n_+3:_ На _3%_ максимального здоровья и даёт _краткий прилив скорости_.
actors.hero.skills.serenefocus.desc=Пока запас маны заполнен минимум на _три четверти_, ваши выстрелы палочками замедляют поражённых врагов. Несовместимо с Железной волей.\n\n_+1:_ Замедляет на _2 хода_.\n\n_+2:_ На _3 хода_.\n\n_+3:_ На _4 хода_, а также замедляет врагов рядом с целью.
actors.hero.skills.creepingdread.desc=Ваши удары в ближнем бою могут вселять ужас во врагов.\n\n_+1:_ _8%_ шанс напугать на _4 хода_.\n\n_+2:_ _16%_ шанс на _5 ходов_.\n\n_+3:_ _24%_ шанс на _6 ходов_, а страх _распространяется_ на всех врагов рядом с целью.
actors.hero.skills.darkpact.desc=Пожертвуйте десятой частью максимального здоровья ради прилива маны. Пакт не потребует жертвы, которая могла бы вас убить.\n\n_+1:_ Восстанавливает _15 маны_.\n\n_+2:_ _20 маны_.\n\n_+3:_ _25 маны_, а пролитая кровь ранит каждого соседнего врага на половину пожертвованного здоровья.
actors.hero.skills.regeneration.desc=Убийство последнего видимого врага позволяет перевести дух и восстановить часть недостающего здоровья.\n\n_+1:_ Восстанавливает _15%_ недостающего здоровья.\n\n_+2:_ _25%_ недостающего здоровья.\n\n_+3:_ _35%_, а передышка ещё снимает _кровотечение, отравление и увечье_.
actors.hero.skills.aimedshot.desc=Пока способность включена, каждый дальний удар расходует ману и пригвождает цель к месту. Одновременно может действовать только один навык из трёх: «Прицельный выстрел», «Двойной выстрел» или «Бомбардировка».\n\n_+1:_ Обездвиживает на _2 хода_.\n\n_+2:_ На _3 хода_.\n\n_+3:_ На _4 хода_, а убийство прицельным выстрелом возвращает затраченную ману.
actors.hero.skills.sidestep.desc=Переместитесь с одной соседней с врагом клетки на другую, обойдя его: противник ударит по пустоте и окажется _ошеломлён_.\n\n_+1:_ Ошеломление на _1 ход_.\n\n_+2:_ На _2 хода_.\n\n_+3:_ На _3 хода_, а следующий удар по обойдённому врагу _гарантированно попадёт_ и нанесёт на _30%_ больше урона.
actors.hero.skills.ambush.desc=Первая внезапная атака по каждому врагу, ближняя или метательная, вонзает теневой кол в его тень и _пригвождает_ его к месту.\n\n_+1:_ Обездвиживает на _2 хода_.\n\n_+2:_ На _3 хода_.\n\n_+3:_ На _4 хода_, а все враги рядом с целью тоже будут _пригвождены_.
actors.hero.skills.locksmith.desc=Вы чувствуете, как нажимается пластина ловушки, и успеваете заклинить механизм до срабатывания.\n\n_+1:_ _33%_ шанс обезвредить ловушку под ногами.\n\n_+2:_ _66%_ шанс.\n\n_+3:_ _99%_ шанс, а изучение заклиненного механизма _обнаруживает все скрытые ловушки_ в радиусе _3 клеток_.
actors.hero.skills.grace.desc=Каждый убитый враг выпускает частицу света, которая возвращается к вам в виде маны.\n\n_+1:_ Убийство возвращает _1 ману_.\n\n_+2:_ _2 маны_.\n\n_+3:_ _3 маны_. Если запас маны полон, свет вместо этого восстанавливает _3%_ максимального здоровья.
actors.hero.skills.ninjabomb.desc=Бросьте дымовую бомбу. Дым скроет вас и усыпит ближайших врагов.\n\n_+1:_ Враги в радиусе _1 клетки_ засыпают.\n\n_+2:_ В радиусе _2 клеток_.\n\n_+3:_ В радиусе _3 клеток_, а _дымный двойник_ остаётся на _5 ходов_, отвлекая их.
actors.hero.skills.piercingfocus.desc=Окиньте прицелом всех видимых врагов: каждый окажется под подавляющим огнём, и его точность и уклонение снизятся вдвое.\n\n_+1:_ Подавление на _5 ходов_.\n\n_+2:_ На _7 ходов_.\n\n_+3:_ На _9 ходов_, а вы будете ощущать всех врагов на этаже _10 ходов_.
actors.hero.skills.hamstring.desc=Ваши удары в ближнем бою могут подрезать врагам сухожилия, калеча их.\n\n_+1:_ _8%_ шанс увечья на _4 хода_.\n\n_+2:_ _16%_ шанс на _5 ходов_.\n\n_+3:_ _24%_ шанс на _6 ходов_. Удар по уже покалеченному врагу ломает ему ноги, обездвиживая на _2 хода_.
actors.hero.skills.whirlingflurry.desc=Кружитесь на месте, рубя всех соседних врагов.\n\n_+1:_ Наносит каждому соседнему врагу _70%_ урона оружия.\n\n_+2:_ Наносит _90%_ урона, а порезы вызывают _кровотечение_.\n\n_+3:_ Наносит _110%_ урона, а _призрачные сабли_ вращаются вокруг вас 3 хода, разя соседних врагов.
actors.hero.skills.garrote.desc=Удар со спины затягивает проволочную петлю на шее врага, который занят боем с кем-то другим — вашей тенью, двойником, союзником или обезумевшим существом. Такой удар всегда вызывает кровотечение.\n\n_+1:_ Сила кровотечения _3_.\n\n_+2:_ Сила _4_.\n\n_+3:_ Сила _5_, а удавка накладывает _увечье_ на _2 хода_.
actors.hero.skills.lonewolf.desc=Если рядом нет союзников, а на этаже нет ваших призванных существ (собственные призрачные образы не считаются), каждое убийство вызывает вой, обращающий в бегство врагов в радиусе 2 клеток.\n\n_+1:_ Враги бегут _2 хода_.\n\n_+2:_ _3 хода_.\n\n_+3:_ _4 хода_, а убийство восстанавливает _5%_ вашего здоровья.
actors.hero.skills.impalingthrust.desc=Сделайте выпад по прямой, пронзая всех врагов в пределах досягаемости на _80%_ урона оружия и вызывая кровотечение.\n\n_+1:_ Досягаемость _3 клетки_.\n\n_+2:_ _4 клетки_.\n\n_+3:_ _5 клеток_, а в следующие 2 хода по траектории выпада вырастают _призрачные копья_.
actors.hero.skills.aplomb.desc=Слабые удары существ отскакивают от вас, не оставляя следа.\n\n_+1:_ Отражаются удары силой до _3%_ максимального здоровья.\n\n_+2:_ До _5%_, а нападающий в ближнем бою при отражении удара _ошеломляется_ на _2 хода_.\n\n_+3:_ До _7%_, а нападающий также _пропускает следующий ход_.
actors.hero.skills.bladebind.desc=Скрестите клинки с соседним врагом: металл лязгнет, а удары противника _ослабнут_.\n\n_+1:_ Ослабление на _4 хода_.\n\n_+2:_ На _6 ходов_.\n\n_+3:_ На _8 ходов_. Кроме того, вы выведете врага из равновесия: его следующая атака _промахнётся_, а он станет _уязвимым_ на 3 хода.
actors.hero.skills.headshot.desc=Иногда дальний удар попадает врагу в голову, нанося _150%_ урона и сбивая с ног на 1 ход.\n\n_+1:_ _10%_ шанс попадания в голову.\n\n_+2:_ _15%_ шанс.\n\n_+3:_ _20%_ шанс, а звук удара заставляет соседних врагов _шататься_ на протяжении _3 ходов_.
actors.hero.skills.dreadhowl.desc=Вой, превращающий страх в безумие. Напуганные видимые враги в пределах _5 клеток_ начинают нападать на ближайших существ.\n\n_+1:_ Безумие длится _4 хода_.\n\n_+2:_ _5 ходов_.\n\n_+3:_ _6 ходов_, а ещё не испуганные враги будут _напуганы_ на 3 хода и подготовлены к следующему вою.
actors.hero.skills.momentummaster.desc=Если после убийства в ближнем бою рядом с вами не осталось врагов, вы прыгаете по дуге к ближайшему видимому противнику.\n\n_+1:_ Прыжок на расстояние до _2 клеток_.\n\n_+2:_ До _3 клеток_.\n\n_+3:_ До _4 клеток_, а следующий успешный удар в ближнем бою по этому врагу будет _ударом с наскока_ с бонусом _+50%_ урона.
actors.hero.skills.parrystance.desc=Отводите клинком удары соседних врагов, полностью отражая их и немедленно отвечая ударом на _60%_ силы оружия.\n\n_+1:_ Парируете _10%_ их ударов.\n\n_+2:_ _15%_ ударов.\n\n_+3:_ _20%_ ударов, а ответный выпад поражает _всех соседних врагов_.
actors.hero.skills.bloodtithe.desc=Если для навыка не хватает маны, вы оплачиваете недостающее кровью, но здоровье никогда не падает ниже 1.\n\n_+1:_ Тратится _3 здоровья_ за каждую единицу недостающей маны.\n\n_+2:_ _2 здоровья_ за единицу.\n\n_+3:_ _2 здоровья_ за единицу, а убийство в течение _3 ходов_ вернёт _половину_ потраченного здоровья.
actors.hero.skills.conditioning.desc=Когда удар оставляет вам меньше трети здоровья, тело собирается с силами и исцеляется. От смертельного удара это не спасёт.\n\n_+1:_ Раз за этаж восстанавливается _10%_ максимального здоровья.\n\n_+2:_ Раз за этаж _20%_.\n\n_+3:_ Восстанавливается _30%_, а эффект может сработать _дважды_ за этаж.
actors.hero.skills.fleche.desc=Стремительно налетите на врага, нанесите _130%_ урона оружия и отпрыгните в исходную клетку. Будучи обездвиженным, разбежаться нельзя.\n\n_+1:_ Дальность до _4 клеток_.\n\n_+2:_ До _5 клеток_.\n\n_+3:_ До _6 клеток_, а убийство приёмом «Флеш» _не расходует ману_.
actors.hero.skills.purify.desc=Вспышка чистого света сжигает яд, кровотечение, увечье, слабость, слепоту и уязвимость.\n\n_+1:_ Очищает вас.\n\n_+2:_ Также снимает _проклятие, деградацию и слизь_ и очищает всех видимых союзников.\n\n_+3:_ Также снимает с вас огонь, ужас и замедление и даёт _благословение на 2 хода_.
actors.hero.skills.asceticvow.desc=Здоровье, возвращённое вам молитвами «Исцеляющая молитва», «Массовое исцеление» и «Литания», также восполняет ману.\n\n_+1:_ _1 мана_ за каждые _6 единиц здоровья_.\n\n_+2:_ _1 мана_ за _5 здоровья_.\n\n_+3:_ _1 мана_ за _4 здоровья_, а каждая услышанная молитва даёт _благословение на 5 ходов_.
actors.hero.skills.litany.desc=Каждый применённый навык (кроме переключателей) звучит как строфа: раздаётся нота, исцеляющая вас и союзников в радиусе 2 клеток.\n\n_+1:_ Лечит на _2%_ максимального здоровья.\n\n_+2:_ На _4%_.\n\n_+3:_ На _6%_, а каждая _третья строфа_ дополнительно благословляет всех исцелённых на _3 хода_.

# Дополненные описания навыков: русский перевод
actors.hero.skills.endurance.desc=Стойте насмерть: полученные удары делают вас крепче. Каждый удар, полученный после хода, на котором вы не двигались, добавляет один заряд. Накопив достаточно зарядов, вы топаете по земле: пол растрескивается, враги вокруг оказываются _прикованы к месту на 3 хода_, а вы получаете барьер. Движение сбрасывает заряды.\n\n_+1:_ Топот после _5 ударов_: обездвиживает врагов в радиусе _1 клетки_, барьер составляет _4%_ максимального здоровья.\n\n_+2:_ После _4 ударов_: радиус _2 клетки_, барьер _7%_.\n\n_+3:_ После _3 ударов_: радиус _3 клетки_, барьер _10%_, а растрескавшаяся земля дополнительно _калечит_ врагов на _6 ходов_.
actors.hero.skills.toughness.desc=Когда удар отнимает не меньше _10%_ максимального здоровья, вы стискиваете зубы и откладываете боль: вместо мгновенного урона он постепенно наносится в течение следующих ходов. Одновременно можно отсрочить только один удар.\n\n_+1:_ Урон распределяется на _2 хода_.\n\n_+2:_ На _3 хода_.\n\n_+3:_ На _4 хода_, а убийство врага, нанёсшего удар, _отменяет_ оставшийся урон.
actors.hero.skills.laststand.desc=Если удар снижает ваше здоровье до четверти, вы твёрдо встаёте на ноги и создаёте барьер. Эффект может повториться через _40 ходов_.\n\n_+1:_ Барьер в размере _5%_ максимального здоровья.\n\n_+2:_ Барьер в размере _10%_.\n\n_+3:_ Барьер в размере _15%_; вдобавок вы топаете по земле, _оглушая_ всех соседних врагов на _2 хода_.
actors.hero.skills.stoneskin.desc=Кожу покрывают каменные пластины. Каждая поглощает до _10%_ вашего максимального здоровья от одного удара, после чего раскалывается и осыпает стоящего рядом нападающего осколками, нанося _40%_ вашего урона. Разбитые пластины восстанавливаются по одной каждые _10 ходов_.\n\n_+1:_ _1 пластина_.\n\n_+2:_ _2 пластины_.\n\n_+3:_ _3 пластины_; если пластина полностью поглотила удар, нападающий _оглушается_ на _2 хода_.
actors.hero.skills.firmhand.desc=Первый удар в ближнем бою по невредимому врагу _ошеломляет_ его. Если затем оттолкнуть такого врага способностью «Отбрасывание», «Раскол земли», «Прыжок» или похожим приёмом, он отлетит дальше и ударится обо всё, что преградит ему путь.\n\n_+1:_ Ошеломление длится _3 хода_, дополнительная дальность — _1 клетка_.\n\n_+2:_ Ошеломление длится _5 ходов_, дальность увеличивается на _2 клетки_, а столкновение ошеломляет того, в кого врезался враг.\n\n_+3:_ Ошеломление длится _7 ходов_; убийство ошеломлённого врага ошеломляет _всех соседних противников_.
actors.hero.skills.warbreaker.desc=Удары в ближнем бою могут проломить защиту врага: такой удар наносит на _30%_ больше урона и делает цель уязвимой.\n\n_+1:_ Вероятность _6%_, уязвимость на _4 хода_.\n\n_+2:_ Вероятность _12%_, уязвимость на _5 ходов_.\n\n_+3:_ Вероятность _18%_, уязвимость на _6 ходов_; все соседние с целью враги тоже становятся уязвимыми.
actors.hero.skills.smash.desc=Схватите соседнего врага и выберите, куда его бросить. При приземлении он получает _100% урона оружия_. Если бросить его в другого противника, пострадают _оба_, а также _оба будут парализованы на 1 ход_. Брошенный враг приземлится перед второй целью.\n\n_+1:_ Дальность броска до _3 клеток_.\n\n_+2:_ До _5 клеток_.\n\n_+3:_ До _7 клеток_.\n\nНа боссов способность не действует, в том числе при столкновениях. Огромные и неподвижные враги получают урон на месте. Бросок не проходит сквозь стены. Враги, брошенные в пропасть, падают как обычно, а приземление на ловушку приводит её в действие.
actors.hero.skills.knockback.desc=Пока способность удерживается, ваши удары в ближнем бою отбрасывают цель на одну клетку. Мана расходуется только при успешном отбрасывании.\n\n_+1:_ Удары с отбрасыванием наносят на _10%_ больше урона.\n\n_+2:_ На _20%_ больше урона.\n\n_+3:_ На _30%_ больше урона; если врагу некуда отступить, вместо этого он получает на _25%_ больше урона от _сокрушения_.
actors.hero.skills.earthshatter.desc=Ударьте по земле. Все враги в радиусе _2 клеток_ получают урон и обездвиживаются, после чего наружу расходятся кольца каменных копий. Каждое следующее кольцо бьёт сильнее и толкает врагов перед собой: оказавшийся на пути волны противник может получить урон от каждого кольца.\n\n_+1:_ Удар наносит _200%_ вашего урона и обездвиживает на _3 хода_. Затем идут _2 кольца_: первое наносит _100%_ вашего урона, каждое следующее — на _20%_ больше.\n\n_+2:_ Удар наносит _280%_ урона и обездвиживает на _4 хода_. Идут _3 кольца_: сначала _140%_ урона, прирост _40%_ за кольцо.\n\n_+3:_ Удар наносит _360%_ урона и обездвиживает на _5 ходов_. Идут _4 кольца_: сначала _180%_ урона, прирост _60%_ за кольцо; поражённые враги также получают _увечье_.
actors.hero.skills.ironstance.desc=Примите защитную стойку. Пока она удерживается, вы наносите на _15%_ меньше урона, зато можете полностью парировать удар врага в ближнем бою ценой маны. Когда мана заканчивается, стойка прекращается. Несовместима с «Безрассудной яростью».\n\n_+1:_ _15%_ вероятности парировать удар в ближнем бою.\n\n_+2:_ _30%_ вероятности.\n\n_+3:_ _45%_ вероятности; атакующий дополнительно получает _головокружение_ на _3 хода_.
actors.hero.skills.recklessfury.desc=Откажитесь от защиты: пока способность удерживается, вы получаете на _10%_ больше урона, а каждый пропущенный удар накапливает ярость. Следующий удар в ближнем бою расходует всю ярость для дополнительного урона и требует маны. Несовместима с «Железной стойкой».\n\n_+1:_ Ярость запасает _50%_ полученного вами урона.\n\n_+2:_ _75%_ полученного урона.\n\n_+3:_ _100%_ полученного урона; если удар с яростью убивает врага, неиспользованная ярость _переносится_ на следующий удар.
actors.hero.skills.shieldbearer.desc=Призовите верного щитоносца. Все враги в поле зрения переключаются на него. У щитоносца собственный запас здоровья — доля от вашего максимального, а его удары наносят долю вашего урона. Он держит оборону одни игровые сутки, после чего исчезает.\n\n_+1:_ Максимальное здоровье — _40%_ вашего; удары наносят _40%_ вашего урона.\n\n_+2:_ Здоровье — _55%_ вашего; урон — _50%_.\n\n_+3:_ Здоровье — _70%_ вашего; урон — _60%_; при появлении щитоносец бьёт щитом и отбрасывает соседних врагов на _1 клетку_.
actors.hero.skills.spiritarmor.desc=Пока способность действует, синяя защита поглощает часть урона каждого удара за счёт вашей маны (не менее 1 единицы маны за удар). Каждые _3 единицы маны_, потраченные на защиту, создают искру, которая кружит вокруг вас. Когда кольцо заполняется, все искры бьют ближайших врагов разрядами.\n\n_+1:_ Защита поглощает _10%_ каждого удара; кольцо вмещает _2 искры_.\n\n_+2:_ _20%_ урона; _3 искры_.\n\n_+3:_ _30%_ урона; _4 искры_; каждый залп даёт вам _2 хода_ Перезарядки.
actors.hero.skills.transcendence.desc=Пока способность действует, вы наполовину состоите из света. Попытка пройти через врага за _3 единицы маны_ переносит вас на свободную клетку за ним, а оставленный внутри свет пронзает цель лучом.\n\n_+1:_ Проход сквозь _1 врага_; луч наносит _60-120%_ вашего урона.\n\n_+2:_ Сквозь цепочку до _2 врагов_; каждому наносится _80-160%_.\n\n_+3:_ До _3 врагов_, по _100-200%_ каждому; луч _разделяется натрое_ за вашей спиной и наносит врагам впереди половину урона.
actors.hero.skills.willofiron.desc=Чем меньше остаётся маны, тем крепче ваша воля. Пока запас маны ниже половины, раз за ход вы бесплатно сдерживаете удар врага силой не менее _5%_ вашего максимального здоровья. Поглощённая сила сохраняется в посохе и добавляется к следующему разряду или атакующему заклинанию. Несовместима с «Безмятежным сосредоточением».\n\n_+1:_ Сдерживает _5%_ максимального здоровья; запасённая сила добавляет _40%_ вашего урона.\n\n_+2:_ Сдерживает _10%_ максимального здоровья; добавляет _80%_ вашего урона.\n\n_+3:_ Сдерживает _15%_ максимального здоровья; добавляет _120%_ вашего урона; можно хранить сразу _2 заряда_ сдержанной силы.
actors.hero.skills.wizard.desc=При использовании волшебной палочки потраченный заряд может отскочить от цели и наложить то же заклинание на ближайшего другого врага. Если рядом больше некого поразить, заряд возвращается в палочку.\n\n_+1:_ Вероятность _15%_.\n\n_+2:_ Вероятность _25%_.\n\n_+3:_ Вероятность _35%_; _последний заряд_ палочки всегда отскакивает, если рядом есть другой враг.
actors.hero.skills.sorcerer.desc=Атакующие разряды палочек могут перегрузить поражённого врага: в течение хода он искрится, а затем разряжает накопленную энергию в себя и соседних врагов, нанося половину урона палочки.\n\n_+1:_ Вероятность перегрузки _20%_.\n\n_+2:_ Вероятность _35%_.\n\n_+3:_ Вероятность _50%_; если перегруженный враг погибает раньше разряда, он _взрывается немедленно_ в радиусе двух клеток.
actors.hero.skills.soultether.desc=Каждый живой призванный слуга, но не более _3_, усиливает ваши волшебные палочки. Если у вас нет призванных существ, усиление не действует.\n\n_+1:_ Каждый слуга повышает урон палочек на _3%_ и ускоряет восстановление зарядов на _2%_.\n\n_+2:_ Каждый слуга повышает урон на _6%_, а восстановление зарядов ускоряет на _4%_.\n\n_+3:_ Каждый слуга повышает урон на _9%_ и ускоряет восстановление зарядов на _6%_: с тремя слугами это _+27%_ урона и _22%_ к скорости восстановления.
actors.hero.skills.summonrat.desc=Рядом с вами появляется крыса, готовая сражаться на вашей стороне. У неё собственное здоровье, равное части вашего максимального, а укусы наносят часть вашего урона. Как и все призванные существа, крыса исчезнет через одни игровые сутки.\n\n_+1:_ Максимальное здоровье — _8%_ вашего; укусы наносят _25%_ вашего урона.\n\n_+2:_ Здоровье — _10%_ вашего; урон от укусов — _30%_.\n\n_+3:_ Здоровье — _12%_ вашего; урон от укусов — _35%_.
actors.hero.skills.spark.desc=Выпустите магический снаряд, поражающий первую цель на своём пути. Его мощь зависит от вашего урона.\n\n_+1:_ Снаряд наносит _20-60%_ вашего урона.\n\n_+2:_ Наносит _40-120%_ вашего урона.\n\n_+3:_ Наносит _60-180%_ вашего урона, _пролетает сквозь_ союзников и поражает всех врагов по прямой до первой стены.
actors.hero.skills.summonskeleton.desc=Рядом с вами поднимается скелет — крепкий слуга, способный поглощать часть каждого удара. Его максимальное здоровье составляет долю вашего, а удары наносят долю вашего урона. Как и все призванные существа, он исчезает через одни игровые сутки.\n\n_+1:_ Здоровье — _50%_ вашего; удары наносят _50%_ вашего урона и блокируют до _5%_ собственного максимального здоровья.\n\n_+2:_ Здоровье — _60%_ вашего; урон — _60%_, блокируется до _10%_.\n\n_+3:_ Здоровье — _70%_ вашего; урон — _70%_, блокируется до _15%_.
actors.hero.skills.summoncrab.desc=Рядом с вами появляется краб и вступает в бой на вашей стороне. Его максимальное здоровье составляет долю вашего, а клешни наносят долю вашего урона. Панцирь поглощает часть каждого удара. Как и все призванные существа, краб исчезает через одни игровые сутки.\n\n_+1:_ Здоровье — _20%_ вашего; урон клешней — _35%_ вашего урона.\n\n_+2:_ Здоровье — _30%_ вашего; урон — _40%_.\n\n_+3:_ Здоровье — _40%_ вашего; урон — _45%_.
actors.hero.skills.souldetonation.desc=Пожертвуйте одним видимым призванным существом или сразу тремя: они взорвутся огнём душ. Взрыв крыс отравляет окружающих врагов, а скелеты поражают большую область.\n\n_+1:_ Каждый взрыв наносит соседним врагам _7 единиц урона_.\n\n_+2:_ Каждый взрыв наносит _10 единиц урона_.\n\n_+3:_ Каждый взрыв наносит _13 единиц урона_ и оставляет частицу души на _6 ходов_. Наступите на неё, чтобы восстановить ману.
actors.hero.skills.cindertrail.desc=Призовите _5_ огненных или ледяных сфер, вращающихся вокруг вас. Повторным применением можно запускать их по одной на расстояние до _7 клеток_. При взрыве каждая сфера поражает область 3×3, поджигает или охлаждает врагов и оставляет пламя или метель, способные навредить и вам. Чем дольше сферы вращаются, тем крупнее и мощнее становятся.\n\n_+1:_ Взрыв наносит _60-140%_ вашего урона, а полностью выросшая сфера — вдвое больше.\n\n_+2:_ _100-200%_ вашего урона; удвоение при полном росте.\n\n_+3:_ _120-260%_ вашего урона; удвоение при полном росте. Запуск полностью выросшей сферы заставляет все остальные подрасти на одну стадию.
actors.hero.skills.frostnova.desc=Вокруг вас расходится ледяная волна, нанося урон и охлаждая всех врагов в радиусе _3 клеток_.\n\n_+1:_ Наносит _60-140%_ вашего урона и охлаждает на _5 ходов_.\n\n_+2:_ Наносит _80-200%_ урона и охлаждает на _7 ходов_.\n\n_+3:_ Наносит _100-260%_ урона и охлаждает на _9 ходов_. Земля на _4 хода_ покрывается ледяными шипами, которые ранят и охлаждают наступивших на них врагов.
actors.hero.skills.stormcall.desc=Поразите цель молнией с небес. Затем разряд перескакивает на соседних врагов, нанося им _60%_ урона.\n\n_+1:_ Первый удар наносит _120-240%_ вашего урона; молния перескакивает ещё на _1 врага_.\n\n_+2:_ Первый удар наносит _160-320%_ урона; перескакивает ещё на _2 врагов_.\n\n_+3:_ Первый удар наносит _200-400%_ урона; перескакивает ещё на _3 врагов_. Все поражённые цели оглушаются на _1 ход_.
actors.hero.skills.rimeaffinity.desc=Разряды волшебных палочек и магические снаряды могут полностью заморозить поражённых врагов на _2 хода_. Несовместима с «Пиромантией».\n\n_+1:_ Вероятность заморозки _10%%_.\n\n_+2:_ Вероятность _20%%_.\n\n_+3:_ Вероятность _30%%_; попадание разряда по уже замороженному врагу _разбивает_ лёд и дополнительно наносит половину урона разряда.
actors.hero.skills.bandit.desc=Внезапные атаки позволяют обшарить карманы врага — не чаще одного раза за каждого противника. Украденное сразу перемещается к вам.\n\n_+1:_ Крадёте кошелёк с _золотом_.\n\n_+2:_ Вместо золота крадёте _предмет_, который нёс враг; он падает к вашим ногам. Повторно этот предмет с врага уже не выпадет.\n\n_+3:_ _Метательное оружие и стрелы_ тоже позволяют обчищать карманы на расстоянии.
actors.hero.skills.stealth.desc=Вы ступаете бесшумно. Заметив нового врага, вы создаёте рядом дымчатого двойника — один раз для каждого противника. Бодрствующий враг сначала преследует двойника, спящий продолжает спать. Двойник исчезает, когда заканчивается время его существования или по нему наносят любой удар.\n\n_+1:_ _+1 к скрытности_; двойник существует _2 хода_.\n\n_+2:_ _+2 к скрытности_; двойник существует _3 хода_.\n\n_+3:_ _+3 к скрытности_; двойник существует _4 хода_, а ударивший его враг _слепнет_ на 2 хода.
actors.hero.skills.masterthief.desc=Вы ловко прикарманиваете часть добычи. За каждую подобранную кучку золота или обчищенный карман вокруг вас начинают кружить _2_ монеты. Когда враг бьёт вас, вы бросаете монету ему в глаза и _ослепляете_ на _2 хода_.\n\n_+1:_ Можно хранить до _2 монет_.\n\n_+2:_ До _4 монет_.\n\n_+3:_ До _6 монет_; каждая монета _отскакивает_ к ближайшему второму врагу и ослепляет его тоже.
actors.hero.skills.scorpion.desc=Ваш яд действует дольше, а удар по отравленному врагу может искалечить его.\n\n_+1:_ Яд действует на _2 хода_ дольше. Удары по отравленным врагам имеют _10%_ вероятность нанести увечье.\n\n_+2:_ Яд действует на _4 хода_ дольше, вероятность увечья _20%_.\n\n_+3:_ Яд действует на _6 ходов_ дольше, вероятность увечья _30%_; удар, который должен искалечить уже покалеченного врага, _парализует_ его на 1 ход.
actors.hero.skills.silentdeath.desc=Атака в ближнем бою по спящему врагу нацелена прямо в горло. Если после удара у врага остаётся не больше установленной доли максимального здоровья, он умирает бесшумно. На боссов и мини-боссов не действует.\n\n_+1:_ Добивает спящего врага, если у того осталось _15%_ максимального здоровья или меньше.\n\n_+2:_ При _25%_ или меньше.\n\n_+3:_ При _35%_ или меньше; бесшумное убийство погружает комнату в тишину: спящие враги в радиусе _4 клеток_ не могут проснуться _3 хода_, если их не ранить.
actors.hero.skills.necrotoxin.desc=Каждое срабатывание яда на враге восстанавливает вам _7 единиц маны_.\n\nУдары по отравленному врагу могут также вызвать разрыв ядовитых чар: оставшийся урон от отравления мгновенно наносится с силой _150%_.\n\n_+1:_ Вероятность разрыва _20%_.\n\n_+2:_ Вероятность _35%_.\n\n_+3:_ Вероятность _50%_; разрыв отравляет соседних врагов на _5 ходов_.
actors.hero.skills.doublestab.desc=Включаемая способность: каждый удар расходует _6 единиц маны_, связывая цель с ближайшим врагом в радиусе _3 клеток_ на _8 ходов_. Урон одной связанной цели передаётся другой. Если рядом нет второго врага, цель вместо этого получает ещё один порез. При недостатке маны связь разрывается.\n\n_+1:_ Связанные враги получают по _40%_ урона друг друга. Одиночная цель получает _35%_ дополнительного урона.\n\n_+2:_ Связанные враги получают по _60%_ урона друг друга. Одиночная цель — _50%_ дополнительно.\n\n_+3:_ Связанные враги получают по _80%_ урона друг друга. Одиночная цель — _70%_ дополнительно.
actors.hero.skills.shadowclone.desc=Выпустите верёвку с крюком и подтянитесь к месту зацепа. Зацепив врага, вы устремитесь к нему и ударите с силой _150%_ урона оружия; зацепив стену — перелетите через комнату.\n\n_+1:_ Можно выпустить _1 верёвку_.\n\n_+2:_ _2 верёвки_ подряд.\n\n_+3:_ _3 верёвки_ подряд; теперь крюк цепляется за _любую видимую клетку_, включая свободную землю за пропастью.
actors.hero.skills.phantomstrike.desc=Призовите из-под земли связанных с вами теней. Они будут сражаться рядом и делиться с вами своим обзором — даже сквозь стены. У каждой тени есть собственный запас здоровья, составляющий долю вашего максимального, а её удары наносят долю вашего урона.\n\n_+1:_ До _2 теней_ с запасом здоровья по _15%_ вашего и уроном _30%_ от вашего.\n\n_+2:_ До _3 теней_ с _30%_ вашего здоровья и _40%_ урона; они видят дальше.\n\n_+3:_ До _4 теней_ с _40%_ вашего здоровья и _50%_ урона. Примените способность к одной из теней, чтобы бесплатно _поменяться с ней местами_.
actors.hero.skills.blink.desc=Пока способность действует, вы движетесь со скоростью молнии: попытка войти в клетку врага за _4 единицы маны_ переносит вас сквозь него на свободную клетку позади, нанося удар по пути. Если вы окажетесь рядом с другим ещё не поражённым врагом, скачок продолжится — и так далее.\n\n_+1:_ Цепочка до _3 врагов_, по _60%_ урона оружия каждому.\n\n_+2:_ До _4 врагов_, по _80%_ каждому.\n\n_+3:_ До _5 врагов_, по _100%_ каждому.\n\nРаботает и на боссах; цепочка прерывается только тогда, когда за врагом нет свободной клетки.
actors.hero.skills.blooddance.desc=Вы больше не отступаете. Получите адреналин: пока он действует, каждый удар в ближнем бою наносит кровоточащую рану.\n\n_+1:_ Адреналин на _7 ходов_. Удары накладывают _2 единицы кровотечения_.\n\n_+2:_ Адреналин на _10 ходов_. Удары накладывают _3 единицы кровотечения_.\n\n_+3:_ Адреналин на _13 ходов_. Удары накладывают _4 единицы кровотечения_, а в начале танца вы получаете барьер в размере _9%_ максимального здоровья.
actors.hero.skills.blackout.desc=Окутайте выбранную точку тьмой. Враги в радиусе _2 клеток_ слепнут и впадают в ужас, а местность скрывается дымом. Пока дым держится, не видящие вас враги тянутся к нему, а первый удар, нанесённый вами из дыма, дополнительно ранит соседнего врага с половинной силой.\n\n_+1:_ Слепота на _6 ходов_, ужас на _3_.\n\n_+2:_ Слепота на _8 ходов_, ужас на _4_.\n\n_+3:_ Слепота на _10 ходов_, ужас на _5_; тьма также _исцеляет ваши тени_ поблизости на _8%_ их максимального здоровья.
actors.hero.skills.fletching.desc=Вы подбираете оперение от каждой выпущенной стрелы: каждое попадание с расстояния добавляет перо в кольцо, вращающееся вокруг вас. Накопив _3 пера_, вы делаете расщепляющуюся стрелу. При следующем попадании она выпускает зазубренные осколки по врагам рядом с целью, нанося _30%_ урона основного выстрела.\n\n_+1:_ Стрела расщепляется на _2 осколка_.\n\n_+2:_ На _3 осколка_.\n\n_+3:_ На _4 осколка_; убивший врага осколок возвращает своё перо в кольцо.
actors.hero.skills.awareness.desc=Вы предугадываете действия врагов: от первой атаки каждого противника, ближней или дальней, можно увернуться, после чего в ответ в него летит стрела с _половиной_ урона вашего лука.\n\n_+1:_ Вероятность уклониться _20%_.\n\n_+2:_ Вероятность _30%_.\n\n_+3:_ Вероятность _40%_; ответная стрела _приковывает_ врага к месту на _2 хода_.
actors.hero.skills.sixthsense.desc=Лес предупреждает вас об опасных ударах: если удар должен отнять больше четверти здоровья, вы потеряете не более четверти. Время до следующего предупреждения показывается среди ваших эффектов.\n\n_+1:_ Защита восстанавливается каждые _40 ходов_.\n\n_+2:_ Каждые _30 ходов_.\n\n_+3:_ Каждые _20 ходов_; нападающий дополнительно оказывается _ошеломлён на 3 хода_.
actors.hero.skills.poacher.desc=Убитый выстрелом враг превращается в приманку: запах его тела в течение _5 ходов_ привлекает других врагов, которые вас не видят.\n\n_+1:_ Запах распространяется на _4 клетки_.\n\n_+2:_ На _5 клеток_.\n\n_+3:_ На _6 клеток_; в трупе скрывается _силок_: первый подошедший враг обездвиживается на _3 хода_.
actors.hero.skills.irontip.desc=Железные наконечники пробивают врагов насквозь: выстрел может поразить противников позади первоначальной цели.\n\n_+1:_ Вероятность _50%_ пробить ещё _1 врага_ непосредственно за целью.\n\n_+2:_ Вероятность _67%_ пробить до _2 врагов_ на расстоянии до 2 клеток.\n\n_+3:_ Вероятность _75%_ пробить до _3 врагов_ на расстоянии до 3 клеток; каждое попадание с расстояния также оставляет цель _уязвимой на 3 хода_.
actors.hero.skills.heartseeker.desc=Если после попадания с расстояния у врага осталось меньше половины здоровья, стрела застревает в его сердце. Над целью начинает пульсировать сердце, которое взрывается на _третьем ударе_. Боссы и мини-боссы получают половину урона.\n\n_+1:_ Взрыв наносит _8%_ полного запаса здоровья цели.\n\n_+2:_ Наносит _15%_ полного здоровья.\n\n_+3:_ Наносит _22%_; если взрыв убивает врага, стрела вырывается из его тела и поражает ближайшего противника с запасом здоровья ниже половины в радиусе _4 клеток_.
actors.hero.skills.doubleshot.desc=Пока способность включена, ваши атаки с расстояния могут выпускать вторую стрелу по другому видимому врагу, а если других врагов нет — по той же цели. Одновременно может действовать только одна способность: «Прицельный выстрел», «Двойной выстрел» или «Бомбовое путешествие».\n\n_+1:_ Вторая стрела вылетает с вероятностью _50%_.\n\n_+2:_ С вероятностью _75%_.\n\n_+3:_ Вторая стрела вылетает при _каждом_ попадании; можно _пометить_ врага, в которого она направится.
actors.hero.skills.bombvoyage.desc=Пока способность включена, ваши метательные снаряды и стрелы при попадании взрываются, раня всех врагов рядом с целью, но не разрушая стены. Одновременно может действовать только одна способность: «Прицельный выстрел», «Двойной выстрел» или «Бомбовое путешествие».\n\n_+1:_ Взрыв поражает всех врагов в радиусе _1 клетки_.\n\n_+2:_ Урон взрыва увеличивается на _35%_.\n\n_+3:_ Если взрыв убивает врага, на его месте происходит _второй, более слабый взрыв_ — один раз за выстрел.
actors.hero.skills.arrowstorm.desc=Призрачная хищная птица осыпает выбранную область стрелами в течение _3 ходов_, нанося урон и калеча всех врагов под ней.\n\n_+1:_ Каждый залп поражает область _3x3_ и наносит _25%_ урона вашего лука.\n\n_+2:_ Каждый залп наносит _35%_ урона и распространяется на _2 клетки_ по сторонам креста.\n\n_+3:_ Каждый залп наносит _45%_ урона; стрелы остаются в земле на _4 хода_, раня и калеча всех, кто на них наступит.
actors.hero.skills.frostarrows.desc=Пока способность включена, ваши попадания с расстояния охлаждают цель.\n\n_+1:_ Охлаждение на _3 хода_.\n\n_+2:_ Охлаждение на _4 хода_; урон по охлаждённым врагам увеличен на _15%_.\n\n_+3:_ Охлаждение на _5 ходов_; урон по охлаждённым врагам увеличен на _15%_; с вероятностью _20%_ цель вместо охлаждения будет полностью заморожена на _2 хода_.
actors.hero.skills.groundwork.desc=Попавший в вашу ловушку враг — обездвиженный, искалеченный, оглушённый, замороженный или спящий — оказывается окружён кольями. Удар по нему натягивает растяжку, и колья выстреливают во всех соседних врагов.\n\n_+1:_ Колья наносят _20%_ урона вашего удара.\n\n_+2:_ _35%_ урона удара.\n\n_+3:_ _50%_ урона удара и калечат врагов на _2 хода_.
actors.hero.skills.beartrap.desc=Установите стальной капкан на свободной земле. По клетке по-прежнему можно пройти; она поблёскивает, чтобы вы не забыли о ловушке. Первый наступивший наземный враг получает кровотечение и увечье и оказывается прикован цепью. Каждая попытка вырваться ранит его, пока цепь не порвётся.\n\n_+1:_ Капкан наносит _4 единицы кровотечения_, цепь держит _7 ходов_.\n\n_+2:_ _6 единиц кровотечения_, цепь держит _9 ходов_.\n\n_+3:_ _8 единиц кровотечения_, цепь держит _11 ходов_; когда цепь рвётся, на месте ловушки вырастают _колючие заросли_.
actors.hero.skills.deadfall.desc=Подвесьте тяжёлый груз над видимой областью 3×3 клетки. Над центром поскрипывает механизм, готовый сработать в течение _30 ходов_. Первый враг, прошедший под грузом, обрушит его: все противники под ловушкой получат урон и оглушение. Примените способность повторно, чтобы оборвать верёвку раньше.\n\n_+1:_ Наносит _140-280%_ вашего урона, оглушает на _1 ход_.\n\n_+2:_ Наносит _200-400%_ вашего урона, оглушает на _1 ход_.\n\n_+3:_ Наносит _260-520%_ вашего урона, оглушает на _2 хода_. Обездвиженные или искалеченные враги получают _двойной_ урон.
actors.hero.skills.precision.desc=Первый удар в ближнем бою по невредимому врагу находит брешь в его защите: цель отмечается стальным отблеском, и последующие ваши удары по ней игнорируют броню.\n\n_+1:_ Метка действует _2 хода_.\n\n_+2:_ Метка действует _3 хода_.\n\n_+3:_ Метка действует _4 хода_; если убить отмеченного врага, отблеск переходит к ближайшей цели в радиусе _3 клеток_.
actors.hero.skills.weaponbond.desc=Убийство в ближнем бою питает ваше оружие: оно начинает светиться, а следующая оружейная способность наносит повышенный урон.\n\n_+1:_ Урон способности увеличен на _20%_; свечение исчезает через _10 ходов_.\n\n_+2:_ Урон увеличен на _35%_; свечение исчезает через _10 ходов_.\n\n_+3:_ Урон увеличен на _50%_; свечение держится до использования, а усиление можно _накопить дважды_.
actors.hero.skills.trueedge.desc=Критический удар в ближнем бою наносит на _50%_ больше урона, а взмах задевает врагов позади цели с половинной силой.\n\n_+1:_ Вероятность критического удара _5%_, взмах достаёт на _1 клетку_ позади цели.\n\n_+2:_ Вероятность _10%_, дальность за целью — _2 клетки_.\n\n_+3:_ Вероятность _15%_, дальность — _3 клетки_; все задетые враги получают _кровотечение_.
actors.hero.skills.lunge.desc=Совершите рывок к врагу и ударьте с силой _125%_ урона оружия, включая эффекты самого оружия. После выпада потребуется короткая передышка, прежде чем вы сможете повторить приём.\n\n_+1:_ Выпад к врагу на расстоянии до _3 клеток_.\n\n_+2:_ Дальность _4 клетки_; можно связать _2 выпада_ по разным целям в течение 2 ходов, прежде чем потребуется отдых.\n\n_+3:_ Дальность _5 клеток_; можно связать _3 выпада_. Каждый рывок оставляет _след клинка_, который смыкается через ход и вызывает у врагов кровотечение.
actors.hero.skills.ripostestance.desc=Примите дуэльную стойку. Пока она действует, на каждый промах врага в ближнем бою вы немедленно отвечаете ударом клинка, расходуя ману.\n\n_+1:_ Ответные удары наносят _50%_ обычного урона оружия.\n\n_+2:_ Ответные удары наносят _70%_ урона оружия.\n\n_+3:_ Ответные удары наносят _90%_ урона оружия, а атакующий становится _уязвимым_ на 2 хода.
actors.hero.skills.pirouette.desc=Изящным вращением уйдите от соседних врагов на выбранную клетку и получите защитный барьер. Пока вы обездвижены, выполнить пируэт нельзя.\n\n_+1:_ Перемещение до _2 клеток_, барьер в размере _3%_ максимального здоровья.\n\n_+2:_ До _3 клеток_, барьер _6%_.\n\n_+3:_ До _4 клеток_, барьер _9%_; оставленные позади враги испытывают _головокружение_ в течение 2 ходов.
actors.hero.skills.sanctuary.desc=Пока действует защита, простояв на месте _3 хода_, вы расходуете _3 единицы маны_ и освящаете круг вокруг себя на _3 хода_. Круг исцеляет вас и союзников, а во врагах накапливает свет, который взрывается при угасании круга.\n\n_+1:_ Круг охватывает область в радиусе _1 клетки_.\n\n_+2:_ Радиус круга — _2 клетки_.\n\n_+3:_ Радиус круга — _2 клетки_. Отключение защиты позволяет _взорвать все круги сразу_, отбрасывая находящихся внутри врагов.
actors.hero.skills.lastrites.desc=Когда удар должен убить вас, но у вас есть не меньше _%1$d единиц маны_, эта мана расходуется, и вы выживаете в столпе света.\n\n_+1:_ Остаётся _3 ед. здоровья_; благословение на _10 ходов_.\n\n_+2:_ Остаётся _5 ед. здоровья_; благословение на _15 ходов_.\n\n_+3:_ Остаётся _7 ед. здоровья_; благословение на _20 ходов_. Свет ослепляет всех соседних врагов на _3 хода_.
actors.hero.skills.righteousstrikes.desc=Каждый _третий_ удар в ближнем бою выпускает вспышку святого света. Она перескакивает между врагами, нанося каждому _100%_ вашего урона, а нежити и демонам — вдвое больше.\n\n_+1:_ Свет перескакивает ещё на _1 врага_.\n\n_+2:_ Ещё на _2 врагов_.\n\n_+3:_ Ещё на _3 врагов_, затем _возвращается к вам_, исцеляя на _1%_ максимального здоровья за каждого поражённого противника.
actors.hero.skills.sacredweapon.desc=Каждый удар в ближнем бою с вероятностью _20%_ призывает с небес призрачную копию вашего оружия. Она вонзается в пол рядом с целью и в течение _3 ходов_ рубит стоящих возле неё врагов, нанося _35%_ урона оружия.\n\n_+1:_ Одновременно может стоять до _1 меча_.\n\n_+2:_ До _2 мечей_.\n\n_+3:_ До _3 мечей_; исчезающий меч _вылетает в ближайшего врага_ в радиусе 4 клеток, нанося _50%_ урона оружия.
actors.hero.skills.divinewrath.desc=Пока включён «Божественный гнев», каждый удар в ближнем бою расходует ману и освящает землю. Стоящие на освящённой земле враги каждый ход получают _80%_ вашего урона, нежить и демоны — вдвое больше. Освящение исчезает через _3 хода_. Нельзя использовать одновременно со «Святой карой».\n\n_+1:_ Освящается клетка цели.\n\n_+2:_ Освящается клетка цели и _все соседние клетки_.\n\n_+3:_ Освящается клетка цели и все соседние клетки; враги на святой земле _не могут двигаться_.
actors.hero.skills.crusaderszeal.desc=Рвение растёт, пока враг не может вас ударить. Каждый ваш удар в ближнем бою зажигает над вами пламя, усиливающее следующие удары на _10%_. Любой полученный удар гасит весь накопленный огонь.\n\n_+1:_ До _2 языков пламени_.\n\n_+2:_ До _3 языков пламени_.\n\n_+3:_ До _4 языков пламени_; удар при максимальном рвении _вспыхивает светом_ и ослепляет соседних врагов на _2 хода_.
actors.hero.skills.shieldofthefaithful.desc=Между вами и ближайшим видимым врагом появляется щит света, который поглощает _30%_ урона каждого его удара. Приняв достаточно ударов, щит гаснет и восстанавливается через _15 ходов_.\n\n_+1:_ Щит выдерживает _2 удара_.\n\n_+2:_ Щит выдерживает _3 удара_.\n\n_+3:_ Щит выдерживает _4 удара_; пойманные дальние атаки _отражаются_ обратно в стрелка.
actors.hero.skills.holysmite.desc=Пока включена «Святая кара», каждый удар в ближнем бою расходует ману и обрушивает на цель световой молот, притягивая соседних врагов на _1 клетку_ к ней. Нельзя использовать одновременно с «Божественным гневом».\n\n_+1:_ Притягивает врагов в радиусе _2 клеток_ от цели.\n\n_+2:_ В радиусе _3 клеток_.\n\n_+3:_ В радиусе _3 клеток_; каждый захваченный молотом враг получает _половину_ урона исходного удара.
actors.hero.skills.guardianspirit.desc=Призовите парящего духа-хранителя в виде глаза на видимую клетку не дальше 6 клеток. У него собственное здоровье, он стреляет по врагам лазерами, сила которых зависит от вашего урона, и исчезает через _одни игровые сутки_.\n\n_+1:_ Максимальное здоровье — _100%_ вашего; лазеры наносят _60%_ вашего урона.\n\n_+2:_ Здоровье — _150%_ вашего; урон лазеров — _80%_.\n\n_+3:_ Здоровье — _200%_ вашего; лазеры наносят _100%_ вашего урона. Вы _видите его глазами_; бесплатное повторное применение позволяет отдать приказ: выберите _любую ранее виденную клетку_ этажа, чтобы хранитель переместился туда и занял позицию, или врага в радиусе 6 клеток от хранителя, чтобы выстрелить лазером с силой _240%_ вашего урона. Полученные хранителем удары заряжают его нимб и усиливают этот выстрел.
actors.hero.skills.avataroflight.desc=Станьте воплощением света: вы получаете благословение и окружаете себя пылающим нимбом. Когда враг впервые входит в область нимба, его поражает луч силой _120%_ вашего урона (по нежити и демонам — вдвое больше) и ослепляет на _3 хода_.\n\n_+1:_ Длительность _7 ходов_, радиус нимба _1 клетка_.\n\n_+2:_ Длительность _10 ходов_, радиус _2 клетки_.\n\n_+3:_ Длительность _13 ходов_; союзники внутри нимба получают _благословение_ и восстанавливают _1%_ максимального здоровья каждый ход.
actors.hero.skills.condemn.desc=Ваши удары могут выжечь на враге световую метку, делая его уязвимым.\n\n_+1:_ Вероятность наложить метку _12%_, длительность _4 хода_.\n\n_+2:_ Вероятность _24%_, длительность _5 ходов_.\n\n_+3:_ Вероятность _36%_, длительность _6 ходов_. Нежить и демоны получают метку _всегда_, и она обжигает их на _120%_ вашего урона.
actors.hero.skills.scouringflame.desc=Направьте на цель конус белого пламени. Нежити и демонам оно наносит вдвое больше урона.\n\n_+1:_ Дальность конуса _3 клетки_, урон _140%_ от вашего.\n\n_+2:_ Дальность _4 клетки_, урон _200%_.\n\n_+3:_ Дальность _5 клеток_, урон _260%_; выжившие враги ослепляются на _3 хода_.
actors.hero.skills.reckoning.desc=Каждого видимого врага в радиусе _%1$d клеток_ настигает возмездие. Враг без метки получает световое клеймо и становится уязвимым. Если клеймо уже есть, наступает _час расплаты_: столп света обжигает врага, нанося _60%%_ вашего урона за каждый оставшийся ход действия клейма, а нежити и демонам — вдвое больше.\n\n_+1:_ Новые клейма действуют _4 хода_.\n\n_+2:_ Новые клейма действуют _6 ходов_.\n\n_+3:_ Новые клейма действуют _8 ходов_; столп света дополнительно поражает каждого осуждённого врага на _120%%_ вашего урона, по нежити и демонам — вдвое сильнее.
actors.hero.skills.bloodrush.desc=Рванитесь по прямой, оставляя кровавый след. Каждый враг на пути получает _50%_ урона оружия и отбрасывается в сторону. Неподвижный противник остановит рывок.\n\n_+1:_ Рывок на расстояние до _3 клеток_.\n\n_+2:_ До _4 клеток_.\n\n_+3:_ До _5 клеток_; рывок снимает _обездвиживание_, _увечье_ и _замедление_, позволяя вырваться даже из оков.
actors.hero.skills.undyingwill.desc=Создайте багровый барьер, питающий вашу ярость: каждая единица поглощённого им урона пополняет запас ярости. Когда удары разрушают барьер, вы испускаете рёв, привлекая внимание всех ближайших врагов.\n\n_+1:_ Барьер в размере _10%_ максимального здоровья.\n\n_+2:_ Барьер _15%_.\n\n_+3:_ Барьер _20%_; пока он существует, смертельный удар оставляет вам _1 ед. здоровья_.
actors.hero.skills.comboopener.desc=Гладиатор начинает каждую схватку ударной волной: удар в ближнем бою по врагу с полным здоровьем _ошеломляет_ его и отбрасывает.\n\n_+1:_ Ошеломление на _2 хода_, отбрасывание на _1 клетку_.\n\n_+2:_ Ошеломление на _3 хода_, отбрасывание на _2 клетки_.\n\n_+3:_ Ошеломление на _4 хода_; волна также отбрасывает _всех остальных соседних врагов_ на _1 клетку_.
actors.hero.skills.finishingblow.desc=Удар в ближнем бою мгновенно убивает врага, если после обычного урона у него осталось бы меньше здоровья, чем установленная доля урона самого удара. На боссов и мини-боссов не действует.\n\n_+1:_ Добивание, если у врага осталось бы не более _20%_ урона удара.\n\n_+2:_ Не более _35%_ урона удара.\n\n_+3:_ Не более _50%_ урона удара; при добивании брызги крови _ослепляют_ соседних с целью врагов на _2 хода_.
actors.hero.skills.spellblade.desc=Ваши удары в ближнем бою могут вытягивать ману из врага, направляя искры энергии к вам.\n\n_+1:_ Вероятность _15%_ восстановить _2 единицы маны_ при попадании.\n\n_+2:_ Вероятность _30%_ восстановить _3 единицы маны_.\n\n_+3:_ Вероятность _45%_ восстановить _4 единицы маны_. Если мана уже полная, удар вместо этого наносит _4 ед. дополнительного урона_.
actors.hero.skills.manashield.desc=Окружите себя кристальным барьером, поглощающим урон и постепенно угасающим. Когда удар разрушает барьер, осколки впитываются в оружие. Каждый из следующих ударов в ближнем бою расходует по осколку, нанося дополнительно _60-160%_ вашего урона магией.\n\n_+1:_ Барьер поглощает урон, равный _8%_ максимального здоровья, и заряжает _2 удара_.\n\n_+2:_ _12%_ максимального здоровья, _3 удара_.\n\n_+3:_ _16%_ максимального здоровья, _4 удара_; при первом разрушении барьер _восстанавливается_ с половиной прочности.
actors.hero.skills.arcaneecho.desc=Ваши удары в ближнем бою могут отозваться электрическим эхом и нанести дополнительный удар молнии.\n\n_+1:_ Вероятность эха _10%_; оно наносит _40-120%_ вашего урона.\n\n_+2:_ Вероятность _20%_; урон _40-160%_.\n\n_+3:_ Вероятность _30%_; урон _40-200%_; эхо дополнительно перескакивает на _ещё одного_ соседнего врага.
actors.hero.skills.souldrain.desc=Отмеченные вами души не знают покоя. Когда враг с меткой души погибает, его душа перелетает к ближайшему врагу в пределах досягаемости и отмечает его тоже, позволяя вашим разрядам продолжать подпитывать вас.\n\n_+1:_ Душа пролетает до _3 клеток_.\n\n_+2:_ До _4 клеток_.\n\n_+3:_ До _5 клеток_; прежде чем перейти к новому врагу, она _проходит сквозь вас_ и исцеляет на _3%_ максимального здоровья.
actors.hero.skills.vanish.desc=Растворитесь в тени, не тратя ход. Преследующие вас враги потеряют след, и следующий удар по каждому из них станет внезапной атакой.\n\n_+1:_ Вы исчезаете для врагов в радиусе _3 клеток_.\n\n_+2:_ В радиусе _5 клеток_.\n\n_+3:_ Вы исчезаете для _всех видимых врагов_ и остаётесь _невидимым_ ещё _3 хода_.
actors.hero.skills.slipstream.desc=Ускорьтесь на _6 ходов_, оставляя на пройденных клетках вихри ветра, которые существуют _10 ходов_. Наступивший в вихрь враг _спотыкается_ и теряет ход.\n\n_+1:_ Ветер сохраняется на последних _4 клетках_ пути.\n\n_+2:_ На последних _6 клетках_.\n\n_+3:_ На последних _8 клетках_; бесплатное повторное применение позволяет _прокатиться по ветру обратно_ к дальнему концу следа, сбивая с ног всех врагов по пути.
actors.hero.skills.parkour.desc=По подвижной цели труднее попасть. Если на прошлом ходу вы двигались, вы можете полностью избежать удара в ближнем бою, _перекатившись на одну клетку_ прочь от нападающего.\n\n_+1:_ Перекат срабатывает против _15%_ таких ударов.\n\n_+2:_ Против _25%_ ударов.\n\n_+3:_ Против _35%_ ударов; при наличии свободного места вы можете _перепрыгнуть через_ врага и приземлиться за ним.
actors.hero.skills.overwatch.desc=Держите оборону: попадания с расстояния могут отбрасывать цель. Если её невозможно сдвинуть, она получает всю силу удара на месте.\n\n_+1:_ Вероятность _20%_ оттолкнуть на _2 клетки_.\n\n_+2:_ Вероятность _30%_ оттолкнуть на _2 клетки_.\n\n_+3:_ Вероятность _40%_ оттолкнуть на _3 клетки_; враг, врезавшийся в препятствие или удержанный на месте, оглушается.
actors.hero.skills.thorns.desc=Ваши стрелы и метательное оружие оставляют в поражённых врагах шипы. Когда такой враг делает следующий шаг, из шипа вырастают колючие лозы и хлещут его.\n\n_+1:_ Лозы наносят _40%_ вашего урона.\n\n_+2:_ Лозы наносят _80%_ вашего урона.\n\n_+3:_ Лозы наносят _120%_ вашего урона и _обездвиживают_ врага на _1 ход_.
actors.hero.skills.symbiosis.desc=При попадании вражеского удара с вероятностью _25%_ вокруг вас распускаются листья, которые за несколько ходов восстанавливают часть потерянного здоровья.\n\n_+1:_ Восстанавливают _30%_ потерянного здоровья.\n\n_+2:_ Восстанавливают _45%_.\n\n_+3:_ Восстанавливают _60%_; пока листья лечат вас, ударившие вас враги _замедляются_ оплетающими лозами на _3 хода_.
actors.hero.skills.wildcall.desc=Пометьте видимого врага, и из зарослей вырвется призрачный волк, который будет охотиться только на эту добычу. Волка нельзя ранить; он кусает цель каждый ход и исчезает, когда она погибает или спустя _10 ходов_.\n\n_+1:_ Укусы волка наносят _80-180%_ вашего урона.\n\n_+2:_ Укусы наносят _120-220%_ вашего урона.\n\n_+3:_ Укусы наносят _160-260%_ вашего урона; после гибели добычи волк _берёт след_ ближайшего видимого врага.
actors.hero.skills.banner.desc=Каждое убийство в ближнем бою устанавливает ваше знамя на месте падения врага. Каждый ход вы и союзники в радиусе _2 клеток_ от него получаете барьер.\n\n_+1:_ Знамя стоит _6 ходов_. Барьеры накапливаются до _5%_ максимального здоровья.\n\n_+2:_ Знамя стоит _8 ходов_. Барьеры — до _10%_.\n\n_+3:_ Знамя стоит _10 ходов_. Барьеры — до _15%_; враги рядом со знаменем _ошеломляются_.
actors.hero.skills.challenge.desc=Издайте вызывающий рёв: все видимые враги устремятся к вам, а каждый откликнувшийся противник усилит вашу защиту.\n\n_+1:_ Барьер в размере _2%_ максимального здоровья за каждого откликнувшегося врага.\n\n_+2:_ Барьер _3%_ за каждого врага.\n\n_+3:_ Барьер _4%_ за каждого врага; каждое убийство в следующие _5 ходов_ возвращает _2 единицы маны_.
actors.hero.skills.innerpeace.desc=Спокойный разум помогает сбрасывать вредные состояния. Когда вас пытаются искалечить, ослабить, ослепить, вызвать головокружение или испугать, вы можете выдохнуть эффект белым облачком. Отравление, кровотечение и другой постепенный урон таким способом не устранить.\n\n_+1:_ Вероятность _15%_.\n\n_+2:_ Вероятность _25%_.\n\n_+3:_ Вероятность _35%_; каждый успешно выдохнутый эффект восстанавливает _2 единицы маны_.
actors.hero.skills.dragonkick.desc=Рванитесь по прямой к врагу и мощным ударом ноги отбросьте его. Его тело сшибает всех противников на пути: каждый получает урон от удара и отлетает в сторону на одну клетку. При столкновении со стеной отброшенный враг получает повторный урон от удара и _ошеломляется_ на 2 хода. Оружие при этом не используется.\n\n_+1:_ Рывок до _2 клеток_, отбрасывание на _2 клетки_, урон _100-240%_ от вашего.\n\n_+2:_ Рывок до _3 клеток_, отбрасывание на _3 клетки_, урон _140-320%_.\n\n_+3:_ Рывок до _4 клеток_, отбрасывание на _4 клетки_, урон _180-400%_. В точке приземления отброшенного врага все соседние противники _ошеломляются_ на 2 хода.
actors.hero.skills.massheal.desc=Над вами расправляются крылья серафима. Каждый ход, пока они существуют, вы и все союзники в радиусе _2 клеток_ исцеляетесь.\n\n_+1:_ Крылья держатся _3 хода_ и каждый ход восстанавливают _4%_ максимального здоровья.\n\n_+2:_ Крылья держатся _4 хода_; исчезая, они поражают врагов в радиусе 2 клеток на _260%_ вашего урона.\n\n_+3:_ Крылья держатся _5 ходов_; избыточное исцеление превращается в _осколки света_, поглощающие часть следующих ударов и ранящие ближайшего врага в ответ.
actors.hero.skills.aegis.desc=Щит света перехватывает мощный удар в ближнем бою (не меньше десятой части вашего максимального здоровья), поглощает _половину_ урона и отбрасывает нападающего. Щиту нужно _8 ходов_, чтобы восстановиться.\n\n_+1:_ Щит отбрасывает врага на _1 клетку_.\n\n_+2:_ Отбрасывает на _2 клетки_.\n\n_+3:_ Отбрасывает на _3 клетки_; поглощённая щитом половина урона _возвращается_ нападающему.
actors.hero.skills.holycharge.desc=Поднимите щит и устремитесь вперёд полосой света. Первый враг на пути окажется вытолкнут перед вами до конца рывка. Если он врежется в стену или другое существо, то _оглушится на 2 хода_.\n\n_+1:_ Дальность рывка до _3 клеток_.\n\n_+2:_ До _5 клеток_.\n\n_+3:_ До _7 клеток_; свет _ослепляет_ всех врагов по сторонам вашего пути.
actors.hero.skills.retribution.desc=Каждый удар врага оставляет на нём золотое клеймо долга. Ваш следующий удар по этому противнику в ближнем бою возвращает долг святым светом, нанося нежити и демонам удвоенный урон.\n\n_+1:_ Долг составляет _30%_ урона, нанесённого вам врагом.\n\n_+2:_ Долг составляет _45%_.\n\n_+3:_ Долг составляет _60%_; если накоплено _10_ или больше урона долга, половина его переходит _ещё на одного врага_ в радиусе 2 клеток.
actors.hero.skills.leap.desc=Прыгните к видимому врагу, приземлитесь рядом и обрушьте на него оружие, оглушая на _1 ход_. Пока вы обездвижены, прыгнуть нельзя.\n\n_+1:_ Прыжок до _3 клеток_, урон _110%_ от обычного.\n\n_+2:_ Прыжок до _4 клеток_, урон _120%_.\n\n_+3:_ Прыжок до _5 клеток_, урон _130%_; приземление отбрасывает всех остальных соседних врагов на _1 клетку_.
actors.hero.skills.chargedshot.desc=Остановитесь и несколько ходов натягивайте тетиву, не имея возможности действовать, а затем выпустите стрелу, которая не промахнётся. Она летит насквозь через стены и всех врагов на пути, оставляя за собой луч света.\n\n_+1:_ Подготовка _10 ходов_; стрела летит на _10 клеток_ и наносит _150%_ урона лука.\n\n_+2:_ Подготовка _7 ходов_; дальность _12 клеток_, урон _175%_.\n\n_+3:_ Подготовка _5 ходов_; дальность _14 клеток_, урон _200%_; все пронзённые враги становятся _уязвимыми_ на 3 хода.
actors.hero.skills.tengusarsenal.desc=Вы освоили уловки Тенгу, наблюдая за ним. Выберите бомбу и бросьте её. Дымовая и электрическая бомбы безопасны для вас и союзников, но пламя огненной бомбы обжигает любого, кто в нём стоит.\n\n_+1:_ _Дымовая бомба_ взрывается через три хода и поражает всё в радиусе _2 клеток_.\n\n_+2:_ Открывается _огненная бомба_: она остаётся на месте падения и в течение _5 ходов_ поджигает соседние клетки.\n\n_+3:_ Пламя огненной бомбы распространяется на _2 клетки_; в конце она взрывается, как дымовая. Открывается _электрическая бомба_: после приземления она в течение _6 ходов_ выпускает молнии по восьми направлениям на расстояние _2 клеток_, оглушая поражённых врагов, а затем взрывается точно так же.
actors.hero.skills.hurl.desc=Швырните вращающееся оружие из рук во врага на расстоянии до 6 клеток. Оно нанесёт _120%_ урона оружия с учётом зачарования, а затем вернётся вам в руку.\n\n_+1:_ Вероятность _15%_ отскочить после попадания в другого врага поблизости.\n\n_+2:_ Вероятность отскока возрастает до _30%_.\n\n_+3:_ Вероятность отскока _45%_; попадания «Броском» накапливают _комбо_: каждое очко даёт следующему «Броску» _+10%_ урона, максимум 5 очков.
actors.hero.skills.pillaroflight.desc=Обрушьте столп света на видимого врага не дальше 8 клеток. Нежити и демонам он наносит в полтора раза больше урона; сила столпа зависит от вашего урона.\n\n_+1:_ Столп наносит _160-320%_ вашего урона.\n\n_+2:_ Наносит _220-440%_ вашего урона и ослепляет соседних с целью врагов на _2 хода_.\n\n_+3:_ Наносит _280-560%_ вашего урона; на _2 хода_ от него расходится звезда световых шпилей, поражающая врагов на _140%_ вашего урона и благословляющая союзников.
actors.hero.skills.meteorcall.desc=Отметьте видимую клетку, и на следующем ходу туда упадёт метеорит, взрываясь и поджигая всех врагов в области 3×3. В центре падения урон в полтора раза выше.\n\n_+1:_ Дальность _7 клеток_. Урон _240-480%_ от вашего.\n\n_+2:_ Дальность _9 клеток_. Урон _320-640%_.\n\n_+3:_ Дальность _11 клеток_. Урон _400-800%_. Удар оглушает врагов, а через ход на месте падения происходит повторный выброс.
