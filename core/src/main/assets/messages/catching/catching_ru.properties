# Дополнение русского перевода: пакет 500 ключей
items.catching.catching.guest=В совместной игре ловить насекомых, мелких животных и рыбу может только ведущий.
items.catching.bugnet.desc=Лёгкая сетка на обруче из гнутого тростника. Длинной рукоятью можно дотянуться на три шага. Взмахните сачком в сторону видимой бабочки, светлячка или другой мелкой живности — добыча окажется в банке. Её можно пустить на наживку или просто выпустить на волю.\n\nЖивность быстро учится избегать сачка. В одной местности первые три поимки за день даются легко, каждая следующая — труднее. После шести поимок остальные существа будут держаться подальше до следующего дня.
items.catching.bugnet.reach=Сачок достаёт лишь на %d шага и только до того, что вы видите.
items.catching.bugnet.flitted=%s успевает ускользнуть до того, как опускается сачок.
items.catching.bugnet.wary=%s держится подальше от сачка. Местная живность стала осторожнее. Попробуйте в другом месте или возвращайтесь завтра.
items.catching.fishingrod.desc=Гибкое удилище с леской, крючком и красно-белым поплавком. Забрасывайте его в видимую открытую воду на расстояние до четырёх шагов: с берега, моста или лодки. Можно рыбачить и со льда, прорубив лунку прямо рядом с собой. Для каждого заброса нужна наживка: дождевой червь или живность из банки.\n\nПока рыба не клюёт, вы отдыхаете и следите за поплавком. Поклёвка выведет вас из отдыха: подсеките в течение трёх ходов, иначе рыба уплывёт вместе с наживкой. Если отойдёте, леска будет смотана.
items.catching.fishingrod.no_fish_here=Здесь рыба не клюёт. Ищите её в реках, озёрах и морях на поверхности, а также в водоёмах пещер и гор.
items.catching.fishingrod.not_water=Забрасывать удочку можно только в открытую воду или в прорубь во льду.
items.catching.fishingrod.ice_reach=Прорубить лунку можно только во льду рядом с вами.
items.catching.fishingrod.reach=Леска достаёт лишь на %d шага — и только до видимой воды.
items.catching.fishingrod.no_bait=У вас нет наживки. Червей можно выкопать лопатой при обработке почвы или купить у деревенских рыбаков. Сачком можно ловить живность для насадки на крючок.
items.catching.fishingrod.cast=Вы забрасываете удочку в %s, насадив на крючок %s.
items.catching.fishingrod.cast_ice=Вы прорубаете лунку и опускаете в неё леску с наживкой: %s.
items.catching.fishingrod.bait_chosen=Пока этот вид наживки есть у вас, на крючок будет насаживаться %s.
items.catching.fishingline.escaped=Рыба сорвалась и утащила наживку.
items.catching.fishingline.nothing=Никто не клюёт, а наживку уносит течением.
items.catching.fishingline.boot=Вы вытаскиваете старый сапог, полный водорослей.
items.catching.fishingline.bottle=Вы выуживаете бутылку с запиской внутри!
items.catching.fishingline.purse=Вы выуживаете промокший кошелёк. Из него выпадают %d золотых монет!
items.catching.earthworm.desc=Извивающийся дождевой червь — самая простая наживка. На него клюёт большинство рыб в реках, озёрах и болотах. Червей можно находить лопатой при вскапывании земли или травы, особенно в дождь, а также покупать у деревенских рыбаков.
items.catching.critterjar.bait_fly=На крючке это крылатое насекомое, на которое особенно хорошо клюёт форель.
items.catching.critterjar.bait_grub=На крючке это ползающая личинка, на которую охотно идут окунь и сом.
items.catching.critterjar.bait_live=Живая наживка — любимая добыча щуки.
items.catching.critterjar.bait_glow=Свечение этой наживки привлекает обитателей темноты: слепую рыбу из пещерных водоёмов и арктического гольца подо льдом.
items.catching.critterjar.cabbage_white_desc=Белая бабочка с серыми кончиками крыльев, пойманная среди летней травы.
items.catching.critterjar.brimstone_desc=Бабочка жёлтая, словно свежая сера.
items.catching.critterjar.orange_tip_desc=Белая бабочка с ярко-оранжевыми кончиками крыльев.
items.catching.critterjar.common_blue_desc=Маленькая бабочка цвета ясного неба.
items.catching.critterjar.firefly_desc=Светлячок мигает в банке, озаряя её короткими зелёно-золотыми вспышками.
items.catching.critterjar.moth_desc=Кремовая ночная бабочка, прилетевшая на свет факела.
items.catching.critterjar.cinder_moth_desc=Оранжевая бабочка из подземных залов, всё ещё тёплая на ощупь.
items.catching.critterjar.frost_moth_desc=Бледно-голубая бабочка из ледяных глубин. Крылья покрыты инеем.
items.catching.critterjar.fly_desc=Толстая муха, спасённая из паутины лишь для того, чтобы оказаться в банке.
items.catching.critterjar.beetle_desc=Тёмный жук, без конца бегающий кругами по дну банки.
items.catching.critterjar.ember_beetle_desc=Жук, спинка которого тлеет, словно уголёк.
items.catching.critterjar.roach_desc=Таракан. Рыбу это ничуть не смущает.
items.catching.critterjar.centipede_desc=Сороконожка перебирает множеством лапок, пытаясь выбраться.
items.catching.critterjar.silverfish_desc=Шустрая серебристая чешуйница из щелей между старыми камнями.
items.catching.critterjar.spider_desc=Паук с подземных стен оплетает внутреннюю поверхность банки паутиной.
items.catching.critterjar.spiderling_desc=Молодой паучок из паутинного гнезда.
items.catching.critterjar.snail_desc=Улитка спряталась в раковину и даже не пыталась сбежать.
items.catching.critterjar.strider_desc=Водомерка сложила длинные лапки в сухой банке.
items.catching.critterjar.frog_desc=Маленькая лягушка, изредка квакающая в банке.
items.catching.critterjar.newt_desc=Тритон с оранжевым брюшком из холодных пещерных вод.
items.catching.critterjar.lizard_desc=Шустрая ящерица, гревшаяся у тёплых вентиляционных отверстий города.
items.catching.caughtfish.raw=Сырую рыбу можно съесть, чтобы слегка утолить голод. Если пожарить её на очаге или любом огне либо сварить в котелке, она насытит гораздо лучше и немного восстановит здоровье. Деревенские рыбаки хорошо платят за свежую рыбу.
items.catching.caughtfish.trout_desc=Пятнистая форель из холодной проточной воды: оливковая спинка и розовая полоска вдоль бока.
items.catching.caughtfish.perch_desc=Полосатый окунь с оранжевыми плавниками — самая обычная рыба стоячих водоёмов.
items.catching.caughtfish.pike_desc=Длинная зубастая щука — хищница озёр и болот. Одной такой хватит на полтора обеда.
items.catching.caughtfish.catfish_desc=Усатый сом со илистого дна, вышедший на ночную охоту.
items.catching.caughtfish.mackerel_desc=Стремительная серебристая морская рыба с зелёно-чёрными полосами на спине.
items.catching.caughtfish.char_desc=Тёмный голец с красным брюшком, выловленный из-подо льда или высокогорного озера.
items.catching.caughtfish.cavefish_desc=Бледная слепая рыба из водоёмов глубоко под землёй. Она нашла крючок по его свечению.
items.catching.cookedfish.grilled_desc=Рыба, поджаренная на огне до хрустящей корочки. Хорошо утоляет голод и немного восстанавливает здоровье.
items.catching.cookedfish.poached_desc=Нежная рыба, томлённая в котелке. Хорошо утоляет голод и немного восстанавливает здоровье.
items.catching.oldboot.desc=Промокший старый сапог без шнурков, набитый водорослями. Кто-то где-то до сих пор его ищет. Стоит монету и занятную историю.
items.catching.messagebottle.desc=Выловленная из воды закупоренная бутылка со свёрнутой запиской. Прочитайте её на поверхности под открытым небом: там сказано о закопанном кладе, а место появится на карте мира.
items.catching.messagebottle.no_surface=Указания в записке имеют смысл только под открытым небом на поверхности.
items.catching.messagebottle.no_match=Поблизости нет ничего похожего на рисунок в записке. Прочитайте её ещё раз в другом месте, ближе к открытой местности.
items.catching.messagebottle.marked=На вашей карте мира отмечено нужное место.
items.catching.messagebottle.note_0=«Если кто-то найдёт эту записку: я закопал всё, что смог унести, прежде чем буря унесла лодку. Вернуться за вещами я так и не смог».
items.catching.messagebottle.note_1=«Брату: бабушкины сбережения лежат не под полом, что бы она тебе ни говорила. Я их переложил. Копай там, где я отметил».
items.catching.messagebottle.note_2=«Я спрятал добычу из лагеря разбойников и сбежал. Если записка попадёт к тебе, клад твой. Они всё равно не перестанут его искать».
items.catching.messagebottle.note_3=«Последний улов рыбака: маленький сундук, зарытый в земле далеко от воды. Рыбе он не достался, и сборщику налогов тоже не достанется».
items.catching.messagebottle.where=Ниже нацарапан примерный план: около %d шагов на %s от места, где вы прочли записку. Место отмечено на карте мира. Копайте там лопатой.
items.catching.bottlecaches.found=Лопата ударяется о дерево: небольшой сундук зарыт точно там, где было указано в записке!
items.catching.bottlemarks.mark_surface=метка бутылки (на поверхности)
windows.wndfisher.offer=«Рыбу продавать будешь или снасти нужны?»
windows.wndfisher.sell=Продать улов: %d рыб за %d золотых
windows.wndfisher.sold=Рыбак платит вам %d золотых за улов.
