###o puçá e a vara de pesca (items/catching)

items.catching.catching.guest=Numa partida compartilhada, só o anfitrião pode pegar bichinhos e pescar.

items.catching.bugnet.name=puçá
items.catching.bugnet.ac_swing=PASSAR
items.catching.bugnet.prompt=Escolha onde passar o puçá
items.catching.bugnet.desc=Uma rede fina num aro de taquara curvada, na ponta de um cabo comprido o bastante para alcançar três passos. Passe o puçá numa borboleta, num vaga-lume ou em qualquer bichinho que você consiga ver, e ele vai parar num pote: isca para uma vara de pesca, ou uma coisa bonita para soltar depois.\n\nOs bichinhos aprendem a fugir do puçá. Em cada trecho de terra, os três primeiros que você pega no dia vêm fácil; cada um depois disso é mais difícil de pegar, e depois de seis o resto fica longe de você até o dia seguinte.
items.catching.bugnet.reach=O puçá só alcança %d passos, e só o que você consegue ver.
items.catching.bugnet.nothing=Não tem nada ali para pegar.
items.catching.bugnet.caught=Pego no puçá: %s.
items.catching.bugnet.missed=Escapou do puçá: %s.
items.catching.bugnet.flitted=Quando o puçá desce, já não está mais lá: %s.
items.catching.bugnet.wary=Fugiu do puçá: %s. Os bichinhos daqui ficaram espertos. Tente outro trecho de terra, ou volte amanhã.

items.catching.fishingrod.name=vara de pesca
items.catching.fishingrod.ac_cast=LANÇAR
items.catching.fishingrod.ac_reel=RECOLHER
items.catching.fishingrod.ac_bait=ISCA
items.catching.fishingrod.prompt=Escolha onde lançar a linha
items.catching.fishingrod.desc=Uma vara flexível com linha, anzol e uma boia vermelha e branca. Lance a linha em água aberta que você consiga ver, a até quatro passos, de uma margem, de uma ponte ou de um barco, ou no gelo bem ao seu lado, onde você abre um buraco. Todo lançamento põe uma isca no anzol: uma minhoca, ou um bichinho de um pote.\n\nVocê descansa e fica de olho na boia enquanto espera. Quando um peixe morde, você desperta: recolha a linha em até três turnos, ou ele escapa com a isca. Se você sair do lugar, a linha volta.
items.catching.fishingrod.no_fish_here=Nada nestas águas morde um anzol. Pesque nos rios, lagos e mares do mundo lá em cima, e nos poços das cavernas e das montanhas.
items.catching.fishingrod.not_water=Você só pode lançar a linha em água aberta ou no gelo.
items.catching.fishingrod.ice_reach=Você só consegue abrir um buraco no gelo bem ao seu lado.
items.catching.fishingrod.reach=A linha só alcança %d passos, e só a água que você consegue ver.
items.catching.fishingrod.occupied=Tem alguma coisa na água ali.
items.catching.fishingrod.no_bait=Você não tem isca. A pá revira minhocas quando ara a terra, os pescadores das vilas vendem, e um puçá pega bichinhos para o anzol.
items.catching.fishingrod.cast=Você lança a linha no %s, com %s no anzol.
items.catching.fishingrod.cast_ice=Você abre um buraco no gelo e desce a linha por ele, com %s no anzol.
items.catching.fishingrod.water_river=rio
items.catching.fishingrod.water_lake=lago
items.catching.fishingrod.water_sea=mar
items.catching.fishingrod.water_swamp=brejo
items.catching.fishingrod.water_ice=gelo
items.catching.fishingrod.water_cave=poço da caverna
items.catching.fishingrod.water_tarn=lago da montanha
items.catching.fishingrod.bait_prompt=Escolha a isca
items.catching.fishingrod.bait_chosen=Enquanto tiver, você vai usar como isca: %s.
items.catching.fishingrod.bait_none=Você não tem isca.
items.catching.fishingrod.bait_next=Próxima isca: %s.

items.catching.fishingline.pulled=Você recolhe a linha.
items.catching.fishingline.escaped=O peixe escapou e levou a isca.
items.catching.fishingline.nothing=Nada morde, e a isca se solta.
items.catching.fishingline.bite=Fisgou! Recolha a linha!
items.catching.fishingline.empty=Você recolhe o anzol vazio.
items.catching.fishingline.landed=Você tira da água: %s!
items.catching.fishingline.boot=Você puxa uma bota velha, cheia de algas.
items.catching.fishingline.bottle=Você puxa uma garrafa com uma mensagem dentro!
items.catching.fishingline.purse=Você puxa uma bolsa encharcada: %d moedas de ouro caem aos seus pés!

items.catching.earthworm.name=minhoca
items.catching.earthworm.desc=Uma minhoca se contorcendo, a isca mais simples que existe: a maioria dos peixes de rios, lagos e brejos morde. A pá revira minhocas quando ara a grama ou a terra nua, mais ainda na chuva, e os pescadores das vilas vendem aos punhados.

items.catching.critterjar.name=bichinho no pote
items.catching.critterjar.ac_release=SOLTAR
items.catching.critterjar.released=Você solta: %s.
items.catching.critterjar.bait_fly=No anzol, vale como inseto alado: as trutas são as que mais sobem atrás dele.
items.catching.critterjar.bait_grub=No anzol, vale como bichinho rasteiro: percas e bagres mordem fácil.
items.catching.critterjar.bait_live=No anzol, vale como isca viva, a favorita do lúcio.
items.catching.critterjar.bait_glow=No anzol, o brilho atrai os peixes do escuro: os peixes-cegos dos poços das cavernas e a truta-ártica debaixo do gelo.
items.catching.critterjar.cabbage_white=borboleta-branca
items.catching.critterjar.cabbage_white_desc=Uma borboleta branca de pontas cinzentas, pega sobre a grama de verão.
items.catching.critterjar.brimstone=borboleta-limão
items.catching.critterjar.brimstone_desc=Uma borboleta do amarelo do enxofre.
items.catching.critterjar.orange_tip=borboleta-de-ponta-laranja
items.catching.critterjar.orange_tip_desc=Uma borboleta branca com as pontas das asas laranja vivo.
items.catching.critterjar.common_blue=borboleta-azul
items.catching.critterjar.common_blue_desc=Uma borboleta pequena, azul como o céu limpo.
items.catching.critterjar.firefly=vaga-lume
items.catching.critterjar.firefly_desc=Um vaga-lume piscando no pote, acendendo tudo em lampejos curtos, verdes e dourados.
items.catching.critterjar.moth=mariposa
items.catching.critterjar.moth_desc=Uma mariposa cor de creme, pega rondando a chama de uma tocha.
items.catching.critterjar.cinder_moth=mariposa-de-brasa
items.catching.critterjar.cinder_moth_desc=Uma mariposa laranja dos salões, ainda morna ao toque.
items.catching.critterjar.frost_moth=mariposa-da-geada
items.catching.critterjar.frost_moth_desc=Uma mariposa azul-clara das profundezas geladas, com as asas cobertas de geada.
items.catching.critterjar.fly=mosca
items.catching.critterjar.fly_desc=Uma mosca gorda, solta de uma teia só para acabar num pote.
items.catching.critterjar.beetle=besouro
items.catching.critterjar.beetle_desc=Um besouro escuro que fica rodando e rodando no fundo do pote.
items.catching.critterjar.ember_beetle=besouro-brasa
items.catching.critterjar.ember_beetle_desc=Um besouro com as costas brilhando feito carvão em brasa.
items.catching.critterjar.roach=barata
items.catching.critterjar.roach_desc=Uma barata. Os peixes não se importam.
items.catching.critterjar.centipede=centopeia
items.catching.critterjar.centipede_desc=Uma centopeia, só pernas, procurando uma saída.
items.catching.critterjar.silverfish=traça
items.catching.critterjar.silverfish_desc=Um inseto prateado e ligeiro, de entre as pedras antigas.
items.catching.critterjar.spider=aranha
items.catching.critterjar.spider_desc=Uma aranha das paredes da masmorra, tecendo um fio por dentro do pote.
items.catching.critterjar.spiderling=aranhinha
items.catching.critterjar.spiderling_desc=Uma aranha filhote, da teia de um ninho.
items.catching.critterjar.snail=caracol
items.catching.critterjar.snail_desc=Um caracol, bem fechado na concha. Nem tentou fugir.
items.catching.critterjar.strider=percevejo-d'água
items.catching.critterjar.strider_desc=Um percevejo-d'água, com as pernas compridas dobradas no pote seco.
items.catching.critterjar.frog=rã
items.catching.critterjar.frog_desc=Uma rã pequena que coaxa de vez em quando.
items.catching.critterjar.newt=tritão
items.catching.critterjar.newt_desc=Um tritão de barriga laranja, da água fria das cavernas.
items.catching.critterjar.lizard=lagartixa
items.catching.critterjar.lizard_desc=Uma lagartixa ligeira que se aquecia na fumaça morna das chaminés da cidade.

items.catching.caughtfish.name=peixe cru
items.catching.caughtfish.raw=Cru, sustenta pouco. Grelhado numa lareira ou em qualquer fogueira, ou cozido num caldeirão, sustenta bem mais e cura um pouco. Os pescadores das vilas pagam bem por um peixe fresco.
items.catching.caughtfish.trout=truta-de-riacho
items.catching.caughtfish.trout_desc=Uma truta pintada, verde-oliva em cima e rosada nos lados, de água corrente e fria.
items.catching.caughtfish.perch=perca
items.catching.caughtfish.perch_desc=Uma perca listrada de nadadeiras laranja, o peixe mais comum de água parada.
items.catching.caughtfish.pike=lúcio
items.catching.caughtfish.pike_desc=Um lúcio comprido e dentuço, o caçador de lagos e brejos. Rende refeição e meia.
items.catching.caughtfish.catfish=bagre
items.catching.caughtfish.catfish_desc=Um bagre bigodudo do fundo lamacento, que sai para caçar à noite.
items.catching.caughtfish.mackerel=cavala
items.catching.caughtfish.mackerel_desc=Um peixe do mar, liso, ligeiro e prateado, com o dorso listrado de verde e preto.
items.catching.caughtfish.char=truta-ártica
items.catching.caughtfish.char_desc=Uma truta-ártica escura de barriga vermelha, pescada pelo gelo ou num lago alto da montanha.
items.catching.caughtfish.cavefish=peixe-cego
items.catching.caughtfish.cavefish_desc=Um peixe pálido e sem olhos, dos poços nas profundezas do mundo. Achou o anzol pelo brilho.

items.catching.cookedfish.name=peixe cozido
items.catching.cookedfish.grilled=%s na brasa
items.catching.cookedfish.poached=%s ao vapor
items.catching.cookedfish.grilled_desc=Grelhado na brasa até a pele ficar crocante. Sustenta bem e cura um pouco.
items.catching.cookedfish.poached_desc=Cozido devagar no caldeirão, macio e soltando em lascas. Sustenta bem e cura um pouco.

items.catching.oldboot.name=bota velha
items.catching.oldboot.desc=Uma bota velha encharcada, cheia de algas e sem cadarço. Alguém, em algum lugar, ainda sente falta dela. Vale uma moeda, e uma história.

items.catching.messagebottle.name=mensagem na garrafa
items.catching.messagebottle.ac_read=LER
items.catching.messagebottle.desc=Uma garrafa tampada com um bilhete enrolado dentro, pescada da água. Leia sob o céu aberto da superfície: o bilhete fala de algo enterrado, e seu mapa do mundo vai marcar o lugar.
items.catching.messagebottle.no_surface=As direções do bilhete só fazem sentido sob o céu aberto da superfície.
items.catching.messagebottle.no_match=Nada por aqui bate com o esboço do bilhete. Leia de novo em outro lugar, mais perto de terra aberta.
items.catching.messagebottle.marked=Seu mapa do mundo agora marca o lugar.
items.catching.messagebottle.note_title=bilhete na garrafa
items.catching.messagebottle.note_0="Se alguém encontrar isto: enterrei o que consegui carregar antes de a tempestade levar o barco. Nunca pude voltar para buscar."
items.catching.messagebottle.note_1="Para o meu irmão: as economias da vovó não estão debaixo do assoalho, diga ela o que disser. Eu mudei de lugar. Cave onde marquei."
items.catching.messagebottle.note_2="Escondi o que tirei do acampamento dos bandidos e corri. Se isto chegar até você, é seu. Eles não vão parar de procurar."
items.catching.messagebottle.note_3="A última pescaria de um pescador: um pequeno baú, enterrado, bem longe de qualquer água. Os peixes nunca pegaram, e o cobrador de impostos nunca vai pegar."
items.catching.messagebottle.where=Rabiscado embaixo, um esboço tosco: uns %d passos %s de onde você leu. Seu mapa do mundo marca o lugar. Cave ali com uma pá.
items.catching.messagebottle.north=ao norte
items.catching.messagebottle.northeast=a nordeste
items.catching.messagebottle.east=a leste
items.catching.messagebottle.southeast=a sudeste
items.catching.messagebottle.south=ao sul
items.catching.messagebottle.southwest=a sudoeste
items.catching.messagebottle.west=a oeste
items.catching.messagebottle.northwest=a noroeste

items.catching.bottlecaches.found=A pá bate em madeira: um pequeno baú, enterrado bem onde o bilhete dizia!
items.catching.bottlemarks.mark=marca da garrafa
items.catching.bottlemarks.mark_surface=marca da garrafa (na superfície)

