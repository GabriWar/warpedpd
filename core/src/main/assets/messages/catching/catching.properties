###the bug net and the fishing rod (items/catching)

items.catching.catching.guest=In a shared game, only the host can catch critters and fish.

items.catching.bugnet.name=bug net
items.catching.bugnet.ac_swing=SWING
items.catching.bugnet.prompt=Choose where to swing the net
items.catching.bugnet.desc=A fine net on a hoop of bent cane, at the end of a handle long enough to reach three paces. Swing it at a butterfly, a firefly or any small critter you can see, and it goes into a jar: bait for a fishing rod, or a pretty thing to let go again.\n\nCritters grow wary of a net. In any one stretch of land, the first three you catch in a day come easily; each one after that is harder to catch, and after six the rest keep clear of you until the next day.
items.catching.bugnet.reach=The net only reaches %d paces, and only what you can see.
items.catching.bugnet.nothing=There is nothing there to catch.
items.catching.bugnet.caught=Into the net: %s.
items.catching.bugnet.missed=It slips past your net: %s.
items.catching.bugnet.flitted=It is gone from there before the net comes down: %s.
items.catching.bugnet.wary=It keeps clear of your net: %s. The critters around here have grown wary. Try another stretch of land, or come back tomorrow.

items.catching.fishingrod.name=fishing rod
items.catching.fishingrod.ac_cast=CAST
items.catching.fishingrod.ac_reel=REEL
items.catching.fishingrod.ac_bait=BAIT
items.catching.fishingrod.prompt=Choose where to cast
items.catching.fishingrod.desc=A springy rod with a line, a hook and a red and white bobber. Cast it into open water you can see, up to four paces off, from a bank, a bridge or a boat, or into the ice right beside you, where you cut a hole. Every cast puts a bait on the hook: an earthworm, or a critter from a jar.\n\nYou rest and watch the bobber while you wait. When a fish bites you are roused: reel in within three turns, or it gets away with the bait. Step away and the line comes in.
items.catching.fishingrod.no_fish_here=Nothing in these waters takes a hook. Fish the rivers, lakes and seas of the world above, and the pools of its caves and mountains.
items.catching.fishingrod.not_water=You can only cast into open water or onto ice.
items.catching.fishingrod.ice_reach=You can only cut a hole in the ice right beside you.
items.catching.fishingrod.reach=The line only reaches %d paces, and only water you can see.
items.catching.fishingrod.occupied=Something is in the water there.
items.catching.fishingrod.no_bait=You have no bait. The shovel turns up earthworms as it tills the soil, the villages' fishers sell them, and a bug net catches critters for the hook.
items.catching.fishingrod.cast=You cast your line into the %s, baited with %s.
items.catching.fishingrod.cast_ice=You cut a hole in the ice and drop your line through it, baited with %s.
items.catching.fishingrod.water_river=river
items.catching.fishingrod.water_lake=lake
items.catching.fishingrod.water_sea=sea
items.catching.fishingrod.water_swamp=swamp
items.catching.fishingrod.water_ice=ice
items.catching.fishingrod.water_cave=cave pool
items.catching.fishingrod.water_tarn=mountain tarn
items.catching.fishingrod.bait_prompt=Choose the bait to use
items.catching.fishingrod.bait_chosen=While you have it, you will bait the hook with %s.
items.catching.fishingrod.bait_none=You carry no bait.
items.catching.fishingrod.bait_next=Next bait: %s.

items.catching.fishingline.pulled=You pull your line in.
items.catching.fishingline.escaped=The fish got away with your bait.
items.catching.fishingline.nothing=Nothing bites, and the bait drifts off.
items.catching.fishingline.bite=Something bites! Reel it in!
items.catching.fishingline.empty=You reel in an empty hook.
items.catching.fishingline.landed=You land your catch: %s!
items.catching.fishingline.boot=You haul up an old boot, full of weed.
items.catching.fishingline.bottle=You haul up a bottle with a message inside!
items.catching.fishingline.purse=You haul up a sodden purse: %d gold coins spill out at your feet!

items.catching.earthworm.name=earthworm
items.catching.earthworm.desc=A wriggling earthworm, the plainest bait there is: most fish of the rivers, lakes and swamps take it. The shovel turns them up as it tills grass or bare earth, more of them in the rain, and the villages' fishers sell them by the handful.

items.catching.critterjar.name=critter in a jar
items.catching.critterjar.ac_release=RELEASE
items.catching.critterjar.released=You let it go: %s.
items.catching.critterjar.bait_fly=On a hook it is a winged insect: trout rise to it best.
items.catching.critterjar.bait_grub=On a hook it is a crawling grub: perch and catfish take it readily.
items.catching.critterjar.bait_live=On a hook it is live bait, the pike's favourite.
items.catching.critterjar.bait_glow=On a hook its glow draws the fish of the dark: the blind fish of the caves' pools, and the arctic char under the ice.
items.catching.critterjar.cabbage_white=cabbage white
items.catching.critterjar.cabbage_white_desc=A white butterfly with grey wingtips, caught over the summer grass.
items.catching.critterjar.brimstone=brimstone
items.catching.critterjar.brimstone_desc=A butterfly the yellow of fresh sulphur.
items.catching.critterjar.orange_tip=orange tip
items.catching.critterjar.orange_tip_desc=A white butterfly with bright orange wingtips.
items.catching.critterjar.common_blue=common blue
items.catching.critterjar.common_blue_desc=A small butterfly of a clear sky blue.
items.catching.critterjar.firefly=firefly
items.catching.critterjar.firefly_desc=A firefly blinking in its jar, lighting it up in short green and gold flashes.
items.catching.critterjar.moth=moth
items.catching.critterjar.moth_desc=A cream-coloured moth from around a torch's flame.
items.catching.critterjar.cinder_moth=cinder moth
items.catching.critterjar.cinder_moth_desc=An orange moth from the halls, still warm to the touch.
items.catching.critterjar.frost_moth=frost moth
items.catching.critterjar.frost_moth_desc=A pale blue moth from the frozen depths, its wings rimed with frost.
items.catching.critterjar.fly=fly
items.catching.critterjar.fly_desc=A fat fly, freed from a web only to end up in a jar.
items.catching.critterjar.beetle=beetle
items.catching.critterjar.beetle_desc=A dark beetle that trundles round and round the bottom of the jar.
items.catching.critterjar.ember_beetle=ember beetle
items.catching.critterjar.ember_beetle_desc=A beetle whose back glows like a coal.
items.catching.critterjar.roach=cockroach
items.catching.critterjar.roach_desc=A cockroach. The fish do not mind.
items.catching.critterjar.centipede=centipede
items.catching.critterjar.centipede_desc=A centipede, all legs, looking for a way out.
items.catching.critterjar.silverfish=silverfish
items.catching.critterjar.silverfish_desc=A quick, silvery insect from between old stones.
items.catching.critterjar.spider=spider
items.catching.critterjar.spider_desc=A spider off the dungeon's walls, spinning a thread round the inside of the jar.
items.catching.critterjar.spiderling=spiderling
items.catching.critterjar.spiderling_desc=A young spider from a nest's webbing.
items.catching.critterjar.snail=snail
items.catching.critterjar.snail_desc=A snail, shut tight in its shell. It never even tried to get away.
items.catching.critterjar.strider=water strider
items.catching.critterjar.strider_desc=A water strider, its long legs folded up in the dry jar.
items.catching.critterjar.frog=frog
items.catching.critterjar.frog_desc=A small frog that croaks now and then.
items.catching.critterjar.newt=newt
items.catching.critterjar.newt_desc=An orange-bellied newt from the caves' cold water.
items.catching.critterjar.lizard=lizard
items.catching.critterjar.lizard_desc=A quick lizard that was basking in the warm smoke of the city's vents.

items.catching.caughtfish.name=raw fish
items.catching.caughtfish.raw=Raw, it fills you a little. Grilled on a hearth or in any fire, or poached in a cooking pot, it fills you much more and heals you a little. The villages' fishers pay well for a fresh one.
items.catching.caughtfish.trout=brook trout
items.catching.caughtfish.trout_desc=A speckled trout, olive above and pink along its side, from cold running water.
items.catching.caughtfish.perch=perch
items.catching.caughtfish.perch_desc=A striped perch with orange fins, the commonest fish of still water.
items.catching.caughtfish.pike=pike
items.catching.caughtfish.pike_desc=A long, toothy pike, the hunter of lakes and swamps. A meal and a half.
items.catching.caughtfish.catfish=catfish
items.catching.caughtfish.catfish_desc=A whiskered catfish from the muddy bottom, out hunting at night.
items.catching.caughtfish.mackerel=mackerel
items.catching.caughtfish.mackerel_desc=A sleek sea fish, quick and silvery, its back striped green and black.
items.catching.caughtfish.char=arctic char
items.catching.caughtfish.char_desc=A dark char with a red belly, taken through the ice or out of a high mountain tarn.
items.catching.caughtfish.cavefish=cave fish
items.catching.caughtfish.cavefish_desc=A pale, eyeless fish from the pools deep under the world. It found your hook by its glow.

items.catching.cookedfish.name=cooked fish
items.catching.cookedfish.grilled=grilled %s
items.catching.cookedfish.poached=poached %s
items.catching.cookedfish.grilled_desc=Grilled over the fire until the skin crisps. It fills you well and heals you a little.
items.catching.cookedfish.poached_desc=Poached gently in a pot, tender and flaking. It fills you well and heals you a little.

items.catching.oldboot.name=old boot
items.catching.oldboot.desc=A sodden old boot, full of weed and missing its laces. Someone, somewhere, is still missing it. It is worth a coin, and a story.

items.catching.messagebottle.name=message in a bottle
items.catching.messagebottle.ac_read=READ
items.catching.messagebottle.desc=A stoppered bottle with a rolled-up note inside, fished out of the water. Read it under the open sky of the surface: the note tells of something buried, and your world map will mark the spot.
items.catching.messagebottle.no_surface=The note's directions only make sense under the open sky of the surface.
items.catching.messagebottle.no_match=Nothing around here matches the sketch on the note. Read it again somewhere else, nearer open land.
items.catching.messagebottle.marked=Your world map now marks the spot.
items.catching.messagebottle.note_title=a note in a bottle
items.catching.messagebottle.note_0="If anyone finds this: I buried what I could carry before the storm took the boat. I could never go back for it."
items.catching.messagebottle.note_1="To my brother: our grandmother's savings are not under the floor, whatever she told you. I moved them. Dig where I marked."
items.catching.messagebottle.note_2="I hid what I took from the bandits' camp and ran. If this reaches you, it is yours. They will not stop looking."
items.catching.messagebottle.note_3="A fisherman's last catch: one small chest, in the ground, a long way from any water. The fish never got it, and the tax collector never will."
items.catching.messagebottle.where=Scrawled under it is a rough sketch: about %d paces %s of where you read it. Your world map marks the spot. Dig there with a shovel.
items.catching.messagebottle.north=north
items.catching.messagebottle.northeast=northeast
items.catching.messagebottle.east=east
items.catching.messagebottle.southeast=southeast
items.catching.messagebottle.south=south
items.catching.messagebottle.southwest=southwest
items.catching.messagebottle.west=west
items.catching.messagebottle.northwest=northwest

items.catching.bottlecaches.found=Your spade strikes wood: a small chest, buried right where the note said!
items.catching.bottlemarks.mark=the bottle's mark
items.catching.bottlemarks.mark_surface=the bottle's mark (on the surface)

homestead.stations.stationrecipe.raw_fish=raw fish
homestead.stations.stationrecipe.grilled_fish=grilled fish
homestead.stations.stationrecipe.poached_fish=poached fish

