# Russian translation: guide basics (reviewed batch)
guide.basics_defeat=Смерть завершает забег. Герой попадает в таблицу рекордов, а всё, что было нажито за этот забег, исчезает — даже обустроенные усадьбы. Но знания остаются: руководство, каталог, бестиарий и достижения сохраняются для следующих попыток. Новый герой может найти ваши _останки_ на месте гибели или глубже в подземелье. Иногда среди них окажется один из ваших предметов.\n\n_Анх_ позволяет воскреснуть. Обычный анх переносит вас в другое место того же этажа с двумя предметами на выбор; остальные вещи останутся в сумке там, где вы погибли. Если благословить анх полной флягой воды, он спасёт вас прямо на месте, восстановив четверть здоровья. Анх продаётся в каждой подземной лавке.\n\nДаже _Амулет Йендора_ на глубине 26 не завершает приключение: выберитесь с ним через первый этаж, и откроются запечатанные курганы на поверхности. Большинству героев приходится погибнуть не раз, прежде чем кому-то удастся победить.
guide.basics_levelling=За убийство врагов вы получаете опыт. Чтобы перейти с 1-го уровня на 2-й, нужно 10 очков опыта; каждый следующий уровень требует на 5 больше предыдущего, вплоть до 30-го. После 30-го предела нет: требования продолжают расти, но не превышают 500 очков. Слишком слабый для вас враг приносит лишь четверть обычного опыта.\n\nКаждый уровень увеличивает максимальное здоровье на 5 (и восстанавливает столько же), точность и уклонение — на 1, ману — на 2, а также даёт 3 очка для _талантов_ и навыков. _Зелье опыта_ сразу повышает уровень на один.\n\nСтарайтесь получать примерно по уровню за этаж. Если слишком быстро спускаться, враги окажутся сильнее вас. Нажмите на портрет героя, чтобы посмотреть уровень, опыт и характеристики. На вкладке «Урон» хранятся последние 100 нанесённых и полученных ударов, включая промахи. Откройте запись, чтобы увидеть, из чего сложилось итоговое число.
guide.basics_looting=В каждой области из пяти этажей можно найти 2 _зелья силы_, 3 _свитка улучшения_, 1 _магическое перо_ и 1 _патронташ_. Считайте находки, чтобы понять, насколько тщательно вы исследовали этажи: всё из этого списка, чего не оказалось на первых трёх этажах области, будет на четвёртом.\n\nЗа запертой дверью или препятствием обычно скрывается более ценная добыча. Каждый ключ подходит только к тому этажу, где найден: _железный ключ_ открывает дверь, _золотой_ — запертый сундук, _хрустальный_ — хрустальный сундук. Во вкладке заметок журнала перечислены найденные ключи и примечательные места. Осторожно: некоторые сундуки — _мимики_.\n\nВ каждой области спрятано 2–3 тайные комнаты. Подробнее о добыче и других находках читайте в разделах «Темы → Добыча» и «Темы → Комнаты».
guide.basics_magic=_Волшебная палочка_ никогда не промахивается, а броня не защищает от её разряда. Сначала у палочки 2 заряда (у палочки волшебной стрелы — 3). Каждое улучшение добавляет заряд, максимум — 10. Потраченные заряды восстанавливаются сами: последний возвращается примерно за 45 ходов, а остальные — тем быстрее, чем сильнее разряжена палочка. Редкость палочки повышает силу разряда и скорость восстановления зарядов.\n\nВражеская магия действует похоже: точность магического снаряда вдвое выше точности обычного удара, а броня его не останавливает. Заклинатели вроде _гнолла-шамана_ и _дворфийского чернокнижника_ атакуют магией с любого расстояния, пока между вами есть прямая линия обзора. Вблизи они переходят к рукопашному бою. Скройтесь из виду за препятствием и подойдите вплотную.
guide.basics_identifying=Цвета зелий, руны свитков и камни в кольцах меняются при каждом новом забеге. Красное зелье может исцелить вас сегодня и обжечь в следующий раз. Используйте неизвестный предмет — и его вид станет известен до конца забега. _Каталог_ в журнале сохраняет все виды, которые вы когда-либо распознали.\n\nСнаряжение раскрывает свои свойства по мере использования и получения опыта: оружие — примерно после 20 попаданий, броня — после 10 полученных ударов, кольцо — после получения опыта, достаточного для одного уровня, пока оно надето. До этого уровень улучшения скрыт, а предмет может оказаться проклятым и не позволить себя снять.\n\n_Свиток опознания_ сразу раскрывает свойства предмета. _Камень интуиции_ позволяет угадать вид неизвестного зелья, свитка или кольца: верная догадка опознаёт предмет. _Свиток снятия проклятия_ избавляет от проклятий, а в городе _гадалка_ опознаёт три предмета в неделю примерно по 50 золотых за каждый. Зачаровывать можно только опознанное снаряжение.
guide.basics_hunger=_Голод_ усиливается на 1 единицу каждые 2 хода. При 300 единицах герой проголодается — примерно через 600 ходов после сытной еды. При 450 начинается _истощение_. Оно останавливает естественное восстановление здоровья и каждый ход отнимает одну тысячную максимального запаса здоровья. От голода или сильной усталости могут мерещиться несуществующие чудовища. Отдых и магический сон вдвое замедляют наступление голода, тепловой удар ускоряет его, а _кольцо насыщения_ замедляет. На запечатанном этаже босса голод не растёт.\n\n_Порция еды_ утоляет 300 единиц голода, _пирожок_ — 450, _малая порция_ — 150. На каждом этаже, кроме этажей с боссами, есть одна порция пищи. Пока вы не истощены, каждые 10 ходов восстанавливается 1 единица здоровья. Поэтому есть при полном здоровье невыгодно: часть возможного исцеления пропадёт. Лучше подкрепиться, когда вы голодны и ранены.\n\nНе забывайте о сне. Через полтора дня без сна герой начинает _дремать_ и хуже видит, а спустя три дня падает без сил с наступлением ночи. Отдохните или поспите в кровати, чтобы восстановиться.
guide.basics_farming=На поверхности можно выращивать пищу и семена. Создайте _грядку_ с помощью _лопаты_ или через меню строительства, затем посадите на ней любое _семя_. Из него вырастет _растение_, которое продолжит расти даже в ваше отсутствие.\n\nВесной растения растут на четверть быстрее, осенью — на четверть медленнее, а зимой не растут вовсе. Под стеклом они круглый год растут с летней скоростью. Вода рядом с грядкой ускоряет рост. Когда урожай созреет, соберите его _серпом_ или боевой косой из инвентаря: куст пустофрукта даст пустофрукты, кукурузная пшеница — свои стебли, а большинство других культур — собственные семена.\n\nРастение под открытым небом погибнет, если температура его клетки опустится ниже −2 градусов. По ночам кролики и олени поедают посевы, не защищённые _забором_. _Удобрение_ ускоряет созревание. Подробнее — в разделе «Усадьбы → Земледелие».
guide.basics_positioning=Не сражайтесь на открытом месте, если рядом есть _коридор_. Отступите на клетку за дверной проём, и противники будут подходить по одному. Если остаться в комнате или прямо в дверях, вас смогут атаковать сразу трое.\n\n_Высокая трава_ скрывает обзор в обе стороны, но тот, кто проходит сквозь неё, приминает стебли. Преследователь увидит проложенную вами дорожку. _Охотница_ не приминает траву; вы тоже можете этого избежать, если _крадётесь_ (со скоростью вдвое ниже обычной). Тогда трава продолжит скрывать вас, и враг может потерять след. Поджидайте противника за нетронутой травой, чтобы нанести внезапный удар. _Вода_ тушит огонь на герое. Падение в _пропасть_ отнимает не меньше половины текущего здоровья, а обнаруженную _ловушку_ можно обойти. На тёмном этаже дальность зрения сокращается до пяти восьмых обычной.\n\nЛучникам и магам нужна прямая линия атаки. Спрячьтесь за углом, чтобы они потеряли вас из виду, и сближайтесь.
guide.basics_intro=Это руководство написал погибший исследователь подземелий. Его страницы разбросаны по всему миру. Страница об этаже лежит этажом ниже, чтобы не раскрывать секреты заранее; страницы об ответвлениях находятся внутри самих ответвлений. Пока вы впервые не спуститесь в подземелье, записи не появятся. После этого страницы о поверхности будут открываться при первом посещении места или выполнении действия, а страница о боссе — с началом сражения. Все найденные страницы сохраняются и в следующих забегах.\n\nГлава «Первые шаги» заполняется по мере игры: когда возникает новая ситуация, открывается соответствующий урок, а _кнопка журнала_ начинает мигать. Нажмите её, чтобы прочитать полезную сейчас подсказку — один из основных уроков или недавно найденную страницу.\n\nПолное руководство доступно через _лупу_, на последней вкладке журнала и из журнала в главном меню. Непрочитанные страницы подсвечиваются, а поиск находит страницы по любому слову. Пока вы не прочтёте эту страницу, она будет ждать вас на городской площади рядом с местом прибытия и во входной комнате первого этажа.
guide.basics_alchemy=_Алхимический котёл_ превращает ненужные вещи в полезные. На третьем или четвёртом этаже каждой области за запертой дверью находится лаборатория с котлом и 5 _кристаллами энергии_. Там же могут встретиться недостающие страницы руководства по алхимии — его можно открыть во вкладке алхимии журнала. Кроме того, котёл можно построить в своей усадьбе.\n\nВ котле лишние предметы превращаются в алхимическую энергию: зелье или свиток дают 6 единиц, рунический камень — 3, семя — 1. Переработка неизвестного зелья или свитка также опознаёт его. Из трёх семян можно сварить зелье; для этого котёл возьмёт из рюкзака пустую бутылку или бутылку воды. Выпитое зелье возвращает пустую бутылку. Для большинства остальных рецептов нужна энергия.\n\nГде-то на глубинах с первой по третью можно найти _катализатор безделушек_. За 6 единиц энергии он позволяет выбрать одну из 4 _безделушек_ — полезных на протяжении всего забега предметов. За дополнительную энергию их можно улучшить в котле до +3.
