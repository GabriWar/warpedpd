guide.hint.basics_positioning=Запись откроется, когда вы впервые сразитесь в дверном проёме, коридоре или между двумя врагами
guide.hint.tag_gather=Запись откроется, когда в рюкзаке впервые окажется стройматериал или сумка строителя
guide.hint.basics_strength=Запись откроется, когда вы впервые наденете слишком тяжёлое снаряжение или выпьете зелье силы
guide.mines_f8=Две страницы дневника Отилюка можно найти в книжных шкафах: _Хранилище_ и _Драконья пещера_. У каждого книжного шкафа есть шанс 1 к 50 выдать любую из этих страниц, если он сгорит, пока на вас действует видение разума, или если вы опустошите его целенаправленным поиском. За один забег можно получить лишь по одной странице каждого вида. Страница «Драконья пещера» открывает глубину 67, где лежит яйцо теневого дракона. В шахтах нет книжных шкафов, как и в городской библиотеке.
guide.halls_f2=Здесь появляются суккуб, злой глаз и маг хаоса.\n\nВторой рассадник демонов создаёт потрошителя каждые 53 хода (на глубине 21 — каждые 60). Зачистите комнату с рассадником, закройте дверь и постепенно уничтожайте его. Потрошители будут проходить через дверь по одному — удобная цель для бомб и огня. Из рассадника также выпадет зелье исцеления.\n\nНа этом этаже есть покрытый инеем проход в _Ледяные залы_ — ответвление из пяти этажей. Его обитатели не уступают по силе демонам этих залов.
guide.mines_f9=На глубине 65 сразу после вашего появления выход будет запечатан: ни лестница наверх, ни _Маяк возвращения в город_ не сработают, пока не погибнет местный голем. Перед спуском продайте руду и отдохните в городе.\n\nЧто взять с собой: _реликтовое оружие_ (без него голем получает лишь от 1 единицы до четверти обычного урона), Маяк возвращения в город, побольше лечебных средств и либо сильного питомца, либо никакого.\n\nВнизу вас ждут 88 спящих _стражей шахты_, 8 _светящихся башен_, наносящих 300–600 урона при приближении на 4 клетки, и сам голем.
guide.mines_f5=Помимо 9 кусков руды, на каждом этаже шахт встречаются от 3 до 5 случайных предметов (четверть — в сундуках, ещё несколько — у скелетов, которые оживают, если найденный предмет проклят) и от 1 до 3 кучек золота. Разбойник с вероятностью 1 к 3 на каждом этаже может найти бомбу. С учётом руды, которую несут купуа, полная зачистка этажа приносит больше 10 000 золотых.\n\nРудные жилы на стенах — лишь украшение: здесь нельзя копать. Баррикады горят, как и мох вокруг них, поэтому прежде чем поджигать преграду, продумайте путь отхода.
guide.sewers_overview=Глубины 1–5. Чем глубже вы спускаетесь, тем больше здоровья и урона у крыс, гноллов и крабов. На глубинах 2–4 спрятаны две тайные комнаты.\n\nГородские лавки находятся на одну лестницу выше глубины 1 и закрываются на ночь. Первый магазин внутри подземелья встретится на глубине 6.\n\nПогода с поверхности проникает и в эти туннели, хотя здесь её влияние слабее: идут дождь и снег, дует ветер. В сильный мороз вода замерзает, и Слизень на нижнем этаже не сможет лечиться, стоя на льду. В полнолуние после заката здесь могут появляться призраки — иногда сразу по двое.
guide.halls_f4=Дальность обзора падает до 2 клеток. Здесь появляются три скорпиона, два злых глаза, суккуб, заблудшая душа и _демоническая слизь_. Большинство из них бьёт с расстояния, превышающего вашу видимость. Держитесь стен, а на открытых участках пользуйтесь невидимостью.\n\nПоследний рассадник выпускает потрошителя каждые 40 ходов. До глубины 25 уничтожьте все четыре рассадника: каждый уцелевший рассадник добавит Йог-Дзеве полноценного потрошителя вместо личинки.\n\nПеред спуском потратьте оставшиеся свитки улучшения, запаситесь лечением и сохраните хотя бы два факела.
guide.boss_dragon=В каждом отмеченном на карте драконьем логове живёт дракон. У него 8 000 здоровья, а движется он вдвое быстрее вас. Укус наносит 150–300 урона; если дракон видит вас, он может с любого расстояния плюнуть ядом, наносящим 300–600 урона.\n\nЕсли он вас заметил, спрячьтесь за скалой и уходите. На открытой местности от дракона не убежать.\n\nВ его сокровищнице лежат три кучки золота по 200–600 монет. Убитый дракон не возрождается, и другой не займёт его логово. Вызывайте дракона на бой, только если уже получили уровни и снаряжение из курганов, — и только там, откуда сможете отступить.
guide.mines_f6=В ночи _полнолуния_, начиная с сумерек, на всех этажах шахт появляются _призрачные крысы_. После наступления темноты их становится больше. У них 80 здоровья плюс 3 за каждую глубину (здесь около 260), скорость в четыре раза выше обычной, укус наносит 30–61 урона, а теневые снаряды — 20–45. Каждый пятый снаряд ещё и ослабляет вас. Ни опыта, ни добычи с этих крыс нет.\n\nУбежать от них невозможно. Крысы, уже появившиеся на этаже, не исчезают с рассветом. Прерывайте линию обзора, чтобы вынудить их подойти к вам, или вовсе не спускайтесь в шахты в полнолуние.
guide.den_thiefcatch=Глубина 41 — ловушка. Попасть сюда можно только провалившись в пропасть на глубине 40. Выбраться невозможно: этаж считается ареной босса, поэтому Маяк Ллойда, СанЧикара и любые ключи от логов отказываются работать, а лестниц нет. Забег продолжится здесь, но обратного пути уже не будет.\n\nПлан этажа повторяет логово Тенгу: несколько комнат с водой и мхом, а предполагаемое место выхода замощено. Никаких предметов здесь нет. Если к вашему падению Тенгу в логове на глубине 36 ещё жив, здесь появится и один король разбойников.
guide.mines_f4=Без реликвии купуа и гуллинов приходится убивать очень долго. Их броня (до 50, у гуллинов — до 145) вычитается при каждом попадании ещё до снижения урона, поэтому несколько сильных ударов намного эффективнее множества слабых.\n\nОтравляющий газ возникает, только если один удар после снижения урона отнимает больше восьмой части здоровья врага: 69 единиц у купуа или 94 у гуллина. Нанесите такой удар и выйдите из облака.\n\nВ шахтах нет дверей. Сражайтесь в узких проходах, чтобы враги подходили по одному, и возвращайтесь в город, когда потребуется передышка.
guide.mines_f7=Купуа наносят 70–160 урона, а укусы питомца ослабляются защитой врагов так же, как ваши удары. Молодой питомец здесь быстро погибнет. Оставьте слабого спутника в городе: он пойдёт за вами вниз, только если будет стоять рядом у лестницы. _Свистком_ можно подозвать его с любого расстояния.\n\n_Яйцо_ можно получить в головоломках Сокобана, логове Тенгу или комнате-гнезде с инкубатором. Пока вы носите его с собой, учитывается только время. Если оставить яйцо на земле, на будущего детёныша повлияют условия вокруг (см. «Задания, NPC и питомцы»). Потрясите яйцо, чтобы проверить, есть ли внутри жизнь, и затем разбейте скорлупу. Если сделать это слишком рано, получите лишь желток.
guide.sea_wrecks=_Кораблекрушения_ можно обнаружить на пляжах, прибрежных отмелях и некоторых островах. Когда-то каждое такое судно носило своё имя; стоит вам впервые увидеть обломки, как корабль с его названием появится на карте мира.\n\nРазбитый корпус непроходим, за исключением _трюма_, проломленного с одной стороны. Зайдите внутрь и осмотрите то, что море оставило от груза: сундук с 4–8 досками, 1–3 отрезками верёвки и 60–200 золотыми. Примерно в каждом третьем затонувшем корабле найдётся ещё и кольцо, волшебная палочка или артефакт. Забрать груз можно лишь один раз.\n\nИменно доски и верёвки нужны мореходу, чтобы починить лодку или построить новую.
guide.mines_f2=Рабочий порядок такой: зачистите этаж, соберите руду и перенеситесь в город с помощью _Маяка возвращения в город_. Продайте руду по 1 000 золотых за кусок, затем снова используйте маяк, чтобы вернуться точно туда, откуда ушли. Городской стражник выдаст маяк, когда вы впервые заговорите с ним днём.\n\nМаяк не сработает, если рядом с вами находится какое-либо существо или этаж запечатан. На глубине 65 выход блокируется сразу при входе, так что перенестись оттуда нельзя, пока не погибнет босс.\n\nДневник Отилюка не заряжается ни в шахтах, ни где-либо на поверхности. Пополняйте заряд в подземелье или внутри городских зданий между вылазками.
guide.basics_surprise=Врасплох можно застать врага, который вас ещё не заметил: спящего, бродящего без цели, потерявшего вас из виду или не видящего вас из-за _невидимости_. У такого противника уклонение равно нулю, поэтому удар не промахнётся. Парализованный враг тоже не может увернуться. Но оружием, для которого вам не хватает силы, и _кистенём_ внезапный удар нанести нельзя.\n\n_Канализационная змея_ уворачивается почти от всех обычных атак. Заставьте её преследовать вас до двери, отойдите в сторону и ударьте, когда она появится в проёме: на миг она потеряет вас из виду, и удар попадёт в цель.\n\nДесять внезапных ударов за один забег открывают класс _Разбойник_.
guide.den_thief=Древняя монета открывает хранилище, вдоль которого тянутся два ряда одиночных клеток-пропастей. Любое падение перенесёт вас на глубину 41, откуда выхода нет (см. «Ловушка воров»). Считайте каждую такую клетку концом забега и держитесь от них подальше, особенно если враг может оттолкнуть или запутать вас.\n\nЗдесь поджидают _Король воров_ и два короля разбойников; тактику боя ищите на странице босса. Огонь и яд действуют на всех обитателей как обычно.\n\nС босса выпадет 1 900–4 000 золотых, _адамантитовое кольцо_ и, с шансом 1 к 3, свиток. После его смерти монета сможет вернуть вас домой, но при этом исчезнет. На самой монете он назван «Королём разбойников»; встречающиеся с ним короли разбойников — лишь его телохранители.
guide.zot_overview=Тюрьма Зота находится на глубине 99. Добраться туда можно только с помощью _Палантира_, лежащего на глубине 65, на дне шахт под городской площадью. Его охраняет каменный голем Отилюк.\n\nПротив Зота потребуется _реликтовое оружие_. Чтобы выковать его, положите три _камня норн_ на алтарь в городе. Эти камни выпадают из гуллинов в шахтах; за забег можно получить не больше пяти.\n\nПалантир позволяет совершить один путь туда и обратно: сначала на глубину 99, а затем к месту, где им воспользовались. Он не действует на этажах боссов, запечатанных этажах и при наличии следующего за вами питомца.\n\nСмерть Зота не завершает забег. Поговорите после победы с Отилюком: он переберётся в город, а шахты останутся открытыми.
guide.den_skeleton=Вы попадёте в узкую комнату под залом со статуями, заросшим кустами и высокой травой. По обеим сторонам комнаты тянутся полосы воды. У двери лежит _зелье жидкого пламени_. Все враги здесь невосприимчивы к огню, поэтому используйте зелье, чтобы выжечь заросли и расчистить обзор.\n\nСтоит пройти через дверь, как проснутся летающие _Король скелетов_ и две огромные _скелетные руки_. О тактике боя читайте на странице Короля скелетов.\n\nС короля выпадет 1 900–4 000 золотых и _адамантитовое оружие_. Каждый из трёх врагов также может оставить зелье жидкого пламени. После смерти короля начертанная кость сможет перенести вас домой, но при этом исчезнет.
guide.zot_level=Вы появитесь на постаменте в небольшой огороженной комнате. Лестниц здесь нет, а этаж остаётся запечатанным, пока жив Зот. До его смерти Палантир не сможет вернуть вас назад.\n\nВдоль северной стены стоят пять видимых ловушек призыва. Каждая вызывает от одного до трёх злых глаз. Выходите через южную дверь.\n\nКак только вы покинете комнату, за пределами видимости появится Зот, а в журнале сообщений возникнет «...». Других врагов здесь не возникает, и добычи на этаже нет.\n\nКогда Зот погибнет, вместе с ним исчезнут все его создания, а на месте смерти появится Отилюк. Поговорите с ним: если у вас нет _Маяка возвращения в город_, он выдаст новый. После этого возвращайтесь с помощью Палантира.
guide.boss_dwarftomb=Гробница стоит на две клетки севернее трона и не получает урона, пока жив Король дворфов.\n\nПосле его смерти с каждой свободной стороны гробницы появляется по одному _дворфу-личу_ — всего до четырёх. У каждого по 100 здоровья; на расстоянии они выпускают снаряды с уроном 20–32. Вплотную лич не может атаковать и старается отступить. В тот же момент этаж открывается, так что можно уйти.\n\nРазрушение гробницы убивает всех личей и призраков на этаже. Сама она не атакует и не поддаётся никаким эффектам, но имеет 600 здоровья и до 18 брони.\n\nВнутри находятся 4 900–9 999 золотых, _скелетный ключ_ и _набор для брони_, превращающий любую броню в классовую, как и корона.
guide.halls_f5=Через два шага после входа лестница обрушится, а этаж останется запечатанным до смерти Йог-Дзевы. Новые враги здесь не появляются; единственная добыча — вещи погибших героев. Йог не проснётся, пока вы его не увидите.\n\nСначала дальность вашего зрения равна 4 клеткам. За каждые потерянные Йогом 300 здоровья она уменьшается на одну, вплоть до 1. Горящий _факел_ сохраняет обзор в 6 клеток.\n\nЛучи Йога проходят сквозь стены и никогда не промахиваются, так что укрытия бесполезны. Следите за отмеченными клетками и вовремя отходите с них.\n\nНа арене есть вода: она гасит огонь пылающего кулака, но исцеляет гниющий кулак.\n\nНи свитки, ни маяки не выводят с запечатанного этажа. Когда вы вернётесь сюда с Амулетом, у лестницы можно будет начать Восхождение.
guide.den_crab=Раковина-конх перенесёт вас в сухую комнату под залом, полностью залитым водой. Молния от _электрической раковины_ и её крабов наносит стоящим в воде в полтора раза больше урона. _Зелье левитации_ спасает от этого усиления.\n\nВ верхней части зала находится электрическая раковина, окружённая четырьмя _панцирными крабами_. Вокруг зала ходит _Король крабов_. Подробности сражения — на странице Короля крабов.\n\nИз короля выпадет 1 900–4 000 золотых и _адамантитовая броня_. Каждый панцирный краб оставляет _золотой скелетный ключ_, которым можно открыть любой один замок на любом этаже. После этого ключ исчезнет. Когда король погибнет, раковина-конх сможет вернуть вас домой, но будет израсходована.

# Guide: 75 further Russian translations
guide.surface_villages=Деревни встречаются на равнинах и лугах. Большинство населено людьми, примерно четверть — мирными кланами гноллов, а примерно каждая восьмая служит пристанищем разбойников.\n\nВ человеческих деревнях есть торговцы (чем больше деревня, тем их больше), а жители занимаются повседневными делами. Если в деревне девять домов или больше, у колодца стоят стражники. Гноллы живут мирно, но не торгуют. Разбойничий лагерь — это три–пять бандитов, которые нападут на вас.\n\nВы можете войти в любой дом. Примерно в половине домов кто-нибудь есть, но добычи нет ни в одном. В помещении переохлаждение и тепловой удар сразу проходят и больше не угрожают вам — укрывайтесь под крышей от непогоды.\n\nВ человеческие деревни иногда приезжают странствующие торговцы, а иногда совершают набеги разбойники.
guide.city_f2=_Монахи_ бьют дважды за ход, а каждый двенадцатый удар выбивает у вас оружие из рук (проклятое оружие остаётся в руке). Монах-охотник накапливает сосредоточенность и парирует следующую атаку, какой бы точной она ни была. Потратьте его защиту на слабый удар, а затем бейте в полную силу. Волшебные палочки и огонь обходят парирование. Если постоянно держаться на расстоянии, монах быстрее восстанавливает сосредоточенность. Редкий старший монах бьёт в полтора раза сильнее и может оглушить на один ход.\n\nНа этом этаже особенно много _элементалей_. В воде морозный элементаль непременно заморозит вас, а разряд электрического достанет до цели; зато огненный элементаль не сможет вас поджечь.\n\n_Амбициозный бес_ встречается здесь примерно в каждом третьем забеге. Его поручение — ограбить дворфийское хранилище под его комнатой; подробнее см. «Древнее дворфийское хранилище».
guide.basics_strength=В начале игры у вас 10 единиц _силы_. Каждое _зелье силы_ добавляет 1 единицу; в каждой области из пяти этажей можно найти два таких зелья. Ещё одно можно сварить из трёх _семян гнилоягоды_ и одной бутылки. Превращение зелья силы даёт _зелье могущества_.\n\nНеобходимая сила зависит от ранга оружия или брони: 10 для I ранга, затем 12, 14, 16 и 18 для V ранга. Улучшения снижают требование на 1 при уровнях +1, +3, +6 и +10, а удачная редкость предмета может снизить его ещё на 2.\n\nЗа каждую недостающую единицу силы точность оружия делится на 1,5, а удары становятся медленнее. В случае брони уклонение также делится на 1,5 и замедляется движение. Слишком тяжёлое оружие не позволяет наносить внезапные удары. Каждая лишняя единица силы добавляет от 0 до 1 единицы урона к каждому удару в ближнем бою или метательным оружием.
guide.town_overview=Каждый забег начинается здесь. Северные ворота города ведут на глубину 1. Лестница на площади спускается в шахты купуа: девять этажей (глубины 56–64) и запечатанный этаж на глубине 65, где хранится _Палантир_, открывающий путь к тюрьме Зота. В шахтах видно лишь на две клетки, зато ловушек там нет.\n\nКупуа получают лишь от 1 единицы до половины обычного урона, а гуллины — от 1 единицы до четверти; исключение — удары _реликтовым оружием_. Его можно выковать из _камней норн_, которые выпадают из гуллинов, на алтаре в храме к востоку от площади. Шахты остаются открытыми весь забег, даже после освобождения Отилюка.\n\nВ полнолуние по ночам в шахтах бродят призрачные крысы; с наступлением полной темноты их становится больше.\n\nСтраница дневника «Драконья пещера» открывает глубину 67, где вас ждёт яйцо теневого дракона.
guide.prison_f4=Если в тюрьме вам ещё должны попасться _свиток улучшения_, _зелье силы_ или _магическое перо_, они находятся на этом этаже. На глубине 10 будет только Тенгу. Если вы ещё не встретили мастера палочек или лабораторию, они тоже здесь.\n\nЕсли вы ещё не добыли _Древний тюремный ключ_, где-то на этаже ждёт _покрытый мхом скелет_. У него 105–135 здоровья и крепкая броня; он почти не промахивается, наносит 20–45 урона и атакует раз в 1,5 хода. Яд и отравляющий газ на него не действуют, а после смерти он взрывается. Сражаться с ним необязательно.\n\nИз него всегда выпадает Древний тюремный ключ. С любого обычного этажа с глубины 2 по 24 он переносит вас на Поле битвы (глубина 28). Повторное применение там возвращает обратно, причём ключ остаётся у вас.
guide.city_overview=Глубины 16–20. В городе обитают нежить — вурдалаки, чернокнижники и монахи, — а также элементали, големы, минотавры и механизмы изобретателя.\n\nНа глубине 16 находится _магазин_ — последний перед Королём дворфов. _Амбициозный бес_ появляется на глубине 17, 18 или 19 и обязательно встретится к девятнадцатому этажу. На глубине 20 находится тронный зал короля.\n\nНи дождь, ни снег сюда не проникают, а воздух теплее, чем в пещерах. Если в жаркий день стоять у огня, можно получить тепловой удар.\n\nЧастые ловушки: морозная, грозовая, едкая, огненная, распыляющая. Реже встречаются камнепад, вспышка, страж, ослабление, призыв, перемещение, проклятие, провал и другие.\n\nВ полнолуние здесь появляются синие призраки — в сумерках и ночью, — а по ночам ещё и дворфы-личи.
guide.sea_islands=_Острова_ расположены далеко в открытом океане, где вода никогда не замерзает, — обычно в пятидесяти клетках или дальше от любой другой суши. В тёплых водах это пальмовые островки, в остальных — лесистые. Добраться до них можно только на лодке.\n\nУвиденный впервые остров появляется на карте мира со своим названием. _Морская карта_ смотрителя маяка сразу отмечает все острова в радиусе 400 клеток от маяка, а также расположенные там кораблекрушения и маяки.\n\nНа некоторых островах спрятан _зарытый сундук_: ищите крест, нацарапанный на песке и окружённый ракушками. Копните там лопатой искателя приключений и откопаете морской сундук с золотом, внутри которого окажется кольцо, палочка или артефакт. Иногда на островах также встречаются разбитые корабли или собственные маяки.
guide.city_f4=На этом этаже появляются три голема, два монаха, два чернокнижника, элементаль и минотавр. Сражайтесь в коридорах.\n\nЕсли ни один золотой вор ещё не оставил _Древний городской ключ_, здесь ждёт _безумный золотой вор_. Он атакует дважды за ход, нанося 30–50 урона, крадёт 100–500 золотых и убегает. Удары по бегущему вору выбивают несколько монет; если загнать его в угол, он начнёт драться. После смерти он вернёт украденное золото, оставит сюрикен и ключ (см. «Золотое хранилище»). Каждый убитый в этом забеге золотой вор делает следующего сильнее.\n\nИногда из залов сюда поднимается _суккуб_.\n\nЕсли бес ещё не встретился, он находится здесь. Все оставшиеся для этой области зелья силы, свитки улучшения и магические перья тоже лежат на этом этаже. На глубине 20 добычи нет — воспользуйтесь находками сейчас.
guide.sok_vault=Здесь нет ни овец, ни ловушек, ни замков, ни чудовищ. Сложно лишь попасть сюда: каждый книжный шкаф, который сгорает под действием вашего видения разума или который вы опустошаете целенаправленным поиском, с шансом 1 к 50 даёт страницу «Хранилище». За забег её можно получить лишь однажды.\n\nЭто огромная пещера, заросшая травой и кустами, среди которых спрятаны сундуки. При первом посещении здесь около 130 сундуков с 300–500 золотыми в каждом; в немногих (шанс 1 к 50) вместо золота лежит свиток улучшения. В самом северном сундуке гарантированно находится _кольцо богатства_. При повторных посещениях в сундуках остаётся всего по 1–10 золотых, поэтому приходите с пустым рюкзаком и забирайте всё за один раз. Поможет свиток магической карты.\n\nСтраница «Драконья пещера» добывается из книжных шкафов таким же способом. Подробнее — в соответствующем разделе главы о городе.
guide.basics_skills=_Таланты_ и _навыки_ расходуют общий запас очков: в начале у вас 2 очка, а с каждым новым уровнем вы получаете ещё 3. Улучшение таланта стоит 1 очко. Уровень навыка стоит столько очков, каков его ранг: чем глубже навык в ветке, тем дороже он обходится. Каждый навык можно повысить до третьего уровня.\n\nРанги талантов открываются постепенно: первый — сразу, второй — на уровне 6, третий — на уровне 12 после выбора подкласса, четвёртый — на уровне 20 после получения способности брони. _Маска Тенгу_ позволяет выбрать подкласс, а _корона Короля дворфов_ — способность.\n\nБольшинство навыков — активные действия, расходующие _ману_. Её запас показан полоской между здоровьем и опытом. В начале у вас 5 маны, с каждым уровнем прибавляется ещё 2. _Наёмник_ в таверне продаёт по 3 очка за каждого побеждённого вами босса. Остальное — в разделе «Темы → Навыки».
guide.boss_spiderqueen=У _Паучьей королевы_ 120 здоровья. Она кусает на 12–20 урона и отравляет каждым вторым ударом. Огонь ей не вредит. Как только королева заметит вас, этаж запечатается до её смерти.\n\nПока она охотится, примерно каждые 20 ходов откладывает рядом яйцо, если живых пауков меньше шести. У яйца 2 здоровья; если вы его видите, примерно через 20 ходов из него вылупится паук. Уничтожайте яйца по пути.\n\nПотеряв больше половины здоровья, королева перестаёт нападать и отступает, позволяя выводку сражаться за неё. Не преследуйте её через толпу пауков. Уничтожьте яйца и приспешников, загоните королеву в угол и добейте.\n\nИз неё выпадают зелье исцеления, случайная волшебная палочка и _паучий амулет_. Он призывает союзного паука ценой четверти максимального здоровья, но не срабатывает, если призыв убьёт вас.
guide.topic_endings=Взяв _Амулет Йендора_, вы ещё не закончите забег.\n\nПобедите Йог-Дзеву на глубине 25, заберите амулет на глубине 26 и выбирайтесь наверх под действием проклятия (см. «Амулет»). Покиньте с ним первый этаж — проклятие исчезнет. С этого момента амулет открывает запечатанные курганы на поверхности.\n\nДругая цель начинается в городе. Лестница на площади ведёт в шахты (глубины 56–64), где из камней норн можно выковать _реликтовое оружие_. На глубине 65 каменный голем охраняет _Палантир_ — единственный путь к Зоту на глубину 99. Победите Зота, и Отилюк обретёт свободу.\n\nДревние ключи и три книги открывают запечатанные этажи (глубины 27–33; см. «Запечатанные этажи»). Их награды и Сан-Чикарах открывают логова боссов (глубины 35–40). Сфера Зота с глубины 35 распадается на страницу дневника, способную вернуть вас домой, в город.
guide.prison_f5=От входа на юг тянется коридор мимо четырёх камер к запертой камере Тенгу. _Железный ключ_ лежит в одной из них. Перед открытием двери отдохните, подлечитесь и разберите рюкзак: войдя в камеру Тенгу, вы запечатаете этаж до конца боя. _Анх_ будет хорошей страховкой.\n\nДругих врагов здесь нет и не появится. Все опасности — дело рук Тенгу: скрытые дротиковые ловушки, бомбы, электрические столбы и огонь. Победите его, ни разу не попавшись на ловушки и уловки, чтобы получить достижение.\n\nЕсли у вас ещё нет подкласса, с Тенгу выпадет _маска Тенгу_, позволяющая выбрать его, а также страница «Замок Сокобан» из дневника Отилюка. Маяк Ллойда в рюкзаке получит один уровень. После боя этаж изменится: обойдите пропасть и спуститесь по лестнице. На глубине 11 вас ждёт магазин.
guide.surface_oasis=Иногда в пустыне встречается _оазис_ — водоём с пресной водой, окружённый травой и _финиковыми пальмами_. На карте мира он отмечен синим.\n\nВ тени у воды температура воздуха снижается на 10 градусов, но не ниже 22, поэтому в жаркий день оазис помогает оправиться от _теплового удара_. _Пустые бутылки_ здесь можно наполнить бесплатно.\n\nЧерез день под некоторыми пальмами появляются спелые _финики_. У воды расстилает ковёр _торговец оазиса_. Ночью он спит и не торгует. У него продаются _защитные очки от песка_, _пустынный шарф_, финики и пустые бутылки. Если торговец знает, где находится ближайший погребённый храм, он подскажет дорогу.\n\nВ сумерках, пока у воды никого нет, напиться приходят несколько _оленей_. В оазисе нельзя строить, копать землю или рубить пальмы.
guide.halls_end=Мост над бездной, свечи и _Амулет Йендора_ на постаменте. Здесь никто не появляется.\n\nВзяв амулет, вы ещё не завершите забег. У лестницы на глубине 25 можно начать _Восхождение_. Если решитесь, телепортация между этажами перестанет работать, амулет нельзя будет выбросить, а чудовища станут гораздо сильнее — особенно на верхних этажах. Каждый пройденный этаж повышает силу проклятия на 2: при 2 оно привлекает далёких врагов, при 4 враги начинают двигаться быстрее, при 6 замедляется герой, а начиная с 8 проклятие наносит урон каждый ход. Убийство усиленных чудовищ ослабляет проклятие. На этажах бывших боссов оно не усиливается, а здоровье и сытость восстанавливаются.\n\nПоднимитесь с амулетом по лестнице с первого этажа — и проклятие спадёт. После этого амулет откроет запечатанные курганы на поверхности.\n\nМожно также оставить его и подняться без проклятия.
guide.mines_f3=_Камни норн_ выпадают только из гуллинов: примерно три из пяти убитых гуллинов оставляют по камню, а за весь забег их выпадает не больше пяти. Для реликвии нужно три, так что обычно получится выковать одно реликтовое оружие.\n\nПоложите на алтарь в храме к востоку от городской площади три или больше камней и ничего лишнего. Три камня одного цвета создадут реликвию этого цвета; из разноцветных случайно выбирается один. Каждая реликвия уже зачарована. Синий: меч Ареса (похищение жизни). Оранжевый: топор Кром Круаха (удача). Фиолетовый: кистень Локи (яд). Жёлтый: трезубец Нептуна (молния). Зелёный: _гнев Юпитера_ — единственная метательная реликвия (ужас).\n\nПо купуа, гуллинам, стражам шахт, голему и Зоту реликвии бьют без обычного снижения урона. Реликтовое оружие ближнего боя наносит второй удар с уроном от одного до двух обычных ударов. После выпадения пятого камня гуллины больше ничего не оставляют.
guide.city_f3=Здесь появляются _големы_: 120 здоровья, 20–60 урона за удар, невосприимчивость к страху, сну и исступлению; уклоняются они редко. Голем слишком велик для коридора шириной в одну клетку — сражайтесь с ним из такого коридора. Если голем не может до вас добраться, он притянет вас к себе или телепортируется сам. На открытой местности от него не убежать. Первый убитый голем с шансом 1 к 5 оставит броню или оружие качества демонических залов, а каждый следующий — с вероятностью втрое ниже.\n\n_Минотавры_ (120 здоровья) примерно каждым третьим ударом бодают вас, вызывая кровотечение и хромоту, а затем отступают, пока кровотечение не закончится.\n\nИногда на глубине 18 или 19 появляется _дворф-лич_. Он стреляет на 20–32 урона и отступает, но вплотную атаковать не может — загоните его в угол. За него дают больше всего опыта в городе; зелье исцеления выпадает с шансом 1 к 5.\n\nЕсли бес не появился на глубине 17, на этом этаже он встретится примерно в половине забегов.
guide.prison_overview=Глубины 6–10: заметно опаснее канализации. Скелеты после смерти взрываются костяными осколками, тюремные стражи притягивают вас цепями, ДМ-100 бьют молниями издалека, а начиная с глубины 8 некроманты поднимают скелетов.\n\nНа глубине 6 находится единственный магазин области и затянутая паутиной дыра, ведущая в паучье гнездо. На глубинах 6–9 скрыто две или три тайные комнаты. На глубине 10 ждёт Тенгу.\n\nЭто самая холодная область главного подземелья. Вода гасит огонь и смывает слизь, но в воде электричество бьёт дальше и сильнее, а заморозка держится дольше. Часто встречаются охлаждающие и электрические ловушки, отравляющий газ, огонь и ядовитые дротики. Реже срабатывают сигнализация, удержание и телепортация.\n\nВ полнолуние с сумерек здесь появляются призраки, а ночью — призрачные некроманты.
guide.sea_sharks=_Акулы_ охотятся в открытом море, там, где вода глубже всего. Поблизости обычно плавают две акулы, а ночью — три. О первой приближающейся акуле предупреждает плавник, разрезающий поверхность воды.\n\nАкула плавает только на глубине, так что на суше вы от неё в безопасности. Она нападает на любого, кто находится в воде или на ней: пловца, человека у края глубокой воды или пассажира лодки. Кусает сильно; каждый четвёртый укус вызывает кровотечение у пловца.\n\nЕсли акула кусает лодку, удар приходится по корпусу. Плот получает полный урон, а каждый третий такой укус ещё и ранит вас на половину силы удара. У парусника доски принимают половину урона, а пассажир остаётся невредим. От множества укусов лодка может затонуть прямо под вами.\n\nЗажжённый _морской фонарь_, который продают смотрители маяков, отпугивает акул, пока горит. Акула, оказавшаяся вне глубокой воды, погибает.
guide.sewers_f5=Здесь нет ловушек, бродячих чудовищ и добычи — кроме того, что оставит Гу. _Гу_ сидит в водоёме посреди своей комнаты; водой покрыта половина этажа. Когда он вас замечает, этаж запечатывается, а лестницу наверх затапливает до его смерти. Подготовьтесь заранее.\n\nУбейте Гу и заберите _изношенный ключ_, чтобы открыть путь вниз. Другой дороги нет. Комната может иметь форму ромба, квадрата с внутренними стенами или зала с тонкими либо толстыми колоннами. Изучите её устройство и используйте стены, колонны и дверные проёмы, чтобы скрываться от взгляда Гу. В сильный мороз вода замерзает, и Гу не может лечиться на льду.\n\nТайная дверь ведёт к Крысиному королю. На полу его комнаты лежат кучи золота. Навредить ему нельзя. Принесите ему _корону Короля дворфов_ с глубины 20, надев броню, и он сможет наделить её способностью превращать врагов в крыс.
guide.halls_overview=Глубины 21–26; магазинов здесь нет. С каждым этажом дальность зрения уменьшается на клетку: 5 на глубине 21, 4 на 22, 3 на 23, 2 на 24. На каждом из этих этажей лежит по _два факела_. Один факел освещает 6 клеток вокруг вас в течение 250 ходов. Сберегите несколько для глубины 25.\n\nНа каждом этаже с 21-го по 24-й есть комната с _рассадником демонов_, из которого продолжают выходить потрошители. Каждый уничтоженный рассадник заменяет одного призванного Йог-Дзевой потрошителя слабой личинкой. Журнал показывает, какие рассадники ещё живы.\n\nТемпература воздуха держится около 35 градусов — на грани теплового удара. Стоит подойти к огню, и станет ещё жарче. Красные озёра, называемые холодной лавой, на самом деле обычная вода.\n\nЛаборатория находится на глубине 23 или 24. Здесь встречаются ловушки, знакомые по городу, и мрачные ловушки. В полнолуние синие призраки появляются с сумерек и ночью, а призрачные крысы — по ночам.\n\nНа глубине 25 расположена арена Йог-Дзевы; на глубине 26 хранится Амулет Йендора.
guide.prison_f3=На этом этаже появляются _некроманты_. Сам некромант не атакует: он призывает рядом с вами скелета, переносит его к вам, если вы убегаете, исцеляет издалека и приводит в ярость, когда тот полностью здоров. Убейте некроманта — его скелет рассыплется. Если вы стоите на клетке призыва, вас оттолкнёт в сторону либо ранит, если отступать некуда. Поначалу зелье исцеления выпадает с вероятностью примерно 1 к 5, но после каждого выпадения шанс становится меньше.\n\nИзредка появляется бледный _призрачный некромант_, призывающий одного призрака за другим. В призраков трудно попасть; убейте некроманта, и все они исчезнут. С него выпадает свиток снятия проклятия.\n\nЭто последний этаж, на котором встречаются ископаемые скелеты и синоби. Если вы ещё не видели мастера палочек, он с вероятностью 50% находится здесь, а иначе — на глубине 9. То же касается лаборатории.
guide.frozen_overview=Проём, затянутый инеем, на глубине 22 ведёт в Ледяные залы: четыре пещерных этажа с номерами 21–24 и арену Владыки демонов на 25-м. Поднявшись с верхнего этажа, вы вернётесь на глубину 22.\n\nТемпература держится около −15 градусов — достаточно холодно для переохлаждения (см. «Погода и времена года»). Когда вы бредёте по воде, обувь промокает: вам становится холоднее, а шаги слышны лучше.\n\nЗдесь обитают бурые и серые волки (разбудите одного — сбежится вся стая), йети, глиняные големы, духи холода и кобольды-ледомаги.\n\n_Кобольд в клетке_ на первом этаже просит принести _ледяной ключ_ и заплатит за него _свечой видения разума_. Ключ находится у _ядра ледяного стража_ на глубине 23: 1000 здоровья, половинная скорость и четыре стража, которые восстанавливаются после уничтожения. Каждый уничтоженный страж отнимает у ядра 150 здоровья. После гибели ядра исчезают все стражи, а на землю падают ключ и волшебная палочка мороза +1.
guide.boss_thiefking=_Король воров_ (500 здоровья) летает и наносит 20–70 урона по любой прямой линии без препятствий, независимо от расстояния. Пропасти не мешают его выстрелам — остановить их может только стена. Подходите сбоку, не перебегайте открытые проходы.\n\nЕго сопровождают два _короля разбойников_: по 200 здоровья, двойная скорость, способность летать. Каждый их удар накладывает _Обратный отсчёт_, если его ещё нет, а затем разбойник улетает. Через 6 ходов этот эффект отнимает четверть максимального здоровья; каждый живой король разбойников дополнительно восстанавливает себе здоровье на величину в одну восьмую вашего максимума. Обездвижьте их корнями или сражайтесь у угла, куда может подойти лишь один противник. Эти короли разбойников никогда не оставляют ложковилка.\n\nМолния наносит Королю воров только половину урона. Сбрасывать его в пропасти бесполезно — он летает. Если врагов становится слишком много, отступайте к дверному проёму у входа, а не сражайтесь у края.
guide.boss_skeletonking=_Король скелетов_ (550 здоровья, 20–40 урона за удар, до 25 брони) сражается вместе с двумя огромными руками (по 200 здоровья, 10–30 урона каждая). Все трое летают, поэтому местность их не замедляет.\n\nКаждый удар с шансом 50% накладывает проклятие: король ослабляет вас, пылающая рука поджигает, а опутывающая рука обездвиживает на 20 ходов. После этого наложивший проклятие враг улетает и вернётся, лишь когда эффект закончится. Быстро снимите его, чтобы враг вернулся к вам на удобное место. Не гоняйтесь за тремя летающими противниками через заросли.\n\nПорядок убийства: сначала опутывающая рука (обездвиженный герой не сможет убежать от остальных), затем пылающая рука, наконец сам король.\n\nВсе трое невосприимчивы к огню, зато кусты горят. Используйте жидкое пламя из соседней комнаты, чтобы расчистить заросли. Вода в той комнате потушит огонь на вас. Сильные одиночные удары лучше пробивают броню короля, чем множество слабых.
guide.wet_swamps=_Болота_ встречаются редко. Это тёплые сырые низины, где половина земли скрыта под водой, а камыши растут высоко. Над ними постоянно стелется _низкий туман_. Днём лёгкая дымка уменьшает дальность зрения на 1 клетку, после заката — на 2, а под утро, когда туман гуще всего, — на 3. С поздних сумерек до вскоре после рассвета он достаточно плотный, чтобы считаться полноценным туманом. Стоящие в нём существа также хуже видят — кроме нежити, демонов и огненных существ. Холодное зелёное свечение _болотного фонаря_ позволяет смотреть сквозь туман.\n\nБолотная _вода_ затрудняет ходьбу: каждый вход в воду требует на треть больше времени, если вы не летаете. _Бальзам для хождения по воде_ на сапогах или благословение _затонувшего святилища_ возвращает обычную скорость.\n\nПочти на каждом достаточно большом болоте есть примечательное место: хижина _болотной ведьмы_ или затонувшее святилище. _Карта мира_ показывает их расположение и названия.
guide.surface_wilds=На карте мира отмечены не только деревни. Добычу в каждом из следующих мест можно забрать лишь однажды.\n\n_Руины_ (леса, предгорья, тундра, пустыня): разрушенные входы в подземелья под охраной двух-трёх скелетов. Лестница в центре ведёт на первый этаж подземелья; поднявшись оттуда, вы вернётесь к руинам.\n\n_Заброшенные лагеря_ (леса, луга): один сундук с едой, зельем, метательным оружием или золотом.\n\n_Великий дуб_ (лес): в дупле у корней лежат три семени и капля росы.\n\n_Стоячие камни_ (равнины, тундра, снежные поля): свиток посреди каменного круга.\n\n_Драконьи логова_ (предгорья, горы): три кучи по 200–600 золотых и дракон. Лучше проходить мимо.\n\n_Курганы_: квадратные каменные входы на сухой ровной земле с лестницей посередине. Открываются, только пока вы несёте _Амулет Йендора_.
guide.surface_overview=Вокруг города простираются луга, леса, равнины, болота, пустыни и тундра, текут реки и лежит море. По мелководью можно идти пешком, но глубокую воду без лодки не преодолеть (см. «Море»). В сильный мороз реки и озёра замерзают, и по льду можно ходить. Мороз замораживает воду в любое время года, но когда воздух прогреется, лёд растает.\n\nСнеговая линия в горах меняется по сезонам. Дождь промачивает одежду, а ветер пробирает холодом; одевайтесь по погоде и берите с собой источник огня.\n\nДороги связывают деревни. На них встречаются путники и караваны, а порой — разбойники. За пределами дорог после наступления темноты выходят волки.\n\nКарта мира показывает всё, что вы видели, и места, о которых слышали. Лестницы на утёсах ведут в горы, а входы в пещеры — в Глубокие пещеры. Город расположен в центре карты.
guide.sea_lighthouses=_Маяки_ стоят на мысах вдоль берега и на некоторых островах: белые башни с красной полосой. Ночью их фонари светятся, а два луча медленно скользят по воде. При первой встрече маяк появляется на карте мира вместе с названием.\n\n_Смотритель_ стоит на мощёной площадке перед входом. Как и прочие торговцы на поверхности, ночью он закрывает лавку, а каждую неделю пополняет запасы:\n\n_Морская карта_: прочтите её под открытым небом, чтобы отметить на карте мира все острова в радиусе 400 клеток от этого маяка, включая кораблекрушения и маяки на них. После этого карта исчезнет.\n\n_Морской фонарь_: горит вдвое дольше факела, освещает дорогу и немного согревает. Его ослепительный свет и горький масляный дым отпугивают акул, пока он горит.\n\nЕсли прогнать смотрителя, он больше не вернётся, но маяк продолжит светить.
guide.temple_overview=Лестница на глубине 14 ведёт в храм. Перед входом игра попросит подтверждение; при желании можно вернуться обратно. Внутри между входом и дальней лестницей расположены двенадцать комнат в два столбца, в случайном порядке: десять испытаний, кладовая и пустая комната.\n\nИспытания: трава, скрывающая до 32 мимиков; водоём с четырьмя пираньями; храмовые стражи, стреляющие по прямой; четыре стража у четырёх сундуков с хрустальными ключами; скрытые взрывные ловушки; комната с 17 камнями скачка; двенадцать стражей-гноллов; лабиринт; клапаны, вызывающие замешательство; вода под грозовыми облаками. В кладовой лежат еда, две кучки по 6–10 кристаллов энергии и три зелья.\n\nВ центре каждой комнаты находится скелет с одним или двумя предметами: зельями, свитками, едой либо золотом. У дальней лестницы лежит _свиток улучшения_. Эта лестница ведёт лишь в небольшую пустую комнату.
guide.den_infest=Сан-Чикарах переносит вас на постамент в маленькой комнате со стенами посреди огромной тёмной пещеры. Видно на 6 клеток. Единственная дверь расположена с юга. Как только вы выйдете, где-то вне поля зрения появятся десять спящих _Теневых Йогов_.\n\nПо пещере уже бродят двадцать чудовищ: _серые они_ (500 здоровья, 55–115 урона) и _призрачные крысы_ (скорость вчетверо выше вашей, ослабляющие снаряды с уроном 20–45, опыта не дают). Новые враги приходят примерно каждые 50 ходов, так что пещера никогда не пустует. Каждое существо на этаже добавляет 1 единицу брони всем Теневым Йогам.\n\nВдоль верхней стены стартовой комнаты расположен ряд видимых ловушек призыва, а по пещере разбросаны скрытые; каждая вызывает новых чудовищ. Воды, травы и добычи здесь нет.\n\nДержитесь у двери, чтобы враги подходили по одному. Маяк Ллойда здесь работает.
guide.mines_f1=Здесь видно лишь на две клетки — возьмите источник света. Комнаты разделены деревянными _баррикадами_, которые можно сжечь, открывая короткие пути. На каждом этаже лежит 9 кусков _каменной руды_, каждый из которых можно продать в городе за 1000 золотых.\n\nЭти этажи заполнены _купуа_: 550 здоровья, скорость вдвое выше вашей, удары на 70–160 и броня до 50. Они получают лишь от 1 единицы до половины обычного урона, кроме ударов реликтовым оружием. Если после снижения урона один удар всё же наносит больше 68, купуа выпускает под себя разлагающий газ. Сам он невосприимчив, а вы — нет; после сильного удара отступайте. Девять из десяти купуа носят по куску руды.\n\nРедкий _гуллин_ имеет 750 здоровья, бьёт на 100–200 и получает лишь от 1 единицы до четверти обычного нереликтового урона, но промахивается чаще купуа. Только из него выпадают _камни норн_ (см. «Шахты — этаж 3»).\n\nШахтные этажи не перестраиваются: открытые проходы, побеждённые враги и оставленные предметы сохраняются.
guide.wet_tidepools=На каменистом морском берегу встречаются _приливные лужи_. _Прилив_ приходит и уходит дважды в сутки, с каждым днём немного позже; половину времени вода отступает. Во время отлива море оставляет в лужах _ракушки_, а иногда и _жемчужины_ (примерно одна из девяти находок). Одновременно здесь бывает не более шести находок, а море ежедневно приносит ещё две. Всё, что осталось до следующего прилива, волны заберут обратно. Торговец даст за ракушку 8 золотых, за жемчужину — 75.\n\nДнём во время отлива среди камней бегают один-два _краба_. Иногда в лужу заселяется _жемчужная устрица_ — не чаще одного раза в три дня. Нажмите на неё с соседней клетки, чтобы вскрыть раковину и достать жемчужину; в одном случае из трёх она сначала больно захлопнется на пальцах. При приливе волны накрывают лужи. В сильный мороз они замерзают, и находок в них не остаётся.
guide.basics_upgrades=_Свиток улучшения_ повышает уровень одного предмета на 1; в каждой области из пяти этажей их находится 3. При улучшении оружия или брони проклятие снимается, а с вероятностью в одну треть исчезает проклятое зачарование или руна. Для палочек и колец проклятие снимается с шансом в одну треть. Полезные зачарования и руны улучшение никогда не уничтожает.\n\nТратьте свитки на снаряжение, которое собираетесь носить долго: с улучшением оружия и брони снижается требуемая сила. _Палочки_, _кольца_ и _артефакты_ силы не требуют вовсе, а у палочки каждое улучшение увеличивает запас зарядов на один, максимум до 10.\n\n_Камень усиления_, который продаётся в каждом подземном магазине, не повышает уровень предмета, а обменивает скорость оружия на урон либо уклонение брони на защиту. _Кузница закалки_ поднимает слабейший бонус предмета до уровня сильнейшего или бесплатно повышает его мастерство на один шаг. О ядрах мастерства и смене типа предмета читайте в «Темы → Редкость».
guide.caves_f5=Пока вы не приблизитесь к пилону на три клетки, никто не нападёт. Используйте это время, чтобы изучить арену. После приближения этаж запечатается.\n\n_Оголённые провода_: когда ДМ-300 стоит на проводах, он получает щит величиной 30 плюс десятую часть недостающего здоровья. Не позволяйте ему задерживаться там. _Вода_: пока активен хотя бы один пилон, вода и провода находятся под напряжением и наносят всем нелетающим существам по 6–12 урона за ход. После уничтожения второго пилона напряжение сохраняется до конца боя.\n\nАктивный _силовой пилон_ (50 здоровья) бьёт электричеством по двум противоположным соседним клеткам на 10–20 урона и каждый ход поворачивает направление по часовой стрелке. Стойте там, куда он не направлен. Урон свыше 14 за один удар резко снижается, поэтому лучше подходят частые слабые атаки. К каждому пилону ведёт сухая тропа, а парящие искры движутся к активному пилону.\n\nПосле смерти ДМ-300 ворота откроются, а лестница поведёт в Город.
guide.caves_f1=_Летучие мыши-вампиры_ быстры, умеют летать и лечатся с каждым удачным укусом. Сражайтесь с ними в дверном проёме или замедляйте. Иногда из них выпадает _зелье восстановления_, но не более семи раз за забег.\n\n_Гноллы-громилы_ не погибают при нуле здоровья: они впадают в ярость, получают щит примерно на половину своего здоровья и бьют вдвое сильнее. Щит теряет по 4 единицы за ход, поэтому отступите на шесть ходов, и громила умрёт сам. Погибший от падения в пропасть громила не успеет разъяриться. Страх на них не действует. Редкий бронированный громила беснуется 60 ходов, но гарантированно оставляет броню.\n\n_Гноллы-шаманы_ накладывают проклятия издалека: красный ослабляет, синий делает уязвимым, фиолетовый (самый редкий) портит точность и уклонение. Они самые хрупкие враги здесь: скройтесь из виду и подойдите вплотную.\n\nНа этом этаже находятся _магазин_ области и гриб-поганка для изобретателей. Кузнец появляется начиная с глубины 12.
guide.boss_otiluke=Не сражайтесь с этим големом без _реликтового оружия_. У него 7000 здоровья, а любой удар — даже палочкой или питомцем — наносит от 1 единицы до четверти обычного урона. Исключение — удары реликвией. Сначала выкуйте реликвию на городском алтаре.\n\nПока голема не ударят, он неподвижен. Выберите позицию до первого удара: держитесь не ближе пяти клеток от каждой светящейся башни. Каждый ваш удар может разбудить стража.\n\nВ ближнем бою голем наносит 250–350 урона и почти не промахивается. Издалека стреляет зарядами на 100–160 урона, которые проходят между его стражами; половина зарядов ослабляет вас. Голем невосприимчив к страху, очарованию, сну, головокружению, огню и отравляющему газу, а также сопротивляется яду.\n\nПосле его смерти этаж откроется, башни остановятся, а сам голем обычно оставит зелье. _Палантир_ переносит на глубину 99 и обратно, к месту его применения. Не пользуйтесь им, пока не будете готовы к Зоту. Отилюк вернётся лишь после смерти Зота.
guide.caves_f4=Последний обычный этаж пещер и самый оживлённый: здесь 7–9 врагов, среди них два ДМ-200 и _глиняные големы_ (40 здоровья, прочная броня, медленные удары, невосприимчивость к страху и сну). Изредка из Города забредает вурдалак; в одиночку он не может воскреснуть.\n\nЕсли вы ещё не встретили кузнеца-тролля, он находится здесь; если на глубине 13 не было лаборатории, она тоже появится здесь. Все оставшиеся для области _зелья силы_, _свитки улучшения_ и _магические перья_ находятся здесь. Здесь же расположена лестница в _храм_.\n\nЕсли у вас ещё нет _Древнего пещерного ключа_, на этаже появится _гигантская пиранья_, оставляющая его после смерти (первая пиранья, убитая после достижения глубины 11, всегда даёт ключ). Если пиранья появилась на суше, она уже погибла, а ключ лежит на месте её смерти.\n\nЕсли хотите воспользоваться улучшением от кузнеца, сделайте это до чтения собственных свитков для этого предмета: кузнец работает только с вещами ниже +2.
guide.nest_overview=Затянутая паутиной дыра на глубине 6 тюрьмы ведёт в паучье гнездо: пять этажей (6–10), становящихся всё просторнее. Путь закольцован: лестница вниз с десятого этажа возвращает на первый этаж гнезда, а лестница наверх с первого — в тюрьму.\n\nНа каждом из первых четырёх этажей где-то неподвижно лежит _яйцевой кокон_. Пока он в поле зрения, каждые 20 ходов из него выходит паук, максимум до шести одновременно. У кокона 10 здоровья, он не двигается и не атакует — уничтожайте его в первую очередь.\n\nВыводок: _пауки-слуги_ (иногда отравляют укусом), _пауки-стражи_ (могут парализовать на 3 хода), _раздутые пауки_ (двойная скорость; после попадания взрываются эффектом случайного растения), а начиная с восьмого этажа — _пауки-разумы_, которые держатся позади и усиливают ярость остальных. Примерно с десятого уровня героя пауки дают лишь четверть обычного опыта.\n\nНа десятом этаже живёт Паучья королева.
guide.caves_f2=_Кузнец-тролль_ находится на глубине 12 (шанс 1 к 3), 13 (1 к 2) или 14 (обязательно). В его комнате на постаментах лежат два бесплатных предмета, а также есть лестница в шахту. Он выдаёт _кирку_ и просит принести _тёмное золото_ из шахты. Войти туда можно лишь один раз: выйдете — задание завершится, поэтому берите с собой еду, лечение и освобождайте место в рюкзаке. Кузнеца нельзя ранить. Если принести ему все три части _Сан-Чикараха_, он соединит их в один предмет.\n\nКирка наносит урон как оружие II ранга, но требует силы как III ранг. Её способность у Дуэлянта никогда не промахивается, наносит двойной урон неорганическим существам, а также крабам, веретенникам, скорпионам, пчёлам и роям, оставляя цель уязвимой.\n\nС этого этажа встречаются _пещерные прядильщики_. Они опутывают паутиной клетку, к которой вы движетесь, поэтому меняйте направление, а не бегите по прямой. Укус может отравить вас; тогда прядильщик отступает и обстреливает паутиной издалека.\n\nИногда здесь раньше времени появляется _сломанный робот_ (см. глубину 13).
guide.city_f5=Коридор с книжными шкафами ведёт в тронный зал: трон стоит посередине, а по диагоналям расположены четыре постамента призыва. Войдите — и дверь запрётся до смерти Короля дворфов. Новые враги здесь не появляются; единственная добыча — оставленные погибшим героем вещи у входа.\n\nПриходите с полным здоровьем и _анхом_. Перед появлением прислужника постамент подсказывает, кого призовёт: кости — вурдалака, зелёный огонь — монаха, тень — чернокнижника (искры — голема при испытании «Злее боссы»).\n\nПосле смерти короля северная дверь откроется к переходу над пропастью; упав, вы окажетесь на глубине 21. Если задание беса принесло вам больше 2000 очков, на переходе откроется его лавка: латная броня, три факела, оружие V ранга, анх, переносной хрустальный сундук и Книги мёртвых, живых и небес.\n\nДостижение: победите короля, ни разу не ударив его оружием, палочкой (молния допускается), кольцом силы или заклинанием жреца.
guide.den_tengu=Самое маленькое логово: сырая пещера с водой и травой, где _Тенгу_ уже охотится на вас. У этого Тенгу 400 здоровья, двойная скорость, удары на 15–25. Первые 20 единиц урона каждого удара блокируются, поэтому лёгкое оружие почти не царапает его. Бейте сильно.\n\nЭтапов боя и ловушек здесь нет. Потеряв больше половины здоровья, Тенгу применит одну уловку — обычно бомбу. Выйдите из зоны взрыва и продолжайте сражаться. Корни, ослепление и страх на него не действуют; яду и отравляющему газу он сопротивляется. Сражайтесь в коридоре: убежать от него не получится.\n\nИз него выпадает 1900–4000 золотых и _адамантитовое кольцо_. Только после его смерти ключ вернёт вас домой; Маяк Ллойда здесь не работает.\n\nТайная дверь ведёт в сокровищницу Крысиного короля. В сундуках лежат золото, семена, яйцо, еда, кассетная бомба или Мистер Разрушитель, а один сундук — _мимик_. Ключ не расходуется, поэтому можно вернуться за добычей после победы над Тенгу: он не воскреснет.
guide.boss_demonlord=У Владыки демонов 300 здоровья. Он бьёт на 18–36 урона, а примерно треть его попаданий вызывает охлаждение. Когда он просыпается, этаж запечатывается до его смерти.\n\n_Ледяное дыхание_: если вы в пределах четырёх клеток и демон вас видит, он может вдохнуть. Конус в вашу сторону покрывается инеем, а над головой босса появляется обратный отсчёт. Через 3 хода он выдыхает холод на 20–40 урона, накладывает охлаждение и замораживает воду в конусе. Выйдите из зоны поражения или спрячьтесь за одной из шести ледяных колонн. С расстояния больше четырёх клеток демон не выдыхает.\n\nПотеряв больше половины здоровья, он начинает дышать чаще, а рядом с ним появляются два _ледяных демона_ (110 здоровья, удары на 20–35). Они гибнут вместе с боссом.\n\nНа Владыку не действуют сон, страх и головокружение; горение наносит половину урона.\n\nИз него выпадают _изношенный ключ_ от двери за постаментом, ведущей обратно на глубину 22, и _климатический кристалл_. Этот артефакт заряжается в суровую погоду, а после установки в течение 300 ходов поддерживает мягкую температуру в радиусе двух клеток.
guide.peaks_overview=Над поверхностью поднимаются десять горных ярусов, каждый холоднее предыдущего. Между ярусами ведут лестницы на утёсах. Ниже снеговой линии растут луга, выше — лежит снег среди сосен и валунов. В углублениях встречаются горные озёра. На высоте находится каменистая почва, которую можно копать киркой. Край обрыва — это перепад высот: с него видны земля внизу, озёра, реки и берега, а при падении вы окажетесь ярусом ниже.\n\nБерите средства от холода: огонь, тканевую броню, эликсир тепла.\n\nЯрусы 1–3: днём зайцы и горные козы, после заката — стаи серых волков. Если ударить козу, стоя спиной к обрыву, она может сбросить вас вниз. Ярусы 4–7: волки, йети, кобольды-ледомаги, замедляющие издалека, и духи холода, которые замораживают. Ярусы 8–10: йети (ночью их больше), ледяные демоны, морозные элементали и духи холода.\n\nВ скалах встречаются медь, железо, серебро и золото, а на самых высоких вершинах — небесное железо.
guide.halls_f3=_Скорпионы_ (110 здоровья) стреляют шипами на 20–52 урона, в половине случаев вызывая хромоту, и отступают при приближении. Вплотную они не могут атаковать — подойдите и не отпускайте. Яд и вампирическое оружие наносят им половину урона. Вероятность добычи со скорпиона сначала составляет примерно 1 к 5, чаще всего выпадает зелье исцеления. После каждого выпадения шанс уменьшается. Редкий бледно-зелёный _кислотный скорпион_ возвращает случайную долю урона каждого удара ближним или метательным оружием и покрывает вас слизью, если вы рядом. Применяйте против него палочки.\n\n_Заблудшие души_ каждым третьим ударом поджигают вас. Огонь лечит их; мороз или охлаждение может снять до двух третей здоровья, а в воде — мгновенно убить.\n\nИногда снизу поднимается _демонический Гу_: 200 здоровья, двойная скорость, удары на 30–60 и слизь. После каждого пережитого удара от него отделяется сгусток; каждый сгусток оставляет зелье восстановления. Вода исцеляет демонического Гу, и холодная лава тоже считается водой.\n\nТретий рассадник создаёт потрошителя каждые 47 ходов. Лаборатория находится здесь или на следующем этаже.
guide.peaks_heights=Начиная с седьмого горного яруса воздух становится разреженным. Чем дольше вы здесь остаётесь, тем больше накапливается _Нехватка воздуха_, максимум до пяти уровней. Каждый уровень замедляет естественное исцеление на 15 процентов и ускоряет наступление голода. При спуске эффект постепенно проходит, а отдых у костра или под крышей — например, в хижине отшельника или на стоянке — избавляет от него быстрее.\n\nНа узком хребте при сильном ветре бывают порывы. О них предупреждают серые полосы, пролетающие мимо. После следующего вашего действия порыв сдвинет вас на клетку по ветру или оглушит, если сдвинуться нельзя. За обрыв ветер не сбрасывает.\n\nГорный лёд на озёрах надёжен только при −10 градусах и ниже. В более тёплый мороз лёд у берега тонкий, а при −2 градусах и выше — весь лёд тонкий. На втором ходу стояния на нём он начинает трещать, после третьего ломается. Если снова наступить на уже треснувшую клетку, она проломится сразу. Вы упадёте в воду, промокнете и замёрзнете. На поверхности замёрзшие реки и озёра всегда выдерживают ваш вес.
guide.town_dragoncave=Сюда ведёт только страница «Драконья пещера» из дневника Отилюка (как её найти — см. «Хранилище»). Вы появитесь на западной стороне. Лестниц и чудовищ здесь нет; для выхода снова воспользуйтесь дневником.\n\nПосередине лежит озеро _ловушек грабителя_ — единственный путь на восток. При наступании каждая ловушка отнимает половину текущего здоровья и затем отключается; если у вас осталось не больше десятой части максимального здоровья, она убьёт вас. Левитация не помогает. Пройдите одну ловушку, восстановите здоровье до максимума, затем ступайте на следующую. Расчищенный путь останется безопасным и для возвращения.\n\nПри первом посещении в каждом скелете находится 400–800 золотых, иногда вместо них — свиток улучшения; при повторных посещениях добыча составляет 1–100 золотых. _Яйцо теневого дракона_ лежит на юго-востоке, за тайной дверью из восточного прохода, только при первом посещении.\n\nПоносите яйцо 10 ходов, затем расколите его, имея свободную соседнюю клетку и не имея другого питомца. Дыхание теневого дракона бьёт втрое сильнее укуса.
guide.caves_f3=Здесь появляется _ДМ-200_: 80 здоровья, слишком велик для дверей и коридоров. Если он не может до вас добраться, выпускает в вашу сторону отравляющий газ. Сражайтесь на открытом месте, но выходите из газового облака. С первого робота с шансом 1 к 5 выпадет оружие или броня качества Города; каждый следующий оставляет такую добычу втрое реже.\n\n_Сломанный робот_ каждые три хода стреляет лучом, поражающим всё на линии огня, включая чудовищ. После того как он вас заметил, каждый ход с шансом 1 к 50 может взорваться и ранить всех соседей, поэтому не стойте вплотную. Он даёт 13 опыта — больше всех в Пещерах — и часто оставляет свиток перезарядки.\n\nРедкий _ДМ-201_ всегда неподвижен. Если атаковать издалека, он ответит едким газом; если бить только с соседней клетки, газ не выпускает. Из него выпадает металлический осколок, если ваш уровень не выше 19.\n\nЛаборатория находится здесь в половине забегов, иначе — на глубине 14. Если кузнеца не было на глубине 12, он может оказаться здесь.
guide.surface_sandstorm=Когда над пустыней дует ветер со скоростью 10 м/с или больше, он поднимает _песчаную бурю_. Пока вы под её воздействием, солнечные часы показывают именно такую погоду. Во время метели, в пещерах и в горах песок не летает.\n\nПод открытым небом буря вдвое сокращает обзор, а при ветре 20 м/с — вчетверо. Вы идёте на одну пятую медленнее, а при 20 м/с — на одну треть. Каждый ход песок с вероятностью 3–8% попадает в глаза и _ослепляет_ на 2 хода. Чудовища в буре тоже видят хуже, если у них нет ночного зрения.\n\nБезопасно находиться _с подветренной стороны укрытия_: если в одной-двух клетках со стороны, откуда дует ветер, стоит твёрдая преграда — скала, пальма, статуя или стена, — либо вы внутри построенной комнаты. _Песочные очки_ или _пустынный шарф_ полностью защищают от бури. Их продают торговцы в оазисах. На верстаке очки можно сделать из _стеклянной панели_ и _кожи_, а шарф сплести из трёх связок _соломы_.
guide.deep_hazards=Начиная с четвёртого яруса пещер в низких замкнутых местах скапливается _рудничный газ_. Внутри чувствуется запах и видна слабая дымка; спустя три хода кружится голова. Пламя в газовом облаке — ваш факел, горящее существо, огненный снаряд или пылающий пол — вызывает шипение, а после следующего действия происходит взрыв. Он ранит всех внутри облака и рядом с ним; вы можете потерять до трети здоровья. После взрыва остаётся огонь. Сначала потушите факел или выберитесь из облака. Взорвавшийся карман газа остаётся пустым три дня.\n\nПри добыче руды может обрушиться потолок. Если вырубить камень, подпирающий свод, или рыхлую породу, может послышаться гул. Чем глубже, тем чаще встречается рыхлая порода. После следующего действия на эту и соседние клетки упадут камни: урон до трети здоровья, хромота и завал из обломков. Копайте там, где потолок имеет опору.\n\nВода в пещерах почти никогда не замерзает: в Глубоких пещерах всегда умеренная температура, независимо от погоды наверху.
guide.city_f1=В магазине продаются чешуйчатая броня, оружие и метательное оружие IV ранга, усиленные дротики, сумки, золотой переносной сундук, _камень усиления_, _анх_, зелье исцеления и свитки опознания, снятия проклятия и магической карты.\n\n_Вурдалаки_ ходят парами. Если один погибнет в поле зрения напарника или в пределах четырёх клеток от него, он упадёт и через 5 ходов встанет с десятой частью здоровья (после следующих смертей — через 10, затем через 15 ходов). Убивайте обоих почти одновременно, разделяйте их или сбрасывайте раненого в пропасть.\n\n_Элементали_ летают и стреляют огнём, морозом или молниями. Мороз снимает огненному элементалю половину здоровья, а огонь делает то же с морозным. Редкий элементаль хаоса всегда оставляет свиток превращения.\n\nСнаряды _чернокнижников_ на время ухудшают ваше снаряжение; прячьтесь от их взгляда. Пять из шести оставляют зелье.\n\n_Изобретатели_ бросают снаряды издалека, отступают при приближении и всегда оставляют свиток магического насыщения. Также на этаже встречаются глиняные големы и пауки-роботы.
guide.sok_portals=Наступив на действующий колодец, вы телепортируетесь. Овца, столкнутая на переключатель, меняет пункт назначения одного колодца; в журнале появится «Щёлк!». Два колодца изначально не работают. Несколько переключателей могут менять один и тот же колодец — действует последнее изменение. Один переключатель в южном ряду вообще отключает колодец. Пройдите через колодцы до того, как начнёте двигать овец.\n\nПри первом посещении здесь тринадцать наград. Первые шесть — железные ключи рядом со входом, открывающие пять запертых дверей. Остальные семь появляются на клетке к востоку от центра: два семени звездоцвета, семя фазового сдвига, два свитка магического насыщения, свиток возрождения и _амулет автоматического зелья_, которого больше нигде нет. Если его надеть и носить зелье исцеления, герой автоматически выпьет его после удара, оставившего меньше десятой части здоровья.\n\nЗдесь две ожившие статуи: одна у центра, другая далеко на юго-востоке. Колодец может перенести вас прямо к статуе; если та проснётся, уходите через другой. При первом посещении сундуки содержат 300–500 золотых или свиток улучшения (шанс 1 к 5).
guide.caves_overview=Глубины 11–15 — заброшенная дворфийская шахта. Рудные жилы в стенах служат украшением: настоящая добыча здесь — только тёмное золото в _шахте кузнеца_, вход в которую появляется на одном из этажей с глубины 12 по 14.\n\nЗдешние чудовища носят тяжёлую броню и наносят большой урон. Приходите с улучшенным снаряжением.\n\nКаждый следующий этаж просторнее предыдущего. Глубина 11 — самая маленькая, с _магазином_ области, последним перед глубиной 16. Глубина 14 — самая большая: одновременно здесь 7–9 врагов. Там, где пещеры соприкасаются, пол часто обрывается в пропасть. Чудовище, упавшее с запасом здоровья больше четырёх пятых, выживает на следующем этаже, но хромает и истекает кровью; более слабое погибает, даёт половину опыта, а его добыча падает вниз.\n\nДождь и снег ещё проникают в Пещеры; ниже глубины 15 погода больше не влияет на этажи. В полнолуние с сумерек появляются красные призраки, а в темноте их становится больше. Большинство ловушек — огонь, ядовитые дротики, мороз, молнии и кислота; редкая ловушка-провал сбрасывает этажом ниже.
guide.basics_enchanting=Зачаровывать можно только опознанное оружие и броню. Оружие вмещает до двух _зачарований_, а броня — до двух _рун_. Каждое может иметь уровень от 0 до 5; каждый уровень повышает силу эффекта на 40%, а шанс срабатывания — на 20%. Синее число на ячейке предмета показывает уровни зачарований.\n\n_Постамент зачарования_ работает со снаряжением за алхимическую энергию. _Вплетение_ нового зачарования в свободную ячейку: за 20 энергии показываются три варианта, выбранный можно взять без доплаты. Если уйти, ничего не выбрав, варианты пропадут. _Усиление_ повышает уровень зачарования: последовательно стоит 10, 20, 30, 40 и 50 энергии. _Переброс_ предлагает три замены того же уровня за 20 энергии. Можно также снять все зачарования с предмета, вернув 20 энергии, но сохранив улучшения. Лишние предметы здесь можно переработать в энергию, как в котле. Проклятое снаряжение не принимается.\n\nПостаменты стоят в библиотечных комнатах подземелья среди книжных шкафов и в городской церкви. Такой постамент можно построить и в усадьбе. Зачаровывать также позволяют _магическое перо_, _свиток зачарования_ и _камень зачарования_.
guide.boss_crabking=У _Короля крабов_ 300 здоровья. Он бьёт на 20–50 урона по любой свободной прямой независимо от расстояния и двигается вдвое быстрее вас. Сам не подходит вплотную: телепортируется в видимую точку, а если вы доберётесь до него, после нескольких ударов снова отпрыгнет. Возьмите дальнобойное оружие.\n\nИсточник его силы — _электрическая раковина_ в верхней части зала: 600 здоровья, она не двигается и не уклоняется. Четыре _панцирных краба_ (20 здоровья) стреляют молниями на 15–30 урона. Пока раковина жива, любой удар по крабу сильнее 5 единиц сокращается до 1 урона, а остальная сила накапливается в раковине как заряд, который сам не исчезает. Король исцеляется за счёт этого заряда, а раковина расходует его, поражая вас током. Если ударить заряженную раковину вблизи, она ударит током всех соседей.\n\nПоэтому сначала уничтожьте раковину издалека. Если в ней нет заряда, ближний бой безопасен. После её смерти заряд исчезает, и крабы начинают получать полный урон. Если приходится бить краба раньше, наносите не больше 5 единиц за удар.\n\nКороль сопротивляется яду, отравляющему газу и эффекту Мрака.
guide.topic_skills=Таланты и навыки расходуют общие очки: 2 в начале игры и ещё по 3 за каждый уровень. Талант стоит 1 очко, а уровень навыка — столько, каков его ранг. Поэтому глубокие навыки ветки дороже. Каждый навык имеет 3 уровня. В некоторых ветках есть взаимоисключающие пары: взяв один навык, второй уже не получить в этом забеге. Наёмник в таверне продаёт 3 очка за каждого побеждённого босса.\n\nБольшинство навыков — активные действия за ману. Значок навыков виден, когда есть свободные очки или доступный к применению навык: нажмите для выбора навыка, удерживайте для открытия дерева. Если отменить навык с выбором цели, ресурсы не расходуются.\n\nВоин раскалывает землю, прыгает и сокрушает врагов. Маг поддерживает вращающиеся вокруг себя сферы огня и льда и призывает метеоры. Разбойник сражается бок о бок с теневыми копиями. Охотница обрушивает град стрел и выращивает цепкие терновники. Дуэлянт бросается вперёд и закручивает вихрь клинков. Жрец исцеляет, поднимает столпы света и призывает духа-хранителя.\n\nСпособность брони, полученная с короной Короля дворфов, тоже может занимать ячейку навыка.
guide.hs_shelter=Под _крышей_ на вас не попадают дождь и снег, хотя соломенная пропускает примерно каждую пятую каплю. Ветер при этом никуда не исчезает.\n\nВ закрытой _комнате_ нет ветра, дождя и снега, а температура приближается к 15 градусам в зависимости от материала стен: бревно — 0,3; доски — 0,4; камень — 0,5; скала — 0,6; кирпич — 0,7; окно — 0,2; дверь — 0,3. Для комнаты берётся среднее значение стен. Огонь добавляет тепло: тлеющие угли костра — 6 градусов, зажжённый очаг — 16, кузница — 8, печь — 6. Действие «ОСМОТРЕТЬ» покажет, насколько тепло в помещении. В комнате, обогреваемой огнём, вам _уютно_: ни жара, ни холод не причиняют вреда.\n\nПод крышей или в комнате не растут дикие растения и не появляются дикие животные. Молния не ударяет в открытый пол комнаты, а попав в крышу, останавливается на ней. Дикие звери не появляются в десяти клетках от камня очага или горящего домашнего очага. Внутри слышен стук дождя по крыше, а построенные стены заглушают звуки так же, как скала.\n\nВ открытом мире холод и жара наносят урон с учётом самой большой глубины, которой вы достигли.
guide.basics_searching=Тайные двери и скрытые ловушки выглядят как обычные стены и пол. Дважды нажмите _лупу_ или удерживайте её для поиска: он занимает 2 хода, немного усиливает голод и обнаруживает все скрытые двери и ловушки рядом. _Разбойник_ ищет в радиусе 2 клеток; талант и _кольцо поиска_ увеличивают дальность (кольцо действует только при намеренном поиске), а _предвидение_ показывает всё вокруг. Поиск также опустошает соседние книжные шкафы; в каждом с шансом 8% находится свиток опознания, снятия проклятия, перезарядки, превращения или магической карты.\n\nНекоторые секреты заметны и просто при ходьбе. Скрытая ловушка на соседней клетке сама раскрывается с шансом 40% на верхних этажах, снижаясь до 30% к глубине 25. Тайная дверь — с шансом 20%, но к глубине 20 этот шанс падает до нуля. Чем глубже, тем больше дверей спрятано. Ищите в тупиках и подозрительных пустотах карты.\n\nНа глубине 1 дверь входной комнаты остаётся скрытой, пока вы не подберёте лежащую там страницу руководства о поиске. Отыщите выход с помощью поиска.
guide.sewers_f1=По лестнице наверх можно в любой момент вернуться в город.\n\nНа этом этаже ровно восемь чудовищ, возле входа их нет и новые не появляются. Большинство — крысы. С парами сражайтесь в дверном проёме. _Канализационная змея_ уклоняется почти от всех ударов, но внезапная атака никогда не промахивается: заставьте змею пройти за вами через дверь и ударьте в момент её появления. _Бурая летучая мышь_ летает вдвое быстрее вас, может ослепить и иногда предсмертным визгом созывает половину этажа. _Серая крыса_ невосприимчива к яду, огню, сну и страху.\n\nВ одном забеге из пятидесяти здесь обитает _крысиный босс_. Заметив вас, он призывает до четырёх крыс; отступайте в коридор.\n\nЕдинственные ловушки здесь — изношенные дротиковые, всегда видимые. Тайных комнат нет, но дверь стартовой комнаты спрятана до получения лежащей там страницы руководства о поиске. Ожидайте еду, свиток улучшения с шансом 3 к 4, а иногда — камень интуиции или катализатор безделушек. Катализатор лежит в запертом сундуке, а его _золотой ключ_ спрятан где-то на этом этаже.
guide.sewers_f3=Здесь впервые встречаются _рой мух_, _канализационный краб_ и _велопетух_.\n\nУ роя 80 здоровья, и он не даёт опыта. Каждый удар оружием — ближним или метательным — разделяет рой на части, которые сохраняют наложенные на него огонь и яд. Палочки, огонь и газ не вызывают деления. Первый рой с шансом 1 к 6 оставляет зелье восстановления; отделившиеся от него рои — ещё реже.\n\nКраб и велопетух двигаются вдвое быстрее вас, так что убежать не получится. Панцирь краба блокирует до 4 единиц урона за удар: один сильный удар лучше нескольких слабых. Редко встречается краб с бочкой на спине — _краб-отшельник_. Он медленнее и прочнее, зато всегда оставляет броню.\n\nЕсли вы ещё не встретили призрака, в половине забегов она находится здесь. Её цель — _гнолл-плут_, бросающий дротики. Каждый последовательный попавший дротик накладывает всё более сильный яд и может поджечь вас. Сближайтесь: когда плуту приходится перемещаться, счётчик серии сбрасывается.\n\nЕсли камень интуиции или катализатор безделушек ещё не встретился, он будет на этом этаже. Алхимическая лаборатория тоже находится здесь в половине забегов, иначе — на глубине 4.
guide.halls_f1=_Суккубы_ (80 здоровья) телепортируются к вам, если находятся дальше двух клеток. Примерно каждый третий удар может очаровать; пока вы очарованы, их атаки лечат их, а исцеление сверх максимума превращается в щит. Сражайтесь с ними вплотную и поскорее снимайте очарование. Примерно треть оставляет свиток, но никогда — опознания или улучшения.\n\n_Злые глаза_ заряжаются 2 хода, затем пускают луч на 30–50 урона по прямой до первой стены, целясь туда, где вы стояли. Во время зарядки они получают лишь четверть урона. Сойдите с линии, а затем атакуйте. Распыление наносит им половину урона.\n\n_Маги хаоса_ двигаются вдвое быстрее вас, лечатся от нанесённого ими урона и могут запутать, отравить, поджечь, ослепить или замедлить. С _мага хаоса_ может выпасть _зелье опыта_ (шанс 1 к 50).\n\nДверь к _рассаднику демонов_ никогда не скрыта. У него 120 здоровья, он не двигается и не атакует, но удары сильнее 20 единиц теряют большую часть силы (85 урона превращаются в 30), а каждая единица полученного урона приближает появление следующего потрошителя. Сначала зачистите комнату. После разрушения рассадник оставляет зелье исцеления.
guide.sok_puzzles=Большинство овец здесь стоят на переключателях, поэтому толкать их нельзя. Чтобы изменить такую овцу, встаньте на ловушку превращения и шагните в овцу: вы поменяетесь местами, овца окажется на ловушке и станет обычной. Каждая ловушка срабатывает один раз. Не подпускайте к ним угловых овец.\n\nПри первом посещении здесь 15 наград. Шесть железных ключей появляются на постоянных местах: первый у входа, последний рядом с ожившей статуей. Первое сокровище лежит рядом со входом, остальные восемь складываются на одной клетке далеко на северо-востоке. Состав добычи в случайном порядке: два свитка магического насыщения, два семени фазового сдвига, два семени мухоловки, семя звездоцвета, _яйцо_ и _свисток_, призывающий питомца к вам из любой точки. Заполните все пятнадцать клеток, чтобы гарантированно получить свисток.\n\nПереключатель на юго-западе заставляет один колодец переносить рядом с кучей наград. Два переключателя меняют один неработающий колодец; побеждает последнее переключение. Один переключатель ни к чему не подключён и не издаёт щелчка. В сундуке на западе при каждом посещении лежит зелье Алхимического огня.
guide.boss_shadowyog=Здесь десять Теневых Йогов. У каждого по 50 здоровья за уровень героя (минимум 1000), удары на 45–125, двойная скорость и почти безошибочная точность. Каждое существо на этаже добавляет им по 1 броне — сначала проредите пещеру и избегайте скрытых ловушек призыва.\n\nСначала они спят. Нападайте из-за пределов их зрения, удерживайте дверь стартовой комнаты и сражайтесь по одному.\n\nКогда у Теневого Йога остаётся меньше восьмой части здоровья, каждый полученный удар с вероятностью 50% телепортирует его прочь. Если на этаже мало чудовищ, там, куда он перенесётся, появятся призрачные крысы. Каждый удар по Теневому Йогу также заново взводит до четырёх уже сработавших ловушек в поле вашего зрения, превращая их в скрытые ловушки призыва. Добивайте каждого быстро.\n\nНа них не действуют страх, исступление, очарование, сон, огонь, отравляющий газ, головокружение и Мрак; заманить их тоже нельзя. Корни, хромота, замедление, холод и Рок всё ещё работают.\n\nТолько последний Теневой Йог один раз за забег оставляет _Сферу Зота_. Бросьте её, чтобы установить турель, или разбейте ради страницы «Город» из дневника Отилюка. С гибелью последнего Йога исчезнут и оставшиеся крысы и демоны-они, после чего Сан-Чикарах сможет вернуть вас домой.
guide.wet_shrine=В болоте наполовину затонуло _святилище_: разрушенное кольцо стен старого храма со _статуей_ в каждом углу, затопленным полом и _затонувшим идолом_ древнего болотного божества посередине. Оставьте _подношение_ в воде у его подножия: 120 _золотых_ или предмет, за который торговец заплатил бы не менее 20 золотых. Вы получите _благословение болота_: яд, едкая слизь и паразиты не смогут заразить вас, а болотная вода перестанет замедлять шаги. Золото даёт 500 ходов защиты; предмет — тем больше, чем выше его цена, максимум 1000 ходов за вещь стоимостью 200 золотых. Идол принимает одно подношение каждые три дня.\n\nНочью святилище охраняют стражи. Если подойти ближе десяти клеток после наступления темноты, из воды поднимутся два-три _утонувших послушника_ — один раз за ночь. Они медленно идут по воде, хотя, как вся нежить, в темноте ускоряются. Каждый третий удар заражает болотными паразитами. Они не преследуют вас дальше десяти клеток от святилища. На рассвете возвращаются под воду, если не заняты боем.
guide.sok_practice=Здесь четыре вида овец. _Обычная овца_ при столкновении отходит на одну клетку прямо от вас, никогда по диагонали. _Угловая овца_ может двигаться и по диагонали. _Овцу-переключатель_ нельзя толкнуть: при столкновении вы меняетесь местами. _Чёрная овца_ после толчка прыгает на ловушку грабителя в радиусе пяти клеток и активирует её, а если таких ловушек нет — исчезает.\n\nЗатолкните овцу на призовую клетку (отмеченную четырьмя синими точками) — появится награда. Здесь сначала железный ключ от запертой двери, затем _полотенце_ (10 применений: лечит кровотечение и едкую слизь у вас или питомца). Всего три призовые клетки и две награды.\n\nВаш путь обходит ловушки грабителя — наступить на них можно лишь по собственной воле. _Ловушка превращения_ делает обычную овцу угловой, овцу-переключатель — обычной, а угловую — навсегда неподвижной. Не заводите на неё угловых овец.\n\nКолодец не работает, пока овца не наступит на его переключатель. Ищите в стенах тайные двери. При первом посещении в пяти сундуках лежит 300–500 золотых или свиток улучшения (шанс 1 к 5).
guide.pg_field=Первый убитый вами _гнолл-лучник_ оставляет _Древний ключ канализации_. Такой лучник обязательно появляется на этаже встречи с печальным призраком (глубина 2, 3 или 4). Используйте ключ на любом этаже без босса с глубины 2 по 24, чтобы попасть на Поле; там тот же ключ возвращает обратно.\n\nВплотную лучник стрелять не может, а здесь лучники ходят медленнее вас. Их стрелы становятся сильнее после каждого лучника, которого вы когда-либо убили, поэтому приходите пораньше. Примерно треть появляющихся врагов — _лесные защитники_: летают и стреляют молниями по любой свободной прямой. Убивайте их первыми: вплотную они слабы.\n\nКаждый лучник здесь оставляет три _лесных дротика_, наносящих живым существам урон в 3–6 раз выше обычного. Начиная с 21-го лучника каждое убийство с шансом 1 к 10 даёт страницу «Безопасное место» из дневника Отилюка. После гибели Тенгу следующий убитый лучник оставит _Древний ключ Тенгу_ от логова на глубине 36. Если приминать высокую траву, можно найти семена, орехи, ягоды и росу.\n\nПри первом выходе с Поля после убийства ста или более лучников вы получите ещё 30 лесных дротиков.
guide.sewers_f2=На этом этаже лежит _гриб-поганка_, а изобретатель Ю. Мертенс ждёт за непробиваемым щитом. Поговорите с ним, держа в рюкзаке гриб-поганка и флягу для росы, и он один раз переделает флягу, а затем уйдёт. Выберите вариант:\n_Конденсатор росы_: фляга наполняется из влажного воздуха, примерно по капле за 100 ходов при предельной влажности, быстрее под дождём или в тумане, но никогда — в сухом воздухе.\n_Дозированный глоток_: можно выпивать точное число капель; каждая восстанавливает одну двадцатую максимального здоровья и максимальной маны.\n\nСоберите всю росу перед спуском: оставленные капли высохнут.\n\nНачиная отсюда на этаже одновременно бродят 5–7 врагов, и вместо убитых появляются новые. Появляются гноллы-разведчики. Сундуки иногда оказываются мимиками, часть дверей скрыта, а ловушка призыва вызывает 1–3 чудовища этого этажа.\n\nПечальный призрак находится здесь в одном забеге из трёх и просит убить вонючую крысу. На её этаже всегда появляется _гнолл-лучник_; с первого убитого выпадет _Древний ключ канализации_ (см. «Поле»). Гнолл, который вас не трогает, — _изгнанник_: нападает только в ответ и носит дополнительную добычу.
guide.boss_zot=У Зота 10 000 здоровья и до 100 брони. Каждый удар наносит ему лишь от 1 единицы до четверти обычного урона, кроме ударов реликтовым оружием и _гневом Юпитера_. За ход он восстанавливает 50–100 здоровья или лишь 1, пока на вас надет _амулет автоматического зелья_.\n\nОн двигается вдвое быстрее вас и наносит 300–400 урона вплотную или по любой свободной прямой. Для сближения телепортируется на видимую вам клетку, а после пяти атак рядом с вами телепортируется снова. Каждый перенос оставляет _фазу Зота_, максимум семь одновременно (одиннадцать для Охотницы). У фазы 1000 здоровья, такое же снижение урона, два удара на 115–160 за ход или электрический снаряд на 80–160 урона (в воде в полтора раза сильнее). Каждая фаза с вероятностью около одной трети оставляет свиток.\n\nНе парализуйте Зота, учитывайте также, что взрыв гнева Юпитера может сделать это случайно. Каждый ход паралича он восстанавливает 200 здоровья и призывает рядом с вами _магический глаз_ (400 здоровья, летает, луч на 50–100 урона). При игре за Охотницу магический глаз также появляется после каждого её попадания.\n\nЗот невосприимчив к огню, газу, сну, страху, исступлению, очарованию, головокружению и вампирическому оружию, а также сопротивляется яду. В коридорах у него меньше мест для телепортации. После его смерти все фазы и глаза исчезают.
guide.postgame_overview=На глубинах 27–33 нет лестниц. Древний ключ или книга переносит туда с обычного этажа подземелья и возвращает обратно. Ключи и книги остаются в рюкзаке и работают повторно. Пока за вами следует питомец, они не действуют.\n\nПервые четыре этажа — Поле, Поле битвы, Рыбалка и Хранилище — места для массового истребления врагов. Здесь постоянно появляются чудовища одного вида, а на земле нет добычи, кроме сундуков с припасами на Поле битвы и Рыбалке и золота в Хранилище. Каждое убийство соответствующего врага учитывается, где бы вы его ни совершили; лучники, скелеты и воры становятся сильнее с каждым убийством. Награды за них открывают логова боссов.\n\nПоследние три этажа — Катакомбы, Крепость и Пропасть — лабиринты с добычей, иногда со _зельем силы_ или _свитком улучшения_. На выходном постаменте каждого лежит по части _Сан-Чикараха_. Принесите все три кузнецу в Пещерах, и он выкует предмет, ведущий на глубину 35.\n\nЛовушек здесь нет, воздух жаркий и сухой в любое время года, вода не замерзает. В полнолуние по ночам появляются призрачные крысы — быстрая нежить, стреляющая снарядами и способная ослабить вас.
guide.sok_castle=Большинство овец здесь — угловые. На этом этаже больше всего ловушек грабителя среди всех головоломок, а среди них встречаются ловушки превращения; не заводите на последние угловых овец.\n\nДвенадцать призовых клеток, двенадцать наград при первом посещении. Первые шесть — железные ключи, появляющиеся на вашей стартовой клетке, по одному на каждую запертую дверь. Остальные шесть выдаются в случайном порядке: семя фазового сдвига, семя звездоцвета, два свитка магического насыщения, свиток возрождения и _очки_. Если их надеть, расход зарядов дневника уменьшается вдвое. Награды 11 и 12 появляются далеко на юго-западе, куда ведёт третий колодец. Он не работает, пока овца не наступит на переключатель на юге.\n\nНа востоке стоит _ожившая статуя_: 500 здоровья, зачарованное оружие +5, скорость вдвое ниже обычной. Она просыпается, только увидев вас или получив удар; шум её не разбудит. Если оживёт, уходите. Добычи с неё нет; она сопротивляется яду и не получает урона от вампирического оружия.\n\nПри первом посещении в сундуках лежат 400–800 золотых или свиток улучшения (шанс 1 к 5). Один сундук при каждом посещении содержит зелье Алхимического огня.
guide.pg_chasm=_Книга небес_ открывает этаж, испещрённый пропастями. Рядом с местом появления лежит зелье левитации, а по этажу разбросаны семена фазового сдвига.\n\nПо этажу стоят _стражи_. Каждый вооружён случайным зачарованным оружием +3 без проклятия и оставляет его после смерти. Страж неподвижен, пока не получит урон, поэтому вы сами выбираете момент боя. Проснувшегося стража трудно поразить, а он атакует своим оружием. Будите их по одному и не применяйте площадные атаки рядом с группами.\n\nЕдинственные бродячие враги — _летающие защитники_. Они перелетают пропасти, стреляют зарядами и ничего не оставляют.\n\nПадение в яму отнимает не меньше половины текущего здоровья, вызывает кровотечение и хромоту; если осталось не более четверти максимального здоровья, падение может убить. Внизу есть комната с одной лестницей, ведущей прямо к выходному постаменту с _Сан-Чикарахом Превосхождения_. Если заблудились и здоровы — прыгайте.\n\nСоберите все три части и поговорите с кузнецом в Пещерах. Он выкует _Сан-Чикарах_, которая переносит на глубину 35, но не выпустит оттуда, пока не погибнут все Теневые Йоги.
guide.hs_animals=Оленей, коз, кроликов, бизонов и верблюдов нельзя приручить: их можно лишь взять на верёвку и вести за собой. Лошадь разрешает надеть верёвку только после приручения (см. «Лошади и верховая езда»). Действие «НАБРОСИТЬ» у верёвки применяется к оленю, козе, кролику, бизону или верблюду на расстоянии до 6 клеток, если животное видно и ничто не мешает. На верёвке животное следует за вами и не убегает. Одновременно можно вести не больше двух. Если животное отстанет более чем на 6 клеток, верёвка спадёт и вернётся в рюкзак.\n\n_ПРИВЯЖИТЕ_ ведомое животное к соседнему забору, частоколу или _столбику для привязи_ (2 доски), и оно будет оставаться не дальше одной клетки от него. Нажмите на привязанное животное, чтобы снова повести его, отпустить или забить на мясо.\n\nЖивотное в _загоне_ — пространстве, со всех сторон огороженном заборами, частоколом, стенами и закрытыми воротами, — остаётся там навсегда и бродит только внутри. Нажмите на него, чтобы забить.\n\n_Забой_ сразу убивает животное и не даёт опыта. Олень, коза, бизон и верблюд оставляют по 2 куска загадочного мяса, кролик — один, а также по одной шкуре.\n\nЖивотное на верёвке, стоящее рядом, переходит с вами между ярусами и при перемещении через камни. Привязанное остаётся у своего столбика. В совместной игре брать на верёвку, привязывать и забивать животных может только ведущий игрок.
guide.topic_bestiary=После зачистки этажа чудовища постепенно появляются снова: ночью вдвое быстрее, а на тёмном этаже — ещё в полтора раза быстрее. У каждого этажа свой набор врагов, но иногда встречаются редкие чужаки: крысиный босс на глубине 1, синоби на глубинах 7 и 8.\n\nПримерно одно обычное чудовище из пятидесяти рождается усиленной разновидностью: крыса-альбинос, чей укус вызывает кровотечение, слизень с едкой слизью, краб-отшельник в броне из бочки и другие на больших глубинах. Безделушка _Крысиный череп_ увеличивает шанс таких встреч.\n\nПосле смерти скелет взрывается — не стойте рядом. Тюремные воры и стражи относятся к нежити, поэтому на них действуют все средства против нежити, а ночью нежить бьёт на четверть сильнее.\n\nВ полнолуние по ночам восстают мертвецы: призраки в канализации после наступления темноты; призраки и призрачные некроманты в тюрьме с сумерек; красные призраки в Пещерах; синие — в Городе и Залах; призрачные крысы — в городских шахтах и на запечатанных этажах. Примерно один призрак из ста — _мучающийся дух_. Прочтите рядом с ним свиток снятия проклятия, и он оставит зачарованное оружие или броню с руной.\n\nПиранья может появиться в любом водоёме, где вода окружает её с пяти из восьми сторон.
guide.sewers_f4=Последний обычный этаж перед Гу. Все ещё не найденные в канализации _свитки улучшения_, _зелья силы_ и _магические перья_ лежат здесь; лаборатория тоже находится тут, если её не было на глубине 3.\n\nЕсли вы ещё не встретили призрака, она здесь, а её цель — _огромный краб_. Пока он смотрит на вас, клешня блокирует удары ближним и метательным оружием, а также разряды палочек. Атакуйте, будучи невидимым, когда краб парализован, или заставьте союзника отвлечь его внимание. Двигается он медленно. Награда на выбор — оружие или броня II–V ранга, от +0 до +3, с вероятностью 1 к 5 скрытого зачарования или руны. Завершите задание, даже если награда не нужна: у Засохшей розы не вырастут лепестки, пока призрак не обретёт покой.\n\nЭтот этаж заполнен крабами и слизнями, в том числе бурыми и красными (красные способны отравить). Слизень уменьшает любой урон свыше 5 (10 превращается в 7, а 25 — в 10), поэтому лучше подходят быстрые лёгкие удары. Из слизня с шансом 1 к 5 выпадает оружие II ранга, после каждого выпадения шанс уменьшается в четыре раза.\n\nВ одном забеге из сорока из тюрьмы поднимается безумный вор. Он крадёт ненадетый предмет без улучшений и убегает. Если скроется из виду на расстоянии шести клеток или дальше, предмет будет потерян.
guide.surface_events=Когда рядом происходит событие, журнал сообщает направление к нему, а карта мира отмечает место до окончания события.\n\n_Падающая звезда_ ночью падает на открытой местности. В кратере три дня лежит _звёздный осколок_. Городской кузнец делает ядро мастерства из двух осколков, а торговцы дорого за них платят.\n\n_Странствующий рынок_ на три дня разворачивается у колодца в человеческой деревне. В двух-трёх палатках продаются кольца, палочки, артефакты, экзотические зелья и свитки, которых не бывает в деревенских лавках, с наценкой 25%.\n\nРазбойники устраивают однодневный _набег_ на человеческую деревню; дым виден издалека. Убейте всех налётчиков до конца дня, и жители заплатят 60 золотых плюс 15 за каждый дом и дадут хорошее оружие, броню, палочку или кольцо. Кроме того, в этот и следующие три дня торговцы снизят для вас цены до 75% обычных. Если набег продлится весь день, лавки закроются на два дня.\n\nИногда ночью рядом с вами _волчья стая_ охотится на оленя — вы услышите вой. Волки не тронут вас, пока вы не подойдёте близко или не ударите одного. Тогда вся стая бросится на вас. От убитого волками оленя останется мясо.

# Новые страницы руководства (полный русский перевод)
guide.basics_examining=Сначала осмотритесь, потом делайте шаг. Нажмите _лупу_ на панели инструментов или клавишу осмотра, а затем выберите любую клетку: с чудовищем, предметом, растением, ловушкой или самим героем.\n\nВ окне чудовища показаны его здоровье, способности, температура клетки и температура его тела. Осмотрите первую встреченную _канализационную змею_: она уворачивается почти от каждого удара, но в описании сказано, как с ней справиться. Осмотр _растения_ или _ловушки_ позволит узнать их действие, не наступая на них.\n\nНажмите значок _эффекта_ рядом с портретом героя или в окне чудовища, чтобы узнать, что он делает и сколько ещё продлится. Дважды нажмите лупу или удерживайте её, чтобы начать поиск.\n\nПосле удара над целью появляется карточка: величина урона, красный крестик при критическом попадании и маленькие значки дополнительных событий. Это может быть зачарование, отмеченное своим цветом (пустой значок обозначает остаточный эффект оружия); серебряный значок — срабатывание особенности типа оружия; золотой — влияние свойства снаряжения на удар или на точность выстрела при ветре; наконец, значок наложенного состояния. Несколько быстрых ударов одного атакующего по одной цели объединяются в карточке. При промахе тоже появляется карточка: она показывает уклонение, блокирование или парирование и причину неудачи. Если сработал навык, его значок присоединяется к карточке цели; туда же попадает эффект, наступивший сразу после удара.
guide.boss_dm300=У ДМ-300 300 здоровья, а его удары наносят от 15 до 25 урона. Когда остаётся 200, а затем 100 здоровья, он переходит в режим _перегрузки_: становится неуязвимым, движется вдвое быстрее и пробивает стены. При этом включается один из силовых пилонов — но не ближайший к вам. Разрушьте активный пилон, чтобы прекратить перегрузку. После уничтожения второго пилона робот больше не перегружается: последние 100 здоровья придётся снимать в обычном бою, опасаясь воды и проводов под напряжением.\n\nВ обычном режиме он применяет два приёма, чаще всего чередуя их. _Ядовитый газ_: выходите из облака. _Камнепад_: находясь рядом, робот отбрасывает вас, а затем помечает область 7 на 7 клеток вокруг героя. Одна клетка рядом с центром всегда безопасна. Упавшие камни наносят урон и оглушают на 3 хода.\n\nНа арене стоит одна _башня_. Она не нападает, но время от времени выпускает рядом с собой до двух сломанных роботов; удар по башне созывает всех чудовищ этажа. У неё 130 здоровья, и атаковать её можно как обычного врага. Если разрушить башню после гибели ДМ-300, из неё выпадут скелетный ключ и от 3 000 до 6 000 золота. Если разрушить раньше, награды не будет.\n\nНе подпускайте робота к _оголённым проводам_. Сон на него не действует, а ужас, очарование, головокружение, хромота, озноб, заморозка, обездвиживание корнями и замедление длятся вдвое меньше обычного.\n\nПосле победы выпадут от 2 до 4 металлических осколков, страница «Порталы Сокобана», а также _дневник Отилюка_, если вы ещё ни разу его не подбирали. Имеющийся при вас маяк Ллойда бесплатно улучшится. Чтобы получить значок испытания босса, победите, ни разу не пострадав от разряда пилона или наэлектризованной воды и не позволив роботу атаковать вас во время перегрузки.
guide.boss_dwarfking=У Короля дворфов 300 здоровья. Битва состоит из трёх фаз, причём в первых двух убить его нельзя.\n\n_Фаза 1:_ король наносит от 15 до 25 урона и призывает слуг на четыре постамента — преимущественно упырей, а каждого четвёртого заменяет монахом или чернокнижником. Он может связать себя со слугой, чтобы тот разделял получаемый королём урон, или отступить, телепортировав слугу к вам. Чем больше урона получает король, тем чаще он призывает подкрепления. Сначала убивайте слуг, но, когда у короля останется почти 50 здоровья, перестаньте на них отвлекаться: при 50 он отойдёт к трону, и все слуги погибнут.\n\n_Фаза 2:_ король получает непробиваемый щит прочностью 300 единиц. Бить его бесполезно. Каждый призванный слуга при гибели отнимает у щита 25 единиц, так что для перехода к следующей фазе нужно 12 убийств. В последней волне одновременно появятся чернокнижник, монах и два упыря. Упыри воскрешают друг друга, а повторная гибель воскрешённого не засчитывается: убивайте их порознь. Если в момент призыва вы стоите на постаменте, слуга появится рядом; лишь когда все окружающие клетки заняты, вы получите от 20 до 40 урона, а щит потеряет 25 единиц.\n\n_Фаза 3:_ король без остановки призывает слуг, а нанесённый ему урон поступает постепенно в следующие ходы. Продолжайте атаковать: ничто из нанесённого урона не пропадёт.\n\nОн оставляет _Корону короля_ (она превращает вашу броню в классовую с особой способностью), страницу «Загадки Сокобана» и, если вы ещё не находили его, дневник Отилюка. Маяк Ллойда при вас повышается на один уровень, а наложенное чернокнижниками ослабление снаряжения исчезает.
guide.boss_goo=У _Гу_ 100 здоровья. Стоя в воде, он восстанавливает по 1 здоровью за ход. Выманите его на сушу.\n\nКогда Гу впервые замечает вас, рядом с ним могут появиться до четырёх _ядовитых слизней_. У каждого 50 здоровья; они движутся вдвое быстрее, отравляют при каждом попадании, а затем убегают, оставляя паутину. В воде слизни лечатся, а пока Гу жив, каждый полученный удар заставляет их делиться. Поэтому сначала убейте самого Гу: тогда слизни перестанут размножаться. Первые четыре слизня оставляют по зелью восстановления.\n\nКогда Гу раздувается и ревёт, он готовит сокрушительный удар: через два хода он атакует по прямой на расстоянии до 2 клеток с тройным уроном. Отойдите или укройтесь за стеной либо колонной. Если Гу придётся сдвинуться, подготовка прервётся.\n\nПри здоровье ниже половины Гу бьёт сильнее, чаще уклоняется и намного чаще готовит удар. Приберегите зелья и свитки на эту часть боя. Если он восстановит здоровье выше половины, то успокоится. Треть его попаданий покрывает героя _слизью_, причиняющей урон каждый ход, пока вы не войдёте в воду.\n\nПока этаж запечатан, восстановление вашего здоровья прекратится, если слишком долго не наносить урон Гу. Каждая единица здоровья, которую он восстанавливает в воде, сокращает это время.\n\nПосле гибели он оставляет _изношенный ключ_, от 2 до 4 комков слизи, страницу «Практика Сокобана» для дневника Отилюка, с вероятностью 50% — турель «Мистер Разрушитель», а также _руку-бензопилу_: проклятое оружие 5-го ранга, которое после экипировки нельзя снять. Во включённом состоянии каждый удар расходует росу из фляги ради дополнительных порезов.
guide.boss_tengu=У Тенгу 200 здоровья. Он атакует издалека по любой свободной линии, но один удар не может отнять у него больше 25 здоровья: особенно мощные атаки окажутся расточительными. По противнику вплотную к себе Тенгу попадает вдвое реже.\n\n_Фаза 1 — камера:_ теряя каждые 25 здоровья, Тенгу перепрыгивает на новое место и расставляет скрытые ловушки с ядовитыми дротиками. Чем меньше у него здоровья, тем больше ловушек. В момент установки каждая ловушка один раз вспыхивает; поиском обнаружить её нельзя. Запоминайте вспышки. Дальние атаки позволяют стоять на проверенных клетках, а погоня за Тенгу ведёт прямо по ловушкам.\n\nКогда здоровье упадёт до половины, Тенгу исчезнет, а тюрьма перестроится. Во время передышки никто вас не атакует: полечитесь и пройдите обратно по коридору, чтобы начать вторую фазу. Предметы, оставленные в камере, вернутся после боя.\n\n_Фаза 2 — овальная арена без укрытий:_ теряя каждые 25 здоровья, Тенгу отскакивает и применяет ещё два или три приёма. Первый всегда — бомба, взрывающаяся через 3 хода: покиньте зону поражения. Второй — электрический столб, до конца боя поражающий соседние клетки разрядами. Кроме того, Тенгу выдыхает огонь конусом в вашу сторону: уклоняйтесь вбок. Победите его как можно быстрее.\n\nПока этаж запечатан, здоровье перестанет восстанавливаться, если долго не наносить Тенгу урон. Корни, слепота и ужас на него не действуют. Зеркальные двойники могут принимать на себя его обычные атаки.
guide.boss_yog=У Йога 1 000 здоровья. Он неподвижен и неуязвим, пока жива хотя бы одна его длань. Каждые 300 полученного урона он призывает новую длань, а арена темнеет: всего появятся три длани — по одной из каждой пары (пылающая или земляная, гниющая или ржавая, светлая или тёмная). После гибели третьей длани Йог заполняет арену прислужниками и начинает действовать намного быстрее, чтобы защитить последние 100 здоровья.\n\n_Лучи:_ сначала подсвечиваются клетки, затем через любые преграды проходят лучи, которые не промахиваются и наносят от 20 до 30 урона каждый. Уходите с подсвеченных клеток. Чем слабее Йог, тем больше лучей, но одну соседнюю с героем клетку он всегда оставляет безопасной.\n\n_Призыв:_ за каждый оставшийся демонический портал появляется один потрошитель, за остальные — личинки.\n\n_Длани_ неуязвимы в пределах 4 клеток от Йога. Сначала выманите каждую подальше.\n_Пылающая:_ невосприимчива к холоду. Вода гасит пламя, хотя сама при этом выкипает.\n_Земляная:_ каждая клетка высокой травы вокруг неё уменьшает наносимый вами урон на одну шестую; сожгите траву.\n_Гниющая:_ лечится в воде, а нанесённые ей удары превращаются в кровотечение, так что учитывается лишь самый сильный удар.\n_Ржавая:_ не проходит в коридоры; ваш урон наносится с задержкой, но целиком.\n_Светлая:_ при половине здоровья ослепляет вас и телепортируется.\n_Тёмная:_ при половине здоровья гасит ваш свет и телепортируется; держите запасной факел.
guide.caves_mine=Почти вся шахта заполнена камнем: пробивайтесь _киркой_. Разрушение каменной клетки расходует 4 единицы голода, а кристалла, валуна или золота — 1. В шахте лежит одна порция еды, а в варианте с гноллами — две.\n\nВаша цель — _тёмное золото_. Каждая штука приносит 50 очков благосклонности, максимум за 40 штук — 2 000. Всего в шахте от 45 до 47 штук, поэтому после сороковой можно остановиться. Две тайные комнаты за скрытыми дверями хранят ещё по 4–5 штук. За убийство местного босса дают 1 000 очков. Выход из шахты завершает задание.\n\nШахта бывает трёх видов.\n_Гноллы:_ в каждой большой комнате находятся гнолл-подрывник и гнолл-страж. Пока подрывник жив, страж получает лишь четверть наносимого вами урона. Сначала убейте подрывника. Копьё стража опаснее на расстоянии, поэтому подходите вплотную. Камнепад подрывника оглушает любого, кого заденет, а стража — на 10 ходов: постарайтесь подставить стража под камни. Рядом с баррикадой подрывник вместо этого бросает валуны. Босс, гнолл-геомант, пока защищён каменной бронёй, уязвим только для кирки; пока ему служит подрывник — вовсе неуязвим.\n_Кристаллы:_ в больших комнатах дремлют кристальные стражи; не будите их. Убить их нельзя — только вывести из строя, а в узких проходах они движутся с четвертью скорости. Босс, кристальный шпиль, уязвим только для кирки. Его шипы калечат стражей, а когда шпиль разрушается, разбиваются и все стражи в его поле зрения.\n_Грибы:_ грибные часовые неподвижны, но, заметив вас, сразу отравляют издалека (у каждого по 200 здоровья). Грибные прядильщики получают меньше урона рядом с высокой травой. Босс, грибное ядро (300 здоровья), не двигается и не атакует.\n\nВернувшись наверх, благосклонность можно потратить на: возврат кирки (250, бесплатно при 2 500 заработанных очков); перековку двух однотипных предметов в один более качественный (500, затем каждый раз на 1 000 дороже); укрепление, снижающее риск потери зачарования при улучшении (500 с тем же ростом цены); улучшение предмета ниже +2 (1 000 с тем же ростом); либо ковку — на выбор одно из двух оружий, метательное оружие и броня, иногда с тайным зачарованием (2 000). Неиспользованная благосклонность превращается в золото.
guide.city_vault=Провал в комнате _амбициозного беса_ ведёт в запечатанное хранилище дворфов. Сначала поговорите с бесом: ему нужна _обсидиановая статуэтка_ изнутри.\n\nПри входе здоровье полностью восстанавливается. Ваше снаряжение и золото останутся у беса, а в хранилище вы попадёте в тканевой броне и с _кристаллом побега_, позволяющим выйти в любой момент. Местные лестницы не работают. Во время Восхождения войти нельзя.\n\nСтражи медленно патрулируют помещения и видят конусом перед собой. Держитесь у них за спиной: если страж заметит вас на мгновение, он лишь подойдёт проверить место. Убитые стражи оставляют _дворфийские жетоны_ для двери с жетонами. По хранилищу разбросано оружие для боя; неподалёку от входа есть зелье исцеления.\n\nВозле дальней двери последней комнаты вход запирается, и появляется элементаль хранилища, меняющий огненную, ледяную и электрическую стихии. За ним находятся статуэтка и награды беса: артефакт или кольцо, ещё одно кольцо, два оружия, пластинчатая броня и палочка — всё не ниже +2 и без проклятий.\n\nПри выходе вам вернут снаряжение, но из найденного внутри разрешат оставить только один предмет. Если вы принесли статуэтку, бес начислит 4 000 очков и позволит забрать любой предмет. Без неё он оценит исследование (до 1 000), жетоны или открытую жетонную дверь (до 1 250), а также призванного элементаля (750 за убийство; если он жив, тем меньше очков, чем больше вы его ранили). Чем выше счёт, тем ценнее предмет разрешат выбрать; при результате ниже 500 не дадут ничего. При счёте выше 2 000 бес откроет лавку за троном Короля дворфов.
guide.dens_overview=В логовах боссов (глубины 35, 36, 37, 38 и 40) нет лестниц. В каждое можно попасть только с помощью особого предмета, применив его на обычном этаже главного подземелья с 2-го по 24-й (Сан-Чикарах работает с 1-го по 26-й). Тем же предметом можно вернуться, но лишь после смерти босса логова. Кость с надписью, раковина и древняя монета расходуются при возвращении; древний ключ Тенгу и Сан-Чикарах остаются.\n\nГде их искать:\n_Древний ключ Тенгу_ (36): у первого убитого гнолла-лучника после победы над Тенгу.\n_Кость с надписью_ (37): у покрытых мхом скелетов. Начиная с 51-го убийства, шанс 1 из 10; после 101-го предмет гарантирован.\n_Раковина_ (38): у пираний-альбиносов, по тем же правилам.\n_Древняя монета_ (40): у золотых воров, по тем же правилам.\n_Сан-Чикарах_ (35): её выкует кузнец в пещерах из трёх частей.\n\nНаграды: адамантитовое кольцо на глубинах 36 и 40, адамантитовое оружие на 37-й, адамантитовая броня на 38-й, от 1 900 до 4 000 золота с каждого босса и _сфера Зота_ на 35-й. Городской кузнец использует адамантит, чтобы укрепить подходящее оружие, броню, кольцо или палочку.\n\nРекомендуемый порядок: Тенгу, Король скелетов, Король воров, Король крабов, затем глубина 35. Маяк Ллойда работает в каждом логове, кроме логова Тенгу. Глубины 39 не существует. Пропасть на глубине 40 ведёт на 41-ю, откуда нет выхода. Воздух здесь раскалён.
guide.mines_boss=Когда вы сойдёте с лестницы, этаж заблокируется. Сообщение объяснит, что Отилюк заточил безумного волшебника Зота внутри _Палантира_, а сам превратился в каменного голема, который его охраняет. После смерти голема этаж откроется.\n\nЗал с лестницей закрывают две запертые двери; в сундуке здесь лежит железный ключ. За дверями спят 88 _шахтных стражей_, распределённых по двум группам. Каждый вооружён зачарованным оружием +10, наносит двойной урон, получает от 1 единицы до четверти урона от атак не-реликтовым оружием, появляется рядом, если вы отошли больше чем на 2 клетки, и телепортируется лечиться при здоровье ниже четверти. Проснувшийся страж может разбудить соседей. Каждый оставляет своё оружие; первый убитый — ещё и _ключ залов_, единственный в игре. Он переносит с любого обычного этажа с 2-го по 24-й прямо на арену Йог-Дзевы на глубине 25 и обратно. Возвращение расходует любой имеющийся у вас скелетный ключ.\n\nВосемь _светящихся башен_ окружают западную группу стражей. Они неуязвимы и, пока голем жив, наносят от 300 до 600 урона, стоит приблизиться на 4 клетки. В центре западной группы находится Палантир.\n\nГолем неподвижно стоит среди восточной группы, пока его не атакуют. Подробнее — в разделе об Отилюке.
guide.pg_battle=Первый убитый вами покрытый мхом скелет оставит _древний ключ тюрьмы_. Если вы ещё ни разу не получали его, один такой ключ можно найти на глубине 9. Примените его на любом обычном этаже с 2-го по 24-й, чтобы попасть сюда, а затем ещё раз — чтобы вернуться. Ключ не расходуется, поэтому можно возвращаться снова.\n\nСначала откройте сундук: в нём 200 _святых ручных гранат_. Каждая наносит от 75 до 155 урона всей нежити в радиусе 2 клеток и вселяет в неё ужас. Вам, живым существам и предметам взрыв не вредит, поэтому, оказавшись в окружении, можно бросить гранату себе под ноги.\n\nСкелеты хорошо защищены и сильно бьют. Каждое убийство делает оставшихся быстрее и опаснее: после 50 убийств они атакуют раз за ход, после 100 — дважды. При гибели скелет взрывается, слегка раня соседей. Иногда среди них летает _хранитель могил_ и стреляет снарядами. Он не относится к нежити, поэтому гранаты бесполезны: убейте его обычным оружием.\n\nНачиная с 51-го скелета, каждый убитый имеет шанс 1 из 10 оставить _кость с надписью_ (вход в логово на глубине 37); 101-й оставит её обязательно. Со скелетов падает жёлтая роса, изредка красная. Впервые покинув локацию после 100 убийств, вы получите ещё 20 гранат. Для золотого подземельного ореха тоже требуется убить 100 скелетов.
guide.pg_catacomb=Если за задание в хранилище бес начислил больше 2 000 очков, в его лавке на глубине 20 появятся три книги. До получения Амулета Йендора каждая стоит 225 000 золота. После этого _Книга мёртвых_ стоит 7 500, Книга живых — 12 500, а Книга небес — 15 000. Прочтите книгу на любом обычном этаже с 1-го по 26-й, чтобы попасть в её локацию. Для выхода встаньте на дальний постамент и прочтите её снова. Книга останется у вас.\n\nКнига мёртвых открывает катакомбы: от 12 до 18 комнат, соединённых узкими проходами. Вы появитесь на одном постаменте; на другом лежит _Сан-Чикарах смерти_.\n\nЗдесь бродят _синие призраки_: 195 здоровья, мощные удары и скорость вчетверо выше вашей. Убежать от них не получится. Один удар из десяти вызывает головокружение и ужас. Сражайтесь с ними по одному в коридорах. Они — нежить, поэтому двух-трёх святых ручных гранат достаточно, чтобы уничтожить призрака. Каждый оставляет красную росу, самую сильную.\n\nИзредка появляется _дворф-лич_. Он стреляет издали и отступает, а вплотную атаковать не может. Это тоже нежить; иногда с него выпадает зелье исцеления.\n\nВ комнатах лежат сундуки, останки, золото, иногда зелье силы или свиток улучшения. Обыщите их перед выходом.
guide.pg_fishing=Первая пиранья, которую вы убьёте после достижения глубины 11, оставит _древний ключ пещер_; на глубине 14 всегда есть дополнительная пиранья. Используйте ключ на любом обычном этаже с 2-го по 24-й, чтобы попасть на затопленный этаж с песчаными островками.\n\nВ воде живут 30 _гигантских пираний-альбиносов_. Они плавают вдвое быстрее вас, сильно кусают, хорошо уклоняются и неуязвимы к огню, холоду, газу, параличу и корням. Они способны укусить героя, стоящего у самой воды; отойдите от берега на одну клетку — и они не достанут.\n\nРядом с местом прибытия стоит сундук с 99 _рыболовными бомбами_ и зельем левитации. Сама бомба не наносит урон: все пираньи-альбиносы в радиусе 2 клеток оказываются на случайных участках суши и там умирают; их добыча остаётся на тех же местах. Опыта за них не дают, но выпадает еда, причём тем чаще, чем больше пираний вы уже убили.\n\nГлавная опасность — иногда появляющийся _хранитель рыб_. Его снаряды наносят от 25 до 59 урона, а если вы стоите в воде — ещё на половину больше. Стены останавливают снаряды; вблизи хранитель бьёт слабее.\n\nНачиная с 51-й пираньи-альбиноса, шанс получить _раковину_ (вход в логово на глубине 38) равен 1 из 10; 101-я оставит её наверняка. Впервые покинув локацию со 100 убийствами, вы получите 40 ягод. Цеп Локи не может сделать вас здесь невидимым.
guide.pg_fortress=_Книга живых_ открывает крепость дворфов. Коридоры здесь шириной в две клетки, поэтому удерживать одиночные дверные проёмы не получится.\n\nЗдесь живут _они_: у каждого 520 здоровья, удары на 50–90 урона, невосприимчивость к ужасу и бешенству. Они не нежить, так что гранаты на них не действуют. Они атакуют медленно — раз в полтора хода — и поначалу все спят. Если двигаться тихо, можно пройти весь этаж, никого не разбудив.\n\nРядом с местом прибытия лежит зёрнышко _волшебного риса_. Если его поднять, все они на этаже проснутся и направятся к вам, поэтому берите его лишь тогда, когда будете готовы. Из риса можно делать _рисовые шарики_: они усыпляют и переносят в другое место этажа цель, если она не получила урона; либо _бомбы с клёцками_, усыпляющие всех в области 3 на 3 клетки и перемещающие неповреждённых. На нежить эти средства не действуют. Зёрнышко рассыплется после изготовления примерно 200 шариков или 40 бомб.\n\nЗа магическим щитом вас ждёт _изобретатель_. Принесите ему поганку, лежащую на этом этаже, и держите флягу для воды в рюкзаке. Он навсегда улучшит флягу: 300 капель вместо 100, конденсатор, собирающий росу из воздуха, и носик, позволяющий выпить точно заданное количество капель. Затем изобретатель умрёт.\n\n_Сан-Чикарах жизни_ лежит на выходном постаменте, где нужно прочитать книгу для возвращения.
guide.pg_vault=Первый убитый золотой вор оставит _древний ключ города_. Если вы его ещё ни разу не получали, ключ можно найти на глубине 19. Примените его на любом обычном этаже с 2-го по 24-й, чтобы попасть в сокровищницу: среди золотых статуй здесь лежат 50 куч по 100–300 золотых, всего около 10 000.\n\nЗолотые воры атакуют дважды за ход. Первое успешное попадание крадёт у вас от 100 до 500 золота, после чего вор убегает. Попадания по бегущему вору выбивают несколько монет, а убийство возвращает остальное. Загнанный в угол вор даёт отпор. Каждый оставляет сюрикен, а каждое убийство увеличивает здоровье и защиту следующих воров.\n\nИногда среди них парит _хранитель сокровищницы_. Здоровья у него мало, но снаряд наносит от 30 до 70 урона — больше, чем у любого другого хранителя. Убивайте его первым, прячась за статуями и стенами от обстрела.\n\nНачиная с 51-го вора, каждый убитый имеет шанс 1 из 10 оставить _древнюю монету_ (вход в логово на глубине 40); 101-й оставит её обязательно. Впервые покинув сокровищницу после того, как вы убили по 100 гноллов-лучников, покрытых мхом скелетов, пираний-альбиносов и золотых воров, вы получите _золотой подземельный орех_. Съев его, герой получит +2 к силе и +20 к максимальному здоровью, а с вероятностью 50% — +5 и +50. В сокровищнице нет припасов: берите свои.
guide.prison_f1=Первым делом найдите _лавку_: это единственный магазин на глубинах с 6-й по 10-ю. По возможности купите _дневник Отилюка_. В него можно вставить страницы, выпадающие с Гу и Тенгу, — каждая открывает путь в одну из скрытых комнат Отилюка. Если дневник так и не найдётся, на глубине 15 его оставит ДМ-300. В лавке также продаётся _анх_, полезный в битве с Тенгу на глубине 10, и единственный за забег _маяк Ллойда_. Он запоминает место и позволяет туда вернуться. Если маяк лежит у вас в рюкзаке, победы над Тенгу, ДМ-300 и Королём дворфов повышают его уровень. Портальные врата возле торговца уже активны. Врата при лавках на глубинах 11, 16 и 20 стоят соответственно 1 500, 2 300 и 3 500 золота для активации. Между активными вратами и вратами на городской площади, которые всегда работают, можно перемещаться, тратя по 150 единиц голода за поездку.\n\nЭтаж кишит скелетами. При гибели они взрываются; броня смягчает взрыв, но, если здоровья мало, не наносите смертельный удар вплотную. Безумные воры атакуют дважды за ход и крадут неэкипированный предмет без улучшений. Каждый удар по убегающему вору выбивает немного золота; если он скроется из виду на расстоянии 6 клеток и более, предмет будет потерян.\n\nИзготовитель палочек добавит к награде _адамантитовую палочку_, только если с момента вашего первого прибытия на этот этаж не умер ни один враг — независимо от того, кто его убил. Из его заданий этому условию соответствует лишь братская могила. Городской кузнец укрепляет палочки с помощью адамантита. Маги всегда получают его.
guide.prison_f2=_ДМ-100_ поражает вас молнией, если между вами есть прямая видимость. Спрячьтесь за угол, чтобы прервать обстрел. Свиток выпадает из него с вероятностью 1 из 4. _Тюремный страж_ может один раз притянуть вас цепью, а затем наложить хромоту на 4 хода. _Ископаемые скелеты_ наносят от 12 до 25 урона, атакуют медленно, хорошо защищены и взрываются при гибели, как обычные скелеты. Начиная с этих глубин встречаются также _зомби_.\n\nИзредка (шанс 1 из 50 на каждой из глубин 7 и 8) за вами начинает охотиться _синоби_. Он движется с двойной скоростью и бросает оружие по прямой на 10–23 урона. Сражайтесь с ним из-за угла.\n\n_Изготовитель палочек_ может оказаться здесь (вероятность 1 из 3; иначе ищите на глубине 8 или 9). За выполнение задания он даст на выбор одну из двух разных непроклятых палочек +1. Возможны три задания:\n_Братская могила:_ подожгите баррикаду зельем жидкого пламени, лежащим на этаже. Пока вы несёте прах из могилы, будут появляться призраки, поэтому сразу возвращайтесь.\n_Ритуальная площадка:_ поставьте четыре свечи по четырём сторонам отмеченной клетки, убейте только что призванного огненного элементаля и принесите его угли. Озноб или заморозка сразу отнимают у него половину здоровья.\n_Гнилой сад:_ гнилое сердце выпускает ядовитый газ, а гнилостные плети прячутся в траве. Огонь уничтожает плети, но никогда не поджигайте сердце: если оно сгорит, семя гнилофрукта не выпадет.
guide.sokoban_overview=_Дневник Отилюка_ переносит вас в созданные им свёрнутые комнаты. Его продают в лавке на глубине 6. Если вы ни разу его не подберёте, дневник выпадет с ДМ-300, а если и это не поможет — с Короля дворфов.\n\nДля каждого места нужна отдельная страница. Вставляйте её командой «ДОБАВИТЬ СТРАНИЦУ». Страницы «Практика Сокобана», «Замок», «Порталы» и «Загадки» выпадают соответственно с Гу, Тенгу, ДМ-300 и Короля дворфов. Страницы «Сокровищница» и «Пещера дракона» можно найти на книжных полках (см. раздел о сокровищнице). Разрушение сферы Зота даёт страницу «Город».\n\nЧтение расходует полный заряд дневника. Время зарядки — 1 000 ходов, делённые на число страниц плюс один; при надетых очках оно сокращается вдвое. Добавление страницы сразу восстанавливает заряд. Дневник получает по единице заряда за ход на этажах ниже глубины 26 и внутри городских зданий. Прочитать его можно там же, кроме этажей с боссами. Команда «ВЕРНУТЬСЯ» переносит обратно к месту чтения. Следующий за вами питомец мешает обоим действиям.\n\nПри каждом посещении комнаты с головоломками перестраиваются, поэтому, если овца застряла, просто выйдите и вернитесь. Призы и богатые сундуки доступны лишь при первом посещении; вынесенные ключи отбираются. _Ловушки стрижки_ отнимают половину текущего здоровья, а если осталось не больше десятой части максимума — убивают. Толкнутая на такую ловушку овца превращается в ковёр. Три этажа охраняют ожившие статуи.
guide.topic_heroes=Сначала доступен только воин. Остальные классы открываются по мере прохождения разных забегов: маг — после прочтения _свитка улучшения_, разбойник — после 10 внезапных атак, охотница — после 10 попаданий метательным оружием, дуэлянт — когда вы возьмёте в руки оружие ближнего боя 2-го ранга или выше, для которого хватает силы, а жрец — после снятия проклятия.\n\n_Сломанная печать_ воина даёт щит при падении здоровья до половины и переносится между доспехами вместе с одним улучшением и глифом. Посох мага вмещает волшебную палочку. _Плащ теней_ разбойника делает его невидимым. Охотница сражается перчатками и _луком духов_: у него бесконечные стрелы, он усиливается вместе с уровнем героини, а высокая трава, через которую она проходит, не приминается. Рапира дуэлянта позволяет делать выпад. Жрец использует заклинания священного фолианта. Каждый класс изначально распознаёт одно зелье и один свиток.\n\nПредела уровня нет. После 30-го уровень требует всё больше опыта, пока не будет достигнут верхний предел стоимости. Каждый уровень даёт 3 очка на таланты и навыки и ещё 2 единицы маны. На глубине 10 Тенгу оставляет маску, позволяющую выбрать подкласс; на глубине 20 Король дворфов оставляет корону, дающую броне особую способность. Покажите корону Крысиному королю на глубине 5 до её использования — он предложит свою способность взамен.\n\nМана восстанавливается сама: за каждый ход на месте — одна сотая максимального запаса, при движении — вдвое меньше, при хорошем питании — ещё в полтора раза быстрее, при истощении — вовсе не восстанавливается. Кольцо магии увеличивает запас маны и скорость её восстановления.\n\nПригнитесь, чтобы получить +4 к скрытности, двигаться вдвое медленнее и не приминать высокую траву. Чтобы выпрямиться, потребуется 2 хода. После полутора суток без сна герой начинает клевать носом и хуже видеть, после трёх суток — падает без сил с наступлением ночи. Отдохните или поспите на кровати в гостинице.
guide.topic_loot=В каждой области из пяти этажей есть 2 _зелья силы_, 3 _свитка улучшения_, 1 магическое перо и 1 патронташ. Всё, что не нашлось на первых трёх этажах, будет на четвёртом. На каждом этаже, кроме боссов, есть порция еды. На 3-м или 4-м этаже каждой области имеется лаборатория с 5 кристаллами энергии. На глубинах 1–3 встречаются один камень интуиции и один катализатор безделушек; на глубинах 6–14 — один камень зачарования. Зачаровывать оружие и наносить глифы можно только на опознанное снаряжение. Оружие 1-го ранга и тканевая броня не появляются среди случайной добычи.\n\nНекоторые сундуки — мимики; золотые кусаются больнее всех. В склепах, бассейнах и жертвенных комнатах можно получить снаряжение из следующей, более глубокой области.\n\nВ лавках на глубинах 6, 11 и 16 всегда продаются анх, камень усиления, броня текущей области, непроклятое оружие ближнего и дальнего боя, зелье исцеления, свитки опознания, снятия проклятия и магической карты, а также один редкий товар: обычно перо, иногда палочка, кольцо или артефакт. Во всех лавках подземелья, города и поселений лежит набор из 5 пустых бутылок. Наполните бутылку водой, стоя в воде или рядом с ней, либо у алхимического котла. Вылив воду рядом или на себя (бутылка остаётся у вас) либо бросив её, можно потушить пламя, промочить находящихся на клетке и оставить лужу на голой земле.\n\nС Гу выпадает бензопила, закрепляющаяся на руке и работающая на росе; в половине случаев — ещё и _Мистер Разрушитель_. Бросьте его, чтобы установить турель. После разрушения её можно перезарядить в колодце превращения или у городского изобретателя в обмен на поганку. Каждый босс оставляет 1–2 ядра мастерской работы.\n\nДействие магического колодца зависит от фазы Луны в момент его обнаружения: полнолуние полностью исцеляет и благословляет анх, новолуние опознаёт предметы и раскрывает этаж, четверть Луны превращает брошенное в колодец. Превращение зелья силы даёт _зелье мощи_ — другого способа его получить нет. В комнате с алтарём награда зависит от дня недели: в День камня — броня, в День ковки — оружие, в День прилива — зелье, в День бури — палочка, в День тени — кольцо, в День урожая — семя, в День света — артефакт.\n\nПоложите на мухоловку предмет, который можно улучшить, свиток или зелье — и она его съест. Улучшенный предмет может вернуться в виде сгустка улучшения (чем выше его уровень, тем вероятнее), свиток или зелье — с шансом 1 из 10, в остальных случаях получится семя. Остальное мухоловка не трогает. Поиск опустошает книжные полки рядом с вами; обысканная полка или сгоревшая, пока у вас было зрение разума, изредка содержит страницу дневника «Сокровищница» или «Пещера дракона».
guide.topic_meta=Это руководство написал погибший исследователь подземелий, а его страницы разбросаны по миру. Страница об этаже лежит этажом ниже, чтобы вы не узнали секреты заранее. Найденная страница остаётся в руководстве и во всех следующих забегах. Страница о боссе появляется при первой встрече с ним; страницы о местах на поверхности, в горах и Глубоких пещерах — при первом посещении. Непрочитанные страницы подсвечены, а поиск находит нужную по любому слову. Глава «Первые шаги» объясняет основы, открывая уроки по мере возникновения подходящих ситуаций. Пока вы впервые не спуститесь в подземелье, записи не появятся.\n\nКаждый забег начинается в городе на поверхности: северные ворота ведут на глубину 1. Области состоят из пяти этажей, на пятом из которых ждёт босс (глубины 5, 10, 15, 20 и 25). _Амулет Йендора_ лежит на глубине 26. Лавки встречаются на глубинах 6, 11 и 16; на 20-й бес откроет лавку, если вы хорошо справились с его заданием в хранилище.\n\nС боссов выпадают страницы для _дневника Отилюка_; подробности — в соответствующей главе.\n\nНачиная с глубины 2, примерно половина этажей получает особенность, о которой сообщают при входе: затопленный, заросший, тёмный, большой, с ловушками, тайный или с пропастями. На тёмном этаже видимость сокращается до пяти восьмых, а чудовища возрождаются в полтора раза быстрее. На большом этаже комнат в полтора раза больше, врагов — на треть больше, а добычи — на два предмета и одну порцию еды больше.\n\nБлиже к поверхности на этаже прячутся 2–3 ловушки, к глубине 20 — до 7. На этаже с ловушками их намного больше, но дополнительные видны. Двери между комнатами по мере спуска всё чаще оказываются скрытыми: к глубине 20 — почти все. Ищите в тупиках и пробелах карты. В каждой области есть 2–3 тайные комнаты. Железный ключ открывает двери только на своём этаже.\n\nПадение в пропасть отнимает не меньше половины текущего здоровья и вызывает кровотечение.
guide.topic_plants=Жизнь растений зависит от времени года. Дикие растения быстрее всего распространяются весной, а зимой медленнее всего; теплолюбивые (огнецвет, солнечник) зимой погибают первыми. Посаженные вами растения не исчезают из-за сезона. Примятая трава отрастает в любое время года, кроме зимы.\n\nКогда вы наступаете на дикое растение, примерно с вероятностью 3 из 10 оно не срабатывает обычным образом, а вырывается из земли и нападает. Рядом со стенами и высокой травой это случается реже, у воды — чаще. Кусты пустофрукта, гнилофрукт и любые посаженные вами растения никогда не нападают. Убитое растение обычно оставляет семя.\n\nСемя можно посадить, съесть (получив его эффект) или натереть им оружие ближнего боя: следующие 5 ударов плюс по одному за каждое улучшение будут накладывать эффект семени. Три одинаковых семени варятся в зелье соответствующего растения; зелье можно сварить из любого семени, кроме семени куста пустофрукта. Из разных семян получается случайное зелье. Три семени гнилофрукта дают зелье силы.\n\nОгнецвет нагревает клетки рядом, ледяная лилия охлаждает их. _Цветок чёрной дыры_ замораживает окружающую воду, превращая её в мост, который огненные растения могут растопить. Наступивший на него герой теряет половину текущего здоровья, переносится в другую часть этажа и получает озноб. Хранитель остаётся на месте и вместо этого получает силы пространства-времени. Чудовище, наступившее на цветок, теряет половину здоровья и проваливается насмерть.\n\nСрезая высокую траву, можно найти росу, семена и ягоды. Цветная капля росы наполняет флягу сразу несколькими каплями. Огонь иссушает растения, мороз — нет. Засохшее растение может оставить семя, чаще всего весной.\n\nНаступив на часовое кипарисовое дерево, вы остановите время вокруг себя; съеденное семя поместит вас в стазис на 4 хода. Чудовище, наступившее на _гипноконоплю_, перейдёт на вашу сторону. Поле на глубине 27 густо заросло солнечником, земляным корнем и звёздоцветом.
guide.topic_quests=Персонажи, которые выдают задания, неуязвимы: помогите им или пройдите мимо. В совместной игре каждый герой выполняет задания отдельно.\n\n_Печальный призрак_ появляется на глубинах 2, 3 или 4 (не позже четвёртой), и на том же этаже обязательно появляется гнолл-лучник. Призрак просит убить зловонную крысу (2), гнолла-трикстера (3) или огромного краба (4). За победу можно выбрать оружие или броню; второй предмет исчезнет.\n\n_Изготовитель палочек_ ждёт на глубине 7, 8 или 9 и награждает волшебными палочками. Если с момента первого попадания на глубину 6 не умер ни один враг, он добавит адамантитовую палочку. Из его заданий сохранить это условие позволяет лишь братская могила; маг получит адамантит в любом случае. Городской кузнец использует его для укрепления палочки. _Кузнец_ на глубине 12, 13 или 14 отправляет в шахту за тёмным золотом. _Амбициозный бес_ на глубине 17, 18 или 19 просит проникнуть в дворфийское хранилище; за успешное выполнение откроет лавку на глубине 20. _Крысиный король_ спит в тайной комнате на глубине 5.\n\n_Поганки_ лежат на глубинах 2 и 11 и в крепости (32). Обменивайте их у изобретателей. Изобретатель на глубине 2 (ещё один есть в городе) переделывает флягу: добавляет либо конденсатор росы из влажного воздуха, либо носик, позволяющий каждой капле восстанавливать одну двадцатую здоровья и маны. Другой городской изобретатель улучшает или перезаряжает «Мистера Разрушителя». Изобретатель в крепости втрое увеличивает вместимость фляги и добавляет недостающее улучшение.\n\nСудьбу _яйца_ определяет то, что происходит с ним на земле: 5 заморозок дают синего дракона, 5 отравлений — фиолетового, 5 ударов молнией — зелёного, 30 поджогов — красного (один поджог создаёт велоципетуха), 10 призывов — фею. Яйцо в рюкзаке отсчитывает ходы: через 2 000 выводится паук, через 10 000 — скорпион. Если разбить яйцо раньше, получите только желток.\n\nОдновременно можно держать лишь одного питомца. Он получает опыт за убийства до уровня 20 и медленно лечится. Питомец рядом с героем следует за ним по лестнице; пока он вас сопровождает, ключи, книги, дневник Отилюка и Палантир не работают. Ударьте питомца три раза — и он уйдёт навсегда. _Свисток_ с последнего этажа головоломок призывает питомца откуда угодно.
guide.topic_weather=Календарь совпадает с настоящим: времена года, фазы Луны и дни недели. Погода проникает по лестницам на глубины с 1-й по 15-ю, ослабевая по мере спуска; начиная с глубины 16 дождя и снега нет. В глубинных областях свой климат: в городе дворфов тепло, в демонических залах жарко, в ледяных залах — мороз.\n\nНа поверхности погода зависит от местности: на холодной границе фронта идут град и мокрый снег, над снежными землями — метели, в пустыне — песчаные бури. Во время грозы под открытым небом каждые 3–8 ходов молния ударяет в пределах 10 клеток от вас, изредка прямо в героя. Деревья притягивают молнии: если дерево в зоне удара, половина разрядов приходится на деревья (но никогда на дерево рядом с вами), и они сгорают до углей. Попавший под молнию теряет от пятой до трети здоровья и оглушается на ход; разряд переходит на соседей, а трава вокруг загорается. Внутри зданий молния не бьёт. На глубинах 1–15 набегают грозовые облака, каждое из которых ударяет хотя бы раз: выходите из-под них.\n\nУ героя есть температура тела. Если она опустится ниже −5 градусов ночью, на ветру, в снегу или после промокания, начнётся _переохлаждение_: герой движется медленнее, хуже уклоняется, получает урон каждые 20 ходов и иногда замерзает на месте. Согрейтесь, загоритесь или встаньте у настенного факела, чтобы избавиться от эффекта. При температуре выше 35 градусов начинается _тепловой удар_: голод нарастает быстрее и наносится урон, усиливающийся с жарой. Выше 45 градусов можно потерять сознание. Вход в городское здание или деревенский дом прекращает оба состояния, как и ночь в гостинице. Тканевая броня греет лучше всего, кожаная — чуть хуже; кольчуга быстро принимает температуру воздуха, пластинчатая броня — медленно. Глиф _Серы_ согревает. Тёплое свойство брони и тёплая рукоять оружия в руках защищают только от холода; охлаждающая броня — от жары, а ветрозащитная уменьшает охлаждение ветром.\n\nЛивень промачивает героя, как и вылитая или брошенная на него бутылка воды. Прочитанный свиток не сработает с вероятностью 3 из 20, огонь на герое погаснет, следующий поджог лишь высушит его, холод нанесёт в полтора раза больше урона, молния — на пятую часть больше. На промокших чудовищ действуют те же правила. В воде намокают сапоги: скрытность уменьшается на 2, а ноги мёрзнут, пока обувь не высохнет. Броня бесшумной поступи не позволяет мокрым сапогам шуметь, а непромокаемая броня на несколько ходов защищает от дождя и реже допускает промокание сапог. Сильный ветер снижает точность дальних атак. Ночью, в метель и туман уменьшается видимость.\n\nНочью чудовища появляются вдвое быстрее (ещё быстрее в новолуние и медленнее в полнолуние), скрытность героя увеличивается на 2 (ещё на 1 в новолуние), а нежить бьёт на четверть сильнее. Нежить и демоны ускоряются в темноте и замедляются на ярком солнце; лунные лучи обжигают их. _Кровавая луна_ удваивает урон нежити, повышает точность врагов против вас на одну пятую и ускоряет их возрождение вчетверо. Зато вы бьёте демонов на четверть сильнее и чаще получаете с них добычу. _Солнечное затмение_ даёт +3 к скрытности и улучшает уклонение, но ухудшает точность; нежить бьёт в полтора раза сильнее, а сокровищницы, созданные в это время, остаются незапертыми и содержат на 100–200 золота больше. _Полярное сияние_ в ясную зимнюю ночь повышает вероятность добычи примерно на три четверти и немного улучшает точность; радуга после дождя повышает шанс добычи на одну пятую. Благословения сияния, радуги и затмения действуют только на поверхности и глубинах 1–15.\n\nЛетом все атаки — ваши и вражеские — примерно на 15% сильнее, зимой — слабее. Осенью больше всего добычи и золота, летом меньше всего. День ковки и День бури усиливают атаки, День прилива ускоряет исцеление, День тени добавляет скрытности, День урожая — добычи.\n\nЗаклинание _«Смена сезона»_ (готовится из свитка магической карты и зелья земляной брони) превращает все растения на этаже в семена. Необработанный солнечный свет от зелья ультрафиолета или солнцеядного растения ослепляет всех в зоне действия. Каждый ход, проведённый в таком свете, даёт противнику равный шанс выжить или умереть.
guide.town_dolyahaven=На городскую площадь выходят шесть зданий. Большинство горожан работают днём и спят в гостинице. Ночью лавки и торговцы закрыты.\n\nПортальные врата на площади всегда активны и не требуют платы за включение. Они переносят к любым активированным вратам лавки, которых вы уже касались; через любые активные врата можно вернуться на площадь. Каждая поездка расходует 150 единиц голода.\n\nВ _лавке_ два продавца: один торгует свитками на одной стороне прилавка, другой — обычными товарами на противоположной. Ассортимент меняется каждые пять дней и пополняется по мере покупок; свиток улучшения, подкормка для растений и боеприпасы есть всегда. Продавцы скупают почти всё. За кусок каменной руды из шахт дают 1 000 золота.\n\n_Церковь:_ раз в день епископ благословляет вас на 100 ходов за пожертвование; на постаменте можно усилить, изменить или добавить зачарования и глифы за алхимическую энергию. _Гадалка_ опознаёт три предмета в неделю за золото. _Библиотека_ продаёт страницы шахтёрского дневника, каждая из которых описывает примерно один этаж; страницы постепенно дорожают. _Кинотеатр_ продаёт билет, дающий удачу на 100 ходов, а в полнолуние — вдвое дольше.\n\n_Гостиница:_ сон на кровати до рассвета избавляет от холода, жары и мокрой обуви и восстанавливает треть здоровья. Горячий обед прислуги утоляет голод и согревает на 30 ходов. Бард бесплатно играет раз в день и уменьшает усталость. Наёмник продаёт по 3 очка навыков за каждого побеждённого босса.\n\nНа улицах: стражник ежедневно размещает одну награду за чудовище чуть глубже самого нижнего этажа, до которого вы дошли. Хорошо одетый горожанин раз в день покупает один улучшенный предмет по двойной цене лавки. Стражник и деревенский житель при первом разговоре дают по _маяку возвращения в город_. Два изобретателя обменивают поганки на услуги: один переделывает флягу, второй улучшает или заряжает «Мистера Разрушителя». Городской кузнец доводит снаряжение до высшего качества с помощью ядер мастерской работы, выплавляет ядра из руды или звёздных осколков и укрепляет предмет адамантитом за 50 единиц тёмного золота. По городу расставлены девять сундуков: в них могут быть яйцо, семена, еда, «Мистер Разрушитель», бомба или немного монет.
guide.hs_overview=Во внешнем мире можно строить почти где угодно: на поверхности, на каждом уровне гор и в каждом слое пещер. Строительство запрещено в подземелье и городе, на лестницах и переходах между слоями, на запечатанных гробницах и деревенских полях, а также на объектах деревень и других примечательных мест мира.\n\nВ городском _магазине общих товаров_ продаются _инструмент строителя_ (150 золота) и _сумка строителя_ (120 золота). Цены городские — они растут по мере достижения более глубоких этажей. Купив оба предмета, вы откроете стойку инструментов: _топор дровосека_ и _каменщицкий молоток_ (по 200), лопату, серп и верёвку по 12 золота за моток. В сумке помещается 30 стопок: строительные материалы, переносные сундуки, инструмент строителя, а также добыча из камня (руды, самоцветы, каменная руда, тёмное золото, камни норн и ядра мастерской работы). При строительстве сначала расходуется содержимое сумки.\n\nРядом с колодцем в каждой деревне есть _плотник_. Он продаёт доски, верёвки, солому, железные крепления и стеклянные панели по двойной стоимости. Любой торговец купит материалы за их обычную цену.\n\nПостроенное сохраняется между сохранениями игры и после отлучек. Установите _камень очага_, чтобы объявить место своим домом. Между домами можно путешествовать, но они привлекают неприятности.
guide.hs_gathering=_Рубка леса:_ нажмите на соседнее дерево с топором в рюкзаке. Топор дровосека срубает дерево за 3 удара, большой топор — за 4, боевой — за 5, обычный — за 6, ручной — за 8. Используется топор в руках, а если его нет — самый быстрый из тех, что при вас. Любой топор относится к оружию дровосека: каждый шаг по его типам уменьшает требуемое число ударов примерно на одну пятую и иногда даёт дополнительное бревно. Каждый удар будит чудовищ в пределах 8 клеток и привлекает их. Дерево падает от вас; находящийся на месте падения теряет треть оставшегося здоровья. Дуб даёт 3–4 дубовых бревна, сосна — 2–3 сосновых и с шансом 3 из 10 смолу. Желудь с дуба и шишка с сосны выпадают с вероятностью 1 из 2. На пне снова вырастет дерево: через 4 весенних или летних дня появится саженец, через 14 — взрослое дерево. По пню можно ходить. Удерживайте нажатие на соседнем пне с топором, чтобы выкорчевать его (ещё одно бревно): после этого он не вырастет. Топором также можно срубить _куст_, затратив вдвое меньше ударов, чем на дерево: останется трава и с вероятностью 1 из 2 — _семя куста_. Деревья и кусты в деревнях рубить нельзя.\n\n_Посадка:_ желудь, шишку или семя куста посадите на соседней клетке травы или голой земли. Появится саженец или молодой куст, растущий весной и летом: за 14 таких дней вырастет дерево, за 6 — куст.\n\n_Камень:_ валун разбивается на 2–3 грубых камня за 3 хода киркой, боевым молотом, молотом мастера или шахтёрским инструментом либо за 2 хода молотком каменщика. Используется самый быстрый инструмент, который вы несёте. Каменные стены при добыче дают 1–2 грубых камня; молоток каменщика разбивает их за 3 хода. Карьерный молот, кирка или лопата разбивают камни и копают за меньшее число ударов, иногда давая дополнительный камень или руду. В пещерах разбитый валун, как и любой удар киркой, может вызвать обвал.\n\n_Лопата:_ вскопайте траву или голую землю в грядку (с вероятностью 1 из 10 найдётся семя), добудьте глину на илистых берегах болот и рек и песок на пляжах и в пустынях (оба материала — только на поверхности) или выкорчуйте пень ради дополнительного бревна.\n\n_Серп_ или боевая коса: срезайте высокую траву ради 1–2 пучков соломы. Иногда выпавших семян оказывается вдвое больше.\n\nРубка деревьев и дробление валунов немного усиливают голод. Олени и бизоны всегда оставляют _шкуру_; козы, йети, верблюды и аллигаторы — с шансом 1 из 2, волки — 1 из 3.
guide.hs_building=Используйте инструмент строителя. Команда «СТРОИТЬ» открывает меню строительства, а «СНЕСТИ», «ПОЧИНИТЬ» и «ОСМОТРЕТЬ» сразу включают панель строительства. Строить можно на видимых клетках в пределах 4 клеток от героя. В совместной игре строит только ведущий.\n\n_Меню_ распределяет сооружения по группам; «Недавние» содержит последние 8 построенных типов. Карточка показывает имеющиеся и необходимые материалы зелёным или красным и сколько таких сооружений вам по средствам. Выберите карточку, чтобы разместить постройку.\n\n_Панель строительства_ заменяет обычную панель инструментов. Зелёный контур означает, что строить можно; янтарный — не хватает материалов; красный — размещение запрещено. Стройте по одной детали, по _линии_ (8 направлений, до 64 клеток) или по _области_ (до 64 клеток: полы, крыши и дорожки заполняют её, стены и ограды образуют пустой внутри периметр). Третье нажатие начинает возведение фигуры, по одной детали за раз. Работа прерывается, если вы увидите врага, получите урон или коснётесь карты. Нажатие за пределами досягаемости заставляет героя подойти.\n\n_Снос_ возвращает половину материалов; перед сносом станка будет запрос подтверждения, а его содержимое выпадет на землю. _Ремонт_ стоит четверть материалов исходной постройки. _Осмотр_ показывает прочность детали и комнату, к которой она относится.\n\n_Стены:_ бревенчатая (2 дубовых бревна, 40 прочности), дощатая (3 доски, 60), каменная (3 грубых камня, 120), кирпичная (2 обожжённых кирпича и 1 глина, 160). Окно стоит стеклянную панель и одну единицу материала соответствующей стены (20 прочности). Дверь требует 4 доски; _дверь с засовом_ — 4 доски и 2 железных крепления, открыть её можете только вы и ваши союзники. Дощатый и каменный пол, а также мощёная тропа стоят по 1 доске или грубому камню. Ограда — 1 доска, калитка — 3 доски и верёвка, частокол — 2 дубовых бревна, дощатый мост — 3 доски; мост ставится на воду.\n\n_Крыши_ (соломенная, дощатая, сланцевая, черепичная, стеклянная) сооружаются над полом и стенами, не дальше 4 клеток от поддерживающей стены. Когда вы входите в здание, крыша над вами становится прозрачной.\n\nБревенчатые и дощатые стены, двери, заборы, калитки, частоколы, соломенные и дощатые крыши горят. Бомбы, кирки, огонь и вламывающиеся чудовища повреждают постройки. Разрушенная деталь оставляет обломки, убираемые командой «Снести». Чтобы ударить киркой собственную постройку, удерживайте нажатие на ней: обычное нажатие её не тронет. Молния, попавшая в крышу, ударит по крыше, а не по вам, и может поджечь солому или доски.\n\n_Факелы:_ во внешнем мире используйте «ПОСТАВИТЬ», чтобы воткнуть факел в землю рядом с героем. Он горит постоянно, освещает территорию и, подобно зажжённому очагу, не даёт диким животным поселиться в пределах 10 клеток. Нажмите на него, чтобы забрать.
guide.hs_stations=_Рабочие станции_ строятся за 10 ходов: верстак (6 досок), камнерезный стол (4 грубых камня, 2 доски), печь (8 грубых камней, 4 глины), очаг (6 обожжённых кирпичей или 8 грубых камней), котелок (2 железных крепления, 2 обожжённых кирпича), стойка для выделки шкур (4 доски, 2 верёвки), кузница (10 обожжённых кирпичей, 4 железных крепления), жернова (4 тёсаных камня). Собственный _алхимический котёл_ стоит 800 золота и 4 обожжённых кирпича, _постамент зачарования_ — 1 500 золота и 4 тёсаных камня по городским ценам. Золото при сносе не возвращается.\n\nНажмите на станцию, чтобы поставить в очередь до 4 заданий по 20 партий в каждом. Все материалы на задание забираются сразу. Станции продолжают работу, пока вас нет.\n\n- Верстак: одно бревно в 3 доски; 3 пучка соломы в верёвку; смола и дубовое бревно либо уголь и доска в 2 факела; 2 пера грифа и доска в 5 дротиков; зуб аллигатора и доска в 2 рыболовных копья.\n- Камнерезный стол: 2 грубых камня в один тёсаный.\n- Печь: 2 глины в 2 обожжённых кирпича; 2 песка в стеклянную панель; бревно в 2 древесных угля. Сгоревшее дерево оставляет в золе 1–2 древесных угля.\n- Стойка для шкур: шкура превращается в кожу за 300 ходов.\n- Кузница: железная руда в 4 железных крепления; 2 железных крепления и 2 доски в топор дровосека или молоток каменщика.\n- Жернова: 2 стебля кукурузной пшеницы в муку.\n- Очаг: мука в хлеб, насыщающий как полторы порции еды; сырое мясо в жареное.\n- Котелок, без алхимической энергии: тушёное мясо, пустофрукт с выбранным семенем и мясной пирог.\n\nПечь, кузница и очаг работают только разожжёнными. Положите в топливный отсек (не больше 20 штук) брёвна, горящие 200 ходов, или древесный уголь, горящий 400 ходов, и зажгите огонь. Горящий очаг нагревает комнату на 16 градусов, кузница — на 8, печь — на 6; дикие животные держатся не ближе 10 клеток от горящего очага.\n\n_Мастерская_ (верстак и ещё одна станция в одной комнате) работает на четверть быстрее.
guide.hs_rooms=_Комната_ — участок пола, со всех сторон закрытый стенами, окнами и дверями (естественные камни пещеры тоже считаются), с хотя бы одной построенной деталью, размером не больше 600 клеток и крышей минимум над 80% площади. В пещере потолком служит скала над головой. Ограды, калитки, частоколы и деревья оставляют проходы. Комната считается _закрытой_, когда все двери закрыты, а прочность каждой построенной стены составляет не меньше половины.\n\n_Кровати_ горят. Соломенная (4 пучка соломы) восстанавливает четверть здоровья, деревянная (6 досок и 2 пучка соломы) — треть, меховая (4 доски, 3 кожи) — половину. Можно спать до следующей части дня или до рассвета, как на походной подстилке; голод растёт вчетверо медленнее. В закрытой комнате никто не обнаружит вас во сне. В других местах вас могут найти, но с вдвое меньшей вероятностью, если комнату согревает огонь или рядом в пределах 2 клеток горит костёр. Меховая кровать согревает, если температура комнаты не ниже −10 градусов, и избавляет от озноба.\n\nПолная ночь на кровати до рассвета даёт эффект _«Хорошо отдохнул»_: до заката вы получаете на 10% больше опыта, а лечение идёт на 10% быстрее. В менее обустроенной комнате эффект длится меньшую часть дня.\n\n_Уют_ оценивается от 0 до 20: по 1 очку за каждые 6 клеток площади (не больше 4), материал стен (брёвна — 1, доски и скала — 2, камень — 3, кирпич — 4), до 4 очков за построенные полы и ковры, по очку за ковёр, полку, статую или украшение (не больше 5) и ещё 3 за огонь, согревающий комнату. Уровни уюта: от 0 — «Голая», от 4 — «Простая», от 8 — «Уютная», от 12 — «Комфортная», от 16 — «Богатая». Уют повышает восстановление от кровати максимум на половину, но в любом случае не больше половины вашего здоровья.\n\n_Виды комнат:_ кровать превращает комнату в спальню. Очаг или котелок — в кухню: мясной пирог, съеденный на кухне или приготовленный там в котелке, сохраняет сытость в полтора раза дольше. Два сундука образуют кладовую, где каждый сундук вмещает на 10 предметов больше. Статуя или алтарь создают святилище, в котором сон до утра даёт благословение на 10% ускоренного лечения на день. Верстак вместе с другой станцией образуют мастерскую; стекло над более чем половиной пола — оранжерею.\n\nКовёр стоит 2 кожи, книжная полка — 4 доски (перед ней с юга должна быть свободная клетка пола), статуя — 4 тёсаных камня.
guide.hs_farming=Подготовьте _грядку_ лопатой или через меню строительства (бесплатно, 2 хода, можно сразу на области), затем посадите любое семя. Из него вырастет _культура_, которая продолжит развиваться и в ваше отсутствие.\n\n_Времена года:_ весной культуры растут на четверть быстрее, осенью — с тремя четвертями обычной скорости, зимой совсем не растут. Под стеклом (стеклянная крыша над растением или _оранжерея_ — комната, где стекло закрывает минимум половину пола) растения круглый год растут с летней скоростью и не замерзают.\n\n_Вода:_ каждая соседняя клетка воды (не больше 4) сокращает цикл роста и вероятность увядания. Колодец в пределах 2 клеток считается за две клетки воды. Влаголюбивые культуры получают двойную пользу. Прокопайте _оросительную канаву_ от воды (бесплатно, 4 хода, по линии) или постройте _колодец_ (8 грубых камней и верёвка).\n\nПосле первого цикла культура созревает. Срежьте её _серпом_ или боевой косой из рюкзака. Куст пустофрукта даёт 1–2 пустофрукта, кукурузная пшеница — 2–3 стебля, абрикосовый куст — абрико, гобвиноград — 2 виноградины, яйцецвет — растительное яйцо, томатный куст — 1–2 сросшихся помидора, а остальные культуры — собственные семена. Некоторые типы лезвий иногда удваивают урожай семян. Если не срезать зрелое растение, каждый следующий цикл оно оставит рядом семя или увянет.\n\n_Заморозки:_ культура под открытым небом гибнет, когда температура её клетки становится ниже −2 градусов. Пока вас нет, любой зимний день убивает открытые посевы, но не растения в комнате, под стеклом или в пещерах.\n\n_Вредители:_ ночью кролики и олени в пределах 12 клеток тянутся к посевам, не защищённым оградой. Подойдите на 5 клеток, чтобы спугнуть их. Пока вас нет, каждую ночь вне зимы они съедают одну неогороженную культуру в пределах 20 клеток от камня очага.\n\n_Подкормка_ даёт четверть оставшегося роста в текущем цикле. _Компостный ящик_ (4 доски) перерабатывает каждые 5 семян, ягод, урожаев или кусков сырого мяса в одну порцию подкормки через 500 ходов после наполнения партии.
guide.hs_horses=Днём на равнинах и лугах пасутся табуны _диких лошадей_, по 2–4 вместе. Дикая лошадь убегает, если подойти ближе чем на 3 клетки; от волков — с расстояния до 8 клеток. Набросить верёвку на неё не получится.\n\n_Приручение:_ оставьте корм на земле в пределах 4 клеток от лошади и отойдите. Она по одному съедает _солому_, _стебель кукурузной пшеницы_, _абрико_ или сырой _пустофрукт_; после каждого кормления позволяет подойти на клетку ближе. После трёх кормлений лошадь перестанет вас бояться. Нажмите на неё и дайте корм с руки: четвёртая порция сделает её вашей. Загнанную в угол или загон лошадь можно кормить с руки сразу. Удар по дикой лошади обнулит весь прогресс кормления.\n\nПрирученная лошадь ждёт там, где вы её оставили, и не бродит сама. Ведите её на _верёвке_ или привяжите к _коновязи_, как любое животное. Нажмите на лошадь, чтобы открыть её меню.\n\n_Седло_ можно изготовить на _стойке для выделки шкур_ (2 шкуры и верёвка) или купить у деревенского _конюха_. В каждой деревне из 5 домов и более он стоит возле колодца и продаёт сёдла, сено и осёдланную лошадь за 200 золота; цена повышается после того, как вы спускаетесь глубже в подземелье.\n\n_Верховая езда:_ нажмите на стоящую рядом осёдланную лошадь, чтобы сесть (удерживайте нажатие для меню), и на самого героя, чтобы спешиться. Ездить можно только на поверхности и в горах, вдвое быстрее: каждая клетка занимает вдвое меньше времени и расходует вдвое меньше голода. Лошадь не прыгает через обрывы. Перед дверью, под крышей или при входе в комнату, пещеру, курган, подземелье либо городское здание вы спешитесь, а лошадь останется ждать. На лодку её взять нельзя: при спуске лодки на воду или посадке вы спешитесь на берегу. При переходе по горным ступеням и каменным переходам на поверхность или в горы лошадь следует за вами.\n\nИз седла нельзя бить в ближнем бою: при попытке такой атаки вы сначала спешитесь, а лошадь отойдёт. Стрелять, метать оружие и выпускать заряды палочек верхом можно. Лошадь принимает на себя треть каждого удара по вам; если у неё закончится здоровье, она умрёт, а герой окажется на земле. Она лечится на 1 единицу каждые 10 ходов и на четверть максимального здоровья при кормлении. В совместной игре приручает, седлает и ездит только ведущий.
guide.hs_homes=_Дом_ — территория в пределах 15 клеток от камня очага на том же слое мира.\n\nУ каждого дома есть _известность_, показывающая, сколько неприятностей он притягивает. Она пересчитывается при появлении дома в поле зрения, на закате и каждые 20 ходов, пока вы здесь. В «ЖУРНАЛЕ» камня очага можно посмотреть составляющие. За каждые 100 золота в сундуках прибавляется 1 очко (содержимое сумки тоже считается), максимум 40; за каждые 2 культуры — 1, максимум 15; за каждые 20 деталей построек — 1, максимум 15. Ночью каждое горящее пламя и каждое окно отапливаемой комнаты добавляют 5, максимум 20. Каменные и кирпичные стены снимают до 25, каждая дверь с засовом — 5 (максимум 10), сплошной частокол — до 15, дозорная башня — 10, сигнальный колокол — 5.\n\n_Осады волков_ происходят зимними ночами в домах среди леса, снежных полей или тундры под открытым небом: каждую четвёртую ночь, а при известности выше 30 — каждую вторую. Стая из 3–5 волков охотится за вами. Если добраться не может, она кружит на расстоянии 4–8 клеток и грызёт заборы и калитки, но не стены, окна, двери или частокол. На рассвете волки уходят.\n\n_Набеги разбойников_ случаются только при известности выше 30: раз в 6 ночей, а рядом с разбойничьим укреплением — раз в 3. Отряд из 3–6 человек идёт к самому богатому сундуку, проламывает наиболее слабую преграду, забирает до 4 самых ценных вещей на каждого и убегает. Убитый разбойник роняет всё украденное. На рассвете или после опустошения сундука они уходят. Налётчики, йети, громилы и все, у кого есть топор или молот, могут проламывать постройки; другие чудовища остаются снаружи.\n\n_В ваше отсутствие_ ничего не происходит сразу: ночные события рассчитываются при возвращении. Первый набег за время отлучки опустошает самый богатый сундук и взламывает ближайшую дверь или калитку; за одну отлучку нельзя потерять больше одного сундука. Ночь осады повреждает 4 крайних забора или калитки. Всё случившееся записывается в журнале.\n\n_Оборона:_ _дозорная башня_ (8 досок, 4 дубовых бревна, 2 верёвки): забравшись на неё, вы видите на 4 клетки дальше и обнаруживаете волков и разбойников в пределах 30 клеток. _Сигнальный колокол_ (2 железных крепления, 2 доски, верёвка) разбудит вас, если враждебное существо войдёт на территорию дома во время сна, а при осаде или набеге прервёт сон раньше срока. Без колокола вы проспите нападение и проснётесь лишь после того, как враги успеют навредить. _Шипованные ловушки_ (2 железных крепления, доска) пронзают и калечат только чудовищ и взводятся снова через 20 ходов. На карте мира дом под нападением мигает красной отметкой.
guide.hs_travel=_Очажный камень_ (10 грубых камней и 2 тёсаных; 200 прочности, не горит) превращает место в дом с названием по ближайшей достопримечательности. Нажмите на камень, чтобы путешествовать, переименовать дом или прочитать журнал. Одновременно можно иметь 3 дома. Снятие камня очага упраздняет дом; меню строительства запросит подтверждение.\n\n_Путевые камни_ стоят возле городской площади и колодцев поселений из 9 домов и более. Коснитесь камня, чтобы настроиться на него до конца забега.\n\nСтоя рядом с очажным или настроенным путевым камнем, можно переместиться к любому своему дому или настроенному камню на любом слое мира. Время не проходит, нападений в пути не бывает. Цена — только _голод_: по половине единицы за клетку расстояния по прямой между камнями, плюс 60 за каждый слой вверх или вниз; максимум 450. Сначала расходуется запас эффекта «Сыт». Если после поездки герой окажется за гранью истощения, она отнимет здоровье; смертельная поездка запрещена. Нельзя путешествовать во время левитации, обездвиживания корнями или при враге в поле зрения. В совместной игре перемещается только ведущий, а отряд следует вместе с ним. Животное на верёвке, стоящее рядом, тоже переносится.\n\nНа карте мира отмечены ваши дома и известные путевые камни. По дорогам, деревенским тропинкам, мощёным дорожкам и мостам ходить на одну десятую быстрее.
guide.hs_catching=_Сачок_ помогает ловить мелкую живность. Используйте «ВЗМАХНУТЬ» по видимому существу в пределах 3 клеток: с присущей его виду вероятностью оно попадёт в _банку_ или ускользнёт. Взмах занимает один ход; махать по пустой клетке нельзя. Мелкие существа сторонятся приближающегося героя, поэтому остановитесь за несколько шагов до них.\n\nНа поверхности сачком ловят _бабочек_ над лугами и равнинами в тихие ясные весенние и летние дни, а _светлячков_ — летними ночами над лугами и лесами и в любую сухую ночь над болотом. В подземелье обитает своя мелкая живность: _мотыльки_ вокруг факелов, _мухи_ в паутине гнезда, _жуки_ и огненные жуки, тараканы, многоножки, чешуйницы, пауки, _улитки_, водомерки, _лягушки_, тритоны и ящерицы. Птицы, зайцы, мыши, рыбы, летучие мыши и огненные саламандры слишком велики или проворны для сачка.\n\n_Осторожная живность:_ на одном участке первые 3 пойманных за день существа ловятся с обычным шансом; четвёртое — с тремя четвертями обычного, пятое — с половиной, шестое — с четвертью. После этого до следующего дня поймать никого нельзя. Участок — квадрат размером 64 на 64 клетки на одном слое мира или целый этаж подземелья.\n\nЖивность в банке служит _наживкой для удочки_, причём каждому виду рыбы нравится своё существо. Команда «ВЫПУСТИТЬ» освобождает добычу.\n\nСачок можно изготовить на _верстаке_ из _доски_ и мотка _верёвки_ или купить у деревенского торговца семенами, иногда — у продавца еды. В совместной игре мелкую живность ловит только ведущий.
guide.hs_fishing=Используйте «ЗАБРОСИТЬ» с _удочкой_ по видимой открытой воде в пределах 4 клеток: реке, озеру, морю, болотному водоёму, пещерной луже или горному озерцу. Рыбачить можно с берега, моста или лодки. Забросьте на соседний _лёд_, чтобы пробить лунку и опустить леску под воду. На крючок клюют только рыбы внешнего мира; в водах основного подземелья рыбачить нельзя.\n\nКаждый заброс расходует одну _наживку_: выбранную командой «НАЖИВКА», а если ничего не выбрано — первую подходящую в рюкзаке. _Дождевые черви_ используются раньше содержимого банок. При обработке травы или голой земли _лопатой_ черви попадаются с вероятностью 3 из 10, а в дождь — 6 из 10. Мелкую живность для банок можно ловить сачком. У каждой рыбы есть любимая наживка.\n\nПосле заброса вы ждёте, наблюдая за _поплавком_. Обычно проходит 4–8 ходов: меньше, если рыба сейчас активно клюёт, больше при неподходящей наживке, времени суток, сезоне или погоде. Ожидание никогда не короче 2 и не дольше 18 ходов. За ход до поклёвки поплавок дёрнется. При поклёвке герой насторожится: используйте «ПОДСЕЧЬ» в течение 3 ходов, иначе рыба уйдёт с наживкой. Сойдёте со своей клетки — леска смотается. Наживка расходуется в любом случае.\n\nСырая рыба немного утоляет голод. Поджарьте её на горящем _очаге_ или любом огне либо сварите в _котелке_ — тогда она намного сытнее и немного лечит. В деревнях у воды есть _рыбаки_: поговорите с работающим рыбаком, чтобы продать всю сырую рыбу за полторы её обычной цены или купить удочку и горсть червей. Удочку можно изготовить на верстаке из доски, мотка верёвки и _железных креплений_. В совместной игре рыбачит только ведущий.
guide.hs_fish=Какая рыба клюнет, зависит от водоёма, наживки, времени суток, сезона и погоды. В пещерном водоёме важны только сама вода и наживка.\n\n_Ручьевая форель:_ реки и горные озерца, изредка озёра. Любит крылатых насекомых, активнее на рассвете и в сумерках, весной и осенью, а также в дождь.\n_Окунь:_ озёра, реки, болота и проруби. Черви и личинки, днём, летом, в хорошую погоду.\n_Щука:_ озёра и болота, иногда реки и проруби. Живые лягушки, тритоны и ящерицы; рассвет и сумерки, осень. Самая сытная добыча.\n_Сом:_ чаще всего болота, затем реки и озёра, изредка пещерные водоёмы. Черви, ночь и сумерки, лето, дождь или гроза.\n_Скумбрия:_ только море. Клюёт на любую наживку, лучше днём и летом.\n_Арктический голец:_ проруби и горные озерца. Черви и светящаяся наживка, зима.\n_Пещерная рыба:_ слепая и бледная, обитает только в водоёмах пещер под миром. Её привлекает светящаяся наживка — светлячок или огненный жук.\n\nИногда на крючок попадается что-нибудь ещё: _старый сапог_ в любом водоёме, кроме пещерного; _промокший кошель_, из которого под ноги высыплются несколько монет, иногда с рунным камнем; или _послание в бутылке_, чаще всего из моря и рек. Прочитайте записку под открытым небом на поверхности: в ней говорится о кладе, зарытом в 40–120 клетках, а место появится на _карте мира_. Далеко в море или высоко в горах подходящего места для рисунка может не быть: прочтите записку в другом месте. Выкопайте _сундук_ лопатой на отмеченной клетке или рядом с ней: внутри золото, кольцо либо палочка, иногда зелье. Мёрзлую землю не вскопать до оттепели.
guide.deep_overview=Под поверхностью мира находятся двенадцать слоёв пещер, и чем глубже, тем просторнее их залы. Вход в пещеры — тёмное отверстие в земле — ведёт на первый слой. Лестницы и провалы позволяют спускаться, а через провал виден пол нижнего слоя. Команда «КОПАТЬ ВНИЗ» с киркой создаёт постоянную шахту, по которой можно подниматься и спускаться. Если кирки нет, её продаст дворф из лагеря шахтёров.\n\nВ Глубоких пещерах нет неба, погоды и времени суток. Герой видит на 8 клеток; свет фонарей, костров, светящихся грибов и кристальных осколков заметен за 16 клеток.\n\nСлои 1–3: летучие мыши, крысы, слизни, змеи, рои и прядильщики. Слои 4–6: гноллы-громилы, шаманы, глиняные големы, взрывающиеся после смерти ископаемые скелеты, кристальные огоньки возле жил и пираньи-альбиносы в глубоких озерцах (их убийства идут в счёт раковины). Слои 7–9: големы, пары громил и грибные прядильщики. Слои 10–12, бездна: пары големов, призраки, отдельные минотавры или серые они, огненные элементали и заблудшие души на горячей земле.\n\nВ камне поблёскивают рудные жилы: медь ближе к поверхности, железо и серебро глубже, золото с 6-го слоя, глубинное серебро — с 9-го. В кристальных жилах попадаются самоцветы, а алмазы — только ниже 3-го слоя. Раз в день городской кузнец выплавляет из одной партии ядро мастерской работы: из 100 меди, 50 железа, 30 серебра, 20 золота или 10 глубинного серебра либо небесного железа.
guide.deep_places=Примечательные места Глубоких пещер появятся на карте, как только вы их увидите.\n\n_Старая шахта_ (слои 1–6): двор и деревянная штольня с рельсами и вагонеткой. Скелеты охраняют тайник с рудой, иногда факелами или киркой. Иногда есть шахта вниз.\n\n_Грибной грот_ (любой слой, чаще в сырых скалах): гигантские светящиеся грибы, грибные стражи и тайник с грибами и семенами.\n\n_Кристальная пещера_ (слои 3–12): кристальные стены и светящиеся осколки. Кристальные огоньки охраняют запас самоцветов и появляются снова раз в день. Начиная с 8-го слоя, здесь спит кристальный страж.\n\n_Лагерь шахтёров_ (слои 2–8): костёр, спальные подстилки и дворф-торговец. Он платит за руду и самоцветы в полтора раза больше городских лавок, продаёт факелы, еду и кирку, если у вас её нет, а также рассказывает о местах неподалёку.\n\n_Озёрное святилище_ (слои 2–10): идол у глубокого озера. Раз в день можно бросить ему золото ради благословения; чем больше пожертвование, тем дольше эффект. В озере живёт пиранья.\n\n_Горящий разлом_ (слои 5–12): полоса лавы через зал, вспыхивающая через ход после предупреждения. Элементали разлома охраняют древнюю дворфийскую кузницу. Она плавит руду так же, как городской кузнец, но на одно ядро нужно 7 глубинного серебра или небесного железа вместо 10. Во всех кузницах вместе можно делать только одну плавку в день.\n\n_Запечатанная гробница_ (слои 8–12): каменное кольцо с железной дверью, саркофагом, сундуком и личом. Ключ находится среди останков скелета неподалёку. Стены нельзя пробить киркой или взрывом.
guide.wet_witch=Среди болотных топей стоит хижина _болотной ведьмы_: маленький домик, окружённый болотной водой, с _деревянным настилом_ от двери до берега, фонарями, горящими всю ночь, и неизменно дымящей трубой. Ведьма торгует по расписанию лавок; ночью она не принимает покупателей, поскольку сама собирает ингредиенты.\n\nНа её полке лежат редкости, которые даёт только болото, по цене на четверть выше магазинной, а также особое зелье: _ведьмино лекарство_ (изгоняет яд, слизь и паразитов и останавливает кровотечение), _болотный фонарь_ (его свет пробивается сквозь туман) и _бальзам для брода_ (болотная вода перестаёт замедлять вас). Ассортимент обновляется каждую неделю.\n\nВедьма _варит зелья_: положите в её котёл любые три _травы_ (семена), _гриба_ или _части живности_ (сырое мясо, шкура, орлиное яйцо, перо грифа, зуб аллигатора, мелкое существо в банке). Травы определяют, какое получится _зелье_. Три одинаковых растения всегда дают соответствующий вид зелья, и ведьма его подпишет. Иначе случайно выбирается одно из растений: чем чаще оно встречается, тем выше шанс. Без трав получится любое случайное зелье. Каждый гриб даёт шанс 1 из 3, что зелье окажется _экзотическим_. Плата ведьмы — 90 золота, на 30 меньше за каждую часть живности.\n\nЗа 250 золота ведьма снимает с предмета _проклятие_. Если показать непроклятый предмет, она скажет об этом бесплатно.
guide.peaks_places=Горные достопримечательности появляются на карте после того, как вы их увидите.\n\n_Хижина отшельника_ (слои 1–5, ниже снежной линии): он продаёт немного товаров, бесплатно опознаёт три предмета в неделю и каждый день рассказывает об одном новом месте неподалёку.\n\n_Орлиное гнездо_ (слои 3–8, край обрыва): в гнезде лежат золото, 2–3 орлиных яйца и в каждом третьем гнезде — самоцвет. Два орла нападают на всех в пределах 3 клеток от гнезда и преследуют вора на расстоянии до 12 клеток.\n\n_Каменная пирамида_ (каждая вершина, слои 2–10): один раз положите в неё камень, чтобы открыть местность в радиусе 40 клеток, получить благословение и узнать свою высоту.\n\n_Горячий источник_ (слои 1–6, среди снегов): купание медленно лечит, снимает озноб и заморозку. После выхода вы будете согреты, но промокнете.\n\n_Замёрзший альпинист_ (слои 4–10): в его останках есть эликсир тепла, зелья чили, еда, золото и иногда кирка. Встаньте рядом, чтобы прочитать страницу его дневника.\n\n_Дозорная башня_ (слои 1–4, горный гребень): с вершины лестницы каждый раз можно осмотреть землю в радиусе 26 клеток. В некоторые недели здесь поселяется йети или двое разбойников.\n\n_Горный приют_ (слои 1–9, рядом с перевалом): неугасающий очаг и тёплая походная подстилка. Отдохните здесь: это также быстро устраняет нехватку дыхания.
guide.sea_sailing=Лодки держатся на мелкой и глубокой поверхностной воде под открытым небом. На домашнем _верстаке_ можно связать _плот_ из четырёх дубовых или сосновых брёвен и двух верёвок; в разожжённой _кузнице_ — построить _парусную лодку_ из двенадцати досок, трёх верёвок, двух железных креплений и двух шкур или кусков кожи. Рыбак в приморской деревне продаёт и то и другое.\n\n_Спуск на воду:_ встаньте возле открытой воды и используйте лодку из рюкзака. Она окажется в соседней клетке воды, по возможности глубокой, а вы сядете на борт. Одновременно на плаву может быть только одна лодка. Если спустить новую, пока прежняя находится в недоступном с берега месте, старая останется на волю моря.\n\n_На борту_ можно двигаться по мелкой и глубокой воде. Чтобы сойти на берег, шагните на соседнюю с лодкой сушу: лодка останется пришвартованной и будет отмечена на карте мира. Нажмите на неё, чтобы подойти и снова сесть; стоя рядом, можно также вытащить её из воды в рюкзак. Если, находясь в лодке, нажать на точку в глубине суши, герой доплывёт до ближайшего места высадки, а затем пойдёт пешком.\n\n_Скорость:_ плот движется со скоростью ходьбы. Парусная лодка в полтора раза быстрее, а если ветер дует под углом не более 60 градусов к курсу — вдвое быстрее.\n\n_Погода:_ дождь или сильный ветер поднимают волнение на море, а буря делает его опасным. Волны время от времени захлёстывают борт и промачивают героя: на глубокой воде чаще, чем на мелководье, а в бурю особенно часто. Каждая волна повреждает связки плота, штормовая — особенно сильно; парусная лодка изнашивается только в бурю. У плота 40 прочности корпуса, у парусной лодки — 120. Предупреждение появится при половине прочности и ещё раз при четверти. Когда прочность кончится, лодка утонет, одну-две доски выбросит на берег, а вы окажетесь в воде. _Ремонтируйте_ лодку в рюкзаке с помощью досок: одна доска восстанавливает 8 прочности плота или 10 — парусной лодки.\n\n_Плавание:_ оказавшись на глубокой воде без лодки, герой плывёт вдвое медленнее и постоянно остаётся мокрым. После 12 ходов море начинает изматывать: каждый второй ход отнимается одна двадцать пятая здоровья, пока вы не доберётесь до мелководья или берега.
guide.surface_barrows=Вынесите Амулет Йендора из подземелья — и приключение продолжится: амулет откроет курганы. При каждом спуске он должен лежать у вас в рюкзаке.\n\nКурган — отдельное подземелье из 4–15 этажей, устроенное по образцу одной из областей основного подземелья, но уходящее глубже. Его уровень обычно выше вдали от города, хотя дальний курган может оказаться простым, а ближний — смертельно опасным. На карте мира указаны название и уровень каждого кургана, а перед входом дверь покажет его уровень и число этажей. Лестница вверх с первого этажа вернёт вас к входу снаружи.\n\nНа самом глубоком этаже нет лестницы вниз. Его страж — чудовище последнего вида для соответствующей области, с тройным запасом здоровья и силой чемпиона. С него выпадают золото и от двух до восьми непроклятых предметов — оружие, броня, палочки, кольца или артефакты. Чем глубже курган, тем больше улучшений у добычи; в самых сильных курганах попадаются ядра мастерской работы. После победы курган считается зачищенным, над ним развевается ваш флаг. Можно вновь пройти по его этажам, но страж больше не появится.\n\nВ курганах нельзя найти ничего, что навсегда повысит характеристики: зелья силы, свитки улучшения и подобные предметы превращаются в золото. Сила чудовищ зависит от уровня кургана и не имеет верхнего предела, а вы продолжаете получать опыт.
guide.surface_temples=Из пустынных дюн выступают верхушки _погребённых храмов_: резные плиты вокруг лестницы, позолоченные _обелиски_ и чёрные _статуи шакалов_. На карте мира названия и уровни храмов показаны золотым цветом.\n\nСпуститься может кто угодно, амулет не нужен. В храме 2–4 коротких этажа, ловушек здесь больше, чем в основном подземелье, а уровень храма растёт с удалением от города. На верхних этажах встречаются _змеи_, _мумии_ и рои мух; в середине — мумии, _скелеты_, летучие мыши, пауки и глиняные големы; внизу — мумии, упыри, _скорпионы_, _монахи_ и големы. Мумия тем сильнее, чем глубже её этаж; её хватка может ослабить героя, а огонь наносит ей в полтора раза больше урона.\n\nНа глубочайшем этаже нет лестницы вниз. Его страж — _статуя_ с тройным запасом здоровья и силой чемпиона, стоящая неподвижно, пока её не ударят. С неё выпадают золото, снаряжение и реликвия храма — _Солнечный скарабей_. Пока вы носите его, удары по нежити на 15% сильнее, а улучшения за алхимическую энергию усиливают этот бонус.\n\nКак и в курганах, в храме не найти постоянных улучшений характеристик. Лестница вверх с верхнего этажа выведет обратно ко входу.
guide.surface_beasts=_Бизоны_ (140 здоровья) днём пасутся на равнинах и лугах стадами по 2–5. Обычно они не обращают на вас внимания, но стоит ударить одного, и все бизоны в пределах 8 клеток бросятся на вас, двигаясь в полтора раза быстрее героя. Бизон на разбеге бьёт в полтора раза сильнее обычного урона в 16–30 и отбрасывает вас на клетку. Стадо успокаивается, если герой погиб, ушёл или пропал из виду на 8 ходов. С каждого выпадают _шкура_ и 2 куска _загадочного мяса_.\n\n_Верблюды_ (80 здоровья) днём бродят по пустыне по одному или группами по 2–3 и отходят, если вы приблизитесь на 2 клетки. Если ударить верблюда, он плюнет с расстояния до 3 клеток: попадание _ошеломляет_ на 3 хода. После этого он убегает. С каждого выпадают 2 куска загадочного мяса и с шансом 1 из 2 — шкура. Бизона или верблюда можно поймать верёвкой, как оленя.\n\n_Грифы_ (45 здоровья) днём летают над пустыней. Они кружат вокруг героя с запасом здоровья ниже 60%, если тот в пределах 8 клеток, и слетаются к сырому мясу на земле, поедая по куску каждые 3 хода. На героя со здоровьем ниже 30% гриф пикирует, нанося 8–16 урона и поднимаясь на клетку между атаками, пока здоровье жертвы не превысит 40%. Если ударить грифа, будучи более здоровым, он улетит. С каждого выпадает 1–2 _пера грифа_.\n\n_Аллигаторы_ (130 здоровья) в любое время суток прячутся в болотных заводях, оставляя над водой только глаза. Подойдите вплотную — и аллигатор выскочит: первый укус никогда не промахивается, наносит в полтора раза больше обычных 20–36 урона и затаскивает героя в воду. На суше он преследует медленно и возвращается в воду, если вы отошли больше чем на 6 клеток, скрылись из виду на 3 хода или его здоровье упало до 30%. С него выпадает загадочное мясо, а с независимым шансом 1 из 2 — шкура и _зуб аллигатора_.\n\n_Щуки_ (60 здоровья) в любое время плавают в открытой воде рек и кусают вошедшего в воду героя на 12–24 урона, атакуя вдвое быстрее него. _Рыболовное копьё_ отнимает щуке не меньше половины здоровья.\n\nНа верстаке из 2 перьев грифа и доски можно сделать 5 _дротиков_, а из зуба аллигатора и доски — 2 рыболовных копья.
guide.surface_nature=В жаркую погоду после половины суток без дождя в лесу или на лугу может начаться _природный пожар_. Его способен вызвать оставленный гореть костёр или дерево, в которое день-два назад ударила молния во время грозы. Огонь медленно распространяется один-два дня, сжигая деревья до _пней_, а траву — до чёрной земли. Стоящие в пламени загораются, дикие животные бегут прочь. Дороги, вода и голая земля останавливают огонь; в деревни и город он никогда не переходит. Дождь тушит пожар.\n\nВылейте или бросьте _бутылку воды_ на горящую клетку, чтобы потушить её и не дать огню охватить её и четыре соседние клетки. Всё, что вы построили, выкопали или вспахали, само по себе не горит. Если пожар приближается к усадьбе, вы получите предупреждение. Проходя мимо, огонь повреждает деревянные детали непосредственно у пламени, но не разрушает их полностью, и губит посевы рядом. Выгоревшая земля зарастает: через 6 дней появляются _саженцы_, через 18 — деревья; сгоревшее дерево иногда оставляет _древесный уголь_.\n\nПосле нескольких дождливых дней весной или осенью реки _разливаются_. На два дня мелкая вода покрывает низкие берега, а затопленные дороги превращаются в _грязь_, где каждый шаг занимает на треть больше времени. Посевы в низинах тонут, а на возвышенности остаются целы. Когда вода отступает, грязь держится на берегах ещё четыре дня, а растения на этой земле следующие двенадцать дней растут в полтора раза быстрее.\n\nВ некоторые новолуния происходит солнечное _затмение_. Старейшины ближайшей деревни предупреждают о нём за день. Примерно на три часа около полудня свет тускнеет до сумерек, появляются звёзды и выходят ночные животные. Пока солнце закрыто, _палочка порчи_ действует в полтора раза сильнее.
guide.surface_festivals=Некоторые события в мире привязаны к временам года.\n\nРаз в сезон в каждой человеческой деревне проходит _праздник_ — с одного утра до следующего; о нём можно услышать в пределах трёх секторов. Возле колодца устанавливают майское дерево, развешивают флажки и бумажные фонари, горящие от заката до рассвета. Днём два _праздничных повара_ продают еду за полцены, а с сумерек жители танцуют вокруг колодца под музыку. _Деревенский чемпион_ приглашает всех на дружеский поединок: поговорите с ним дважды, чтобы начать. Первый, у кого здоровье опустится до трети, сдаётся; серьёзных ранений не будет. Чемпион подстраивается под ваш уровень. Победите — и он подарит хорошее оружие, броню, палочку или кольцо, один раз за праздник.\n\nВесной и осенью стадо из 20–36 _оленей_ за четыре дня пересекает область: весной на север, осенью на юг. За ним идут два-три _волка_, не трогающие вас, пока вы не подойдёте близко или не ударите одного. После темноты они загоняют отставшего оленя. О стаде слышно в пределах трёх секторов, а карта показывает его движение.\n\nИзредка по области восемь дней бродит _великий зверь_ с собственным именем: _огромный волк_ на обычных землях, _старый йети_ в холодных краях, _гигантский скорпион_ в пустыне. У него вчетверо больше здоровья, чем у обычного представителя вида, и более мощные удары. Жители в пределах трёх секторов расскажут, где его видели, а свежие _следы_ помогут найти. За победу вы получите _трофей_, около 250 золота и хорошее оружие, броню, палочку или кольцо.
guide.surface_bounties=В каждой человеческой деревне у колодца под собственным навесом стоит _доска объявлений_. На ней три задания, в маленьком посёлке — два. Новые появляются каждые три дня. Подойдите, чтобы прочитать. Одновременно можно взять не больше пяти заданий. Они записаны в заметках журнала; отказаться можно там или у той же доски.\n\n_Охота_ требует убить нескольких животных или чудовищ рядом с деревней, например _серых волков_ или _крыс-альбиносов_. Засчитываются только убийства в радиусе 128 клеток от деревенского колодца; в совместной игре убийства других героев тоже идут в счёт. _Сбор_ требует местные припасы: _шкуры_, _дубовые_ или сосновые брёвна, грубый камень, солому, глину, песок, медную или _железную руду_ из расположенных ниже пещер, _рыбу_ у рыбаков на мосту или собственным уловом, семена. Для обоих видов задания вернитесь за оплатой к доске: когда награда готова, под ней висит золотая монета.\n\n_Доставка_ выдаёт _посылку_ для _старейшины_ соседней деревни. Днём старейшины сидят у своих домов, а вечером рано уходят спать; любой местный житель подскажет дорогу. За просроченную посылку не заплатят.\n\nЗа объявления платят _золотом_, тем больше, чем глубже вы побывали; примерно к трети наград добавляется зелье, свиток или рунный камень. Каждое выполненное задание повышает репутацию в деревне. После первого вас узнают, после третьего — доверяют, после шестого — почитают. Каждая ступень уменьшает цены местных торговцев ещё на 5%, а _стражники_ становятся дружелюбнее и, заслужив ваше доверие, сообщают, где в последний раз видели зверей из задания.\n\nПока великий зверь бродит не дальше трёх секторов от деревни, на доске также висит задание убить именно его. Убейте зверя где угодно до окончания отведённых дней и получите награду у доски.\n\nВ совместной игре брать задания и получать награды может только ведущий.
guide.topic_rarity=У любого оружия, брони, метательного оружия, волшебных палочек, колец, безделушек и артефактов есть _редкость_: обычная, необычная, редкая, легендарная или экзотическая. Её показывает цвет названия. Легендарное снаряжение появляется начиная с глубины 5, экзотическое — с глубины 15; чем глубже, тем чаще они встречаются. Редкость оружия, брони и палочек повышает часть их собственного урона, защиты или мощности разряда — от одной двадцатой у обычных до трёх десятых у экзотических. Каждый предмет также получает дополнительные свойства: обычные и необычные — по одному, редкие и выше — по два; чем выше редкость, тем сильнее свойства. Свойства колец, безделушек и артефактов помогают, пока предмет надет или находится при вас: урон, точность, уклонение, восстановление, скорость, зарядка, сопротивление вредным эффектам, расход голода или золото. Для оружия и брони у обычного предмета это простой бонус, у необычного — _особенность_, а у редкого и выше есть и то и другое. Простые бонусы выражаются числами: у оружия — точность, урон, скорость атаки или снижение требуемой силы; у брони — блокирование, уклонение или снижение требуемой силы. Особенности зависят от вида предмета. Любое оружие может получить критические попадания или похищение здоровья при ударе, а каждый тип — ещё две собственные особенности. Топоры сильнее бьют по врагам с менее чем половиной здоровья; молоты и кирки — по одной группе существ (нежить, демоны, конструкции, элементали, звери или гуманоиды); музыкальные инструменты и лёгкие клинки сильнее ночью и немного слабее в полдень; цепы и щиты сильнее, когда у героя меньше половины здоровья; посохи и копья — когда на него падает дождь или снег. Луки и дротики точнее стреляют на ветру или дают мясо с убитых животных. Некоторые рукояти согревают руку на холоде. Огнестрельное оружие и лук могут экономить боеприпасы, огнестрельное оружие — перезаряжаться бесплатно, а огнемёт и лазерное ружьё — стрелять дальше. Лёгкая броня может давать тепло на морозе, охлаждение в жару, защиту от дождя, ускорять шаг или делать его тише; тяжёлая — согревать, защищать от ветра, смягчать падения или сопротивляться вредным эффектам. В каталоге перечислены возможные особенности каждого типа. Легендарные и экзотические оружие и броня уже имеют зачарование или глиф, а ещё — _отголосок_: слабый дополнительный эффект зачарования (для брони — глифа), срабатывающий от одной пятой до трёх десятых частоты настоящего, либо до трёх пятых после полной мастерской обработки. Он не занимает ячейку на постаменте и не действует, пока предмет несёт точно такое же обычное зачарование или глиф.\n\nКаждый предмет имеет ещё и _тип_ (гамма, бета или альфа), отмеченный в углу значком. Он определяет силу врождённой особенности предмета: бета удваивает её, альфа утраивает и добавляет новый эффект. Особенности зависят от оружия: ружья и луки сильнее бьют издалека, топоры раскалывают броню и быстрее валят деревья, молоты и кирки ошеломляют и быстрее разбивают камень, музыкальные инструменты превращают каждую четвёртую ноту в аккорд, благословляющий союзников или пугающий врага; кнуты притягивают врагов, косы бьют по области и собирают больше семян, бумеранги пролетают сквозь врагов, тяжёлые метательные предметы можно бросать с усилием, острые лёгкие метательные предметы возвращаются в руку, а лёгкие клинки чувствуют врагов за стенами. _Преобразователь типа_ повышает его: один переводит гамму в бету, два — бету в альфу. Снизить тип нельзя. Преобразователи редко выпадают с убитых врагов и продаются в Подземном рынке.\n\n_Мастерская обработка_ оплачивается ядрами мастерской работы у кузнеца в пещерах или городского кузнеца. Всего пять ступеней, по одному ядру каждая. Первые четыре повышают все бонусные строки на 15% за ступень, пятая, доступная лишь легендарному и экзотическому снаряжению, удваивает их. Полностью обработанное оружие при убийстве лечит героя на одну двадцатую здоровья, а броня даёт столько же щита, но не чаще раза в 10 ходов; палочка при каждом убийстве восстанавливает пятую часть зарядов. С каждого босса выпадает 1–2 ядра. Городской кузнец также выплавляет их из добытой руды или двух звёздных осколков, а верстак разборщика превращает в них редкое и более качественное снаряжение.
guide.topic_rooms=Начиная с глубины 2 или 3 и до 24, каждые 2–3 этажа появляется одна из этих комнат, но никогда не на этаже босса. Пока не встретятся все виды, ни один не повторится.\n\n_Галерея соперника_ (железный ключ): статуя сражается оружием вроде вашего, но на одну ступень редкости выше, и оставляет его после гибели.\n_Закалочная кузница:_ положите снаряжение на наковальню, разожгите угли, поддерживайте белый жар 3 хода, затем охладите в корыте или морозом. Слабейшее бонусное свойство усилится до уровня сильнейшего либо предмет получит бесплатную ступень мастерской обработки. Если держать белый жар больше 14 ходов, свойство сгорит; отголосок пропадает последним. Каждая наковальня используется один раз.\n_Верстак разборщика:_ легендарное или экзотическое снаряжение превращается в ядро мастерской работы, редкое — в треть ядра.\n_Зал наследия_ (железный ключ): три копии вашего снаряжения — обычная альфа, редкая бета и легендарная гамма; взяв одну, вы разрушите две остальные.\n_Замёрзший тайник:_ награда во льду. Растопите его огнём или разбейте — шум может привлечь врагов, а зелье или свиток внутри пострадать.\n_Меха:_ ветер сгоняет газ вдоль галереи и помогает метать оружие по направлению потока.\n_Стихийный замок:_ пробудите три руны теплом, холодом, растениями или водой, чтобы открыть ворота.\n_Оранжерея:_ здесь вечная весна.\n_Гнездо инкубатора:_ яйцо на тёплых углях, высиживающих его.\n_Хранилище противовесов:_ придавите обе плиты телом, бронёй, оружием, сундуком или 300 монетами.\n\nНа любом этаже может встретиться _термальный источник_ (восстанавливает 1 здоровье каждые 4 хода, снимает озноб и заморозку, согревает на 150 ходов после выхода) либо _лагерь путника_. Перед сном на подстилке разожгите костёр: это вдвое уменьшит вероятность нападения во сне и не даст проснуться замёрзшим. В тайной беличьей кладовой лежат семена: осенью 8, в остальное время меньше.\n\nРаз в область на втором, третьем или четвёртом этаже за тайной дверью находится _Подземный рынок_. Ночью торговец продаёт легендарное снаряжение, ядра мастерской работы, преобразователи типа и золотой скелетный ключ, открывающий любой замок, а также скупает товары в полтора раза дороже обычной лавки. Каждая сделка повышает уровень подозрения. При уровне 3 на каждом этаже за вами будет охотиться взыскатель, пока вы его не убьёте. Если атаковать торговца или его стражей, все рынки закроются до конца забега.
