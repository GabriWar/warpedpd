###Warped Pixel Dungeon
guide.basics_alchemy=Um _pote de alquimia_ transforma o que sobra no que falta. O andar 3 ou 4 de cada região tem um laboratório atrás de uma porta trancada, com um pote e 5 _cristais de energia_, e lá podem aparecer páginas do guia de alquimia que ainda faltam para você; esse guia é a aba de alquimia do seu diário. Você também pode construir seu próprio pote num sítio.\n\nNum pote, energize os itens que sobram para obter energia alquímica: 6 por uma poção ou um pergaminho, 3 por uma pedra rúnica, 1 por uma semente. Energizar uma poção ou um pergaminho desconhecido também o identifica. Três sementes viram uma poção, e o pote tira da sua mochila uma garrafa vazia ou uma garrafa de água para ela; uma poção que você bebe devolve a garrafa. A maioria das outras receitas gasta energia.\n\nUm _catalisador mágico_ está em algum lugar dos andares 1 a 3. No pote, ele custa 6 de energia e deixa você escolher um de 4 _acessórios_: equipamentos que te ajudam durante a partida inteira e sobem até +3 no pote, por mais energia.
guide.basics_defeat=A morte encerra a partida. Seu herói entra nos rankings, e tudo o que a partida tinha vai junto, sítios incluídos. O que você aprendeu fica: este guia, o catálogo, o bestiário e seus emblemas passam para todas as partidas seguintes, e um herói futuro pode achar seus _restos mortais_ no andar onde você caiu ou mais fundo, às vezes com um dos seus itens.\n\nUm _ankh_ te traz de volta. Um comum te acorda em outro ponto do mesmo andar com dois itens à sua escolha; o resto espera numa trouxa onde você morreu. Abençoe-o com um odre cheio e ele te salva ali mesmo, com um quarto da sua vida. Toda loja da masmorra vende um.\n\nPegar o _Amuleto de Yendor_ no andar 26 também não encerra a partida: saia do andar 1 com ele e ele abre os túmulos selados espalhados pela superfície. A maioria dos heróis morre muitas vezes antes que um deles vença.
guide.basics_enchanting=Só armas e armaduras identificadas podem ser encantadas. Uma arma comporta até 2 _encantamentos_ e uma armadura até 2 _glifos_, cada um com um nível de 0 a 5; cada nível soma 40% ao efeito e 20% à chance. O número azul no slot do item mostra esses níveis.\n\nUm _pedestal de encantamento_ trabalha o equipamento em troca de energia alquímica. _Teça_ um novo encantamento num espaço livre: 20 de energia mostram 3, e o que você escolher não custa mais nada; se sair sem escolher, eles se perdem. _Fortaleça_ um deles em um nível por 10, 20, 30, 40 e depois 50. _Rerrole_ um do mesmo jeito: 20 mostram 3 que tomariam o lugar dele, no mesmo nível. Ou desencante a peça e receba 20 de energia de volta, mantendo os aprimoramentos. Ali você também energiza os itens que sobram, como num pote. Equipamento amaldiçoado é recusado.\n\nOs pedestais ficam nas bibliotecas da masmorra, cercados de estantes, e na igreja da cidade, e você pode construir um num sítio. Uma _caneta_ arcana, um _Pergaminho do Encantamento_ e uma _Pedra de Encantamento_ também encantam.
guide.basics_examining=Olhe antes de pisar. Aperte a _lupa_ na barra de ferramentas, ou a tecla de examinar, e toque em qualquer quadrado: um monstro, um item, uma planta, uma armadilha ou você mesmo.\n\nA janela de um monstro mostra a vida dele, o que ele faz e a temperatura do quadrado onde está e do corpo dele. Examine a primeira _cobra de esgoto_ que encontrar: ela se esquiva de quase todo golpe, e a janela dela diz como acertá-la. Examinar uma _planta_ ou uma _armadilha_ diz o que ela faz sem que você precise pisar nela.\n\nToque num ícone de _buff_ ao lado do seu retrato, ou na janela de um monstro, para ler o que ele faz e quanto tempo dura. Aperte a lupa duas vezes, ou segure, e você procura em vez de examinar.\n\nCada golpe mostra um cartão sobre quem foi atingido: o dano, um X vermelho quando foi um acerto crítico, e pequenos ícones para o que mais aconteceu: um encantamento na cor dele (vazado quando era o vestígio de uma arma), um ícone prateado quando o tipo da arma fez algo, um dourado quando uma linha do seu equipamento somou ao golpe ou protegeu do vento a mira de um tiro, e o ícone de qualquer efeito que o golpe deixou. Golpes rápidos do mesmo atacante num mesmo inimigo se somam num só cartão. Um erro também mostra um cartão, com um ícone de esquiva, bloqueio ou aparo e o motivo do erro. Quando uma das suas habilidades dispara, o ícone dela entra no cartão de quem foi atingido, e um efeito que chega logo depois do golpe também entra nesse cartão.
guide.basics_farming=No mundo lá fora, você pode cultivar sua própria comida e suas sementes. Faça um _canteiro_ com uma _pá_ ou com o canteiro do menu de construção, e semeie qualquer _semente_ nele. Ela vira uma _plantação_, que continua crescendo enquanto você está longe.\n\nNa primavera as plantações crescem um quarto mais rápido; no outono, a três quartos do ritmo; no inverno, não crescem. Sob vidro, mantêm o ritmo do verão o ano todo. Água ao lado de uma plantação acelera o crescimento. Quando ela estiver madura, corte-a com uma _foice_ ou uma foice de guerra que esteja na mochila: um arbusto de frutinsossa dá frutinsossa, o milhotrigo dá espigas, e a maioria das outras plantações dá a própria semente.\n\nUma plantação ao ar livre morre quando o quadrado dela fica abaixo de -2 graus. À noite, coelhos e cervos atacam qualquer plantação que nenhuma _cerca_ proteja, e o _adubo_ apressa uma plantação. Sítios, Cultivo tem o resto.
guide.basics_hunger=Sua _fome_ sobe 1 ponto a cada 2 turnos. Com 300 você fica faminto, cerca de 600 turnos depois de uma refeição completa; com 450 você está _morrendo de fome_. Morrer de fome impede sua vida de voltar e tira um milésimo da sua vida máxima a cada turno, e uma mente faminta ou exausta vê monstros que não existem. Descansar ou dormir por magia corta o ritmo pela metade, a insolação acelera, um _Anel da Saciedade_ desacelera, e a fome para enquanto um andar de chefe está selado.\n\nUma _ração_ vale 300 pontos, um _salgado_ 450 e uma _ração pequena_ 150. Todo andar que não é de chefe tem uma refeição. Até começar a morrer de fome, você recupera 1 de vida a cada 10 turnos, então comer com a vida cheia desperdiça o que você teria recuperado: coma quando estiver com fome e ferido.\n\nO sono também conta. Depois de um dia e meio acordado você fica _sonolento_ e enxerga menos; depois de três dias, você desmaia no anoitecer seguinte. Descanse, ou durma numa cama, para resolver.
guide.basics_identifying=As cores das poções, as runas dos pergaminhos e as gemas dos anéis são embaralhadas a cada partida: uma poção vermelha pode te curar numa partida e te queimar na seguinte. Use uma e você conhece o tipo dela pelo resto da partida, e o _catálogo_ do seu diário guarda todo tipo que você já identificou.\n\nO equipamento se identifica sozinho conforme você o usa e ganha experiência: uma arma depois de uns 20 golpes, uma armadura depois de uns 10 golpes recebidos, um anel depois de um nível de experiência usando-o. Até lá, os aprimoramentos ficam ocultos, e ele pode estar amaldiçoado e não querer sair.\n\nUm _Pergaminho de Identificação_ revela um item na hora. Uma _Pedra de Intuição_ deixa você adivinhar o que é uma poção, um pergaminho ou um anel desconhecido: se acertar, ele fica conhecido. Um _Pergaminho de Remover Maldição_ tira maldições, e na cidade a _cartomante_ lê três itens por semana por cerca de 50 de ouro cada. Encantar só funciona em equipamento identificado.
guide.basics_intro=Um explorador morto escreveu este guia, e as páginas dele estão espalhadas pelo mundo. A página de um andar fica um andar abaixo do andar que ela descreve, então nunca se adianta a você; as páginas de uma ramificação ficam dentro dela. Nada se escreve até você descer pela primeira vez à masmorra. A partir daí, as páginas sobre o mundo lá em cima se escrevem sozinhas na primeira vez que você chega a um lugar ou faz algo ali, e a página de um chefe se escreve quando a luta começa. Toda página que você encontra fica no guia para todas as partidas seguintes.\n\nEste capítulo, Primeiros Passos, se completa conforme você joga: cada página dele se escreve quando a lição surge pela primeira vez, e o _botão do diário_ pisca. Aperte-o para ler a página que combina com o momento: uma destas páginas básicas, ou uma página que você acabou de achar.\n\nO guia inteiro abre pela _lupa_, a última aba do diário, e pelo diário na tela de título. Páginas não lidas brilham, e a busca acha uma página por qualquer palavra dela. Enquanto você não a ler, esta página espera na praça da cidade, ao lado de onde você chega, e na sala de entrada do andar 1.
guide.basics_levelling=Abates rendem experiência. O nível 1 precisa de 10 para chegar ao nível 2, e cada nível pede 5 a mais que o anterior, até o nível 30. Depois do 30 não há limite: cada nível pede um pouco mais, nunca mais de 500. Um monstro que você já superou dá só um quarto da experiência.\n\nCada nível dá 5 de vida máxima a mais (e te cura na mesma medida), +1 de precisão e de evasão, +2 de mana e 3 pontos para _talentos_ e habilidades. Uma _Poção de Experiência_ vale um nível inteiro de uma vez.\n\nTente subir mais ou menos um nível por andar. Quem desce com pressa fica mais fraco que os monstros que esperam lá embaixo. Toque no seu retrato para ver seu nível, sua experiência e seus atributos. A aba Dano guarda seus últimos 100 golpes causados e sofridos, erros também: abra um para ver cada passo que formou o número.
guide.basics_looting=Cada região de cinco andares tem 2 _Poções da Força_, 3 _Pergaminhos do Aprimoramento_, 1 _caneta_ arcana e 1 _cartucheira_. Conte-os para saber se você vasculhou bem: o que os três primeiros andares não deram está no quarto.\n\nSalas atrás de uma porta trancada ou de um obstáculo costumam ter saque melhor. Cada chave só funciona no andar onde foi achada: uma _chave de ferro_ abre uma porta, uma _chave dourada_ um baú trancado, uma _chave de cristal_ um baú de cristal. A aba de notas do seu diário lista toda chave e todo marco que você encontrou. Alguns baús são _mímicos_.\n\nCada região esconde 2 ou 3 salas secretas. Tópicos, Saque e Tópicos, Salas contam o que mais existe por aí.
guide.basics_magic=Uma _varinha_ nunca erra, e a armadura não segura o disparo dela. Uma varinha começa com 2 cargas (a de míssil mágico, com 3) e ganha 1 a cada aprimoramento, até 10, e as cargas gastas voltam sozinhas: a última leva uns 45 turnos, e as outras voltam mais rápido quanto mais vazia estiver a varinha. A raridade de uma varinha aumenta a força do disparo e a velocidade da recarga.\n\nA magia mirada em você funciona quase do mesmo jeito: o disparo de um monstro tem o dobro da precisão do golpe dele, e a armadura não o segura. Conjuradores como o _gnoll xamã_ e o _anão bruxo_ te atingem de qualquer distância ao longo de uma linha livre, mas ao seu lado lutam corpo a corpo. Corte a linha de visão deles e se aproxime.
guide.basics_positioning=Não lute em campo aberto quando houver um _corredor_ por perto. Pare um quadrado depois da porta, dentro de um corredor, e os monstros têm que vir um de cada vez; na sala, ou na própria porta, três podem te alcançar ao mesmo tempo.\n\n_Grama alta_ bloqueia a visão dos dois lados, mas quem anda por ela a pisoteia, e quem te persegue te vê pela trilha que você abriu. A _caçadora_ a deixa de pé, e você também, enquanto anda _agachado_ (com metade da velocidade): aí a grama continua entre vocês e o perseguidor pode te perder. Espere atrás de grama que ninguém pisoteou para dar um ataque surpresa. Entrar na _água_ apaga o fogo em você. Cair num _abismo_ tira pelo menos metade da sua vida atual, e uma _armadilha_ que você já achou pode ser contornada. Um andar escuro reduz sua visão a cinco oitavos.\n\nConjuradores e arqueiros precisam de uma linha livre até você: ponha uma esquina entre vocês e depois se aproxime.
guide.basics_searching=Portas secretas e armadilhas ocultas parecem parede e chão comuns. Aperte a _lupa_ duas vezes, ou segure, para procurar: leva 2 turnos e um pouco de comida, e mostra toda porta e armadilha oculta ao seu lado. O _ladino_ procura a até 2 quadrados; um talento e um _Anel da Busca_ vão mais longe (o anel só quando você procura de propósito), e a _vidência_ mostra tudo ao seu redor. Uma busca também esvazia as estantes ao seu lado, cada uma com 8% de chance de ter um pergaminho: Identificação, Remover Maldição, Recarga, Transmutação ou Mapeamento Mágico.\n\nVocê também nota coisas só de passar perto. Uma armadilha oculta ao seu lado se revela 4 vezes em 10 nos primeiros andares, caindo para 3 em 10 no andar 25; uma porta oculta, 2 vezes em 10, caindo para nunca no andar 20, e os andares mais fundos escondem mais portas. Procure em becos sem saída e em lacunas do mapa.\n\nNo andar 1, a porta da sala de entrada fica oculta em toda partida até você pegar esta página, que está nessa sala: procure ali para achar a saída.
guide.basics_skills=_Talentos_ e _habilidades_ usam a mesma reserva de pontos: 2 no começo e mais 3 a cada nível. Um ponto de talento custa 1. Um nível de habilidade custa o tier dela, então as habilidades mais fundas de um ramo custam mais, e cada habilidade tem 3 níveis.\n\nOs talentos abrem em tiers: o primeiro na hora, o segundo no nível 6, o terceiro no nível 12 se você tiver uma subclasse, o quarto no nível 20 se sua armadura tiver uma habilidade. A _Máscara do Tengu_ escolhe a subclasse, e a _Coroa do Rei Anão_, a habilidade.\n\nQuase todas as habilidades são ações que custam _mana_, a barra entre sua vida e sua experiência. Você começa com 5 e cada nível soma 2. O _mercenário_ da estalagem vende 3 pontos para cada chefe que você matou. Tópicos, Habilidades tem o resto.
guide.basics_strength=Você começa com 10 de _força_. Cada _Poção da Força_ soma 1: cada região de cinco andares tem 2, e três _sementes de putrifruta_ e uma garrafa fazem uma. Transmutar uma dá uma _Poção do Poder_.\n\nArmas e armaduras pedem força conforme o tier: 10 para tier 1, depois 12, 14, 16 e 18 para tier 5. Os aprimoramentos baixam 1 em +1, +3, +6 e +10, e uma boa rolagem de raridade pode tirar até mais 2.\n\nCada ponto que falta divide a precisão de uma arma por 1,5 e deixa os golpes mais lentos, divide a evasão de uma armadura por 1,5 e deixa seus passos mais lentos, e uma arma pesada demais para você nunca acerta um ataque surpresa. Cada ponto que sobra soma de 0 a 1 de dano a cada golpe de uma arma corpo a corpo ou de arremesso.
guide.basics_surprise=Um monstro é pego de surpresa enquanto não te viu: dormindo, vagando sem ter te notado, depois de te perder de vista, ou enquanto você está _invisível_. A evasão dele cai para 0, então seu golpe não erra; um monstro paralisado também não se esquiva. Uma arma pesada demais para a sua força, ou um _mangual_, nunca acerta de surpresa.\n\nA _cobra de esgoto_ se esquiva de quase todo golpe contra ela. Deixe que ela te siga por uma porta, dê um passo para o lado e golpeie quando ela passar: ela te perdeu de vista, e o golpe acerta.\n\nDez ataques surpresa numa partida desbloqueiam o _ladino_.
guide.basics_upgrades=Um _Pergaminho do Aprimoramento_ aumenta um item em 1, e cada região de cinco andares tem 3. Numa arma ou armadura, ele tira a maldição e, em um terço das vezes, queima um encantamento ou glifo amaldiçoado; uma varinha ou um anel perde a maldição em um terço das vezes. Um aprimoramento nunca remove um encantamento ou glifo bom.\n\nGaste-os no equipamento que você pretende manter: armas e armaduras também pedem menos força conforme sobem. _Varinhas_, _anéis_ e _artefatos_ não pedem força nenhuma, e uma varinha ganha uma carga a cada aprimoramento, até 10.\n\nUma _Pedra de Alteração_, vendida em toda loja da masmorra, não aprimora: ela troca a velocidade de uma arma por dano, ou a evasão de uma armadura por defesa. Uma _forja de têmpera_ eleva a linha de bônus mais fraca de uma peça ao nível da melhor ou dá a ela um passo de obra-prima grátis, e Tópicos, Raridade fala dos núcleos de obra-prima e dos mutadores de tipo.
guide.boss_crabking=O _Rei Caranguejo_ tem 300 de vida, acerta de 20 a 50 ao longo de qualquer linha livre, a qualquer distância, e se move com o dobro da velocidade. Ele nunca vem até você: se teletransporta para outro ponto à vista, e se você o alcança, ele salta para longe depois de alguns ataques. Leve ataques a distância.\n\nO poder dele é a _concha relâmpago_ no alto do salão: 600 de vida, e ela não se move nem se esquiva. Quatro _caranguejos de concha_ (20 de vida) disparam raios de 15 a 30. Enquanto a concha vive, qualquer golpe acima de 5 de dano num caranguejo cai para 1, e o dano fica guardado na concha como carga, que nunca some sozinha. O rei se cura com essa carga, e a concha a gasta te eletrocutando. Golpear a concha do lado dela enquanto ela tem carga dá choque em tudo ao redor.\n\nEntão mate a concha primeiro, de longe; se ela não tiver carga, o corpo a corpo é seguro. A morte dela zera a carga, e aí os caranguejos levam o dano todo. Se precisar golpear um caranguejo antes disso, mantenha cada golpe em 5 de dano ou menos.\n\nEle resiste a veneno, gás tóxico e Mortal.
guide.boss_dm300=O DM-300 tem 300 de vida e acerta de 15 a 25. Com 200 e de novo com 100 de vida, ele se _sobrecarrega_: não pode ser ferido, anda duas vezes mais rápido, cava paredes, e uma torre de energia que não seja a mais próxima de você liga. Destrua essa torre de energia para acabar com a carga. Depois que a segunda torre de energia cai, ele nunca mais se carrega, e os últimos 100 de vida são uma luta direta, com a água e os fios ainda ativos.\n\nQuando não está carregado, ele usa uma de duas habilidades, quase sempre alternando. _Gás tóxico_: saia da nuvem. _Desmoronamento_: se você estiver perto, ele te empurra para trás e marca uma área 7 por 7 à sua volta. Um quadrado ao lado do centro é sempre seguro. As pedras causam dano e aturdem por 3 turnos.\n\nUma _torre_ fica na arena com ele. Ela não luta, mas de vez em quando imprime até 2 robôs quebrados ao lado dela, e golpeá-la chama todos os monstros do andar. Tem 130 de vida e pode ser atacada como qualquer monstro. Quebre-a depois que o DM-300 morrer e ela solta uma chave de crânio e de 3.000 a 6.000 de ouro; quebrada antes, não solta nenhum dos dois.\n\nMantenha-o longe dos _fios expostos_. Sono não o afeta; terror, encanto, vertigem, aleijamento, frio, congelamento, raízes e lentidão duram metade do tempo.\n\nEle solta de 2 a 4 pedaços de metal, a folha dos portais sokoban e, se você nunca pegou um, o _Diário de Otiluke_. Um Transmissor de Lloyd que você carrega ganha um aprimoramento grátis. Mate-o sem levar choque de uma torre de energia nem golpe da água eletrificada, e sem ser atacado enquanto ele está carregado, para ganhar o emblema de desafio do chefe.
guide.boss_dwarfking=O Rei dos Anões tem 300 de vida e luta em três fases. Ele não pode morrer nas duas primeiras.\n\n_Fase 1_: ele acerta de 15 a 25 e invoca servos nos quatro pedestais: quase sempre ghouls, e a cada quatro um monge ou um bruxo. Ele pode ligar a vida a um servo, que passa a dividir o dano que você causa, ou recuar enquanto teletransporta um servo para o seu lado. O dano que você causa nele acelera as invocações. Mate os servos primeiro, mas ignore-os quando ele estiver perto de 50 de vida: com 50 ele vai para o trono e todos os servos morrem.\n\n_Fase 2_: uma blindagem de 300 pontos que nada quebra; pare de bater nele. Agora, cada servo invocado tira 25 da blindagem ao morrer, então doze abates encerram a fase. A última leva traz um bruxo, um monge e dois ghouls de uma vez. Ghouls reanimam um ao outro, e uma reanimação não conta, então mate-os separados. Uma invocação que termina enquanto você está no pedestal dela aparece ao seu lado; só se todos os quadrados em volta estiverem bloqueados você sofre de 20 a 40 de dano e a blindagem perde 25.\n\n_Fase 3_: ele invoca sem parar, e seu dano chega a ele ao longo dos turnos seguintes, em vez de na hora. Continue batendo; nada se perde.\n\nEle solta a _Coroa do Rei Anão_ (transforma sua armadura em armadura de classe com uma habilidade especial), a folha dos enigmas sokoban e, se você nunca pegou um, o Diário de Otiluke. Um Transmissor de Lloyd que você carrega ganha um nível, e a degradação do bruxo no seu equipamento acaba.
guide.boss_dwarftomb=A tumba fica dois quadrados ao norte do trono e não sofre dano enquanto o Rei dos Anões vive.\n\nQuando ele morre, um _lich anão_ sai de cada lado livre dela, até quatro. Cada um tem 100 de vida e dispara raios de 20 a 32, mas só à distância: ao seu lado, um lich não consegue atacar e tenta se afastar. O andar destranca ao mesmo tempo, então você pode sair.\n\nQuebrar a tumba mata todos os liches e espectros do andar. Ela nunca ataca e nenhum efeito pega nela, mas tem 600 de vida e até 18 de armadura.\n\nDentro: de 4.900 a 9.999 de ouro, uma _chave de crânio_ e um _kit de armadura_, que transforma qualquer armadura em armadura de classe, como a coroa.
guide.boss_goo=O _Goo_ tem 100 de vida e recupera 1 a cada turno em que fica na água. Lute com ele em terreno seco.\n\nQuando ele te vê pela primeira vez, até quatro _gosmas venenosas_ escorrem ao lado dele. Cada uma tem 50 de vida, se move com o dobro da velocidade e te envenena a cada golpe, depois foge deixando teias. Elas se curam na água, e enquanto o Goo vive, cada golpe as divide; mate o Goo primeiro e elas param de se dividir. Cada uma das quatro primeiras solta uma Poção da Recuperação.\n\nQuando o Goo incha e grita, está carregando uma pancada: dois turnos depois ele atinge até 2 quadrados de distância, em linha livre, com dano triplo. Saia do alcance ou fique atrás de uma parede ou pilar; se ele tiver que se mover, a carga se perde.\n\nAbaixo de metade da vida, ele bate mais forte, se esquiva mais e carrega com muito mais frequência. Guarde poções e pergaminhos para essa metade; se ele se curar acima da metade, se acalma. Um terço dos golpes dele deixa _muco_ em você, que fere a cada turno até você entrar na água.\n\nEnquanto o andar está selado, sua regeneração para se você passar muito tempo sem ferir o Goo, e cada ponto que ele cura na água encurta esse tempo.\n\nEle solta a _chave desgastada_, de 2 a 4 bolhas de gosma, a folha de treino do sokoban para o Diário de Otiluke, metade das vezes uma torreta Sr. Destructo, e a _mão-motosserra_: uma arma tier 5 amaldiçoada que não sai depois de equipada. Ligada, cada golpe queima orvalho do seu odre para dar cortes extras.
guide.boss_otiluke=Não lute com ele sem uma _arma relíquia_. O golem tem 7.000 de vida, e todo golpe, de varinhas e mascotes também, causa só de 1 a um quarto do dano, exceto os golpes de uma relíquia. Forje uma relíquia no altar da cidade antes.\n\nEle fica parado até ser atingido, então escolha o seu terreno antes do primeiro golpe: a pelo menos 5 quadrados de toda torre eletrificada. Cada golpe que você acerta pode acordar um guardião.\n\nO corpo a corpo dele acerta de 250 a 350 e quase nunca erra. À distância, ele dispara raios de 100 a 160 que passam entre os guardiões, e metade deles te enfraquece. Ele é imune a terror, encanto, sono, vertigem, fogo e gás tóxico, e resiste a veneno.\n\nQuando ele morre, o andar destranca, as torres param e ele costuma soltar uma poção. O _Palantír_ te leva ao andar 99 e de volta para onde você o usou; não o use antes de estar pronto para Zot. O próprio Otiluke só volta depois que Zot morre.
guide.boss_shadowyog=Dez Yog-Dzewas Sombrios. Cada um tem 50 de vida por nível do herói (no mínimo 1.000), acerta de 45 a 125, se move com o dobro da velocidade e raramente erra. Cada um ganha 1 de armadura para cada criatura no andar, então esvazie a caverna antes e evite as armadilhas de invocação ocultas.\n\nEles começam dormindo. Ataque de fora da vista deles, segure a porta da sala e lute contra um de cada vez.\n\nAbaixo de um oitavo da vida, cada golpe tem uma chance em duas de fazê-lo se teletransportar para longe; se o andar tiver poucos monstros, ratos espectrais surgem onde ele aparece. Cada golpe num Yog-Dzewa Sombrio também rearma até quatro armadilhas usadas à sua vista como armadilhas de invocação ocultas. Acabe com cada um rápido.\n\nEles ignoram terror, cólera, encanto, sono, fogo, gás tóxico, vertigem e Mortal, e não podem ser atraídos. Raízes, aleijamento, lentidão, frio e Sentença ainda funcionam.\n\nSó o último solta o _Orbe de Zot_, uma vez por partida: jogue-o para montar uma torreta, ou quebre-o para ganhar a folha da cidade do Diário de Otiluke. A morte dele mata todos os ratos e onis que restam, e a sanchikarah pode te levar para casa.
guide.boss_skeletonking=O _Rei Esqueleto_ (550 de vida, acerta de 20 a 40, armadura até 25) luta com duas mãos gigantes (200 de vida cada, acertam de 10 a 30). Os três voam, então o terreno nunca os atrasa.\n\nCada golpe tem uma chance em duas de te amaldiçoar: o rei te enfraquece, a mão flamejante te incendeia, a mão enraizadora te enraíza por 20 turnos. Então quem te amaldiçoou voa para longe e só volta quando a maldição passa. Cure-se rápido e eles voltam até você, para o chão que você escolheu. Não persiga três voadores pelo mato.\n\nOrdem de abate: mão enraizadora (enraizado, você não escapa das outras duas), mão flamejante, rei.\n\nOs três são imunes a fogo, mas o mato queima: use a chama líquida da câmara para limpá-lo. A água da câmara apaga o seu próprio fogo. Golpes pesados atravessam a armadura do rei melhor que golpes rápidos e leves.
guide.boss_tengu=O Tengu tem 200 de vida e ataca à distância em qualquer linha livre. Nenhum golpe tira mais de 25 de vida dele, então golpes enormes são desperdício. A mira dele cai pela metade contra quem está ao lado dele.\n\n_Fase 1, a cela dele:_ a cada 25 de vida que perde, ele salta para outro ponto e espalha armadilhas de dardo venenoso ocultas pela cela, mais delas conforme enfraquece. Cada armadilha pisca uma vez quando é armada e não pode ser achada com busca, então lembre onde viu as piscadas. Ataques à distância deixam você ficar nos quadrados que sabe que são seguros; correr atrás dele faz você pisar em armadilhas.\n\nCom metade da vida, ele some e a prisão se reconstrói. Nada ataca você nessa pausa: cure-se e depois volte pelo corredor para começar a fase 2. Itens que você deixou na cela voltam depois da luta.\n\n_Fase 2, uma arena oval sem cobertura:_ a cada 25 de vida que perde, ele salta para longe e usa mais dois ou três truques. O primeiro é sempre uma bomba que explode 3 turnos depois; saia da área da explosão. O segundo é sempre um poste elétrico que dá choque nos quadrados em volta até o fim da luta. Ele também sopra fogo em cone na sua direção: dê um passo para o lado e saia dele. Mate-o rápido.\n\nEnquanto o andar estiver selado, você para de regenerar se parar de causar dano a ele. Raízes, cegueira e terror não o afetam. Cópias espelhadas absorvem os ataques normais dele.
guide.boss_thiefking=O _Rei dos Ladrões_ (500 de vida) voa e acerta de 20 a 70 em qualquer linha livre, a qualquer distância. Quadrados de abismo não bloqueiam os tiros dele; só paredes bloqueiam. Chegue pelo lado, nunca por uma faixa aberta.\n\nDois _reis bandidos_ o escoltam: 200 de vida, velocidade dobrada, voam. Cada golpe deles põe _Contagem Regressiva_ em você se você ainda não estiver com ela, e depois eles voam para longe. Após 6 turnos, a Contagem Regressiva tira um quarto da sua vida máxima, e cada rei bandido vivo recupera o equivalente a um oitavo da sua vida máxima. Prenda-os com raízes ou lute num canto onde só um alcance você. Aqui, reis bandidos nunca derrubam o garfolher.\n\nRaios causam metade do dano nele, e empurrá-lo para os abismos não adianta, porque ele voa. Se o salão ficar cheio, recue para a porta de entrada em vez de lutar perto dos buracos.
guide.boss_yog=1.000 de vida. Yog nunca se move e não pode ser ferido enquanto houver um punho vivo. A cada 300 de dano surge um punho e a arena escurece: três punhos ao todo, um de cada par (flamejante ou de terra, pútrido ou enferrujado, brilhante ou negro). Depois que o terceiro morre, ele enche a arena de servos e age bem mais rápido nos últimos 100 de vida.\n\n_Feixes_: os quadrados-alvo se acendem, depois os feixes atravessam tudo e nunca erram (20 a 30 cada). Saia dos quadrados acesos. Ele dispara mais feixes conforme enfraquece, mas sempre deixa livre um quadrado ao seu lado.\n\n_Invocações_: um estripador para cada forja demoníaca ainda viva, larvas para o resto.\n\n_Punhos_ não podem ser feridos a até 4 quadrados de Yog, então atraia cada um para longe primeiro.\n_Flamejante_: imune a gelo; ficar na água impede o fogo dele, mas ele evapora a água.\n_De terra_: cada quadrado de grama alta em volta dele corta um sexto do seu dano; queime a grama.\n_Pútrido_: se cura na água, e seus golpes viram sangramento, então só o seu maior golpe conta.\n_Enferrujado_: não entra em corredores; seu dano chega atrasado, mas chega inteiro.\n_Brilhante_: com metade da vida, ele cega você e se teleporta para longe.\n_Negro_: com metade da vida, ele apaga sua luz e se teleporta para longe; leve uma tocha de reserva.
guide.boss_zot=10.000 de vida e armadura de até 100. Cada golpe causa nele só de 1 a um quarto do dano, exceto os golpes de uma arma relíquia e a _Ira de Júpiter_. Ele regenera de 50 a 100 de vida por turno, só 1 enquanto você usa o _amuleto de autopoção_.\n\nEle se move com velocidade dobrada e acerta de 300 a 400, corpo a corpo ou em qualquer linha reta livre. Para se aproximar, ele se teleporta para um quadrado que você vê, e depois de 5 ataques ao seu lado se teleporta de novo. Cada teleporte deixa uma _fase de Zot_, até 7 (11 com uma caçadora): 1.000 de vida, o mesmo corte de dano, dois golpes de 115 a 160 por turno ou um raio de 80 a 160 (50% a mais na água). Uma fase em cada três derruba um pergaminho.\n\nNão o paralise, e cuidado, porque a explosão da Ira pode paralisar: a cada turno paralisado, ele recupera 200 de vida e invoca um _olho mágico_ ao seu lado (400 de vida, voa, feixe de 50 a 100). Uma caçadora também invoca um olho a cada golpe que acerta.\n\nEle é imune a fogo, gás, sono, terror, cólera, encanto, vertigem e armas do vampirismo, e resiste a veneno. Corredores limitam onde ele pode aparecer. A morte dele mata todas as fases e olhos.
guide.caves_f1=_Morcegos vampiros_ são rápidos, voam e se curam a cada mordida que acertam. Lute com eles numa porta ou deixe-os lentos. Às vezes derrubam uma _Poção da Recuperação_; depois de sete, param de derrubar.\n\n_Gnolls brutos_ não morrem com 0 de vida. Eles entram em fúria com uma blindagem de cerca de metade da vida deles e batem duas vezes mais forte. A blindagem cai 4 por turno, então recuar por seis turnos acaba com eles. Um bruto que morre caindo num abismo pula a fúria. Terror não funciona neles. O raro bruto encouraçado fica em fúria por 60 turnos, mas sempre derruba uma armadura.\n\n_Gnolls xamãs_ amaldiçoam você à distância: o vermelho enfraquece você, o azul deixa você vulnerável, o roxo (o mais raro) enfeitiça sua precisão e evasão. São os monstros mais frágeis daqui; quebre a linha de visão e chegue perto.\n\nEste andar tem a _loja_ da região e um cogumelo chapéu-de-sapo para os engenhoqueiros. O ferreiro aparece a partir do andar 12.
guide.caves_f2=O _troll ferreiro_ fica no andar 12 (1 em 3), 13 (1 em 2) ou 14 (sempre). A sala dele tem dois itens grátis em pedestais e a escada para a mina dele. Ele dá a você uma _Picareta_ e pede _ouro escuro_ da mina. A mina só deixa você entrar uma vez: sair encerra o serviço, então desça com comida, cura e espaço na mochila. Ele não pode ser ferido. Leve a ele as três partes da _SanChikarah_ e ele as forja numa só.\n\nA Picareta exige força de tier 3 e causa dano de tier 2. A habilidade da duelista com ela nunca erra, causa dano dobrado em monstros inorgânicos e em caranguejos, aranhas, escorpiões, abelhas e enxames, e deixa o alvo vulnerável.\n\n_Aranhas da caverna_ começam a aparecer aqui. Elas tecem teia no quadrado para onde você está indo, então mude de direção em vez de correr em linha reta. Uma mordida pode envenenar você; aí a aranha recua e lança teia em você à distância.\n\nRaramente, um _robô quebrado_ aparece aqui mais cedo (veja o andar 13).
guide.caves_f3=Chega o _DM-200_: 80 de vida, grande demais para entrar em corredores ou portas. Quando não consegue alcançar você, ele solta gás tóxico na sua direção. Lute com ele em área aberta e fique fora do gás. O primeiro drop dele tem 1 chance em 5 de ser uma arma ou armadura do nível da Metrópole; cada drop seguinte tem um terço da chance do anterior.\n\nO _robô quebrado_ dispara a cada três turnos um feixe que acerta tudo na linha, monstros também. Depois que vê você, ele tem 1 chance em 50 por turno de explodir e ferir tudo ao lado dele, então não fique adjacente. Ele dá 13 de experiência, o máximo nas Cavernas, e muitas vezes derruba um Pergaminho da Recarga.\n\nO raro _DM-201_ nunca se move. Acerte-o à distância e ele joga gás cáustico em você; acerte só de um quadrado adjacente e ele nunca joga. Ele derruba um pedaço de metal, a menos que você esteja acima do nível 19.\n\nO laboratório fica neste andar metade das vezes; nas outras, no andar 14. Se o ferreiro não estava no andar 12, pode estar aqui.
guide.caves_f4=O último andar comum e o mais cheio: de 7 a 9 monstros, dois DM-200 no meio e _golens de argila_ (40 de vida, armadura pesada, ataques lentos, imunes a terror e sono). Raramente um ghoul sobe da Metrópole; sozinho, ele não consegue reviver.\n\nO troll ferreiro está aqui se você ainda não o encontrou, e o laboratório também, se o andar 13 não teve um. Qualquer Poção da Força, Pergaminho do Aprimoramento ou caneta arcana que a região ainda deve a você aparece aqui. A escada para o _templo_ também fica neste andar.\n\nSe ainda falta a _Chave Antiga das Cavernas_, este andar tem uma _piranha gigante_ que a derruba (a primeira piranha que você mata depois de chegar ao andar 11 sempre derruba). Se a piranha surgiu em terra seca, ela já morreu, e a chave está onde ela caiu.\n\nSe pretende comprar o aprimoramento do ferreiro, faça isso antes de ler seus próprios pergaminhos naquele item: ele só aprimora itens abaixo de +2.
guide.caves_f5=Nada ataca até você chegar a três quadrados de uma torre de energia; aí a arena se fecha. Use esse tempo para aprender o mapa.\n\nOs _fios expostos_: quando o DM-300 pisa num deles, ganha uma blindagem de 30 mais um décimo da vida que perdeu, então mantenha-o longe deles. A água: enquanto uma torre estiver ativa, toda a água e os fios ficam eletrificados e ferem tudo o que não voa, de 6 a 12 por turno. Depois que a segunda torre morre, eles continuam eletrificados até o fim da luta.\n\nUma _torre de energia_ ativa (50 de vida) dá choque em dois quadrados adjacentes opostos, de 10 a 20, e gira um passo no sentido horário a cada turno; fique onde ela não está apontando. Qualquer golpe acima de 14 de dano é bem reduzido, então use ataques rápidos e leves. Toda torre tem um caminho seco até ela, e as faíscas flutuantes vão na direção da torre ativa.\n\nQuando o DM-300 morre, o portão se abre e a escada leva à Metrópole.
guide.caves_mine=Quase toda a mina é rocha sólida: cave com a Picareta. Um quadrado de rocha custa 4 de fome; cristal, pedregulhos e ouro custam 1. A mina tem um item de comida, dois na versão dos gnolls.\n\nVocê está aqui pelo _ouro escuro_. Cada pedaço vale 50 de favor, até 40 pedaços (2.000). A mina tem de 45 a 47, então pare em 40. Duas salas secretas atrás de portas ocultas têm 4 ou 5 cada. Matar o chefe da mina soma 1.000 de favor. Sair da mina encerra o serviço.\n\nA mina vem em um de três tipos:\n_Gnolls_: cada sala grande tem um gnoll sapador e um guarda gnoll. O guarda recebe um quarto do seu dano enquanto o sapador dele estiver vivo, então mate o sapador primeiro. A lança do guarda bate mais forte à distância; lute ao lado dele. O desmoronamento do sapador deixa aturdido tudo o que atinge, um guarda por 10 turnos, então faça o guarda ser pego por ele. Ao lado de uma barricada, o sapador joga pedregulhos em vez disso. O chefe, o gnoll geomante, só pode ser ferido pela Picareta enquanto a armadura de pedra dele resiste, e não pode ser ferido de jeito nenhum enquanto um sapador o serve.\n_Cristal_: guardiões de cristal dormem nas salas grandes; não os acorde. Eles não morrem, só são nocauteados, e se movem a um quarto da velocidade em passagens estreitas. O chefe, o pináculo de cristal, só pode ser ferido pela Picareta. Os espinhos dele aleijam os guardiões, e quando ele se estilhaça, todo guardião que ele consegue ver se estilhaça também.\n_Fungos_: sentinelas fúngicas não se movem, mas envenenam você à distância assim que veem você (200 de vida cada). Aranhas fúngicas recebem menos dano perto de grama alta. O chefe, o núcleo fúngico (300 de vida), nunca se move nem ataca.\n\nDe volta lá em cima, o favor compra: a Picareta de volta (250, grátis se você juntou 2.500), reforjar dois itens do mesmo tipo em um item melhor (500, depois mais 1.000 a cada vez), endurecer, para que aprimoramentos tenham menos chance de tirar um encantamento (500, mesmo aumento), aprimorar um item abaixo de +2 (1.000, mesmo aumento) ou forjar: escolha um entre duas armas, uma arma de arremesso e uma armadura, às vezes com encantamento secreto (2.000). O favor que sobrar vira ouro.
guide.caves_overview=Andares 11 a 15, uma mina anã abandonada. Os veios de minério nas paredes são decoração; o único minério que você cava aqui é o ouro escuro, na _Mina do Ferreiro_, que se abre em um dos andares entre o 12 e o 14.\n\nOs monstros daqui usam armadura pesada e batem forte. Chegue com equipamento aprimorado.\n\nCada andar é maior que o de cima: o andar 11 é o menor e tem a _loja_ da região, a última antes do andar 16; o andar 14 é o maior e tem de 7 a 9 monstros ao mesmo tempo. Onde duas cavernas se encontram, o chão muitas vezes cede num abismo. Um monstro que cai nele com mais de quatro quintos da vida chega vivo ao andar de baixo, aleijado e sangrando; um mais fraco morre, dá metade da experiência, e o drop dele cai no andar de baixo.\n\nChuva e neve ainda chegam às Cavernas; nenhum andar abaixo do 15 tem clima. Em noites de lua cheia, espectros vermelhos surgem a partir do anoitecer, mais depois que escurece. As armadilhas mais comuns são de fogo, dardo venenoso, geada, tempestade e corrosão; uma rara armadilha de queda faz você cair um andar.
guide.city_f1=A loja vende armadura de escamas, uma arma e uma arma de arremesso de tier 4, dardos embebidos, bolsas, um baú portátil dourado, uma _Pedra de Alteração_, um _Ankh_, uma Poção da Cura e Pergaminhos de Identificação, de Remover Maldição e de Mapeamento Mágico.\n\n_Ghouls_ andam em pares. Um ghoul morto enquanto o parceiro pode vê-lo ou está a até 4 quadrados desaba e se levanta 5 turnos depois com um décimo da vida (10, depois 15 turnos, nas quedas seguintes). Mate os dois juntos, separe-os, ou jogue um ferido num abismo.\n\n_Elementais_ voam e disparam fogo, gelo ou choque. Gelo num elemental de fogo, ou fogo num de gelo, tira metade da vida dele de uma vez. O raro elemental caótico sempre derruba um Pergaminho de Transmutação.\n\nOs disparos dos _bruxos_ degradam seu equipamento por um tempo; quebre a linha de visão deles. 5 em 6 derrubam uma poção.\n\n_Engenhoqueiros loucos_ atiram de longe, recuam quando você se aproxima e sempre derrubam um Pergaminho da Infusão Mágica. Golens de argila e aranhas de metal completam o andar.
guide.city_f2=_Monges_ golpeiam duas vezes por turno, e 1 golpe em 12 derruba sua arma no chão (uma amaldiçoada fica na mão). Um monge que está caçando você acumula foco e apara seu próximo ataque, por mais preciso que seja. Gaste a aparada com um ataque barato e depois bata forte; varinhas e fogo a ignoram. Kitar faz ele recuperar o foco mais rápido. O raro monge sênior bate 50% mais forte e pode deixar você aturdido por um turno.\n\nEste é o andar que gera mais _elementais_. Na água, um elemental de gelo sempre congela você e o arco de um elemental elétrico alcança você, enquanto um elemental de fogo não consegue pôr fogo em você.\n\nO _Imp Ambicioso_ aparece aqui em 1 de cada 3 partidas. O serviço dele é um assalto ao cofre anão embaixo da sala dele: veja Antigo Cofre Anão.
guide.city_f3=Chegam os _golens_: 120 de vida, golpes de 20 a 60, imunes a terror, sono e cólera, e raramente se esquivam. São grandes demais para corredores de um quadrado, então lute de dentro de um. Um golem que não alcança você puxa você até ele ou se teleporta; em área aberta, você não vai conseguir fugir de um. O primeiro tem 1 chance em 5 de derrubar armadura ou arma do nível dos Salões, e cada drop seguinte tem um terço da chance do anterior.\n\n_Minotauros_ (120 de vida) chifram você em um terço dos golpes, deixando você sangrando e aleijado, e depois recuam até o sangramento parar.\n\nDe vez em quando um _lich anão_ surge no 18 ou no 19. Ele atira de 20 a 32, recua e não consegue atacar você enquanto você estiver ao lado dele: encurrale-o. É o monstro que dá mais experiência na Metrópole, e derruba uma poção de cura 1 vez em 5.\n\nSe o imp pulou o 17, ele está aqui em 1 de cada 2 partidas.
guide.city_f4=Os monstros que surgem são três golens, dois monges, dois bruxos, um elemental e um minotauro. Lute em corredores.\n\nSe nenhum ladrão de ouro entregou a _Chave Antiga da Cidade_ ainda, um _ladrão de ouro louco_ espera aqui. Ele golpeia duas vezes por turno, de 30 a 50, rouba de 100 a 500 de ouro e foge; golpes enquanto ele foge derrubam algumas moedas, e ele luta quando encurralado. Ele derruba seu ouro, uma shuriken e a chave (veja Cofre de Ouro). Cada ladrão de ouro que você mata nesta partida deixa o próximo mais forte.\n\nRaramente um _súcubo_ sobe dos Salões.\n\nO imp está aqui se ainda não apareceu. Qualquer poção da força, pergaminho do aprimoramento ou caneta arcana que a Metrópole ainda deve a você está neste andar, e o andar 20 não tem itens: gaste-os agora.
guide.city_f5=Um salão de estantes leva à sala do trono: o trono no meio, quatro pedestais de invocação nas diagonais. Ao entrar, a porta tranca até o Rei dos Anões morrer. Nada surge aqui; o único saque é o que um herói caído deixou perto da entrada.\n\nVenha com a vida cheia e um _Ankh_. Antes de um servo aparecer, o pedestal dele mostra o que vem: ossos para um ghoul, chama verde para um monge, sombra para um bruxo (faíscas para um golem no desafio Chefes mais durões).\n\nDepois que o rei morre, a porta norte se abre para uma passarela sobre um abismo; quem cai vai parar no andar 21. Se o imp deu a você mais de 2.000 pontos, a loja dele fica na passarela: armadura de placa, três tochas, armas de tier 5, um Ankh, um baú portátil de cristal e os livros dos mortos, dos vivos e dos céus.\n\nEmblema: mate-o sem acertá-lo com uma arma, uma varinha (raio é permitido), um Anel da Força ou uma magia de clérigo.
guide.city_overview=Andares 16 a 20. Ghouls, bruxos e monges são os mortos-vivos da Metrópole; elementais, golens, minotauros e as máquinas de um engenhoqueiro andam com eles.\n\nO andar 16 tem uma _loja_, a última antes do Rei dos Anões. O _Imp Ambicioso_ aparece no 17, 18 ou 19, sempre até o 19. O andar 20 é a sala do trono do rei.\n\nChuva e neve não chegam a essa profundidade, e o ar é mais quente que nas Cavernas. Fique perto de fogo num dia quente e você pode ter insolação.\n\nArmadilhas comuns: geada, tempestade, corrosão, incendiária, desintegração. Mais raras: desmoronamento, clarão, guardião, enfraquecimento, invocação, distorção espacial, maldita, queda e mais algumas.\n\nSob a lua cheia, espectros azuis surgem aqui ao anoitecer e à noite, e liches anões à noite.
guide.city_vault=O buraco na sala do _Imp Ambicioso_ leva a um cofre anão selado. Fale com ele primeiro: ele quer a _estatueta de obsidiana_ que está lá dentro.\n\nEntrar cura você por completo. Seu equipamento e seu ouro ficam com o imp; você entra de armadura de pano e com um _Cristal de Escape_, que tira você de lá a qualquer momento. As escadas lá dentro não fazem nada. Você não pode entrar durante a Ascensão.\n\nGuardas andam devagar e enxergam num cone à frente deles. Fique atrás deles; um guarda que vê você por um instante só vem dar uma olhada. Guardas mortos derrubam _insígnias do anão_, que abrem a porta das insígnias. Há itens espalhados para usar na luta, e uma poção de cura perto do início.\n\nPerto da porta do fundo da última sala, a entrada tranca e surge um elemental superior; ele alterna entre fogo, gelo e choque. Atrás dele esperam a estatueta e os prêmios do imp: um artefato ou anel, um segundo anel, duas armas, armadura de placa e uma varinha, todos +2 ou mais e sem maldição.\n\nQuando você sai, seu equipamento volta e tudo o que veio do cofre se perde, menos um item. Com a estatueta, o imp dá 4.000 pontos e você fica com qualquer item. Sem ela, ele pontua a exploração (até 1.000), as insígnias ou a porta das insígnias aberta (até 1.250) e o elemental invocado (os 750 inteiros se você matá-lo; se ele sobreviver, menos quanto mais você o feriu), e quanto melhor a pontuação, melhor o item que você pode levar; abaixo de 500, nenhum. Acima de 2.000, ele abre uma loja depois do trono do Rei dos Anões.
guide.den_crab=A Concha leva você a uma câmara seca embaixo de um salão todo de água. O raio da _concha relâmpago_ e dos caranguejos dela causa 50% a mais de dano em quem está na água; uma _poção de levitação_ evita isso.\n\nNo topo do salão fica a concha relâmpago, com quatro _caranguejos de concha_ em volta, e o _Rei Caranguejo_ circula pelo salão. Veja a página do Rei Caranguejo para a luta.\n\nO rei derruba de 1.900 a 4.000 de ouro e a _armadura de adamantita_. Cada caranguejo de concha derruba uma _chave de crânio dourada_, que abre qualquer fechadura em qualquer andar e depois se gasta. Matar o rei permite que a Concha leve você de volta; a concha se gasta.
guide.den_infest=A SanChikarah põe você num pedestal, numa salinha murada no meio de uma grande caverna escura. Você enxerga 6 quadrados. A única porta da sala fica no lado sul. Assim que você sai, dez _Yog-Dzewas Sombrios_ aparecem em algum lugar fora de vista, dormindo.\n\nVinte monstros já circulam: _onis cinzentos_ (500 de vida, golpes de 55 a 115) e _ratos espectrais_ (quatro vezes a sua velocidade, disparos de 20 a 45 que enfraquecem você, sem experiência). Outros chegam a cada 50 turnos, mais ou menos, então a caverna nunca fica vazia. Cada criatura no andar soma 1 de armadura a cada Yog-Dzewa Sombrio.\n\nUma fileira de armadilhas de invocação visíveis ocupa a parte de cima da sua sala inicial, e outras, ocultas, estão espalhadas pela caverna; cada uma chama mais monstros. Não há água, grama nem itens.\n\nLute na porta da sala para que eles venham um de cada vez. Um Transmissor de Lloyd funciona aqui.
guide.den_skeleton=Você chega numa câmara estreita embaixo de um salão de estátuas tomado por arbustos e grama alta. As duas colunas laterais da câmara são de água. Uma _poção da chama líquida_ está perto da porta: tudo neste covil é imune a fogo, então use-a para queimar o mato e abrir linhas de visão.\n\nPasse pela porta e o _Rei Esqueleto_ e duas _mãos de esqueleto_ gigantes acordam, todos voando. Veja a página do Rei Esqueleto para a luta.\n\nO rei derruba de 1.900 a 4.000 de ouro e a _arma de adamantita_; cada um dos três pode derrubar uma Poção da Chama Líquida. Matar o rei permite que o Osso Inscrito leve você de volta; o osso se gasta.
guide.den_tengu=O menor covil: uma caverna úmida de água e grama, com o _Tengu_ já caçando você. Este Tengu tem 400 de vida, se move com velocidade dobrada, acerta de 15 a 25 e bloqueia os primeiros 20 de dano de cada golpe, então armas leves mal o arranham. Use golpes pesados.\n\nSem fases e sem armadilhas. Abaixo de metade da vida ele usa um truque, quase sempre uma bomba; saia da explosão e continue lutando. Raízes, cegueira e terror não o afetam, e ele resiste a veneno e gás tóxico. Lute num corredor; você não consegue fugir dele.\n\nEle derruba de 1.900 a 4.000 de ouro e um _anel de adamantita_. Só então a chave leva você de volta; o Transmissor de Lloyd não funciona aqui.\n\nUma porta oculta leva à sala do tesouro do Rei Rato. Os baús dela têm ouro, sementes, um ovo, comida, uma bomba de fragmentação ou um Sr. Destructo, e um dos baús é um _mímico_. A chave não se gasta, então você pode voltar depois que o Tengu morrer e saquear em paz; ele não volta.
guide.den_thief=A Moeda Antiga abre um cofre com duas colunas de abismos de um quadrado subindo pelo salão. Um abismo derruba você no andar 41, que não tem saída (veja Pega-Ladrão). Trate cada quadrado de abismo como o fim da partida e fique longe deles quando algo puder empurrar ou confundir você.\n\nO _Rei dos Ladrões_ e seus dois reis bandidos esperam aqui; veja a página dele. Fogo e veneno funcionam normalmente em tudo aqui.\n\nEle derruba de 1.900 a 4.000 de ouro, um _anel de adamantita_ e, 1 vez em 3, um pergaminho. Matá-lo permite que a moeda leve você de volta; a moeda se gasta. A moeda o chama de 'Rei Bandido'; os reis bandidos são a escolta dele.
guide.den_thiefcatch=O andar 41 é uma armadilha. Você só chega aqui caindo por um abismo no andar 40, e nada tira você daqui: o andar conta como andar de chefe, então o Transmissor de Lloyd, a SanChikarah e todas as chaves de covil se recusam a funcionar, e não há escadas. A partida continua aqui, sem volta.\n\nO andar copia o covil do Tengu: algumas salas com água e musgo, e um ponto pavimentado onde deveria haver uma saída. Não há itens. Se o Tengu do covil (andar 36) ainda estiver vivo quando você cair, um rei bandido também surge aqui.
guide.dens_overview=Os covis de chefe (andares 35, 36, 37, 38 e 40) não têm escadas. Cada um só abre com o próprio item, usado num andar sem chefe da masmorra principal entre o 2 e o 24 (a SanChikarah funciona do 1 ao 26). O mesmo item traz você de volta, mas só depois que o chefe do covil morre. O Osso Inscrito, a Concha e a Moeda Antiga se gastam na volta; a Chave Antiga do Tengu e a SanChikarah ficam com você.\n\nDe onde vêm:\n_Chave Antiga do Tengu_ (36): o primeiro gnoll arqueiro que você mata depois que o Tengu morre.\n_Osso Inscrito_ (37): esqueletos musgosos. A partir do 51º que você mata, cada um tem 1 chance em 10; o 101º é garantido.\n_Concha_ (38): piranhas gigantes albinas, mesmas contagens.\n_Moeda Antiga_ (40): ladrões de ouro, mesmas contagens.\n_SanChikarah_ (35): forjada pelo ferreiro das Cavernas com as três partes.\n\nRecompensas: um anel de adamantita no 36 e no 40, a arma de adamantita no 37, a armadura de adamantita no 38, de 1.900 a 4.000 de ouro de cada chefe e o _Orbe de Zot_ no 35. O ferreiro da cidade usa adamantita para reforçar uma arma, armadura, anel ou varinha do tipo correspondente.\n\nOrdem sugerida: Tengu, Rei Esqueleto, Rei dos Ladrões, Rei Caranguejo e depois o 35. Um Transmissor de Lloyd funciona em todos os covis, menos no do Tengu. Não existe andar 39. Um abismo no andar 40 derruba você no 41, que não tem saída. O ar é quente.
guide.halls_end=Uma ponte sobre o vazio, velas e o _Amuleto de Yendor_ no pedestal. Nada surge aqui.\n\nPegá-lo não encerra a partida. Na escada do andar 25, você escolhe se começa a _Ascensão_. Se começar, os teleportes entre andares param, o Amuleto não pode ser largado e os monstros ficam muito mais fortes, os dos andares rasos mais ainda. Cada andar novo soma 2 à maldição do Amuleto: com 2 ela chama monstros distantes até você, com 4 eles ficam mais rápidos, com 6 você fica lento, a partir de 8 ela fere você a cada turno. Matar monstros fortalecidos a diminui. Andares de chefe antigos não somam nada e restauram sua vida e sua fome.\n\nSuba a escada do andar 1 com o Amuleto e a maldição acaba. Na superfície, o Amuleto então abre os túmulos selados.\n\nVocê também pode deixá-lo para trás e subir sem a maldição.
guide.halls_f1=_Súcubos_ (80 de vida) se teleportam para o seu lado quando estão a mais de 2 quadrados. Um terço dos golpes deles encanta você; enquanto você está encantado, os golpes deles os curam, e a cura além do máximo vira blindagem. Lute com eles de perto e quebre o encanto rápido. Um terço deles derruba um pergaminho, nunca de Identificação ou de Aprimoramento.\n\n_Olhos demoníacos_ carregam por 2 turnos e depois disparam um feixe de 30 a 50 pela linha até a primeira parede, mirando onde você estava. Enquanto carregam, recebem um quarto do dano. Saia da linha e depois ataque. Desintegração causa metade do dano neles.\n\n_Magos do caos_ se movem com velocidade dobrada, se curam com o dano que causam, e os golpes deles podem confundir, envenenar, queimar, cegar ou deixar você lento. Um em 50 derruba uma _Poção de Experiência_. Cada um derruba uma _Poção de Experiência_.\n\nA porta da _forja demoníaca_ nunca é oculta. A forja tem 120 de vida e não se move nem ataca, mas golpes acima de 20 perdem quase toda a força (85 conta como 30), e cada ponto de dano faz o próximo estripador vir mais cedo. Limpe a sala primeiro. Ela derruba uma Poção da Cura.
guide.halls_f2=Monstros: um súcubo, um olho demoníaco e um mago do caos.\n\nA segunda forja demoníaca faz um estripador a cada 53 turnos (60 no 21). Limpe a sala dela, feche a porta e vá desgastando a forja; estripadores passam pela porta um de cada vez, o que favorece bombas e fogo. Ela também derruba uma Poção da Cura.\n\nEste andar também tem a abertura com bordas de gelo para os _Salões Congelados_, uma ramificação de cinco andares. Os monstros de lá são tão fortes quanto os dos Salões.
guide.halls_f3=_Escorpiões_ (110 de vida) disparam espinhos de 20 a 52 que aleijam metade das vezes, e recuam quando você se aproxima. Eles não conseguem atacar você enquanto você estiver ao lado deles, então chegue perto e fique lá. Veneno e armas do vampirismo causam metade do dano. 1 em 5 derruba algo, quase sempre uma poção de cura, com menos frequência a cada vez. O raro _escorpião ácido_, verde-claro, devolve uma parte aleatória de cada golpe corpo a corpo ou de arremesso e cobre você de muco cáustico quando está ao seu lado; use varinhas nele.\n\n_Almas perdidas_ queimam você em um terço dos golpes. Fogo as cura; gelo ou frio arranca até dois terços da vida delas, e na água pode matá-las na hora.\n\nDe vez em quando a _gosma demoníaca_ aparece: 200 de vida, velocidade dobrada, golpes de 30 a 60 que cobrem você de muco cáustico. Cada golpe que ela aguenta solta uma bolha, e cada bolha derruba uma Poção da Recuperação. A água a cura, e lava fria é água.\n\nA terceira forja faz um estripador a cada 47 turnos. O laboratório fica neste andar ou no próximo.
guide.halls_f4=A visão cai para 2 quadrados. Monstros: três escorpiões, dois olhos demoníacos, um súcubo, uma alma perdida e a _gosma demoníaca_. A maioria ataca de fora do seu campo de visão, então ande colado às paredes e use invisibilidade em área aberta.\n\nA última forja faz um estripador a cada 40 turnos. Destrua as quatro antes do andar 25: cada forja deixada viva mantém um estripador completo entre as invocações de Yog-Dzewa, no lugar de uma larva.\n\nAntes da escada: gaste seus últimos Pergaminhos do Aprimoramento, junte cura e guarde pelo menos duas tochas.
guide.halls_f5=Dois passos depois da entrada, a escada desaba e o andar tranca até Yog-Dzewa morrer. Nada surge; o único saque é o que um herói caído deixou. Yog fica adormecido até você vê-lo.\n\nSua visão começa em 4 quadrados e cai um a cada vez que Yog perde 300 de vida, até chegar a 1. Uma _tocha_ acesa a mantém em 6.\n\nOs feixes de Yog atravessam paredes e nunca erram, então cobertura não adianta: observe os quadrados marcados e saia deles.\n\nA arena tem água. Ela apaga o fogo do punho flamejante, mas cura o punho pútrido.\n\nNenhum pergaminho ou farol tira você de um andar trancado. Quando você voltar com o Amuleto, esta escada pergunta se você quer começar a Ascensão.
guide.halls_overview=Andares 21 a 26, sem loja. Sua visão diminui um quadrado por andar: 5 no 21, 4 no 22, 3 no 23, 2 no 24. Cada um desses andares tem _duas tochas_; uma ilumina 6 quadrados em volta de você por 250 turnos. Guarde várias para o andar 25.\n\nDo 21 ao 24, cada andar tem uma sala com uma _forja demoníaca_ que não para de fazer demônios estripadores. Cada forja que você destrói transforma uma das invocações de estripador de Yog-Dzewa numa larva fraca. Seu diário marca as que ainda estão vivas.\n\nO ar fica perto de 35 graus, o limite da insolação; fogo por perto faz você passar dele. As poças vermelhas chamadas lava fria são só água.\n\nO 23 ou o 24 tem o laboratório. As armadilhas são as da Metrópole mais armadilhas sombrias. Sob a lua cheia, espectros azuis surgem ao anoitecer e à noite, e ratos espectrais à noite.\n\nO andar 25 é a arena de Yog-Dzewa. O andar 26 guarda o Amuleto de Yendor.
guide.mines_boss=Ao descer da escada, o andar tranca e uma mensagem explica: Otiluke prendeu o mago louco Zot dentro do _Palantír_ e se transformou no golem de pedra que o guarda. O andar destranca quando o golem morre.\n\nO salão da escada é fechado por duas portas trancadas; um baú no salão tem a chave de ferro. Depois delas, 88 _guardiões da mina_ dormem em dois blocos. Cada um empunha uma arma encantada +10 e causa dano dobrado, recebe de 1 a um quarto do dano que não vem de relíquia, aparece ao seu lado quando você está a mais de 2 quadrados e se teleporta para se curar quando fica abaixo de um quarto da vida. Um guardião acordado pode acordar os vizinhos. Cada um derruba a própria arma; o primeiro que morre derruba a _Chave Antiga dos Salões_, a única, que leva você de qualquer andar sem chefe entre o 2 e o 24 direto para a arena de Yog-Dzewa no andar 25, e de volta; a volta leva embora qualquer chave de crânio que você carregue.\n\nOito _torres eletrificadas_ cercam o bloco oeste. Elas não podem ser feridas e acertam você de 300 a 600 sempre que você está a até 4 quadrados delas, até o golem morrer. O Palantír fica no meio desse bloco.\n\nO golem fica parado dentro do bloco leste até ser atingido; veja Otiluke.
guide.mines_f1=A visão aqui é de dois quadrados; traga luz. As salas são divididas por _barricadas_ de madeira que queimam e abrem atalhos. Cada andar tem 9 pedaços de _minério de pedra_ no chão, que valem 1.000 de ouro cada na cidade.\n\nOs _kupua_ enchem estes andares: 550 de vida, o dobro da sua velocidade, golpes de 70 a 160 e armadura de até 50. Eles recebem de 1 à metade de qualquer dano, menos os golpes de uma arma relíquia. Um único golpe acima de 68 depois do corte faz o kupua soltar gás corrompido aos próprios pés; os kupua são imunes, você não, então recue depois de um golpe forte. 9 em 10 carregam um pedaço de minério.\n\nO raro _gullin_ tem 750 de vida, acerta de 100 a 200 e recebe de 1 a um quarto do dano que não vem de relíquia, mas erra mais que um kupua. É a única fonte de _Pedras Norn_ (veja Minas - Andar 3).\n\nAndares das minas nunca são reconstruídos: o que você abre, mata ou larga fica assim.
guide.mines_f2=A rotina: limpe um andar, junte o minério, use o _Farol de Retorno à Cidade_ para ir à cidade, venda o minério por 1.000 cada e use o farol de novo para voltar ao ponto exato de onde saiu. O guarda da cidade dá o farol a você na primeira vez que você fala com ele de dia.\n\nO farol não funciona com uma criatura ao seu lado nem num andar trancado. O andar 65 tranca quando você chega, então você não pode sair com o farol até o chefe de lá morrer.\n\nO Diário de Otiluke não recarrega nas minas nem em lugar nenhum da superfície; deixe que ele carregue na masmorra ou dentro dos prédios da cidade entre uma descida e outra.
guide.mines_f3=_Pedras Norn_ só caem de gullin: 3 em cada 5 gullin mortos derrubam uma, e só caem cinco por partida. Uma relíquia exige três, então conte com uma arma relíquia.\n\nPonha três ou mais pedras, e nada mais, no altar do templo a leste da praça da cidade. Três da mesma cor fazem a relíquia daquela cor; uma pilha misturada sorteia entre elas. Toda relíquia vem encantada. Azul: Espada de Ares (dreno de vida). Laranja: Machado de Crom Cruach (sorte). Roxa: Mangual de Loki (veneno). Amarela: Tridente de Netuno (raio). Verde: _Ira de Júpiter_, a única relíquia de arremesso (terror).\n\nContra kupua, gullin, guardiões da mina, o golem e Zot, os golpes de uma relíquia ignoram o corte de dano deles, e uma relíquia corpo a corpo soma um segundo golpe de uma a duas vezes o dano dela. Depois que as cinco pedras caírem, os gullin não derrubam mais nada.
guide.mines_f4=Sem uma relíquia, kupua e gullin demoram muito para morrer. A armadura deles (até 50, a do gullin até 145) é descontada de cada golpe antes do corte de dano, então alguns golpes pesados rendem muito mais que muitos leves.\n\nO gás corrompido vem de um único golpe que ainda causa mais de um oitavo da vida deles depois do corte: 69 para um kupua, 94 para um gullin. Acerte o golpe e saia da nuvem.\n\nAs minas não têm portas. Lute nos túneis para que só um monstro alcance você, e volte à cidade sempre que precisar.
guide.mines_f5=Além dos 9 pedaços de minério, cada andar das minas tem de 3 a 5 itens aleatórios (um quarto em baús, alguns em esqueletos que se levantam se o item for amaldiçoado) e de 1 a 3 pilhas de ouro. Um ladino tem 1 chance em 3 por andar de achar uma bomba. Contando o minério que os kupua carregam, um andar limpo vale bem mais de 10.000 de ouro.\n\nOs veios de minério nas paredes são decoração; você não pode cavar nestas minas. Barricadas queimam, e o musgo em volta delas também, então planeje sua saída antes de acender uma.
guide.mines_f6=Em noites de _lua cheia_, a partir do anoitecer, _ratos espectrais_ passam a surgir em todo andar das minas, mais depois que escurece. Eles têm 80 de vida mais 3 por andar (uns 260 aqui), se movem a quatro vezes a velocidade normal, mordem de 30 a 61 aqui e disparam projéteis sombrios de 20 a 45; um projétil em cinco também enfraquece você. Não dão experiência nem itens.\n\nVocê não consegue fugir deles, e ratos que já estão num andar continuam lá depois do amanhecer. Quebre a linha de visão para que eles tenham que vir até você, ou fique fora das minas em noites de lua cheia.
guide.mines_f7=Os kupua acertam de 70 a 160, e as mordidas de um mascote são cortadas como os seus golpes, então um mascote jovem morre rápido aqui. Deixe um frágil na cidade: ele só desce com você se estiver ao seu lado na escada, e o _Apito_ o chama de qualquer lugar.\n\nUm _Ovo_ vem dos Enigmas Sokoban, do covil do Tengu ou de uma sala de ninho com incubadora. Carregado, ele só conta turnos; deixado no chão, o que acontece com ele decide o que vai nascer (veja Missões, NPCs e Mascotes). Sacuda-o para ver se há algo vivo dentro, depois quebre-o; quebrado cedo demais, ele só dá gema.
guide.mines_f8=Duas folhas de Otiluke vêm de estantes: a do _Cofre_ e a da _Caverna do Dragão_. Cada estante que queima enquanto você tem visão mental, ou que uma busca deliberada esvazia, tem 1 chance em 50 de dar cada folha; existe uma de cada por partida. A folha da Caverna do Dragão abre o andar 67, onde fica o ovo de dragão das sombras. As minas não têm estantes, e a biblioteca da cidade também não.
guide.mines_f9=O andar 65 tranca quando você chega: a escada para cima e o _Farol de Retorno à Cidade_ param de funcionar até o golem de lá morrer. Venda seu minério e descanse na cidade antes.\n\nLista: uma _arma relíquia_ (o golem recebe de 1 a um quarto de qualquer outro dano), o Farol de Retorno à Cidade, bastante cura e um mascote forte ou nenhum.\n\nEsperando lá embaixo: 88 _guardiões da mina_ dormindo, 8 _torres eletrificadas_ que acertam você de 300 a 600 sempre que você chega a até 4 quadrados delas, e o golem.
guide.pg_battle=O primeiro esqueleto musgoso que você mata derruba a _Chave Antiga da Prisão_; o andar 9 tem um desses esqueletos se você nunca teve a chave. Use-a em qualquer andar sem chefe do 2 ao 24, e de novo para voltar; ela fica com você, então dá para voltar outras vezes.\n\nAbra o baú primeiro: 200 _Santas Granadas de Mão_. Cada explosão causa de 75 a 155 de dano a todo morto-vivo a até 2 quadrados e os aterroriza. Ela não fere você, criaturas vivas nem itens, então você pode jogar uma nos próprios pés quando estiver cercado.\n\nOs esqueletos têm armadura e batem forte, e cada morte faz os outros baterem mais forte e mais rápido: com 50 mortes eles atacam uma vez por turno, a partir de 100, duas. Cada um explode ao morrer e fere um pouco o que estiver ao lado. Às vezes um _protetor da sepultura_ voa entre eles e dispara projéteis. Ele não é morto-vivo, então as granadas não fazem nada nele; mate-o você mesmo.\n\nA partir do 51º esqueleto, cada morte tem 1 chance em 10 de derrubar o _Osso Inscrito_ (o covil do andar 37); o 101º sempre derruba. Esqueletos derrubam orvalho amarelo, às vezes vermelho. Na primeira vez que você sai com 100 mortes, ganha mais 20 granadas. A noz dourada da masmorra também exige 100 esqueletos mortos.
guide.pg_catacomb=Se você fez mais de 2.000 pontos na missão do cofre do imp, a loja dele no andar 20 vende três livros. Cada um custa 225.000 de ouro até você pegar o Amuleto de Yendor; depois disso o _Livro dos Mortos_ custa 7.500, o Livro dos Vivos 12.500 e o Livro dos Céus 15.000. Leia um livro em qualquer andar sem chefe, do 1 ao 26, para ir ao andar dele. Para sair, fique no pedestal do outro lado desse andar e leia de novo. O livro continua com você.\n\nO Livro dos Mortos abre as catacumbas: 12 a 18 salas ligadas por corredores estreitos. Você chega num pedestal; a _SanChikarah da Morte_ está no outro.\n\n_Espectros azuis_ vagam por aqui: 195 de vida, golpes pesados e quatro vezes a sua velocidade, então não dá para fugir deles. 1 golpe em 10 causa vertigem e terror. Lute com um de cada vez nos corredores. São mortos-vivos, então duas ou três Santas Granadas de Mão matam um. Cada um deixa orvalho vermelho, o tipo mais forte.\n\nÀs vezes aparece um _lich anão_. Ele só ataca de longe e se afasta; ao seu lado, não consegue atacar. Também é morto-vivo e pode deixar uma Poção da Cura.\n\nAs salas têm baús, restos mortais, ouro e às vezes uma Poção da Força ou um Pergaminho do Aprimoramento. Vasculhe tudo antes de sair.
guide.pg_chasm=O _Livro dos Céus_ abre um andar cheio de abismos. Há uma Poção de Levitação perto de onde você chega, e sementes de jarro-de-fase espalhadas pelo andar.\n\n_Sentinelas_ ficam por todo o andar. Cada uma segura uma arma +3 encantada aleatória, nunca amaldiçoada, e a deixa cair ao morrer. A sentinela só se mexe quando leva dano, então você escolhe cada luta. Acordada, é difícil de acertar e ataca com essa arma. Acorde uma de cada vez e não use ataques em área perto de grupos.\n\nOs únicos monstros que vagam são os _protetores voadores_. Eles voam sobre os abismos, disparam rajadas e não deixam nada.\n\nCair num abismo custa pelo menos metade da sua vida atual e deixa você sangrando e aleijado; com um quarto da vida máxima ou menos, a queda pode matar. A sala de baixo tem uma única escada, e ela leva direto ao pedestal de saída com a _SanChikarah da Transcendência_. Se estiver perdido e com bastante vida, pule.\n\nCom as três peças, fale com o ferreiro nas cavernas. Ele forja a _SanChikarah_, que leva você ao andar 35 e só traz você de volta quando todo Yog-Dzewa Sombrio de lá estiver morto.
guide.pg_field=O primeiro gnoll arqueiro que você matar deixa a _Chave Antiga dos Esgotos_. Sempre aparece um no andar onde você encontra o fantasma triste (andar 2, 3 ou 4). Use a chave em qualquer andar sem chefe, do 2 ao 24, para chegar ao campo, e no campo para voltar.\n\nUm arqueiro ao seu lado não consegue atirar, e aqui eles andam mais devagar que você. As flechas deles acertam mais forte a cada arqueiro que você já matou, então venha cedo. Cerca de um terço dos que surgem são _protetores da floresta_: voadores que disparam relâmpagos em qualquer linha livre. Mate-os primeiro; de perto eles são fracos.\n\nTodo arqueiro daqui deixa três _dardos da floresta_, que causam de três a seis vezes o próprio dano em alvos vivos. A partir do 21º arqueiro, cada morte tem 1 chance em 10 de deixar a _Folha de Refúgio_ do Diário de Otiluke. Depois que o Tengu morrer, o próximo arqueiro que você matar deixa a _Chave Antiga do Tengu_ (o covil do andar 36). Pisotear a grama alta dá sementes, nozes, bagas e orvalho.\n\nNa primeira vez que você sai do campo com 100 ou mais arqueiros mortos, ganha mais 30 dardos da floresta.
guide.pg_fishing=A primeira piranha que você matar depois de chegar ao andar 11 deixa a _Chave Antiga das Cavernas_; o andar 14 sempre tem uma piranha a mais. Use a chave em qualquer andar sem chefe, do 2 ao 24, para chegar a um andar alagado de ilhas de areia.\n\nTrinta _piranhas gigantes albinas_ vivem na água. Nadam com o dobro da sua velocidade, batem forte, se esquivam bem e ignoram fogo, gelo, gás, paralisia e raízes. Elas podem morder você de dentro da água se você estiver na beira; a um quadrado da margem, não alcançam você.\n\nAo lado de onde você chega há um baú com 99 _Bombas de Pesca_ e uma Poção de Levitação. A bomba de pesca não causa dano: toda piranha albina a até 2 quadrados dela cai em terra firme em algum ponto do andar e morre lá, e o que ela deixa cai lá também. Elas não dão experiência, mas deixam comida, com mais frequência quanto mais delas você já matou.\n\nO perigo é o _protetor dos peixes_, que aparece de vez em quando. As rajadas dele causam de 25 a 59, 50% a mais se você estiver na água, e paredes as bloqueiam. De perto ele bate mais fraco.\n\nA partir da 51ª piranha albina, cada morte tem 1 chance em 10 de deixar a _Concha_ (o covil do andar 38); a 101ª sempre deixa. Na primeira vez que você sai com 100 mortes, ganha 40 bagas. O Mangual de Loki não deixa você invisível aqui.
guide.pg_fortress=O _Livro dos Vivos_ abre uma fortaleza anã. Os corredores têm dois quadrados de largura, então não há porta para usar de gargalo.\n\nAqui vivem os _oni_: 520 de vida, golpes de 50 a 90, imunes a terror e cólera. Não são mortos-vivos, então granadas não fazem nada. Atacam devagar, uma vez a cada turno e meio, e todos começam dormindo. Ande em silêncio e dá para atravessar o andar sem acordar nenhum.\n\nUm grão de _arroz mágico_ está perto de onde você chega. Pegá-lo acorda todos os oni do andar e os chama até você, então só pegue quando estiver pronto. Com ele você faz _bolinhos de arroz_, que deixam sonolento um alvo ileso e o mandam para outro ponto do andar, ou _bombas de bolinhos_, que deixam sonolento tudo numa área de 3 por 3 e mandam embora os ilesos. Nenhum dos dois funciona em mortos-vivos. O grão se desfaz depois de uns 200 bolinhos de arroz ou 40 bombas.\n\nO _engenhoqueiro_ espera atrás de um escudo mágico. Leve até ele o cogumelo chapéu-de-sapo que está neste andar, com o odre na mochila, e ele melhora o odre de vez: 300 gotas em vez de 100, um condensador que tira orvalho do ar e um bico para beber um número exato de gotas. Depois ele morre.\n\nA _SanChikarah da Vida_ está no pedestal de saída, onde você lê o livro para sair.
guide.pg_vault=O primeiro ladrão de ouro que você matar deixa a _Chave Antiga da Cidade_; o andar 19 tem um se você nunca teve a chave. Use-a em qualquer andar sem chefe, do 2 ao 24, para chegar ao cofre: 50 pilhas de 100 a 300 de ouro, cerca de 10.000 no total, entre estátuas de ouro.\n\nLadrões de ouro atacam duas vezes por turno. O primeiro golpe que acerta rouba de 100 a 500 do seu ouro, e o ladrão foge. Acertá-lo enquanto ele foge faz cair algumas moedas; matá-lo devolve o resto. Um ladrão encurralado revida. Cada um deixa uma shuriken, e cada morte dá mais vida e armadura aos próximos.\n\nÀs vezes um _protetor do cofre_ flutua entre eles. Tem pouca vida, mas a rajada dele acerta de 30 a 70, a mais forte de todos os protetores. Mate-o primeiro e use estátuas e paredes para cortar a linha de tiro dele.\n\nA partir do 51º ladrão, cada morte tem 1 chance em 10 de deixar a _Moeda Antiga_ (o covil do andar 40); o 101º sempre deixa. Na primeira vez que você sai do cofre tendo matado 100 gnolls arqueiros, 100 esqueletos musgosos, 100 piranhas albinas e 100 ladrões de ouro, ganha a _noz dourada da masmorra_: comê-la dá +2 de força e +20 de vida máxima ou, metade das vezes, +5 e +50. O cofre não tem suprimentos; traga os seus.
guide.postgame_overview=Os andares 27 a 33 não têm escadas. Uma chave ou um livro leva você até lá a partir de um andar comum da masmorra e traz você de volta. Chaves e livros ficam na mochila e funcionam de novo. Nenhuma chave ou livro funciona enquanto um mascote segue você.\n\nOs quatro primeiros andares (Campo, Batalha, Pesca, Cofre) são campos de matança: um só tipo de monstro, que reaparece, e nenhum saque no chão além dos baús de suprimentos da Batalha e da Pesca e do ouro do Cofre. Toda morte desse tipo conta, não importa onde, e arqueiros, esqueletos e ladrões ficam mais fortes a cada um que você mata. Os prêmios deles abrem os covis dos chefes.\n\nOs três últimos andares (Catacumba, Fortaleza, Abismo) são labirintos com saque no chão, às vezes uma Poção da Força ou um Pergaminho do Aprimoramento. Cada um guarda uma peça da _SanChikarah_ no pedestal de saída. Leve as três ao ferreiro nas cavernas; ele as transforma no caminho para o andar 35.\n\nAqui não há armadilhas, o ar é quente e seco em qualquer estação e a água nunca congela. Em noites de lua cheia aparecem ratos espectrais: mortos-vivos rápidos que disparam rajadas e podem enfraquecer você.
guide.prison_f1=Procure a _loja_ primeiro; é a única dos andares 6 a 10. Compre o _Diário de Otiluke_ se puder: as folhas que Goo e Tengu deixam vão para ele, e com cada folha ele pode levar você a uma das salas escondidas de Otiluke. Se você nunca conseguir um, o DM-300 do andar 15 deixa um. A loja também vende um _ankh_, bom de levar para a luta contra o Tengu no andar 10, e o único _Transmissor de Lloyd_ da partida, que memoriza um lugar e leva você de volta até ele: o Tengu, o DM-300 e o Rei dos Anões dão um nível cada a ele, se estiver na sua mochila. O arco-portal ao lado do vendedor já está aceso; os arcos das lojas dos andares 11, 16 e 20 custam 1.500, 2.300 e 3.500 de ouro para acender, e com os arcos acesos você viaja entre eles e até o arco da praça da cidade, que está sempre aceso, por 150 de fome a viagem.\n\nEste andar está cheio de esqueletos. Eles explodem ao morrer; a armadura reduz a explosão, mas não dê o golpe final ao lado de um quando estiver com pouca vida. Ladrões loucos atacam duas vezes por turno e roubam um item não equipado e sem aprimoramentos. Cada golpe num ladrão em fuga faz cair um pouco de ouro; se ele sumir de vista a 6 quadrados ou mais, o item está perdido.\n\nO fabricante de varinhas acrescenta uma _varinha de adamantita_ à recompensa se nenhum inimigo tiver morrido desde que você chegou a este andar pela primeira vez, não importa quem o matou; das tarefas dele, só a vala comum permite isso. O ferreiro da cidade a usa para reforçar uma varinha. O mago sempre ganha a varinha.
guide.prison_f2=O _DM-100_ lança relâmpagos em você de qualquer ponto com linha livre; quebre a linha com uma esquina. Ele deixa um pergaminho 1 vez em 4. O _guarda da prisão_ pode puxar você para o lado dele com a corrente uma vez, e depois deixa você aleijado por 4 turnos. _Esqueletos fósseis_ acertam de 12 a 25, atacam devagar, têm armadura pesada e explodem ao morrer como os esqueletos normais. _Zumbis_ também aparecem a partir daqui.\n\nRaramente (1 em 50 em cada um dos andares 7 e 8) um _shinobi_ caça você: velocidade dobrada, e os arremessos dele causam de 10 a 23 em qualquer linha livre. Lute com ele atrás de uma esquina.\n\nO _fabricante de varinhas_ pode estar aqui (1 em 3; senão, no andar 8 ou 9). A recompensa dele é escolher entre duas varinhas +1 diferentes e sem maldição. As três tarefas dele:\n_Vala comum:_ queime a barricada com a poção da chama líquida que está neste andar. Carregar o pó de cadáver invoca espectros, então traga-o direto de volta.\n_Local do ritual:_ ponha as quatro velas nos quatro lados do quadrado marcado, mate o elemental recém-invocado e traga as brasas dele. Gelar ou congelar o elemental tira metade da vida dele de uma vez.\n_Jardim pútrido:_ o coração pútrido solta gás tóxico e chicoteadoras pútridas se escondem na grama. Fogo mata as chicoteadoras, mas nunca queime o coração: um coração queimado morre sem deixar a semente de putrifruta.
guide.prison_f3=_Necromantes_ aparecem a partir daqui. O necromante nunca ataca: ele ergue um esqueleto ao seu lado, leva o esqueleto até você se você fugir, cura o esqueleto de longe e o enfurece quando ele está com a vida cheia. Mate o necromante e o esqueleto se desfaz. Se você estiver onde ele está invocando, é empurrado para o lado, ou ferido se não houver espaço. Necromantes carregam uma Poção da Cura 1 vez em 5 no começo, e menos a cada uma que deixam.\n\nRaramente um _necromante espectral_ pálido invoca espectros no lugar, um atrás do outro. Espectros são difíceis de acertar; mate o necromante e todos morrem. Ele deixa um Pergaminho de Remover Maldição.\n\nEste é o último andar dos esqueletos fósseis e dos shinobi. Se você ainda não encontrou o fabricante de varinhas, ele está aqui metade das vezes; senão, no andar 9. O laboratório também está aqui metade das vezes; senão, no andar 9.
guide.prison_f4=Qualquer Pergaminho do Aprimoramento, Poção da Força ou caneta que a prisão ainda deve a você está neste andar; o andar 10 só tem o Tengu. O fabricante de varinhas e o laboratório estão aqui se você ainda não os encontrou.\n\nSe você nunca teve a _Chave Antiga da Prisão_, um _esqueleto musgoso_ espera em algum ponto deste andar. Tem de 105 a 135 de vida e armadura pesada, quase nunca erra, acerta de 20 a 45 e ataca uma vez a cada 1,5 turno. Veneno e gás tóxico não fazem nada a ele, e ele explode ao morrer. Você pode deixá-lo em paz.\n\nEle sempre deixa a Chave Antiga da Prisão, que leva você à Batalha (andar 28) de qualquer andar sem chefe entre o 2 e o 24. Usar a chave lá traz você de volta, e ela continua com você.
guide.prison_f5=Um corredor segue para o sul, passando por quatro celas, até a cela trancada do Tengu. A _chave de ferro_ está numa das quatro celas. Descanse, cure-se e arrume a mochila antes de abrir a porta: entrar na cela do Tengu sela o andar até o fim da luta. Um _ankh_ é um bom seguro.\n\nNenhum outro monstro vive aqui e nenhum aparece. Tudo que fere você é do Tengu: armadilhas de dardo escondidas, bombas, postes de relâmpago e fogo. Vença sem ser atingido por nenhuma armadilha ou truque dele para ganhar um emblema.\n\nEle deixa a _Máscara do Tengu_ se você ainda não tem subclasse (usá-la deixa você escolher uma) e a folha do Castelo Sokoban do Diário de Otiluke. Um Transmissor de Lloyd na mochila ganha um nível. Depois da luta o andar muda: contorne o abismo até a escada de descida. O andar 11 tem uma loja.
guide.prison_overview=Andares 6 a 10, um salto grande em relação aos esgotos. Esqueletos explodem em estilhaços de osso ao morrer, guardas da prisão puxam você com correntes, os DM-100 dão choques de longe e, a partir do andar 8, necromantes erguem esqueletos.\n\nO andar 6 tem a única loja da região e um buraco coberto de teias que desce para o ninho de aranhas. Os andares 6 a 9 escondem 2 ou 3 salas secretas. O andar 10 é do Tengu.\n\nEsta é a região mais fria da masmorra principal. A água apaga o fogo e lava o muco. Ficar na água faz o relâmpago saltar mais longe e acertar mais forte, e o congelamento prende você por mais tempo. As armadilhas comuns são de resfriamento, elétricas, de gás tóxico, de combustão e de dardo venenoso; as mais raras disparam alarmes, agarram você ou teletransportam você.\n\nEm noites de lua cheia surgem espectros a partir do anoitecer, e necromantes espectrais à noite.
guide.sewers_f1=A escada de subida leva você de volta à cidade a qualquer momento.\n\nEste andar tem exatamente 8 monstros, nenhum perto da entrada, e nada reaparece. A maioria são ratos; enfrente as duplas numa porta. A _cobra de esgoto_ se esquiva de quase todo golpe, mas um ataque surpresa nunca erra: deixe que ela siga você por uma porta e ataque quando ela passar. O _morcego marrom_ voa com o dobro da velocidade, pode cegar você e às vezes guincha ao morrer, atraindo metade do andar até você. O _rato cinzento_ ignora veneno, fogo, sono e terror.\n\nEm 1 partida a cada 50, um _rato chefe_ vive aqui. Quando vê você, ele chama até quatro ratos; recue para um corredor.\n\nAs únicas armadilhas são armadilhas de dardos gastas, sempre visíveis, e não há salas secretas, mas a porta da sala de entrada fica escondida até você pegar a página do guia sobre procurar, que está nessa sala. Espere comida, um Pergaminho do Aprimoramento 3 vezes em 4 e às vezes uma Pedra de Intuição ou um catalisador mágico. O catalisador fica num baú trancado; a _chave dourada_ dele está em outro ponto deste andar.
guide.sewers_f2=Há um _cogumelo chapéu-de-sapo_ neste andar, e o engenhoqueiro J. Mertens espera atrás de um escudo inquebrável. Fale com ele levando o cogumelo e o odre na mochila e ele modifica o odre uma vez, depois vai embora. Escolha um:\n_Condensador de Orvalho:_ o odre se enche com a umidade do ar, cerca de uma gota a cada 100 turnos no ar saturado, mais rápido na chuva ou na neblina, nunca no ar seco.\n_Dose Medida:_ beba um número exato de gotas; cada uma restaura um vigésimo da sua vida máxima e da sua mana máxima.\n\nPegue todas as gotas de orvalho antes de usar a escada: as gotas deixadas para trás secam.\n\nA partir daqui, 5 a 7 monstros vagam ao mesmo tempo e os mortos são substituídos. Aparecem gnolls exploradores. Baús podem ser mímicos, algumas portas ficam escondidas e uma armadilha de invocação chama de 1 a 3 monstros do próprio andar.\n\nO fantasma triste espera aqui 1 vez em 3 e manda você atrás de um rato fétido. Um _gnoll arqueiro_ sempre aparece no andar do fantasma; o primeiro arqueiro que você matar deixa a _Chave Antiga dos Esgotos_ (veja o Campo). Um gnoll que ignora você é um _exilado_: só luta se for atacado e carrega saque extra.
guide.sewers_f3=Novos aqui: o _enxame de moscas_, o _caranguejo de esgoto_ e o _velocigalo_.\n\nO enxame tem 80 de vida e não dá experiência. Todo golpe de arma, corpo a corpo ou de arremesso, divide o enxame, e as metades mantêm o fogo ou veneno que ele tiver. Varinhas, fogo e gás nunca o dividem. O primeiro enxame carrega uma Poção da Recuperação 1 vez em 6; os enxames que se dividem dele, com menos frequência.\n\nO caranguejo e o velocigalo andam com o dobro da velocidade, então não dá para fugir deles. A carapaça do caranguejo bloqueia até 4 de dano por golpe: um golpe pesado rende mais que vários leves. Raramente um caranguejo veste um barril: esse _caranguejo eremita_ é mais lento e mais resistente e sempre deixa uma armadura.\n\nSe você ainda não encontrou o fantasma, ele está aqui metade das vezes. O alvo dele é um _gnoll trapaceiro_ que arremessa dardos; cada acerto seguido envenena mais e pode pôr fogo em você. Chegue perto: quando ele precisa se mover, a sequência zera.\n\nSe a Pedra de Intuição ou o catalisador mágico ainda não apareceu, está neste andar. O laboratório de alquimia está aqui metade das vezes; senão, no andar 4.
guide.sewers_f4=Seu último andar comum antes do Goo. Qualquer Pergaminho do Aprimoramento, Poção da Força ou caneta que os esgotos ainda devem a você está aqui, e o laboratório também, se o andar 3 não tinha um.\n\nSe você ainda não encontrou o fantasma, ele está aqui, e o alvo é o _grande caranguejo_. Enquanto ele olha para você, a garra dele bloqueia seus golpes corpo a corpo, armas de arremesso e disparos de varinha. Acerte-o enquanto você estiver invisível ou ele estiver paralisado, ou deixe um aliado chamar a atenção dele. Ele anda devagar. A recompensa é escolher uma arma ou armadura de tier 2 a 5, +0 a +3, com 1 chance em 5 de ter um encantamento ou glifo oculto. Termine a missão mesmo que não queira nenhuma das duas: a Rosa Murcha não cria pétalas até o fantasma descansar em paz.\n\nEste andar está cheio de caranguejos e slimes, com slimes marrons e vermelhos (os vermelhos podem envenenar). O slime reduz todo golpe acima de 5 de dano (10 vira 7, 25 vira 10), então armas leves e rápidas se saem melhor. Slimes deixam uma arma de tier 2 1 vez em 5, quatro vezes mais raro a cada uma que deixam.\n\nEm 1 partida a cada 40, um ladrão louco sobe da prisão. Ele rouba um item não equipado e sem aprimoramentos e foge; se sumir de vista a 6 quadrados ou mais, o item já era.
guide.sewers_f5=Sem armadilhas, sem monstros vagando e sem saque além do que o Goo deixa. O _Goo_ fica numa poça no centro da sala, e metade do andar é água. Quando ele nota você, o andar se fecha e a escada de subida fica alagada até o Goo morrer, então se prepare antes.\n\nMate o Goo e pegue a _chave desgastada_ para destrancar a escada de descida; não há outro caminho. A sala é um losango, um quadrado com paredes internas ou um salão com pilares finos ou grossos. Aprenda o formato e use paredes, pilares e portas para quebrar a linha do Goo. No frio intenso as poças congelam, e o Goo não se cura no gelo.\n\nUma porta escondida leva à sala do Rei Rato, com pilhas de ouro no chão. Ele não pode ser ferido. Traga para ele a Coroa do Rei Anão (do Rei dos Anões, no andar 20) vestindo uma armadura, e ele pode dar a essa armadura a habilidade Ratransmutar.
guide.sewers_overview=Andares 1 a 5. Ratos, gnolls e caranguejos ganham mais vida e dano quanto mais fundo você os encontra. Duas salas secretas se escondem em algum ponto dos andares 2 a 4.\n\nAs lojas da cidade ficam uma escada acima do andar 1 (fechadas à noite); a primeira loja dentro da masmorra fica no andar 6.\n\nO clima da superfície chega a esses túneis, um pouco mais fraco: chuva, neve e vento. No frio intenso a água congela, e o Goo, lá no fundo, não se cura no gelo. Em noites de lua cheia, espectros podem surgir depois de escurecer, às vezes dois.
guide.sok_castle=Aqui a maioria das ovelhas é de canto. Este andar tem mais armadilhas tosquiadoras que os outros andares de enigma, com placas do pastor entre elas, então mantenha as ovelhas de canto longe das placas do pastor.\n\nDoze placas de oferenda, doze prêmios na primeira visita. Os seis primeiros são chaves de ferro que aparecem no quadrado onde você chega, uma por porta trancada. Os outros seis vêm em ordem aleatória: uma semente de jarro-de-fase, uma semente de flor-estrela, dois Pergaminhos da Infusão Mágica, um Pergaminho da Maturação e os _Óculos_. Com os Óculos no rosto, a carga que o diário gasta cai pela metade. Os prêmios 11 e 12 caem no extremo sudoeste, onde se chega pelo terceiro portal, que fica inativo até uma ovelha ser empurrada para a placa do sul.\n\nUma _estátua animada_ fica no leste: 500 de vida, uma arma encantada +5, metade da velocidade normal. Ela só acorda quando vê você ou é atingida; barulho não a acorda. Se ela acordar, afaste-se. Não deixa nada, resiste a veneno e ignora armas vampíricas.\n\nOs baús guardam de 400 a 800 de ouro, ou um Pergaminho do Aprimoramento (1 em 5), na primeira visita. Um baú tem uma Poção da Chama Líquida em toda visita.
guide.sok_portals=Pisar num portal ativo teleporta você. Uma ovelha empurrada para uma placa do portal muda o destino de um portal, e o registro mostra 'Click!'. Dois portais começam inativos. Várias placas podem religar o mesmo portal; vale a última. Uma placa da fileira sul desativa um portal em vez disso. Percorra os portais antes de empurrar qualquer ovelha.\n\nTreze prêmios na primeira visita. Os seis primeiros são chaves de ferro, ao lado da entrada, para cinco portas trancadas. Os outros sete caem num mesmo quadrado a leste do centro: duas sementes de flor-estrela, uma semente de jarro-de-fase, dois Pergaminhos da Infusão Mágica, um Pergaminho da Maturação e o _amuleto de autopoção_, que não existe em nenhum outro lugar. Equipado, ele faz você beber uma Poção da Cura quando um golpe deixa você abaixo de um décimo da vida, se você tiver uma.\n\nDuas estátuas animadas: uma perto do centro, outra no extremo sudeste. Um portal pode deixar você ao lado de uma; se ela acordar, pegue outro portal. Os baús guardam de 300 a 500 de ouro, ou um Pergaminho do Aprimoramento (1 em 5), só na primeira visita.
guide.sok_practice=Quatro tipos de ovelha. A _ovelha comum_ anda um quadrado em linha reta para longe de você quando você esbarra nela, nunca na diagonal. A _ovelha de canto_ também anda na diagonal. A _ovelha de troca_ não pode ser empurrada; esbarrar nela troca vocês de lugar. A _ovelha sombria_, empurrada, salta para uma armadilha tosquiadora a até 5 quadrados e a dispara, ou some se não houver nenhuma ao alcance.\n\nEmpurre uma ovelha para uma placa de oferenda (quatro pinos azuis) e um prêmio aparece: aqui, primeiro uma chave de ferro para a porta trancada, depois uma _Toalha_ (10 usos, cura sangramento e muco cáustico em você ou no seu mascote). Três placas de oferenda, dois prêmios.\n\nSeu caminho evita as armadilhas tosquiadoras; você só pisa numa se quiser. A _placa do pastor_ transforma uma ovelha comum em ovelha de canto, uma ovelha de troca em comum e uma ovelha de canto numa que nunca mais se move. Mantenha as ovelhas de canto longe delas.\n\nO portal fica inativo até uma ovelha ser empurrada para a placa dele. Procure portas escondidas nas paredes. Os cinco baús guardam de 300 a 500 de ouro, ou um Pergaminho do Aprimoramento (1 em 5), só na primeira visita.
guide.sok_puzzles=Aqui a maioria das ovelhas é de troca, que não podem ser empurradas. Para converter uma, fique numa placa do pastor e esbarre nela: vocês trocam de lugar, a ovelha cai na placa e vira uma ovelha comum. Cada placa funciona uma vez. Mantenha as ovelhas de canto longe delas.\n\nQuinze prêmios na primeira visita. As seis chaves de ferro aparecem em pontos fixos, a primeira na entrada e a última ao lado da estátua animada. O primeiro tesouro aparece perto da entrada; os outros oito se amontoam num quadrado no extremo nordeste. Os tesouros, em ordem aleatória: dois Pergaminhos da Infusão Mágica, duas sementes de jarro-de-fase, duas sementes de devora-aprimoramentos, uma semente de flor-estrela, um _Ovo_ e o _Apito_, que chama seu mascote para o seu lado de qualquer lugar. Preencha as quinze placas de oferenda para ter certeza de pegar o Apito.\n\nA placa do portal no sudoeste faz um portal levar você para o lado da pilha de prêmios. Duas placas religam o mesmo portal inativo; vale a última. Uma placa não está ligada a nada, então não há clique. Um baú no lado oeste tem uma Poção da Chama Líquida em toda visita.
guide.sok_vault=Sem ovelhas, armadilhas, fechaduras ou monstros. Difícil é chegar aqui: cada estante que queima enquanto você tem visão mental, ou que você esvazia procurando de propósito, tem 1 chance em 50 de dar a folha do Cofre, e só existe uma por partida.\n\nUma única caverna grande, tomada por grama e arbustos que escondem os baús. Na primeira visita há uns 130 baús com 300 a 500 de ouro cada, alguns (1 em 50) com um Pergaminho do Aprimoramento no lugar, e um _Anel da Fortuna_ garantido no baú mais ao norte. As visitas seguintes rendem de 1 a 10 de ouro por baú, então venha com a mochila vazia e limpe tudo numa viagem só. Mapeamento mágico ajuda.\n\nA folha da Caverna do Dragão sai das estantes do mesmo jeito; veja a Caverna do Dragão no capítulo da cidade.
guide.sokoban_overview=O _Diário de Otiluke_ leva você às salas dobradas dele. A loja do andar 6 vende um; se você nunca pegar um, o DM-300 deixa um e, se não, o Rei dos Anões.\n\nCada destino precisa da sua folha, adicionada com ADICIONAR FOLHA. Goo, Tengu, DM-300 e o Rei dos Anões deixam as folhas do Treino, do Castelo, dos Portais e dos Enigmas Sokoban. As folhas do Cofre e da Caverna do Dragão vêm de estantes (veja o Cofre). Quebrar o Orbe de Zot dá a folha da Cidade.\n\nLer o diário exige uma carga completa: 1.000 turnos divididos pelo número de folhas mais um, metade disso com os Óculos no rosto. Adicionar uma folha recarrega o diário. Ele carrega um ponto por turno nos andares de número menor que 26 e dentro das construções da cidade, e pode ser lido nesses andares, menos nos de chefe. RETORNAR leva você ao lugar onde leu. Um mascote seguindo você bloqueia os dois.\n\nOs andares de enigma são refeitos a cada visita, então uma ovelha presa se resolve saindo. Os prêmios e os baús ricos só existem na primeira visita, e as chaves que você leva para fora são tomadas. _Armadilhas tosquiadoras_ tiram metade da sua vida atual, ou matam você com um décimo da vida máxima ou menos; uma ovelha empurrada para uma vira tapete. Estátuas animadas guardam três andares.
guide.topic_bestiary=Os monstros voltam depois que você limpa um andar: duas vezes mais rápido à noite, 50% mais rápido num andar escuro. Cada andar tem seus próprios monstros, mais alguns desgarrados raros: um rato chefe no andar 1, shinobi nos andares 7 e 8.\n\nCerca de 1 monstro comum em 50 surge como um gêmeo mais forte: ratos albinos cuja mordida faz sangrar, slimes pingando muco cáustico, caranguejos eremitas protegidos por um barril e outros mais para baixo. O acessório _Crânio de Rato_ deixa os gêmeos mais comuns.\n\nO esqueleto explode ao morrer; não fique ao lado dele. Os ladrões e guardas da prisão são mortos-vivos, então tudo que fere mortos-vivos funciona neles, e os mortos-vivos batem um quarto mais forte à noite.\n\nEm noites de lua cheia os mortos andam: espectros nos esgotos depois de escurecer, espectros e necromantes espectrais na prisão a partir do anoitecer, espectros vermelhos nas cavernas, espectros azuis na metrópole e nos salões, ratos espectrais nas minas da cidade e nos andares selados. Cerca de 1 espectro em 100 é um _espírito atormentado_. Leia um Pergaminho de Remover Maldição ao lado dele e ele deixa para você uma arma encantada ou uma armadura com glifo.\n\nUma piranha pode aparecer em qualquer quadrado de água que tenha água em 5 dos seus 8 lados.
guide.topic_endings=Pegar o _Amuleto de Yendor_ não termina a partida.\n\nMate Yog-Dzewa no 25, pegue o amuleto no 26 e suba até a saída sob a maldição dele (veja O Amuleto). Saia do andar 1 com ele e a maldição acaba; daí em diante o amuleto abre os túmulos selados espalhados pela superfície.\n\nO outro objetivo começa na cidade. A escada da praça leva às minas (56 a 64), onde você forja uma _arma relíquia_ com Pedras Norn. No 65 um golem de pedra guarda o _Palantír_, o único caminho até Zot, no 99. Mate Zot e Otiluke fica livre.\n\nAs chaves antigas e os três livros abrem os andares selados (27 a 33): veja Os Andares Selados. Os prêmios deles e a SanChikarah abrem os covis dos chefes (35 a 40). O Orbe de Zot, do andar 35, se quebra numa folha do diário que leva você para casa, na cidade.
guide.topic_heroes=No começo só o guerreiro está liberado. Os outros são desbloqueados ao longo das partidas: o mago quando você lê um _Pergaminho do Aprimoramento_, o ladino depois de 10 ataques surpresa, a caçadora depois de 10 acertos com armas de arremesso, a duelista quando você empunha uma arma corpo a corpo de tier 2 ou maior com a força necessária, o clérigo quando você remove uma maldição.\n\nO _Selo Quebrado_ do guerreiro dá blindagem a ele quando a vida cai para a metade e leva um aprimoramento e um glifo de uma armadura para outra. O cajado do mago guarda uma varinha. A _Capa das Sombras_ do ladino o deixa invisível. A caçadora luta com luvas e um _arco espiritual_ que nunca fica sem flechas e cresce com o nível dela, e a grama alta que ela atravessa continua de pé. O florete da duelista pode dar uma estocada. O clérigo conjura magias com um tomo sagrado. Cada classe já conhece uma poção e um pergaminho desde o começo.\n\nO nível não tem limite; depois do 30, cada nível pede mais experiência, até um teto. Cada nível dá 3 pontos, divididos entre talentos e habilidades, e 2 de mana a mais. O Tengu, no andar 10, deixa uma máscara que escolhe sua subclasse; o Rei dos Anões, no 20, deixa uma coroa que dá uma habilidade à sua armadura. Mostre a coroa ao Rei Rato no andar 5 antes de usá-la e ele oferece a própria habilidade no lugar.\n\nA mana se recarrega sozinha: um centésimo do total a cada turno parado, metade disso andando, 50% mais rápido quando você está bem alimentado, e nada quando está faminto. Um Anel da Magia aumenta o total e a taxa.\n\nAgache-se para ganhar 4 de furtividade andando na metade da velocidade, e para passar pela grama alta sem pisoteá-la; levantar leva 2 turnos. Depois de um dia e meio acordado você fica sonolento e enxerga menos; depois de três dias você desmaia no anoitecer seguinte. Descanse, ou durma numa cama da estalagem, para acabar com isso.
guide.topic_loot=Toda região de cinco andares tem 2 _Poções da Força_, 3 _Pergaminhos do Aprimoramento_, 1 caneta arcana e 1 cartucheira; o que os três primeiros andares não deram está no quarto. Todo andar que não é de chefe tem uma refeição. O andar 3 ou 4 de cada região tem um laboratório com 5 cristais de energia. Os andares 1 a 3 têm uma Pedra de Intuição e um catalisador mágico; os andares 6 a 14 têm uma Pedra de Encantamento. Encantar e inscrever só funcionam em equipamento identificado. Armas de tier 1 e armaduras de pano nunca aparecem ao acaso.\n\nAlguns baús são mímicos; os dourados mordem mais forte. Criptas, piscinas e salas de sacrifício dão equipamento da região seguinte.\n\nAs lojas dos andares 6, 11 e 16 sempre vendem um ankh, uma Pedra de Alteração, a armadura da região, uma arma corpo a corpo e uma de arremesso sem maldição, uma poção de cura, Pergaminhos de Identificação, de Remover Maldição e de Mapeamento Mágico, e um item raro: em geral uma caneta, às vezes uma varinha, anel ou artefato. Toda loja, na masmorra, na cidade e nos povoados, também tem uma pilha de 5 garrafas vazias: encha uma em qualquer água sob seus pés ou ao seu lado, ou num pote de alquimia, para ter uma garrafa de água. Despejada ao seu lado ou em você mesmo (a garrafa fica com você) ou arremessada, a água apaga fogo, ensopa quem estiver ali e deixa uma poça no chão descoberto.\n\nO Goo deixa uma motosserra que se prende ao seu braço e funciona com orvalho e, metade das vezes, um _Sr. Destructo_. Arremesse-o para montar uma torreta; quando ele quebrar, recarregue-o num poço de transmutação ou com o engenhoqueiro da cidade, em troca de um cogumelo chapéu-de-sapo. Todo chefe deixa 1 ou 2 núcleos de obra-prima.\n\nA água de um poço mágico segue a lua sob a qual ele foi encontrado: lua cheia cura você por completo e abençoa um ankh, lua nova identifica seus itens e revela o andar, quarto crescente ou minguante transmuta o que você joga nele. Transmutar uma Poção da Força dá uma _Poção do Poder_, que não sai de nenhum outro lugar. Uma sala de altar dá um prêmio conforme o dia da semana: armadura no Dia da Pedra, arma no Dia da Forja, poção no Dia da Maré, varinha no Dia da Tempestade, anel no Dia da Sombra, semente no Dia da Colheita, artefato no Dia da Luz.\n\nLargue um item aprimorável, um pergaminho ou uma poção numa devora-aprimoramentos e ela o come: um item aprimorado pode voltar como gosma de aprimoramento (mais provável quanto maior o nível), um pergaminho ou uma poção volta como gosma 1 vez em 10, e o resto vira semente. Ela não mexe em mais nada. Procurar esvazia as estantes ao seu redor; uma estante revirada, ou queimada enquanto você tem visão mental, raramente guarda a folha do Cofre ou da Caverna do Dragão do diário.
guide.topic_meta=Um explorador morto escreveu este guia, e as páginas dele estão espalhadas pelo mundo. A página de um andar fica no andar de baixo, então você nunca lê adiantado. Pegue uma e ela fica no guia em todas as partidas seguintes. A página de um chefe se escreve sozinha na primeira vez que você o enfrenta; um lugar na superfície, nas montanhas ou nas Cavernas Profundas escreve a sua página quando você chega lá pela primeira vez. Páginas não lidas brilham, e a busca acha uma página por qualquer palavra dela. O capítulo Primeiros Passos ensina o básico, cada página quando a lição dela aparece pela primeira vez. Nada se escreve sozinho até você descer à masmorra pela primeira vez.\n\nToda partida começa na cidade, na superfície; o portão norte dela desce para o andar 1. Cada região tem cinco andares com um chefe no quinto (5, 10, 15, 20, 25), e o _Amuleto de Yendor_ está no 26. Há lojas nos andares 6, 11 e 16, e no 20 o imp abre uma se a missão do cofre dele deu certo.\n\nOs chefes deixam folhas do _Diário de Otiluke_; veja esse capítulo.\n\nA partir do andar 2, metade dos andares tem uma característica, anunciada quando você chega: inundado, gramado, escuro, extenso, com armadilhas, com segredos ou abissal. Um andar escuro reduz sua visão a cinco oitavos, e os monstros dele voltam 50% mais rápido. Um andar extenso tem 50% mais salas, um terço a mais de monstros, dois itens a mais e uma refeição extra.\n\nNos primeiros andares, cada andar tem 2 ou 3 armadilhas escondidas, e até 7 no andar 20; um andar com armadilhas tem muito mais, e as extras ficam visíveis. Portas entre salas ficam escondidas com mais frequência quanto mais fundo você vai; no andar 20 quase todas estão. Procure em becos sem saída e em falhas no mapa. Cada região tem 2 ou 3 salas secretas. Uma chave de ferro só abre portas do próprio andar.\n\nCair num abismo tira pelo menos metade da sua vida atual e deixa você sangrando.
guide.topic_plants=As plantas seguem as estações. Plantas selvagens se espalham mais rápido na primavera e mais devagar no inverno, e no inverno as de clima quente (Flor-de-fogo, Grama-solar) morrem primeiro. Plantas que você semeia nunca são eliminadas. A grama pisoteada volta a crescer em toda estação, menos no inverno.\n\nQuando você pisa numa planta selvagem, cerca de 3 vezes em 10 ela se solta e luta com você em vez de ser ativada: menos ao lado de paredes e grama alta, mais ao lado de água. Pés de frutinsossa, putrifrutas e tudo que você semeou nunca fazem isso. Matar uma costuma deixar a semente dela.\n\nUma semente pode ser plantada, comida (o efeito atinge você) ou esfregada numa arma corpo a corpo: os 5 golpes seguintes, mais um por aprimoramento, levam o efeito dela. Três sementes iguais viram a poção daquela planta; toda semente vira alguma coisa, menos a do pé de frutinsossa. Sementes misturadas viram algo aleatório. Três sementes de putrifruta viram uma Poção da Força.\n\nA Flor-de-fogo aquece o chão em volta e a Muda-de-gelo o esfria. A _Flor-buraco-negro_ congela a água próxima numa ponte que plantas de fogo podem derreter. Pisar nela tira metade da sua vida atual, joga você para outro ponto deste andar e deixa você gelado (uma Guardiã fica no lugar e ganha Poderes do Espaço-Tempo). Um monstro que pisa nela perde metade da vida e cai para a morte.\n\nCortar grama alta pode dar gotas de orvalho, sementes e bagas. Uma gota de orvalho colorida enche o odre com várias gotas de uma vez. Fogo murcha plantas; congelamento não. Uma planta murcha pode deixar a semente, com mais frequência na primavera.\n\nPisar num Cipreste-relógio congela o tempo ao seu redor; comer a semente dele deixa você em estase por 4 turnos. Um monstro que pisa num _Hipnocânhamo_ passa para o seu lado. O Campo (andar 27) é cheio de Grama-solar, Terraíz e Flor-estrela.
guide.topic_quests=Quem tem tarefas para você não pode ser ferido, então ajude ou ignore. Num jogo em grupo, cada herói cumpre a tarefa sozinho.\n\nO _fantasma triste_ aparece no andar 2, 3 ou 4 (sempre até o 4), e um gnoll arqueiro sempre surge no andar dele. Ele manda você atrás de um rato fétido (2), um gnoll trapaceiro (3) ou um grande caranguejo (4). Mate o alvo e escolha uma arma ou uma armadura; a que você recusar some.\n\nO _fabricante de varinhas_ espera no andar 7, 8 ou 9 e paga com varinhas. Se nenhum inimigo morreu desde que você chegou pela primeira vez ao andar 6, ele dá também uma varinha de adamantita, coisa que só a tarefa da vala comum permite; o mago a recebe de qualquer jeito. O ferreiro da cidade a usa para reforçar uma varinha. O _ferreiro_ do andar 12, 13 ou 14 manda você à mina dele atrás de ouro escuro. O _Imp Ambicioso_ do 17, 18 ou 19 manda você a um cofre anão; se você se sair bem, ele abre uma loja no 20. O _Rei Rato_ dorme numa sala secreta do andar 5.\n\n_Cogumelos chapéu-de-sapo_ ficam nos andares 2 e 11 e na fortaleza (32). Troque-os com os engenhoqueiros. O engenhoqueiro do andar 2 (há outro na cidade) modifica seu odre: um condensador que o enche com a umidade do ar, ou um bico em que cada gota restaura um vigésimo da sua vida e mana. O outro engenhoqueiro da cidade aprimora ou recarrega o Sr. Destructo. O engenhoqueiro da fortaleza triplica o odre e acrescenta a modificação que você não tem.\n\nUm _ovo_ é moldado pelo que acontece com ele enquanto está no chão: 5 congelamentos chocam um dragão azul, 5 envenenamentos um violeta, 5 raios um verde, 30 queimaduras um vermelho (uma única queimadura faz um velocigalo), 10 invocações uma fada. Carregado, ele conta turnos: 2.000 para uma aranha, 10.000 para um escorpião. Quebre-o antes de qualquer uma dessas coisas e só sai gema.\n\nVocê só pode ter um mascote por vez. Ele sobe até o nível 20 matando inimigos e se cura devagar. Um mascote ao seu lado quando você usa uma escada vai junto, e enquanto ele segue você, chaves, livros, o Diário de Otiluke e o Palantír não funcionam. Bata nele três vezes e ele vai embora para sempre. O _Apito_ do último andar de enigmas o chama até você de qualquer lugar.
guide.topic_weather=O calendário segue o real: estações, fases da lua e dias da semana. O clima escorre pelas escadarias até os andares 1 a 15, mais fraco quanto mais fundo você vai; a partir do andar 16 não cai chuva nem neve. As regiões mais fundas têm o próprio calor: a metrópole é quente, os salões demoníacos muito quentes, os salões congelados abaixo de zero.\n\nNa superfície o clima acompanha o terreno: granizo e chuva congelada no lado frio de uma frente, nevascas sobre a neve, tempestades de areia no deserto. Numa tempestade elétrica a céu aberto, um raio cai a até 10 quadrados de você a cada 3 a 8 turnos, raramente em você. As árvores atraem os raios: com uma ao alcance, metade deles cai numa árvore (nunca numa ao seu lado), que queima até virar carvão. Quem é atingido perde de um quinto a um terço da vida e fica aturdido por um turno; o choque pula para quem estiver ao lado, e a grama por perto pega fogo. Nenhum raio cai em lugar fechado. Nos andares 1 a 15, nuvens de tempestade chegam flutuando e cada uma solta pelo menos um raio: saia de baixo delas.\n\nSeu corpo tem temperatura. Quando ela cai abaixo de -5 graus à noite, no vento ou na neve, ou enquanto você está encharcado, você pega _hipotermia_: anda mais devagar, se esquiva menos, sofre dano a cada 20 turnos e às vezes congela por inteiro. Esquentar, pegar fogo ou ficar ao lado de uma tocha de parede acaba com ela. Acima de 35 graus você pega _insolação_: a fome sobe mais rápido e você sofre dano, mais quanto mais quente estiver; acima de 45 você pode desmaiar. Entrar num prédio da cidade ou numa casa de vila acaba com as duas, e uma noite na estalagem também. A armadura de pano é a que mais esquenta, a de couro um pouco; a de malha pega rápido a temperatura do ar, a de placa devagar. O glifo de _Enxofre_ dá aquecimento. Um traço de aquecimento na armadura e uma empunhadura quente na arma em sua mão só combatem o frio; uma armadura de resfriamento deixa você mais fresco no calor, e um corta-vento diminui a sensação de frio do vento.\n\nChuva forte deixa você encharcado, e uma garrafa de água despejada ou jogada em você também: pergaminhos que você lê falham 3 vezes em 20, qualquer fogo em você se apaga, o próximo fogo que pegaria em você só deixa você seco, e o frio causa metade a mais de dano em você e os raios um quinto a mais. Monstros encharcados sofrem o mesmo. Andar pela água encharca suas botas: 2 de furtividade a menos e mais frio até elas secarem. Uma armadura de passos silenciosos mantém as botas molhadas sem barulho, e uma armadura impermeável segura a chuva por alguns turnos e encharca suas botas com menos frequência. Vento forte estraga a mira a distância. A noite, as nevascas e a neblina encurtam sua visão.\n\nÀ noite os monstros voltam duas vezes mais rápido (mais rápido ainda na lua nova, mais devagar na lua cheia), você ganha 2 de furtividade (mais 1 na lua nova), e os mortos-vivos batem um quarto mais forte. Mortos-vivos e demônios ficam mais rápidos no escuro e mais lentos sob sol forte, e raios de luar os queimam. Uma lua de sangue dobra o dano dos mortos-vivos, deixa a mira dos inimigos em você um quinto mais certeira e faz os monstros voltarem quatro vezes mais rápido, mas você bate um quarto mais forte em demônios e eles deixam itens com mais frequência. Um eclipse solar dá 3 de furtividade e uma esquiva melhor, mas mira pior, faz os mortos-vivos baterem metade a mais e deixa as salas de tesouro geradas durante ele destrancadas e com 100 a 200 de ouro a mais. Uma _aurora_ numa noite limpa de inverno aumenta as chances de drop em cerca de três quartos e sua mira um pouco; um arco-íris depois da chuva aumenta os drops em um quinto. As bênçãos da aurora, do arco-íris e do eclipse só valem na superfície e nos andares 1 a 15.\n\nO verão deixa todo ataque cerca de 15 por cento mais forte, os seus e os deles; o inverno os deixa mais fracos. O outono é a estação que mais dá saque e ouro, e o verão a que menos dá. Dia da Forja e Dia da Tempestade fortalecem os ataques, Dia da Maré acelera a cura, Dia da Sombra dá furtividade, Dia da Colheita dá saque.\n\nO feitiço _Mudança de Estação_ (preparado com um Pergaminho de Mapeamento Mágico e uma Poção da Armadura de Barro) transforma cada planta do andar na sua semente. A luz solar pura de uma Poção Ultravioleta ou de uma carnívora-solar cega tudo o que estiver nela, e a cada turno que um inimigo passa nela ele tem uma chance em duas de morrer.
guide.town_dolyahaven=Seis prédios se abrem para a praça da cidade. A maioria dos moradores trabalha de dia e dorme na estalagem; lojas e comerciantes fecham à noite.\n\nO arco-portal da praça está sempre aceso e é de graça. Ele leva você a qualquer arco aceso de loja em que você já tocou, e todo arco aceso traz você de volta para junto do arco da praça, por 150 de fome por viagem.\n\nA _loja_ tem dois vendedores: pergaminhos de um lado do balcão, mercadorias gerais do outro. O estoque se renova a cada cinco dias e se repõe conforme você compra; um Pergaminho do Aprimoramento, adubo e munição de arma de fogo estão sempre nas prateleiras. Eles compram quase tudo; o minério de pedra das minas vale 1.000 de ouro cada pedaço.\n\nA _igreja_: uma vez por dia o bispo abençoa você por 100 turnos em troca de um dízimo, e o pedestal fortalece, rerrola ou adiciona encantamentos e glifos em troca de energia alquímica. A _cartomante_ identifica três itens por semana em troca de ouro. A _biblioteca_ vende páginas de diário do minerador, cada uma sobre um andar, mais caras a cada vez. O _cinema_ vende um ingresso que traz sorte por 100 turnos, o dobro do tempo sob lua cheia.\n\nA _estalagem_: uma cama faz você dormir até o amanhecer, acaba com frio, calor e botas molhadas, e restaura um terço da sua vida. A refeição quente da criada deixa você saciado e aquecido por 30 turnos. O bardo toca de graça uma vez por dia e alivia seu cansaço. O mercenário vende 3 pontos de habilidade por chefe que você matou.\n\nNas ruas: o guarda anuncia uma recompensa por dia por um monstro de logo abaixo do seu andar mais fundo. Um morador bem vestido compra uma peça aprimorada por dia pelo dobro do preço da loja. O guarda e um aldeão dão, cada um, um _Farol de Retorno à Cidade_ na primeira vez que você fala com eles. Dois engenhoqueiros trocam por cogumelos chapéu-de-sapo: um modifica seu odre, o outro aprimora ou recarrega o Sr. Destructo. O ferreiro da cidade transforma equipamento em obra-prima em troca de núcleos, funde núcleos de minério ou de fragmentos de estrela, e reforça um item com adamantita por 50 de ouro escuro. Nove baús estão espalhados pela cidade; cada um pode ter um ovo, sementes, comida, um Sr. Destructo, uma bomba ou algumas moedas.
guide.town_dragoncave=Só a folha da Caverna do Dragão do Diário de Otiluke leva até aqui (veja O Cofre para saber como achá-la). Você chega pelo lado oeste. Não há escadas nem monstros; leia o diário para sair.\n\nUm lago de _armadilhas tosquiadoras_ ocupa o meio e é o único caminho para o leste. Cada armadilha tira metade da sua vida atual quando você pisa nela e depois para de funcionar; com um décimo da vida máxima ou menos, ela mata você. Levitar não adianta. Pise numa armadilha, descanse até encher a vida, pise na próxima; a trilha que você abrir continua segura na volta.\n\nNa primeira visita cada esqueleto guarda de 400 a 800 de ouro, às vezes um Pergaminho do Aprimoramento no lugar; nas visitas seguintes, de 1 a 100. O _ovo de dragão das sombras_ fica no sudeste, atrás de uma porta secreta na passagem leste, só na primeira visita.\n\nCarregue o ovo por 10 turnos e depois quebre-o com um quadrado livre ao seu lado e nenhum outro mascote. O sopro do dragão das sombras bate três vezes mais forte que a mordida.
guide.town_overview=Toda partida começa aqui. O portão norte da cidade desce até o andar 1. A escadaria da praça leva às minas dos kupuas: nove andares (56 a 64) e um andar selado no 65, onde fica o _Palantír_ para a prisão de Zot. Nas minas você só enxerga 2 quadrados, e não há armadilhas.\n\nKupuas sofrem só de 1 até metade de qualquer dano, e gullins de 1 até um quarto, exceto os golpes de uma _arma relíquia_. Você forja uma com as _Pedras Norn_ que os gullins soltam, no altar do templo a leste da praça. Depois que você liberta Otiluke, a escada das minas fecha pelo resto da partida.\n\nEm noites de lua cheia, ratos espectrais andam pelas minas, mais ainda depois que escurece de vez.\n\nA folha da Caverna do Dragão do diário abre o andar 67, onde espera um ovo de dragão das sombras.
guide.zot_level=Você chega num pedestal numa sala pequena cercada de paredes. Não há escadas, e o andar fica trancado até Zot morrer, então o Palantír não leva você de volta antes disso.\n\nA parede norte da sala é uma fileira de cinco armadilhas de invocação visíveis, cada uma chama de um a três olhos demoníacos. Saia pela porta sul.\n\nZot aparece fora da sua vista no momento em que você sai dessa sala, com um "..." no log. Nada mais surge, e o andar não tem saque.\n\nQuando Zot morre, tudo o que ele criou morre junto e Otiluke aparece onde ele caiu. Fale com ele: ele dá um _Farol de Retorno à Cidade_ se você não tiver um. Depois use o Palantír para voltar.
guide.zot_overview=A prisão de Zot é o andar 99, e só se chega lá pelo _Palantír_. Ele fica no andar 65, no fundo das minas sob a praça da cidade, guardado pelo golem de pedra Otiluke.\n\nVocê precisa de uma _arma relíquia_ contra Zot: largue três _Pedras Norn_ no altar da cidade para forjar uma. Os gullins das minas as soltam, cinco por partida no máximo.\n\nO Palantír faz uma viagem de ida e volta: até o 99 e depois de volta para onde você o usou. Ele não funciona em andares de chefe, em andares trancados, nem enquanto um mascote segue você.\n\nMatar Zot não acaba com a partida. Fale com Otiluke depois e ele se muda para a cidade; a escada das minas fica selada pelo resto da partida.
