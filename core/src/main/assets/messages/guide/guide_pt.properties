guide.hs_overview=No mundo lá fora você pode construir em qualquer lugar: na superfície, em cada camada das montanhas e em cada camada das cavernas. Não dá para construir na masmorra nem na cidade, em escadas ou nas passagens entre camadas, em tumbas seladas ou campos de vila, nem em nada de que uma vila ou um lugar do mundo seja feito.\n\nO _armazém geral_ da cidade vende uma _ferramenta do construtor_ (150 de ouro) e uma _sacola do construtor_ (120 de ouro), pelos preços da cidade, que sobem com o andar mais fundo que você alcançou. Quando você tem as duas, aparece a prateleira de ferramentas: um _machado de lenhador_ e uma _marreta de pedreiro_ (200 cada), uma pá, uma foice e corda a 12 o rolo. A sacola guarda 30 pilhas: materiais de construção, baús portáteis e a ferramenta do construtor, e o que a rocha dá (minérios, gemas, minério de pedra, ouro escuro, pedras norn e núcleos de obra-prima). A construção tira dela primeiro.\n\nToda vila tem um _carpinteiro_ perto do poço, que vende tábuas, corda, palha, ferragens e vidraças pelo dobro do valor. Qualquer comerciante compra materiais de volta pelo valor deles.\n\nO que você constrói continua lá depois de todo salvamento e de toda viagem. Coloque uma _pedra do lar_ para fazer de um lugar o seu lar: você viaja entre lares, e lares atraem problemas.
guide.hs_gathering=_Derrubar árvores_: toque numa árvore ao seu lado enquanto carrega um machado. Um machado de lenhador leva 3 golpes, um machado grande 4, um machado de batalha 5, um machado 6 e uma machadinha 8; vale o machado na sua mão, ou então o mais rápido que você carrega. Todo machado é uma arma Lenhador: derruba com cerca de um quinto menos golpes a cada nível de tipo e às vezes dá uma tora a mais. Cada golpe acorda os monstros a até 8 quadrados e os chama. A árvore cai para longe de você, e quem estiver onde ela cair perde um terço da vida que resta. Um carvalho dá 3 a 4 toras de carvalho; um pinheiro dá 2 a 3 toras de pinheiro, e resina 3 vezes em 10. Um carvalho solta uma _bolota_ e um pinheiro uma _pinha_ 1 vez em 2. O toco volta a crescer: vira muda depois de 4 dias de primavera ou verão, e árvore depois de 14. Dá para andar por cima de um toco; segure o toque num toco ao seu lado com o machado para arrancá-lo (mais uma tora), e ele não cresce mais. Um machado também limpa um _arbusto_ com metade dos golpes de uma árvore, deixando grama e, 1 vez em 2, uma _semente de arbusto_. Árvores e arbustos de vila não podem ser cortados.\n\n_Plantio_: uma bolota, uma pinha ou uma semente de arbusto vai na grama ou na terra nua bem ao seu lado. Ela brota como muda, ou como arbusto novo, e cresce durante a primavera e o verão: vira árvore depois de 14 desses dias, e arbusto depois de 6.\n\n_Pedra_: um pedregulho se parte em 2 a 3 pedras brutas, em 3 turnos com uma picareta, um martelo de guerra, um Martelo do Mestre ou uma ferramenta de mineração, ou em 2 com uma marreta de pedreiro, valendo a mais rápida que você carrega. Paredes de rocha que você minera dão 1 a 2 pedras brutas; a marreta de pedreiro também as minera, em 3 turnos. Um martelo, uma picareta ou uma pá Pedreira quebra pedra e cava com menos golpes, e às vezes traz uma pedra ou um minério a mais. Nas cavernas um pedregulho quebrado pode derrubar o teto, como qualquer golpe de picareta.\n\n_Pá_: transforme grama ou terra nua em canteiro (sai uma semente 1 vez em 10), cave argila das margens lamacentas de pântanos e rios e areia de praias e desertos (as duas só na superfície), ou arranque um toco para ganhar mais uma tora.\n\n_Foice_ ou foice de guerra: corte grama alta para ganhar 1 a 2 de palha; uma semente que cai às vezes vem em dobro.\n\nDerrubar árvores e quebrar pedregulhos dá um pouco de fome. Cervos e bisões sempre deixam um _couro cru_, cabras, yetis, camelos e jacarés 1 vez em 2, lobos 1 vez em 3.
guide.hs_building=Use a ferramenta do construtor. CONSTRUIR abre o menu de construção; DEMOLIR, CONSERTAR e EXAMINAR vão direto para a barra de construção. Você constrói a até 4 quadrados de onde está, em quadrados que consegue ver. No co-op só o anfitrião constrói.\n\n_O menu_ separa as peças em grupos, e Recentes guarda as últimas 8 que você construiu. Cada carta mostra o que você tem e o que ela pede, em verde ou vermelho, e quantas você pode pagar. Escolha uma carta para colocar essa peça.\n\n_A barra de construção_ toma o lugar da barra de ferramentas. Prévias verdes cabem, as âmbar estão sem material suficiente, as vermelhas não podem ir ali. Coloque uma peça por vez, ao longo de uma _linha_ (8 direções, até 64 quadrados) ou sobre uma _área_ (até 64 quadrados: pisos, telhados e caminhos a preenchem, paredes e cercas fazem só o contorno). O terceiro toque constrói a forma, uma peça por vez; ele para quando um monstro aparece, quando você se fere ou quando toca no mapa. Um toque fora do seu alcance leva você até lá.\n\n_Demolir_ devolve metade dos materiais; uma estação pede confirmação antes e larga o que guarda. _Consertar_ custa um quarto da peça. _Examinar_ mostra a vida de uma peça e o cômodo de que ela faz parte.\n\n_Paredes_: de toras (2 toras de carvalho, 40 de vida), de tábuas (3 tábuas, 60), de pedra (3 pedras brutas, 120), de tijolos (2 tijolos cozidos e uma argila, 160). Uma janela custa uma vidraça e um material da parede dela (20 de vida). Uma porta custa 4 tábuas; uma _porta com tranca_, 4 tábuas e 2 ferragens, e só você e seus aliados conseguem abri-la. Pisos de tábuas ou de pedra e caminhos de pedras custam 1 tábua ou 1 pedra bruta. Cerca: 1 tábua; porteira: 3 tábuas e uma corda; paliçada: 2 toras de carvalho; ponte de tábuas: 3 tábuas, colocada sobre a água.\n\n_Telhados_ (de palha, tábuas, ardósia, telhas ou vidro) vão sobre pisos e paredes a até 4 passos de uma parede que os sustente. O telhado sobre você some enquanto você está dentro.\n\nParedes de toras e de tábuas, portas, cercas, porteiras, paliçadas e telhados de palha ou de tábuas pegam fogo. Bombas, picaretas, fogo e monstros arrombando desgastam as peças; uma peça destruída deixa entulho, que Demolir limpa. Uma picareta só golpeia sua própria construção quando você segura o toque nela; um toque simples a deixa em paz. Um raio num telhado atinge o telhado, não você, e põe fogo na palha ou nas tábuas.\n\n_Tochas_: no mundo lá fora, use FINCAR numa tocha para pô-la no chão ao seu lado. Ela queima para sempre, ilumina o chão em volta e, como uma lareira acesa, impede animais selvagens de se instalarem a até 10 passos. Toque nela para pegá-la de volta.
guide.hs_stations=_Estações_ levam 10 turnos para construir: bancada (6 tábuas), bancada de pedreiro (4 pedras brutas, 2 tábuas), forno (8 pedras brutas, 4 de argila), lareira (6 tijolos cozidos, ou 8 pedras brutas), caldeirão (2 ferragens, 2 tijolos cozidos), cavalete de curtume (4 tábuas, 2 cordas), forja (10 tijolos cozidos, 4 ferragens) e moinho de mão (4 pedras talhadas). Seu próprio _pote de alquimia_ custa 800 de ouro e 4 tijolos cozidos, e um _pedestal de encantamento_ 1.500 de ouro e 4 pedras talhadas, pelos preços da cidade. O ouro nunca é devolvido.\n\nToque numa estação para pôr na fila até 4 trabalhos de até 20 lotes cada; tudo o que um trabalho precisa é tirado de uma vez. As estações continuam trabalhando enquanto você está longe.\n\n- Bancada: uma tora vira 3 tábuas; 3 de palha, uma corda; resina e uma tora de carvalho, ou carvão vegetal e uma tábua, 2 tochas; 2 penas de urubu e uma tábua, 5 dardos; um dente de jacaré e uma tábua, 2 lanças de pesca.\n- Bancada de pedreiro: 2 pedras brutas viram uma pedra talhada.\n- Forno: 2 de argila viram 2 tijolos cozidos; 2 de areia, uma vidraça; uma tora, 2 de carvão vegetal. Uma árvore que queima até o fim também deixa 1 a 2 de carvão vegetal nas cinzas.\n- Cavalete de curtume: um couro cru vira couro, em 300 turnos.\n- Forja: minério de ferro vira 4 ferragens; 2 ferragens e 2 tábuas viram um machado de lenhador ou uma marreta de pedreiro.\n- Moinho de mão: 2 espigas de milhotrigo viram farinha.\n- Lareira: farinha vira pão, que sacia tanto quanto uma ração e meia; carne crua vira carne grelhada.\n- Caldeirão, sem energia alquímica: carne cozida, uma frutinsossa cozida com uma semente que você escolhe, e torta de carne.\n\nO forno, a forja e a lareira só funcionam acesos. Encha o espaço de combustível (até 20 peças) com toras, que queimam por 200 turnos, ou carvão vegetal, por 400, e acenda. Uma lareira acesa aquece o cômodo em 16 graus, uma forja em 8 e um forno em 6, e animais selvagens ficam a 10 quadrados de distância de uma lareira acesa.\n\nUma _oficina_ (uma bancada e outra estação no mesmo cômodo) trabalha um quarto mais rápido.
guide.hs_rooms=Um _cômodo_ é um piso fechado por todos os lados por paredes, janelas e portas (a rocha de uma caverna conta), com pelo menos uma peça construída entre elas, no máximo 600 quadrados, e pelo menos 8 décimos dele cobertos; nas cavernas a rocha acima já serve de telhado. Cercas, porteiras, paliçadas e árvores deixam brechas. Um cômodo fica _vedado_ enquanto todas as portas estão fechadas e nenhuma parede construída está abaixo da metade da vida.\n\n_Camas_ pegam fogo. A de palha (4 de palha) cura um quarto da sua vida, a de madeira (6 tábuas, 2 de palha) um terço, a de peles (4 tábuas, 3 couros) metade. Durma até a próxima parte do dia ou até o amanhecer, como num saco de dormir; a fome avança a um quarto do ritmo. Nada encontra você dormindo num cômodo vedado. Em outros lugares você pode ser encontrado, metade das vezes se um fogo aquece o cômodo ou se há uma fogueira a até 2 quadrados. Uma cama de peles mantém você aquecido, a não ser que o cômodo esteja abaixo de -10 graus, e acaba com o frio enquanto você dorme.\n\nUma noite inteira numa cama, até o amanhecer, deixa você _bem descansado_: 10% a mais de experiência e cura 10% mais rápida até o anoitecer (por menos tempo do dia num cômodo mais simples).\n\n_Conforto_, de 0 a 20: um ponto a cada 6 quadrados (até 4); o material das paredes (toras 1, tábuas e rocha 2, pedra 3, tijolo 4); até 4 por pisos construídos e tapetes; um ponto por tapete, estante, estátua ou decoração (até 5); e 3 enquanto um fogo aquece o cômodo. Ele aparece como Vazio a partir de 0, Simples a partir de 4, Aconchegante a partir de 8, Confortável a partir de 12 e Refinado a partir de 16. O conforto aumenta a cura de uma cama em até metade a mais, nunca além da metade da sua vida.\n\n_Tipos de cômodo_: uma cama faz um quarto. Uma lareira ou um caldeirão faz uma cozinha: uma torta de carne comida ali, ou feita num caldeirão ali, deixa você bem alimentado por metade a mais do tempo. Dois baús fazem um depósito, onde cada baú guarda 10 a mais. Uma estátua ou um altar faz um santuário, onde uma noite inteira de sono abençoa você com cura 10% mais rápida por um dia. Uma bancada e outra estação fazem uma oficina, e vidro sobre metade do piso faz uma estufa.\n\nUm tapete custa 2 couros, uma estante 4 tábuas (com piso livre ao sul dela), uma estátua 4 pedras talhadas.
guide.hs_shelter=Sob um _telhado_, chuva e neve não chegam até você, embora a palha deixe passar 1 gota em 5; o vento ainda chega.\n\nNum _cômodo_ não sopra vento nem cai chuva ou neve, e o ar tende a 15 graus na medida em que as paredes o seguram: toras 0,3, tábuas 0,4, pedra 0,5, rocha 0,6, tijolo 0,7, janela 0,2 e porta 0,3, na média das paredes do cômodo. Um fogo lá dentro soma o calor dele: brasas como as de uma fogueira, 6 graus; uma lareira acesa, 16; uma forja, 8; um forno, 6. EXAMINAR mostra o quanto um cômodo está quente. Num cômodo aquecido por um fogo você fica _aconchegado_, e nem o frio nem o calor podem ferir você.\n\nSob um telhado ou num cômodo não cresce planta selvagem nem aparece animal selvagem. Um raio nunca cai no piso descoberto de um cômodo, e um raio que atinge um telhado para ali. Animais selvagens nunca aparecem a até 10 quadrados de uma pedra do lar ou de uma lareira acesa. Lá dentro você ouve a chuva no telhado, e paredes construídas bloqueiam o som como a rocha.\n\nNo mundo lá fora, o frio e o calor machucam de acordo com o andar mais fundo que você alcançou.
guide.hs_farming=Faça um _canteiro_ com uma pá ou com o canteiro do menu de construção (grátis, 2 turnos, sobre uma área), e semeie qualquer semente nele. Ela vira uma _plantação_, que continua crescendo enquanto você está longe.\n\n_Estações_: plantações crescem um quarto mais rápido na primavera, a três quartos da velocidade no outono e nada no inverno. Sob vidro (um telhado de vidro sobre a plantação, ou uma _estufa_: um cômodo com vidro sobre pelo menos metade do piso) elas crescem no ritmo do verão o ano todo e nunca congelam.\n\n_Água_: cada quadrado de água ao lado de uma plantação (até 4) encurta os ciclos dela e diminui a chance de ela murchar, e um poço a até 2 quadrados conta como 2. Plantações que gostam de água ganham o dobro. Cave um _canal de irrigação_ (grátis, 4 turnos, ao longo de uma linha) saindo da água, ou construa um _poço_ (8 pedras brutas e uma corda).\n\nO primeiro ciclo de uma plantação a amadurece. Colha uma plantação madura com uma _foice_ ou uma foice de guerra na mochila: um pé de frutinsossa dá 1 a 2 frutinsossas, o milhotrigo 2 a 3 espigas, um damasqueiro um damasco, a uva-de-goblin 2 uvas, a flor-de-ovo um ovo vegetal, um tomateiro 1 a 2 tomates com pavio, e qualquer outra plantação a própria semente, que o tipo da lâmina às vezes dobra. Se ninguém colher, cada ciclo seguinte solta uma semente ao lado dela ou a faz murchar.\n\n_Geada_: uma plantação ao ar livre morre quando o quadrado dela fica abaixo de -2 graus. Enquanto você está longe, qualquer dia de inverno mata as plantações ao ar livre, mas não as que estão num cômodo, sob vidro ou nas cavernas.\n\n_Pragas_: à noite, coelhinhos e cervos a até 12 quadrados vão atrás de qualquer plantação que nenhuma cerca proteja. Chegue a até 5 quadrados para espantá-los. Enquanto você está longe, cada noite fora do inverno eles comem uma plantação sem cerca a até 20 quadrados de uma pedra do lar.\n\n_Adubo_ dá um quarto do crescimento que falta no ciclo de uma plantação. Uma _composteira_ (4 tábuas) transforma cada 5 sementes, frutinhas, colheitas ou pedaços de carne crua em uma dose, 500 turnos depois que o lote enche.
guide.hs_animals=Cervos, cabras, coelhinhos, bisões e camelos nunca são domesticados: você laça um e o conduz. Um cavalo só aceita a corda depois de domado (Cavalos e Montaria). Com uma corda, use GUIAR para laçar um cervo, uma cabra, um coelhinho, um bisão ou um camelo a até 6 quadrados que você consiga ver, sem nada no caminho. Ele segue você e nunca foge enquanto está laçado. Você conduz 2 no máximo. Se um ficar mais de 6 quadrados para trás, a corda escorrega e volta para a sua mochila.\n\n_AMARRAR_ prende um animal conduzido a uma cerca, uma paliçada ou um _poste de amarração_ (2 tábuas) ao seu lado, e ele fica a um passo dali. Toque num animal amarrado para conduzi-lo de novo, soltá-lo ou abatê-lo.\n\nUm animal que está num _curral_, uma área fechada por todos os lados por cercas, paliçadas, paredes construídas e porteiras fechadas, fica ali para sempre e só anda lá dentro. Toque nele para abatê-lo.\n\n_Abater_ o mata na hora, sem dar experiência: um cervo, uma cabra, um bisão ou um camelo deixa 2 carnes misteriosas, um coelhinho 1, sempre com um couro cru.\n\nUm animal laçado ao seu lado vai junto entre camadas e nas viagens pelas pedras; um amarrado fica no poste. No co-op só o anfitrião laça, amarra e abate.
guide.hs_horses=Manadas de _cavalos selvagens_ pastam nas planícies e campinas durante o dia, de dois a quatro juntos. Um cavalo selvagem dispara se você chegar a 3 quadrados dele, e foge de lobos a 8. Ele não aceita corda.\n\n_Domar_: deixe comida no chão a até 4 quadrados dele e se afaste. Ele come _palha_, _espiga de milhotrigo_, _damasco_ ou _frutinsossa_ crua, um pedaço por vez, e cada refeição deixa você chegar um quadrado mais perto. Depois de três refeições ele não foge mais de você: toque nele para dar comida na mão, e essa quarta refeição o torna seu. Um cavalo encurralado ou num curral pode comer na sua mão desde o começo. Bata num cavalo selvagem e ele esquece todas as refeições.\n\nUm cavalo domado espera onde você deixar e nunca vai embora. Puxe ele na _corda_ ou amarre num _poste de amarração_ como qualquer animal, e toque nele para ver o menu.\n\nA _sela_ sai de um _cavalete de curtume_ (2 couros crus e uma corda) ou de um _cavalariço_ de vila. Toda vila com 5 casas ou mais tem um perto do poço, vendendo selas, feno e um cavalo selado por 200 de ouro, mais caro depois que você desce mais fundo na masmorra.\n\n_Montar_: toque no seu cavalo selado ao seu lado para subir (segure o toque para ver o menu dele) e toque em você mesmo para descer. Só dá para montar na superfície e nas montanhas, duas vezes mais rápido, então cada quadrado custa metade do tempo e metade da fome. Um cavalo nunca pula de um barranco. Você desmonta numa porta, debaixo de um telhado ou num cômodo, e na entrada de uma caverna, de um túmulo, da masmorra ou das casas da cidade; o seu cavalo espera ali. Cavalo não sobe em barco: ao lançar um barco ou embarcar, você desmonta na beira d'água e ele espera na margem. Subindo e descendo as escadas das montanhas, e pelas pedras até a superfície ou as montanhas, ele vai junto.\n\nNão dá para golpear de cima da sela: um ataque corpo a corpo faz você desmontar antes, e o cavalo sai do caminho. Atirar, arremessar e usar varinhas funciona montado. O seu cavalo leva um terço de cada golpe que acerta você, e se a vida dele acabar ele morre e você cai de pé. Ele recupera um ponto de vida a cada 10 turnos, e um quarto da vida quando você dá comida. No co-op só o anfitrião doma, sela e monta.
guide.hs_homes=Um _lar_ é o terreno a até 15 quadrados da pedra do lar dele, na mesma camada.\n\nCada lar tem uma _visibilidade_: o quanto de problema ele atrai. Ela é calculada quando o lar entra no seu campo de visão, ao anoitecer e a cada 20 turnos enquanto você está lá, e o REGISTRO da pedra do lar a mostra parte por parte. Ela ganha um ponto a cada 100 de ouro do que os baús do lar guardam (uma bolsa conta o que tem dentro), até 40; um ponto a cada 2 plantações, até 15; um ponto a cada 20 peças construídas, até 15; e, à noite, 5 por fogo aceso e por janela de cômodo aquecido, até 20. Ela perde até 25 por paredes de pedra e de tijolo, 5 por porta com tranca (até 10), até 15 por uma paliçada em volta de tudo, 10 por uma torre de vigia e 5 por um sino de alarme.\n\n_Cercos de lobos_ vêm em noites de inverno para lares em floresta, campo de neve ou tundra a céu aberto: 1 noite em 4, ou 1 em 2 com visibilidade acima de 30. Uma alcateia de 3 a 5 lobos caça você. Se não conseguem chegar até você, eles rondam a 4 a 8 quadrados de distância e mordem cercas e porteiras, nunca paredes, janelas, portas ou paliçadas, e vão embora ao amanhecer.\n\n_Ataques de bandidos_ só vêm com visibilidade acima de 30: 1 noite em 6, ou 1 em 3 perto de um reduto de bandidos. Um bando de 3 a 6 vem atrás do baú mais rico, invade pelo ponto mais fraco, cada um leva até 4 coisas, as mais caras primeiro, e foge; quem for abatido larga o que pegou. Eles vão embora ao amanhecer, ou quando o baú fica vazio. Saqueadores, yetis, brutos e qualquer um com machado ou martelo atravessam o que você construiu; os outros monstros esperam do lado de fora.\n\n_Enquanto você está longe_ nada acontece; as noites são acertadas quando você volta. O primeiro ataque de uma ausência esvazia o baú mais rico e arromba a porta ou porteira mais próxima, e nenhuma ausência custa mais de um baú. Uma noite de cerco desgasta as 4 cercas ou porteiras mais externas. O registro guarda o que aconteceu.\n\n_Defesas_: uma _torre de vigia_ (8 tábuas, 4 toras de carvalho, 2 cordas): suba nela para enxergar 4 quadrados mais longe e avistar lobos e bandidos a até 30. Um _sino de alarme_ (2 ferragens, 2 tábuas, uma corda) acorda você quando qualquer coisa hostil entra no terreno do lar enquanto você dorme, e encerra seu sono mais cedo quando chega um cerco ou um ataque; sem sino você dorme durante tudo e acorda com o que eles fizeram. _Armadilhas de estacas_ (2 ferragens, uma tábua) empalam e aleijam só monstros, e se rearmam depois de 20 turnos. O mapa-múndi mostra um lar sob ataque como uma marca vermelha piscando.
guide.hs_travel=Uma _pedra do lar_ (10 pedras brutas e 2 pedras talhadas; 200 de vida, não queima) transforma o lugar onde está em um lar, com o nome do lugar mais próximo. Toque nela para viajar, renomear o lar ou ler o registro. Você pode ter 3 lares; desmontar uma pedra do lar acaba com o lar dela, e o menu de construção pergunta antes.\n\nHá _pedras do caminho_ ao lado da praça da cidade e junto ao poço de todo povoado com 9 casas ou mais. Toque em uma para sintonizá-la pelo resto da partida.\n\nAo lado de uma pedra do lar ou de uma pedra do caminho sintonizada, você pode viajar para qualquer lar seu e qualquer pedra do caminho sintonizada, em qualquer camada. O tempo não passa e nada ataca você no caminho. Custa só _fome_: meio ponto por quadrado da linha reta entre as pedras, mais 60 por camada acima ou abaixo, no máximo 450. O efeito Bem alimentado paga primeiro. Uma viagem que levaria você além de Morrendo de fome custa vida, e uma que mataria você é recusada. Você não pode viajar levitando, enraizado ou com um inimigo à vista. No co-op só o anfitrião viaja, e o grupo vai junto. Um animal que você guia na corda, ao seu lado, também vai.\n\nO mapa-múndi marca seus lares e as pedras do caminho que você conhece. Estradas, trilhas de vila, caminhos de pedras e pontes são um décimo mais rápidos de percorrer.
guide.hs_catching=Um _puçá_ pega a vida miúda ao seu redor. Use PASSAR num bichinho a até 3 passos que você consiga ver: ele vai para um _pote_ conforme a chance dele, ou escapa. Cada passada gasta um turno; não dá para passar o puçá num lugar vazio. Os bichinhos fogem quando você chega perto, então pare a alguns passos antes de passar.\n\nNa superfície o puçá pega _borboletas_, sobre os prados e as planícies em dias calmos e limpos de primavera e verão, e _vaga-lumes_, nas noites de verão sobre os prados e as matas e em qualquer noite seca sobre os brejos. Na masmorra ele pega a vida miúda dos andares: _mariposas_ em volta das tochas, _moscas_ na teia do ninho, _besouros_ e besouros-brasa, baratas, centopeias, traças, aranhas, _caracóis_, percevejos-d'água, _rãs_, tritões e lagartixas. Pássaros, lebres, ratos, peixes, morcegos e salamandras de fogo são grandes ou rápidos demais para ele.\n\n_Bichinhos espertos_: em cada trecho de terra, os 3 primeiros bichinhos que você pega no dia vêm com a chance deles; o 4º vem com três quartos dela, o 5º com metade, o 6º com um quarto, e depois disso nenhum até o dia seguinte. Um trecho é um quadrado de 64 por 64 quadrados numa camada do mundo, ou um andar inteiro da masmorra.\n\nUm bichinho num pote é isca para uma _vara de pesca_, cada tipo o favorito do seu próprio peixe. SOLTAR deixa o bichinho ir embora.\n\nFaça um puçá numa _bancada_ com uma _tábua_ e um rolo de _corda_, ou compre um do vendedor de sementes de uma vila, e às vezes do vendedor de comida. No co-op só o anfitrião pega bichinhos.
guide.hs_fishing=Use LANÇAR com uma _vara de pesca_ em água aberta que você consiga ver, a até 4 passos: um rio, um lago, o mar, as poças de um brejo, um poço nas cavernas ou um lago nas montanhas, de uma margem, de uma ponte ou de um barco. Lance no _gelo_ ao seu lado e você abre um buraco nele e desce a linha. Só as águas do mundo têm peixes que mordem anzol: as da masmorra não têm nenhum.\n\nCada lançamento põe uma _isca_ no anzol: a que você escolheu com ISCA, ou então a primeira que você carrega, _minhocas_ antes dos potes. Minhocas aparecem 3 vezes em 10 quando sua _pá_ ara a grama ou a terra nua, 6 em 10 na chuva; um _puçá_ pega bichinhos para os potes. Cada peixe tem a sua isca favorita.\n\nDepois você descansa e fica de olho na _boia_. A espera é de 4 a 8 turnos, mais curta quanto mais os peixes daqui estão mordendo agora, mais longa quando a isca, a hora, a estação ou o tempo não agrada a eles; nunca menos de 2 turnos nem mais de 18. A boia treme no turno antes da fisgada. Quando um peixe morde, você desperta: use RECOLHER em até 3 turnos para tirá-lo da água, ou ele escapa com a isca. Se você sair do lugar, a linha volta. A isca se gasta aconteça o que acontecer.\n\nUm peixe cru sustenta pouco. Grelhe numa _lareira_ acesa ou em qualquer fogueira, ou cozinhe num _caldeirão_, e ele sustenta bem mais e cura um pouco. As vilas na beira da água têm seus _pescadores_: fale com um no trabalho para vender todos os seus peixes crus por uma vez e meia o valor, ou para comprar uma vara ou um punhado de minhocas. Você também pode fazer uma vara numa bancada com uma tábua, um rolo de corda e _ferragens_. No co-op só o anfitrião pesca.
guide.hs_fish=O que morde depende da água, da isca, da hora, da estação e do tempo. Num poço de caverna só a água e a isca contam.\n\n_Truta-de-riacho_: rios e lagos das montanhas, às vezes um lago. Gosta mais de insetos alados, e morde de madrugada e ao entardecer, na primavera e no outono, e na chuva.\n_Perca_: lagos, rios, brejos e os buracos no gelo. Minhocas e bichinhos rasteiros, de dia, no verão e com tempo bom.\n_Lúcio_: lagos e brejos, às vezes rios e o gelo. Uma rã, um tritão ou uma lagartixa vivos, ao entardecer e de madrugada, no outono. A refeição maior.\n_Bagre_: os brejos acima de tudo, depois rios e lagos, às vezes um poço de caverna. Minhocas, à noite e ao entardecer, no verão, na chuva ou na tempestade.\n_Cavala_: só no mar. Morde qualquer isca; melhor de dia e no verão.\n_Truta-ártica_: os buracos no gelo e os lagos das montanhas. Minhocas e iscas que brilham, no inverno.\n_Peixe-cego_: pálido e sem olhos, só nos poços das cavernas debaixo do mundo. Uma isca que brilha atrai: um vaga-lume ou um besouro-brasa.\n\nDe vez em quando sobe outra coisa: uma _bota velha_, em qualquer lugar menos nas cavernas; uma _bolsa encharcada_ que derrama algumas moedas de ouro aos seus pés, às vezes com uma pedra rúnica; ou uma _mensagem na garrafa_, quase sempre do mar e dos rios. Leia o bilhete sob o céu aberto da superfície: ele fala de um esconderijo enterrado a 40 até 120 passos dali, e seu _mapa do mundo_ marca o lugar. No meio do mar ou no fundo das montanhas nada bate com o esboço: leia de novo em outro lugar. Cave ali, ou bem ao lado, com uma pá para achar um _baú_ com ouro, um anel ou uma varinha, e às vezes uma poção. Chão congelado não aceita pá até o degelo.
guide.boss_demonlord=300 de vida; ele acerta de 18 a 36 e deixa você gelado em um terço dos acertos. Quando ele acorda, o andar se tranca até ele morrer.\n\n_Sopro_: quando você está a até 4 quadrados e à vista dele, ele pode inspirar. O cone na sua direção se cobre de geada e uma contagem regressiva aparece sobre a cabeça dele; 3 turnos depois ele expira, causando de 20 a 40 de dano e deixando você gelado, e congela qualquer água no cone. Saia do cone ou ponha um dos seis pilares de gelo entre vocês. A mais de 4 quadrados de distância ele nunca sopra.\n\nAbaixo de metade da vida ele sopra com mais frequência, e dois _demônios de gelo_ (110 de vida, acertos de 20 a 35) saem do chão ao lado dele. Eles morrem junto com ele.\n\nSono, terror e vertigem não o afetam; queimaduras causam só metade do dano nele.\n\nEle deixa cair a _chave desgastada_ da porta trancada atrás do estrado dele, que leva de volta ao andar 22, e o _cristal climático_: um artefato que carrega em clima severo e, posto no chão, mantém todo quadrado num raio de 2 em temperatura amena por 300 turnos.
guide.boss_dragon=Todo covil de dragão no mapa tem um dragão. Ele tem 8.000 de vida e se move duas vezes mais rápido que você. A mordida causa de 150 a 300, e de qualquer ponto de onde veja você, ele cospe veneno que causa de 300 a 600.\n\nSe ele vir você, ponha rocha entre vocês e vá embora; em campo aberto você não escapa dele.\n\nO tesouro são três pilhas de 200 a 600 de ouro. Um dragão morto nunca volta, e nenhum outro dragão ocupa o covil. Só enfrente um com equipamento de túmulo e bastante nível, e só onde der para fugir.
guide.boss_spiderqueen=A _rainha aranha_ tem 120 de vida, morde causando de 12 a 20 e envenena em metade dos acertos. Fogo não a fere. Quando ela vê você, o andar se fecha até ela morrer.\n\nEnquanto caça, ela põe um ovo ao lado dela mais ou menos a cada 20 turnos, desde que haja menos de seis aranhas vivas. Um ovo tem 2 de vida e choca uns 20 turnos depois se você puder vê-lo: quebre os ovos pelo caminho.\n\nAbaixo de metade da vida ela para de atacar e recua, deixando a ninhada lutar. Não vá atrás dela no meio do bando. Limpe os ovos e as aranhas, encurrale a rainha e acabe com ela.\n\nEla deixa cair uma Poção da Cura, uma varinha aleatória e o _amuleto de aranha_, que chama uma aranha serva aliada ao custo de um quarto da sua vida máxima.
guide.deep_hazards=Da quarta camada de cavernas para baixo, bolsões de _grisu_ ficam em pontos baixos e fechados. Dentro de um, você sente o cheiro e vê uma névoa fraca; depois de três turnos você fica tonto. Uma chama no gás (sua tocha, uma criatura queimando, um raio de fogo, chão em chamas) faz o gás chiar, e depois da sua próxima ação ele explode. A explosão fere tudo dentro e ao lado do gás, você em até cerca de um terço da sua vida, e deixa fogo. Apague a tocha ou saia antes. Um bolsão que já explodiu fica vazio por três dias.\n\nMinerar pode derrubar o teto. Cortar rocha que sustenta o teto, ou rocha num trecho solto, pode fazer o teto ranger; rocha solta é mais comum quanto mais fundo. Depois da sua próxima ação, pedras caem naquele quadrado e nos vizinhos: até um terço da sua vida, aleijado, e entulho sobre parte da área. Cave onde o teto tem apoio.\n\nA água das cavernas quase nunca congela: as Cavernas Profundas continuam amenas seja qual for o clima lá em cima.
guide.deep_overview=Doze camadas de cavernas descem sob a superfície, com câmaras maiores quanto mais fundo. Uma boca de caverna, um buraco escuro em terreno aberto, leva à primeira. Escadas de mão e abismos levam para baixo, e por um abismo você vê o chão da camada de baixo. A ação CAVAR de uma picareta abre um poço permanente que dá para subir e descer; se você não tem picareta, o anão de um acampamento mineiro vende uma.\n\nAs Cavernas Profundas não têm céu, clima nem dia. Você enxerga 8 quadrados; lanternas, fogueiras, cogumelos brilhantes e lascas de cristal aparecem a até 16.\n\nCamadas 1 a 3: morcegos, ratos, slimes, cobras, enxames e aranhas da caverna. Camadas 4 a 6: gnolls brutos, xamãs, golens de argila, esqueletos fósseis que explodem ao morrer, fragmentos de cristal junto aos veios de cristal e piranhas albinas em poças fundas (as mortes delas contam para a Concha). Camadas 7 a 9: golens, pares de brutos, aranhas fúngicas. Camadas 10 a 12, o abismo: golens em pares, espectros, um ou outro minotauro ou oni cinzento, e elementais de fogo e almas perdidas em chão quente.\n\nVeios de minério brilham na rocha: cobre perto do topo, ferro e prata mais abaixo, ouro a partir da camada 6, prata-profunda a partir da camada 9. Veios de cristal podem guardar gemas, diamantes só abaixo da camada 3. Uma vez por dia, o ferreiro da cidade funde um lote em um núcleo de obra-prima: 100 de cobre, 50 de ferro, 30 de prata, 20 de ouro, ou 10 de prata-profunda ou ferro-celeste.
guide.deep_places=Os lugares das Cavernas Profundas entram no seu mapa assim que você os vê.\n\n_Mina antiga_ (camadas 1 a 6): um pátio e uma galeria escorada com madeira, com trilhos e um carrinho. Esqueletos guardam um estoque de minério, às vezes com tochas ou uma picareta. Algumas têm um poço que desce.\n\n_Gruta dos cogumelos_ (qualquer camada, mais comum em rocha úmida): cogumelos gigantes brilhantes, guardas fúngicos e um estoque de cogumelos e sementes.\n\n_Caverna de cristal_ (camadas 3 a 12): paredes de cristal e lascas brilhantes. Fragmentos de cristal guardam um estoque de gemas e voltam uma vez por dia. Da camada 8 para baixo, um guardião de cristal também dorme ali.\n\n_Acampamento mineiro_ (camadas 2 a 8): uma fogueira, sacos de dormir e um mercador anão. Ele paga metade a mais que as lojas da cidade por minério e gemas, vende tochas, rações e uma picareta se você não tiver, e fala de lugares perto do acampamento.\n\n_Santuário do lago_ (camadas 2 a 10): um ídolo junto a uma poça funda. Uma vez por dia você pode jogar ouro para ficar abençoado; mais ouro compra uma bênção mais longa. Uma piranha vive na poça.\n\n_Fenda ardente_ (camadas 5 a 12): uma linha de lava cortando uma câmara, que se inflama um turno depois do aviso. Elementais da fenda guardam uma antiga forja anã. Ela funde como a do ferreiro da cidade, mas pede 7 de prata-profunda ou ferro-celeste por núcleo em vez de 10. Você tem uma fundição por dia, somando todas as forjas.\n\n_Tumba selada_ (camadas 8 a 12): um anel de pedra com uma porta de ferro, um sarcófago, um baú e um lich. A chave está nos restos de um esqueleto ali perto. As paredes não podem ser cavadas nem explodidas.
guide.wet_swamps=Os _pântanos_ são raros: terras baixas, quentes e úmidas, onde metade do chão é água e o junco cresce alto. Uma _névoa baixa_ cobre os pântanos a qualquer hora. De dia é uma bruma que tira 1 casa da sua visão; depois do anoitecer ela engrossa para 2, e perto do amanhecer, quando fica mais densa, para 3. Do fim do crepúsculo até logo depois do nascer do sol ela é densa o bastante para contar como neblina. Tudo que está dentro dela também enxerga menos, exceto os mortos-vivos, os demônios e as criaturas de fogo. O brilho verde e frio de uma _lanterna do brejo_ atravessa a névoa.\n\nA _água_ do pântano prende suas pernas: cada passo dentro dela leva um terço a mais, a não ser que você voe. Um _bálsamo de travessia_ nas botas, ou a bênção de um _santuário afundado_, deixa seus passos rápidos.\n\nQuase todo pântano grande o bastante guarda um lugar: a cabana de uma _bruxa do pântano_ ou um santuário afundado. O _mapa do mundo_ marca e dá nome a eles.
guide.wet_witch=No brejo de um pântano fica a cabana da _bruxa do pântano_: uma casinha cercada de água do brejo, com uma _passarela de tábuas_ da porta até a margem, as lamparinas acesas a noite inteira e a chaminé sempre soltando fumaça. Ela segue o horário das lojas: de noite não negocia, porque é quando sai para colher.\n\nA prateleira dela tem o que só o pântano dá, um quarto mais caro que numa loja, e mais uma poção: o _remédio da bruxa_ (tira veneno, gosma e parasitas e fecha uma ferida que sangra), a _lanterna do brejo_ (uma luz que atravessa a névoa do pântano) e o _bálsamo de travessia_ (a água do brejo para de te atrasar). Ela repõe tudo toda semana.\n\nEla _prepara poções_: ponha no caldeirão dela três _ervas_ (sementes), _cogumelos_ ou _partes de bicho_ (carne crua, um couro, um ovo de águia, uma pena de urubu, um dente de jacaré, um bichinho num pote) quaisquer. As ervas decidem a _poção_. Três do mesmo tipo sempre dão a poção desse tipo, e ela põe o rótulo; senão ela prepara a de uma delas, sorteada, com mais chance para a erva que foi mais vezes. Um caldeirão sem ervas dá uma poção qualquer. Cada cogumelo dá 1 chance em 3 de a mistura sair _exótica_. Ela cobra 90 de ouro, 30 a menos por parte de bicho.\n\nPor 250 de ouro ela tira a _maldição_ de um item. Mostre um que não está amaldiçoado e ela te diz isso de graça.
guide.wet_shrine=Meio afundado num pântano fica um _santuário afundado_: o anel quebrado das paredes de um templo antigo, com uma _estátua_ em cada canto, o chão alagado e, no meio, o _ídolo afundado_ do velho deus do brejo. Deixe uma _oferenda_ na água aos pés dele, 120 de _ouro_ ou um item pelo qual um comerciante pagaria 20 de ouro ou mais, e a _bênção do brejo_ cai sobre você: nenhum veneno, gosma ou parasita pega em você, e a água do pântano não atrasa seus passos. O ouro compra 500 turnos; um item compra mais quanto melhor ele for, até 1000 turnos por um que valha 200 de ouro. O ídolo aceita uma oferenda a cada 3 dias.\n\nÀ noite o santuário tem guardas. Chegue a menos de 10 casas dele depois que escurecer e dois ou três _acólitos afogados_ saem da água em volta dele, uma vez por noite. Eles andam devagar na água, mas como todo morto-vivo ficam rápidos no escuro; um terço dos golpes deles deixa os parasitas do brejo em você, e nunca te perseguem a mais de 10 casas do santuário. Quando o sol nasce eles voltam para debaixo da água, a não ser que estejam no meio de uma luta.
guide.wet_tidepools=Numa praia perto do mar, entre as pedras, ficam as _poças de maré_. A _maré_ sobe e desce duas vezes por dia, um pouco mais tarde a cada dia, e fica baixa metade do tempo. Na maré baixa o mar deixa _conchas_ nas poças, e de vez em quando uma _pérola_ (um achado em nove): no máximo 6 ficam nelas ao mesmo tempo, e o mar traz mais 2 por dia. As conchas e pérolas que ainda estiverem nas poças quando a maré voltar, ela leva de volta. Um comerciante paga 8 de ouro por uma concha e 75 por uma pérola.\n\nDe dia, na maré baixa, um ou dois _caranguejos_ andam entre as pedras, e de vez em quando uma _ostra perlífera_ se assenta numa poça, no máximo uma vez a cada 3 dias. Toque nela estando ao lado para abrir e pegar a pérola; uma vez em três ela se fecha nos seus dedos antes. Com a maré cheia, as ondas quebram por cima das poças, e numa geada forte as poças congelam e não guardam nada.
guide.frozen_overview=Uma abertura cercada de geada no andar 22 leva aos Salões Congelados: quatro andares de caverna, numerados de 21 a 24, e a arena do Lorde Demônio no 25. Subir para fora do andar mais alto leva você de volta ao andar 22.\n\nO ar fica perto de -15 graus, frio o bastante para hipotermia (veja Clima e Estações). Andar na água encharca suas botas, deixando você com mais frio e mais barulhento.\n\nInimigos: lobos marrons e cinzentos (acorde um e a matilha vem), yetis, golens de argila, espíritos gélidos e kobolds glaciomantes.\n\nUm _kobold enjaulado_ no primeiro andar quer a _chave de gelo_ e paga com uma _vela da visão mental_. A chave está com o _núcleo do guardião de gelo_ no andar 23: 1.000 de vida, metade da velocidade, quatro guardiões que se refazem quando quebrados. Cada guardião que você quebra tira 150 do núcleo. A morte do núcleo quebra todos eles e deixa cair a chave e uma Varinha da Geada +1.
guide.nest_overview=Um buraco coberto de teias no andar 6 da prisão cai no ninho de aranhas: cinco andares (6 a 10), mais largos quanto mais fundo. Ele dá a volta: a escada que desce do andar 10 traz você de volta ao primeiro andar do ninho, e a escada que sobe do primeiro andar leva de volta à prisão.\n\nEm cada um dos quatro primeiros andares há um _saco de ovos_ enraizado em algum lugar. Enquanto você puder vê-lo, ele choca uma aranha a cada 20 turnos, até seis aranhas ao mesmo tempo. Ele tem 10 de vida e não pode se mover nem atacar: mate-o primeiro.\n\nA ninhada: _aranhas servas_ (mordidas que às vezes envenenam), _aranhas guardiãs_ (podem paralisar você por 3 turnos), _aranhas inchadas_ (velocidade dobrada; quando uma acerta você, ela estoura com o efeito de uma planta aleatória) e, a partir do andar 8, _aranhas-mente_ que ficam para trás e enfurecem as outras. Mais ou menos a partir do nível 10, aranhas dão só um quarto da experiência.\n\nA rainha aranha ocupa o andar 10.
guide.peaks_heights=Da sétima camada de montanha para cima, o ar é rarefeito. Quanto mais você fica, mais _Sem fôlego_ se acumula, até cinco acúmulos: cada um reduz a cura natural em 15 por cento e faz você ficar com fome mais rápido. Descer tira o efeito aos poucos; descansar junto a uma fogueira ou sob um teto, como a cabana de um eremita ou um abrigo, tira rápido.\n\nNuma crista estreita com vento forte, vêm rajadas. Riscos cinzentos passando por você são o aviso. Depois da sua próxima ação, a rajada empurra você um quadrado na direção do vento, ou deixa você atordoado se você não puder se mover. Ela nunca empurra você para um desnível.\n\nO gelo dos lagos nas montanhas só é seguro a -10 graus ou menos. Num frio mais brando, o gelo perto da margem é fino, e de -2 graus para cima ele todo é fino. Gelo fino range no segundo turno em que você fica nele e quebra depois do terceiro; pise de volta numa rachadura e ele quebra na hora. Você cai na água, ensopado e gelado. Rios e lagos congelados na superfície sempre aguentam você.
guide.peaks_overview=Dez camadas de montanha se erguem acima da superfície, cada uma mais fria que a de baixo. Escadarias de penhasco levam de uma camada à seguinte. Abaixo da linha da neve o chão é prado; acima dela, neve com pinheiros e pedregulhos. Lagos de montanha enchem as depressões. Terreno mais alto é rocha que dá para cavar com picareta. Terreno mais baixo é um desnível: da beirada você vê a terra lá embaixo, com lagos, rios e suas margens, e se cair vai parar na camada de baixo.\n\nLeve algo para se aquecer: fogo, armadura de pano, um Elixir do Calor.\n\nCamadas 1 a 3: lebres e cabras-montesas de dia, matilhas de lobos cinzentos depois do anoitecer. Se você acertar uma cabra com um desnível atrás de você, ela dá uma cabeçada e joga você pela beirada. Camadas 4 a 7: lobos, yetis, kobolds glaciomantes que deixam você lento a distância, espíritos gélidos que congelam você. Camadas 8 a 10: yetis (mais à noite), demônios de gelo, elementais de gelo e espíritos gélidos.\n\nA rocha tem cobre, ferro, prata e ouro, e os cumes mais altos têm ferro-celeste.
guide.peaks_places=Os lugares das montanhas entram no seu mapa assim que você os vê.\n\n_Cabana do eremita_ (camadas 1 a 5, abaixo da linha da neve): ele vende algumas mercadorias, identifica três itens de graça por semana e fala de um lugar ali perto, um novo a cada dia.\n\n_Ninho de águia_ (camadas 3 a 8, na beira de um penhasco): um ninho com ouro, dois ou três ovos de águia e, em um a cada três ninhos, uma gema. Duas águias atacam qualquer coisa a até 3 quadrados dele e perseguem um ladrão por até 12.\n\n_Marco_ (todo cume, camadas 2 a 10): ponha uma pedra, uma vez só, para revelar o terreno num raio de 40 quadrados, ficar abençoado e saber sua altitude.\n\n_Fonte termal_ (camadas 1 a 6, na neve): ficar de molho cura você aos poucos, tira o gelado e o congelado e deixa você aquecido, e molhado, quando sai.\n\n_Alpinista congelado_ (camadas 4 a 10): os restos dele guardam um Elixir do Calor, Poções da Malagueta, comida, ouro e às vezes uma picareta. Fique ao lado dele para ler a página do diário dele.\n\n_Torre de vigia_ (camadas 1 a 4, numa crista): do alto da escada dela você vê o terreno num raio de 26 quadrados, toda vez. Em algumas semanas, um yeti ou dois bandidos se instalam nela.\n\n_Abrigo_ (camadas 1 a 9, perto de um desfiladeiro): uma lareira que nunca apaga e um saco de dormir quente. Descanse ali; ele também tira Sem fôlego rápido.
guide.sea_islands=As _ilhas_ ficam longe, no mar aberto, onde a água nunca congela, a uns cinquenta quadrados ou mais de qualquer outra terra. Em águas quentes são ilhas de palmeiras; nas outras, ilhas de mata. Só um barco chega até elas.\n\nUma ilha entra no seu mapa-múndi, com nome, na primeira vez que você a vê. A _carta náutica_ de um faroleiro marca de uma vez toda ilha a até 400 quadrados do farol dele, com os naufrágios e faróis que houver nelas.\n\nAlgumas ilhas escondem um _baú enterrado_: procure um X riscado na areia com conchas em volta. Cave ali com uma pá de aventureiro para tirar um baú de marinheiro com ouro e um anel, uma varinha ou um artefato. Algumas ilhas também têm um naufrágio ou um farol só delas.
guide.sea_lighthouses=Os _faróis_ ficam em pontas de terra ao longo da costa e em algumas ilhas: torres brancas com uma faixa vermelha. À noite a lâmpada brilha e dois fachos giram devagar sobre a água. Um farol entra no seu mapa-múndi, com nome, na primeira vez que você o vê.\n\nO _faroleiro_ fica nas lajes diante da porta. Como toda loja da superfície, ele fecha à noite, e repõe o estoque toda semana:\n\n_Carta náutica_: leia a céu aberto para marcar no seu mapa-múndi toda ilha a até 400 quadrados do farol dele, com os naufrágios e faróis que houver nelas. A carta se gasta.\n\n_Lanterna do mar_: acesa, ela queima o dobro de uma tocha, ilumina o caminho e te aquece um pouco. O clarão e a fumaça amarga do óleo mantêm os tubarões longe de você enquanto ela queima.\n\nSe você espantar o faroleiro, ele nunca mais volta, mas a lâmpada continua acesa.
guide.sea_sailing=Os barcos flutuam na água da superfície, rasa ou funda, a céu aberto. A _bancada_ de uma propriedade amarra uma _jangada_ com quatro toras de carvalho ou pinho e duas cordas; uma _forja_ acesa constrói um _veleiro_ com doze tábuas, três cordas, duas ferragens e dois couros, crus ou curtidos. Uma pescadora numa vila à beira-mar vende os dois.\n\n_Lançar_: fique ao lado de águas abertas e use o barco da sua mochila. Ele vai para a água ao seu lado, de preferência no fundo, e você sobe a bordo. Só um barco pode estar na água por vez: se você lançar outro enquanto o primeiro está onde você não chega a pé, o primeiro fica para o mar.\n\n_A bordo_, você anda sobre água rasa e funda. Pise em terra ao lado do barco para desembarcar: ele fica atracado onde está e aparece no seu mapa-múndi. Toque nele para voltar e subir a bordo; ao lado dele, você também pode tirá-lo da água e guardá-lo na mochila. Toque num ponto em terra estando a bordo e você navega até o desembarque mais próximo, depois segue a pé.\n\n_Velocidade_: a jangada anda no passo de quem caminha. O veleiro é uma vez e meia mais rápido, e duas vezes mais rápido quando o vento sopra a até 60 graus do seu rumo.\n\n_Tempo_: chuva ou vento forte deixam o mar agitado, e uma tempestade o deixa bravo. Aí as ondas quebram sobre o barco de vez em quando e te encharcam, mais no fundo que no raso, e numa tempestade com frequência. Toda onda gasta as amarras de uma jangada, as de tempestade muito; um veleiro só se gasta numa tempestade. A jangada tem 40 de casco, o veleiro 120. Você é avisado quando metade do casco se foi e de novo quando resta um quarto. Em zero o barco afunda, uma ou duas tábuas chegam à margem e você fica na água. _Conserte_ um barco na mochila com tábuas: 8 de casco por tábua numa jangada, 10 num veleiro.\n\n_Nadar_: em água funda sem barco embaixo, você nada na metade da velocidade e fica encharcado. Depois de 12 turnos o mar começa a te desgastar, um vinte e cinco avos da sua vida a cada dois turnos, até você chegar ao raso ou à margem.
guide.sea_sharks=Os _tubarões_ caçam no mar aberto, onde a água é mais funda. Perto do mar aberto, dois deles nunca estão longe, três à noite. Na primeira vez que um aparece, a barbatana cortando a água é o aviso.\n\nO tubarão só nada em água funda, então em terra você está a salvo. Ele ataca qualquer um que esteja na água ou sobre ela: quem nada, quem anda na beira do fundo, um barco. A mordida é forte, e uma em quatro deixa quem nada sangrando.\n\nA mordida num barco acerta o casco. A jangada leva tudo, e uma mordida em três também te fere pela metade. As tábuas de um veleiro levam a metade e nada chega até você. Mordidas suficientes afundam o barco debaixo de você.\n\nUma _lanterna do mar_ acesa, vendida pelos faroleiros, mantém os tubarões longe de você enquanto queima. Um tubarão encalhado fora da água funda morre.
guide.sea_wrecks=Os _naufrágios_ ficam em praias e no raso ao longo da costa, e em algumas ilhas. Cada um foi um navio com nome, e o naufrágio entra no seu mapa-múndi, com nome, na primeira vez que você o vê.\n\nO casco quebrado é sólido, menos o _porão_, rachado de um lado. Entre para achar o que o mar deixou da carga: um baú com 4 a 8 tábuas, 1 a 3 cordas e 60 a 200 de ouro, e em um naufrágio a cada três um anel, uma varinha ou um artefato. Um naufrágio só entrega a carga uma vez.\n\nEssas tábuas e essa corda são o que um navegante precisa para consertar um barco ou construir outro.
guide.surface_barrows=Leve o Amuleto de Yendor para fora da masmorra e a partida continua: os túmulos se abrem para ele. Você precisa do amuleto na mochila toda vez que descer.\n\nUm túmulo é uma masmorra de 4 a 15 andares, feita como uma das regiões da masmorra e indo mais fundo a partir dali. O nível dele cresce mais ou menos com a distância da cidade, mas um túmulo distante pode ser fácil e um próximo, mortal. O mapa-múndi mostra o nome e o nível de cada túmulo, e a porta mostra o nível e o número de andares antes de você entrar. A subida do primeiro andar leva você de volta para fora, na porta.\n\nO andar mais fundo não tem escada para baixo. O guardião dele é a última espécie de monstro da região, com o triplo da vida e o poder de um campeão. Ele deixa ouro e de duas a oito armas, armaduras, varinhas, anéis ou artefatos sem maldição, mais aprimorados quanto mais fundo o túmulo, e núcleos de obra-prima nos túmulos mais fortes. Aí o túmulo conta como concluído e exibe a sua bandeira. Você pode percorrer os andares dele de novo; o guardião não volta.\n\nNada num túmulo deixa você mais forte de vez: Poções da Força, Pergaminhos do Aprimoramento e afins viram ouro. Os monstros crescem junto com o túmulo, sem limite, e você continua ganhando experiência.
guide.surface_oasis=Alguns desertos escondem um _oásis_: um poço de água fresca cercado de grama e _tamareiras_. O mapa-múndi marca cada um em azul.\n\nA sombra e a água tiram 10 graus do ar, mas nunca o deixam abaixo de 22, então um oásis é o lugar para se livrar da _insolação_ no calor do dia. Encha suas _garrafas vazias_ no poço, de graça.\n\nA cada dois dias caem _tâmaras_ maduras ao pé de algumas palmeiras. Um _mercador do oásis_ fica no tapete dele perto da água; de noite ele dorme e não negocia. Ele vende _óculos de areia_, um _lenço do deserto_, tâmaras e garrafas vazias, e conta para que lado fica o templo soterrado mais próximo, se souber de algum.\n\nAo entardecer, enquanto ninguém está perto da água, alguns _cervos_ descem para beber. Não dá para construir num oásis, cavar nele nem cortar as palmeiras.
guide.surface_sandstorm=Quando sopra um vento de 10 m/s ou mais sobre o deserto, ele levanta a areia numa _tempestade de areia_, e o relógio de sol mostra esse tempo enquanto ela sopra em você. Não sopra areia numa nevasca, nas cavernas nem nas montanhas.\n\nAo ar livre ela corta pela metade o quanto você enxerga, e num vento de 20 m/s deixa só um quarto. Você anda um quinto mais devagar, um terço a 20 m/s, e a cada turno a areia tem de 3 a 8 por cento de chance de entrar nos seus olhos e te deixar _cego_ por 2 turnos. Os monstros pegos nela também enxergam menos, a não ser os que enxergam no escuro.\n\nVocê fica protegido no _abrigo_ dela: com qualquer coisa sólida a uma ou duas casas do lado de onde vem o vento, como uma pedra, uma palmeira, uma estátua ou um muro, ou dentro de um cômodo que você construiu. Leve _óculos de areia_ ou um _lenço do deserto_ e a tempestade não te atinge de jeito nenhum. Os mercadores dos oásis vendem os dois; uma bancada de trabalho faz os óculos com uma _vidraça_ e _couro_, e tece o lenço com três feixes de _palha_.
guide.surface_temples=O topo dos _templos soterrados_ aparece entre as dunas do deserto: lajes entalhadas em volta de uma escadaria, _obeliscos_ dourados e _estátuas de chacal_ negras. O mapa-múndi mostra o nome e o nível de cada um em dourado.\n\nQualquer um pode descer, sem precisar de amuleto. Um templo tem de 2 a 4 andares curtos, com mais armadilhas que os da masmorra, e o nível dele cresce com a distância da cidade. _Cobras_, _múmias_ e enxames de moscas andam pelos andares rasos; múmias, _esqueletos_, morcegos, aranhas e golens de barro pelos do meio; múmias, carniçais, _escorpiões_, _monges_ e golens pelos mais fundos. Uma múmia é tão forte quanto é fundo o andar dela, o aperto dela pode te deixar fraco, e o fogo a queima uma vez e meia mais.\n\nO andar mais fundo não tem escada para baixo. O guardião dele é uma _estátua_ com o triplo da vida e o poder de um campeão, que fica parada até você golpeá-la. Ela deixa ouro, equipamento e a relíquia do templo, o _Escaravelho Solar_: na mochila, ele deixa seus golpes contra mortos-vivos 15 por cento mais fortes, e mais quando você o fortalece com energia alquímica.\n\nComo nos túmulos, nada num templo te deixa mais forte para sempre, e a subida do primeiro andar te leva de volta para fora, na escadaria.
guide.surface_events=Quando você ouve falar de um evento por perto, o log diz em que direção ele fica e o mapa-múndi o marca enquanto durar.\n\nUma _estrela cadente_ cai à noite em terreno aberto. O _fragmento de estrela_ fica na cratera por três dias. O ferreiro da cidade transforma dois fragmentos em um núcleo de obra-prima, e os mercadores pagam bem por um.\n\nUma _feira itinerante_ se monta em volta do poço de uma vila humana por três dias. As duas ou três barracas vendem anéis, varinhas, artefatos, poções exóticas e pergaminhos exóticos que as lojas das vilas não têm, por um quarto a mais que o preço normal.\n\nBandidos fazem um _ataque_ a uma vila humana por um dia; a fumaça aparece de longe. Mate todos os saqueadores antes do fim do dia e a vila paga 60 de ouro mais 15 por casa e uma boa arma, armadura, varinha ou anel, e os vendedores dela cobram de você três quartos do preço nesse dia e nos três seguintes. Se o ataque durar o dia todo, as lojas da vila ficam fechadas por dois dias.\n\nEm algumas noites uma _matilha de lobos_ caça um cervo perto de você, e você ouve o uivo. Os lobos ignoram você, a menos que você chegue perto ou acerte um; aí a matilha inteira se volta contra você. Um cervo que eles derrubam deixa carne.
guide.surface_beasts=_Bisões_ (140 de vida) pastam nas planícies e campinas durante o dia, em manadas de dois a cinco. Eles te ignoram, mas bata em um e todo bisão a até 8 quadrados avança contra você, com metade a mais da sua velocidade. Um bisão que vem correndo te acerta com metade a mais dos seus 16 a 30 e te joga um quadrado para trás. A manada se acalma quando você morre, vai embora ou fica fora da vista dela por 8 turnos. Cada um deixa um _couro cru_ e 2 _carnes misteriosas_.\n\n_Camelos_ (80 de vida) andam pelo deserto durante o dia, sozinhos ou em dois ou três, e se afastam devagar quando você chega a 2 quadrados. Bata em um e ele cospe em você de até 3 quadrados: se a cusparada acertar, você fica _atordoado_ por 3 turnos. Depois ele vai embora. Cada um deixa 2 carnes misteriosas e, 1 vez em 2, um couro cru. Você pode laçar um bisão ou um camelo do mesmo jeito que laça um cervo.\n\n_Urubus_ (45 de vida) voam sobre o deserto durante o dia. Eles ficam rodando em cima de qualquer herói a até 8 quadrados que esteja com menos de 60% da vida, e pousam em carne crua largada no chão para comer um pedaço a cada 3 turnos. Num herói com menos de 30% eles mergulham, batendo de 8 a 16 e subindo um quadrado entre um golpe e outro, até ele voltar a passar de 40%. Bata em um enquanto você está mais inteiro e ele voa para longe. Cada um deixa 1 ou 2 _penas de urubu_.\n\n_Jacarés_ (130 de vida) ficam nas poças do pântano a qualquer hora, só com os olhos fora d'água. Pise ao lado de um e ele salta: a primeira mordida nunca erra, acerta com metade a mais dos seus 20 a 36 e te arrasta para dentro d'água. Em terra ele te caça devagar e volta para a água quando você está a mais de 6 quadrados, some da vista dele por 3 turnos ou ele cai para 30% da vida. Deixa carne misteriosa e, 1 vez em 2 cada, um couro cru e um _dente de jacaré_.\n\n_Lúcios_ (60 de vida) espreitam na água aberta dos rios a qualquer hora e mordem quem entra nela, de 12 a 24, com o dobro da sua velocidade. Uma _lança de pesca_ tira pelo menos metade da vida de um lúcio.\n\nNa bancada, 2 penas de urubu e uma tábua viram 5 _dardos_, e um dente de jacaré e uma tábua viram 2 lanças de pesca.
guide.surface_overview=Em volta da cidade há prados, florestas, planícies, pântanos, desertos, tundra, rios e mar. Você pode atravessar água rasa; água funda bloqueia você a pé, mas um barco te leva por cima (O Mar). Numa geada forte, rios e lagos congelam, e esse gelo aguenta você. Efeitos de gelo congelam qualquer água que alcançam, em qualquer estação; esse gelo derrete de novo quando o ar esquenta.\n\nA linha da neve nas montanhas muda com a estação. A chuva encharca você e o vento gela; vista-se para onde vai e leve fogo.\n\nEstradas ligam as vilas. Nelas você encontra viajantes e caravanas, e às vezes bandidos. Fora das estradas, lobos saem depois que escurece.\n\nO mapa-múndi mostra o que você já viu e os lugares de que ouviu falar. Escadarias de penhasco sobem para as montanhas e bocas de caverna descem para as Cavernas Profundas. A cidade fica no centro do mapa.
guide.surface_nature=No calor, depois de meio dia sem chuva, pode começar um _incêndio_ na mata ou nos campos. Uma fogueira deixada acesa pode começar um, e uma árvore atingida por um raio numa tempestade de um ou dois dias antes também. Ele se espalha devagar por um ou dois dias, queimando as árvores até sobrarem só os _tocos_ e deixando o capim preto. Quem fica nas chamas pega fogo, e os animais selvagens fogem dele. Estradas, água e terra nua param o fogo, e ele nunca entra numa vila nem na cidade. A chuva apaga o incêndio.\n\nDespeje ou jogue uma _garrafa de água_ num ponto em chamas para apagá-lo e manter o fogo longe dele e dos quatro quadrados em volta. Nada que você construiu, cavou ou arou pega fogo. Se um incêndio chega perto do seu sítio você é avisado; quando ele passa, estraga as peças de madeira bem ao lado das chamas, mas nunca derruba nenhuma, e mata as plantações dali. A terra queimada se recupera, com _mudas_ depois de seis dias e árvores depois de dezoito, e uma árvore em chamas às vezes deixa _carvão vegetal_.\n\nDepois de dias de chuva na primavera ou no outono os rios entram em _cheia_. Por dois dias uma água rasa cobre as margens baixas, e as estradas debaixo dela viram _lama_, onde cada passo demora um terço a mais. As plantações nas margens baixas se afogam; as roças em terreno mais alto ficam a salvo. Quando a água baixa, a lama cobre as margens por quatro dias, e o que estiver plantado nesse chão cresce metade mais rápido por doze dias.\n\nEm algumas luas novas acontece um _eclipse_ solar. Os anciões da vila mais próxima avisam no dia anterior. Por umas três horas perto do meio-dia a luz cai para a de um fim de tarde, aparecem estrelas e os animais da noite saem. Enquanto o sol está escuro, uma _varinha da corrupção_ fica metade mais forte.
guide.surface_festivals=Alguns eventos do mundo seguem as estações.\n\nUma vez por estação, cada vila humana faz uma _festa_, de uma manhã até a manhã seguinte, e você fica sabendo dela a até três setores de distância. Um mastro enfeitado sobe no poço, com bandeirinhas e lanternas de papel acesas do anoitecer ao amanhecer. Dois _cozinheiros da festa_ vendem comida pela metade do preço durante o dia, e a partir do anoitecer o povo dança em roda em volta do poço ao som de uma banda. O _campeão da vila_ enfrenta qualquer um numa luta amistosa: fale com ele duas vezes para começar. Quem cair primeiro para um terço da vida se rende, então ninguém se machuca mais do que isso, e ele luta no seu nível. Vença e ele dá a você uma boa arma, armadura, varinha ou anel, uma vez por festa.\n\nNa primavera e no outono, uma manada de vinte a trinta e seis _cervos_ atravessa uma região em quatro dias, rumo ao norte na primavera e ao sul no outono. Dois ou três _lobos_ seguem a manada e deixam você em paz, a menos que você chegue perto ou acerte um; depois que escurece, eles derrubam um cervo que ficou para trás. Você fica sabendo da manada a até três setores dela, e o mapa a acompanha.\n\nDe vez em quando uma _fera lendária_, com nome próprio, ronda uma região por oito dias: um _lobo enorme_ na maior parte das terras, um _yeti ancião_ no frio, um _escorpião gigante_ no deserto. Ela tem quatro vezes a vida da sua espécie e bate mais forte. Quem mora a até três setores dela conta onde ela foi vista, e as _pegadas_ frescas levam até ela. Abata a fera para levar o _troféu_, cerca de 250 de ouro e uma boa arma, armadura, varinha ou anel.
guide.surface_villages=As vilas ficam em planícies e prados. A maioria é humana, cerca de um quarto são clãs gnoll pacíficos, e cerca de 1 em 8 é um reduto de bandidos.\n\nUma vila humana tem vendedores (mais nas vilas maiores) e famílias cuidando da vida; vilas de nove casas ou mais põem guardas no poço. Clãs gnoll são pacíficos, mas não têm lojas. Um reduto de bandidos é um grupo de três a cinco bandidos que atacam você.\n\nVocê pode abrir a porta de qualquer casa. Metade das casas tem alguém dentro, e nenhuma tem nada para saquear. Dentro de casa, hipotermia e insolação acabam na hora e não pegam você; então, quando o clima se virar contra você, entre.\n\nFeiras itinerantes e ataques de bandidos acontecem nas vilas humanas.
guide.surface_bounties=Toda vila humana tem um _quadro de avisos_ perto do poço, debaixo de um telhadinho próprio. Ele mostra três avisos, dois num vilarejo, e avisos novos aparecem a cada três dias. Chegue perto dele para ler. Você pode carregar cinco avisos de uma vez. Eles ficam listados nas notas do seu diário, e dá para desistir de um ali ou no quadro dele.\n\nUma _caçada_ pede que você mate alguns bichos de uma espécie que vive perto da vila, como _lobos cinzentos_ ou _ratos albinos_. Só contam as mortes a até 128 passos do poço da vila, e num jogo compartilhado as dos outros heróis também contam. Uma _coleta_ pede coisas que a terra em volta dá: _couros crus_, _toras de carvalho_, toras de pinheiro, pedra bruta, palha, argila, areia, _minério de cobre ou de ferro_ das cavernas lá embaixo, _peixe_ dos pescadores das pontes ou da sua própria vara, ou sementes. Nos dois casos, volte ao quadro para receber: uma moeda de ouro fica pendurada embaixo dele quando tem pagamento esperando por você.\n\nUma _entrega_ põe na sua mão uma _encomenda_ para um _ancião_ de outra vila ali perto. Os anciãos ficam sentados na frente de casa durante o dia e vão dormir cedo, e qualquer pessoa da vila mostra o caminho. Encomenda atrasada não rende nada.\n\nOs avisos pagam em _ouro_, mais quanto mais fundo você já desceu, e mais ou menos um em cada três vem com uma poção, um pergaminho ou uma pedra rúnica. Cada aviso que você cumpre aumenta sua reputação na vila dele. Depois de um, a vila conhece você; depois de três, confia em você; depois de seis, tem você em alta conta. Cada passo tira mais 5% dos preços dos comerciantes de lá, e os _guardas_ ficam mais simpáticos: quando já confiam em você, contam onde os bichos da sua caçada foram vistos pela última vez.\n\nEnquanto uma grande fera anda a até três setores de uma vila, o quadro dela também põe uma caçada só para essa fera: mate ela em qualquer lugar antes que os dias dela acabem e depois receba no quadro.\n\nNum jogo compartilhado, só o anfitrião pega avisos e recebe as recompensas.
guide.surface_wilds=O mapa-múndi marca mais do que vilas. Cada um destes lugares guarda seu saque uma vez só.\n\n_Ruínas_ (floresta, sopé, tundra, deserto): entradas de masmorra desabadas, guardadas por dois ou três esqueletos. A escada no meio leva ao primeiro andar da masmorra, e sair da masmorra traz você de volta ali.\n\n_Acampamentos abandonados_ (floresta, prado): um baú com comida, uma poção, armas de arremesso ou algum ouro.\n\n_O grande carvalho_ (floresta): três sementes e uma gota de orvalho no oco ao pé dele.\n\n_Pedras erguidas_ (planície, tundra, campo de neve): um pergaminho no meio do círculo.\n\n_Covis de dragão_ (sopé, montanha): três pilhas de 200 a 600 de ouro e um dragão. Passe direto.\n\n_Túmulos_: portais quadrados de pedra em terreno seco e plano, com uma escada no meio. Eles só se abrem enquanto você carrega o _Amuleto de Yendor_.
guide.temple_overview=Uma escada no andar 14 leva ao templo. O jogo pergunta antes de você entrar, e dá para sair de volta. Lá dentro, doze salas em duas colunas ficam entre a entrada e uma escada no fundo, em ordem aleatória: dez provas, uma sala de suprimentos e uma sala vazia.\n\nAs provas: grama escondendo até 32 mímicos; uma lagoa com quatro piranhas; sentinelas do templo que atiram em linha reta; quatro sentinelas guardando quatro baús com chaves de cristal; armadilhas explosivas escondidas; uma sala com 17 Pedras de Teletransporte; doze guardas gnoll; um labirinto; respiros de gás da confusão; água sob nuvens de trovoada. A sala de suprimentos tem comida, duas pilhas de 6 a 10 cristais de energia e três poções.\n\nNo centro de cada sala há um esqueleto com uma ou duas poções, pergaminhos, comida ou ouro. Um _Pergaminho do Aprimoramento_ fica na escada do fundo. Essa escada leva só a uma salinha vazia.
guide.topic_rarity=Toda arma, armadura, arma de arremesso, varinha, anel, acessório e artefato tem uma _raridade_: comum, incomum, rara, lendária ou exótica, indicada pela cor do nome. Equipamento lendário aparece a partir do andar 5, exótico a partir do andar 15, e os dois ficam mais comuns quanto mais fundo. Em armas, armaduras e varinhas, a raridade soma uma parte do próprio dano, bloqueio ou poder de disparo da peça, de um vigésimo (comum) a três décimos (exótica). Toda peça também ganha linhas de bônus: uma nas comuns e incomuns, duas nas raras e acima, rolando mais alto quanto mais rara a peça. As linhas de um anel, acessório ou artefato ajudam você enquanto você o usa ou carrega: dano, precisão, evasão, regeneração, velocidade, recarga, resistência a efeitos negativos, fome ou ouro. Em armas e armaduras, a linha de uma peça comum é um bônus simples, a de uma incomum é um _traço_, e uma peça rara ou melhor tem um de cada. Bônus simples são números: precisão, dano, velocidade de ataque ou menos força necessária numa arma; bloqueio, evasão ou menos força necessária numa armadura. Os traços seguem o que a peça é. Qualquer arma pode rolar acertos críticos ou drenar vida com um golpe, e cada categoria soma dois traços próprios: machados batem mais forte em inimigos abaixo de metade da vida, martelos e picaretas batem mais forte numa família (mortos-vivos, demônios, constructos, elementais, feras ou humanoides), instrumentos e lâminas leves batem mais forte à noite e um pouco mais fraco ao meio-dia, manguais e escudos batem mais forte enquanto você está abaixo de metade da vida, cajados e lanças enquanto cai chuva ou neve em você, e arcos e dardos miram melhor no vento ou tiram carne das feras que matam. Alguns mantêm sua mão quente no frio. Armas de fogo e o arco também podem poupar munição, armas de fogo recarregam de graça, e o lança-chamas e a arma laser alcançam mais longe. Armaduras leves podem rolar aquecimento no frio, resfriamento no calor, proteção contra chuva, passos mais rápidos ou passos mais silenciosos; armaduras mais pesadas, aquecimento, proteção contra o frio do vento, quedas mais suaves ou resistência a efeitos negativos. O catálogo lista os traços que cada categoria pode rolar. Armas e armaduras lendárias e exóticas já vêm encantadas ou com glifo, e também têm um _vestígio_: um encantamento extra e fraco, ou glifo na armadura, que ativa com um quinto a três décimos da frequência de um verdadeiro, até três quintos com a obra-prima completa. Ele não ocupa encaixe no pedestal e fica inativo enquanto a peça tiver o mesmo encantamento ou glifo.\n\nCada peça também tem um _tipo_ (gama, beta ou alfa), mostrado no canto dela. Ele define a força da vantagem embutida da peça: dobrada no beta, triplicada no alfa, e o alfa ainda soma um efeito extra. A vantagem segue o que a arma é: armas de fogo e arcos batem mais forte de longe, machados lascam armadura e derrubam árvores mais rápido, martelos e picaretas atordoam e quebram pedra mais rápido, instrumentos transformam cada quarta nota num acorde que abençoa você e seus aliados ou assusta o inimigo, chicotes puxam inimigos para perto, foices varrem e colhem sementes extras, bumerangues atravessam inimigos, armas de arremesso pesadas podem ser arremessadas com força, armas de arremesso leves e afiadas voltam para a sua mão e lâminas leves sentem inimigos através das paredes. Um _mutador de tipo_ sobe o tipo: um leva de gama a beta, dois levam de beta a alfa. Nada baixa um tipo. Mutadores caem raramente de inimigos mortos e são vendidos na Cripta.\n\nA _obra-prima_ é paga em núcleos de obra-prima com o ferreiro das cavernas ou o ferreiro da cidade. São cinco etapas, um núcleo cada: cada uma das quatro primeiras aumenta todas as linhas de bônus em 15%, e a quinta, que exige equipamento lendário ou exótico, dobra todas. Uma arma com obra-prima completa cura você em um vigésimo da vida ao matar, e uma armadura dá essa mesma quantia em blindagem, no máximo uma vez a cada 10 turnos; uma varinha recupera um quinto das cargas a cada morte. Todo chefe deixa 1 ou 2 núcleos; o ferreiro da cidade também os funde a partir de minério ou de dois fragmentos de estrela, e a bancada do desmanche transforma equipamento raro ou melhor em núcleos.
guide.topic_rooms=Do andar 2 ou 3 até o 24, uma destas salas aparece a cada 2 ou 3 andares, nunca num andar de chefe; você vê todas uma vez antes de alguma se repetir.\n\n_Galeria do rival_ (chave de ferro): uma estátua luta com uma arma como a sua, uma raridade acima, e a deixa cair ao morrer.\n_Forja de têmpera_: ponha um equipamento na bigorna, acenda as brasas, mantenha a peça incandescente por 3 turnos e depois resfrie no cocho ou com gelo; a linha de bônus mais fraca sobe até a melhor, ou a peça ganha uma etapa de obra-prima de graça. Passando de 14 turnos incandescente, uma linha se queima, e um vestígio por último. Um uso por bigorna.\n_Bancada do desmanche_: equipamento lendário ou exótico vira um núcleo de obra-prima, e equipamento raro, um terço de núcleo.\n_Salão da linhagem_ (chave de ferro): três cópias do seu equipamento (comum alfa, rara beta, lendária gama); pegar uma estilhaça as outras.\n_Esconderijo congelado_: o prêmio está preso no gelo; derreta com fogo ou quebre, o que faz barulho e pode estragar uma poção ou pergaminho lá dentro.\n_Fole_: o vento empurra gás pela galeria e ajuda os arremessos que vão a favor dele.\n_Tranca elemental_: desperte três runas com calor, gelo, plantas ou água para abrir o portão.\n_Estufa_: primavera o ano todo.\n_Ninho incubador_: um ovo sobre brasas que o chocam.\n_Cofre de contrapeso_: ponha peso nas duas placas com um corpo, uma armadura, uma arma, um baú ou 300 de ouro.\n\nQualquer andar pode ter uma _fonte termal_ (1 de vida a cada 4 turnos, acaba com gelado e congelado, mantém você aquecido por 150 turnos depois) ou um _acampamento do viajante_. Acenda a fogueira do acampamento antes de dormir no saco de dormir: ela corta pela metade a chance de monstros pegarem você dormindo e evita que você acorde congelado. Uma despensa secreta de esquilo guarda sementes, 8 no outono e menos no resto do ano.\n\nUma vez por região, no segundo, terceiro ou quarto andar, uma porta secreta se abre para _a Cripta_. À noite, um negociante vende equipamento lendário, núcleos de obra-prima, mutadores de tipo e uma chave de crânio dourada que abre qualquer fechadura, e compra pagando metade a mais que uma loja. Cada negócio aumenta a suspeita; em 3, o cobrador caça você em todo andar até você matá-lo. Ataque o negociante ou os guardas dele e todo mercado fica fechado pelo resto da partida.
guide.topic_skills=Talentos e habilidades dividem um só conjunto de pontos: 2 no início e 3 por nível. Um ponto de talento custa 1; um nível de habilidade custa o tier dela, então habilidades mais avançadas num ramo custam mais. Cada habilidade tem 3 níveis. Alguns ramos têm pares em que pegar uma bloqueia a outra pelo resto da partida. O mercenário da estalagem vende 3 pontos para cada chefe que você já matou.\n\nA maioria das habilidades são ações que custam mana. A aba de habilidades aparece enquanto você tem pontos para gastar ou uma habilidade para usar: toque nela para escolher uma habilidade, segure para abrir a árvore. Uma habilidade com alvo não custa nada se você cancelar.\n\nO guerreiro racha o chão, salta e esmaga. O mago mantém orbes de fogo e gelo em órbita e invoca meteoros. O ladino luta ao lado de cópias de sombra de si mesmo. A caçadora dispara tempestades de flechas e faz crescer espinheiros que prendem. A duelista avança e gira uma tempestade de lâminas. O clérigo cura, ergue pilares de luz e chama um espírito guardião.\n\nA habilidade que a Coroa do Rei Anão dá à sua armadura também pode ocupar um espaço de habilidade.
