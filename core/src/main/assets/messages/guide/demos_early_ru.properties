# Русский перевод демонстрационных подсказок: ранние этажи

guidedemo.sewers_f1.follow=Пусть враг последует за вами через дверь
guidedemo.sewers_f1.strike=Ударьте при выходе из двери: враг не уклонится
guidedemo.sewers_f3.split=Каждый удар оружием разделяет рой надвое
guidedemo.sewers_f3.wand=Палочки, огонь и газ не разделяют рой
guidedemo.boss_goo.swells=Гу раздувается и ревёт: готовится мощный удар
guidedemo.boss_goo.reach=Удар достаёт до 2 клеток по свободной прямой
guidedemo.boss_goo.slam=Через 2 хода после рёва — тройной урон
guidedemo.boss_goo.hide=Гу снова готовится: спрячьтесь за колонной
guidedemo.boss_goo.lost=Гу придётся подойти — подготовленный удар сорвётся
guidedemo.prison_f1.burst=После гибели кости ранят всех вокруг
guidedemo.prison_f1.armor=Броня помогает. Не добивайте скелета вплотную при малом здоровье
guidedemo.prison_f2.chain=Один раз за бой он подтянет вас цепью к себе
guidedemo.prison_f2.cripple=Затем вы будете искалечены на 4 хода
guidedemo.prison_f3.raise=Некромант поднимает скелета рядом с вами
guidedemo.prison_f3.heal=Издали он лечит скелета, затем приводит его в ярость
guidedemo.prison_f3.kill=Убейте некроманта — его скелет рассыплется
guidedemo.boss_tengu.jump=Потеряв каждые 25 ОЗ, Тенгу отпрыгивает
guidedemo.boss_tengu.sow=Он расставляет ловушки: каждая вспыхивает лишь раз
guidedemo.boss_tengu.hidden=Запомните места: поиск не выявит эти ловушки
guidedemo.boss_tengu.range=Атакуйте издали, стоя на заведомо безопасных клетках
guidedemo.boss_tengu.chase=Погонитесь за ним — угодите в ловушки
guidedemo.boss_tengu.bomb=Бомба взорвётся через 3 хода в радиусе 2 клеток
guidedemo.boss_tengu.clear=За пределами взрыва вы не пострадаете
guidedemo.boss_spiderqueen.bite=Укус наносит 12–20 урона; примерно половина укусов отравляет
guidedemo.boss_spiderqueen.egg=Примерно каждые 20 ходов она откладывает яйцо рядом
guidedemo.boss_spiderqueen.break=У яйца 2 ОЗ: разбейте его до появления паука
guidedemo.boss_spiderqueen.flee=Потеряв половину здоровья, королева отступает — за неё сражаются пауки
guidedemo.caves_f1.rage=При 0 ОЗ громила впадает в ярость: получает щит и бьёт дважды
guidedemo.caves_f1.drain=Щит теряет по 4 за ход: держитесь подальше
guidedemo.caves_f1.gone=Через 6 ходов щит исчезнет — вместе с громилой
guidedemo.caves_f2.web=Паук опутывает паутиной клетки на вашем пути
guidedemo.caves_f2.turn=Смените направление — паутина вас не заденет
guidedemo.caves_f2.bite=Укус может отравить; после этого паук отступит и пустит паутину
guidedemo.caves_f3.beam=Луч поражает всех существ на своей линии
guidedemo.caves_f3.wait=После выстрела врагу нужно 3 хода на перезарядку
guidedemo.caves_f5.pylon=Пилон поражает две противоположные клетки и поворачивается по часовой стрелке
guidedemo.caves_f5.step=Встаньте вне направления разряда
guidedemo.caves_f5.cut=Удар на 30 урона наносит лишь 19: бейте часто и несильно
guidedemo.boss_dm300.thrown=Вплотную DM-300 отбрасывает вас на 2 клетки
guidedemo.boss_dm300.area=Отмечена область 7×7: в ней есть одна безопасная клетка
guidedemo.boss_dm300.rocks=Камни: 6–12 урона и оглушение на 3 хода
guidedemo.boss_dm300.charge=При 200 и 100 ОЗ машина входит в режим перегрузки
guidedemo.boss_dm300.immune=При перегрузке машина неуязвима, вдали загорается пилон
guidedemo.boss_dm300.run=Разрушьте светящийся пилон, чтобы снять перегрузку
guidedemo.boss_dm300.fast=При перегрузке машина движется вдвое быстрее
guidedemo.boss_dm300.lost=Пилон разрушен — перегрузка закончилась
