###Descent Guide demos: the sewers, the prison, the caves (journal/guidedemos/EarlyDemos). English only.
###A key is guidedemo.<page>.<word>; a caption is one short line (48 characters at most).

guidedemo.sewers_f1.follow=Let it follow you through a door
guidedemo.sewers_f1.strike=Strike as it comes through: it can't dodge

guidedemo.sewers_f3.split=Every weapon hit splits it in two
guidedemo.sewers_f3.wand=Wands, fire and gas never split it

guidedemo.boss_goo.swells=It swells and shouts: a slam is coming
guidedemo.boss_goo.reach=Up to 2 tiles away, on a clear line
guidedemo.boss_goo.slam=Two turns after the shout: triple damage
guidedemo.boss_goo.hide=Another charge: get behind the pillar
guidedemo.boss_goo.lost=It must move, so the charge is lost

guidedemo.prison_f1.burst=Its bones burst on everything beside it
guidedemo.prison_f1.armor=Armor helps; don't kill one beside you when low

guidedemo.prison_f2.chain=Once, its chain pulls you next to it
guidedemo.prison_f2.cripple=Then you are crippled for 4 turns

guidedemo.prison_f3.raise=It raises a skeleton right beside you
guidedemo.prison_f3.heal=From range it heals it, then enrages it
guidedemo.prison_f3.kill=Kill the necromancer: its skeleton crumbles

guidedemo.boss_tengu.jump=Every 25 health he loses, he jumps away
guidedemo.boss_tengu.sow=He sows traps, and each flashes only once
guidedemo.boss_tengu.hidden=Remember where: searching won't find them
guidedemo.boss_tengu.range=Strike from range, from tiles you know are safe
guidedemo.boss_tengu.chase=Chase him and you walk onto them
guidedemo.boss_tengu.bomb=A bomb: in 3 turns it blasts 2 tiles round it
guidedemo.boss_tengu.clear=Outside its blast, you take nothing

guidedemo.boss_spiderqueen.bite=Her bites hit 12 to 20; half of them poison
guidedemo.boss_spiderqueen.egg=About every 20 turns she lays an egg beside her
guidedemo.boss_spiderqueen.break=An egg has 2 health: break it before it hatches
guidedemo.boss_spiderqueen.flee=Below half health she backs off; spiders fight

guidedemo.caves_f1.rage=At 0 health it rages: a shield, double hits
guidedemo.caves_f1.drain=Its shield drains 4 a turn: stay out of reach
guidedemo.caves_f1.gone=Six turns later the shield is gone, and so is it

guidedemo.caves_f2.web=It webs the tiles you are walking toward
guidedemo.caves_f2.turn=Change direction: the webs miss you
guidedemo.caves_f2.bite=A bite may poison, then it backs off to web you

guidedemo.caves_f3.beam=Its beam hits everything in the line
guidedemo.caves_f3.wait=Then 3 turns pass before it fires again

guidedemo.caves_f5.pylon=It shocks two opposite tiles, turning clockwise
guidedemo.caves_f5.step=Stand where it isn't pointing
guidedemo.caves_f5.cut=A 30 hit deals only 19: use fast, light blows

guidedemo.boss_dm300.thrown=Next to it, you are thrown 2 tiles
guidedemo.boss_dm300.area=A 7 by 7 area is marked; one tile is safe
guidedemo.boss_dm300.rocks=Rocks: 6 to 12 damage, 3 turns stunned
guidedemo.boss_dm300.charge=At 200 and 100 health it supercharges
guidedemo.boss_dm300.immune=Charged, it can't be hurt; a far pylon lights
guidedemo.boss_dm300.run=Destroy the lit pylon to end the charge
guidedemo.boss_dm300.fast=Charged, it moves twice as fast
guidedemo.boss_dm300.lost=The pylon falls, and the charge with it
