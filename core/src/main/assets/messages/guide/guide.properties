# --- pages added with the guide remake ---
guide.boss_demonlord=300 health; he hits for 18 to 36 and chills you on a third of his hits. When he wakes the floor locks until he dies.\n\n_Breath_: when you are within 4 tiles and in his sight he may inhale. The cone toward you frosts over and a countdown shows over his head; 3 turns later he exhales for 20 to 40 damage and chill, freezing any water in the cone. Leave the cone or put one of the six ice pillars between you. From more than 4 tiles away he never breathes.\n\nBelow half health he breathes more often and two _ice demons_ (110 health, hits of 20 to 35) climb out beside him. They die with him.\n\nSleep, terror and vertigo don't affect him; burning does half damage.\n\nHe drops the _worn key_ for the locked door behind his dais, which leads back to depth 22, and the _climate crystal_: an artifact that charges in harsh weather and, set down, holds every tile within 2 at a mild temperature for 300 turns.
guide.boss_dragon=Every dragon lair on the map holds a dragon. It has 8,000 health and moves twice as fast as you. Its bite deals 150 to 300, and from anywhere it can see you it spits poison for 300 to 600.\n\nIf it sees you, put rock between you and it and leave; you cannot outrun it in the open.\n\nThe hoard is three piles of 200 to 600 gold. A slain dragon never comes back, and no other dragon takes its lair. Fight one only with barrow gear and levels behind you, and only where you can get away.
guide.boss_spiderqueen=The _spider queen_ has 120 health, bites for 12 to 20 and poisons on half her hits. Fire does not harm her. When she sees you the floor seals until she dies.\n\nWhile she hunts she lays an egg beside her about once every 20 turns, as long as fewer than six spiders are alive. An egg has 2 health and hatches about 20 turns later if you can see it: break eggs as you go.\n\nBelow half health she stops attacking and backs away, letting the brood fight. Don't follow her into a crowd. Clear the eggs and spiders, corner her and finish her.\n\nShe drops a Potion of Healing, a random wand and the _spider charm_, which calls an allied spider servant at the cost of a quarter of your max health.
guide.deep_hazards=From the fourth cave slice down, pockets of _firedamp_ sit in low, closed-in spots. Inside one you smell it and see a faint haze; after three turns you get dizzy. A flame in the gas (your torch, a burning creature, a fire bolt, burning ground) makes it hiss, and after your next action it explodes. The blast hurts everything in and beside the gas, you by up to about a third of your health, and leaves fire. Put out your torch or get out first. A pocket that has gone off stays empty for three days.\n\nMining can bring the roof down. Cutting rock that holds up the roof, or rock in a loose patch, may make the ceiling groan; loose rock is more common deeper down. After your next action rocks fall on that tile and the ones around it: up to a third of your health, crippled, and rubble over part of the area. Dig where the roof has support.\n\nCave water almost never freezes: the Deep Caves stay mild whatever the weather above.
guide.deep_overview=Twelve cave slices run down under the surface, with bigger chambers the deeper you go. A cave mouth, a dark hole in open ground, leads to the first. Ladders and pits lead down. A pickaxe's DIG DOWN makes a permanent shaft you can climb both ways; if you have no pickaxe, the dwarf at a miners' camp sells one.\n\nThe Deep Caves have no sky, weather or day. You see 8 tiles; lanterns, fires, glowing mushrooms and crystal shards show from 16.\n\nSlices 1 to 3: bats, rats, slimes, snakes, swarms and spinners. Slices 4 to 6: gnoll brutes, shamans, clay golems, fossil skeletons that burst when they die, crystal wisps by the crystal seams, and albino piranhas in deep pools (their kills count toward the Conch Shell). Slices 7 to 9: golems, pairs of brutes, fungal spinners. Slices 10 to 12, the abyss: golems in pairs, wraiths, the odd minotaur or grey oni, and fire elementals and lost souls on hot ground.\n\nOre veins glint in the rock: copper near the top, iron and silver further down, gold from slice 6, deepsilver from slice 9. Crystal seams can hold gems, diamonds only below slice 3. Once a day the town smith smelts one batch into a masterwork core: 100 copper, 50 iron, 30 silver, 20 gold, or 10 deepsilver or skyiron.
guide.deep_places=Places in the Deep Caves go on your map once you see them.\n\n_Old mine_ (slices 1 to 6): a yard and a timbered gallery with rails and a cart. Skeletons guard a cache of ore, sometimes with torches or a pickaxe. Some have a shaft down.\n\n_Mushroom grotto_ (any slice, more often in damp rock): giant glowing mushrooms, fungal guards and a cache of mushrooms and seeds.\n\n_Crystal cavern_ (slices 3 to 12): crystal walls and glowing shards. Crystal wisps guard a gem cache and come back once a day. From slice 8 down a crystal guardian sleeps there too.\n\n_Miners' camp_ (slices 2 to 8): a fire, bedrolls and a dwarf trader. He pays half again what town shops pay for ore and gems, sells torches, rations and a pickaxe if you have none, and tells you about places near his camp.\n\n_Lake shrine_ (slices 2 to 10): an idol by a deep pool. Once a day you can toss in gold for Bless; more gold buys a longer one. A piranha lives in the pool.\n\n_Burning rift_ (slices 5 to 12): a line of lava across a chamber that flares up a turn after its warning. Rift elementals guard an ancient dwarven forge. It smelts like the town smith's, but takes 7 deepsilver or skyiron for a core instead of 10. You get one smelt a day across all forges.\n\n_Sealed tomb_ (slices 8 to 12): a ring of stone with an iron door, a sarcophagus, a chest and a lich. The key lies in a skeleton's remains nearby. The walls cannot be dug or bombed.
guide.frozen_overview=A frost-rimmed opening on depth 22 leads to the Frozen Halls: four cavern floors, numbered 21 to 24, and the Demon Lord's arena on 25. Climbing out of the top floor returns you to depth 22.\n\nThe air sits near -15 degrees, cold enough for hypothermia (see Weather & Seasons). Wading soaks your boots, making you colder and noisier.\n\nSpawns: brown and gray wolves (wake one and the pack comes), yetis, clay golems, cold spirits and kobold icemancers.\n\nA _caged kobold_ on the first floor wants the _ice key_ and pays with a _Candle of Mind Vision_. The key is carried by the _ice guardian core_ on depth 23: 1,000 health, half speed, four guardians that re-form when broken. Each guardian you break takes 150 off the core. Its death breaks them all and drops the key and a +1 Wand of Frost.
guide.nest_overview=A web-covered hole on prison depth 6 drops into the spider nest: five floors (6 to 10), wider the deeper you go. It loops: the stairs down from depth 10 bring you back to its first floor, and the stairs up from its first floor return you to the prison.\n\nOn each of the first four floors an _egg sac_ sits rooted somewhere. While you can see it, it hatches a spider every 20 turns, up to six spiders at once. It has 10 health and cannot move or attack: kill it first.\n\nThe brood: _spider servants_ (bites that sometimes poison), _spider guards_ (can paralyse you for 3 turns), _bloated spiders_ (double speed; when one hits you it bursts with a random plant's effect) and, from floor 8, _spider minds_ that hang back and enrage the others. From about level 10, spiders give only a quarter of their experience.\n\nThe spider queen holds floor 10.
guide.peaks_heights=From the seventh mountain slice up the air is thin. The longer you stay, the more _Breathless_ builds, up to five stacks: each slows natural healing by 15 percent and makes you hungry faster. Going down clears it slowly; resting by a fire or under a roof, such as a hermit's hut or a waystation, clears it fast.\n\nOn a narrow ridge in a strong wind, gusts strike. Grey streaks blowing past you are the warning. After your next action the gust pushes you one tile downwind, or dazes you if you cannot move. It never pushes you over a drop.\n\nLake ice on the mountains is safe only at -10 degrees or colder. In milder cold the ice near the shore is thin, and from -2 degrees up all of it is. Thin ice groans on the second turn you stand on it and breaks after the third; step back onto a crack and it breaks at once. You fall into the water, soaked and chilled. Frozen rivers and lakes on the surface always hold you.
guide.peaks_overview=Ten mountain slices rise above the surface, each colder than the one below. Cliff stairs lead from one slice to the next. Below the snow line the ground is meadow; above it, snow with pines and boulders. Tarns fill the hollows. Higher ground is rock you can dig with a pickaxe. Lower ground is a drop: fall and you land on the slice below.\n\nBring warmth: fire, cloth armor, an Elixir of Warmth.\n\nSlices 1 to 3: hares and mountain goats by day, grey wolf packs after dusk. If you hit a goat while a drop is behind you, it butts you over the edge. Slices 4 to 7: wolves, yeti, kobold icemancers that slow you from range, cold spirits that freeze you. Slices 8 to 10: yeti (more at night), ice demons, frost elementals and cold spirits.\n\nThe rock holds copper, iron, silver and gold, and the highest summits hold skyiron.
guide.peaks_places=Places on the mountains go on your map once you see them.\n\n_Hermit's hut_ (slices 1 to 5, below the snow line): he sells a few goods, identifies one item free each day, and tells you of a place nearby, a new one each day.\n\n_Eyrie_ (slices 3 to 8, on a cliff edge): a nest with gold, two or three eagle eggs and, in one nest of three, a gem. Two eagles attack anything within 3 tiles of it and chase a thief up to 12.\n\n_Cairn_ (every summit, slices 2 to 10): add a stone, once, to reveal the land 40 tiles around, gain Bless and learn your height.\n\n_Hot spring_ (slices 1 to 6, in the snow): soaking heals you slowly, removes chill and frost, and leaves you warm, and wet, when you get out.\n\n_Frozen climber_ (slices 4 to 10): his remains hold an Elixir of Warmth, Potions of Chilli, food, gold and sometimes a pickaxe. Stand beside him to read his journal page.\n\n_Watchtower_ (slices 1 to 4, on a ridge): from the top of its stair you see the land 26 tiles around, every time. Some weeks a yeti or two bandits lair in it.\n\n_Waystation_ (slices 1 to 9, near a pass): a hearth that never goes out and a warm bedroll. Rest there; it also clears Breathless quickly.
guide.surface_barrows=Carry the Amulet of Yendor out of the dungeon and the run goes on: the barrows open to it. You need the amulet in your pack each time you go down.\n\nA barrow is a dungeon of 4 to 15 floors, built like one of the dungeon's regions and running deeper from there. Its level mostly grows with the distance from the town, but a far barrow can be easy and a near one deadly. The world map shows each barrow's name and level, and the door shows its level and floor count before you go in. The way up from its top floor brings you back out at the door.\n\nThe deepest floor has no stairs down. Its guardian is the region's last kind of monster, with three times the health and a champion's power. It drops gold, two to eight uncursed weapons, armor, wands, rings or artifacts, upgraded more the deeper the barrow, and masterwork cores in the strongest barrows. The barrow then counts as cleared and flies your flag. You can walk its floors again; the guardian does not come back.\n\nNothing in a barrow makes you stronger for good: Potions of Strength, Scrolls of Upgrade and the like turn into gold. Monsters scale with the barrow, with no upper limit, and you keep earning experience.
guide.surface_events=When you hear of an event nearby, the log tells you which way it lies and the world map pins it while it lasts.\n\nA _falling star_ comes down at night on open ground. Its _star fragment_ lies in the crater for three days. The town smith turns two fragments into a masterwork core, and merchants pay well for one.\n\nA _traveling market_ sets up around a human village's well for three days. Its two or three stalls sell rings, wands, artifacts, exotic potions and exotic scrolls that village shops do not carry, at a quarter above the usual price.\n\nBandits _raid_ a human village for a day; the smoke shows from far off. Kill every raider before the day ends and the village pays you 60 gold plus 15 per house and a good weapon, armor, wand or ring, and its vendors sell to you at three quarters of the price for that day and the next three. If the raid lasts the day, its shops stay shut for two days.\n\nOn some nights a _wolf pack_ hunts a deer near you, and you hear the howl. The wolves ignore you unless you get close or hit one; then the whole pack turns on you. A deer they bring down leaves meat.
guide.surface_overview=Around the town lie meadow, forest, plains, swamp, desert, tundra, rivers and sea. You can wade shallow water; deep water stops you. In a hard frost rivers and lakes freeze, and that ice holds you.\n\nThe snow line on the mountains moves with the season. Rain soaks you and wind chills you; dress for where you are going and carry fire.\n\nRoads join the villages. On them you meet travelers and caravans, and sometimes bandits. Off the roads, wolves come out after dark.\n\nThe world map shows what you have seen and the places you have heard of. Cliff stairs climb to the mountains and cave mouths lead down to the Deep Caves. The town is at the center of the map.
guide.surface_villages=Villages stand on plains and meadows. Most are human, about a quarter are peaceful gnoll clans, and about 1 in 8 is a bandit hold.\n\nA human village has vendors (more in bigger villages) and families going about the day; villages of nine houses or more post guards at the well. Gnoll clans are peaceful but have no shops. A bandit hold is three to five bandits who attack you.\n\nYou can open any house door. Half the houses have someone at home, and none hold loot. Indoors, hypothermia and heatstroke end at once and cannot touch you, so when the weather turns on you, get inside.\n\nTraveling markets and bandit raids both come to human villages.
guide.surface_wilds=The world map marks more than villages. Each of these holds its loot once.\n\n_Ruins_ (forest, foothills, tundra, desert): fallen dungeon entrances, guarded by two or three skeletons. The stair in the middle leads to the dungeon's first floor, and climbing out of the dungeon brings you back up there.\n\n_Abandoned camps_ (forest, meadow): one chest with food, a potion, thrown weapons or some gold.\n\n_The great oak_ (forest): three seeds and a dewdrop in the hollow at its foot.\n\n_Standing stones_ (plains, tundra, snowfield): a scroll in the middle of the ring.\n\n_Dragon lairs_ (foothills, mountains): three piles of 200 to 600 gold and a dragon. Walk past.\n\n_Barrows_: square stone doorways on dry, level land, with a stair in the middle. They open only while you carry the _Amulet of Yendor_.
guide.temple_overview=A stair on depth 14 leads to the temple. The game asks before you enter, and you can climb back out. Inside, twelve rooms in two columns lie between the entrance and a stair at the far end, in random order: ten trials, one supply room and one empty room.\n\nThe trials: grass hiding up to 32 mimics; a pool with four piranhas; temple sentries that shoot along lines; four sentries guarding four chests with crystal keys; hidden explosive traps; a room with 17 Stones of Blink; twelve gnoll guards; a maze; confusion vents; water under thunderclouds. The supply room holds food, two piles of 6 to 10 energy crystals and three potions.\n\nThe center of every room has a skeleton with one or two potions, scrolls, food or gold. A _Scroll of Upgrade_ lies at the far stair. That stair leads only to a small empty room.
guide.topic_rarity=Every weapon, armor, thrown weapon and wand has a _rarity_: common, uncommon, rare, legendary or exotic, shown by the color of its name. Legendary gear appears from depth 5, exotic from depth 15, and both grow commoner deeper down. Rarity adds a share of the piece's own damage, blocking or zap power, from a twentieth (common) to three tenths (exotic), and bonus lines: one on common and uncommon, two on rare and better, rolling higher the rarer the piece. Legendary and exotic weapons and armor come already enchanted or glyphed.\n\nEach piece also has a _type_ (gamma, beta or alpha) shown in its corner. It sets the strength of the piece's built-in perk: double at beta, triple at alpha, and alpha adds a twist. A _type shifter_ raises it: one takes gamma to beta, two take beta to alpha. Nothing lowers a type. Shifters are rare kill drops and are sold in the Undercroft.\n\n_Masterwork_ is paid in masterwork cores at the blacksmith in the caves or the town smith. Ten steps lift every bonus line: steps 1 to 5 cost 1 core, 6 to 9 cost 2, and the tenth costs 3 and needs legendary or exotic gear. A fully masterworked weapon heals you a twentieth of your health on a kill and armor gives that much shield, at most once every 10 turns; a wand gets a fifth of its charges back on each kill. Every boss drops 1 or 2 cores; the town smith also pours them from mined ore or two star fragments, and the breaker's bench turns rare and better gear into them.\n\nRings, trinkets and artifacts have a type but no rarity.
guide.topic_rooms=From depth 2 or 3 down to 24, one of these rooms appears every 2 or 3 floors, never on a boss floor; you see each kind once before any repeats.\n\n_Rival's gallery_ (iron key): a statue fights with a weapon like yours, one rarity higher, and drops it when it dies.\n_Tempering forge_: lay gear on the anvil, light the coals, keep it white-hot for 3 turns, then quench it in the trough or with frost; its weakest bonus line rises to its best, or it gains a free masterwork step. Past 14 turns of white heat a line burns out. One use per anvil.\n_Breaker's bench_: legendary or exotic gear becomes a masterwork core, rare gear a third of one.\n_Pedigree hall_ (iron key): three copies of your gear (common alpha, rare beta, legendary gamma); taking one shatters the rest.\n_Frozen cache_: the prize sits in ice; melt it with fire or smash it, which is loud and can ruin a potion or scroll inside.\n_Bellows_: the wind pushes gas down the gallery and helps throws that go with it.\n_Elemental lock_: wake three runes with heat, frost, plants or water to open the gate.\n_Hothouse_: spring all year.\n_Incubator nest_: an egg on coals that brood it.\n_Counterweight vault_: weigh down both plates with a body, armor, a weapon, a chest or 300 gold.\n\nAny floor can hold a _thermal spring_ (1 health every 4 turns, ends chill and frost, keeps you warm for 150 turns after) or a _wayfarer's camp_. Light the camp fire before you sleep on the bedroll: it halves the chance monsters catch you asleep and keeps you from waking frozen. A secret squirrel's hoard holds seeds, 8 in autumn and fewer otherwise.\n\nOnce a region, on its second, third or fourth floor, a secret door opens on _the Undercroft_. At night a dealer sells legendary gear, masterwork cores, type shifters and a golden skeleton key that opens any lock, and he buys at half again a shop's price. Every deal adds heat; at 3, a collector hunts you on every floor until you kill him. Attack the dealer or his guards and every market stays shut for the run.
guide.topic_skills=Talents and skills share one pool of points: 2 at the start and 3 per level. A talent point costs 1; a skill level costs its tier, so deeper skills in a branch cost more. Each skill has 3 levels. Some branches hold pairs where taking one locks the other for the run. The mercenary at the inn sells 3 points for each boss you have killed.\n\nMost skills are actions that cost mana. The skills tag shows while you have points to spend or a skill to use: tap it to pick a skill, long-press it to open the tree. A targeted skill costs nothing if you cancel it.\n\nThe warrior cracks the ground, leaps and smashes. The mage keeps orbiting fire and ice orbs and calls meteors. The rogue fights beside shadow copies of himself. The huntress looses arrow storms and grows binding briars. The duelist lunges and spins a storm of blades. The cleric heals, raises pillars of light and calls a guardian spirit.\n\nThe ability the Dwarf King's crown gives your armor can also sit on a skill slot.
