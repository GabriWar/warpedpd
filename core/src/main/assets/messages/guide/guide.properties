# Warped Pixel Dungeon — Descent Guide (a dead delver's journal; pages found on the dungeon floor)
guide.boss_crabking=The _Crab King_ has 300 health, hits for 20 to 50 along any clear line at any distance, and moves at double speed. He never walks up to you: he teleports to another spot in view, and if you reach him he jumps away after a few attacks. Bring ranged attacks.\n\nHis power is the _lightning shell_ at the top of the hall: 600 health, and it cannot move or dodge. Four _shell crabs_ (20 health) shoot lightning for 15 to 30. While the shell lives, any hit over 5 damage on a crab is cut to 1 and the damage is stored in the shell as charge, which never fades on its own. The king heals from that charge, and the shell spends it zapping you. Hitting the shell from beside it while it holds charge shocks everything next to it.\n\nSo kill the shell first, from range; if it holds no charge, melee is safe. Its death clears the charge, and the crabs then take full damage. If you must hit a crab before then, keep each hit at 5 damage or less.\n\nHe resists poison, toxic gas and Grim.
guide.boss_dm300=DM-300 has 300 health and hits for 15 to 25. At 200 and again at 100 health it _supercharges_: it can't be hurt, moves twice as fast, digs through walls, and a power pylon other than the one nearest you turns on. Destroy that pylon to end the charge. After the second pylon falls it never charges again, and the last 100 health is a straight fight with the water and wires live.\n\nWhen not charged it uses one of two abilities, usually switching each time. _Toxic gas_: get out of the cloud. _Rockfall_: if you are close it knocks you back, then marks a 7 by 7 area around you. One tile next to the center is always safe. Rocks deal damage and stun for 3 turns.\n\nKeep it off the _exposed wires_. Sleep doesn't affect it; terror, charm, vertigo, cripple, chill, frost, roots and slow last half as long.\n\nIt drops 2 to 4 metal shards, the Sokoban Portals page and, if you never picked one up, _Otiluke's Journal_. A Lloyd's Beacon you carry gets a free upgrade. Kill it without taking a pylon shock or an electrified-water hit, and without being attacked while it is charged, to earn the boss challenge badge.
guide.boss_dwarfking=The Dwarf King has 300 health and fights in three phases. He can't die in the first two.\n\n_Phase 1_: he hits for 15 to 25 and summons servants on the four pedestals: mostly ghouls, every fourth a monk or warlock. He can link his life to a servant so it shares your damage, or step back while teleporting a servant next to you. Damage you deal him speeds up his summoning. Kill servants first, but ignore them as he nears 50 health: at 50 health he moves to the throne and every servant dies.\n\n_Phase 2_: a 300-point shield nothing breaks; stop hitting him. Every servant summoned now takes 25 off the shield when it dies, so twelve kills end the phase. The last wave brings a warlock, a monk and two ghouls at once. Ghouls revive each other and a revival doesn't count, so kill them apart. A summon that finishes while you stand on its pedestal appears beside you instead; only if every tile around is blocked do you take 20 to 40 damage and the shield loses 25.\n\n_Phase 3_: he summons nonstop, and your damage reaches him over the next turns instead of at once. Keep hitting; none of it is lost.\n\nHe drops the _King's Crown_ (turns your armor into class armor with a special ability), the Sokoban Puzzles page and, if you never picked one up, Otiluke's Journal. A Lloyd's Beacon you carry gains a level, and warlock degrade on your gear ends.
guide.boss_dwarftomb=The tomb stands two tiles north of the throne and takes no damage while the Dwarf King lives.\n\nWhen he dies, a _dwarf lich_ steps out on each open side of it, up to four. Each has 100 health and fires bolts for 20 to 32, but only from range: next to you a lich can't attack and tries to back away. The floor unlocks at the same time, so you can leave.\n\nBreaking the tomb kills every lich and wraith on the floor. It never attacks and no effect sticks to it, but it has 600 health and armor up to 18.\n\nInside: 4,900 to 9,999 gold, a _skeleton key_ and an _armor kit_, which turns any armor into class armor as the crown does.
guide.boss_goo=_Goo_ has 100 health and heals 1 every turn it stands in water. Fight it on dry ground.\n\nWhen it first sees you, up to four _poison goos_ ooze out beside it. Each has 50 health, moves at double speed and poisons you on every hit, then runs off leaving webs. They heal in water, and while Goo lives every hit splits them; kill Goo first and they stop splitting. Each of the first four drops a Potion of Mending.\n\nWhen Goo swells and shouts, it is charging a slam: two turns later it hits up to 2 tiles away along a clear line for triple damage. Step out of reach or behind a wall or pillar; if it has to move, the charge is lost.\n\nBelow half health it hits harder, dodges more and charges far more often. Save potions and scrolls for this half; if it heals back above half, it calms down. A third of its hits leave _ooze_ on you, which hurts every turn until you step into water.\n\nWhile the floor is sealed, your regeneration stops if you go too long without damaging Goo, and each point it heals in water shortens that time.\n\nIt drops the _worn key_, 2 to 4 goo blobs, the Sokoban Practice page for Otiluke's Journal, half the time a Mr Destructo turret, and the _chainsaw hand_: a cursed tier 5 weapon that will not come off once equipped. Switched on, each hit burns dew from your waterskin for extra cuts.
guide.boss_otiluke=Don't fight it without a _relic weapon_. The golem has 7,000 health, and every hit, wands and pets included, deals only 1 to a quarter of its damage, except a relic's hits. Forge a relic at the town altar first.\n\nIt stays still until hit, so pick your ground before the first blow: at least 5 tiles from every lit tower. Each hit you land may wake a guardian.\n\nIts melee hits for 250 to 350 and almost never misses. At range it fires bolts for 100 to 160 that pass between its guardians, and half of them weaken you. It is immune to terror, charm, sleep, vertigo, fire and toxic gas, and resists poison.\n\nWhen it dies the floor unlocks, the towers stop, and it usually drops a potion. The _Palantir_ takes you to depth 99 and back to where you used it; don't use it until you are ready for Zot. Otiluke himself returns only after Zot dies.
guide.boss_shadowyog=Ten Shadow Yogs. Each has 50 health per hero level (at least 1,000), hits for 45 to 125, moves at double speed and rarely misses. Each gains 1 armor for every creature on the floor, so thin the cavern first and avoid the hidden summoning traps.\n\nThey start asleep. Attack from out of sight, hold the room's door and fight one at a time.\n\nBelow an eighth of its health, each hit has an even chance to make it teleport away; if the floor is short of monsters, spectral rats appear where it lands. Every hit on a Shadow Yog also re-arms up to four used traps in your sight as hidden summoning traps. Finish each one fast.\n\nThey ignore terror, amok, charm, sleep, fire, toxic gas, vertigo and Grim, and cannot be lured. Roots, cripple, slow, cold and Doom still work.\n\nOnly the last one drops the _Orb of Zot_, once per run: throw it to set up a turret, or break it for the Town page of Otiluke's Journal. Its death kills every remaining rat and oni, and the SanChikarah can take you home.
guide.boss_skeletonking=The _Skeleton King_ (550 health, hits for 20 to 40, armor up to 25) fights with two giant hands (200 health each, hits for 10 to 30). All three fly, so terrain never slows them.\n\nEach hit has a 1 in 2 chance to curse you: the king weakens you, the burning hand sets you on fire, the rooting hand roots you for 20 turns. Then that one flies away and returns only when the curse is gone. Cure it fast and they come back to you, onto ground you chose. Don't chase three fliers through the brush.\n\nKill order: rooting hand (rooted, you can't escape the other two), burning hand, king.\n\nAll three are immune to fire, but the brush burns: use the liquid flame from the chamber to clear it. The chamber's water puts out your own fire. Heavy hits get through the king's armor better than fast light ones.
guide.boss_tengu=Tengu has 200 health and attacks from range along any clear line. No single hit takes more than 25 health off him, so huge hits are wasted. His aim is half as good against someone standing next to him.\n\n_Phase 1, his cell:_ every 25 health he loses, he jumps to a new spot and sows hidden poison dart traps across the cell, more as he weakens. Each trap flashes once when planted and cannot be found by searching, so remember where the flashes were. Ranged attacks let you stay on tiles you know are safe; chasing him walks you over traps.\n\nAt half health he vanishes and the prison rebuilds. Nothing attacks you in the pause: heal, then walk back up the hall to start phase 2. Items you left in the cell come back after the fight.\n\n_Phase 2, an oval arena with no cover:_ every 25 health he loses, he jumps away and uses two or three more tricks. The first is always a bomb that blows up 3 turns later; leave its blast area. The second is always a lightning post that shocks the tiles around it until the fight ends. He also breathes fire in a cone toward you: step sideways out of it. Kill him quickly.\n\nWhile the floor is sealed you stop regenerating if you stop damaging him. Roots, blindness and terror do not affect him. Mirror images soak up his normal attacks.
guide.boss_thiefking=The _Thief King_ (500 health) flies and hits for 20 to 70 along any clear line at any distance. Chasm tiles do not block his shots; only walls do. Approach from the side, never across an open lane.\n\nTwo _bandit kings_ escort him: 200 health, double speed, flying. Each of their hits puts _Countdown_ on you if you don't already have it, and then they fly off. After 6 turns Countdown takes a quarter of your max health, and every bandit king alive heals an eighth of your max health. Pin them with roots or fight from a corner where only one can reach you. Bandit kings here never drop the spork.\n\nLightning does half damage to him, and pushing him toward the chasms does nothing because he flies. If the hall gets crowded, fall back to the entrance doorway rather than fight near the holes.
guide.boss_yog=1,000 health. Yog never moves and can't be hurt while a fist lives. Every 300 damage brings out a fist and darkens the arena: three fists in all, one from each pair (burning or soiled, rotting or rusted, bright or dark). After the third dies it floods the arena with servants and acts much faster for its last 100 health.\n\n_Beams_: the target cells light up, then the beams fire through everything and never miss (20 to 30 each). Step off the lit cells. It fires more beams as it weakens, but always leaves one cell next to you clear.\n\n_Summons_: one ripper for each demon spawner still alive, larvae for the rest.\n\n_Fists_ can't be hurt within 4 tiles of Yog, so draw each one away first.\n_Burning_: immune to frost; standing in water stops its fire, though it boils the water off.\n_Soiled_: each tall grass tile around it cuts your damage by a sixth; burn the grass.\n_Rotting_: heals in water, and your hits turn into bleeding, so only your biggest hit counts.\n_Rusted_: can't enter corridors; your damage lands late but all of it lands.\n_Bright_: at half health it blinds you and teleports away.\n_Dark_: at half health it snuffs your light and teleports away; carry a spare torch.
guide.boss_zot=10,000 health and armor up to 100. He takes 1 to a quarter of every hit, except a relic weapon's hits and _Jupiter's Wraith_. He regenerates 50 to 100 health a turn, only 1 while you wear the _auto potion charm_.\n\nHe moves at double speed and hits for 300 to 400, in melee or along any clear straight line. To approach he teleports to a cell in your view, and after 5 attacks beside you he teleports again. Each teleport leaves a _Zot phase_, up to 7 (11 for a huntress): 1,000 health, the same damage cut, two 115 to 160 hits a turn or an 80 to 160 lightning bolt (half again in water). One phase in three drops a scroll.\n\nDon't paralyse him, and mind that the Wraith's blast can: each paralysed turn he heals 200 and summons a _magic eye_ beside you (400 health, flies, 50 to 100 beam). A huntress also summons an eye with every hit she lands.\n\nHe is immune to fire, gas, sleep, terror, amok, charm, vertigo and vampiric weapons, and resists poison. Corridors limit where he can appear. His death kills every phase and eye.
guide.caves_f1=_Vampire bats_ are fast, fly, and heal from every bite that lands. Fight them in a doorway or slow them. They sometimes drop a _Potion of Mending_; those drops stop after seven.\n\n_Gnoll brutes_ don't die at 0 health. They enrage with a shield of about half their health and hit twice as hard. The shield drains 4 a turn, so backing off for six turns finishes them. A brute that dies in a chasm fall skips the rage. Terror doesn't work on them. The rare armored brute rages for 60 turns but always drops armor.\n\n_Gnoll shamans_ curse you from range: red weakens you, blue makes you vulnerable, purple (the rarest) hexes your accuracy and evasion. They are the frailest monster here; break line of sight and close in.\n\nThis floor has the region's _shop_ and a toadstool mushroom for the tinkerers. The blacksmith appears from depth 12.
guide.caves_f2=The _troll blacksmith_ is on depth 12 (1 in 3), 13 (1 in 2) or 14 (always). His room has two free items on pedestals and the ladder to his mine. He gives you a _Pickaxe_ and asks for _dark gold_ from the mine. It admits you once: leaving ends the job, so go down with food, healing and pack space. He can't be hurt. Bring him all three pieces of the _SanChikarah_ and he forges them into one.\n\nThe Pickaxe needs tier 3 strength for tier 2 damage. The duelist's ability with it never misses, deals double damage to inorganic monsters and to crabs, spinners, scorpions, bees and swarms, and leaves the target vulnerable.\n\n_Cave spinners_ start here. They web the tile you are moving toward, so change direction instead of running straight. A bite can poison you; then the spinner backs off and webs you from range.\n\nRarely, a _broken robot_ shows up here early (see depth 13).
guide.caves_f3=The _DM-200_ arrives: 80 health, too large to enter corridors or doorways. When it can't reach you it vents toxic gas toward you. Fight it in the open and stay out of the gas. Its first drop has a 1 in 5 chance to be City-tier weapon or armor; each drop after that is a third as likely.\n\nThe _broken robot_ fires a beam every three turns that hits everything in the line, monsters included. Once it has seen you, it has a 1 in 50 chance each turn to explode and hurt everything next to it, so don't stay adjacent. It gives 13 experience, the most in the Caves, and often drops a Scroll of Recharging.\n\nThe rare _DM-201_ never moves. Hit it from range and it throws caustic gas at you; hit it only from an adjacent tile and it never does. It drops a metal shard unless you are above level 19.\n\nThe laboratory is on this floor half the time, otherwise on depth 14. If the blacksmith wasn't on depth 12, he may be here.
guide.caves_f4=The last regular floor and the busiest: 7 to 9 monsters, two DM-200s in the mix, and _clay golems_ (40 health, heavy armor, slow attacks, immune to terror and sleep). Rarely a ghoul wanders up from the City; alone, it can't revive.\n\nThe troll blacksmith is here if you haven't met him, and the laboratory if depth 13 had none. Any Potion of Strength, Scroll of Upgrade or stylus the region still owes you appears here. The stair to the _temple_ is on this floor too.\n\nIf you still lack the _Caves Ancient Key_, this floor has a _giant piranha_ that drops it (the first piranha you kill after reaching depth 11 always does). If the piranha spawned on dry ground it has already died, and the key lies where it fell.\n\nIf you plan to buy the smith's upgrade, do it before reading your own scrolls on that item: he only upgrades items below +2.
guide.caves_f5=Nothing attacks until you come within three tiles of a pylon; then the arena seals. Use that time to learn the layout.\n\nThe _exposed wires_: when DM-300 stands on one it gains a shield of 30 plus a tenth of its missing health, so keep it off them. The water: while a pylon is active, all water and wires are electrified and hurt anything that isn't flying for 6 to 12 a turn. After the second pylon dies they stay live for the rest of the fight.\n\nAn active _power pylon_ (50 health) shocks two opposite adjacent tiles for 10 to 20 and turns one step clockwise each turn; stand where it isn't pointing. Any hit above 14 damage is cut down hard, so use fast, light attacks. Every pylon has a dry path to it, and the floating sparks drift toward the active one.\n\nWhen DM-300 dies the gate opens and the stairs lead to the City.
guide.caves_mine=Most of the mine is solid rock: dig with the Pickaxe. A rock tile costs 4 hunger; crystal, boulders and gold cost 1. The mine has one food item, two in the gnoll version.\n\nYou are here for _dark gold_. Each piece is 50 favor, up to 40 pieces (2,000). The mine holds 45 to 47, so stop at 40. Two secret rooms behind hidden doors hold 4 or 5 each. Killing the mine's boss adds 1,000 favor. Leaving the mine ends the job.\n\nThe mine comes in one of three kinds:\n_Gnolls_: each large room has a gnoll sapper and a gnoll guard. The guard takes a quarter of your damage while its sapper lives, so kill the sapper first. The guard's spear hits harder at range; fight it adjacent. Sapper rockfall stuns anything it hits, a guard for 10 turns, so get the guard caught in it. Beside a barricade the sapper throws boulders instead. The boss, the gnoll geomancer, can only be hurt by the Pickaxe while its rock armor holds, and not at all while a sapper serves it.\n_Crystal_: crystal guardians sleep in the large rooms; don't wake them. They can't die, only be knocked out, and move at a quarter speed in narrow passages. The boss, the crystal spire, can only be hurt by the Pickaxe. Its spikes cripple guardians, and when it shatters every guardian it can see shatters too.\n_Fungi_: fungal sentries can't move but poison you from range the moment they see you (200 health each). Fungal spinners take less damage next to tall grass. The boss, the fungal core (300 health), never moves or attacks.\n\nBack above, favor buys: the Pickaxe back (250, free if you earned 2,500), a reforge of two items of one kind into one better item (500, then 1,000 more each time), hardening so upgrades are less likely to strip an enchantment (500, same rise), an upgrade to an item below +2 (1,000, same rise), or a forging: pick one of two weapons, a thrown weapon and an armor, sometimes secretly enchanted (2,000). Leftover favor turns into gold.
guide.caves_overview=Depths 11 to 15, an abandoned dwarven mine. The ore veins in these walls are decoration; the only ore you dig here is dark gold, in the _Blacksmith's Mine_ that opens off one floor between depths 12 and 14.\n\nMonsters here wear heavy armor and hit hard. Arrive with upgraded gear.\n\nEach floor is bigger than the one above: depth 11 is the smallest and has the region's _shop_, the last before depth 16; depth 14 is the largest and holds 7 to 9 monsters at once. Where two caverns touch, the floor often drops into a chasm. A monster that falls in with more than four fifths of its health lands alive on the floor below, crippled and bleeding; a weaker one dies, gives half its experience, and its drop lands below.\n\nRain and snow still reach the Caves; no floor below depth 15 gets weather. On full-moon nights red wraiths spawn from dusk, more after dark. Most traps are fire, poison dart, frost, storm and corrosion; a rare pitfall drops you one floor.
guide.city_f1=The shop sells scale armor, a tier 4 weapon and thrown weapon, tipped darts, bags, a golden portable chest, a _Stone of Augmentation_, an _Ankh_, a Potion of Healing and Scrolls of Identify, Remove Curse and Magic Mapping.\n\n_Ghouls_ come in pairs. One killed while its partner can see it or stands within 4 tiles collapses and gets up 5 turns later with a tenth of its health (10, then 15 turns, on later falls). Kill both together, split them up, or drop a wounded one into a chasm.\n\n_Elementals_ fly and shoot fire, frost or shock. Frost on a fire elemental, or fire on a frost one, takes half its health at once. The rare chaos elemental always drops a Scroll of Transmutation.\n\n_Warlocks_' bolts degrade your gear for a while; break their line of sight. 5 in 6 drop a potion.\n\n_Tinkerers_ throw from range, back away when you close in, and always drop a Scroll of Magical Infusion. Clay golems and spider bots fill out the floor.
guide.city_f2=_Monks_ hit twice a turn, and 1 hit in 12 knocks your weapon to the floor (a cursed one stays in hand). A hunting monk builds focus and parries your next attack, however accurate. Spend the parry with a cheap attack, then hit hard; wands and fire ignore it. Kiting makes him refocus faster. The rare senior monk hits half again as hard and can stun you for a turn.\n\nThis floor spawns the most _elementals_. In water a frost elemental always freezes you and a shock elemental's arc reaches you, while a fire elemental can't set you alight.\n\nThe _Ambitious Imp_ appears here 1 run in 3. His job is a heist in the dwarven vault under his room: see Ancient Dwarven Vault.
guide.city_f3=_Golems_ arrive: 120 health, hits of 20 to 60, immune to terror, sleep and amok, and they rarely dodge. They are too big for one-tile corridors, so fight from one. A golem that can't reach you pulls you to it or teleports itself; you won't outrun one in the open. The first drops halls-quality armor or a weapon 1 in 5, each later drop a third as likely.\n\n_Minotaurs_ (120 health) gore you on a third of their hits, leaving you bleeding and crippled, then back off until the bleeding stops.\n\nNow and then a _dwarf lich_ spawns on 18 or 19. It shoots for 20 to 32, backs away, and can't attack you while you stand next to it: corner it. It gives the most experience in the city and drops a healing potion 1 in 5.\n\nIf the imp skipped 17, he is here 1 run in 2.
guide.city_f4=Three golems, two monks, two warlocks, an elemental and a minotaur make up the spawns. Fight in corridors.\n\nIf no gold thief has given up the _City Ancient Key_ yet, a _crazy gold thief_ waits here. He hits twice a turn for 30 to 50, steals 100 to 500 gold and runs; hits while he flees knock out a few coins, and he fights when cornered. He drops your gold, a shuriken and the key (see the Gold Vault). Each gold thief you kill this run makes the next one tougher.\n\nRarely a _succubus_ comes up from the halls.\n\nThe imp is here if he hasn't appeared yet. Any strength potion, upgrade scroll or stylus the city still owes you is on this floor, and depth 20 has no loot: spend them now.
guide.city_f5=A hall of bookshelves leads to the throne room: the throne in the middle, four summoning pedestals on the diagonals. Step in and the door locks until the Dwarf King dies. Nothing spawns here; the only loot is what a fallen hero left near the entrance.\n\nCome at full health with an _Ankh_. Before a servant appears its pedestal shows what is coming: bones for a ghoul, green flame for a monk, shadow for a warlock (sparks for a golem on the Badder Bosses challenge).\n\nAfter the king dies the north door opens onto a walkway over a chasm; falling lands you on depth 21. If the imp scored you over 2,000, his shop is on the walkway: plate armor, three torches, tier 5 weapons, an Ankh, a crystal portable chest and the books of the dead, the living and the heavens.\n\nBadge: kill him without hitting him with a weapon, a wand (lightning is allowed), a Ring of Force or a cleric spell.
guide.city_overview=Depths 16 to 20. Ghouls, warlocks and monks are the city's undead; elementals, golems, minotaurs and a tinkerer's machines walk with them.\n\nDepth 16 has a _shop_, the last before the Dwarf King. The _Ambitious Imp_ appears on 17, 18 or 19, always by 19. Depth 20 is the king's throne room.\n\nNo rain or snow reaches this deep, and the air runs warmer than the caves. Stand by a fire on a hot day and you can get heatstroke.\n\nCommon traps: frost, storm, corrosion, blazing, disintegration. Rarer: rockfall, flashing, guardian, weakening, summoning, warping, cursing, pitfall and a few more.\n\nUnder a full moon, blue wraiths spawn here at dusk and night, and dwarf liches at night.
guide.city_vault=The pit in the _Ambitious Imp_'s room leads to a sealed dwarven vault. Talk to him first: he wants the _obsidian statuette_ inside.\n\nGoing in heals you to full. Your gear and gold stay with the imp; you enter in cloth armor with an _Escape Crystal_, which takes you out at any time. The stairs inside do nothing. You can't enter during the Ascension.\n\nGuards wander slowly and see in a cone in front of them. Stay behind them; one that glimpses you for a moment only comes to look. Killed guards drop _dwarf tokens_ that open the token door. Loot lies around to fight with, plus a healing potion near the start.\n\nNear the far door of the last room the entrance locks and a vault elemental appears; it changes between fire, frost and shock. Behind it wait the statuette and the imp's prizes: an artifact or ring, a second ring, two weapons, plate armor and a wand, all +2 or better and uncursed.\n\nWhen you leave, your gear returns and everything from the vault is lost except one item. With the statuette the imp scores you 4,000 and you keep any item. Without it he scores exploring (up to 1,000), tokens or the opened token door (up to 1,250) and the summoned elemental (the full 750 if you kill it; if it lives, less the more you hurt it), and the better the score, the better the item you may keep; under 500, none. Over 2,000 and he opens a shop past the Dwarf King's throne.
guide.den_crab=The Conch Shell takes you to a dry chamber below a hall that is entirely water. Lightning from the _lightning shell_ and its crabs does half again as much damage to anyone standing in water; a _potion of levitation_ prevents that.\n\nAt the top of the hall sits the lightning shell, with four _shell crabs_ around it, and the _Crab King_ circles the hall. See the Crab King's page for the fight.\n\nThe king drops 1,900 to 4,000 gold and the _adamantite armor_. Each shell crab drops a _golden skeleton key_, which opens any one lock on any floor and is then spent. Killing the king lets the Conch Shell take you home; the shell is used up.
guide.den_infest=The SanChikarah sets you on a pedestal in a small walled room in the middle of a large dark cavern. You see 6 tiles. The room's only door is on its south side. The moment you step out, ten _Shadow Yogs_ appear somewhere out of sight, asleep.\n\nTwenty monsters already roam: _grey oni_ (500 health, hits of 55 to 115) and _spectral rats_ (four times your speed, bolts of 20 to 45 that weaken you, no experience). More arrive about every 50 turns, so the cavern never stays empty. Every creature on the floor adds 1 armor to each Shadow Yog.\n\nA row of visible summoning traps lines the top of your starting room, and hidden ones are scattered through the cavern; each calls more monsters. There is no water, no grass and no loot.\n\nFight at the room's door so they come one at a time. A Lloyd's Beacon works here.
guide.den_skeleton=You arrive in a narrow chamber under a hall of statues overgrown with shrubs and tall grass. Both side columns of the chamber are water. A _potion of liquid flame_ lies by the door: everything in this den is immune to fire, so use it to burn the brush and open sightlines.\n\nStep through the door and the _Skeleton King_ and two giant _skeleton hands_ wake, all flying. See the Skeleton King's page for the fight.\n\nThe king drops 1,900 to 4,000 gold and the _adamantite weapon_; each of the three may drop a Potion of Liquid Flame. Killing the king lets the Inscribed Bone take you home; the bone is used up.
guide.den_tengu=The smallest den: a damp cave of water and grass, with _Tengu_ already hunting you. This Tengu has 400 health, moves at double speed, hits for 15 to 25 and blocks the first 20 damage of every hit, so light weapons barely scratch him. Use heavy hits.\n\nNo phases and no traps. Below half health he uses one trick, usually a bomb; step out of the blast and keep fighting. Roots, blindness and terror do not affect him, and he resists poison and toxic gas. Fight in a corridor; you cannot outrun him.\n\nHe drops 1,900 to 4,000 gold and an _adamantite ring_. Only then will the key take you home; Lloyd's Beacon does not work here.\n\nA hidden door leads to the Rat King's treasure room. Its chests hold gold, seeds, an egg, food, a cluster bomb or a Mr Destructo, and one chest is a _mimic_. The key is not used up, so you can come back after Tengu is dead and loot in peace; he does not return.
guide.den_thief=The Ancient Coin opens a vault with two columns of single chasm tiles running up the hall. A chasm drops you to depth 41, which has no way out (see Thief Catch). Treat every chasm tile as the end of the run, and keep away from them when anything could push or confuse you.\n\nThe _Thief King_ and his two bandit kings wait here; see his page. Fire and poison work normally on everything here.\n\nHe drops 1,900 to 4,000 gold, an _adamantite ring_ and, 1 in 3, a scroll. Killing him lets the coin take you home; the coin is used up. The coin calls him the 'Bandit King'; the bandit kings are his escorts.
guide.den_thiefcatch=Depth 41 is a trap. You only get here by falling through a chasm on depth 40, and nothing takes you out: the floor counts as a boss floor, so Lloyd's Beacon, the SanChikarah and every den key refuse to work, and there are no stairs. The run goes on here with no way back.\n\nThe floor copies the Tengu den: a few rooms with water and moss, and a paved-over spot where an exit should be. There are no items. If the den Tengu (depth 36) is still alive when you land, one bandit king spawns here too.
guide.dens_overview=The boss dens (depths 35, 36, 37, 38 and 40) have no stairs. Each opens only with its own item, used on a non-boss floor of the main dungeon between 2 and 24 (the SanChikarah works from 1 to 26). The same item takes you back, but only after the den's boss is dead. The Inscribed Bone, Conch Shell and Ancient Coin are used up on the way back; the Tengu Ancient Key and the SanChikarah are kept.\n\nWhere they come from:\n_Tengu Ancient Key_ (36): the first gnoll archer you kill after Tengu is dead.\n_Inscribed Bone_ (37): moss covered skeletons. From the 51st kill each has a 1 in 10 chance; the 101st is certain.\n_Conch Shell_ (38): albino piranhas, same counts.\n_Ancient Coin_ (40): gold thieves, same counts.\n_SanChikarah_ (35): forged by the blacksmith in the caves from its three pieces.\n\nRewards: an adamantite ring at 36 and at 40, the adamantite weapon at 37, the adamantite armor at 38, 1,900 to 4,000 gold from each boss, and the _Orb of Zot_ at 35. The town smith uses adamantite to reinforce a matching weapon, armor, ring or wand.\n\nSuggested order: Tengu, Skeleton King, Thief King, Crab King, then 35. A Lloyd's Beacon works in every den except the Tengu den. There is no depth 39. A chasm on depth 40 drops you to 41, which has no way out. The air is hot.
guide.halls_end=A bridge over a void, candles, and the _Amulet of Yendor_ on its pedestal. Nothing spawns here.\n\nTaking it doesn't end the run. At the depth 25 stairs you choose whether to start the _Ascension_. If you do, floor-to-floor teleports stop, the Amulet can't be dropped, and monsters get much stronger, the shallow ones most. Each new floor adds 2 to its curse: at 2 it calls distant monsters to you, at 4 they move faster, at 6 you are slowed, from 8 it hurts you every turn. Killing boosted monsters lowers it. Old boss floors add nothing and restore your health and hunger.\n\nCarry the Amulet up the stairs of depth 1 and the curse lifts. On the surface the Amulet then opens the sealed barrows.\n\nYou can also leave it behind and climb without the curse.
guide.halls_f1=_Succubi_ (80 health) teleport next to you from more than 2 tiles away. A third of their hits charm you; while you are charmed their hits heal them, and healing past full becomes a shield. Fight them up close and break the charm fast. A third drop a scroll, never Identify or Upgrade.\n\n_Evil eyes_ charge for 2 turns, then fire a 30 to 50 beam down the line to the first wall, aimed where you stood. While charging they take a quarter damage. Step off the line, then hit them. Disintegration does them half damage.\n\n_Chaos mages_ move at double speed, heal from the damage they deal, and their hits can confuse, poison, burn, blind or slow you. Each one drops a _Potion of Experience_.\n\nThe _demon spawner_'s door is never hidden. It has 120 health and can't move or attack, but hits over 20 lose most of their force (85 counts as 30) and every point of damage brings the next ripper sooner. Clear the room first. It drops a Potion of Healing.
guide.halls_f2=Spawns: a succubus, an evil eye and a chaos mage.\n\nThe second demon spawner makes a ripper every 53 turns (60 on 21). Clear its room, close the door, and grind it down; rippers come through a doorway one at a time, which suits bombs and fire. It also drops a Potion of Healing.\n\nThis floor also has the frost-rimmed opening into the _Frozen Halls_, a five-floor branch. Its monsters are as strong as the halls'.
guide.halls_f3=_Scorpios_ (110 health) shoot spikes for 20 to 52 that cripple half the time, and back away as you close. They can't attack you while you stand next to them, so close in and stay there. Poison and vampiric weapons do half. 1 in 5 drops something, usually a healing potion, less often each time. The rare pale-green _acidic scorpio_ returns a random part of each melee or thrown hit and oozes you when adjacent; use wands on it.\n\n_Lost souls_ burn you on a third of their hits. Fire heals them; frost or chill tears off up to two thirds of their health, and in water can kill them outright.\n\nNow and then the _demon goo_ comes up: 200 health, double speed, hits for 30 to 60 and oozes you. Every hit it survives splits off a blob, and every blob drops a Potion of Mending. Water heals it, and cold lava is water.\n\nThe third spawner makes a ripper every 47 turns. The laboratory is on this floor or the next.
guide.halls_f4=View is down to 2 tiles. Spawns: three scorpios, two evil eyes, a succubus, a lost soul and the _demon goo_. Most of them attack from beyond your sight, so hug the walls and use invisibility on open ground.\n\nThe last spawner makes a ripper every 40 turns. Destroy all four before depth 25: each spawner left alive keeps one full ripper in Yog-Dzewa's summons instead of a larva.\n\nBefore the stairs: spend your last Scrolls of Upgrade, stock healing and keep at least two torches.
guide.halls_f5=Two steps past the entrance the stairs collapse and the floor locks until Yog-Dzewa dies. Nothing spawns; the only loot is what a fallen hero left. Yog stays dormant until you see it.\n\nYour view starts at 4 tiles and drops by one each time Yog loses 300 health, down to 1. A lit _torch_ keeps it at 6.\n\nYog's beams pass through walls and never miss, so cover does nothing: watch the marked cells and step off them.\n\nThe arena has water. It stops the burning fist's fire but heals the rotting fist.\n\nNo scroll or beacon leaves a locked floor. When you come back up with the Amulet, these stairs ask whether to start the Ascension.
guide.halls_overview=Depths 21 to 26, with no shop. Your view shrinks a tile per floor: 5 on 21, 4 on 22, 3 on 23, 2 on 24. Each of those floors has _two torches_; one lights 6 tiles around you for 250 turns. Keep several for depth 25.\n\nEach of 21 to 24 has a _demon spawner_ room that keeps making ripper demons. Every spawner you destroy turns one of Yog-Dzewa's ripper summons into a weak larva. Your journal marks the ones still alive.\n\nThe air sits near 35 degrees, the heatstroke line; fire nearby pushes you over it. The red pools called cold lava are plain water.\n\nOne of 23 and 24 has the laboratory. Traps are the city's set plus grim traps. Under a full moon, blue wraiths spawn at dusk and night and spectral rats at night.\n\nDepth 25 is Yog-Dzewa's arena. Depth 26 holds the Amulet of Yendor.
guide.mines_boss=Stepping off the ladder locks the floor, and a message explains: Otiluke trapped the mad wizard Zot inside the _Palantir_ and turned himself into the stone golem that guards it. The floor unlocks when the golem dies.\n\nThe ladder hall is shut by two locked doors; a chest in the hall holds the iron key. Beyond them, 88 _mine guardians_ sleep in two blocks. Each wields a +10 enchanted weapon and hits for double, takes 1 to a quarter of non-relic damage, appears beside you when you are more than 2 tiles away, and teleports off to heal below a quarter health. An awake guardian can wake its neighbors. Each drops its weapon; the first one killed drops the _Halls Key_, the only one, which takes you from any non-boss floor from depth 2 to 24 straight to Yog-Dzewa's arena on depth 25, and back; coming back takes any Skeleton Key you carry.\n\nEight _lit towers_ ring the western block. They can't be hurt and hit you for 300 to 600 whenever you are within 4 tiles, until the golem dies. The Palantir sits in the middle of that block.\n\nThe golem stands still inside the eastern block until hit; see Otiluke.
guide.mines_f1=Sight here is two tiles; bring light. Rooms are split by wooden _barricades_ that burn, opening shortcuts. Each floor has 9 chunks of _stone ore_ on the ground, worth 1,000 gold each in town.\n\n_Kupua_ fill these floors: 550 health, twice your speed, hits of 70 to 160 and armor up to 50. They take 1 to half of any damage except a relic weapon's hits. A single hit of more than 68 after the cut makes one release corrupting gas at its feet; kupua are immune, you are not, so step back after a big hit. 9 in 10 carry a chunk of ore.\n\nThe rare _gullin_ has 750 health, hits for 100 to 200 and takes 1 to a quarter of non-relic damage, but it misses more often than a kupua. It is the only source of _Norn Stones_ (see Mines - Floor 3).\n\nMine floors are never rebuilt: what you open, kill or drop stays that way.
guide.mines_f2=The routine: clear a floor, collect the ore, use the _Town Return Beacon_ to go to town, sell the ore for 1,000 each, then use the beacon again to come back to the exact spot you left. The town guard gives you the beacon the first time you talk to him by day.\n\nThe beacon won't work with a creature next to you or on a locked floor. Depth 65 locks when you arrive, so you can't beacon out until its boss is dead.\n\nOtiluke's Journal doesn't charge in the mines or anywhere on the surface; let it fill in the dungeon or inside town buildings between dives.
guide.mines_f3=_Norn Stones_ drop only from gullin: 3 kills in 5 drop one, and only five drop per run. A relic takes three, so expect one relic weapon.\n\nPut three or more stones, and nothing else, on the altar in the temple east of the town plaza. Three of one color make that color's relic; a mixed pile picks among them. Every relic comes enchanted. Blue: Ares Sword (life drain). Orange: Crom Cruach Axe (luck). Purple: Loki's Flail (poison). Yellow: Neptunus Trident (lightning). Green: _Jupiter's Wraith_, the only thrown relic (terror); only a huntress finds green stones.\n\nAgainst kupua, gullin, mine guardians, the golem and Zot, a relic's hits ignore their damage cut, and a relic melee weapon adds a second hit of one to two times its damage. Once all five stones have dropped, gullin drop nothing.
guide.mines_f4=Without a relic, kupua and gullin take a long time to kill. Their armor (up to 50, gullin up to 145) comes off every hit before the damage cut, so a few heavy hits do far more than many light ones.\n\nThe corrupting gas comes from a single hit that still deals more than an eighth of their health after the cut: 69 for a kupua, 94 for a gullin. Land the hit, then step out of the cloud.\n\nThe mines have no doors. Fight in the tunnels so only one monster reaches you, and go back to town whenever you need to.
guide.mines_f5=Besides the 9 ore chunks, each mine floor holds 3 to 5 random items (a quarter in chests, a few on skeletons that rise if the item is cursed) and 1 to 3 piles of gold. A rogue has a 1 in 3 chance per floor to find a bomb. Counting the ore the kupua carry, a cleared floor is worth well over 10,000 gold.\n\nThe ore veins in the walls are decoration; you can't dig in these mines. Barricades burn, and so does the moss around them, so plan your exit before you light one.
guide.mines_f6=On _full-moon_ nights, from dusk, _spectral rats_ join the spawns on every mine floor, more after dark. They have 80 health plus 3 per depth (about 260 here), move at four times normal speed, bite for 30 to 61 here, and fire shadow bolts for 20 to 45; one bolt in five also weakens you. They give no experience and no loot.\n\nYou can't outrun them, and rats already on a floor stay after dawn. Break line of sight so they have to come to you, or stay out of the mines on full-moon nights.
guide.mines_f7=Kupua hit for 70 to 160, and a pet's bites are cut like your blows, so a young pet dies fast here. Leave a fragile one in town: it only follows you down if it stands next to you on the stairs, and the _Whistle_ calls it to you from anywhere.\n\nAn _Egg_ comes from Sokoban Puzzles, Tengu's den or an incubator nest room. Carried, it only counts turns; left on the floor, what happens to it decides what hatches (see Quests, NPCs & Pets). Shake it to check whether something lives inside, then break it open; broken too early, it gives only yolk.
guide.mines_f8=Two of Otiluke's pages come from bookshelves: the _Vault_ and the _Dragon Cave_. Each bookshelf that burns while you have mind vision, or that a deliberate search empties, has a 1 in 50 chance to give each page; there is one of each per run. The Dragon Cave page opens depth 67, where the shadow dragon egg is. The mines have no bookshelves, and neither does the town library.
guide.mines_f9=Depth 65 locks when you arrive: the ladder up and the _Town Return Beacon_ stop working until the golem there is dead. Sell your ore and rest in town first.\n\nChecklist: a _relic weapon_ (the golem takes 1 to a quarter of any other damage), the Town Return Beacon, plenty of healing, and either a strong pet or none.\n\nWaiting below: 88 sleeping _mine guardians_, 8 _lit towers_ that hit you for 300 to 600 whenever you come within 4 tiles, and the golem.
guide.pg_battle=The first moss covered skeleton you kill drops the _Prison Ancient Key_; depth 9 has one if you have never had the key. Use it on any non-boss floor from depth 2 to 24, and again to come back; you keep it, so you can return.\n\nOpen the chest first: 200 _Holy Hand Grenades_. Each blast deals 75 to 155 damage to every undead within 2 tiles and terrifies them. It does not hurt you, living creatures or items, so you can throw one at your own feet when surrounded.\n\nThe skeletons are armored and hit hard, and each kill makes the rest hit harder and faster: at 50 kills they attack once a turn, from 100 twice. Each one bursts when it dies, hurting whatever stands beside it a little. Sometimes a _grave protector_ flies among them and shoots bolts. It is not undead, so grenades do nothing to it; kill it by hand.\n\nFrom your 51st skeleton each kill has a 1 in 10 chance to drop the _Inscribed Bone_ (the den at depth 37); the 101st always does. Skeletons drop yellow dew, sometimes red. The first time you leave with 100 kills you get 20 more grenades. The golden dungeon nut also needs 100 skeleton kills.
guide.pg_catacomb=If the imp's vault job scored over 2,000, his shop on depth 20 sells three books. Each costs 225,000 gold until you have picked up the Amulet of Yendor; after that the _Book of the Dead_ costs 7,500, the Book of the Living 12,500 and the Book of the Heavens 15,000. Read a book on any non-boss floor from depth 1 to 26 to go to its floor. To leave, stand on that floor's far pedestal and read it again. You keep the book.\n\nThe Book of the Dead opens the catacombs: 12 to 18 rooms joined by narrow corridors. You arrive on one pedestal; the _SanChikarah of Death_ lies on the other.\n\n_Blue wraiths_ roam here: 195 health, heavy hits, four times your speed, so you cannot outrun them. 1 hit in 10 gives you vertigo and terror. Fight them one at a time in the corridors. They are undead, so two or three Holy Hand Grenades kill one. Each drops red dew, the strongest kind.\n\nSometimes a _dwarf lich_ appears. It only shoots from range and backs away; next to you it cannot attack. It is undead too, and may drop a Potion of Healing.\n\nThe rooms hold chests, remains, gold and sometimes a Potion of Strength or a Scroll of Upgrade. Search them before you leave.
guide.pg_chasm=The _Book of the Heavens_ opens a floor full of pits. A Potion of Levitation lies near your arrival point, and phaseshift seeds lie around the floor.\n\n_Sentinels_ stand all over the floor. Each holds a random enchanted +3 weapon, never cursed, and drops it when it dies. A sentinel does not move until something damages it, so you choose each fight. Awake, it is hard to hit and strikes with that weapon. Wake one at a time, and keep area attacks away from groups.\n\nThe only roaming monsters are _flying protectors_. They fly over the pits, shoot bolts and drop nothing.\n\nFalling into a pit costs at least half your current health and leaves you bleeding and crippled; at a quarter of your max health or less it can kill you. The room below has one stair, and it leads straight to the exit pedestal with the _SanChikarah of Transcendence_. If you are lost and healthy, jump.\n\nWith all three pieces, talk to the blacksmith in the caves. He forges the _SanChikarah_, which takes you to depth 35 and will not take you back out until every Shadow Yog there is dead.
guide.pg_field=The first gnoll archer you kill drops the _Sewers Ancient Key_. One always spawns on the floor where you meet the sad ghost (depth 2, 3 or 4). Use the key on any non-boss floor from depth 2 to 24 to reach the field, and on the field to go back.\n\nAn archer next to you cannot shoot, and here they walk slower than you. Their arrows hit harder for every archer you have ever killed, so come early. About a third of the spawns are _forest protectors_: fliers that shoot lightning along any clear line. Kill them first; up close they are weak.\n\nEvery archer here drops three _forest darts_, which deal three to six times their damage to living targets. From your 21st archer, each kill has a 1 in 10 chance to drop the _Safe Spot Page_ for Otiluke's Journal. Once Tengu is dead, the next archer you kill drops the _Tengu Ancient Key_ (the den at depth 36). Trampling the tall grass gives seeds, nuts, berries and dew.\n\nThe first time you leave the field with 100 or more archer kills you get 30 more forest darts.
guide.pg_fishing=The first piranha you kill after reaching depth 11 drops the _Caves Ancient Key_; depth 14 always has one extra piranha. Use the key on any non-boss floor from depth 2 to 24 to reach a flooded floor of sand islands.\n\nThirty _albino giant piranhas_ live in the water. They swim twice your speed, hit hard, dodge well and ignore fire, frost, gas, paralysis and roots. They can bite you from the water while you stand next to it; one tile back from the shore, they cannot reach you.\n\nBeside your arrival point is a chest with 99 _Fishing Bombs_ and a Potion of Levitation. A fishing bomb deals no damage: every albino piranha within 2 tiles of it lands on dry ground somewhere on the floor and dies there, and its drops land there too. They give no experience, but they drop food, more often the more of them you have killed.\n\nThe danger is the occasional _fish protector_. Its bolts hit for 25 to 59, half again as much if you stand in water, and walls block them. Up close it hits less hard.\n\nFrom your 51st albino piranha each kill has a 1 in 10 chance to drop the _Conch Shell_ (the den at depth 38); the 101st always does. The first time you leave with 100 kills you get 40 berries. Loki's Flail cannot make you invisible here.
guide.pg_fortress=The _Book of the Living_ opens a dwarven fortress. Its corridors are two tiles wide, so there are no doorways to hold.\n\n_Oni_ live here: 520 health, hits of 50 to 90, immune to terror and amok. They are not undead, so grenades do nothing. They attack slowly, once every one and a half turns, and all of them start asleep. Move quietly and you can cross the floor without waking one.\n\nA grain of _magic rice_ lies near your arrival point. Picking it up wakes every oni on the floor and calls them to you, so take it only when ready. It makes _rice balls_, which make an unhurt target drowsy and send it elsewhere on the floor, or _dumpling bombs_, which make everything in a 3 by 3 area drowsy and send away the unhurt ones. Neither works on the undead. The grain crumbles after about 200 rice balls or 40 bombs.\n\nThe _tinkerer_ waits behind a magic shield. Bring him the toadstool mushroom that lies on this floor, with your waterskin in your pack, and he upgrades the waterskin for good: 300 drops instead of 100, a condenser that draws dew from the air, and a spout to drink an exact number of drops. Then he dies.\n\nThe _SanChikarah of Life_ lies on the exit pedestal, where you read the book to leave.
guide.pg_vault=The first gold thief you kill drops the _City Ancient Key_; depth 19 has one if you have never had the key. Use it on any non-boss floor from depth 2 to 24 to reach the vault: 50 piles of 100 to 300 gold, about 10,000 in all, among gold statues.\n\nGold thieves attack twice a turn. The first hit that lands steals 100 to 500 of your gold, and the thief runs. Hitting it while it runs knocks out a few coins; killing it returns the rest. A cornered thief fights back. Each one drops a shuriken, and each kill gives the next ones more health and armor.\n\nSometimes a _vault protector_ floats among them. It has little health, but its bolt hits for 30 to 70, the hardest of all the protectors. Kill it first, and use statues and walls to block its line.\n\nFrom your 51st thief each kill has a 1 in 10 chance to drop the _Ancient Coin_ (the den at depth 40); the 101st always does. The first time you leave the vault with 100 kills each of gnoll archers, moss covered skeletons, albino piranhas and gold thieves you get the _golden dungeon nut_: eaten, it gives +2 strength and +20 max health, or, half the time, +5 and +50. The vault has no supplies; bring your own.
guide.postgame_overview=Depths 27 to 33 have no stairs. A key or a book takes you there from an ordinary dungeon floor and brings you back. Keys and books stay in your pack and work again. No key or book works while a pet follows you.\n\nThe first four floors (Field, Battle, Fishing, Vault) are killing grounds: one kind of monster, respawning, and no loot on the ground beyond the Battle and Fishing supply chests and the Vault's gold. Every kill of that kind counts, wherever you make it, and archers, skeletons and thieves get stronger with every one you kill. Their prizes open the boss dens.\n\nThe last three floors (Catacomb, Fortress, Chasm) are mazes with loot on the ground, sometimes a Potion of Strength or a Scroll of Upgrade. Each holds one piece of the _SanChikarah_ on its exit pedestal. Bring all three to the blacksmith in the caves; he forges them into the way to depth 35.\n\nHere there are no traps, the air is hot and dry in every season, and water never freezes. On full-moon nights spectral rats appear: fast undead that shoot bolts and can weaken you.
guide.prison_f1=Find the _shop_ first; it is the only one on depths 6 to 10. Buy _Otiluke's Journal_ if you can: the pages Goo and Tengu drop go into it, and each page lets it take you to one of Otiluke's hidden rooms. If you never get one, DM-300 on depth 15 drops it. The shop also sells an _Ankh_, worth carrying into Tengu's fight on depth 10. The portal gate beside the shopkeeper is already lit; the gates at the shops on 11, 16 and 20 cost 1,500, 2,300 and 3,500 gold to light, and lit gates let you travel between them for some hunger.\n\nSkeletons fill this floor. They explode when they die; armor reduces the blast, but don't land the killing blow next to one while low on health. Crazy thieves attack twice a turn and steal an unequipped item with no upgrades. Each hit on a fleeing thief drops some gold; if it gets out of sight 6 or more tiles away, the item is lost.\n\nThe wandmaker adds an _adamantite wand_ to his reward if no enemy has died since you first reached this floor, whoever killed it; of his errands only the mass grave allows that. The town smith uses it to reinforce a wand. Mages always get it.
guide.prison_f2=The _DM-100_ zaps you with lightning anywhere it has a clear line to you; break the line with a corner. It drops a scroll 1 in 4. A _prison guard_ can pull you next to it with its chain once, then cripples you for 4 turns. _Fossil skeletons_ hit for 12 to 25, attack slowly, have heavy armor and explode on death like normal skeletons. _Zombies_ also appear from here.\n\nRarely (1 in 50 on each of depths 7 and 8) a _shinobi_ hunts you: double speed, and it throws for 10 to 23 along any clear line. Fight it around a corner.\n\nThe _wandmaker_ may be here (1 in 3; otherwise depth 8 or 9). His reward is your pick of two different uncursed +1 wands. His three errands:\n_Mass grave:_ burn the barricade with the liquid flame potion lying on this floor. Carrying the corpse dust summons wraiths, so bring it straight back.\n_Ritual site:_ place the four candles on the four sides of the marked tile, kill the newborn fire elemental and bring back its embers. Chill or frost takes half its health at once.\n_Rot garden:_ the rot heart breathes toxic gas and rot lashers hide in the grass. Fire kills the lashers, but never burn the heart: a burnt heart dies without dropping the rotberry seed.
guide.prison_f3=_Necromancers_ appear from here. A necromancer never attacks: it raises one skeleton next to you, moves it to you if you run, heals it from range and enrages it once it is whole. Kill the necromancer and its skeleton crumbles. Standing where it is summoning gets you pushed aside, or hurt if there is no room. Necromancers carry a Potion of Healing 1 in 5 at first, less often after each one they drop.\n\nRarely a pale _spectral necromancer_ summons wraiths instead, one after another. Wraiths are hard to hit; kill the necromancer and they all die. It drops a Scroll of Remove Curse.\n\nThis is the last floor for fossil skeletons and shinobi. If you have not met the wandmaker, he is here half the time, otherwise on depth 9. The laboratory is also here half the time, otherwise on depth 9.
guide.prison_f4=Any Scroll of Upgrade, Potion of Strength or stylus the prison still owes you is on this floor; depth 10 has only Tengu. The wandmaker and the laboratory are here if you have not found them yet.\n\nIf you have never had the _Prison Ancient Key_, a _moss covered skeleton_ waits somewhere on this floor. It has 105 to 135 health and heavy armor, rarely misses, hits for 20 to 45 and attacks once every 1.5 turns. Poison and toxic gas do nothing to it, and it explodes when it dies. You can leave it alone.\n\nIt always drops the Prison Ancient Key, which takes you to the Battle (depth 28) from any non-boss floor between 2 and 24. Using the key there brings you back, and you keep it.
guide.prison_f5=A corridor runs south past four cells to Tengu's locked cell. The _iron key_ lies in one of the four cells. Rest, heal and sort your pack before you open the door: stepping into Tengu's cell seals the floor until the fight ends. An _Ankh_ is good insurance.\n\nNo other monsters live here and none spawn. Everything that hurts you is Tengu's: hidden dart traps, bombs, lightning posts and fire. Beat him without being hit by any of his traps or tricks to earn a badge.\n\nHe drops _Tengu's Mask_ if you have no subclass yet (using it lets you choose one), and the Sokoban Castle page for Otiluke's Journal. A Lloyd's Beacon in your pack gains a level. After the fight the floor changes: walk around the chasm to the stairs down. Depth 11 has a shop.
guide.prison_overview=Depths 6 to 10, a big step up from the sewers. Skeletons explode into bone shrapnel when they die, prison guards pull you to them with chains, DM-100s zap you from range, and from depth 8 necromancers raise skeletons.\n\nDepth 6 has this region's only shop and a web-covered hole down into the spider nest. Depths 6 to 9 hide 2 or 3 secret rooms. Depth 10 belongs to Tengu.\n\nThis is the coldest region of the main dungeon. Water puts out fire and washes off ooze. Standing in water makes lightning arc further and hit harder, and frost holds you longer. The common traps are chilling, shocking, toxic gas, burning and poison dart; rarer ones sound alarms, grip you or teleport you.\n\nOn full-moon nights wraiths spawn from dusk, and spectral necromancers at night.
guide.sewers_f1=The stairs up take you back to the town at any time.\n\nThis floor has exactly 8 monsters, none near the entrance, and nothing respawns. Most are rats; fight pairs in a doorway. The _sewer snake_ dodges almost every hit, but a surprise attack never misses: let it follow you through a door and strike as it comes through. The _brown bat_ flies at double speed, can blind you, and may shriek when it dies, drawing half the floor to you. The _grey rat_ ignores poison, fire, sleep and terror.\n\nIn 1 run in 50 a _rat boss_ lives here. When it spots you it calls up to four rats; back into a corridor.\n\nThe only traps are worn dart traps, always visible, and there are no secret rooms, though the entrance room's door stays hidden until you have the adventurer's guide page on searching. Expect food, a Scroll of Upgrade 3 in 4, and sometimes a Stone of Intuition or a trinket catalyst. The catalyst sits in a locked chest; its _golden key_ lies elsewhere on this floor.
guide.sewers_f2=A _toadstool mushroom_ lies on this floor, and the tinkerer J. Mertens waits behind an unbreakable shield. Talk to him with the mushroom and your waterskin in your pack and he reworks the skin once, then leaves. Pick one:\n_Dew Condenser:_ the skin refills from damp air, about a drop per 100 turns in saturated air, faster in rain or fog, never in dry air.\n_Measured Draught:_ drink an exact number of drops; each restores a twentieth of your max health and max mana.\n\nPick up every dewdrop before you take the stairs: drops left behind dry up.\n\nFrom here 5 to 7 monsters roam at once and the dead are replaced. Gnoll scouts appear. Chests can be mimics or monster boxes (a plain chest that releases a monster), some doors are hidden, and a summoning trap calls 1 to 3 of the floor's own monsters.\n\nThe sad ghost waits here 1 in 3 and sends you after a fetid rat. A _gnoll archer_ always spawns on her floor; the first archer you kill drops the _Sewers Ancient Key_ (see the Field). A gnoll that ignores you is an _exile_: it fights only if attacked and carries extra loot.
guide.sewers_f3=New here: the _swarm of flies_, the _sewer crab_ and the _velocirooster_.\n\nThe swarm has 80 health and gives no experience. Every weapon hit, melee or thrown, splits it, and the halves keep any fire or poison on it. Wands, fire and gas never split it. The first swarm carries a Potion of Mending 1 in 6; swarms split from it, less often.\n\nThe crab and the velocirooster move at double speed, so you cannot outrun them. The crab's shell blocks up to 4 damage a hit: one heavy hit beats several light ones. Rarely a crab wears a barrel: this _hermit crab_ is slower and tougher and always drops armor.\n\nIf you have not met the ghost, she is here half the time. Her target is a _gnoll trickster_ that throws darts; each hit in a row poisons harder and can set you on fire. Close in: when it has to move, the streak resets.\n\nIf the Stone of Intuition or the trinket catalyst has not turned up yet, it is on this floor. The alchemy laboratory is here half the time, otherwise on depth 4.
guide.sewers_f4=Your last regular floor before Goo. Any Scroll of Upgrade, Potion of Strength or stylus the sewers still owe you is here, and so is the laboratory if depth 3 had none.\n\nIf you have not met the ghost, she is here, and her target is the _great crab_. While it watches you, its claw blocks your melee hits, thrown weapons and wand zaps. Hit it while you are invisible or it is paralysed, or let an ally draw its attention. It moves slowly. The reward is your pick of a tier 2 to 5 weapon or armor, +0 to +3, with a 1 in 5 chance of a hidden enchantment or glyph. Finish the quest even if you want neither: a Dried Rose grows no petals until the ghost is at peace.\n\nCrabs and slimes fill this floor, with brown and red slimes (red ones can poison). A slime shrinks every hit above 5 damage (10 becomes 7, 25 becomes 10), so fast light weapons do best. Slimes drop a tier 2 weapon 1 in 5, four times rarer after each drop.\n\nIn 1 run in 40 a crazy thief comes up from the prison. It steals an unequipped item with no upgrades and runs; if it gets out of sight 6 or more tiles away, the item is gone.
guide.sewers_f5=No traps, no wandering monsters and no loot except what Goo drops. _Goo_ sits in a pool at the center of its room, and half the floor is water. When it notices you the floor seals and the stairs up flood until Goo dies, so prepare first.\n\nKill Goo and take the _worn key_ to unlock the stairs down; there is no other way on. The room is a diamond, a square with inner walls, or a hall of thin or thick pillars. Learn its shape and use walls, pillars and doorways to break Goo's line. In hard frost the pools freeze, and Goo cannot heal on ice.\n\nA hidden door leads to the Rat King's room, with piles of gold on the floor. He cannot be hurt. Bring him the King's Crown (from the Dwarf King on depth 20) while wearing armor, and he can give that armor the Ratmogrify ability.
guide.sewers_overview=Depths 1 to 5. Rats, gnolls and crabs get more health and damage the deeper you meet them. Two secret rooms hide somewhere on depths 2 to 4.\n\nThe town's shops are one staircase up from depth 1 (closed at night); the first shop inside the dungeon is on depth 6.\n\nSurface weather reaches these tunnels, a little weaker: rain, snow and wind. In hard frost the water freezes, and Goo at the bottom cannot heal on ice. On full-moon nights wraiths can spawn after dark, sometimes two.
guide.sok_castle=Most sheep here are corner sheep. This floor has the most fleecing traps of the puzzle floors, with change traps among them, so keep corner sheep off the change traps.\n\nTwelve prize tiles, twelve prizes on the first visit. The first six are iron keys that appear on your arrival tile, one per locked door. The other six come in random order: a Phaseshift seed, a Starflower seed, two Scrolls of Magical Infusion, a Scroll of Regrowth and the _Spectacles_. Worn, the Spectacles halve the journal's charge cost. Prizes 11 and 12 land in the far southwest, reached through the third well, which stays dead until a sheep is pushed onto the switch in the south.\n\nAn _animated statue_ stands in the east: 500 health, a +5 enchanted weapon, half normal speed. It wakes only when it sees you or is hit; noise doesn't wake it. If it wakes, walk away. It drops nothing, resists poison and ignores vampiric weapons.\n\nThe chests hold 400 to 800 gold, or a Scroll of Upgrade (1 in 5), on the first visit. One chest holds a Potion of Liquid Flame on every visit.
guide.sok_portals=Stepping on a live well teleports you. A sheep pushed onto a switch changes where one well leads, and the log shows 'Click!'. Two wells start dead. Several switches can rewire the same well; the last one wins. One switch in the southern row kills a well instead. Walk the wells before you push any sheep.\n\nThirteen prizes on the first visit. The first six are iron keys, next to the entrance, for five locked doors. The other seven land on one tile east of the center: two Starflower seeds, a Phaseshift seed, two Scrolls of Magical Infusion, a Scroll of Regrowth and the _auto potion charm_, found nowhere else. Worn, it makes you drink a Potion of Healing when a hit leaves you below a tenth of your health, if you carry one.\n\nTwo animated statues: one near the center, one in the far southeast. A well can drop you next to one; if it wakes, take another well. The chests hold 300 to 500 gold, or a Scroll of Upgrade (1 in 5), on the first visit only.
guide.sok_practice=Four kinds of sheep. A _plain sheep_ moves one tile straight away from you when you walk into it, never diagonally. A _corner sheep_ also moves diagonally. A _switch sheep_ can't be pushed; walking into it swaps your places. A _black sheep_, pushed, jumps onto a fleecing trap within 5 tiles and springs it, or vanishes if none is in range.\n\nPush a sheep onto a prize tile (four blue studs) and a prize appears: here, first an iron key for the locked door, then a _Towel_ (10 uses, cures bleeding and caustic ooze on you or your pet). Three prize tiles, two prizes.\n\nYour path avoids fleecing traps; you step on one only by choice. A _change trap_ turns a plain sheep into a corner sheep, a switch sheep into a plain one, and a corner sheep into one that never moves again. Keep corner sheep off them.\n\nThe well is dead until a sheep is pushed onto its switch. Search the walls for hidden doors. The five chests hold 300 to 500 gold, or a Scroll of Upgrade (1 in 5), on the first visit only.
guide.sok_puzzles=Most sheep here are switch sheep, which can't be pushed. To convert one, stand on a change trap and walk into it: you swap places, the sheep lands on the trap and becomes a plain sheep. Each trap works once. Keep corner sheep away from them.\n\nFifteen prizes on the first visit. The six iron keys appear in fixed spots, the first at the entrance and the last beside the animated statue. The first treasure appears near the entrance; the other eight pile up on one tile in the far northeast. The treasures, in random order: two Scrolls of Magical Infusion, two Phaseshift seeds, two Flytrap seeds, a Starflower seed, an _Egg_ and the _Whistle_, which calls your pet to your side from anywhere. Fill all fifteen tiles to be sure of the Whistle.\n\nThe switch in the southwest makes a well land beside the prize pile. Two switches rewire the same dead well; the last one wins. One switch is wired to nothing, so no click. A chest on the west side holds a Potion of Liquid Flame on every visit.
guide.sok_saferoom=No monsters, no respawns, and the whole room is lit and mapped. It is the only one of Otiluke's floors that keeps what you leave, so use it for storage. Hunger runs as normal.\n\nThe _Builder's Tool_ lies on your arrival tile and works only here. Point it at any tile except your own and the outer edge to make floor, wall, door, water, ice, grass, tilled soil, bookshelf, well, statue, barricade, chasm and more. An _alchemy pot_ costs 800 gold and an _enchanting pedestal_ 1,500. Seeds sown in tilled soil here grow crops that ripen and reseed. The room is a corner of a 96 by 96 block of rock you can carve out.\n\nIt is also an escape: read the journal on a normal floor and nothing follows you. The trip uses the whole charge, the journal doesn't charge here, and boss floors block the reading.
guide.sok_vault=No sheep, traps, locks or monsters. Getting here is the hard part: each bookshelf that burns while you have mind vision, or that a deliberate search empties, has a 1 in 50 chance to give the Vault page, and there is only one per run.\n\nOne big cavern, overgrown with grass and shrubs that hide the chests. On the first visit there are about 130 chests of 300 to 500 gold each, a few (1 in 50) holding a Scroll of Upgrade instead, and one sure _Ring of Wealth_ in the northernmost chest. Later visits pay 1 to 10 gold a chest, so come with an empty pack and clear it in one trip. Magic mapping helps.\n\nThe Dragon Cave page comes from bookshelves the same way; see the Dragon Cave in the town chapter.
guide.sokoban_overview=_Otiluke's Journal_ carries you into his folded rooms. The depth 6 shop sells one; if you never pick one up, DM-300 drops one, and failing that the Dwarf King.\n\nEach destination needs its page, added with ADD A PAGE. Goo, Tengu, DM-300 and the Dwarf King drop the pages for Sokoban Practice, Castle, Portals and Puzzles. Once you have killed 20 gnoll archers, each further archer has a 1 in 10 chance to drop the Safe Room page. The Vault and Dragon Cave pages come from bookshelves (see the Vault). Breaking the Orb of Zot gives the Town page.\n\nReading takes a full charge: 1,000 turns divided by your page count plus one, halved while you wear the Spectacles. Adding a page refills it. It charges one point a turn on floors numbered below 26 and inside town buildings, and can be read on those floors except boss floors. RETURN takes you back to where you read it. A following pet blocks both.\n\nThe puzzle floors are rebuilt on every visit, so a stuck sheep is fixed by leaving. Their prizes and rich chests exist only on your first visit, and keys you carry out are taken. Only the Safe Room keeps what you leave. _Fleecing traps_ take half your current health, or kill you at a tenth of your max health or less; a sheep pushed onto one becomes a rug. Animated statues guard three floors.
guide.topic_bestiary=Monsters come back after you clear a floor: twice as fast at night, half again as fast on a dark floor. Each floor has its own set, plus rare strays: a rat boss on depth 1, shinobi on depths 7 and 8.\n\nAbout 1 common monster in 50 spawns as a tougher twin: albino rats whose bite bleeds, slimes dripping caustic ooze, hermit crabs armored in a barrel, and others deeper down. The _Rat Skull_ trinket makes twins more common.\n\nA skeleton bursts when it dies; don't stand next to it. The prison's thieves and guards are undead, so anything that hurts the undead works on them, and the undead hit a quarter harder at night.\n\nOn full-moon nights the dead walk: wraiths in the sewers after dark, wraiths and spectral necromancers in the prison from dusk, red wraiths in the caves, blue wraiths in the city and halls, spectral rats in the town mines and on the sealed floors. About 1 wraith in 100 is a _tormented spirit_. Read a Scroll of Remove Curse next to it and it leaves you an enchanted weapon or glyphed armor.\n\nA piranha can appear in any pool with water on 5 of its 8 sides.
guide.topic_endings=Taking the _Amulet of Yendor_ does not end the run.\n\nKill Yog-Dzewa on 25, take the amulet on 26 and climb out under its curse (see The Amulet). Leave depth 1 with it and the curse ends; from then on the amulet opens the sealed barrows across the surface.\n\nThe other goal starts in town. The plaza stairs lead into the mines (56 to 64), where you forge a _relic weapon_ from Norn Stones. On 65 a stone golem guards the _Palantir_, the only way to Zot on 99. Kill Zot and Otiluke is free.\n\nThe ancient keys and the three books open the sealed floors (27 to 33): see The Sealed Floors. Their prizes and the SanChikarah open the boss dens (35 to 40). The Orb of Zot from depth 35 breaks into a journal page that takes you home to town.
guide.topic_heroes=Only the warrior is open at first. The others unlock across runs: the mage when you read a _Scroll of Upgrade_, the rogue after 10 surprise attacks, the huntress after 10 hits with thrown weapons, the duelist when you wield a tier 2 or better melee weapon you have the strength for, the cleric when you lift a curse.\n\nThe warrior's _Broken Seal_ shields him when he drops to half health and moves between armors with one upgrade and a glyph. The mage's staff holds a wand. The rogue's _Cloak of Shadows_ makes him invisible. The huntress fights with gloves and a _spirit bow_ that never runs out of arrows and grows with her level. The duelist's rapier can lunge. The cleric casts from a holy tome. Each class knows one potion and one scroll from the start.\n\nLevels have no cap; past 30 each level needs more experience, up to a limit. Every level gives 3 points, shared by talents and skills, and 2 more mana. Tengu on depth 10 drops a mask that picks your subclass; the Dwarf King on 20 drops a crown that gives your armor an ability. Show the crown to the Rat King on depth 5 before you use it and he offers his own ability instead.\n\nMana refills by itself: a hundredth of your pool each turn you stand still, half that while you move, half again faster when well fed, never while starving. A Ring of Magic adds to the pool and the rate.\n\nCrouch for 4 more stealth at half speed; standing up takes 2 turns. After a day and a half awake you grow drowsy and see less; after three days you collapse at the next nightfall. Rest, or sleep in a bed at the inn, to clear it.
guide.topic_loot=Every region of five floors holds 2 _Potions of Strength_, 3 _Scrolls of Upgrade_, 1 arcane stylus and 1 bullet belt; whatever the first three floors did not give you lies on the fourth. Every floor that is not a boss floor has one meal. Floor 3 or 4 of each region has a laboratory with 5 energy crystals. Depths 1 to 4 hold one Stone of Intuition and one trinket catalyst; depths 6 to 14 hold one Stone of Enchantment. Tier 1 weapons and cloth armor never drop at random.\n\nSome chests are mimics; golden ones bite hardest. Crypts, pools and sacrifice rooms give gear from the next region down.\n\nThe shops on 6, 11 and 16 always sell an ankh, a Stone of Augmentation, the region's armor, an uncursed melee and thrown weapon, a healing potion, Scrolls of Identify, Remove Curse and Magic Mapping, and one rare item: usually a stylus, sometimes a wand, ring or artifact.\n\nGoo drops a chainsaw that clamps to your arm and runs on dew, and half the time a _Mr Destructo_. Throw it to set up a turret; once it breaks, recharge it in a well of transmutation or with the town tinkerer for a toadstool. Every boss drops 1 or 2 masterwork cores.\n\nA magic well's water follows the moon it was found under: a full moon heals you fully and blesses an ankh, a new moon identifies your items and reveals the floor, a quarter moon transmutes what you drop in. Transmuting a Potion of Strength gives a _Potion of Might_, its only source. An altar room gives a prize by weekday: armor on Stonesday, a weapon on Forgeday, a potion on Tideday, a wand on Stormday, a ring on Shadowday, a seed on Harvestday, an artifact on Lightday.\n\nDrop an item on a Flytrap and it eats it: an upgraded item may come back as an upgrade blob (likelier the higher its level), anything else as a seed. Searching empties the bookshelves around you; a searched bookshelf, or one burned while you have mind vision, rarely holds the Vault or Dragon Cave journal page.
guide.topic_meta=A dead delver wrote this guide, and its pages lie scattered through the world. A floor's page lies on the floor below it, so you never read ahead. Pick one up and it stays in the guide for every later run. A boss's page writes itself the first time you face the boss; a place on the surface, the mountains or the Deep Caves writes its page when you first get there. Unread pages glow, and search finds a page by any word in it.\n\nEvery run starts in the town on the surface; its north gate leads down to depth 1. Each region is five floors with a boss on the fifth (5, 10, 15, 20, 25), and the _Amulet of Yendor_ lies on 26. Shops stand on depths 6, 11 and 16, and on 20 the imp opens one if his vault job went well.\n\nBosses drop pages for _Otiluke's Journal_; see that chapter.\n\nFrom depth 2, half the floors have a feeling, named when you arrive: flooded, overgrown, dark, large, trapped, secret or chasm. A dark floor cuts your sight to five eighths, and its monsters return half again as fast. A large floor has half again as many rooms, a third more monsters, two more items and an extra meal.\n\nA floor has 2 or 3 hidden traps near the top and up to 7 by depth 20; a trapped floor has many more, the extra ones visible. Doors between rooms are hidden more often the deeper you go; by depth 20 almost all are. Search at dead ends and gaps in the map. Each region holds 2 or 3 secret rooms. An iron key opens doors only on its own floor.\n\nA _Grim_ trap deals half your max health plus half your current health, up to nine tenths of your max: above nine tenths of your health you live with a sliver, below it you die. A fall into a chasm takes at least half your current health and leaves you bleeding.
guide.topic_plants=Plants follow the seasons. Wild plants spread fastest in spring and slowest in winter, and in winter the warm ones (Firebloom, Sungrass) die off first. Plants you sow are never culled. Trampled grass grows back in every season but winter.\n\nWhen you step on a wild plant, about 3 in 10 it tears loose and fights you instead of going off: less often beside walls and tall grass, more often beside water. Blandfruit bushes, Rotberries and anything you sowed never do. Killing one usually drops its seed.\n\nA seed can be planted, eaten (its effect hits you), or rubbed on a melee weapon: the next 5 hits, plus one per upgrade, carry its effect. Three seeds of one kind brew that plant's potion; every seed brews something except the Blandfruit bush's. Mixed seeds brew something random. Three Rotberry seeds brew a Potion of Strength.\n\nFirebloom warms the ground around it and Icecap chills it. The _Blackholeflower_ freezes nearby water into a bridge that fire plants can thaw. Stepping on it takes half your current health, throws you elsewhere on this floor and chills you (a Warden stays put and gets Space Time Powers instead). A monster that steps on it loses half its health and falls to its death.\n\nCutting tall grass can drop dewdrops, seeds and berries. A colored dewdrop fills your waterskin with several drops at once. Fire withers plants; frost does not. A withered plant may leave its seed, most often in spring.\n\nStepping on a Clockcypress freezes time around you; eating its seed puts you in stasis for 4 turns. A monster that steps on _Hypnohemp_ turns to your side. The Field (depth 27) is thick with Sungrass, Earthroot and Starflower.
guide.topic_quests=People with errands for you cannot be hurt, so help them or ignore them. In a group game each hero finishes an errand alone.\n\nThe _sad ghost_ appears on depth 2, 3 or 4 (always by 4), and a gnoll archer always spawns on her floor. She sends you after a fetid rat (2), a gnoll trickster (3) or a great crab (4). Kill it and choose a weapon or an armor; the one you refuse is gone.\n\nThe _wandmaker_ waits on depth 7, 8 or 9 and pays in wands. If no enemy has died since you first reached depth 6, he adds an adamantite wand, which only his mass grave errand allows; the mage gets it either way. The town smith uses it to reinforce a wand. The _blacksmith_ on depth 12, 13 or 14 sends you into his mine for dark gold. The _Ambitious Imp_ on 17, 18 or 19 sends you into a dwarven vault; do well and he opens a shop on 20. The _Rat King_ sleeps in a secret room on depth 5.\n\n_Toadstool mushrooms_ lie on depths 2 and 11 and in the fortress (32). Trade them to tinkerers. The tinkerer on depth 2 (another stands in town) refits your waterskin: a condenser that fills it from damp air, or a spout where each drop restores a twentieth of your health and mana. The other town tinkerer upgrades or recharges Mr Destructo. The fortress tinkerer triples the waterskin and adds the refit you lack.\n\nAn _egg_ is shaped by what happens to it while it lies on the floor: 5 freezes hatch a blue dragon, 5 poisonings a violet one, 5 lightning strikes a green one, 30 burns a red one (a single burn makes a velocirooster), 10 summonings a fairy. Carried, it counts turns: 2,000 for a spider, 10,000 for a scorpion. Break it open before any of these and you get only yolk.\n\nYou can keep one pet at a time. It levels up to 20 from kills and heals slowly. A pet beside you when you take stairs comes along, and while it follows you, keys, books, Otiluke's Journal and the Palantir refuse to work. Hit it three times and it leaves for good. The _Whistle_ from the last puzzle floor calls it to you from anywhere.
guide.topic_weather=The calendar follows the real one: seasons, moon phases and weekdays. Weather leaks down the stairwells to depths 1 to 15, weaker the deeper you go; from depth 16 no rain or snow falls. Deeper regions set their own heat: the city is warm, the demon halls hot, the frozen halls below freezing.\n\nOn the surface the weather follows the land: hail and sleet on the cold edge of a front, blizzards over snow, sandstorms in the desert. In a thunderstorm under open sky a bolt lands within 10 tiles of you every 3 to 8 turns, rarely on you. Whoever it hits loses a fifth to a third of their health and is stunned for a turn; the shock jumps to anyone beside them, and grass nearby catches fire. No bolt falls indoors. On depths 1 to 15, storm clouds drift in and each one strikes at least once: get out from under them.\n\nYour body has a temperature. When it drops below -5 degrees at night, in wind or snow, or while you are soaked, you get _hypothermia_: you move slower, dodge less, take damage every 20 turns and sometimes freeze solid. Warming up, burning or standing by a wall torch ends it. Above 35 degrees you get _heatstroke_: hunger runs faster and you take damage, more the hotter it is; above 45 you can faint. Stepping into a town building or a village house ends both, and so does a night at the inn. Cloth armor keeps you warmest, leather a little; mail takes the air's temperature fast, plate slowly. The _Brimstone_ glyph adds warmth.\n\nHeavy rain soaks you: scrolls you read fail 3 in 20, any fire on you goes out, and cold hurts you half again as much and lightning a fifth more. Soaked monsters take the same. Wading soaks your boots: 2 less stealth and colder until they dry. Strong wind spoils ranged aim. Night, blizzards and fog shorten your sight.\n\nAt night monsters return twice as fast (sooner still at new moon, slower at full moon), you get 2 more stealth (1 more at new moon), and the undead hit a quarter harder. Undead and demons speed up in the dark and slow down in strong sun, and moonbeams burn them. A blood moon doubles the undead's damage, makes enemies aim a fifth truer at you and brings monsters back four times as fast, but you hit demons a quarter harder and they drop loot more often. A solar eclipse gives you 3 stealth and a better dodge but worse aim, makes the undead hit half again as hard, and leaves treasuries made during it unlocked and 100 to 200 gold richer. An _aurora_ on a clear winter night raises drop chances by about three quarters and your aim a little; a rainbow after rain raises drops by a fifth. The aurora, rainbow and eclipse blessings reach only the surface and depths 1 to 15.\n\nSummer makes every attack about 15 percent stronger, yours and theirs; winter makes them weaker. Autumn gives the most loot and gold, summer the least. Forgeday and Stormday strengthen attacks, Tideday speeds healing, Shadowday adds stealth, Harvestday adds loot.\n\nThe _Season Change_ spell (brewed from a Scroll of Magic Mapping and a Potion of Earthen Armor) turns every plant on the floor into its seed. Raw sunlight from a Potion of Ultraviolet or a suncarnivore blinds anything in it, and each turn an enemy stands in it has an even chance to die.
guide.town_dolyahaven=Six buildings open off the town square. Most townsfolk work by day and sleep at the inn; shops and traders close at night.\n\nThe _shop_ has two keepers: scrolls on one side of the counter, general goods on the other. The stock turns over every five days and refills as you buy; a Scroll of Upgrade, plant food and gun ammo are always on the shelves. They buy almost anything; stone ore from the mines fetches 1,000 gold a chunk.\n\nThe _church_: once a day the bishop blesses you for 100 turns in exchange for a tithe, and the pedestal strengthens, rerolls or adds enchantments and glyphs for alchemical energy. The _fortune teller_ identifies items for gold. The _library_ sells miner's diary pages, each about one floor, dearer every time. The _cinema_ sells a ticket that brings luck for 100 turns, twice as long under a full moon.\n\nThe _inn_: a bed sleeps you to dawn, ends cold, heat and wet boots, and restores a third of your health. The servant's hot meal fills you and keeps you warm for 30 turns. The bard plays free once a day and eases your tiredness. The mercenary sells 3 skill points for each boss you have killed.\n\nOn the streets: the guard posts one bounty a day on a monster from just below your deepest floor. A well-dressed local buys one upgraded piece a day at twice the shop price. The guard and a villager each hand you a _Town Return Beacon_ the first time you talk to them. Two tinkerers trade for toadstool mushrooms: one refits your waterskin, the other upgrades or recharges Mr Destructo. The town smith masterworks gear for cores, pours cores from ore or star fragments, and reinforces an item with adamantite for 50 dark gold. Nine chests stand around the town; each may hold an egg, seeds, food, a Mr Destructo, a bomb or a few coins.
guide.town_dragoncave=Only the Dragon Cave page of Otiluke's Journal leads here (see the Vault for how to find it). You arrive on the west side. There are no stairs and no monsters; read the journal to leave.\n\nA lake of _fleecing traps_ fills the middle and is the only way east. Each trap takes half your current health when you step on it, then goes dead; at a tenth of your max health or less it kills you. Levitating does not help. Step on one trap, rest back to full, step on the next; the lane you clear stays safe for the way back.\n\nOn your first visit each skeleton holds 400 to 800 gold, sometimes a Scroll of Upgrade instead; later visits pay 1 to 100. The _shadow dragon egg_ lies in the southeast, behind a secret door off the eastern passage, on the first visit only.\n\nCarry the egg for 10 turns, then crack it with a free tile beside you and no other pet. The shadow dragon's breath hits three times as hard as its bite.
guide.town_overview=Every run starts here. The town's north gate leads down to depth 1. The staircase on the plaza leads into the kupua mines: nine floors (56 to 64) and a sealed floor at 65, where the _Palantir_ to Zot's prison lies. In the mines you see only 2 tiles, and there are no traps.\n\nKupua take 1 to half and gullin 1 to a quarter of any damage except a _relic weapon_'s hits. You forge one from _Norn Stones_ that gullin drop, on the altar in the temple east of the plaza. Once you free Otiluke, the mine stairs close for the run.\n\nOn full-moon nights spectral rats walk the mines, more after full dark.\n\nThe Dragon Cave journal page opens depth 67, where a shadow dragon egg waits.
guide.zot_level=You arrive on a pedestal in a small walled room. There are no stairs, and the floor stays locked until Zot dies, so the Palantir can't take you back before then.\n\nThe room's north wall is a row of five visible summoning traps, each calling one to three evil eyes. Leave by the south door.\n\nZot appears out of your sight the moment you step out of that room, with a "..." in the log. Nothing else spawns, and the floor holds no loot.\n\nWhen Zot dies, everything he made dies with him and Otiluke appears where he fell. Talk to him: he gives you a _Town Return Beacon_ if you have none. Then use the Palantir to go back.
guide.zot_overview=Zot's prison is depth 99, reached only through the _Palantir_. It lies on depth 65, at the bottom of the mines under the town plaza, guarded by the stone golem Otiluke.\n\nYou need a _relic weapon_ for Zot: drop three _Norn Stones_ on the altar in town to forge one. Gullin in the mines drop them, five per run at most.\n\nThe Palantir makes one round trip: to 99, then back to where you used it. It refuses boss floors, locked floors, and use while a pet follows you.\n\nKilling Zot doesn't end the run. Talk to Otiluke afterwards and he moves to the town; the mine stairs are sealed for the rest of the run.

