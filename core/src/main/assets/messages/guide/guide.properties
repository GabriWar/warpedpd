# Warped Pixel Dungeon — Descent Guide (a dead delver's journal; pages found on the dungeon floor)
guide.boss_crabking=He looks like the weakling of the region. He is not. The Crab King is a puzzle built to punish hard hitters.\n\nThe engine: his Lightning Shell squats at the top of the hall, rooted and unable to dodge, hoarding a charge that never fades on its own. Strike a hermit crab with anything but the gentlest tap and your whole blow is swallowed into that charge. While the king bleeds, he sips the charge back as healing, and the Shell spends the rest frying you. Touch it up close with charge banked and it lashes everything beside it. Savagely.\n\nBreak the engine before the king. Kill the _Shell first_, from range; it cannot dodge, so you cannot miss. Its death spills the charge harmless. After that the crabs die to a touch and the king's wounds stay open. If you must handle a crab early, only the lightest scratch slips beneath its armor. Anything more feeds the machine.\n\nThe king strikes in straight lines from any distance, moves at twice your pace, and flickers away whenever you close. You cannot win this without striking from afar. Poison, choking gas, Grim and Doom all wash off him. No shortcuts.\n\nAnd the arena is water, all of it. Every bolt in this den bites far deeper into a wet target; a _Potion of Levitation_ cancels that outright. The reward: a hoard of gold and the _Adamant Armor_, found nowhere else.
guide.boss_dm300=The fight is three acts, and you cannot skip one. The machine hits like a collapsing tunnel, but twice (badly hurt, then nearly broken) it grinds to a halt and _supercharges_: untouchable, faster than you, drilling straight through stone. Striking it then is wasted breath. A pylon lights, never the one nearest you; it makes you cross. Your only move is to run there and wreck it with quick, light blows. Heavy swings slide off. Stand where its turning arcs aren't pointing. After the second pylon dies the machine never charges again. Only a long, careful grind remains.\n\nBetween acts it alternates two tricks, rarely the same twice. Toxic gas: leave the cloud, never cross it. Rockfall: it shoves you back and marks a wide patch in red, and the stones follow a heartbeat later, pinning what they strike. But the marks always spare a spot near the middle. Find the gap. Stand in it.\n\nKeep it off the _exposed wires_: each one it touches feeds its shield, fatter as the machine weakens. Slowing, rooting, chilling, frightening: it refuses all of it. Fell it untouched by charge and lightning and you'll have earned a rare boast.\n\nIt dies mid-sentence ('CRITICAL DAMAGE! ATTEMPTING SHUTDO—') and pays well: metal shards, a page of puzzles, and, the first time, _Otiluke's Journal_, the key to places the dungeon keeps for those who outlast it. Carry a Lloyd's Beacon in and it comes out finer.
guide.boss_dwarfking=Rodney, the warlock who stole this throne, fights in three acts. For two of them he _cannot die_.\n\nFirst he walks, swinging lightly, calling servants to the pedestals: ghouls mostly, a monk or warlock every fourth. Two tricks. A dark link pours your blows into a distant servant, and a snatch drags one to your side as he retreats. Kill the servants first, or your work bleeds into them. Every wound quickens his calling; bursts only hasten the next wave. When he's nearly beaten, spare the ghouls. His retreat to the throne unmakes them for free.\n\nThen he takes the throne behind a shield no blow can dent. _Stop hitting him._ It frays only as servants die, twelve true deaths, and the last calling drops a warlock, a monk and two ghouls at once. His ghouls still raise each other; part the pairs, since risings don't count. Stand on a pedestal as a summoning finishes: the pain wounds the shield and unmakes the servant. Fair trade if you can heal.\n\nThen he rises raging, calling without pause. Your blows seep into him slowly, a trickle of what's owed, and he'll keep swinging after his death is written. Unload everything; none is lost.\n\nHe leaves his crown, which remakes your armor into your calling's true armor, a Sokoban page and, if you lack it, Otiluke's journal. A _Lloyd's Beacon_ drinks a free improvement; whatever his court dulled in your gear wakes.\n\nHis last words are about what waits below. He isn't bluffing.
guide.boss_goo=Two rules decide this fight: keep it out of the water, and never stand still while it swells.\n\nWounded and wet, Goo knits itself back together by the moment. Drag it onto dry stone and hold it there. Every wound the water closes, you will pay for twice.\n\nWhen it shudders and swells, the warning is unmistakable, and you have about two heartbeats. The charged slam reaches two strides and needs a clear line to you. It lands hard enough to end you outright. The answer: _make it move_. Step beyond its reach or put a pillar between you, and the fury drains out of it. Every arena has cover for exactly this dance.\n\nPast half-dead it turns furious. It hits harder, dodges better, swells far more often. Save your potions and scrolls for this half, and do not let up: allowed to knit itself back past that point, it calms, and everything you spent is wasted. Its touch often leaves _ooze_ on you, a filth that gnaws until you touch water. Sometimes staying dry and hurting is the better trade than stepping into its element.\n\nIt dies holding the _worn key_, plus blobs that alchemists prize, sometimes a strange little turret that fights for you, and a torn journal page. Keep the page; it opens somewhere stranger. And, found nowhere else, a _chainsaw_: a snarling weapon that will not leave your grip once taken, and wakes a hunger of its own at first bite. Decide sober whether you want it.
guide.boss_otiluke=Strategy first: no _relic weapon_, no fight. His hide grinds everything without relic pedigree down to almost nothing, wands and pet's teeth alike, and there is more life in that stone than in anything else you will ever face. Forge at the town altar before you set foot on 65.\n\nHe waits in the northeast, patient until struck. Choose your ground before waking him: five clear paces from every lightning tower (indestructible, burning while he lives) and away from the sleeping sentinels, for every blow you land may jolt one awake. His cry of 'Arise, my protectors!' is meant literally. Cross the armor-eating traps wearing nothing; dress for battle on the far side.\n\nHis fists are the true threat. They land almost without fail, and each one is a crisis. At range he flings shadow that saps the strength from your arms; cleanse the weakness, or close in if your armor can pay his price. He never leaps, never summons, feels no terror, no sleep, no charm. Fire and foul air mean nothing to stone. There is no trick. Only attrition, and the bodyguards you didn't wake.\n\nWhen he falls the floor unlocks, the towers go dark, he usually leaves a draught behind, and the _Palantir_ waits nearby: the road to depth 99, where Zot keeps the man whose voice greeted you. It remembers your place for the return. Do not ride it until you mean to end this.\n\nThe golem is Otiluke. Killing him is the rescue.
guide.boss_shadowyog=Ten of them. Each Shadow Yog wears the strength you brought down here: the taller your legend has grown, the harder they hit. And they hit like the ceiling coming down, at twice your pace. Their armor is the den itself; every living thing on the floor thickens the hide of all ten at once.\n\nSo the fight starts before the fight. Kill every oni and every rat, spring none of the hidden traps that would replace them, and only then wake the legion. They sleep when you first step out. That is your one gift. Take free openings from the shadows, hold the central room's single door as a funnel, and fight strictly one at a time. Two at once is death for anyone.\n\nNever leave one half-dead. Pushed near its end, your blows may fling it across the cavern, and hunting rats boil up from every open square where it stood. Three almost-dead shadows means a plague. Finish each in a single push.\n\nForget your usual tricks. Terror, Amok, Charm, Sleep, fire, choking gas and Vertigo all wash off them, and they cannot be lured. Roots, cripple, slow, cold and raw force still bite, and nothing shields them from _Grim or Doom_. Death-magic earns its keep here.\n\nOnly the last to fall drops the _Orb of Zot_. The moment it dies, every rat and oni left dies with it, and the San Chikarah will finally carry you home.
guide.boss_skeletonking=The fight is a rhythm, and you set the tempo. The Skeleton King lands a blow, often leaves Weakness in the wound, then flees. He will not return until the curse runs its course. His two giant hands play the same game, one with fire, one with roots that pin you for an age.\n\nSo cleanse instantly. Cure the Weakness, stand in the entrance chamber's water to drown the fire, tear free of the roots however you can. The moment the curse drops, the fleeing thing turns and comes back to you, onto ground of your choosing. Never chase three fliers through the brush instead.\n\nPriorities: the rooting hand dies first. Pinned while the other two work you over is how this fight kills people. Then the burning hand. Then the king.\n\nDo not bring fire for them; king and hands alike are deaf to burning. Bring it for the hall. The brush that blinds you burns beautifully, and the floor even hands you the flame in a bottle for exactly that purpose. Heavy single blows crack the king's plate where fast, light weapons glance away. And all three fly. No water or terrain will slow them, and the statues shelter them, not you.\n\nThe prize: a heavy purse of gold, the _Adamant Weapon_, the only one in existence, and sometimes a _Potion of Liquid Flame_ or two from the family.
guide.boss_tengu=His cell first. The rule is one word: stay. As you wound him he flits corner to corner, sowing poison darts no searching will ever show; they flash once when planted, then become the floor. Keep the clean tiles in your head. Hold your ground and shoot. Up close he is weak and clumsier than at range, the reverse of most, so striking from reach makes this act almost gentle. Blade-work costs a few darts; budget healing. The garden thickens as he weakens.\n\nHalfway beaten, he vanishes and the prison rebuilds itself. Nothing touches you in the pause. Walk back and mend. Ready yourself. Anything left behind returns after.\n\nThe second act is a bare oval, no cover. Every deep wound sends him flitting a stone's throw off, each jump bringing more devilry: one trick, then three, then more than you can dodge. _Kill him fast or drown in it._ First always a bomb: three breaths of fuse, leave the smoke. Second, always a shock-post; those never come down, and the arena only shrinks. Fire comes as a cone at your chest. Step sideways, never straight back.\n\nNo blow, however mighty, takes more than one step of him; he slips away first. Do not stall either: while the floor is sealed, your body mends only while you are hurting him. Roots, blindness and terror slide off him, but his tricks seek you alone. _Mirror images_ eat his ordinary strikes beautifully.\n\nHe falls holding his mask and a page for Otiluke's book.
guide.boss_thiefking=A sniper in a room full of holes. The Thief King flies, and strikes along any unobstructed line at any distance, hard enough to take half your life in a single blow. The fight is geometry. Keep something solid between you, approach off-axis, never trade in an open lane. The chasm columns are no shield; his bolts cross them freely, and only true walls break his aim.\n\nFirst, the escort. Two bandit kings, flying, quicker than you, living only to stamp the _Countdown_ curse on you: a few breaths after it lands, a quarter of your life tears away in one burst, and every surviving bandit fattens on your pain. They flee the moment the curse takes, so pin them with roots or fight from a corner where only one can reach you. And no, down here they carry no fabled spork. That rumor belongs to the halls above.\n\nWhat fails: lightning, which he shrugs off, and shoving him toward the chasms, since he flies and the holes are for you alone. What works: everything else. Nothing here is deaf to fire or poison. Open the whole arsenal.\n\nAbove all, respect the floor. Those chasms end in a warded pit with _no way back_. One careless step, one unlucky shove, and everything you carried this far is done. If the arena grows crowded, fall back and hold the entrance doorway.\n\nHe falls with a hoard of gold, the region's second _Adamant Ring_, and sometimes a scroll besides.
guide.boss_yog=Kill the four birthing chambers above first, so it calls feeble grubs instead of full rippers. Bring _torches_. More than one.\n\nTwo laws chain the fight: no scratching the eye while a fist lives, no scratching a fist near its master. So the work is a circuit. Lure each fist to the arena's rim, kill it there, walk back.\n\nThe ground burns red a breath before every beam. Move. They pierce everything and never miss; _only cover saves you_. As it weakens the beams multiply, laid to cut your retreat, but one open square always remains. Find it. Never flee straight. Each deep wound calls another fist and thickens the dark; keep the torch lit.\n\nThe fists. The burning one: fight it from the water; frost does nothing. The soiled one: burn the grass around it, for rooted in green it cannot be hurt. The rotting one: keep it off water, which mends it, and hit once as hard as you can; only your heaviest blow matters. The rusted one can't enter narrow corridors; its wounds land late, but land. Keep swinging. The bright and the dark never pause between bolts: close instantly, and when one vanishes with your light or your sight, relight before you chase.\n\nAt the end it screams that your hope is an illusion, floods the floor with servants, and fires with nearly every breath. Spend everything. It hoards nothing; its death is the door. Its last word is silence.
guide.boss_zot=One rule, absolute: bring a _relic weapon_ or the _Jupiter's Wraith_. Anything else lands as a scratch, and Zot mends faster than scratches wound. Without a relic the fight cannot be won. Turn back.\n\nZot moves twice for your once and never walks where you can watch. It appears inside your sight, and after every fifth strike it leaps again. It hits like a falling wall, up close or down any straight line, rarely misses, and shrugs off all but the heaviest blows. Each leap leaves a crackling double behind, until half a dozen stalk the floor. More if you hunt with a bow. The doubles strike twice for your once or hurl lightning (worse if you stand in water), and they obey the same rule: relic or nothing. They often carry scrolls; thin them for profit before the killing blow.\n\n_Never hold Zot still._ Each moment held, it roars, mends its wounds, and calls a magic eye to your side: an armored flier whose beam pierces the whole line. Soon the air is thick with them. A huntress calls one with every blow she lands.\n\nFire, foul air, sleep, dizziness, fear, madness, charm: all wasted. Blades promising venom, sudden death, doom, or drinking life find little purchase.\n\nFight in tight corridors: Zot leaps only where you can see; short sightlines make it predictable. If the eyes crowd you, slip from their gaze and ignore them. Everything here dies with its master.
guide.caves_f1=Off the stairs, listen for wings. The bats own this floor. Quick, airborne, and every bite knits their own wounds shut. Trade blows while hurt and they drain you dry as they mend. Take them in a doorway. Throw things. Slow them. They sometimes carry a _Potion of Mending_, though the vein runs dry after the seventh flask.\n\nThe gnoll brutes are the wall. Strike one down and it does not die. It rises in a fury, shielded and twice as savage, and the shield holds more than it shows. Back off and count six paces while it burns out, finish from a distance, or shove it into a chasm; the fall skips the rage. Fear does not touch them. Rarely one comes armored: a longer rage, but fine armor left behind.\n\nThe shamans hurl earth and colored curses. Red saps your arm. Blue softens your hide. Purple is the rarest and fouls aim and footing alike. Break their line of sight and rush them.\n\nThe last _shop_ before depth 16 is here, and a _Mushroom_ the Tinkerer wants. His last. Sell junk, buy food and healing; don't hoard gold. The blacksmith starts a floor lower.
guide.caves_f2=Somewhere here, or a floor or two lower, the _Troll Blacksmith_ keeps shop. By depth 14 he cannot be missed. You'll know his room by its ring of exposed fire traps; don't step on them. He hands you a Pickaxe and a job: forty pieces of dark gold ore from the mine beneath. The mine admits you once. Don't go down light. Three meals or more, healing to spare, room in your pack.\n\nThe new trouble is the _cave spinner_. It webs where you are going, not where you are, so a straight run is a gift to it. Break stride or stand your ground. Its bite can leave poison in you; then it flees and webs you from afar while the poison works. It's frailer than anything else down here. Kill it before the arithmetic turns. Rarely, a broken dwarven sentry wanders up early; it fires seldom.\n\nThe Pickaxe swings heavier than it bites, though a duelist's special stroke with it never misses things of metal or stone. Nothing can bruise the troll, so spare yourself the experiment. Bring him the three pieces of the _San Chikarah_ and he forges them whole on the spot.
guide.caves_f3=The machines wake here. The _DM-200_ is a dwarven war engine too broad for doors and narrow halls. Hide in a doorway and it can't reach you, but it vents poison gas down the corridor, and the gas turns corners. Kill it fast in the open, off the line of its vents. Sometimes one carries dwarven steel from floors deeper than you've earned, and the first you break is likeliest to be carrying. _Don't let one die in a chasm._\n\nThe broken sentries walk in earnest now. Their beam pierces everything in its path, friend and foe alike. But they fire seldom, so you get free blows between shots, and now and then one just gives out and bursts. Nothing in these caves teaches your arm more than breaking one.\n\nRarely the engine sits rooted as a turret, answering arrows and bolts with corrosive grenades. The counter is almost funny: walk up and hit it. It never fires. It carries a metal shard besides, though nothing for delvers grown past needing it.\n\nIf the blacksmith hasn't shown himself, look here. A laboratory may hide here too, the first floor where one can. And the spinners haven't gone anywhere.
guide.caves_f4=The last floor before the gate, and it settles debts. If the _Troll Blacksmith_ hasn't shown himself, he is here. No maybe. He keeps his post; the job can wait a climb. The mine beneath him opens once, so go down ready. Whatever the region still owes you (strength, upgrades, a stylus) it pays on this floor, and if depth 13 hid no laboratory, one is certain here.\n\nOne more gift is swimming. A lone _Piranha_ waits in the water, carrying the _Caves Key_, the only sure way to a hidden fishing hole at depth 29, deeper than the dungeon admits to. It cannot leave the water: fight it from the edge or drag it out with magic. Search every pool.\n\nThis is the region's largest, worst-crowded floor. The machines doubled, spinners and shamans in pairs. Seven to nine things prowl at once. Rarely something dead and dwarven wanders up from below; alone, it stays down when you put it down.\n\nBefore the stairs, get to full health and carry two healing potions, with food in reserve. And save your Scrolls of Upgrade until after the mine; the forge does the same work cheaper. Below, the floor itself is wired.
guide.caves_f5=The stairs open into something no cave made: a vast ellipse beneath a humming metal gate, four _power pylons_ in the corners. Nothing attacks yet. Use that. The floor seals only when you come within three paces of a pylon; until then, walk the ground you'll fight on.\n\nMap two things. First, the _exposed wiring_, the dug-up patches strewn across the floor. When the machine stands on one mid-fight it drinks from the grid and shields itself, thicker the nearer it is to dying. Second, the water. The moment a pylon wakes, every stretch of it crackles, and the wires and gate with it. Unless you can fly, which unmakes half this fight.\n\nA live pylon arcs lightning to opposite sides, sweeping clockwise like a clock hand. Stand where it isn't pointing. It shrugs off heavy blows; a flurry of small cuts does what one great swing cannot. There is always a dry path to each pylon. Find it early. The drifting sparks lean toward the live one, showing the way.\n\nNothing is buried here and nothing killed returns. When the guardian falls, the gate bursts, and the stairs beyond open on the Dwarven City.
guide.caves_mine=The ladder drops you into soft rock. First lesson: the doors are a lie. Nearly every passage is sealed solid. The mine expects you to dig. The place loops in a figure of eight, and two secret rooms hide behind doors that never show themselves; together they hold near a quarter of your quota, so probe walls that feel wrong. Cutting solid wall costs your stomach dearly; ore, crystal and boulders almost nothing. The mine keeps rations around for a reason.\n\nForty pieces of _dark gold ore_ is the job; the walls hold barely more. Stop at forty. The next buys nothing but hunger. Kill the mine's master for deeper gratitude; please the troll greatly and the pickaxe comes back free.\n\nThe mine wears one of two faces. If gnolls hold it, each great room keeps a sapper and its guard, and the sapper dies first, always. While it breathes, its guard barely feels your blows, and a Geomancer it serves feels nothing. The guard's spear bites hardest at reach and weakest up close, so close in. Better: bait the sapper's rockfall onto its guard. A stone lays a gnoll out long enough to finish at leisure. Stand beside a wooden barricade and rockfall can't find you. The Geomancer wears stone only the pickaxe pierces.\n\nIf crystal holds it, guardians sleep at the heart of each great room. _Do not wake them._ They cannot die, only be knocked down, and they knit back; in tight corridors they slow to a crawl. Their master, the Spire, yields to the pickaxe alone. Its own spikes cripple its guardians, and when it shatters, every guardian watching shatters with it. Beware the crystal chest that moves. It flings you aside and bolts with something of yours; lose sight of it and that's gone forever.\n\nBack above, favor buys real power: two identical items forged into one finer, charm intact; a charm made permanent; or, for the great price, four matched works (two weapons, a thrower, an armor) and you keep one, sometimes secretly charmed. The rest he pays in gold.
guide.caves_overview=Five floors below the prison, the dungeon stops pretending to be a building. Depths 11 through 15 are the Caves: an abandoned dwarven mine, lit by glowing moss and giant mushrooms, strung with rusted walkways and dead minecart tracks. Veins of ore still glitter in the walls. Out here they're decoration. The one place you'll ever dig them out is the _Blacksmith's Mine_, a side passage that opens somewhere between depths 12 and 14, and opens once.\n\nHere the descent turns. Everything wears real armor and hits like falling rock. Speed and cleverness bought me ten floors. They buy less now. Thick steel and a deep well of blood keep you breathing. Arrive with your gear improved, or arrive bleeding.\n\nThe floors widen going down. Depth 11 is the smallest and keeps the last _shop_ before depth 16; depth 14 is twice its size and crawling. Where two caverns nearly touch, the rock has fallen into chasms. Bad footing, but the cheapest grave for anything you'd rather not fight.\n\nThe air is calm. The water is freezing, and in a hard winter it ices over. Rain and snow still reach this deep; nothing below ever sees them again. On full-moon nights red wraiths slip in after dusk. The traps favor fire, darts, frost, storm and rot, plus one that flings you to a floor of its own choosing.\n\nAt the bottom, behind a humming gate, the largest thing the dwarves ever built is still awake.
guide.city_f1=The last shop before the throne is here. Scale armor, a sound weapon, tipped darts, bags, scrolls of identify, curse-lifting and mapping. Whatever else you skip, buy the _Potion of Healing_ and the _Ankh_.\n\nGhouls hunt in pairs. Fell one within sight or a few paces of its fellow and it only crumples. Soon it rises again, slower each time, but rising. Kill both near-together or drag them apart. Or drop one down a chasm; the pact doesn't survive the fall.\n\nThe elementals fly and hurl bolts of fire, frost or shock. Their opposite ruins them: a bottle of frost guts a burning one in a single blow, and flame does the same to ice. Hoard a bottle. Rarely one comes with no fixed color; it always leaves a _Scroll of Transmutation_.\n\nThe warlocks' dark bolts smother the power in your gear. Break their line of sight, and fight nothing serious until your equipment wakes. They carry potions more often than not. No richer bottle-hunting anywhere.\n\nA room with a hungry fire trades lured lives for a weapon from deeper down: improved, and always cursed. The warlock's own scattered writings surface only after you've finished gathering the adventurer's guide.
guide.city_f2=Monks now. Two blows in the time you take one, and a hunting monk gathers his focus: your next strike he turns aside, however sure your hand. Spend something cheap to spring the parry, then hit hard. Wands and flame he cannot turn. Don't run circles around him either; moving, he refocuses fast. Rarely an elder of the order appears, twice as savage and almost never caught unguarded. The deadliest thing walking these halls freely.\n\nElementals run thicker here than anywhere else. Keep the opposite bottle ready, and stay out of the water.\n\nThe _Ambitious Imp_ may keep his room here, ringed in green flame around a pulsing portal. Talk to him. He wants five dead monks, each dropping a _token_ you must take from the corpse. Any floor's monks count except the twentieth's; the summoned ones carry nothing. His pay is a fine ring, improved and known, and always _cursed_. He'll pay twice, ten tokens all told, spares carrying over. Strike at least one bargain, because nothing else ever opens his shop beyond the throne. And keep your blade sheathed; nothing you own can touch him.\n\nThe pit in his room drops to somewhere older than the city.
guide.city_f3=Golems now: stone and steel, the heaviest blow in the city, hide like armor plate, with minds no madness, terror or sleep can reach. But they're too broad for a one-tile passage. Fight from corridors they cannot enter; that is the whole strategy. Don't try to outrun one in the open: a golem that can't reach you _drags you to its fist_, and one that gets stuck steps through space instead. They can barely dodge, so nearly every swing will land. Inside some of them, arms and armor finer than anything the city forges. The first prize is generous. Each one after is a miser's.\n\nSome nights a _dwarf lich_ haunts this floor. It flees while it shoots and cannot strike what stands beside it. So run straight in and pin it in a corner. Beat it like a drum. No kill in the city teaches you more, and it sometimes carries a healing draught.\n\nCorridors stop the golems and funnel the monks in the same breath.\n\nIf the imp hasn't shown himself, he may be here, asking five monks or four golems. If golems, smile. He's paying you to crack treasure chests that fight back.
guide.city_f4=The last floor of the city proper, and the best place to grow strong before the king: three golems at once, plus monks, warlocks, an elemental. Open ground is a minefield. Live in the corridors.\n\nA crazed thief waits here if you've never claimed his prize. He strikes twice a breath and snatches a fistful of gold. Then he runs. Every blow he takes fleeing shakes coins loose, and cornered he turns and fights. Kill him and your gold returns with the _City Key_, which opens no door; it only carries you to a distant treasury and back. He grows stronger with each of his kind you've ever slain. A hundred kills apiece of his brothers, skeletons, pale piranhas and gnoll archers, and the key yields a _golden nut_: strength and vigor granted nowhere else.\n\nRarely something climbs from below. A winged woman who blinks to your side, makes you adore her, and drinks your life while you're besotted. Kill her fast; adoration doesn't stop a wand.\n\nIf the imp still hasn't appeared, he's here, wanting four dead golems. Finish the bargain, or his shop past the throne never opens. Spend strength potions and upgrade scrolls now. The floor below seals shut and offers nothing.
guide.city_f5=Bookshelves, silent statues, a red carpet running to one door. Beyond it, a diamond arena: the throne at center, statues that block anything shot at you, four pedestals on the diagonals. Step through and the floor _seals_ until the King of Dwarves is dead.\n\nCome whole. Full health, food, an _Ankh_, the imp's bargain done. Nothing grows and nothing wanders in; every foe is the king's summons, and the only plunder is what earlier delvers dropped near the door.\n\nStanding on a pedestal as a summoning finishes hurts, though timed right that pain buys something dear. Sheep conjured onto them are unmade. They announce their guests: rattling bones, ghoul; green flame, monk; creeping shadow, warlock; sparks, golem. Set nothing on the throne. He throws it off.\n\nWhen he falls, the far door opens on a walkway over the abyss; a fall lands on depth 21. Keep the imp's bargain and his shop waits there: plate armor, torches, the finest arms, an Ankh, three strange Books. Dead, Life, Transcendence.\n\nOne boast to chase: slay him barehanded. No weapon, ring of force, wand or hostile spell laid directly on him. Lightning that leaps through his servants is forgiven; aimed at him, it is not.
guide.city_overview=Depths 16 through 20: the metropolis, greatest of the dwarven city-states. Then a warlock came back from the outer planes carrying the _Amulet of Yendor_, took the throne through a false rite of shared power, and raised the population into his service. The ghouls were the weak and the defiant. The monks were warriors who knelt. The warlocks were his own court. Nearly everything here is _undead_. Choose your enchantments accordingly.\n\nThe city widens as you descend, and every floor hides two or three sealed chambers. Depth 16 holds a shop, the last trade before the throne. Somewhere between 17 and 19 the Ambitious Imp keeps his room; if he hasn't shown by 19, he waits there. Depth 20 belongs to the king.\n\nThe air is furnace-warm and bone dry. No rain or snow falls past depth 16, and steam pours from the walls. You won't freeze. But linger near a sacrificial fire or a blazing trap and the heat itself will lay you down. On full-moon nights blue wraiths walk among the dead, and in the deepest hours something worse may join them.\n\nMind the water; it's the wrong color for a reason. The plates underfoot deal frost, storm, corrosion, fire, disintegration. Worse ones too: some raise armed statues and wake the whole floor, some conjure the dead onto your head, some just open into the depth below. The black smoke and green flames on the walls are only decoration. The deeper you go, the less flesh and the more stone.
guide.city_vault=The pit in the imp's room drops into a vault older than the city above it, and stranger. Half-built, as if the masons set down their tools mid-thought and never came back. There is nothing to win down here and nothing that can kill you. I say this so you don't waste a candle on it. Or so you can go look with empty hands, which is exactly what the place demands.\n\nCross the threshold and everything you carry, gold and gear and all of it, is drawn into an _Escape Crystal_, and you walk in plain cloth. Hunger doesn't gnaw. Weariness doesn't gather. The hours spent inside are not counted against you. You cannot enter at all while carrying the Amulet upward, or with your belongings already lost.\n\nA handful of arms and trinkets lies scattered inside, none cursed and all worthless in the truest sense: the moment the crystal carries you out, your own things return exactly as they were and _everything taken from the vault turns to nothing_. The stairs lead nowhere. The crystal is the only door, and should you ever arrive without one, another is pressed into your hands at the bottom.\n\nWatch the rats. Toothless, but they see the way living guards see. Come at one from the front and it marks you at once; come from behind and you are all but invisible until you stand on its tail. A rat that notices something does not attack. It goes to look. Their moods ripple outward in color, even through walls: red means it hunts, orange means it wonders, white means it merely wanders. Beams sweep the marked cells on the floor, and green fire vents on a rhythm you can learn. None of it burns. Not yet.\n\nLearn to move unseen, then leave. Whatever this place is being readied for, it isn't finished, and the only way out is the way you came.
guide.den_crab=The Conch Shell delivers you to the strangest arena down here: a beach whose whole floor is water, and the water is the fight. Everything here strikes with lightning, and lightning bites far deeper into anyone standing wet. A _Potion of Levitation_ defuses the arena entirely.\n\nAtop the hall squats the Lightning Shell: rooted, unable to dodge, hoarding a charge that never fades between visits. Around it, four hermit crabs. Hit one with anything but the gentlest tap and your blow is swallowed whole into that charge. Somewhere out there circles the Crab King, sipping the charge back as healing whenever he bleeds.\n\nSee the trap? Batter the crabs and you build the lightning that kills you while mending the king. Kill the _Shell first_, from range. Struck up close with charge banked, it lashes everything beside it. Its death spills the charge harmless; then the crabs die to a touch and the king's wounds stay open.\n\nHe fights in straight lines from any distance and flickers away when you close. Thrown steel and wands win here. His fall pays gold and the _Adamant Armor_, the only one. Each crab yields a golden key for any lock on this floor. There are no locks. Souvenirs.
guide.den_deadend=There is no depth 39. I looked. The dens number themselves, the beach at 38, the vault at 40, and between them the count skips a beat, like a scribe turning two pages at once. No key opens onto it, no stair descends to it, no chasm drops through it.\n\nIf some impossible accident ever set you there, you would find only what the dungeon builds when asked for a floor it never made: a bare little cell with one lonely stair pointing back the way you never came. Nothing to fight or take. Nothing that lives down here calls the number home.\n\nSo write it off as I did. A hole in the map's arithmetic. A floor that exists only as a name. Don't dig for it. Scrolls are wasted on it, and so is hope. The real dangers sit on either side of the empty number, and the one below the _Thief King's vault_ deserves every ounce of fear you might have spent here.
guide.den_infest=The San Chikarah sets you down in a walled room at the heart of a vast dark cavern. Step past its one southern door and a voice snarls that they are legion. Ten Shadow Yogs take shape out there, asleep, waiting.\n\nTwenty creatures already roam: grey oni hitting like falling masonry, and spectral rats far quicker than you, spitting weakness from the dark. Killing rats teaches you nothing. They exist to punish. And every living thing here thickens the hide of all ten sleepers at once, so clear the cavern before you wake anything.\n\nWatch your feet. A visible row of traps lines your starting room and more hide in open ground, each one calling fresh creatures. Fresh armor for the legion. Walk trodden paths.\n\nNo water, no grass, sight of barely a few paces. The fast things find you first. Fight at the central room's door, one at a time. A Lloyd's Beacon still answers from here; it is your one insurance.\n\nThe last sleeper drops the _Orb of Zot_. Kill nine and you hold nothing. Only then will the _San Chikarah_ carry you home. Nothing else is here, no chests, not even bones. Arrive with this fight already won on paper.
guide.den_skeleton=The Inscribed Bone lands you in a narrow chamber beneath a pillared hall drowned in brush too thick to see through. The chamber's side columns run with water. Remember that water. By the door lies a _Potion of Liquid Flame_. It is no weapon; it is a hint. Everything in this hall shrugs off fire. The potion is for the scenery: burn the brush, open your sightlines, fight on bare ground.\n\nLeave the chamber and the trio wakes: the Skeleton King and two giant skeleton hands, all three flying, all playing the same infuriating game. Land a curse, then flee until it runs its course. Cleanse at once and they come straight back, onto ground of your choosing. Stand in your chamber's water to drown the burning hand's fire, and kill the rooting hand first. Pinned beneath three fliers is how this hall kills people.\n\nThe statues shelter them, not you, and no terrain slows a thing that flies. Heavy single blows crack the king's plate where flurries glance off.\n\nHis fall frees the Bone for the road home, with a hoard of gold and the _Adamant Weapon_, the only one. The family sometimes leaves fire potions of their own.
guide.den_tengu=The key drops you into a green, sodden little den, smallest of the five, and its master is already hunting. This is no prison trickster. The den Tengu moves at twice your pace, plated like a vault door. Fast, light weapons splinter on that hide. Bring heavy single blows.\n\nNo phases, no vanishing games. A straight brawl. Badly wounded it may throw one bomb; step clear and resume. Roots, Blindness, Dread and Terror slide off it. Hold a corridor so it cannot flank, and never flee on foot.\n\nIts death yields a hoard of gold and an _Adamant Ring_. Only then will the key turn for home.\n\nBefore you leave, search the walls. A hidden door opens on a rat king's chamber ringed with chests, one a disguised _Mimic_. No joke this deep. Open at full health and watch for the chest that twitches. The rest gamble between sad coins and real prizes. The Rat King lounges among them, untouchable; wake him and he'll insist he wasn't sleeping.\n\nNothing else carries you off this floor. The aura smothers even a beacon. Return after the master dies (none replaces it) and loot in peace. The mimic still counts as a resident.
guide.den_thief=The Ancient Coin opens onto a vault of gold-veined stone. And holes. Where other dens raise statues, this one is riddled with columns of open _chasm_, and those holes are the region's cruelest secret: they drop to depth 41, a floor with no exit of any kind. No stair, no beacon, nothing retrieves you. Falling does not kill you; it does worse. Treat every chasm as the end of everything you carry, and mind Vertigo and anything else that moves your feet for you.\n\nThe vault's master strikes along any clear line at any distance, hard enough to take half your life in a blow. Do not count the chasms as cover. His bolts sail straight across them; only true walls break his aim. He flies, so the holes are yours alone, and lightning washes off him. His escorts fight dirtier still; I have given him his own page.\n\nNothing in this den resists fire or poison. A luxury, after the skeleton hall. The master's fall frees the Coin for the road home, with a hoard of gold and the region's second _Adamant Ring_. One oddity: the coin's inscription promises the 'Bandit King'. It means the Thief King. Even the dungeon confuses the two.
guide.den_thiefcatch=You were never meant to read this page. Depth 41 is not a place; it is a snare. Its only mouth is the vault floor above. Step into a chasm there, or be thrown in, and you land here. And here you stay.\n\nUnderstand this before you ever face the Thief King: _there is no way out of this floor_. The dungeon wards it like a master's den, and every homeward thing dies against that ward. The bone, the shell, the coin, the key, the palantir. Even a Lloyd's Beacon goes silent. Old guides whisper of a beacon that laughs at such wards; no shop sells it, no creature carries it. Falling here ends you as surely as a blade, only slower.\n\nWhat waits: four rooms copied from the Tengu's den, water and moss, and at the entrance room's top the spot where an exit was meant to stand. Paved over. Not one item lies here. A lone bandit king haunts the place, and only while the den Tengu still lives; some old error chained his leash to the wrong master. He guards nothing.\n\nThe only advice worth the ink belongs one floor up: _stay away from the holes_.
guide.dens_overview=Past depth 34, the stairways end. Five sealed dens wait beyond, and you cannot walk to them. Each opens only to a key won in blood. The key is also the ride home, but it will not turn back until the den's master is dead, and when it finally carries you out, it stays behind.\n\nThe keys. The _Tengu Ancient Key_ drops from gnoll archers on the field at 27, and only once the prison's trickster is dead; expect fifty kills before one yields, though none holds out past a hundred. The Inscribed Bone comes from the mossy skeletons at 28, the Conch Shell from albino piranhas at 29, the Ancient Coin from gold thieves at 30. The fifth door, at 35, opens to the San Chikarah made whole from its three pieces.\n\nWhy go? Adamant. A weapon at 37, armor at 38, a ring each at 36 and 40, and every master hoards gold. The den at 35 guards the _Orb of Zot_.\n\nTake them in rising order of pain: Tengu, Skeleton King, Thief King, the Crab King's puzzle, the legion at 35 last. The air is volcanic; heatstroke is the only weather this deep. A Lloyd's Beacon answers from four of the five. The Tengu's ward silences it, as does the pit below the Thief King's vault. The numbering skips 39, and 41 is no den but a snare with _no way out at all_. The floors below will ask what the adamant and the Orb are for. Keep every piece.
guide.halls_end=No more dungeon. A narrow bridge over the void, candles, a pedestal, the _Amulet of Yendor_. Nothing hunts here; you cannot even fall. Walk.\n\nThe Dwarf King boasted of finding it, just before his city went quiet.\n\nTwo victories. Wake the amulet and it is over: everything unnamed in your pack names itself. Done. Whole and gone.\n\nOr carry it up. The stairs above offer the _Ascension_. Every creature on the way grows monstrous (even sewer rats hit like nightmares), and the dead eye's curse thickens with each floor climbed. First it calls distant things to you, then hurries them. Grow heavy with it and your legs drag; heavier, and it eats you alive. Killing the risen beasts bleeds it off. Climb by fighting, never fleeing. The old bosses' floors are rest stops; hunger and wounds mend there. No magic moves you between floors while it's yours, no setting it down, no waking it midway. Twenty-five floors on foot. Those who reach the sky are remembered differently, forever.\n\nOr leave it on the pedestal and climb unburdened. That too is allowed.\n\nTake it, and the candles change. Then silence, all the way down.
guide.halls_f1=Five paces of sight, and every floor below takes more. Find the demon chamber first. Its door is never hidden; even the dungeon wants it found. Inside, a mound of flesh births ripper demons without end. It cannot move or strike, but each wound hurries the next birth, and it swallows the force of heavy blows. Clear the room, then grind it down. It dies holding a _Potion of Healing_.\n\nThe succubus blinks to you from afar, and her touch can cloud your mind with love. Every blow she lands on the lovestruck feeds her, and past full it hardens into a shield. Fight her nose to nose: that close, she cannot blink at all. Shake the charm off at once. She can't be charmed or lulled herself. Sometimes she carries a scroll, never Identify, never Upgrade.\n\nThe evil eye gathers its gaze for two breaths, then burns everything in the line. It fires at where you stood even if you duck away, and while it glows it barely feels your blows. Sidestep out of the line and kill it while it recovers.\n\nBank both _torches_. And do look at the pillars. Real skulls. Awesome.
guide.halls_f2=Four paces now. Only two breeds hunt this floor, paired by something with a sense of humor: the succubus punishes you for keeping your distance, the eye punishes you for standing in straight lines. Glue yourself to her. Sidestep the eye the moment it starts to glow.\n\nThe second birthing chamber is here, and it labors faster than the first. Same drill. It cannot move, strike or dodge, but each wound quickens the next birth and it shrugs off the weight of great blows. It was made to die slowly. Clear the room and shut the door behind you. Settle in for the long butchery. Another _Potion of Healing_ in the remains. Your journal marks every one of these chambers, so you can always check which floors still have one breathing.\n\nIf you carry bombs or a wand of fire, this room is where they earn their keep: the rippers can only come at you in single file.\n\nWhen it dies, you will feel the demonic weight of the halls lessen. Believe it. That is one fewer horror waiting for you at the bottom. Keep hunting the walls, and keep banking _torches_.
guide.halls_f3=Three paces. The scorpios arrive: shooters flinging serrated spikes that leave you limping, and they back away as you close. Their secret: they cannot sting anything standing beside them. So stand beside them. Never trade shots at range; limping, you'll never close the gap. Venom barely troubles them, and their blood gives a thirsting blade nothing. The first few drop healing draughts, then the well dries. Don't linger. Their rare pale-green cousin returns every wound to whoever deals it, thrown steel included. Kill that one with magic, nothing held in hand.\n\nThe Demon Goo sometimes wanders up early. It moves twice for your once, smears you with clinging ooze, and splits when struck, unless the blow ends the piece outright. So hit hard. Choking clouds and death-magic slide off it. Fight it on dry stone: water knits it back together, and the _cold lava_ is water. Every blob it becomes leaves a _Potion of Mending_. It remembers the sewers. It has not forgiven you.\n\nThe third birthing chamber labors here, faster still. The alchemist's room lies on this floor or the next. And don't point a wand of disintegration at the eyes. They drink it.
guide.halls_f4=Two paces of sight. Near-blindness. Most of what hunts this floor shoots from beyond it: spikes and beams out of the dark. Hug the walls, and if you carry invisibility, spend it crossing open ground. The pale-green scorpion is likeliest of all here.\n\nThe fourth and last birthing chamber works at its most feverish. Now the choice matters. Descend with all four destroyed, and whatever the thing below calls to its side will be feeble, larval, barely worth a swing. Leave them breathing and full-grown rippers answer instead, leaping, striking twice in a breath. The proud leave the chambers alive and carve their names a little deeper. The living do not.\n\nBefore the stairs: let the goo split and split, and gather the _Potions of Mending_ from every piece. Spend your last _Scrolls of Upgrade_; there is nothing left to save them for. Stock healing. And carry two torches at least. Trust me on the torches. If the halls owed you a strength draught or a stylus, they have paid it by this floor.\n\nBelow, the stairs open onto a wide, waiting emptiness with an altar at its heart. Do not go down tired.
guide.halls_f5=The arena was built, not dug: long galleries, a sanctuary at the heart, scattered statues and rubble. The rubble is the only mercy. Nothing prowls it; the spoils are what the last delver left behind.\n\nTwo steps in, the way back erupts and is gone. The god in the sanctuary sleeps until you lay eyes on it. Then: I. SEE. YOU. You could wait in the dark forever, so long as you never look. But the only door out opens over its corpse. Spend the quiet well: _get behind stone_. Its aim never misses. Your quickness is worth nothing here; geometry is everything.\n\nYour sight shrinks as the fight wears on, down to your feet. A lit _torch_ keeps your eyes. This is what the halls' torches were for.\n\nThe water cuts both ways. It quenches the burning fist and mends the rotting one. See what you've been dealt before choosing your corner.\n\nNo scroll or beacon leaves a sealed floor; through is the only direction. These stairs remember: return carrying the amulet and they offer the long road up. For the fight itself, the fists and how each dies, read the eye's own entry.
guide.halls_overview=Red stone. Pillars mortared with skulls. Ash sifting from a darkness that never ends. The glowing pools they call _cold lava_ are a lie: cold, and nothing but water in costume. Depths 21 through 26, and no shop below the dwarves' city. What you carry in is what you get.\n\nHere the dungeon itself turns on you. Every staircase steals a pace of your sight (five on 21, barely two by 24), and everything that lives here prefers to hurt you from beyond it. In exchange each floor hides _two torches_ among its spoils. Take every one. Light none early. You will beg for light at the bottom.\n\nFloors 21 through 24 each keep a chamber where a mound of demon-flesh births rippers without end. Every chamber you destroy weakens what waits at the bottom. Those four rooms are the true work of this region.\n\nThe air is furnace-hot, a hair below what a body can bear; one open flame tips you into heat that kills, and hunger quickens with it. Succubi that step through space. Eyes that burn lines through stone. Scorpions that flee your reach, and an old acquaintance made of goo. Wraiths walk under a full moon; pale rats scurry after dark. The traps are the cruelest kinds. Some kill in a breath, others drop live demons on your head. And the walls hide three secret rooms, more than anywhere above. Keep searching.\n\nDepth 25 holds an altar. Depth 26 holds the prize.
guide.mines_boss=Your first step off the ladder seals the floor. A dead man's voice tells you why: Otiluke gave his body to the stone golem guarding the _Palantir_, Zot's prison. The only way out is through him.\n\nSurvey before you fight. Sleeping sentinels dot the floor, each cradling a masterwork enchanted weapon whose magic bites double. Between them stand lightning towers no force can harm. Within five paces they will take you apart, and they go dark only when the golem dies. Map them; fight well clear.\n\nParts of the floor carry _fleecing traps_ that unmake worn armor but cannot touch what you carry. Strip to cross, dress to fight. Each trap dies after one bite.\n\nOne waking sentinel wakes its neighbors, and a roused one rouses more as it hunts; flee and it steps through space to your side. Take them singly, in corridors, or walk around them. Each drops the weapon it swung. The first to fall also leaves the _Halls Key_, the only one: a ferry between the dungeon's uppermost halls and depth 25.\n\nThe golem waits in the northeast, patient until struck. Every blow you land may jolt another sleeper awake. Without a relic weapon, do not begin.\n\nWhen he falls the floor unlocks, the towers die, the Palantir lies to the west, and a chest by the entrance holds this floor's iron key. The Palantir goes to depth 99 and remembers where you left it. Don't ride it until you mean to finish this.
guide.mines_f1=The dark down here is a wall: two paces of sight, no more. Bring light, or accept the ambushes.\n\nThese galleries are warrens of small rooms split by wooden _barricades_. They burn, and burning them opens shortcuts the tunnels never meant to give. Nine chunks of _stone ore_ glint on every floor, a thousand gold each back in town. That is the whole economy. Pocket it all.\n\nThe shape-shifting Kupua own the tunnels. They cross ground two strides to your one and hit like falling rock, and ordinary weapons wither against their hide. Until the altar arms you, fight them seldom and carefully. Hit one hard enough and it belches corrupt gas at its own feet: land the blow, then step clear of the cloud. It breathes the stuff happily. You don't. They usually carry a chunk of ore themselves.\n\nSometimes a boar-beast, a Gullin, joins the prowl. Armored like a door and worse-tempered, but its aim is poor; a light-footed fighter can wear it down. It is the only creature that carries _Norn Stones_. Kill every one you meet.\n\nWhatever the villagers mutter about the mine rearranging itself behind you: it doesn't. Every floor stays exactly as you carve it.
guide.mines_f2=More black stone, glowing moss, and water cold enough to stop a heart. The company is unchanged, and another nine chunks of _stone ore_ wait in the dark.\n\nLearn the rhythm now and it will carry you to the bottom: sweep a floor, fill your pack with ore, then let the _return beacon_ flash you home. Sell at a thousand a chunk. Breathe. Then take the beacon's road back; it remembers the very spot you left.\n\nTwo things the beacon will not tell you until it fails you. It refuses to fire with any creature standing beside you, so win yourself a clear step first. And it is useless on a locked floor. Remember that second one. There is a floor far below where it will matter more than anything else in your pack.\n\nOne quieter fact: Otiluke's Journal drinks in its power while you idle in town or in the dungeon's upper reaches, never down here. If you mean to ride its other pages, let the book rest above between dives. The stairs down hide in the gloom, two paces past your light, as always.
guide.mines_f3=The growls run deeper here. Somewhere in these tunnels a Gullin is carrying your future weapon on its back.\n\n_Norn Stones_ come in five colors, and color is destiny. Blue forges the Ares Sword, orange the Crom Cruach Axe, purple Loki's Flail, yellow the Neptunus Trident. Green becomes _Jupiter's Wraith_, the only relic made for throwing, and green comes only to a huntress's hands. Every relic leaves the altar already enchanted. One drinks blood, one courts luck, others carry poison, lightning, dread.\n\nThe supply is cruel. Only five stones will ever surface, and most slain Gullin yield one. Kill every Gullin you meet until the mountain runs dry. After that they are nothing but danger with empty pockets.\n\nAt the altar, three stones of one color is a certain forge; a mixed pile leaves the choice to the stones. And don't fear a misstep. The altar only takes a heap of nothing but stones, three or more. Anything less, or anything else mingled in, sits on the pedestal untouched until you take it back.
guide.mines_f4=Halfway down. If you still swing ordinary steel, look honestly at your last few fights: whatever a blow should have done, their hides kept most of it. The arithmetic here favors the sledge over the needle. A few enormous strikes will hurt them where a flurry of small ones dies on the skin. Lead with your heaviest hit and leave the quick light blades sheathed until the altar has done its work.\n\nMind the gas while you swing. Strike a Kupua hard enough and it belches corruption over its own feet; a Gullin does the same, though only your mightiest blows will draw it out. Both of them breathe the stuff like morning air. You will not. Fight in doorways. Land the big one, then step back before the cloud settles into your lungs.\n\nOtherwise the ledger is standard: nine _stone ore_ in the dark, chests and old bones, water cold enough to name itself, stairs somewhere past your two paces of light. Keep the _beacon_ close and your pride flexible. Retreating to town is not losing.
guide.mines_f5=The deep galleries hold more than stone. Beyond the nine ore chunks, each floor scatters a handful of finds. Some chested, the odd one clutched in dead men's hands, and those bones may lash out if what they guard is cursed. Loose gold besides. A full sweep of a mine floor pays better than most of the dungeon above it. And if you walk the thief's road, these floors have an old habit of leaving a _bomb_ lying about for your kind, too.\n\nThe architecture tells you where to work. Here and there a wall glints with a visible ore vein, and the wooden _barricades_ between rooms burn merrily; a torch or a fire wand opens roads the tunnels never intended. The flames spread happily to the glowing moss, though. Light your fires with an exit already in mind.\n\nAnd if a rumor reached you that these mines rebuild themselves behind your back, forget it. That was some older place. Every floor keeps your marks: shortcuts stay open, cleared rooms stay clear, and anything too heavy to haul can wait by the stairs. It will still be there.
guide.mines_f6=Most nights this floor is Kupua and shadow. On _full-moon_ nights, count your torches: the dead rats come at dusk, and their numbers swell when true night falls.\n\nThey are parasites more than killers. The bite is modest, but they fling bolts of shadow from across the room, and a hit can leave your arms leaden just when you need them most. Do not try to outrun one; they move like things unburdened by bodies, because they are. And the bitter part: killing one earns you nothing. No lesson, no spoils. Only the wounds it gave you. Every drop of healing spent on them is pure loss.\n\nMeet them in doorways, where the bolt has no angle, and end them fast. Or be elsewhere. They are gone with the dawn, every one, and there is no shame in letting the sunrise fight this floor for you. Sleep in town and come back to an honest darkness.\n\nBeneath the haunting, the usual business: nine _stone ore_, fast-footed Kupua, maybe a Gullin if the mountain still owes you stones.
guide.mines_f7=A word about whatever follows you on four legs. These mines are the worst place in these depths for a young companion: the Kupua strike like falling rock and close in two strides to your one, and the same ward that blunts your steel blunts your pet's teeth. If yours is fragile, _leave it in town_. Nothing there will touch it.\n\nThe law of companions: one at a time, no exceptions. It must stand beside you when you take the stairs, or it stays behind. Strike it with your own hand three times and it leaves you forever. In return it grows on what it kills, keeping pace with you the whole way down.\n\nStill carrying an _Egg_ from the town chests? The warmth of your pack, given long enough, hatches a spider; far longer, a scorpion. Grander things want it on the ground and mistreated: one scorching wakes a velocirooster, thirty a red dragon; five chills a blue, five poisonings a violet; lightning five times for a green, ten for a fairy. Shake it to hear how far along it is. Break it early and you get yolk.\n\nNine ore, as ever. The bottom is close.
guide.mines_f8=Resupply now. Town is one beacon-flash away, and the floors below only grow less forgiving.\n\nHere is a secret worth more than the ore in your pack: anywhere in the dungeon a _bookshelf_ burns while a potion of mind vision holds your sight open, the flames may give up a lost page of Otiluke's Journal. Once in a great while. The _Dragon Cave_ page opens depth 67, where the shadow dragon egg waits: the finest companion ever hatched in the dark. Don't waste lamp oil hunting shelves down here, though. 'Who needs a bookshelf in a cave?' goes the miners' joke, and true to it these galleries never grew one. The town's little library above is your nearest kindling. A vision potion and a match turn every shelf into a lottery ticket, and more pages than one hide in the fire.\n\nOtherwise the drill holds: two paces of sight, nine _stone ore_, Kupua closing fast, maybe a Gullin if the mountain still owes you. If your relic is forged and your stones are spent, this floor is only a road. Walk it briskly and save your strength for what hums beneath.
guide.mines_f9=The last honest gallery. Stop at the ladder down and listen: that hum below is real, and the statues waiting there are not statues.\n\nDepth 65 _locks the instant you enter_, and it has no stairs out at all. The only exits are the prize you'll win there and your return beacon, and the beacon will not fire until the floor unlocks again. Whatever you mean to bring to that fight, bring it now.\n\nThe blunt checklist. A forged _relic weapon_: without one, everything below shrugs off your best, and the guardian there has more life in it than anything you have ever fought. The beacon, safe in your pack. Healing in real quantity. And either a companion strong enough to survive or none at all. Below wait armed statues that rouse one another in cascades, towers of lightning that cannot be harmed and flay anything within five paces, and stretches of floor that unmake the armor on your back.\n\nThis floor itself is ordinary: nine ore and Kupua, maybe one last Gullin if the mountain owes you. Make a final trip home to sell and rest. Check your pack twice. Descend when it says you are ready, and not one staircase before.
guide.pg_battle=On the ninth depth, near where the wandmaker paces, one moss covered skeleton stands apart. It always yields the _Prison Ancient Key_, and the key opens onto a battlefield where the ground never stops giving up its dead.\n\nFind the chest before anything else. Inside: two hundred _Holy Hand Grenades_. Blessed bombs. They ruin the dead and terrify the rest, yet leave every living thing untouched; they won't even scorch the loot beneath. Set one off at your own feet mid-siege and walk out whole. That is the whole plan. These skeletons are armored and brutal, harder and quicker with every one you fell (past a hundred they swing twice for your once), and each bursts when it dies, battering whatever stands beside it.\n\nAmong them may drift a _grave protector_, a winged bolt-thrower, and here is the trap: it is not dead. Grenades pass through it like wind. That one you kill by hand.\n\nA hundred skeletons makes the _Inscribed Bone_ certain; fifty makes it possible. It opens a door far below. They bleed dew freely, some of it red. Leave past a hundred and the key gifts twenty grenades more on the way out.
guide.pg_catacomb=When the dwarf king falls, the imp at depth twenty sells three books. The _Book of the Dead_ is the first. Read it anywhere the stairs still reach and darkness takes you to the catacombs: a dozen and more rooms on narrow corridors, one closed loop.\n\nTwo pedestals stand in separate rooms. You arrive on one. The _SanChikarah of Death_ rests on the other, and the book opens nowhere else, so finding the piece and the way home are one act. The book stays on the stone.\n\nBetween them drift blue wraiths: armored, brutal, four times your speed. You cannot outrun one. Ever. Some blows leave you reeling and terrified while it glides after. Fight them singly in the narrow halls, and if you saved _Holy Hand Grenades_ from the battlefield, rejoice. Wraiths are dead things; two or three grenades end one. Each drops red dew, the strongest there is.\n\nNow and then a dwarf lich drifts in, the kind that once fed the king. Beside you it is helpless. Close and corner it. Dead too; some carry healing.\n\nReal treasure scatters here: chests, old bones, gold, food, sometimes strength or an upgrade. Sweep every room before touching that pedestal.
guide.pg_chasm=The _Book of the Heavens_ drops you on a floor that is giving up: rock fallen away into black nothing. Yet I never walked richer ground.\n\nStone sentinels stand everywhere, a dozen and more, each gripping a fine enchanted weapon free of any curse. Each drops what it holds. Nothing wakes one but your own blow; you choose every fight. Choose well. Woken, they are armored and slippery and swing in earnest. One at a time; nothing that scatters near a cluster.\n\nThe skies belong to winged protectors, bolt-throwers that cross the pits you must walk around. The only hunters here, and they carry nothing. A _Potion of Levitation_ waits near your arrival; drink it to cross the gaps and steal their advantage. Phaseshift seeds litter the ground. Gather freely.\n\nA secret worth gold: the pits do not kill. You fall hard, battered and bleeding, half of you gone, but the room below holds one stair, straight onto the exit pedestal and the _SanChikarah of Transcendence_. Lost and still strong? Jump.\n\nThree pieces in hand, seek the Blacksmith in the caves. What he forges opens the last door, and that door will not let you back until what waits is finished.
guide.pg_field=Your way in begins in the sewers. The floor where the sad ghost first speaks hides one lone gnoll archer, always carrying the _Sewers Ancient Key_. It opens a portal on any ordinary floor down to the twenty-fourth, and stays behind when you leave. One visit.\n\nThe archers are paper up close. Beside you they cannot shoot, only shuffle away slower than you walk. Distance is the danger. Arrows bite deeper the more you bury, and by several hundred dead a volley from four will open you up. Watch for the _forest protector_, a winged thing hurling lightning down any line of sight, harder if your boots are wet. They are common. Kill it first; its claws are nothing.\n\nTrample the grass. It rains seeds, dew and berries, and many seeds are nuts you can eat. Every archer yields three forest darts that make living flesh fester past the wound. Twenty dead earns the _Safe Spot Page_ for Otiluke's journal. If Tengu lies broken, fifty gives slim hope of his ancient key; a hundred makes it certain.\n\nReach a hundred before you turn the key and the way home hands you thirty darts more. Come early, while their arrows are soft.
guide.pg_fishing=Past the tenth depth any piranha may carry the _Caves Ancient Key_; one always waits at depth fourteen by the blacksmith. It opens a drowned floor: a sea, islands of sand, half the ground underwater.\n\nThirty albino piranhas own it. Do not fight them. Do not swim. In water they move twice your pace, bite through anything, slip most blows. Fire, frost, gas and roots mean nothing. Keep your feet dry and you do not exist.\n\nOne step from your arrival sits a chest: near a hundred _Fishing Bombs_ and a Potion of Levitation. The bombs hurt nothing. They drag every nearby fish onto the sand, where it dies at once. One throw into a school is a harvest.\n\nTheir deaths teach you nothing; you come for goods. Food shakes loose, more freely the longer you work. Fifty may bring the _Conch Shell_, a hundred makes it certain: another door far below. The fish protector is the true menace. Cruel bolts, crueler when you're wet. Hiding is useless. Stay dry, levitate if needed, close in; its claws are feeble.\n\nLeave with a hundred dead and forty berries follow you home. A whisper: Loki's Flail behaves strangely in these waters.
guide.pg_fortress=The _Book of the Living_ opens on a dwarven fortress whose corridors run two men wide. No doorway to hold. What comes, comes in pairs.\n\nThe Oni: hulking trolls that shrug off punishment and crush like falling rock. Fear and madness do not touch them; grenades are useless. Two weaknesses. They swing slow, and they sleep. All start out dozing; a quiet delver can cross the fortress waking none.\n\nNear where you arrive lies a magic grain of _Rice_, and the Oni are lazy only until there is food about. Lift it and the whole floor wakes and comes screaming. Do not touch it until you are ready. Take it anyway: rice balls to throw, dumpling bombs that lull and scatter crowds. But the magic finally crumbles to dust.\n\nFind the _Tinkerer_ before anything else. He waits behind an unbreakable shield, asking for a toadstool mushroom (dropped somewhere on this floor) plus a waterskin in your pack. He blesses your dew magic for good, wings and all. He says your name. He dies. Once in a lifetime. Do not leave without it.\n\nThe SanChikarah of Life waits on the exit pedestal; the book opens only there, and stays. Sweep the loot first.
guide.pg_vault=The last ancient key rides on a crazy gold thief at depth nineteen, near the imp. The _City Ancient Key_ opens a vault: fifty loose piles of coin (ten thousand gold, near enough) and golden statues everywhere.\n\nThe keepers want it back. A thief strikes twice for your every step, and the first blow that lands steals a fistful of your gold before it bolts. Only its death returns that, though hits while it flees shake coins loose. Cornered it fights; terrified it runs. Each drops a shuriken. Each death makes the next one harder.\n\nAbove it floats the _vault protector_: frail, but its bolt is the cruelest of any guardian and never misses. End it first. The statues are the only cover you'll get.\n\nA hundred thieves brings the _Ancient Coin_, fifty might: a door far below. The true prize is the _Golden Dungeon Nut_, yours only if you leave with a hundred dead in all four killing grounds. The keys never return, so the order is fixed: Field, Battle, Fishing first, this vault last. Leave early and it is lost for this life.\n\nNo cache waits here. Bring your own tools.
guide.postgame_overview=Past the twenty-sixth depth the stairs give up. Seven sealed floors remain, twenty-seven through thirty-three, each entered only by a key or a book. Every journey is one-way: what carried you in stays behind. One visit apiece. Plan like it.\n\nThe first four (Field, Battle, Fishing, Vault) are killing grounds, each ruled by a single breed that never stops coming. Keep count of your dead. Past fifty a floor may yield its treasure. Past a hundred it must: the _Inscribed Bone_, the _Conch Shell_, the _Ancient Coin_, the Tengu Ancient Key. Each opens a door somewhere far below. But the farms sharpen their own teeth. Archers, skeletons and thieves all grow harder with every one you fell.\n\nThe last three are warrens: Catacomb, Fortress, Chasm. Each hides one piece of the _SanChikarah_. Carry all three to the Blacksmith in the caves and he forges the thing that opens the last door of all.\n\nTruths that hold everywhere. No trap was ever dug here, only water and, on the deepest floor, open pits. The killing grounds give nothing you don't earn; the warrens scatter real treasure, even a Potion of Strength or Scroll of Upgrade. The air runs hot and dry, deaf to the seasons above. The water never freezes. On full-moon nights spectral rats slip in: quick dead things that throw bolts and drain the strength from your arms.\n\nAnd no portal opens while a companion trails at your heels. Send it home first.
guide.prison_f1=Find the _shop_ before anything else; there is no other in this stretch. On its shelf sits _Otiluke's Journal_, a plain book worth more than the rest of the room. It opens ways I will not describe. Too poor? Another chance surfaces near depth 15, but everything it opens waits with it. Buy the _Ankh_ too. You will want it four floors down. The gate by the counter remembers the way back.\n\nSkeletons own this floor. Their bones burst when broken; armor blunts the blast, but never finish one at arm's length while bleeding. Mad thieves strike twice in a breath and bolt with any plain thing. Lose sight of one and its prize is gone forever, so drop everything and chase. The fly swarm splits under every stroke of a blade. Burn it or leave it; it teaches nothing. The rats shrug off poison, flame and fear. Just hit them and take the meat.\n\nOne secret. The wandmaker below weighs the blood on your hands from the moment you land here. Reach his reward having killed nothing since, and he adds an _adamantite wand_: dull metal now, precious much later. The magic-born get it regardless.
guide.prison_f2=The brass DM-100 throws lightning anywhere it can see you. Put a corner in the way and it is furniture. It dies clutching scrolls. A guard's chain reaches only once: it hauls you to his feet and leaves you hobbled. Bait it somewhere safe, and never idle at middle distance near a chasm or crowd. The fossil dead swing slow and shrug off weak steel. They burst like their cousins, and they are the likeliest here to grip a weapon worth prying loose.\n\nRarely, here or one floor down, a shinobi hunts: two steps to your one, thrown strikes that almost never miss. Nothing this side of the fifth floor kills faster.\n\nThe old _Wandmaker_ sometimes waits here, his errand nearby. Do it at once; he pays with a pick of two clean, strengthened wands. Mass grave: a flask of _liquid flame_ for the barricade lies somewhere on this floor, and his dust draws wraiths while carried, so grab it and run. Candles: set all four at the marked stone's four sides. The newborn flame flies, cold unmakes it; bring back its embers. Garden: the heart breathes poison and the lashers hide in grass. _Fire ends them all at a touch._
guide.prison_f3=Someone down here raises the dead. The robed one never swings at you himself. He calls a darkened skeleton up at your side; run, and he moves it to you. He knits its wounds from across the room and whips it into a frenzy once it is whole. Cut down _the master, not the servant_: the skeleton crumbles the moment he does, and breaking it earns you nothing anyway. He is harmless unless you stand on his summoning ground. The first few of his kind carry healing draughts. That well runs dry fast. Do not hunt them for it.\n\nEverything the prison keeps walks here at once. The fossil dead and shinobi stalk no deeper than this. Rarely a robed one comes paler, calling wraiths instead: frail things a blade can barely find, and another every few breaths. Kill him before they gather. They all die with him, and he leaves a _Scroll of Remove Curse_.\n\nIf the wandmaker has not shown, look for him here; failing that, he waits below. The alchemy pots often land on this floor too. If not, the next holds them. Walk the walls before the stairs; this place hides rooms.
guide.prison_f4=The widest floor here, and your last harvest: whatever strength potions, upgrade scrolls and stylus this stretch owes you are here or nowhere. The floor below holds only him. Comb every room. The wandmaker is here if you have not yet met him, and the alchemy pots likewise.\n\nIf a certain mossy key has never hung from your belt, something old waits on this floor, maybe beside the stairs. Treat it as a second warden. Its blows rarely miss and weak steel bounces off it. It wakes at half your pace, but it counts every skeleton you have ever broken, and each one quickens it. Poison washes over bare bone. It bursts when it dies; do not take the last swing with your back to a wall.\n\nIt always yields the _Prison Ancient Key_, which opens a way onto depth 28 and its numberless dead. Great slayers of bone may shake loose an _Inscribed Bone_ besides. Keep it; it is an invitation. The key hoards a last gift, given only when turned at depth 25 or deeper. Use it here and it never comes. The skeleton bars no road. Walk past if you want none of this.
guide.prison_f5=No maze. One corridor runs south past four holding cells to a locked door. The warden's last order was to seal the freak in and hurl the _iron key_ into a cell; it lies in one of the four still. Take it, then finish all business on this side: drink, sort, clear the hall. Cross the threshold and the floor seals until one of you is dead. _Bring an Ankh._\n\nNothing else lives here, and nothing will come. Every danger is of his making: darts no searching finds, bombs on a slow count, shock-posts that never fall silent, cones of flame. Two acts. His own page holds the rest.\n\nFell him untouched by dart, blast, spark or flame (even a hit your armor swallows whole counts) and it will be remembered.\n\nHe leaves _Tengu's Mask_: only for one who has not yet chosen a calling, and consumed in the choosing, so spend it with care. A page for Otiluke's book comes always, and a beacon of Lloyd's in your pack comes away stronger. The prison then reshapes itself one last time. Cross the bridge over the chasm and go down. A merchant, of all things, waits below.
guide.prison_overview=Below the sewers the walls turn to worked stone and iron bars. They built this jail to hold the worst of the city. Then something rose from beneath and got into every head inside, and the city bricked the whole complex shut. Nothing shambling these corridors was ever released.\n\nForget your sewer habits. The drop is brutal. Skeletons hit like falling masonry and burst into shrapnel when they break. Guards hook you with chains and haul you to their feet. A brass thing throws lightning down corridors, and deeper still, robed figures raise the dead faster than you can lay them down. Each floor is meaner than the last.\n\nThe first floor holds the only _shop_ in this stretch. One plain book on its shelf matters more than everything else in the room; miss it and you will not see another for many floors. The fifth floor belongs to what they dug the deepest cell for.\n\nThis is the coldest place in the dungeon, and its black water soaks you through. _Lightning and frost bite far harder on a wet body._ A dip will still douse flames and rinse off ooze. The floors favor darts, shocking plates, chilling and burning traps, plus alarms that wake every cell and gateways that fling you elsewhere.\n\nThe floors widen as you descend, and a couple of rooms here were walled off and hidden. Mind the cages hanging over the chasms. The prisoners never left.
guide.sewers_f1=The way up sealed itself behind you. It means nothing until you hold what you came for. Small mercy: exactly eight beasts prowl here, none near the entrance, and nothing replaces the dead. Kill all eight. Loot everything.\n\nRats are half of them. Nothing alone, so meet pairs in a doorway. The sewer snake slips almost every blow aimed at its face; let it chase you through a door and _strike as it crosses the frame_. An unseen blow never misses. The brown bat flies at twice your speed and blinds, and its death-shriek sometimes calls half the floor down on you. The grey rat shrugs off poison, fire, sleep and terror. Only steel speaks to it.\n\nRarely, a shrill 'Squeeeek!' means the _Rat Boss_ prowls here. Spotted, it calls four rats to its side. Fall back to a corridor.\n\nThe only trap is a worn dart-thrower, always in plain sight, and no secrets hide here. The floors below are less honest. Expect food, likely a _scroll of upgrade_, sometimes a stone of intuition. If a locked chest turns up, a trinket catalyst sits inside; its _golden key_ lies elsewhere on this floor. Find it before the stairs.
guide.sewers_f2=A _mushroom_ grows on this floor and nowhere else. Find it. A tinkerer named Mertens waits behind a shield nothing breaks. Bring him the toadstool with your waterskin still in your pack (he must see both) and he will rework the skin, once and forever, then vanish. One path lets a full skin water the ground back to green. The other charges the skin each descent: the harder you hunted the floor above, the longer your foes bleed dew below. Choose slowly. And pocket every dewdrop before the stairs, because _they vanish when you leave the floor_.\n\nThis floor has teeth. The dead are replaced, five to seven hunters prowl at once, and gnoll scouts will end a careless newcomer. Never trade blows with two.\n\nA grieving ghost sometimes drifts near the exit. Here its torment is a fetid rat, the gentlest of the three it might name. An archer always skulks alongside the ghost. Kill it. The first archer to fall yields the _Sewers Key_, a door to somewhere far, far below.\n\nFrom this depth on, chests may bite and walls hide rooms. One trap conjures gnolls from nothing. A gnoll that ignores you is an exile. It carries treasures, if you dare.
guide.sewers_f3=The gnoll scouts run this floor. Two new things debut.\n\nThe _swarm of flies_ looks harmless. It is not. Steel that fails to finish it, swung or thrown, splits it in two, and each half carries your fire and poison with it. Killing swarms teaches you nothing. Burn it, gas it, strike it with a wand: _magic never splits it_. The first swarm sometimes carries a mending draught. Its offspring never do.\n\nThe sewer crab has the hardest shell in these tunnels and twice your speed. You cannot outrun it, so never let one find you bleeding. Cold slows it. One heavy blow cracks shell better than five quick ones.\n\nIf the ghost hasn't yet found you, it may be here. Its torment: a gnoll trickster, a coward pelting you from afar with darts that poison and burn worse the longer you indulge it. Close the distance. Forced to move, it loses its rhythm.\n\nIf the _stone of intuition_ or _trinket catalyst_ haven't surfaced yet, they are here. Keep looking. A laboratory is often carved here; if not, it waits one floor down. The rare hermit crab arcs lightning that bites hardest in water, but it always dies holding a golden skeleton key.
guide.sewers_f4=Your last chance to grow before the bottom. Treat the whole floor as preparation.\n\nIf the ghost hasn't found you yet, it is here for certain, and its torment is the great crab. Its claw turns aside every swing and every bolt aimed at whatever it watches, so head-on you accomplish nothing. Strike from outside its sight. Drink yourself unseen. Hold it fast, or give it a second target; an ally draws the claw while you work. It is slow and cannot chase you. The ghost repays you with a weapon or armor, sometimes finer than it appears. You keep only one, so choose with your whole descent in mind. And _finish the errand regardless_: something withered you'll find far below will never bloom while the ghost still grieves.\n\nCrabs and slimes own this floor. The slime's rubbery hide swallows heavy blows whole; bring something quick and light. Kill them anyway. Slimes sometimes cough up a clean weapon, the earliest prize of its kind, though the sewers grow stingy after the first.\n\nRarely, something quicker than any rat slips up from below. If it snatches from your pack and bolts, _run it down_. What it steals, it keeps.
guide.sewers_f5=Depth 5 is quiet, and the quiet is the warning. No traps. No wanderers. Two living things share this floor: _Goo_, coiled in its nest at the heart, and a small crowned rat asleep behind a hidden door.\n\nThe task is absolute. Kill Goo. Take the _worn key_ from what remains. Unlock the sealed stair. There is no other way down. And the moment Goo stirs, the floor seals and the entrance itself drowns. No retreat. Prepare before you wake it.\n\nHalf this floor is water, and Goo drinks its strength from water. Whatever shape the arena takes (a diamond, a walled square, flooded halls broken by pillars), there is always dry ground and always cover. Walk the geometry before the fight. And if you've come down in deep winter, look at the ice and smile: _frozen water feeds it nothing_.\n\nBefore or after, press the walls. The Rat King's chamber is always here, lined with chests of gold. The king cannot be harmed and barely tolerates visitors. Remember him. Much deeper, you may find something a king would pay absurdly for.\n\nBeyond the sealed stair, for the first time, someone will sell you things.
guide.sewers_overview=The sewers are where this dungeon corrects your assumptions. Rats get meaner the deeper you meet them. So do the gnolls, and the crabs. And the _swarm of flies_ takes more killing than anything its size has a right to. Don't laugh at it. Brown bats, grey rats, gnoll archers: strangers to me too, once. None of them forgave hesitation.\n\nNo proper shop opens its shelves this high up; only the odd wanderer with errands will trade. What you carry to the bottom of depth 5 is nearly all you will have. Hoard like the walls are watching.\n\nThese tunnels sit close to the surface, and the sky leaks through. Rain, snow, wind, the turning seasons, all of it colder and wetter than the ground above. In deep winter the water itself freezes to slick ice. Remember that. The thing at the bottom of these tunnels drinks its strength from water, and ice gives it nothing. On full-moon nights keep a wall at your back; _wraiths_ walk after dark, sometimes in pairs.\n\nExpect flooded halls and high grass. Some floors have moods: too dark, or too large, or riddled with traps, or honeycombed with hidden rooms. The traps here are mild. The barrels are not. They burn, and they burst wetly when they do. _Two secret rooms_ hide somewhere between depths 2 and 4, so press the walls as you go.\n\nTake your time. Grow strong. Below, nothing waits patiently for the weak.
guide.sok_castle=The second guardian's page opens the fortress, where the floor is the enemy: fleecing traps thicker than anywhere else, change traps sown among them. Bare shoulders. Guard your corner sheep. Most of the flock, mercifully, are corners, pushable eight ways.\n\nTwelve prize tiles, twelve prizes, no decoys. The first six drop iron keys on your entrance tile. Six keys, six locked doors. From the seventh come the treasures: seeds, scrolls of infusion and regrowth, and the _Spectacles_, crown of the region; worn, they halve the journal's cost forever after. Fate shuffles the order. Keep feeding tiles until they surface.\n\nA stone guardian dreams in the east. Stay out of its sight and it never stirs; no noise wakes stone. If it does, just walk. Two strides to its one. It yields nothing, and neither poison nor blood-drinking blades trouble stone.\n\nThe last two prizes fall in the far southwest; the road there is the third well, dead until a sheep finds the lone switch tile in the south. Wake it before the end. The walls hide doors, the chests run richest of these floors, and one fixed chest holds a _Potion of Liquid Flame_ every visit.
guide.sok_portals=The third page opens a maze of wells: step on a live one and it takes you mid-stride, unasked. A sheep pushed onto a switch tile reroutes some well. You will hear the click. Two wells start dead. Three western switches quarrel over one well, last word winning; one in the southern row is a saboteur that kills a portal outright. Walk the network on foot before you commit a single sheep.\n\nThe first six prizes are iron keys piled near the entrance. Six keys, five doors, one spare. The other seven land every treasure on one spot east of center: seeds, scrolls, and the _AutoPotion charm_, found nowhere else. Worn, it tips a healing potion down your throat when a blow all but kills you. Later than its inscription claims, and only if you carry one. Keep one bottled.\n\nTwo stone guardians, the only pair anywhere: one near the middle, one far southeast. A well can drop you at a guardian's elbow. If it wakes, take another well and leave it shuffling. No armor; the floor crawls with fleecing traps, and the chests here pay only the once. The treasures were spent the moment you first arrived: _there is no free scouting trip_.
guide.sok_practice=The first guardian's page opens Otiluke's schoolroom. Four breeds. The plain sheep slides one square away from you, never diagonal, never into anything solid. The corner sheep also takes diagonals. The switch sheep cannot be pushed; you trade places instead. The dark sheep is a discard: pushed, it takes itself off the board.\n\nYour goal: the tiles set with four blue studs. A sheep resting on one conjures a prize elsewhere, always in order. First an iron key for the locked door, then a _Towel_, ten wipes for bleeding and caustic filth, yours or a companion's. Three studded tiles, two prizes. One is a decoy.\n\nFleecing traps look like bare floor. Two tells: your feet balk at crossing one unless forced, and a wool rug is a spent trap. Change traps hide the same way, one use each. Plain becomes corner, switch becomes plain, corner becomes an _immovable lump forever_; only a fleecing trap unmakes it. Keep corners away and armor off.\n\nSearch the walls. Chests sometimes hide a scroll of upgrade, first visit only. A dead well wakes when a sheep finds its switch tile. Wedged? Leave and return. The board rebuilds; the prizes never do.
guide.sok_puzzles=The king's page opens the densest floor, rules inverted: most of the flock are switch sheep no shove will move, few true blocks, yet fifteen prize tiles want feeding. The answer is underfoot. Stand on a change trap and walk into a switch sheep. The trade sets it on the trap, and it rises plain, pushable. Converting, not pushing. Each trap fires once; keep corner sheep far away.\n\nThe six keys scatter, first at the entrance, last beneath the sleeping stone guardian. Lift it gently, or outrun it, two strides to its one. The rest is the haul: scrolls, seeds, an _Egg_ that hatches into a companion as you walk, the _Whistle_ that calls it from anywhere. The order is shuffled. To be sure of the Whistle, finish all fifteen.\n\nNearly everything piles on one spot in the far northeast; the southwest switch bends a portal to land beside it. Trigger it. That is your road. Two switches quarrel over one dead portal, last word winning. One is wired to nothing: sheep survives, switch dies silent. No click means you found it. Armor off; the walls still hide doors. The castle's ever-filling chest of liquid flame sits here too, in the same corner.
guide.sok_saferoom=The gentlest place under the earth. Nothing hunts here, nothing new ever arrives, hunger itself dozes, and the whole place lies lit and already known. Alone among Otiluke's spaces, this one remembers: whatever you set down waits, unspoiled, exactly where you left it. Use it as your vault for spare scrolls, potions, second-best gear.\n\nLook down on arrival. The _Builder's Tool_ lies on your landing tile, and nothing else like it exists. It carves the place to your liking: wall into floor or door, floor into wall, grass, or water. The only water in all these folded rooms is water you dig yourself. The chamber you see is one corner of a vast block of solid rock, yours to hollow. It will not touch the tile beneath your feet nor the outer edge, and it sulks uselessly anywhere else.\n\nIts best use is the last resort. When death closes in on an ordinary floor, read the journal and step here; _nothing can follow_. Know the price: the trip drains the journal dry, and the sealed air of a guardian's lair smothers the reading outright. The book gathers nothing in these rooms. Fill it out in the dungeon.
guide.sok_vault=The oldest of his rooms, dug before he learned sheep-craft, so it holds none. No puzzle, no traps, no locks, nothing alive. The page is the hard part: burn bookshelves while _Mind Vision_ opens your sight, and one day the Vault's page slips from the smoke. Once. Never again.\n\nOtiluke's note on the place is dry as dust: too much gold, nowhere to put it. He was not joking. One vast overgrown cavern strewn with more gold chests than you can open in a sitting. First visit, each is heavy with coin, and a few offer a scroll of upgrade instead. One chest (one, guaranteed) holds a _Ring of Wealth_, the only certain one anywhere. Look toward the cavern's northern end.\n\nCome once, come ready: empty pack, sweep everything. The second visit's chests hold pocket change. The dark keeps its secrets here, grass and shrub swallow the chests, and a scroll of magic mapping earns its keep. One more page answers the same ritual of shelf-smoke and second sight. The place it opens is no vault; its floor is one great field of fleecing traps, and that story belongs to another chapter.
guide.sokoban_overview=The mage Otiluke folded rooms into the space between the dungeon's floors. The only way in is a book, _Otiluke's Journal_. The shopkeeper below the sewers keeps a copy, the iron thing at the caves' bottom leaves one when it falls, and the old king deeper down carries a spare.\n\nThe book wakes only once a loose page is burned in, and every destination needs its own. The four great guardians of the upper floors each surrender one, in order. Gnoll archers, culled past a score, eventually yield the Safe Room's page; only ever one. Two more hide in bookshelves, and burning shelves under _Mind Vision_ rarely shakes a page free.\n\nEach new page makes the journal quicker to fill and refills it at once; spectacles in his castle halve the cost. It charges only in the dungeon's first twenty-five floors and one far settlement, never in his own spaces. Fill it before you step through.\n\nHis puzzles use living sheep as pieces, threaded between _fleecing traps_ that shear a sheep to a rug. The same traps tear apart whatever armor you wear. Go bare; they cannot touch you.\n\nThe floors rebuild on every entry, so a cornered sheep never strands you. Leave and return fresh. But treasures are spent the moment you first arrive: botch it and the floor returns solvable but stripped, leftover keys confiscated at the door. Only the Safe Room keeps faith. Dry, hot, lightless places, stone guardians dreaming on three of them. Some of the finest things I ever held slept inside.
guide.topic_bestiary=Every depth keeps its own beasts, and the dungeon quietly replaces what you kill. Quicker after dark. Clear a hall at noon and by midnight it has new tenants. Learn each floor's cast, but know that strangers slip in where they don't belong. I met a rat below the surface wearing something like a crown, and silent knife-men haunt floors seven and eight. Rare, but real.\n\nMost common creatures have a strange twin: pale rats whose bite will not stop bleeding, slimes that burn, crabs that spit sparks. The twin is always meaner than its kin. A trinket called the _Rat Skull_ draws them out, if you would rather hunt trouble than dodge it. And every beast grows harder the deeper it prowls. Never judge one by its shallower cousin.\n\nWhen a skeleton falls, be standing somewhere else. They burst. And a secret worth gold: the thieves and jailers of this prison are dead men walking, fanatics zombified long ago. Blades and blessings that punish the risen work wonders here.\n\nCheck the true sky before you descend. The dungeon keeps the world's own calendar, and on _full-moon nights_ the dead walk from dusk: shades in the prison halls, the sewers stirring only at full night. If one rises from a grave, stay your hand. Once in a long while it is a tormented soul, not a hungry one. Read a _scroll of remove curse_ beside it and it pays in enchantment.\n\nTrust no still water. Wide pools you never bothered to check have a way of growing something enormous while your back is turned.\n\nIf the Goo left you its odd little machine, _Mr Destructo_, carry it. It shoots at what you cannot reach and never tires. Below, the dead do not stop walking.
guide.topic_endings=Three ways out. The dungeon admits to two.\n\nFirst: kill the god on 25, descend once more, lift the _Amulet of Yendor_. A vision offers home. Go, or keep it and end when ready.\n\nSecond: climb from 25 with the amulet and the dungeon turns. The amulet falls silent. Surface or grave. Every floor climbed adds pressure. Everything hunts you, then quickens; you slow, then bleed. Vermin swell into horrors, floors refill. Each kill sheds pressure. Fight, don't flee. The lords' arenas are sanctuary: food, mending. Carry a dead delver's remains for honor. A bloodless climb earns more.\n\nThe third, nobody mentions. Floor 99, where Zot waits. No stair passes 26. Only doors, and the keys wear disguises. Gnoll archer near the sad ghost, 2 to 4: Sewers Key. Mossy skeleton, wandmaker's prison, 9: Prison Key. Any piranha once you've been below 10: Caves Key. Gold thief, 19: City Key. Spare them, the doors stay shut.\n\nBuy the three Books (Catacomb, Fortress, Chasm) at the last shop on 20. Each hides a _San Chikarah_ piece at its far end. The blacksmith welds them into a door to 35. Past the entry room, ten shadows of the dead god. The last to die drops the _Orb of Zot_. Break it: a page for Otiluke's Journal, sold on 6, shed by the machine and the dwarf king. Useless from 26 down or on a lord's floor. The page opens Town. Its mines end at 65: a stone giant, the _Palantir_ beside it. One use, never from a lord's floor. It takes you to 99.\n\nZot mends faster than you cut and hits like a cave-in. He leaps among phantom selves. Only a relic weapon bites. Never paralyze him; he heals, and the eyes come. When he falls, Otiluke walks free.\n\nBeyond the doors, those disguises keep paying. Archers yield the Tengu Key once Tengu's dead, skeletons the inscribed Bone, albino piranhas a Conch Shell, thieves an Ancient Coin. The fiftieth corpse loosens the grip. The hundredth opens it. Burn bookshelves under Mind Vision: two hidden journal pages wait in the smoke.
guide.topic_heroes=Six of us stood at the gate; only the warrior's road opens at first. The rest want proof. Read a _Scroll of Upgrade_ over anything and the mage steps forward. Ten blades in ten unguarded backs wakes the rogue; ten true throws, the huntress. The duelist notices only a proper blade, finer than practice steel, one you're strong enough to swing. The cleric answers whoever has lifted a curse.\n\nThe warrior's _Broken Seal_ shields him and carries one upgrade between armors. Never abandon it. The mage's staff is already a wand. The rogue's _Cloak of Shadows_ is invisibility on demand. The huntress's spirit bow never empties and grows as she does; her fists mind the rest. The duelist's rapier repays each exchange in flourishes. The cleric reads war-prayers from a holy tome. All six know one potion and one scroll by sight.\n\nYou grow by killing; talents blossom four times as you climb. Growth has a ceiling. Past it, experience spills over as a fleeting blessing. At depth 10 something leaves behind a mask, and with it a narrower calling. At depth 20 a crown wakes your armor with a power that gathers slowly; let it rest between feats. A certain royal rodent will barter stranger powers for that crown. The mage's darkest calling drinks life past the brim with every gain.\n\nEveryone carries a well of magic that refills itself (never while starving), and a Ring of Magic deepens the draw. Find the _Spellbook_ and feed it loose pages: fire, frost, storm, worse; when a power surges in your blood, matching spells bite far deeper. Eggs hatch by walking; what crawls out follows you down, a better friend than most. Crouch to cross open ground: half the pace, twice the ghost, slow to rise. And sleep. A day and a half awake brings the yawning; three days leaves you slow and clumsy, and the next dark drops you where you stand.\n\nThe amulet is not the bottom; they say the thing at the true bottom yields to a miner's pick loved beyond all reason.
guide.topic_loot=The dungeon pays, but rarely the same coin twice. Its rarest relics never return. The trinket of exotic crystals makes potions and scrolls arrive already stranger.\n\nSome treasure is a promise: every five floors, two _Potions of Strength_, three _Scrolls of Upgrade_, one stylus. Come up short, you missed a room. Each region's third or fourth floor hides a laboratory, five energy crystals inside. Floors 1 to 3 bury a stone of intuition and a trinket catalyst; the next two regions hide a single stone of enchantment between them. Every floor hides one meal.\n\nSearch skeletons. Open chests. Below floor 1 some have teeth, the golden bite hardest. Pry anyway: gold hoards upgraded gear and half the artifacts I ever held. The ebony kind wears a door's face, or the stairs themselves. Prod an exit before you trust it.\n\nCrypts, pools and sacrifice chambers deal arms meant for the region below. Your plain starting gear never lies loose; the floors offer better.\n\nShops wait at 6, 11 and 16: always an ankh, a stone of augmentation, the region's armor, a clean weapon, one rarity. On 6, buy _Otiluke's Journal_. It opens doors no stair reaches. Something not quite a man trades farther down.\n\nFloor 5's horror carried the worn key to its own sealed door, a chainsaw that learns magic at first blood, and a torn page. Keep pages; every guardian below holds another. Rare beasts carry keys: your first gnoll archer, your first mossy skeleton, rarer things deeper. Hunters who cull them by the hundred whisper of greater relics. Strength in a golden shell. Kings who pay in adamant.\n\nRare among crabs walks a hermit with a golden skeleton key: one use, any locked or crystal chest on its floor. Wells turn with the moon. Full heals, new reveals, quarters transmute. Altars gift by weekday; Lightday gives artifacts. A flytrap seed grows a well that eats offerings and gives back better. Burn a bookshelf while mind vision sharpens your eyes; rarely, the ashes hold a page to somewhere no stairs go.
guide.topic_meta=You did not write this book. I did; I'm not coming back for it. The binding survived my fall. The pages did not: they tore loose and scattered across the floors, each lying near the thing it describes. Pick one up and it settles back into the binding, for good. Death takes you. It never takes the book. The horrors keep no pages; face one and its chapter writes itself. Name your need and the book finds the page. Go down. Earn the rest.\n\nFive floors to a chapter, a monster closing each, the _Amulet of Yendor_ at depth 26. Shops at 6, 11 and 16. Strangers below ask favors; grant them. Two endings: leave with the prize, or climb every floor home wearing it.\n\nAbove all: the first four monsters guard more than trophies. _Search the ground after each falls_. A torn page lies there. Buy the first shopkeeper's strange journal too; through it, those pages open what lies past the twenty-sixth floor. A forgotten page waits where it fell. Nothing reminds you. Refuse the journal and a deeper terror carries one, chapters too late. None of this is chance.\n\nFloors arrive with tempers, named on arrival: flooded, overgrown, dark, vast, trap-thick, secret-riddled, chasm-torn. Dark chokes your sight. Vast means more food and treasure.\n\nTraps thicken and grow crueler as you descend: a few up top, seven at the bottom, most hidden. Past depth 20 no hidden door shows itself unbidden. Patient searching finds them all, and nearly every trap; dead ends and map-gaps mark where. Two or three secret rooms per region. Iron keys never leave their floor. Each chapter hides a place to brew.\n\nThe world above reaches down: the moon fills wells, gardens follow the seasons, a darkened sun unlocks treasuries, gold inside. Guard your wells. One heals wholly and blesses an Ankh. One names all you carry and bares the floor's secrets. One remakes what it's fed: a Potion of Strength becomes the _only Potion of Might_.\n\nThe trap the deep calls _Grim_ hurls death itself. A hero at full health survives it. Barely. Cross it whole or never. Chasms turn falls to bleeding and kill the weak outright; leap hale or feather-light. Space-bending traps once dragged a small crowned king out to fight me. Even the dungeon jokes.
guide.topic_plants=The dungeon gardens itself. Lush in spring, culled in winter, and the warm-blooded ones, Firebloom and Sungrass, die first. Your own plantings it spares. Trampled grass regrows every season but winter.\n\nNever trust a wild plant. Step close and it may tear loose; only the Blandfruit bush and _Rotberry_ stay put. Walls and tall grass calm the urge, water and wells feed it. No art turns it, and its own element slides off. The kill teaches nothing but usually drops the seed (always, if you snare its roots first). Ignored, it replants. What you sow never wakes.\n\nA seed is three things. A plant. A spice, its power riding the meal. Blade-venom, five poisoned strikes, more on a finer weapon. Three alike brew the plant's potion. Six kinds brew none: Blackholeflower, Blandfruit bush, Dreamfoil, Flytrap, Phaseshift, Venus flytrap. Three Rotberries brew Strength itself.\n\nFirebloom warms its ground and Icecap chills it. The _Blackholeflower_ bleeds cold enough to freeze water solid, a bridge until the fire-plants thaw it. Never step on the flower: half your remaining life, and a toss up a floor. Beasts go down instead.\n\nTall grass pays in mending dewdrops, seeds, berries, and nuts that sometimes bark your skin. Colored drops are worth many times the clear. A brimming _Dew Vial_ will bless your gear for half of itself: curses lifted, some pieces bettered.\n\nFire withers plants; frost never does. Withered in spring, one sometimes leaves its seed. In summer, rarely. Later, only gardener's magic saves it. A Clockcypress seed, eaten, stops time twice: the Timekeeper's trick without the Hourglass. _Hypnohemp_ turns whatever treads it wholly to your side.\n\nThe first gnoll archer you fell surrenders the Sewers Key. Once a lifetime it whisks you from almost anywhere to the Field, thick with Sungrass, Earthroot and Starflower, the best healing ground I found. Past depth ten, your first piranha kill yields the Caves Key, a flooded fishery of pale piranhas. The Golden Nut waits past the gold thieves' City Key and a hundred heads each: thieves, skeletons, pale piranhas, gnoll archers. It leaves you stronger and hardier, forever. I never tasted it.
guide.topic_quests=There are people down here. A few even mean well. Those with errands for you cannot be killed, so help them or walk past. Travel with others and each settles the debt alone; the giver waits until all are done.\n\nFirst: a ghost in the sewers, on 2 through 4. By 4 she is always there; if you haven't met her, look again. A gnoll with a bow skulks wherever she drifts. Mind it. She names a horror by floor: a fetid rat on 2, a gnoll trickster on 3, a great crab on 4. Kill it and she offers a weapon or an armor, sometimes far finer than these floors deserve. Choose slowly. _Whatever you refuse is lost_.\n\nHoard your _toadstool mushrooms_; a tinkerer below pays for them in things worth more than soup.\n\nRumors, since I can't walk you there: an old man in the prison deals in wands. Arrive with clean hands, killing nothing from your first step onto 7, and he gives more than he promises. Those born to magic need no such restraint. A smith farther down lends his tools and remembers favors. Something small and ambitious trades under the city. Behind a hidden wall on 5 sleeps a king who wants a crown that isn't his. A shop below sells a strange journal that opens, they say, onto somewhere peaceful.\n\nIf you find an egg, know that it listens. What befalls you while you carry it decides what claws its way out. Fire hatches one thing, frost another (winter helps); venom, lightning, conjured company, and long walking each their own. More of the same makes something greater. Never crack one early; what's inside dies unborn. A hatched companion grows on kills and mends itself. Between floors it rides in your pack, crowding the magics that move you. A _whistle_ calls a strayed one home. Strike your own beast three times and it leaves forever.
guide.topic_weather=There is a sky down here. I know how that sounds. But the seasons turn, and every stairwell leaks the weather down to you. Rain. Wind. Snow. Past depth fifteen, the sky gives up.\n\nYour body keeps its own weather. Water strips your heat. So do snow and wind. Embers give it back. Get too cold (one wet, windy night does it) and the shivering slows you, gnaws you. Then you freeze solid. Too hot, and you weaken and starve faster. Sometimes you just drop. No potion fixes either: cold wants fire; heat wants shade and cool water. Cloth holds warmth. Mail bleeds heat both ways. Plate changes temper slowly, a blessing against sudden flame and a curse when you're already frozen. A _Brimstone_ ward is a stove you wear.\n\nRain snuffs a burning coat but wets your scrolls till they misfire, and cold and lightning bite harder into wet skin. Never fight in shallow water under a storm. The lightning finds it. Wind spoils thrown aim. Blizzard and fog steal sight. Wet boots run cold and loud till they dry, and hard freezes turn the water itself to ice. Flame-things wilt in rain and cold, ice-things in heat. Fight each in its off-season.\n\nNight thins the crowds and hides you, but the dead hit harder. A full moon calms the beasts but raises wraiths. Its own light burns them. New moons breed more of everything. An _aurora_ on a clear winter night is the finest luck you'll ever hold. A rainbow after rain is its lesser cousin. A blood moon makes the dead terrible and their corpses rich. An eclipse darkens noon and feeds the dead. You, it hides completely.\n\nAutumn pays best. Summer sharpens every blow, yours and theirs. Winter dulls all wounds and starves the daylight. Even the weekdays have moods: Forgeday favors the striking arm, Harvestday the finding hand, Tideday the mending flesh.\n\nThe _Season Change_ spell moves no season. It strips every plant on the floor into seeds. Brew it from a scroll of magic mapping and a potion of earthen armor. What lives down here dies in open sunlight. Deeper still, the dungeon brews weather of its own.
guide.town_dolyahaven=No stairs lead out. Only the journal's return. Speak first with the _town guard_ in the plaza or the villager to the south: that talk yields the _return beacon_, and without it there is no road home from the deep mines. The mine entrance hides behind shrubs, southwest corner.\n\nOnly the blue cat in the northeast bites. A thief, striking twice for your once. Kill it early; it drops a berry, sometimes far better. Never bring the Amulet of Yendor near it: one touch steals it, and the cat bolts, bleeding gold.\n\nEleven chests dot the houses; a lucky few hold an _Egg_. Two tinkerers each trade for one toadstool. One betters your dew vial (water the ground, or make enemies bleed dew, chosen once), the other deals in Mr Destructo. The far smith binds one item in adamantite for an Adamant piece and fifty dark gold. The eastern temple's altar: three _Norn Stones_ of one color forge an enchanted relic; mixed colors gamble.\n\nThe shopkeepers buy anything, ore at a thousand a chunk, but their shelves never fill. The town keeps itself as you leave it; what dies stays dead. When the mage comes home, the mine seals for good. Dig first.
guide.town_dragoncave=One way in: the Dragon Cave page of Otiluke's Journal, coaxed from a burning bookshelf under mind vision. It drops you in the western caves. No stairs anywhere; the journal's return is the only road home.\n\nBetween you and the prize lies a lake of _fleecing traps_, hungry for worn armor. Wear nothing and each trap snaps at empty air and dies. Undress before the crossing, dress again on the far shore, and whole lanes are cleared for free.\n\nThe skeletons hold the treasury, once: fat purses on your first visit, sometimes a scroll of upgrade. Southeast, behind a _secret door_ off the eastern corridor, waits the shadow dragon egg. The only one there is, this first visit only. The cave reshapes itself with every entry, but egg and gold never return; revisits pay pennies.\n\nThe egg asks little: carry it ten steps, then crack it with open ground beside you and no other companion. What hatches outgrows everything. Its breath strikes from across the room, three times harder than its fearsome bite.\n\nOne last whisper: the old machinery here (portals, switches, sheep-pens) sits cold, and the violet wyrm of legend never showed itself to me. The hoard, for once, is unguarded. Take it.
guide.town_overview=Break the Orb of Zot and a torn page flutters loose, the one marked _Town_. Set it into Otiluke's Journal (the strange book from the depth 6 shop) and a single reading carries you to depth 55: a town of shopkeepers, tinkerers, and one blue cat I never learned to trust.\n\nBelow the town, nine floors of mines. Depths 56 through 64, where sight ends two paces out, and beneath them a sealed floor at 65. You go down by honest staircases here. A rarity this deep.\n\nThe natives of those galleries shrug off ordinary steel. Ordinary fire too. Only a _relic weapon_ bites true. Hunt the boar-beasts, the Gullin, for Norn Stones; only five will ever surface. Carry three to the town altar and forge a relic already humming with its own magic. Then go down to 65, face what guards the _Palantir_, and take it. That is the road to depth 99, to Zot and the mage he keeps.\n\nA second page, Dragon Cave, opens depth 67: a trap-riddled lair hiding an egg worth more than all its gold. The town's chests hold eggs too. Dragons and spiders hatch from them, and stranger things besides.\n\nThe air runs warm and dry down here. On full-moon nights the dead walk the mines, more of them after true dark. The galleries hold no traps; save that caution for the sealed floor and the dragon's lair.\n\nOne law above everything: forge the relic first. The rest is commentary.
guide.zot_level=You arrive on a pedestal in a walled chamber. No stairs, whatever the stones claim about ladders. The floor seals behind you, and the _Palantir_ will not leave a sealed place. No fleeing until Zot dies.\n\nThe north wall bristles with visible traps; each wakes an evil eye, or three. A charging eye barely feels your blows. Hold the heavy swing until it fires, and stay off its line. Dead ones leave meat, sometimes a healing draught. Take the south door.\n\nStep past it and Zot begins hunting, with a quiet "..." for warning. Nothing else lives here; all treasure comes from the fight itself.\n\nWhen Zot falls, Otiluke appears where he died, untouchable. Speak with him: a _Town Return Beacon_ if you carry none, and sometimes pudding for those who linger.\n\nUse the Palantir from a cleared, ordinary floor; it balks at guarded ones and hides while a companion follows. It fires once, then nothing until you stand here, and it returns you where you last left. Teleports fling you anywhere; the dwarves' hammer won't crack these walls. One northern cell was walled shut, the ghost of a door. The moss, gold, and cold water the stones promise are lies.
guide.zot_overview=Three ways this ends. Most take the _Amulet of Yendor_ from depth 26, a ribbon of stone over a bottomless fall; the bold haul the cursed thing back up to the sun. The third road almost nobody finds: a prison on depth 99, and a mad wizard called Zot inside it.\n\nIt begins at the imp's shop, depth 20. Three strange books, nine thousand gold apiece. A pittance once you hold the Amulet. Each book opens a sealed place. Catacombs, fortress, chasm. On each exit pedestal sits a piece of the _SanChikarah_. The blacksmith forges the three into one; the whole opens depth 35, where ten shadows whisper "we are legion." Only the last surrenders the _Orb of Zot_. Break it and a page falls free, naming Town: depth 55, mines beneath. Then depth 65, where a stone golem guards the _Palantir_. The golem is Otiluke himself, changed. He sleeps until struck; only a relic's edge marks him, and he usually leaves a potion. The Palantir carries you the rest of the way.\n\nNinety-nine is carved stone, forge-hot whatever season rages above. Bone dry. Dim as a dying torch. No water, no grass. No stairs either. They say the cavern is the inside of the Palantir itself: Otiluke sealed Zot within the stone when its power broke the wizard's mind, and paid with his own body.\n\nKnow this: no trumpets wait at the bottom. Kill Zot, free Otiluke, and the dungeon goes on, yours to finish however you please.
