levels.overworld.cavesites.found_mine=Trilhos somem no escuro, e madeiras velhas ainda escoram o teto: uma mina abandonada.
levels.overworld.cavesites.found_grotto=Uma luz suave brilha adiante, e o ar está carregado de esporos: uma gruta de cogumelos.
levels.overworld.cavesites.found_crystal=As paredes cintilam na sua luz, cobertas de cristal: uma caverna de cristal.
levels.overworld.cavesites.found_camp=O ar cheira a fumaça velha: um acampamento de mineiros.
levels.overworld.cavesites.found_shrine=Uma água parada e negra se estende sob a rocha, e um pequeno ídolo toma conta dela: um santuário do lago. Algo pálido se mexe na água funda.
levels.overworld.cavesites.found_rift=Calor sai de uma rachadura no chão, iluminada de vermelho: uma fenda ardente.
levels.overworld.cavesites.found_tomb=Pedra lavrada se ergue na caverna, selada por uma porta de ferro: uma tumba anã.
levels.overworld.cavesites.rumour_mine=uma mina antiga
levels.overworld.cavesites.rumour_grotto=uma gruta de cogumelos, brilhando no escuro
