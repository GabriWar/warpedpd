levels.overworld.roamerevent.rumour_wolf_0=Dizem que %1$s voltou, um lobo do tamanho de um pônei. Foi visto %2$s, %3$s. Agora a gente deixa o rebanho preso.
levels.overworld.roamerevent.rumour_wolf_1=Cuidado lá fora: %1$s anda à espreita %2$s, %3$s. Levou um bezerro ontem à noite.
levels.overworld.roamerevent.rumour_yeti_0=Os mais velhos dizem que %1$s voltou a andar, um yeti antigo. Uns caçadores o viram %2$s, %3$s.
levels.overworld.roamerevent.rumour_yeti_1=Viram uma coisa enorme e branca %2$s, %3$s. Os caçadores chamam aquilo de %1$s e não chegam perto.
levels.overworld.roamerevent.rumour_scorpion_0=Uma caravana perdeu duas mulas para %1$s, um escorpião do tamanho de uma carroça. Foi visto %2$s, %3$s.
levels.overworld.roamerevent.rumour_scorpion_1=Fique longe da areia: %1$s anda %2$s, %3$s, e uma ferroada mata um cavalo.
