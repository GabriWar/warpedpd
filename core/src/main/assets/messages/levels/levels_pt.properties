levels.overworld.raidevent.shut_raid=Agora não, são bandidos! Para dentro!
levels.overworld.raidevent.shut_recovering=Estamos fechados enquanto consertamos o que os bandidos quebraram. Volte daqui a um ou dois dias.
levels.overworld.huntevent.start_dusk=Um uivo corta o anoitecer: uma matilha está no encalço de um cervo!
levels.overworld.huntevent.start_night=Um uivo corta a escuridão: uma matilha está no encalço de um cervo!
levels.overworld.huntevent.start_far=Um uivo distante ao %s: uma matilha de lobos está caçando.
levels.overworld.huntevent.heard_near=Lobos uivam aqui perto: uma matilha está caçando esta noite.
levels.overworld.huntevent.kill=Os lobos derrubam o cervo e se ajeitam para comer.
levels.overworld.huntevent.escape=Com a matilha desfeita, o cervo foge aos saltos para longe do perigo.
