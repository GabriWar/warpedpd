levels.overworld.raidevent.smoke_here=Fumaça preta sobe sobre %s: bandidos estão atacando a vila!
levels.overworld.raidevent.live=Bandidos estão à solta nas ruas de %s!
levels.overworld.raidevent.thanks=Você botou eles para correr! %s não vai esquecer isso. Tome, com o nosso obrigado.
