levels.level.bookshelf_name=Estante de livros
levels.level.alchemy_name=Caldeirão de alquimia
levels.level.default_name=???
levels.level.chasm_desc=Você não consegue ver o fundo.
levels.level.water_desc=Em caso de queimaduras, pise na água para apagar o fogo.
levels.level.entrance_desc=Escadas levam ao andar superior.
levels.level.exit_desc=Escadas levam ao andar inferior.
levels.level.embers_desc=Brasas cobrem o chão.
levels.level.high_grass_desc=Vegetação densa bloqueia a visão.
levels.level.locked_door_desc=Esta porta está trancada. Você precisa de uma chave correspondente para destrancá-la.
levels.level.crystal_door_desc=Esta porta feita de cristal mágico está trancada. Você pode ver através dela, mas precisará de uma chave de cristal para abri-la.
levels.level.locked_exit_desc=Barras pesadas bloqueiam as escadas levando ao nível inferior.
levels.level.barricade_desc=A barricada de madeira está presa firmemente, mas secou ao passar dos anos. Será que pega fogo?
levels.level.inactive_trap_desc=A armadilha já foi ativada e não é mais perigosa.
levels.level.statue_desc=Alguém queria deixar este lugar mais bonito, mas falhou miseravelmente, como se pode ver.
levels.level.alchemy_desc=Este pote está cheio de água mágica. Itens podem ser misturados no pote para criar algo novo!
levels.level.empty_well_desc=O poço secou.

levels.level$feeling.chasm_title=Andar abissal
levels.level$feeling.water_title=Andar inundado
levels.level$feeling.grass_title=Andar gramado
levels.level$feeling.dark_title=Andar escuro
levels.level$feeling.large_title=Andar extenso
levels.level$feeling.traps_title=Andar com armadilhas
levels.level$feeling.secrets_title=Andar com segredos
levels.level$feeling.chasm_desc=Seus passos ecoam pela masmorra.
levels.level$feeling.water_desc=Você ouve água respingando ao seu redor.
levels.level$feeling.grass_desc=O cheiro de vegetação está bem forte no ar.
levels.level$feeling.dark_desc=Você consegue ouvir os inimigos se movendo na escuridão.
levels.level$feeling.large_desc=Este andar da masmorra parece incomumente largo.
levels.level$feeling.traps_desc=O chão parece especialmente traiçoeiro aqui.
levels.level$feeling.secrets_desc=A atmosfera deste andar indica que ele contém vários segredos.

levels.mininglevel.wall_desc=Uma parede de rocha lisa, um pouco mais macia que o normal. Você pode escavar através dela com a sua picareta, mas irá exigir certo esforço e aumentará um pouco a sua fome.
levels.mininglevel.gold_extra_desc=Você provavelmente pode escavar com a sua picareta.
levels.mininglevel.crystal_name=Pináculo de cristal
levels.mininglevel.boulder_name=Rocha
levels.mininglevel.crystal_desc=Há um grande e colorido aglomerado de cristais aqui. Esses cristais são frágeis e podem ser facilmente quebrados com uma picareta, ou quebrarão se algo for extraído próximo a eles.
levels.mininglevel.boulder_desc=Há uma enorme rocha bloqueando o caminho. Deve ser bastante fácil quebrar com uma picareta.
levels.mininglevel.barricade_desc=A barricada de madeira está firmemente colocada e atua como suporte para o teto.\n\nProvavelmente, foi construída pelos gnolls para oferecer proteção contra desmoronamento de rochas. _Quaisquer células adjacentes estarão protegidas contra armadilhas e ataques de desmoronamento._\n\nParece que queimaria tão bem quanto qualquer outra barricada.

levels.prisonlevel.water_name=Água fria escura
levels.prisonlevel.empty_deco_desc=Há manchas de sangue seco no chão.
levels.prisonlevel.bookshelf_desc=Isto é provavelmente o vestígio de uma biblioteca da prisão. Será que pega fogo?
levels.prisonlevel.region_deco_name=Prisão de gaiola
levels.prisonlevel.region_deco_desc=Uma gaiola de metal grande o suficiente para conter uma pessoa. Parece estar presa ao chão de alguma forma, você não consegue movê-la.
levels.prisonlevel.region_deco_alt_name=Gaiola suspensa
levels.prisonlevel.region_deco_alt_desc=Uma gaiola de metal grande o suficiente para conter uma pessoa. Está suspensa por uma corrente, balançando acima de um abismo profundo.

levels.sewerlevel.water_name=Água suja
levels.sewerlevel.empty_deco_desc=Um musgo molhado e amarelo encobre o chão.
levels.sewerlevel.bookshelf_desc=A estante está cheia de livros baratos e inúteis. Será que queima?
levels.sewerlevel.region_deco_name=Barril de armazenamento
levels.sewerlevel.region_deco_desc=Um barril robusto, quase do seu tamanho. Deve estar cheio com alguma coisa, pesado demais para mover.

levels.vaultlevel$vaultflametrap.name=Ventilação incendiária do cofre
levels.vaultlevel$vaultflametrap.desc=Esta abertura parece expelir jatos de chamas verdes em intervalos regulares. É possível ver as chamas começarem a se formar logo antes de serem disparadas. Geralmente, dá para evitar as chamas, mas _qualquer coisa que permita resistir a fogo ou a efeitos de área_ também é eficaz.



###Tiles
tiles.custom.carpet.name=Carpete
tiles.custom.carpet.desc=Um carpete espesso cobre o piso. Ele deve ter passado por algum tipo de tratamento, pois não é inflamável.

###Warped Pixel Dungeon
levels.features.chasm.safe_fall=Você despenca no abismo, não acha caminho para baixo e sai escalando em outro lugar.
levels.traps.fleecingtrap.name=armadilha tosquiadora
levels.traps.fleecingtrap.shear=A armadilha tosquiadora arranca metade da sua vida!
levels.traps.fleecingtrap.shear_kill=A armadilha tosquiadora raspa você até não sobrar nada!
levels.traps.fleecingtrap.desc=Uma armadilha tecida com magia de ovelha. Tosquia metade da vida de quem pisa nela, e acaba com qualquer coisa que já esteja perto da morte.
levels.level.bookshelf_desc=Prateleiras abarrotadas de livros. Vasculhar uma joga as páginas para fora; o fogo levaria tudo.
levels.level.empty_bookshelf_name=Estante vazia
levels.level.empty_bookshelf_desc=Tábuas nuas. Todo o conhecimento que havia aqui foi levado, mas a estante aguentaria mais.
levels.level.frozen_water_name=Água congelada
levels.level.frozen_water_desc=A água congelou e virou uma camada de gelo. Dá para atravessar a pé, mas é escorregadio e frio.
levels.sewerlevel.amulet_out=Você leva o Amuleto de Yendor para fora, à luz do dia. Longe, do outro lado do mundo, túmulos selados se agitam: agora eles vão se abrir para ele.
levels.overworld.overworldlevel.biome=_Bioma:_ %s
levels.overworld.overworldlevel.crystal=Veio de cristal
levels.overworld.overworldlevel.loose_rock=Pedra solta
levels.overworld.overworldlevel.loose_rock_desc=Um monte de pedra quebrada. Uma picareta daria conta.
levels.overworld.overworldlevel.shrub=Moita
levels.overworld.overworldlevel.snow=Neve
levels.overworld.overworldlevel.snow_desc=Neve com crosta por cima e funda por baixo. Range a cada passo.
levels.overworld.overworldlevel.road=Estrada de terra
levels.overworld.overworldlevel.road_desc=Uma estrada cheia de sulcos, batida por rodas de carroça e botas.
levels.overworld.overworldlevel.tunnel=Chão de túnel
levels.overworld.overworldlevel.tunnel_desc=Uma passagem gasta pela montanha, protegida do vento.
levels.overworld.overworldlevel.mud=Lama
levels.overworld.overworldlevel.mud_desc=Lama mole e grudenta deixada por uma enchente. Ela prende as botas e deixa você mais lento, mas as plantações crescem bem nela.
levels.overworld.overworldlevel.floodwater=Água da enchente
levels.overworld.overworldlevel.floodwater_desc=Água rasa do rio cheio. Ela vai baixar em alguns dias.
levels.overworld.overworldlevel.burnt_stump=Toco queimado
levels.overworld.overworldlevel.burnt_stump_desc=Tudo o que um incêndio deixou de uma árvore. Uma muda vai brotar dele em alguns dias.
levels.overworld.overworldlevel.biome_ocean=Oceano
levels.overworld.overworldlevel.biome_river=Rio
levels.overworld.overworldlevel.biome_beach=Praia
levels.overworld.overworldlevel.biome_plains=Planície
levels.overworld.overworldlevel.biome_meadow=Prado
levels.overworld.overworldlevel.biome_forest=Floresta
levels.overworld.overworldlevel.biome_swamp=Pântano
levels.overworld.overworldlevel.biome_desert=Deserto
levels.overworld.overworldlevel.biome_tundra=Tundra
levels.overworld.overworldlevel.biome_snowfield=Campo de neve
levels.overworld.overworldlevel.biome_foothills=Sopé
levels.overworld.overworldlevel.biome_mountain=Montanha
levels.overworld.overworldlevel.waypoint_reached=Você chegou ao seu ponto de referência.
levels.overworld.overworldlevel.ruin_title=Passagem em ruínas
levels.overworld.overworldlevel.ruin_desc=Uma escadaria caindo aos pedaços desce para a escuridão sob a ruína. Tem cheiro de masmorra.
levels.overworld.overworldlevel.ruin_yes=Descer para a masmorra
levels.overworld.overworldlevel.ruin_no=Agora não
levels.overworld.overworldlevel.delve_title=%s
levels.overworld.overworldlevel.delve_desc=A escada mergulha num túmulo selado de nível %1$d. Seus %2$d andares são escavados como os da masmorra e ficam cada vez mais perigosos, mas neles não há poção da força nem pergaminho do aprimoramento. Um guardião ocupa o fundo.
levels.overworld.overworldlevel.delve_yes=Descer
levels.overworld.overworldlevel.delve_no=Agora não
levels.overworld.overworldlevel.delve_sealed=A escada termina num selo de pedra negra. Ele não vai se mexer para você sem o Amuleto de Yendor.
levels.overworld.overworldlevel.delve_cleared_desc=Sua bandeira tremula sobre a escada: o guardião está morto e o tesouro foi levado. Os andares estão como você os deixou.
levels.delves.cleared=O guardião de %s cai. O tesouro é seu, e sua bandeira vai tremular sobre a escada.
levels.overworld.overworldlevel.waypoint_blocked=O caminho está bloqueado, e a marcha para aqui. Toque no marcador do mapa para tentar de novo.
levels.overworld.overworldlevel.waypoint_unreachable=Nenhum caminho a pé chega ao ponto de referência, e a marcha para o mais perto dele que a terra deixa. Toque no marcador do mapa para tentar de novo.
levels.frozenlevel.water_name=Água gelada
levels.frozenlevel.water_desc=Água de degelo, pouco acima do ponto de congelamento. Andar por ela vai gelar você até os ossos.
levels.frozenlevel.grass_name=Mato congelado
levels.frozenlevel.high_grass_name=Matagal coberto de geada
levels.frozenlevel.empty_deco_desc=O mato congelado estala sob os pés.
levels.frozenlevel.wall_deco_desc=Um veio de gelo corre pela rocha aqui, pingando água de degelo devagar.
levels.spidernestlevel.grass_name=Teia
levels.spidernestlevel.high_grass_name=Teia densa
levels.spidernestlevel.high_grass_desc=Camadas grossas de seda, esticadas entre qualquer coisa que as aguente. Atravessar é lento, e alguma coisa vai sentir você passando.
levels.spidernestlevel.empty_deco_desc=Carcaças envoltas em seda de tudo o que desceu aqui antes de você.
levels.hallslevel.branch_title=Um sopro de frio
levels.hallslevel.branch_prompt=A geada cobre a pedra em volta desta abertura, e o ar que sai dela é de um frio cortante. O que existe lá embaixo não faz parte dos salões, e nada ali vai ser mais fraco do que o que anda aqui em cima.
levels.hallslevel.branch_yes=Descer para o gelo
levels.hallslevel.branch_no=Ficar nos salões
levels.caveslevel.temple_title=Uma passagem selada
levels.caveslevel.temple_prompt=Lajes gastas descem até uma passagem mais antiga que as minas ao redor. As câmaras do outro lado foram feitas para testar quem entrasse nelas, e tiveram muito, muito tempo para aprender a esperar.
levels.caveslevel.temple_yes=Entrar no templo
levels.caveslevel.temple_no=Deixar selada
levels.overworld.overworldlevel.sign_entry=%1$s - %2$d passos
levels.overworld.overworldlevel.sign_town=Cidade - %d passos
levels.overworld.overworldlevel.thaw=O gelo cede sob você, e você se arrasta até a margem.
levels.overworld.overworldlevel.place_above=Alturas +%d
levels.overworld.overworldlevel.place_below=Cavernas -%d
levels.overworld.overworldlevel.steps_up=Degraus para cima
levels.overworld.overworldlevel.steps_down=Degraus para baixo
levels.overworld.overworldlevel.way_up=Subida
levels.overworld.overworldlevel.way_down=Descida
levels.overworld.overworldlevel.cave_mouth=Boca de caverna
levels.overworld.overworldlevel.drop=Despenhadeiro
levels.overworld.overworldlevel.pit=Buraco
levels.overworld.overworldlevel.wall_desc=Uma encosta rochosa. Uma picareta passaria por ela.
levels.overworld.overworldlevel.house_wall=Parede de casa
levels.overworld.overworldlevel.house_wall_desc=A parede de pedra de uma casa da vila. Alguém mora do outro lado.
levels.overworld.overworldlevel.hut_wall=Parede de cabana
levels.overworld.overworldlevel.hut_wall_desc=Pedras empilhadas e rebocadas com barro: a parede de uma cabana. Segura o vento, quase sempre.
levels.overworld.overworldlevel.peak_wall_desc=A rocha nua do pico, que continua subindo acima desta altura. Uma picareta passaria por ela.
levels.overworld.overworldlevel.cave_wall_desc=Rocha maciça. Uma picareta passaria por ela.
levels.overworld.overworldlevel.steps_up_desc=Degraus talhados na face do penhasco. Sobem até a altura de cima.
levels.overworld.overworldlevel.steps_down_desc=Degraus talhados no penhasco. Descem até a altura de baixo.
levels.overworld.overworldlevel.way_up_desc=Uma subida pela rocha, até o nível de cima.
levels.overworld.overworldlevel.way_down_desc=Um poço que desce pela rocha, até o nível de baixo.
levels.overworld.overworldlevel.cave_mouth_desc=Uma abertura escura no chão. Um ar frio sobe das cavernas lá embaixo.
levels.overworld.overworldlevel.drop_desc=A encosta despenca aqui. O chão lá embaixo fica bem longe.
levels.overworld.overworldlevel.pit_desc=Um buraco no chão da caverna, que dá para as cavernas de baixo. O chão delas aparece lá no fundo, no escuro.
levels.overworld.overworldlevel.crystal_desc=Um veio de cristal na rocha. Minere um cristal e ele pode soltar uma gema, mas o golpe estilhaça todos os cristais encostados nele, gemas e tudo, então escolha bem qual vai tirar.
levels.overworld.overworldlevel.vein=Veio de %s
levels.overworld.overworldlevel.vein_desc=%s brilha na face da rocha aqui. Uma picareta arrancaria um pedaço a cada golpe, e um veio muitas vezes continua pela rocha de trás.
levels.overworld.overworldlevel.tower_wall=Muro da torre
levels.overworld.overworldlevel.tower_wall_desc=Pedra talhada, caída em alguns pontos: o anel de uma velha torre de vigia. Uma picareta passaria por ela.
levels.overworld.mountainsites.found_hermit=Uma cabana de pedras empilhadas se agarra à encosta, com fumaça saindo da chaminé. Alguém mora aqui em cima.
levels.overworld.mountainsites.found_eyrie=Um ninho enorme e desarrumado de gravetos fica na beira do penhasco. Algo grande voa em círculos sobre ele.
levels.overworld.mountainsites.found_cairn=Um marco de pedras empilhadas indica o topo do pico.
levels.overworld.mountainsites.found_springs=Vapor sobe de poças na neve: fontes termais, com chão verde em toda a volta.
levels.overworld.mountainsites.found_climber=Tem algo meio enterrado na neve: um escalador que nunca desceu.
levels.overworld.mountainsites.found_tower=O anel quebrado de uma velha torre de vigia se ergue na crista.
levels.overworld.mountainsites.found_pass=Um abrigo de pedra fica perto da entrada do desfiladeiro, com a luz do fogo na porta.
levels.overworld.mountainsites.place_site=%1$s, alturas +%2$d
levels.overworld.mountainsites.summit=Você põe sua pedra no marco. Está no cume, a %s pés acima do mar, e a terra se abre lá embaixo.
levels.overworld.mountainsites.summit_mood=A vista levanta seu ânimo.
levels.overworld.mountainsites.summit_again=Sua pedra já está no marco.
levels.overworld.mountainsites.tower_view=Do alto da velha torre dá para ver a quilômetros.
levels.overworld.mountainsites.journal_title=Diário de um escalador
levels.overworld.mountainsites.journal_0=_Dia seis._ O vento virou durante a noite. Os outros desceram; eu disse que iria atrás de manhã. O cume está tão perto que consigo ver o marco.
levels.overworld.mountainsites.journal_1=_Dia nove._ Comi o resto do pão. Minhas mãos não fecham mais em volta do machado. Se alguém achar isto: tem uma fonte termal na outra face. Nunca cheguei lá.
levels.overworld.mountainsites.journal_2=_Dia quatro._ Um velho numa cabana de pedra me deu sopa e mandou eu voltar. Eu devia ter escutado.
levels.overworld.mountainsites.journal_3=_Dia onze._ As águias me vigiam do penhasco delas. Elas sabem. Digam à minha irmã que eu subi mais alto do que o pai jamais subiu.
levels.overworld.mountainsites.pass_sign=_%s_\n\nUm abrigo para quem atravessa as montanhas. Ninguém deixa o fogo apagar: descanse perto dele e siga aquecido.
levels.overworld.mountainsites.map_hermit=Eremita
levels.overworld.mountainsites.map_eyrie=Ninho das águias
levels.overworld.mountainsites.map_cairn=Cume
levels.overworld.mountainsites.map_springs=Fontes termais
levels.overworld.mountainsites.map_climber=Escalador perdido
levels.overworld.mountainsites.map_tower=Torre de vigia
levels.overworld.mountainsites.nest=Ninho de águia
levels.overworld.mountainsites.nest_desc=Um monte de gravetos, musgo e penugem enfiado na beira do penhasco. As águias não vão gostar nada de visitas.
levels.overworld.mountainsites.hearth=Lareira
levels.overworld.mountainsites.hearth_desc=Um círculo de pedras em volta de um fogo que ninguém deixa apagar. Sentar perto dele aquece você por inteiro.
levels.overworld.mountainsites.spring=Fonte termal
levels.overworld.mountainsites.spring_desc=A água é quente ao toque e solta vapor no ar frio. Um banho aqueceria você por inteiro.
levels.overworld.mountainsites.tower_top=Topo da torre
levels.overworld.mountainsites.tower_top_desc=O que restou do piso da torre. Daqui os vigias observavam os desfiladeiros.
levels.overworld.mountainsites.dir_n=norte
levels.overworld.mountainsites.dir_ne=nordeste
levels.overworld.mountainsites.dir_e=leste
levels.overworld.mountainsites.dir_se=sudeste
levels.overworld.mountainsites.dir_s=sul
levels.overworld.mountainsites.dir_sw=sudoeste
levels.overworld.mountainsites.dir_w=oeste
levels.overworld.mountainsites.dir_nw=noroeste
levels.overworld.wetlandsites.found_witch_hut=Uma cabana fica no meio da água do brejo, com uma passarela de tábuas até a porta e fumaça saindo da chaminé.
levels.overworld.wetlandsites.found_sunken_shrine=As paredes quebradas de um santuário antigo estão meio afundadas no brejo, com um ídolo na água bem no meio delas.
levels.overworld.wetlandsites.found_tide_pools=Poças entre as pedras perto do mar, cheias do que a maré deixou.
levels.overworld.wetlandsites.map_witch_hut=Cabana da bruxa
levels.overworld.wetlandsites.map_sunken_shrine=Santuário afundado
levels.overworld.wetlandsites.map_tide_pools=Poças de maré
levels.overworld.wetlandsites.acolytes_rise=Vultos saem da água em volta do santuário!
levels.overworld.wetlandsites.tide_out=A maré está baixando. As poças entre as pedras ficam à mostra.
levels.overworld.wetlandsites.tide_in=A maré está subindo por cima das poças.
levels.overworld.wetlandsites.pool=Poça de maré
levels.overworld.wetlandsites.pool_desc_out=Uma poça entre as pedras, deixada pelo mar na maré baixa. Tem conchas nela, e de vez em quando uma pérola. A maré volta em umas %d horas e leva de volta o que ainda estiver aqui.
levels.overworld.wetlandsites.pool_desc_in=A maré está cheia: as ondas quebram nas pedras e passam por dentro da poça. Ela volta a baixar em umas %d horas.
levels.overworld.wetlandsites.pool_desc_iced=A poça está congelada. Não vai ter nada nela até o degelo.
levels.overworld.wetlandsites.statue=Estátua afogada
levels.overworld.wetlandsites.statue_desc=Uma estátua gasta do velho deus do brejo, verde de musgo, num canto do seu santuário afundado.
levels.overworld.wetlandsites.shrine_wall=Parede do santuário
levels.overworld.wetlandsites.shrine_wall_desc=O que sobrou das paredes do santuário, afundando na lama pedra por pedra.
levels.overworld.wetlandsites.boardwalk=Passarela de tábuas
levels.overworld.wetlandsites.boardwalk_desc=Tábuas postas por cima da água do brejo, da margem até a porta da bruxa. Aqui em cima nada prende seus pés.
levels.overworld.mountainsites.height_same=nesta altura
levels.overworld.mountainsites.height_up_1=uma altura acima
levels.overworld.mountainsites.height_up=%d alturas acima
levels.overworld.mountainsites.height_down_1=uma altura abaixo
levels.overworld.mountainsites.height_down=%d alturas abaixo
levels.overworld.mountainsites.rumour_hermit="Tem outro doido feito eu morando aqui em cima, a %2$d passos ao %1$s, %3$s. Também não é de falar muito."
levels.overworld.mountainsites.rumour_eyrie="Tem águias fazendo ninho num penhasco a %2$d passos ao %1$s daqui, %3$s. Deixe os ovos delas em paz se tem amor aos seus olhos."
levels.overworld.mountainsites.rumour_cairn="Suba %2$d passos ao %1$s, %3$s, e você acha um marco no cume. Deixe uma pedra. A vista vale a subida."
levels.overworld.mountainsites.rumour_springs="Fontes termais, a %2$d passos ao %1$s, %3$s. Água quente feito banho, com neve em toda a volta. Salvou minha vida num inverno."
levels.overworld.mountainsites.rumour_climber="Um escalador subiu lá, a %2$d passos ao %1$s daqui, %3$s, e nunca mais desceu. O que ele levava ainda está com ele."
levels.overworld.mountainsites.rumour_tower="Tem uma velha torre de vigia na crista, a %2$d passos ao %1$s, %3$s. Tem semana que alguma coisa faz morada lá."
levels.overworld.mountainsites.rumour_pass="Tem um abrigo perto de %4$s, a %2$d passos ao %1$s, %3$s. Alguém mantém o fogo aceso. Nunca vi quem."
levels.overworld.mountainsites.rumour_cave="Debaixo da montanha, a %2$d passos ao %1$s, tem %3$s. Pelo menos é o que o povo diz."
levels.overworld.mountainsites.rumour_vein="A rocha a %2$d passos ao %1$s daqui é rica em %3$s. Traga uma picareta."
levels.overworld.mountainsites.rumour_none="Nada de novo aqui em cima. O vento, a neve, as águias. O de sempre."
levels.overworld.hazardwatch.firedamp_smell=O ar está pesado e cheira a ovo podre.
levels.overworld.hazardwatch.firedamp_flame=Sua chama sobe alta e azul no ar viciado. Afaste-a daqui, ou o ar vai pegar fogo!
levels.overworld.hazardwatch.firedamp_dizzy=O ar viciado deixa sua cabeça rodando.
levels.overworld.hazardwatch.firedamp_hiss=As chamas lambem o ar viciado: está prestes a explodir!
levels.overworld.hazardwatch.firedamp_ignite=O grisu pega fogo com um estrondo!
levels.overworld.hazardwatch.ice_crack=O gelo racha sob seus pés!
levels.overworld.hazardwatch.ice_groan=O gelo range e cede debaixo de você!
levels.overworld.hazardwatch.ice_break=O gelo se rompe, e você afunda na água congelante!
levels.overworld.hazardwatch.cracked_name=Gelo rachado
levels.overworld.hazardwatch.cracked_desc=O gelo aqui está rachado de lado a lado. Não vai aguentar o peso de ninguém por muito tempo.
levels.overworld.hazardwatch.ceiling_groans=O teto range.
levels.overworld.hazardwatch.gust_warn=O vento aumenta, uivando sobre a crista!
levels.overworld.hazardwatch.gust_hit=Uma rajada puxa você com força!
levels.overworld.hazardwatch.gust_brace=Você cambaleia e se firma contra a rajada.
levels.overworld.firedamp.name=grisu
levels.overworld.firedamp.ondeath=Você foi pego por uma explosão de grisu...
levels.overworld.firedamp.rankings_desc=Morto numa explosão de grisu
levels.overworld.worldevents.star_falls=Um risco de luz rasga o céu e cai ao %s.
levels.overworld.worldevents.star_falls_near=Uma estrela em chamas desce zunindo do céu e atinge o chão aqui perto!
levels.overworld.worldevents.star_falls_clouded=Algo brilhante mergulha pelas nuvens ao %s, e o chão estremece.
levels.overworld.worldevents.star_glow=Um brilho fraco continua na terra ao %s, onde uma estrela caiu.
levels.overworld.worldevents.star_glow_near=Uma estrela caída ainda fumega aqui perto.
levels.overworld.worldevents.star_cold=Uma cratera nova marca a terra ao %s, onde uma estrela caiu.
