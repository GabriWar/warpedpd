levels.overworld.roamerevent.tracks_scorpion=Marcas frescas de garras e o rastro de uma cauda enorme. A fera que as deixou está %s.
levels.overworld.roamerevent.seen_wolf=É %s, o lobo enorme de que as vilas tanto falam!
