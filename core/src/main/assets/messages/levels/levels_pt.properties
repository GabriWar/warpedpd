levels.overworld.wildfireevent.starts_camp=Sobe fumaça ao %s: uma fogueira deixada acesa pôs fogo no mato. Um incêndio!
levels.overworld.wildfireevent.starts_here_camp=O mato está pegando fogo aqui perto: uma fogueira deixada acesa começou um incêndio!
levels.overworld.wildfireevent.starts_lightning=Sobe fumaça ao %s: uma árvore atingida pelo raio voltou a pegar fogo. Um incêndio!
levels.overworld.wildfireevent.starts_here_lightning=Uma árvore atingida pelo raio pega fogo de novo aqui perto: um incêndio!
levels.overworld.wildfireevent.quenched=A chuva apaga o incêndio. Uma fumaça fina sobe do chão queimado.
levels.overworld.wildfireevent.burnt_out=O incêndio se apagou sozinho.
levels.overworld.wildfireevent.close=As chamas estão quase em cima de você! Saia daí ou apague o fogo.
levels.overworld.wildfireevent.warn=Um incêndio vem do %s na direção do seu sítio! Despeje garrafas de água na beirada do fogo para pará-lo.
levels.overworld.wildfireevent.warn_here=Um incêndio está queimando bem ao lado do seu sítio! Despeje garrafas de água na beirada do fogo para pará-lo.
levels.overworld.floodevent.rises=Depois de tanta chuva, o rio transbordou ao %s!
levels.overworld.floodevent.rises_here=Depois de tanta chuva, o rio transborda à sua volta!
levels.overworld.floodevent.falls=A água da enchente começa a baixar, deixando uma lama grossa nas margens.
levels.overworld.eclipseevent.herald=Os anciões de %1$s dizem que a lua vai cobrir o sol %2$s, perto do meio-dia.
levels.overworld.eclipseevent.herald_road=O povo da estrada diz que a lua vai cobrir o sol %s, perto do meio-dia.
levels.overworld.eclipseevent.tomorrow=amanhã
levels.overworld.eclipseevent.today=hoje
levels.overworld.eclipseevent.begins=A lua passa na frente do sol. Escurece ao meio-dia, e algumas estrelas aparecem.
levels.overworld.eclipseevent.ends=A lua segue seu caminho e o sol volta.
