levels.overworld.cavesites.prop_rails=Trilhos de mina
levels.overworld.cavesites.prop_rails_desc=Trilhos de ferro sobre dormentes podres, seguindo pela galeria. Os carrinhos que andavam neles sumiram faz tempo.
levels.overworld.cavesites.prop_cart=Carrinho de mina
levels.overworld.cavesites.prop_cart_desc=Um carrinho de mina enferrujado, largado onde saiu dos trilhos. O resto da carga ainda transborda pela borda e está espalhado pelo chão.
levels.overworld.cavesites.prop_timber=Escora de madeira
levels.overworld.cavesites.prop_timber_desc=Um poste e uma viga segurando o teto da galeria. A madeira está preta de velha, mas ainda aguenta.
levels.overworld.cavesites.prop_lantern=Lanterna
levels.overworld.cavesites.prop_lantern_desc=Uma lanterna a óleo pendurada num poste, queimando baixo. Alguém ainda a mantém acesa.
levels.overworld.cavesites.prop_crates=Caixotes
levels.overworld.cavesites.prop_crates_desc=Caixotes de suprimentos, pregados e carimbados com uma marca de mineiros.
levels.overworld.cavesites.prop_barrel=Barril
levels.overworld.cavesites.prop_barrel_desc=Um barril de óleo de lamparina. Tem um cheiro forte.
levels.overworld.cavesites.prop_sacks=Sacos
levels.overworld.cavesites.prop_sacks_desc=Sacos de farinha e sal, empilhados longe do chão úmido.
levels.overworld.cavesites.prop_tools=Suporte de ferramentas
levels.overworld.cavesites.prop_tools_desc=Picaretas, pás e cunhas penduradas num suporte, gastas e lisas de tanta mão.
levels.overworld.cavesites.prop_furnace=Fornalha anã
levels.overworld.cavesites.prop_furnace_desc=Uma fornalha de tijolo escuro construída na rocha. O calor da fenda mantém o bojo dela em brasa.
levels.overworld.cavesites.prop_bedroll=Saco de dormir
levels.overworld.cavesites.prop_bedroll_desc=Um saco de dormir estendido perto do fogo. O dono não está longe.
levels.overworld.cavesites.prop_log=Banco de tronco
levels.overworld.cavesites.prop_log_desc=Um tronco rolado até perto do fogo para servir de assento.
levels.overworld.cavesites.prop_campfire=Fogueira
levels.overworld.cavesites.prop_campfire_desc=Um fogo de carvão e sobras de madeira, abafado para queimar dia e noite.
levels.overworld.cavesites.prop_mushroom=Cogumelo gigante
levels.overworld.cavesites.prop_mushroom_desc=Um cogumelo mais alto que um homem. O chapéu solta uma luz fria e suave.
levels.overworld.cavesites.prop_sarcophagus=Sarcófago
levels.overworld.cavesites.prop_sarcophagus_desc=Um caixão de pedra, com um rosto anão entalhado na tampa e um aviso que você não consegue ler.
levels.overworld.cavesites.prop_rift=Fenda de lava
levels.overworld.cavesites.prop_rift_desc=Uma rachadura no chão, vermelha de rocha derretida. O ar em cima dela tremula, e de vez em quando ela solta uma labareda.
levels.overworld.cavesites.prop_shards=Lascas de cristal
levels.overworld.cavesites.prop_shards_desc=Lascas de cristal caídas das paredes cobrem o chão aqui, e cada uma solta uma luz fraca e fria só dela.
levels.overworld.cavesites.tomb_wall=Parede da tumba
levels.overworld.cavesites.tomb_wall_desc=Pedra lavrada, encaixada tão justa que nem a lâmina de uma faca passa entre os blocos. Nenhuma picareta vai atravessar, e nenhuma bomba também.
levels.overworld.cavesites.tomb_unbreakable=Sua picareta escorrega na pedra lavrada. Quem construiu esta tumba queria que ela ficasse fechada.
levels.overworld.cavesites.rift_flare=O brilho da fenda aumenta debaixo de você. Saia daí!
levels.overworld.cavesites.rift_death=A fenda solta uma labareda debaixo de você, e a rocha derretida leva você.
levels.overworld.cavesites.rankings_desc=Queimado por uma fenda de lava
levels.traps.changesheeptrap.name=placa do pastor
levels.traps.changesheeptrap.desc=Uma placa de pressão ligada ao enigma. Uma ovelha empurrada para cima dela vira outro tipo de ovelha; a placa se rearma depois de cada uso.
levels.traps.heapgentrap.name=placa de oferenda
levels.traps.heapgentrap.desc=Uma placa de pressão ligada ao enigma. Empurrar uma ovelha para cima dela conta como uma oferenda, e o cofre se lembra disso.
levels.traps.sokobanportaltrap.name=portal do enigma
levels.traps.sokobanportaltrap.desc=Um anel de luz verde-azulada no chão. Depois que o enigma o abre, entrar nele leva você para o outro lado do cofre.
levels.traps.activateportaltrap.name=placa do portal
levels.traps.activateportaltrap.desc=Uma placa de pressão ligada ao enigma. Uma ovelha empurrada para cima dela acende o portal que forma par com ela.
tiles.delveflag.name=Sua bandeira
tiles.delveflag.desc=Você a fincou aqui quando o guardião deste túmulo caiu. O túmulo foi limpo; os andares estão como você os deixou.
levels.spidernestlevel.region_deco_name=Pilar de pedra envolto em seda
levels.spidernestlevel.region_deco_desc=Um pilar de pedra irregular, envolto em camadas de seda velha de aranha. Bloqueia a passagem, mas dá para ver ao redor dele. A teia aqui é só decoração, não uma armadilha.
levels.frozenlevel.region_deco_name=Aglomerado de gelo
levels.frozenlevel.region_deco_desc=Um amontoado maciço de gelo e pedra, coberto de geada, bloqueia o caminho.
levels.frozenlevel.statue_name=Pilar de pedra congelado
levels.frozenlevel.statue_desc=Um velho pilar de pedra coberto de geada, de pé na caverna gelada.
levels.rooms.quest.branchstairs$spider.name=Escadaria com teias
levels.rooms.quest.branchstairs$spider.desc=Escada para baixo, tomada por teias velhas. Leva ao ninho de aranhas, não ao andar de baixo.
levels.rooms.quest.branchstairs$temple.name=Escadaria do templo
levels.rooms.quest.branchstairs$temple.desc=Degraus de mármore com moldura de ouro, gastos por peregrinos de outros tempos. Descem até o templo, não ao andar de baixo.
levels.rooms.quest.branchstairs$frozen.name=Escadaria congelada
levels.rooms.quest.branchstairs$frozen.desc=Degraus cobertos de gelo, com um hálito frio subindo lá de baixo. Levam aos Salões Congelados, não ao andar de baixo.
