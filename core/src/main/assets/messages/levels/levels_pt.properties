levels.overworld.cavesites.rumour_camp=outro acampamento de mineiros
levels.overworld.cavesites.rumour_shrine=um lago parado com um santuário na margem
levels.overworld.cavesites.rumour_rift=uma fenda ardente, com uma velha forja anã ao lado
levels.overworld.cavesites.rumour_tomb=uma tumba selada dos antigos anões
