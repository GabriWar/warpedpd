# Russian localization — next 500 keys
levels.features.chasm.safe_fall=Вы срываетесь в пропасть, но не находите пути вниз и выбираетесь в другом месте.
levels.traps.fleecingtrap.shear=Ловушка-стригальщица срезает половину вашего здоровья!
levels.traps.fleecingtrap.shear_kill=Ловушка-стригальщица лишает вас последних сил!
levels.traps.fleecingtrap.desc=Ловушка, сплетённая с помощью овечьей магии. Она отнимает половину здоровья у каждого, кто на неё наступит, а едва живых добивает на месте.
levels.level.bookshelf_desc=Книжные полки, плотно набитые томами. Стоит поискать на них что-нибудь полезное. В огне все книги сгорят.
levels.level.empty_bookshelf_desc=Пустые полки. Все хранившиеся здесь знания уже унесли, хотя место для новых книг осталось.
levels.level.frozen_water_desc=Вода покрылась коркой льда. По ней можно пройти, но поверхность скользкая и холодная.
levels.sewerlevel.amulet_out=Вы выносите Амулет Индора на дневной свет. Где-то далеко в мире содрогаются запечатанные курганы: теперь амулет может открыть их.
levels.overworld.overworldlevel.loose_rock_desc=Груда каменных обломков. Киркой можно расчистить проход.
levels.overworld.overworldlevel.snow_desc=Снег, покрытый настом сверху и глубокий под ним. Каждый шаг сопровождается хрустом.
levels.overworld.overworldlevel.road_desc=Изрытая колеями дорога, утрамбованная колёсами повозок и сапогами путников.
levels.overworld.overworldlevel.tunnel_desc=Протоптанный проход через гору, укрытый от ветра.
levels.overworld.overworldlevel.mud_desc=Липкая грязь, оставшаяся после разлива реки. Она затягивает сапоги и замедляет шаг, зато здесь хорошо растут посевы.
levels.overworld.overworldlevel.floodwater_desc=Мелководье, образовавшееся из-за разлива реки. Через несколько дней вода уйдёт.
levels.overworld.overworldlevel.burnt_stump_desc=Всё, что осталось от дерева после лесного пожара. Через несколько дней от пня пойдёт молодой побег.
levels.overworld.overworldlevel.ruin_desc=Под руинами вниз ведёт осыпающаяся лестница. Оттуда тянет запахом подземелья.
levels.overworld.overworldlevel.delve_desc=Ступени уходят в запечатанный курган уровня %1$d. Внутри %2$d этажей, устроенных подобно подземелью: чем глубже, тем опаснее. Зелий силы и свитков улучшения здесь нет, зато внизу ждёт страж.
levels.overworld.overworldlevel.delve_sealed=Лестница упирается в печать из чёрного камня. Без Амулета Индора она не поддастся.
levels.overworld.overworldlevel.delve_cleared_desc=Над лестницей развевается ваш флаг: страж повержен, сокровища забраны. Все этажи остались такими, какими вы их покинули.
levels.delves.cleared=Страж кургана %s повержен. Его сокровища ваши, а над лестницей отныне будет развеваться ваш флаг.
levels.overworld.overworldlevel.waypoint_blocked=Путь перекрыт — движение по маршруту приостановлено. Коснитесь значка карты, чтобы попробовать ещё раз.
levels.overworld.overworldlevel.waypoint_unreachable=Пешком до отметки не добраться — вы остановились так близко, как позволила местность. Коснитесь значка карты, чтобы попробовать ещё раз.
levels.frozenlevel.water_desc=Талая вода, едва теплее льда. Если войти в неё, холод проберёт до костей.
levels.frozenlevel.wall_deco_desc=Сквозь камень тянется ледяная жила, с которой медленно сочится талая вода.
levels.spidernestlevel.high_grass_desc=Густые полотнища паутины натянуты на всё, за что можно зацепиться. Пробираться сквозь них трудно, и кто-нибудь наверняка почувствует ваше движение.
levels.spidernestlevel.empty_deco_desc=Замотанные паутиной останки тех, кто забрёл сюда прежде вас.
levels.hallslevel.branch_prompt=Вокруг проёма камни покрыты инеем, а снизу тянет лютым холодом. То, что скрывается там, не относится к этим залам, и слабых врагов там ждать не стоит.
levels.caveslevel.temple_prompt=Изношенные каменные плиты ведут вниз, к двери, которая старше окружающих рудников. Залы за ней воздвигли для испытания пришедших. С тех пор у них было достаточно времени, чтобы дождаться новых гостей.
levels.overworld.overworldlevel.thaw=Лёд проламывается под вами — вы едва успеваете выбраться на берег.
levels.overworld.overworldlevel.wall_desc=Скалистый горный склон. Киркой можно пробить проход.
levels.overworld.overworldlevel.house_wall_desc=Каменная стена деревенского дома. За ней кто-то живёт.
levels.overworld.overworldlevel.hut_wall_desc=Стена хижины, сложенная из камней на глине. От ветра она, по крайней мере, защищает.
levels.overworld.overworldlevel.peak_wall_desc=Голая скала у вершины, уходящая ещё выше. Киркой можно пробить проход.
levels.overworld.overworldlevel.cave_wall_desc=Сплошная скала. Киркой можно пробить проход.
levels.overworld.overworldlevel.steps_up_desc=Ступени, высеченные прямо в обрыве. Они ведут на уступ выше.
levels.overworld.overworldlevel.steps_down_desc=Высеченные в скале ступени ведут на уступ ниже.
levels.overworld.overworldlevel.way_up_desc=Проход в скале, ведущий на ярус выше.
levels.overworld.overworldlevel.way_down_desc=Шахта в скале, уходящая на ярус ниже.
levels.overworld.overworldlevel.cave_mouth_desc=Тёмное отверстие в земле. Из пещер снизу поднимается холодный воздух.
levels.overworld.overworldlevel.drop_desc=Здесь горный склон обрывается. До земли внизу очень далеко.
levels.overworld.overworldlevel.pit_desc=Провал в полу пещеры, ведущий в нижние гроты. Их дно едва видно в темноте.
levels.overworld.overworldlevel.crystal_desc=Кристальная жила в скале. Если добыть кристалл, внутри может оказаться самоцвет. Но удар разобьёт и все соседние кристаллы вместе с их содержимым. Выбирайте внимательно.
levels.overworld.overworldlevel.vein_desc=В скале поблёскивает %s. Киркой можно вырубить по куску за удар, а за видимой жилой часто скрывается её продолжение.
levels.overworld.overworldlevel.tower_wall_desc=Кладка из тёсаного камня, местами обрушившаяся: остатки старой сторожевой башни. Киркой можно пробить проход.
levels.overworld.mountainsites.found_hermit=На горном склоне приютилась каменная хижина. Из трубы вьётся дым: здесь кто-то живёт.
levels.overworld.mountainsites.found_eyrie=На краю обрыва громоздится огромное гнездо из веток. Над ним кружит крупная птица.
levels.overworld.mountainsites.found_cairn=Вершину отмечает тур из сложенных друг на друга камней.
levels.overworld.mountainsites.found_springs=Среди снега поднимается пар: здесь бьют горячие источники, а вокруг них зеленеет земля.
levels.overworld.mountainsites.found_climber=Из снега виднеется что-то неподвижное: альпинист, который так и не спустился с горы.
levels.overworld.mountainsites.found_tower=На хребте возвышаются руины старой сторожевой башни.
levels.overworld.mountainsites.found_pass=У входа в перевал стоит каменное убежище. В дверях мерцает огонь.
levels.overworld.mountainsites.summit=Вы кладёте свой камень на тур. Вершина покорена: вы на высоте %s футов над морем, и перед вами раскинулся весь край.
levels.overworld.mountainsites.summit_again=Ваш камень уже лежит на туре.
levels.overworld.mountainsites.tower_view=С вершины старой башни открывается вид на многие мили вокруг.
levels.overworld.mountainsites.journal_0=_День шестой._ Ночью ветер переменился. Остальные спустились, а я сказал, что догоню утром. Вершина так близко — я уже вижу каменный тур.
levels.overworld.mountainsites.journal_1=_День девятый._ Доел остатки хлеба. Руки больше не держат топор. Если кто-нибудь найдёт эти записи: на другом склоне есть горячий источник. Я до него не добрался.
levels.overworld.mountainsites.journal_2=_День четвёртый._ Старик из каменной хижины накормил меня супом и велел повернуть назад. Надо было его послушать.
levels.overworld.mountainsites.journal_3=_День одиннадцатый._ Орлы смотрят на меня со скалы. Они всё понимают. Передайте сестре, что я поднялся выше, чем когда-либо отец.
levels.overworld.mountainsites.pass_sign=_%s_\n\nУбежище для путников, пересекающих горы. Огонь здесь никогда не гаснет. Отдохните у костра и продолжайте путь согревшись.
levels.overworld.mountainsites.nest_desc=Груда веток, мха и пуха, застрявшая на краю обрыва. Орлы вряд ли обрадуются гостям.
levels.overworld.mountainsites.hearth_desc=Костёр в круге из камней, который никогда не дают погаснуть. Посидев у него, можно как следует согреться.
levels.overworld.mountainsites.spring_desc=Вода горячая на ощупь и парит на морозе. Купание поможет согреться.
levels.overworld.mountainsites.tower_top_desc=Остатки пола дозорной башни. Когда-то отсюда следили за перевалами.
levels.overworld.wetlandsites.found_witch_hut=Среди болотной воды стоит хижина. К двери ведут мостки, а из трубы поднимается дым.
levels.overworld.wetlandsites.found_sunken_shrine=Из трясины наполовину выступают разрушенные стены древнего святилища. Посреди воды стоит идол.
levels.overworld.wetlandsites.found_tide_pools=У морского берега между камнями остались заполненные водой углубления, которые обнажает отлив.
levels.overworld.wetlandsites.acolytes_rise=Из воды вокруг святилища поднимаются фигуры!
levels.overworld.wetlandsites.tide_out=Начинается отлив. Каменные бассейны обнажаются.
levels.overworld.wetlandsites.tide_in=Прилив заливает каменные бассейны.
levels.overworld.wetlandsites.pool_desc_out=Небольшой бассейн между прибрежными камнями, оставшийся после отлива. В нём можно найти раковины, а иногда и жемчуг. Примерно через %d ч. море вернётся и заберёт всё, что здесь осталось.
levels.overworld.wetlandsites.pool_desc_in=Сейчас прилив: волны разбиваются о камни и захлёстывают бассейн. Примерно через %d ч. вода отступит.
levels.overworld.wetlandsites.pool_desc_iced=Бассейн накрепко скован льдом. До оттепели в нём ничего не найти.
levels.overworld.wetlandsites.statue_desc=Истёртая временем статуя древнего болотного бога, покрытая зелёным мхом. Она стоит в углу затонувшего святилища.
levels.overworld.wetlandsites.shrine_wall_desc=Остатки стен святилища, камень за камнем уходящие в трясину.
levels.overworld.wetlandsites.boardwalk_desc=Дощатые мостки ведут по болоту от берега до двери ведьмы. Здесь ничто не тянет вас за ноги.
levels.overworld.mountainsites.rumour_hermit=«Тут выше ещё один такой же чудак, как я, живёт: %2$d шагов на %1$s, %3$s. Тоже неразговорчивый».
levels.overworld.mountainsites.rumour_eyrie=«Орлы свили гнездо на скале: %2$d шагов на %1$s отсюда, %3$s. Не трогайте их яйца, если глаза дороги».
levels.overworld.mountainsites.rumour_cairn=«Поднимитесь на %1$s, пройдите %2$d шагов, %3$s, и найдёте на вершине каменный тур. Оставьте там камень. Вид того стоит».
levels.overworld.mountainsites.rumour_springs=«Горячие источники: %2$d шагов на %1$s, %3$s. Среди снега вода тёплая, словно в ванне. Как-то зимой они мне жизнь спасли».
levels.overworld.mountainsites.rumour_climber=«Один альпинист ушёл на %1$s отсюда, %2$d шагов, %3$s, и не вернулся. Всё, что нёс, так при нём и осталось».
levels.overworld.mountainsites.rumour_tower=«На хребте стоит старая сторожевая башня, %2$d шагов на %1$s, %3$s. Уже несколько недель там кто-то обитает».
levels.overworld.mountainsites.rumour_pass=«У %4$s есть убежище, %2$d шагов на %1$s, %3$s. Кто-то поддерживает там огонь. Вот только кто — не видел».
levels.overworld.mountainsites.rumour_cave=«Под горой, в %2$d шагах на %1$s, есть %3$s. По крайней мере, так говорят».
levels.overworld.mountainsites.rumour_vein=«Скала в %2$d шагах на %1$s отсюда богата на %3$s. Захватите кирку».
levels.overworld.mountainsites.rumour_none=«Ничего нового тут нет. Ветер, снег, орлы. Всё как всегда».
levels.overworld.hazardwatch.firedamp_smell=Воздух тяжёлый, пахнет тухлыми яйцами.
levels.overworld.hazardwatch.firedamp_flame=В этом ядовитом воздухе ваше пламя вытягивается и становится синим. Уберите огонь отсюда, иначе всё вспыхнет!
levels.overworld.hazardwatch.firedamp_dizzy=От зловонного воздуха кружится голова.
levels.overworld.hazardwatch.firedamp_hiss=Пламя охватывает горючий газ — сейчас рванёт!
levels.overworld.hazardwatch.firedamp_ignite=Рудничный газ вспыхивает с оглушительным грохотом!
levels.overworld.hazardwatch.ice_groan=Лёд под ногами трещит и прогибается!
levels.overworld.hazardwatch.ice_break=Лёд проламывается, и вы проваливаетесь в ледяную воду!
levels.overworld.hazardwatch.cracked_desc=Лёд здесь покрыт сквозными трещинами. Долго он никого не выдержит.
levels.overworld.hazardwatch.gust_warn=Ветер крепчает и с воем проносится над хребтом!
levels.overworld.hazardwatch.gust_brace=Вы пошатываетесь, упираясь ногами и сопротивляясь порыву.
levels.overworld.firedamp.ondeath=Вы погибли при взрыве рудничного газа...
levels.overworld.worldevents.star_falls=Огненная полоса пересекает небо и падает на землю в стороне %s.
levels.overworld.worldevents.star_falls_near=Пылающая звезда с воем падает с неба и ударяется о землю совсем рядом!
levels.overworld.worldevents.star_falls_clouded=Что-то яркое пронзает облака в стороне %s. Земля содрогается от удара.
levels.overworld.worldevents.star_glow=В стороне %s, где упала звезда, ещё заметно слабое свечение.
levels.overworld.worldevents.star_glow_near=Совсем рядом ещё тлеет упавшая звезда.
levels.overworld.worldevents.star_cold=В стороне %s земля изуродована свежим кратером — там упала звезда.
levels.overworld.worldevents.star_cold_near=Неподалёку в кратере лежит остывшая упавшая звезда.
levels.overworld.worldevents.star_bonus=На дне кратера, где лежал осколок, поблёскивает что-то ещё.
levels.overworld.worldevents.market_opens=Ветер доносит музыку и шелест флажков: на %1$s, в стороне %2$s, приехала бродячая ярмарка.
levels.overworld.worldevents.market_here=Флажки, музыка! На %s открылась бродячая ярмарка!
levels.overworld.raidevent.smoke=Над %1$s, в стороне %2$s, поднимается чёрный дым — на деревню напали разбойники!
levels.overworld.raidevent.smoke_here=Над %s поднимается чёрный дым — на деревню напали разбойники!
levels.overworld.raidevent.live=Разбойники бесчинствуют на улицах %s!
levels.overworld.raidevent.thanks=Вы прогнали разбойников! В %s этого не забудут. Примите награду в знак благодарности.
levels.overworld.raidevent.reward=Жители %s награждают вас, а местные торговцы три дня будут делать вам скидку.
levels.overworld.raidevent.reward_well=До вас доходит весть, что %s в безопасности: у колодца вас ждёт кошель с наградой, а местные торговцы три дня будут делать скидку.
levels.overworld.raidevent.withdraw=Налётчики скрываются, унося всё, что смогли награбить.
levels.overworld.raidevent.shut_recovering=Мы закрыты: чиним то, что разгромили разбойники. Приходите через день-другой.
levels.overworld.huntevent.start_dusk=Сумерки прорезает вой — волчья стая гонит оленя!
levels.overworld.huntevent.start_night=Ночную тьму прорезает вой — волчья стая гонит оленя!
levels.overworld.huntevent.start_far=Со стороны %s доносится далёкий вой: волчья стая вышла на охоту.
levels.overworld.huntevent.heard_near=Совсем рядом воют волки: сегодня ночью стая вышла на охоту.
levels.overworld.huntevent.kill=Волки валят оленя и принимаются за добычу.
levels.overworld.huntevent.escape=Стая разбежалась, и олень спасается бегством.
levels.overworld.wildfireevent.starts_camp=Со стороны %s поднимается дым: от непотушенного костра загорелась трава. Лесной пожар!
levels.overworld.wildfireevent.starts_here_camp=Рядом пылает трава: непотушенный костёр вызвал лесной пожар!
levels.overworld.wildfireevent.starts_lightning=Со стороны %s поднимается дым: дерево, поражённое молнией, вспыхнуло. Лесной пожар!
levels.overworld.wildfireevent.starts_here_lightning=Рядом вспыхивает дерево, поражённое молнией: начался лесной пожар!
levels.overworld.wildfireevent.quenched=Дождь тушит пожар. Над почерневшей землёй стелется тонкий дым.
levels.overworld.wildfireevent.burnt_out=Пожар выгорел сам собой.
levels.overworld.wildfireevent.close=Пламя уже почти добралось до вас! Отойдите или потушите его.
levels.overworld.wildfireevent.warn=Лесной пожар движется к вашей усадьбе со стороны %s! Поливайте его кромку водой из бутылок, чтобы остановить огонь.
levels.overworld.wildfireevent.warn_here=Пожар уже у самой усадьбы! Поливайте его кромку водой из бутылок, чтобы остановить огонь.
levels.overworld.floodevent.rises=После затяжных дождей река вышла из берегов в стороне %s!
levels.overworld.floodevent.rises_here=После затяжных дождей река вышла из берегов прямо рядом с вами!
levels.overworld.floodevent.falls=Паводковая вода начинает уходить, оставляя на берегах густую грязь.
levels.overworld.eclipseevent.herald=Старейшины %1$s говорят, что %2$s около полудня Луна закроет Солнце.
levels.overworld.eclipseevent.herald_road=Путники говорят, что %s около полудня Луна закроет Солнце.
levels.overworld.eclipseevent.begins=Луна наползает на Солнце. Посреди дня наступают сумерки, на небе проступают первые звёзды.
levels.overworld.eclipseevent.ends=Луна проходит дальше, и солнечный свет возвращается.
levels.overworld.festivalevent.heard=Ветер доносит музыку: в %1$s празднуют %2$s, в стороне %3$s.
levels.overworld.festivalevent.heard_here=Флажки и музыка: в %1$s празднуют %2$s!
levels.overworld.festivalevent.prize=Жители %s ликуют: главный приз праздника достаётся вам!
levels.overworld.festivalevent.bested=Чемпион вас одолел! Переведите дух и попробуйте ещё раз, если хотите.
levels.overworld.migrationevent.heard=В стороне %1$s грохочут копыта: огромное стадо оленей движется в направлении %2$s.
levels.overworld.migrationevent.heard_here=Рядом раздаётся топот копыт: мимо проходит огромное стадо оленей, направляясь на %s.
levels.overworld.migrationevent.hunt=Волки набрасываются на отставшего от стада оленя!
levels.overworld.roamerevent.rumour_wolf_0=«Говорят, вернулся %1$s — волк размером с пони. Видели его %2$s, %3$s. Теперь скотину на выпас не пускаем».
levels.overworld.roamerevent.rumour_wolf_1=«Будьте осторожны: %1$s рыщет %2$s, %3$s. Прошлой ночью телёнка утащил».
levels.overworld.roamerevent.rumour_yeti_0=«Старики говорят, снова появился %1$s, древний йети. Охотники видели его %2$s, %3$s».
levels.overworld.roamerevent.rumour_yeti_1=«Видели что-то огромное и белое %2$s, %3$s. Звероловы зовут его %1$s и близко не подходят».
levels.overworld.roamerevent.rumour_scorpion_0=«Караван потерял двух мулов из-за %1$s — скорпиона размером с повозку. Его видели %2$s, %3$s».
levels.overworld.roamerevent.rumour_scorpion_1=«Не ходите по пескам: %1$s объявился %2$s, %3$s. Его жало и лошадь убьёт».
levels.overworld.roamerevent.tracks_wolf=Свежие отпечатки лап, каждый размером с вашу растопыренную ладонь. Зверь, оставивший их, находится %s.
levels.overworld.roamerevent.tracks_yeti=Свежие следы, вдвое больше человеческих. Зверь, оставивший их, находится %s.
levels.overworld.roamerevent.tracks_scorpion=Свежие следы клешней и борозда от огромного хвоста. Зверь, оставивший их, находится %s.
levels.overworld.roamerevent.seen_wolf=Это же %s — огромный волк, о котором говорят во всех деревнях!
levels.overworld.roamerevent.seen_yeti=Это же %s — древний йети, о котором говорят во всех деревнях!
levels.overworld.roamerevent.seen_scorpion=Это же %s — гигантский скорпион, о котором говорят во всех деревнях!
levels.overworld.roamerevent.slain=Вы одолели %s! За трофей можно выручить хорошие деньги.
levels.overworld.cavesites.found_mine=Рельсы уходят в темноту, а старые подпорки всё ещё держат свод. Это заброшенная шахта.
levels.overworld.cavesites.found_grotto=Впереди мерцает мягкий свет, а воздух полон спор: вы нашли грибной грот.
levels.overworld.cavesites.found_crystal=Стены сверкают в свете факела, сплошь покрытые кристаллами: это кристальная пещера.
levels.overworld.cavesites.found_camp=В воздухе пахнет старым дымом: здесь был лагерь рудокопов.
levels.overworld.cavesites.found_shrine=Под скалой чернеет неподвижная вода, а рядом возвышается маленький идол: святилище у подземного озера. В глубине шевелится что-то бледное.
levels.overworld.cavesites.found_rift=Из красной трещины в полу накатывает жар: здесь проходит огненный разлом.
levels.overworld.cavesites.found_tomb=В пещере возвышается кладка из тёсаного камня, запертая железной дверью: дворфийская гробница.
levels.overworld.cavesites.rumour_grotto=грибной грот, светящийся в темноте
levels.overworld.cavesites.rumour_crystal=пещера, сплошь заросшая кристаллами
levels.overworld.cavesites.rumour_shrine=тихое озеро со святилищем на берегу
levels.overworld.cavesites.rumour_rift=огненный разлом со старой дворфийской кузницей рядом
levels.overworld.cavesites.prop_rails_desc=Железные рельсы на гнилых шпалах уходят в глубину штрека. Вагонетки, что ходили по ним, давно исчезли.
levels.overworld.cavesites.prop_cart_desc=Ржавая шахтная вагонетка, сошедшая с рельсов. Остатки груза всё ещё лежат в ней и рассыпаны по полу.
levels.overworld.cavesites.prop_timber_desc=Стойка с поперечиной держит свод штрека. Дерево почернело от времени, но пока не поддаётся.
levels.overworld.cavesites.prop_lantern_desc=На стойке висит масляный фонарь. Он едва горит — значит, кто-то до сих пор его заправляет.
levels.overworld.cavesites.prop_crates_desc=Ящики с припасами, заколоченные и отмеченные клеймом рудокопов.
levels.overworld.cavesites.prop_barrel_desc=Бочка с маслом для ламп. От неё сильно пахнет.
levels.overworld.cavesites.prop_sacks_desc=Мешки с мукой и солью, сложенные подальше от сырого пола.
levels.overworld.cavesites.prop_tools_desc=На стойке висят кирки, лопаты и клинья, отполированные множеством рук.
levels.overworld.cavesites.prop_furnace_desc=В скале сложена печь из тёмного кирпича. Жар разлома поддерживает в ней постоянный огонь.
levels.overworld.cavesites.prop_bedroll_desc=Походная постель у костра. Её хозяин где-то поблизости.
levels.overworld.cavesites.prop_log_desc=Бревно, пододвинутое к костру вместо скамьи.
levels.overworld.cavesites.prop_campfire_desc=Костёр из угля и обрезков древесины, уложенный так, чтобы гореть днём и ночью.
levels.overworld.cavesites.prop_mushroom_desc=Гриб выше человеческого роста. Его шляпка источает мягкий холодный свет.
levels.overworld.cavesites.prop_sarcophagus_desc=Каменный саркофаг с высеченным на крышке лицом дворфа и надписью-предостережением, которую вы не можете прочесть.
levels.overworld.cavesites.prop_rift_desc=Трещина в полу светится красным от раскалённой породы. Воздух над ней дрожит, а иногда из разлома вырывается пламя.
levels.overworld.cavesites.prop_shards_desc=Пол густо усеян кристальными осколками, упавшими со стен. Каждый испускает собственное слабое холодное свечение.
levels.overworld.cavesites.tomb_wall_desc=Тёсаные блоки пригнаны так плотно, что между ними не просунуть и лезвие ножа. Эту стену не возьмут ни кирка, ни бомба.
levels.overworld.cavesites.tomb_unbreakable=Кирка соскальзывает с гладкой кладки. Строители гробницы явно собирались оставить её закрытой навеки.
levels.overworld.cavesites.rift_flare=Свечение разлома под ногами усиливается — уходите!
levels.overworld.cavesites.rift_death=Разлом вспыхивает прямо под вами, и раскалённая порода поглощает вас.
levels.traps.changesheeptrap.desc=Нажимная плита, связанная с головоломкой. Если загнать на неё овцу, та превратится в овцу другого вида. После каждого срабатывания плита возвращается в исходное состояние.
levels.traps.heapgentrap.desc=Нажимная плита, связанная с головоломкой. Загнанная на неё овца считается жертвоприношением, которое запоминает хранилище.
levels.traps.sokobanportaltrap.desc=Кольцо бирюзового света в полу. Когда головоломка откроет портал, шаг внутрь перенесёт вас в другую часть хранилища.
levels.traps.activateportaltrap.desc=Нажимная плита, связанная с головоломкой. Загнанная на неё овца активирует соответствующий портал.
tiles.delveflag.desc=Вы установили этот флаг после победы над стражем кургана. Курган зачищен, а этажи остались такими, какими вы их покинули.
levels.spidernestlevel.region_deco_desc=Зазубренная каменная колонна, оплетённая старой паутиной. Она мешает пройти, но не закрывает обзор. Паутина здесь служит украшением и не является ловушкой.
levels.frozenlevel.region_deco_desc=Путь перекрывает массивное скопление камня и льда, покрытое инеем.
levels.frozenlevel.statue_desc=Старая каменная колонна, обросшая инеем, стоит посреди ледяной пещеры.
levels.rooms.quest.branchstairs$spider.desc=Ступени вниз, затянутые старой паутиной. Они ведут в паучье гнездо, а не на следующий этаж.
levels.rooms.quest.branchstairs$temple.desc=Мраморные ступени в золотом обрамлении, истёртые ногами паломников. Они ведут в храм, а не на следующий этаж.
levels.rooms.quest.branchstairs$frozen.desc=Покрытые льдом ступени, снизу тянет холодом. Они ведут в замёрзшие залы, а не на следующий этаж.
