###features
levels.features.chasm.chasm=Пропасть
levels.features.chasm.yes=Да, я знаю, что я делаю
levels.features.chasm.no=Нет, я передумал
levels.features.chasm.jump=Вы действительно хотите прыгнуть в пропасть? Падение с такой высоты будет весьма болезненным.
levels.features.chasm.ondeath=Вы разбились насмерть...
levels.features.chasm.rankings_desc=Погиб при падении



###rooms
levels.rooms.secret.ratkingroom$ratkingroomdeco.statue_name=Статуя крысы
levels.rooms.secret.ratkingroom$ratkingroomdeco.pillow_name=Королевская подушка
levels.rooms.secret.ratkingroom$ratkingroomdeco.statue_desc=Статуя, изображающая Крысиного короля. Интересно, кто её создал?
levels.rooms.secret.ratkingroom$ratkingroomdeco.pillow_desc=Эта пухлая фиолетовая подушка слишком мала, чтобы служить вам кроватью, зато для самой важной крысы на свете она в самый раз.

levels.rooms.special.magicalfireroom$eternalfire.desc=Путь преграждает стена густого ярко-зелёного пламени, возникшего, по всей видимости, из-за магии. Сквозь неё не пройти: огонь поджигает всё, что подступает слишком близко. Сам собой он не погаснет — придётся найти способ его потушить.

levels.rooms.special.sentryroom$sentry.name=красный часовой
levels.rooms.special.sentryroom$sentry.desc=Этот багровый страж, похоже, охраняет сокровище на другом конце комнаты. Если войти в область, которую он защищает, страж начнёт стрелять в вас лучами дезинтеграции.\n\nОн невосприимчив ко всем вредным эффектам и видит даже невидимых существ. Правда, перед выстрелом ему требуется время на зарядку.\n\nПочему-то страж целится только в вас, словно понимает, что обитатели подземелья здесь не чужие.
levels.rooms.special.sentryroom$sentry.discover_hint=Вы можете найти этого противника где угодно в подземелье.

levels.rooms.special.toxicgasroom$toxicvent.name=токсичный клапан
levels.rooms.special.toxicgasroom$toxicvent.desc=Должно быть, беспечный приключенец активировал эту ловушку годами ранее. Несмотря на её неактивное состояние, она продолжает накачивать комнату ядовитым газом, и не похоже, что она когда-либо прекратит. Вам нужно каким-то образом защитить себя от газа, если вы хотите исследовать эту комнату.

levels.rooms.special.weakfloorroom$hiddenwell.name=Отдалённый колодец
levels.rooms.special.weakfloorroom$hiddenwell.desc=Вы еле-еле можете разглядеть внизу колодец. Может быть, там что-то есть?

levels.rooms.quest.ambitiousimproom$questentrance.name=Вход в хранилище
levels.rooms.quest.ambitiousimproom$questentrance.desc=Эта зловещая яма, похоже, ведёт в древнее дворфское хранилище. Вход закрыт магическим барьером, по которому можно ходить, словно по обычному полу.

levels.rooms.quest.blacksmithroom$questentrance.name=Вход в шахту
levels.rooms.quest.blacksmithroom$questentrance.desc=Эта лестница ведёт в старую шахту, расположенную прямо под кузнечной мастерской.

levels.rooms.quest.blacksmithroom$smithyvisuals.name=Кузница
levels.rooms.quest.blacksmithroom$smithyvisuals.desc=Небольшая кузница тролля с лотком для угля, горном и чаном, наполненным на редкость грязной водой.

levels.rooms.quest.ritualsiteroom$ritualmarker.name=Ритуальный символ
levels.rooms.quest.ritualsiteroom$ritualmarker.desc=Символ для какого-то тёмного ритуала. Свечи обычно располагают в четырёх углах.
levels.rooms.quest.ritualsiteroom$table.name=Зловещий стол
levels.rooms.quest.ritualsiteroom$table.desc=Тяжёлый стол, который был наспех переоборудован в дыбу.

levels.rooms.quest.massgraveroom$massgravedeco.name=Массовое захоронение
levels.rooms.quest.massgraveroom$massgravedeco.desc=Пол усыпан костями, что здесь произошло?

levels.rooms.quest.mineentrance$questexit.name=Выход из шахты
levels.rooms.quest.mineentrance$questexit.desc=Эта лестница ведёт к выходу из старой шахты обратно в кузнечную мастерскую.

levels.rooms.quest.vault.vaultentranceroom$questentranceinternal.name=Платформа
levels.rooms.quest.vault.vaultentranceroom$questentranceinternal.desc=Эта большая платформа точно совпадает по размеру с ямой над ней. Похоже, при обычном входе в хранилище она служит частью подъёмного механизма.

levels.rooms.quest.vault.vaultfinalroom.imp_warning_unprepared=Как только вы входите в большой комнату, время словно замирает, и вы слышите голос беса:\n\n«Думаю, ты попал в самую дальнюю комнату хранилища, моя статуэтка должна быть прямо за ней! Но я уверен, что там тебя ждёт какая-нибудь коварная ловушка или страж, так что _тебе обязательно нужно осмотреться и подготовиться, прежде чем идти дальше!_ Я хочу, чтобы ты действительно добыл мой приз, а не погиб, пытаясь это сделать!»
levels.rooms.quest.vault.vaultfinalroom.imp_warning_prepared=Как только вы входите в большой комнату, время словно замирает, и вы слышите голос беса:\n\n«Хорошо, думаю, ты попал в самую дальнюю комнату хранилища, моя статуэтка должна быть прямо за ней! Но я уверен, что там тебя ждёт какая-нибудь коварная ловушка или страж, так что _убедись, что ты полностью подготовился и набрался сил к серьёзному бою!_ Я хочу, чтобы ты действительно добыл мой приз, а не погиб, пытаясь это сделать!»
levels.rooms.quest.vault.vaultfinalroom.final_warning=Вы слышите, как что-то набирает заряд. Ещё один шаг — и сработает некий механизм!
levels.rooms.quest.vault.vaultfinalroom$markertiles.name=Гигантский символ
levels.rooms.quest.vault.vaultfinalroom$markertiles.desc=Узор на полу похож на огромную версию символа призыва из тюрьмы.\n\nПлиты гудят от накопленной энергии, словно здесь дремлет огромная сила, готовая вот-вот вырваться наружу.
levels.rooms.quest.vault.vaultfinalroom$vaulttreasure.desc=На полу громоздятся кучи золота. Жаль, что забрать его с собой из хранилища нельзя.

###traps
levels.traps.alarmtrap.name=сигнальная ловушка
levels.traps.alarmtrap.alarm=Громкий звук от ловушки разносится по всему подземелью!
levels.traps.alarmtrap.desc=Похоже, что эта ловушка соединена с каким-то сигнальным механизмом. При срабатывании она, скорее всего, привлечёт внимание всех существ на этаже.

levels.traps.blazingtrap.name=огненная ловушка
levels.traps.blazingtrap.desc=При активации, эта ловушка подожжёт мощную химическую смесь, создав пожар в довольно большом радиусе вокруг себя.

levels.traps.burningtrap.name=поджигающая ловушка
levels.traps.burningtrap.desc=При активации, эта ловушка зажжёт смесь особых химикатов, поджигая всё рядом с собой.

levels.traps.chillingtrap.name=замораживающая ловушка
levels.traps.chillingtrap.desc=Химические вещества, содержащиеся в этой ловушке, способны вызвать резкое похолодание рядом с ней.

levels.traps.confusiontrap.name=дезориентирующая ловушка
levels.traps.confusiontrap.desc=При активации ловушка выпустит облако дезориентирующего газа.

levels.traps.cursingtrap.name=проклинающая ловушка
levels.traps.cursingtrap.curse=Надетая экипировка была проклята!
levels.traps.cursingtrap.desc=Эта ловушка содержит ту же тёмную энергию, что содержится в проклятых вещах. При срабатывании она проклянет некоторые из тех предметов, что окажутся рядом.

levels.traps.disarmingtrap.name=обезоруживающая ловушка
levels.traps.disarmingtrap.disarm=Ваше оружие куда-то телепортировано!
levels.traps.disarmingtrap.desc=Особая магия телепортации в этой ловушке переместит оружие жертвы в случайное место.

levels.traps.disintegrationtrap.name=дезинтегрирующая ловушка
levels.traps.disintegrationtrap.one=Ловушка дезинтегрирует %s!
levels.traps.disintegrationtrap.some=Ловушка частично дезинтегрирует %s!
levels.traps.disintegrationtrap.ondeath=Дезинтегрирующая ловушка убила вас...
levels.traps.disintegrationtrap.desc=При срабатывании ловушка выпускает в ближайшую цель лучи дезинтеграции, нанося большой урон и уничтожая предметы.\n\nК счастью, спусковой механизм ловушки не скрыт.

levels.traps.distortiontrap.name=искажающая ловушка
levels.traps.distortiontrap.desc=Эта ловушка, сделанная с помощью странной магии неизвестного происхождения, призовёт самых разных существ на это место.

levels.traps.explosivetrap.name=взрывная ловушка
levels.traps.explosivetrap.desc=Эта ловушка состоит из пороховой взрывчатки и пускового механизма. При активации, она взорвёт всё рядом с собой.

levels.traps.flashingtrap.name=ослепляющая ловушка
levels.traps.flashingtrap.desc=При срабатывании ловушка воспламеняет спрятанный внутри порошок. Яркая вспышка на время ослепляет жертву, калечит её и наносит урон.\n\nПорошка в ловушке достаточно для многих срабатываний.

levels.traps.flocktrap.name=овечья ловушка
levels.traps.flocktrap.desc=Наверное, какой-то маг-любитель решил пошутить: при активации ловушки появится стадо волшебных овец.

levels.traps.frosttrap.name=ледяная ловушка
levels.traps.frosttrap.desc=Сильные химические вещества, содержащиеся в этой версии замораживающей ловушки, способны вызвать сильное похолодание в большом радиусе вокруг ловушки.

levels.traps.gatewaytrap.name=шлюз-ловушка
levels.traps.gatewaytrap.desc=Эта специальная телепортационная ловушка может активироваться бесконечное количество раз и всегда телепортирует в одно и то же место.

levels.traps.geysertrap.name=гейзерная ловушка
levels.traps.geysertrap.desc=При срабатывании ловушки из земли вырывается мощный водяной гейзер. Он ранит огненных существ, отбрасывает всех поблизости, тушит огонь и затапливает окружающую местность.

levels.traps.gnollrockfalltrap.name=гнолья ловушка с камнями
levels.traps.gnollrockfalltrap.desc=Эту ловушку создали не без помощи магии. При срабатывании она заставляет камни обрушиться с потолка на область размером 5×5 клеток. Здесь порода мягче, поэтому обвал наносит меньше урона, чем обычная камнепадная ловушка, но и броня защищает от него хуже. Рядом с баррикадами камни не падают: опоры удерживают потолок.\n\n_Ловушка не отличает своих от чужих, поэтому опасна для гноллов не меньше, чем для вас._

levels.traps.grimtrap.name=гибельная ловушка
levels.traps.grimtrap.ondeath=Вы убиты зарядом гибельной ловушки...
levels.traps.grimtrap.desc=В ловушке заключена чрезвычайно мощная разрушительная магия, способная мгновенно убить почти любого героя. Выжить смогут лишь обладатели огромного запаса здоровья. При срабатывании ловушка посылает смертоносный заряд в ближайшую цель.\n\nК счастью, её спусковой механизм не скрыт.

levels.traps.grippingtrap.name=калечащая ловушка
levels.traps.grippingtrap.desc=Ловушка крепко хватает за ноги того, кто на неё наступит, нанося урон и замедляя передвижение.\n\nПростой механизм позволяет ей срабатывать много раз, не ломаясь.

levels.traps.guardiantrap.name=ловушка стражей
levels.traps.guardiantrap.alarm=Громкий звук от ловушки разносится по всему подземелью!
levels.traps.guardiantrap.desc=Ловушка соединена со странным волшебным механизмом, который призовёт стражей и даст сигнал тревоги всем врагам на уровне.
levels.traps.guardiantrap$guardian.name=Призванный страж
levels.traps.guardiantrap$guardian.desc=Похоже, этот синеватый призрак - отражение одного из каменных стражей подземелья.
levels.traps.guardiantrap$guardian.desc_weapon=Сама статуя почти бесплотна, однако _%s_ у неё в руках выглядит вполне реально.
levels.traps.guardiantrap$guardian.discover_hint=Вы можете найти этого противника с помощью определённой ловушки.

levels.traps.oozetrap.name=ловушка с едкой слизью
levels.traps.oozetrap.desc=При активации ловушка выплеснет вокруг едкую слизь, которая будет жечь свою жертву до тех пор, пока её не смоют водой.

levels.traps.pitfalltrap.name=медвежья яма
levels.traps.pitfalltrap.triggered_hero=Почва вокруг вас начинает обрушиваться!
levels.traps.pitfalltrap.triggered=Почва вокруг сработавшей ловушки начинает обрушиваться!
levels.traps.pitfalltrap.no_pit=для установки ловушки с ямой здесь слишком прочный пол.
levels.traps.pitfalltrap.desc=Ловушка связана с большим люком в полу. Вскоре после срабатывания земля под ногами всех, кто находится рядом, провалится, и они упадут вниз! Однако на участках с особенно прочным полом ловушка не действует.

levels.traps.poisondarttrap.name=отравляющая ловушка
levels.traps.poisondarttrap.ondeath=Отравляющая ловушка убила вас...
levels.traps.poisondarttrap.desc=Поблизости спрятан небольшой метатель дротиков. При срабатывании ловушки он выпускает отравленный дротик в ближайшую цель.\n\nК счастью, спусковой механизм ловушки не скрыт.

levels.traps.rockfalltrap.name=ловушка с камнями
levels.traps.rockfalltrap.ondeath=Вы погребёны под каменным обвалом...
levels.traps.rockfalltrap.desc=Ловушка связана с неустойчивыми камнями на потолке. Стоит ей сработать — и камни обрушатся на всю комнату! Если ловушка находится вне комнаты, обвал затронет только область вокруг неё.\n\nК счастью, спусковой механизм не скрыт.

levels.traps.shockingtrap.name=электрическая ловушка
levels.traps.shockingtrap.desc=Механизм с большим количеством энергии, заключённой внутри. При активации, ловушка создаст электрическое поле рядом с собой.

levels.traps.stormtrap.name=грозовая ловушка
levels.traps.stormtrap.desc=В механизме ловушки запасено огромное количество энергии. При срабатывании она высвобождает её, вызывая мощную электрическую бурю.

levels.traps.summoningtrap.name=призывающая ловушка
levels.traps.summoningtrap.desc=При активации, эта ловушка призовёт одно или несколько существ, соответствующих текущему этажу.

levels.traps.teleportationtrap.name=телепортирующая ловушка
levels.traps.teleportationtrap.desc=Когда эта ловушка срабатывает, все вокруг нее телепортируется в случайные места на этом этаже.

levels.traps.tengudarttrap.desc=Тенгу явно подготовился к бою. Эта ловушка включает скрытый метатель, который выпускает отравленный дротик в ближайшую цель, кроме самого Тенгу.\n\nЛовушка сделана настолько искусно, что обнаружить спусковой механизм без магии невозможно. Однако в момент установки её ненадолго видно.

levels.traps.toxictrap.name=газовая ловушка
levels.traps.toxictrap.desc=При активации ловушка выпустит облако отравляющего газа.

levels.traps.trap.discover_hint=Вы можете случайно найти эту ловушку в подземелье. У каждого региона есть разные ловушки, которые могут встретиться.
levels.traps.trap.rankings_desc=Убит (%s)

levels.traps.corrosiontrap.name=ловушка с разъедающим газом
levels.traps.corrosiontrap.desc=При активации, эта ловушка выпустит облако разъедающего газа.

levels.traps.warpingtrap.name=перемещающая ловушка
levels.traps.warpingtrap.desc=Эта ловушка похожа на ловушку телепортации, но при этом герой забывает план этажа!

levels.traps.weakeningtrap.name=ослабляющая ловушка
levels.traps.weakeningtrap.desc=Тёмная магия этой ловушки вытягивает силы из каждого, кто к ней прикоснётся. Впрочем, особенно сильные враги могут сопротивляться её действию.

levels.traps.worndarttrap.name=ловушка с дротиком
levels.traps.worndarttrap.ondeath=Вас убило дротиком из ловушки...
levels.traps.worndarttrap.desc=Неподалёку спрятан небольшой механизм, выпускающий дротики. При срабатывании ловушки он выстрелит в ближайшую цель.\n\nМеханизм сильно изношен, поэтому дротик причинит мало вреда. Да и сама ловушка даже не замаскирована.



###levels
levels.cavesbosslevel.wires_name=Обнаженные провода
levels.cavesbosslevel.wires_desc=Здесь земля разрыта, и наружу выступают толстые провода. Вероятно, они соединяют между собой электрические машины.\n\nПохоже, по проводам идёт ток. Если DM-300 вступит на этот участок, она может воспользоваться ими, чтобы восстановить энергию.
levels.cavesbosslevel.energy_desc=Почва на этом месте искрится от электрического тока, наступать сюда вредно. _Искры, похоже, устремляются в определенном направлении..._ возможно, они приведут к источнику энергии?
levels.cavesbosslevel.gate_name=Металлические ворота
levels.cavesbosslevel.gate_desc=Массивные металлические ворота преграждают путь в город дворфов. Коробка в их центре громко гудит — вероятно, она соединена с проводкой и машинами поблизости. Возможно, после уничтожения DM-300 ворота откроются?
levels.cavesbosslevel.gate_desc_broken=Ворота, похоже, были каким-то образом подключены к DM-300, ведь они взорвались одновременно с уничтожением машины. Теперь от них остались лишь обломки.
levels.cavesbosslevel.water_desc=Учитывая все электричество вокруг, вода наверняка будет небезопасной...

levels.citybosslevel.throne_name=Престол
levels.citybosslevel.throne_desc=Этот величественный трон — символ власти дворфийской империи, захваченной безумным некромантом.\n\nВ трон, похоже, встроены магические или механические устройства. Возможно, сидя на нём, Король дворфов становится сильнее.
levels.citybosslevel.summoning_name=Призывающий пьедестал
levels.citybosslevel.summoning_desc=В центре этого пьедестала зияет большое отверстие, откуда почти ощутимо исходит тёмная энергия.\n\nКороль дворфов использует такие пьедесталы как проводники некромантии, призывая на них прислужников. Перед появлением существа пьедестал несколько ходов накапливает энергию. По тому, как она сгущается, можно предугадать, кого призовут.

levels.caveslevel.grass_name=Светящийся мох
levels.caveslevel.high_grass_name=Светящиеся грибы
levels.caveslevel.water_name=Ледяная вода
levels.caveslevel.entrance_desc=Эта лестница ведёт на этаж выше.
levels.caveslevel.exit_desc=Эта лестница ведёт на этаж ниже.
levels.caveslevel.high_grass_desc=Огромные грибы загораживают обзор.
levels.caveslevel.wall_deco_desc=В камне этой стены блестят вкрапления какой-то руды. Может, это золото?
levels.caveslevel.bookshelf_desc=Ну откуда в пещере может быть книжная полка?
levels.caveslevel.region_deco_name=Металлическая структура
levels.caveslevel.region_deco_desc=Большое металлическое сооружение, вероятно, возведённое дворфами, когда они ещё добывали здесь руду. По его верху будто бы проходят давно заброшенные рельсы для вагонеток.

levels.citylevel.water_name=Вода подозрительного цвета
levels.citylevel.high_grass_name=Высокие цветущие растения
levels.citylevel.entrance_desc=Эта лестница ведёт на этаж выше.
levels.citylevel.exit_desc=Эта лестница ведёт на этаж ниже.
levels.citylevel.deco_desc=Здесь не хватает нескольких плиток.
levels.citylevel.statue_desc=Статуя изображает дворфа в богатырской стойке.
levels.citylevel.bookshelf_desc=Полка покрыта книгами на разные темы.
levels.citylevel.region_deco_name=Пылающий пьедестал
levels.citylevel.region_deco_desc=Возвышающийся пьедестал с ярким зелёным пламенем наверху. Огонь настолько плотный, что может показаться твёрдым.

levels.hallslevel.water_name=Холодная лава
