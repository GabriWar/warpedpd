levels.overworld.mountainsites.rumour_hermit="There's another fool like me living up here, %2$d paces %1$s, %3$s. Doesn't talk much either."
levels.overworld.mountainsites.rumour_eyrie="Eagles nest on a crag %2$d paces %1$s of here, %3$s. Leave their eggs alone if you value your eyes."
levels.overworld.mountainsites.rumour_cairn="Climb %2$d paces %1$s, %3$s, and you'll find a cairn on the summit. Leave a stone. The view's worth the climb."
levels.overworld.mountainsites.rumour_springs="Hot springs, %2$d paces %1$s, %3$s. Water warm as a bath with snow all round. Saved my life one winter."
levels.overworld.mountainsites.rumour_climber="A climber went up %2$d paces %1$s of here, %3$s, and never came down. Whatever he carried is still with him."
levels.overworld.mountainsites.rumour_tower="There's an old watchtower on the ridge %2$d paces %1$s, %3$s. Something's made a home in it, some weeks."
levels.overworld.mountainsites.rumour_pass="There's a shelter by %4$s, %2$d paces %1$s, %3$s. Somebody keeps the fire going. Never seen who."
levels.overworld.mountainsites.rumour_cave="Under the mountain, %2$d paces %1$s, there's %3$s. Folk say so, anyway."
levels.overworld.mountainsites.rumour_vein="The rock %2$d paces %1$s of here is rich with %3$s. Bring a pick."
levels.overworld.mountainsites.rumour_none="Nothing new up here. The wind, the snow, the eagles. Same as ever."
levels.overworld.hazardwatch.firedamp_smell=The air is thick and smells of rotten eggs.
levels.overworld.hazardwatch.firedamp_flame=Your flame burns tall and blue in the foul air. Get it away from here, or it will catch!
levels.overworld.hazardwatch.firedamp_dizzy=The foul air makes your head swim.
levels.overworld.hazardwatch.firedamp_hiss=Flames lick at the foul air - it is about to go up!
levels.overworld.hazardwatch.firedamp_ignite=The firedamp ignites with a roar!
levels.overworld.hazardwatch.ice_crack=The ice cracks under your feet!
levels.overworld.hazardwatch.ice_groan=The ice groans and sags beneath you!
levels.overworld.hazardwatch.ice_break=The ice gives way, and you plunge into the freezing water!
levels.overworld.hazardwatch.cracked_name=Cracked ice
levels.overworld.hazardwatch.cracked_desc=The ice here is cracked through. It will not bear anyone's weight for long.
levels.overworld.hazardwatch.ceiling_groans=The ceiling groans.
levels.overworld.hazardwatch.gust_warn=The wind rises, howling over the ridge!
levels.overworld.hazardwatch.gust_hit=A gust tears at you!
levels.overworld.hazardwatch.gust_brace=You stagger, bracing yourself against the gust.
levels.overworld.firedamp.name=firedamp
levels.overworld.firedamp.ondeath=You were caught in a firedamp blast...
levels.overworld.firedamp.rankings_desc=Killed in a firedamp blast
levels.overworld.worldevents.star_falls=A streak of light tears across the sky and comes down to the %s.
levels.overworld.worldevents.star_falls_near=A blazing star screams down out of the sky and strikes the ground close by!
levels.overworld.worldevents.star_falls_clouded=Something bright plunges through the clouds to the %s, and the ground shudders.
levels.overworld.worldevents.star_glow=A faint glow lingers on the land to the %s, where a star came down.
levels.overworld.worldevents.star_glow_near=A fallen star still smoulders close by.
levels.overworld.worldevents.star_cold=A fresh crater scars the land to the %s, where a star came down.
levels.overworld.worldevents.star_cold_near=A fallen star lies cold in its crater close by.
levels.overworld.worldevents.star_bonus=Something else glints in the crater where the fragment lay.
levels.overworld.worldevents.market_opens=Bunting and music on the wind: a travelling market has come to %1$s, to the %2$s.
levels.overworld.worldevents.market_here=Bunting and music: a travelling market has come to %s!
