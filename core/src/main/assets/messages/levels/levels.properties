levels.overworld.raidevent.smoke=Black smoke climbs over %1$s, to the %2$s - bandits are raiding the village!
levels.overworld.raidevent.smoke_here=Black smoke climbs over %s - bandits are raiding the village!
levels.overworld.raidevent.live=Bandits are loose in the streets of %s!
levels.overworld.raidevent.thanks=You drove them out! %s won't forget this - take it, with our thanks.
levels.overworld.raidevent.cheer=Huzzah!
levels.overworld.raidevent.reward=The folk of %s reward you, and their shops will give you a better price for three days.
levels.overworld.raidevent.reward_well=Word reaches you that %s is safe: a purse waits for you by its well, and its shops will give you a better price for three days.
levels.overworld.raidevent.withdraw=The raiders make off with whatever they could carry.
levels.overworld.raidevent.shut_raid=Not now - bandits! Get inside!
levels.overworld.raidevent.shut_recovering=We're shut while we mend what the bandits broke. Come back in a day or two.
levels.overworld.huntevent.start_dusk=A howl splits the dusk - a wolf pack is running down a deer!
levels.overworld.huntevent.start_night=A howl splits the dark - a wolf pack is running down a deer!
levels.overworld.huntevent.start_far=A distant howl to the %s - a wolf pack is on the hunt.
levels.overworld.huntevent.heard_near=Wolves give tongue close by - a pack is out hunting tonight.
levels.overworld.huntevent.kill=The wolves bring the deer down and settle in to feed.
levels.overworld.huntevent.escape=With the pack broken, the deer bound away to safety.

