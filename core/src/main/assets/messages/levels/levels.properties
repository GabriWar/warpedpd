levels.overworld.cavesites.found_mine=Rails run off into the dark, and old timbers still hold up the roof: an abandoned mine.
levels.overworld.cavesites.found_grotto=A soft light glows ahead, and the air is thick with spores: a mushroom grotto.
levels.overworld.cavesites.found_crystal=The walls glitter in your light, grown thick with crystal: a crystal cavern.
levels.overworld.cavesites.found_camp=The air smells of old smoke: a miners' camp.
levels.overworld.cavesites.found_shrine=Still water lies black under the rock, and a small idol watches over it: a lake shrine. Something pale moves in the deep water.
levels.overworld.cavesites.found_rift=Heat rolls out of a red-lit crack in the floor: a burning rift.
levels.overworld.cavesites.found_tomb=Dressed stone stands in the cave, sealed by an iron door: a dwarven tomb.
levels.overworld.cavesites.rumour_mine=an old mine
levels.overworld.cavesites.rumour_grotto=a mushroom grotto, glowing in the dark
levels.overworld.cavesites.rumour_crystal=a cavern grown thick with crystal
levels.overworld.cavesites.rumour_camp=another miners' camp
levels.overworld.cavesites.rumour_shrine=a still lake with a shrine on its shore
levels.overworld.cavesites.rumour_rift=a burning rift, with an old dwarven forge beside it
levels.overworld.cavesites.rumour_tomb=a sealed tomb of the old dwarves
