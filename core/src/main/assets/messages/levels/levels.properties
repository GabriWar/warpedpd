levels.level.unlocked_exit_name=Unlocked depth exit
levels.level.well_name=Well
levels.level.empty_well_name=Empty well
levels.level.statue_name=Statue
levels.level.inactive_trap_name=Triggered trap
levels.level.bookshelf_name=Bookshelf
levels.level.bookshelf_desc=Shelves of books, crammed in tight. Searching one turns the pages out; fire would take the lot.
levels.level.empty_bookshelf_name=Empty Bookshelf
levels.level.empty_bookshelf_desc=Bare boards. Whatever knowledge stood here has been taken, though the shelf would hold more.
levels.level.alchemy_name=Alchemy pot
levels.level.default_name=???
levels.level.chasm_desc=You can't see the bottom.
levels.level.water_desc=In case of burning step into the water to extinguish the fire.
levels.level.entrance_desc=Stairs lead up to the upper depth.
levels.level.exit_desc=Stairs lead down to the lower depth.
levels.level.embers_desc=Embers cover the floor.
levels.level.frozen_water_name=Frozen water
levels.level.frozen_water_desc=The water has frozen over into a sheet of ice. You can walk across it, but it's slippery and cold.
levels.level.high_grass_desc=Dense vegetation blocks the view.
levels.level.locked_door_desc=This door is locked, you need a matching key to unlock it.
levels.level.crystal_door_desc=This locked door is made of magical crystal. You can see through, but you'll need a crystal key to open it.
levels.level.locked_exit_desc=Heavy bars block the stairs leading down.
levels.level.barricade_desc=The wooden barricade is firmly set but has dried over the years. Might it burn?
levels.level.inactive_trap_desc=The trap has been triggered before and it's not dangerous anymore.
levels.level.statue_desc=Someone wanted to adorn this place, but failed, obviously.
levels.level.alchemy_desc=This pot is filled with magical water. Items can be mixed into the pot to create something new!
levels.level.empty_well_desc=The well has run dry.

levels.level$feeling.chasm_title=chasm floor
levels.level$feeling.water_title=water floor
levels.level$feeling.grass_title=grass floor
levels.level$feeling.dark_title=dark floor
levels.level$feeling.large_title=large floor
levels.level$feeling.traps_title=traps floor
levels.level$feeling.secrets_title=secrets floor
levels.level$feeling.chasm_desc=Your steps echo across the dungeon.
levels.level$feeling.water_desc=You hear water splashing around you.
levels.level$feeling.grass_desc=The smell of vegetation is thick in the air.
levels.level$feeling.dark_desc=You can hear enemies moving in the darkness.
levels.level$feeling.large_desc=This dungeon floor seems unusually large.
levels.level$feeling.traps_desc=The ground seems especially treacherous here.
levels.level$feeling.secrets_desc=The atmosphere hints that this floor hides many secrets.

levels.mininglevel.wall_desc=A smooth rock wall that's a little softer than usual. You can mine through it with your pickaxe, but it'll take some effort and increase your hunger a bit.
levels.mininglevel.gold_extra_desc=You can probably mine it out with your pickaxe.
levels.mininglevel.crystal_name=Crystal spike
levels.mininglevel.boulder_name=Boulder
levels.mininglevel.crystal_desc=There is a large and colorful crystal outcropping here. These crystals are fragile and can easily be broken with a pickaxe, or will break if something is mined next to it.
levels.mininglevel.boulder_desc=There is a large boulder blocking the way. It should be fairly easy to break with a pickaxe.
levels.mininglevel.barricade_desc=The wooden barricade is firmly set and acts as a support for the ceiling.\n\nThis was probably constructed by the gnolls to give some protection against falling rocks. _Any adjacent cells will be protected from rockfall traps and attacks._\n\nIt looks like it would burn just as well as any other barricade.

levels.prisonlevel.water_name=Dark cold water
levels.prisonlevel.empty_deco_desc=There are old blood stains on the floor.
levels.prisonlevel.bookshelf_desc=This is probably a vestige of a prison library. Might it burn?
levels.prisonlevel.region_deco_name=Prison cage
levels.prisonlevel.region_deco_desc=A metal cage just large enough to hold a person. It seems to be locked to the ground in some way, you can't move it.
levels.prisonlevel.region_deco_alt_name=Hanging cage
levels.prisonlevel.region_deco_alt_desc=A metal cage just large enough to hold a person. It's hanging over a deep chasm, suspended by a chain.

levels.sewerlevel.water_name=Murky water
levels.sewerlevel.amulet_out=You carry the Amulet of Yendor out into daylight. Far off across the world, sealed barrows stir: they will open to it now.
levels.sewerlevel.empty_deco_desc=Wet yellowish moss covers the floor.
levels.sewerlevel.bookshelf_desc=The bookshelf is packed with cheap useless books. Might it burn?
levels.sewerlevel.region_deco_name=Storage barrel
levels.sewerlevel.region_deco_desc=A stout barrel that's almost as big as you are. It must be full of something or another, it's too heavy to move.

levels.vaultlevel$vaultflametrap.name=vault flame vent
levels.vaultlevel$vaultflametrap.desc=This vent seems to be sending up bursts of green flame at regular intervals. You can see the flames starting to build just before it fires. The flames can usually be avoided, but _anything that lets you resist fire or area-bound effects_ is also effective.
levels.overworld.overworldlevel.biome=_Biome:_ %s
levels.overworld.overworldlevel.crystal=Crystal seam
levels.overworld.overworldlevel.loose_rock=Loose rock
levels.overworld.overworldlevel.loose_rock_desc=A heap of broken rock. A pickaxe would clear it.
levels.overworld.overworldlevel.shrub=Shrub
levels.overworld.overworldlevel.snow=Snow
levels.overworld.overworldlevel.snow_desc=Snow, crusted on top and deep underneath. It crunches with every step.
levels.overworld.overworldlevel.road=Dirt road
levels.overworld.overworldlevel.road_desc=A rutted road, packed hard by cartwheels and boots.
levels.overworld.overworldlevel.tunnel=Tunnel floor
levels.overworld.overworldlevel.tunnel_desc=A worn passage through the mountain, out of the wind.
levels.overworld.overworldlevel.biome_ocean=Ocean
levels.overworld.overworldlevel.biome_river=River
levels.overworld.overworldlevel.biome_beach=Beach
levels.overworld.overworldlevel.biome_plains=Plains
levels.overworld.overworldlevel.biome_meadow=Meadow
levels.overworld.overworldlevel.biome_forest=Forest
levels.overworld.overworldlevel.biome_swamp=Swamp
levels.overworld.overworldlevel.biome_desert=Desert
levels.overworld.overworldlevel.biome_tundra=Tundra
levels.overworld.overworldlevel.biome_snowfield=Snowfield
levels.overworld.overworldlevel.biome_foothills=Foothills
levels.overworld.overworldlevel.biome_mountain=Mountain

levels.overworld.overworldlevel.waypoint_reached=You arrive at your waypoint.
levels.overworld.overworldlevel.ruin_title=Ruined Passage
levels.overworld.overworldlevel.ruin_desc=A crumbling stairway descends into darkness beneath the ruin. It smells of the dungeon.
levels.overworld.overworldlevel.ruin_yes=Descend into the dungeon
levels.overworld.overworldlevel.ruin_no=Not now
levels.overworld.overworldlevel.delve_title=%s
levels.overworld.overworldlevel.delve_desc=Stairs plunge into a sealed barrow, level %1$d. Its %2$d floors are cut like the dungeon's own and grow ever more dangerous, but no potion of strength or scroll of upgrade lies in them. A guardian holds the bottom.
levels.overworld.overworldlevel.delve_yes=Descend
levels.overworld.overworldlevel.delve_no=Not now
levels.overworld.overworldlevel.delve_sealed=The stairs end at a seal of black stone. It will not move for you without the Amulet of Yendor.
levels.overworld.overworldlevel.delve_cleared_desc=Your flag flies over its stairs: its guardian is dead and its hoard taken. Its floors are as you left them.
levels.delves.cleared=The guardian of %s falls. Its hoard is yours, and your flag will fly over its stairs.
levels.overworld.overworldlevel.waypoint_blocked=The way is blocked - the march pauses here. Tap the map tag to try again.

###frozen region (Unleashed PD port)
levels.frozenlevel.water_name=Icy water
levels.frozenlevel.water_desc=Meltwater, barely above freezing. Wading through it will numb you to the bone.
levels.frozenlevel.grass_name=Frozen weeds
levels.frozenlevel.high_grass_name=Frost-rimed thicket
levels.frozenlevel.empty_deco_desc=Frozen weeds crunch underfoot.
levels.frozenlevel.wall_deco_desc=A seam of ice runs through the rock here, slowly weeping meltwater.

###spider nest branch (Remixed PD reimplementation)
levels.spidernestlevel.grass_name=Webbing
levels.spidernestlevel.high_grass_name=Dense webbing
levels.spidernestlevel.high_grass_desc=Thick sheets of silk, strung between anything that will hold them. Pushing through is slow, and something will feel you doing it.
levels.spidernestlevel.empty_deco_desc=Silk-wrapped husks of whatever came down here before you.

###optional branch confirmations
levels.hallslevel.branch_title=A breath of cold
levels.hallslevel.branch_prompt=Frost rimes the stone around this opening, and the air pouring out of it is bitterly cold. Whatever lies below is not part of the halls, and nothing down there will be weaker than what walks up here.
levels.hallslevel.branch_yes=Descend into the ice
levels.hallslevel.branch_no=Stay in the halls
levels.caveslevel.temple_title=A sealed doorway
levels.caveslevel.temple_prompt=Worn flagstones lead down to a doorway that predates the mines around it. The chambers beyond were built to test whoever entered them, and they have had a very long time to grow patient.
levels.caveslevel.temple_yes=Enter the temple
levels.caveslevel.temple_no=Leave it sealed
levels.overworld.overworldlevel.sign_entry=%1$s - %2$d paces
levels.overworld.overworldlevel.sign_town=Town - %d paces
levels.overworld.overworldlevel.thaw=The ice gives way under you - you scramble to the shore.
levels.overworld.overworldlevel.place_above=Heights +%d
levels.overworld.overworldlevel.place_below=Caves -%d
levels.overworld.overworldlevel.steps_up=Steps up
levels.overworld.overworldlevel.steps_down=Steps down
levels.overworld.overworldlevel.way_up=Way up
levels.overworld.overworldlevel.way_down=Way down
levels.overworld.overworldlevel.cave_mouth=Cave mouth
levels.overworld.overworldlevel.drop=Drop
levels.overworld.overworldlevel.pit=Pit
levels.overworld.overworldlevel.wall_desc=A rocky mountainside. A pickaxe would get through it.
levels.overworld.overworldlevel.house_wall=House wall
levels.overworld.overworldlevel.house_wall_desc=The stone wall of a village house. Somebody lives behind it.
levels.overworld.overworldlevel.hut_wall=Hut wall
levels.overworld.overworldlevel.hut_wall_desc=Stones piled and packed with mud: the wall of a hut. It keeps out the wind, mostly.
levels.overworld.overworldlevel.peak_wall_desc=The bare rock of the peak, climbing on above this height. A pickaxe would get through it.
levels.overworld.overworldlevel.cave_wall_desc=Solid rock. A pickaxe would get through it.
levels.overworld.overworldlevel.steps_up_desc=Steps carved into the cliff face. They climb to the height above.
levels.overworld.overworldlevel.steps_down_desc=Steps carved into the cliff. They lead down to the height below.
levels.overworld.overworldlevel.way_up_desc=A way up through the rock, to the level above.
levels.overworld.overworldlevel.way_down_desc=A shaft down through the rock, to the level below.
levels.overworld.overworldlevel.cave_mouth_desc=A dark opening in the ground. Cold air rises from the caves below.
levels.overworld.overworldlevel.drop_desc=The mountainside falls away here. The ground below is a long way down.
levels.overworld.overworldlevel.pit_desc=A hole in the cave floor, opening onto the caverns below.
levels.overworld.overworldlevel.crystal_desc=A seam of crystal in the rock. Mine a crystal and it may give up a gem - but the blow shatters every crystal touching it, gems and all, so choose which one you take.
levels.overworld.overworldlevel.vein=%s vein
levels.overworld.overworldlevel.vein_desc=%s glints in the face of the rock here. A pickaxe would prise it out, a lump to a stroke - and a vein often runs on into the rock behind.
levels.overworld.overworldlevel.tower_wall=Tower wall
levels.overworld.overworldlevel.tower_wall_desc=Cut stone, fallen in places: the ring of an old watchtower. A pickaxe would get through it.
levels.overworld.mountainsites.found_hermit=A hut of piled stone clings to the slope, smoke curling from its chimney. Somebody lives up here.
levels.overworld.mountainsites.found_eyrie=A great untidy nest of sticks sits on the lip of the cliff. Something large circles over it.
levels.overworld.mountainsites.found_cairn=A cairn of stacked stones marks the top of the peak.
levels.overworld.mountainsites.found_springs=Steam rises from pools in the snow - hot springs, with green ground all around them.
levels.overworld.mountainsites.found_climber=Something lies half buried in the snow: a climber who never came down.
levels.overworld.mountainsites.found_tower=The broken ring of an old watchtower stands on the ridge.
levels.overworld.mountainsites.found_pass=A stone shelter stands near the mouth of the pass, firelight in its doorway.
levels.overworld.mountainsites.place_site=%1$s, heights +%2$d
levels.overworld.mountainsites.summit=You add your stone to the cairn. You stand at the summit, %s feet above the sea, and the land lies open below you.
levels.overworld.mountainsites.summit_mood=The view lifts your spirits.
levels.overworld.mountainsites.summit_again=Your stone is already on the cairn.
levels.overworld.mountainsites.tower_view=From the top of the old tower you can see for miles.
levels.overworld.mountainsites.journal_title=A climber's journal
levels.overworld.mountainsites.journal_0=_Day six._ The wind turned in the night. The others went back down; I said I would follow in the morning. The summit is so close I can see the cairn.
levels.overworld.mountainsites.journal_1=_Day nine._ Ate the last of the bread. My hands will not close round the axe any more. If anyone finds this: there is a hot spring on the other face. I never reached it.
levels.overworld.mountainsites.journal_2=_Day four._ An old man in a stone hut gave me soup and told me to turn back. I should have listened to him.
levels.overworld.mountainsites.journal_3=_Day eleven._ The eagles watch me from their crag. They know. Tell my sister I made it higher than father ever did.
levels.overworld.mountainsites.pass_sign=_%s_\n\nA shelter for those who cross the mountains. The fire is never let go out: rest by it, and go on warm.
levels.overworld.mountainsites.map_hermit=Hermit
levels.overworld.mountainsites.map_eyrie=Eyrie
levels.overworld.mountainsites.map_cairn=Summit
levels.overworld.mountainsites.map_springs=Hot springs
levels.overworld.mountainsites.map_climber=Lost climber
levels.overworld.mountainsites.map_tower=Watchtower
levels.overworld.mountainsites.nest=Eagle's nest
levels.overworld.mountainsites.nest_desc=A mass of sticks, moss and down wedged on the lip of the cliff. The eagles will not take kindly to visitors.
levels.overworld.mountainsites.hearth=Hearth
levels.overworld.mountainsites.hearth_desc=A ring of stones round a fire that is never let go out. Sitting by it warms you through.
levels.overworld.mountainsites.spring=Hot spring
levels.overworld.mountainsites.spring_desc=The water is hot to the touch and steams in the cold air. A soak would warm you through.
levels.overworld.mountainsites.tower_top=Top of the tower
levels.overworld.mountainsites.tower_top_desc=What is left of the tower's floor. From here the lookouts once watched the passes.
