levels.overworld.cavesites.prop_rails=Mine rails
levels.overworld.cavesites.prop_rails_desc=Iron rails on rotten sleepers, running off into the gallery. The carts that rode them are long gone.
levels.overworld.cavesites.prop_cart=Mine cart
levels.overworld.cavesites.prop_cart_desc=A rusted mine cart, left where it ran off its rails. The last of its load still heaps over the rim and lies spilled on the floor.
levels.overworld.cavesites.prop_timber=Timber prop
levels.overworld.cavesites.prop_timber_desc=A post and crossbeam holding up the gallery roof. The wood is black with age, but it still holds.
levels.overworld.cavesites.prop_lantern=Lantern
levels.overworld.cavesites.prop_lantern_desc=An oil lantern hangs from a post, burning low. Someone still keeps it lit.
levels.overworld.cavesites.prop_crates=Crates
levels.overworld.cavesites.prop_crates_desc=Supply crates, nailed shut and stamped with a miners' mark.
levels.overworld.cavesites.prop_barrel=Barrel
levels.overworld.cavesites.prop_barrel_desc=A barrel of lamp oil. It smells strongly.
levels.overworld.cavesites.prop_sacks=Sacks
levels.overworld.cavesites.prop_sacks_desc=Sacks of meal and salt, stacked off the damp floor.
levels.overworld.cavesites.prop_tools=Tool rack
levels.overworld.cavesites.prop_tools_desc=Picks, shovels and wedges hang on a rack, worn smooth by many hands.
levels.overworld.cavesites.prop_furnace=Dwarven furnace
levels.overworld.cavesites.prop_furnace_desc=A furnace of dark brick built into the rock. The rift's heat keeps its belly glowing.
levels.overworld.cavesites.prop_bedroll=Bedroll
levels.overworld.cavesites.prop_bedroll_desc=A bedroll laid out by the fire. Its owner is not far.
levels.overworld.cavesites.prop_log=Log seat
levels.overworld.cavesites.prop_log_desc=A log rolled up by the fire to sit on.
levels.overworld.cavesites.prop_campfire=Campfire
levels.overworld.cavesites.prop_campfire_desc=A fire of coal and timber offcuts, banked to burn day and night.
levels.overworld.cavesites.prop_mushroom=Giant mushroom
levels.overworld.cavesites.prop_mushroom_desc=A mushroom taller than a man. Its cap gives off a cold, soft light.
levels.overworld.cavesites.prop_sarcophagus=Sarcophagus
levels.overworld.cavesites.prop_sarcophagus_desc=A stone coffin, its lid carved with a dwarven face and a warning you cannot read.
levels.overworld.cavesites.prop_rift=Lava rift
levels.overworld.cavesites.prop_rift_desc=A crack in the floor, red with molten rock. The air above it shimmers, and now and then it flares.
levels.overworld.cavesites.prop_shards=Crystal shards
levels.overworld.cavesites.prop_shards_desc=Splinters of crystal fallen from the walls lie thick on the floor here, and each gives off a faint, cold light of its own.
levels.overworld.cavesites.tomb_wall=Tomb wall
levels.overworld.cavesites.tomb_wall_desc=Dressed stone, fitted so tightly that a knife blade would not slip between the blocks. No pickaxe will get through it, and no bomb either.
levels.overworld.cavesites.tomb_unbreakable=Your pickaxe skids off the dressed stone. Whoever built this tomb meant it to stay shut.
levels.overworld.cavesites.rift_flare=The rift's glow brightens beneath you - move!
levels.overworld.cavesites.rift_death=The rift flares beneath you, and the molten rock takes you.
levels.overworld.cavesites.rankings_desc=Burned by a lava rift

levels.traps.changesheeptrap.name=shepherd's plate
levels.traps.changesheeptrap.desc=A pressure plate wired to the puzzle. A sheep pushed onto it is changed into a different kind of sheep; it resets after every use.

levels.traps.heapgentrap.name=offering plate
levels.traps.heapgentrap.desc=A pressure plate wired to the puzzle. Pushing a sheep onto it counts as an offering and is remembered by the vault.

levels.traps.sokobanportaltrap.name=puzzle portal
levels.traps.sokobanportaltrap.desc=A ring of teal light set into the floor. Once the puzzle has opened it, stepping in carries you across the vault.

levels.traps.activateportaltrap.name=portal plate
levels.traps.activateportaltrap.desc=A pressure plate wired to the puzzle. A sheep pushed onto it lights the portal it is paired with.
tiles.custom.carpet.name=Carpet
tiles.delveflag.name=Your flag
tiles.delveflag.desc=You planted it here when this barrow's guardian fell. The barrow is cleared; its floors lie as you left them.
tiles.custom.carpet.desc=Thick carpet covers the floor. It must be treated in some way, it isn't flammable.

levels.spidernestlevel.region_deco_name=Silk-wrapped rock pillar
levels.spidernestlevel.region_deco_desc=A jagged stone pillar bound in layers of old spider silk. It blocks movement, but you can see around it. The webbing here is fixed decoration, not a trap.

levels.frozenlevel.region_deco_name=Ice cluster
levels.frozenlevel.region_deco_desc=A solid cluster of frost-covered ice and stone blocks the way.
levels.frozenlevel.statue_name=Frozen stone pillar
levels.frozenlevel.statue_desc=An old stone pillar coated with frost, standing in the icy cavern.
