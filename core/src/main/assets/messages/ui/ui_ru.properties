ui.updatenotification$wndupdate.desc=Warped Pixel Dungeon регулярно получает обновления: разработчик перерабатывает существующие механики и добавляет совершенно новые возможности!\n\nВ обновлениях также улучшается игровой баланс, чтобы отдельные предметы, герои и противники не становились слишком сильными или слишком слабыми.\n\nКроме того, обновления исправляют ошибки и повышают стабильность игры.
ui.updatenotification$wndupdate.button=На страницу обновлений

