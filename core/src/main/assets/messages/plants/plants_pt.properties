plants.blandfruitbush.name=frutinsossa
plants.blandfruitbush.desc=Prima distante da putrifruta, a fruta em forma de pera do pé de frutinsossa tem gosto de pó endurecido. A fruta é dura e insubstancial, mas não é venenosa. Talvez possa ser cozida.
plants.blandfruitbush.discover_hint=Você pode encontrar esta planta aleatoriamente na masmorra.
plants.blandfruitbush$seed.name=Semente de frutinsossa

plants.blindweed.name=ceguerva
plants.blindweed.desc=Ao ser tocada, a ceguerva morre e emite um forte clarão de luz. Este clarão é forte o suficiente para desorientar por vários segundos.
plants.blindweed.warden_desc=_A Guardiã_ canalizará a energia de uma ceguerva em uma capa temporária de invisibilidade em vez de ficar desorientada.
plants.blindweed$seed.name=Semente de ceguerva

plants.mageroyal.name=magi-real
plants.mageroyal.refreshed=Você se sente revigorado.
plants.mageroyal.desc=As flores espinhosas da magi-real contêm um produto químico que é conhecido por suas propriedades como um forte agente neutralizante. Qualquer coisa que pisar nesta planta será limpa de muitos efeitos negativos.
plants.mageroyal.warden_desc=Além do efeito neutralizante, _a Guardiã_ ficará temporariamente imune a todos os efeitos de área ao pisar em uma magi-real.
plants.mageroyal$seed.name=semente de magi-real

plants.earthroot.name=terraíz
plants.earthroot.desc=Quando uma criatura toca uma terraíz, suas raízes criam um tipo de armadura natural imóvel ao redor dela.
plants.earthroot.warden_desc=As raízes de uma terraíz vão se mover com _a Guardiã_, provendo a ela uma armadura arbórea móvel.
plants.earthroot$seed.name=Semente de terraíz
plants.earthroot$armor.name=armadura herbácea
plants.earthroot$armor.desc=Uma espécie de armadura natural imóvel, feita de casca de árvore e raízes.\n\nEsta armadura herbácea bloqueará %d de dano de qualquer dano físico recebido, até que eventualmente sua durabilidade acabe e ela colapse.\n\nComo a armadura é imóvel, mover-se fará com que ela se quebre e seja perdida.\n\nArmadura restante: %d.

plants.fadeleaf.name=folha-fantasma
plants.fadeleaf.desc=Tocar uma folha-fantasma teletransportará qualquer criatura a um lugar aleatório no andar atual.
plants.fadeleaf.warden_desc=O efeito de teletransporte da Folha-fantasma é mais potente para _a Guardiã_, teletransportando ela de volta para o fim do andar anterior da masmorra.
plants.fadeleaf$seed.name=Semente de folha-fantasma

plants.firebloom.name=flor-de-fogo
plants.firebloom.desc=Quando algo toca a flor-de-fogo, ela explode em chamas.
plants.firebloom.warden_desc=Ao pisar em uma flor-de-fogo, _a Guardiã_ será brevemente imbuída com chamas em vez de ser prejudicada.
plants.firebloom$seed.name=Semente de flor-de-fogo

plants.icecap.name=muda-de-gelo
plants.icecap.desc=Ao ser tocada, uma muda-de-gelo lança uma nuvem de pólen congelante. O efeito é muito mais forte se o ambiente estiver molhado.
plants.icecap.warden_desc=Ao pisar em uma muda-de-gelo, _a Guardiã_ será brevemente imbuída com geada em vez de ser prejudicada.
plants.icecap$seed.name=Semente de muda-de-gelo

plants.plant.warden_desc=Esta planta não tem efeito especial quando usada pela Guardiã.
plants.plant.discover_hint=Você pode encontrar esta planta aleatoriamente na masmorra ou fazer ela crescer a partir de sua semente correspondente.
plants.plant$seed.seed_of=Semente de %s
plants.plant$seed.ac_plant=PLANTAR
plants.plant$seed.info=Jogue esta semente no lugar o qual deseja que a planta cresça.\n\n%s
plants.plant$seed$placeholder.name=Semente

plants.rotberry.name=putrifruta
plants.rotberry.desc=Os frutos de um jovem arbusto de putrifruta têm o doce, doce gosto da morte. Após vários dias, este arbusto de putrifruta irá crescer em outro coração pútrido. Quando pisoteada, uma jovem putrifruta irá produzir uma pequena nuvem de gás tóxico.
plants.rotberry.warden_desc=Normalmente, um arbusto de putrifruta só produz um pouco de gás quando pisoteado, mas _a Guardiã_ é capaz de aproveitar energia dele e temporariamente impulsionar sua força!
plants.rotberry.discover_hint=Você pode fazer esta planta crescer a partir de sua semente corresponde durante uma missão específica.
plants.rotberry$seed.name=Semente de putrifruta
plants.rotberry$seed.discover_hint=Você pode encontrar este item durante uma missão específica.

plants.sorrowmoss.name=sofrimusgo
plants.sorrowmoss.desc=O sofrimusgo é uma flor (não um musgo) com pétalas afiadas, cobertas por um veneno mortal.
plants.sorrowmoss.warden_desc=Ao pisar em um sofrimusgo, _a Guardiã_ será brevemente imbuída com toxina em vez de ser prejudicada.
plants.sorrowmoss$seed.name=Semente de sofrimusgo

plants.starflower.name=flor-estrela
plants.starflower.desc=Uma planta extremamente rara, dizem que a flor-estrela dá poder sagrado a quem quer que a toque.
plants.starflower.warden_desc=Além de ser abençoada, _a Guardiã_ irá ganhar uma significante quantidade de recarga de varinha ao pisar em uma flor-estrela.
plants.starflower$seed.name=Semente de fruta-estrela

plants.stormvine.name=vinha-tempestuosa
plants.stormvine.desc=A gravidade afeta a vinha-tempestuosa de forma anormal, permitindo que seus finos ramos azuis fiquem "pendurados" no ar. Qualquer um que toque na videira é afetado por isso, tornando-se desorientado.
plants.stormvine.warden_desc=_A Guardiã_ é capaz de controlar o efeito gravitacional da vinha-tempestuosa e levitará brevemente quando pisotear uma.
plants.stormvine$seed.name=Semente de vinha-tempestuosa

plants.sungrass.name=grama-solar
plants.sungrass.desc=A Grama-solar é conhecida por suas propriedades curativas lentas, mas efetivas, de sua seiva.
plants.sungrass.warden_desc=_A Guardiã_ pode receber cura da grama-solar pisoteada mesmo que se mova.
plants.sungrass$seed.name=Semente da grama-solar
plants.sungrass$health.name=cura herbácea
plants.sungrass$health.desc=Grama-solar possui excelentes propriedades curativas, embora seja muito mais lenta do que uma poção de cura.\n\nSair da planta quebrará o efeito de cura.\n\nCura restante: %d.

plants.swiftthistle.name=cardo-ligeiro
plants.swiftthistle.desc=Quando pisoteado, o Cardo-ligeiro acelera brevemente o fluxo de tempo em torno dele, permitindo que o atropelador execute várias ações instantaneamente.
plants.swiftthistle.warden_desc=Além de ganhar ações instantâneas, _a Guardiã_ também receberá um breve impulso de pressa ao pisar num cardo-ligeiro.
plants.swiftthistle$seed.name=Semente de cardo-ligeiro
plants.swiftthistle$timebubble.name=bolha do tempo
plants.swiftthistle$timebubble.desc=Uma pequena bolha de tempo acelerado, permitindo que ações sejam executadas instantaneamente. No entanto, atacar ou usar magia irá quebrar esse efeito.\n\nTurnos restantes: %s.

###Warped Pixel Dungeon
plants.plant$seed.ac_eat=COMER
plants.plant$seed.seed_eaten=Você mastiga a %s.
plants.plant$seed.farm_desc=_Cultivo:_ semeada num canteiro no mundo aberto, amadurece em cerca de _%1$d turnos_ de crescimento no verão e depois solta até _%2$d sementes_ da mesma planta, com _%3$d%% de chance_ de murchar a cada ciclo depois do primeiro.
plants.plant$seed.farm_water=Esta plantação adora umidade: _água ao lado dela_, ou um poço a até 2 quadrados, faz ela crescer mais rápido e reduz muito a chance de murchar.
plants.dreamfoil.name=folha-onírica
plants.dreamfoil.refreshed=Você se sente revigorado.
plants.dreamfoil.desc=As flores espinhosas da folha-onírica contêm uma substância conhecida por ser um forte agente neutralizante. A maioria das criaturas mais fracas não aguenta e desmaia, e daí vem o nome da planta.
plants.dreamfoil$seed.name=Semente de folha-onírica
plants.dewcatcher.name=orvalheira
plants.dewcatcher.desc=Nascidas de sementes de cristal cintilantes, as orvalheiras se disfarçam de grama para não chamar atenção, mas as bolsas de orvalho acumulado as entregam. Sacuda-as para colher o orvalho das folhas.
plants.dewcatcher$seed.name=Semente de orvalheira
plants.phaseshift.name=jarro-de-fase
plants.phaseshift.desc=O jarro-de-fase tem uma ligação incomum com as energias de transmutação da masmorra. Quando plantado, cria um pequeno poço de transmutação nas suas raízes.
plants.phaseshift$seed.name=Semente de jarro-de-fase
plants.flytrap.name=devora-aprimoramentos
plants.flytrap.desc=A devora-aprimoramentos é uma planta carnívora que se alimenta de energia mágica. Jogue um equipamento, uma poção ou um pergaminho sobre ela para alimentá-la. Ela consome um item e murcha, deixando material de aprimoramento ou uma semente aleatória. Quanto mais aprimorado o equipamento, maior a chance de sair material de aprimoramento. Pisar nela não a gasta.
plants.flytrap$seed.name=Semente de devora-aprimoramentos
plants.snowhedge.name=sebe-de-neve
plants.snowhedge.desc=A sebe-de-neve é conhecida por soltar uma tempestade de neve quando se sente ameaçada. A rajada gelada congela tudo o que estiver por perto.
plants.snowhedge$seed.name=Semente de sebe-de-neve
plants.frostcorn.name=milho-gelado
plants.frostcorn.desc=Quando algo toca um milho-gelado, fica imbuído de uma aura gelada. Alquimistas fazem estoque dessas plantas antes de visitar regiões quentes.
plants.frostcorn.warden_desc=_A Guardiã_ recebe do milho-gelado um efeito de imbuição de gelo mais longo.
plants.frostcorn$seed.name=Semente de milho-gelado
plants.willowcane.name=cana-salgueiro
plants.willowcane.desc=A cana-salgueiro solta feromônios que deixam tudo muito letárgico. O efeito soporífero deixa lentas e sonolentas as criaturas próximas.
plants.willowcane$seed.name=Semente de cana-salgueiro
plants.rose.name=rosa
plants.rose.desc=As rosas têm uma magia encantadora correndo nas veias. Quando uma é ativada, os inimigos próximos ficam encantados e distraídos.
plants.rose$seed.name=Semente de rosa
plants.clitbalm.name=clitbálsamo
plants.clitbalm.desc=O clitbálsamo solta feromônios que encantam os inimigos próximos e os deixam apaixonados, por um tempo, por quem ativou a planta.
plants.clitbalm$seed.name=Semente de clitbálsamo
plants.hypnohemp.name=hipnocânhamo
plants.hypnohemp.desc=O hipnocânhamo torna possível o controle hipnótico. Seus esporos levam as criaturas próximas a um frenesi violento, jogando umas contra as outras.
plants.hypnohemp$seed.name=Semente de hipnocânhamo
plants.sunbloom.name=flor-solar
plants.sunbloom.desc=A flor-solar guarda o poder da luz concentrada. Quando destruída, solta um clarão ofuscante que é especialmente devastador para mortos-vivos.
plants.sunbloom$seed.name=Semente de flor-solar
plants.dirtdaisy.name=margarida-de-terra
plants.dirtdaisy.desc=A margarida-de-terra é uma planta que levanta nuvens gigantes de terra quando ativada, bloqueando a visão na área em volta.
plants.dirtdaisy$seed.name=Semente de margarida-de-terra
plants.grassvine.name=trepadeira-de-grama
plants.grassvine.desc=A trepadeira-de-grama faz a vegetação brotar de novo à sua volta quando perturbada, transformando chão estéril em grama alta e enraizando quem a ativou.
plants.grassvine$seed.name=Semente de trepadeira-de-grama
plants.witherfennel.name=funcho-murcho
plants.witherfennel.desc=Esta planta solta um veneno mortal que pode aleijar seriamente os seres vivos. Ela também faz murchar a grama e as plantas próximas.
plants.witherfennel$seed.name=Semente de funcho-murcho
plants.crimsonpepper.name=pimenta-carmesim
plants.crimsonpepper.desc=Esta planta contém uma grande quantidade de pimenta volátil que estoura no ar, pondo fogo em tudo por perto.
plants.crimsonpepper$seed.name=Semente de pimenta-carmesim
plants.nightshadeonion.name=cebola-beladona
plants.nightshadeonion.desc=As camadas grossas da cebola-beladona são cheias de um líquido estranho. Quando destruídas, produzem uma neblina densa que bloqueia a visão por completo.
plants.nightshadeonion$seed.name=Semente de cebola-beladona
plants.steamweed.name=erva-vapor
plants.steamweed.desc=A erva-vapor consegue formar nuvens de tempestade inteiras com o vapor que solta. Os anões usam esta planta para mover suas máquinas.
plants.steamweed$seed.name=Semente de erva-vapor
plants.kiwivetch.name=ervilhaca-kiwi
plants.kiwivetch.desc=A ervilhaca-kiwi tenta fazer a vegetação brotar de novo à sua volta quando destruída, espalhando mato viçoso pela área.
plants.kiwivetch$seed.name=Semente de ervilhaca-kiwi
plants.gobgrape.name=uva-de-goblin
plants.gobgrape.desc=O pé de uva-de-goblin dá frutinhas pequenas e doces, um dos petiscos favoritos dos goblins. Quando ativado, os frutos maduros caem no chão.
plants.gobgrape$seed.name=Semente de uva-de-goblin
plants.peanutpetal.name=pétala-de-amendoim
plants.peanutpetal.desc=A pétala-de-amendoim cria nozes nutritivas dentro das pétalas. Quando perturbada, as nozes se espalham pelo chão.
plants.peanutpetal$seed.name=Semente de pétala-de-amendoim
plants.eggbloom.name=flor-de-ovo
plants.eggbloom.desc=A flor-de-ovo dá frutinhas em forma de ovo com um sabor surpreendentemente rico. Para os aventureiros, achar uma é um golpe de sorte.
plants.eggbloom$seed.name=Semente de flor-de-ovo
plants.cornwheat.name=milhotrigo
plants.cornwheat.desc=Uma planta de grãos resistente que cresce bem até na escuridão da masmorra. Quando ativada, solta uma pequena ração de comida.
plants.cornwheat$seed.name=Semente de milhotrigo
plants.musclemoss.name=musgo-músculo
plants.musclemoss.desc=Este musgo guarda energia cinética nos talos grossos. Quando perturbado, solta uma onda de choque poderosa que empurra as criaturas para trás.
plants.musclemoss$seed.name=Semente de musgo-músculo
plants.butterlion.name=leão-manteiga
plants.butterlion.desc=O leão-manteiga é uma planta volátil que sacode o chão com violência quando ativada, ferindo e desorientando tudo por perto.
plants.butterlion$seed.name=Semente de leão-manteiga
plants.flowertree.name=árvore-flor
plants.flowertree.desc=A árvore-flor é uma árvore em miniatura que produz sementes de outras plantas. Quando ativada, solta uma semente aleatória.
plants.flowertree$seed.name=Semente de árvore-flor
plants.grasslilly.name=lírio-da-grama
plants.grasslilly.desc=O lírio-da-grama canaliza a essência de outras plantas. Quando ativado, produz o efeito de uma planta aleatória, o que o torna totalmente imprevisível.
plants.grasslilly$seed.name=Semente de lírio-da-grama
plants.goograss.name=grama-gosma
plants.goograss.desc=A grama-gosma é coberta por uma gosma grossa e cáustica. Tudo o que encosta nela fica coberto de muco corrosivo.
plants.goograss$seed.name=Semente de grama-gosma
plants.sourpitcher.name=jarro-azedo
plants.sourpitcher.desc=O jarro-azedo secreta um líquido muito ácido pelas folhas em forma de jarro. O contato com esse ácido causa uma corrosão dolorosa.
plants.sourpitcher$seed.name=Semente de jarro-azedo
plants.tomatobush.name=tomateiro
plants.tomatobush.desc=O tomateiro guarda suco sob pressão dentro dos frutos enormes. Quando ativado, os tomates explodem com violência, ferindo tudo por perto.
plants.tomatobush$seed.name=Semente de tomateiro
plants.blueeyedsusan.name=susana-dos-olhos-azuis
plants.blueeyedsusan.desc=A susana-dos-olhos-azuis irradia uma luz purificadora suave. Quando ativada por um herói, remove as maldições dos itens equipados.
plants.blueeyedsusan$seed.name=Semente de susana-dos-olhos-azuis
plants.lavenderlantern.name=lanterna-de-lavanda
plants.lavenderlantern.desc=A lanterna-de-lavanda solta um clarão intenso de luz roxa quando perturbada. O clarão é forte o bastante para cegar todas as criaturas próximas.
plants.lavenderlantern$seed.name=Semente de lanterna-de-lavanda
plants.apricobush.name=damasqueiro
plants.apricobush.desc=O damasqueiro produz um néctar calmante que ajuda a cura natural. Quando ativado, aplica um efeito de regeneração em quem pisar nele.
plants.apricobush$seed.name=Semente de damasqueiro
plants.ballcrop.name=planta-bola
plants.ballcrop.desc=A planta-bola guarda energia cinética no fruto bulboso. Quando ativada, solta uma onda de choque que empurra para trás o que estiver em cima dela.
plants.ballcrop$seed.name=Semente de planta-bola
plants.bananabean.name=feijão-banana
plants.bananabean.desc=O feijão-banana secreta uma substância escorregadia pelas folhas parecidas com casca de banana. Pisar nele causa desorientação e perda de equilíbrio.
plants.bananabean$seed.name=Semente de feijão-banana
plants.blackholeflower.name=flor-buraco-negro
plants.blackholeflower.desc=A flor-buraco-negro distorce o espaço à sua volta. Quando ativada, fere a vítima e a joga em outro lugar do mesmo andar, e a dobra no espaço deixa um frio cortante no ar em volta.
plants.blackholeflower$seed.name=Semente de flor-buraco-negro
plants.chandaliertail.name=cauda-de-lustre
plants.chandaliertail.desc=A cauda-de-lustre brilha com uma luz quente e constante. Quando ativada, dá o buff iluminado, clareando os arredores.
plants.chandaliertail$seed.name=Semente de cauda-de-lustre
plants.chillisnapper.name=pimenta-mordedora
plants.chillisnapper.desc=A pimenta-mordedora é uma planta ardente que explode em chamas quando perturbada. Põe fogo em tudo por perto e incendeia o chão.
plants.chillisnapper$seed.name=Semente de pimenta-mordedora
plants.clockcypress.name=cipreste-relógio
plants.clockcypress.desc=O cipreste-relógio manipula o fluxo do tempo à sua volta. Quando ativado, deixa lentos todos os inimigos visíveis, dando a você uma vantagem tática.
plants.clockcypress$seed.name=Semente de cipreste-relógio
plants.cocostuft.name=tufo-de-coco
plants.cocostuft.desc=O tufo-de-coco tem uma casca dura e protetora. Heróis que o ativam ganham uma barreira protetora, e os inimigos ficam aleijados pelos cacos afiados da casca.
plants.cocostuft$seed.name=Semente de tufo-de-coco
plants.combflower.name=flor-favo
plants.combflower.desc=A flor-favo atrai e abriga uma abelha dourada nas pétalas parecidas com favos de mel. Quando ativada, a abelha sai como aliada para lutar ao seu lado.
plants.combflower$seed.name=Semente de flor-favo
plants.crimsoncrown.name=coroa-carmesim
plants.crimsoncrown.desc=A coroa-carmesim é uma planta espinhosa que causa ferimentos profundos. Quando ativada, provoca um sangramento forte e põe fogo na área.
plants.crimsoncrown$seed.name=Semente de coroa-carmesim
plants.eyeeuonymus.name=evônimo-olho
plants.eyeeuonymus.desc=O evônimo-olho tem frutinhas curiosas em forma de olho que dão uma percepção sobrenatural. Quando ativado por um herói, dá visão mental, revelando todas as criaturas do andar.
plants.eyeeuonymus$seed.name=Semente de evônimo-olho
plants.feelerfern.name=samambaia-antena
plants.feelerfern.desc=A samambaia-antena estende as frondes pela terra, acelerando o crescimento das plantas em volta. Ela também aguça a percepção de quem a ativa.
plants.feelerfern$seed.name=Semente de samambaia-antena
plants.firefoxglove.name=dedaleira-de-fogo
plants.firefoxglove.desc=A dedaleira-de-fogo é uma planta extremamente volátil. Quando ativada, detona como uma bomba de fogo, engolindo a área em chamas.
plants.firefoxglove$seed.name=Semente de dedaleira-de-fogo
plants.larvaleaf.name=folha-larva
plants.larvaleaf.desc=A folha-larva abriga organismos parasitas nas nervuras. Quando ativada, infecta a vítima com parasitas tóxicos que drenam a vida dela aos poucos.
plants.larvaleaf$seed.name=Semente de folha-larva
plants.lightninglily.name=lírio-relâmpago
plants.lightninglily.desc=O lírio-relâmpago estala com energia elétrica acumulada. Quando ativado, descarrega um raio em quem o perturbou.
plants.lightninglily$seed.name=Semente de lírio-relâmpago
plants.parasiteshrub.name=arbusto-parasita
plants.parasiteshrub.desc=Melhor não pisar neste. Ativar o arbusto-parasita deixa você com uma infecção parasitária que drena, e a semente faz o mesmo com qualquer inimigo que acertar. Só a Guardiã vira o vínculo a seu favor ao tocá-lo, ou quem come a semente como tempero, ganhando uma simbiose parasitária que dobra a velocidade de movimento e cura quando se solta.
plants.parasiteshrub$seed.name=Semente de arbusto-parasita
plants.poppoplar.name=álamo-estouro
plants.poppoplar.desc=O álamo-estouro é cheio de seiva sob pressão. Quando ativado, explode com violência, causando dano pesado a tudo na área imediata.
plants.poppoplar$seed.name=Semente de álamo-estouro
plants.shadowbloom.name=flor-sombria
plants.shadowbloom.desc=A flor-sombria cresce bem no escuro e manipula as sombras. Quando ativada por um herói, cria uma cópia espelhada. Os inimigos ficam cegos com a névoa escura dela.
plants.shadowbloom$seed.name=Semente de flor-sombria
plants.suncarnivore.name=carnívora-solar
plants.suncarnivore.desc=A carnívora-solar canaliza luz do sol concentrada. É especialmente mortal para mortos-vivos, que ela pode destruir na hora. Criaturas vivas sofrem queimaduras e cegueira temporária.
plants.suncarnivore$seed.name=Semente de carnívora-solar
plants.tankcabbage.name=repolho-tanque
plants.tankcabbage.desc=O repolho-tanque guarda gases inflamáveis nas folhas grossas. Quando ativado, solta uma explosão de fogo que incendeia tudo por perto.
plants.tankcabbage$seed.name=Semente de repolho-tanque
plants.venusflytrap.name=vênus papa-moscas
plants.venusflytrap.desc=A vênus papa-moscas prende as vítimas com mandíbulas poderosas. Quando ativada, enraíza a vítima no lugar e causa dano enquanto tenta digeri-la.
plants.venusflytrap$seed.name=Semente de vênus papa-moscas
plants.waterweed.name=erva-d'água
plants.waterweed.desc=A erva-d'água puxa umidade das profundezas da terra. Quando ativada, inunda a área em volta, transformando em água os quadrados de chão próximos.
plants.waterweed$seed.name=Semente de erva-d'água
plants.butterlion.ondeath=Você foi esmagado por pedras!
plants.butterlion.rankings_desc=Morto esmagado
