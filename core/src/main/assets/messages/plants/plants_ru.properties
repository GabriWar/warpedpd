# Russian localization — next 500 keys
plants.plant$seed.farm_desc=_Земледелие:_ посаженные в поле на поверхности, семена созревают примерно за _%1$d ходов_ летнего роста. Затем растение даёт до _%2$d собственных семян_. После первого урожая в каждом цикле есть _%3$d%% вероятности_ увядания.
plants.plant$seed.farm_water=Эта культура любит влагу: если _рядом есть вода_ или колодец в пределах двух клеток, она растёт быстрее и гораздо реже увядает.
plants.dreamfoil.desc=Колючие цветки сон-травы содержат вещество, обладающее сильным нейтрализующим действием. Мелкие существа не выдерживают его воздействия и погружаются в сон — отсюда и название растения.
plants.dewcatcher.desc=Росянки вырастают из сверкающих кристальных семян и маскируются под обычную траву. Выдают их лишь капли накопленной росы. Встряхните растение, чтобы собрать росу с листьев.
plants.phaseshift.desc=Фазовый кувшинчик необычным образом связан с энергией превращений, пронизывающей подземелье. Посаженный кувшинчик создаёт у своих корней небольшой колодец превращения.
plants.flytrap.desc=Пожиратель улучшений — хищное растение, которое питается магической энергией. Бросьте на него снаряжение, зелье или свиток: растение поглотит один предмет и увянет, оставив материал для улучшения или случайное семя. Чем сильнее улучшено снаряжение, тем выше шанс получить материал. Если просто наступить на растение, оно ничего не поглотит.
plants.snowhedge.desc=Снежная изгородь при угрозе поднимает снежную бурю. Ледяной порыв замораживает всех поблизости.
plants.frostcorn.desc=При прикосновении морозозёрн окутывает существо ледяной аурой. Алхимики запасаются им перед путешествиями в жаркие края.
plants.frostcorn.warden_desc=_Хранительница_ получает от морозозёрна более продолжительное усиление ледяной ауры.
plants.willowcane.desc=Ивовый тростник выделяет феромоны, вызывающие сильную вялость. Его усыпляющее действие замедляет окружающих существ и навевает на них дремоту.
plants.rose.desc=Розы пронизаны очаровывающей магией. Если потревожить цветок, ближайшие враги попадут под чары и отвлекутся.
plants.clitbalm.desc=Чаромята выделяет феромоны, которые ненадолго влюбляют ближайших врагов в того, кто потревожил растение.
plants.hypnohemp.desc=Гипнопенька позволяет подчинять чужую волю. Её споры приводят существ в яростное безумие, заставляя их нападать друг на друга.
plants.sunbloom.desc=Солнцецвет хранит в себе силу концентрированного света. При разрушении он ослепительно вспыхивает, особенно сильно поражая нежить.
plants.dirtdaisy.desc=Земляная ромашка при прикосновении поднимает огромное облако пыли, полностью закрывающее обзор поблизости.
plants.grassvine.desc=Потревоженная травяная лоза заставляет растения вокруг быстро разрастаться: голая земля покрывается высокой травой, а существо, задевшее лозу, оказывается обездвижено корнями.
plants.witherfennel.desc=Увядающий фенхель выделяет смертельно опасный яд, способный сильно ослабить живые организмы. От него также чахнут трава и другие растения поблизости.
plants.crimsonpepper.desc=В багряном перце содержится много летучего жгучего вещества. При повреждении оно вырывается наружу и поджигает всё вокруг.
plants.nightshadeonion.desc=Толстые слои паслёнового лука наполнены странной жидкостью. При разрушении луковицы она превращается в густой туман, полностью скрывающий обзор.
plants.steamweed.desc=Паротрава выпускает столько пара, что способна создавать целые грозовые тучи. Дворфы используют её для питания своих машин.
plants.kiwivetch.desc=При разрушении кивиевый вьюнок стремится восстановить растения вокруг, покрывая местность буйной зеленью.
plants.gobgrape.desc=На кустах гоблинского винограда созревают маленькие сладкие ягоды — любимое лакомство гоблинов. Если потревожить куст, спелые ягоды осыплются на землю.
plants.peanutpetal.desc=В лепестках орехоцвета вызревают питательные орешки. Стоит задеть цветок, и они рассыплются по земле.
plants.eggbloom.desc=Яйцецвет приносит похожие на яйца ягоды с неожиданно насыщенным вкусом. Путники считают такую находку большой удачей.
plants.cornwheat.desc=Выносливый злак, способный расти даже во тьме подземелья. Если потревожить кукурузопшеницу, она даст небольшую порцию еды.
plants.musclemoss.desc=В толстых стеблях мышечного мха накапливается кинетическая энергия. При прикосновении он высвобождает мощную ударную волну, отбрасывающую существ.
plants.butterlion.desc=Масляный лев — нестабильное растение, которое при прикосновении вызывает сильные подземные толчки, раня и дезориентируя всех вокруг.
plants.flowertree.desc=Цветущее дерево — крошечное деревце, на котором созревают семена других растений. Если потревожить его, выпадет случайное семя.
plants.grasslilly.desc=Травяная лилия проводит через себя силу других растений. При прикосновении она вызывает случайный растительный эффект — никогда не знаешь, чего ожидать.
plants.goograss.desc=Слизетрава покрыта толстым слоем едкой слизи. Всё, что к ней прикасается, оказывается покрыто разъедающей жижей.
plants.sourpitcher.desc=Кислый кувшинчик выделяет очень едкую жидкость из листьев-ловушек. Прикосновение к ней вызывает болезненные химические ожоги.
plants.tomatobush.desc=В огромных плодах томатного куста сок находится под высоким давлением. При прикосновении помидоры взрываются, раня всех поблизости.
plants.blueeyedsusan.desc=Голубоглазая Сюзанна источает мягкий очищающий свет. Если герой потревожит растение, оно снимет проклятия с надетых предметов.
plants.lavenderlantern.desc=Лавандовый фонарик при прикосновении даёт ярчайшую фиолетовую вспышку. Её хватает, чтобы ослепить всех существ поблизости.
plants.apricobush.desc=Абрикосовый куст выделяет успокаивающий нектар, ускоряющий естественное исцеление. Тот, кто наступит на него, получит эффект регенерации.
plants.ballcrop.desc=В округлых плодах шароцвета накапливается кинетическая энергия. При прикосновении растение выпускает ударную волну и отбрасывает того, кто на него наступил.
plants.bananabean.desc=Банановый боб выделяет скользкое вещество через листья, похожие на кожуру. Наступив на растение, легко потерять равновесие и ориентацию.
plants.blackholeflower.desc=Цветок чёрной дыры искажает пространство вокруг себя. При прикосновении он ранит жертву и переносит её в другое место этого этажа, а после пространственного разрыва воздух поблизости становится обжигающе холодным.
plants.chandaliertail.desc=Хвост люстры излучает ровный тёплый свет. При прикосновении он дарует эффект Света, освещающий всё вокруг.
plants.chillisnapper.desc=Перечный кусач — огненное растение, которое вспыхивает при малейшем прикосновении. Оно поджигает существ поблизости и землю вокруг.
plants.clockcypress.desc=Часовой кипарис управляет течением времени. При прикосновении он замедляет всех видимых врагов, давая вам тактическое преимущество.
plants.cocostuft.desc=Кокосовый хохолок защищён прочной скорлупой. Прикоснувшийся к нему герой получает защитный барьер, а враги калечатся острыми осколками скорлупы.
plants.combflower.desc=В похожих на соты лепестках гребнецвета живёт золотая пчела. Если потревожить цветок, пчела вылетит и станет вашим союзником в бою.
plants.crimsoncrown.desc=Багряная корона — колючее растение, оставляющее глубокие раны. При прикосновении оно вызывает сильное кровотечение и поджигает местность.
plants.eyeeuonymus.desc=Ягоды глазастого бересклета похожи на глаза и даруют сверхъестественное восприятие. Если герой потревожит растение, он получит ментальное зрение и увидит всех существ на этаже.
plants.feelerfern.desc=Папоротник-щупальце запускает отростки глубоко в землю, ускоряя рост растений вокруг. Кроме того, потревоживший его получает обострённое восприятие.
plants.firefoxglove.desc=Огненная наперстянка крайне нестабильна. При прикосновении она взрывается словно зажигательная бомба, охватывая округу пламенем.
plants.larvaleaf.desc=В жилках личинколиста обитают паразиты. При прикосновении они заражают жертву и постепенно вытягивают её здоровье.
plants.lightninglily.desc=В грозовой лилии потрескивает накопленное электричество. Стоит задеть растение, и оно ударит нарушителя молнией.
plants.parasiteshrub.desc=Лучше не наступайте на куст-паразит. Потревожив его, вы получите паразитарную инфекцию, высасывающую здоровье; такой же эффект поражает врага, в которого попадёт семя. Только Хранительница может обратить связь себе на пользу при прикосновении. Любой другой герой может съесть семя как приправу и получить паразитический симбиоз: скорость передвижения удвоится, а после окончания эффекта восстановится здоровье.
plants.poppoplar.desc=В хлопающем тополе скапливается сок под высоким давлением. При прикосновении он с силой взрывается, нанося большой урон всем поблизости.
plants.shadowbloom.desc=Теницвет растёт во тьме и повелевает тенями. Если его потревожит герой, появится зеркальный двойник. Врагов же ослепляет тёмный туман.
plants.suncarnivore.desc=Солнечный хищник собирает концентрированный солнечный свет. Он особенно опасен для нежити, которую способен уничтожить мгновенно. Живые существа получают ожоги и временно слепнут.
plants.tankcabbage.desc=В толстых листьях бронированной капусты накапливается горючий газ. При прикосновении он вырывается наружу огненной вспышкой и поджигает всё вокруг.
plants.venusflytrap.desc=Венерина мухоловка хватает жертву мощными створками. При прикосновении она удерживает существо на месте и наносит урон, пытаясь его переварить.
plants.waterweed.desc=Водоросль вытягивает влагу из глубины земли. Если её потревожить, она затопит окрестности, превратив соседние клетки пола в воду.
plants.tomatobush.died=Вас убило взрывом помидора!
plants.tomatobush.explode=От взрыва томатного куста всё подземелье забрызгало мякотью.
plants.apricobush.spice_desc=Как приправа: постепенно восстанавливает 10 ед. здоровья.
plants.apricobush.poison_desc=На оружии или в колчане: постепенно восстанавливает атакующему 10 ед. здоровья.
plants.ballcrop.spice_desc=Как приправа: даёт эффект «Суперпрыжки» на 4 хода.
plants.ballcrop.poison_desc=На оружии или в колчане: накладывает на цель эффект «Кувырки».
plants.bananabean.spice_desc=Как приправа: делает вас скользким на 4 хода.
plants.bananabean.poison_desc=На оружии или в колчане: делает цель скользкой.
plants.blackholeflower.spice_desc=Как приправа: телепортирует вас на ближайшую доступную клетку, если такая есть.
plants.blackholeflower.poison_desc=На оружии или в колчане: охлаждает окрестности и сбрасывает обычных врагов в пропасть. Боссы сопротивляются падению.
plants.blandfruitbush.spice_desc=Как приправа: восстанавливает 50 ед. сытости.
plants.blandfruitbush.poison_desc=На оружии или в колчане: наносит дополнительный удар с уроном, равным урону атаки.
plants.blindweed.spice_desc=Как приправа: даёт невидимость на 4 хода.
plants.blindweed.poison_desc=На оружии или в колчане: ослепляет и калечит цель на 5–10 ходов, а преследующих врагов дезориентирует.
plants.blueeyedsusan.spice_desc=Как приправа: рядом с вами появляется капля росы.
plants.blueeyedsusan.poison_desc=На оружии или в колчане: рядом с атакующим появляется капля росы.
plants.butterlion.spice_desc=Как приправа: вызывает небольшой каменный выброс, наносящий вам 1 ед. урона.
plants.butterlion.poison_desc=На оружии или в колчане: каменный выброс дополнительно ранит цель и ближайших враждебных существ.
plants.chandaliertail.spice_desc=Как приправа: вы светитесь 4 хода.
plants.chandaliertail.poison_desc=На оружии или в колчане: атакующий светится 4 хода.
plants.chillisnapper.spice_desc=Как приправа: выпускает огненный заряд в сторону ближайшей свободной клетки.
plants.chillisnapper.poison_desc=На оружии или в колчане: поджигает клетку под целью.
plants.clitbalm.spice_desc=Как приправа: на 20 ходов заставляет вас испытывать очарование к текущему врагу, если он есть.
plants.clitbalm.poison_desc=На оружии или в колчане: на 10 ходов очаровывает цель атакующим.
plants.clockcypress.spice_desc=Как приправа: вводит вас в стазис на 4 хода.
plants.clockcypress.poison_desc=На оружии или в колчане: замедляет цель.
plants.cocostuft.spice_desc=Как приправа: даёт кокосовый щит на 4 хода.
plants.cocostuft.poison_desc=На оружии или в колчане: калечит цель.
plants.combflower.spice_desc=Как приправа: даёт сахарный прилив сил на 4 хода.
plants.combflower.poison_desc=На оружии или в колчане: покрывает цель мёдом.
plants.cornwheat.spice_desc=Как приправа: у ваших ног появляется стебель кукурузопшеницы.
plants.cornwheat.poison_desc=На оружии или в колчане: с вероятностью 20% у цели появляется стебель кукурузопшеницы.
plants.crimsoncrown.spice_desc=Как приправа: создаёт огненный вихрь на ближайшей свободной клетке.
plants.crimsoncrown.poison_desc=На оружии или в колчане: создаёт огненный вихрь на клетке цели.
plants.crimsonpepper.spice_desc=Как приправа: даёт ауру тепла на 4 хода.
plants.crimsonpepper.poison_desc=На оружии или в колчане: обезвоживает цель.
plants.dewcatcher.spice_desc=Как приправа: на ближайшей свободной клетке может появиться цветная роса.
plants.dewcatcher.poison_desc=На оружии или в колчане: возле атакующего может появиться цветная роса.
plants.dirtdaisy.spice_desc=Как приправа: создаёт облако пыли на ближайшей свободной клетке.
plants.dirtdaisy.poison_desc=На оружии или в колчане: создаёт у цели облако пыли, мощность которого зависит от урона атаки.
plants.dreamfoil.spice_desc=Как приправа: даёт иммунитет к вредоносным облакам на 4 хода.
plants.dreamfoil.poison_desc=На оружии или в колчане: усыпляет поражённых существ.
plants.earthroot.spice_desc=Как приправа: даёт эффект коры силой 2, который ослабевает каждые 4 хода.
plants.earthroot.poison_desc=На оружии или в колчане: даёт атакующему такую же защиту коры.
plants.eggbloom.spice_desc=Как приправа: у ваших ног появляется растительное яйцо.
plants.eggbloom.poison_desc=На оружии или в колчане: с вероятностью 30% у цели появляется растительное яйцо.
plants.eyeeuonymus.spice_desc=Как приправа: создаёт вихрь знания на ближайшей свободной клетке.
plants.eyeeuonymus.poison_desc=На оружии или в колчане: создаёт вихрь знания у цели.
plants.fadeleaf.spice_desc=Как приправа: телепортирует вас. Хранительница вместо этого может отступить на этаж выше, если это возможно.
plants.fadeleaf.poison_desc=На оружии или в колчане: телепортирует подвижных врагов прочь, кроме этажей с боссами.
plants.feelerfern.spice_desc=Как приправа: даёт эффект «Усики» на 4 хода.
plants.feelerfern.poison_desc=На оружии или в колчане: накладывает на цель эффект «Усики».
plants.firebloom.spice_desc=Как приправа: даёт огненную ауру на 4 хода.
plants.firebloom.poison_desc=На оружии или в колчане: поджигает клетку цели.
plants.firefoxglove.spice_desc=Как приправа: оставляет за вами огненный след в течение 4 ходов.
plants.firefoxglove.poison_desc=На оружии или в колчане: вызывает взрыв зажигательной бомбы у цели.
plants.flowertree.spice_desc=Как приправа: применяет эффект случайного семени, не вызывающий цепочку подобных эффектов.
plants.flowertree.poison_desc=На оружии или в колчане: сажает у цели случайное семя.
plants.flytrap.spice_desc=Как приправа: сажает пожирателя улучшений на ближайшей свободной клетке.
plants.flytrap.poison_desc=На оружии или в колчане: сажает пожирателя улучшений рядом с целью.
plants.frostcorn.spice_desc=Как приправа: даёт ледяную ауру на 4 хода.
plants.frostcorn.poison_desc=На оружии или в колчане: замораживает цель.
plants.gobgrape.spice_desc=Как приправа: у ваших ног появляется виноградина.
plants.gobgrape.poison_desc=На оружии или в колчане: с вероятностью 30% у цели появляется виноградина.
plants.goograss.spice_desc=Как приправа: создаёт облако едкой жижи на ближайшей свободной клетке.
plants.goograss.poison_desc=На оружии или в колчане: создаёт облако едкой жижи у цели.
plants.grasslilly.spice_desc=Как приправа: применяет эффект случайного семени, не вызывающий цепочку подобных эффектов.
plants.grasslilly.poison_desc=На оружии или в колчане: применяет к цели случайный растительный атакующий эффект, не вызывающий цепочку подобных эффектов.
plants.grassvine.spice_desc=Как приправа: на вашей клетке вырастает высокая трава.
plants.grassvine.poison_desc=На оружии или в колчане: на клетке цели вырастает высокая трава.
plants.hypnohemp.spice_desc=Как приправа: создаёт облако скверны на ближайшей свободной клетке.
plants.hypnohemp.poison_desc=На оружии или в колчане: подчиняет цель скверне, если она восприимчива к этому эффекту.
plants.icecap.spice_desc=Как приправа: на 4 хода пропитывает вас холодом.
plants.icecap.poison_desc=На оружии или в колчане: замораживает клетку цели.
plants.kiwivetch.spice_desc=Как приправа: вызывает буйный рост растений на ближайшей свободной клетке.
plants.kiwivetch.poison_desc=На оружии или в колчане: вызывает буйный рост растений у цели.
plants.larvaleaf.spice_desc=Как приправа: заражает вас жуками на 4 хода.
plants.larvaleaf.poison_desc=На оружии или в колчане: заражает цель жуками.
plants.lavenderlantern.spice_desc=Как приправа: ослепляет существ на всём этаже на 4–9 ходов.
plants.lavenderlantern.poison_desc=На оружии или в колчане: ослепительная вспышка поражает весь этаж, включая вас.
plants.lightninglily.spice_desc=Как приправа: бьёт молнией в направлении ближайшей свободной клетки.
plants.lightninglily.poison_desc=На оружии или в колчане: молния ударяет от атакующего к цели.
plants.mageroyal.spice_desc=Как приправа: даёт магическое зрение на 4 хода.
plants.mageroyal.poison_desc=На оружии или в колчане: даёт атакующему магическое зрение на 4 хода.
plants.musclemoss.spice_desc=Как приправа: отбрасывает вас от ближайших существ.
plants.musclemoss.poison_desc=На оружии или в колчане: отбрасывает цель от ближайших существ, причиняя урон при столкновении.
plants.nightshadeonion.spice_desc=Как приправа: создаёт скрывающий туман на ближайшей свободной клетке.
plants.nightshadeonion.poison_desc=На оружии или в колчане: создаёт скрывающий туман у цели.
plants.parasiteshrub.spice_desc=Как приправа: даёт паразитический симбиоз на 4 хода.
plants.parasiteshrub.poison_desc=На оружии или в колчане: заражает цель паразитами.
plants.peanutpetal.spice_desc=Как приправа: даёт эффект «Ореховая метка» на 4 хода.
plants.peanutpetal.poison_desc=На оружии или в колчане: накладывает на цель «Ореховую метку».
plants.phaseshift.spice_desc=Как приправа: создаёт воду колодца превращения на ближайшей свободной клетке.
plants.phaseshift.poison_desc=На оружии или в колчане: создаёт воду колодца превращения рядом с целью.
plants.poppoplar.spice_desc=Как приправа: создаёт облако взрывного газа на ближайшей свободной клетке.
plants.poppoplar.poison_desc=На оружии или в колчане: создаёт облако взрывного газа у цели.
plants.rose.spice_desc=Как приправа: даёт барьер из роз на 4 хода.
plants.rose.poison_desc=На оружии или в колчане: покрывает цель шипами, сила которых зависит от урона атаки.
plants.rotberry.spice_desc=Как приправа: у ваших ног появляется семя гнилоягоды.
plants.rotberry.poison_desc=На оружии или в колчане: наносит дополнительный удар с уроном, равным урону атаки.
plants.shadowbloom.spice_desc=Как приправа: даёт защиту теней на 4 хода.
plants.shadowbloom.poison_desc=На оружии или в колчане: окутывает цель защитными тенями.
plants.snowhedge.spice_desc=Как приправа: накладывает эффект «В снежном плену» на 4 хода.
plants.snowhedge.poison_desc=На оружии или в колчане: вызывает у цели снежную бурю.
plants.sorrowmoss.spice_desc=Как приправа: даёт ядовитое усиление на 4 хода.
plants.sorrowmoss.poison_desc=На оружии или в колчане: отравляет цель. Существа с сопротивлением яду могут избежать эффекта.
plants.sourpitcher.spice_desc=Как приправа: накладывает эффект «Переваривание» на 4 хода.
plants.sourpitcher.poison_desc=На оружии или в колчане: накладывает на цель эффект «Переваривание».
plants.starflower.spice_desc=Как приправа: восстанавливает заряды палочек в течение 4 ходов.
plants.starflower.poison_desc=На оружии или в колчане: наносит дополнительный удар с уроном, равным урону атаки.
plants.steamweed.spice_desc=Как приправа: даёт эффект «В пару» на 4 хода.
plants.steamweed.poison_desc=На оружии или в колчане: накладывает эффект «Пар», мощность которого зависит от урона атаки.
plants.stormvine.spice_desc=Как приправа: даёт левитацию на 4 хода.
plants.stormvine.poison_desc=На оружии или в колчане: вызывает у цели головокружение.
plants.sunbloom.spice_desc=Как приправа: освещает вас на 20 ходов.
plants.sunbloom.poison_desc=На оружии или в колчане: уничтожает уязвимую к эффекту нежить.
plants.suncarnivore.spice_desc=Как приправа: создаёт луч чистого солнечного света на ближайшей свободной клетке.
plants.suncarnivore.poison_desc=На оружии или в колчане: создаёт чистый солнечный свет у цели и уничтожает уязвимую нежить.
plants.sungrass.spice_desc=Как приправа: увеличивает запас здоровья на 4 ед.
plants.sungrass.poison_desc=На оружии или в колчане: заставляет цель пустить побеги.
plants.swiftthistle.spice_desc=Как приправа: даёт ускорение на 4 хода.
plants.swiftthistle.poison_desc=На оружии или в колчане: оглушает цель.
plants.tankcabbage.spice_desc=Как приправа: поджигает вас пламенем галометана.
plants.tankcabbage.poison_desc=На оружии или в колчане: вызывает у цели пламя галометана.
plants.tomatobush.spice_desc=Как приправа: вызывает взрыв помидоров вокруг вас.
plants.tomatobush.poison_desc=На оружии или в колчане: вызывает взрыв помидоров у цели.
plants.venusflytrap.spice_desc=Как приправа: даёт небольшое исцеление выделениями растения.
plants.venusflytrap.poison_desc=На оружии или в колчане: исцеляет цель выделениями растения.
plants.waterweed.spice_desc=Как приправа: затапливает соседние клетки, если это возможно.
plants.waterweed.poison_desc=На оружии или в колчане: затапливает клетку цели, если это возможно.
plants.willowcane.spice_desc=Как приправа: замедляет вас на 4 хода.
plants.willowcane.poison_desc=На оружии или в колчане: замедляет живые цели.
plants.witherfennel.spice_desc=Как приправа: накладывает на вас увядание на 4 хода.
plants.witherfennel.poison_desc=На оружии или в колчане: накладывает увядание на цель.
