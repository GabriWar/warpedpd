plants.blandfruitbush.name=blandfruit
plants.blandfruitbush.desc=Distant cousin of the rotberry, the pear-shaped produce of the blandfruit bush tastes like caked dust. The fruit is gross and unsubstantial but isn't poisonous. Perhaps it could be cooked.
plants.blandfruitbush.discover_hint=You can find this plant randomly in the dungeon.
plants.blandfruitbush$seed.name=seed of blandfruit

plants.blindweed.name=blindweed
plants.blindweed.desc=Upon being touched a blindweed perishes in a bright flash of light. The flash is strong enough to disorient for several seconds.
plants.blindweed.warden_desc=_The Warden_ will channel a blindweed's energy into a temporary shroud of invisibility, instead of being disoriented.
plants.blindweed$seed.name=seed of blindweed

plants.mageroyal.name=mageroyal
plants.mageroyal.refreshed=You feel refreshed.
plants.mageroyal.desc=The mageroyal's prickly flowers contain a chemical which is known for its properties as a strong neutralizing agent. Anything that steps in this plant will be cleansed of many negative effects.
plants.mageroyal.warden_desc=In addition to the neutralizing effect, _the Warden_ will become temporarily immune to all area-bound effects when stepping on mageroyal.
plants.mageroyal$seed.name=seed of mageroyal

plants.earthroot.name=earthroot
plants.earthroot.desc=When a creature touches an earthroot, its roots create a kind of immobile natural armor around it.
plants.earthroot.warden_desc=The roots of an earthroot plant will move with _the Warden_, providing her mobile barkskin armor.
plants.earthroot$seed.name=seed of earthroot
plants.earthroot$armor.name=herbal armor
plants.earthroot$armor.desc=A kind of natural, immobile armor made of bark and twine.\n\nThis herbal armor will block %d damage from any physical hit, until it eventually runs out of durability and collapses.\n\nAs the armor is immobile, moving will cause it to break apart and be lost.\n\nArmor remaining: %d.

plants.fadeleaf.name=fadeleaf
plants.fadeleaf.desc=Touching a fadeleaf will teleport any creature to a random place on the current level.
plants.fadeleaf.warden_desc=The teleportation effect of fadeleaf is more potent for _the Warden_, teleporting her back to the end of the previous dungeon level.
plants.fadeleaf$seed.name=seed of fadeleaf

plants.firebloom.name=firebloom
plants.firebloom.desc=When something touches a firebloom, it bursts into flames.
plants.firebloom.warden_desc=When she tramples a firebloom, _the Warden_ will be briefly imbued with flame instead of being harmed.
plants.firebloom$seed.name=seed of firebloom

plants.icecap.name=icecap
plants.icecap.desc=Upon being touched, an icecap lets out a puff of freezing pollen. The freezing effect is much stronger if the environment is wet.
plants.icecap.warden_desc=When she tramples an icecap, _the Warden_ will be briefly imbued with frost instead of being harmed.
plants.icecap$seed.name=seed of icecap

plants.plant.warden_desc=This plant has no special effect when used by the Warden.
plants.plant.discover_hint=You can find this plant randomly in the dungeon, or grow it from its associated seed.
plants.plant$seed.seed_of=seed of %s
plants.plant$seed.ac_plant=PLANT
plants.plant$seed.ac_eat=EAT
plants.plant$seed.seed_eaten=You munch on the %s seed.
plants.plant$seed.info=Throw this seed to the place where you want to grow a plant.\n\n%s
plants.plant$seed.farm_desc=_Farming:_ sown on tilled soil in the safe zone, it ripens over about _%1$d turns_ per cycle, dropping up to _%2$d seeds_ total, with a _%3$d%% chance_ to wither fruitless each cycle.
plants.plant$seed.farm_water=This crop loves moisture: _water tiles adjacent_ to the plot make it grow faster and far less likely to wither.
plants.plant$seed$placeholder.name=seed

plants.rotberry.name=rotberry
plants.rotberry.desc=The berries of a young rotberry shrub taste like sweet, sweet death. Over a few years, this rotberry shrub will grow into another rot heart. When trampled, a young rotberry will produce a small puff of toxic gas.
plants.rotberry.warden_desc=Normally a rotberry bush only produces a little gas when trampled, but _the Warden_ is able to harness energy from it to temporarily boost her strength!
plants.rotberry.discover_hint=You can grow this plant from its associated seed during a specific quest.
plants.rotberry$seed.name=seed of rotberry
plants.rotberry$seed.discover_hint=You can find this item during a specific quest.

plants.sorrowmoss.name=sorrowmoss
plants.sorrowmoss.desc=A sorrowmoss is a flower (not a moss) with razor-sharp petals, coated with a deadly venom.
plants.sorrowmoss.warden_desc=When she tramples a sorrowmoss, _the Warden_ will be briefly imbued with toxin instead of being harmed.
plants.sorrowmoss$seed.name=seed of sorrowmoss

plants.starflower.name=starflower
plants.starflower.desc=A rare plant, starflower is said to grant holy power to whomever touches it.
plants.starflower.warden_desc=In addition to being blessed, _the Warden_ will gain a significant amount of wand recharging when she tramples a starflower.
plants.starflower$seed.name=seed of starflower

plants.stormvine.name=stormvine
plants.stormvine.desc=Gravity affects the stormvine plant strangely, allowing its whispy blue tendrils to 'hang' on the air. Anything caught in the vine is affected by this, and becomes disoriented.
plants.stormvine.warden_desc=_The Warden_ is able to control the gravitational effect of stormvine, and will briefly levitate when she tramples one.
plants.stormvine$seed.name=seed of stormvine

plants.sungrass.name=sungrass
plants.sungrass.desc=Sungrass is renowned for its sap's slow but effective healing properties.
plants.sungrass.warden_desc=_The Warden_ can receive healing from trampled sungrass even if she moves away from it.
plants.sungrass$seed.name=seed of sungrass
plants.sungrass$health.name=herbal healing
plants.sungrass$health.desc=Sungrass possesses excellent healing properties, though it is much slower than a potion of healing.\n\nMoving off the plant will break the healing effect.\n\nHealing remaining: %d.

plants.dreamfoil.name=dreamfoil
plants.dreamfoil.refreshed=You feel refreshed.
plants.dreamfoil.desc=The Dreamfoil's prickly flowers contain a chemical which is known for its properties as a strong neutralizing agent. Most weaker creatures are overwhelmed and knocked unconscious, which gives the plant its namesake.
plants.dreamfoil$seed.name=seed of dreamfoil

plants.dewcatcher.name=dewcatcher
plants.dewcatcher.desc=Grown from sparkling crystal seeds, Dewcatchers camouflage as grass to avoid attention, but their bulges of collected dew give them away. Shake them to harvest dew from their leaves.
plants.dewcatcher$seed.name=seed of dewcatcher

plants.phaseshift.name=phase pitcher
plants.phaseshift.desc=The phase pitcher plant has an unusual connection to the transmutative energies of the dungeon. When planted, it creates a small well of transmutation at its roots.
plants.phaseshift$seed.name=seed of phase pitcher

plants.flytrap.name=upgrade eater
plants.flytrap.desc=The upgrade eater is a carnivorous plant that feeds on magical energy. When planted, it creates a small well that can consume enchanted items and occasionally produce useful upgrade material.
plants.flytrap$seed.name=seed of upgrade eater

plants.swiftthistle.name=swiftthistle
plants.swiftthistle.desc=When trampled, swiftthistle will briefly accelerate the flow of time around it, allowing the trampler to perform several actions instantly.
plants.swiftthistle.warden_desc=In addition to gaining instantaneous actions, _the Warden_ will also get a brief haste boost when trampling swiftthistle.
plants.swiftthistle$seed.name=seed of swiftthistle
plants.swiftthistle$timebubble.name=time bubble
plants.swiftthistle$timebubble.desc=A small bubble of accelerated time, allowing actions to be performed instantly. Attacking or using magic will break this effect however.\n\nTurns remaining: %s.

plants.snowhedge.name=snowhedge
plants.snowhedge.desc=The snowhedge is known to unleash a snowstorm when threatened. Its icy blast will freeze anything nearby.
plants.snowhedge$seed.name=seed of snowhedge

plants.frostcorn.name=frostcorn
plants.frostcorn.desc=When something touches a frostcorn, it will be imbued with a frosty aura. Alchemists stock up on these plants before visiting hot regions.
plants.frostcorn.warden_desc=_The Warden_ receives an extended frost imbue effect from frostcorn.
plants.frostcorn$seed.name=seed of frostcorn

plants.willowcane.name=willowcane
plants.willowcane.desc=The willowcane releases pheromones that make everything very lethargic. Its soporific effect slows and drowses nearby creatures.
plants.willowcane$seed.name=seed of willowcane

plants.rose.name=rose
plants.rose.desc=Roses have charming magic going through their veins. When triggered, nearby enemies become charmed and distracted.
plants.rose$seed.name=seed of rose

plants.clitbalm.name=clitbalm
plants.clitbalm.desc=The clitbalm emits pheromones that charm nearby enemies, making them temporarily infatuated with whoever triggered the plant.
plants.clitbalm$seed.name=seed of clitbalm

plants.hypnohemp.name=hypnohemp
plants.hypnohemp.desc=The hypnohemp makes hypnotic control possible. Its spores drive nearby creatures into a violent frenzy, turning them against each other.
plants.hypnohemp$seed.name=seed of hypnohemp

plants.sunbloom.name=sunbloom
plants.sunbloom.desc=The sunbloom contains the power of concentrated light. When destroyed, it releases a blinding flash that is especially devastating to undead creatures.
plants.sunbloom$seed.name=seed of sunbloom

plants.dirtdaisy.name=dirtdaisy
plants.dirtdaisy.desc=The dirtdaisy is a plant that causes giant dirt clouds when triggered, blocking vision in the surrounding area.
plants.dirtdaisy$seed.name=seed of dirtdaisy

plants.grassvine.name=grassvine
plants.grassvine.desc=The grassvine regrows flora around it when disturbed, converting barren ground into tall grass and rooting anything that triggered it.
plants.grassvine$seed.name=seed of grassvine

plants.witherfennel.name=witherfennel
plants.witherfennel.desc=This plant releases a deadly poison that can seriously cripple organisms. It also withers nearby grass and plants.
plants.witherfennel$seed.name=seed of witherfennel

plants.crimsonpepper.name=crimsonpepper
plants.crimsonpepper.desc=This plant contains a large amount of volatile pepper that bursts into the air, igniting everything nearby in flames.
plants.crimsonpepper$seed.name=seed of crimsonpepper

plants.nightshadeonion.name=nightshadeonion
plants.nightshadeonion.desc=The thick layers of nightshadeonion are filled with a strange liquid. When destroyed, they produce a dense fog which completely blocks vision.
plants.nightshadeonion$seed.name=seed of nightshadeonion

plants.steamweed.name=steamweed
plants.steamweed.desc=The steamweed can conjure up whole storm clouds with the steam it releases. The dwarves use this plant to power their machines.
plants.steamweed$seed.name=seed of steamweed

plants.kiwivetch.name=kiwivetch
plants.kiwivetch.desc=The kiwivetch will try to regrow the flora around it when destroyed, spreading lush vegetation across the area.
plants.kiwivetch$seed.name=seed of kiwivetch

plants.gobgrape.name=gobgrape
plants.gobgrape.desc=The gobgrape bush produces small, sweet berries that are a favorite snack of goblins. When triggered, its ripe fruit falls to the ground.
plants.gobgrape$seed.name=seed of gobgrape

plants.peanutpetal.name=peanutpetal
plants.peanutpetal.desc=The peanutpetal grows nutritious nuts inside its flower petals. When disturbed, the nuts scatter to the ground.
plants.peanutpetal$seed.name=seed of peanutpetal

plants.eggbloom.name=eggbloom
plants.eggbloom.desc=The eggbloom produces egg-shaped berries with a surprisingly rich taste. Adventurers consider finding one a stroke of good luck.
plants.eggbloom$seed.name=seed of eggbloom

plants.cornwheat.name=cornwheat
plants.cornwheat.desc=A hardy grain plant that thrives even in the dungeon's darkness. When triggered, it drops a small ration of food.
plants.cornwheat$seed.name=seed of cornwheat

plants.musclemoss.name=musclemoss
plants.musclemoss.desc=This moss stores kinetic energy in its thick stalks. When disturbed, it releases a powerful shockwave that knocks creatures back.
plants.musclemoss$seed.name=seed of musclemoss

plants.butterlion.name=butterlion
plants.butterlion.desc=The butterlion is a volatile plant that shakes the ground violently when triggered, damaging and disorienting everything nearby.
plants.butterlion$seed.name=seed of butterlion

plants.flowertree.name=flowertree
plants.flowertree.desc=The flowertree is a miniature tree that produces seeds of other plants. When triggered, it drops a random seed.
plants.flowertree$seed.name=seed of flowertree

plants.grasslilly.name=grasslilly
plants.grasslilly.desc=The grasslilly channels the essence of other plants. When triggered, it produces a random plant effect, making it completely unpredictable.
plants.grasslilly$seed.name=seed of grasslilly

plants.goograss.name=goograss
plants.goograss.desc=The goograss is covered in a thick, caustic slime. Anything that touches it becomes coated in corrosive ooze.
plants.goograss$seed.name=seed of goograss

plants.sourpitcher.name=sourpitcher
plants.sourpitcher.desc=The sourpitcher plant secretes a highly acidic liquid from its pitcher-shaped leaves. Contact with this acid causes painful corrosion.
plants.sourpitcher$seed.name=seed of sourpitcher

plants.tomatobush.name=tomatobush
plants.tomatobush.desc=The tomatobush stores pressurized juice inside its oversized fruit. When triggered, the tomatoes explode violently, damaging everything nearby.
plants.tomatobush$seed.name=seed of tomatobush

plants.blueeyedsusan.name=blue-eyed susan
plants.blueeyedsusan.desc=The blue-eyed susan radiates a gentle purifying light. When triggered by a hero, it cleanses curses from equipped items.
plants.blueeyedsusan$seed.name=seed of blue-eyed susan

plants.lavenderlantern.name=lavender lantern
plants.lavenderlantern.desc=The lavender lantern emits an intense flash of purple light when disturbed. The flash is powerful enough to blind all nearby creatures.
plants.lavenderlantern$seed.name=seed of lavender lantern

plants.apricobush.name=apricot bush
plants.apricobush.desc=The apricot bush produces soothing nectar that promotes natural healing. When triggered, it applies a regeneration effect to whoever steps on it.
plants.apricobush$seed.name=seed of apricot bush

plants.ballcrop.name=ball crop
plants.ballcrop.desc=The ball crop stores kinetic energy in its bulbous fruit. When triggered, it releases a shockwave that knocks back anything standing on it.
plants.ballcrop$seed.name=seed of ball crop

plants.bananabean.name=banana bean
plants.bananabean.desc=The banana bean secretes a slippery substance from its peel-like leaves. Stepping on it causes disorientation and loss of balance.
plants.bananabean$seed.name=seed of banana bean

plants.blackholeflower.name=black hole flower
plants.blackholeflower.desc=The black hole flower warps space around itself. When triggered, it damages the victim and teleports them to a random location on the floor.
plants.blackholeflower$seed.name=seed of black hole flower

plants.chandaliertail.name=chandelier tail
plants.chandaliertail.desc=The chandelier tail glows with a warm, steady light. When triggered, it grants the Light buff, illuminating the surroundings.
plants.chandaliertail$seed.name=seed of chandelier tail

plants.chillisnapper.name=chilli snapper
plants.chillisnapper.desc=The chilli snapper is a fiery plant that erupts in flames when disturbed. It sets fire to anything nearby and ignites the ground.
plants.chillisnapper$seed.name=seed of chilli snapper

plants.clockcypress.name=clock cypress
plants.clockcypress.desc=The clock cypress manipulates the flow of time around it. When triggered, it slows down all visible enemies, giving you a tactical advantage.
plants.clockcypress$seed.name=seed of clock cypress

plants.cocostuft.name=cocos tuft
plants.cocostuft.desc=The cocos tuft has a hard, protective shell. Heroes who trigger it gain a protective barrier, while enemies are crippled by the sharp shell fragments.
plants.cocostuft$seed.name=seed of cocos tuft

plants.combflower.name=comb flower
plants.combflower.desc=The comb flower attracts and houses a golden bee within its honeycomb-like petals. When triggered, the bee emerges as an ally to fight alongside you.
plants.combflower$seed.name=seed of comb flower

plants.crimsoncrown.name=crimson crown
plants.crimsoncrown.desc=The crimson crown is a thorny plant that inflicts deep wounds. When triggered, it causes heavy bleeding and sets the area ablaze.
plants.crimsoncrown$seed.name=seed of crimson crown

plants.eyeeuonymus.name=eye euonymus
plants.eyeeuonymus.desc=The eye euonymus has peculiar eye-shaped berries that grant supernatural perception. When triggered by a hero, it grants mind vision, revealing all creatures on the floor.
plants.eyeeuonymus$seed.name=seed of eye euonymus

plants.feelerfern.name=feeler fern
plants.feelerfern.desc=The feeler fern extends its fronds into the earth, promoting rapid plant growth around it. It also grants enhanced awareness to those who trigger it.
plants.feelerfern$seed.name=seed of feeler fern

plants.firefoxglove.name=firefoxglove
plants.firefoxglove.desc=The firefoxglove is an extremely volatile plant. When triggered, it detonates like a firebomb, engulfing the area in flames.
plants.firefoxglove$seed.name=seed of firefoxglove

plants.larvaleaf.name=larva leaf
plants.larvaleaf.desc=The larva leaf hosts parasitic organisms within its veins. When triggered, it infects the victim with toxic parasites that slowly drain their health.
plants.larvaleaf$seed.name=seed of larva leaf

plants.lightninglily.name=lightning lily
plants.lightninglily.desc=The lightning lily crackles with stored electrical energy. When triggered, it discharges a bolt of lightning at whoever disturbed it.
plants.lightninglily$seed.name=seed of lightning lily

plants.parasiteshrub.name=parasite shrub
plants.parasiteshrub.desc=Best not to step on this one. Triggering the parasite shrub saddles you with a draining parasitic infection, and its seed does the same to any enemy it strikes. Only a Warden turns the bond to their favour on contact - or anyone who eats the seed as a spice, gaining a parasitic symbiosis that doubles movement speed and heals when it lets go.
plants.parasiteshrub$seed.name=seed of parasite shrub

plants.poppoplar.name=pop poplar
plants.poppoplar.desc=The pop poplar is packed with pressurized sap. When triggered, it explodes violently, dealing heavy damage to everything in the immediate area.
plants.poppoplar$seed.name=seed of pop poplar

plants.shadowbloom.name=shadowbloom
plants.shadowbloom.desc=The shadowbloom thrives in darkness and manipulates shadow. When triggered by a hero, it creates a mirror image. Enemies are blinded by its dark mist.
plants.shadowbloom$seed.name=seed of shadowbloom

plants.suncarnivore.name=suncarnivore
plants.suncarnivore.desc=The suncarnivore channels concentrated sunlight. It is especially deadly to undead creatures, which it can destroy instantly. Living creatures suffer burns and temporary blindness.
plants.suncarnivore$seed.name=seed of suncarnivore

plants.tankcabbage.name=tank cabbage
plants.tankcabbage.desc=The tank cabbage stores flammable gases within its thick leaves. When triggered, it releases a burst of fire that ignites everything nearby.
plants.tankcabbage$seed.name=seed of tank cabbage

plants.venusflytrap.name=venus flytrap
plants.venusflytrap.desc=The venus flytrap ensnares its victims with powerful jaws. When triggered, it roots the victim in place and deals damage as it attempts to digest them.
plants.venusflytrap$seed.name=seed of venus flytrap

plants.waterweed.name=waterweed
plants.waterweed.desc=The waterweed draws moisture from deep underground. When triggered, it floods the surrounding area, converting nearby floor tiles into water.
plants.waterweed$seed.name=seed of waterweed

plants.butterlion.ondeath=You were crushed by stones!
plants.butterlion.rankings_desc=Crushed to Death
plants.tomatobush.died=You got killed by a tomato explosion!
plants.tomatobush.explode=A tomato bush explosion tossed flesh pulp all over the dungeon.
