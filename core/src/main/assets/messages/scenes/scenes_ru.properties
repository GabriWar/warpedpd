scenes.supporterscene.title=Поддержать игру
scenes.supporterscene.intro=Warped Pixel Dungeon создаёт один человек — с любовью к игре и с гораздо большим количеством кофе, чем следовало бы. _Здесь нет рекламы, и за игровой контент не нужно платить_: все этажи, предметы и герои доступны каждому. Подписка на поддержку — добровольный ежемесячный взнос, который помогает разрабатывать обновления и оплачивать серверы, соединяющие игроков из разных уголков мира. Поддержавшие проект получают:
scenes.supporterscene.patreon_msg=Разработка и развитие Warped Pixel Dungeon требуют много времени и увлечённости. Если вам нравится исследовать подземелье и хочется поддержать новые материалы, механики и необычные эксперименты, угостите разработчика кофе на _Ko-fi_!\n\nЛюбая поддержка очень важна и помогает сделать игру лучше. Спасибо, что проходите этот путь вместе со мной!
scenes.supporterscene.patreon_english=(Обратите внимание, что награды Patreon доступны только на английском языке.)
scenes.supporterscene.supporter_link=Поддержать на Ko-fi

