# Дополнение русского перевода: пакет 500 ключей
scenes.aboutscene.debug_unlocked=Режим отладки разблокирован! Загляните в настройки игры.
scenes.aboutscene.debug_already=Режим отладки уже разблокирован. Кнопка «Отладка» находится в игровом меню, а переключатель инспектора — в настройках.
scenes.enchantingscene.text=Положите на пьедестал оружие или броню!
scenes.enchantingscene.tap_slot=Коснитесь пьедестала, чтобы выбрать опознанное оружие или броню.
scenes.enchantingscene.sub_weapon=Оружие: зачарований %1$d из %2$d
scenes.enchantingscene.empty_desc_weapon=Потратьте _%d ед. энергии_, чтобы увидеть три возможных зачарования для этого слота, а затем бесплатно выбрать одно из них.
scenes.enchantingscene.empty_desc_armor=Потратьте _%d ед. энергии_, чтобы увидеть три возможные руны для этого слота, а затем бесплатно выбрать одну из них.
scenes.enchantingscene.second_desc=Откроется, когда первый слот будет заполнен магическим плетением.
scenes.enchantingscene.unweave_msg_weapon=Удалить все зачарования этого оружия за _%d ед. алхимической энергии_? Само оружие и его улучшения сохранятся. Отменить действие нельзя.
scenes.enchantingscene.unweave_msg_armor=Удалить все руны с этой брони за _%d ед. алхимической энергии_? Сама броня и её улучшения сохранятся. Отменить действие нельзя.
scenes.enchantingscene.choose_msg=Выберите одно из трёх для свободного слота. Доплачивать не нужно: просмотр уже оплачен.
scenes.enchantingscene.choose_reroll_msg=Выберите одно из трёх вместо _%s_. Уровень слота сохранится. Доплачивать не нужно: просмотр уже оплачен.
scenes.enchantingscene.leave_msg=Вы потратили %d ед. энергии, чтобы увидеть эти три варианта. Пьедестал их не сохраняет: если закрыть окно, они исчезнут. За новый набор снова придётся заплатить.
scenes.changesscene.base_body=Warped создана на основе Shattered Pixel Dungeon Эвана Дебенхэма. Вкладки от 3.X и ниже содержат историю изменений Shattered в авторской редакции. Даты, планы и комментарии принадлежат её разработчику и относятся к исходной игре, а не к Warped. Изменения самой Warped перечислены на вкладке WPD.
scenes.gamescene.full_moon=Взошла полная луна — мертвецы не находят покоя.
scenes.gamescene.blood_moon=Кровавая луна повисла над миром — мертвецы жаждут добычи.
scenes.gamescene.new_moon=Новолуние — во тьме пробуждаются ужасы.
scenes.gamescene.tutorial_guide_mobile=Коснитесь мигающей кнопки журнала в правом верхнем углу, чтобы прочитать только что найденную страницу.
scenes.gamescene.tutorial_guide_desktop=Нажмите мигающую кнопку журнала (%s) в правом верхнем углу, чтобы прочитать только что найденную страницу.
scenes.gamescene.guide_hint_mobile=В вашем «Путеводителе по спуску» есть подсказка на этот случай. Коснитесь мигающей кнопки журнала в правом верхнем углу.
scenes.gamescene.guide_hint_desktop=В вашем «Путеводителе по спуску» есть подсказка на этот случай. Нажмите мигающую кнопку журнала (%s) в правом верхнем углу.
scenes.heroselectscene.rename_body=Введите имя персонажа или оставьте поле пустым, чтобы использовать название класса по умолчанию.
scenes.interlevelscene$mode.port1=Переход в Страну мёртвых
scenes.interlevelscene$mode.port2=Переход в Страну живых
scenes.guidescene.no_match=В путеводителе пока ничего не сказано о «%s».
scenes.guidescene.locked_body=_%s._\n\nЧернила на этих страницах отказываются складываться в слова. Подземелье не раскроет того, чего вам ещё не довелось пережить.
scenes.guidescene.root_body=В переплёте собрано %1$d из %2$d страниц, причём %3$d из них вы ещё не читали. Они будут светиться, пока вы их не откроете.\n\nКоснитесь главы, чтобы открыть её, и страницы, чтобы прочитать. Перетаскивайте изображение для просмотра; сводите и разводите пальцы, прокручивайте колесо или используйте кнопки для изменения масштаба.
scenes.supporterscene.store_msg=Разработка Warped Pixel Dungeon требует много времени и сил, а серверы, которые соединяют игроков из разных мест, каждый месяц стоят реальных денег. Если вам нравится исследовать подземелье, ваша поддержка поможет оплачивать серверы и создавать новые возможности.\n\nИгра в любом случае останется бесплатной, включая совместную игру по локальной сети. Спасибо, что проходите этот путь вместе с нами!
scenes.supporterscene.perk_online=_Играйте с друзьями из любого места_ — подключайтесь к нашей серверной комнате по коду без сложной настройки. Совместная игра в собственной сети всегда бесплатна для всех.
scenes.supporterscene.perk_vote=_Голосование за новые возможности_ — подписчики выбирают, что разрабатывать дальше, и влияют на план обновлений.
scenes.supporterscene.perk_updates=_Ранний доступ к обновлениям_ — подписчики первыми получают новые сборки и материалы.
scenes.supporterscene.perk_bugs=_Приоритет при рассмотрении ошибок_ — сообщения подписчиков попадают в начало очереди.
scenes.supporterscene.perk_discord=_Прямая связь со мной_ — мой личный Discord для сообщений, а также роль вашего уровня подписки и особый канал на Discord-сервере игры.
scenes.supporterscene.perk_design=_Участие в разработке_ — обсуждайте баланс и игровые решения вместе со мной по мере их принятия.
scenes.supporterscene.outro=Каждая подписка для меня бесценна — именно она помогает оплачивать серверы. Спасибо, что поддерживаете развитие Warped!
scenes.supporterscene.already_supporter=Вы поддерживаете игру — спасибо! Теперь вы можете играть с друзьями из любого места, влиять на будущие обновления, быстрее получать ответы на сообщения об ошибках и первыми пробовать новые сборки.
scenes.supporterscene.store_unavailable=Сейчас магазин недоступен. Как только соединение восстановится, здесь появятся уровни поддержки. Спасибо за желание помочь игре!
scenes.supporterscene.sub_terms=Каждый уровень поддержки — это ежемесячная подписка с оплатой через %s. Она автоматически продлевается по той же цене, пока вы её не отмените. После отмены новые списания прекратятся, а доступ сохранится до конца оплаченного месяца.
scenes.supporterscene.restore_done=Статус подписчика восстановлен. Ещё раз спасибо за поддержку!
scenes.supporterscene.restore_none=Для этой учётной записи не найдена активная подписка.
scenes.supporterscene.donate_thanks=Спасибо за поддержку Warped Pixel Dungeon! Теперь вы можете играть с друзьями из любого места.
scenes.supporterscene.donate_fail=Не удалось завершить покупку. Деньги не списаны.
