scenes.changesscene.base_body=O Warped é feito sobre o Shattered Pixel Dungeon, de Evan Debenham. As abas do 3.X para trás são o histórico de mudanças do próprio Shattered, mantido como ele escreveu: as datas, os planos e os comentários são dele e descrevem o jogo base, não o Warped. As mudanças do Warped ficam na aba WPD.
