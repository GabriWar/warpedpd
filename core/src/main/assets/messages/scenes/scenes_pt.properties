scenes.supporterscene.store_msg=Manter o Warped PD vivo exige muito tempo e paixão, e os servidores que conectam jogadores distantes custam dinheiro de verdade todo mês. Se você está curtindo a masmorra, virar apoiador financia o que vem por aí e paga essa conta.\n\nO jogo inteiro continua grátis de qualquer jeito, co-op local incluído. Obrigado por fazer parte dessa caminhada!
scenes.supporterscene.perk_online=_Jogue com amigos distantes_: um código de sala conecta vocês pelo nosso servidor, sem nada para configurar. O co-op na sua própria rede é grátis para todo mundo, sempre.
scenes.supporterscene.perk_vote=_Votação de recursos_: os apoiadores escolhem o que vai ser feito a seguir, e essas escolhas guiam os planos do jogo.
scenes.supporterscene.perk_updates=_Atualizações prioritárias_: os apoiadores recebem versões e conteúdo novos primeiro.
scenes.supporterscene.perk_bugs=_Relatórios prioritários_: seus relatórios de bug passam para a frente da fila.
scenes.supporterscene.perk_design=_Voz no design_: opine sobre balanceamento e decisões de design enquanto elas acontecem.
scenes.supporterscene.outro=Cada contribuição significa muito, e é ela que paga os servidores. Obrigado por manter a masmorra distorcida!
