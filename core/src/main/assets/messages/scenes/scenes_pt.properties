scenes.guidescene.root_body=A encadernação guarda %1$d das suas %2$d páginas, e %3$d delas você ainda não leu. Elas brilham até você ler.\n\nToque num capítulo para abri-lo e numa página para lê-la. Arraste para olhar em volta; use dois dedos, a rolagem ou os botões para dar zoom.
