# Russian localization — next 500 keys
actors.mobs.npcs.blackmarketdealer.desc=Капюшон, низко опущенный фонарь и пара рук, которые никогда не оказываются на виду одновременно. Всё, что лежит под прилавком, попало сюда дорогами, неизвестными городским сборщикам налогов. Продавец предпочёл бы, чтобы товар ушёл теми же путями.
actors.mobs.npcs.blackmarketdealer.net_host_only=Торговец смотрит мимо вас на того, у кого кошель. «Одна учётная книга. Один покупатель. Позовите своего приятеля».
actors.mobs.npcs.blackmarketdealer.opening=Вечер добрый. Дверь за собой прикройте.
actors.mobs.npcs.blackmarketdealer.provoked=Не в ту лавку пришли с таким. Для вас торговля окончена — здесь и везде.
actors.mobs.npcs.blackmarketdealer.banned=Слухи бегут быстрее вас. Ни один торговец больше не откроет для вас прилавок.
actors.mobs.npcs.blackmarketdealer.gone_dawn=Светает. Вы оборачиваетесь к прилавкам — за ними уже никого нет, и товар исчез.
actors.mobs.npcs.blackmarketdealer.gone_hostile=Торговец исчез. А вот нанятые им люди остались.
actors.mobs.marketbodyguard.desc=Ему платят за то, чтобы он всю ночь стоял на месте и не сводил с вас глаз. Кожа на нём добротная, а шрамы под ней старше доспеха. Он не начнёт драку первым. Но это не значит, что не сумеет её закончить.
actors.mobs.marketbodyguard.desc_hostile=Каковы бы ни были условия договора, они больше не действуют. За то, что предстоит, ему доплатили.
actors.mobs.marketbodyguard.line_b=Держите руки там, где их видно при свете фонаря.
actors.mobs.collector.desc=Худощавая фигура в красном — цвете долга, срок которого пришёл, — с латунной застёжкой у горла и терпеливым взглядом того, кому платят за возврат денег. Он не выслеживал вас. Ему просто сказали, где вас найти.\n\nКаждый его удар лишает вас монет. Всё, что он несёт, включая немалую долю денег, оставленных вами на рынке, сейчас находится при нём.
actors.mobs.collector.arrive=Вас заметили. Где-то на этом этаже кто-то уже направляется прямо к вам.
actors.mobs.collector.lifted=Сборщик долга забирает у вас %d золотых.
actors.mobs.collector.settled=Долг погашен. За вами больше никого не пошлют — пока не дадите нового повода.
windows.wndblackmarket.greet=Всё здесь с чего-нибудь свалилось. И ни на что не найдётся чека.
windows.wndblackmarket.sky_shadowday=День теней. Люблю такие дни. Сегодня я буду сговорчивее.
windows.wndblackmarket.sky_fullmoon=Сегодня слишком яркая луна. Мне вообще не стоило выходить. За свою дерзость вы заплатите сполна.
windows.wndblackmarket.sky_newmoon=Луны не видно. В такие ночи из рук в руки переходят вещи, у которых ещё и названий нет.
windows.wndblackmarket.sky_fog=На дороге хороший туман. Никто ничего не видел. Осмотритесь.
windows.wndblackmarket.sky_storm=В такую погоду половина моих людей не рискнула выйти в путь. Сегодня выбор невелик.
windows.wndblackmarket.heat_close=Один совет бесплатно: кое-кто уже начал о вас расспрашивать. Ещё одна сделка — и вопросы прекратятся.
windows.wndblackmarket.heat_hunted=Сборщик уже вышел за вами. Не моё дело. Ваши деньги здесь по-прежнему принимают.
windows.wndblackmarket.heat_tripped=Эта сделка была лишней. Рынок послал за вами сборщика долгов.
windows.wndblackmarket.contract_info=Три предмета _одного типа_ и _одной редкости_ ложатся на прилавок. Взамен вы получаете один предмет того же типа, но _на ступень редкости выше_. Какой именно — решает случай. Уровень улучшения будет равен самому низкому из трёх, а торговец возьмёт плату за услугу.
windows.wndblackmarket.fence_info=Он купит ненужные вещи _в полтора раза дороже_, чем обычная лавка, и не спросит, откуда вы их взяли. За предмет _легендарной_ редкости и выше расплатится _ядрами мастерства_, а не золотом.
windows.wndblackmarket.wheel_info=Колесо редкости кузнеца, только устроенное выгоднее для вас, чем у самого кузнеца. И платите вы золотом, а не ядрами. Один сектор на колесе _чёрный_. Всё, что на него выпадает, забирает заведение.
windows.wndblackmarket.fence_offer_gold=«%1$s. Дам _%2$d золотых_. И мы с вами не встречались».
windows.wndblackmarket.fence_offer_cores=«%1$s. За такое золотом не платят. _%2$d ядер мастерства_. И мы с вами не встречались».
windows.wndblackmarket.fence_done=Вещь исчезает раньше, чем затихает звон монет.
windows.wndmarketwares.terms=Коснитесь предмета, чтобы рассмотреть его. Больше торговец вам ничего не расскажет. _Возврата нет._
windows.wndmarketwares.sold_out=Прилавок пуст. «Приходите на следующей неделе».
windows.wndmarketwares.tip_desc=Он знает этот этаж лучше тех, кто его строил. За плату он отметит на вашей карте все _потайные двери_.
windows.wndmarketwares.tip_found=Не поднимая глаз, он отмечает на карте %d потайных дверей.
windows.wndmarketwares.tip_none=«Здесь уже нет ничего, чего вы не нашли бы сами. За пустые слова я денег не беру».
windows.wndtradeup.info=Три предмета одного типа и одной редкости. Коснитесь ячейки, чтобы положить предмет, и ещё раз — чтобы забрать его обратно.
windows.wndtradeup.outcome=Три предмета — %1$s %2$s — в обмен на один _%3$s_ %2$s с улучшением +%4$d. Плата: %5$d золотых.
windows.wndtradeup.signed=Три предмета скрываются под прилавком. Взамен торговец протягивает %s.
windows.wndtradeup.pick_more=Нужен ещё один предмет того же типа и редкости.
windows.wndriggedwheel.info=Ваша вещь %s стоит на кону. Один сектор принадлежит заведению.
windows.wndriggedwheel.seized=Шарик падает в чёрный сектор. Торговец накрывает ладонью вашу вещь %s. Сделка окончена.
actors.mobs.rivalstatue.desc=Статую отлили так, чтобы она в точности повторяла вашу стойку. Хват ваш, защита ваша, вот только оружие в её руках лучше вашего.
actors.mobs.rivalstatue.desc_weapon=Она держит _%1$s_ с мастерством, доступным лишь знатоку школы _%2$s_.
actors.mobs.npcs.temperinganvil.desc=Наковальня с отполированной ударами поверхностью стоит так близко к печи, что на ней можно жарить яйца. Похоже, здешний кузнец бросил работу на полпути.
actors.mobs.npcs.temperinganvil.desc_cold=Ваш предмет %s лежит на наковальне — тусклый и холодный.
actors.mobs.npcs.temperinganvil.desc_hot=Ваш предмет %s лежит на наковальне, раскалённый добела. Долго так продолжаться не должно.
actors.mobs.npcs.temperinganvil.desc_spent=По наковальне проходит сквозная трещина. Больше она ни на что не годится.
actors.mobs.npcs.temperinganvil.net_host_only=Работать с наковальней может только ведущий совместной игры.
actors.mobs.npcs.temperinganvil.white_hot=%s на наковальне раскаляется добела.
actors.mobs.npcs.temperinganvil.overheating=%s начинает сыпать искрами. Металл слишком долго находился в жару.
actors.mobs.npcs.temperinganvil.cooled=%s медленно остывает сам собой. Закалка не состоялась.
actors.mobs.npcs.temperinganvil.scorched=%s перегорел. Что-то ценное в металле безвозвратно исчезло.
actors.mobs.npcs.temperinganvil.blackened=%s чернеет и покрывается окалиной. Улучшать в нём было уже нечего.
actors.mobs.npcs.temperinganvil.tempered_line=При погружении %s в воду раздаётся громкое шипение пара. Одно из свойств предмета улучшено до предела.
actors.mobs.npcs.temperinganvil.tempered_step=При погружении %s в воду раздаётся громкое шипение пара. Предмет становится на шаг ближе к шедевру.
actors.mobs.npcs.temperinganvil.spent=Наковальня треснула насквозь. Ещё один предмет она не выдержит.
actors.mobs.npcs.temperinganvil.menu_cold=Ваш предмет %s холоден и лежит на наковальне. Холодный металл не закалить.
actors.mobs.npcs.temperinganvil.menu_hot=Ваш предмет %s раскалён добела. От такого жара будет толк, только если резко остудить металл.
actors.mobs.npcs.temperinganvil.burnt_hands=Вы хватаете раскалённый добела предмет %s голыми руками. Бывало, вам приходили идеи получше.
actors.mobs.npcs.temperinganvil.trough_frozen=Вода в корыте промёрзла насквозь. Закалять металл нечем.
actors.mobs.npcs.temperinganvil.trough_warm=Вода в корыте тёплая, как суп. %s погружается в неё почти без шипения и остаётся прежним.
actors.mobs.npcs.breakersbench.desc=Верстак, который много лет подряд нещадно били молотом. На одном конце закреплены тиски, поперёк лежит кувалда. Под ним — сборник блестящего лома: _%1$d из %2$d_ долей, необходимых для одного ядра.
actors.mobs.npcs.breakersbench.desc_forgeday=Сегодня кувалда тёплая на ощупь.
actors.mobs.npcs.breakersbench.confirm=Раз и навсегда разобрать предмет %1$s? Вы получите %2$s.
actors.mobs.npcs.breakersbench.yield_scrap=долю металлического лома (_%1$d из %2$d_)
actors.mobs.npcs.breakersbench.yield_scrap_core=последнюю долю лома: _%d ядер мастерства_
actors.mobs.npcs.breakersbench.got_scrap=Звонкий лом сыплется в сборник: %1$d из %2$d.
actors.mobs.npcs.breakersbench.got_resin=Палочка раскалывается вдоль волокон, из неё сочится смола.
actors.mobs.npcs.breakersbench.got_metal=Предмет распадается на %d ед. жидкого металла.
actors.mobs.npcs.breakersbench.got_core=В тисках остаётся что-то твёрдое и блестящее: %d ядер мастерства.
actors.mobs.npcs.breakersbench.got_core_forgeday=Кувалда звенит, словно колокол. В тисках остаётся %d ядер мастерства.
actors.blobs.pedigreeward.shattered=Стоит вам схватить одну вещь, как две другие рассыпаются на куски прямо там, где лежали.
actors.mobs.iceblock.desc=Глыба древнего льда, настолько прозрачная, что можно разглядеть содержимое, и настолько твёрдая, что звенит от удара.
actors.mobs.iceblock.inside_0=Недалеко от поверхности в лёд вмёрзло что-то _длинное_.
actors.mobs.iceblock.inside_1=В толще льда виднеется что-то _округлое_.
actors.mobs.iceblock.inside_2=В лёд вмёрзло что-то _небольшое_, не больше кулака.
actors.mobs.iceblock.stage_0=Лёд сухой на ощупь и обжигающе холодный.
actors.mobs.iceblock.stage_1=Поверхность глыбы покрылась влагой, под ней собралась маленькая лужица.
actors.mobs.iceblock.stage_2=Глыба растаяла наполовину. Скоро от неё ничего не останется.
actors.mobs.iceblock.thawed=Последний лёд тает, освобождая %s.
actors.mobs.iceblock.broke_out=Глыба раскалывается, освобождая %s.
actors.mobs.iceblock.broke_potion=Ледяная глыба разлетается на куски вместе с замёрзшим внутри предметом %s!
actors.mobs.iceblock.broke_scroll=Глыба раскалывается. Вместо свитка остаётся мокрая бумажная каша.
actors.blobs.thermalvent.desc=Здесь из больших глубин поднимается горячая вода, а над ней клубится густой пар.
actors.buffs.springsoak.desc=Жар источника прогрел вас до костей. Пока вы в воде, раны затягиваются, а холод отступает. За пределами купальни запасённое тепло защищает от холода примерно на %1$d градусов. Но в тёплый день жарче вам не станет.\n\nВыйдя из воды, вы, конечно, останетесь мокрым.\n\nХодов согревающего эффекта осталось: %2$d.
actors.blobs.bellowsdraft.desc=Здесь весь воздух движется в одном направлении — и так продолжается уже очень давно.
actors.blobs.bellowsdraft.enter=По штреку от двери к дальней стене безостановочно дует ровный ветер.
actors.buffs.draught.desc=Вы стоите на ветру, который постоянно дует _%s_.\n\nВсё, что брошено _по ветру_, летит точнее и бьёт намного сильнее. Броски _против ветра_ дают обратный результат.\n\nЛюбые взвешенные в воздухе вещества — газ, дым, пар — _уносятся по ветру_ на клетку за ход и скапливаются у дальней стены. Обратно сюда они не возвращаются.
actors.mobs.npcs.bellowsvalve.desc=Железный баллон по пояс человеку встроен в стену. Сверху — латунный вентиль, рядом — маленький индикатор, светящийся зелёным: баллон полон. Рудокопы используют такие устройства, чтобы выкуривать вредителей из штреков. Поверните вентиль, и весь газ разом заполнит помещение от стены до стены, а затем ветер понесёт его прочь от входа.
actors.mobs.npcs.bellowsvalve.desc_spent=Вентиль повёрнут до упора, индикатор погас. Баллон пуст.
actors.mobs.npcs.bellowsvalve.ask=Индикатор горит зелёным: баллон наполнен рудничным газом. Повернёте вентиль — и _весь газ_ разом заполнит штрек, включая место, где вы стоите. Затем ветер понесёт его дальше.\n\nГлавное, чтобы вы сами не оказались по ветру.
actors.mobs.npcs.bellowsvalve.empty=Баллон пуст. Всё, что в нём было, давно унесло ветром.
actors.mobs.npcs.bellowsvalve.opened=Вентиль с визгом проворачивается, и штрек от стены до стены заполняет зелёное облако.
actors.blobs.elementallock.wake_1=Огненная руна впитывает жар и пробуждается.
actors.blobs.elementallock.wake_2=Иней ползёт по второй руне, пока она не белеет целиком и не пробуждается.
actors.blobs.elementallock.wake_3=На руне прорастает что-то зелёное, и она пробуждается.
actors.blobs.elementallock.wake_4=Вода достигает порога, и руна прилива пробуждается.
actors.blobs.elementallock.opened=Последняя руна пробуждается. Световые врата гаснут, точно свеча.
actors.blobs.hothouseglass.desc=Над головой — стеклянная крыша, а под ней воздух мягкий, как весенним утром, что бы ни творилось снаружи.

# Russian localization — batch 500 no. 4
actors.blobs.nestbrood.desc_empty=В соломе продавлена ямка величиной с два кулака. Словно чего-то ждёт.
actors.blobs.nestbrood.desc_egg=В глубине соломы лежит яйцо. Судя по его виду, оно пережило огонь %1$d раз, мороз — %2$d, яд — %3$d, а удары молнии — %4$d.
actors.blobs.nestbrood.stir_fire=Что-то внутри скорлупы зашевелилось, сопротивляясь жару.
actors.blobs.nestbrood.stir_frost=Скорлупу покрывают ледяные узоры. Внутри что-то переворачивается.
actors.blobs.nestbrood.stir_poison=Скорлупа приобрела цвет синяка. Что-то внутри вдыхает отравленный воздух.
actors.blobs.nestbrood.stir_spark=Скорлупа потрескивает под пальцами. Существо внутри проснулось.
actors.blobs.counterweightplates.raised=Где-то под полом падает противовес, и решётка поднимается.
actors.blobs.counterweightplates.dropped=Груз сходит с плиты, и решётка опускается.
actors.mobs.hoardsquirrel.desc=Рыжая белка размером с кошку, причём большую часть её тела составляет хвост. Каждое семечко в этом тайнике она принесла за щеками. И каждое помнит.
actors.mobs.hoardsquirrel.snatch=Белка проснулась! Набив щёки добычей, она бросается наутёк.
actors.mobs.hoardsquirrel.gone=Белка скрылась вместе со своей добычей.
actors.mobs.npcs.bedroll.desc=Чья-то оставленная постель. Одеяло грубое, но чистое, подстилка сухая. Хозяин уже не вернётся.
actors.mobs.npcs.bedroll.net_host_only=Ночь общая для всего отряда. Пропустить её может только организатор игры.
actors.mobs.npcs.bedroll.not_safe=Нельзя ложиться спать, пока поблизости видны враги.
actors.mobs.npcs.bedroll.menu_fire=Костёр горит, одеяло сухое. Здесь можно переночевать.
actors.mobs.npcs.bedroll.menu_cold=Кострище рядом остыло. Здесь можно поспать, но с огнём было бы лучше.
actors.mobs.npcs.bedroll.rested=Вы выспались и проснулись в %s.
actors.mobs.npcs.bedroll.rested_clock=Вы немного отдохнули. Время тем временем шло своим чередом.
actors.mobs.npcs.bedroll.woke_cold=Вы просыпаетесь окоченевшими и дрожащими: холод пробрался даже под одеяло.
actors.mobs.npcs.bedroll.woke_found=Вы просыпаетесь от звука: кто-то обнаружил вас первым!
tiles.warpedroomtiles.stall_desc=На складном столе лежат какие-то товары, прикрытые тканью. Её углы прижаты грузиками.
tiles.warpedroomtiles.crates_desc=С ящиков стёсаны клейма изготовителей.
tiles.warpedroomtiles.barrel_desc=Бочка наглухо заткнута пробкой. Судя по потёртостям, её долго катили на боку.
tiles.warpedroomtiles.rug_desc=Добротный ковёр, слишком роскошный для подвала. Его можно свернуть за мгновение.
tiles.warpedroomtiles.lantern_desc=Фонарь на столбе. Все его стороны закрыты заслонками, кроме той, что обращена к прилавку.
tiles.warpedroomtiles.fire_ring_desc=Кольцо камней вокруг слоя старой золы. Костёр разжигали много раз, но ни разу — при свете дня.
tiles.warpedroomtiles.ash_spill_desc=У кострища в пол втоптана сажа, рядом валяется прогоревшая палка, а в сером пепле ещё тлеет уголёк. Кто-то давно поддерживает здесь огонь.
tiles.warpedroomtiles.log_seat_desc=Бревно, отполированное сверху множеством сидевших на нём людей.
tiles.warpedroomtiles.rival_plinth_desc=Невысокий постамент с потёртыми краями. Похоже, то, что на нём стоит, не всегда остаётся неподвижным.
tiles.warpedroomtiles.coals_desc=Ложе из хорошего чёрного угля, пока холодного. Много не потребуется, чтобы оно раскалилось.
tiles.warpedroomtiles.coals_on_desc=Угли пылают добела в самой сердцевине. Воздух над ними дрожит от жара.
tiles.warpedroomtiles.furnace_desc=Боковая стенка горна. Он устроен так, чтобы весь жар направлялся вперёд.
tiles.warpedroomtiles.tool_rack_desc=Клещи, молоты, наковальная плита. Всё настолько тяжёлое, что красть не имеет смысла.
tiles.warpedroomtiles.scrap_desc=Сметённые в кучу опилки и обломки. Всё ценное отсюда уже забрали.
tiles.warpedroomtiles.rope_post_desc=Латунный столбик с бархатным канатом. Смотреть можно, прислоняться — нельзя.
tiles.warpedroomtiles.pedigree_plaque_desc=_«ОДИН РОД. ТРИ СУДЬБЫ. РУКА МОЖЕТ ВЫБРАТЬ ЛИШЬ ОДНУ»._
tiles.warpedroomtiles.grille_in_desc=Железная решётка в полу. Восходящий поток воздуха достаточно силён, чтобы взъерошить волосы.
tiles.warpedroomtiles.grille_out_desc=Железная решётка в полу. Всё в комнате клонится в её сторону.
tiles.warpedroomtiles.warning_sign_desc=На столбе закреплена табличка. Её нарисовал тот, кто не умел писать, да ему и не требовалось: череп и стрелка вдоль прохода, прочь от двери. Всё, что выпустят с одного конца, окажется на другом.
tiles.warpedroomtiles.wind_mark_desc=Кто-то начертил на полу стрелку по направлению ветра. Под ней надпись: _«НИКОГДА НЕ СТОЙ У ДАЛЬНЕГО КОНЦА»._
tiles.warpedroomtiles.rune_gate_desc=Проём затянут светящейся решёткой. Замочной скважины нет. Она непроницаема, словно стена, хотя сквозь неё всё видно.
tiles.warpedroomtiles.rune_ember_desc=_«Когда-то я был углём. Сделай меня им снова»._
tiles.warpedroomtiles.rune_ember_on_desc=Руна ровно горит, но совсем не излучает тепла.
tiles.warpedroomtiles.rune_rime_desc=_«Во мне дремлет вода. Уложи её спать»._
tiles.warpedroomtiles.rune_rime_on_desc=Руна покрыта белым инеем, который не тает.
tiles.warpedroomtiles.rune_bloom_desc=_«Я лишь голый камень, и мне это надоело»._
tiles.warpedroomtiles.rune_bloom_on_desc=Руна ожила и до самых краёв налилась зеленью.
tiles.warpedroomtiles.rune_tide_desc=_«Сто лет я не слышала плеска воды у своего порога»._
tiles.warpedroomtiles.rune_tide_on_desc=Руна выглядит влажной и блестит, хотя на ощупь совершенно сухая.
tiles.warpedroomtiles.planter_desc=Деревянный ящик с грядкой чёрной, взрыхлённой почвы. Что бы здесь ни посадили, одним растением дело, похоже, не ограничится.
tiles.warpedroomtiles.nest_desc=Гнездо из соломы с углублением величиной с два кулака. Камень под ним потрескался от давнего огня и ещё более старого мороза.
tiles.warpedroomtiles.portcullis_desc=Железные прутья толщиной с запястье опущены с потолка. Замка нет: решётку не запирали. Её просто опустили.
tiles.warpedroomtiles.portcullis_on_desc=Прутья подняты. Их удерживает какой-то механизм под полом, явно через силу.
tiles.warpedroomtiles.plate_desc=Каменная нажимная плита возвышается над полом на толщину пальца. Под сапогом она слегка поддаётся — как и под любым другим достаточно тяжёлым предметом.
tiles.warpedroomtiles.plate_on_desc=Под тяжестью груза плита опустилась вровень с полом.
tiles.warpedroomtiles.camp_fire_desc=Камни сложены кольцом вокруг подготовленного, но не зажжённого костра. Достаточно любого огонька.
tiles.warpedroomtiles.camp_fire_on_desc=Небольшой ровный костёр. Кто-то умело его сложил.
tiles.warpedroomtiles.supplies_desc=Ящик с верёвочной ручкой. Кто-то собирался за ним вернуться.
tiles.warpedroomtiles.bedding_desc=Глубокое гнездо из измельчённой коры, мха и чьей-то украденной шерсти.
tiles.warpedroomtiles.husks_desc=Пустая скорлупа и обгрызенные оболочки, аккуратно сложенные кучкой.
