###the rooms Warped adds: levels/rooms/warped, the two standard rooms, and everything that lives in them


###black market
actors.mobs.npcs.blackmarketdealer.name=dealer
actors.mobs.npcs.blackmarketdealer.desc=A hood, a lantern held low, and a pair of hands that are never both in sight at once. Whatever is under the counter got here by a road the town's tax men do not know about, and he would like it to leave the same way.
actors.mobs.npcs.blackmarketdealer.net_host_only=The dealer looks past you to whoever is carrying the purse. "One ledger. One customer. Send your friend over."
actors.mobs.npcs.blackmarketdealer.opening=Evening. Shut the door behind you.
actors.mobs.npcs.blackmarketdealer.provoked=Wrong shop for that. You are done - here, and everywhere.
actors.mobs.npcs.blackmarketdealer.banned=Word travels faster than you do. No dealer will set up for you again.
actors.mobs.npcs.blackmarketdealer.gone_dawn=The light is coming up. When you look back at the stalls there is nobody there, and nothing on them.
actors.mobs.npcs.blackmarketdealer.gone_hostile=The dealer is gone. The people he paid are not.

actors.mobs.marketbodyguard.name=hired muscle
actors.mobs.marketbodyguard.desc=Paid by the night to stand exactly there and look at exactly you. The leather is good and the scars under it are older than the leather. He will not start anything, which is not the same as being unable to finish it.
actors.mobs.marketbodyguard.desc_hostile=Whatever the arrangement was, it is over, and he is being paid extra for this part.
actors.mobs.marketbodyguard.line_a=Buy something or keep walking.
actors.mobs.marketbodyguard.line_b=Hands where the lantern can see them.

actors.mobs.collector.name=the collector
actors.mobs.collector.desc=A narrow figure in the red of a debt called in, with a brass clasp at the throat and the patient eyes of somebody who is paid by the recovery. It did not track you here. It was told where you would be.\n\nEvery blow it lands takes coin with it. What it carries - and a good share of everything you ever paid the market - is on it right now.
actors.mobs.collector.arrive=You have been noticed. Somewhere on this floor, somebody is walking straight towards you.
actors.mobs.collector.lifted=The collector's hand comes away with %d of your gold.
actors.mobs.collector.settled=The debt is settled. Nobody will be sent after you - until you give them a reason.

windows.wndblackmarket.greet=Everything here fell off something. Nothing here comes with a receipt.
windows.wndblackmarket.sky_shadowday=Shadowday. My kind of day. You will find me reasonable.
windows.wndblackmarket.sky_fullmoon=Too much moon tonight. I should not be out at all, and you are going to pay me for the nerve.
windows.wndblackmarket.sky_newmoon=No moon. On a night like this, things change hands that do not have names yet.
windows.wndblackmarket.sky_fog=Good fog on the road. Nobody saw a thing come down. Have a look.
windows.wndblackmarket.sky_storm=Half my people would not travel in this. It is a thin table tonight.
windows.wndblackmarket.heat_close=A word, free: somebody has started asking about you. One more deal and they stop asking.
windows.wndblackmarket.heat_hunted=The collector is already walking. Not my business. Your coin is still good here.
windows.wndblackmarket.heat_tripped=That was one deal too many. The market has sent the collector after you.
windows.wndblackmarket.wares=Under the counter
windows.wndblackmarket.contract=Trade-up contract
windows.wndblackmarket.fence=Fence something
windows.wndblackmarket.wheel=The wheel (%d gold a spin)
windows.wndblackmarket.contract_title=trade-up contract
windows.wndblackmarket.contract_info=Three pieces of the _same kind_ and the _same rarity_ go over the counter. One piece of that kind comes back, _a rarity higher_. You do not choose which. It carries the lowest upgrade level of the three, and the dealer takes a fee.
windows.wndblackmarket.fence_title=the fence
windows.wndblackmarket.fence_info=He buys what you are tired of carrying for _half again_ what a lawful shop would pay, and does not ask where it has been. For a _legendary_ piece or better he pays in _masterwork cores_, not coin.
windows.wndblackmarket.wheel_title=the wheel
windows.wndblackmarket.wheel_info=The smith's rarity wheel, cut kinder than the smith cuts it, and paid for in gold instead of cores. One pocket on it is _black_. What lands in the black pocket stays with the house.
windows.wndblackmarket.fence_prompt=Fence which item?
windows.wndblackmarket.fence_offer_gold="%1$s. I can do _%2$d gold_, and I never saw you."
windows.wndblackmarket.fence_offer_cores="%1$s. That is not a coin piece. _%2$d masterwork core(s)_, and I never saw you."
windows.wndblackmarket.fence_yes=Done
windows.wndblackmarket.fence_no=Keep it
windows.wndblackmarket.fence_done=It is gone before the coin stops ringing.
windows.wndblackmarket.wheel_prompt=Put which item on the wheel?

windows.wndmarketwares.title=under the counter
windows.wndmarketwares.terms=Tap a thing to look it over. What you see is all he will say about it. _No refunds._
windows.wndmarketwares.sold_out=The counter is bare. "Come back next week."
windows.wndmarketwares.price=%dg
windows.wndmarketwares.tip_name=A word about this floor
windows.wndmarketwares.tip_desc=He knows this floor better than the people who built it. For a price he will mark every _hidden door_ on it for you.
windows.wndmarketwares.tip_found=He marks %d hidden door(s) on your map without looking up.
windows.wndmarketwares.tip_none="Nothing on this floor you have not already found. I do not take coin for nothing."

windows.wndtradeup.title=trade-up contract
windows.wndtradeup.info=Three of a kind, three of a rarity. Tap a slot to fill it, tap it again to take the piece back.
windows.wndtradeup.sign=Sign
windows.wndtradeup.empty=Nothing on the counter yet.
windows.wndtradeup.outcome=Three %1$s %2$s for one _%3$s_ %2$s, at +%4$d. Fee: %5$d gold.
windows.wndtradeup.signed=The three go under the counter. What comes back is a %s.
windows.wndtradeup.pick_first=Put what on the counter?
windows.wndtradeup.pick_more=Another of the same kind and rarity
windows.wndtradeup.family_weapon=weapons
windows.wndtradeup.family_armor=armors
windows.wndtradeup.family_missile=thrown weapons
windows.wndtradeup.family_wand=wands

windows.wndriggedwheel.info=Your %s piece rides on it. One pocket is the house's.
windows.wndriggedwheel.spin=Spin (%d gold)
windows.wndriggedwheel.seized_odds=House %1$d/%2$d
windows.wndriggedwheel.seized=The ball drops into the black pocket. The dealer's hand closes on your %s, and that is that.
windows.wndriggedwheel.seized_result=THE HOUSE TAKES IT
windows.wndriggedwheel.result=%s


###rival's gallery
actors.mobs.rivalstatue.name=rival statue
actors.mobs.rivalstatue.desc=It was cast to stand the way you stand. The grip is yours, the guard is yours, and the weapon in its hands is a better one than yours.
actors.mobs.rivalstatue.desc_weapon=It holds a _%1$s_ the way only a master of the _%2$s_ school would.
actors.mobs.rivalstatue.sunder=sundered!
actors.mobs.rivalstatue.wild=wild blow!
actors.mobs.rivalstatue.ambush=ambushed!
actors.mobs.rivalstatue.siphon=drained!
actors.mobs.rivalstatue.riposte=turned aside!


###tempering forge
actors.mobs.npcs.temperinganvil.name=tempering anvil
actors.mobs.npcs.temperinganvil.desc=An anvil with a face worn bright, set close enough to the furnace to fry an egg on. Whoever worked here left in the middle of something.
actors.mobs.npcs.temperinganvil.desc_cold=Your %s lies across it, dull and cold.
actors.mobs.npcs.temperinganvil.desc_hot=Your %s lies across it, glowing white. It will not stay this way, and it should not.
actors.mobs.npcs.temperinganvil.desc_spent=A crack runs clean through its face. It has done its last good work.
actors.mobs.npcs.temperinganvil.net_host_only=The anvil's work is the host's to do.
actors.mobs.npcs.temperinganvil.place_prompt=Lay what on the anvil?
actors.mobs.npcs.temperinganvil.placed=You lay the %s across the anvil.
actors.mobs.npcs.temperinganvil.white_hot=The %s glows white-hot on the anvil.
actors.mobs.npcs.temperinganvil.overheating=The %s is starting to spit sparks. It has been in the heat too long.
actors.mobs.npcs.temperinganvil.cooled=The %s cools by itself, slow and soft. Nothing gained.
actors.mobs.npcs.temperinganvil.scorched=The %s has burnt. Something that was in the metal is not in it any more.
actors.mobs.npcs.temperinganvil.blackened=The %s blackens and scales. There was nothing finer in it to lose.
actors.mobs.npcs.temperinganvil.tempered_line=The %s takes the quench with a scream of steam. One of its qualities is as good as it can ever be.
actors.mobs.npcs.temperinganvil.tempered_step=The %s takes the quench with a scream of steam, and comes out a step nearer a masterwork.
actors.mobs.npcs.temperinganvil.spent=The anvil's face is cracked through. It will not take another piece.
actors.mobs.npcs.temperinganvil.opt_quench=Quench it in the trough
actors.mobs.npcs.temperinganvil.opt_take=Take it back
actors.mobs.npcs.temperinganvil.menu_cold=Your %s lies cold on the anvil. Cold metal learns nothing.
actors.mobs.npcs.temperinganvil.menu_hot=Your %s is white-hot. Heat like this is only worth anything if it ends suddenly.
actors.mobs.npcs.temperinganvil.burnt_hands=You take the white-hot %s off the anvil with your hands. You have had better ideas.
actors.mobs.npcs.temperinganvil.trough_frozen=The trough is frozen solid. There is nothing in it to quench with.
actors.mobs.npcs.temperinganvil.trough_dry=The trough is dry.
actors.mobs.npcs.temperinganvil.trough_warm=The trough is warm as soup. The %s goes in with a sigh, not a scream, and comes out no better.

actors.blobs.coalbed.lit=The coals catch.
actors.blobs.coalbed.out=The coals burn down to grey.


###breaker's bench
actors.mobs.npcs.breakersbench.name=breaker's bench
actors.mobs.npcs.breakersbench.desc=A bench that has been hit very hard for a very long time, with a vice bolted to one end and a maul lying across it. Under it is a hopper of bright scrap: _%1$d of %2$d_ shares towards a core.
actors.mobs.npcs.breakersbench.desc_forgeday=The maul is warm to the touch today.
actors.mobs.npcs.breakersbench.net_host_only=The bench is the host's to work.
actors.mobs.npcs.breakersbench.prompt=Break what? (scrap %1$d/%2$d)
actors.mobs.npcs.breakersbench.confirm=Break the %1$s for good? It would yield %2$s.
actors.mobs.npcs.breakersbench.confirm_upgrades=Its _+%d_ goes with it.
actors.mobs.npcs.breakersbench.yes=Break it
actors.mobs.npcs.breakersbench.no=Not this one
actors.mobs.npcs.breakersbench.yield_core=_%d masterwork core(s)_
actors.mobs.npcs.breakersbench.yield_scrap=a share of scrap (_%1$d of %2$d_)
actors.mobs.npcs.breakersbench.yield_scrap_core=the last share of scrap: _%d masterwork core(s)_
actors.mobs.npcs.breakersbench.yield_resin=_arcane resin_
actors.mobs.npcs.breakersbench.yield_metal=_%d liquid metal_
actors.mobs.npcs.breakersbench.got_scrap=Bright scrap rattles into the hopper: %1$d of %2$d.
actors.mobs.npcs.breakersbench.got_resin=The wand splits along its grain and weeps resin.
actors.mobs.npcs.breakersbench.got_metal=It comes apart into %d liquid metal.
actors.mobs.npcs.breakersbench.got_core=Something hard and bright is left in the vice: %d masterwork core(s).
actors.mobs.npcs.breakersbench.got_core_forgeday=The maul rings like a bell. %d masterwork cores are left in the vice.


###pedigree hall
actors.blobs.pedigreeward.shattered=As your hand closes on one, the other two go to pieces where they lie.


###frozen cache
actors.mobs.iceblock.name=ice block
actors.mobs.iceblock.desc=A block of old ice, clear enough to see into and hard enough to ring.
actors.mobs.iceblock.inside_0=Something _long_ is frozen into it, a hand's breadth from the surface.
actors.mobs.iceblock.inside_1=Something _rounded_ is frozen into the middle of it.
actors.mobs.iceblock.inside_2=Something _small_ is frozen into it, no bigger than a fist.
actors.mobs.iceblock.stage_0=It is dry to the touch and bitterly cold.
actors.mobs.iceblock.stage_1=It is sweating, and standing in a little water of its own.
actors.mobs.iceblock.stage_2=It has slumped to half its height. It will not last much longer.
actors.mobs.iceblock.thawed=The last of the ice lets go of the %s.
actors.mobs.iceblock.broke_out=The block bursts apart around the %s.
actors.mobs.iceblock.broke_potion=The block bursts apart - and the %s inside it with it!
actors.mobs.iceblock.broke_scroll=The block bursts apart. What was a scroll comes out as pulp.


###thermal spring
actors.blobs.thermalvent.desc=Hot water wells up here from somewhere a long way down, and the air over it is thick with steam.
actors.buffs.springsoak.name=Spring warmth
actors.buffs.springsoak.desc=The heat of the spring has gone right through you. While you stay in the water it eases your hurts and takes any chill off you; out of it, the warmth you carry is worth about %1$d degrees against the cold. It will never make a warm day hotter.\n\nYou will step out of the pool as wet as anybody.\n\nTurns of warmth remaining: %2$d.


###the bellows
actors.blobs.bellowsdraft.desc=The air here moves, all of it, all one way, and has been moving for a very long time.
actors.blobs.bellowsdraft.enter=A steady wind blows down this gallery, from the door to the far wall. It never drops.
actors.buffs.draught.name=In the draught
actors.buffs.draught.desc=You are standing in a wind that blows _%s_ and never lets up.\n\nAnything thrown _with_ the wind flies truer and hits a good deal harder; anything thrown _into_ it does the opposite.\n\nWhatever hangs in the air here - gas, smoke, steam - is _carried downwind_, a step a turn, and piles up against the far wall. None of it ever comes back this way.
actors.buffs.draught.dir_0=to the east
actors.buffs.draught.dir_1=to the south
actors.buffs.draught.dir_2=to the west
actors.buffs.draught.dir_3=to the north
actors.mobs.npcs.bellowsvalve.name=gas canister
actors.mobs.npcs.bellowsvalve.desc=An iron canister as tall as a man's hip, plumbed into the wall, with a brass wheel on top and a little glass that glows green: it is full. Miners keep these for clearing a gallery of vermin. Turn the wheel and it empties itself all at once, filling the gallery wall to wall - and then the wind takes what it has made and carries it away from the door.
actors.mobs.npcs.bellowsvalve.desc_spent=The wheel is turned as far as it goes and the little glass on the canister reads nothing at all. It is empty.
actors.mobs.npcs.bellowsvalve.ask=The glass glows green: the canister is full of mine gas. Turning the wheel lets _all of it_ out at once, and it fills the whole gallery - the ground you are standing on included. The wind carries it off from there.\n\nMake sure you are not downwind of yourself.
actors.mobs.npcs.bellowsvalve.ask_yes=Turn the wheel
actors.mobs.npcs.bellowsvalve.ask_no=Leave it shut
actors.mobs.npcs.bellowsvalve.empty=The canister is empty. Whatever was in it has gone where the wind goes.
actors.mobs.npcs.bellowsvalve.opened=The wheel turns with a shriek, and the gallery goes green from wall to wall.


###elemental lock vault
actors.blobs.elementallock.wake_1=The ember rune drinks the heat and wakes.
actors.blobs.elementallock.wake_2=Rime creeps along the second rune until all of it is white, and it wakes.
actors.blobs.elementallock.wake_3=Something green is growing on the rune, and the rune wakes under it.
actors.blobs.elementallock.wake_4=Water at its doorstep, and the tide rune wakes.
actors.blobs.elementallock.opened=The last rune wakes. The gate of light goes out like a candle.


###hothouse
actors.blobs.hothouseglass.desc=Glass overhead, and under it air as soft as a morning in spring, whatever the year is doing outside.


###incubator nest
actors.blobs.nestbrood.desc_empty=A hollow pressed into the straw, the size of two fists. It is waiting for something.
actors.blobs.nestbrood.desc_egg=The egg sits deep in the straw. Turning it over in your mind, you would say it has known fire %1$d times, frost %2$d, poison %3$d and lightning %4$d.
actors.blobs.nestbrood.stir_fire=Something inside the shell has started pushing back against the heat.
actors.blobs.nestbrood.stir_frost=Frost flowers open across the shell, and something inside it turns over.
actors.blobs.nestbrood.stir_poison=The shell has gone the colour of a bruise, and something inside it is breathing the bad air in.
actors.blobs.nestbrood.stir_spark=The shell crackles under your fingers. Something inside it is awake.


###counterweight vault
actors.blobs.counterweightplates.raised=Somewhere under the floor a weight drops, and the bars go up.
actors.blobs.counterweightplates.dropped=The weight comes off a plate, and the bars come down.


###squirrel's hoard
actors.mobs.hoardsquirrel.name=hoard squirrel
actors.mobs.hoardsquirrel.desc=A russet squirrel the size of a cat, and most of that is tail. Every seed in this hollow was carried here in those cheeks, and it remembers each one.
actors.mobs.hoardsquirrel.snatch=The squirrel is awake! It stuffs its cheeks and bolts.
actors.mobs.hoardsquirrel.gone=The squirrel is gone, and what it was carrying is gone with it.


###wayfarer's camp
actors.mobs.npcs.bedroll.name=bedroll
actors.mobs.npcs.bedroll.desc=Somebody's bedroll, left where they slept. The blanket is rough and clean and the groundsheet is dry. Nobody is coming back for it.
actors.mobs.npcs.bedroll.net_host_only=The night is the whole party's. Only the host can sleep it away.
actors.mobs.npcs.bedroll.not_safe=You cannot lie down with enemies in sight.
actors.mobs.npcs.bedroll.menu_fire=The fire is going and the blanket is dry. You could sleep here.
actors.mobs.npcs.bedroll.menu_cold=The pit beside it is cold. You could sleep here, though a fire would make it a better idea.
actors.mobs.npcs.bedroll.until_phase=Sleep until %s
actors.mobs.npcs.bedroll.until_dawn=Sleep until dawn
actors.mobs.npcs.bedroll.stay_up=Stay up
actors.mobs.npcs.bedroll.phase_dawn=dawn
actors.mobs.npcs.bedroll.phase_day=day
actors.mobs.npcs.bedroll.phase_dusk=dusk
actors.mobs.npcs.bedroll.phase_night=night
actors.mobs.npcs.bedroll.rested=You sleep, and wake at %s, rested.
actors.mobs.npcs.bedroll.rested_clock=You rest a while. The day keeps its own time.
actors.mobs.npcs.bedroll.woke_cold=You wake stiff and shaking. The cold got into the blanket with you.
actors.mobs.npcs.bedroll.woke_found=You wake to the sound of something that has found you first!


###floor and furniture (tiles/WarpedRoomTiles)
tiles.warpedroomtiles.stall_name=stall
tiles.warpedroomtiles.stall_desc=A trestle table with a cloth thrown over whatever is on it. The cloth is weighted at the corners.
tiles.warpedroomtiles.crates_name=crates
tiles.warpedroomtiles.crates_desc=Crates with the makers' marks planed off.
tiles.warpedroomtiles.barrel_name=barrel
tiles.warpedroomtiles.barrel_desc=A barrel, bunged tight. It has come a long way on its side.
tiles.warpedroomtiles.sacks_name=sacks
tiles.warpedroomtiles.sacks_desc=Sacks, stitched shut twice.
tiles.warpedroomtiles.rug_name=rug
tiles.warpedroomtiles.rug_desc=A good rug, far too good for a cellar. It rolls up in a moment.
tiles.warpedroomtiles.lantern_name=hooded lantern
tiles.warpedroomtiles.lantern_desc=A lantern on a post, shuttered on every side but the one that faces the counter.
tiles.warpedroomtiles.fire_ring_name=fire pit
tiles.warpedroomtiles.fire_ring_desc=A ring of stones round a bed of old ash. It has been lit many times, and never in daylight.
tiles.warpedroomtiles.ash_spill_name=ashes
tiles.warpedroomtiles.ash_spill_desc=Soot trodden into the floor beside the pit, a stick burnt through, and one ember still awake in the grey. Somebody has been keeping this fire for a while.
tiles.warpedroomtiles.log_seat_name=log
tiles.warpedroomtiles.log_seat_desc=A length of log worn smooth along the top by people sitting on it.
tiles.warpedroomtiles.rival_plinth_name=plinth
tiles.warpedroomtiles.rival_plinth_desc=A low plinth, scuffed round the edge as if what stands on it does not always stand still.
tiles.warpedroomtiles.brazier_name=brazier
tiles.warpedroomtiles.brazier_desc=A bronze brazier, banked low.
tiles.warpedroomtiles.coals_name=coal bed
tiles.warpedroomtiles.coals_desc=A bed of good black coal, cold. It would take very little to change that.
tiles.warpedroomtiles.coals_on_desc=A bed of coals burning white at the heart. The air over it shakes.
tiles.warpedroomtiles.furnace_name=furnace
tiles.warpedroomtiles.furnace_desc=The cheek of a furnace, built to throw every bit of its heat forward.
tiles.warpedroomtiles.tool_rack_name=tool rack
tiles.warpedroomtiles.tool_rack_desc=Tongs, hammers, a swage block. All of it too heavy to be worth stealing.
tiles.warpedroomtiles.scrap_name=scrap
tiles.warpedroomtiles.scrap_desc=Swept-up filings and broken edges. Whatever was good in them has been taken.
tiles.warpedroomtiles.rope_post_name=rope post
tiles.warpedroomtiles.rope_post_desc=A brass post with a velvet rope. Look, do not lean.
tiles.warpedroomtiles.pedigree_plaque_name=plaque
tiles.warpedroomtiles.pedigree_plaque_desc=_"ONE LINEAGE. THREE DESTINIES. A HAND MAY CLOSE ON ONLY ONE."_
tiles.warpedroomtiles.grille_in_name=intake grate
tiles.warpedroomtiles.grille_in_desc=An iron grate in the floor. The air comes up through it hard enough to lift your hair.
tiles.warpedroomtiles.grille_out_name=outlet grate
tiles.warpedroomtiles.grille_out_desc=An iron grate in the floor, and everything in the room is leaning towards it.
tiles.warpedroomtiles.warning_sign_name=warning sign
tiles.warpedroomtiles.warning_sign_desc=A board on a post, painted by somebody who could not write and did not need to: a skull, and an arrow pointing down the gallery, away from the door. Whatever is let loose at this end ends up at that one.
tiles.warpedroomtiles.wind_mark_name=chalk mark
tiles.warpedroomtiles.wind_mark_desc=Somebody has chalked an arrow on the floor, pointing the way the wind blows. Under it: _"NEVER STAND AT THE FAR END."_
tiles.warpedroomtiles.rune_gate_name=gate of light
tiles.warpedroomtiles.rune_gate_desc=A lattice of light across the doorway, and no keyhole anywhere in it. It gives like a wall. You can see straight through it.
tiles.warpedroomtiles.rune_ember_name=rune of the ember
tiles.warpedroomtiles.rune_ember_desc=_"I was a coal once. Make me one again."_
tiles.warpedroomtiles.rune_ember_on_desc=The rune burns steadily, and gives off no heat at all.
tiles.warpedroomtiles.rune_rime_name=rune of the rime
tiles.warpedroomtiles.rune_rime_desc=_"Water sleeps in me. Let it lie down."_
tiles.warpedroomtiles.rune_rime_on_desc=The rune is white with a frost that does not melt.
tiles.warpedroomtiles.rune_bloom_name=rune of the bloom
tiles.warpedroomtiles.rune_bloom_desc=_"I am bare stone, and I am tired of it."_
tiles.warpedroomtiles.rune_bloom_on_desc=The rune is green to its edges, and awake.
tiles.warpedroomtiles.rune_tide_name=rune of the tide
tiles.warpedroomtiles.rune_tide_desc=_"I have not heard the water at my door in a hundred years."_
tiles.warpedroomtiles.rune_tide_on_desc=The rune shines wet, though it is dry to the touch.
tiles.warpedroomtiles.planter_name=planting bed
tiles.warpedroomtiles.planter_desc=A bed of black soil in a wooden frame, turned over and ready. Whatever goes into it does not seem to stay one plant for long.
tiles.warpedroomtiles.nest_name=nest
tiles.warpedroomtiles.nest_desc=Straw packed round a hollow the size of two fists. The stone under it is cracked from old fires, and from older frosts.
tiles.warpedroomtiles.portcullis_name=bars
tiles.warpedroomtiles.portcullis_desc=Iron bars as thick as your wrist, let down out of the ceiling. There is no lock on them because nothing about them is locked. They are simply down.
tiles.warpedroomtiles.portcullis_on_desc=The bars are up, held by something under the floor that would rather not be holding them.
tiles.warpedroomtiles.plate_name=pressure plate
tiles.warpedroomtiles.plate_desc=A stone plate standing a finger proud of the floor. It gives a little under a boot, and it would give the same under anything else with some weight to it.
tiles.warpedroomtiles.plate_on_desc=The plate is sunk flush with the floor under the weight on it.
tiles.warpedroomtiles.camp_fire_name=fire pit
tiles.warpedroomtiles.camp_fire_desc=A ring of stones round a laid fire that nobody lit. Any flame at all would do it.
