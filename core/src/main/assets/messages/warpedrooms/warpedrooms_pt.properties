###Warped Pixel Dungeon
actors.mobs.npcs.blackmarketdealer.name=negociante
actors.mobs.npcs.blackmarketdealer.desc=Um capuz, uma lanterna baixa e um par de mãos que nunca ficam as duas à vista ao mesmo tempo. O que está debaixo do balcão chegou por uma estrada que os fiscais da cidade não conhecem, e ele gostaria que saísse pelo mesmo caminho.
actors.mobs.npcs.blackmarketdealer.net_host_only=O negociante olha além de você, para quem carrega a bolsa. "Um caderno. Um cliente. Manda seu amigo vir aqui."
actors.mobs.npcs.blackmarketdealer.opening=Boa noite. Feche a porta quando entrar.
actors.mobs.npcs.blackmarketdealer.provoked=Loja errada pra isso. Pra você acabou, aqui e em qualquer lugar.
actors.mobs.npcs.blackmarketdealer.banned=A notícia corre mais rápido que você. Nenhum negociante vai abrir as portas para você de novo.
actors.mobs.npcs.blackmarketdealer.gone_dawn=O dia está clareando. Quando você olha de novo para as barracas, não há ninguém lá, nem nada sobre elas.
actors.mobs.npcs.blackmarketdealer.gone_hostile=O negociante sumiu. O pessoal que ele pagou, não.
actors.mobs.marketbodyguard.name=capanga
actors.mobs.marketbodyguard.desc=Pago por noite para ficar exatamente ali e olhar exatamente para você. O couro é bom, e as cicatrizes por baixo dele são mais velhas que o couro. Ele não vai começar nada, o que não é o mesmo que não conseguir terminar.
actors.mobs.marketbodyguard.desc_hostile=Fosse qual fosse o acordo, ele acabou, e esta parte ele recebe por fora.
actors.mobs.marketbodyguard.line_a=Compra alguma coisa ou segue andando.
actors.mobs.marketbodyguard.line_b=Mãos onde a lanterna possa ver.
actors.mobs.collector.name=o cobrador
actors.mobs.collector.desc=Uma figura magra, vestida com o vermelho de uma dívida cobrada, com um fecho de latão no pescoço e os olhos pacientes de quem ganha por dívida recuperada. Ele não seguiu seu rastro até aqui. Disseram a ele onde você estaria.\n\nCada golpe que ele acerta leva moedas junto. O que ele carrega, e boa parte de tudo o que você já pagou ao mercado, está com ele neste momento.
actors.mobs.collector.arrive=Notaram você. Em algum ponto deste andar, alguém está vindo direto na sua direção.
actors.mobs.collector.lifted=A mão do cobrador sai com %d do seu ouro.
actors.mobs.collector.settled=A dívida está paga. Ninguém mais vai ser mandado atrás de você. Até você dar um motivo.
windows.wndblackmarket.greet=Tudo aqui caiu de algum caminhão. Nada aqui vem com nota.
windows.wndblackmarket.sky_shadowday=Dia da Sombra. O meu tipo de dia. Hoje você vai me achar razoável.
windows.wndblackmarket.sky_fullmoon=Lua demais esta noite. Eu nem devia estar na rua, e você vai me pagar pela ousadia.
windows.wndblackmarket.sky_newmoon=Sem lua. Numa noite assim, mudam de mão coisas que ainda nem têm nome.
windows.wndblackmarket.sky_fog=Neblina boa na estrada. Ninguém viu nada chegar. Dá uma olhada.
windows.wndblackmarket.sky_storm=Metade do meu pessoal não viaja com um tempo desses. A mesa está magra hoje.
windows.wndblackmarket.heat_close=Um conselho, de graça: alguém começou a perguntar por você. Mais um negócio e param de perguntar.
windows.wndblackmarket.heat_hunted=O cobrador já está a caminho. Não é problema meu. Seu dinheiro ainda vale aqui.
windows.wndblackmarket.heat_tripped=Esse foi um negócio além da conta. O mercado mandou o cobrador atrás de você.
windows.wndblackmarket.wares=Debaixo do balcão
windows.wndblackmarket.contract=Contrato de troca
windows.wndblackmarket.fence=Vender ao receptador
windows.wndblackmarket.wheel=A roda (%d de ouro por giro)
windows.wndblackmarket.contract_title=contrato de troca
windows.wndblackmarket.contract_info=Três peças da _mesma categoria_ e da _mesma raridade_ passam pelo balcão. Volta uma peça dessa categoria, _uma raridade acima_. Você não escolhe qual. Ela fica com o menor nível de aprimoramento das três, e o negociante cobra uma taxa.
windows.wndblackmarket.fence_title=o receptador
windows.wndblackmarket.fence_info=Ele compra o que você cansou de carregar por _uma vez e meia_ o que uma loja honesta pagaria, e não pergunta por onde andou. Por uma peça _lendária_ ou melhor, ele paga em _núcleos de obra-prima_, não em moedas.
windows.wndblackmarket.wheel_title=a roda
windows.wndblackmarket.wheel_info=A roda de raridade do ferreiro, com divisões mais generosas que as do ferreiro, e paga em ouro em vez de núcleos. Uma das casas dela é _preta_. O que cai na casa preta fica com a banca.
windows.wndblackmarket.fence_prompt=Vender qual item?
windows.wndblackmarket.fence_offer_gold="%1$s. Posso pagar _%2$d de ouro_, e eu nunca te vi."
windows.wndblackmarket.fence_offer_cores="%1$s. Isso não se paga com moeda. _%2$d núcleo(s) de obra-prima_, e eu nunca te vi."
windows.wndblackmarket.fence_yes=Fechado
windows.wndblackmarket.fence_no=Fico com isso
windows.wndblackmarket.fence_done=Some antes de a moeda parar de tilintar.
windows.wndblackmarket.wheel_prompt=Colocar qual item na roda?
windows.wndmarketwares.title=por baixo do balcão
windows.wndmarketwares.terms=Toque em algo para examinar. O que você vê é tudo o que ele vai dizer a respeito. _Sem devolução._
windows.wndmarketwares.sold_out=O balcão está vazio. "Volta semana que vem."
windows.wndmarketwares.price=%dg
windows.wndmarketwares.tip_name=Uma dica sobre este andar
windows.wndmarketwares.tip_desc=Ele conhece este andar melhor do que quem o construiu. Por um preço, ele marca para você todas as _portas ocultas_ daqui.
windows.wndmarketwares.tip_found=Ele marca %d porta(s) oculta(s) no seu mapa sem nem levantar os olhos.
windows.wndmarketwares.tip_none="Não tem nada neste andar que você ainda não tenha achado. Não cobro por nada."
windows.wndtradeup.title=contrato de troca
windows.wndtradeup.info=Três da mesma categoria, três da mesma raridade. Toque num espaço para preenchê-lo, toque de novo para pegar a peça de volta.
windows.wndtradeup.sign=Assinar
windows.wndtradeup.empty=Nada no balcão ainda.
windows.wndtradeup.outcome=Três %2$s de raridade %1$s por uma das %2$s de raridade _%3$s_, com +%4$d. Taxa: %5$d de ouro.
windows.wndtradeup.signed=As três vão para debaixo do balcão. O que volta: %s.
windows.wndtradeup.pick_first=Colocar o que no balcão?
windows.wndtradeup.pick_more=Outra da mesma categoria e raridade
windows.wndtradeup.family_weapon=armas
windows.wndtradeup.family_armor=armaduras
windows.wndtradeup.family_missile=armas de arremesso
windows.wndtradeup.family_wand=varinhas
windows.wndriggedwheel.info=Sua peça %s está em jogo. Uma das casas é da banca.
windows.wndriggedwheel.spin=Girar (%d de ouro)
windows.wndriggedwheel.seized_odds=Banca %1$d/%2$d
windows.wndriggedwheel.seized=A bola cai na casa preta. A mão do negociante se fecha sobre o seu item, %s, e acabou.
windows.wndriggedwheel.seized_result=A BANCA LEVA
windows.wndriggedwheel.result=%s
actors.mobs.rivalstatue.name=estátua rival
actors.mobs.rivalstatue.desc=Ela foi moldada para ficar de pé do jeito que você fica. A empunhadura é a sua, a guarda é a sua, e a arma nas mãos dela é melhor que a sua.
actors.mobs.rivalstatue.desc_weapon=A arma nas mãos dela é _%1$s_, e ela a empunha como só um mestre da escola _%2$s_ faria.
actors.mobs.npcs.temperinganvil.name=bigorna de têmpera
actors.mobs.npcs.temperinganvil.desc=Uma bigorna de face gasta e brilhante, perto o bastante da fornalha para fritar um ovo nela. Quem trabalhava aqui saiu no meio de alguma coisa.
actors.mobs.npcs.temperinganvil.desc_cold=Sobre ela está a sua peça, %s, fosca e fria.
actors.mobs.npcs.temperinganvil.desc_hot=Sobre ela está a sua peça, %s, em brasa branca. Não vai ficar assim, e nem deveria.
actors.mobs.npcs.temperinganvil.desc_spent=Uma rachadura atravessa a face dela de ponta a ponta. Ela já fez seu último bom trabalho.
actors.mobs.npcs.temperinganvil.net_host_only=O trabalho na bigorna cabe ao anfitrião.
actors.mobs.npcs.temperinganvil.place_prompt=Colocar o que na bigorna?
actors.mobs.npcs.temperinganvil.placed=Você deita a peça, %s, sobre a bigorna.
actors.mobs.npcs.temperinganvil.white_hot=A peça, %s, fica em brasa branca na bigorna.
actors.mobs.npcs.temperinganvil.overheating=A peça, %s, começa a soltar faíscas. Ficou tempo demais no calor.
actors.mobs.npcs.temperinganvil.cooled=A peça, %s, esfria sozinha, lenta e branda. Nada se ganhou.
actors.mobs.npcs.temperinganvil.scorched=A peça, %s, queimou. Algo que estava no metal não está mais nele.
actors.mobs.npcs.temperinganvil.blackened=A peça, %s, escurece e descasca. Não havia nada de mais fino nela para perder.
actors.mobs.npcs.temperinganvil.tempered_line=A peça, %s, entra na água com um grito de vapor. Uma das qualidades dela chegou ao melhor que pode ser.
actors.mobs.npcs.temperinganvil.tempered_step=A peça, %s, entra na água com um grito de vapor e sai um passo mais perto de uma obra-prima.
actors.mobs.npcs.temperinganvil.spent=A face da bigorna está rachada de lado a lado. Ela não aceita outra peça.
actors.mobs.npcs.temperinganvil.opt_quench=Temperar na tina
actors.mobs.npcs.temperinganvil.opt_take=Pegar de volta
actors.mobs.npcs.temperinganvil.menu_cold=Sua peça, %s, está fria na bigorna. Metal frio não aprende nada.
actors.mobs.npcs.temperinganvil.menu_hot=Sua peça, %s, está em brasa branca. Um calor desses só vale alguma coisa se acabar de repente.
actors.mobs.npcs.temperinganvil.burnt_hands=Você tira da bigorna com as próprias mãos a peça em brasa branca, %s. Você já teve ideias melhores.
actors.mobs.npcs.temperinganvil.trough_frozen=A água da tina congelou por inteiro. Não há nada nela para temperar.
actors.mobs.npcs.temperinganvil.trough_dry=A tina está seca.
actors.mobs.npcs.temperinganvil.trough_warm=A água da tina está morna feito sopa. A peça, %s, entra com um suspiro, não com um grito, e sai do mesmo jeito.
actors.blobs.coalbed.lit=O carvão pega fogo.
actors.blobs.coalbed.out=O carvão queima até virar cinza.
actors.mobs.npcs.breakersbench.name=bancada do desmanche
actors.mobs.npcs.breakersbench.desc=Uma bancada que apanhou com muita força por muito tempo, com uma morsa parafusada numa ponta e uma marreta atravessada em cima. Embaixo fica um funil de sucata brilhante: _%1$d de %2$d_ partes para um núcleo.
actors.mobs.npcs.breakersbench.desc_forgeday=A marreta está morna ao toque hoje.
actors.mobs.npcs.breakersbench.net_host_only=Quem trabalha na bancada é o anfitrião.
actors.mobs.npcs.breakersbench.prompt=Quebrar o quê? (sucata %1$d/%2$d)
actors.mobs.npcs.breakersbench.confirm=Quebrar de vez: %1$s? Renderia %2$s.
actors.mobs.npcs.breakersbench.confirm_upgrades=O _+%d_ dele vai junto.
actors.mobs.npcs.breakersbench.yes=Quebrar
actors.mobs.npcs.breakersbench.no=Este não
actors.mobs.npcs.breakersbench.yield_core=_%d núcleo(s) de obra-prima_
actors.mobs.npcs.breakersbench.yield_scrap=uma parte de sucata (_%1$d de %2$d_)
actors.mobs.npcs.breakersbench.yield_scrap_core=a última parte de sucata: _%d núcleo(s) de obra-prima_
actors.mobs.npcs.breakersbench.yield_resin=_resina arcana_
actors.mobs.npcs.breakersbench.yield_metal=_%d de metal líquido_
actors.mobs.npcs.breakersbench.got_scrap=Sucata brilhante chacoalha dentro do funil: %1$d de %2$d.
actors.mobs.npcs.breakersbench.got_resin=A varinha racha ao longo do veio e verte resina.
actors.mobs.npcs.breakersbench.got_metal=O item se desfaz em %d de metal líquido.
actors.mobs.npcs.breakersbench.got_core=Sobra algo duro e brilhante na morsa: %d núcleo(s) de obra-prima.
actors.mobs.npcs.breakersbench.got_core_forgeday=A marreta soa como um sino. Sobram %d núcleos de obra-prima na morsa.
actors.blobs.pedigreeward.shattered=Quando sua mão se fecha sobre um, os outros dois se despedaçam onde estão.
actors.mobs.iceblock.name=bloco de gelo
actors.mobs.iceblock.desc=Um bloco de gelo antigo, claro o bastante para enxergar por dentro e duro a ponto de tinir.
actors.mobs.iceblock.inside_0=Há algo _comprido_ congelado nele, a um palmo da superfície.
actors.mobs.iceblock.inside_1=Há algo _arredondado_ congelado bem no meio dele.
actors.mobs.iceblock.inside_2=Há algo _pequeno_ congelado nele, não maior que um punho.
actors.mobs.iceblock.stage_0=Está seco ao toque e gelado de doer.
actors.mobs.iceblock.stage_1=Está suando, parado numa pocinha da própria água.
actors.mobs.iceblock.stage_2=Já baixou para metade da altura. Não vai durar muito mais.
actors.mobs.iceblock.thawed=O último gelo derrete e solta o que estava preso: %s.
actors.mobs.iceblock.broke_out=O bloco se parte em pedaços e libera o que estava dentro: %s.
actors.mobs.iceblock.broke_potion=O bloco se parte em pedaços, e leva junto o que estava dentro: %s!
actors.mobs.iceblock.broke_scroll=O bloco se parte em pedaços. O que era um pergaminho sai como papa.
actors.blobs.thermalvent.desc=Aqui brota água quente de algum lugar bem lá embaixo, e o ar em cima dela é denso de vapor.
actors.buffs.springsoak.name=Calor da fonte
actors.buffs.springsoak.desc=O calor da fonte entrou em você por inteiro. Enquanto você fica na água, ele alivia seus ferimentos e tira qualquer friagem; fora dela, o calor que você carrega vale uns %1$d graus contra o frio. Ele nunca deixa um dia quente mais quente.\n\nVocê sai da água pingando, como qualquer um.\n\nTurnos de calor restantes: %2$d.
actors.blobs.bellowsdraft.desc=O ar aqui se move, todo ele, todo para o mesmo lado, e se move assim há muito tempo.
actors.blobs.bellowsdraft.enter=Um vento constante sopra por esta galeria, da porta até a parede do fundo. Ele nunca para.
actors.buffs.draught.name=Na corrente de ar
actors.buffs.draught.desc=Você está num vento que sopra _%s_ e nunca dá trégua.\n\nO que é arremessado _a favor_ do vento voa mais certeiro e acerta bem mais forte; o que é arremessado _contra_ ele, o contrário.\n\nO que estiver no ar aqui (gás, fumaça, vapor) é _levado pelo vento_, um quadrado por turno, e se acumula contra a parede do fundo. Nada disso volta para este lado.
actors.buffs.draught.dir_0=para o leste
actors.buffs.draught.dir_1=para o sul
actors.buffs.draught.dir_2=para o oeste
actors.buffs.draught.dir_3=para o norte
actors.mobs.npcs.bellowsvalve.name=botijão de gás
actors.mobs.npcs.bellowsvalve.desc=Um botijão de ferro da altura do quadril de um homem, ligado por canos à parede, com uma roda de latão em cima e um visorzinho de vidro que brilha verde: está cheio. Mineiros guardam isso para limpar pragas de uma galeria. Gire a roda e ele se esvazia de uma vez, enchendo a galeria de parede a parede, e então o vento pega o que ele soltou e leva para longe da porta.
actors.mobs.npcs.bellowsvalve.desc_spent=A roda está girada até o fim e o visorzinho do botijão não marca nada. Está vazio.
actors.mobs.npcs.bellowsvalve.ask=O visor brilha verde: o botijão está cheio de gás de mina. Girar a roda solta _tudo_ de uma vez, e o gás enche a galeria inteira, inclusive o chão onde você está. Daí o vento leva embora.\n\nCuidado para não ficar vento abaixo de você mesmo.
actors.mobs.npcs.bellowsvalve.ask_yes=Girar a roda
actors.mobs.npcs.bellowsvalve.ask_no=Deixar fechado
actors.mobs.npcs.bellowsvalve.empty=O botijão está vazio. O que tinha dentro foi para onde o vento vai.
actors.mobs.npcs.bellowsvalve.opened=A roda gira com um guincho, e a galeria fica verde de parede a parede.
actors.blobs.elementallock.wake_1=A runa da brasa bebe o calor e desperta.
actors.blobs.elementallock.wake_2=A geada avança pela segunda runa até deixá-la toda branca, e ela desperta.
actors.blobs.elementallock.wake_3=Algo verde cresce sobre a runa, e a runa desperta por baixo.
actors.blobs.elementallock.wake_4=Água à sua porta, e a runa da maré desperta.
actors.blobs.elementallock.opened=A última runa desperta. O portão de luz se apaga como uma vela.
actors.blobs.hothouseglass.desc=Vidro lá em cima e, por baixo, um ar macio como uma manhã de primavera, seja lá o que o ano estiver fazendo lá fora.
actors.blobs.nestbrood.desc_empty=Uma cavidade marcada na palha, do tamanho de dois punhos. Está esperando alguma coisa.
actors.blobs.nestbrood.desc_egg=O ovo está bem fundo na palha. Pensando bem, você diria que ele já conheceu o fogo %1$d vezes, a geada %2$d, o veneno %3$d e o raio %4$d.
actors.blobs.nestbrood.stir_fire=Algo dentro da casca começou a resistir ao calor.
actors.blobs.nestbrood.stir_frost=Flores de geada se abrem na casca, e algo lá dentro se revira.
actors.blobs.nestbrood.stir_poison=A casca ficou da cor de um hematoma, e algo lá dentro está respirando o ar ruim.
actors.blobs.nestbrood.stir_spark=A casca estala sob seus dedos. Algo lá dentro está acordado.
actors.blobs.counterweightplates.raised=Em algum lugar debaixo do chão, um peso cai, e as grades sobem.
actors.blobs.counterweightplates.dropped=O peso sai de uma placa, e as grades descem.
actors.mobs.hoardsquirrel.name=esquilo acumulador
actors.mobs.hoardsquirrel.desc=Um esquilo ruivo do tamanho de um gato, e quase tudo isso é rabo. Cada semente desta toca veio carregada naquelas bochechas, e ele se lembra de cada uma.
actors.mobs.hoardsquirrel.snatch=O esquilo acordou! Ele enche as bochechas e dispara.
actors.mobs.hoardsquirrel.gone=O esquilo sumiu, e o que ele carregava sumiu junto.
actors.mobs.npcs.bedroll.name=saco de dormir
actors.mobs.npcs.bedroll.desc=O saco de dormir de alguém, deixado onde a pessoa dormiu. O cobertor é áspero e limpo, e a lona de baixo está seca. Ninguém vai voltar para buscá-lo.
actors.mobs.npcs.bedroll.net_host_only=A noite é do grupo inteiro. Só o anfitrião pode passá-la dormindo.
actors.mobs.npcs.bedroll.not_safe=Você não pode se deitar com inimigos à vista.
actors.mobs.npcs.bedroll.menu_fire=O fogo está aceso e o cobertor está seco. Você podia dormir aqui.
actors.mobs.npcs.bedroll.menu_cold=A fogueira ao lado está fria. Você podia dormir aqui, mas com fogo seria uma ideia melhor.
actors.mobs.npcs.bedroll.until_phase=Dormir até %s
actors.mobs.npcs.bedroll.until_dawn=Dormir até o amanhecer
actors.mobs.npcs.bedroll.stay_up=Ficar acordado
actors.mobs.npcs.bedroll.phase_dawn=o amanhecer
actors.mobs.npcs.bedroll.phase_day=o dia
actors.mobs.npcs.bedroll.phase_dusk=o anoitecer
actors.mobs.npcs.bedroll.phase_night=a noite
actors.mobs.npcs.bedroll.rested=Você dorme e acorda com %s. O cansaço passou.
actors.mobs.npcs.bedroll.rested_clock=Você descansa um pouco. O dia segue o próprio relógio.
actors.mobs.npcs.bedroll.woke_cold=Você acorda com o corpo duro, tremendo. O frio entrou no cobertor com você.
actors.mobs.npcs.bedroll.woke_found=Você acorda com o barulho de algo que te achou primeiro!
tiles.warpedroomtiles.stall_name=barraca
tiles.warpedroomtiles.stall_desc=Uma mesa de cavaletes com um pano jogado por cima do que está nela. O pano tem pesos nas pontas.
tiles.warpedroomtiles.crates_name=caixotes
tiles.warpedroomtiles.crates_desc=Caixotes com as marcas do fabricante raspadas na plaina.
tiles.warpedroomtiles.barrel_name=barril
tiles.warpedroomtiles.barrel_desc=Um barril bem tampado. Veio de longe, deitado.
tiles.warpedroomtiles.sacks_name=sacos
tiles.warpedroomtiles.sacks_desc=Sacos costurados duas vezes.
tiles.warpedroomtiles.rug_name=tapete
tiles.warpedroomtiles.rug_desc=Um tapete bom, bom demais para um porão. Dá para enrolar num instante.
tiles.warpedroomtiles.lantern_name=lanterna tapada
tiles.warpedroomtiles.lantern_desc=Uma lanterna num poste, tapada de todos os lados menos o que dá para o balcão.
tiles.warpedroomtiles.fire_ring_name=fogueira
tiles.warpedroomtiles.fire_ring_desc=Um círculo de pedras em volta de um leito de cinza velha. Já foi acesa muitas vezes, e nunca à luz do dia.
tiles.warpedroomtiles.ash_spill_name=cinzas
tiles.warpedroomtiles.ash_spill_desc=Fuligem pisada no chão ao lado da fogueira, um graveto queimado de ponta a ponta e uma brasa ainda acordada no cinza. Alguém vem mantendo esse fogo há um tempo.
tiles.warpedroomtiles.log_seat_name=tronco
tiles.warpedroomtiles.log_seat_desc=Um pedaço de tronco gasto e liso em cima, de tanta gente sentar nele.
tiles.warpedroomtiles.rival_plinth_name=pedestal
tiles.warpedroomtiles.rival_plinth_desc=Um pedestal baixo, arranhado em volta da borda, como se o que fica em cima nem sempre ficasse parado.
tiles.warpedroomtiles.brazier_name=braseiro
tiles.warpedroomtiles.brazier_desc=Um braseiro de bronze, com o fogo baixo.
tiles.warpedroomtiles.coals_name=leito de carvão
tiles.warpedroomtiles.coals_desc=Um leito de bom carvão preto, frio. Seria preciso muito pouco para mudar isso.
tiles.warpedroomtiles.coals_on_desc=Um leito de brasas queimando branco no centro. O ar em cima dele treme.
tiles.warpedroomtiles.furnace_name=fornalha
tiles.warpedroomtiles.furnace_desc=A boca de uma fornalha, feita para jogar todo o calor para a frente.
tiles.warpedroomtiles.tool_rack_name=suporte de ferramentas
tiles.warpedroomtiles.tool_rack_desc=Tenazes, martelos, um bloco de estampar. Tudo pesado demais para valer o roubo.
tiles.warpedroomtiles.scrap_name=sucata
tiles.warpedroomtiles.scrap_desc=Limalha varrida e pontas quebradas. O que tinha de bom já foi levado.
tiles.warpedroomtiles.rope_post_name=poste com corda
tiles.warpedroomtiles.rope_post_desc=Um poste de latão com uma corda de veludo. Olhe, mas não se apoie.
tiles.warpedroomtiles.pedigree_plaque_name=placa
tiles.warpedroomtiles.pedigree_plaque_desc=_"UMA LINHAGEM. TRÊS DESTINOS. UMA MÃO SÓ PODE SE FECHAR SOBRE UM."_
tiles.warpedroomtiles.grille_in_name=grade de entrada
tiles.warpedroomtiles.grille_in_desc=Uma grade de ferro no chão. O ar sobe por ela com força para levantar seu cabelo.
tiles.warpedroomtiles.grille_out_name=grade de saída
tiles.warpedroomtiles.grille_out_desc=Uma grade de ferro no chão, e tudo na sala se inclina na direção dela.
tiles.warpedroomtiles.warning_sign_name=placa de aviso
tiles.warpedroomtiles.warning_sign_desc=Uma tábua num poste, pintada por alguém que não sabia escrever e nem precisava: uma caveira e uma seta apontando galeria abaixo, para longe da porta. O que for solto nesta ponta acaba naquela.
tiles.warpedroomtiles.wind_mark_name=marca de giz
tiles.warpedroomtiles.wind_mark_desc=Alguém desenhou com giz uma seta no chão, apontando para onde o vento sopra. Embaixo: _"NUNCA FIQUE LÁ NO FUNDO."_
tiles.warpedroomtiles.rune_gate_name=portão de luz
tiles.warpedroomtiles.rune_gate_desc=Uma treliça de luz atravessando a porta, sem fechadura em lugar nenhum. Ela cede tanto quanto uma parede. Dá para ver direto através dela.
tiles.warpedroomtiles.rune_ember_name=runa da brasa
tiles.warpedroomtiles.rune_ember_desc=_"Já fui carvão. Me faça carvão de novo."_
tiles.warpedroomtiles.rune_ember_on_desc=A runa queima firme, e não solta calor nenhum.
tiles.warpedroomtiles.rune_rime_name=runa da geada
tiles.warpedroomtiles.rune_rime_desc=_"A água dorme em mim. Deixe que ela se deite."_
tiles.warpedroomtiles.rune_rime_on_desc=A runa está branca de uma geada que não derrete.
tiles.warpedroomtiles.rune_bloom_name=runa do florescer
tiles.warpedroomtiles.rune_bloom_desc=_"Sou pedra nua, e estou cansada disso."_
tiles.warpedroomtiles.rune_bloom_on_desc=A runa está verde até as bordas, e desperta.
tiles.warpedroomtiles.rune_tide_name=runa da maré
tiles.warpedroomtiles.rune_tide_desc=_"Faz cem anos que não ouço a água à minha porta."_
tiles.warpedroomtiles.rune_tide_on_desc=A runa brilha molhada, embora esteja seca ao toque.
tiles.warpedroomtiles.planter_name=canteiro
tiles.warpedroomtiles.planter_desc=Um canteiro de terra preta numa moldura de madeira, revirado e pronto. O que entra nele parece não continuar a mesma planta por muito tempo.
tiles.warpedroomtiles.nest_name=ninho
tiles.warpedroomtiles.nest_desc=Palha socada em volta de uma cavidade do tamanho de dois punhos. A pedra embaixo está rachada de fogos antigos, e de geadas mais antigas ainda.
tiles.warpedroomtiles.portcullis_name=grades
tiles.warpedroomtiles.portcullis_desc=Grades de ferro grossas como seu pulso, baixadas do teto. Não há fechadura nelas porque nada nelas está trancado. Estão só abaixadas.
tiles.warpedroomtiles.portcullis_on_desc=As grades estão erguidas, seguras por alguma coisa debaixo do chão que preferia não estar segurando.
tiles.warpedroomtiles.plate_name=placa de pressão
tiles.warpedroomtiles.plate_desc=Uma placa de pedra que se ergue um dedo acima do chão. Cede um pouco sob uma bota, e cederia igual sob qualquer outra coisa com algum peso.
tiles.warpedroomtiles.plate_on_desc=A placa está afundada rente ao chão sob o peso em cima dela.
tiles.warpedroomtiles.camp_fire_name=fogueira
tiles.warpedroomtiles.camp_fire_desc=Um círculo de pedras em volta de uma fogueira montada que ninguém acendeu. Qualquer chama serve.
tiles.warpedroomtiles.camp_fire_on_desc=Um fogo pequeno e constante. Quem montou sabia o que fazia.
tiles.warpedroomtiles.supplies_name=caixote de viajante
tiles.warpedroomtiles.supplies_desc=Um caixote com alça de corda. Alguém pretendia voltar para buscá-lo.
tiles.warpedroomtiles.bedding_name=forração
tiles.warpedroomtiles.bedding_desc=Uma tigela funda de casca desfiada, musgo e a lã roubada de alguém.
tiles.warpedroomtiles.husks_name=cascas
tiles.warpedroomtiles.husks_desc=Cascas vazias e restos roídos, num montinho arrumado.
