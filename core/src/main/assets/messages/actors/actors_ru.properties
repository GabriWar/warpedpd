actors.mobs.npcs.hermit.warn=Не лезь ко мне. Я поднялся сюда ради покоя.
actors.mobs.npcs.town.bishop.desc=Епископ Святой церкви Санты, Владыки Глубин.
actors.mobs.npcs.villager.desc=Житель открытого мира, занятый своими повседневными делами.
actors.mobs.npcs.villager.elder_dusk_0=Вечер добрый. Молодёжь опять слишком шумит у колодца.
actors.mobs.npcs.villager.elder_night_2=Ступай под крышу. Ночь нам не друг.
actors.mobs.npcs.villager.fisher_night_1=А я спать. Река и завтра никуда не денется.
actors.mobs.npcs.villager.recovering=Зерно забрали, крышу сожгли. Ничего, отстроимся.
actors.mobs.pitcherplant.desc=Перед вами живая хищная кувшиночная трава. И она ужасно голодна!
actors.mobs.bluecat.carries=\n\nУ вора с собой _%s_. Очевидно, украл.
actors.mobs.demonlord.breath_kill=Вас насмерть заморозило дыхание повелителя демонов...
actors.mobs.npcs.farmcrop.ready_no_sickle=Урожай созрел. Для сбора нужен серп.
actors.mobs.npcs.lakeshrine.blessed_small=Монеты без всплеска уходят на дно. Вы чувствуете прилив сил.
actors.mobs.npcs.swampwitch.brewed=Ведьма мешает варево, бормочет заклинание и наливает вам %s.
actors.mobs.npcs.town.drunkard.stake_body=Сколько золота поставите на кон? У вас %d.
actors.mobs.npcs.villager.elder_day_0=Я шестьдесят лет смотрю на эту дорогу. А тебя раньше не видел.
actors.mobs.npcs.villager.farmer_night_0=Пора бы спать. Ещё до рассвета надо быть в поле.
actors.mobs.npcs.villager.farmer_night_1=И ты так поздно? Я тоже засиделся. Пойду домой, пока не хватились.
actors.mobs.npcs.villager.fisher_dawn_1=Туман над водой — значит, рыба клюёт. Мне не до разговоров.
items.artifacts.climatecrystal.placed=Кристалл гудит, и воздух вокруг становится мягче.
actors.climatemanager.eclipse_moon_end=Лунное затмение проходит. Луна вновь выглядит как обычно.
actors.mobs.npcs.caveminer.rumour_none=Поблизости ничего особенного не слыхал. Ищи удачу с киркой в руках.
actors.mobs.npcs.roadpatrol.line_2=Разбойников не видел? Покажи куда — дальше мы сами.
actors.mobs.npcs.town.mercenary.desc=Крепкий с виду мужчина, внимательно оценивающий каждого прохожего.
actors.mobs.npcs.villager.elder_dusk_2=Скоро и я на покой. Старым костям холод не по нраву.
actors.mobs.npcs.villager.fisher_night_0=Рыбой пахнет? Так честный заработок и пахнет.
actors.mobs.npcs.villager.loafer_dusk_1=Слыхал новости? Нет? Садись на ведро, расскажу.
actors.daynightcycle.dawn=Солнце поднимается. Над подземельем занимается рассвет.
actors.hero.hero.crouch_down=Вы пригибаетесь и осторожно пробираетесь сквозь тени.
actors.mobs.npcs.blacksmith2.not_identified=Я должен знать, с чем работаю. Сначала опознай предмет!
actors.mobs.npcs.gnollvillager.hunter_day_2=Громко ходишь, гладкокожий. Олень за милю слышит.
actors.mobs.npcs.lakeshrine.already=Вода неподвижна. Сегодня идолу уже принесли положенную жертву.
actors.mobs.npcs.overworldguard.desc=Бдительный страж, охраняющий спокойствие поселения.
actors.mobs.npcs.overworldguard.grateful=Наши двери открыты для тебя, друг. Обращайся, если что понадобится.
actors.mobs.npcs.villager.crafter_dawn_2=Чайник на огне, инструменты готовы. Ещё один день за верстаком.
actors.mobs.npcs.villager.crafter_night_1=Я сяду за верстак, пока ты ещё спишь. Спокойной ночи.
actors.buffs.sleepiness.oncomatose=Усталость одолевает вас, и вы проваливаетесь в сон!
actors.mobs.npcs.farmcrop.progress=Посевы выросли на %1$d%%. До созревания около %2$d ходов.
actors.mobs.npcs.gnollvillager.break_1=Полсолнца прошло. Собиратель жуёт корень, думает большие мысли.
actors.mobs.npcs.gnollvillager.hunter_dusk_1=Небо краснеет. Волки скоро проснутся. Охотник пока не спит.
actors.mobs.npcs.town.bard.rested=Мелодия отзывается во всём теле. Усталость отступает.
actors.mobs.npcs.town.bishop.blessed=Епископ возлагает руку вам на голову. Вы чувствуете благословение.
actors.mobs.npcs.villager.farmer_night_2=Спокойной ночи, путник. Не ходи ночью по полям.
actors.mobs.npcs.caravaneer.ambush_log=Разбойники выскакивают из придорожных кустов и нападают на караван!
actors.mobs.npcs.roadpatrol.line_0=До %1$s дорога чиста. Смотри, чтобы так и оставалось.
actors.mobs.npcs.town.innkeeper.desc=Хозяин таверны гордится собой и своим заведением.
actors.mobs.npcs.villager.crafter_day_2=Метла, нож и немного терпения. Вот и всё ремесло.
actors.buffs.corruption.hero_cured=Целительная энергия изгоняет скверну из вашего тела!
actors.mobs.npcs.caveminer.ore_offer=За это дам %1$d золота. Наверху выручишь %2$d.
actors.mobs.npcs.festivalchampion.beaten=Ты уже честно меня победил. Наслаждайся праздником!
actors.mobs.npcs.festivalchampion.rest=Ты и так еле на ногах стоишь. Отдохни, тогда поговорим.
actors.mobs.npcs.villager.crafter_day_0=Табурет починить? Петлю? Нет? Тогда берегись опилок.
actors.mobs.npcs.villager.elder_day_1=В молодости у нас и забора не было. Да он и не нужен был.
actors.mobs.npcs.villager.farmer_day_2=Спина уже как серп, зато посевы растут.
actors.mobs.npcs.villager.festival_1=Подожди, пока зажгут фонари. Вот тогда и начнутся танцы!
actors.mobs.npcs.villager.indoors_0=Ни ногой не выйду в такую погоду. Заходи, коли пришёл.
actors.mobs.pets.fairy.desc=Фея! Что-то подсказывает: с феями лучше не связываться.
actors.buffs.tengushockbomb$rogueshockeritem.cant_pickup=Слишком сильный электрический разряд — это нельзя подобрать!
actors.mobs.graveprotector.desc=Этот страж защищает древнее поле битвы от непрошеных гостей.
actors.mobs.npcs.gnollvillager.eclipse_1=Солнце чёрное посреди дня. Ночные твари идут. Прячь еду.
actors.mobs.npcs.gnollvillager.hunter_night_0=Ночь — время огня и стаи. Домой иди, гладкокожий.
actors.mobs.npcs.villager.farmer_dawn_1=Роса ещё на листьях. Самое время выдёргивать чертополох.
actors.mobs.npcs.villager.farmer_dusk_0=На сегодня с полем покончено. Попью у колодца, потом ужинать.
actors.buffs.sleepiness.desc_intro_drowsy=Вы начинаете уставать. Движения постепенно замедляются.
actors.mobs.npcs.blacksmith.core_menu=Сердцевины мастерской работы? С ними я управлюсь, даже без задания.
actors.mobs.npcs.festivalchampion.won=Вот ты и упал! Неплохая попытка. Отдышись и приходи снова.
actors.mobs.npcs.lakeshrine.blessed_mid=Монеты исчезают в воде, и вас охватывает спокойствие.
actors.mobs.npcs.town.employee.watched=Экран гаснет. Вы выходите с ощущением, что удача на вашей стороне.
actors.mobs.npcs.villager.elder_dawn_0=Я встал ещё до петухов. В моём возрасте ночи слишком длинны.
actors.mobs.npcs.villager.farmer_day_1=Сорняки, камни и вороны. Каждый день одни и те же три врага.
actors.mobs.npcs.villager.farmer_dusk_2=Солнце ушло с поля. При луне растёт разве что тревога.
actors.mobs.npcs.villager.festival_0=Сегодня не работаем, у нас праздник! Пироги уже пробовал?
actors.mobs.npcs.witchcauldron.look=Котёл вовсю булькает. Ведьма что-то варит — спросите у неё.
actors.mobs.overworldbandit.desc=Придорожный разбойник. Ваш кошелёк интересует его куда больше, чем вы.
actors.mobs.pets.reddragon.desc=Только что вылупившийся красный дракончик. Свирепый и очаровательный!
actors.mobs.npcs.sheepsokobanswitch.desc=Эта овца поменяется с вами местами, если попытаться пройти сквозь неё.
actors.mobs.npcs.swampwitch.brewed_strong=Зелёное варево переливается через край. Ведьма ухмыляется и вручает вам %s.
actors.mobs.npcs.town.townsfolk.bought_today=Она качает головой: «По одной в день. У меня и стены-то не бесконечные».
actors.mobs.npcs.villager.break_2=Полдня прошло, полдня впереди. Присядь, переведи дух.
actors.mobs.npcs.villager.dance_0=Ну же, в хоровод! Левой, правой, а теперь по кругу!
actors.mobs.npcs.villager.eclipse_now_0=Видишь? Средь бела дня темно, как я и говорил. Держи меч наготове.
actors.mobs.npcs.villager.fisher_dusk_2=Вода золотится на закате. Лучший час дня — и самый короткий.
actors.mobs.pets.bluedragon.desc=Только что вылупившийся синий дракончик. Свирепый и очаровательный!
actors.buffs.sleepiness.desc_intro_exhausted=Вы совершенно измотаны и едва можете держать глаза открытыми.
actors.mobs.bunny.desc=Луговой кролик. Скачет себе по траве и никому не мешает.
actors.mobs.npcs.town.mercenary.greet6=Слыхал, в шахтах опять зашевелились. Вот и хорошо, работы было мало.
actors.mobs.npcs.villager.elder_dawn_1=Доброе утро, молодёжь. Присаживайся, если хочешь. Я никуда не тороплюсь.
actors.mobs.npcs.villager.farmer_winter_2=Семена на чердаке, плуг в сарае, а настроения — ни на грош.
actors.mobs.npcs.villager.fisher_day_1=Три поклёвки и ни одной рыбины. Река надо мной смеётся.
actors.mobs.pets.greendragon.desc=Только что вылупившийся зелёный дракончик. Свирепый и очаровательный!
actors.buffs.eyeing.heromsg=Ваши чувства обостряются — теперь вы замечаете всё скрытое поблизости!
actors.mobs.npcs.blacksmith2.wrong_match=Так не пойдёт. Выберите обычный предмет и соответствующий ему адамантитовый.
actors.mobs.npcs.climatecrystalward.hum=Кристалл гудит. Его защита продержится ещё %d ходов.
actors.mobs.npcs.gnollvillager.gatherer_day_0=Этот лист хороший. Тот плохой. Гладкокожий, тот лист не ешь.
actors.mobs.npcs.gnollvillager.indoors_2=Грр. Заходи, гладкокожий, или уходи. Дверь погоду пускает.
actors.mobs.npcs.hermit.flee=Отшельник хватает свои пожитки и исчезает за скалами!
actors.mobs.npcs.town.librarian.greet1=Ой! Эм-м... говорите, пожалуйста, потише. Здесь читают.
actors.mobs.npcs.town.townsfolk.greet1=Дорогая одежда на простолюдине, говорите? Мечтать-то не вредно.
actors.mobs.npcs.town.townsfolkmovie.forecast_none=А погода? Ветер ничего не приносит. Тихо, словно мир затаил дыхание.
actors.mobs.npcs.villager.crafter_dawn_0=На рассвете сперва ставни открываю. Потом уже за работу.
actors.mobs.npcs.villager.eclipse_now_1=Погляди на огненное кольцо вокруг! Не бойся, скоро пройдёт.
actors.mobs.npcs.villager.farmer_dawn_0=Солнце встаёт — и я на грядки. Сорняки не дожидаются хозяина.
actors.mobs.pets.bee.desc=Эта пчела закована в крепкую стальную броню и готова к бою!
actors.mobs.pets.shadowdragon.desc=Только что вылупившийся теневой дракончик. Свирепый и очаровательный!
actors.mobs.pets.violetdragon.desc=Только что вылупившийся фиолетовый дракончик. Свирепый и очаровательный!
actors.mobs.steelbee.desc=Эта пчела закована в крепкую стальную броню и готова к бою!
actors.blobs.wildfire.desc=Здесь бушует лесной пожар, пожирающий траву и деревья.
actors.mobs.flyingprotector.desc=Летающий страж, поражающий незваных гостей молниями.
actors.mobs.mirage.reveal=Удар «%s» проходит сквозь вас: противника здесь и не было!
actors.mobs.npcs.town.librarian.bought=Библиотекарь бережно заворачивает страницу. На ней описан этаж %d.
actors.mobs.npcs.villager.fisher_night_2=После заката к воде не подходи. Она глубже, чем кажется.
actors.mobs.controlpanel.desc=Таинственный управляющий механизм источает тошнотворную силу.
actors.mobs.npcs.swampwitch.curse_lifted=Ведьма плюёт на предмет, шепчет пару слов — и проклятие исчезает.
actors.mobs.npcs.tinkerer1.greeting=Ого, вы видели это подземелье?! Вот это подземелье, я понимаю!
actors.mobs.npcs.tinkerer3.greeting=Ого, вы видели это подземелье?! Вот это подземелье, я понимаю!
actors.mobs.npcs.town.townsfolkmovie.greet1=Слыхали? Говорят, в шахтах опять что-то зашевелилось.
actors.mobs.npcs.villager.crafter_day_1=Мой дед сделал половину дверей в деревне. А я их чиню.
actors.mobs.npcs.farmcrop.glass=Под стеклом растения круглый год растут с летней скоростью и не замерзают.
actors.mobs.npcs.gnollvillager.gatherer_day_1=В кустах много всего. Грибы, ягоды, жуки. Жуки хрустят.
actors.mobs.npcs.villager.farmer_garden_1=Бобы вьются по стене, лук растёт у порога. Нам хватает.
actors.mobs.otiluke.desc=Могущественное заклинание превратило Отилюка в стража этого уровня.
actors.mobs.ruinskeleton.desc=Беспокойный хранитель древних руин. Гостей он не жалует.
actors.mobs.dwarfkingtomb.desc=Гробница неживого короля дворфов. От неё исходит тошнотворная сила.
actors.mobs.forestprotector.desc=Этот страж поражает молниями всякого, кто тревожит священный лес.
actors.mobs.npcs.farmcrop.progress_dormant=Посевы выросли на %d%%, но зимой под открытым небом ничего не растёт.
actors.mobs.npcs.festivalcook.talk_1=Жаркое с вертела и похлёбка из котла! Сегодня всё за полцены!
actors.mobs.npcs.villager.break_1=Глоток воды из колодца, минутка в тени — и снова за работу.
actors.mobs.npcs.villager.farmer_dusk_1=Вороны опять добрались до дальних грядок. Завтра с ними разберусь.
actors.mobs.pearloyster.opened=Вы раскрываете устрицу, и жемчужина выкатывается в воду.
actors.buffs.skillsequence.desc=%1$s: осталось %2$d импульсов. При переходе на другой этаж эффект исчезнет.
actors.buffs.starving.desc=При голодном истощении вы постепенно теряете здоровье.\n\nОсталось ходов истощения: %s.
actors.mobs.fishprotector.desc=Этот страж поражает молниями всякого, кто посягает на рыболовные угодья.
actors.mobs.npcs.caravaneer.ambush_yell=Разбойники! Эй, путник, помоги ради всего святого! Они всю телегу разорят!
actors.mobs.npcs.lakeshrine.blessed_large=Из глубины водоёма поднимается свет. Вы чувствуете чьё-то покровительство.
actors.mobs.npcs.villager.loafer_dusk_0=Лучшее время суток. Все уже отработали, а я до сих пор бодрячком.
actors.mobs.npcs.blacksmith2.asleep=Хр-р... Кузница остыла, и я тоже. Приходи, когда солнце взойдёт.
actors.mobs.npcs.sunkenidol.still_one=Вода неподвижна. Идол примет новое подношение только завтра.
actors.mobs.npcs.town.innservant.greet5=Если бард спросит, понравилась ли песня, скажи «да». Так быстрее.
actors.mobs.npcs.town.townguardfolk.bounty_paid=Это была метка стражи. Награда в %d золотых падает к его ногам.
actors.mobs.npcs.town.townguardfolk.greet1=Проходите, не задерживайтесь. В городе спокойно, и мы намерены это сохранить.
actors.mobs.npcs.villager.farmer_dawn_2=Некогда стоять — до поля далеко, а утро короткое.
actors.mobs.npcs.villager.farmer_day_0=Смотри под ноги! Там хлеб на будущий месяц растёт.
actors.mobs.npcs.farmcrop.water_some=Поблизости %d клеток с водой. Они немного ускоряют рост и помогают посевам выжить.
actors.mobs.npcs.town.drunkard.lost=Монета выпадает его стороной. %d золотых исчезают в бездонном кармане.
actors.mobs.npcs.otilukenpc.rescued=Спасибо, что спасли меня! Вы избавили вселенную от великого зла!
actors.mobs.npcs.sunkenidol.still=Вода неподвижна. Идол примет новое подношение через %d дней.
actors.mobs.npcs.swampwitch.flee=Ведьма визжит, хватает свои пожитки и скрывается в камышах!
actors.mobs.npcs.town.innservant.fed=Похлёбка горячая, и её вдоволь. Приятное тепло разливается по телу.
actors.mobs.npcs.town.townsfolk.sold=Она вертит %s в руках и, не торгуясь, платит %d золотых.
actors.mobs.npcs.villager.crafter_dusk_0=Инструменты убраны, у порога подметено. Пора послушать, на что все жалуются.
actors.mobs.tinkerer.desc=Этот безумец носится по подземелью, ухаживая за своими роботами.
actors.weatherattunement.skin_condenser_dry=Здесь слишком сухо: конденсатор Изобретателя не может собрать даже капли росы.
actors.mobs.iceguardiancore.die=Сердцевина раскалывается, и все стражи в пещере разом рассыпаются.
actors.mobs.npcs.enchantingstation.wnd_msg=Руны слетают с полок, ожидая переплетения. У вас _%d энергии_.
actors.mobs.npcs.tinkerer4.mine_hint=Вход в шахту зарос кустами в юго-западном углу города.
actors.mobs.npcs.caravaneer.robbed_log=Разбойники уходят по дороге, унося половину товаров каравана.
actors.mobs.npcs.gnollvillager.desc=Гнолл из мирных племён открытого мира. Далеко не каждый гнолл рвётся в драку.
actors.mobs.npcs.town.innservant.greet1=Болтать некогда — таверна полна, а кружки сами себя не наполнят!
actors.mobs.npcs.villager.eclipse_0=Запомни мои слова: в полдень луна проглотит солнце. Держись поближе к дому.
actors.mobs.npcs.villager.farmer_winter_0=До весны земля как железо. Только снег лопатой и разгребать.
actors.blobs.popgas.desc=Здесь плывёт облако нестойкого газа. Оно взорвётся, если в него кто-нибудь войдёт.
actors.mobs.gnollarcher.no_keys=На этом уровне ключей нет. Только роса, семена и грибы.
actors.mobs.npcs.blacksmith.sanchikarah=Наконец-то СанЧикара! Я выкую её для тебя. Обращайся осторожно.
actors.mobs.npcs.dwarvenforge.nothing=У вас нет ничего, что можно переплавить. Горну нужна руда, загружаемая по одному тиглю.
actors.mobs.npcs.town.employee.greet5=Попкорна нет. С самой весны. Никто больше ничего не привозит.
actors.mobs.npcs.traveller.line_3=Везу урожай из %2$s на рынок в %1$s. Мешок тяжёлый, кошель лёгкий.
actors.mobs.npcs.villager.farmer_winter_1=Ни посеять, ни собрать. Остаётся крыльцо мести да инструменты чинить.
actors.mobs.overworlddragon.desc=Огромный дракон, свернувшийся кольцом на груде сокровищ. Не подходите к нему без плана.
actors.buffs.coughing.desc=Пока вы кашляете, есть нельзя.\n\nОсталось ходов кашля: %s.
actors.mobs.npcs.villager.loafer_dawn_2=Только не говори матери, что видел меня в такую рань. Ещё начнёт чего-то ожидать.
actors.mobs.albinorat.desc=Белошёрстная крыса из морозных краёв. Густая шубка спасает её от холода.
actors.mobs.brownbat.desc=По сути, маленькая летающая крыса. Смотрите, как бы не запуталась в волосах.
actors.mobs.lichen.desc=Странный живой нарост. Он опутывает корнями враждебных существ поблизости.
actors.mobs.npcs.traveller.line_2=Везу письма в %1$s, а из %2$s ответа ждут до заката. Мне некогда!
actors.buffs.thorns.desc=Шипы обездвиживают вас и наносят урон!\n\nТекущий урон от шипов: %d.
actors.mobs.npcs.farmcrop.desc=Растение на грядке выросло на %1$d%%. До созревания примерно %2$d ходов.
actors.mobs.npcs.ratkingden.busy=Чего тебе? Не до глупостей. Моё королевство само собой не управится!
actors.mobs.npcs.town.mercenary.greet4=Меч неправильно держишь. Нет, показывать не буду. За золото — покажу.
actors.mobs.npcs.town.townsfolk.desc=Один из местных. Явно простолюдин, хотя одежда выглядит дорогой.
actors.mobs.npcs.town.townsfolksilent.greet4=Житель едва заметно качает головой и снова смотрит себе под ноги.
actors.buffs.heatstroke.tier_mild=_Лёгкое тепловое истощение._ Тело перегревается. Сытость расходуется на 20%% быстрее.
actors.mobs.chaosmage.desc=Могущественный маг, обезумевший от собственной силы. Теперь ему нужна лишь ещё большая мощь.
actors.mobs.npcs.festivalcook.flee=Повара забрасывают котлы на телеги и спешно уезжают. Праздник окончен.
actors.mobs.npcs.town.drunkard.won=Монета выпадает вашей стороной. Кряхтя, он пододвигает вам %d золотых.
actors.mobs.npcs.town.librarian.desc=Очень робкий человек в нелепом свитере и очках с толстыми линзами.
actors.mobs.npcs.overworldshopkeeper.desc=Поселковый торговец со своей специализацией. С каждым караваном ассортимент обновляется.
actors.mobs.npcs.town.innkeeper.greet=Добро пожаловать в мой трактир! Лучшие кровати по эту сторону шахт, не побоюсь сказать!
actors.buffs.countdown.desc=Тёмные силы отсчитывают время до неминуемого удара.\n\nОсталось тактов: %d.
actors.buffs.windswept.desc=Вас хлещет %s, мешая метко стрелять.\n\nОсталось ходов: %s.
actors.mobs.npcs.hermit.talk_3=«На каждой вершине есть каменный тур. Дойдёшь — положи свой камешек. Так полагается».
actors.mobs.npcs.town.townguardfolk.bounty_open=Он стучит по доске: «Заказ ещё открыт. Цель — %s, награда — _%d_ золотых. Объявление никуда не делось».
actors.blobs.chargedsteam.desc=В клубах пара трещат молнии, поражая всех, кто в нём задержится.
actors.mobs.npcs.caveminer.talk=Берегись темноты и глубоких провалов. Внизу не любят незваных гостей.
actors.mobs.npcs.farmcrop.water_none=Вода рядом с грядкой или колодец не дальше двух клеток немного ускорят рост.
actors.mobs.npcs.town.innkeeper.slept_party=Хозяин спит до рассвета, и вся группа просыпается с наступлением нового дня.
actors.mobs.npcs.town.mercenary.greet1=Меч к услугам того, кто хорошо платит. Хотя у тебя, похоже, денег на меня не хватит.
actors.buffs.stunned.desc=Оглушение сильно замедляет вас. Очень сильно.\n\nОсталось ходов оглушения: %s.
actors.mobs.bananaspider.desc=Банановый паук живёт в тропиках. Но этот подозрительно похож на настоящий банан.
actors.mobs.npcs.swampwitch.talk_3=«Грибы делают варево крепче. Даже слишком, говорят. Правда, дважды никто не жаловался».
actors.mobs.npcs.town.townsfolkmovie.forecast_now=А погода? Говорят, нынешняя %s продлится ещё %d ч.
actors.mobs.npcs.villager.eclipse_2=Моя бабушка видела такое. Птицы замолчали, а волки вышли охотиться средь бела дня.
actors.mobs.spiderqueen.die=Королева сворачивается клубком и затихает. Кажется, вместе с ней замирает что-то в окружающих стенах.
actors.buffs.magicsurge.desc=Вас переполняет магическая энергия стихии %s! Заклинания этой школы наносят в 4 раза больше урона.
actors.mobs.npcs.festivalcook.talk_0=Пироги! Горячие пироги! Мясные пироги, пирожки, свежий хлеб — всё за полцены в честь праздника!
actors.mobs.npcs.town.drunkard.greet7=Бар-р-д — гений! Никто не слу-ушает. А я слушаю. Та-ак слушаю, что с ног валюсь!
actors.mobs.npcs.traveller.desc=Путник, который идёт от одной деревни к другой и никого не трогает.
actors.mobs.npcs.traveller.desc_2=Гонец в синей курьерской форме. Сумка набита письмами, а времени в обрез.
actors.mobs.orbofzotmob.desc=Шар Зота ожил! Теперь он испепеляет ближайших существ чудовищно мощными лучами.
actors.mobs.spideregg.desc=Бледный шелковистый кокон едва подрагивает. То, что внутри, вот-вот вылупится.
actors.buffs.gasesimmunity.desc=Вы невосприимчивы ко всем вредоносным газам.\n\nОсталось ходов защиты от газа: %s.
actors.buffs.manaregen.desc=Ваша магическая энергия постепенно восстанавливается. Чем выше уровень магии, тем быстрее регенерация.
actors.mobs.npcs.town.employee.watched_moon=В полнолуние сеанс длится дольше обычного. Вы выходите с ощущением невероятного везения.
actors.mobs.npcs.town.mercenary.greet2=Однажды спустился на пятый этаж. Деньги получил вперёд, так что дело считай успешное.
actors.mobs.npcs.traveller.line_0=Иду из %2$s в %1$s, как велит мой обет. Да будет благословен твой путь, странник.
actors.mobs.pets.scorpion.desc=Огромный кровожадный скорпион. На конце хвоста — смертоносное жало.
actors.mobs.mrdestructo2dot0.desc=Улучшенный механизм, стреляющий по ближайшим врагам ещё более мощными лучами!
actors.mobs.npcs.sunkenidol.blessed_gold=Монеты тонут в иле. Из воды поднимается прохладное спокойствие и окутывает вас.
actors.mobs.npcs.town.bard.greet6=Совет на дорогу: если внизу услышишь музыку, это не я. Поворачивай обратно.
actors.buffs.balling.desc=Вас неудержимо крутит, и управлять движением становится трудно.\n\nОсталось ходов: %s.
actors.buffs.snowedin.desc=Толстый слой снега занёс ваши ноги и не даёт двигаться.\n\nОсталось ходов: %s.
actors.buffs.trailoffire.desc=Ваше горящее тело поджигает землю за каждым вашим шагом.\n\nОсталось ходов: %s.
actors.mobs.gnollarcher.desc=Этот гнолл замаскировался среди листвы. И явно недоволен тем, что вы его обнаружили.
actors.mobs.npcs.town.bard.played_today=Бард качает головой: «Раз в день, друг. А то ведь ещё начнёшь получать удовольствие».
actors.mobs.npcs.town.townsfolksilent.greet3=Житель смотрит на вас, потом мимо вас — в сторону шахты. Ни слова.
actors.buffs.butterbuff.desc=Всё ваше тело покрыто скользким сливочным маслом. Держаться на ногах трудно.\n\nОсталось ходов: %s.
actors.buffs.honeyed.desc=Вы словно увязли в мёде и двигаетесь с трудом.\n\nОсталось ходов: %s.
actors.mobs.lostsoul.desc=Павший герой, обречённый вечно блуждать по коридорам и охранять Мага Хаоса.
actors.mobs.npcs.roadpatrol.line_1=Из %2$s к колодцу в %1$s и обратно — каждый день, пока светло. Кто-то же должен.
actors.mobs.npcs.town.drunkard.greet8=Найдёшь внизу мою счастли-и-вую монетку — забирай. Никакая она не счастливая! Вот почему там и лежит.
actors.mobs.npcs.town.townsfolk.greet5=С тех пор как закрыли шахту, город затих. Тишина — это хорошо. Только хлеб за неё не купишь.
actors.mobs.npcs.traveller.rumour_outlaws=Разбойники захватили деревню «%1$s», что находится отсюда в направлении %2$s. Лучше выбери другую дорогу.
actors.mobs.sentinel.desc=Каменный страж с зачарованным оружием. Стоит неподвижно, пока его не потревожат.
actors.buffs.heataura.desc=Ваше тело окружено тёплой аурой, испаряющей воду поблизости.\n\nОсталось ходов: %s.
actors.mobs.adultdragonviolet.desc=Могучий взрослый дракон, выдыхающий ядовитый газ и наносящий сокрушительные удары.
actors.mobs.goldthief.desc=Плащ и кожа этого вора покрыты золотой пылью. Глаза поблёскивают безумием.
actors.mobs.mrdestructo.desc=Странный механизм ожил! Теперь он стреляет смертоносными лучами по ближайшим врагам.
actors.mobs.npcs.hermit.identified=Отшельник долго вертит находку в руках и наконец кивает. Он понял, что это.
actors.mobs.npcs.town.bishop.blessed_today=Епископ улыбается: «Одного раза в день достаточно, дитя. Владыка Глубин щедр, но не глух».
actors.mobs.npcs.town.mercenary.taught=Спустя час, полный синяков, вы начинаете кое-что понимать лучше. Получено очков навыков: %d.
actors.mobs.skeletonhand1.desc=Эта древняя гигантская кисть принадлежит королю скелетов. Её охватывает нечестивое пламя.
actors.buffs.cocoshield.desc=Прочная кокосовая скорлупа защищает вас от любого входящего урона.\n\nОсталось ходов: %s.
actors.buffs.glowing.desc=Слабое биолюминесцентное свечение выдаёт вас ближайшим врагам.\n\nОсталось ходов: %s.
actors.buffs.heatstroke.desc=Жара (%1$s°C) изнуряет вас.\n\n%2$s\n\nНайдите воду, тень или холодное место, чтобы прийти в себя.
actors.mobs.bluewraith.desc=Синий призрак послан отомстить за подземелье. Он движется с пугающей скоростью.
actors.mobs.npcs.blacksmith2.smelt_short=Этого не хватит на тигель. Для отливки сердцевины нужно %1$d %2$s, а у вас только %3$d.
actors.mobs.npcs.caravaneer.talk_stormday=С холмов надвигается непогода. Скоро отправляюсь, так что если хочешь купить — покупай сейчас.
actors.mobs.npcs.enchantingstation.cursed=Этим оружием владеет злая воля. Руны отшатываются от него — сначала сними проклятие.
actors.mobs.npcs.farmcrop.season=%1$s: рост идёт со скоростью %2$d%% от летней. Под открытым небом мороз ниже -2°C погубит посевы.
actors.mobs.npcs.hermit.talk_2=«Замёрз — поешь. Устал — отдохни. И никогда не ночуй под открытым небом выше лесной границы».
actors.mobs.npcs.villager.eclipse_1=Знаки ясны: в полдень солнце померкнет и вместе с тьмой придут ночные звери.
actors.mobs.pets.sugarplumfairy.desc=Фея сахарной сливы! Видимо, наступили праздники. Наверняка прилетела раздавать подарки.
actors.buffs.sleepiness.oncomatoseday=Вы окончательно измотаны, но сейчас слишком светло, чтобы заснуть. С наступлением ночи вы рухнете без сил.
actors.mobs.npcs.swampwitch.talk_1=«На рассвете туман такой, что собственной руки не разглядеть. С дорожных настилов не сходи».
actors.mobs.npcs.swampwitch.curse_none=Ведьма обнюхивает предмет: «Нет на нём проклятия, голубчик». За осмотр платы не берёт.
actors.mobs.npcs.swampwitch.talk_0=«Болото забирает, болото и даёт. Принеси мне травы, а я взамен кое-что получше дам».
actors.mobs.spiderservant.desc=Один из бесчисленных паучат из гнезда. Маленький, быстрый и ядовитый. И он здесь не один.
actors.mobs.npcs.sheepsokoban.desc=Эту шерстяную «коробку» можно толкать. Наткнитесь на овцу, чтобы сдвинуть её в противоположную сторону.
actors.mobs.npcs.town.innservant.greet2=Кровать стоит тридцать золотых. Завтрак включён. Завтрак — хлеб. И лучше не спрашивай, из чего он.
actors.mobs.npcs.townguard.asleep=М-м... что? Ночью здесь тихо, путник. Город спит, и тебе пора. Возвращайся на рассвете.
actors.mobs.spectralrat.desc=Призрачная крыса то появляется, то исчезает из этого мира. В глазах горит неестественная ненависть.
actors.buffs.dewinfusion.desc=Ваше тело наполняется целительной росой, постепенно восстанавливающей здоровье.\n\nОсталось ходов: %s.
actors.mobs.npcs.cagedkobold.reminder=Кобольд трясёт обмёрзший замок и выжидательно смотрит на вас. Всё ещё нужен ледяной ключ.
actors.mobs.npcs.hermit.talk_4=«Не трогай орлиные яйца. Я за этот урок глазом заплатил. Второй терять не хочется».
actors.mobs.npcs.tinkerer2.need_mushroom=Я ищу грибы-поганки. Принесёте мне поганки, если найдёте?
actors.mobs.npcs.tinkerer3.need_mushroom=Я ищу грибы-поганки. Принесёте мне поганки, если найдёте?
actors.mobs.npcs.town.librarian.greet3=Кто-то постоянно возвращает мокрые книги. Не после дождя мокрые — из глубокой воды. Я перестал спрашивать.
actors.mobs.npcs.town.mercenary.greet5=Стражники думают, что охраняют город. На самом деле его охраняю я. А они охраняют стражников.

# Russian localization: batch 500 no. 6
actors.mobs.yeti.desc=Йети — загадочное и неуловимое создание. Вероятно, его привели сюда свирепые холода.
actors.buffs.drunk.desc=Вы пьяны: при каждом шаге вас может занести в случайную сторону.\n\nОсталось ходов: %s.
actors.buffs.shield.desc=Магия лунной ягоды защищает вас от урона. Щит выдержит несколько ударов, после чего исчезнет.\n\nОсталось ударов: %d.
actors.mobs.assassin.desc=Синоби — убийцы из клана Тенгу. Они стремительно атакуют противников издалека.
actors.mobs.npcs.town.fortunetellerfolk.revealed=Гадалка внимательно изучает ваш предмет (%s) и раскрывает его свойства. Вновь обратиться к ней можно в следующем сезоне.
actors.mobs.spiderbot.desc=Металлический паук — странный маленький механизм, который бродит по подземелью в поисках добычи.
actors.mobs.gullin.desc=Невероятно сильное существо с почти непробиваемой шкурой. При ранении выпускает ядовитые испарения.
actors.mobs.npcs.town.townguardfolk.greet4=Если собрался спускаться, оставь кому-нибудь своё имя. Только не мне: мне не платят за то, чтобы их помнить.
actors.blobs.snowwhirlwind.desc=Здесь бушует снежный вихрь. Всякого, кто попадёт внутрь, засыплет снегом с головой.
actors.buffs.drowsyspell.desc=Заклятие навевает на цель сонливость. Через несколько ходов она погрузится в глубокий сон.
actors.mobs.npcs.dwarvenforge.short=На тигель этого не хватит. Чтобы отлить сердцевину, кузнице нужно %1$d ед. материала «%2$s», а у тебя только %3$d.
actors.mobs.npcs.swampwitch.night=Ведьма отмахивается от вас: «Ночью травки собирают, милок, а не торгуют. Приходи днём».
actors.buffs.rosebarrier.desc=Преграда из зачарованных розовых лоз полностью поглощает входящий урон.\n\nОсталось ходов: %s.
actors.mobs.npcs.hermit.talk_0=«Чем выше забираешься, тем холоднее. Дураки об этом забывают. А весной я нахожу их, когда сходит снег».
actors.mobs.npcs.sheepsokobancorner.desc=Эту шерстяную «глыбу» можно толкать в любом направлении, в том числе по диагонали. Чтобы толкнуть её, сделайте шаг в её сторону.
actors.mobs.npcs.town.mercenary.no_lesson=Он окидывает вас взглядом. «Я учу тех, кто умеет возвращаться. Принеси голову босса — тогда поговорим».
actors.buffs.heatstroke.tier_severe=_Тяжёлый тепловой удар._ Кожа горит, здоровье непрерывно убывает. Голод усиливается на 25%% быстрее.
actors.mobs.npcs.town.bard.greet1=Песенку спеть, путник? Жили мы с женой вдвоём, был у нас уютный дом...
actors.mobs.npcs.town.townsfolkmovie.forecast_soon=А погода? Говорят, надвигается %s. Примерно через %d ч., и задержится у нас на %d ч.
actors.buffs.disarmed.desc=Удар ослабил вашу хватку. Следующий успешный удар нанесёт вдвое меньше урона.\n\nОсталось ходов: %s.
actors.buffs.luck.desc=Удача на вашей стороне: неудачные случайные события реже оборачиваются против вас.\n\nОсталось ходов: %s.
actors.mobs.brownwolf.desc=Эти огромные бесшумные волки вольготно чувствуют себя в подземельях. Особенно опасны они в стае.
actors.mobs.graywolf.desc=Эти огромные бесшумные волки вольготно чувствуют себя в подземельях. Особенно опасны они в стае.
actors.mobs.npcs.traveller.desc_3=Фермер со старым соломенным колпаком несёт на рынок мешок урожая. Шляпа эта повидала не одно лето.
actors.mobs.npcs.travellingmerchant.talk_1=Каждая реликвия на этой ткани пережила своего хозяина. Обращайся с ними бережно — они помнят чужие руки.
actors.buffs.plagueaura.desc=Чумная аура обрекает на гибель всех, кто к ней приблизится.\n\nАура продержится ещё %s ходов.
actors.mobs.npcs.farmcrop.desc_dormant=Растение на грядке созрело на %d%%. Сейчас оно не растёт: зимой под открытым небом ничто не растёт.
actors.mobs.npcs.ratkingden.desc=Эта крыса чуть крупнее обычной сумчатой крысы и носит на голове крошечную корону.
actors.mobs.npcs.sunkenidol.blessed_item=Ваш дар исчезает в глубине. Кажется, глаза идола блеснули, а болотный холод больше не пробирает до костей.
actors.mobs.npcs.town.innservant.greet3=Тот, в углу, не платил с самой зимы. Хозяин говорит: «Он создаёт атмосферу». А я говорю: «Он должен нам денег».
actors.mobs.npcs.town.townguardfolk.greet3=Наёмник уверяет, что охраняет наш город. Только вот в зимний ночной дозор он ни разу не выходил.
actors.mobs.npcs.traveller.rumour_caravan=По дороге %1$s %2$s отсюда мне встретился караван. Цены честные, если успеешь застать торговца на месте.
actors.mobs.npcs.villager.farmer_garden_0=На этой земле настоящего поля не разведёшь. Всё наше хозяйство — огородик у самого порога.
actors.buffs.berryregeneration.desc=Энергия ягод разливается по телу и постепенно восстанавливает здоровье.\n\nОсталось восстановлений: %d.
actors.mobs.magiceye.desc=Парящий глаз выпускает разрушительные лучи энергии, способные пронзить сразу несколько целей.
actors.mobs.npcs.caveminer.greeting=Руда? Самоцветы? Тащи сюда. Торгаши наверху не отличат жилу от трещины и платят соответственно.
actors.mobs.npcs.dwarvenforge.cold=Ты уже залил сегодня один тигель. На это целый день уходит. Приходи завтра.
actors.mobs.npcs.town.bard.greet3=Пьяница платит мне советами. Вчера посоветовал: «Играй громче!» Я так и сделал. Хозяин трактира вычел из жалованья.
actors.mobs.npcs.town.drunkard.done_today=Он щурится то на монету, то на вас. «Не-а. Три — мой предел. Или твой. Чей-то точно».
actors.blobs.unfilteredsunlight.desc=Здесь палит невероятно яркий солнечный свет. Нежить, оказавшаяся под его лучами, может погибнуть мгновенно.
actors.buffs.armorenhance.desc=Ваша броня временно усилена!\n\nДополнительное улучшение: _%1$d_.\nОсталось ударов: _%2$d_.
actors.mobs.bluecat.desc=Таинственный вор, способный двигаться с невероятной скоростью. Особенно его привлекают могущественные артефакты.
actors.mobs.npcs.caravaneer.saved_log=Благодарный караванщик оставляет у прилавка подарок и до конца дня снижает цены.
actors.mobs.npcs.sheepsokobanblack.desc=Если толкнуть эту чёрную овцу, она переместится к ближайшей ловушке для стрижки. Если таких ловушек нет, овца исчезнет.
actors.mobs.npcs.town.fortunetellerfolk.nothing=У вас нет вещей с нераскрытыми свойствами. Возвращайтесь, когда найдёте что-нибудь новое.
actors.mobs.ratboss.desc=Крупная и хитрая крыса, вожак мелких вредителей. Почувствовав угрозу, зовёт подмогу.
actors.mobs.sokobansentinel.desc=Эта статуя охраняет комнаты с головоломками. Двигается медленно, зато наносит мощные удары зачарованным оружием.
actors.buffs.weaponenhance.desc=Ваше оружие временно усилено!\n\nДополнительное улучшение: _%1$d_.\nОсталось ударов: _%2$d_.
actors.buffs.iceaura.desc=От вас исходит ледяная аура, охлаждающая ближайших существ при движении.\n\nОсталось ходов: %s.
actors.buffs.lichendrop.desc=Капля лишайника прилипла к вам и медленно расползается по коже.\n\nОсталось ходов действия лишайника: %s.
actors.mobs.npcs.otilukenpc.first_rescue=Спасибо! Зот заточил меня здесь, а мои силы запер в каменном големе, которого ты одолел. Давай вернёмся в город!
actors.mobs.npcs.town.employee.greet4=Проектор работает на какой-то штуковине от гадалки. Я не расспрашиваю. В полнолуние она странно гудит.
actors.mobs.npcs.town.townsfolk.greet3=Вид у тебя такой, словно задумал геройский подвиг. Последний герой с таким же видом до сих пор должен мне сорок золотых.
actors.weatherattunement.skin_condenser=Конденсатор умельца собирает росу прямо из воздуха: при такой влажности примерно по капле каждые %d ходов.
actors.mobs.npcs.otilukenpc.rescued_pudding=Спасибо за спасение! Ты избавил вселенную от великого зла! Вот тебе стаканчик пудинга, заслужил!
actors.mobs.npcs.town.townsfolkmovie.greet5=Епископ молится за каждого героя, уходящего вниз. У него есть список. Длинный. В последнее время он пишет всё мельче.
actors.mobs.poisongoo.desc=Небольшой сгусток мерзкой слизи, вобравший ядовитую энергию. При опасности разделяется на части.
actors.buffs.slippery.desc=Вы плохо держитесь на ногах. С вероятностью 30%% можете поскользнуться и упасть в соседнюю пропасть.\n\nОсталось ходов: %s.
actors.mobs.npcs.lakeshrine.prompt=Бросьте золото в неподвижную воду, и, возможно, идол ненадолго возьмёт вас под защиту. Он принимает лишь один дар в день.
actors.mobs.npcs.town.townsfolkmovie.greet2=Говорят, вход в старую шахту на окраине не так уж завален. Хотя чего только не говорят...
actors.mobs.skeletonhand2.desc=Эта древняя гигантская рука принадлежит королю скелетов. Она опутывает жертв цепкими отростками.
actors.buffs.heatstroke.tier_critical=_Критический тепловой удар._ Тело обжигает, урон быстро возрастает. Голод усиливается на 35%% быстрее. Вы можете потерять сознание.
actors.buffs.sleep.desc=Крепкий сон. Спящее существо ничего не делает, пока не проснётся.\n\nОсталось ходов сна: %s.
actors.buffs.sprouting.desc=Прорастание замедляет вас и оставляет за вами дорожку из травы.\n\nОсталось ходов прорастания: %s.
actors.mobs.npcs.portalgate.desc_dead=Разрушенные врата портала. С гибелью хранителя их магия угасла: теперь они больше никого не перенесут.
actors.mobs.npcs.travellingmerchant.flee=Странствующие торговцы поспешно грузят товары в повозки и с грохотом уезжают. Торговля на сегодня закончена.
actors.mobs.seekingbomb.desc=Эта бомба рыщет по подземелью в поисках врагов. Обнаружив цель, она бросится на неё и взорвётся при столкновении.
actors.buffs.high.desc=Вы одурманены. Каждый ход можете случайно оступиться или внезапно ускориться.\n\nОсталось ходов: %s.
actors.ledger.damageledger.rift_flare_desc=Под вами вспыхнул пещерный разлом: от 3 до 8 ед. урона, часть которого поглощает броня. Отойдите, когда его свечение усилится.
actors.mobs.beetle.desc=Крупный бронированный жук, снующий по подземелью. Чем глубже вы спускаетесь, тем опаснее он становится.
actors.mobs.npcs.town.drunkard.greet5=Я раз вниз пошёл. Первый этаж. Гляжу — крыса в короне! Я пулей назад. С тех пор тута сижу. Лушшее решенье в жиззи!
actors.mobs.npcs.traveller.rumour_ruin=%1$s %2$s отсюда есть древние руины. Говорят, лестница в самом их сердце ведёт глубоко во тьму.
actors.mobs.greyoni.desc=Они — злобные тролли, обитающие в местах великой силы. Серые они особенно свирепы и ничуть не менее прожорливы...
actors.mobs.npcs.blacksmith2.smelted_bonus=«Такой металл редко выходит из породы». Кузнец оставляет опилки себе и платит вам за них %d золотых.
actors.mobs.npcs.farmcrop.water_active=Рядом %d клеток воды: они ускоряют рост растения и помогают ему выжить. Это влаголюбивая культура, и она получает полную пользу.
actors.mobs.npcs.town.townguardfolk.bounty_done=Он оглядывает пустую доску объявлений. «На сегодня все награды выданы. Приходи завтра — дело всегда найдётся».
actors.mobs.npcs.traveller.line_1=Иду с товаром в %1$s. В %2$s на этот раз купили разве что нитки. Надеюсь, в %1$s кошельки потолще.
actors.buffs.magicimmunity.desc=Вы невосприимчивы к большинству магических атак, газов и вредоносных эффектов.\n\nОсталось ходов иммунитета к магии: %s.
actors.buffs.springbloom.desc=Вас окружает жизненная сила природы. Пока кружатся лепестки, здоровье медленно восстанавливается.\n\nОсталось ходов: %s.
actors.mobs.kupua.desc=Могущественное существо-оборотень. При сильных ударах выпускает ядовитый газ, а прочная шкура поглощает большую часть урона.
actors.mobs.npcs.farmcrop.water_hint=Это растение любит воду. Соседняя клетка воды или колодец в радиусе двух клеток ускоряют рост и замедляют увядание.
actors.mobs.npcs.travellingmerchant.talk_2=Таких настоек и свитков в деревенских лавках не сыщешь. Дважды перегоняли, писали мастера куда искуснее меня.
actors.mobs.oni.desc=Они — злобные тролли, обитающие в местах великой силы. Они довольно ленивы, если только рядом нет еды...
actors.buffs.fullmoonstrength.desc=Сила полнолуния усиливает вашу ярость, позволяя ей сохраняться после нескольких ударов.\n\nОсталось ударов: %d.
actors.mobs.demongoo.desc=Демонический слизень злится, что вы прикончили его приятеля в канализации. При угрозе разделяется и сочится тёмной энергией.
actors.mobs.npcs.caravaneer.talk_lightday=Вот и конец пути. Торговать буду до заката, а потом разверну мула и начну всё сначала.
actors.mobs.npcs.town.townguardfolk.greet5=Прошлой зимой волки подходили к стенам. Ближе, чем готов признать капитан. Не выходи на дорогу после заката.
actors.mobs.shadowyog.desc=Йог отступил в логово, приняв теневую форму. Существа в логове подпитывают силу его легиона.
actors.mobs.fossilskeleton.desc=Кости этого скелета будто окаменели от древности. После гибели он рассыпается взрывом костяных обломков.
actors.mobs.npcs.tinkerer5.beacon=Тебе понадобится этот маяк, оставленный Отилюком. Используй его, когда захочешь вернуться в город, и всегда держи при себе.
actors.mobs.npcs.townguard.beacon=Тебе понадобится этот маяк, оставленный Отилюком. Используй его, когда захочешь вернуться в город, и всегда держи при себе.
actors.mobs.spiderguard.desc=Тяжёлый бронированный паук, охраняющий проход в глубины гнезда. Его укус способен намертво обездвижить конечность.
actors.mobs.tower.desc=Механическая конструкция, создающая сломанных роботов для своей защиты. Получив урон, она поднимает тревогу среди ближайших существ.
actors.buffs.accuracymark.desc=Первая дальнобойная атака героя уже поразила это существо. Гарантированное попадание от навыка «Меткость» на этой цели израсходовано.
actors.mobs.npcs.roulettetable.no_cores=Крупье постукивает граблями по сукну. Здесь ставят сердцевины шедевров, а у вас нет ни одной.
actors.mobs.npcs.swampwitch.talk_2=«Старое святилище посреди воды? Оставь там что-нибудь блестящее — оно приглядит за тобой. Только после заката туда не суйся».
actors.mobs.npcs.town.drunkard.pitch=Он шлёпает монетой по столу. «Загадывай! Ставь скока хочешь. Я выиграю — моё. Ты выиграешь — вдвое больше. Монета честная. Почти».
actors.mobs.npcs.traveller.desc_0=Паломник в одежде из некрашеной шерсти ходит от святилища к святилищу с одним посохом. Сама дорога для него — молитва.
actors.mobs.npcs.town.bishop.greet6=Мы хороним здесь немногих. Те, кто спускается вниз, редко возвращаются в пригодном для погребения виде. Прими это как совет, не как проклятие.
actors.mobs.npcs.blacksmith2.smelt_tomorrow=Один тигель в день, не больше. Сегодня ты уже отлил своё — здесь или в другой кузнице. Остальное приноси завтра.
actors.mobs.npcs.caravaneer.talk_tideday=На полпути из одного места в другое — самая честная часть дороги, где товар стоит ровно столько, сколько должен.
actors.mobs.npcs.swampwitch.talk_4=«Мазь для промокших ног, фонарь от тумана, а от всего остального — мои снадобья. Или покупай, или перестань капать на пол!»
actors.mobs.npcs.villager.farmer_garden_2=На тёплых равнинах распахивают целые поля. А здесь мы с трудом выращиваем несколько рядков во дворе и зовём это урожаем.
actors.buffs.sugarrush.desc=Вас переполняет энергия: скорость передвижения резко возрастает.\n\nОсталось ходов: %s.
actors.mobs.crabking.desc=Король крабов собирает защитные магические предметы, чтобы стать сильнее. От врагов он прячется под мощным панцирем.
actors.mobs.npcs.town.drunkard.greet6=Знашь, што от холода помогаить? Во! А от жары? Тож во! А знашь, што плохо? Когда кончаицца!
actors.mobs.npcs.town.townsfolkmovie.greet3=Библиотекарь и гадалка не разговаривают уже одиннадцать лет. Поссорились из-за книги, говорят. Только никто не знает какой.
actors.buffs.suneyes.desc=Ослепительная вспышка закалила ваши глаза.\n\nВас нельзя ослепить.\n\nОсталось ходов: %s.
actors.mobs.brokenrobot.desc=Неисправный механизм, стреляющий беспорядочными энергетическими лучами. Есть небольшая вероятность, что он взорвётся сам.
actors.mobs.minotaur.desc=Минотавр наполовину человек, наполовину бык, а злости в нём — на двоих. Он бродит по подземелью и насаживает чужаков на рога.
actors.mobs.soulelemental.desc=Тёплый огонёк, неотступно следующий за вами. Он жжёт без пламени и сражается на вашей стороне, пока не угаснет его искра.
actors.buffs.heavy.desc=Ваши шаги стали такими тяжёлыми, что вызывают землетрясения и ранят ближайших врагов.\n\nОсталось ходов тяжести: %s.
actors.buffs.parasiticinfection.desc=В ваше тело проникли паразиты. Ничего хорошего от них не ждите.\n\nОсталось ходов заражения: %s.
actors.mobs.npcs.town.innkeeper.net_host_only=Кровать в вашем распоряжении, если хозяин группы решит остановиться. Ночь проходит сразу для всех, поэтому завершить день может только он.
actors.mobs.npcs.town.innservant.greet4=Герои щедро оставляют чаевые по пути вниз. А вот наверх чаевых никто не приносил. Да и героев оттуда я не припомню.
actors.mobs.npcs.town.librarian.greet5=Одиннадцать лет назад гадалка взяла у меня книгу о Луне. Я до сих пор не попросил её вернуть. Всё собираюсь с духом.
actors.mobs.npcs.traveller.rumour_dragon=Не ходи на возвышенности %1$s %2$s отсюда. Там поселилось крылатое чудище и спит на ложе из награбленного золота.
actors.buffs.superballing.desc=Вы безудержно отскакиваете от стен. Проносясь мимо врагов, вы сбиваете их с толку.\n\nОсталось ходов: %s.
actors.mobs.npcs.caravaneer.talk_forgeday=Второй день в пути. Мул дуется, дорога в колдобинах, зато товар сухой. Погляди, пока нас дождь не накрыл.
actors.mobs.npcs.travellingmerchant.talk_0=Кольца с солёного побережья, палочки из ясеня, в который ударила молния. Через три дня уеду — покупай сейчас или догоняй повозку.
actors.buffs.thornbark.desc=Ваши ноги покрыты крепкой, как кора, кожей и вырываются из любых пут.\n\nВас нельзя обездвижить корнями.\n\nОсталось ходов: %s.
actors.mobs.deer.desc=Лесной олень — длинноногий и пугливый. При виде хищника или вас он бросается прочь, но быстро устаёт.
actors.mobs.npcs.blacksmith2.no_fragments=Звёздный металл? Принеси два осколка упавшей звезды, и я выкую из них сердцевину. Один осколок жара не выдержит.
actors.mobs.npcs.caravaneer.talk_harvestday=Почти приехали. Сегодня буду спать под крышей, а на последнем отрезке пути лучше нести монеты, чем груз. Предлагай цену.
actors.mobs.npcs.dwarvenforge.smelted=Вы отправляете в печь %1$d ед. материала «%2$s» и обрабатываете заготовку на старой наковальне. В багровом свете разлома остывает сердцевина шедевра.
actors.mobs.npcs.town.employee.greet2=Каждую ночь одна и та же картина. Я видел её раз четыреста, но до сих пор не знаю концовку: к тому времени уже подметаю.
actors.mobs.skeletonking.desc=Этот древний огромный череп принадлежит королю скелетов. Его пылающий взгляд ослабляет всякого, кто осмелится ему противостоять.
actors.buffs.dehydrated.desc=Обезвоживание сильно замедляет вас. Избавиться от него можно, выпив воды.\n\nОсталось ходов обезвоживания: %s.
actors.buffs.feelers.desc=Чуткие усики усиливают ваши атаки.\n\nПока действует эффект, вы наносите вдвое больше урона.\n\nОсталось ходов: %s.
actors.ledger.damageledger.tree_fall_desc=Падающее дерево задело вас и отняло треть оставшегося здоровья. Держитесь подальше от той стороны, в которую оно падает.
actors.mobs.npcs.town.librarian.greet6=Тс-с. Вон тот в углу с весны сидит на одной странице. Кажется, он спит. Но проверять было бы невежливо.
actors.mobs.thiefking.desc=Грозный предводитель гильдии воров. Издалека бросает отравленные дротики, а в ближнем бою не менее опасен.
actors.mobs.npcs.caravaneer.talk_spared=Кто-то порубил тех головорезов, пока я прятался под телегой. С удовольствием пожал бы спасителю руку. Ну что, покупать будешь?
actors.mobs.npcs.tinkerer1.desc=Джей Мертенс — выдающийся исследователь подземелий и мастер магических устройств. Его защищает волшебный щит.
actors.mobs.npcs.town.bard.greet4=Каждый спускающийся герой просит сочинить о нём песню. Я пишу её заранее, ещё до отъезда. Так быстрее. Понимаешь, о чём я?
actors.mobs.npcs.town.bishop.greet4=Ночью колокол трижды звонил, хотя никто не трогал верёвку. Бард сказал, что это ветер. Я не спорил. Просто зажёг ещё свечу.
actors.buffs.shadow.desc=Густая тень скрывает вас, делая почти невидимым и снимая вредоносные эффекты.\n\nОсталось ходов: %s.
actors.buffs.wither.desc=Ваша стойкость ослаблена.\n\nПока действует увядание, урон, который вы отражаете атакующему, уменьшается вдвое.\n\nОсталось ходов: %s.
actors.mobs.gooplant.desc=Живая масса волшебной слизи, пустившая корни. Сражается на вашей стороне и при каждом ударе покрывает врагов едкой слизью.
actors.mobs.npcs.festivalcook.desc=Повар приехал на деревенский праздник с тележкой горячей еды. Сегодня всё на прилавке вдвое дешевле обычного.
actors.mobs.npcs.fisherman.talk_summer=Тихая вода, сонная рыба, неспешный день. Посиди, если хочешь: где-то была бутылочка, а с утра тут никто не переправлялся.
actors.mobs.shell.desc=Электрический панцирь потрескивает от энергии. Его мощные молнии поражают всех живых существ в логове.
actors.mobs.spidermind.desc=Бледный раздутый паук держится в стороне от схватки и издалека доводит остальной выводок до бешенства.
actors.mobs.icedemon.desc=Этих мелких демонов заботит лишь служба своему владыке. В жилах у них лёд, а в маленьких сердцах — чистое зло.
actors.mobs.npcs.caravaneer.talk_saved=Меня до сих пор трясёт, не скрою. До темноты любой товар отдам тебе по дружеской цене. Это самое малое, что я могу сделать.
actors.mobs.npcs.dwarvenforge.prompt=Кузница разогрета. Глубинная руда здесь плавится лучше, чем у любого кузнеца: на одну сердцевину нужно семь единиц глубинного серебра или небесного железа.
actors.buffs.huntersfocus.desc=Ваши чувства обострены для охоты.\n\nВы двигаетесь на 20%% быстрее, а точность атак повышена на 15%%.\n\nОсталось ходов: %s.
actors.buffs.moonstruck.desc=Вы купаетесь в лунном свете (сила: %s). В освещённых луной местах нежить и демоны получают священный урон.\n\nОсталось ходов: %s.
actors.mobs.bunny.alpine_desc=Высокогорный заяц с густой шерстью, защищающей от холода. Завидев вас, сразу ускачет по снегу.
actors.mobs.minesentinel.desc=Каменный страж глубоких шахт. Вооружён могущественным зачарованным оружием, а по-настоящему ранить его можно лишь реликтовым.
actors.mobs.npcs.blacksmith2.no_cores=Для работы над шедевром нужны сердцевины шедевра, а у тебя ни одной. Их можно добыть из сердец великих чудовищ внизу. Принеси мне.
actors.mobs.npcs.fisherman.desc=Он рыбачит на этой переправе ещё с тех времён, когда доски моста были целыми, и продаёт всё, что сегодня попалось на крючок.
actors.mobs.npcs.otilukenpc.first_rescue_beacon=Спасибо! Зот заточил меня здесь, а мои силы запер в каменном големе, которого ты одолел. Возьми этот маяк, и вернёмся в город!
actors.mobs.npcs.town.employee.greet3=Как-то раз к нам пришёл герой, высидел весь сеанс, потом спустился в подземелье и не вернулся. Зато оставил отличный отзыв.
actors.buffs.claritybuff.desc=Ваш разум ясен и легко усваивает новое.\n\nЗа убийства, приносящие опыт, вы получаете на 50%% больше опыта.\n\nОсталось убийств: %d.
actors.buffs.heatstroke.tier_lethal=_СМЕРТЕЛЬНЫЙ ПЕРЕГРЕВ._ Вы буквально сгораете заживо. Постоянный колоссальный урон. Голод усиливается на 50%% быстрее. Потерять сознание можно в любой момент.
actors.mobs.npcs.caravaneer.talk_shadowday=Неделя к концу, поклажа полегчала. Осталось лишь то, чего никто не купил. Но это ещё не значит, что товар плохой.
actors.mobs.npcs.summitcairn.desc=Груда камней, сложенная каждым, кто добрался до вершины. Каждый камень сюда принесли вручную. Для ещё одного всегда найдётся место.
actors.mobs.seekingclusterbomb.desc=Эта бомба ищет по подземелью врагов. Настигнув цель, она бросится к ней и устроит целую серию взрывов вокруг.
actors.ledger.damageledger.haunted_remains_desc=Вы потревожили проклятые останки, но призраку негде было появиться. Поэтому проклятие отняло половину оставшегося здоровья.
actors.mobs.npcs.town.mercenary.greet3=Правило первое: не дерись в воде. Правило второе: не дерись на лестнице. Правило третье... А вот за него придётся заплатить.
actors.mobs.spidernest.desc=Неподвижный клубок паутины и яиц, из которого постоянно выводятся новые пауки. Гнездо не двигается, но и останавливаться не собирается.
actors.buffs.dewcharge.desc=Роса конденсируется из воздуха прямо в ваш бурдюк. Чем выше влажность, тем быстрее он наполняется. Эффект складывается с конденсатором умельца.
actors.buffs.ironskin.desc=Ваша кожа затвердела до прочности металла: каждый полученный удар наносит всего одну единицу урона.\n\nОсталось ходов: %s.
actors.mobs.npcs.town.fortunetellerfolk.spent=На этой неделе я уже трижды гадала тебе, путник. Дар не возвращается так быстро. Приходи на следующей неделе.
actors.blobs.holywaterpool.desc=Земля здесь пропитана освящённой водой. Она обжигает всех стоящих на ней, а нежить и демонов — вдвое сильнее.
actors.buffs.elementalorbit.desc=У вас %1$d огненных или ледяных сфер. Следующая сфера созрела на %2$d/3 этапа. Примените «Орбиту стихий», чтобы выпустить её без затрат маны.
actors.mobs.npcs.climatecrystalward.desc=В землю вмонтирован климатический кристалл. В радиусе двух клеток от него воздух остаётся умеренным, какой бы ни была жара или стужа вокруг.
actors.mobs.npcs.festivalchampion.terms=Хочешь дружеский поединок за праздничный приз? Кто первым потеряет две трети сил, тот и сдаётся. Скажи ещё раз — и начнём!
actors.mobs.npcs.town.mercenary.pitch=Он загибает пальцы. «По моим подсчётам, тебе полагается %d урок(ов). По _%d_ золотых за каждый. Узнаешь три полезные вещи».
actors.buffs.lokispoison.desc=По вашим венам разливается сильный яд от цепа Локи, причиняя значительный урон со временем.\n\nОсталось ходов отравления: %s.
actors.mobs.npcs.traveller.rumour_watched=По дороге %1$s %2$s отсюда я видел караван, а рядом — нескольких угрюмых типов, притаившихся среди деревьев. Расспрашивать не стал.
actors.mobs.littower.desc=Башня, потрескивающая от невероятной электрической энергии. Почти неразрушима и поражает нарушителей мощными молниями.
actors.mobs.npcs.storagechest.desc=Ваш крепко собранный личный сундук. В нём хранится %d из %d предметов. Его можно сложить и перенести, не потеряв содержимое.
actors.mobs.slimebrown.desc=Слизни выглядят как мерзкие кучки слизи, но кусаются довольно больно. Коричневый слизень, пожалуй, самый слабый из подземных слизней.
actors.buffs.rainbowblessing.desc=В небе раскинулась радуга — доброе предзнаменование. Шанс выпадения добычи повышен, а точность увеличена на 5%%.\n\nОсталось ходов: %s.
actors.mobs.npcs.dwarvenforge.desc=Наковальня из чёрного железа стоит у печи, вырубленной в скале. Обе старше любого земного королевства. Жар разлома не даёт горну остыть.
actors.mobs.npcs.fisherman.talk_winter=На рассвете прорубил лунку, а она уже дважды затянулась льдом. Там, внизу, рыбка непривередливая. Как и я. Отдам недорого.
actors.mobs.npcs.town.townguardfolk.greet2=При мне из шахт никто не выбирался. Да и вообще никто оттуда не выбирался. Мне нравится думать, что это моя заслуга.
actors.buffs.fireflyglow.desc=Мерцающие светлячки помогают вам слиться с ночной темнотой. Скрытность усиливается, а уклонение повышается на 10%%.\n\nОсталось ходов: %s.
actors.buffs.surefooting.desc=Под ногами любая поверхность кажется надёжной.\n\nВас нельзя покалечить, замедлить или обездвижить корнями.\n\nОсталось ходов: %s.
actors.mobs.mossyskeleton.desc=Ожившие останки участника великой битвы. Этот скелет поднялся из земли, покрытый мхом, и очень недоволен вашим вторжением.
actors.mobs.npcs.blacksmith2.smelted=Тролль высыпает %1$d ед. материала «%2$s» в тигель, обрабатывает заготовку на наковальне и вручает вам ещё тёплую сердцевину шедевра.
actors.mobs.npcs.sleepparalysisdemon.desc=Силуэт у края кровати, которому там не место. Ранить его нельзя, а прикосновение парализует ваше тело, пока он не исчезнет.
actors.mobs.npcs.town.townsfolk.greet2=Это были вещи моего брата. Осенью он спустился с хорошим мечом и ещё лучшим плащом. Плащ вернулся на крысе. Я его забрал.
actors.mobs.npcs.witchcauldron.desc=Чёрный железный котёл на трёх коротких ножках. Над углями бурлит зелёное варево, а пар пахнет мхом и перцем.
actors.buffs.fiendburning.desc=Вас охватывает потустороннее пламя, наносящее тяжёлый урон и способное поджечь ваши вещи.\n\nОсталось ходов горения: %s.
actors.mobs.npcs.blacksmith2.starforged=Тролль складывает два светящихся осколка вместе и бьёт по ним на наковальне. Когда звон стихает, в клещах остывает сердцевина шедевра.
actors.mobs.npcs.caravaneer.talk_stonesday=Вышел с первым светом, впереди ещё вся неделя. Тюки полны — значит, всё ещё продаётся.
actors.mobs.npcs.ratkingden.desc_winter=Эта крыса чуть крупнее обычной сумчатой. Вместо привычной короны на ней крошечная праздничная шапочка. С праздниками!
actors.mobs.npcs.caravaneer.saved_thanks=Ушли, все до одного! Ты спас и мою шкуру, и мула. Возьми это — а до конца дня плати, как мой родной брат.
actors.mobs.npcs.magicorb.desc=Парящая сфера бледно-голубого света. Каждый удар по ней отражается на всех видимых существах, а даже слабая магия её разрушает.
actors.mobs.npcs.traveller.desc_1=Сутулый коробейник несёт иголки, ленты, фитили для ламп и свежие сплетни. Сверху к тюку привязана постель для ночёвок между деревнями.
actors.mobs.npcs.caravaneer.talk_robbed=Ты видел их. Видел — и прошёл мимо. Половину товара утащили в лес... Остатки продаю, как и раньше. Деньги есть деньги.
actors.mobs.npcs.town.bishop.pitch=Десятина в _%d_ золотых дарует благословение Владыки Глубин на следующий отрезок пути: рука станет вернее, а шаг — легче на долгое время.
actors.mobs.dwarflich.desc=Могущественный маг, принесённый в жертву ради поддержания неживого короля дворфов. Лич поражает врагов издали силой смерти.
actors.mobs.greyrat.desc=Серые крысы — более крепкие родственники сумчатых крыс. Они приспособились жить даже в самых загрязнённых участках канализации.
actors.mobs.koboldicemancer.desc=Кобольд, научившийся вытягивать холод из воздуха и метать его во врагов. Держит дистанцию и замедляет тех, кто приближается.
actors.mobs.npcs.hermit.desc=Старик в заплатанной серой шерстяной одежде, с бородой белее снега вокруг. Он живёт один на горе дольше, чем готов признать.
actors.buffs.digesting.desc=Паразит медленно пожирает вас изнутри. Когда действие эффекта закончится, вы получите большой разовый урон.\n\nОсталось ходов: %s.
actors.mobs.npcs.hermit.talk_1=«Кое-где из скалы бьёт горячая вода, даже выше снежной границы. Посидишь в ней, обсохнешь у костра — вот так здесь и живут».
actors.buffs.wading.desc=Болотный бальзам покрывает сапоги и ноги. Грязь к ним не липнет, а трясинная вода больше не замедляет шаг.\n\nОсталось ходов: %s.
actors.mobs.albinopiranha.desc=Эти огромные слепые пещерные рыбы живут в подземных водоёмах. Колебания воды подсказывают им, где добыча. Выглядят они свирепыми и голодными.
actors.mobs.npcs.lakeshrine.desc=На берегу стоит маленький истёртый каменный идол, обращённый к воде. На дне блестят монеты: шахтёры бросали их сюда на удачу.
actors.mobs.zombie.desc=Зомби — тела незадачливых искателей приключений и обитателей подземелья, оживлённые зловещей магией, струящейся из глубин.
actors.mobs.npcs.fisherman.talk_autumn=Коптильня теперь дымит день и ночь. Как ударят морозы, ловить станет нечего, вот и копчу над ольховыми ветками всё, что удаётся вытащить.
actors.mobs.npcs.town.bard.greet2=Однажды сочинил балладу о шахтах. Двенадцать куплетов! До седьмого никто не досидел, так что теперь это баллада о девушке. Мелодия та же.
actors.mobs.npcs.town.bishop.greet3=В Писании сказано, что Владыка Глубин обитает ниже самого глубокого уровня. Шахтёры говорят то же самое, только грубее. И копать перестали.
actors.mobs.slimered.desc=Слизни похожи на мерзкие липкие комки, но кусаются довольно больно. Красные слизни вдобавок ещё и ядовиты.
actors.mobs.coldspirit.desc=Сгусток морозного воздуха, дрейфующий по ледяным пещерам, твёрдый, словно обдуваемый им камень. Где он коснётся, даже воздух покрывается инеем.
actors.mobs.soulemental.desc=Могучий дух стихии, вызванный жаром зелья чили. Верно сражается на вашей стороне, обжигая врагов огненными атаками.
actors.buffs.halomethaneburning.desc=Вас мучительно обжигает химическое пламя. Оно наносит больше урона, чем обычный огонь, но не воспламеняет вещи.\n\nОсталось ходов горения: %s.
actors.mobs.spiderexploding.desc=Раздутый, едва не лопающийся паук бросается на любого, кто подойдёт близко, и взрывается при соприкосновении, разбрызгивая вокруг остатки последней трапезы.
actors.buffs.aurorabless.desc=Мерцающее северное сияние дарует удачу. Шанс выпадения добычи значительно повышен, а точность увеличена на 10%%.\n\nОсталось ходов: %s.
actors.buffs.beetleinfected.desc=Паразитическая инфекция делает вас уязвимее.\n\nПока вы заражены, любая атака наносит на 2 ед. урона больше.\n\nОсталось ходов: %s.
actors.buffs.phantomecho.desc=На месте, где вы только что стояли, осталась тень, готовая повторить ваш удар. Пока она не исчезла, повторно примените «Призрачный удар», чтобы вернуться на её место, если клетка свободна.
actors.buffs.soulfire.desc=Ваше тело охвачено неземным голубым пламенем душ. Вы невосприимчивы к огню, а каждая рукопашная атака поджигает цель.\n\nОсталось ходов: %s.
actors.mobs.pike.desc=Длинная полосатая речная рыба с пастью, полной острых, как иглы, зубов. Таится на открытой воде и бросается на любого, кто туда зайдёт.
actors.buffs.gasward.desc=Зловещее варево сделало ваши лёгкие невосприимчивыми к своим составляющим.\n\nВы защищены от ядовитого, парализующего и едкого газа.\n\nОсталось ходов: %s.
actors.buffs.parasiticsymbiosis.desc=Паразит вступил с вами в симбиоз, удваивая скорость передвижения. Когда он отделится, вы восстановите значительную часть здоровья.\n\nОсталось ходов: %s.
actors.mobs.npcs.roadpatrol.desc=Один из двух городских стражников, которые каждый день, пока хватает света, патрулируют дорогу до соседней деревни и обратно. Разбойников они не жалуют.
actors.mobs.npcs.town.bard.pitch=Он настраивает струну и вопросительно смотрит на вас. Песня бесплатна, а последние слушатели уверяли, что уходили отсюда с лёгким сердцем.
actors.mobs.npcs.portalgate.desc_active=Работающие врата портала тихо гудят и сияют голубым светом. Подойдите и направьте магию, чтобы переместиться к любым другим открытым вами вратам. Каждая поездка расходует сытость.
actors.mobs.npcs.town.employee.pitch=Он кивает на экран. «Билет стоит _%d_. Говорят, после сеанса люди становятся удачливее. Почему — не знаю. А про проектор лучше не спрашивайте».
actors.buffs.corruption.hero_desc=На герое порча держится бесконечно, но не выдерживает целебной магии. Любое исцеление, увеличивающее здоровье, снимает её.
actors.mobs.banditking.desc=Хитроумный главарь разбойников, парящий над землёй. Атакует с ослепительной скоростью, крадёт золото и накладывает изнуряющие эффекты.
actors.mobs.npcs.town.librarian.greet4=Если найдёте там какие-нибудь письмена... свитки, страницы, надписи на стенах... я бы, гм... очень хотела узнать, что в них сказано. Только отсюда, пожалуйста.
actors.mobs.npcs.town.townsfolkmovie.greet4=В прошлом месяце приехал торговец, продавал «страховку от подземелья». Полгорода купило. А он спустился «осмотреть объект». До сих пор ждём.
actors.mobs.npcs.town.townsfolkmovie.greet6=Говорят, в этом году холод пришёл снизу, а не с гор. Не знаю, как это отличить. Ногам одинаково холодно.
actors.mobs.redwraith.desc=Призрак — мстительный дух грешника, чей покой потревожили, вскрыв могилу или гробницу. Его бесплотное тело очень трудно поразить обычным оружием.
actors.mobs.templesentry.desc=Каменный страж, встроенный в стену храма. Чем дольше он следит за вами, тем ярче светится глаз. Задержитесь на отмеченном полу у него на виду — и он выстрелит.
actors.mobs.pearloyster.desc=Крупная устрица, покрытая ракушечником, устроилась в приливной луже. Иногда створки раскрываются, и внутри что-то блестит. Подденьте её ради жемчужины, только берегите пальцы.
actors.mobs.pets.velocirooster.desc=Велокопетух — свирепый родственник домашнего петуха. Он носится по подземелью и рвёт врагов острыми когтями и злобным клювом.
actors.mobs.npcs.fisherman.talk_spring=Рыба пошла на нерест! Вся река вверх по течению прёт, ни на что другое не глядит. Лучшее время года для рыбака, чего уж скрывать.
actors.mobs.npcs.town.librarian.greet2=У нас есть, гм, три книги о шахтах. Две — дневники. Обе обрываются на полуслове. Третья — поваренная книга, и я не понимаю, почему она здесь.
actors.mobs.npcs.town.townsfolk.greet4=Снег выпал ещё до конца жатвы. Весной лило без перерыва. Или времена года совсем спятили, или кто-то внизу с ними химичит.
actors.mobs.raider.desc=Разбойник, явившийся грабить деревню с факелом и дубиной. Налётчики нападают на вас, стражников и любого, кто встанет между ними и добычей. Отступать они не станут.
actors.mobs.iceguardian.desc=Ожившая глыба льда, отдалённо похожая на человека. Разбить одного стража недостаточно: сердцевина, создавшая его, чувствует потерю и порождает новых.
actors.mobs.npcs.cagedkobold.desc=Кобольд, запертый в слишком тесной клетке из обледенелого железа. Видно, он пробыл здесь очень долго и уже не надеется, что кто-то придёт.
actors.mobs.npcs.caveminer.desc=Суровый дворф с угольной пылью в бороде. Работает в этих глубинах дольше, чем готов признать, и отлично знает цену добытой руде.
actors.mobs.npcs.town.townguardfolk.bounty_new=Он прикалывает на доску новое объявление. «Есть награда! Нужен %s — водится чуть ниже тех мест, где ты бывал. Уложишь — получишь _%d_ золотых на месте».
actors.mobs.npcs.sunkenidol.desc=Старинный болотный бог, вырезанный из зелёного камня, стоит по пояс в затопленном святилище. У его ног в грязи поблёскивают монеты и безделушки.
actors.mobs.npcs.tinkerer5.altar_info=В здании прямо к востоку отсюда находится алтарь богов. Принесите туда три камня норн и получите особое сокровище.
actors.mobs.npcs.town.fortunetellerfolk.desc=Женщина в капюшоне умеет читать скрытые свойства вещей. За горсть золота расскажет, что перед вами за предмет, но определяет лишь одну вещь за сезон.
actors.mobs.npcs.townguard.altar_info=В здании прямо к востоку отсюда находится алтарь богов. Принесите туда три камня норн и получите особое сокровище.
actors.mobs.npcs.town.employee.pitch_moon=Он косится на окно и гудящий проектор. «Билет — _%d_. Сегодня полнолуние. В такие ночи сеанс длится... дольше. И удача тоже».
actors.buffs.warmthbuff.desc=Внутри вас горит ровное тепло.\n\nВас нельзя охладить или заморозить, а рукопашные атаки с вероятностью 25%% поджигают цель.\n\nОсталось ходов: %s.
actors.buffs.strength.desc=По вашим венам разливается грозная сила лунной ягоды, увеличивающая урон.\n\nЭта ярость сохранится, пока не будет израсходована при атаке.
actors.mobs.shellcrab.desc=Слуги короля крабов. Их прочные панцири поглощают почти любой урон. Поглощённая энергия заряжает электрический панцирь.
actors.mobs.iceguardiancore.desc=Замёрзшее сердце, придающее стражам форму. Оно почти неподвижно и огромно, но с гибелью каждого стража теряет частицу себя.
actors.mobs.npcs.town.bard.greet5=Знаешь, почему церковный колокол звонит в странные часы? Епископ тоже не знает. Он называет это знамением. Я — ветром. Даже песню об этом сочинил.
actors.mobs.skilldecoy.desc=Хрупкая тень, оставленная отвлекать врагов. Она не атакует и исчезает через несколько ходов. На высоких уровнях дымовые приманки при разрушении ослепляют врагов искрами.
actors.buffs.bloombuff.desc=Жизнь расцветает вслед за вами.\n\nПод ногами на голой земле вырастает трава, а при вытаптывании высокой травы выпадает вдвое больше семян.\n\nОсталось ходов: %s.
actors.mobs.npcs.caravaneer.desc=Придорожный прилавок, за которым на обочине пасётся мул. Торговец ходит от деревни к деревне и обратно. Завтра его уже можно будет встретить дальше по дороге.
actors.mobs.npcs.town.innservant.pitch=Она кивает в сторону кухни. «Горячий обед — _%d_. Похлёбка, хлеб, что-нибудь согревающее. Насытишься и ненадолго забудешь о холоде. Чем меньше еды остаётся, тем выше цена».
actors.mobs.npcs.cagedkobold.end=Ключ поворачивается с хрустом ломающегося льда. Кобольд суёт вам в руки свою свечу, проскальзывает мимо и исчезает во тьме раньше, чем вы успеваете что-либо сказать.
actors.mobs.npcs.portalgate.desc_locked=Неактивные врата портала, их каменная арка холодна и безжизненна. Заплатите лавочнику-стражу за пробуждение магии. После активации врата соединятся со всеми другими открытыми порталами.
actors.mobs.livingplant.desc=Некоторые растения научились вырывать корни из земли и сражаться. Они сохраняют свойства своего вида и применяют их в бою.
actors.buffs.eyeing.desc=Ваше восприятие сверхъестественно обострилось. При получении этого эффекта все тайные двери и скрытые ловушки на уровне были обнаружены.\n\nОсталось ходов: %s.
actors.mobs.spiderqueen.desc=Мать гнезда — огромная паучиха, раздутая от яиц. Она откладывает их даже в бою, а получив рану, предпочитает сбежать во тьму и оставить вас своим детёнышам.
actors.buffs.marshlight.desc=В вашем фонаре горит болотный огонёк. Его холодный зелёный свет рассеивает туман, который больше не ограничивает обзор.\n\nОсталось ходов: %s.
actors.buffs.spacetimepowers.desc=Силы пространства и времени позволяют вам слегка совмещать мгновения и точки мироздания, делая каждый удар безупречно точным.\n\nОсталось ходов действия сил пространства-времени: %s.
actors.mobs.npcs.farmcrop.desc_ripe=Созревшая культура. Срежьте её серпом, чтобы собрать урожай. Если оставить растение расти, каждый цикл оно либо роняет рядом семя (%1$d из %2$d возможных), либо увядает с вероятностью %3$d%%.
actors.mobs.npcs.town.bishop.greet5=Ты не первый, кто заходит ко мне перед спуском. Но мог бы стать первым, кто вернётся сюда, поднявшись наверх. Я очень хотел бы это увидеть.
actors.mobs.npcs.town.townsfolk.pitch=Она разглядывает ваше снаряжение. «Есть там что-то, что раньше кому-то принадлежало? Кованая сталь, улучшенный плащ... Заплачу вдвое больше лавочника. По одной вещи в день».
actors.mobs.vinelasher.desc=Клубок живых лоз, приросших к месту. Вне боя медленно восстанавливает здоровье, от огня погибает мгновенно, а ударами калечит противников.\n\nПри поджигании погибает сразу.
actors.buffs.bogblessing.desc=Древний бог топи благоволит вам.\n\nЯд, слизь и болотные паразиты не могут вас поразить, а вода болота не замедляет шаг.\n\nОсталось ходов: %s.
actors.buffs.comfy.desc=Крыша над головой, огонь в очаге. Непогода осталась снаружи: внутри приятная температура, а холод и жара не причиняют вам вреда, пока вы здесь.
actors.mobs.claygolem.desc=Глиняные големы возникают, когда мощная хаотическая магия взаимодействует с подземельем. Они не совсем живые, но передвигаются разумно и стремятся только разрушать.
actors.mobs.npcs.town.fortunetellerfolk.greeting_new=Новолуние... Звёзды скрылись, и сегодня тяжело прозреть истину. Я гадаю трижды в неделю, осталось _%2$d_ гаданий. Узнать свойства одной неизвестной вещи стоит _%1$d_ золотых. Согласен?
actors.mobs.npcs.sunkenidol.prompt=Оставьте на воде подношение — золото или ценную вещь, — и получите благословение болотного бога. Чем щедрее дар, тем дольше защита. Идол принимает подношения раз в %d дней.
actors.buffs.markofthenut.desc=Влияние арахисоцвета замедляет шаг, но обостряет меткость в отчаянной попытке выжить.\n\nПока действует метка, скорость передвижения уменьшена вдвое, а точность удвоена.\n\nОсталось ходов: %s.
actors.mobs.camel.desc=Одногорбый верблюд из глубокой пустыни неспешно шагает, пережёвывая жвачку. Пока не приблизитесь, он вас игнорирует, а потом просто отходит. Ударьте его — плюнет в лицо и убежит.
actors.mobs.npcs.tinkerer4.otiluke_lore=Отилюк? Да, несколько лет назад он проходил здесь.\n\nК юго-западу от города раньше была шахта. Её захватили демоны, и Отилюк запечатал вход.\n\nС тех пор мы его не видели.
actors.mobs.npcs.caravantrain.line=Долго стоять нельзя, друг. Чуть дальше по дороге в %1$s поставлю прилавок. Приходи: в повозке полно всякого добра, а в %2$s почти ничего не раскупили.
actors.buffs.tengufirebomb$roguefirebombitem.desc=Одна из бомб Тенгу, только вместо дыма в ней огонь — теперь вы изготовили и бросили её сами. Бомба разбрасывает вокруг пламя и продолжит это ещё несколько ходов.\n\nОна слишком горячая, чтобы поднимать.
actors.mobs.squid.desc=Тяжелотелое создание прячется в глубокой воде и поджидает добычу в досягаемости щупалец. Как пиранья, оно не выживает на суше, но бьёт намного сильнее.
actors.mobs.npcs.blacksmith2.desc=Этот тролль-кузнец выглядит, как все тролли: высокий, худощавый, с кожей, похожей на камень цветом и фактурой. Возится с непропорционально маленькими инструментами.
actors.buffs.shadecloak.desc=Живая тень обволакивает вас.\n\nПока вы невидимы, атаки не раскрывают вас. Каждая такая атака тратит один заряд.\n\nОсталось зарядов: %1$d.\nОсталось ходов: %2$s.
actors.buffs.speed.desc=Прилив энергии заставляет персонажа двигаться быстрее.\n\nУскоренное существо передвигается вдвое быстрее обычного, но все прочие действия выполняет с прежней скоростью.\n\nОсталось ходов ускорения: %s.
actors.mobs.eagle.desc=Огромный горный орёл с коричневым, как скала, оперением, белыми головой и хвостом и жёлтым крючковатым клювом. Он кружит над гнездом и пикирует на всякого, кто подойдёт слишком близко. Воров не забывает.
actors.mobs.npcs.blacksmith2.no_ore=Руда? Да у тебя её нет. Скалы под нами и горы над нами ею полны. Бери кирку, откалывай от жил и приноси сюда. Наберёшь достаточно любого металла — отолью сердцевину.
actors.mobs.npcs.town.librarian.pitch=Она подвигает по столу отдельную страницу. «Дневник шахтёра. Здесь один уровень описан, гм, очень подробно. _%d_ золотых. Записи годятся только для того уровня, где сделаны, так что... проверьте дату».
actors.mobs.npcs.tinkerer1.need_mushroom=Ого, ты видел это подземелье? Оно просто потрясающее! Я тут всё исследую, конечно, но ещё собираю грибы-поганки. Принесёшь мне поганок, если найдёшь?
actors.mobs.npcs.town.fortunetellerfolk.greeting=Я читаю свойства твоих вещей, путник, трижды в неделю. На этой неделе осталось _%2$d_ гаданий. Луна сегодня ничем не выделяется, так что цена обычная: _%1$d_ золотых за одну неизвестную вещь. Согласен?
actors.buffs.stormcharge.desc=По вашей коже пробегают электрические разряды.\n\nВы невосприимчивы к электричеству и заряженному пару, а рукопашные атаки с вероятностью 30%% поражают молнией ещё одного врага рядом с целью.\n\nОсталось ходов: %s.
actors.mobs.npcs.town.fortunetellerfolk.greeting_full=Сегодня полнолуние, путник, и завеса тонка: твои вещи почти сами рассказывают о себе. Я гадаю трижды в неделю, на этой осталось _%2$d_ гаданий. За _%1$d_ золотых раскрою свойства одной неизвестной вещи. Согласен?
actors.buffs.crouching.desc=Вы пригнулись и осторожно передвигаетесь, стараясь оставаться незамеченным.\n\nВ приседе скрытность значительно выше, и врагам сложнее вас обнаружить. Вы двигаетесь и действуете с обычной скоростью, но не можете бегать.
actors.buffs.awareness.desc=На мгновение ваш разум проникает сквозь стены и ощущает все бесхозные вещи на этом уровне.\n\nПока действует эффект, вы видите местоположение каждого предмета на этаже.\n\nОсталось ходов осведомлённости: %s.
actors.buffs.drenched.desc=Вы промокли до нитки.\n\nСвитки имеют 15%% шанс не сработать из-за сырости. Вы уязвимее к холоду и электричеству. Следующее пламя, которое могло вас поджечь, лишь высушит одежду.\n\nОсталось ходов: %s.
actors.mobs.giantscorpio.desc=Скорпион величиной с телегу, с чёрным панцирем в золотой кайме, — чудовище, известное по имени окрестным деревням. У него вчетверо больше здоровья, чем у сородичей, он сильнее жалит издали, а яд не только отравляет, но и калечит.
actors.mobs.goat.desc=Лохматый горный козёл уверенно стоит там, где другие сорвутся. Обычно пасётся в стороне, но стоит ударить его или загнать в угол — пустит в ход рога. Не сражайтесь с ним у обрыва за спиной.
actors.mobs.npcs.tinkerer5.mine_warning=Раньше мы добывали в шахтах каменную руду. Когда там завелись демоны, проходы стали меняться местами. Осторожнее: выйдешь с уровня, а вернёшься — он уже совсем другой!
actors.mobs.npcs.townguard.mine_warning=Раньше мы добывали в шахтах каменную руду. Когда там завелись демоны, проходы стали меняться местами. Осторожнее: выйдешь с уровня, а вернёшься — он уже совсем другой!
actors.ledger.damageledger.fall_desc=Вы провалились в пропасть на этаж ниже. Падение отнимает как минимум половину оставшегося здоровья, броня от него не спасает. Вы будете искалечены и истечёте кровью. Броня с твёрдой поступью уменьшает урон от падения.
actors.mobs.elderyeti.desc=Древний йети, чья белая шерсть посерела и посинела от инея, — легендарное чудище горных деревень. У него вчетверо больше здоровья, чем у сородичей, он намного сильнее бьёт, а мороз его ударов замедляет жертву.
actors.mobs.npcs.caravantrain.desc=Крытая повозка с терпеливым серым мулом. Караванщик сидит на козлах, вяло держа поводья, а сзади лежит весь товар. К середине утра он останавливается на обочине и раскладывает всё на продажу.
actors.mobs.vulture.desc=Лысоголовая птица-падальщик парит над песком на тёплых потоках воздуха. Кружит над теми, кто вот-вот умрёт, чтобы полакомиться останками. Пока вы здоровы, держится подальше. Но раненый герой — то, чего она ждёт.
actors.buffs.tengusmokebomb$roguebombitem.desc=Одна из дымовых бомб Тенгу, которую теперь вы изготовили и бросили сами. Она выпускает густой горячий дым и громко тикает: прежде чем иссякнуть, взорвётся несколько раз.\n\nБомба закрепилась на земле, поэтому поднять её нельзя.
actors.mobs.npcs.roulettetable.desc=Стол с зелёным сукном в конце бара. Небольшое колесо рулетки само крутится, пощёлкивая. Здесь ставят сердцевины шедевров — на число, цвет, дюжину или колонку, а выигрыши выплачивают по настоящим коэффициентам.
actors.mobs.velocirooster.desc=Велокопетух — свирепый родственник домашнего петуха. Он носится по подземелью и нападает с острыми, как бритва, когтями и злобным клювом. Никто не знает, откуда такие птицы взялись здесь, но, похоже, они давно считают это место своим домом.
actors.mobs.npcs.blacksmith2.need_gold=Ого! У тебя, кажется, есть адамантит! Если хочешь, я могу укрепить им какую-нибудь вещь. Укреплённое снаряжение выдерживает более высокие уровни магического улучшения. Но это обойдётся недёшево! Возвращайся, когда найдёшь 50 единиц тёмного золота.
actors.buffs.hypothermia.desc=Лютый мороз (%s°C) отнимает силы.\n\nВы двигаетесь на 15%% медленнее, уклоняетесь на 35%% хуже и периодически получаете урон холодом. Другие существа на морозе тоже цепенеют.\n\nСогрейтесь у костра или найдите укрытие.
actors.mobs.npcs.festivalchampion.desc=Чемпион деревни готовится к праздничному состязанию. Он принимает вызов любого желающего в дружеском поединке. Когда здоровье одного из бойцов снизится до трети, он сдаётся, не рискуя тяжёлыми травмами. Победите — и получите главный приз праздника.
actors.buffs.tengushockbomb$rogueshockeritem.desc=Копия электрической бомбы Тенгу, собранная вами из деталей DM-100. Несколько ходов она разбрасывает разряды во все стороны, а потом разлетается на части.\n\nПока вокруг сверкают молнии, поднять её невозможно.
actors.mobs.greatwolf.desc=Огромный старый серый волк, известный по имени в окрестных деревнях. У него вчетверо больше здоровья, чем у сородичей, он гораздо сильнее бьёт, а его укус рвёт плоть. Днями рыщет по своим владениям и, как всякий волк, при пробуждении созывает стаю.
actors.mobs.npcs.blacksmith2.no_adamant=Мы с братом мастерим всё снаряжение в этом подземелье. Он переплавляет два улучшенных предмета, чтобы усилить один. А я укрепляю вещи адамантитом. Возвращайся с 50 единицами тёмного золота и адамантитом — тогда и займёмся твоей вещью.
actors.mobs.npcs.travellingmerchant.desc=Торговец ездит по ярмаркам от деревни к деревне: расписная повозка, полосатый навес и диковинные товары из неслыханных краёв. Через три дня повозка уедет вместе со всем добром, а товары стоят на четверть дороже из-за долгой дороги.
actors.mobs.alligator.desc=Из болотной воды торчат лишь глаза и ноздри. Аллигатор поджидает добычу у берега, затем выскакивает, без промаха хватает жертву и утаскивает в воду. На суше он медлителен и скоро возвращается обратно.
actors.buffs.timestasis.desc=Вы выведены из потока времени. Никто вас не видит, не может коснуться или ранить, но и вы ничего не можете сделать.\n\nВ стазисе вы невидимы и не можете действовать, зато не испытываете голода.\n\nОсталось ходов стазиса: %s.
actors.buffs.solareclipsebuff.desc=Посреди дня наступила неестественная тьма. Сумерки снижают вашу точность на 15%%, но глубокие тени дают +15%% к уклонению и +3 к скрытности.\n\nНежить и демоны усиливаются и появляются чаще.\n\nОсталось ходов: %s.
actors.mobs.npcs.swampwitch.desc=Сгорбленная старуха в мохово-зелёной шали и остроконечной шляпе. Её кожа зелена, как болотная вода, а хижина пахнет дымом, мятой и чем-то, чему лучше не давать названия. Она продаёт болотные диковины, варит зелья из принесённых ингредиентов и снимает проклятия — за плату.
actors.mobs.npcs.cagedkobold.intro=Кобольд прижимается к прутьям клетки, когда вы подходите. Изнутри ему не открыть замок: его заморозило существо, правящее глубинными льдами. Принесите ключ, который оно носит, и кобольд отдаст вам свечу, которую бережёт.
actors.buffs.secreting.desc=Сладкий сок _венериной мухоловки_.\n\nКаждый ход здоровье постепенно восстанавливается, пока не закончится эффект лечения. Сила исцеления со временем может ослабевать. Пока идёт лечение, у вас сильно кружится голова и трудно сосредоточиться.\n\nСледующее исцеление: %d.\n\nОсталось исцелений: %d.
actors.mobs.bison.desc=Косматый великан с открытых равнин пасётся со своим стадом, не обращая на вас внимания. Но стоит ударить одного бизона, и вся стая бросится в атаку! Разогнавшийся бизон бьёт в полтора раза сильнее и отталкивает на клетку назад. Стадо успокоится лишь когда вы умрёте, уйдёте или надолго скроетесь из виду.
actors.buffs.bloodmoonbuff.desc=Луна окрасилась кровью. Тёмные существа наливаются ужасающей силой: нежить наносит двойной урон и появляется без передышки.\n\nВы черпаете силу кровавой ярости: +25%% урона демонам и +15%% к шансу добычи. Но точность всех врагов повышена на 20%%.\n\nОсталось ходов: %s.
actors.buffs.breathless.desc=На такой высоте воздух разрежен, и вашему телу не хватает кислорода.\n\nЕстественное восстановление здоровья замедлено на %1$s%%, а голод наступает немного быстрее.\n\nСпуститесь с горы или передохните в укрытии либо у костра, чтобы отдышаться.\n\nОдышка: %2$s из %3$s.
actors.buffs.soakedshoes.desc=Промокшая обувь хлюпает на каждом шагу, мешая красться незаметно. Через мокрую кожу просачивается холод, и ноги мёрзнут.\n\nСкрытность: −2. Ощущается на 4°C холоднее.\n\nУ источников тепла обувь сохнет быстрее всего у костра, а под дождём или в воде остаётся мокрой. Осталось ходов: %s.
actors.buffs.sleepiness.desc=\n\nЧем дольше вы бодрствуете, тем сильнее клонит в сон. Ночью сонливость нарастает быстрее, особенно при суровой погоде или во время боя в подземелье. При усталости снижаются скорость, уклонение, урон и дальность зрения. Если не отдохнуть вовремя, вы свалитесь с ног и уснёте. Отдых восстанавливает силы, особенно ночью.
actors.mobs.drownedacolyte.desc=Один из служителей древнего болотного бога, утонувший вместе со святилищем много лет назад. По ночам утопленники поднимаются из воды и бредут за каждым, кто подойдёт близко. Их прикосновение заносит в рану болотных паразитов. От храма они далеко не уходят, а с рассветом вновь скрываются под водой.
actors.mobs.npcs.rogueshadow.desc=Скелетная тень в маске, сражающаяся за разбойника. У неё собственное здоровье — доля от максимального здоровья разбойника, а урон составляет долю его урона. Вместе они видят врагов в радиусе %d клеток. Полностью освоенный навык «Теневая компания» позволяет меняться с ней местами. Как и любое призванное существо, тень исчезнет через один игровой день.
items.artifacts.climatecrystal.desc=Кристалл, выточенный из сердцевины стужи владыки демонов. Внутри теплится огонёк. Пока вы носите его, кристалл медленно впитывает окружающую погоду, особенно быстро в лютый мороз или сильную жару.\n\nПолностью заряженный кристалл можно установить рядом. На 300 ходов он создаст вокруг себя зону умеренной температуры радиусом две клетки: согреет в холод и охладит в жару.
actors.mobs.demonlord.desc=Повелитель демонов, призванный из адских глубин, чтобы захватить это подземелье. Долгие годы короли дворфов сдерживали его, но древние путы давно истлели, а холод ему совершенно нипочём.\n\nПеред выдохом демон набирает воздух: земля впереди помечается и покрывается инеем на три хода. Уйдите из этого сектора, прежде чем он выдохнет.
actors.mobs.npcs.enchantingstation.desc=Древний дворфийский постамент гудит от магических рун. С окружающих полок на камень медленно перетекают светящиеся знаки.\n\nПоложив на него оружие или броню, можно усилить чары, заменить их случайными или вплести новые — за алхимическую энергию. Просмотр трёх новых вариантов стоит 20 единиц, а выбранное зачарование накладывается бесплатно. Также можно снять с оружия все чары или с брони все символы и получить 20 единиц алхимической энергии, сохранив сам предмет и его улучшения.
actors.mobs.npcs.swampwitch.brew_rules=Принесите ведьме три любых ингредиента для котла: травы (семена), грибы или части животных (сырое мясо, шкуру, яйцо, перо стервятника, зуб аллигатора либо зверька в банке).\n\nВид трав определяет зелье. Три одинаковых семени всегда дают соответствующее зелье, и ведьма подпишет бутылку. Иначе она случайно выберет одно из видов: чем его больше, тем выше шанс. Без трав получится любое зелье. Каждый гриб может усилить настой.\n\nПлата — %1$d золотых, на %2$d меньше за каждую часть животного в котле.
