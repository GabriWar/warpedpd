### Additional reviewed Russian localization
actors.blobs.altarshrine.desc=В центре святилища стоит древний каменный алтарь. На его постаменте сияет артефакт, а воздух едва заметно дрожит от потусторонней силы.
actors.blobs.stormcloud.ondeath=Вас сразила молния...
actors.blobs.steam.desc=Здесь клубится обжигающий пар. Он ошпаривает всё, чего касается, а восходящий поток способен подбросить вас в воздух.
actors.blobs.smoke.desc=Здесь висит густой дым. Стоит вдохнуть его — и вас одолеет мучительный кашель.
actors.blobs.vaultflametraps.desc=Из пола через равные промежутки вырываются струи зелёного пламени. Всё, что попадает под них, загорается.
actors.blobs.alter.desc=Таинственный алтарь излучает свет. Положите на него камни норн, чтобы выковать могущественное реликтовое оружие.
actors.blobs.corruptgas.desc=Здесь клубится болезненно-зелёное облако порченого газа. Он вызывает кровотечение, увечья и дезориентацию.
actors.blobs.corruptgas.ondeath=Вас поглотил порченый газ...
actors.blobs.wateroftransmutation.desc=Вода этого колодца источает силу превращения. Бросьте в неё предмет, чтобы преобразовать его в другой.
actors.blobs.waterofupgradeeating.desc=В водоёме мерцает чрезвычайно едкая жидкость. Бросьте в неё предмет, чтобы извлечь заключённую в нём силу.
actors.blobs.portal.desc=Здесь мерцает светящийся портал, ведущий в другое место.
actors.blobs.water.desc=Здесь течёт волшебная вода. Там, где она проходит, прорастают трава и растения.
actors.blobs.heathaze.desc=Воздух дрожит от нестерпимого зноя. Трава может вспыхнуть сама собой, а жара — обжечь.
actors.blobs.fallenleaves.desc=Землю устилает толстый слой опавших листьев. В них легко укрыться, но при движении они громко шуршат.
actors.blobs.moonbeam.desc=Бледный луч лунного света пронзает тьму. Нежить и демоны чахнут в его сиянии.
actors.blobs.mistcloud.desc=Здесь стелется густой холодный туман. Он мешает видеть и сбивает с толку тех, кто задержится в нём.
actors.blobs.ballgas.desc=Воздух заполняет клубящееся облако вихревого газа. Всякого, кто попадёт внутрь, начнёт неудержимо кружить.
actors.blobs.glowinggas.desc=Здесь плывёт облако светящегося газа. Каждый, кто окажется внутри, сам начнёт светиться.
actors.blobs.grasssmokegas.desc=В воздухе висит густой дым с резким травяным запахом. Вдохнув его, можно одурманиться.
actors.blobs.withercloud.desc=Здесь клубится тёмное облако иссушающих испарений. Вся трава и листва в нём погибают.
actors.blobs.digestingacidcloud.desc=Здесь висит облако едких кислотных паров. Всё, что попадёт внутрь, подвергается коррозии.
actors.blobs.slownesscloud.desc=Здесь плывёт густое облако вязких испарений. Все, кто окажется внутри, замедляются.
actors.blobs.fiendfire.desc=Здесь пылает багровое пламя из иного мира. Его жар обжигает даже существ, устойчивых к огню.
actors.blobs.halomethanefire.desc=Здесь горит ярко-голубое химическое пламя. Оно горячее обычного огня, но не поджигает предметы.
actors.blobs.icestorm.desc=Здесь бушует свирепая снежная буря. Каждый, кто попадёт в неё, промёрзнет до костей.

