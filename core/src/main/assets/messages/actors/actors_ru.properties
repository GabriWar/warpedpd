###blobs
actors.blobs.blizzard.name=метель
actors.blobs.blizzard.desc=Здесь кружится ледяной буран.

actors.blobs.confusiongas.name=дезориентирующий газ
actors.blobs.confusiongas.desc=Здесь клубится дезориентирующий газ.

actors.blobs.electricity.name=электричество
actors.blobs.electricity.desc=Здесь сверкают электрические разряды.
actors.blobs.electricity.rankings_desc=Электрошок
actors.blobs.electricity.ondeath=Вас убило электрическим разрядом...

actors.blobs.fire.name=огонь
actors.blobs.fire.desc=Здесь бушует пламя.

actors.blobs.foliage.name=листва
actors.blobs.foliage.desc=Потоки света пронзают мрак подземного сада.

actors.blobs.freezing.name=морозный воздух
actors.blobs.freezing.desc=Воздух здесь неестественно холоден.

actors.blobs.goowarn.name=тёмная энергия
actors.blobs.goowarn.desc=Здесь кружатся частицы тёмной энергии!

actors.blobs.inferno.name=адское пламя
actors.blobs.inferno.desc=Здесь бушует адское пламя.

actors.blobs.paralyticgas.name=парализующий газ
actors.blobs.paralyticgas.desc=Здесь клубится парализующий газ.

actors.blobs.regrowth.name=восстановление

actors.blobs.sacrificialfire.name=жертвенный огонь
actors.blobs.sacrificialfire.desc=Здесь стоит алтарь, на котором горит жертвенный огонь. Любое существо, убитое на нем, будет поглощено в качестве подношения духам подземелья.\n\nМожет быть, после достаточного количества жертвоприношений появится награда?
actors.blobs.sacrificialfire.worthy=Огонь поглощает ваше подношение и становится сильнее.
actors.blobs.sacrificialfire.unworthy=Огонь поглощает ваше подношение, но не изменяется.
actors.blobs.sacrificialfire.reward=Огонь вспыхивает, а затем рассеивается, оставляя после себя награду!

actors.blobs.smokescreen.name=дымовая завеса
actors.blobs.smokescreen.desc=Здесь клубится густой чёрный дым.

actors.blobs.stenchgas.name=зловонный газ
actors.blobs.stenchgas.desc=Здесь клубится облако жуткой вони.

actors.blobs.stormcloud.name=грозовые облака
actors.blobs.stormcloud.desc=Здесь клубятся облака водяного пара.

actors.blobs.toxicgas.name=токсичный газ
actors.blobs.toxicgas.desc=Здесь клубится зеленоватый ядовитый газ.
actors.blobs.toxicgas.rankings_desc=Задохнулся
actors.blobs.toxicgas.ondeath=Вы умерли от ядовитого газа...

actors.blobs.corrosivegas.name=коррозийный газ
actors.blobs.corrosivegas.desc=Здесь клубится облако разъедающего газа.

actors.blobs.waterofawareness.name=вода знаний
actors.blobs.waterofawareness.procced=Как только вы делаете глоток, вы чувствуете, как знания наполняют ваш разум.
actors.blobs.waterofawareness.desc=Вода этого колодца излучает силу знания. Выпив её, вы полностью опознаете всё надетое снаряжение, узнаете, какие предметы в рюкзаке прокляты, и обнаружите все предметы на текущем этаже.

actors.blobs.waterofhealth.name=вода здоровья
actors.blobs.waterofhealth.procced=Едва вы сделали глоток, ваши раны полностью затянулись.
actors.blobs.waterofhealth.desc=Вода в этом источнике излучает здоровье. Глоток этой воды исцелит раны, утолит голод и очистит проклятия любых носимых предметов.

actors.blobs.web.name=паутина
actors.blobs.web.desc=Здесь всё покрыто толстой паутиной. Всё, что коснётся паутины или будет брошено в неё, сломает паутину, но также застрянет на этом месте.



###buffs
actors.buffs.adrenaline.name=адреналин
actors.buffs.adrenaline.desc=Прилив адреналина придаёт сил и ускоряет движения и удары.\n\nПод действием адреналина персонаж передвигается _вдвое быстрее_, а атакует _в полтора раза быстрее_.\n\nОсталось ходов: %s.

actors.buffs.adrenalinesurge.name=увеличение силы
actors.buffs.adrenalinesurge.desc=Вы чувствуете значительный прилив сил. Но, к сожалению, это только временный эффект.\n\nБонус к силе: +%d.\nХодов до ослабления эффекта: %s.

actors.buffs.amok.name=буйство
actors.buffs.amok.desc=Буйство - это состояние лютой ненависти и дезориентации.\n\nКогда существо находится в этом состоянии, оно атакует любого, кто окажется рядом с ним, будь то друг или враг.\n\nХодов с буйством осталось: %s.

actors.buffs.arcanearmor.name=магическая броня
actors.buffs.arcanearmor.desc=Вас окружает едва заметный щит, уменьшающий урон от магических атак.\n\nВаша магическая защита увеличена на: 0-%d.\n\nХодов до ослабления защиты: %s.

actors.buffs.artifactrecharge.name=перезарядка артефакта
actors.buffs.artifactrecharge.desc=Энергия течет внутри вас, заряжая надетые артефакты.\n\nЭффект влияет на каждый артефакт по-своему, но они будут заряжаться гораздо быстрее чем обычно.\n\nХодов осталось: %s.

actors.buffs.ascensionchallenge.name=проклятие амулета
actors.buffs.ascensionchallenge.desc=Каким-то образом Йог-Джева оказывает влияние на этот мир через амулет и пытается остановить ваше восхождение!\n\nСила Йога делает подземелье более опасным, увеличивая количество врагов и делая их сильнее! Эта сила будет продолжать расти, если её не остановить. Её можно ослабить, победив врагов, усиленных силой Йога.
actors.buffs.ascensionchallenge.desc_clear=Темная энергия, исходящая от амулета, сейчас ослаблена настолько, насколько это возможно.
actors.buffs.ascensionchallenge.desc_beckon=Амулет сейчас _обращается к отдаленным врагам_, предупреждая их о вашем местонахождении.
actors.buffs.ascensionchallenge.desc_haste=Амулет сейчас _ускоряет дальних врагов_, позволяя им быстрее добраться до вас!
actors.buffs.ascensionchallenge.desc_slow=Амулет сейчас _замедляет вас_ и отрицает эффекты, увеличивающие скорость!
actors.buffs.ascensionchallenge.desc_damage=Энергия исходящая из амулета оказалась настолько сильной, что она напрямую вредит вам!
actors.buffs.ascensionchallenge.beckon=Амулет начинает подзывать противников издалека.
actors.buffs.ascensionchallenge.haste=Амулет начинает подгонять противников вдалеке!
actors.buffs.ascensionchallenge.slow=Амулет стал весить как гиря в вашем инвентаре!
actors.buffs.ascensionchallenge.damage=Амулет начал испускать тёмную энергию. Горячо!
actors.buffs.ascensionchallenge.weaken_info=Убийство врагов ослабит проклятие амулета.
actors.buffs.ascensionchallenge.weaken_info_no_kills=При убийстве врагов проклятие амулета будет слабеть!
actors.buffs.ascensionchallenge.weaken=Вы чувствуете, что проклятие амулета стало ослабевать.
actors.buffs.ascensionchallenge.break=Вы находите время перевести дыхание, и чувствуете, как ваши раны начинают заживать!
actors.buffs.ascensionchallenge.almost=Хватка Йога за амулет начинает ослабевать, вы практически добрались.
actors.buffs.ascensionchallenge.on_kill=Мрачная энергия поглотила вас...

actors.buffs.barkskin.name=дубовая кожа
actors.buffs.barkskin.desc=Ваша кожа затвердела и стала грубой и твердой, как кора.\n\nДанный эффект увеличивает вашу текущую броню, повышая защиту от физических атак.\n\nТекущий бонус к броне: 0-%d.\nХодов до ослабления эффекта: %s.\n\nЕсли вы получите эффект из нескольких источников, только сильнейших из них будет применен.

actors.buffs.barrier.name=барьер
actors.buffs.barrier.desc=Прочный силовой барьер поглощает весь входящий урон.\n\nПока у барьера остаётся прочность, он принимает удары вместо защищаемого существа. Со временем прочность постепенно уменьшается.\n\nОсталось прочности щита: %d.

actors.buffs.berserk.angered=разгневан
actors.buffs.berserk.berserk=в неистовстве
actors.buffs.berserk.exhausted=истощен
actors.buffs.berserk.recovering=восстановление
actors.buffs.berserk.angered_desc=Тяжесть травм Берсерка усиливает его удары. Когда берсерк получает физические повреждения, его ярость растет, даруя ему бонус к урону. Урон, блокируемый броней, также увеличивает ярость.\n\nСо временем, ярость спадает. Чем меньше у Берсерка здоровья, тем дольше она будет длиться.\n\nПри 100%% ярости Берсерк может впасть в неистовство, дарующее ему щит в зависимости от уровня его брони и недостающего здоровья. В неистовстве защита со временем разрушается, и как только она иссякнет, Берсерку придется отдохнуть, прежде чем снова набраться ярости.\n\nТекущая ярость: _%1$.0f%%_\n_+%2$.0f%%_ урона\n\nЩит Берсерка с текущей бронёй и ОЗ: _%3$d_
actors.buffs.berserk.berserk_desc=Страх и сомнения исчезают, оставляя лишь ярость. В этом состоянии Берсерк невероятно силён: _наносит на 50%% больше урона и получает дополнительный щит_, но каждый ход прочность щита уменьшается.\n\nКогда щит истощится, неистовство закончится.\n\nПосле неистовства Берсерку нужно восстановиться, прежде чем он снова сможет накапливать ярость.\n\nОсталось щита: %d
actors.buffs.berserk.recovering_desc=У внутренней мощи есть свои пределы. Берсерку надо передохнуть, прежде чем снова использовать ярость.\n\nПока Берсерк восстанавливается, от получения урона его ярость не накапливается.
actors.buffs.berserk.recovering_desc_turns=Ходов до восстановления: _%d_
actors.buffs.berserk.recovering_desc_levels=Уровней до восстановления: _%.2f_
actors.buffs.berserk.rankings_desc=Умер от неистовства
actors.buffs.berserk.action_name=Неистовствует
actors.buffs.berserk.no_seal=Тебе нужна твоя сломанная печать, чтобы войти в неистовство!

actors.buffs.bleeding.name=кровотечение
actors.buffs.bleeding.ondeath=Вы умерли от потери крови...
actors.buffs.bleeding.heromsg=У вас кровотечение!
actors.buffs.bleeding.rankings_desc=Умер от потери крови
actors.buffs.bleeding.desc=Эта рана что-то слишком сильно кровоточит...\n\nКровотечение наносит урон каждый ход. С каждым ходом урон уменьшается на случайную величину, пока не иссякнет.\n\nТекущий урон кровотечения: %d.

actors.buffs.bless.name=вдохновлен
actors.buffs.bless.desc=Большой всплеск сосредоточенности, некоторые даже говорят, что это вдохновение богов.\n\nБлагословение увеличивает точность и уклонение на 25%% и, таким образом, значительно повышает эффективность бойца.\n\nХодов осталось: %s.

actors.buffs.blindness.name=ослеплен
actors.buffs.blindness.heromsg=Вас ослепили!
actors.buffs.blindness.desc=Слепота окутывает окружающий мир темной дымкой.\n\nОслеплённый персонаж не видит дальше одной клетки перед собой, из-за чего дальний бой становится невозможным, а враги могут с лёгкостью скрыться. К тому же, ослеплённый герой не может читать свитки и книги.\n\nХодов осталось: %s.

actors.buffs.buff.heromsg=

actors.buffs.burning.name=горит
actors.buffs.burning.heromsg=Вы загорелись!
actors.buffs.burning.burnsup=%s сгорает!
actors.buffs.burning.ondeath=Вы сгорели заживо...
actors.buffs.burning.rankings_desc=Сгорел
actors.buffs.burning.desc=Мало что приносит страдания большие, чем горение заживо.\n\nОгонь будет наносить урон каждый ход, пока не будет потушен водой или не потухнет сам. Потушить огонь можно зайдя в воду, или разбив зелье с жидкостью.\n\nК тому же, огонь может воспламенить огнеопасное окружение или предметы, с которыми контактирует.\n\nХодов горения осталось: %s.

actors.buffs.championenemy.warn=Вы ощущаете наличие смертельной опасности.
actors.buffs.championenemy$blazing.name=Пылающий чемпион
actors.buffs.championenemy$blazing.desc=Пылающие чемпионы наносят на 25% больше урона в ближнем бою, поджигают при атаке, неуязвимы к огню и поджигают местность вокруг себя после смерти. Однако они не могут распространять огонь, где есть вода.
actors.buffs.championenemy$projecting.name=Проецирующий чемпион
actors.buffs.championenemy$projecting.desc=Проецирующие чемпионы наносят на 25% больше урона в ближнем бою и имеют увеличенный на 3 радиус атаки.
actors.buffs.championenemy$antimagic.name=Антимагический чемпион
actors.buffs.championenemy$antimagic.desc=Антимагические чемпионы получают на 50% меньше урона и совершенно неуязвимы к магии.
actors.buffs.championenemy$giant.name=Гигантский чемпион
actors.buffs.championenemy$giant.desc=Гигантские чемпионы получают на 80% меньше урона и увеличенный на 1 радиус атаки, но не могут проходить в узкие пространства.
actors.buffs.championenemy$blessed.name=благословенный чемпион
actors.buffs.championenemy$blessed.desc=Благословенные чемпионы имеют 4-кратную меткость и уклонение.
actors.buffs.championenemy$growing.name=Растущий чемпион
actors.buffs.championenemy$growing.desc=Растущие чемпионы получают непрерывно возрастающий бонус меткости, уклонения, физической атаки и сопротивления урону.\n\nТекущий бонус метк/укл/атк: %1$d%%\nТекущее сопротивление урону: %2$d%%

actors.buffs.charm.name=зачарован
actors.buffs.charm.heromsg=Вы очарованы!
actors.buffs.charm.cant_attack=Вы очарованы этим врагом и не можете атаковать его.
actors.buffs.charm.desc=Очарование - контролирующая магия, которая временно делает немыслимой любую явную агрессию против того, кто сотворил эти чары.\n\nЭтот эффект запрещает напрямую атаковать того, кто наложил его. Любые другие цели всё ещё можно атаковать. Боль от получения урона уменьшает время очарования.\n\nХодов осталось: %s.

actors.buffs.chill.name=окоченел
actors.buffs.chill.freezes=%s замерзает!
actors.buffs.chill.desc=Вам очень холодно, но вы пока ещё можете двигаться.\n\nОкоченевшая цель совершает все свои действия медленнее обычного, в зависимости от оставшегося времени действия эффекта. В худшем случае это эквивалентно замедлению.\n\nХодов осталось: %1$s. \nСнижение скорости: %2$s%%.

actors.buffs.combo.name=комбо
actors.buffs.combo.action_name=комбо атака
actors.buffs.combo.combo=Комбо из %d ударов!
actors.buffs.combo.bad_target=Цель должна быть в радиусе атаки.
actors.buffs.combo.prompt=Выберите цель для атаки.
actors.buffs.combo.desc=Гладиатор специализируется на проведении комбо. Каждое попадание увеличивает счётчик комбо-ударов, но если слишком долго не атаковать или промахнуться несколько раз подряд, счётчик сбросится до 0. Пока у гладиатора есть очки комбо, щит, полученный от сломанной печати, не будет уменьшаться.\n\nКомбо даёт доступ к завершающим приёмам: особым атакам, которые всегда попадают в цель! Особые приёмы доступны на комбо из 2, 4, 6, 8 и 10 ударов. Завершающий приём прерывает комбо.\n\nТекущее комбо: %1$d.\n\nХодов до конца комбо: %2$s.
actors.buffs.combo$combomove.clobber.name=таран
actors.buffs.combo$combomove.clobber.desc=Отбрасывает врагов на две клетки назад, но не наносит им урона и не может скинуть их в пропасть. Увеличивает комбо на 1.
actors.buffs.combo$combomove.clobber.empower_desc=Отталкивает врага назад на _3 клетки_ и накалывает эффект головокружения, но не наносит урон. Эта способность позволяет сталкивать противников в ямы и пропасти. Увеличивает комбо на 1.
actors.buffs.combo$combomove.slam.name=натиск
actors.buffs.combo$combomove.slam.desc=Наносит дополнительный урон в размере %d%% (комбо × 20%%) от того урона, который может заблокировать ваша броня. После применения комбо сбрасывается.
actors.buffs.combo$combomove.slam.empower_desc=_Прыжок на расстояние до %1$d клеток_ с дополнительным уроном в размере %2$d%% (комбо × 20%%) от того урона, который может заблокировать ваша броня. После применения комбо сбрасывается.
actors.buffs.combo$combomove.parry.name=парирование
actors.buffs.combo$combomove.parry.desc=Блокирует следующую атаку в течение 1 хода и мгновенно атакует. Сбрасывает комбо, если никакая атака не была блокирована.
actors.buffs.combo$combomove.parry.empower_desc=Блокирует _все атаки_ в течение 1 хода после активации и позволяет мгновенно контратаковать противников. Сбрасывает комбо, если парирование не сработало.
actors.buffs.combo$combomove.crush.name=обрушение
actors.buffs.combo$combomove.crush.desc=Наносит %d%% (комбо умноженное на 25%%) вашего урона главной цели, и половину этого урона всем врагам в районе 7x7. Сбрасывает комбо при использовании.
actors.buffs.combo$combomove.crush.empower_desc=_Переносит на %1$d клетки_ и наносит %2$d%% (комбо умноженное на 25%%) вашего урона главной цели, и половину этого урона всем врагам в районе 7x7. Сбрасывает комбо при использовании.
actors.buffs.combo$combomove.fury.name=неистовство
actors.buffs.combo$combomove.fury.desc=Бьёт врага один раз за каждое имеющееся у вас комбо. Каждый удар наносит 60% от вашего урона и может активировать зачарования. Сбрасывает комбо при использовании.
actors.buffs.combo$combomove.fury.empower_desc=_Прыжок на расстояние до %d клеток_ и серия ударов по врагу — по одному за каждое очко комбо. Каждый удар наносит 60%% обычного урона и может активировать зачарования. После применения комбо сбрасывается.

actors.buffs.corruption.name=проклят
actors.buffs.corruption.desc=Порча проникает в саму суть существ, извращая их истинную природу.\n\nСущества под воздействием порчи будут атаковать своих бывших союзников, игнорируя настоящего врага. К тому же, порча наносит урон, приближая смерть жертвы.\n\nПорчу невозможно снять, только смерть остановит её.

actors.buffs.cripple.name=покалечен
actors.buffs.cripple.heromsg=Вы покалечены!
actors.buffs.cripple.desc=Вы почти уверены, что ноги не должны так гнуться.\n\nХромота вдвое снижает скорость передвижения, поэтому передвижение на одну клетку обычно занимает два хода, вместо одного.\n\nХодов осталось: %s.

actors.buffs.daze.name=ошеломлён
actors.buffs.daze.heromsg=Вы ошеломлены!
actors.buffs.daze.desc=Звон в ушах и пелена перед глазами мешают вам сражаться.\n\nПока вы ошеломлены, точность и уклонение снижены на 50%%, что значительно усложняет попадание по противнику и уворот от атак.\n\nХодов ошеломления осталось: %s.

actors.buffs.degrade.name=потрепан
actors.buffs.degrade.heromsg=Ваша экипировка выглядит дряхлой!
actors.buffs.degrade.desc=Мощная, темная магия высасывает силу, которой Свитки улучшения наделили вашу экипировку!\n\nВо время, пока ваша экипировка деградирована, ее фактический уровень ниже действительного. _Любое улучшение после +3 становится порядком слабее предыдущего._ Описание ваших предметов будет изменяться с учетом его сниженного уровня силы.\n\nДеградация не влияет на требования силы, заряды палочек, прочность метательного оружия или на артефакты.\n\nОсталось ходов с деградацией: %s. Использование Свитка улучшения или рассеяния немедленно снимет эффект деградации.

actors.buffs.doom.name=обречен
actors.buffs.doom.desc=Тяжело двигаться вперёд, когда кажется, что вся Вселенная желает вам смерти.\n\nВесь урон, получаемый обречённым на гибель персонажем, увеличивается на 67%.\n\nДанный эффект длится до самой смерти.

actors.buffs.dread.name=боязнь
actors.buffs.dread.desc=Ужас настолько сильный, что напуганный сбежит из подземелья навсегда.\n\nПораженные ужасом будут убегать от противника во весь дух, и полностью исчезнут, как только скроются из виду. Такое избавление, конечно, не даст вам вещей монстра, и наградит лишь половиной опыта. Боль сокращает продолжительность эффекта.\n\nХодов до окончания эффекта: %d.

actors.buffs.drowsy.name=сонливый
actors.buffs.drowsy.desc=Магическая сила мешает бодрствовать, и через несколько ходов цель погружается в глубокий магический сон.\n\nГерой может противостоять сонливости, получая урон или сохраняя полное здоровье.\n\nХодов до засыпания: %s.

actors.buffs.earthimbue.name=пропитан землей
actors.buffs.earthimbue.desc=Вы наделены силой Земли! \n\nВсе физические атаки сотрясают землю под ногами врагов, калеча их на небольшое время. \n\nХодов осталось: %s.

actors.buffs.enhancedrings.name=улучшенные кольца
actors.buffs.enhancedrings.desc=Недавно использованный Разбойником артефакт усиливает кольца, улучшая их на +1.\n\nХодов осталось: %s.

actors.buffs.fireimbue.name=пропитан огнем
actors.buffs.fireimbue.desc=Вы наделены силой Огня!\n\nВсе ваши физические атаки имеют шанс поджечь цель. К тому же вы абсолютно невосприимчивы к огню.\n\nХодов осталось: %s.

actors.buffs.foresight.name=предвидение
actors.buffs.foresight.desc=Ваши чувства обострены, позволяя моментально обнаружать любые странности.\n\nВо время действия эффекта прозрения любой секрет, находящийся в вашем радиусе поиска, будет немедленно раскрыт.\n\nХодов осталось: %s.

actors.buffs.frost.name=заморожен
actors.buffs.frost.freezes=%s замерзает!
actors.buffs.frost.desc=Это не полная заморозка тела, а скорее просто слой льда, делающий любые движения невозможными.\n\nЗаморозка действует как паралич, не позволяя жертве действовать. В отличие от паралича, заморозка будет снята сразу же при получении урона, так как лёд расколется.\n\nХодов осталось: %s.

actors.buffs.frostimbue.name=пропитан холодом
actors.buffs.frostimbue.desc=Вы наделены силой Льда!\n\nВсе ваши физические атаки накладывают эффект окоченения на врагов. К тому же, этот эффект обеспечивает абсолютную невосприимчивость к холоду.\n\nХодов осталось: %s.

actors.buffs.fury.name=ожесточен
actors.buffs.fury.heromsg=Вы в ярости!
actors.buffs.fury.desc=Вы злитесь, и вашим врагам не понравится, когда вы злитесь.\n\nДикая ярость пылает внутри вас, увеличивая наносимый физическими атаками урон на 50%%.\n\nВы будете в ярости, пока уровень здоровья превышает 50%%.

actors.buffs.blobimmunity.name=очищающий барьер
actors.buffs.blobimmunity.desc=Какая-то загадочная сила окружает вас тонким защитным барьером, ограждая вас от любых вредных испарений.\n\nВо время действия этого барьера, вы неуязвимы для любых эффектов, действующих по площади.\n\nХодов осталось: %s.

actors.buffs.gravitychaostracker.name=гравитационный хаос
actors.buffs.gravitychaostracker.desc_intro=Каждые несколько ходов все персонажи на текущем этаже подземелья будут подброшены в случайном направлении.
actors.buffs.gravitychaostracker.desc_positive=Однако вы и ваши союзники, похоже, невосприимчивы.
actors.buffs.gravitychaostracker.desc_duration=Нельзя сказать сколько будет продолжаться эффект, но он не может длиться вечно.

actors.buffs.greaterhaste.name=Повышенная спешка
actors.buffs.greaterhaste.desc=Невероятный прирост в скорости, на мгновение кажется, что всё остальное стоит на месте.\n\nВ то время как в условиях повышенной спешки перемещение не занимает много времени, другие действия по-прежнему выполняются с нормальной скоростью. Каждый шаг движения потребляет ход повышенной спешки.\n\nХодов осталось: %d.

actors.buffs.haste.name=спешка
actors.buffs.haste.desc=Энергия пронизывает ваши мышцы, позволяя вам передвигаться с невероятной скоростью!\n\nПод действием ускорения вы будете передвигаться втрое быстрее, но на скорость выполнения других действий этот эффект не влияет.\n\nХодов осталось: %s.

actors.buffs.healing.name=лечение
actors.buffs.healing.desc=Исцеляющие чары восстанавливают плоть и останавливают боль в вашем теле.\n\nКаждый ход, данный эффект будет возвращать часть потерянного здоровья. Сила лечения может снижаться со временем.\n\nСила эффекта: %d.\n\nОсталось лечения: %d.

actors.buffs.herodisguise.name=маскировка
actors.buffs.herodisguise.desc=Иллюзорная магия изменила ваш физический вид! Эффект чисто косметический, но всё равно ощущается очень странно.\n\nХодов осталось: %s.

actors.buffs.hex.name=заколдован
actors.buffs.hex.heromsg=Вас сглазили!
actors.buffs.hex.desc=От темной дезориентирующей магии сложнее сосредоточиться на цели и уклоняться.\n\nСглаз снижает меткость и уклонение на 20%%, и, таким образом, снижает эффективность цели в бою.\n\nОсталось ходов со сглазом: %s.

actors.buffs.holdfast.name=защитная стойка
actors.buffs.holdfast.desc=Воин удерживает свою позицию, увеличивая свою защиту на %1$d-%2$d и замедляя скорость исчезновения некоторых эффектов на %3$d%%. Защита длится, пока он не начнет двигаться.

actors.buffs.hunger.hungry=голоден
actors.buffs.hunger.starving=истощен
actors.buffs.hunger.onhungry=Вы слегка голодны.
actors.buffs.hunger.onstarving=Вы очень голодны!
actors.buffs.hunger.ondeath=Вы умерли от голода...
actors.buffs.hunger.cursedhorn=Проклятый рог крадёт часть энергии у еды, которую вы едите.
actors.buffs.hunger.rankings_desc=Умер от голода
actors.buffs.hunger.desc_intro_hungry=Вы слышите, как от голода урчит живот, но пока не сильно.
actors.buffs.hunger.desc_intro_starving=Вы голодны настолько, что это причиняет вам боль.
actors.buffs.hunger.desc=\n\nГолод постепенно усиливается, пока вы находитесь в подземелье, со временем вы начнёте сильно голодать. В этом состоянии вы начнёте терять здоровье, а не восстанавливать его.\n\nПравильное питание - это важно! Если есть лишнее здоровье, то можно немного поголодать, чтобы сохранить еду. Правильное питание позволит сохранить еду на больший срок.

actors.buffs.invisibility.name=невидим
actors.buffs.invisibility.desc=Вы полностью сливаетесь с окружением, вас невозможно заметить.\n\nПока вы в этом состоянии, враги не атакуют и не преследуют вас. Атака или использование магии (например, свитка или палочки) немедленно рассеет невидимость.\n\nХодов осталось: %s.

actors.buffs.invulnerability.name=неуязвимый
actors.buffs.invulnerability.desc=Этот персонаж наполнен огромной защитной силой, дарующей ему неуязвимость на короткое время!\n\nХодов осталось: %s.

actors.buffs.levitation.name=парит
actors.buffs.levitation.desc=Магическая сила поднимает вас над землей, заставляя чувствовать себя невесомым.\n\nЛевитирующие герои передвигаются бесшумно и игнорируют все наземные эффекты. Ловушки не будут срабатывать, вода не потушит огонь, растения не будут растоптаны, корни не оплетут вас и вы сможете парить над пропастью. Будьте осторожнее: всё это может произойти в ту же секунду, когда эффект закончится!\n\nХодов осталось: %s.

actors.buffs.lifelink.name=узы жизни
actors.buffs.lifelink.ondeath=Вы погибли от урона уз жизни...
actors.buffs.lifelink.desc=Жизненная сила этого персонажа связана с другим, находящемся недалеко персонажем. Любой урон разделяется между ними.\n\nКогда этому персонажу наносится урон, половина достается связанному с ним Узами жизни\n\nОсталось ходов с Узами жизни: %s.

actors.buffs.light.name=освещен
actors.buffs.light.desc=Как свет набирает силу, так крепнет храбрость в душах и становятся ясными предстоящие цели. Даже в глубине темнейшего подземелья источник света способен вселить уверенность в ваше сердце. \n\nСвет разгоняет тьму, позволяя видеть достаточно далеко, несмотря на окружающий вас мрак.\n\nХодов осталось: %s.

actors.buffs.lockedfloor.name=уровень закрыт
actors.buffs.lockedfloor.desc=Текущий уровень закрыт, вы не сможете покинуть его!\n\nПока уровень закрыт, голод не усиливается и вы не получаете урона от голодания. К тому же, если вы не пытаетесь победить босса, пассивная регенерация также перестает действовать.\n\nВдобавок, если вы воскреснете с использованием неосвященного анха, уровень восстановится.\n\nУбейте босса, чтобы пройти дальше.

actors.buffs.lostinventory.name=утерянный инвентарь
actors.buffs.lostinventory.desc=Ваш инвентарь был потерян где-то в подземелье! Вы не сможете подобрать или использовать большинство предметов, пока не восстановите его.

actors.buffs.magicalsight.name=магический взор
actors.buffs.magicalsight.desc=Каким-то образом вы видите умом, а не глазами.\n\nПока волшебное зрение активно, на вас не действуют местность и эффекты, блокирующие поле зрения, а дальность обзора увеличивается до 12 клеток.\n\nХодов осталось: %s.

actors.buffs.magicalsleep.name=волшебный сон
actors.buffs.magicalsleep.toohealthy=Вы слишком здоровы и смогли устоять перед желанием уснуть.
actors.buffs.magicalsleep.fallasleep=Вы падаете в глубокий магический сон.
actors.buffs.magicalsleep.wakeup=Вы просыпаетесь бодрым и здоровым.
actors.buffs.magicalsleep.desc=Этот персонаж оказался в глубоком магическом сне и не может проснуться сам.\n\nМагический сон похож на обычный, однако теперь только получение урона способно разбудить уснувшего.\n\nМагический сон героя и его союзников обладает целебными свойствами, позволяя им быстро восстанавливаться.

actors.buffs.magicimmune.name=иммунитет к магии
actors.buffs.magicimmune.desc=Любые чары потеряли над вами всякую власть, вы совершенно неуязвимы для магии.\n\nДанный эффект подавляет действие любых вредных или полезных магических эффектов, включая проклятия, зачарования, палочки, свитки, кольца, артефакты и т. д. Способности героической брони достаточно сильные, чтобы работать, несмотря на эффект антимагии.\n\nХодов осталось: %s.

actors.buffs.mindvision.name=ментальное зрение
actors.buffs.mindvision.desc=Каким-то образом вы способны чувствовать присутствие чужого сознания сквозь стены. Это очень странное ощущение.\n\nВо время действия Ментального зрения вы видите всех существ на данном этаже. Очень полезно в сочетании с теми магическими эффектами, которые воздействуют на всех врагов в поле зрения.\n\nХодов осталось: %s.

actors.buffs.momentum.momentum=накопление импульса
actors.buffs.momentum.running=бег
actors.buffs.momentum.resting=восстановление
actors.buffs.momentum.action_name=бег
actors.buffs.momentum.momentum_desc=При движении Бродяга накапливает импульс, который может тратить для бега.\n\nКаждый заряд импульса дарит два хода бега, и Бродяга может накопить до 10 зарядов. Импульс быстро теряется, когда Бродяга стоит на месте.\n\nТекущий заряд импульса: %d.
actors.buffs.momentum.running_desc=Когда Бродяга двигается, он накапливает инерцию, которую он может использовать, чтобы начать бежать.\n\nПока Бродяга бежит, он двигается с удвоенной скоростью и получает бонус к уклонению, рассчитанный на его уровне.\n\nХодов осталось: %d.
actors.buffs.momentum.resting_desc=Когда Бродяга двигается, он накапливает инерцию, которую он может использовать, чтобы начать бежать.\n\nБродяге нужно время, чтобы восстановить выносливость, прежде чем снова начать копить инерцию.\n\nХодов осталось: %d.

actors.buffs.monkenergy.name=энергия
actors.buffs.monkenergy.action=Умения Монаха
actors.buffs.monkenergy.desc=Побеждая противников, Монах получает энергию, которую она может использовать для активации способностей. Большинство из врагов дают 1 единицу энергии при поражении. \n\nЗарядов энергии: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=После применения способности Монах должен немного подождать, прежде чем воспользоваться следующей.\n\nДо готовности: %d ходов.
actors.buffs.monkenergy$monkability$flurry.name=шквал ударов
actors.buffs.monkenergy$monkability$flurry.desc=Два мгновенных удара, которые наносят %1$d-%2$d урона и игнорируют броню. Эту способность нельзя использовать повторно.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Два мгновенных удара, которые наносят %1$d-%2$d урона, игнорируют броню и _используют чары вашего оружия._ Эту способность нельзя использовать повторно.
actors.buffs.monkenergy$monkability$focus.name=фокусировка
actors.buffs.monkenergy$monkability$focus.desc=Монах тратит ход, чтобы сосредоточиться, позволяя ей парировать следующую атаку, направленную против нее.
actors.buffs.monkenergy$monkability$focus.empower_desc=Монах _мгновенно сосредотачивается,_ позволяя ей парировать следующую атаку, направленную против нее.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=сфокусирована
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=Монах сосредоточен на своем окружении, ожидая следующей атаки, направленной против него. Пока он сосредоточен, он гарантированно отразит следующую приближающуюся атаку.
actors.buffs.monkenergy$monkability$dash.name=рывок
actors.buffs.monkenergy$monkability$dash.prompt=Выберите Место
actors.buffs.monkenergy$monkability$dash.desc=Мгновенный рывок на расстояние до 4 клеток. Эта способность позволяет преодолевать препятствия, но не врагов или стены.
actors.buffs.monkenergy$monkability$dash.empower_desc=Мгновенный рывок на расстояние до _8 клеток_. Эта способность позволяет преодолевать препятствия, но не врагов или стены.
actors.buffs.monkenergy$monkability$dragonkick.name=удар дракона
actors.buffs.monkenergy$monkability$dragonkick.desc=Монах совершает сокрушительный удар, наносящий %1$d-%2$d урона и игнорирующий броню. Удар отбрасывает цель и парализует её. Длительность эффекта зависит от расстояния.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=Монах совершает сокрушительный удар, наносящий %1$d-%2$d урона и игнорирующий броню. Удар отбрасывает _всех вблизи цели_ и парализует их. Длительность эффекта зависит от расстояния.
actors.buffs.monkenergy$monkability$meditate.name=медитация
actors.buffs.monkenergy$monkability$meditate.desc=Монах концентрирует энергию в своём теле в течение 5 ходов. По завершению она очищается от большинства негативных эффектов и увеличивает скорость перезарядки артефактов и палочек на 8 ходов.
actors.buffs.monkenergy$monkability$meditate.empower_desc=Монах концентрирует энергию в своём теле в течение 5 ходов. По завершению она очищается от большинства негативных эффектов и увеличивает скорость перезарядки артефактов и палочек на 8 ходов. _Когда проходит медитация, она также получает 80% сопротивления урону и медленно восстанавливает 20% от недостающего здоровья._

actors.buffs.ooze.name=едкая слизь
actors.buffs.ooze.heromsg=Ядовитая слизь разъедает вашу плоть. Надо её смыть!
actors.buffs.ooze.ondeath=Вы растаяли...
actors.buffs.ooze.rankings_desc=Растворился
actors.buffs.ooze.desc=Этот липкий яд въедается в кожу, медленно растворяя её.\n\nСлизь наносит постоянный урон каждый ход, но её легко можно смыть водой.\n\nХодов осталось: %s.

actors.buffs.paralysis.name=парализован
actors.buffs.paralysis.heromsg=Вы парализованы!
actors.buffs.paralysis.desc=Зачастую, самое худшее - это потерять контроль над ситуацией.\n\nПаралич вынуждает цель ждать окончания эффекта. Боль от получения урона может заставить персонажей сопротивляться параличу, выводя их из-под действия эффекта.\n\nХодов осталось: %s.

actors.buffs.physicalempower.name=физически усилен
actors.buffs.physicalempower.desc=Ваши удары были усилены, что увеличивает количество урона, который вы можете нанести, поражая врагов физическими атаками.\n\nДополнительный урон: %1$d.\nУдаров осталось: %2$d.

actors.buffs.pincushion.name=мишень
actors.buffs.pincushion.desc=Орудие, брошенное в этого персонажа, застряло в нем и выпадет только после того, как он будет убит.\n\nВ настоящее время в нём воткнуты следующие предметы:

actors.buffs.poison.name=отравлен
actors.buffs.poison.heromsg=Вы отравлены!
actors.buffs.poison.ondeath=Вы умерли от отравления...
actors.buffs.poison.rankings_desc=Умер от яда
actors.buffs.poison.desc=Яд проникает в вашу кровь, медленно убивая вас изнутри.\n\nОтравление наносит урон в зависимости от оставшегося времени действия.\n\nХодов осталось: %s.

actors.buffs.preparation.name=коварство
actors.buffs.preparation.action_name=подготовленный удар
actors.buffs.preparation.desc=Убийца терпеливо выжидает, готовясь нанести удар из тени.
actors.buffs.preparation.desc_dmg=Его следующая атака нанесёт _%1$d%% дополнительного урона_, и уничтожит обычных врагов, здоровье которых ниже _%2$d%%_, или боссов со здоровьем ниже _%3$d%%_.
actors.buffs.preparation.desc_dmg_likely=Также урон от данной атаки будет ближе к максимальному возможному значению.
actors.buffs.preparation.desc_blink=Он способен перенестись к своей цели перед ударом. Максимальная дистанция - _%d_ клеток.
actors.buffs.preparation.desc_invis_time=Ходов в состоянии невидимости: _%d._
actors.buffs.preparation.desc_invis_next=Ходов до усиления атаки: _%d._
actors.buffs.preparation.prompt=Выберите цель!\nМакс. дистанция: %d
actors.buffs.preparation.no_target=Здесь нечего атаковать.
actors.buffs.preparation.out_of_reach=Эта цель вне досягаемости.
actors.buffs.preparation.assassinated=убит

actors.buffs.prismaticguard.name=радужный Страж
actors.buffs.prismaticguard.desc=Вас охраняет радужная копия. В данный момент она находится в пассивном режиме, но при встрече с врагами она вернётся к жизни, чтобы защитит вас!\n\nРадужная копия постепенно восстанавливает своё здоровье, пока бездействует.\n\nТекущие ОЗ: %d/%d.
actors.buffs.prismaticguard.desc_many=Эта радужная копия также получает бонус от силы многих. Ходов осталось: %d.

actors.buffs.recharging.name=перезарядка
actors.buffs.recharging.desc=Энергия течёт сквозь вас, увеличивая скорость перезарядки палочек и посохов.\n\nС каждым ходом текущий заряд будет увеличиваться на четверть, вдобавок к обычному восстановлению.\n\nХодов осталось: %s.

actors.buffs.revealedarea.name=выявленная область
actors.buffs.revealedarea.desc=Область подземелья была временно открыта герою, и он будет видеть ее, где бы не находился.\n\nХодов осталось: %s.

actors.buffs.revealedchar.name=обнаруженный
actors.buffs.revealedchar.desc=Этот персонаж открыт герою, и он будет виден, где бы ни находился.\n\nХодов сталось: %s.

actors.buffs.roots.name=укоренен
actors.buffs.roots.heromsg=Вы не можете двигаться!
actors.buffs.roots.desc=Корни (магические или естественные) оплетают ваши ноги, приковывая их к земле.\n\nОплетение не позволяет передвигаться, делая ходьбу и другие передвижения невозможными. Все остальные действия всё ещё остаются доступными, в том числе телепортация.\n\nХодов осталось: %s.

actors.buffs.scrollempower.name=усиление свитка
actors.buffs.scrollempower.desc=Энергия свитка, который Маг недавно прочёл, усиливает его палочки!\n\nПовышение уровня: +%1$d.\nВыстрелов осталось: %2$d.

actors.buffs.shadows.name=в тени
actors.buffs.shadows.desc=Вы слились с окружающими тенями, став невидимыми; обмен веществ замедлился.\n\nПока вы скрыты, враги не могут ни атаковать, ни преследовать вас. Большинство физических атак и магических эффектов, например свитков и палочек, немедленно рассеивают эту невидимость. Пока вы слиты с тенями, голод нарастает медленнее.\n\nВы останетесь в тенях, пока не покинете их или пока враг не столкнётся с вами.

actors.buffs.slow.name=замедлен
actors.buffs.slow.desc=Замедляющая магия влияет на восприятие времени целью. Для неё всё происходит очень быстро.\n\nЗамедленный персонаж действует вдвое медленнее, чем обычно.\n\nХодов осталось: %s.

actors.buffs.snipersmark.name=метка снайпера
actors.buffs.snipersmark.action_name_snapshot=мгновенный выстрел
actors.buffs.snipersmark.action_name_volley=залп
actors.buffs.snipersmark.action_name_sniper=снайперский выстрел
actors.buffs.snipersmark.desc=Снайпер может сделать специальный выстрел по цели, которую только что атаковала. Эффект выстрела будет различаться в зависимости от того, на что сбалансирован её лук.\n\nВ нормальном состоянии, лук совершит _мгновенный выстрел,_ который нанесёт меньше урона, но не потребует времени.\n\nУскоренный лук совершит _залп_ из трёх стрел. Каждая стрела нанесёт меньше урона, но шанс срабатывания зачарований останется прежним. Залп потратит 1 ход.\n\nУсиленный лук совершит _снайперский выстрел._ Этот выстрел гарантированно попадает в цель, и наносит дополнительный урон, зависящий от расстояния до цели. Это потратит 2 хода.\n\nХодов осталось: %s.

actors.buffs.soulmark.name=душа отмечена
actors.buffs.soulmark.desc=Чернокнижник завладел душой этого существа, что позволяет ему исцелять себя, когда оно получает физический урон.\n\nХодов осталось: %s.

actors.buffs.stamina.name=выносливость
actors.buffs.stamina.desc=Ваша выносливость не знает границ, позволяя двигаться быстрее!\n\nПока действует этот эффект, скорость вашего передвижения увеличена на 50%%, однако все остальные действия выполняются с обычной скоростью.\n\nОсталось ходов: %s.

actors.buffs.swarminteltracker.name=единый разум
actors.buffs.swarminteltracker.desc=_Единый разум_ позволяет врагам звать подкрепление к вашему местоположению, когда они видят вас или союзников.\n\nРадиус, в котором враги привлекают подмогу, ограничен. Чем дольше вы остаётесь на виду, тем он больше — вплоть до 12 клеток. Стоит хотя бы на миг скрыться из поля зрения, и радиус сбросится.\n\nТекущий максимальный радиус привлечения: %d.

actors.buffs.vulnerable.name=уязвимый
actors.buffs.vulnerable.heromsg=Вы чувствуете себя хрупким!
actors.buffs.vulnerable.desc=Магия уязвимости повышает физический урон, причиняемый персонажу. Весь входящий физический урон, оставшийся после блокирования броней, увеличен на 33%%. \n\nОсталось ходов с уязвимостью: %s.

actors.buffs.terror.name=в ужасе
actors.buffs.terror.desc=Ужас - контролирующая магия, повергающая цель в неконтролируемую панику.\n\nПерепуганные персонажи вынуждены убегать от своего противника, стараясь оставить между собой как можно больше дверей и стен. Однако болевой шок способен ослабить этот эффект.\n\nХодов осталось: %s.

actors.buffs.toxicimbue.name=пропитан токсичностью
actors.buffs.toxicimbue.desc=Вы наделены силой Яда!\n\nВо время движения вы распространяете отравляющий газ, наносящий урон вашим врагам. Во время действия эффекта вы невосприимчивы к отравлению и отравляющему газу, и даже на несколько ходов после эффекта.\n\nХодов осталось: %s.

actors.buffs.corrosion.name=коррозия
actors.buffs.corrosion.heromsg=Кислота разъедает вашу кожу!
actors.buffs.corrosion.ondeath=Кислота убила вас...
actors.buffs.corrosion.rankings_desc=Растворился
actors.buffs.corrosion.desc=Едкая кислота стремительно разъедает плоть, металл и кости.\n\nПока кислота продолжает разъедать цель, урон от коррозии нарастает.\n\nОсталось ходов коррозии: %1$s.\nТекущий урон коррозии: %2$d.

actors.buffs.vertigo.name=головокружение
actors.buffs.vertigo.desc=Сложно идти в правильном направлении, когда весь мир вращается перед глазами.\n\nВ этом состоянии персонаж при ходьбе будет перемещаться в случайном направлении.\n\nХодов осталось: %s.

actors.buffs.wandempower.name=усиленные палочки
actors.buffs.wandempower.desc=Ваши боевые палочки были усилены, увеличивая количество наносимого ими урона на несколько выстрелов.\n\nДополнительный урон: %1$d.\nВыстрелов осталось: %2$d.

actors.buffs.weakness.name=ослабление
actors.buffs.weakness.heromsg=Вы чувствуете слабость!
actors.buffs.weakness.desc=Всё внезапно кажется намного тяжелее.\n\nМагия ослабления снижает физическую силу персонажа и приводит к тому, что он наносит на 33%% меньше урона.\n\nХодов осталось: %s.

actors.buffs.wellfed.name=сытость
actors.buffs.wellfed.desc=Вы наелись до отвала и полностью довольны жизнью.\n\nВо время действия данного эффекта ваше здоровье будет постепенно восстанавливаться. Кроме того, голод не будет увеличиваться.\n\nХодов осталось: %d.



###hero

##abilities
actors.hero.abilities.armorability.self_target=Нельзя выбрать себя в качестве цели!
actors.hero.abilities.armorability.no_target=Там не на что нацеливаться!
actors.hero.abilities.armorability.prompt=Выберите расположение цели
actors.hero.abilities.armorability.cost=Стоимость заряда: _%d_

actors.hero.abilities.warrior.heroicleap.name=героический прыжок
actors.hero.abilities.warrior.heroicleap.prompt=Выберите направление для прыжка
actors.hero.abilities.warrior.heroicleap.short_desc=Воин совершает _Героический прыжок_ к указанному месту, перепрыгивая врагов и опасности.
actors.hero.abilities.warrior.heroicleap.desc=Воин совершает прыжок в указанное место, преодолевая любых врагов или опасности на пути. Однако он не может перепрыгивать через стены или другую твердую местность.
actors.hero.abilities.warrior.shockwave.name=ударная волна
actors.hero.abilities.warrior.shockwave.short_desc=Воин выпускает конусовидную _Ударную волну_, хлопнув по земле. Враги, попавшие в ударную волну, получают повреждения и хромоту.
actors.hero.abilities.warrior.shockwave.desc=Воин ударяет по земле, создавая ударную волну, которая распространяется до 5 клеток в пределах 60 градусного конуса.\n\nВраги, попавшие в эту ударную волну, получают эффект хромоты на 5 ходов. Также они получают 5-10 урона, плюс дополнительные 1-2 урона за каждое очко силы воина выше 10.
actors.hero.abilities.warrior.endure.name=выжидание
actors.hero.abilities.warrior.endure$enduretracker.name=выдержка
actors.hero.abilities.warrior.endure$enduretracker.desc=Теперь Воин наносит бонусный урон, основанный на уроне, который он перенес.\n\nБонусный Урон: %1$d\nУдаров осталось: %2$d
actors.hero.abilities.warrior.endure.short_desc=Воин _Выжидает_, пропуская несколько ходов, но получая высокую устойчивость к урону. Затем он наносит бонусный урон, основанный на том, что он вытерпел.
actors.hero.abilities.warrior.endure.desc=Воин выжидает 3 хода, получая половину урона от всех источников. Это снижение срабатывает перед эффектами сопротивления урону, такими как броня.\n\nПосле выжидания следующий удар воина нанесет дополнительный урон в течение 10 ходов. Этот урон равен половине всего урона, нанесенного ему во время выжидания, полученного до любых эффектов уменьшения урона!\n\nЕсли воин в процессе комбо, использование этой способности увеличит их длительность на 3 хода.

actors.hero.abilities.mage.elementalblast.name=стихийный взрыв
actors.hero.abilities.mage.elementalblast.no_staff=Вы не можете использовать эту способность без своего посоха.
actors.hero.abilities.mage.elementalblast.short_desc=Маг выпускает из посоха _Стихийный взрыв_, поражающий обширную область вокруг него. Эффект зависит от палочки, вложенной в посох.
actors.hero.abilities.mage.elementalblast.desc=Маг испускает магический взрыв, который покрывает круглую область на расстоянии до 4 клеток и наносит до 15-25 урона. Эффект стихийного взрыва будет зависеть от палочки, влитой в посох мага.
actors.hero.abilities.mage.elementalblast.generic_desc=Эффект стихийного взрыва будет схож с эффектом палочки при использовании на врага или союзника.
actors.hero.abilities.mage.wildmagic.name=дикая магия
actors.hero.abilities.mage.wildmagic.no_wands=У тебя нет палочек, чтобы выстрелить ими!
actors.hero.abilities.mage.wildmagic.short_desc=Маг высвобождает _Дикую Магию_, содержащуюся в его палочках, беспорядочно стреляя ими несколько раз в выбранную цель за один ход.
actors.hero.abilities.mage.wildmagic.desc=Маг высвобождает силу в своих палочках, случайным образом стреляя ими до 4 раз за один ход. Посох мага при этом не учитывается.\n\nУровень каждой палочки усилен на 2, максимум до +3. Эта способность расходует половину одного заряда палочек, при этом ни одна палочка не может быть использована более 2 раз.
actors.hero.abilities.mage.warpbeacon.name=варп-маяк
actors.hero.abilities.mage.warpbeacon.depths=Вы не можете перемещаться между пропастями!
actors.hero.abilities.mage.warpbeacon.locked_floor=Вы не можете покинуть закрытый этаж!
actors.hero.abilities.mage.warpbeacon.too_far=Это место слишком далеко!
actors.hero.abilities.mage.warpbeacon.invalid_beacon=Вы не можете разместить маяк здесь!
actors.hero.abilities.mage.warpbeacon.window_desc=Ваш маяк расположен на %d этаже.
actors.hero.abilities.mage.warpbeacon.window_tele=Телепортироваться к маяку
actors.hero.abilities.mage.warpbeacon.window_clear=Сбросить маяк
actors.hero.abilities.mage.warpbeacon.window_cancel=Отменить
actors.hero.abilities.mage.warpbeacon.short_desc=Маг размещает _Варп-Маяк_ в свое текущее местоположение, куда он может мгновенно телепортироваться обратно.
actors.hero.abilities.mage.warpbeacon.desc=Маг размещает маяк, который затем может быть убран по желанию. Установка маяка занимает 1 ход, но перемещение к нему происходит мгновенно.\n\nМаг не может перемещаться между этажами или использовать маяк для достижения недоступных мест, таких как запертые комнаты. Маг может телепортироваться на клетку с врагами, тем самым оттолкнув их.

actors.hero.abilities.rogue.smokebomb.name=дымовая бомба
actors.hero.abilities.rogue.smokebomb.fov=Прыгнуть можно только на пустую клетку в поле зрения.
actors.hero.abilities.rogue.smokebomb.prompt=Выберите клетку для прыжка
actors.hero.abilities.rogue.smokebomb$ninjalog.name=деревянная приманка
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=Каким-то образом враги легко убеждаются, что эта деревянная приманка - настоящий Разбойник!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=Вы можете найти этого персонажа с помощью определённой способности брони героя.
actors.hero.abilities.rogue.smokebomb.short_desc=Разбойник бросает _дымовую бомбу_ и совершает скачок, ослепляя врагов возле прежней позиции.
actors.hero.abilities.rogue.smokebomb.desc=Разбойник бросает дымовую шашку и совершает скачок на расстояние до 6 клеток. Он может перескакивать сквозь ловушки и врагов, но не сквозь твердую местность, такую как стены.\n\nВраги, которые находятся рядом со старой позицией разбойника, будут ослеплены на 5 ходов.
actors.hero.abilities.rogue.deathmark.name=метка смерти
actors.hero.abilities.rogue.deathmark.ally_target=Вы можете отмечать только врагов
actors.hero.abilities.rogue.deathmark.short_desc=Разбойник ставит _Метку Смерти_ на выбранного врага. Отмеченные враги получают дополнительный урон, но не могут умереть, пока отметка не закончится.
actors.hero.abilities.rogue.deathmark.desc=Разбойник ставит метку на выбранного врага, заставляя его получать 25% дополнительного урона. Метка ставится мгновенно и действует 5 ходов.\n\nПомеченные враги получают дополнительный урон, но не могут умереть, пока не истечет срок действия метки. Если у врага останется 0 ОЗ, когда действие метки закончится, он немедленно умрет.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=приговорен к смерти
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=Этот враг был помечен, в результате чего он получает 25%% бонусного урона, но он не может умереть до тех пор, пока метка не исчезнет.\n\nХодов осталось: %s.
actors.hero.abilities.rogue.shadowclone.name=теневой клон
actors.hero.abilities.rogue.shadowclone.short_desc=Разбойник призывает _Теневого клона_, который может быть направлен, чтобы помочь ему в бою.
actors.hero.abilities.rogue.shadowclone.desc=Разбойник призывает свою теневую копию, которой можно отдавать приказы в бою. Управление двойником не расходует заряды.\n\nУ двойника 80 ОЗ, нет брони, и он наносит 10-20 урона. Таланты могут улучшить эти характеристики и даже позволить двойнику получать бонусы от оружия и брони героя.
actors.hero.abilities.rogue.shadowclone$shadowally.name=теневой разбойник
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Ваш клон идет на выбранную позицию.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Ваш клон следует за вами.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Ваш клон идет в атаку!
actors.hero.abilities.rogue.shadowclone$shadowally.desc=Копия разбойника, созданная из темноты. Она стоит неподвижно, с пустыми глазницами и крошечными облачками тьмы, исходящими от нее, словно пар.\n\nЭто не идеальная копия разбойника, однако она по-прежнему является достойным бойцом, который может извлекать выгоду из экипировки разбойника при прокачке нужных талантов.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=Вы можете найти этого персонажа с помощью определённой способности брони героя.

actors.hero.abilities.huntress.spectralblades.name=спектральные клинки
actors.hero.abilities.huntress.spectralblades.short_desc=Охотница швыряет _спектральные клинки_ в цель, нанося урон в зависимости от ее текущего экипированного оружия ближнего боя.
actors.hero.abilities.huntress.spectralblades.desc=Охотница бросает во врага спектральный клинок, который равносилен удару оружием ближнего боя. Работают все обычные эффекты оружия ближнего боя, включая чары.
actors.hero.abilities.huntress.naturespower.name=сила природы
actors.hero.abilities.huntress.naturespower.short_desc=Охотница призывает _Силу Природы_, на короткое время увеличивая скорость движения и скорострельность своего лука.
actors.hero.abilities.huntress.naturespower.desc=Охотница наполняет себя и свой лук силой природы на 8 ходов!\n\nПока способность действует, Охотница передвигается _вдвое быстрее_ и стреляет из лука на _33% быстрее_. Дополнительные эффекты лука не срабатывают, если Снайпер применяет особые атаки.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=сила природы
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=Охотница усиливается на короткое время, увеличивая скорость своего передвижения и атаки с помощью лука.\n\nХодов осталось: %s.
actors.hero.abilities.huntress.spirithawk.name=дух ястреба
actors.hero.abilities.huntress.spirithawk.no_space=Рядом с вами нет свободного места.
actors.hero.abilities.huntress.spirithawk.short_desc=Охотница вызывает фамильяра _Духа Ястреба_, который может помочь ей разведать места и отвлечь врагов.
actors.hero.abilities.huntress.spirithawk.desc=Охотница призывает фамильяра ястреба-духа, которым можно управлять, повторно используя способность, пока он призван. Ястреб живет 100 ходов, управление ястребом не требует заряда или времени.\n\nУ ястреба очень низкое здоровье и сила атаки, но он быстр, ловок и точен. Он разделяет с охотницей свое поле зрения. Он невосприимчив ко всем связанным с областью эффектам, таким как огонь и ядовитый газ. Он не будет атаковать без приказа.
actors.hero.abilities.huntress.spirithawk$hawkally.name=дух ястреба
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Ваш ястреб идет на выбранную позицию.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Ваш ястреб следует за вами.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Ваш ястреб идет в атаку!
actors.hero.abilities.huntress.spirithawk$hawkally.desc=Волшебный ястреб, призванный Охотницей. Он светится ярким синим эфирным цветом, он постоянно крутит головой, осматривая местность\n\nХоть он и не лучший боец, его скорость и зрение делают его превосходным в разведке и отвлечении врагов.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Ходов осталось: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Осталось гарантированных уворотов: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=Вы можете найти этого персонажа с помощью определённой способности брони героя.

actors.hero.abilities.duelist.challenge.name=вызов
actors.hero.abilities.duelist.challenge.prompt=Выберите врага, которому хотите бросить вызов
actors.hero.abilities.duelist.challenge.already_dueling=Вы можете находиться только в одной дуэли одновременно.
actors.hero.abilities.duelist.challenge.ally_target=Вы можете бросать вызов только врагам.
actors.hero.abilities.duelist.challenge.unreachable_target=Цель должна быть достижима для вызова.
actors.hero.abilities.duelist.challenge.distant_target=Этот враг слишком далеко, чтобы бросить ему вызов.
actors.hero.abilities.duelist.challenge.short_desc=Дуэлянт _Вызывает_ соперника на дуэль, временно погружая в стазис всех остальных врагов.
actors.hero.abilities.duelist.challenge.desc=Дуэлянт вызывает ближайшего врага на поединок. Вызванный враг вынужден сражаться с ней, а все остальные противники временно замирают.\n\nЦель должна быть достижима и находиться не дальше 5 клеток. Дуэль заканчивается через 10 ходов, при смерти противника или если Дуэлянт отойдёт от него дальше чем на 5 клеток.\n\nЗамершие враги неуязвимы. Союзники Дуэлянта не замирают, но если целью выбран босс, его приспешники тоже продолжат действовать.
actors.hero.abilities.duelist.challenge$duelparticipant.name=участник дуэли
actors.hero.abilities.duelist.challenge$duelparticipant.desc=Этот персонаж участвует в дуэли. Он и все его союзники или приспешники могут свободно двигаться, пока другие заморожены.\n\nДуэль продлится определенное количество времени или завершится, когда один из участников погибнет или отойдет от другого на 5 клеток.\n\nОсталось ходов: %d.
actors.hero.abilities.duelist.elementalstrike.name=стихийный удар
actors.hero.abilities.duelist.elementalstrike.short_desc=Дуэлянт наносит _Стихийный удар_, распределяя эффект, зависимый от зачарования на её оружии, по области действия в форме конуса.
actors.hero.abilities.duelist.elementalstrike.desc=Дуэлянт наносит обычный удар по врагу или выбранной точке. Удар гарантированно попадает в цель и выпускает магическую волну на расстояние до 4 клеток конусом в 65 градусов. Эффект волны зависит от зачарования основного оружия Дуэлянта.
actors.hero.abilities.duelist.elementalstrike.generic_desc=Стихийный удар без зачарования на оружии создаст небольшой всплеск магии, наносящий 6-12 урона всем врагам в зоне поражения.
actors.hero.abilities.duelist.feint.name=ложный выпад
actors.hero.abilities.duelist.feint.prompt=Выберите клетку для рывка
actors.hero.abilities.duelist.feint.too_far=Это место далеко от вас.
actors.hero.abilities.duelist.feint.bad_location=Вы не можете попасть сюда.
actors.hero.abilities.duelist.feint.short_desc=Дуэлянт совершает _Ложный выпад_, имитируя атаку, и делает рывок на соседнюю клетку. Враги будут атаковать послеобраз Дуэлянта. Следующая атака против таких врагов будет внезапной.
actors.hero.abilities.duelist.feint.desc=Дуэлянт делает ложный выпад и перемещается на соседнюю клетку, оставляя на прежнем месте кратковременный послеобраз. Враги, которые собирались атаковать Дуэлянта, вместо этого бьют по послеобразу.\n\nВраги, ударившие по послеобразу, приходят в замешательство: их следующее действие отменяется, и по ним можно нанести внезапный удар.

actors.hero.abilities.cleric.ascendedform.name=Вознесённая форма
actors.hero.abilities.cleric.ascendedform.short_desc=Клирик принимает _Вознесённую форму_, получая новые заклинания, дальность атаки и щит.
actors.hero.abilities.cleric.ascendedform.desc=Клирик излучает святую энергию из себя, принимая улучшенную светлую форму на 10 ходов. Пока в этой форме, Клирик может применять новые заклинания, получает 2 к дальности атаки, 30 единиц щита и любые заклинания будут давать 10 единиц щита за каждый потраченный заряд священного тома.\n\nЩит, полученный от вознесённой формы и её заклинаний, не исчезает постепенно, но моментально пропадёт, как только закончится действие формы. Способность может быть использована повторно, чтобы обновить время действия формы.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=Вознесённая форма
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=Светлая энергия изучается телом Клирика. Пока в этой форме, Клирик может применять новые заклинания, получает 2 к дальности атаки (от излучаемой святой энергии), и 10 единиц щита за каждый потраченный заряд священного тома. Он также способен применять заклинания, которые открываются с помощью талантов вознесённой формы.\n\nЩит, полученный от вознесённой формы и её заклинаний, не исчезает постепенно, но моментально пропадёт, как только закончится действие формы.\n\nТекущий щит: %1$d.\nХодов осталось: %2$d.
actors.hero.abilities.cleric.trinity.name=Троица
actors.hero.abilities.cleric.trinity.no_imbue=Троица пока что не имеет эффекта для этой формы, используйте какие-нибудь её заклинание!
actors.hero.abilities.cleric.trinity.no_duplicate=Троица не может удвоить эффект который уже есть!
actors.hero.abilities.cleric.trinity.ench_glyph_use=Троица применит этот эффект на _%1$d ходов_, используя _%2$s заряда._
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=Троица применит этот _мощный_ эффект на _%1$d ходов_, используя _%2$s заряда._
actors.hero.abilities.cleric.trinity.wand_use=Троица выстрелит из этой палочки _+%1$d_ уровня, используя _%2$s заряда._
actors.hero.abilities.cleric.trinity.wand_multi_use=Троица выстрелит из многозарядной палочки _+%1$d_ уровня, используя _%2$s заряда._
actors.hero.abilities.cleric.trinity.thrown_use=Троица кинет оружие _+%1$d_ уровня, используя _%2$s заряда._
actors.hero.abilities.cleric.trinity.ring_use=Троица применит эффект кольца _+%1$d_ уровня на 20 ходов, используя _%2$s заряда._
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=Троица применит эффект переносной алхимии этого артефакта, используя _%2$s заряда._
actors.hero.abilities.cleric.trinity.chaliceofblood_use=Троица применит эффект пассивного восстановления здоровья этого артефакта _+%1$d_ уровня на 20 ходов, используя _%2$s заряда._
actors.hero.abilities.cleric.trinity.driedrose_use=Троица воспользуется эффектом призыва порченного дружественного призрака с ОЗ, как у этого артефакта _+%1$d_ уровня, используя _%2$s заряда._
actors.hero.abilities.cleric.trinity.etherealchains_use=Троица применит эффект цепей с досягаемостью, как у этого артефакта _+%1$d_ уровня, используя _%2$s заряда._
actors.hero.abilities.cleric.trinity.hornofplenty_use=Троица применит эффект перекуса этого артефакта, используя _%2$s заряда._
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=Троица применит эффект обкрадывающий врага, как у этого артефакта _+%1$d_ уровня, используя _%2$s заряда._
actors.hero.abilities.cleric.trinity.sandalsofnature_use=Троица применит эффект опутывания со случайным вредоносным семенем, как у этого артефакта, используя _%2$s заряда._
actors.hero.abilities.cleric.trinity.skeletonkey_use=Троица применит эффект отмычки, как у этого артефакта, используя _%2$s заряда._
actors.hero.abilities.cleric.trinity.talismanofforesight_use=Троица применит эффект предвидения, как у этого артефакта _+%1$d_ уровня, используя _%2$s заряда._
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=Троица применит эффект заморозки времени, как у этого артефакта с длительностью в _%1$d_ ходов, используя _%2$s заряда._
actors.hero.abilities.cleric.trinity.unstablespellbook_use=Троица применит эффект случайного свитка или с _%1$d/10_ шансом предложить особый вариант свитка, как у этого артефакта, используя _%2$s заряда._
actors.hero.abilities.cleric.trinity.cost=Стоимость заряда способности варьируется, но чаще всего равна _%d_.
actors.hero.abilities.cleric.trinity.short_desc=Клирик получает _Троицу_ способностей, которые имитируют увиденное им снаряжение и могут быть присвоены с помощью новых заклинаний.
actors.hero.abilities.cleric.trinity.desc=Клирик получает Троицу способностей брони, которые можно назначать на различные предметные эффекты с помощью трёх новых заклинаний. Каждое из этих заклинаний фокусируется на имитации эффектов разных видов экипировки, которые Клирик обнаружил во время этого прохождения: форма тела (оружие и броня), форма разума (палочки и метательное оружие) и форма духа (кольца и артефакты).\n\nКаждая форма Троицы может быть наделена только одним эффектом одновременно, и Клирик выбирает, какой из них активировать при использовании Троицы. Троица не будет дублировать эффект предмета, который уже экипирован.
actors.hero.abilities.cleric.trinity$wndusetrinity.text=Выберите, какую форму Троицы использовать. Эффекты от разных форм могут действовать одновременно.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_Телесная форма: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_Ментальная форма: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_Духовная форма: %s._
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=Выберите эффект, который будет вложен в Троицу. Перед подтверждением будет показана дополнительная информация.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=Присвоить телесную форму
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=Присвоить ментальную форму
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=Присвоить духовную форму
actors.hero.abilities.cleric.powerofmany.name=сила многих
actors.hero.abilities.cleric.powerofmany.prompt_default=Выберите союзника или место
actors.hero.abilities.cleric.powerofmany.prompt_ally=Направьте своего союзника
actors.hero.abilities.cleric.powerofmany.ally_exists=У вас уже есть усиленный союзник.
actors.hero.abilities.cleric.powerofmany.no_vision=Вы не можете нацелиться на место, которое не видите.
actors.hero.abilities.cleric.powerofmany.only_allies=Вы можете усиливать только союзников.
actors.hero.abilities.cleric.powerofmany.short_desc=Клирик направляет _Силу Многих_, усиливая существующего союзника или создавая нового.
actors.hero.abilities.cleric.powerofmany.desc=Клирик направляет _Силу Многих_, которая либо усиливает существующего союзника, либо создаёт нового усиленного союзника на 100 ходов. Если способность применяется на пустое пространство, создаётся новый союзник.\n\nПод воздействием Силы Многих любой союзник наносит на 25% больше урона, получает на 25% меньше урона и делится своим обзором с Клириком. Кроме того, при активации способности он получает 25 единиц щита.\n\nКлирик также получает три новых заклинания, которые можно использовать только при наличии усиленного союзника. Сила Многих не исчезнет, пока одно из этих заклинаний активно.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=сила многих
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=Этот союзник усилен _Силой многих_: он наносит на +25%% больше урона и получает на 25%% меньше. Кроме того, он делится с Клириком своей областью видимости и получает пользу от заклинаний Силы многих.\n\nУсиление сохраняется, даже когда союзник (например, радужная копия) прячется, но его длительность продолжает уменьшаться.\n\nОсталось ходов: %s.
actors.hero.abilities.cleric.powerofmany$lightally.name=световой союзник
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=Ваш союзник идет на выбранную позицию.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=Ваш союзник следует за вами.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=Ваш союзник идет в атаку!
actors.hero.abilities.cleric.powerofmany$lightally.desc=Копия одного из спутников клирика по приключениям, созданная из сплошного света. Хотя он имеет форму другого героя, у него нет ни одной из его уникальных способностей. Этот союзник будет существовать до тех пор, пока к нему применяется Сила Многих.\n\nЭтот союзник может быть направлен без затрат, если вы повторно используете способность доспехов Сила многих.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=Вы можете найти этого персонажа с помощью определённой способности брони героя.


actors.hero.abilities.ratmogrify.name=крысоморфоз
actors.hero.abilities.ratmogrify.cant_transform=Ты не можешь крысоморфизировать это!
actors.hero.abilities.ratmogrify.too_strong=Этот враг слишком силен, чтобы крысоморфизировать его!
actors.hero.abilities.ratmogrify.short_desc=Герой _Крысоморфизирует_ врага! Это временно превращает его в крысу без способностей.
actors.hero.abilities.ratmogrify.desc=Герой превращает врага в крысу на 6 ходов! Боссов, союзников и крыс превратить нельзя.\n\nПревращённые враги сохраняют свои характеристики, но теряют все особые способности.
actors.hero.abilities.ratmogrify$transmograt.name=Крысоморфизирован %s
actors.hero.abilities.ratmogrify$transmograt.desc=Этот враг превратился в крысу. Существенное улучшение, я бы сказал! - Крысиный Король
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Убит крысоморфизированным врагом

##Cleric Spells
actors.hero.spells.auraofprotection.name=Аура защиты
actors.hero.spells.auraofprotection.short_desc=Повышает защиту Паладина и ближайших союзников.
actors.hero.spells.auraofprotection.desc=Паладин на 20 ходов окружает себя сияющей защитной аурой. Все союзники в радиусе 2 клеток, включая самого Паладина, получают на %1$d%% меньше урона и пользуются эффектом руны его брони с усилением на +%2$d%%.\n\nСнижение урона применяется до других защитных эффектов, например брони. Усиление руны действует всегда, но аура не заставит одну и ту же руну сработать повторно у персонажа, на которого она уже действует (например, самого Паладина или его радужной копии).
actors.hero.spells.auraofprotection$aurabuff.name=Аура защиты
actors.hero.spells.auraofprotection$aurabuff.desc=Паладин испускает защитную энергию вокруг себя.\n\nЛюбой ближайший союзник (включая самого Паладина) получает уменьшенный урон и усиливающий эффект руны брони Паладина с повышенной мощностью.\n\nХодов осталось:%s.

actors.hero.spells.beamingray.name=сияющий луч
actors.hero.spells.beamingray.no_space=Не хватает места для появления вашего союзника.
actors.hero.spells.beamingray.out_of_range=Это место вне досягаемости.
actors.hero.spells.beamingray.short_desc=Телепортирует вашего союзника и наносит дополнительный урон.
actors.hero.spells.beamingray.desc=Клирик превращает силу союзника в луч света, который направляет его в нужное место. Если луч столкнется с врагом, он поместит союзника поблизости и направит его на врага.\n\nМаксимальный радиус действия луча составляет %1$d клеток, и он увеличивает бонусный урон от Силы многих до +%2$d%% на 10 ходов против ближайшего врага в пределах 4 клеток. Луч может даже телепортировать обычно неподвижных союзников, но его дальность в этом случае уменьшается вдвое.
actors.hero.spells.beamingray$beamingrayboost.name=сияющий луч
actors.hero.spells.beamingray$beamingrayboost.desc=Этот союзник недавно был телепортирован Лучами, что дает ему бонус к урону против ближайшего врага после телепортации. Сила многих также не истекает, когда этот эффект активен.\n\nОставшиеся ходы: %s.

actors.hero.spells.blessspell.name=благоcловление
actors.hero.spells.blessspell.short_desc=Благословляет и даёт щит Клирику или вдохновляет и исцеляет других.
actors.hero.spells.blessspell.desc=Клирик благословляет себя или другого видимого персонажа.\n\nНа самого Клирика заклинание действует слабее: дарует %1$d ходов благословения и %2$d единиц щита.\n\nДругой персонаж получает %3$d ходов благословения и %4$d единиц исцеления. Избыточное исцеление превращается в щит.

actors.hero.spells.bodyform.name=телесная форма
actors.hero.spells.bodyform.short_desc=Присваивает Троицу заклинанию или руне.
actors.hero.spells.bodyform.desc=Клирик выбирает зачарование или руну, которую он обнаружил в этом ходу, и накладывает на Троицу ее эффект.\n\nКогда Троица используется, клирик получает эффект выбранного зачарования или руны на %d ходов. Это временное заклинание или глиф будет работать с любым эффектом, который действует на обычное заклинание или руна.\n\nЭто заклинание заменяет любой другой эффект тела, которым в данный момент наделена Тринити.
actors.hero.spells.bodyform$bodyformbuff.name=телесная форма
actors.hero.spells.bodyform$bodyformbuff.desc=Телесная форма Троицы дарует вам эффект зачарования или руны, словно этот эффект действует на вашем оружии или броне.\n\nТелесная форма не дублирует эффекты, которыми вы уже пользуетесь.\n\nТекущий эффект: %1$s.\n\nОсталось ходов: %2$s.

actors.hero.spells.cleanse.name=очищение
actors.hero.spells.cleanse.short_desc=Снимает негативные эффекты и дарует щит.
actors.hero.spells.cleanse.desc=Клирик очищает все негативные эффекты на себе и союзниках в поле зрения. После окончания заклинания все задетые персонажи также получают %1$d ходов невосприимчивости к негативным эффектам и %2$d щита.

actors.hero.spells.clericspell.prompt=Выберите цель
actors.hero.spells.clericspell.no_target=Там нет цели.
actors.hero.spells.clericspell.invalid_target=Вы не можете выбрать это место.
actors.hero.spells.clericspell.invalid_enemy=Вы не можете выбрать этого врага.
actors.hero.spells.clericspell.charge_cost=Стоимость заряда: %d

actors.hero.spells.divinesense.name=божественное чутьё
actors.hero.spells.divinesense.short_desc=Временно получает ментальное зрение в большом радиусе.
actors.hero.spells.divinesense.desc=Клирик фокусирует свое восприятие на окружении, получая ментальное зрение радиусом %d клеток на 50 ходов. Это заклинание не требует времени на применение.
actors.hero.spells.divinesense$divinesensetracker.name=божественное чутьё
actors.hero.spells.divinesense$divinesensetracker.desc=Этот персонаж способен временно видеть других существ поблизости с помощью своего разума!\n\nХодов осталось: %s.

actors.hero.spells.divineintervention.name=божественное вмешательство
actors.hero.spells.divineintervention.short_desc=Огромный прирост щита Клирику и союзникам.
actors.hero.spells.divineintervention.desc=Клирик направляет огромное количество энергии из своего тома в себя и союзников, даруя всем %1$d единиц щита и продлевает Вознесённую Форму на %2$d ходов. Огромная защитная сила этого заклинания требует очень много зарядов тома.\n\nКак и любой другой щит, полученный от вознесённой формы, этот щит не исчезнет со временем, но моментально пропадёт, как только закончится действие формы.

actors.hero.spells.flash.name=вспышка
actors.hero.spells.flash.prompt=Выберите место
actors.hero.spells.flash.short_desc=Телепортирует на небольшое расстояние.
actors.hero.spells.flash.desc=Клирик направляет свою вознесённую форму на место неподалёку и телепортируется туда. Вспышка способна телепортировать Клирика в любое открытое место, которое в радиусе и не занято. Заклинание требует больше зарядов при применении каждый раз, когда используется в течение времени действия одной и той же формы.

actors.hero.spells.guidinglight.name=путеводный свет
actors.hero.spells.guidinglight.short_desc=Наносит магический урон на расстоянии и гарантирует попадание.
actors.hero.spells.guidinglight.desc=Клирик стреляет зарядом магической энергии, которая поражает цель, нанося 2-8 магического урона и освещая её. Следующая не обессиленная физическая атака по освещённому врагу гарантированно попадёт по нему.
actors.hero.spells.guidinglight.desc_priest=_Это заклинание сильнее, когда применяется Жрецом._ Первое применение заклинания каждые 50 ходов не расходует зарядов тома, и освещение потребляться от сияния, палочек, других персонажей и артефактов, которые напрямую воздействуют на врагов. Когда освещение действует так, оно наносит бонусный магический урон, равный уровню Жреца + 5.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=Путеводный свет
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=Жрец сможет снова применить Путеводный свет без затрат спустя 50 ходов.\n\nХодов осталось: %s.
actors.hero.spells.guidinglight$illuminated.name=Освещение
actors.hero.spells.guidinglight$illuminated.desc=Этот персонаж светится в результате попадания в него путеводного света. Хотя свечение не настолько сильное, чтобы осветить окружающее пространство, магический эффект значительно облегчит клирику нанесение ударов.
actors.hero.spells.guidinglight$illuminated.desc_priest=Жрец может дополнительно расходовать осветление с помощью сияния, заклинания палочки, удара союзника или эффектов от некоторых артефактов. При использовании осветления таким образом наносится бонусный магический урон, равный уровню Жреца + 5.
actors.hero.spells.guidinglight$illuminated.desc_generic=Другие герои по-прежнему могут использовать Освещенный, чтобы воспользоваться талантом Жгучий свет, но при этом не получат никакой точности.

actors.hero.spells.hallowedground.name=священная земля
actors.hero.spells.hallowedground.prompt=Выберите место
actors.hero.spells.hallowedground.short_desc=Исцеляет союзников, замедляет врагов и выращивает траву в зоне действия.
actors.hero.spells.hallowedground.desc=Жрец фокусирует свою божественную магию на области неподалёку, создавая область святых земель, размером %1$d на %1$d на 20 ходов.\n\nКогда применено, это заклинание исцеляет всех союзников на 15 здоровья (здоровые союзники и Жрец получают щит), ненадолго опутывает врагов и выращивает короткую траву.\n\nСвятая земля исцеляет союзников на 1 здоровье за ход (здоровые союзники и Жрец получают щит), калечит врагов, и случайно выращивает высокую траву.\n\nСвятая земля уничтожается огнём и будет выращивать примятую траву, если эффект пассивной регенерации отключён или Жрец давно не получал опыт.
actors.hero.spells.hallowedground$hallowedterrain.desc=Земля здесь священна. Святая земля замедляет врагов, лечит союзников и проращивает траву.

actors.hero.spells.holyintuition.name=интуиция святого
actors.hero.spells.holyintuition.prompt=выберите предмет
actors.hero.spells.holyintuition.cursed=Вы чувствуете недобрую магию, таящуюся в этом предмете.
actors.hero.spells.holyintuition.uncursed=Этот предмет не проклят.
actors.hero.spells.holyintuition.short_desc=Определяет, является ли предмет проклятым или нет.
actors.hero.spells.holyintuition.desc=Клирик фокусирует свои чувства на предмете и определяет, проклят ли тот, без нужды экипировать его.

actors.hero.spells.holylance.name=священное копьё
actors.hero.spells.holylance.short_desc=Наносит крупный дальнобойный магический урон.
actors.hero.spells.holylance.desc=Жрец концентрирует большое количество энергии в разрушительное метательное копьё, сделанное из света. Это копьё наносит %1$d-%2$d урона и всегда наносит максимальный урон нежити и демоническим целям.\n\nЭто заклинание очень дорогое и имеет время восстановления 30 ходов.
actors.hero.spells.holylance$lancecooldown.name=перезарядка священного копья
actors.hero.spells.holylance$lancecooldown.desc=Жрец недавно использовал Священное Копьё и должен подождать перед его следующим использованием.\n\nХодов осталось: %s.

actors.hero.spells.holyward.name=священный оберег
actors.hero.spells.holyward.glyph_name=%s света
actors.hero.spells.holyward.glyph_desc=Эта руна слегка повышает то количество урона, которое может выдержать ваша броня
actors.hero.spells.holyward.short_desc=Временно изменяет руну чтобы повысить защиту вашей брони
actors.hero.spells.holyward.desc=Клирик наполняет свою надетую броню рунами святого света, увеличивая блокировку урона этой брони на 1. Это заклинание не требует времени для использования.\n\nЭта руна действует в течение 50 ходов и на время своей длительности заменяет любую другую положительную руну на броне. Клирик в любом случае получает бонус от этого эффекта, даже если у него нет брони.
actors.hero.spells.holyward.desc_paladin=_Это заклинание становится мощнее, когда его произносит Паладин._ Дополнительное блокирование урона увеличено до 3, заклинание больше не отменяет существующие руны, а произнесение других заклинаний во время действия священного оберега увеличивает его продолжительность на 10 ходов за каждый использованный заряд.
actors.hero.spells.holyward$holyarmbuff.name=священный оберег
actors.hero.spells.holyward$holyarmbuff.desc=Клирик наполнил свою надетую броню святой энергией, временно заменив любую существующую руну и увеличив блокировку урона брони на 1 единицу.\n\nХодов осталось: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=Паладин напитал свои доспехи святой энергией, благодаря чему доспехи блокируют дополнительные 3 очка урона.\n\nНаложение других заклинаний во время активного священного оберега увеличивает его продолжительность на 10 ходов за каждый потраченный заряд.\n\nХодов осталось: %s.

actors.hero.spells.holyweapon.name=священное оружие
actors.hero.spells.holyweapon.ench_name=%s святости
actors.hero.spells.holyweapon.ench_desc=Враги, пораженные святым оружием получат дополнительный магический урон
actors.hero.spells.holyweapon.short_desc=Временно изменяет зачарование чтобы повысить урон оружия
actors.hero.spells.holyweapon.desc=Клирик зачаровывает своё надетое оружие святой энергией, заставляя его наносить дополнительный магический урон в размере 2 единиц при каждом ударе по врагу. Это заклинание не требует времени для использования.\n\nЭто зачарование действует в течение 50 ходов и на время своей длительности заменяет любое другое положительное зачарование на оружии. Этот эффект также полезен при безоружных атаках.
actors.hero.spells.holyweapon.desc_paladin=_В руках Паладина это заклинание становится сильнее._ Дополнительный магический урон возрастает до 6, а существующие зачарования оружия сохраняются. Пока действует «Святое оружие», каждое другое применённое заклинание продлевает его действие на _10 ходов за каждый потраченный заряд_.
actors.hero.spells.holyweapon$holywepbuff.name=священное оружие
actors.hero.spells.holyweapon$holywepbuff.desc=Клирик наполнил своё надетое оружие святой энергией, временно заменив любое существующее зачарование и заставив оружие наносить дополнительный магический урон в размере 2 единиц при каждом атаке.\n\nХодов осталось: %s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=Паладин наполнил свое надетое оружие святой энергией, добавляя к своим атакам 6 дополнительного магического урона.\n\nИспользование других заклинаний, пока святое оружие активно, продлит его на 10 ходов за каждый потраченный заряд.\n\nХодов осталось: %s.

actors.hero.spells.judgement.name=приговор
actors.hero.spells.judgement.short_desc=Наносит урон всем врагам, находящимся в поле зрения
actors.hero.spells.judgement.desc=Клирик ударяет кулаком по земле, вызывая извержение света, которое наносит урон всем врагам, которых он может видеть. Это наносит %1$d-%2$d урона, а также дополнительно 33%% урона за каждое заклинание, которое Клирик использовал с момента вступления в Вознесённую форму (или с последнего использования Приговора).\n\nВ данный момент Приговор нанесет %3$d-%4$d урона.

actors.hero.spells.layonhands.name=Наложение рук
actors.hero.spells.layonhands.short_desc=Мгновенно исцеляет соседнего персонажа или защищает Паладина.
actors.hero.spells.layonhands.desc=Паладин проводит священную энергию через свои ладони, исцеляя или защищая всё чего коснётся. \n\nПаладин может наложить заклинание на любого персонажа смежного с ним, чтобы излечить на %1$d, или на себя, чтобы получить %1$dщита. Излишнее лечение превращается в щит.\n\nЗаклинание используется мгновенно и может быть использовано повторно, но но не может даровать щит свыше значения равного трём использованиям.

actors.hero.spells.lifelinkspell.name=узы жизни
actors.hero.spells.lifelinkspell.short_desc=Разделяет урон между союзником и снижает получаемый им урон.
actors.hero.spells.lifelinkspell.desc=Клирик укрепляет связь между собой и союзником, получившим силу. Благодаря этой связи любой полученный урон будет делиться между героем и его союзником в течение %1$d ходов, а прибавка к защите от Силы многих будет увеличена до -%2$d%% полученного урона. Обратите внимание, что урон делится после брони, но до снижения урона от Силы многих.\n\nПока действует этот эффект, полезные заклинания клирика уровня T3 или ниже будут применяться и к клирику, и к его союзнику, если бы они применялись только к одному из них.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=оберегающие узы жизни
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=Клирик недавно наложил на этого союзника заклинание Связь с жизнью.\n\nВ дополнение к обычным преимуществам Связи жизни этот персонаж получает уменьшенный урон, все положительные заклинания клирика применяются к клирику и союзнику, а не только к одному из них, и Сила многих не истекает, пока действует этот эффект.\n\nХодов осталось: %s.

actors.hero.spells.mindform.name=ментальная форма
actors.hero.spells.mindform.short_desc=Присваивает Троицу волшебной палочке или метательному оружию.
actors.hero.spells.mindform.desc=Клирик выбирает палочку или метательное оружие, которое он нашел в этом ходу, и накладывает на него эффект Троицы.\n\nКогда Троица используется, клирик может совершить одну атаку, как если бы он использовал выбранный предмет на уровне +%d. При этом срабатывают все эффекты, которые обычно вызывает использование этого предмета.\n\nЭто заклинание заменяет любой другой эффект разума, которым в данный момент наделена Троица.

actors.hero.spells.mnemonicprayer.name=мнемоническая молитва
actors.hero.spells.mnemonicprayer.short_desc=Продлевает положительные/отрицательные эффекты на союзнике/враге и повторно применяет эффект освещения.
actors.hero.spells.mnemonicprayer.desc=Жрец произносит молитву, которая продлевает длительность всех положительных и отрицательных эффектов на определённой цели на %1$d ходов. Это заклинание не требует времени для использования. Положительные эффекты будут действовать дольше на союзников (включая самого Жреца), а отрицательные эффекты будут действовать дольше на врагов.\n\nМнемоническая Молитва может продлить конкретный положительный или отрицательный эффект только один раз и не может продлевать положительные эффекты, полученные от способностей брони.

actors.hero.spells.radiance.name=сияние
actors.hero.spells.radiance.short_desc=Освещает и кратковременно оглушает видимых врагов.
actors.hero.spells.radiance.desc=Жрец излучает священный свет, оглушая всех видимых врагов на 3 хода. Если враг уже был освещен, Сияние активирует дополнительный урон освещения и повторно накладывает отрицательный эффект освещения. Сияние также заставляет Жреца светиться в течение 100 ходов, если текущий этаж находится во тьме.

actors.hero.spells.recallinscription.name=воспоминание начертания
actors.hero.spells.recallinscription.short_desc=Повторяет эффект недавно использованного рунного камня или свитка.
actors.hero.spells.recallinscription.desc=Клирик использует святую магию, чтобы повторно наложить эффект магической руны, найденной на рунном камне или свитке, которые были использованы за последние %s ходов.\n\nВоспоминание Начертания не может быть использовано со свитками улучшений. Стоимость заряда этого заклинания варьируется в зависимости от того, какой предмет был использован недавно: 2 за рунный камень, 3 за свиток, 4 за особый свиток. Эта стоимость заряда также удваивается при использовании свитка превращения или алхимических предметов, которые были созданы с помощью превращения или улучшения.
actors.hero.spells.recallinscription$useditemtracker.name=недавно использованная руна
actors.hero.spells.recallinscription$useditemtracker.desc=Клирик недавно использовал предмет, который работает с заклинанием воспоминания начертания. Клирик может использовать заклинание, чтобы повторить эффект предмета.\n\nИспользованный предмет: %1$s.\n\nОсталось ходов: %2$s.

actors.hero.spells.shieldoflight.name=Щит света
actors.hero.spells.shieldoflight.short_desc=Дарует временную броню против цели.
actors.hero.spells.shieldoflight.desc=Клирик создает тонкую преграду света между собой и врагом, увеличивая защиту брони против этого врага на %1$d-%2$d на 5 ходов.\n\nЭто заклинание не требует времени для использования, но не может быть использовано против нескольких целей одновременно.
actors.hero.spells.shieldoflight$shieldoflighttracker.name=щит света
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=Тонкий щит света стоит между героем и врагом. Он недостаточно силен, чтобы полностью блокировать атаки, но смягчит их урон.\n\nХодов осталось: %s.

actors.hero.spells.spiritform.name=духовная форма
actors.hero.spells.spiritform.short_desc=Присваивает Троицу кольцу или артефакту.
actors.hero.spells.spiritform.desc=Клирик выбирает кольцо или артефакт, который они уже опознали в этом забеге (кроме святого тома), и наполняет Троицу этим эффектом.\n\nЕсли выбрано кольцо, то Троица дает эффект этого кольца силой + %1$d на 20 шагов.\n\nЕсли выбран артефакт, то Троица повторяет эффект этого артефакта силой +%2$d. У каждого артефакта разное поведение и цена, когда использовано Троицей.\n\nЭто заклинание повторяет любой другой эффект, которым наполнена Троица в данный момент.
actors.hero.spells.spiritform$spiritformbuff.name=духовная форма
actors.hero.spells.spiritform$spiritformbuff.desc=Святая форма Троицы прямо сейчас дает вам силу предмета, как если он сейчас надет у вас.\n\nЗапомните, что дух не может дать копию эффекта, которая у вас есть в этот момент.\n\nЭффект: %1$s\n\nХодов осталось: %2$s

actors.hero.spells.smite.name=Божественная кара
actors.hero.spells.smite.short_desc=Гарантирует попадание с бонусным уроном и силой заклинания.
actors.hero.spells.smite.desc=Паладин наделяет рукопашный удар разрушительной праведной мощью. \n\nВ дополнение к обычному рукопашный урону, атаки оружием, которым вы можете эффективно владеть, с использованием _Божественная Кары_ будут гарантированно попадать, получат +300%%к силе зачарования, а также дополнительно наносят %1$d - %2$d магического урона.\n\nДополнительный магический урон от Кары зависит от уровня Паладин и всегда наносит максимальный дополнительный магический урон по нежити или демоническим силам.

actors.hero.spells.stasis.name=стазис
actors.hero.spells.stasis.short_desc=Извлекает союзника из подземелья сохраняя его в себе.
actors.hero.spells.stasis.desc=Клирик фокусирует связь с союзником на себе, заставляя союзника временно находиться в своеобразном энергетическом стазисе внутри клирика. Союзник сохраняется до %d ходов, при этом все положительные эффекты, наложенные на него, не зависят от времени пребывания в стазисе.\n\nСоюзник появится рядом с клириком, когда стазис закончится естественным образом, или же он может мгновенно повторно сотворить заклинание без затрат, чтобы завершить эффект раньше. Стазис может перемещать даже неподвижных союзников, но не может переносить их между этажами.
actors.hero.spells.stasis$stasisbuff.name=союзник в стазисе
actors.hero.spells.stasis$stasisbuff.left_behind=Ваш неподвижный союзник остался позади.
actors.hero.spells.stasis$stasisbuff.desc=У клирика в настоящее время есть союзник, находящийся в стазисе. Все положительные эффекты на этом союзнике сохраняются, включая «Силу многих», и они снова появятся рядом с клириком, когда эффект закончится. Эффект также можно закончить раньше, повторно применив Стазис.\n\nСоюзников в стазисе: %1$s.\nХодов осталось: %2$s.

actors.hero.spells.sunray.name=солнечный луч
actors.hero.spells.sunray.short_desc=Наносит дальный магический урон и ослепляет цель один раз.
actors.hero.spells.sunray.desc=Клирик выпускает луч ослепляющего света по цели, нанося ей %1$d-%2$d урона и ослепляя на %3$d ходов. Солнечный Луч всегда наносит максимальный урон нежити и демоническим целям.\n\nПосле того как враг был поражён этим заклинанием, его зрение адаптируется, что предотвратит повторное ослепление. Однако, если враг будет поражён снова, будучи уже ослеплённым этим заклинанием, свет окажется слишком сильным и парализует его.

actors.hero.spells.walloflight.name=стена света
actors.hero.spells.walloflight.short_desc=Создает стену, которая блокирует врагов.
actors.hero.spells.walloflight.desc=Паладин создаёт прямо перед собой стену из пластин твёрдого света, которая с толщиной в 1 клетку, %1$d клеток в ширину, и существует в течение 20 ходов.\n\nЭта стена имеет те же свойства что и обычная. кроме того что она полностью прозрачна. Противники, которые оказались внутри стены на момент её создания, будут на мгновение парализованы и, если возможно, отброшены назад. Все, что застряло в стене, сможет из неё выйти. \n\nСтена может быть сотворена в любом направлении из четырёх сторон или четырёх диагоналей. Если стена уже существует, заклинание может быть использовано заново, чтобы мгновенно рассеять стену.
actors.hero.spells.walloflight.early_end=Вы рассеивайте стену света.
actors.hero.spells.walloflight$lightwall.desc=Мерцающие пластины света загораживают проход сюда.

##main hero
actors.hero.hero.name=вы
actors.hero.hero.leave=Ещё рано уходить, оставшееся подземелье ждёт впереди!
actors.hero.hero.level_up=Уровень повышен!
actors.hero.hero.new_level=Новый уровень! +Меткость, +Уклонение, +5 ОЗ!
actors.hero.hero.new_talent=+1 очко талантов!
actors.hero.hero.unspent=У вас остались нераспределённые очки талантов!
actors.hero.hero.level_cap=Вы не можете стать сильнее, но ваш опыт прибавляет вам сил!
actors.hero.hero.you_now_have=вы подобрали: %s.
actors.hero.hero.you_cant_have=Вы не можете унести: %s.
actors.hero.hero.locked_chest=Сундук закрыт, а у вас нет подходящего ключа.
actors.hero.hero.locked_door=У вас нет подходящего ключа.
actors.hero.hero.noticed_smth=Вы что-то заметили.
actors.hero.hero.wait=...
actors.hero.hero.search=поиск
actors.hero.hero.search_distracted=Вам сложно сосредоточиться, поэтому поиск занял больше времени.
actors.hero.hero.key_distracted=Вам не получается отпереть замок, поэтому придётся продолжать попытки.
actors.hero.hero.pain_resist=Боль помогает преодолеть тягу ко сну.
actors.hero.hero.revive=Анх взрывается дарующей жизнь энергией!

##classes
actors.hero.heroclass.warrior=воин
actors.hero.heroclass.warrior_desc_short=Воин выдерживает тяжёлые удары благодаря барьеру _сломанной печати_. Печать можно переносить между доспехами вместе с _одним улучшением_.
actors.hero.heroclass.warrior_desc=Воин начинает игру с _уникальной сломанной печатью_. Когда его здоровье опускается ниже половины, печать создаёт защитный барьер. Её можно переносить с одного доспеха на другой, сохраняя при этом _одно улучшение_.\n\nВ начале игры у Воина также есть _изношенный короткий меч_, _три метательных камня_, тканая броня, бурдюк и бархатный мешочек.\n\nВоин автоматически опознаёт:\n_-_ Свитки опознания\n_-_ Зелья исцеления\n_-_ Свитки ярости
actors.hero.heroclass.warrior_unlock=Воин автоматически разблокирован.

actors.hero.heroclass.mage=маг
actors.hero.heroclass.mage_desc_short=Маг - специалист по волшебным делам и носит с собой _уникальный магический посох,_ который сильнее палочек. Посох может быть наделен силой любой палочки, которую можно найти в подземелье.
actors.hero.heroclass.mage_desc=Маг начинает игру с _уникальным посохом_. Он заряжается значительно быстрее обычной палочки и вмещает на один заряд больше. В посох можно _впитать силу любой найденной палочки_.\n\nИзначально в посох Мага встроена палочка волшебной стрелы. При нём также тканая броня, бурдюк и бархатный мешочек.\n\nМаг автоматически опознаёт:\n_-_ Свитки опознания\n_-_ Зелья алхимического огня\n_-_ Свитки улучшения
actors.hero.heroclass.mage_unlock=Чтобы разблокировать Мага, _используйте свиток улучшения, чтобы сделать предмет сильнее._

actors.hero.heroclass.rogue=разбойник
actors.hero.heroclass.rogue_desc_short=Разбойник уклоняется от врагов и наносит внезапные удары благодаря _Плащу теней_. Он также _обнаруживает тайники и ловушки_ с большего расстояния.
actors.hero.heroclass.rogue_desc=Разбойник начинает игру с _уникальным Плащом теней_, который позволяет становиться невидимым по желанию.\n\nРазбойник _обнаруживает тайники и ловушки_ с большего расстояния.\n\nВ начале игры у него также есть _кинжал_, _три метательных ножа_, тканая броня, бурдюк и бархатный мешочек.\n\nРазбойник автоматически опознаёт:\n_-_ Свитки опознания\n_-_ Зелья невидимости\n_-_ Свитки магической карты
actors.hero.heroclass.rogue_unlock=Чтобы разблокировать Разбойника, _совершите 10 неожиданных атак в одном забеге._

actors.hero.heroclass.huntress=охотница
actors.hero.heroclass.huntress_desc_short=Охотница - эксперт дальнего боя, а также владеет своим _уникальным магическим луком_ с бесконечными стрелами. Она также может ходить в высокой траве, _не вытаптывая её._
actors.hero.heroclass.huntress_desc=Охотница начинает игру с _уникальным луком духов_, который создаёт бесконечный запас магических стрел.\n\nОхотница может проходить сквозь высокую траву, _не примяв её_.\n\nВ начале игры у неё также есть _шипованные перчатки_, тканая броня, бурдюк и бархатный мешочек.\n\nОхотница автоматически опознаёт:\n_-_ Свитки опознания\n_-_ Зелья ментального зрения\n_-_ Свитки колыбельной
actors.hero.heroclass.huntress_unlock=Чтобы разблокировать Охотницу, _ударьте 10 раз по противникам с помощью метательного оружия._

actors.hero.heroclass.duelist=дуэлянт
actors.hero.heroclass.duelist_desc_short=Дуэлянт — мастер оружий. Она может использовать _особую способность_ своего оружия, _уникальную для каждого его вида_.
actors.hero.heroclass.duelist_desc=Дуэлянт начинает игру с _уникальной шпагой_, обладающей особым приёмом. Этот приём со временем перезаряжается.\n\nУ каждого вида оружия есть _свой особый приём_, которым Дуэлянт может воспользоваться.\n\nВ начале игры у Дуэлянта также есть _два метательных шипа_, тканая броня, бурдюк и бархатный мешочек.\n\nДуэлянт автоматически опознаёт:\n_-_ Свитки опознания\n_-_ Зелья силы\n_-_ Свитки зеркальных копий
actors.hero.heroclass.duelist_unlock=Чтобы разблокировать Дуэлянта, _экипируйте оружие с редкостью 2-го уровня или выше без штрафа за нехватку силы._

actors.hero.heroclass.cleric=клирик
actors.hero.heroclass.cleric_desc_short=Клирик — божественный маг, который использует свой уникальный _Священный Том_ для направления божественной магии. Он может _изучать и улучшать заклинания_ с помощью талантов.
actors.hero.heroclass.cleric_desc=Клирик начинает игру с _уникальным священным томом_, позволяющим творить различные заклинания.\n\nБольшинство талантов Клирика посвящено изучению и усилению заклинаний.\n\nВ начале игры у Клирика также есть _палица_, тканая броня, бурдюк и бархатный мешочек.\n\nКлирик автоматически опознаёт:\n_-_ Свитки опознания\n_-_ Зелья очищения\n_-_ Свитки рассеяния проклятия
actors.hero.heroclass.cleric_unlock=Чтобы разблокировать Клирика, _полностью очистите проклятие с любого проклятого предмета снаряжения._

actors.hero.herosubclass.berserker=берсерк
actors.hero.herosubclass.berserker_short_desc=_Берсерк_ накапливает ярость, когда получает урон. Ярость увеличивает наносимый им урон и при 100% может быть активирована для получения дополнительного щита.
actors.hero.herosubclass.berserker_desc=Берсерк погружается в ярость, когда он получает физический урон, включая урон, который блокируется его броней! Ярость постепенно угасает с течением времени, но она угасает медленнее, если у него мало ОЗ.\n\nВ зависимости от уровня ярости Берсерк наносит до 50% дополнительного урона. При максимальной ярости Берсерк также может впасть в неистовство, получая всплеск защиты и удерживая ярость, пока у него остается щит. Защита растёт с уровнем брони Берсерка, и сильно поднимается, если у него мало ОЗ. Берсерку нужно время, чтобы прийти в себя после того, как он впал в неистовство.
actors.hero.herosubclass.gladiator=гладиатор
actors.hero.herosubclass.gladiator_short_desc=Успешные атаки в ближнем бою позволяют _Гладиатору_ начать комбо, которое откроет доступ к особым завершающим ударам.
actors.hero.herosubclass.gladiator_desc=Гладиатор получает одно очко комбо каждый раз, когда он совершает успешную атаку с помощью оружия ближнего боя или метательного оружия. Если Гладиатор не проводит успешную атаку в течение 5 ходов (15 ходов после убийства), его комбо сбрасывается.\n\nПо мере накопления им комбо Гладиатор открывает различные приёмы, которые гарантировано попадают в цель:\n2 очка: оттолкнуть противника, сохраняет комбо\n4 очка: нанести урон, зависящий от брони Гладиатора\n6 очков: парировать следующую атаку, сохраняет комбо\n8 очков: нанести урон цели и ближайшим противникам\n10 очков: атаковать столько раз, сколько накоплено очков комбо
actors.hero.herosubclass.battlemage=боевой маг
actors.hero.herosubclass.battlemage_short_desc=_Боевой маг_ получает бонусные эффекты, когда сражается в ближнем бою со своим посохом. Эти эффекты зависят от палочки, которой наделён его посох.
actors.hero.herosubclass.battlemage_desc=Каждый удар посохом в ближнем бою вызывает у Боевого мага дополнительный эффект, словно посох обладает ещё одним зачарованием. Эффект зависит от палочки, чья сила заключена в посохе: у каждой палочки он свой. Кроме того, каждый успешный удар посохом восстанавливает 0,5 заряда.
actors.hero.herosubclass.warlock=чернокнижник
actors.hero.herosubclass.warlock_short_desc=У _Чернокнижника_ есть шанс пометить врагов меткой души с помощью своих палочек. Он исцеляется всякий раз, когда наносит физический урон помеченным врагам.
actors.hero.herosubclass.warlock_desc=У Чернокнижника есть шанс пометить меткой души персонажей на которых он использует свои палочки. Шанс применить метку души и ее продолжительность увеличиваются с уровнем палочки.\n\nКогда враг помечен меткой души, Чернокнижник исцеляет 2 ОЗ за каждые 5 урона, которые он наносит им, но только при атаках из оружия ближнего боя или метательного оружия, а не из палочек!
actors.hero.herosubclass.assassin=убийца
actors.hero.herosubclass.assassin_short_desc=_Убийца_ может подготовить смертоносный удар, пока он невидим. Чем дольше он ждет, тем мощнее будет атака.
actors.hero.herosubclass.assassin_desc=Убийца готовит свой следующий удар, когда становится невидимым. Чем дольше он готовится, тем мощнее будет его следующая атака. Подготовка длится до 9 ходов.\n\nПосле подготовки Убийца наносит дополнительный урон при следующей атаке, может подскочить к своей цели и даже может мгновенно убивать врагов, которые достаточно слабы.
actors.hero.herosubclass.freerunner=бродяга
actors.hero.herosubclass.freerunner_short_desc=_Бродяга_ накапливает импульс во время передвижения, который можно использовать для бега. Это дает ему бонусную скорость и уклонение на короткое время.
actors.hero.herosubclass.freerunner_desc=Двигаясь, Бродяга накапливает импульс. За 10 ходов непрерывного движения он может набрать до 10 очков импульса, но быстро теряет их, если остановится. Он может потратить импульс, чтобы перейти на стремительный бег: каждое очко даёт _2 хода_ такого бега.\n\nВо время стремительного бега Бродяга передвигается _вдвое быстрее_ и получает бонус к уклонению, зависящий от уровня героя. После окончания бега проходит некоторое время, прежде чем импульс снова начнёт накапливаться.
actors.hero.herosubclass.sniper=снайпер
actors.hero.herosubclass.sniper_short_desc=_Снайпер_ может пробить броню своими дальнобойными атаками. После удара метательным оружием она может применить специальную атаку с помощью своего лука.
actors.hero.herosubclass.sniper_desc=Снайпер - это мастер дальнего боя, чьи дальние атаки пробивают вражескую броню. Когда она попадает во врага метательным оружием, она ставит на них метку снайпера, которая позволяет ей активировать специальную атаку с помощью своего лука. Эта особая атака варьируется в зависимости от того, как сбалансирован её лук.\n\nНесбалансированный лук выстрелит одной стрелой, которая наносит сниженный урон, но выстреливает мгновенно. Лук, сбалансированный на скорость, выпустит залп из трех стрел, которые наносят меньший урон, но могут активировать зачарования и тратит 1 ход для выстрела. Лук, сбалансированный на урон, выстрелит снайперским выстрелом, который гарантированно попадает, наносит бонусный урон в зависимости от расстояния и требует 2 хода для выстрела.
actors.hero.herosubclass.warden=хранительница
actors.hero.herosubclass.warden_short_desc=_Хранительница_ может видеть сквозь высокую траву и получает бонусные эффекты, когда она сажает семена и топчет растения.
actors.hero.herosubclass.warden_desc=Хранительница имеет сильную связь с природой, которая даёт ей множество бонусных эффектов, связанных с травой и растениями. Она способна видеть сквозь высокую и примятую траву, как если бы это было пустое пространство.\n\nХранительница заставляет траву прорастать вокруг любого семени, которое она бросает или сажает, и получает специальные эффекты, когда вытаптывает растения. Эти специальные эффекты заменяют обычные эффекты растений, а это означает, что ни одно растение не причинит ей вреда, если она наступит на него.
actors.hero.herosubclass.champion=чемпион
actors.hero.herosubclass.champion_short_desc=_Чемпион_ может использовать сразу два оружия и накапливать заряды способностей. Для обычных ударов будет использовано основное оружие, но она может использовать способность каждого или сменить оружия в любой момент.
actors.hero.herosubclass.champion_desc=Чемпион — мастер оружия ближнего боя. Она может носить дополнительное оружие наряду с основным. Обычные атаки выполняются основным оружием, но Чемпион может мгновенно менять их местами и использовать способности любого из двух.\n\nКроме того, запас зарядов способностей оружия увеличивается на 2, а скорость их восстановления — на 50%.
actors.hero.herosubclass.monk=монах
actors.hero.herosubclass.monk_short_desc=_Монах_ копит энергию во время боя. Эта энергия может быть потрачена на множество уникальных способностей.
actors.hero.herosubclass.monk_desc=Монах в совершенстве владеет боевыми приёмами. Побеждая врагов, она накапливает энергию для защитных и вспомогательных способностей. Энергия не рассеивается со временем, но её максимальный запас зависит от уровня Монаха.\n\n1 энергия — быстрый удар кулаками\n2 энергии — сосредоточиться и уклониться от следующей атаки\n3 энергии — мгновенный рывок на небольшое расстояние\n4 энергии — отбросить врага ударом ноги\n5 энергии — медитация: снять отрицательные эффекты и восстановить заряды палочек и артефактов
actors.hero.herosubclass.priest=жрец
actors.hero.herosubclass.priest_short_desc=_Жрец_ получает новые дальнобойные заклинания и усиленную версию Путеводного света.
actors.hero.herosubclass.priest_desc=Жрец получает различные новые и улучшенные заклинания, которые сосредоточены на дальнем бою и синергии с магическими предметами.\n\nЖрец может бесплатно использовать _Путеводный свет_ раз в 50 ходов, освещать врагов, на которых направлено любое из его заклинаний, и поглощать негативное освещение с помощью союзников, палочек и некоторых артефактов для дополнительного урона равного его уровню + 5.\n\nКроме того, он получает заклинание _Сияние_, которое развеивает тьму и воздействует на всех видимых противников, активируя и нанося освещение, и на короткое время оглушая их за счет 2 зарядов.
actors.hero.herosubclass.paladin=паладин
actors.hero.herosubclass.paladin_short_desc=_Паладин_ получает новые заклинания ближнего действия и усиленные версии священного оружия и оберега.
actors.hero.herosubclass.paladin_desc=Паладин имеет разнообразие новых заклинаний, которые улучшают его способности в ближнем бою и имеют синергию с его оружием и бронёй. \n\nЗаклинания _Священное оружие_ и _Священный оберег_ дают больше бонусов для Паладина, больше не замещают уже существующие чары и руны, а также продлевают своё действие при сотворении других заклинаний. \n\nПаладин также имеет заклинание _Божественная Кара_, которое позволяет ему увеличивать мощность чар и с большим уроном гарантированно попадать по противнику.

##talents
actors.hero.talent$provokedangertracker.name=провокация
actors.hero.talent$provokedangertracker.desc=Воин недавно лишился своего щита, следующая физическая атака нанесет дополнительный урон.\n\nХодов до окончания эффекта: %s.
actors.hero.talent$lingeringmagictracker.name=подспудная магия
actors.hero.talent$lingeringmagictracker.desc=Маг недавно использовал палочку или посох, поэтому его следующая физическая атака нанесет дополнительный урон.\n\nХодов до окончания эффекта: %s.
actors.hero.talent$followupstriketracker.name=добивающий удар
actors.hero.talent$followupstriketracker.desc=Охотница только что атаковала врага метательным оружием, поэтому урон следующей физической атаки против той же цели повышен.\n\nХодов осталось: %s.
actors.hero.talent$patientstriketracker.name=выжидающий удар
actors.hero.talent$patientstriketracker.desc=Дуэлянт выждала один ход, поэтому следующая физическая атака нанесёт больше урона.
actors.hero.talent$improvisedprojectilecooldown.name=перезарядка импровизированных снарядов
actors.hero.talent$improvisedprojectilecooldown.desc=Вы недавно использовали этот талант и должны подождать, прежде чем использовать его снова.\n\nХодов осталось: %s.
actors.hero.talent$rejuvenatingstepscooldown.name=перезарядка восстанавливающих шагов
actors.hero.talent$rejuvenatingstepscooldown.desc=Вы недавно использовали этот талант и должны подождать, прежде чем использовать его снова.\n\nХодов осталось: %s.
actors.hero.talent$seershotcooldown.name=перезарядка всевидящего выстрела
actors.hero.talent$seershotcooldown.desc=Вы недавно использовали этот талант и должны подождать, прежде чем использовать его снова.\n\nХодов осталось: %s.
actors.hero.talent$aggressivebarriercooldown.name=перезарядка отчаянного барьера
actors.hero.talent$aggressivebarriercooldown.desc=Вы недавно использовали этот талант и должны подождать, прежде чем использовать его снова.\n\nХодов осталось: %s.
actors.hero.talent$liquidagilacctracker.name=жидкая гибкость
actors.hero.talent$liquidagilacctracker.desc=Следующая обычная атака Дуэлянта получит бонус к точности.\n\nХодов осталось: %s.
actors.hero.talent$lethalhastecooldown.name=перезарядка смертельной спешки
actors.hero.talent$lethalhastecooldown.desc=Вы недавно использовали этот талант и должны подождать, прежде чем использовать его снова.\n\nХодов осталось: %s.
actors.hero.talent$swiftequipcooldown.name=перезарядка быстрой экипировки
actors.hero.talent$swiftequipcooldown.desc=Вы недавно использовали этот талант и должны подождать, прежде чем использовать его снова.\n\nХодов осталось: %s.
actors.hero.talent$preciseassaulttracker.name=расчётливое нападение
actors.hero.talent$preciseassaulttracker.desc=Следующая обычная атака Дуэлянта получит бонус к точности.\n\nХодов осталось: %s.
actors.hero.talent$deadlyfollowuptracker.name=смертельное добивание
actors.hero.talent$deadlyfollowuptracker.desc=Дуэлянт только что атаковала метательным оружием, поэтому урон от физических атак по той же цели повышен.\n\nХодов осталось: %s.
actors.hero.talent$combinedlethalityabilitytracker.executed=добит
actors.hero.talent$satiatedspellstracker.name=Щитовое Заклинание
actors.hero.talent$satiatedspellstracker.desc=Следующее заклинание, которое Клирик использует, дарует ему небольшое количество защиты.
actors.hero.talent$searinglightcooldown.name=слепящий свет
actors.hero.talent$searinglightcooldown.desc=Вы недавно использовали этот талант и должны подождать, прежде чем использовать его снова.\n\nХодов осталось: %s.

#warrior
actors.hero.talent.hearty_meal.title=ешь на здоровье
actors.hero.talent.hearty_meal.desc=_+1:_ Если здоровье Воина не превышает 33%, еда восстанавливает _15% максимального запаса здоровья_ (не менее 4 ОЗ).\n\n_+2:_ Восстанавливает _20% максимального запаса здоровья_ (не менее 6 ОЗ).\n\n_+3:_ Восстанавливает _25% максимального запаса здоровья_ (не менее 8 ОЗ).
actors.hero.talent.veterans_intuition.title=интуиция ветерана
actors.hero.talent.veterans_intuition.desc=_+1:_ Воин опознаёт оружие _в 1,75 раза быстрее_, а броню — _в 2,5 раза быстрее_.\n\n_+2:_ Воин опознаёт оружие _в 2,5 раза быстрее_, а броню — _при надевании_.\n\n_+3:_ Воин опознаёт броню _при надевании_, а оружие — _при экипировке_.
actors.hero.talent.provoked_anger.title=провокатор
actors.hero.talent.provoked_anger.desc=_+1:_ Когда урон разрушает щит Воина, его следующая физическая атака наносит _3 дополнительного урона плюс 1 за каждые 6 уровней героя_.\n\n_+2:_ Бонус составляет _5 урона плюс 2 за каждые 6 уровней_.\n\n_+3:_ Бонус составляет _7 урона плюс 3 за каждые 6 уровней_.
actors.hero.talent.iron_will.title=Стальная воля
actors.hero.talent.iron_will.desc=_+1:_ Щит, создаваемый печатью Воина, усиливается на _3% его максимального здоровья_ (не менее чем на 1).\n\n_+2:_ Усиливается на _6% максимального здоровья_ (не менее чем на 2).\n\n_+3:_ Усиливается на _9% максимального здоровья_ (не менее чем на 3).
actors.hero.talent.iron_will.meta_desc=_Если этот талант получен другим героем_, вместо этого он пассивно даёт вариант эффекта печати Воина в 1 или 2 щита.

actors.hero.talent.iron_stomach.title=Железный желудок
actors.hero.talent.iron_stomach.desc=_+1:_ Воин тратит на еду 1 ход и получает _75% сопротивления урону_ на время приёма пищи.\n\n_+2:_ Сопротивление возрастает до _100%_.\n\n_+3:_ Воин получает _100% сопротивления урону_ во время еды _и на следующий ход_.
actors.hero.talent.liquid_willpower.title=жидкая сила воли
actors.hero.talent.liquid_willpower.desc=_+1:_ Выпив или бросив зелье, отвар либо эликсир, Воин получает щит прочностью _6,5% максимального здоровья_.\n\n_+2:_ Прочность щита составляет _10% максимального здоровья_.\n\n_+3:_ Прочность щита составляет _13,5% максимального здоровья_.\n\nПри использовании зелий силы и опыта либо алхимических предметов, изготовленных из них, прочность щита удваивается.\n\nДля алхимических предметов, создаваемых сразу в нескольких экземплярах (например, водного отвара), вероятность срабатывания зависит от количества получаемых предметов.
actors.hero.talent.runic_transference.title=Перенос рун
actors.hero.talent.runic_transference.desc=_+1:_ Сломанная печать Воина позволяет переносить _обычные руны_ вместе с улучшением брони.\n\n_+2:_ Можно переносить _обычные, мощные и проклятые руны_.\n\n_+3:_ Можно переносить _любые руны_, причём _на прежней броне руна тоже сохраняется_.\n\nПереносить можно только руны, нанесённые на броню после закрепления печати.
actors.hero.talent.runic_transference.meta_desc=_Если этот талант получен другим героем_, он увеличит сопротивление рун к стиранию Свитками Улучшения. При улучшении руны могут быть стерты с 6 уровня (вместо 4) при +1 или с 7 уровня (вместо 4) при +2. Начиная с 8 уровня руна гарантированно сотрётся при улучшении предмета.
actors.hero.talent.lethal_momentum.title=Смертельный импульс
actors.hero.talent.lethal_momentum.desc=_+1:_ С вероятностью _67%_ смертельный удар Воина физическим оружием не тратит ход.\n\n_+2:_ Такой удар _всегда_ не тратит ход.\n\n_+3:_ Смертельный удар не тратит ход и даёт _2 хода адреналина_.
actors.hero.talent.improvised_projectiles.title=Импровизированные снаряды
actors.hero.talent.improvised_projectiles.desc=_+1:_ Воин может ослепить врага на _2 хода_, бросив в него любой предмет, кроме метательного оружия. Перезарядка способности — _50 ходов_.\n\n_+2:_ Ослепление длится _3 хода_, перезарядка — 50 ходов.\n\n_+3:_ Ослепление длится _4 хода_, перезарядка сокращается до _30 ходов_.

actors.hero.talent.hold_fast.title=Защитная стойка
actors.hero.talent.hold_fast.desc=_+1:_ Если Воин с надетой печатью пропускает ход, он получает дополнительную защиту в размере _5–10% от максимального блока брони_ (не менее 1–2), а уменьшение комбо и щита замедляется на _50%_, пока он не сдвинется с места.\n\n_+2:_ Защита составляет _10–20% от максимального блока брони_ (не менее 2–4), замедление — _75%_.\n\n_+3:_ Защита составляет _15–30% от максимального блока брони_ (не менее 3–6), а уменьшение комбо и щита _полностью останавливается_ до движения.
actors.hero.talent.hold_fast.meta_desc=_Если этот талант получен другим героем_, вместо этого печать воина не требуется, но он дает броню не больше, чем превышающий уровень редкости вашей экипированной брони и уровень самого таланта.
actors.hero.talent.strongman.title=Силач
actors.hero.talent.strongman.desc=_+1:_ Сила Воина_ увеличивается на 8%_, и округляется в меньшую сторону.\n\n_+2:_ Сила Воина_ увеличивается на 13%_, и округляется в меньшую сторону.\n\n_+3:_ Сила Воина_ увеличивается на 18%_, и округляется в меньшую сторону.

actors.hero.talent.endless_rage.title=бесконечная ярость
actors.hero.talent.endless_rage.desc=_+1:_ Берсерк может достигнуть максимум _116% ярости_.\n\n_+2:_ Берсерк может достигнуть максимум _133% ярости_.\n\n_+3:_ Берсерк может достигнуть максимум _150% ярости_.\n\nКаждое очко ярости выше 100% увеличивает щит Берсерка на 1% и снижает время на перезарядку на 1%, но не повышает дополнительный урон выше +50%.
actors.hero.talent.deathless_fury.title=бессмертная ярость
actors.hero.talent.deathless_fury.desc=_+1:_ Неистовство включается автоматически, когда Берсерк вот-вот погибнет, а ярость находится на уровне 100% или больше, но перезарядка составляет _3 уровня героя_, когда это происходит.\n\n_+2:_ Неистовство включается автоматически, когда Берсерк вот-вот погибнет, а ярость находится на уровне 100% или больше, но перезарядка составляет _2 уровня героя_, когда это происходит.\n\n_+3:_ Неистовство включается автоматически, когда Берсерк вот-вот погибнет, а ярость находится на уровне 100% или больше, но перезарядка составляет _1 уровень героя_, когда это происходит.\n\nОбратите внимание, что Берсерк все равно погибнет, если в конце неистовства у него будет 0 ОЗ.
actors.hero.talent.enraged_catalyst.title=катализатор ярости
actors.hero.talent.enraged_catalyst.desc=_+1:_ Зачарования и проклятия на оружии Берсерка активируются тем чаще, чем больше его ярость, вплоть до _15%_ при 100% ярости.\n\n_+2:_ Зачарования и проклятия на оружии Берсерка активируются тем чаще, чем больше его ярость, вплоть до _30%_ при 100% ярости.\n\n_+3:_ Зачарования и проклятия на оружии Берсерка активируются тем чаще, чем больше его ярость, вплоть до _45%_ при 100% ярости.

actors.hero.talent.cleave.title=Рассечение
actors.hero.talent.cleave.desc=_+1:_ После убийства врага Гладиатор получает _30 ходов_ на продолжение комбо вместо 15.\n\n_+2:_ Это время увеличивается до _45 ходов_ вместо 15.\n\n_+3:_ Это время увеличивается до _60 ходов_ вместо 15.
actors.hero.talent.lethal_defense.title=Летальная защита
actors.hero.talent.lethal_defense.desc=_+1:_ Когда Гладиатор убивает врага комбо-приёмом, перезарядка щита сломанной печати _уменьшается на 50 ходов_.\n\n_+2:_ Когда Гладиатор убивает врага комбо-приёмом, перезарядка щита сломанной печати _уменьшается на 100 ходов_.\n\n_+3:_ Когда Гладиатор убивает врага комбо-приёмом, перезарядка щита сломанной печати _уменьшается на 150 ходов_.\n\nЭтот талант может уменьшить перезарядку щита вплоть до -150 ходов, что означает, что он будет готов вновь сразу после активации.
actors.hero.talent.enhanced_combo.title=Улучшенное комбо
actors.hero.talent.enhanced_combo.desc=_+1:_ Когда комбо Гладиатора 7 или выше, увеличивает расстояние отталкивания Тарана на 3, Таран накладывает головокружение и может столкнуть врага в яму.\n\n_+2:_ Вдобавок к бонусам от +1. когда комбо Гладиатора 9 и выше, Парирование работает на нескольких атаках.\n\n_+3:_ Вдобавок к бонусам от +1 и +2, Гладиатор может прыгать на расстояние вплоть до комбо/3, когда использует Натиск, Обрушение, или Неистовство.

actors.hero.talent.body_slam.title=твёрдая посадка
actors.hero.talent.body_slam.desc=_+1:_ Приземлившись после прыжка, Воин наносит всем соседним врагам _1–4 урона за каждые 25 единиц максимального урона своего оружия_ (не менее 1–4) _плюс 25% силы блока_.\n\n_+2:_ Наносит _2–8 урона за каждые 25 единиц максимального урона оружия_ (не менее 2–8) _плюс 50% силы блока_.\n\n_+3:_ Наносит _3–12 урона за каждые 25 единиц максимального урона оружия_ (не менее 3–12) _плюс 75% силы блока_.\n\n_+4:_ Наносит _4–16 урона за каждые 25 единиц максимального урона оружия_ (не менее 4–16) _плюс 100% силы блока_.
actors.hero.talent.impact_wave.title=ударная волна
actors.hero.talent.impact_wave.desc=_+1:_ Когда Воин приземляется после прыжка, все соседние враги отбрасываются на _2 клетки_ назад и имеют _25% шанс_ получить уязвимость на 5 хода.\n\n_+2:_ Когда Воин приземляется после прыжка, все соседние враги отбрасываются на _3 клетки_ назад и имеют _50% шанс_ получить уязвимость на 5 хода.\n\n_+3:_ Когда Воин приземляется после прыжка, все соседние враги отбрасываются на _4 клетки_ назад и имеют _75% шанс_ получить уязвимость на 5 хода.\n\n_+4:_ Когда Воин приземляется после прыжка, все соседние враги отбрасываются на _5 клеток_ назад и имеют _100% шанс_ получить уязвимость на 5 хода.
actors.hero.talent.double_jump.title=двойной прыжок
actors.hero.talent.double_jump.desc=_+1:_ Если Воин выполняет второй прыжок в течение 3 ходов после первого, стоимость этого прыжка _снижается на 16%_.\n\n_+2:_ Если Воин выполняет второй прыжок в течение 3 ходов после первого, стоимость этого прыжка _снижается на 30%_.\n\n_+3:_ Если Воин выполняет второй прыжок в течение 3 ходов после первого, стоимость этого прыжка _снижается на 40%_.\n\n_+4:_ Если Воин выполняет второй прыжок в течение 3 ходов после первого, стоимость этого прыжка _снижается на 50%_.

actors.hero.talent.expanding_wave.title=увеличивающаяся волна
actors.hero.talent.expanding_wave.desc=_+1:_ Диапазон ударной волны увеличен до _6 клеток_ с 5, а её ширина увеличена до _75 градусов_ с 60.\n\n_+2:_ Диапазон ударной волны увеличен до _7 клеток_ с 5, а её ширина увеличена до _90 градусов_ с 60.\n\n_+3:_ Диапазон ударной волны увеличен до _8 клеток_ с 5, а её ширина увеличена до _105 градусов_ с 60.\n\n_+4:_ Диапазон ударной волны увеличен до _9 клеток_ с 5, а её ширина увеличена до _120 градусов_ с 60.
actors.hero.talent.striking_wave.title=ударная волна
actors.hero.talent.striking_wave.desc=_+1:_ Ударная волна с вероятностью _30%_ вызывает эффекты попадания, в том числе зачарования и увеличение комбо.\n\n_+2:_ Вероятность срабатывания — _60%_.\n\n_+3:_ Вероятность срабатывания — _90%_.\n\n_+4:_ Эффекты попадания срабатывают _всегда_, а сила зачарований увеличивается на _20%_.
actors.hero.talent.shock_force.title=ударная сила
actors.hero.talent.shock_force.desc=_+1:_ Ударная волна наносит _на 20% больше_ урона и имеет _шанс 25%_ оглушить, а не наложить хромоту.\n\n_+2:_ Ударная волна наносит _на 40% больше_ урона и имеет _шанс 50%_ оглушить, а не наложить хромоту.\n\n_+3:_ Ударная волна наносит _на 60% больше_ урона и имеет _шанс 75%_ оглушить, а не наложить хромоту.\n\n_+4:_ Ударная волна наносит _на 80% больше_ урона и имеет _шанс 100%_ оглушить, а не наложить хромоту.

actors.hero.talent.sustained_retribution.title=устойчивое возмездие
actors.hero.talent.sustained_retribution.desc=_+1:_ Воин наносит _115% бонусного урона_ распределенного между _2 ударами_, вместо 100% за 1 удар.\n\n_+2:_ Воин наносит _130% бонусного урона_ распределенного между _3 ударами_, вместо 100% за 1 удар.\n\n_+3:_ Воин наносит _145% бонусного урона_ распределенного между _4 ударами_, вместо 100% за 1 удар.\n\n_+4:_ Воин наносит _160% бонусного урона_ распределенного между _5 ударов_, вместо 100% за 1 удар.
actors.hero.talent.shrug_it_off.title=не обращая внимания
actors.hero.talent.shrug_it_off.desc=_+1:_ Сопротивление урону Воина во время выжидания _увеличивается до 60%_, вместо 50%.\n\n_+2:_ Сопротивление урону Воина во время выжидания _увеличивается до 68%_, вместо 50%.\n\n_+3:_ Сопротивление урону Воина во время выжидания _увеличивается до 74%_, вместо 50%.\n\n_+4:_ Сопротивление урону Воина во время выжидания _увеличивается до 80%_, вместо 50%.
actors.hero.talent.even_the_odds.title=уравнение шансов
actors.hero.talent.even_the_odds.desc=_+1:_ Воин наносит дополнительные _5% бонусного урона_ за каждого врага в пределах 2 клеток по окончании выжидания.\n\n_+2:_ Воин наносит дополнительные _10% бонусного урона_ за каждого врага в пределах 2 клеток по окончании выжидания.\n\n_+3:_ Воин наносит дополнительные _15% бонусного урона_ за каждого врага в пределах 2 клеток по окончании выжидания.\n\n_+4:_ Воин наносит дополнительные _20% бонусного урона_ за каждого врага в пределах 2 клеток по окончании выжидания.

#mage
actors.hero.talent.empowering_meal.title=Тонизирующий обед
actors.hero.talent.empowering_meal.desc=_+1:_ После еды следующие _3 попадания_ Мага волшебной палочкой наносят _2 дополнительного урона плюс 1 за каждые 10 уровней героя_.\n\n_+2:_ Бонус составляет _3 урона плюс 2 за каждые 10 уровней_.\n\n_+3:_ Бонус составляет _4 урона плюс 3 за каждые 10 уровней_.
actors.hero.talent.scholars_intuition.title=Интуиция знатока
actors.hero.talent.scholars_intuition.desc=_+1:_ Маг опознаёт волшебные палочки _в 3 раза быстрее_.\n\n_+2:_ Маг опознаёт палочки _при использовании_.\n\n_+3:_ Маг опознаёт палочки _сразу при подборе_.
actors.hero.talent.lingering_magic.title=подспудная магия
actors.hero.talent.lingering_magic.desc=_+1:_ После разряда палочки или посоха следующая физическая атака Мага наносит _1–2 дополнительного урона плюс 1 за каждые 10 уровней героя_.\n\n_+2:_ Бонус составляет _2 урона плюс 2 за каждые 10 уровней_.\n\n_+3:_ Бонус составляет _3 урона плюс 3 за каждые 10 уровней_.
actors.hero.talent.backup_barrier.title=Резервный барьер
actors.hero.talent.backup_barrier.desc=_+1:_ Потратив последний заряд посоха, Маг получает _3 единицы щита плюс 1 за каждые 25 ОЗ максимального здоровья_.\n\n_+2:_ Получает _5 единиц щита плюс 2 за каждые 25 ОЗ_.\n\n_+3:_ Получает _7 единиц щита плюс 3 за каждые 25 ОЗ_.
actors.hero.talent.backup_barrier.meta_desc=_Если этот талант получен другим героем_, вместо этого он сработает от палочки самого высокого уровня героя.

actors.hero.talent.energizing_meal.title=Возбуждающий обед
actors.hero.talent.energizing_meal.desc=_+1:_ Маг тратит на еду 1 ход и получает _5 ходов ускоренной перезарядки палочек_.\n\n_+2:_ Получает _8 ходов ускоренной перезарядки_.\n\n_+3:_ Получает _11 ходов ускоренной перезарядки_.
actors.hero.talent.inscribed_power.title=начертанная сила
actors.hero.talent.inscribed_power.desc=_+1:_ После чтения свитка или применения предмета-заклинания следующие _2 разряда_ палочек Мага усиливаются на _2 уровня плюс 1 за каждые 5 уровней палочки_.\n\n_+2:_ Усиливаются следующие _3 разряда_ на ту же величину.\n\n_+3:_ Усиливаются следующие _4 разряда_ на ту же величину.\n\nКоличество усиленных разрядов удваивается после использования свитка улучшения, свитка превращения или алхимических предметов, изготовленных из этих свитков.\n\nДля алхимических предметов, создаваемых сразу в нескольких экземплярах (например, большинства заклинаний), вероятность срабатывания зависит от числа получаемых предметов.
actors.hero.talent.wand_preservation.title=Сохранение палочки
actors.hero.talent.wand_preservation.desc=_+1:_ Когда Маг вплетает новую палочку в посох, прежняя возвращается с уровнем улучшения +0, _но только один раз_.\n\n_+2:_ Прежняя палочка возвращается с уровнем улучшения +0; эффект можно использовать повторно после _повышения уровня героя на 1_.\n\n_+3:_ Прежняя палочка возвращается с уровнем улучшения +0 _при каждом вплетении_, без ограничений.
actors.hero.talent.wand_preservation.meta_desc=_Если этот талант получен другим героем_, вместо этого он увеличит количество магической смолы, получаемой из каждой палочки в алхимическом котле, на 1 при уровне таланта +1 или на 2 при +2.
actors.hero.talent.arcane_vision.title=Магическое зрение
actors.hero.talent.arcane_vision.desc=_+1:_ Попав по врагу разрядом палочки, Маг получает возможность видеть его ментальным зрением на _10 ходов_.\n\n_+2:_ Эффект длится _15 ходов_.\n\n_+3:_ Эффект длится _20 ходов_.
actors.hero.talent.shield_battery.title=Защитная батарея
actors.hero.talent.shield_battery.desc=_+1:_ Маг может направить палочку на себя и превратить все её заряды в щит: _4% максимального здоровья за каждый заряд_.\n\n_+2:_ Получает _6% максимального здоровья за заряд_.\n\n_+3:_ Получает _8% максимального здоровья за заряд_.

actors.hero.talent.desperate_power.title=отчаянная сила
actors.hero.talent.desperate_power.desc=_+1:_ Когда у палочки или посоха Мага остаётся последний заряд, его разряд получает _+1 уровень и ещё +1 за каждые 8 уровней палочки_.\n\n_+2:_ Получает _+2 уровня и ещё +2 за каждые 8 уровней палочки_.\n\n_+3:_ Получает _+3 уровня и ещё +3 за каждые 8 уровней палочки_.
actors.hero.talent.ally_warp.title=Рокировка
actors.hero.talent.ally_warp.desc=_+1:_ Маг может выбрать союзника, чтобы моментально поменяться с ним местами на расстоянии до _2-х клеток_.\n\n_+2:_ Маг может выбрать союзника, чтобы моментально поменяться с ним местами на расстоянии до _4-х клеток_.\n\n_+3:_ Маг может выбрать союзника, чтобы моментально поменяться с ним местами на расстоянии до _6-ти клеток_.\n\nМаг не может поменяться местами со неподвижным союзником.

actors.hero.talent.empowered_strike.title=Усиленный удар
actors.hero.talent.empowered_strike.desc=_+1:_ Ближняя атака посохом Боевого мага после выстрела им нанесёт _+16% урона_ и накладывает бонусный эффект на _+50% силу_ посоха.\n\n_+2:_ Ближняя атака посохом Боевого мага после выстрела им нанесёт _+33% урона_ и накладывает бонусный эффект на _+100% силу_ посоха.\n\n_+3:_ Ближняя атака посохом Боевого мага после выстрела им нанесёт _+50% урона_ и накладывает бонусный эффект на _+150% силу_ посоха.
actors.hero.talent.mystical_charge.title=Мистический заряд
actors.hero.talent.mystical_charge.desc=_+1:_ Удар посохом дает Боевому магу _0.5 ходов_ перезарядки артефакта.\n\n_+2:_ Удар посохом дает Боевому магу _1 ход_ перезарядки артефакта.\n\n_+3:_ Удар посохом дает Боевому магу _1.5 хода_ перезарядки артефакта.
actors.hero.talent.excess_charge.title=Избыточный заряд
actors.hero.talent.excess_charge.desc=_+1:_ Когда посох Боевого мага полностью заряжен, его следующее использование дает владельцу _0.67 щита_ за уровень посоха.\n\n_+2:_ Когда посох Боевого мага полностью заряжен, его следующее использование дает владельцу _1.33 щита_ за уровень посоха.\n\n_+3:_ Когда посох Боевого мага полностью заряжен, его следующее использование дает владельцу _2 щита_ за уровень посоха.

actors.hero.talent.soul_siphon.title=Переносчики порчи
actors.hero.talent.soul_siphon.desc=_+1:_ Физический урон, нанесённый другими персонажами, способен активировать метку души Чернокнижника с _эффективностью 13%_.\n\n_+2:_ Физический урон, нанесённый другими персонажами, способен активировать метку души Чернокнижника с _эффективностью 27%_.\n\n_+3:_ Физический урон, нанесённый другими персонажами, способен активировать метку души Чернокнижника с _эффективностью 40%_.
actors.hero.talent.soul_eater.title=Пожиратель душ
actors.hero.talent.soul_eater.desc=_+1:_ За каждую единицу нанесённого физического урона «Метка души» даёт _0,33 хода насыщения_. Когда отмеченный враг погибает, с вероятностью _10%_ срабатывают эффекты приёма пищи.\n\n_+2:_ Насыщение составляет _0,67 хода_ за единицу урона, а вероятность срабатывания эффектов пищи — _20%_.\n\n_+3:_ Насыщение составляет _1 ход_ за единицу урона, а вероятность срабатывания эффектов пищи — _30%_.
actors.hero.talent.necromancers_minions.title=Миньоны некроманта
actors.hero.talent.necromancers_minions.desc=_+1:_ Когда враг с меткой души умирает, Чернокнижник имеет _шанс 13%_ воскресить врага в виде призрака с порчей.\n\n_+2:_ Когда враг с меткой души умирает, Чернокнижник имеет _шанс 27%_ воскресить врага в виде призрака с порчей.\n\n_+3:_ Когда враг с меткой души умирает, Чернокнижник имеет _шанс 40%_ воскресить врага в виде призрака с порчей.

actors.hero.talent.blast_radius.title=радиус взрыва
actors.hero.talent.blast_radius.desc=_+1:_ Радиус стихийного взрыва увеличен с 4 до _5 клеток_.\n\n_+2:_ Радиус стихийного взрыва увеличен с 4 до _6 клеток_.\n\n_+3:_ Радиус стихийного взрыва увеличен с 4 до _7 клеток_.\n\n_+4:_ Радиус стихийного взрыва увеличен с 4 до _8 клеток_.
actors.hero.talent.elemental_power.title=сила стихии
actors.hero.talent.elemental_power.desc=_+1:_ Сила стихийного взрыва увеличивается на _25%_.\n\n_+2:_ Сила стихийного взрыва увеличивается на _50%_.\n\n_+3:_ Сила стихийного взрыва увеличивается на _75%_.\n\n_+4:_ Сила стихийного взрыва увеличивается на _100%_.
actors.hero.talent.reactive_barrier.title=реактивный барьер
actors.hero.talent.reactive_barrier.desc=_+1:_ За каждого персонажа, затронутого стихийным взрывом, Маг получает _2,5 единицы щита или 2% максимального здоровья_, если это больше. Учитываются не более 5 персонажей, общий щит ограничен половиной максимального здоровья.\n\n_+2:_ Получает _5 единиц щита или 4% максимального здоровья_ за каждого из не более 6 персонажей. Общий предел не меняется.\n\n_+3:_ Получает _7,5 единицы щита или 6% максимального здоровья_ за каждого из не более 7 персонажей.\n\n_+4:_ Получает _10 единиц щита или 8% максимального здоровья_ за каждого из не более 8 персонажей.

actors.hero.talent.wild_power.title=дикая сила
actors.hero.talent.wild_power.desc=_+1:_ При использовании дикой магии палочки будут улучшены на _2 или 3, до +4_.\n\n_+2:_ При использовании дикой магии палочки будут улучшены на _3, до +5_.\n\n_+3:_ При использовании дикой магии палочки будут улучшены на _3 или 4, до +6_.\n\n_+4:_ При использовании дикой магии палочки будут улучшены на _4, до +7_.
actors.hero.talent.fire_everything.title=огонь из всех орудий
actors.hero.talent.fire_everything.desc=_+1:_ Дикая магия теперь срабатывает _5 раз_ вместо 4 и у каждой палочки есть _шанс 25%_ использовать её 3 раза.\n\n_+2:_ Дикая магия теперь срабатывает _6 раз_ вместо 4 и у каждой палочки есть _шанс 50%_ использовать её 3 раза.\n\n_+3:_ Дикая магия теперь срабатывает _7 раз_ вместо 4 и у каждой палочки есть _шанс 75%_ использовать её 3 раза.\n\n_+4:_ Дикая магия теперь срабатывает _8 раз_ вместо 4 и у каждой палочки есть _шанс 100%_ использовать её 3 раза.
actors.hero.talent.conserved_magic.title=сохранённая магия
actors.hero.talent.conserved_magic.desc=_+1:_ Каждый выстрел дикой магии теперь использует _0.33 зарядов_ вместо 0.5 и имеет _25% шанс_ не потратить ход.\n\n_+2:_ Каждый выстрел дикой магии теперь использует _0.225 зарядов_ вместо 0.5 и имеет _шанс 50%_ не потратить ход.\n\n_+3:_ Каждый выстрел дикой магии теперь использует _0.15 зарядов_ вместо 0.5 и имеет _шанс 75%_ не потратить ход.\n\n_+4:_ Каждый выстрел дикой магии теперь использует _0.1 зарядов_ вместо 0.5 и имеет _шанс 100%_ не потратить ход.

actors.hero.talent.telefrag.title=Телепорт-урон
actors.hero.talent.telefrag.desc=_+1:_ Если Маг телепортируется в клетку, занятую другим персонажем, он наносит ему _10–15 урона или 8–12% собственного максимального здоровья_, если эта величина выше. Сам Маг получает _5 урона или 4% максимального здоровья_.\n\n_+2:_ Цели наносится _20–30 урона или 16–24% максимального здоровья_, а Маг получает _10 урона или 8% максимального здоровья_.\n\n_+3:_ Цели наносится _30–45 урона или 24–36% максимального здоровья_, а Маг получает _15 урона или 12% максимального здоровья_.\n\n_+4:_ Цели наносится _40–60 урона или 32–48% максимального здоровья_, а Маг получает _20 урона или 16% максимального здоровья_.\n\nЭтот талант не может убить героя. Получаемый самим Магом урон снижается сопротивлением магии.
actors.hero.talent.remote_beacon.title=Дистанционный Маяк
actors.hero.talent.remote_beacon.desc=_+1:_ Маг может разместить маяк в любом месте в пределах _4 клеток_.\n\n_+2:_ Маг может разместить маяк в любом месте в пределах _8 клеток_.\n\n_+3:_ Маг может разместить маяк в любом месте в пределах _12 клеток_.\n\n_+4:_ Маг может разместить маяк в любом месте в пределах _16 клеток_.\n\nМаг не может размещать маяки в недоступных местах
actors.hero.talent.longrange_warp.title=Перенос дальнего действия
actors.hero.talent.longrange_warp.desc=_+1:_ Теперь Маг может перемещаться между этажами за плату в размере _150% заряда_.\n\n_+2:_ Теперь Маг может перемещаться между этажами за плату в размере _117% заряда_.\n\n_+3:_ Теперь Маг может перемещаться между этажами за плату в размере _83% заряда_.\n\n_+4:_ Теперь Маг может перемещаться между этажами за плату в размере _50% заряда_.\n\nМаг не может использовать перенос дальнего действия, чтобы покинуть запертый этаж.

#rogue
actors.hero.talent.cached_rations.title=Спрятанные пайки
actors.hero.talent.cached_rations.desc=_+1:_ В ближайших сундуках следующих этажей Разбойник может найти _2 походных пайка_.\n\n_+2:_ Может найти _3 пайка_.\n\n_+3:_ Может найти _4 пайка_.\n\nПоходный паёк быстро съедается, умеренно утоляет голод, восстанавливает _6% максимального здоровья_ (не менее 5 ОЗ) и возвращает 1 заряд плащу теней.
actors.hero.talent.thiefs_intuition.title=Интуиция вора
actors.hero.talent.thiefs_intuition.desc=_+1:_ Разбойник опознаёт кольца _в 2 раза быстрее_, а их вид определяет _при надевании_.\n\n_+2:_ Разбойник полностью опознаёт кольцо _при надевании_, а его вид узнаёт _при подборе_.\n\n_+3:_ Разбойник полностью опознаёт кольца _сразу при подборе_.
actors.hero.talent.sucker_punch.title=Удар исподтишка
actors.hero.talent.sucker_punch.desc=_+1:_ Первая внезапная атака Разбойника по врагу наносит на _15% больше урона_ (не менее 1–2 дополнительного урона).\n\n_+2:_ Бонус составляет _30%_ (не менее 2 дополнительного урона).\n\n_+3:_ Бонус составляет _45%_ (не менее 3 дополнительного урона).
actors.hero.talent.protective_shadows.title=Защитные тени
actors.hero.talent.protective_shadows.desc=_+1:_ Пока Разбойник невидим, он получает _1 единицу щита через ход_, максимум _3 единицы_. Оба значения увеличиваются, когда его максимальный запас здоровья превышает 50 ОЗ.\n\n_+2:_ Во время невидимости Разбойник получает _1 единицу щита каждый ход_, максимум _5 единиц_. Оба значения увеличиваются при максимальном здоровье выше 50 ОЗ.\n\n_+3:_ Во время невидимости Разбойник получает _1 единицу щита каждый ход и дополнительную единицу через ход_, максимум _7 единиц_. Оба значения увеличиваются при максимальном здоровье выше 50 ОЗ.

actors.hero.talent.mystical_meal.title=Мистический обед
actors.hero.talent.mystical_meal.desc=_+1:_ Разбойник тратит на еду 1 ход (походные пайки съедаются мгновенно) и получает _3 хода ускоренной перезарядки артефактов_.\n\n_+2:_ Получает _5 ходов ускоренной перезарядки_.\n\n_+3:_ Получает _7 ходов ускоренной перезарядки_.\n\nЭтим талантом нельзя перезаряжать сам рог изобилия.
actors.hero.talent.inscribed_stealth.title=начертанная скрытность
actors.hero.talent.inscribed_stealth.desc=_+1:_ После чтения свитка или использования предмета-заклинания Разбойник становится невидимым на _3 хода_.\n\n_+2:_ Невидимость длится _5 ходов_.\n\n_+3:_ Невидимость длится _7 ходов_.\n\nДлительность невидимости удваивается после использования свитка улучшения, свитка превращения или алхимических предметов, изготовленных из этих свитков.\n\nДля алхимических предметов, создаваемых сразу в нескольких экземплярах (например, большинства заклинаний), вероятность срабатывания зависит от количества получаемых предметов.
actors.hero.talent.wide_search.title=Широкий поиск
actors.hero.talent.wide_search.desc=_+1:_ Разбойник может искать на расстоянии _3 клеток_ вместо 2, но не в дальних углах области.\n\n_+2:_ Поиск охватывает _весь квадрат 7×7 клеток_ вокруг героя.\n\n_+3:_ Поиск охватывает _весь квадрат 9×9 клеток_.
actors.hero.talent.wide_search.meta_desc=_Если этот талант получен другим героем_, вместо этого он увеличивает его радиус поиска с квадрата 3x3 до круга 5x5 при +1 или квадрата 5x5 при +2.
actors.hero.talent.silent_steps.title=Бесшумные шаги
actors.hero.talent.silent_steps.desc=_+1:_ Разбойник не будит спящих врагов, пока находится _не ближе 3 клеток_ от них.\n\n_+2:_ Разбойник не будит спящих врагов, если _не стоит рядом_ с ними.\n\n_+3:_ Разбойник _вообще не будит спящих врагов_, даже находясь рядом.
actors.hero.talent.rogues_foresight.title=Разбойничья чуйка
actors.hero.talent.rogues_foresight.desc=_+1:_ Если на этаже есть тайная комната, Разбойник с вероятностью _75%_ почувствует это.\n\n_+2:_ Вероятность обнаружить наличие тайной комнаты составляет _100%_.\n\n_+3:_ Разбойник всегда чувствует наличие тайной комнаты, а _сама комната отмечается на карте_.

actors.hero.talent.light_cloak.title=Лёгкий плащ
actors.hero.talent.light_cloak.desc=_+1:_ Разбойник может использовать плащ теней, не надевая его, но вне экипировки тот восстанавливает заряды лишь с _25% обычной скорости_.\n\n_+2:_ Скорость восстановления зарядов составляет _50% обычной_.\n\n_+3:_ Скорость восстановления зарядов составляет _75% обычной_.
actors.hero.talent.light_cloak.meta_desc=_Если этот талант получен другим героем_, вместо этого он увеличит скорость зарядки всех артефактов на 7/13/20% при +1/+2/+3.
actors.hero.talent.enhanced_rings.title=Улучшенные кольца
actors.hero.talent.enhanced_rings.desc=_+1:_ Когда Разбойник использует артефакт, его кольца получают _+1 к уровню улучшения на 3 хода_.\n\n_+2:_ Бонус действует _6 ходов_.\n\n_+3:_ Бонус действует _9 ходов_.

actors.hero.talent.enhanced_lethality.title=Улучшенная летальность
actors.hero.talent.enhanced_lethality.desc=_+1:_ Убийца может убить врага с показателем здоровья ниже _4/13/27/67%_ за уровень готовности, вместо 3/10/20/50%.\n\n_+2:_ Убийца может убить врага с показателем здоровья ниже _5/17/33/83%_ за уровень готовности, вместо 3/10/20/50%.\n\n_+3:_ Убийца может убить врага с показателем здоровья ниже _6/20/40/100%_ за уровень готовности, вместо 3/10/20/50%.
actors.hero.talent.assassins_reach.title=Убийственный размах
actors.hero.talent.assassins_reach.desc=_+1:_ Диапазон удара Убийцы за уровень подготовки увеличен до _1/3/4/6 клеток,_ вместо 1/2/3/4.\n\n_+2:_ Диапазон удара Убийцы за уровень подготовки увеличен до _2/4/6/8 клеток_, вместо 1/2/3/4.\n\n_+3:_ Диапазон удара Убийцы за уровень подготовки увеличен до _2/5/7/10 клеток_, вместо 1/2/3/4.\n\nРывок позволяет проходить через врагов, ловушки и ямы, но не через стены.
actors.hero.talent.bounty_hunter.title=Охотник за головами
actors.hero.talent.bounty_hunter.desc=_+1:_ Когда Убийца убивает врага подготовленным ударом, шанс выпадения с него предмета увеличивается на _2/4/8/16%_, в зависимости от уровня подготовки.\n\n_+2:_ Когда Убийца убивает врага подготовленным ударом, шанс выпадения с него предмета увеличивается на _4/8/16/32%_, в зависимости от уровня подготовки.\n\n_+3:_ Когда Убийца убивает врага подготовленным ударом, шанс выпадения с него предмета увеличивается на _6/12/24/48%_, в зависимости от уровня подготовки.

actors.hero.talent.evasive_armor.title=Лёгкая броня
actors.hero.talent.evasive_armor.desc=_+1:_ Во время бега Бродяга получает _+1 уклонение_ за каждое лишнее очко силы на вашей броне.\n\n_+2:_ Во время бега Бродяга получает _+2 уклонения_ за каждое лишнее очко силы на вашей броне.\n\n_+3:_ Во время бега Бродяга получает _+3 уклонения_ за каждое лишнее очко силы на вашей броне.
actors.hero.talent.projectile_momentum.title=Инерция снаряда
actors.hero.talent.projectile_momentum.desc=_+1:_ Во время свободного бега Бродяга получает _+50% точности и +15% урона_ метательным оружием. \n\n_+2:_ Во время свободного бега Бродяга получает _+100% точности и +30% урона_ метательным оружием.\n\n_+3:_ Во время свободного бега Бродяга получает _+150% точности и +45% урона_ метательным оружием.
actors.hero.talent.speedy_stealth.title=Быстрая скрытность
actors.hero.talent.speedy_stealth.desc=_+1:_ Бродяга получает 2 стака импульса за ход, пока он невидим.\n\n_+2:_ В дополнение к преимуществам +1, время в бегу больше не считается, пока Бродяга невидим.\n\n_+3:_ В дополнение к преимуществам +1 и +2, Бродяга движется с удвоенной скоростью, пока он невидим, независимо от того, бежит он или нет.

actors.hero.talent.hasty_retreat.title=поспешное отступление
actors.hero.talent.hasty_retreat.desc=_+1:_ После скачка Разбойник получает _1 ход_ ускорения и невидимости.\n\n_+2:_ После скачка Разбойник получает _2 хода_ ускорения и невидимости.\n\n_+3:_ После скачка Разбойник получает _3 хода_ ускорения и невидимости.\n\n_+4:_ После скачка Разбойник получает _4 хода_ ускорения и невидимости.
actors.hero.talent.body_replacement.title=подмена тела
actors.hero.talent.body_replacement.desc=_+1:_ После скачка Разбойник оставляет деревянную приманку с _20% его максимального здоровья_ (не менее 20 ОЗ) и _25% его брони_ (не менее 1–3).\n\n_+2:_ Приманка получает _40% максимального здоровья_ (не менее 40 ОЗ) и _50% брони_ (не менее 2–6).\n\n_+3:_ Приманка получает _60% максимального здоровья_ (не менее 60 ОЗ) и _75% брони_ (не менее 3–9).\n\n_+4:_ Приманка получает _80% максимального здоровья_ (не менее 80 ОЗ) и _100% брони_ (не менее 4–12).\n\nОдновременно может существовать только одна приманка.
actors.hero.talent.shadow_step.title=теневой шаг
actors.hero.talent.shadow_step.desc=_+1:_ Если Разбойник использует дымовую бомбу, будучи невидимым, это происходит мгновенно и расходует на _16% меньше_ заряда, но при этом он не ослепляет врагов и не активирует другие таланты.\n\n_+2:_ Если Разбойник использует дымовую бомбу, будучи невидимым, это происходит мгновенно и расходует на _30% меньше_ заряда, но при этом он не ослепляет врагов и не активирует другие таланты.\n\n_+3:_ Если Разбойник использует дымовую бомбу, будучи невидимым, это происходит мгновенно и расходует на _41% меньше_ заряда, но при этом он не ослепляет врагов и не активирует другие таланты.\n\n_+4:_ Если Разбойник использует дымовую бомбу, будучи невидимым, это происходит мгновенно и расходует на _50% меньше_ заряда, но при этом он не ослепляет врагов и не активирует другие таланты.

actors.hero.talent.fear_the_reaper.title=страх смерти
actors.hero.talent.fear_the_reaper.desc=_+1:_ Когда здоровье врага с меткой смерти падает до 0 ОЗ, он получает _хромоту_.\n\n_+2:_ Враг получает _хромоту и страх_.\n\n_+3:_ Враг получает _хромоту и страх_, а все враги в радиусе 3 клеток — _хромоту_.\n\n_+4:_ Враг и все противники в радиусе 3 клеток получают _хромоту и страх_.
actors.hero.talent.deathly_durability.title=смертельная стойкость
actors.hero.talent.deathly_durability.desc=_+1:_ Враги, убитые меткой смерти, дают Разбойнику щит, равный _13%_ от их здоровья в момент нанесения метки.\n\n_+2:_ Враги, убитые меткой смерти, дают Разбойнику щит, равный _25%_ от их здоровья в момент нанесения метки.\n\n_+3:_ Враги, убитые меткой смерти, дают Разбойнику щит, равный _38%_ от их здоровья в момент нанесения метки.\n\n_+4:_ Враги, убитые меткой смерти, дают Разбойнику щит, равный _50%_ от их здоровья в момент нанесения метки.
actors.hero.talent.double_mark.title=двойная отметка
actors.hero.talent.double_mark.desc=_+1:_ Маркировка двух целей одновременно приводит к снижению стоимости заряда на _30%_.\n\n_+2:_ Маркировка двух целей одновременно приводит к снижению стоимости заряда на _50%_.\n\n_+3:_ Маркировка двух целей одновременно приводит к снижению стоимости заряда на _65%_.\n\n_+4:_ Маркировка двух целей одновременно приводит к снижению стоимости заряда на _75%_.

actors.hero.talent.shadow_blade.title=клинок теней
actors.hero.talent.shadow_blade.desc=_+1:_ Теневой клон получает _8%_ урона героя за ход и имеет _25% шанс_ использовать зачарование, наложенное на оружие героя.\n\n_+2:_ Теневой клон получает _16%_ урона героя за ход и имеет _50% шанс_ использовать зачарование, наложенное на оружие героя.\n\n_+3:_ Теневой клон получает _24%_ урона героя за ход и имеет _75% шанс_ использовать зачарование, наложенное на оружие героя.\n\n_+4:_ Теневой клон получает _32%_ урона героя за ход и имеет _100% шанс_ использовать зачарование, наложенное на оружие героя.
actors.hero.talent.cloned_armor.title=скопированная броня
actors.hero.talent.cloned_armor.desc=_+1:_ Теневой клон получает _12%_ от значения брони героя и имеет _25% шанс_ использовать руну на броне героя.\n\n_+2:_ Теневой клон получает _24%_ от значения брони героя и имеет _50% шанс_ использовать руну на броне героя.\n\n_+3:_ Теневой клон получает _36%_ от значения брони героя и имеет _75% шанс_ использовать руну на броне героя.\n\n_+4:_ Теневой клон получает _48%_ от значения брони героя и имеет _100% шанс_ использовать руну на броне героя.
actors.hero.talent.perfect_copy.title=идеальная копия
actors.hero.talent.perfect_copy.desc=_+1:_ Теневой клон получает _10%_ от максимального ОЗ героя и может постоянно меняться с героем местами на расстоянии до _1 клетки_.\n\n_+2:_ Теневой клон получает _20%_ от максимального ОЗ героя и может постоянно меняться с героем местами на расстоянии до _2 клеток_.\n\n_+3:_ Теневой клон получает _30%_ от максимального ОЗ героя и может постоянно меняться с героем местами на расстоянии до _3 клеток_.\n\n_+4:_ Теневой клон получает _40%_ от максимального ОЗ героя и может постоянно меняться с героем местами на расстоянии до _4 клеток_.

#huntress
actors.hero.talent.natures_bounty.title=щедрость природы
actors.hero.talent.natures_bounty.desc=_+1:_ Исследуя несколько следующих этажей, Охотница может найти в высокой траве _4 ягоды_.\n\n_+2:_ Может найти _6 ягод_.\n\n_+3:_ Может найти _8 ягод_.\n\nЯгоды можно быстро съесть: они слегка утоляют голод и иногда содержат полезные семена.
actors.hero.talent.survivalists_intuition.title=Интуиция выживальщика
actors.hero.talent.survivalists_intuition.desc=_+1:_ Охотница опознаёт метательное оружие _в 3 раза быстрее_.\n\n_+2:_ Охотница опознаёт метательное оружие _при попадании по врагу_.\n\n_+3:_ Охотница опознаёт метательное оружие _при подборе_.
actors.hero.talent.followup_strike.title=Добивающий удар
actors.hero.talent.followup_strike.desc=_+1:_ После попадания по врагу из лука или метательным оружием следующая рукопашная атака Охотницы по этому врагу наносит _2 дополнительного урона_. Бонус растёт с уровнем героя.\n\n_+2:_ Бонус составляет _3 урона_ и растёт с уровнем героя.\n\n_+3:_ Бонус составляет _4 урона_ и растёт с уровнем героя.
actors.hero.talent.natures_aid.title=Помощь природы
actors.hero.talent.natures_aid.desc=_+1:_ Когда Охотница видит срабатывание растения, она получает _2 единицы дубовой кожи плюс 1 за каждые 4 уровня героя_. Защита уменьшается на единицу каждые _3 хода_.\n\n_+2:_ Такая защита уменьшается на единицу каждые _5 ходов_.\n\n_+3:_ Такая защита уменьшается на единицу каждые _7 ходов_.

actors.hero.talent.invigorating_meal.title=Бодрящий обед
actors.hero.talent.invigorating_meal.desc=_+1:_ Охотница тратит на еду 1 ход (ягоды съедаются мгновенно) и получает _1 ход ускорения_.\n\n_+2:_ Получает _2 хода ускорения_.\n\n_+3:_ Получает _3 хода ускорения_.
actors.hero.talent.liquid_nature.title=жидкая природа
actors.hero.talent.liquid_nature.desc=_+1:_ Когда Охотница выпивает или бросает зелье, отвар либо эликсир, рядом вырастает _до 4 клеток травы_, а соседние враги оказываются опутаны на _1 ход_.\n\n_+2:_ Вырастает _до 6 клеток травы_, враги опутываются на _2 хода_.\n\n_+3:_ Вырастает _до 8 клеток травы_, враги опутываются на _3 хода_.\n\nПри использовании зелий силы и опыта либо изготовленных из них алхимических предметов количество травы и длительность опутывания удваиваются.\n\nДля предметов, изготавливаемых сразу в нескольких экземплярах (например, водного отвара), вероятность срабатывания зависит от количества получаемых предметов.
actors.hero.talent.rejuvenating_steps.title=восстанавливающие шаги
actors.hero.talent.rejuvenating_steps.desc=_+1:_ Когда Охотница ступает на низкую траву или тлеющие угли, вырастает высокая трава, которую она тут же приминает. Перезарядка — _10 ходов_.\n\n_+2:_ Перезарядка — _5 ходов_.\n\n_+3:_ Перезарядка — _2 хода_.\n\nЕсли пассивная регенерация отключена или герой давно не получал опыт, талант создаёт только примятую траву.
actors.hero.talent.heightened_senses.title=усиленное восприятие
actors.hero.talent.heightened_senses.desc=_+1:_ Охотница получает ментальное зрение на существ в пределах _2 клеток_ от себя.\n\n_+2:_ Радиус составляет _3 клетки_.\n\n_+3:_ Радиус составляет _4 клетки_.
actors.hero.talent.durable_projectiles.title=прочные снаряды
actors.hero.talent.durable_projectiles.desc=_+1:_ Метательное оружие Охотницы получает _+50% к прочности_.\n\n_+2:_ Получает _+75% к прочности_.\n\n_+3:_ Получает _+100% к прочности_.

actors.hero.talent.point_blank.title=Cтрельба в упор
actors.hero.talent.point_blank.desc=_+1:_ Когда Охотница использует её лук или метательное оружие в ближнем бою, оно имеет _-25% точности_ вместо -50%.\n\n_+2:_ Когда Охотница использует её лук или метательное оружие в ближнем бою, оно имеет _нормальную точность_ вместо -50%.\n\n_+3:_ Когда Охотница использует её лук или метательное оружие в ближнем бою, оно имеет _+25% точности_ вместо -50%.\n\nМетательное оружие или Лук Духов всегда имеют +50% точности, когда использованы на дистанции.
actors.hero.talent.seer_shot.title=Всевидящий выстрел
actors.hero.talent.seer_shot.desc=_+1:_ Когда Охотница выпускает стрелу в землю, она открывает местность в области 3х3 вокруг нее на _5 ходов_. Талант перезаряжается 20 ходов.\n\n_+2:_ Когда Охотница выпускает стрелу в землю, она открывает местность в области 3х3 вокруг нее на _10 ходов_. Талант перезаряжается 20 ходов.\n\n_+3:_ Когда Охотница выпускает стрелу в землю, она открывает местность в области 3х3 вокруг нее на _15 ходов_. Талант перезаряжается 20 ходов.
actors.hero.talent.seer_shot.meta_desc=_Если этот талант получен другим героем_, он сработает от любого метательного оружия.

actors.hero.talent.farsight.title=Орлиный глаз
actors.hero.talent.farsight.desc=_+1:_ Дальность обзора Снайпера увеличивается _на 25%_.\n\n_+2:_ Дальность обзора Снайпера увеличивается _на 50%_.\n\n_+3:_ Дальность обзора Снайпера увеличивается _на 75%_.
actors.hero.talent.shared_enchantment.title=Общее зачарование
actors.hero.talent.shared_enchantment.desc=_+1:_ Метательное оружие имеет _шанс 33%_ активировать зачарование на луке Снайпера.\n\n_+2:_ Метательное оружие имеет _шанс 67%_ активировать зачарование на луке Снайпера.\n\n_+3:_ Метательное оружие имеет _шанс 100%_ активировать зачарование на луке Снайпера.\n\nЗачарование от лука может активироваться в дополнение к уже имеющемуся на метательном оружии.
actors.hero.talent.shared_upgrades.title=Общие улучшения
actors.hero.talent.shared_upgrades.desc=_+1:_ Когда Снайпер атакует улучшенным метательным оружием, каждый его уровень увеличивает продолжительность метки снайпера на 1 ход и урон от её специальной атаки на 16%, впредь до максимального в _2 хода и +33% к урону при +2 уровне_.\n\n_+2:_ Когда Снайпер атакует улучшенным метательным оружием, каждый его уровень увеличивает продолжительность метки снайпера на 1 ход и урон от её специальной атаки на 16%, впредь до максимального в _4 хода и +67% к урону при +4 уровне_.\n\n_+3:_ Когда Снайпер атакует улучшенным метательным оружием, каждый его уровень увеличивает продолжительность метки снайпера на 1 ход и урон от её специальной атаки на 16%, впредь до максимального в _6 ходов и +100% к урону при +6 уровне_.

actors.hero.talent.durable_tips.title=Прочные наконечники
actors.hero.talent.durable_tips.desc=_+1:_ Дротики становятся в _2 раза_ прочнее когда Хранительница использует их.\n\n_+2:_ Дротики становятся в _3 раза_ прочнее когда Хранительница использует их.\n\n_+3:_ Дротики становятся в _4 раза_ прочнее когда Хранительница использует их.
actors.hero.talent.barkskin.title=Дубовая кожа
actors.hero.talent.barkskin.desc=_+1:_ Когда Хранительница наступает на невспаханную высокую траву или растениям, она получает дубовую кожу эквивалентную _0-33% от её уровня_, которая исчезает каждый ход.\n\n_+2:_ Когда Хранительница наступает на невспаханную высокую траву или растениям, она получает дубовую кожу эквивалентную _0-67% от её уровня_, которая исчезает каждый ход.\n\n_+3:_ Когда Хранительница наступает на невспаханную высокую траву или растениям, она получает дубовую кожу эквивалентную _0-100% от её уровня_, которая исчезает каждый ход.
actors.hero.talent.shielding_dew.title=Защитная роса
actors.hero.talent.shielding_dew.desc=_+1:_ Когда здоровье Хранительницы полно, капли росы могут дать ей защиту на _20% от её максимального здоровья_.\n\n_+2:_ Когда здоровье Хранительницы полно, капли росы могут дать ей защиту на _40% от её максимального здоровья_.\n\n_+3:_ Когда здоровье Хранительницы полно, капли росы могут дать ей защиту на _60% от её максимального здоровья_.

actors.hero.talent.fan_of_blades.title=веер клинков
actors.hero.talent.fan_of_blades.desc=_+1:_ Спектральные клинки могут поразить _до 1 дополнительной цели_ на 50% урона. Цель должна быть видна и находиться в пределе конуса с углом _30 градусов_.\n\n_+2:_ Спектральные клинки могут поразить _до 2 дополнительных целей_ на 50% урона. Цели должны быть видны и находиться в пределе конуса с углом _60 градусов_.\n\n_+3:_ Спектральные клинки могут поразить _до 3 дополнительных целей_ на 50% урона. Цели должны быть видны и находиться в пределе конуса с углом _90 градусов_.\n\n_+4:_ Спектральные клинки могут поразить _до 4 дополнительных целей_ на 50% урона. Цели должны быть видны и находиться в пределе конуса с углом _120 градусов_.
actors.hero.talent.projecting_blades.title=проецирующиеся клинки
actors.hero.talent.projecting_blades.desc=_+1:_ Спектральные клинки имеют _+25% точности_ и проходят сквозь _2 сплошные клетки_.\n\n_+2:_ Спектральные клинки имеют _+50% точности_ и проходят сквозь _4 сплошные клетки_.\n\n_+3:_ Спектральные клинки имеют _+75% точности_ и проходят сквозь _6 сплошных клеток_.\n\n_+4:_ Спектральные клинки имеют _+100% точности_ и проходят сквозь _8 сплошных клеток_.
actors.hero.talent.spirit_blades.title=клинки духов
actors.hero.talent.spirit_blades.desc=_+1:_ Спектральные клинки имеют _шанс 30%_ также использовать зачарование на луке духов.\n\n_+2:_ Спектральные клинки имеют _шанс 60%_ также использовать зачарование на луке духов.\n\n_+3:_ Спектральные клинки имеют _шанс 90%_ также использовать зачарование на луке духов.\n\n_+4:_ Спектральные клинки имеют _шанс 100%_ также использовать зачарование на луке духов, а также усиливают каждое зачарование _на 10%_.

actors.hero.talent.growing_power.title=растущая мощь
actors.hero.talent.growing_power.desc=_+1:_ Атака и скорость передвижения от силы природы увеличивается до _38% и 125%_, с 33% и 100%.\n\n_+2:_ Атака и скорость передвижения от силы природы увеличивается до _42% и 150%_, с 33% и 100%.\n\n_+3:_ Атака и скорость передвижения от силы природы увеличивается до _46% и 175%_, с 33% и 100%.\n\n_+4:_ Атака и скорость передвижения от силы природы увеличивается до _50% и 200%_, с 33% и 100%.
actors.hero.talent.natures_wrath.title=гнев природы
actors.hero.talent.natures_wrath.desc=_+1:_ Пока сила природы активна, выстрелы из лука духа имеют _шанс 8%_ вызвать случайный вредный эффект растения.\n\n_+2:_ Пока сила природы активна, выстрелы из лука духа имеют _шанс 17%_ вызвать случайный вредный эффект растения.\n\n_+3:_ Пока сила природы активна, выстрелы из лука духа имеют _шанс 25%_ вызвать случайный вредный эффект растения.\n\n_+4:_ Пока сила природы активна, выстрелы из лука духа имеют _шанс 33%_ вызвать случайный вредный эффект растения.\n\nРастения, эффект которых может быть вызван: слепняк, огнецвет, ледяная лилия, грустномох и штормовая лоза.
actors.hero.talent.wild_momentum.title=дикий импульс
actors.hero.talent.wild_momentum.desc=_+1:_ Убийство врага луком духов продлевает срок действия силы природы на _1 ход_. Продолжительность может быть увеличена максимум на _2 хода_.\n\n_+2:_ Убийство врага луком духов продлевает срок действия силы природы на _2 хода_. Продолжительность может быть увеличена максимум на _4 хода_.\n\n_+3:_ Убийство врага луком духов продлевает срок действия силы природы на _3 хода_. Продолжительность может быть увеличена максимум на _6 ходов_.\n\n_+4:_ Убийство врага луком духов продлевает срок действия силы природы на _4 хода_. Продолжительность может быть увеличена максимум на _8 ходов_.

actors.hero.talent.eagle_eye.title=орлиный глаз
actors.hero.talent.eagle_eye.desc=_+1:_ Дальность обзора призрачного ястреба увеличена с 6 до _7 клеток_.\n\n_+2:_ Дальность обзора призрачного ястреба увеличена с 6 до _8 клеток_.\n\n_+3:_ Дальность обзора призрачного ястреба увеличена с 6 до _9 клеток_, и он получает ментальное зрение в радиусе _2 клеток_.\n\n_+4:_ Дальность обзора призрачного ястреба увеличена с 6 до _10 клеток_, и он получает ментальное зрение в радиусе _3 клеток_.
actors.hero.talent.go_for_the_eyes.title=целься в глаза
actors.hero.talent.go_for_the_eyes.desc=_+1:_ Атаки призрачного ястреба ослепляют врагов на _2 хода_.\n\n_+2:_ Атаки призрачного ястреба ослепляют врагов на _5 ходов_.\n\n_+3:_ Атаки призрачного ястреба ослепляют врагов на _5 ходов_ и калечат их на _2 хода_.\n\n_+4:_ Атаки призрачного ястреба ослепляют врагов на _5 ходов_ и калечат их на _5 ходов_.
actors.hero.talent.swift_spirit.title=стремительный дух
actors.hero.talent.swift_spirit.desc=_+1:_ Скорость передвижения призрачного ястреба возрастает с 2 до _2,5 клетки_; он гарантированно уклоняется от первых _2 атак_ по нему.\n\n_+2:_ Скорость возрастает до _3 клеток_, а число гарантированных уклонений — до _4_.\n\n_+3:_ Скорость возрастает до _3,5 клетки_, а число атак — до _6_.\n\n_+4:_ Скорость возрастает до _4 клеток_, а число атак — до _8_.

#duelist
actors.hero.talent.strengthening_meal.title=Усиляющий обед
actors.hero.talent.strengthening_meal.desc=_+1:_ После еды следующие _2 физические атаки_ Дуэлянта получают бонус к урону: _2 плюс треть уровня героя_ (не менее 3).\n\n_+2:_ Бонус действует на следующие _3 физические атаки_.\n\n_+3:_ Бонус действует на следующие _4 физические атаки_.
actors.hero.talent.adventurers_intuition.title=Интуиция приключенца
actors.hero.talent.adventurers_intuition.desc=_+1:_ Дуэлянт опознаёт оружие _в 2,5 раза быстрее_, а броню — _в 1,75 раза быстрее_.\n\n_+2:_ Дуэлянт опознаёт оружие _при экипировке_, а броню — _в 2,5 раза быстрее_.\n\n_+3:_ Дуэлянт опознаёт оружие _при экипировке_, а броню — _при надевании_.
actors.hero.talent.patient_strike.title=выжидающий удар
actors.hero.talent.patient_strike.desc=_+1:_ Если Дуэлянт пропускает ход перед рукопашной атакой, она наносит на _10% больше урона_ (не менее 1–2 дополнительного урона).\n\n_+2:_ Бонус составляет _20%_ (не менее 2 дополнительного урона).\n\n_+3:_ Бонус составляет _30%_ (не менее 3 дополнительного урона).
actors.hero.talent.aggressive_barrier.title=отчаянный барьер
actors.hero.talent.aggressive_barrier.desc=_+1:_ Когда Дуэлянт применяет способность оружия при здоровье не выше 50%, она получает щит прочностью _4% максимального здоровья_ (не менее 3).\n\n_+2:_ Прочность щита составляет _8% максимального здоровья_ (не менее 5).\n\n_+3:_ Прочность щита составляет _12% максимального здоровья_ (не менее 7).
actors.hero.talent.aggressive_barrier.meta_desc=_Если этот талант получен другим героем_, то герой будет получать щит при совершении ближней атаки при низком уровне здоровья, с перезарядкой в 50 ходов.

actors.hero.talent.focused_meal.title=медитационный обед
actors.hero.talent.focused_meal.desc=_+1:_ Дуэлянт тратит на еду 1 ход и восстанавливает _0,67 заряда_ способностей оружия.\n\n_+2:_ Восстанавливает _1 заряд_.\n\n_+3:_ Восстанавливает _1,33 заряда_.
actors.hero.talent.focused_meal.meta_desc=_Если этот талант получен другим героем_, то герой получит бонус к урону следующей атаки равный уровню героя/3 на 1-ом уровне таланта, или уровню героя/2 на 2-ом уровне таланта.
actors.hero.talent.liquid_agility.title=жидкая гибкость
actors.hero.talent.liquid_agility.desc=_+1:_ Выпив или бросив зелье, отвар либо эликсир, Дуэлянт получает _тройное уклонение_, а её следующая рукопашная атака в течение 5 ходов — _тройную точность_.\n\n_+2:_ Уклонение становится _неограниченным_, как и точность следующей рукопашной атаки в течение 5 ходов.\n\n_+3:_ Дуэлянт получает _неограниченное уклонение_ и _неограниченную точность_ следующей рукопашной атаки; оба эффекта длятся _на один ход и одну атаку дольше_.\n\nПосле использования зелий силы и опыта либо изготовленных из них алхимических предметов бонус действует ещё на один ход и одну атаку дольше.\n\nДля предметов, изготавливаемых сразу в нескольких экземплярах (например, водного отвара), вероятность срабатывания зависит от их количества.
actors.hero.talent.weapon_recharging.title=перезарядка оружия
actors.hero.talent.weapon_recharging.desc=_+1:_ Под действием ускоренной перезарядки палочек или артефактов Дуэлянт получает один заряд оружия каждые _15 ходов_.\n\n_+2:_ Получает заряд каждые _10 ходов_.\n\n_+3:_ Получает заряд каждые _5 ходов_.
actors.hero.talent.weapon_recharging.meta_desc=_Если этот талант получен другим героем_, то под действием перезарядки герой будет наносить на 5% больше урона в ближнем бою на 1-ом уровне таланта, или на 7.5% больше на 2-ом уровне.
actors.hero.talent.lethal_haste.title=смертельная спешка
actors.hero.talent.lethal_haste.desc=_+1:_ Добив врага способностью оружия, Дуэлянт получает _3 хода мгновенного перемещения_.\n\n_+2:_ Получает _5 ходов_.\n\n_+3:_ Получает _7 ходов_.
actors.hero.talent.lethal_haste.meta_desc=_Если этот талант получен другим героем_, то он будет срабатывать с обычными атаками, с перезарядкой в 100 ходов.
actors.hero.talent.swift_equip.title=быстрая экипировка
actors.hero.talent.swift_equip.desc=_+1:_ Дуэлянт может мгновенно сменить экипированное оружие _1 раз за 20 ходов_.\n\n_+2:_ Может мгновенно сменить оружие _2 раза за 20 ходов_.\n\n_+3:_ Может мгновенно сменить оружие _2 раза за 10 ходов_.\n\nПока талант не перезаряжается, применение неэкипированного оружия через панель быстрого доступа сразу экипирует его.

actors.hero.talent.precise_assault.title=расчётливое нападение
actors.hero.talent.precise_assault.desc=_+1:_ Когда Дуэлянт использует способность оружия, она увеличивает точность следующего удара (в течение 5 ходов) в _2 раза_.\n\n_+2:_ Когда Дуэлянт использует способность оружия, она увеличивает точность следующего удара (в течение 5 ходов) в _5 раз_.\n\n_+3:_ Когда Дуэлянт использует способность оружия, точность следующего удара (в течение 5 ходов) становится _бесконечной_.
actors.hero.talent.precise_assault.meta_desc=_Если этот талант получен другим героем_, вместо этого он увеличит точность рукопашных атак героя на 10% при +1, 20% при +2, 30% при +3.
actors.hero.talent.deadly_followup.title=смертельное добивание
actors.hero.talent.deadly_followup.desc=_+1:_ Когда Дуэлянт попадает по врагу метательным оружием, она наносит ему на _10% больше урона в ближнем бою_ в течение 5 ходов.\n\n_+2:_ Когда Дуэлянт попадает по врагу метательным оружием, она наносит ему на _20% больше урона в ближнем бою_ в течение 5 ходов.\n\n_+3:_ Когда Дуэлянт попадает по врагу метательным оружием, она наносит ему на _30% больше урона в ближнем бою_ в течение 5 ходов.

actors.hero.talent.varied_charge.title=переменный заряд
actors.hero.talent.varied_charge.desc=_+1:_ Чемпион мгновенно восстанавливает _0,17 зарядов оружия_, когда использует две разные способности оружия, вне зависимости от времени между атаками.\n\n_+2:_ Чемпион мгновенно восстанавливает _0,33 заряда оружия_, когда использует две разные способности оружия, вне зависимости от времени между атаками.\n\n_+3:_ Чемпион мгновенно восстанавливает _0,5 заряда оружия_, когда она использует две разные способности оружия, вне зависимости от времени между атаками.
actors.hero.talent.twin_upgrades.title=взаимные улучшения
actors.hero.talent.twin_upgrades.desc=_+1:_ Если экипированное оружие Чемпиона отличается редкостью на _2 или больше уровней_, то более слабое оружие будет улучшено до уровня более сильного.\n\n_+2:_ Если экипированное оружие Чемпиона отличается редкостью на _1 или больше уровней_, то более слабое оружие будет улучшено до уровня более сильного.\n\n_+3:_ Если экипированное оружие Чемпиона с редкостью _такого же уровня или выше_, то более слабое оружие будет улучшено до уровня более сильного.
actors.hero.talent.combined_lethality.title=двойная летальность
actors.hero.talent.combined_lethality.desc=_+1:_ Если Чемпион атакует рукопашным оружием сразу после использования способности другого, то эта атака добьёт любого врага, у которого _меньше 13% здоровья_. Не работает против боссов.\n\n_+2:_ Если Чемпион атакует рукопашным оружием сразу после использования способности другого, то эта атака добьёт любого врага, у которого _меньше 27% здоровья_. Не работает против боссов.\n\n_+3:_ Если Чемпион атакует рукопашным оружием сразу после использования способности другого, то эта атака добьёт любого врага, у которого _здоровье меньше 40%_. Не работает против боссов.\n\nЭта атака может быть обычной, а может и частью способности оружия.

actors.hero.talent.unencumbered_spirit.title=cвободный дух
actors.hero.talent.unencumbered_spirit.desc=_+1:_ Монах получает на _50% больше энергии_ за каждый предмет снаряжения с редкостью _уровня 3 и ниже_, который она использует.\n\n_+2:_ Монах получает на _75% больше энергии_ за каждый предмет снаряжения с редкостью _уровня 2 и ниже_, который она использует. Бонус для снаряжения с редкостью уровня 3 не изменён.\n\n_+3:_ Монах получает на _100% больше энергии_ за каждый предмет снаряжения с редкостью _уровня 1 или ниже_, который она использует. Бонус для снаряжения с редкостью уровней 2 и 3 не изменён. Она также получает тканевую броню и перчатки с шипами.\n\nЭтот талант не даёт преимущества при отсутствии брони или при атаке с кольцом урона.
actors.hero.talent.monastic_vigor.title=искусство отшельника
actors.hero.talent.monastic_vigor.desc=_+1:_ Если у Монаха _100% энергии_, её способности усиливаются. \n\n_+2:_ Если у Монаха _80% или больше энергии_, её способности усиливаются. \n\n_+3:_ Если у Монаха _60% или больше энергии_, её способности усиливаются.\n\nПри усилении:\n- Шквал ударов применяет зачарование оружия.\n- Фокусировка происходит мгновенно.\n- Дальность рывка увеличена на 4 клетки.\n- Удар дракона наносит на 50% больше урона, отбрасывает и оглушает всех соседних врагов.\n- Медитация медленно восстанавливает 20% от недостающего здоровья и дает 80% сопротивления урону.
actors.hero.talent.combined_energy.title=гармоничные потоки
actors.hero.talent.combined_energy.desc=_+1:_ Если за 5 ходов Монах успешно использует способность оружия и свою способность, требующую _4+ энергии_, то она восстанавливает 1 потраченную энергию.\n\n_+2:_ Если за 5 ходов Монах успешно использует способность оружия и свою способность, требующую _3+ энергии_, то она восстанавливает 1 потраченную энергию.\n\n_+3:_ Если за 5 ходов Монах успешно использует способность оружия и свою способность, требующую _2+ энергии_, то она восстанавливает 1 потраченную энергию.

actors.hero.talent.close_the_gap.title=тактическое сближение
actors.hero.talent.close_the_gap.desc=_+1:_ В начале дуэли Дуэлянт телепортируется к цели на расстояние до _2 клеток_.\n\n_+2:_ Дальность возрастает до _3 клеток_.\n\n_+3:_ Дальность возрастает до _4 клеток_.\n\n_+4:_ Дальность возрастает до _5 клеток_.\n\nТелепортация проходит через врагов и опасные клетки, но не сквозь стены и другие твёрдые препятствия. Её дальность учитывается при проверке, можно ли вызвать врага на дуэль.
actors.hero.talent.invigorating_victory.title=сладость победы
actors.hero.talent.invigorating_victory.desc=_+1:_ Если Дуэлянт побеждает цель до окончания дуэли, она восстанавливает _7,5% максимального здоровья_ (не менее 5 ОЗ) _плюс 30% полученного за время дуэли урона_.\n\n_+2:_ Восстанавливает _15% максимального здоровья_ (не менее 10 ОЗ) _плюс 50% полученного урона_.\n\n_+3:_ Восстанавливает _22,5% максимального здоровья_ (не менее 15 ОЗ) _плюс 65% полученного урона_.\n\n_+4:_ Восстанавливает _30% максимального здоровья_ (не менее 20 ОЗ) _плюс 75% полученного урона_.
actors.hero.talent.elimination_match.title=дуэль не на жизнь
actors.hero.talent.elimination_match.desc=_+1:_ Если Дуэлянт бросает вызов в течение 3-ёх ходов после конца дуэли, активация способности расходует на _16% меньше_ заряда.\n\n_+2:_ Если Дуэлянт бросает вызов в течение 3-ёх ходов после конца дуэли, активация способности расходует на _30% меньше_ заряда.\n\n_+3:_ Если Дуэлянт бросает вызов в течение 3-ёх ходов после конца дуэли, активация способности расходует на _40% меньше_ заряда.\n\n_+4:_ Если Дуэлянт бросает вызов в течение 3-ёх ходов после конца дуэли, активация способности расходует на _50% меньше_ заряда.

actors.hero.talent.elemental_reach.title=дальность стихии
actors.hero.talent.elemental_reach.desc=_+1:_ Дальность стихийного удара увеличена с 4 до _5 клеток_, а его ширина с 65 до _75 градусов_.\n\n_+2:_ Дальность стихийного удара увеличена с 4 до _6 клеток_, а его ширина с 65 до _85 градусов_.\n\n_+3:_ Дальность стихийного удара увеличена с 4 до _7 клеток_, а его ширина с 65 до _95 градусов_.\n\n_+4:_ Дальность стихийного удара увеличена с 4 до _8 клеток_, а его ширина с 65 до _105 градусов_.
actors.hero.talent.striking_force.title=сила волны
actors.hero.talent.striking_force.desc=_+1:_ Сила стихийного удара увеличена на _30%_.\n\n_+2:_ Сила стихийного удара увеличена на _60%_.\n\n_+3:_ Сила стихийного удара увеличена на _90%_.\n\n_+4:_ Сила стихийного удара увеличена на _120%_.
actors.hero.talent.directed_power.title=направленная сила
actors.hero.talent.directed_power.desc=_+1:_ Прямая атака стихийного удара увеличивает силу зачарований на _30%_ за каждого врага в её радиусе.\n\n_+2:_ Прямая атака стихийного удара увеличивает силу зачарований на _60%_ за каждого врага в её радиусе.\n\n_+3:_ Прямая атака стихийного удара увеличивает силу зачарований на _90%_ за каждого врага в её радиусе.\n\n_+4:_ Прямая атака стихийного удара увеличивает силу зачарований на _120%_ за каждого врага в её радиусе.

actors.hero.talent.feigned_retreat.title=притворное отступление
actors.hero.talent.feigned_retreat.desc=_+1:_ Если враг атакует послеобраз Дуэлянта, она получает _2 хода_ ускорения.\n\n_+2:_ Если враг атакует послеобраз Дуэлянта, она получает _4 хода_ ускорения.\n\n_+3:_ Если враг атакует послеобраз Дуэлянта, она получает _6 ходов_ ускорения.\n\n_+4:_ Если враг атакует послеобраз Дуэлянта, она получает _8 ходов_ ускорения.
actors.hero.talent.expose_weakness.title=слабое место
actors.hero.talent.expose_weakness.desc=_+1:_ Враги, атакующие послеобраз Дуэлянта, становятся слабыми и уязвимыми на _2 хода_.\n\n_+2:_ Враги, атакующие послеобраз Дуэлянта, становятся слабыми и уязвимыми на _4 хода_.\n\n_+3:_ Враги, атакующие послеобраз Дуэлянта, становятся слабыми и уязвимыми на _6 ходов_.\n\n_+4:_ Враги, атакующие послеобраз Дуэлянта, становятся слабыми и уязвимыми на _8 ходов_.
actors.hero.talent.counter_ability.title=контрудар
actors.hero.talent.counter_ability.desc=_+1:_ Если Дуэлянт применяет способность оружия в течение 3 ходов после атаки по её послеобразу, она мгновенно восстанавливает _0,38 заряда_.\n\n_+2:_ Восстанавливает _0,77 заряда_.\n\n_+3:_ Восстанавливает _1,13 заряда_.\n\n_+4:_ Восстанавливает _1,5 заряда_.

#cleric
actors.hero.talent.satiated_spells.title=Пресыщающие заклинания
actors.hero.talent.satiated_spells.desc=_+1:_ После еды следующее заклинание Клирика даёт ему щит прочностью _10% максимального здоровья_ (не менее 3).\n\n_+2:_ Прочность щита составляет _15% максимального здоровья_ (не менее 5).\n\n_+3:_ Прочность щита составляет _20% максимального здоровья_ (не менее 7).
actors.hero.talent.satiated_spells.meta_desc=_Если этот талант получен другим героем_, вместо этого он мгновенно дает щит, который начнет ослабевать через 10 ходов.
actors.hero.talent.holy_intuition.title=интуиция святого
actors.hero.talent.holy_intuition.desc=_+1:_ Клирик может применить _Святую интуицию_: заклинание показывает, проклят ли предмет. Стоимость — _3 заряда_.\n\n_+2:_ Стоимость — _2 заряда_.\n\n_+3:_ Стоимость — _1 заряд_.
actors.hero.talent.holy_intuition.meta_desc=_Если этот талант получен другим героем_, вместо этого он позволит герою выявить проклятие на предмете перед тем, как экипирует его, в 15% случаев при +1 или в 25% случаев при +2.
actors.hero.talent.searing_light.title=слепящий свет
actors.hero.talent.searing_light.desc=_+1:_ Физические атаки Клирика по врагам, освещённым _Путеводным светом_, наносят _+3 урона_. Бонус растёт с уровнем героя.\n\n_+2:_ Наносят _+5 урона_. Бонус растёт с уровнем героя.\n\n_+3:_ Наносят _+7 урона_. Бонус растёт с уровнем героя.
actors.hero.talent.searing_light.meta_desc=_Если этот талант получен другим героем_, вместо этого он будет давать бонусный урон при использовании палочки или артефакта на враге, с перезарядкой в 20 ходов.
actors.hero.talent.shield_of_light.title=щит света
actors.hero.talent.shield_of_light.desc=_+1:_ Клирик может мгновенно применить _Щит света_: на 5 ходов он получает _2–4 единицы брони_ против выбранной цели за _1 заряд_. Защита растёт с уровнем героя.\n\n_+2:_ Получает _3–6 единиц брони_ на тех же условиях. Защита растёт с уровнем героя.\n\n_+3:_ Получает _4–8 единиц брони_ на тех же условиях. Защита растёт с уровнем героя.
actors.hero.talent.shield_of_light.meta_desc=_Если этот талант получает другой герой_, вместо обычного эффекта он с вероятностью _33% на +1_ или _50% на +2_ снижает физический урон от выбранного врага на _1 единицу плюс 1 за каждые 10 уровней героя_.

actors.hero.talent.enlightening_meal.title=Освещающий обед
actors.hero.talent.enlightening_meal.desc=_+1:_ Клирик тратит на еду 1 ход и восстанавливает _0,67 заряда_ священного тома.\n\n_+2:_ Восстанавливает _1 заряд_.\n\n_+3:_ Восстанавливает _1,33 заряда_.
actors.hero.talent.enlightening_meal.meta_desc=_Если этот талант получен другим героем_, вместо этого он дает 2 хода перезарядки палочек и артефактов при +1 или 3 хода при +2. Этот талант не позволяет рогу изобилия перезаряжать самого себя.
actors.hero.talent.recall_inscription.title=Воспоминание начертания
actors.hero.talent.recall_inscription.refunded=Ваш предмет был возвращен!
actors.hero.talent.recall_inscription.desc=_+1:_ Клирик может применить _Воспоминание начертания_: заклинание повторяет эффект последнего использованного рунного камня или свитка, если с его применения прошло не более _10 ходов_.\n\n_+2:_ Повторить эффект можно в течение _300 ходов_.\n\n_+3:_ Повторить эффект можно в течение _1000 ходов_.\n\nЭтим заклинанием нельзя повторять свитки улучшения. Стоимость — 2 заряда за рунный камень, 3 за обычный свиток и 4 за экзотический. При повторении свитка превращения или алхимического предмета, изготовленного из свитков превращения либо улучшения, стоимость удваивается.
actors.hero.talent.recall_inscription.meta_desc=_Если этот талант получен другим героем_, вместо этого он вернет любой свиток или рунный камень в 10% случаев при +1 или в 15% случаев при +2. Этот эффект не распространяется на свитки улучшения.
actors.hero.talent.sunray.title=Солнечный луч
actors.hero.talent.sunray.desc=_+1:_ Клирик может применить _Солнечный луч_: заклинание за _1 заряд_ наносит _4–8 урона_ и ослепляет цель на _4 хода_. Урон растёт с уровнем героя.\n\n_+2:_ Наносит _6–12 урона_ и ослепляет на _6 ходов_. Урон растёт с уровнем героя.\n\n_+3:_ Наносит _8–16 урона_ и ослепляет на _8 ходов_. Урон растёт с уровнем героя.\n\nСолнечный луч может ослепить каждую цель только один раз. При повторном попадании по уже ослеплённой этим лучом цели он вместо этого парализует её. По нежити и демонам луч всегда наносит максимальный урон.
actors.hero.talent.sunray.meta_desc=_Если этот талант получен другим героем_, вместо этого он позволит иногда палочкам и артефакты ослеплять врагов на 4 хода, в 15% случаев при +1 или 25% случаев при +2.
actors.hero.talent.divine_sense.title=Божественное чувство
actors.hero.talent.divine_sense.desc=_+1:_ Клирик может мгновенно применить _Божественное чутьё_: на 50 ходов он получает ментальное зрение в радиусе _8 клеток_. Стоимость — _2 заряда_.\n\n_+2:_ Радиус зрения составляет _12 клеток_.\n\n_+3:_ Радиус зрения составляет _16 клеток_.
actors.hero.talent.divine_sense.meta_desc=_Если этот талант получен другим героем_, вместо этого он дает Ментальное зрение на короткое время после использования палочки или артефакта в пределах 3 клеток при +1 или 5 клеток при +2.
actors.hero.talent.bless.title=Благословение
actors.hero.talent.bless.desc=_+1:_ Клирик может применить _Благословение_ за 1 заряд. На себя: _6 ходов благословения и 10 единиц щита_. На другого персонажа: _10 ходов благословения и 10 единиц исцеления_. Щит и исцеление усиливаются с ростом уровня героя.\n\n_+2:_ На себя: _10 ходов благословения и 15 единиц щита_. На другого: _15 ходов благословения и 15 единиц исцеления_.\n\n_+3:_ На себя: _14 ходов благословения и 20 единиц щита_. На другого: _20 ходов благословения и 20 единиц исцеления_.\n\nИзбыточное исцеление превращается в щит.
actors.hero.talent.bless.meta_desc=_Если этот талант получен другим героем_, вместо этого он увеличит точность и уклонение героя и всех союзников на 3% при +1 или на 5% при +2.

actors.hero.talent.cleanse.title=Очищение
actors.hero.talent.cleanse.desc=_+1:_ Клирик может применить _Очищение_ за 2 заряда: оно _снимает отрицательные эффекты_ с Клирика и ближайших союзников и даёт им щит прочностью _12% максимального здоровья Клирика_ (не менее 10).\n\n_+2:_ Очищение наделяет Клирика и ближайших союзников _иммунитетом к отрицательным эффектам на 3 хода_ и щитом прочностью _24% максимального здоровья Клирика_ (не менее 20). Стоимость — 2 заряда.\n\n_+3:_ Иммунитет длится _5 ходов_, прочность щита составляет _36% максимального здоровья Клирика_ (не менее 30). Стоимость — 2 заряда.
actors.hero.talent.cleanse.meta_desc=_Если этот талант получен другим героем_, вместо этого он при использовании палочки или артефакта, может очистит героя от негативных эффектов, в 10/20/30% случаев при +1/+2/+3.
actors.hero.talent.light_reading.title=Светлое чтение
actors.hero.talent.light_reading.desc=_+1:_ Клирик может пользоваться священным томом, не экипируя его, но вне экипировки тот восстанавливает заряды лишь с _25% обычной скорости_.\n\n_+2:_ Скорость восстановления зарядов составляет _50% обычной_.\n\n_+3:_ Скорость восстановления зарядов составляет _75% обычной_.
actors.hero.talent.light_reading.meta_desc=_Если этот талант получен другим героем_, вместо этого он увеличит скорость зарядки всех палочек на 7/13/20% при +1/+2/+3.

actors.hero.talent.holy_lance.title=Священное копьё
actors.hero.talent.holy_lance.desc=_+1:_ Жрец может применить _Священное копьё_ за 4 заряда. Заклинание наносит _30–55 урона_; после 12-го уровня урон растёт вместе с уровнем героя.\n\n_+2:_ Наносит _45–82 урона_ и усиливается после 12-го уровня героя. Стоимость — 4 заряда.\n\n_+3:_ Наносит _60–110 урона_ и усиливается после 12-го уровня героя. Стоимость — 4 заряда.\n\nСвященное копьё всегда наносит максимальный урон нежити и демонам. Повторное применение возможно через _30 ходов_.
actors.hero.talent.hallowed_ground.title=Священная земля
actors.hero.talent.hallowed_ground.desc=_+1:_ Жрец может применить _Священную землю_ за 2 заряда, освятив область _3×3 клетки_ на 20 ходов.\n\n_+2:_ Размер освящённой области увеличивается до _5×5 клеток_. Длительность — 20 ходов, стоимость — 2 заряда.\n\n_+3:_ Размер области увеличивается до _7×7 клеток_. Длительность — 20 ходов, стоимость — 2 заряда.\n\nПри создании Священная земля восстанавливает союзникам 15 ОЗ, ненадолго обездвиживает врагов и выращивает низкую траву. Затем она постепенно исцеляет союзников, накладывает хромоту на врагов и время от времени порождает высокую траву. Вместо исцеления Жрец получает щит. Огонь уничтожает освящённую область.
actors.hero.talent.mnemonic_prayer.title=Мнемоническая молитва
actors.hero.talent.mnemonic_prayer.desc=_+1:_ Жрец может использовать заклинание _Мнемоническую молитву_, которое продлевает положительные или негативные эффекты на союзнике/враге на _3 хода_ за 1 заряд.\n\n_+2:_ Жрец может использовать заклинание _Мнемоническую молитву_, которое продлевает положительные или негативные эффекты на союзнике/враге на _4 хода_ за 1 заряд.\n\n_+3:_ Жрец может использовать заклинание _Мнемоническую молитву_, которое продлевает положительные или негативные эффекты на союзнике/враге на _5 ходов_ за 1 заряд.\n\nМнемоническая молитва не тратит время на применение. Мнемоническая молитва может продлить определенный положительный/негативный эффект и не может продлить положительные эффекты, полученные от способностей брони.

actors.hero.talent.lay_on_hands.title=Наложение рук
actors.hero.talent.lay_on_hands.desc=_+1:_ Паладин может мгновенно применить _Наложение рук_ за 1 заряд: исцелить соседнего персонажа на _18% собственного максимального здоровья_ (не менее 15 ОЗ) или дать себе щит той же прочности.\n\n_+2:_ Исцеление или щит составляют _24% максимального здоровья Паладина_ (не менее 20 ОЗ). Стоимость — 1 заряд.\n\n_+3:_ Исцеление или щит составляют _30% максимального здоровья Паладина_ (не менее 25 ОЗ). Стоимость — 1 заряд.\n\nИзбыточное исцеление превращается в щит. Наложение рук можно применять подряд, но накопленный щит не может превышать величину, получаемую за три применения.
actors.hero.talent.aura_of_protection.title=Аура защиты
actors.hero.talent.aura_of_protection.desc=_+1:_ Паладин может применить _Ауру защиты_ за 2 заряда. На 20 ходов Паладин и все союзники в радиусе 2 клеток получают _20% сопротивления урону_, а руна на броне Паладина действует на них с _+50% мощности_.\n\n_+2:_ Сопротивление урону возрастает до _30%_, а бонус к мощности руны — до _+75%_.\n\n_+3:_ Сопротивление урону возрастает до _40%_, а бонус к мощности руны — до _+100%_. Дальность, время действия и стоимость не меняются.
actors.hero.talent.wall_of_light.title=стена света
actors.hero.talent.wall_of_light.desc=_+1:_ Паладин может использовать заклинание _Стена света,_ которое создает перед Паладином сплошную стену с шириной в _3 клетки_, отталкивающую врагов на 20 ходов, за 3 заряда.\n\n_+2:_ Паладин может использовать заклинание _Стена света,_ которое создает перед Паладином сплошную стену с шириной в _5 клеток_, отталкивающую врагов на 20 ходов, за 3 заряда.\n\n_+3:_ Паладин может использовать заклинание _Стена света,_ которое создает перед Паладином сплошную стену с шириной в _7 клеток_, отталкивающую врагов на 20 ходов, за 3 заряда.\n\nСтена света может быть размещена по сторонам или по диагонали, и одновременно может существовать только одна стена света.

actors.hero.talent.divine_intervention.title=божественное вмешательство
actors.hero.talent.divine_intervention.desc=_+1:_ В Вознесённой форме Клирик может применить _Божественное вмешательство_: увеличить щит себе и всем союзникам до _120% собственного максимального здоровья_ (не менее 150) и продлить Вознесённую форму на _3 хода_.\n\n_+2:_ Щит увеличивается до _160% максимального здоровья_ (не менее 200), форма продлевается на _4 хода_.\n\n_+3:_ Щит увеличивается до _200% максимального здоровья_ (не менее 250), форма продлевается на _5 ходов_.\n\n_+4:_ Щит увеличивается до _240% максимального здоровья_ (не менее 300), форма продлевается на _6 ходов_.\n\nБожественное вмешательство стоит 5 зарядов священного тома и доступно только один раз за каждое превращение в Вознесённую форму.
actors.hero.talent.judgement.title=приговор
actors.hero.talent.judgement.desc=_+1:_ В Вознесённой форме Клирик может применить _Приговор_, наносящий _10–20 урона_ всем видимым врагам.\n\n_+2:_ Приговор наносит _15–30 урона_.\n\n_+3:_ Приговор наносит _20–40 урона_.\n\n_+4:_ Приговор наносит _25–50 урона_.\n\nПосле 20-го уровня урон возрастает на _5% за каждый уровень героя_. Приговор стоит 3 заряда тома и наносит на _33% больше урона_ за каждое заклинание, применённое с начала Вознесённой формы или после предыдущего Приговора.
actors.hero.talent.flash.title=вспышка
actors.hero.talent.flash.desc=_+1:_ В Вознесённой форме Клирик может применить _Вспышку_, чтобы телепортироваться на расстояние до _3 клеток_.\n\n_+2:_ Дальность телепортации возрастает до _4 клеток_.\n\n_+3:_ Дальность телепортации возрастает до _5 клеток_.\n\n_+4:_ Дальность телепортации возрастает до _6 клеток_.\n\nПервое применение «Вспышки» в одной Вознесённой форме расходует 2 заряда тома, каждое следующее — на 1 заряд больше предыдущего.

actors.hero.talent.body_form.title=телесная форма
actors.hero.talent.body_form.desc=Клирик может использовать заклинание _Телесная форма_, наделяя Троицу силой зачарований и рун, которые Клирик обнаружил в своем путешествии, затрачивая на это 2 заряда.\n\n_+1:_ Когда Клирик применяет Троицу, он получает выбранный эффект на _20 ходов_.\n\n_+2:_ Когда Клирик применяет Троицу, он получает выбранный эффект на _27 ходов_.\n\n_+3:_ Когда Клирик применяет Троицу, он получает выбранный эффект на _33 хода_.\n\n_+4:_ Когда Клирик применяет Троицу, он получает выбранный эффект на _40 ходов_.\n\nТроица может быть одновременно наделена только одним эффектом Телесной формы. Стоимость заряда брони с Троицей становится выше, если выбранная руна была редкая и мощная.
actors.hero.talent.mind_form.title=ментальная форма
actors.hero.talent.mind_form.desc=Клирик может использовать заклинание _Ментальная форма_, наделяя Троицу силой палочки или метательного оружия, которое Клирик использовал в своем путешествии, затрачивая на это 3 заряда.\n\n_+1:_ Когда Клирик применяет Троицу, он использует эффект выстрела или броска у выбранного предмета, как если бы оно было _+3._\n\n_+2:_ Когда Клирик применяет Троицу, он использует эффект выстрела или броска у выбранного предмета, как если бы оно было _+4._\n\n_+3:_ Когда Клирик применяет Троицу, он использует эффект выстрела или броска у выбранного предмета, как если бы оно было _+5._\n\n_+4:_ Когда Клирик применяет Троицу, он использует эффект выстрела или броска у выбранного предмета, как если бы оно было _+6._\n\nТроица может быть одновременно наделена только одним эффектом Ментальной формы.
actors.hero.talent.spirit_form.title=духовная форма
actors.hero.talent.spirit_form.desc=Клирик может применить _Духовную форму_ за _4 заряда_, чтобы наделить Троицу свойствами кольца или артефакта, опознанного в текущем забеге (кроме священного тома).\n\n_+1:_ При использовании Троицы Клирик получает эффект кольца уровня _+1_ на 20 ходов или применяет эффект артефакта уровня _+4_.\n\n_+2:_ Эффект кольца действует на уровне _+2_ в течение 20 ходов, а эффект артефакта — на уровне _+6_.\n\n_+3:_ Эффект кольца действует на уровне _+3_ в течение 20 ходов, а эффект артефакта — на уровне _+8_.\n\n_+4:_ Эффект кольца действует на уровне _+4_ в течение 20 ходов, а эффект артефакта — на уровне _+10_.\n\nОдновременно Троица может хранить лишь один духовный эффект. Артефакты дают разные эффекты и расходуют разное количество зарядов брони при применении через Троицу.

actors.hero.talent.beaming_ray.title=сияющий луч
actors.hero.talent.beaming_ray.desc=Клирик может выпустить _Сияющий луч_ из усиленного союзника за 1 заряд. Луч проходит сквозь стены и телепортирует союзника в выбранную точку. Если там находится враг, союзник появится рядом с ним и начнёт его атаковать. Луч способен перемещать даже неподвижных союзников, но в таком случае его дальность сокращается вдвое.\n\n_+1:_ Дальность — до _4 клеток_. На 10 ходов бонус урона от Силы многих против ближайшего врага увеличивается до _+35%_.\n\n_+2:_ Дальность — до _8 клеток_. Бонус урона увеличивается до _+40%_ на 10 ходов.\n\n_+3:_ Дальность — до _12 клеток_. Бонус урона увеличивается до _+45%_ на 10 ходов.\n\n_+4:_ Дальность — до _16 клеток_. Бонус урона увеличивается до _+50%_ на 10 ходов.
actors.hero.talent.life_link.title=узы жизни
actors.hero.talent.life_link.desc=Клирик может наложить _Узы жизни_ на себя и усиленного союзника за 2 заряда. Они будут делить получаемый урон, а положительные заклинания Клирика третьей ступени и ниже будут действовать на обоих, если хотя бы один попадает под их эффект.\n\n_+1:_ Узы действуют _10 ходов_, а бонус _Силы многих_ к защите увеличивается до _−35% получаемого урона_.\n\n_+2:_ Действуют _13 ходов_, бонус — _−40% получаемого урона_.\n\n_+3:_ Действуют _17 ходов_, бонус — _−45% получаемого урона_.\n\n_+4:_ Действуют _20 ходов_, бонус — _−50% получаемого урона_.
actors.hero.talent.stasis.title=Стазис
actors.hero.talent.stasis.desc=Клирик может за 2 заряда наложить _Стазис_ на усиленного союзника. Союзник временно исчезнет из подземелья, а оставшееся время всех действующих на него эффектов, включая Силу многих, сохранится. По окончании стазиса он вновь появится рядом с вами. Заклинание можно мгновенно и бесплатно применить повторно, чтобы завершить стазис раньше. Оно действует даже на неподвижных союзников, но не позволяет перемещать их между этажами.\n\n_+1:_ Максимальная длительность стазиса — _60 ходов_.\n\n_+2:_ _90 ходов_.\n\n_+3:_ _120 ходов_.\n\n_+4:_ _150 ходов_.\n\nПока союзник находится в стазисе, Клирик может призвать его обратно Сияющим лучом или заранее наложить на него Узы жизни. Однако до выхода из стазиса польза от Уз жизни на союзника не распространяется.


#universal
actors.hero.talent.heroic_energy.title=героическая энергия
actors.hero.talent.heroic_energy.rat_title=крысоическая энергия
actors.hero.talent.heroic_energy.desc=_+1:_ Способность брони героя имеет сниженную стоимость заряда _на 12%_.\n\n_+2:_ Способность брони героя имеет сниженную стоимость заряда _на 23%_.\n\n_+3:_ Способность брони героя имеет сниженную стоимость заряда _на 32%_.\n\n_+4:_ Способность брони героя имеет сниженную стоимость заряда _на 40%_.

actors.hero.talent.ratsistance.title=крысопротивление
actors.hero.talent.ratsistance.desc=_+1:_ Враждебные крысоморфизированные враги наносят на _-10% меньше урона_.\n\n_+2:_ Враждебные крысоморфизированные враги наносят на _-19% меньше урона_.\n\n_+3:_ Враждебные крысоморфизированные враги наносят на _-27% меньше урона_.\n\n_+4:_ Враждебные крысоморфизированные враги наносят на _-35% меньше урона_.
actors.hero.talent.ratlomacy.title=крысоматия
actors.hero.talent.ratlomacy.desc=_+1:_ Использование крысоморфоза на крысоморфизированном враге делает его дружелюбным и делает трансформацию постоянной.\n\n_+2:_ Использование крысоморфоза на крысоморфизированном враге делает его дружелюбным, делает трансформацию постоянной и дает ему адреналин на _2 хода_.\n\n_+3:_ Использование крысоморфоза на крысоморфизированном враге делает его дружелюбным, делает трансформацию постоянной и дает ему адреналин на _4 хода_.\n\n_+4:_ Использование крысоморфоза на крысоморфизированном враге делает его дружелюбным, делает трансформацию постоянной и дает ему адреналин на _6 ходов_.
actors.hero.talent.ratforcements.title=крысокрепление
actors.hero.talent.ratforcements.desc=_+1:_ При использовании крысоморфоза на себе _появляется 1_ союзная сумчатая крыса рядом с вами.\n\n_+2:_ При использовании крысоморфоза на себе _появляются 2_ союзные сумчатые крысы рядом с вами.\n\n_+3:_ При использовании крысоморфоза на себе _появляются 3_ союзные сумчатые крысы рядом с вами.\n\n_+4:_ При использовании крысоморфоза на себе _появляются 4_ союзные сумчатые крысы рядом с вами.



###npcs
actors.mobs.npcs.blacksmith.name=тролль-кузнец
actors.mobs.npcs.blacksmith.intro_quest_warrior=Эй, человек! А ты, гляжу, крепкий.
actors.mobs.npcs.blacksmith.intro_quest_mage=Эй, человек! А ты, гляжу, смышлёный.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Эй, человек! А ты, гляжу, хитрый.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Эй, человек! А ты, гляжу, шустрая.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Эй, человек! А ты, гляжу, смелый.
actors.mobs.npcs.blacksmith.intro_quest_cleric=Эй, человек! А ты, гляжу, важная птица.
actors.mobs.npcs.blacksmith.intro_quest_start=Хочешь делом заняться, а? Есть у меня работёнка. Я тут мастерскую над старой шахтой поставил — спуск вон по той лестнице. Бери кирку и накопай мне _тёмного золота. Штук 40 руды_ хватит. Порода там мягкая, так что _при желании сможешь прокопаться прямо сквозь стены._\n\nЧего? Как я платить буду? Ну и жадина...\n\nЛадно, ладно. Выкую тебе кое-что в награду. Считай, повезло: других кузнецов здесь нет.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Ты там поосторожнее: шахта — опасное место для такого человечка, как ты. Давно её забросили, вот и разрослись внизу кристаллы. Блестят красиво, да больно хрупкие — ничего не стоят. А охраняют их какие-то магические твари, и вот они уже крепкие. Так что _смотри, где копаешь_, а то привлечёшь их внимание.\n\nГде-то там есть ещё _гигантский кристалл_. Он куда прочнее остальных, так что, если вздумаешь его разбить, готовься к драке. Держу пари, без него остальные кристаллы станут расти медленнее. Справишься — доплачу.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Ты там поосторожнее: шахта — опасное место для такого человечка, как ты. Гноллы тоже позарились на золото и теперь всё там разносят. Ума у них немного: нарыли как попало, вот и обвалы пошли. Придётся прокладывать себе путь, так что _ищи места, где породу недавно потревожили._\n\nКажись, больше всех бед натворил один гнолл. Наверное, _шаман-геомант_ или кто-то вроде него. Убьёшь — доплачу. Только учти: он наверняка даст сдачи.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Ты там поосторожнее: шахта — опасное место для такого человечка, как ты. Внизу разрослось какое-то грибное чудище. Вокруг него грибы-стражи: заметят — мало не покажется. Хорошо хоть с места не двигаются и в погоню не бросаются. _Держись вне их поля зрения_, если жить хочешь.\n\nДоплачу, если уничтожишь _самый большой гриб_, но повозиться придётся. Живучее этой твари там ничего нет, так что _захвати оружие помощнее_ и не давай стражам подобраться, пока будешь рубить гриб.
actors.mobs.npcs.blacksmith.reminder=Хорош отвлекать меня! Вход в шахту вон там.
actors.mobs.npcs.blacksmith.reminder_crystal=Принеси побольше тёмного золота да попробуй разбить гигантский кристалл. Доплачу, лады?
actors.mobs.npcs.blacksmith.reminder_gnoll=Принеси побольше тёмного золота да попробуй прикончить шамана-геоманта. Доплачу, лады?
actors.mobs.npcs.blacksmith.reminder_fungi=Принеси побольше тёмного золота да попробуй уничтожить гигантский гриб. Доплачу, лады?
actors.mobs.npcs.blacksmith.lost_pick=Ты издеваешься?! Где моя кирка?
actors.mobs.npcs.blacksmith.quest_start_prompt=Готов спуститься? Смотри, чтоб у тебя осталось немного места для золота.\n\n_Вниз я тебя пущу всего один раз!_
actors.mobs.npcs.blacksmith.enter_yes=Готов
actors.mobs.npcs.blacksmith.enter_no=Погоди
actors.mobs.npcs.blacksmith.exit_warn_none=Уже все? Да у тебя золота-то вовсе и нет! Хотя бы _штук 40_ ты ведь сможешь запросто достать!\n\n_Смотри, я больше тебя туда не пущу, раз ты уж вылез обратно._
actors.mobs.npcs.blacksmith.exit_warn_low=Уже все? Не похоже на то, будто у тебя там особо много золота. Хотя бы _штук 40_ ты ведь сможешь запросто достать!\n\n_Смотри, я больше тебя туда не пущу, раз ты уж вылез обратно._
actors.mobs.npcs.blacksmith.exit_warn_med=Уже все? Ну, золото-то у тебя вроде есть, но в шахте там наверняка есть еще! Хотя бы _штук 40_ ты ведь сможешь запросто достать!\n\n_Смотри, я больше тебя туда не пущу, раз ты уж вылез обратно._
actors.mobs.npcs.blacksmith.exit_warn_high=Уже закончил? Золота у тебя немало, но мне бы ещё побольше. _Штук 40_ точно можно накопать.\n\n_Запомни: как поднимешься, второй раз я тебя в шахту не пущу._
actors.mobs.npcs.blacksmith.exit_warn_full=Уже все? Золота у тебя куча, но смотри, чтобы там не осталось чего-нибудь из твоих принадлежностей.\n\n_Смотри, я больше тебя туда не пущу, раз ты уж вылез обратно._
actors.mobs.npcs.blacksmith.exit_warn_crystal=Гигантский кристалл ещё цел. Разобьёшь его — доплачу.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=Шаман-геомант ещё жив. Убьёшь его — доплачу.
actors.mobs.npcs.blacksmith.exit_warn_fungi=Гигантский гриб ещё цел. Уничтожишь его — доплачу.
actors.mobs.npcs.blacksmith.exit_yes=Довольно
actors.mobs.npcs.blacksmith.exit_no=Погоди
actors.mobs.npcs.blacksmith.get_lost=Я занят. Исчезни!
actors.mobs.npcs.blacksmith.entrance_blocked=Спуск заблокирован.
actors.mobs.npcs.blacksmith.cant_enter_old=Эта область недоступна в настоящем забеге. Начните новую игру, чтобы попробовать новое задание!
actors.mobs.npcs.blacksmith.def_verb=блокирует
actors.mobs.npcs.blacksmith.desc=Высокий, худощавый, с кожей цвета и фактуры камня — этот кузнец похож на любого другого тролля. Сейчас он возится с инструментами, которые в его огромных руках кажутся совсем крошечными.

actors.mobs.npcs.ghost.name=печальный призрак
actors.mobs.npcs.ghost.rat_1=Здравствуй, %s... Когда-то я был таким же, как ты: сильным и уверенным в себе... Но меня погубила отвратительная тварь... Я не могу покинуть это место... Пока не отомщу... Убей _вонючую крысу_, отнявшую мою жизнь...\n\nОна бродит по этому этажу... Повсюду оставляет грязь и смрад... _Берегись облака вони и едкого укуса... Кислоту можно смыть водой..._
actors.mobs.npcs.ghost.rat_2=Прошу... Помоги мне... Убей чудовище...\n\n_Сражайся в воде... Избегай вони..._
actors.mobs.npcs.ghost.gnoll_1=Здравствуй, %s... Когда-то я был таким же, как ты: сильным и уверенным в себе... Но меня убил коварный враг... Я не могу покинуть это место... Пока не отомщу... Убей _гнолла-трикстера_, отнявшего мою жизнь...\n\nОн не похож на других гноллов... Прячется и бросает оружие издали... _Берегись его ядовитых и зажигательных дротиков... Не пытайся сражаться на расстоянии..._
actors.mobs.npcs.ghost.gnoll_2=Прошу... Помоги мне... Убей трикстера...\n\n_Не дай ему попасть по тебе... Подберись поближе..._
actors.mobs.npcs.ghost.crab_1=Здравствуй, %s... Когда-то я был таким же, как ты: сильным и уверенным в себе... Но меня убило древнее существо... Я не могу покинуть это место... Пока не отомщу... Убей _древнего краба_, отнявшего мою жизнь...\n\nОн невероятно стар... У него огромная клешня и прочный панцирь... _Берегись клешни... Нападай внезапно, иначе он заблокирует удар..._
actors.mobs.npcs.ghost.crab_2=Прошу... Помоги мне... Убей краба...\n\n_Если он видит твою атаку... То обязательно её заблокирует..._
actors.mobs.npcs.ghost.find_me=Спасибо тебе... Найди меня...
actors.mobs.npcs.ghost.desc=Призрак еле виден. Он похож на бесформенный источник слабого света с грустным лицом.

actors.mobs.npcs.imp.name=предприимчивый бес
actors.mobs.npcs.imp.old_intro=Ты путешественник? Я люблю путешественников! На них всегда можно положиться, если надо кого-то убить, правда же? Естественно, за вознаграждение ;)
actors.mobs.npcs.imp.old_golems_1=В моем случае надо убить _големов._ Понимаешь, я тут бизнес небольшой открыть хочу, но эти тупые големы мешают продажам! Очень сложно спорить с бродячими гранитными бандурами, бес их побери! Пожалуйста, убей хотя бы _4 голема_, и награда твоя.
actors.mobs.npcs.imp.old_monks_1=Мне нужно разобраться с _монахами_. Понимаешь, я хочу открыть тут небольшое дело, а эти фанатики сами ничего не покупают да ещё и клиентов распугивают. Убей, скажем, _пятерых_ — и получишь награду.
actors.mobs.npcs.imp.old_golems_2=Как там твоё сафари на големов, м? Не забывай жетоны собирать.
actors.mobs.npcs.imp.old_monks_2=Ого, да ты живее всех живых! Я знал, в кунг-фу им до тебя далеко ;) Не забывай только собирать жетоны.
actors.mobs.npcs.imp.cya=Увидимся, %s!
actors.mobs.npcs.imp.hey=Псст, %s!
actors.mobs.npcs.imp.quest_intro_1=О, привет! Ты искатель приключений? Обожаю искателей приключений! На них всегда можно положиться, когда нужна помощь. За достойную награду, разумеется ;)\n\nПеред нами огромное дворфское хранилище, набитое редкими артефактами. Я, знаешь ли, коллекционер, и там есть одна статуэтка, которую мне очень хочется заполучить.\n\nТолько вот хранилище полно стражей и ловушек. Без твоей помощи не обойтись!
actors.mobs.npcs.imp.quest_intro_2=Хранилище запечатано магией. Я подготовил заклинание и могу перенести тебя внутрь, но _переместить вместе с тобой снаряжение не смогу._ Впрочем, добычи там должно хватать. _Для начала советую избегать врагов и искать предметы, которые охраняют не слишком тщательно._\n\nЯ смогу вернуть тебя обратно с двумя вещами: одна — моя статуэтка, а второй может стать _любой понравившийся тебе предмет из хранилища!_\n\nКстати, у меня скопилось немало ценностей на продажу. Поможешь — _открою лавку чуть глубже в подземелье_, и поторгуемся.
actors.mobs.npcs.imp.quest_in_progress=Просто встань в центр входа в хранилище, когда будешь готов, и я перемещу тебя внутрь.
actors.mobs.npcs.imp.enter_text=Готов? Я присмотрю за твоими вещами здесь, наверху. _Когда вернёшься, получишь всё обратно._\n\nА с собой возьми _тканую броню_ и _кристалл телепортации_. Используй кристалл, когда добудешь мою статуэтку. Хотя... _если попадёшь в беду, можешь воспользоваться им раньше_, но на полную награду тогда не рассчитывай!\n\nВ хранилище давно никого не было, поэтому враги там, вероятно, медлительнее обычного. Прятаться будет проще, особенно если _держаться позади врагов, пока они патрулируют помещение._ Даже если тебя заметят, _мимолётного взгляда им, скорее всего, не хватит, чтобы броситься в погоню._ А если прислушаться, можно _услышать шаги поблизости._
actors.mobs.npcs.imp.quest_completed_bad=В любом случае, спасибо за попытку.\n\nЗаклинание, открывающее хранилище, будет ещё долго перезаряжаться, поэтому тебе лучше идти своей дорогой.
actors.mobs.npcs.imp.quest_completed_good=Спасибо за помощь!\n\nМне понадобится время, чтобы снова подготовить заклинание телепортации и продумать дальнейшие действия с учётом того, что ты рассказал.\n\nПойду соберу вещи. Увидимся чуть глубже в подземелье! Правда, золото мне по-прежнему нужно, так что бесплатно товары не раздаю ;)
actors.mobs.npcs.imp.quest_completed_great=Отличная работа! Огромное спасибо!\n\nТеперь у меня есть всё, что нужно. Соберу вещи — и увидимся чуть глубже в подземелье. Правда, золото мне по-прежнему нужно, так что бесплатно товары не раздаю ;)\n\nЧем так важна эта статуэтка? Да ничем особенным, как ни странно. Это самая обычная вещица из далёкой страны, которой больше не существует. Возможно, последняя в своём роде. Если бы не жадные дворфы, её наверняка уничтожили бы вместе со всем остальным...
actors.mobs.npcs.imp.enter_yes=Спуститься в хранилище
actors.mobs.npcs.imp.enter_no=Остаться здесь
actors.mobs.npcs.imp.desc=Этот маленький краснокожий человечек похож на беса. Бесы — низшие демоны, больше известные умом, чем силой.\n\nПрежде вы слышали о демонах только в старинных сказках. Обычно их описывают как пришельцев из другого мира, но вам ни разу не попадалось доказательств их существования. А этот бес, похоже, вполне настоящий — и очень рад вас видеть.

actors.mobs.npcs.impshopkeeper.name=предприимчивый бес
actors.mobs.npcs.impshopkeeper.greetings=Привет, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=Что ты сделал, %s? Быстрее покупай, мне нужно выбираться отсюда!
actors.mobs.npcs.impshopkeeper.thief=Я думал, что могу доверять тебе!
actors.mobs.npcs.impshopkeeper.buyback=Бес с радостью возвращает ваш товар.
actors.mobs.npcs.impshopkeeper.desc=Этот бес открыл маленький магазинчик на границе внутренних залов. Приятно видеть дружелюбное лицо, но его цены определенно не кажутся такими же дружелюбными.

actors.mobs.npcs.mirrorimage.name=зеркальная копия
actors.mobs.npcs.mirrorimage.desc=Эта иллюзия очень похожа на вас: кажется, будто у неё такое же оружие и броня.\n\nЗеркальные копии ищут врагов и атакуют их подобием вашего оружия. Оно действует похоже на настоящее, но наносит меньше урона. Сначала копии почти невидимы, однако, чтобы атаковать, им приходится принимать более заметный облик.\n\nПри всей своей боевой силе копии не выдерживают урона и исчезают от первого же попадания.
actors.mobs.npcs.mirrorimage.discover_hint=Вы можете найти этого персонажа с помощью определённого свитка.

actors.mobs.npcs.npc.discover_hint=Вы можете найти этого персонажа в определённом регионе подземелья.

actors.mobs.npcs.prismaticimage.name=радужная копия
actors.mobs.npcs.prismaticimage.desc=Эта мерцающая иллюзия имеет с вами близкое сходство, вплоть до вашего оружия и брони.\n\nРадужные копии попытаются оттянуть на себя внимание врагов. Хотя они и не так хороши в атаке, как зеркальные копии, зато они имеют повышенную прочность и получают преимущества вашей брони.\n\nЕсли здоровье копии упадёт до нуля, она исчезнет в течение нескольких ходов. В это время её всё ещё можно исцелить. Когда поблизости не остаётся врагов, радужные копии исчезают и воссоединяются со своим хозяином.
actors.mobs.npcs.prismaticimage.discover_hint=Вы можете найти этого персонажа с помощью определённого свитка.

actors.mobs.npcs.ratking.name=крысиный король
actors.mobs.npcs.ratking.not_sleeping=Я не сплю!
actors.mobs.npcs.ratking.what_is_it=Ну что ещё? У меня нет времени на эти глупости. Королевство само собой не будет управлять!
actors.mobs.npcs.ratking.confused=Чт... Где я? Моё королевство нуждается во мне!
actors.mobs.npcs.ratking.crown_clothes=Оденься! Не подобает простолюдину в таком виде разговаривать с членами королевской семьи!
actors.mobs.npcs.ratking.crown_desc=Оооо, эта корона для меня?! Она выглядит гораздо более блестящей, чем моя, поэтому я милостиво её принимаю!\n\nНа самом деле, я думаю, что могу предложить тебе кое-что в качестве награды за эту корону. Огромная сила, подобающая такому герою, как ты! Тебе бы это понравилось?
actors.mobs.npcs.ratking.crown_yes=Конечно!
actors.mobs.npcs.ratking.crown_info=Сперва расскажи, о чем это.
actors.mobs.npcs.ratking.crown_no=Нет, не надо...
actors.mobs.npcs.ratking.crown_thankyou=Хе-хе-хе, спасибо! А теперь иди и сделай так, чтобы твой король гордился тобой!
actors.mobs.npcs.ratking.crown_fine=Ладно! Не то, чтобы я этого хотел...
actors.mobs.npcs.ratking.crown_after=Наслаждаешься своей новой броней? Никаких возвратов!
actors.mobs.npcs.ratking.desc_crown=Эта крыса немного больше, чем обычная сумчатая крыса. Она носит на голове корону Короля Дворфов.
actors.mobs.npcs.ratking.desc_birthday=Эта крыса немного больше, чем обычная сумчатая крыса. Она носит небольшой зеленый праздничный колпак, вместо обычно короны. Счастливого дня рождения, Крысиному королю!
actors.mobs.npcs.ratking.desc_winter=Эта крыса немного больше, чем обычная сумчатая крыса. Она носит небольшой праздничный колпак, вместо обычно короны. Счастливых праздников!
actors.mobs.npcs.ratking.desc=Эта крыса немного больше, чем обычная сумчатая крыса. Она носит на голове небольшую корону.
actors.mobs.npcs.ratking.discover_hint=Вы можете найти этого персонажа в конце определённого региона подземелья.

actors.mobs.npcs.sheep.name=овца
actors.mobs.npcs.sheep.baa!=Бээ!
actors.mobs.npcs.sheep.baa?=Мээ?
actors.mobs.npcs.sheep.baa.=Бээ.
actors.mobs.npcs.sheep.baa...=Мээ...
actors.mobs.npcs.sheep.def_verb=блокирует
actors.mobs.npcs.sheep.desc=Это волшебная овца. Что в ней волшебного? Её нельзя убить. Она будет тут стоять, пока волшебным образом не исчезнет, жуя жвачку с пустым взглядом.
actors.mobs.npcs.sheep.discover_hint=Вы можете найти этого персонажа с помощью определённого предмета или ловушки.

actors.mobs.npcs.shopkeeper.name=торговец
actors.mobs.npcs.shopkeeper.thief=Держи вора!
actors.mobs.npcs.shopkeeper.warn=А ну руки! Последнее предупреждение.
actors.mobs.npcs.shopkeeper.flee=Торговец сбегает!
actors.mobs.npcs.shopkeeper.sell=Продать предмет
actors.mobs.npcs.shopkeeper.talk=Поговорить
actors.mobs.npcs.shopkeeper.buyback=Владелец магазина неохотно возвращает ваш товар.
actors.mobs.npcs.shopkeeper.talk_prison_intro=У меня есть все необходимое для приключения!
actors.mobs.npcs.shopkeeper.talk_prison_warrior=Любопытная у тебя печать. Обычно они цельные. Ты что, опозоренный герой? Впрочем, что бы ты ни натворил, меня это не касается. Твои монеты здесь примут.
actors.mobs.npcs.shopkeeper.talk_prison_mage=Хе-хе! Кажется, я видел в городе объявление о розыске с твоим именем. Скрываешься? А, ты невиновен? Ну конечно, конечно... Не волнуйся: мне есть чем заняться, кроме как доносить на тебя страже. Но, может, купишь что-нибудь — так, на всякий случай?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=Ты пришел из Гильдии воров, чтобы прогнать монстров? Нет, просто закупиться? Тогда убей хотя бы пару чудищ, раз уж ты здесь. На скидку тоже не рассчитывай. Я плачу вам хорошие деньги за защиту, а вы едва обеспечиваете мою безопасность здесь.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=Кажется, вы здесь не в своей стихии, мисс. Тесные коридоры подземелья — совсем не то, что просторные дворцовые залы или леса вокруг города, верно? Хе-хе. Не обращайте внимания на мою болтовню. Может, что-нибудь купите?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=Ба, да это странствующий герой! Снова пытаешься спасти какой-нибудь город? Что ж, удачи: здешние опасности куда серьёзнее шайки мелких разбойников. Уверен, ты справишься лучше других. Только постарайся не погибнуть прямо у дверей моей лавки.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=О, приветствую, Ваше Высочество! Или теперь следует говорить «Ваше Святейшество»? Хе-хе. Как бы то ни было, вам здесь не место. Многие очень огорчатся, если вы погибнете. Но монеты у вас наверняка найдутся — почему бы не купить что-нибудь на всякий случай?
actors.mobs.npcs.shopkeeper.talk_caves=Трать деньги — проживёшь дольше.\n\nДа, и передай привет троллю-кузнецу, если встретишь его. Напомни увальню, что он до сих пор должен мне за молот, который я продал ему на прошлой неделе!
actors.mobs.npcs.shopkeeper.talk_city=Мои товары помогут тебе выжить здесь.\n\n...И не задерживайся, пожалуйста. Я еле добился, чтобы местные оставили меня в покое. Только неприятностей мне тут не хватало!
actors.mobs.npcs.shopkeeper.talk_halls=Эй, охотникам на демонов у меня особые цены!\n\nИ осторожнее там, внизу! Местные демоны ещё страшнее тех, что встречались тебе в хранилище. И никакого кристалла побега, чтобы выручить в беде! А ведь мертвец не сможет подняться обратно и потратить у меня ещё золота! ;)\n\nДумаешь, демоны похожи на меня? Хе-хе, ничуть! Я мелкая сошка, в драках не силён, зато хоть рассудок сохранил. Те, что внизу, куда могущественнее. И всех их поработил... впрочем... просто будь осторожен.
actors.mobs.npcs.shopkeeper.talk_ascent=Я без понятия, что ты собираешься делать с этим амулетом, и даже знать не хочу. Купи чего-нибудь и поторапливайся, нам обоим надо уходить отсюда!
actors.mobs.npcs.shopkeeper.desc=Этот полный парень лучше смотрелся бы в торговом районе крупного города, чем в подземелье. Его цены объясняют, почему он решил обосноваться здесь.

actors.mobs.npcs.wandmaker.name=старый чародей
actors.mobs.npcs.wandmaker.intro_warrior=О, приветствую тебя! Как приятно встретить воина с севера в столь гнетущем месте! Ты, должно быть, длинный проделал путь, чтобы добраться сюда. Если ты не против помочь пожилому человеку, у меня есть для тебя задание.
actors.mobs.npcs.wandmaker.intro_rogue=О Боже, ты меня напугал! В этих местах я не встречал бандита, сохранившего свой разум, так что ты, видать, с поверхности! Если ты не прочь помочь незнакомцу, у меня есть для тебя задание.
actors.mobs.npcs.wandmaker.intro_mage=О, здравствуй, %s! Я слышал, ты навел шума в институте чародеев? О, неважно, я все равно никогда не любил этих напыщенных снобов. Если хочешь, у меня есть для тебя задание.
actors.mobs.npcs.wandmaker.intro_huntress=О, здравствуй, юная леди! Приятно встретить здесь дружелюбное лицо, не правда ли? Клянусь, я уже где-то тебя видел, только никак не припомню где... А, неважно! Если ты ищешь приключений, у меня найдётся для тебя поручение.
actors.mobs.npcs.wandmaker.intro_duelist=О, здравствуй, Мисс! Какой невероятно приятный сюрприз встретить прекрасную героиню с непомутнённым рассудком в столь мрачном и гнетущем месте! Если вы согласны помочь старику, то у меня есть для вас просьба.
actors.mobs.npcs.wandmaker.intro_cleric=О, здравствуйте, Ваше Высочество! Как приятно встретить вас в таком унылом месте! Не хотел бы навязываться, но у меня есть для вас задание.
actors.mobs.npcs.wandmaker.intro_1=\n\nЯ пришел сюда, чтобы найти редкий ингредиент для палочки, но заблудился, а мой магический щит постепенно ослабевает. Вскоре мне придется покинуть это место, но я очень не хочу возвращаться с пустыми руками.
actors.mobs.npcs.wandmaker.intro_dust=Мне нужен _прах мертвеца_. Это особый порошок из проклятых костей; в подобных местах его иногда находят. Кажется, где-то здесь есть забаррикадированная комната — уверен, прах найдётся там. Но будь осторожен: на нём лежит сильное проклятие. _Возвращайся ко мне как можно скорее_, и я сниму его.
actors.mobs.npcs.wandmaker.intro_ember=Мне нужен _пепел элементаля,_ который получают из молодых огненных элементалей. Они обычно появляются, когда ритуал призыва не контролируется, так что найди свечи и место для ритуала, и я уверен, у тебя получится его вызвать. Смотри, не _поставь сам себя в стесненные обстоятельства_ в момент поединка с ним, либо _имей при себе что-нибудь замораживающее._ Новорожденные элементали очень сильны и хаотичны, но холод они просто не переносят.
actors.mobs.npcs.wandmaker.intro_berry=Бывшая хранительница этой тюрьмы выращивала _гнилоягоду,_ и я ищу её семена. Растение, скорее всего, совсем одичало, так что достать семена может оказаться сложнее. Сад должен быть где-то здесь. Постарайся _держаться подальше от его плёточников,_ если не хочешь потерять голову. Возможно, тебе захочется поджечь сад, но, прошу, не делай этого - так ты уничтожишь семена.
actors.mobs.npcs.wandmaker.intro_2=\n\nЕсли ты справишься, я буду рад отблагодарить тебя одной из своих замечательных палочек! У меня две есть с собой, выберешь, какая тебе по душе.
actors.mobs.npcs.wandmaker.reminder_dust=Как успехи с прахом, %s? Ищи забаррикадированные проходы, она должна быть где-то там.
actors.mobs.npcs.wandmaker.reminder_ember=Как успехи с пеплом, %s? Тебе надо найти свечи и точку призыва.
actors.mobs.npcs.wandmaker.reminder_berry=Как успехи с семенами Гнилоягоды, %s? Поищи комнату, полную растительности.
actors.mobs.npcs.wandmaker.def_verb=блокирует
actors.mobs.npcs.wandmaker.desc=Этот пожилой мужчина в расцвете сил слегка обеспокоен. Его защищает магический щит.



##vault quest
actors.mobs.quest.vault.vaultbosselemental.name=Величайший элементаль
actors.mobs.quest.vault.vaultbosselemental.rankings_desc=Подавлен Величайшим элементалем
actors.mobs.quest.vault.vaultbosselemental.discover_hint=Вы можете найти этого противника во время определённого задания.
actors.mobs.quest.vault.vaultbosselemental.desc=Являясь вершиной призывной магии дворфов, сила этого массивного элементаля, кажется, зависит от столь же внушительной печати, с помощью которого он был призван. Благодаря этому, он умеет _менять формы!_ Каждая форма обладает уникальными атаками, преимуществами и слабостями.
actors.mobs.quest.vault.vaultbosselemental.desc_fire=В данный момент элементаль принимает раскаленную _огненную форму_. В этой форме он может стрелять огненными шарами и призывать волны огня, которые проносятся по арене. Он будет стараться целится огненными шарами туда, куда вы движетесь, а в волнах пламени всегда есть расщелина. Если вы что-либо из этого задените, вы _загоритесь_.\n\nВ этой форме он имеет _сопротивление к магии_, она только подпитает его пламя. Однако, его уязвимое, раскаленное ядро можно легко поразить _метательным оружием_.
actors.mobs.quest.vault.vaultbosselemental.fire_resist=Пламя разгорается от силы того, как элементаль поглощает часть вашей магической атаки!
actors.mobs.quest.vault.vaultbosselemental.fire_weak=Ваше метательное оружие попадает в сердцевину элементаля, нанося дополнительный урон!
actors.mobs.quest.vault.vaultbosselemental.desc_frost=В данный момент элементаль принимает холодную _морозную форму_. В этой форме он может стрелять проносящимся конусом льда и призывать вихри холодного воздуха. От обеих атак можно уклонится, если вовремя среагировать, но конус льда особенно смертоносен на расстоянии. Если вы что-либо из этого задените, вы _заморозитесь_.\n\nВ этой форме он имеет _сопротивление к метательному оружию_, оно просто прилипает к его ледяной оболочке. Впрочем, сама она не выглядит особо прочной, поэтому _удар оружием_ должен нанести значительный урон.
actors.mobs.quest.vault.vaultbosselemental.frost_resist=Метательное оружие прилипает к ледяной оболочке элементаля!
actors.mobs.quest.vault.vaultbosselemental.frost_weak=Ваш удар в ближнем бою разрушает часть ледяной оболочки, нанося дополнительный урон!
actors.mobs.quest.vault.vaultbosselemental.desc_shock=В данный момент элементаль принимает шоковую _электрическую форму_. В этой форме он может стрелять молниями в ваше местоположение и призывать потоки искр от краев арены. От этих атак проще уклонится, однако он будет их призывать чаще. Если вы что-либо из этого задените, вас _на мгновение оглушит_.\n\nВ этой форме он имеет _сопротивление к ударам_, это приведет только к болезненному удару тока. Однако, его энергию дестабилизирует _магия_, нанося дополнительный урон.
actors.mobs.quest.vault.vaultbosselemental.shock_resist=При попытке удара вы получаете болезненный разряд!
actors.mobs.quest.vault.vaultbosselemental.shock_weak=Магия нарушает электрическое поле элементаля, нанося дополнительный урон!

actors.mobs.quest.vault.vaultdm100.name=модифицированный DM-100
actors.mobs.quest.vault.vaultdm100.discover_hint=Вы можете найти этого противника во время определённого задания.
actors.mobs.quest.vault.vaultdm100.desc=Эти DM-100 почти не отличаются от машин, которых можно встретить в тюрьме. Разве что их глаз ярко светится бирюзовым. Вероятно, их перевели на более современный дворфский источник энергии.\n\nВ остальном они ведут себя как обычные DM-100: по-прежнему бьют молниями на расстоянии. А благодаря лучшему состоянию они ещё и немного прочнее.

actors.mobs.quest.vault.vaultdm200.name=модифицированный DM-200
actors.mobs.quest.vault.vaultdm200.discover_hint=Вы можете найти этого противника во время определённого задания.
actors.mobs.quest.vault.vaultdm200.desc=Эти DM-200 почти не отличаются от машин из пещер, но их глаза светятся бирюзовым. Вероятно, их оснастили более современным дворфским источником энергии.\n\nКак и обычные DM-200, они слишком велики для тесных проходов и по-прежнему способны выпускать газ.

actors.mobs.quest.vault.vaultrat.desc=Эта крыса претерпела некоторые изменения в поведении, чтобы протестировать новый ИИ противников в подземелье:\n_-_ Ее передвижение может быть "слышно" через стены\n_-_ Она будет бродить по заранее установленному маршруту\n_-_ Во время блужданий ее дальность обнаружения за пределами направления, в котором она движется.\n_-_ Во время сна дальность обнаружения также уменьшается\n_-_ Когда она обнаружит вас, она начинает "исследовать", прежде чем переключиться на охоту. Враги, которые следят за вами, движутся к вам, но не атакуют, и от них легче скрыться за дверями и углами.

actors.mobs.quest.vault.vaultskeleton.name=дворфский скелет
actors.mobs.quest.vault.vaultskeleton.discover_hint=Вы можете найти этого противника во время определённого задания.
actors.mobs.quest.vault.vaultskeleton.desc=Они выглядели бы, как нормальные скелеты из тюрьмы, если бы не ошеломляющее количество растительности на лице. Похоже, некоторые дворфы не пренебрегали некромантией ещё до того, как новый Король стал править. \n\nОни ведут себя, как обычные скелеты, в том числе – взрываются костями при гибели. Как ни странно, их борода, видимо, даёт им немного больше защиты.

actors.mobs.quest.vault.vaultshaman.name=Пленный шаман
actors.mobs.quest.vault.vaultshaman.discover_hint=Вы можете найти этого противника во время определённого задания.
actors.mobs.quest.vault.vaultshaman.desc=Эти гноллы-шаманы точно родом из пещер, но со странной металлической маской, напоминающей дворфовскую. Маска сидит невероятно крепко, а сами шаманы двигаются странно и неестественно. Кажется, маска контролирует их?
actors.mobs.quest.vault.vaultshaman.spell_desc=Эти гноллы всё ещё способны бить магией, но без привычного цвета маски не угадаешь, какое именно заклинание они применят. Металлическая маска защищает их лучше деревянной, а удары у них куда сильнее, чем у обычных гноллов-шаманов.



###mobs
actors.mobs.acidic.name=кислотный скорпид
actors.mobs.acidic.desc=Эти огромные, паукообразные демонические существа избегают ближний бой, и вместо этого предпочитают стрелять издалека зазубренными шипами. А с этого прямо капает едкая кислота.

actors.mobs.albino.name=крыса-альбинос
actors.mobs.albino.desc=Это редкая разновидность сумчатой крысы с абсолютно белым мехом и зазубренными зубами.
actors.mobs.albino.discover_hint=Вы можете изредка найти этого противника в определённом регионе подземелья.

actors.mobs.armoredstatue.name=бронированная статуя
actors.mobs.armoredstatue.desc=На первый взгляд это всего лишь одна из неподвижных статуй этого подземелья, но ее выдают красные светящиеся глаза.\n\nПохоже, она в прекрасной форме, судя по броне, которую она носит, и, вероятно, будет чрезвычайно трудно ее убить.
actors.mobs.armoredstatue.desc_arm_wep=Хотя сама статуя сделана из камня, но _%1$s_ и _%2$s_ в её руках выглядят настоящими.

actors.mobs.bandit.name=безумный бандит
actors.mobs.bandit.desc=Элитный вор, отличающийся более роскошной пурпурной мантией. Несмотря на более высокое мастерство, они стали такими же безумными, как обычные воры.\n\nПомимо того, что они крадут у вас вещи, безумные бандиты временно ослепляют, калечат и отравляют вас! Однако они гораздо чаще носят с собой дополнительные сокровища, чем обычные воры.

actors.mobs.bat.name=летучая мышь-вампир
actors.mobs.bat.desc=Эти шустрые и выносливые обитатели пещер куда более опасны, чем кажется. Они восстанавливают свое здоровье с каждой успешной атакой, что позволяет им преодолевать гораздо более крупных противников.

actors.mobs.bee.name=золотая пчела
actors.mobs.bee.desc_honey=Несмотря на свой малый размер, золотые пчелы обычно очень яростно защищают свое жилище. Но эта пчела задобрена и, похоже, хочет следовать за вами.
actors.mobs.bee.desc=Несмотря на небольшой размер, золотые пчелы будут яростно защищать свой дом. Эта совсем с ума сошла, лучше держаться подальше.
actors.mobs.bee.discover_hint=Вы можете найти этого персонажа с помощью определённого предмета.

actors.mobs.brute.name=гнолл-громила
actors.mobs.brute.def_verb=блокирует
actors.mobs.brute.desc=Громилы - самые крупные, сильные и крепкие из гноллов. Получив смертельное ранение, они впадают в неистовство и получают временный щит, и наносят больше урона своим врагам.
actors.mobs.brute$bruterage.name=ярость громилы
actors.mobs.brute$bruterage.desc=Этот гнолл-громила умирает, но хочет утащить вас за собой!\n\nОн погибнет, когда исчезнет его щит — со временем или от полученного урона. Но до этого громила наносит гораздо больше урона, так что берегитесь!\n\nОсталось прочности щита: %d.

actors.mobs.causticslime.name=темный слизень
actors.mobs.causticslime.desc=Этот слизень, должно быть, был заражён тёмной магией, которая излучается из глубин. Он потерял свой обычный зелёный цвет и с него капает едкая слизь.
actors.mobs.causticslime.discover_hint=Вы можете изредка найти этого противника в определённом регионе подземелья.

actors.mobs.crab.name=сточный краб
actors.mobs.crab.desc=Эти крупные крабы находятся на вершине пищевой цепи в канализации. Они очень быстрые, а их толстый панцирь позволяет им пережить мощные удары.

actors.mobs.crystalguardian.name=кристалл-страж
actors.mobs.crystalguardian.def_verb=блокирует
actors.mobs.crystalguardian.desc=Эти крупные кристаллические стражи выглядят почти как статуи, если бы не яркое свечение их глаз. Закаленный кристалл, из которого они состоят, делает их весьма неповоротливыми, но очень выносливыми, так что _лучше не тревожить их во сне в своих кристаллических гнездах как можно дольше._\n\nИз-за своих размеров кристаллы-стражи в закрытых пространствах передвигаются гораздо медленнее. Кроме того, они слишком крепки, чтобы их полностью убить. Их можно побить и, таким образом, на время отключить, но через короткое время они просто опять встанут.
actors.mobs.crystalguardian.discover_hint=Вы можете найти этого противника во время определённого задания.

actors.mobs.crystalmimic.name=хрустальный мимик
actors.mobs.crystalmimic.ate=Мимик съел ваш %s!
actors.mobs.crystalmimic.escaped=Хрустальный мимик убежал!
actors.mobs.crystalmimic.desc=Мимики - волшебные существа, способные принимать любой облик. В подземельях они почти всегда принимают облик сундука, чтобы заманить ничего не подозревающих путешественников.\n\nХрустальные мимики - сложнее своих обычных собратьев, они стараются избегать конфликтов, но крадут сокровища. Когда их обнаруживают, они пытаются скрыться, и, кроме того, они способны сдвигать врагов с места, когда они атакуют.

actors.mobs.crystalspire.name=кристалл-шпиль
actors.mobs.crystalspire.warning=От ударов кристалл начинает вибрировать. Если продолжать, шум наверняка привлечёт чьё-нибудь внимание...
actors.mobs.crystalspire.alert=Вибрации усиливаются и раскатываются по всей пещере!
actors.mobs.crystalspire.rankings_desc=Проколот Кристалл-шпилем
actors.mobs.crystalspire.desc=Этот гигантский шпиль из сверхпрочного кристалла, вероятно, породил странных кристаллических существ, населяющих пещеру. Обычное оружие против него бесполезно: чтобы разрушить шпиль, понадобится кирка.\n\n_Подготовьтесь, прежде чем начинать добычу._ Кристалл огромен, поэтому работа займёт немало времени, и вряд ли вас оставят в покое. Возможно, шпиль и сам умеет защищаться. _Что, если обратить его атаки против собственных прислужников?_
actors.mobs.crystalspire.discover_hint=Вы можете найти этого противника во время определённого задания.

actors.mobs.crystalwisp.name=кристалл-пучок
actors.mobs.crystalwisp.beam_kill=Луч света убил вас...
actors.mobs.crystalwisp.desc=Злобный летающий осколок затвердевшего кристалла, испускающий яркое свечение. Кристальные огоньки не особенно сильны, но, завидев вас на открытой линии выстрела, атакуют болезненным лучом света.\n\nОни свободно пролетают сквозь кристаллические выступы, хотя стрелять через них не могут.\n\nОгоньки в пещерах открытого мира рождаются из местных кристаллов. После уничтожения такого огонька иногда остаётся самоцвет.
actors.mobs.crystalwisp.discover_hint=Вы можете найти этого противника во время определённого задания.

actors.mobs.demonspawner.name=рассадник демонов
actors.mobs.demonspawner.on_death=Со смертью рассадника ослабевает демоническая энергия этого места.
actors.mobs.demonspawner.desc=Этот извивающийся ком дворфской плоти порождает демонов-потрошителей из тел погибших здесь дворфов. Очевидно, демоны готовы пустить в ход любые доступные ресурсы против врагов.\n\nНесмотря на ужасающий вид, рассадники демонов не умеют двигаться и защищаться напрямую. Однако из-за огромной массы их трудно уничтожить быстро, а при угрозе они начинают создавать потрошителей ещё чаще.\n\n_Рассадники, похоже, связаны с центральным источником демонической силы. Их уничтожение может ослабить его._

actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=Вы были убиты молнией...
actors.mobs.dm100.desc=DM-100 - ранняя модель дворфовского 'оборонного оборудования', было создано для защиты шахтеров-дворфов в пещерах под этой тюрьмой. Удары электрическим током этих устройств, однако, оказались слишком слабыми, так что их подарили человеческому городу выше. Но в городе им не нашли применение и через несколько лет их отправили в тюрьму, где стражи изначально считали, что применять их - слишком жестоко. Но заключенные становились все менее управляемыми, так что они стали необходимы.

actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=DM-200 совершает выброс токсичных выхлопных газов!
actors.mobs.dm200.desc=DM-200 - второе поколение 'оборонного оборудования' дворфов, создан для защиты дворфовских шахтеров в пещерах и городе, который находится под ними. Оно гораздо больше и более громоздко чем предшественники и атакует сокрушительными гидравлическими кулаками.\n\nБолее крупный размер DM-200 - их главная уязвимость, т.к. они не помещаются в узкие тоннели и дверные проемы подземелий. Но дворфы смогли компенсировать неповоротливость DM-200 тем, что эти машины могут направлять свои токсичные выхлопы на отдаленных врагов или врагов, которых им не достать.

actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=DM-201 бросает кислотную гранату!
actors.mobs.dm201.desc=Дворфы какое-то время экспериментировали и далее развивали модели с низкой мобильностью, как у DM-200, и создали несколько моделей DM, которые были полностью стационарны. DM-201 - укомплектованный DM-200, служащий сторожевой башней без возможности передвижения. Компенсируя невозможностью передвигаться, у DM-201 значительно повышена выносливость и мощность атаки.\n\nТак как у DM-201 нет двигателя, из которого выходили бы выхлопные газы, дворфы вместо этого снабдили эту модель гранатами с разъедающим газом. DM-201, однако, очень осторожно пользуется этими гранатами и стреляет ими только в том случае, если его атакуют издалека.

actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=ОБНАРУЖЕН НЕАВТОРИЗОВАННЫЙ ПЕРСОНАЛ!
actors.mobs.dm300.shield=DM-300 подключается к току от открытых проводов и создает себе щит!
actors.mobs.dm300.charging=ПОЛУЧАЮ ПОВРЕЖДЕНИЯ! АКТИВИРУЮ ВЫСОКОВОЛЬТНУЮ ОПОРУ!
actors.mobs.dm300.charging_hint=DM-300 неуязвим, пока он подпитывается от высоковольтной опоры!
actors.mobs.dm300.supercharged=УНИЧТОЖИТЬ! УНИЧТОЖИТЬ! УНИЧТОЖИТЬ!
actors.mobs.dm300.charge_lost=ОПОРА УНИЧТОЖЕНА! ПЕРЕХОЖУ НА ЛОКАЛЬНОЕ ПИТАНИЕ!
actors.mobs.dm300.pylons_destroyed=ТРЕВОГА! ОБНАРУЖЕНА НЕСТАБИЛЬНОСТЬ ЭЛЕКТРОСЕТИ!
actors.mobs.dm300.rankings_desc=Раздавлен DM-300
actors.mobs.dm300.def_verb=блокирует
actors.mobs.dm300.defeated=КРИТИЧЕСКИЕ ПОВРЕЖДЕНИЯ! ПОПЫТКА ОТКЛЮЧЕ-
actors.mobs.dm300.desc=DM-300 — самая крупная и мощная оборонительная машина, когда-либо созданная дворфами. Изготовить такого исполина непросто, поэтому этих машин построили лишь несколько — для охраны входов в подземную столицу.\n\nDM-300 оснащена отверстиями для выброса ядовитых выхлопов и мощным буром, которым может атаковать и разрывать землю. Подключившись к энергетической сети, машина становится ещё сильнее.
actors.mobs.dm300.desc_supercharged=В данный момент, DM-300 полностью заряжен электроэнергией. В таком состоянии DM-300 невозможно нанести урон, и он передвигается с двойной скоростью! Кроме того, его дрель теперь вертится достаточно быстро, чтобы _пробить тоннели сквозь скальной массив,_ хотя двигаться при этом будет намного медленнее.\n\nПока DM-300 сверх-заряжен, нет смысла атаковать его напрямую, _но что-то в этом месте, очевидно, снабжает его энергией,_ и если найти это и разрушить, возможно, это его ослабит.

actors.mobs.dwarfking.name=Король дворфов
actors.mobs.dwarfking.notice=Как ты смеешь! Ты не имеешь никакого представления, с чем связался!
actors.mobs.dwarfking.lifelink_1=Мне нужна твоя жизненная сила, раб!
actors.mobs.dwarfking.lifelink_2=Кровь за короля, раб!
actors.mobs.dwarfking.teleport_1=Займись ими, раб!
actors.mobs.dwarfking.teleport_2=Не оставляй их без дела, раб!
actors.mobs.dwarfking.wave_1=Довольно! Восстаньте, мои рабы!
actors.mobs.dwarfking.wave_2=Еще! Кровь за короля!
actors.mobs.dwarfking.wave_3=Тщетно! УБЕЙТЕ ИХ!
actors.mobs.dwarfking.enraged=Ты не можешь убить меня, %s. Я БЕССМЕРТЕН!
actors.mobs.dwarfking.losing=Нет! Ты не можешь этого сделать... ты и понятия не имеешь, что там, в глубине...
actors.mobs.dwarfking.defeated=Ты... обрек нас всех...
actors.mobs.dwarfking.rankings_desc=Пал ниц пред Королем Дворфов
actors.mobs.dwarfking.desc=Много лет тому назад, один из высочайших придворных чародеев дворфов открыл тайны, которые наделили его чрезвычайной властью над жизнью и смертью. В скором он использовал эту власть, подчинил и растлил своих сверстников, своего короля, и, в итоге, всех граждан-дворфов. Ныне он - король, повелитель легиона подчиненных ему нежитей.\n\nКороль дворфов - очень агрессивный противник, он постарается сразить своих врагов ордой подчиненной ему нежити.
actors.mobs.dwarfking$dkghoul.rankings_desc=Пал ниц пред Королем Дворфов
actors.mobs.dwarfking$dkmonk.rankings_desc=Пал ниц пред Королем Дворфов
actors.mobs.dwarfking$dkwarlock.rankings_desc=Пал ниц пред Королем Дворфов
actors.mobs.dwarfking$dkgolem.rankings_desc=Пал ниц пред Королем Дворфов

actors.mobs.ebonymimic.name=эбонитовый мимик
actors.mobs.ebonymimic.reveal=Здесь прятался мимик!
actors.mobs.ebonymimic.hidden_name=подозрительное очертание
actors.mobs.ebonymimic.hidden_desc=Похоже, здесь что-то кроется, но оно почти полностью прозрачно.
actors.mobs.ebonymimic.desc=Мимики - волшебные существа, способные принимать любой облик. В подземельях они почти всегда принимают облик сундука, чтобы заманить ничего не подозревающих путешественников.\n\nЭбонитовые мимики - необычайно скрытные мимики, которые способны становиться почти невидимыми. Они обычно прячутся в вещах, которые могут подобрать путешественники, но при этом содержат и свои сокровища. Однако, они не такие сильные как обычные мимики, но их неожиданный укус сокрушителен.
actors.mobs.ebonymimic.discover_hint=Вы можете найти этого противника с помощью определённого аксессуара.

actors.mobs.elemental$fireelemental.name=огненный элементаль
actors.mobs.elemental$fireelemental.desc=Элементали - хаотичные существа, которых часто производят на свет при плохо контролируемых ритуалах. У элементалей имеется минимальный разум, и обычно их связывают с определенным видом магии.\n\nОгненные элементали - часто встречаемый вид, они причиняют урон огненной магией. Они приводят к возгоранию своей цели, которую они атакуют в ближнем бою, и порой они также могут выстрелить огненным зарядом.
actors.mobs.elemental$newbornfireelemental.name=новорожденный огненный элементаль
actors.mobs.elemental$newbornfireelemental.charging=Элементаль заряжается!
actors.mobs.elemental$newbornfireelemental.desc=Элементали — хаотичные существа, которые нередко появляются, когда могущественная оккультная магия выходит из-под контроля. Они обладают зачатками разума и обычно связаны с определённой стихией или видом магии.\n\nЭтот огненный элементаль только что призван, но уже весьма опасен!
actors.mobs.elemental$newbornfireelemental.rankings_desc=Обуглен Новорожденным огненным элементалем
actors.mobs.elemental$newbornfireelemental.desc_boss=Из-за хаотичной натуры заклинания, с помощью которого был призван этот элементаль, он способен только очень неточно пускать огневые выстрели после того, как заряжался один ход.
actors.mobs.elemental$newbornfireelemental.desc_ally=Так как этот элементаль был призван с помощью заклинания, он имеет больший контроль над своим пламенем. Он не способен на дальнобойные атаки, но может зажигать противников в ближнем бою.
actors.mobs.elemental$newbornfireelemental.discover_hint=Вы можете найти этого противника во время определённого задания.
actors.mobs.elemental$frostelemental.name=морозный элементаль
actors.mobs.elemental$frostelemental.desc=Элементали - хаотичные существа, которых часто производят на свет при плохо контролируемых ритуалах. У элементалей имеется минимальный разум, и обычно их связывают с определенным видом магии.\n\nМорозные элементали - часто встречаемый вид, они ослабляют своих противников замораживающей магией. Они замораживают свою цель в ближнем бою, и, порой, атаками издалека. Их магия намного эффективнее в воде.
actors.mobs.elemental$shockelemental.name=электрический элементаль
actors.mobs.elemental$shockelemental.desc=Элементали - хаотичные существа, которых часто производят на свет при плохо контролируемых ритуалах. У элементалей имеется минимальный разум, и обычно их связывают с определенным видом магии.\n\nЭлектрический элементаль - нечасто встречаемый вид, они разрывают своих противников электрическими ударами и вспышками света. В ближнем бою от них исходят электрические удары по находящимся близко врагам, и дополнительный урон причиняется их главной цели, если та находится в воде. Они также способны время от времени издалека направлять вспышку света на свою цель, которая тогда на время слепнет.
actors.mobs.elemental$chaoselemental.name=элементаль хаоса
actors.mobs.elemental$chaoselemental.desc=Элементали - хаотичные существа, которых часто производят на свет при плохо контролируемых ритуалах. У элементалей имеется минимальный разум, и обычно их связывают с определенным видом магии.\n\nЭлементали хаоса - редкий и опасный вид, они не стабилизировались в определенном элементе. При атаке они разражаются дикой и непредсказуемой магией.

actors.mobs.eye.name=злобоглаз
actors.mobs.eye.deathgaze_kill=Вы умерли от смертоносного взгляда...
actors.mobs.eye.desc=Злобоглазы похожи на парящие в воздухе шары, переполненные демонической энергией. Они не слишком опасны в ближнем бою, их истинная сила заключается в их магических способностях.\n\nНакопив достаточно энергии, злобоглазы способны испустить луч разрушительной силы, называемый _смертоносным взглядом._ Этот луч нанесет огромный урон всему, что не успеет спрятаться от него.

actors.mobs.fetidrat.name=вонючая крыса
actors.mobs.fetidrat.rankings_desc=Растворен Вонючей крысой
actors.mobs.fetidrat.desc=Что-то определенно не так с этой крысой. Её засаленный черный мех и гниющая шкура совсем не похожи на здоровых крыс, которых вы видели ранее. А тусклые зелёные глаза придают ей совсем уж пугающий вид.\n\nЗа крысой следует жуткое облако вони, невероятно сильное вблизи.\n\nТемная слизь капает изо рта крысы, разъедая пол, но растворяясь в воде.
actors.mobs.fetidrat.discover_hint=Вы можете найти этого противника во время определённого задания.

actors.mobs.fungalcore.name=сердце гриба
actors.mobs.fungalcore.desc=Этот огромный гриб, очевидно, является источником грибной активности в этой пещере.

actors.mobs.fungalsentry.name=грибной страж
actors.mobs.fungalsentry.desc=Этот невероятно высокий гриб является точкой обороны большой грибницы, живущей в этой пещере.\n\nОн неподвижен, но может выпускать точные удары яда по всему, что возникнет в его поле зрения. Сами эти удары довольно слабы, _но они быстро накапливаются в смертельные дозы яда._ Гриб, конечно, можно убить, но лучше бы его как-то обойти.

actors.mobs.fungalspinner.name=грибной прядильщик
actors.mobs.fungalspinner.desc=Этот грибной прядильщик контролируется грибом-паразитом. Гриб также изменил его способности и заменил паутинные и ядовитые железы на рассадники грибницы.\n\nВместо паутины, грибной прядильщик распространяет грибную растительность, которая может вас обездвижить своими корнями. Он не может вас отравить, но грибной прядильщик получает существенную устойчивость к урону, когда по соседству произрастает любой вид грибов.

actors.mobs.ghoul.name=дворфский вурдалак
actors.mobs.ghoul.desc=Когда дворфское общество стало распадаться, а нынешний король захватил всю власть, слабым и непокорным пришлось особенно тяжело. Овладев тёмной магией, король подчинил этих дворфов и превратил их в рядовых солдат своей армии.\n\nПоодиночке вурдалаки не слишком сильны, но ходят группами, и расправиться с ними вместе куда труднее. _Поверженный вурдалак через несколько ходов восстанет снова, если поблизости остался хотя бы один другой вурдалак._

actors.mobs.gnoll.name=гнолл-разведчик
actors.mobs.gnoll.desc=Гноллы - гиеноподобные гуманоиды. Они обитают в канализации и подземельях, периодически собираясь для рейдов на поверхность. Гноллы-разведчики - обычные члены стаи, не такие сильные, как громилы, и не такие умные, как шаманы.

actors.mobs.gnollexile.name=гнолл-изгой
actors.mobs.gnollexile.desc=Этот гнолл с серой шерстью имеет большое клеймо на плече, что показывает его изгнание. Гноллов обычно изгоняют из своего общества за неповиновение приказам или нарушение законов. Изгои должны быть сильны и смекалисты, чтобы выжить. Этот, похоже, знает, как использовать копьё, которое он держит.
actors.mobs.gnollexile.desc_passive=_Гнолл-изгой не спешит атаковать._ Он не выглядит таким же агрессивным, как остальные гноллы здесь, и скорее всего считает, что нападать на вас не стоит того. Вы можете просто дать ему пройти, но у него есть рюкзак, который может быть полон полезных вещей.
actors.mobs.gnollexile.desc_aggro=_Гнолл-изгой гневно озирается по сторонам._ Похоже, что-то всё же заставило его сражаться. Берегитесь его копья!
actors.mobs.gnollexile.seen_passive=Носящий копьё гнолл смотрит на вас с опаской, но не спешит атаковать.
actors.mobs.gnollexile.seen_aggro=Гнолл с копьём направляется в атаку!

actors.mobs.gnollgeomancer.name=гнолл-геомант
actors.mobs.gnollgeomancer.warning=Геомант пробуждается. Перед тем, как продолжить, удостоверьтесь, что вы готовы!
actors.mobs.gnollgeomancer.alert=Геомант пробуждается! Вся пещера будто бы изменяется, пока он скачет и безумно смеётся!
actors.mobs.gnollgeomancer.rock_kill=Вас убил летящий валун...
actors.mobs.gnollgeomancer.rockfall_kill=Вас убил обвал камней...
actors.mobs.gnollgeomancer.rankings_desc=Погребен Гноллом-геомантом
actors.mobs.gnollgeomancer.desc=Невероятно длинный высший гнолл является источником витающей здесь магии земли и руководителем всей активности гноллов в этой пещере. В отличие от гноллов-сапёров, геомант весьма искусен в своей магии и не может получить увечья от летящих или падающих камней. Впрочем, он никак не может сражаться в рукопашном бою.
actors.mobs.gnollgeomancer.desc_armor=Геомант покрыт слоем каменной брони. _Вам нужно сблизиться и разрушить её при помощи кирки, чтобы продолжить атаковать геоманта._
actors.mobs.gnollgeomancer.desc_armor_sapper=_Гнолл-сапёр неподалёку держит устройство, которое усиливает каменную броню геоманта. Сейчас вы не сможете его атаковать!_
actors.mobs.gnollgeomancer.desc_sleeping=Этот невероятно длинный гнолл-шаман окружён слоем камня и выглядит почти как статуя. Приглядевшись, вы можете заметить, как камень магически движется в такт дыхания высшего гнолла. Сейчас он не может быть атакован, пока заключён в камень и, видимо, наслаждается глубочайшим сном.\n\nВы можете пробиться сквозь слои камня с помощью кирки, но _удостоверьтесь, что вы готовы перед тем, как делать это._ Геомант, вероятно, является источником витающей здесь магии земли и руководителем всей активности гноллов в этой пещере. _Зачистить это место от гноллов перед боем — отличная идея._
actors.mobs.gnollgeomancer.discover_hint=Вы можете найти этого противника во время определённого задания.

actors.mobs.gnollguard.name=гнолл-страж
actors.mobs.gnollguard.def_verb=блокирует
actors.mobs.gnollguard.spear_warn=Гнолл наносит жестокий удар наконечником своего копья!
actors.mobs.gnollguard.desc=Большой и с виду крепкий гнолл, вооруженный копьем и щитом, но без шлема. Эти стражи, вероятно, громилы на боевой подготовке, призванные защищать шахту от проникающей живности.\n\nГнолл-страж достаточно сильный и может держать копье в одной руке, но не слишком хорошо им владеет. _Для дальнобойной атаки ему потребуется большое открытое пространство, и причиняемый им урон значительно снизится, если подобраться поближе._
actors.mobs.gnollguard.desc_armor=_Гнолл-сапёр неподалёку держит устройство, которое наделяет этого стража земляной бронёй, значительно снижая урон, который он получает._
actors.mobs.gnollguard.discover_hint=Вы можете найти этого противника во время определённого задания.

actors.mobs.gnollsapper.name=гнолл-сапёр
actors.mobs.gnollsapper.desc=Маленький и слабый, но сообразительный гнолл с бледной шерстью и мешком, заполненным различными устройствами. Они здесь чтобы помогать с геологоразведками и добычей тёмного золота, у них есть страж поблизости для защиты. Они способны сражаться, но их атаки ничтожно слабы, не сильнее гнолла-разведчика.\n\nВместо сражения напрямую, сапёры предпочитают использовать имеющиеся у них различные гаджеты, чтобы атаковать каменистой породой. Однако, они не обладают магией земли и пользуются своими гаджетами безрассудно. _Есть множество способов использовать эти атаки против них самих или же их стражей._
actors.mobs.gnollsapper.discover_hint=Вы можете найти этого противника во время определённого задания.

actors.mobs.gnolltrickster.name=гнолл-трикстер
actors.mobs.gnolltrickster.rankings_desc=Перехитрен Гнолл-трикстером
actors.mobs.gnolltrickster.desc=Даже на фоне присущей всем гноллам странности, этот кажется особенно странным. Чуть склонившись вперед с дикой ухмылкой, он едва ли не баюкает перекинутую через плечо сумку. Его глаза полны странной смеси страха и наслаждения.\n\nВ его сумке внушительная коллекция самодельных дротиков, явно покрытых какой-то гадостью.
actors.mobs.gnolltrickster.discover_hint=Вы можете найти этого противника во время определённого задания.

actors.mobs.goldenmimic.name=золотой мимик
actors.mobs.goldenmimic.desc=Мимики - волшебные существа, способные принимать любой облик. В подземельях они почти всегда принимают облик сундука, чтобы заманить ничего не подозревающих путешественников.\n\nЗолотые мимики - более сильные мимики, которые стараются привлечь самых сильных путешественников. У них бывают сокровища получше, но они намного сильнее обычных мимиков.

actors.mobs.golem.name=голем
actors.mobs.golem.def_verb=блокирует
actors.mobs.golem.desc=Големы — попытка дворфов исправить недостатки прежних машин с помощью недавно освоенной магии. Они намного компактнее и эффективнее ДМ-300, но ничуть не менее опасны.\n\nДаже голем слишком велик для узких проходов, поэтому дворфы наделили его магическими способностями. Он может телепортироваться между комнатами и притягивать к себе врагов, находящихся вне досягаемости.\n\nГолемы, бродящие по пещерам открытого мира, наполовину состоят из местного камня. Разрушив такого голема, иногда можно найти кусок железа или серебра.

actors.mobs.goo.name=Слизень
actors.mobs.goo.notice=БУЛЬК-БУЛЬК!
actors.mobs.goo.defeated=бульк... бульк...
actors.mobs.goo.!!!=!!!
actors.mobs.goo.pumpup=Слизень накачивается жижей!
actors.mobs.goo.gluuurp=БУУУУЛЬК!
actors.mobs.goo.rankings_desc=Поглощён Слизнем
actors.mobs.goo.desc=Мало что известно о Слизне. Возможно, это даже не существо, а сборище мерзких субстанций из канализации, каким-то образом развивших примитивный интеллект. В любом случае, темная магия - вот причина существования Слизня.\n\nЕго желейная субстанция позволяет ему поглощать так много темной энергии, что вы чувствуете озноб, просто находясь рядом. Если Слизень атакует вас этой энергией, долго вам не прожить.

actors.mobs.greatcrab.name=древний краб
actors.mobs.greatcrab.noticed=Краб защищается своей огромной клешнёй.
actors.mobs.greatcrab.def_verb=блокирует
actors.mobs.greatcrab.rankings_desc=Разрублен Древним крабом
actors.mobs.greatcrab.desc=Этот краб огромен, даже по сравнению с другими сточными крабами. Его синий панцирь покрыт трещинами и прилипалами, выдавая его древний возраст. Он медленно шатается, еле удерживая равновесие со своей гигантской клешнёй.\n\nХоть у краба всего одна клешня, её размер это с лихвой компенсирует. Краб держит клешню перед любой угрозой, защищая себя от атак непробиваемым щитом. Однако, краб не может блокировать атаки, которые он не видит или атаки сразу от нескольких врагов.
actors.mobs.greatcrab.discover_hint=Вы можете найти этого противника во время определённого задания.

actors.mobs.guard.name=тюремный страж
actors.mobs.guard.scorpion=А ну, иди сюда!
actors.mobs.guard.def_verb=блокирует
actors.mobs.guard.desc=Когда-то они охраняли тюрьму, но давно стали не лучше её заключённых. Стражи бродят по коридорам, словно зомби, бездумно выискивая всё, чему здесь не место. Например, вас!\n\nНа поясе у каждого висит цепь — возможно, чтобы подтягивать врагов поближе.

actors.mobs.hermitcrab.name=краб-отшельник
actors.mobs.hermitcrab.def_verb=блокирует
actors.mobs.hermitcrab.desc=По какой-то причине этот канализационный краб нацепил на голову сломанную верхнюю часть бочки! Лишний вес замедлил его до обычной скорости, зато бочка служит неплохой защитой. Кажется, внутри неё что-то перекатывается...

actors.mobs.mimic.name=мимик
actors.mobs.mimic.reveal=Этот сундук оказался мимиком!
actors.mobs.mimic.hidden_hint=С этим сундуком что-то не так... Пожалуй, подходить к нему и пытаться открыть — плохая затея.
actors.mobs.mimic.desc=Мимики - волшебные существа, способные принимать любой облик. В подземельях они почти всегда принимают облик сундука, чтобы заманить ничего не подозревающих путешественников.\n\nМимики очень больно кусаются, но зато у них, обычно, больше сокровищ чем в нормальных сундуках.
actors.mobs.mimic.discover_hint=Вы можете найти этого противника где угодно в подземелье.

actors.mobs.necromancer.name=некромант
actors.mobs.necromancer.desc=Эти начинающие тёмные маги стеклись в тюрьму, так как это - лучшее место для практикования их тёмного ремесла.\n\nНекроманты будут призывать и улучшать скелетов, которые дерутся на его стороне. Эти скелеты будут существовать только пока жив поднявший их некромант.
actors.mobs.necromancer$necroskeleton.name=скелет некроманта
actors.mobs.necromancer$necroskeleton.desc=Этот скелет был призван некромантом. Он ведет себя как обычный скелет и умрет, когда некромант, вызвавший его, будет убит.

actors.mobs.mob.died=Вы слышите, как вдали кто-то умер.
actors.mobs.mob.rankings_desc=Убит (убийца - %s)
actors.mobs.mob.discover_hint=Вы можете найти этого противника в определённом регионе подземелья.

actors.mobs.monk.name=дворф-монах
actors.mobs.monk.def_verb=блокирует
actors.mobs.monk.parried=парирует
actors.mobs.monk.desc=Эти монахи - фанатики, посвятившие себя защите своего короля физической силой. Их преданность настолько велика, что они полностью предали свое сознание своему королю, и теперь они бродят по городу дворфов как безмозглые зомби.\n\nМонахи полагаются исключительно на рукопашный бой, они используют свои невооруженные кулаки как для атаки, так и для защиты. Когда они сфокусируются, они смогут отразить следующую физическую атаку, направленную против них, даже если та в обычных условиях обязательно попала бы. Монахи быстрее фокусируются в движении и медленнее в прямом бою.
actors.mobs.monk$focus.name=сфокусирован
actors.mobs.monk$focus.desc=Этот монах сосредоточился на цели настолько, что, кажется, предугадывает каждое её движение.\n\nПока монах сосредоточен, следующая направленная на него физическая атака гарантированно промахнётся. Отразив её, монах теряет сосредоточение и должен накопить его снова. Во время движения сосредоточение накапливается быстрее.

actors.mobs.phantompiranha.name=призрачная пиранья
actors.mobs.phantompiranha.teleport_away=призрачная пиранья исчезла...
actors.mobs.phantompiranha.desc=Призрачная пиранья - редкая порода пираний с магическими способностями и жуткими полупрозрачными телами. В случае опасности они способны телепортироваться, чтобы убежать или быстро сблизиться со своим врагом!\n\nХоть драться с ними неприятно, мясо призрачных пираний ценится за волшебные свойства.

actors.mobs.piranha.name=гигантская пиранья
actors.mobs.piranha.desc=Этих хищный рыб специально развели для защиты затопленных мест. Их укусы опасны, так что лучше избегать прямого столкновения с ними.
actors.mobs.piranha.discover_hint=Вы можете найти этого противника где угодно в подземелье.

actors.mobs.pylon.name=высоковольтная опора
actors.mobs.pylon.desc_inactive=Высоковольтная опора для управления электричеством, снабжающим местное оборудование.\n\nВ данный момент опора неактивна и невосприимчива к урону.
actors.mobs.pylon.desc_active=Высоковольтная опора для управления электричеством, снабжающим местное оборудование. Опора потрескивает от напряжения - наверняка именно от нее заряжается DM-300!\n\nВ таком состоянии опора уязвима, но выпускает разряды электричества по соседним квадратам по часовой стрелке. Обладая тяжелой металлической конструкцией, опоры выносят большое количество урона.

actors.mobs.rat.name=сумчатая крыса
actors.mobs.rat.desc=Сумчатые крысы - агрессивные, но слабые обитатели канализации. У них противный укус, но опасны они только в больших количествах.

actors.mobs.ripperdemon.name=демон-потрошитель
actors.mobs.ripperdemon.leap=Демон-потрошитель готовится к прыжку!
actors.mobs.ripperdemon.desc=Эти страшные существа - то, для чего демонические силы употребили множество трупов дворфов в этом регионе. Потрошители - чахнущие существа-вурдалаки, похожие на дворфов, но с изломленными телами и длинными, острыми клешнями, сделанными из кости.\n\nДемоны-потрошители не особо выносливы, но они быстры и опасны. Они способны прыгать на длинное расстояние, чтобы быстро добраться до своей цели перед тем, как растерзать ее своими клешнями.

actors.mobs.rotheart.name=сердце гнилоягоды
actors.mobs.rotheart.desc=Плод гнилоягоды уникален. Вместо разложения и образования питательных веществ, плод растет, твердеет и хранит в себе семя. Он обеспечивает защиту органов, растущих внутри фрукта. Эта гигантская сфера обычно и называется сердцем гнилоягоды.
actors.mobs.rotheart.discover_hint=Вы можете найти этого противника во время определённого задания.

actors.mobs.rotlasher.name=плёточник
actors.mobs.rotlasher.rankings_desc=Высечен Плёточником
actors.mobs.rotlasher.desc=Плёточники — часть корневой системы зрелой гнилоягоды и её основное средство защиты. Они слепы и прикованы к земле. Заметив поблизости угрозу, они на мгновение замирают, прежде чем яростно наброситься на неё. Пока врагов рядом нет, плёточники неподвижны и стараются слиться с растительностью.
actors.mobs.rotlasher.discover_hint=Вы можете найти этого противника во время определённого задания.

actors.mobs.scorpio.name=скорпид
actors.mobs.scorpio.desc=Эти огромные, паукообразные демонические существа избегают ближний бой, предпочитая стрелять издалека калечащими, зазубренными шипами.

actors.mobs.senior.name=монах-наставник
actors.mobs.senior.desc=Эти монахи - фанатики, посвятившие себя защите своего короля физической силой. Их преданность настолько велика, что они полностью предали свое сознание своему королю, и теперь они бродят по городу дворфов как безмозглые зомби.\n\nЭтот монах полностью освоил искусство рукопашного боя и может сфокусироваться в движении гораздо быстрее, чем обычные монахи. Как только он сфокусируется, он отразит следующую физическую атаку, направленную против него, даже, если та в обычных условиях обязательно попала бы. Монахи быстрее фокусируются в движении и медленнее в прямом бою.

actors.mobs.shaman.name=гнолл-шаман
actors.mobs.shaman.bolt_kill=Вас убила магическая стрела...
actors.mobs.shaman.desc=Гнолл-шаманы - умные гноллы, которые используют боевую магию, компенсируя таким образом недостаток физической силы. В обществе гноллов их почитают несмотря на их выраженную слабость.
actors.mobs.shaman$redshaman.spell_desc=Этот шаман надел красную маску и использует магию, которая временно _ослабит вашу силу атаки._
actors.mobs.shaman$blueshaman.spell_desc=Этот шаман надел синюю маску и использует магию, которая временно _увеличит наносимый вам урон._
actors.mobs.shaman$purpleshaman.spell_desc=Этот шаман надел багряную маску и использует магию, которая временно _снизит вашу меткость и способность уклонения._

actors.mobs.armoredbrute.name=бронированный громила
actors.mobs.armoredbrute.desc=Самые влиятельные гноллы-громилы часто носят мощную броню, чтобы демонстрировать свой статус. Благодаря ей они гораздо более выносливы по отношению к физическому урону, а их более высокий уровень дисциплины означает, что они могут пребывать в ярости гораздо дольше, прежде чем скончаться от своих ран.

actors.mobs.skeleton.name=скелет
actors.mobs.skeleton.explo_kill=Вас убил взрыв костей...
actors.mobs.skeleton.def_verb=блокирует
actors.mobs.skeleton.desc=Скелеты состоят из костей неудачливых путешественников и узников тюрьмы, оживленные влиянием темной магии из глубин. Получив достаточное количество урона, они взрываются костяными осколками. Осколки опасны для всего поблизости, но броня весьма эффективна в снижении урона от осколков.

actors.mobs.slime.name=слизень
actors.mobs.slime.def_verb=блокирует
actors.mobs.slime.desc=Слизни - странные, отчасти магические существа. Они эластичные снаружи и жидкие внутри. Канализация города обеспечивает их водой и питательными веществами.\n\nБлагодаря их растяжимой анатомии, крайне сложно нанести слизню больше чем _6 единиц урона_ за один удар.

actors.mobs.snake.name=сточная змея
actors.mobs.snake.hint=Попробуй использовать кнопку поиска на змеи, чтобы узнать, как с ними бороться.
actors.mobs.snake.desc=Эти огромные змеи прекрасно чувствуют себя во влажной темноте пещер и канализации. Они ловко ускользают от ударов, поэтому по ним трудно попасть. Однако магия и внезапные атаки способны застать их врасплох.\n\nЧтобы нанести внезапный удар, атакуйте, пока змея вас не видит. Например, заманите её в дверной проём и _ударьте сразу после того, как она войдёт в дверь_.

actors.mobs.spectralnecromancer.name=заклинатель призраков
actors.mobs.spectralnecromancer.desc=Большинство некромантов предпочитает скелетов, но некоторые выбирают менее материальных слуг. Призрачные некроманты сделали ставку на призраков!\n\nПоодиночке призраки слабее скелетов, зато эти некроманты не стесняются призывать их целыми толпами!

actors.mobs.spinner.name=пещерный прядильщик
actors.mobs.spinner.desc=Эти зеленые и мохнатые пещерные пауки избегают прямой схватки, оставаясь на расстоянии, пока запутавшаяся в их паутине жертва медленно умирает от ядовитого укуса. Они способны выстреливать паутину на большое расстояние и будут пытаться блокировать путь, по которому двигается их жертва.

actors.mobs.statue.name=живая статуя
actors.mobs.statue.def_verb=блокирует
actors.mobs.statue.desc=На первый взгляд это всего лишь одна из неподвижных статуй этого подземелья, но её выдают красные светящиеся глаза.
actors.mobs.statue.desc_weapon=Хотя сама статуя сделана из камня, но _%s_ в её руках выглядит настоящим.
actors.mobs.statue.discover_hint=Вы можете найти этого противника где угодно в подземелье.

actors.mobs.succubus.name=суккуб
actors.mobs.succubus.desc=Суккубы - демоны-оборотни, манипулирующие сознание своей жертвы. Этот принял образ бледного готичного гуманоида, возможно, чтобы привлечь дворфов-чернокнижников?\n\nСуккубы могут временно очаровать противника при атаке, лишая противника способности нанести прямую ответную атаку. Когда суккубы атакуют очарованного врага, они крадут немного его жизненной силы.

actors.mobs.swarm.name=рой мух
actors.mobs.swarm.desc=Смертоносный рой жужжащих мух. Любая немагическая атака разделит его на два не менее опасных роя поменьше.

actors.mobs.tengu.name=Тенгу
actors.mobs.tengu.notice_gotcha=Ну вот я и поймал тебя, %s!
actors.mobs.tengu.interesting=Давай-ка сделаем битву интереснее...
actors.mobs.tengu.notice_have=Словил я наконец тебя, %s!
actors.mobs.tengu.defeated=Наконец-то свободен...
actors.mobs.tengu.rankings_desc=Ликвидирован Тенгу
actors.mobs.tengu.desc=Знаменитый и загадочный убийца, прозванный Тенгу из-за маски, словно приросшей к его лицу.\n\nМассивные оковы охватывают его запястья и колени, хотя от цепей он, похоже, избавился уже давно.\n\nОн пустит в ход ловушки, обманную магию и точные удары, чтобы устранить последнее препятствие на пути к свободе — вас.

actors.mobs.tengu$bombability$bombblob.desc=Здесь клубится облако обжигающего дыма. Осторожнее, оно скоро взорвётся!
actors.mobs.tengu$bombability$bombitem.name=Дымовая шашка
actors.mobs.tengu$bombability$bombitem.cant_pickup=Оно как будто прибито к земле, вы не можете сдвинуть это!
actors.mobs.tengu$bombability$bombitem.desc=Тенгу бросил сюда странно выглядящую шашку, которая испускает густой горячий дым. Она громко тикает, как будто отсчитывая время для взрыва!\n\nШашка, похоже, приклеилась к полу, поэтому вы не сможете подобрать её.

actors.mobs.tengu$fireability$fireblob.desc=Тенгу распылил здесь какой-то порошок, который собирается воспламениться!

actors.mobs.tengu$shockerability$shockerblob.desc=Воздух здесь искрится от электрических разрядов. Похоже, что на следующий ход здесь ударит молния!
actors.mobs.tengu$shockerability$shockeritem.name=Шокер
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=Слишком опасно поднимать с пола работающий шокер!
actors.mobs.tengu$shockerability$shockeritem.desc=Тенгу бросил сюда странное устройство, собранное, похоже, из деталей DM-100. Вокруг него постоянно проскакивают электрические разряды — и, кажется, по предсказуемой схеме.\n\nПока устройство окружено дугами электричества, поднять его невозможно.

actors.mobs.thief.name=безумный вор
actors.mobs.thief.stole=Вор украл у вас %s!
actors.mobs.thief.carries=\n\nВор несёт _%s._ Очевидно, украл где-то.
actors.mobs.thief.escapes=Вор скрылся от вас, стащив %s!
actors.mobs.thief.desc=Хотя заключенные свободно ходят вне камер, это место - всё равно их тюрьма. Со временем, помимо свободы, оно забрало и их рассудок. Эти воры и бандиты уже давно забыли, кто они и что они здесь делают.\n\nЭти подлецы предпочитают что-то украсть и убежать, чем сражаться до смерти. Не упускайте их из виду, иначе вы можете никогда больше не увидеть украденное.

actors.mobs.tormentedspirit.name=измученный призрак
actors.mobs.tormentedspirit.desc=Измученные духи когда-то были добродушными существами, но попали под действие проклятия. Пока оно не снято, они нападают как призраки — и гораздо опаснее их!\n\nВозможно, нужный предмет, применённый рядом с духом, поможет снять проклятие. Если это удастся, он наверняка вас отблагодарит...
actors.mobs.tormentedspirit.thank_you=Спасибо тебе...

actors.mobs.npcs.vaultlaser.name=дезинтегрирующий страж
actors.mobs.npcs.vaultlaser.ondeath=Дезинтегрирующий луч убил вас...
actors.mobs.npcs.vaultlaser.desc=Эти часовые выпускают лучи дезинтеграции через равные или почти случайные промежутки времени. Лучи чрезвычайно опасны, но, кажется, каждый часовой всегда бьёт по одному и тому же месту. Защититься от такого луча, похоже, невозможно, поэтому _придётся от него уклоняться_.

actors.mobs.npcs.vaultsentry.name=сканирующий страж
actors.mobs.npcs.vaultsentry.ondeath=Вы были убиты молнией...
actors.mobs.npcs.vaultsentry.desc=Эти часовые визуально сканируют местность по заранее заданному пути. Выглядят они довольно опасными, поэтому если их сканер обнаружит ваше присутствие, вас наверняка поразят разрядом тока. По наблюдениям, запоминая путь часовых можно избегать встречи с ними, но им также нужно увидеть вас, чтобы обнаружить, поэтому _все, что заслоняет их обзор, также эффективно против них_.

actors.mobs.npcs.vaulttokendoor.name=странная дверь
actors.mobs.npcs.vaulttokendoor.def_verb=блокирует
actors.mobs.npcs.vaulttokendoor.desc=Эта, казалось бы, незапертая дверь не поддаётся с места и имеет необычный механизм на своей обшивке. На ней расположены десять углублений, которые выглядят так, будто в них должен помещен какой-то плоский ромбовидный предмет.
actors.mobs.npcs.vaulttokendoor.no_tokens=_Возможно, что-нибудь из хранилища подойдет для этого?_
actors.mobs.npcs.vaulttokendoor.too_few_tokens=_Ваши дворфские жетоны идеально подходят к выемкам_, но к сожалению их у вас недостаточно.
actors.mobs.npcs.vaulttokendoor.enough_tokens=_У вас уже достаточно дворфских жетонов, чтобы заполнить все выемки_, хотите ли вы разместить их в двери?
actors.mobs.npcs.vaulttokendoor.open=Открыть дверь
actors.mobs.npcs.vaulttokendoor.not_yet=Погоди
actors.mobs.npcs.vaulttokendoor.unlocked=Кажется, что жетоны соединились с дверью, и вы слышите отчетливый щелчок отпирания замка.

actors.mobs.npcs.vaultmirror.name=Странное зеркало
actors.mobs.npcs.vaultmirror.def_verb=блокирует
actors.mobs.npcs.vaultmirror.desc=На этом большом зеркале выгравированы различные светящиеся руны дворфов; оно постоянно издает некий гул, и, похоже, на самом деле ничего не отражает.
actors.mobs.npcs.vaultmirror.approach=Вы стоите перед большим зеркалом со светящимися рунами в его каменной раме. Поверхность зеркала черная, словно темнота, пока вы не приблизитесь. Как только вы подходите ближе, руны ярко вспыхивают, а за стеклом появляется шокирующе знакомая сцена.
actors.mobs.npcs.vaultmirror.scene_warrior=Вы видите вашу красную _восковую печать_, сломанную пополам и частично ушедшую под снег. Эта сцена словно воспоминание, но часть деталей в ней другая. Вы бы никогда не смогли выбросить эту печать, ее хранение казалось частью наказания. Вы потратили много времени на ее изучение, и наконец заметили, что разлом проходит под другим углом.
actors.mobs.npcs.vaultmirror.scene_mage=Вы видите свой _магический посох_ на столе в кабинете. Всё напоминает воспоминание, но детали почему-то не сходятся. Это ваш кабинет в Южном институте магии — слишком открытое место, чтобы хранить там посох. Да и обжитым он выглядит куда больше, чем должен: вы никогда не утруждали себя настоящей работой здесь.
actors.mobs.npcs.vaultmirror.scene_rogue=Вы видите _Плащ Теней_, покоящийся на стенде в королевской оружейной. Эта сцена словно воспоминание, но часть деталей в ней другая. В оружейной тихо и спокойно, а стражник осматривает комнату с искренней добротой в глазах. При его виде, спокойного и невредимого, вы испытываете знакомое, колющее чувство вины.
actors.mobs.npcs.vaultmirror.scene_huntress=Вы видите ваш _Лук Духов_, лежащий на большом, круглом, плоском камне посреди густого леса. Эта сцена словно воспоминание, но часть деталей в ней другая. На небольшой поляне вокруг камня тихо и пусто, совсем не так, как на праздновании, когда вам вручали лук. К тому же, вы вообще не ощущаете никакого отклика от природы.
actors.mobs.npcs.vaultmirror.scene_duelist=Вы видите высокую фигуру в королевских доспехах, стоящую перед вами: ваш старый отец. Эта сцена словно воспоминание, но часть деталей в ней другая. В его глазах все такая же доброта, как вы и запомнили, но его лицо отмечено печатью лет, которых ему не удалось прожить. Он протягивает вам его _зачарованный двуручный меч_, предлагая его взять.
actors.mobs.npcs.vaultmirror.scene_cleric=Вы видите открытый сундук с реликвиями в ярко освящённой часовне, хранящий _Священный Том_. Эта сцена словно воспоминание, но часть деталей в ней другая. Вы никогда не доставали реликвии из хранилища, только сам том. Божественная сила, исходящая из тома ощущается необычно, словно он черпает энергию из другого источника.
actors.mobs.npcs.vaultmirror.scene_final=Вы замечаете, что стеклянная поверхность зеркала внезапно исчезла, ничто не мешает вам протянуть руку вперёд и взять предмет.
actors.mobs.npcs.vaultmirror.take=Взять предмет
actors.mobs.npcs.vaultmirror.scene_take=После того как вы взяли предмет, сцена остается неизменной, словно предмет существует сразу в двух местах.\n\nИзображение в зеркале начинает мутнеть и пропадать, когда предмет в вашей руке начинает пульсировать в унисон с рунами на зеркале.\n\nВы не совсем уверены, что только что произошло, но, похоже существование предмета связано с зеркалом, что означает - вы не сможете вынести его за пределы хранилища.
actors.mobs.npcs.vaultmirror.scene_nothing=Вы подходите к зеркалу снова, но ничего не происходит. Его поверхность плавная и твердая, вы едва видите отражение кончиков своих пальцев когда прикосаетесь к стеклу.

actors.mobs.warlock.name=дворф-чернокнижник
actors.mobs.warlock.bolt_kill=Вас убила стрела тьмы...
actors.mobs.warlock.desc=Когда интерес дворфов перешел от инженерии к чародейству, чернокнижники обрели власть в городе. Они начинали со стихийной магии, но вскоре перешли к демонологии и некромантии. Самый сильный из этих чернокнижников захватил престол в городе дворфов, и его пособникам позволили продолжать занятия темной магией, пока они покоряют ему свою свободную волю.\n\nЭти чернокнижники обладают сильной разрушительной магией, они способны временно блокировать магию улучшения, примененную в отношении ваших предметов. Чем более предмет улучшен, тем сильнее на нем скажется это влияние.

actors.mobs.wraith.name=призрак
actors.mobs.wraith.desc=Призрак - это мстительный дух грешника, чья могила была потревожена. Будучи нематериальной сущностью, призрак легко избегает атаки простым оружием.
actors.mobs.wraith.discover_hint=Вы можете найти этого противника где угодно в подземелье.

actors.mobs.yogdzewa.name=Йог-Джева
actors.mobs.yogdzewa.notice=Я. ВИЖУ. ТЕБЯ.
actors.mobs.yogdzewa.darkness=Темнота сгущается вокруг вас...
actors.mobs.yogdzewa.hope=ТВОЯ. НАДЕЖДА. ЭТО. ИЛЛЮЗИЯ!
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.rankings_desc=Поглощен богом Йог-Джева
actors.mobs.yogdzewa.desc=Йог-Джева - древний бог; великое чудовище, досягающее до миров смертных и пожирающее их для поддержания своего бесконечного роста. Дворфы, видимо, привлекли внимание этого космического ужаса, когда игрались с темной магией, и с тех пор старались как-то ограничить его влияние.\n\nЙог-Джева обитает в измерении безформенного магического хаоса и не способен воплотить свой истинный облик в настоящем миру. Вместо этого, божество создало своих аватаров и демонических слуг, которые подчиняются его приказам.\n\nЭтот огромный глаз является точкой фокуса силы Йог-Джева в нашем мире. Сам глаз неподвижен, но он способен излучать мощнейшие лучи демонической магии и призывать разные виды слуг на помощь.
actors.mobs.yogdzewa.desc_spawners=Вы чувствуете волны демонической энергии, излучаемые в сторону глаза с этажей выше. Очевидно, что-то, что вы оставили живым там, направляет энергию обратно в Йог-Джеву. _Йог использует эту энергию для призыва более мощных приспешников!_
actors.mobs.yogdzewa$larva.name=личинка бога
actors.mobs.yogdzewa$larva.rankings_desc=Поглощен богом Йог-Джева
actors.mobs.yogdzewa$larva.desc=Эти маленькие отродья Йог-Джевы - простые приспешники, которых легко производить. В одиночку они слабые, но они быстро призываются и могут стать непреодолимыми в большом количестве.
actors.mobs.yogdzewa$yogripper.rankings_desc=Поглощен богом Йог-Джева
actors.mobs.yogdzewa$yogeye.rankings_desc=Поглощен богом Йог-Джева
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Поглощен богом Йог-Джева

actors.mobs.yogfist.invuln_warn=Длань неуязвима, пока находится возле глаза!
actors.mobs.yogfist.rankings_desc=Поглощен богом Йог-Джева
actors.mobs.yogfist.desc=Эта длань является аспектом мощи Йог-Джевы. Длани подвязаны к силе Йог-Джевы, и будут защищены от любого урона, когда находятся возле глаза.
actors.mobs.yogfist$burningfist.name=пылающая длань
actors.mobs.yogfist$burningfist.desc=Эта длань сформирована из хаотичной огненной магии. Пока она передвигается, она постоянно воспламеняет свое окружение. Она также способна стрелять зарядами огненной мощи, которые распространяют пламя на тех местах, куда они попадают.\n\nСпособность длани воспламенять окружение подавлена вблизи воды, но жар, исходящий от нее, заставит воду испариться за короткое время!
actors.mobs.yogfist$soiledfist.name=земляная длань
actors.mobs.yogfist$soiledfist.desc=Эта длань сформирована из хаотической магии земли. Когда она движется, вокруг нее произрастает вегетация. Она также способна стрелять концентрированными земельными зарядами, которые связывают цель быстрорастущими вьюнками и корнями!\n\nЭта длань получает свою силу из этой флоры и выдержит урон в соответствии с тем, сколько высокой или бороздчатой вегетации находится близко от нее!
actors.mobs.yogfist$rottingfist.name=гнилостная длань
actors.mobs.yogfist$rottingfist.desc=Эта длань соткана из живой скверны: огромная масса гниющей плоти, которая вблизи разбрызгивает едкую слизь, а издали выпускает ядовитый газ. Хуже того, вместо прямого урона раны вызывают у неё кровотечение.\n\nВода смывает едкую слизь, но длань сама поглощает воду, чтобы исцеляться! Если ударить её во время кровотечения, длительность эффекта обновится, однако несколько кровотечений не суммируются.
actors.mobs.yogfist$rustedfist.name=ржавая длань
actors.mobs.yogfist$rustedfist.desc=Эта длань сформирована из живого металла. Это взгромоздение движущейся массы металла способно мощно атаковать в ближнем бою и калечит свои цели в дальнем. Из-за огромной массы эта длань способна распределить нанесенный ей урон по времени.\n\nЭта длань, однако, негибкая и не помещается в узкие проходы. Кроме того, что она, конечно, несет урон не сразу, отложенный урон увеличивается, если длань терпит попадание несколько раз.
actors.mobs.yogfist$brightfist.name=яркая длань
actors.mobs.yogfist$brightfist.teleport=Длань телепортируется подальше, создавая световую вспышку, которая сильно ослепляет вас!
actors.mobs.yogfist$brightfist.desc=Эта длань сформирована из чистой световой энергии. Она способна каждый ход излучать мощные лучи слепящего света! Эти лучи временно ослепляют и, кроме того, наносят тяжелый урон. Длань также способна на короткое время заливать арену слепящим светом, чтобы скрыться.\n\nУ этой длани, однако, нет особых способностей, которые она могла бы применить в ближнем бою.
actors.mobs.yogfist$darkfist.name=тёмная длань
actors.mobs.yogfist$darkfist.teleport=Длань телепортируется подальше, создавая тёмную вспышку, которая тушит ваш источник света!
actors.mobs.yogfist$darkfist.desc=Эта длань сформирована из чистой темной энергии. Она способна каждый ход излучать мощные лучи темной магии! Эти лучи ослабляют ваш источник света и причиняют тяжелый урон. Длань также способна на короткое время заливать арену темнотой, чтобы скрыться.\n\nУ этой длани, однако, нет особых способностей, которые она могла бы применить в ближнем бою.


