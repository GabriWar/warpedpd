actors.mobs.npcs.villager.line_1=Ночью на дорогах поосторожнее. Разбойники шастают.
actors.mobs.npcs.villager.line_2=Говорят, высоко в горах дракон свил гнездо...
actors.mobs.npcs.villager.line_3=Во всей округе нет воды слаще, чем в нашем колодце.
actors.mobs.npcs.villager.line_4=Заблудились, путник? Дорога сама выведет.
actors.mobs.npcs.villager.line_5=Таких, как вы, у нас нечасто встретишь.
actors.mobs.npcs.villager.fisher_dawn_0=Рыба утром голодная. Пойду-ка я на берег.
actors.mobs.npcs.villager.fisher_dawn_2=Леска есть, наживка есть, времени нет. Доброго утра!
actors.mobs.npcs.villager.fisher_day_2=В рыбалке главное — терпение. Ну и черви, конечно.
actors.mobs.npcs.villager.fisher_dusk_0=Вечером рыба клюёт. Ещё раз заброшу — и домой.
actors.mobs.npcs.villager.fisher_dusk_1=Улов неплохой. Сегодня котёл без дела не простоит.
actors.mobs.npcs.villager.crafter_dawn_1=Доброе утро. Смотрите, на ступеньке стружка.
actors.mobs.npcs.villager.crafter_dusk_1=Долгий денёк выдался. Руки сосной пропахли.
actors.mobs.npcs.villager.crafter_dusk_2=Пойду к колодцу. Там всегда найдётся, о чём посудачить.
actors.mobs.npcs.villager.crafter_night_0=Ставни закрыты, лампа горит — на сегодня всё. Спокойной ночи.
actors.mobs.npcs.villager.crafter_night_2=Поздновато, а? Даже петли на дверях затихли.
actors.mobs.npcs.villager.elder_dawn_2=Солнце опять взошло. Вот и славно. Люблю проверять.
actors.mobs.npcs.villager.elder_day_2=Присядьте ненадолго. Так и жизнь деревенская перед глазами пройдёт.
actors.mobs.npcs.villager.elder_dusk_1=Колени чуют дождь. А мои колени никогда не ошибаются.
actors.mobs.npcs.villager.elder_night_0=О, я не спал. Просто глазам отдохнуть дал.
actors.mobs.npcs.villager.elder_night_1=Мне давно спать пора. Да и вам, небось, тоже.
actors.mobs.npcs.villager.loafer_dawn_0=Что, уже утро? Кто это придумал?
actors.mobs.npcs.villager.loafer_dawn_1=Рано вставать? Не, я силы берегу.
actors.mobs.npcs.villager.loafer_dusk_2=У колодца вся жизнь кипит. В основном — сплетни.
actors.mobs.npcs.villager.loafer_night_0=Ещё одну байку расскажу и пойду. Наверное.
actors.mobs.npcs.villager.loafer_night_1=Ночь ещё молодая. Во всяком случае, моложе меня.
actors.mobs.npcs.villager.loafer_night_2=Все спать разошлись. Скучные люди.
actors.mobs.npcs.villager.indoors_1=Слышите, что за погода? Поля подождут. И я тоже.
actors.mobs.npcs.villager.indoors_2=В такую погоду даже собака носа из дому не высунет.
actors.mobs.npcs.villager.break_0=Полдень! Попить, перекусить — и опять за работу.
actors.mobs.npcs.villager.festival_2=Нашего чемпиона никому не одолеть! Ну, почти никому.
actors.mobs.npcs.villager.dance_1=Ноги отваливаются, а мне хоть бы что!
actors.mobs.npcs.villager.dance_2=Ещё кружок, пока музыканты не выдохлись!
actors.mobs.npcs.gnollvillager.line_1=Клан не драться. Клан торговать, клан растить еду.
actors.mobs.npcs.gnollvillager.line_2=Гладкокожий долго идти. Гладкокожий устал?
actors.mobs.npcs.gnollvillager.line_3=Луна сегодня хорошая. Завтра охота хорошая.
actors.mobs.npcs.gnollvillager.asleep=Гр-р... спать сейчас. Говорить, когда солнце.
actors.mobs.npcs.gnollvillager.eclipse_0=Гр-р... старейшины чуять. Луна съест солнце. Скоро.
actors.mobs.npcs.gnollvillager.eclipse_2=Хр-р. Плохое небо идёт. Старейшины велят к огню держаться.
actors.mobs.npcs.gnollvillager.eclipse_now_1=Тс-с. Небо голодное. Ждать. Солнце вернётся.
actors.mobs.npcs.gnollvillager.hunter_dawn_0=Гр-р. Солнце пришло. Охотник сначала лагерь обойти.
actors.mobs.npcs.gnollvillager.hunter_dawn_1=Чую оленя на ветру. Хорошего утра, гладкокожий.
actors.mobs.npcs.gnollvillager.hunter_dawn_2=Ходить по краю. Всегда по краю. Потом есть.
actors.mobs.npcs.gnollvillager.hunter_day_0=Край земли клана безопасный. Охотник следить.
actors.mobs.npcs.gnollvillager.hunter_day_1=У забора следы волка. Старые. Охотник смотрит.
actors.mobs.npcs.gnollvillager.hunter_dusk_0=Последний обход. Потом огонь, потом мясо.
actors.mobs.npcs.gnollvillager.hunter_dusk_2=Забор хороший. Клан хороший. Гр-р... есть хочу.
actors.mobs.npcs.gnollvillager.hunter_night_2=Темно теперь. Клан внутри. Тебе тоже внутрь надо.
actors.mobs.npcs.gnollvillager.gatherer_dawn_0=Ягоды лучше, когда роса на них. Иди быстро.
actors.mobs.npcs.gnollvillager.gatherer_dawn_1=Утро! Собиратель сегодня корни искать. Много корней.
actors.mobs.npcs.gnollvillager.gatherer_dawn_2=Корзина пустая. Корзина пустой не останется.
actors.mobs.npcs.gnollvillager.gatherer_day_2=Нюх-нюх. Что-то сладкое возле забора.
actors.mobs.npcs.gnollvillager.gatherer_dusk_0=Корзина полная. Клан хорошо поест сегодня.
actors.mobs.npcs.gnollvillager.gatherer_dusk_1=Сядь с кланом. Делись ягодами. Так гноллы живут.
actors.mobs.npcs.gnollvillager.gatherer_dusk_2=Солнце устало. Собиратель устал. Все устали.
actors.mobs.npcs.gnollvillager.gatherer_night_2=Ночные жуки громко стрекочут. Собиратель домой идёт.
actors.mobs.npcs.gnollvillager.indoors_0=Небо злое. Гнолл с небом не спорить.
actors.mobs.npcs.gnollvillager.indoors_1=Шерсть мокрая, нос холодный. Клан внутри сидеть.
actors.mobs.npcs.gnollvillager.break_0=У середины отдыхать. Пить. Потом снова в кусты.
actors.mobs.npcs.overworldguard.line_0=В городе держи меч в ножнах, чужак.
actors.mobs.npcs.overworldguard.line_1=Всё спокойно. Пусть так и остаётся.
actors.mobs.npcs.overworldguard.line_2=На дорогах нынче неспокойно. Не теряйте бдительности.
