homestead.awaysettlers.back_quiet=Вы вернулись в %1$s после %2$d дней отсутствия. Здесь всё осталось как было.
homestead.awaysettlers.back_quiet_one=Вы вернулись в %1$s спустя день. Здесь всё осталось как было.
homestead.awaysettlers.back_news=Вы вернулись в %1$s после %2$d дней отсутствия. За это время произошло следующее:
homestead.awaysettlers.back_news_one=Вы вернулись в %1$s спустя день. За это время произошло следующее:
homestead.homeactions.ledger_empty=Пока вас не было, здесь ничего не произошло.
homestead.building.buildplacer.status_job=Строительство: %1$d из %2$d. Коснитесь карты, чтобы остановиться.
homestead.building.buildplacer.status_choose=Выберите постройку в меню строительства.
homestead.building.buildplacer.status_single=Коснитесь зелёной клетки, чтобы построить здесь, или дальней клетки, чтобы подойти к ней.
homestead.building.buildplacer.status_line_start=Укажите начало линии. Коснитесь дальней клетки, чтобы подойти к ней.
homestead.building.buildplacer.status_area_start=Укажите один из углов области. Коснитесь дальней клетки, чтобы подойти к ней.
homestead.building.buildplacer.status_too_big=Слишком большая область: %1$d клеток при максимуме %2$d.
homestead.building.buildplacer.status_plan=Хватит материалов на %1$d из %2$d построек. Коснитесь выделенной области ещё раз, чтобы начать.
homestead.building.buildplacer.status_demolish=Коснитесь постройки, которую хотите разобрать, или дальней клетки, чтобы подойти к ней.
homestead.building.buildplacer.status_demolish_none=Разобрать «%s»? Материалы не вернутся. Коснитесь ещё раз для подтверждения.
homestead.building.buildplacer.status_demolish_target=Разобрать «%1$s» и вернуть материалы: %2$s? Коснитесь ещё раз для подтверждения.
homestead.building.buildplacer.status_repair=Коснитесь повреждённой постройки, чтобы починить её, или дальней клетки, чтобы подойти к ней.
homestead.building.buildplacer.status_repair_target=Починить «%1$s», потратив %2$s? Коснитесь ещё раз для подтверждения.
homestead.building.buildplacer.confirm_station=Разобрать «%s»? Всё содержимое окажется на земле.
homestead.building.buildplacer.job_danger=Вы прерываете строительство: кто-то приближается.
homestead.building.buildplacer.job_short=Не хватает материалов ещё на %d шт.
homestead.building.buildinfo.rule_ground=Ставится на открытой земле или построенном полу. Не подходит для воды, льда и грядок.
homestead.building.buildinfo.rule_next_to_water=Ставится на открытой земле рядом с водой.
homestead.building.buildinfo.rule_roof=Ставится над полом или стеной, не дальше четырёх клеток от несущей стены.
homestead.building.buildinfo.rule_open_front=Ставится на открытой земле. Перед лицевой стороной (к югу) должно быть свободное место.
homestead.building.buildinfo.roof=Над головой: %1$s. Прочность: %2$d из %3$d.
homestead.piece.wall_log.desc=Брёвна уложены друг на друга с вырубленными пазами. Такую стену легко возвести, но она горит.
homestead.piece.wall_plank.desc=Доски прибиты к балкам. Прочнее брёвен, но горят так же хорошо.
homestead.piece.wall_stone.desc=Грубо обтёсанный камень уложен рядами. Прочная негорючая стена.
homestead.piece.wall_brick.desc=Обожжённый кирпич скреплён глиной. Самая прочная стена из доступных, не горит.
homestead.piece.window_log.desc=Стекло в бревенчатой раме. Пропускает свет и позволяет смотреть наружу, но не пропускает людей.
homestead.piece.window_plank.desc=Стекло в дощатой раме. Пропускает свет и позволяет смотреть наружу, но не пропускает людей.
homestead.piece.window_stone.desc=Стекло в каменной раме. Пропускает свет и позволяет смотреть наружу, но не пропускает людей.
homestead.piece.window_brick.desc=Стекло в кирпичной раме. Пропускает свет и позволяет смотреть наружу, но не пропускает людей.
homestead.piece.door.desc=Простая деревянная дверь. Её откроет кто угодно, даже чудовище.
homestead.piece.door_barred.desc=Тяжёлая дверь с железным засовом. Открыть её можете только вы и ваши союзники. Чудовищам придётся её выбивать.
homestead.piece.floor_plank.desc=Доски, уложенные на землю. Пол нельзя разрушить.
homestead.piece.floor_stone.desc=Каменные плиты, уложенные на землю. Пол нельзя разрушить.
homestead.piece.path.desc=Камни, уложенные в землю и образующие дорожку. Её нельзя разрушить.
homestead.piece.fence.desc=Столбы с поперечинами. Животным не пройти, зато поверх забора всё видно.
homestead.piece.gate.desc=Калитка в заборе. Вы и ваши союзники можете её открывать, животные и чудовища — нет.
homestead.piece.palisade.desc=Заострённые брёвна, скреплённые верёвкой. Загораживают путь, но не обзор. Горят.
homestead.piece.bridge.desc=Дощатый настил над мелкой или глубокой водой. По нему можно перейти на другой берег.
homestead.piece.roof_thatch.desc=Соломенное покрытие на одну клетку. Дешёвое, но может загореться от молнии.
homestead.piece.roof_plank.desc=Дощатое покрытие на одну клетку. Горит, но молния его не поджигает.
homestead.piece.roof_slate.desc=Каменные плиты на одну клетку. Долговечная крыша, не горит.
homestead.piece.roof_tile.desc=Глиняная черепица на одну клетку. Долговечная крыша, не горит.
homestead.piece.roof_glass.desc=Стеклянные панели на одну клетку. Пропускают свет к растениям под крышей.
homestead.builtterrain.wall_log_desc=Стена из сложенных брёвен. Легко загорится.
homestead.builtterrain.wall_plank_desc=Стена из прибитых друг к другу досок. Легко загорится.
homestead.builtterrain.wall_stone_desc=Стена из грубого камня, уложенного рядами.
homestead.builtterrain.wall_brick_desc=Стена из обожжённого кирпича на глиняном растворе.
homestead.builtterrain.window_log_desc=Стекло в бревенчатой стене. Сквозь него видно наружу.
homestead.builtterrain.window_plank_desc=Стекло в дощатой стене. Сквозь него видно наружу.
homestead.builtterrain.window_stone_desc=Стекло в каменной стене. Сквозь него видно наружу.
homestead.builtterrain.window_brick_desc=Стекло в кирпичной стене. Сквозь него видно наружу.
homestead.builtterrain.door_desc=Деревянная дверь. Открыть её может кто угодно.
homestead.builtterrain.door_barred_desc=Тяжёлая дверь с железным засовом. Встаньте рядом и коснитесь двери, чтобы отодвинуть засов. Когда проход освободится, она снова закроется.
homestead.builtterrain.door_barred_open_desc=Засов отодвинут. Когда проход освободится, дверь снова закроется.
homestead.builtterrain.palisade_desc=Заострённые брёвна, связанные верёвкой. Сквозь них видно, но пройти нельзя.
homestead.builtterrain.fence_desc=Столбы с перекладинами. Поверх забора всё видно.
homestead.builtterrain.gate_desc=Калитка в заборе. Встаньте рядом и коснитесь её, чтобы открыть. Когда проход освободится, она снова закроется.
homestead.builtterrain.gate_open_desc=Калитка открыта. Как только проход освободится, она закроется.
homestead.builtterrain.farmland_wet_desc=Вскопанная земля, влажная после полива.
homestead.builtterrain.stump_oak_desc=Всё, что осталось от срубленного дуба.
homestead.builtterrain.stump_pine_desc=Всё, что осталось от срубленной сосны. На пне ещё выступает смола.
homestead.builtterrain.sapling_shrub_desc=Молодой кустик, выросший из семени. За несколько весенних или летних дней он разрастётся.
homestead.builtterrain.rubble_wood_desc=Обломки досок и щепки — всё, что осталось от постройки.
homestead.builtterrain.rubble_stone_desc=Обломки камня — всё, что осталось от постройки.
homestead.gathering.gathering.guest=В совместной игре копать и собирать урожай инструментами из рюкзака может только хозяин.
homestead.gathering.gathering.villagers=Жителям деревни это вряд ли понравится.
homestead.gathering.gathering.no_pick=Чтобы разбить валун, нужна кирка, горный инструмент, молот каменотёса, боевой молот или молот Мейстера.
homestead.gathering.gathering.nothing_to_dig=Здесь нечего копать. Лопатой можно превращать траву и голую землю в грядки, добывать глину на берегах рек и болот, песок — на пляжах и в пустыне, а также выкапывать пни и саженцы.
homestead.gathering.gathering.nothing_to_reap=На солому можно срезать только высокую траву.
items.weapon.melee.woodcuttersaxe.desc=Топор лесоруба с длинной рукоятью и широким острым лезвием. Срубает дерево за 3 удара, но в бою неудобен.\n\nВстаньте рядом с деревом и коснитесь его, чтобы срубить. Подойдёт любой топор: ручному понадобится 8 ударов, обычному — 6, боевому — 5, большому — 4. Особенность «Лесоруб» уменьшает необходимое число ударов.
items.weapon.melee.masonshammer.desc=Тяжёлый молот с квадратным бойком для дробления камня. Разбивает валун на необработанный камень за 2 удара. Кирке, боевому молоту, молоту Мейстера и горному инструменту требуется 3. Если в рюкзаке нет кирки, этим молотом можно также разбивать каменные стены за 3 удара. Особенность «Каменолом» уменьшает число необходимых ударов. В бою молот неудобен.\n\nВстаньте рядом с валуном и коснитесь его, чтобы разбить.
items.materials.log.desc=Дубовое бревно со срубленного дерева. Подходит для бревенчатых стен и частоколов, а ещё распиливается на доски.
items.materials.pinelog.desc=Сосновое бревно со срубленного дерева. В строительстве используется так же, как дубовое.
items.materials.plank.desc=Распиленные доски. Из них делают стены, полы, крыши, двери, заборы и мебель.
items.materials.resin.desc=Густая янтарная смола сосны. Используется как клей и герметик.
items.materials.roughstone.desc=Кусок камня. Подходит для каменных стен, полов и мощёных дорожек.
items.materials.cutstone.desc=Тёсаный каменный блок. Используется для сланцевых крыш и более тонкой каменной кладки.
items.materials.clay.desc=Влажная глина с речного берега. Из неё обжигают кирпичи и делают раствор для кирпичных стен.
items.materials.firedbrick.desc=Твёрдые красные кирпичи. Подходят для стен, черепичных крыш, очагов и кузниц.
items.materials.sand.desc=Горсть светлого песка. Его можно переплавить в стекло.
items.materials.glasspane.desc=Лист прозрачного стекла. Нужен для окон и стеклянных крыш.
items.materials.thatch.desc=Сноп сухой соломы. Используется для соломенных крыш и постелей, а также для изготовления верёвки.
items.materials.rope.desc=Моток свитой верёвки. Нужен для калиток и колодцев, а ещё чтобы вести животное на привязи.
items.materials.hide.desc=Необработанная шкура животного. Из неё можно выделать кожу.
items.materials.leather.desc=Выделанная кожа. Используется для меховых постелей, ковров и тёплой одежды.
items.materials.charcoal.desc=Куски древесного угля. Самое жаркое топливо для печи, кузницы и очага.
items.materials.ironfittings.desc=Петли, прутья и гвозди. Нужны для дверей с засовом и сигнальных колоколов.
items.materials.vulturefeather.desc=Длинное маховое перо стервятника, тёмное, с серебристой каймой. Из 2 таких перьев и доски на верстаке можно сделать 5 дротиков.
items.materials.gatortooth.desc=Изогнутый зуб цвета старой слоновой кости, длиной с палец. Из одного зуба и доски на верстаке можно сделать наконечники для 2 рыболовных острог.
items.bags.builderssatchel.desc=Прочная холщовая сумка для стройматериалов, переносных сундуков и строительного инструмента, а также всего, что добывают из камня: руд, самоцветов, каменной руды, тёмного золота, норнских камней и сердцевин мастерской работы. Брёвна, камни, доски, сундуки, инструменты и руда складываются сюда вместо рюкзака. При строительстве материалы в первую очередь берутся из этой сумки.
homestead.rooms.roomkinds.bedroom_line=Спальня: можно спать в кровати. Если все двери закрыты, а стены целы, вас никто не потревожит во сне.
homestead.rooms.roomkinds.kitchen_line=Кухня: сытная еда, съеденная здесь, сохраняет сытость в полтора раза дольше.
homestead.rooms.roomkinds.storehouse_line=Кладовая: каждый сундук в ней вмещает на 10 предметов больше.
homestead.rooms.roomkinds.shrine_line=Святилище: переночевав здесь, вы проснётесь с благословением, которое на сутки ускорит исцеление на 10%.
homestead.rooms.homebed.desc_straw=Куча соломы под грубым одеялом. Лучше, чем спать на голой земле.
homestead.rooms.homebed.desc_wood=Деревянная рама с соломенным матрасом и шерстяным одеялом.
homestead.rooms.homebed.desc_fur=Деревянный каркас, заваленный мехами. В них тепло даже холодной ночью.
homestead.rooms.homebed.desc_heal=Сон здесь восстанавливает %1$d%% здоровья. Уют комнаты: %2$s.
homestead.rooms.homebed.menu_heal=Сон здесь восстанавливает %d%% здоровья.
homestead.rooms.homebed.menu_sealed=Комната закрыта, стены целы. Во сне вас никто не найдёт.
homestead.rooms.homebed.menu_open=Постель стоит в незамкнутом помещении. Ночью вас могут обнаружить.
homestead.rooms.homebed.menu_open_fire=Постель стоит в незамкнутом помещении. Ночью вас могут обнаружить, хотя огонь снижает этот риск.
homestead.rooms.homebed.menu_fur=Меха согреют вас, если в комнате не будет нестерпимо холодно.
homestead.rooms.homebed.blessed=Вы просыпаетесь с тихим благословением святилища.
homestead.rooms.homebed.not_tired=Вы ещё хорошо отдохнули и пока не можете уснуть снова.
homestead.rooms.wellrested.desc=Вы хорошо выспались в настоящей кровати. Получаемый опыт увеличен на 10%%, а скорость исцеления — на 10%%.\n\nОсталось ходов: %s.
homestead.rooms.shrineblessing.desc=Вы переночевали в святилище и проснулись с благословением. Исцеление ускорено на 10%%.\n\nОсталось ходов: %s.
items.food.food.kitchen_made=Приготовлено на кухне: сохраняет сытость в полтора раза дольше.
homestead.piece.bed_straw.desc=Куча соломы под одеялом. За ночь восстанавливает четверть здоровья, а в уютной комнате — ещё больше. Горит.
homestead.piece.bed_wood.desc=Деревянная рама с соломенным матрасом. За ночь восстанавливает треть здоровья, а в уютной комнате — ещё больше. Горит.
homestead.piece.bed_fur.desc=Деревянная рама, устланная мехами. За ночь восстанавливает половину здоровья, а меха согревают, пока в комнате не станет нестерпимо холодно. Горит.
homestead.piece.rug.desc=Кожаный ковёр на полу. Делает комнату уютнее.
homestead.piece.bookshelf.desc=Пустой деревянный книжный шкаф. Повышает уют комнаты. Перед ним должно быть свободное место, поэтому его нельзя поставить вплотную к стене сверху. Горит.
homestead.piece.statue.desc=Высеченная из камня статуя. Повышает уют комнаты, а комната с такой статуей становится святилищем.
homestead.piece.workbench.desc=Верстак с пилой и молотком. Позволяет распиливать брёвна на доски, свивать солому в верёвку и делать факелы. Если в той же комнате есть ещё одно ремесленное устройство, она становится мастерской: все устройства работают на четверть быстрее.
homestead.piece.masons_bench.desc=Стол с каменной столешницей и деревянной киянкой. Позволяет превращать необработанный камень в тёсаный.
homestead.piece.kiln.desc=Купольная глиняная печь. Разожгите её брёвнами или древесным углём, чтобы обжигать кирпичи из глины, плавить стекло из песка и превращать дерево в древесный уголь.
homestead.piece.hearth_brick.desc=Кирпичный очаг. Пока горит, согревает комнату, отпугивает диких животных, позволяет печь хлеб и жарить мясо.
homestead.piece.hearth_stone.desc=Очаг из грубого камня. Пока горит, согревает комнату, отпугивает диких животных, позволяет печь хлеб и жарить мясо.
homestead.piece.cooking_pot.desc=Котёл над углями. Позволяет готовить похлёбки, пустофрукты и мясные пироги без затрат алхимической энергии.
homestead.piece.tanning_rack.desc=Деревянная рама для выделки шкур. Постепенно превращает шкуру в кожу.
homestead.piece.forge.desc=Кирпичный горн с мехами. Разожгите его брёвнами или древесным углём, чтобы получать железную фурнитуру из железной руды. Сердцевины мастерской работы здесь не изготовить.
homestead.piece.quern.desc=Два жернова с рукоятью. Перемалывают кукурузопшеницу в муку.
homestead.piece.alchemy_pot.desc=Ваш собственный алхимический котёл. Работает как обычный. Его нельзя разрушить, а после разборки потраченное золото не возвращается.
homestead.piece.enchanting_pedestal.desc=Ваш собственный постамент зачарования. Работает как обычный. Его нельзя разрушить, а после разборки потраченное золото не возвращается.
homestead.stations.workbench.desc=Крепкий верстак с пилой и молотком. Коснитесь его, чтобы узнать, что здесь можно изготовить.
homestead.stations.masonsbench.desc=Верстак каменотёса с каменной столешницей и киянкой. Коснитесь его, чтобы узнать доступные изделия.
homestead.stations.kiln.desc=Купольная глиняная печь. Работает только с горящим огнём. Коснитесь её, чтобы добавить топливо, разжечь и запустить производство.
homestead.stations.hearth.desc=Очаг с дымоходом. Пока горит, согревает комнату, отпугивает диких животных и готовит всё, что бросают в огонь. Коснитесь его, чтобы добавить топливо, разжечь и начать готовку.
homestead.stations.cookingpot.desc=Котёл на треноге над постоянно тлеющими углями. Коснитесь его, чтобы посмотреть доступные блюда.
homestead.stations.tanningrack.desc=Деревянная рама для растягивания и выделки шкур. Коснитесь её, чтобы начать работу.
homestead.stations.forge.desc=Кирпичный горн с мехами и дымоходом. Работает только с горящим огнём. Коснитесь его, чтобы добавить топливо, разжечь и запустить производство.
homestead.stations.quern.desc=Два жернова с рукоятью. Коснитесь мельницы, чтобы начать помол.
homestead.stations.homesteadstation.craft_queue_full=Очередь работ заполнена.
homestead.stations.homesteadstation.craft_bad_batch=Указанное количество партий здесь обработать нельзя.
homestead.stations.homesteadstation.made_many=Устройство «%1$s» завершило работу: %2$s (партий: %3$d).
homestead.stations.homesteadstation.net_host_only=В совместной игре пользоваться ремесленными устройствами может только хозяин.
homestead.stations.homesteadstation.status_working=Изготавливается: %1$s. Осталось %2$d шт., текущая партия готова на %3$d%%.
homestead.stations.homesteadstation.status_waiting=Ожидает обработки: %1$s. Осталось %2$d шт. Нужно разжечь огонь.
homestead.stations.heatstation.status_lit=Огонь горит. Топлива хватит ещё на %d ходов.
homestead.stations.heatstation.status_unlit=Огонь погас. Топлива осталось на %d ходов.
homestead.stations.heatstation.status_no_fuel=Огонь погас, топливо закончилось.
homestead.stations.stationrooms.workshop_line=Верстак и ещё одно ремесленное устройство: все устройства здесь работают на %d%% быстрее.
windows.wndcraft.fire_out=Огонь погас. Внутри осталось топлива на %d ходов.
windows.wndcraft.fire_empty=Огонь погас, топлива нет. Добавьте брёвна или древесный уголь.
windows.wndcraft.fuel_slot=Топливо: %1$d из %2$d единиц. Бревно горит 200 ходов, древесный уголь — 400.
windows.wndcraft.job_waiting=%1$s, осталось %2$d шт. (нужно разжечь огонь)
windows.wndcraft.cancelled=Вы отменяете изготовление «%s» и забираете вложенные материалы.
windows.wndcraft.queued_done=Устройство «%1$s» приступает к работе: %2$s (партий: %3$d).
items.food.flour.desc=Мешок муки из кукурузопшеницы, перемолотой на ручной мельнице. В очаге из неё можно испечь хлеб.
items.food.bread.desc=Румяная буханка хлеба из очага. Насыщает в полтора раза сильнее обычного пайка.
homestead.piece.watchtower.desc=Высокая дощатая башня. Встаньте рядом и взберитесь на неё, чтобы видеть на 4 клетки дальше и замечать волков и разбойников, приближающихся к дому на расстоянии 30 клеток. На территории дома она снижает интерес разбойников к добыче. Горит.
homestead.piece.alarm_bell.desc=Железный колокол на столбе. Когда вы спите или отдыхаете на своей территории, он разбудит вас, если на участок проникнет враг или ночью к дому подойдут волки либо разбойники. Без колокола вы можете проспать нападение. Установленный у дома колокол отпугивает разбойников.
homestead.piece.spike_trap.desc=Рама с железными шипами на открытой земле. Ранит и калечит наступивших на неё чудовищ, но не вас и ваших союзников. Через 20 ходов после срабатывания взводится снова.
homestead.threats.wolfsiege.came=У границ поселения «%1$s» воют волки! Они приближаются с направления: %2$s!
homestead.threats.homeraider.came=К поселению «%1$s» с направления «%2$s» приближаются разбойники!
homestead.threats.homeraider.grabbed=Разбойник хватает из вашего сундука %d предметов и бросается бежать!
homestead.threats.homeraider.desc=Ночной грабитель, охотящийся за содержимым сундуков. Выбирает самый богатый, при необходимости врывается в дом, хватает сколько унесёт и сбегает. Убейте его, чтобы вернуть похищенное.
homestead.threats.threatslice.siege_slain=На «%1$s» напали волки. Ни один не дожил до рассвета.
homestead.threats.threatslice.siege_fought=На «%1$s» напали волки. Вы убили %2$d, а остальные к рассвету убрались прочь.
homestead.threats.threatslice.siege_left=Волки всю ночь кружили вокруг «%1$s» и ушли на рассвете.
homestead.threats.threatslice.raid_stolen=Разбойники ограбили «%1$s» и скрылись с %3$d предметами.
homestead.threats.threatslice.raid_slain=Разбойники напали на «%1$s», но были перебиты до последнего.
homestead.threats.threatslice.raid_driven=Разбойники напали на «%1$s», но их прогнали с пустыми руками.
homestead.threats.threatslice.spotted_wolves=Со сторожевой башни видны волки, приближающиеся с направления: %s!
homestead.threats.threatslice.spotted_raiders=Со сторожевой башни видны разбойники, приближающиеся с направления: %s!
homestead.threats.threatsettler.raid_robbed=В ночь %2$d-го дня разбойники проникли в «%1$s» и опустошили сундук: украдено %3$d предметов (%4$s).
homestead.threats.threatsettler.raid_robbed_door=В ночь %2$d-го дня разбойники взломали «%5$s» в «%1$s» и опустошили сундук: украдено %3$d предметов (%4$s).
homestead.threats.threatsettler.raid_nothing=В ночь %2$d-го дня разбойники наведались в «%1$s», но не нашли ничего ценного.
homestead.threats.threatsettler.raid_again=В ночь %d-го дня разбойники вернулись, однако красть уже было нечего.
homestead.threats.threatsettler.siege_gnawed=В ночь %2$d-го дня волки осадили «%1$s» и погрызли %3$d секций заборов и калиток.
homestead.threats.threatsettler.siege_circled=В ночь %2$d-го дня волки кружили вокруг «%1$s», а на рассвете ушли.
homestead.threats.watchtower.desc=Высокая дощатая башня со смотровой площадкой. Подойдите вплотную и коснитесь её, чтобы подняться.
homestead.threats.watchtower.ask=С вершины обзор увеличивается на %1$d клеток. Вы замечаете волков и разбойников, идущих к дому, в радиусе %2$d клеток от башни. Сделайте шаг с площадки, чтобы спуститься.
homestead.threats.watchtower.already_up=Вы уже на сторожевой башне.
homestead.threats.watchtower.net_host_only=Пока что в совместной игре подниматься на сторожевую башню может только хозяин.
homestead.threats.alarmbell.desc=Железный колокол на столбе. Пока вы спите или отдыхаете на территории дома, он разбудит вас, если туда проникнет враг или ночью к дому подойдут волки либо разбойники. Коснитесь колокола, чтобы позвонить.
homestead.threats.alarmbell.rings=Звонит сигнальный колокол! На вашу землю проник враг.
homestead.threats.alarmbell.rings_coming=Звонит сигнальный колокол! Во тьме кто-то приближается к вашему дому.
homestead.threats.spiketrap.desc=Хорошо заметная рама с железными шипами. Чудовища, наступившие на неё, получают раны и увечья. Для вас и союзников она безопасна. Через 20 ходов после срабатывания ловушка снова готова.
homestead.threats.lookout.desc=Вы на смотровой площадке сторожевой башни. Обзор увеличен на %1$d клеток, а волков и разбойников, идущих к дому, видно в радиусе %2$d клеток от башни.\n\nСделайте шаг с площадки, чтобы спуститься.
windows.wndhomeledger.above=Заметность: %1$d. Это выше порога набегов (%2$d): ночью в дом могут наведаться разбойники, а зимой волки нападают чаще.
windows.wndhomeledger.below=Заметность: %1$d. Это ниже порога набегов (%2$d): разбойники не трогают этот дом.
homestead.piece.hearthstone.desc=Невысокий камень с вырезанной руной. Вокруг него образуется дом: дикие животные не подходят ближе 10 клеток. От камня можно перемещаться к другим своим домам и уже активированным путевым камням. Можно владеть не более чем тремя домами.
homestead.piece.hearthstone.remove_warning=Разобрать камень очага? Вместе с ним исчезнет статус дома и возможность перемещаться сюда.
homestead.travel.hearthstone.desc=Невысокий камень с руной — сердце дома. Дикие животные не подходят к нему ближе %d клеток. Ночью руна светится. Коснитесь камня, чтобы отправиться к другому дому или активированному путевому камню либо переименовать этот дом.
homestead.travel.hearthstone.guest=Это камень очага поселения «%s». В совместной игре перемещаться через него и переименовывать дом может только хозяин.
homestead.travel.hearthstone.founded=Теперь это ваш дом: «%s». Коснитесь камня очага, чтобы переместиться отсюда или переименовать дом.
homestead.travel.hearthstone.lost=Камень очага поселения «%s» исчез. Вместе с ним пропал и дом.
homestead.travel.waystone.desc=Высокая сланцевая плита у колодца в «%s». На ней высечена спящая руна. Прикоснитесь, чтобы активировать её. После этого сюда можно будет перемещаться из любого вашего дома и от других активированных камней, а отсюда — к ним.
homestead.travel.waystone.desc_attuned=Путевой камень в «%s». Его руна светится: отсюда можно переместиться к вашим домам и другим активированным камням, а также вернуться обратно.
homestead.travel.waystone.attuned=Путевой камень в «%s» пробуждается от вашего прикосновения. Теперь сюда можно перемещаться.
homestead.travel.waystone.guest=В совместной игре через камни может перемещаться только хозяин.
homestead.travel.travel.refuse_guest=В совместной игре через камни может перемещаться только хозяин.
homestead.travel.travel.refuse_not_here=Чтобы переместиться, нужно находиться у камня.
homestead.travel.travel.refuse_not_beside=Для перемещения встаньте рядом с камнем.
homestead.travel.travel.refuse_levitating=Пока вы парите в воздухе, коснуться руны нельзя.
homestead.travel.travel.refuse_rooted=Пока что-то удерживает вас на месте, переместиться нельзя.
homestead.travel.travel.refuse_enemies=Нельзя перемещаться, пока видны враги.
homestead.travel.travel.refuse_too_hungry=Вы слишком голодны для такого путешествия: оно вас убьёт. Сначала поешьте.
homestead.travel.wndtravel.intro=Путешествие расходует только сытость: по половине единицы за каждую клетку между камнями и по 60 за каждый уровень вверх или вниз, но не более 450. Время в пути не идёт. Ваш показатель голода: %1$d. Голод начинается при %2$d, истощение — при %3$d.
homestead.travel.wndtravel.nowhere=Пока некуда перемещаться. Активируйте путевой камень в городе или большом поселении либо постройте ещё один камень очага.
homestead.travel.wndtravel.warn_hurt=Вы прибудете в состоянии истощения и потеряете по дороге %d здоровья!
homestead.travel.wndtravel.warn_deadly=Это путешествие приведёт к голодной смерти. Сначала поешьте.
homestead.travel.wndtravel.confirm_cost=Путешествие обойдётся в %1$s (%2$d единиц голода). Время в пути не идёт.
homestead.travel.wndhome.body=Название дома: %1$s. Дикие животные не подходят ближе %2$d клеток к его камню очага.
homestead.torches.standingtorch.desc=Факел на шесте, вбитом в землю. Горит постоянно, освещает окрестности и не даёт диким животным селиться в пределах десяти клеток. Коснитесь, чтобы забрать.
homestead.torches.standingtorch.taken=Вы вытаскиваете факел из земли.
