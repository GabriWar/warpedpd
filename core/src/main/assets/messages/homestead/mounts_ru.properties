# Дополнение русского перевода: пакет 500 ключей
actors.mobs.horse.desc=Быстрая и сильная лошадь, обитающая на открытых лугах. Дикие лошади днём пасутся небольшими табунами и убегают при приближении чужаков.
actors.mobs.horse.desc_trust_0=Лошадь настороженно косится на вас. Оставьте ей корм — солому, стебель зерновика, абрикос или сырой пресный плод — и отойдите, пока она ест.
actors.mobs.horse.desc_trust_1=Лошадь один раз приняла ваш корм и теперь подпускает немного ближе.
actors.mobs.horse.desc_trust_2=Лошадь уже дважды приняла ваш корм и убегает только если подойти вплотную.
actors.mobs.horse.desc_trust_3=Лошадь больше вас не сторонится. Покормите её с руки, и она станет вашей.
actors.mobs.horse.desc_tame=Ваша лошадь. Она ждёт там, где вы её оставили. На ней пока нет седла: оседлайте её, чтобы ездить верхом.
actors.mobs.horse.desc_saddled=Ваша осёдланная лошадь. Коснитесь её, чтобы сесть верхом, или удерживайте касание, чтобы открыть меню.
actors.mobs.horse.desc_sale=Спокойная осёдланная лошадь конюха. Коснитесь, чтобы купить её.
items.misc.saddle.desc=Ездовое седло поверх красного потника. Наденьте его на свою лошадь через её меню или с помощью самого седла — и сможете ездить по поверхности и в горах. На дубильной стойке седло делают из двух шкур и верёвки. Конюхи также продают сёдла.
homestead.mounts.riding.desc=Вы едете верхом на своей лошади (%1$s). На поверхности и в горах вы передвигаетесь вдвое быстрее: каждый шаг отнимает вдвое меньше времени и сытости. Лошадь принимает на себя треть урона от каждого попадания по вам. Коснитесь своего персонажа, чтобы спешиться; перед ударом в ближнем бою вы спешитесь автоматически.\n\nЗдоровье лошади: %2$d из %3$d.
homestead.mounts.mounts.host_only=В совместной игре приручать, седлать лошадей и ездить верхом может только ведущий.
homestead.mounts.mounts.no_riding_here=Ездить верхом можно только на поверхности и в горах.
homestead.mounts.mounts.cant_now=Сейчас вы не можете сесть верхом.
homestead.mounts.mounts.no_room=Рядом с вами нет места для лошади.
homestead.mounts.mounts.no_drop=Ваша лошадь не станет прыгать в пропасть.
homestead.mounts.mounts.mounted=Вы вскакиваете на лошадь (%s). Коснитесь своего персонажа, чтобы спешиться.
homestead.mounts.mounts.at_door=У дверей вы спешиваетесь. Ваша лошадь (%s) ждёт снаружи.
homestead.mounts.mounts.at_shore=У кромки воды вы спешиваетесь. Ваша лошадь (%s) остаётся на берегу.
homestead.mounts.mounts.jump_down=Вы спрыгиваете с лошади (%s), чтобы вступить в бой.
homestead.mounts.mounts.waits=Вы оставляете свою лошадь (%s) ждать снаружи.
homestead.mounts.mounts.freed=Вы отпускаете лошадь (%s) на волю. Она снова становится дикой и убегает.
homestead.mounts.mounts.menu=Здоровье вашей лошади: %1$d из %2$d.
homestead.mounts.mounts.menu_no_saddle=На ней нет седла. Его можно изготовить на дубильной стойке или купить у конюха.
homestead.mounts.mounts.free_confirm=Отпустить лошадь на волю? Она одичает и забудет вас. Седло вернётся к вам.
homestead.mounts.taming.shied=Дикая лошадь шарахается и убегает. Оставьте ей корм и держитесь поодаль, пока она ест.
homestead.mounts.taming.no_food=Дикая лошадь недоверчиво смотрит на ваши пустые руки. Солома, стебель зерновика, абрикос или сырой пресный плод могут её расположить.
homestead.mounts.taming.trust_1=Теперь лошадь смотрит на вас с меньшей опаской.
homestead.mounts.taming.trust_3=Лошадь больше не сторонится вас. Покормите её с руки.
homestead.mounts.taming.tamed=Лошадь берёт корм с вашей ладони и ласково тычется мордой. Теперь она ваша.
homestead.mounts.stables.closed=Конюх ушёл спать.
homestead.mounts.stables.offer=Здоровая, смирная осёдланная лошадь за %1$d золотых. У вас есть %2$d.
homestead.mounts.stables.bought=Лошадь теперь ваша, вместе с седлом.
actors.mobs.npcs.overworldshopkeeper.talk_stable=У нас хорошие лошади, все приучены к седлу. Коснись той, что приглянулась. Сёдла и сено лежат на перекладине. Лошади едят солому, зерновик и фрукты.
homestead.animals.roping.too_wild=Дикая лошадь шарахается от верёвки. Сначала приручите её кормом.
homestead.animals.roping.not_yours=Эта лошадь принадлежит конюху.
