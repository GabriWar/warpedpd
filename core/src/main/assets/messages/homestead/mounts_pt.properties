###os cavalos e a montaria (actors/mobs/Horse, items/misc/Saddle, homestead/mounts)

###o cavalo
actors.mobs.horse.name=cavalo selvagem
actors.mobs.horse.name_tame=cavalo
actors.mobs.horse.desc=Um cavalo do campo aberto, rápido e forte. Os selvagens pastam em pequenas manadas durante o dia e disparam quando alguém chega perto.
actors.mobs.horse.desc_trust_0=Ele te olha desconfiado. Deixe algo para ele comer (palha, uma espiga de milhotrigo, um damasco ou uma frutinsossa crua) e fique longe enquanto ele come.
actors.mobs.horse.desc_trust_1=Ele já comeu a sua comida uma vez e deixa você chegar um pouco mais perto.
actors.mobs.horse.desc_trust_2=Ele já comeu a sua comida duas vezes e só dispara quando você está bem do lado dele.
actors.mobs.horse.desc_trust_3=Ele não foge mais de você. Dê comida na mão e ele será seu.
actors.mobs.horse.desc_tame=O seu cavalo. Ele espera onde você deixar. Está sem sela: coloque uma para montar.
actors.mobs.horse.desc_saddled=O seu cavalo, selado. Toque nele para montar, ou segure o toque para ver o menu dele.
actors.mobs.horse.desc_sale=O cavalo do cavalariço, selado e manso. Toque nele para comprar.
actors.mobs.horse.died=O seu cavalo morreu.

###a sela
items.misc.saddle.name=sela
items.misc.saddle.desc=Uma sela de montaria sobre uma manta vermelha. Coloque num cavalo seu, pelo menu do cavalo ou com esta sela, e você pode montar nele na superfície e subindo as montanhas. Um cavalete de curtume faz uma com dois couros crus e uma corda, e os cavalariços vendem.
items.misc.saddle.ac_saddle=SELAR
items.misc.saddle.prompt=Escolha o seu cavalo ao seu lado

###a cavalo
homestead.mounts.riding.name=A cavalo
homestead.mounts.riding.desc=Você está montado no seu %1$s. Na superfície e nas montanhas você anda duas vezes mais rápido, então cada passo custa metade do tempo e metade da fome. O seu cavalo leva um terço de cada golpe que acerta você. Toque em você mesmo para desmontar; atacar um inimigo corpo a corpo faz você desmontar antes.\n\nVida do seu cavalo: %2$d de %3$d.
homestead.mounts.riding.desc_none=Você está a cavalo.
homestead.mounts.riding.hurt=O seu %s está muito ferido!

