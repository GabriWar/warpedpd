homestead.threats.wolfsiege.came=Lobos uivam na beira de %1$s, vindos do %2$s!
homestead.threats.homeraider.came=Bandidos vêm do %2$s atrás de %1$s!
homestead.threats.homeraider.grabbed=Um bandido arranca %d coisas do seu baú e sai correndo!
homestead.threats.homeraider.desc=Um bandido que veio à noite atrás das coisas nos seus baús. Ele vai direto ao baú mais rico, arromba onde precisar, pega o que consegue carregar e foge. Derrube-o para recuperar o que ele levou.
homestead.threats.threatslice.siege_slain=Lobos cercaram %1$s, e nenhum deles viveu para ver o amanhecer.
homestead.threats.threatslice.siege_fought=Lobos cercaram %1$s. Você matou %2$d deles, e o resto sumiu de fininho ao amanhecer.
homestead.threats.threatslice.siege_left=Lobos rondaram %1$s a noite toda e sumiram de fininho ao amanhecer.
homestead.threats.threatslice.raid_stolen=Bandidos atacaram %1$s e fugiram com %3$d coisas.
homestead.threats.threatslice.raid_slain=Bandidos atacaram %1$s e foram abatidos até o último.
homestead.threats.threatslice.raid_driven=Bandidos atacaram %1$s e foram expulsos de mãos vazias.
homestead.threats.threatslice.spotted_wolves=Da torre de vigia, você vê lobos vindo do %s!
homestead.threats.threatslice.spotted_raiders=Da torre de vigia, você vê bandidos vindo do %s!
homestead.threats.threatsettler.raid_robbed=Bandidos invadiram %1$s na noite do dia %2$d e esvaziaram um baú: %3$d coisas sumiram (%4$s).
homestead.threats.threatsettler.raid_robbed_door=Bandidos arrombaram a %5$s de %1$s na noite do dia %2$d e esvaziaram um baú: %3$d coisas sumiram (%4$s).
homestead.threats.threatsettler.raid_nothing=Bandidos vieram atrás de %1$s na noite do dia %2$d, mas não acharam nada que valesse a pena levar.
homestead.threats.threatsettler.raid_again=Bandidos voltaram na noite do dia %d, mas não havia mais nada para levar.
homestead.threats.threatsettler.and_more=, e mais
homestead.threats.threatsettler.siege_gnawed=Lobos cercaram %1$s na noite do dia %2$d e roeram %3$d das suas cercas e porteiras.
homestead.threats.threatsettler.siege_circled=Lobos rondaram %1$s na noite do dia %2$d e foram embora ao amanhecer.
homestead.threats.threatactions.ledger=Registro
homestead.threats.watchtower.name=torre de vigia
homestead.threats.watchtower.desc=Uma torre alta de tábuas com um posto de vigia no topo. Toque nela estando ao lado para subir.
homestead.threats.watchtower.ask=Do alto, você vê %1$d quadrados mais longe e avista lobos ou bandidos vindo atrás de um lar a até %2$d quadrados da torre. Dê um passo para fora para descer.
homestead.threats.watchtower.climb=Subir
homestead.threats.watchtower.stay=Ficar embaixo
homestead.threats.watchtower.climbed=Você sobe até o posto de vigia.
homestead.threats.watchtower.already_up=Você já está no alto da torre de vigia.
homestead.threats.watchtower.net_host_only=Por enquanto, só o anfitrião pode subir na torre de vigia.
homestead.threats.alarmbell.name=sino de alarme
homestead.threats.alarmbell.desc=Um sino de ferro num poste. Enquanto você dorme ou descansa no terreno do seu lar, ele toca e acorda você quando algo hostil entra no terreno, e quando lobos ou bandidos vêm atrás do seu lar à noite. Toque nele para fazê-lo soar.
homestead.threats.alarmbell.rings=O sino de alarme toca! Há algo hostil nas suas terras.
homestead.threats.alarmbell.rings_coming=O sino de alarme toca! Algo está vindo atrás do seu lar no escuro.
homestead.threats.spiketrap.name=armadilha de estacas
homestead.threats.spiketrap.desc=Uma armação de tábuas com estacas de ferro, colocada bem à vista. Monstros que pisam nela são empalados e aleijados; você e seus aliados passam por cima em segurança. Ela se rearma 20 turnos depois de disparar.
homestead.threats.lookout.name=No alto da torre de vigia
homestead.threats.lookout.desc=Você está no posto de vigia da torre. Você vê %1$d quadrados mais longe que o normal e avista lobos e bandidos vindo atrás de um lar a até %2$d quadrados da torre.\n\nDê um passo para fora para descer.
homestead.threats.threatmarks.siege=Lobos em %s
homestead.threats.threatmarks.raid=Bandidos em %s
windows.wndhomeledger.above=Visibilidade: %1$d. Isso passa do limite de ataques (%2$d): bandidos podem vir atrás deste lar à noite, e os lobos vêm com mais frequência no inverno.
windows.wndhomeledger.below=Visibilidade: %1$d. Isso fica abaixo do limite de ataques (%2$d): os bandidos deixam este lar em paz.
windows.wndhomeledger.draws=O que chama atenção
windows.wndhomeledger.defences=O que os mantém longe
windows.wndhomeledger.ledger=O que aconteceu aqui
homestead.piece.hearthstone.name=pedra do lar
homestead.piece.hearthstone.desc=Uma pedra baixa entalhada com uma runa. Onde ela fica é um lar: animais selvagens ficam a 10 quadrados de distância dela, e a partir dela você pode viajar para seus outros lares e para as pedras do caminho que já tocou. Você pode ter no máximo três lares.
homestead.piece.hearthstone.remove_warning=Desmontar esta pedra do lar? O lar vai junto, e você não poderá mais viajar para cá.
homestead.travel.hearthstone.name=pedra do lar
homestead.travel.hearthstone.name_of=pedra do lar de %s
homestead.travel.hearthstone.desc=Uma pedra baixa entalhada com uma runa, o coração de um lar. Animais selvagens ficam a %d quadrados de distância dela. A runa brilha depois que escurece. Toque nela para viajar para seus outros lares e para as pedras do caminho que já tocou, ou para renomear este lar.
homestead.travel.hearthstone.guest=Esta é a pedra do lar de %s. Numa partida compartilhada, só o anfitrião pode viajar a partir dela ou renomear o lar.
homestead.travel.hearthstone.founded=Agora este é o seu lar: %s. Toque na pedra do lar para viajar a partir dela ou para renomear o lar.
homestead.travel.hearthstone.lost=A pedra do lar de %s se foi, e o lar junto com ela.
homestead.travel.waystone.name=pedra do caminho
homestead.travel.waystone.name_attuned=pedra do caminho sintonizada
homestead.travel.waystone.desc=Uma laje alta de ardósia junto ao poço de %s, talhada com uma runa adormecida. Toque nela para sintonizá-la: a partir daí você pode viajar para cá de qualquer um dos seus lares e das pedras do caminho sintonizadas, e daqui para eles.
homestead.travel.waystone.desc_attuned=A pedra do caminho de %s. A runa brilha: você pode viajar para cá de qualquer um dos seus lares e das pedras do caminho sintonizadas, e daqui para eles.
homestead.travel.waystone.attuned=A pedra do caminho de %s desperta ao seu toque. Agora você pode viajar para cá.
homestead.travel.waystone.guest=Numa partida compartilhada, só o anfitrião pode viajar pelas pedras.
