homestead.piece.wall_log.name=parede de toras
homestead.piece.wall_log.desc=Toras empilhadas e encaixadas. Rápida de erguer, mas o fogo a consome.
homestead.piece.wall_plank.name=parede de tábuas
homestead.piece.wall_plank.desc=Tábuas pregadas entre vigas. Mais firme que toras, e queima com a mesma facilidade.
homestead.piece.wall_stone.name=parede de pedra
homestead.piece.wall_stone.desc=Pedra bruta assentada em fiadas. Forte, e não queima.
homestead.piece.wall_brick.name=parede de tijolos
homestead.piece.wall_brick.desc=Tijolo cozido assentado com argila. A parede mais forte que você pode construir, e não queima.
homestead.piece.window_log.name=janela em parede de toras
homestead.piece.window_log.desc=Uma vidraça encaixada em toras. Luz e visão passam por ela; pessoas, não.
homestead.piece.window_plank.name=janela em parede de tábuas
homestead.piece.window_plank.desc=Uma vidraça encaixada em tábuas. Luz e visão passam por ela; pessoas, não.
homestead.piece.window_stone.name=janela em parede de pedra
homestead.piece.window_stone.desc=Uma vidraça encaixada em pedra. Luz e visão passam por ela; pessoas, não.
homestead.piece.window_brick.name=janela em parede de tijolos
homestead.piece.window_brick.desc=Uma vidraça encaixada em tijolo. Luz e visão passam por ela; pessoas, não.
homestead.piece.door.name=porta
homestead.piece.door.desc=Uma porta de madeira simples. Qualquer um pode abri-la, inclusive monstros.
homestead.piece.door_barred.name=porta com tranca
homestead.piece.door_barred.desc=Uma porta pesada com uma tranca de ferro. Só você e seus aliados podem abri-la. Monstros precisam arrombá-la.
homestead.piece.floor_plank.name=piso de tábuas
homestead.piece.floor_plank.desc=Tábuas assentadas sobre o chão. Nada quebra um piso.
homestead.piece.floor_stone.name=piso de pedra
homestead.piece.floor_stone.desc=Lajes de pedra assentadas sobre o chão. Nada quebra um piso.
homestead.piece.path.name=caminho de pedras
homestead.piece.path.desc=Pedras fincadas na terra formando um caminho. Nada o quebra.
homestead.piece.fence.name=cerca
homestead.piece.fence.desc=Postes e travessas. Animais não passam, mas você enxerga por cima.
homestead.piece.gate.name=porteira
homestead.piece.gate.desc=Uma porteira numa cerca. Você e seus aliados podem abri-la; animais e monstros, não.
homestead.piece.palisade.name=paliçada
homestead.piece.palisade.desc=Toras afiadas amarradas com corda. Bloqueia a passagem, mas não a visão. Queima.
homestead.piece.bridge.name=ponte de tábuas
homestead.piece.bridge.desc=Tábuas sobre a água, rasa ou funda, para você atravessar a pé.
homestead.piece.roof_thatch.name=telhado de palha
homestead.piece.roof_thatch.desc=Palha sobre um quadrado. Barato, mas um raio pode incendiá-lo.
homestead.piece.roof_plank.name=telhado de tábuas
homestead.piece.roof_plank.desc=Tábuas sobre um quadrado. Queima, mas raios não o incendeiam.
homestead.piece.roof_slate.name=telhado de ardósia
homestead.piece.roof_slate.desc=Placas de ardósia talhada sobre um quadrado. Resistente, e não queima.
homestead.piece.roof_tile.name=telhado de telhas
homestead.piece.roof_tile.desc=Telhas de barro sobre um quadrado. Resistente, e não queima.
homestead.piece.roof_glass.name=telhado de vidro
homestead.piece.roof_glass.desc=Vidraças sobre um quadrado. A luz passa para as plantas embaixo.
homestead.builtterrain.wall_log_name=Parede de toras
homestead.builtterrain.wall_log_desc=Uma parede de toras empilhadas. Pegaria fogo.
homestead.builtterrain.wall_plank_name=Parede de tábuas
homestead.builtterrain.wall_plank_desc=Uma parede de tábuas pregadas. Pegaria fogo.
homestead.builtterrain.wall_stone_name=Parede de pedra
homestead.builtterrain.wall_stone_desc=Uma parede de pedra bruta em fiadas.
homestead.builtterrain.wall_brick_name=Parede de tijolos
homestead.builtterrain.wall_brick_desc=Uma parede de tijolo cozido assentado com argila.
homestead.builtterrain.window_log_name=Janela
homestead.builtterrain.window_log_desc=Uma vidraça numa parede de toras. Dá para ver através dela.
homestead.builtterrain.window_plank_name=Janela
homestead.builtterrain.window_plank_desc=Uma vidraça numa parede de tábuas. Dá para ver através dela.
homestead.builtterrain.window_stone_name=Janela
homestead.builtterrain.window_stone_desc=Uma vidraça numa parede de pedra. Dá para ver através dela.
homestead.builtterrain.window_brick_name=Janela
homestead.builtterrain.window_brick_desc=Uma vidraça numa parede de tijolos. Dá para ver através dela.
homestead.builtterrain.door_name=Porta
homestead.builtterrain.door_desc=Uma porta de madeira. Qualquer um pode abri-la.
homestead.builtterrain.door_open_name=Porta aberta
homestead.builtterrain.door_open_desc=Uma porta de madeira, aberta.
homestead.builtterrain.door_barred_name=Porta com tranca
homestead.builtterrain.door_barred_desc=Uma porta pesada com uma tranca de ferro. Toque nela estando ao lado para erguer a tranca. Ela se fecha de novo quando a passagem fica livre.
homestead.builtterrain.door_barred_open_name=Porta com tranca aberta
homestead.builtterrain.door_barred_open_desc=A tranca está erguida. A porta se fecha de novo quando a passagem fica livre.
homestead.builtterrain.palisade_name=Paliçada
homestead.builtterrain.palisade_desc=Toras afiadas amarradas com corda. Dá para ver além dela, mas não para passar.
homestead.builtterrain.fence_name=Cerca
homestead.builtterrain.fence_desc=Postes e travessas. Dá para ver por cima.
homestead.builtterrain.gate_name=Porteira
homestead.builtterrain.gate_desc=Uma porteira numa cerca. Toque nela estando ao lado para abri-la. Ela se fecha de novo quando o caminho fica livre.
homestead.builtterrain.gate_open_name=Porteira aberta
homestead.builtterrain.gate_open_desc=A porteira está aberta. Ela se fecha de novo quando o caminho fica livre.
homestead.builtterrain.path_name=Caminho de pedras
homestead.builtterrain.path_desc=Pedras fincadas na terra.
homestead.builtterrain.bridge_name=Ponte de tábuas
homestead.builtterrain.bridge_desc=Tábuas sobre a água.
homestead.builtterrain.farmland_name=Canteiro
homestead.builtterrain.farmland_desc=Terra lavrada, pronta para sementes.
homestead.builtterrain.farmland_wet_name=Canteiro irrigado
homestead.builtterrain.farmland_wet_desc=Terra lavrada, úmida de irrigação.
homestead.builtterrain.stump_oak_name=Toco de carvalho
homestead.builtterrain.stump_oak_desc=Tudo o que sobrou de um carvalho derrubado.
homestead.builtterrain.stump_pine_name=Toco de pinheiro
homestead.builtterrain.stump_pine_desc=Tudo o que sobrou de um pinheiro derrubado, ainda com gotas de resina.
homestead.builtterrain.sapling_oak_name=Muda de carvalho
homestead.builtterrain.sapling_oak_desc=Um carvalho jovem. Dê tempo a ele.
homestead.builtterrain.sapling_pine_name=Muda de pinheiro
homestead.builtterrain.sapling_pine_desc=Um pinheiro jovem. Dê tempo a ele.
homestead.builtterrain.sapling_shrub_name=Arbusto jovem
homestead.builtterrain.sapling_shrub_desc=Um arbusto nascido da semente, ainda baixo. Alguns dias de primavera ou verão e ele encorpa.
homestead.builtterrain.rubble_wood_name=Entulho de madeira
homestead.builtterrain.rubble_wood_desc=Tábuas quebradas e lascas, tudo o que sobrou de algo construído.
homestead.builtterrain.rubble_stone_name=Entulho de pedra
homestead.builtterrain.rubble_stone_desc=Pedra quebrada, tudo o que sobrou de algo construído.
homestead.builtterrain.floor_plank_name=Piso de tábuas
homestead.builtterrain.floor_plank_desc=Tábuas assentadas sobre o chão.
homestead.builtterrain.floor_stone_name=Piso de pedra
homestead.builtterrain.floor_stone_desc=Lajes de pedra assentadas sobre o chão.
homestead.gathering.gathering.guest=Numa partida compartilhada, só o anfitrião pode cavar e ceifar com ferramentas da mochila.
homestead.gathering.gathering.protected_chop=Você não pode derrubar isso: não é seu.
homestead.gathering.gathering.protected_quarry=Você não pode quebrar essa pedra: ela não é sua.
homestead.gathering.gathering.protected_dig=Você não pode cavar este chão: ele não é seu.
homestead.gathering.gathering.protected_reap=Você não pode cortar esta grama: ela não é sua.
homestead.gathering.gathering.villagers=Os aldeões não iam gostar nada disso.
homestead.gathering.gathering.no_axe=Você precisa de um machado para isso.
homestead.gathering.gathering.no_pick=Para quebrar um pedregulho você precisa de uma picareta, uma ferramenta de mineração, uma marreta de pedreiro, um martelo de guerra ou o Martelo do Mestre.
homestead.gathering.gathering.no_shovel=Você precisa de uma pá para cavar.
homestead.gathering.gathering.no_sickle=Você precisa de uma foice para cortar grama.
homestead.gathering.gathering.nothing_to_dig=Não há nada para cavar aí. Uma pá transforma grama e terra nua em canteiro, tira argila da margem de um pântano ou rio e areia de uma praia ou deserto, e arranca tocos e mudas.
homestead.gathering.gathering.nothing_to_reap=Só grama alta pode ser cortada para virar palha.
homestead.gathering.gathering.frozen=O chão está congelado e duro.
items.weapon.melee.shovel.dig_prompt=Escolha um lugar para cavar
items.weapon.melee.sickle.ac_reap=CEIFAR
items.weapon.melee.sickle.reap_prompt=Escolha grama alta para cortar
items.weapon.melee.woodcuttersaxe.name=machado de lenhador
items.weapon.melee.woodcuttersaxe.desc=Um machado de derrubada com cabo longo e lâmina larga e afiada. Ele derruba uma árvore em 3 golpes, mas é desajeitado numa luta.\n\nFique ao lado de uma árvore e toque nela para derrubá-la. Qualquer machado serve: uma machadinha leva 8 golpes, um machado 6, um machado de batalha 5 e um machado grande 4. O tipo Lenhador de um machado tira alguns desses golpes.
items.weapon.melee.masonshammer.name=marreta de pedreiro
items.weapon.melee.masonshammer.desc=Uma marreta pesada de cabeça quadrada para quebrar pedra. Ela quebra um pedregulho em pedra bruta com 2 golpes, enquanto uma picareta, um martelo de guerra, um Martelo do Mestre ou uma ferramenta de mineração precisa de 3. Sem picareta na mochila, ela também quebra paredes de rocha, com 3 golpes. O tipo Pedreira de uma ferramenta tira alguns desses golpes. É desajeitada numa luta.\n\nFique ao lado de um pedregulho e toque nele para quebrá-lo.
items.materials.log.name=tora de carvalho
items.materials.log.desc=Um pedaço de carvalho cortado de uma árvore derrubada. Serve para paredes de toras e paliçadas, e vira tábuas na serra.
items.materials.pinelog.name=tora de pinheiro
items.materials.pinelog.desc=Um pedaço de pinheiro cortado de uma árvore derrubada. Serve para construir do mesmo jeito que uma tora de carvalho.
items.materials.plank.name=tábua
items.materials.plank.desc=Tábuas serradas. Usadas em paredes, pisos e telhados de tábuas, portas, cercas e móveis.
items.materials.resin.name=resina
items.materials.resin.desc=Resina âmbar e grudenta de um pinheiro. Serve de cola e de vedante.
items.materials.roughstone.name=pedra bruta
items.materials.roughstone.desc=Um pedaço de pedra. Usado em paredes e pisos de pedra e em caminhos de pedras.
items.materials.cutstone.name=pedra talhada
items.materials.cutstone.desc=Um bloco de pedra esquadrado. Usado em telhados de ardósia e em trabalhos de pedra mais finos.
items.materials.clay.name=argila
items.materials.clay.desc=Argila molhada da margem de um rio. Vai ao forno para virar tijolo e serve de argamassa em paredes de tijolos.
items.materials.firedbrick.name=tijolo cozido
items.materials.firedbrick.desc=Tijolos vermelhos e duros. Usados em paredes de tijolos, telhados de telhas, lareiras e forjas.
items.materials.sand.name=areia
items.materials.sand.desc=Um punhado de areia clara. Dá para derretê-la e fazer vidro.
items.materials.glasspane.name=vidraça
items.materials.glasspane.desc=Uma placa de vidro transparente. Usada em janelas e telhados de vidro.
items.materials.thatch.name=palha
items.materials.thatch.desc=Um feixe de palha seca. Usado em telhados de palha, camas de palha e corda.
items.materials.rope.name=corda
items.materials.rope.desc=Um rolo de corda trançada. Usado em porteiras e poços, e para puxar um animal.
items.materials.hide.name=couro cru
items.materials.hide.desc=Couro cru de animal. Curtido, vira couro.
items.materials.leather.name=couro
items.materials.leather.desc=Couro curtido. Usado em camas de peles, tapetes e roupas quentes.
items.materials.charcoal.name=carvão vegetal
items.materials.charcoal.desc=Pedaços de carvão vegetal. O combustível mais quente para um forno, uma forja ou uma lareira.
items.materials.ironfittings.name=ferragens
items.materials.ironfittings.desc=Dobradiças, barras e pregos. Usados em portas com tranca e sinos de alarme.
items.materials.vulturefeather.name=pena de urubu
items.materials.vulturefeather.desc=Uma pena de voo comprida, escura com a borda prateada, de um urubu. Na bancada, 2 delas e uma tábua viram 5 dardos.
items.materials.gatortooth.name=dente de jacaré
items.materials.gatortooth.desc=Um dente curvo, cor de marfim velho, do tamanho de um dedo. Na bancada, um dente e uma tábua viram as pontas de 2 lanças de pesca.
items.bags.builderssatchel.name=sacola do construtor
items.bags.builderssatchel.desc=Uma sacola de lona resistente para materiais de construção, baús portáteis e a ferramenta do construtor, e para o que a rocha dá: minérios, gemas, minério de pedra, ouro escuro, pedras norn e núcleos de obra-prima. Toras, pedras, tábuas, baús, a ferramenta, minério e o resto vão aqui em vez de irem para a mochila, e construir gasta primeiro o que está nela.
homestead.rooms.roomkinds.bedroom=Quarto
homestead.rooms.roomkinds.bedroom_line=Quarto: durma na cama. Com todas as portas fechadas e nenhuma parede quebrada, nada encontra você dormindo.
homestead.rooms.roomkinds.kitchen=Cozinha
homestead.rooms.roomkinds.kitchen_line=Cozinha: se você comer aqui uma refeição que deixa você bem alimentado, o efeito dura 50% mais tempo.
homestead.rooms.roomkinds.storehouse=Depósito
homestead.rooms.roomkinds.storehouse_line=Depósito: cada baú aqui guarda 10 itens a mais.
homestead.rooms.roomkinds.shrine=Santuário
homestead.rooms.roomkinds.shrine_line=Santuário: durma a noite aqui e você acorda abençoado, curando 10% mais rápido por um dia.
homestead.rooms.roomkinds.comfort=Conforto: %1$s (%2$d de %3$d).
homestead.rooms.comfort.bare=Vazio
homestead.rooms.comfort.plain=Simples
homestead.rooms.comfort.cosy=Aconchegante
homestead.rooms.comfort.comfortable=Confortável
homestead.rooms.comfort.fine=Refinado
homestead.rooms.homebed.name_straw=cama de palha
homestead.rooms.homebed.name_wood=cama de madeira
homestead.rooms.homebed.name_fur=cama de peles
homestead.rooms.homebed.desc_straw=Um monte de palha sob uma manta grosseira. Melhor que o chão nu.
homestead.rooms.homebed.desc_wood=Uma armação de madeira com colchão de palha e um cobertor de lã.
homestead.rooms.homebed.desc_fur=Uma armação de madeira coberta de peles. Mesmo numa noite fria, elas mantêm você aquecido.
homestead.rooms.homebed.desc_heal=Uma noite aqui devolve %1$d%% da sua vida. Conforto do cômodo: %2$s.
homestead.rooms.homebed.menu_heal=Uma noite aqui devolve %d%% da sua vida.
homestead.rooms.homebed.menu_sealed=O cômodo está fechado e inteiro: nada vai encontrar você dormindo.
homestead.rooms.homebed.menu_open=Esta cama não fica num cômodo fechado, então algo pode encontrar você durante a noite.
homestead.rooms.homebed.menu_open_fire=Esta cama não fica num cômodo fechado, então algo pode encontrar você durante a noite, mas o fogo torna isso menos provável.
homestead.rooms.homebed.menu_fur=As peles mantêm você aquecido, a menos que o cômodo esteja num frio cortante.
homestead.rooms.homebed.blessed=Você acorda com uma bênção tranquila do santuário.
homestead.rooms.homebed.not_tired=Você ainda está bem descansado. Não dá para dormir de novo por enquanto.
homestead.rooms.wellrested.name=bem descansado
homestead.rooms.wellrested.desc=Você dormiu bem numa cama de verdade. Você ganha 10%% mais experiência e se cura 10%% mais rápido.\n\nTurnos restantes: %s.
homestead.rooms.shrineblessing.name=bênção do santuário
homestead.rooms.shrineblessing.desc=Você dormiu num santuário e acordou com uma bênção tranquila. Você se cura 10%% mais rápido.\n\nTurnos restantes: %s.
items.food.food.kitchen_made=Feito numa cozinha: deixa você bem alimentado por 50% mais tempo.
homestead.piece.bed_straw.name=cama de palha
homestead.piece.bed_straw.desc=Um monte de palha sob uma manta. Uma noite aqui cura um quarto da sua vida, mais num cômodo confortável. É inflamável.
homestead.piece.bed_wood.name=cama de madeira
homestead.piece.bed_wood.desc=Uma armação de madeira com colchão de palha. Uma noite aqui cura um terço da sua vida, mais num cômodo confortável. É inflamável.
homestead.piece.bed_fur.name=cama de peles
homestead.piece.bed_fur.desc=Uma armação de madeira coberta de peles. Uma noite aqui cura metade da sua vida, e as peles mantêm você aquecido, a menos que o cômodo esteja num frio cortante. É inflamável.
homestead.piece.rug.name=tapete
homestead.piece.rug.desc=Um tapete de couro estendido no chão. Deixa o cômodo mais confortável.
homestead.piece.bookshelf.name=estante
homestead.piece.bookshelf.desc=Uma estante de madeira vazia. Deixa o cômodo mais confortável. Precisa de chão livre na frente, então não pode ficar logo acima de uma parede. É inflamável.
homestead.piece.statue.name=estátua
homestead.piece.statue.desc=Uma figura esculpida em pedra. Deixa o cômodo mais confortável, e um cômodo com uma estátua é um santuário.
homestead.piece.workbench.name=bancada
homestead.piece.workbench.desc=Uma bancada com serrote e martelo. Serra toras em tábuas, trança palha em corda e faz tochas. Com outra estação no mesmo cômodo, o cômodo vira uma oficina onde toda estação trabalha 25% mais rápido.
homestead.piece.masons_bench.name=bancada de pedreiro
homestead.piece.masons_bench.desc=Uma bancada com tampo de pedra e um maço. Transforma pedra bruta em pedra talhada.
homestead.piece.kiln.name=forno
homestead.piece.kiln.desc=Um forno de argila em cúpula. Acenda com toras ou carvão vegetal para cozer argila em tijolos, derreter areia em vidro e transformar madeira em carvão vegetal.
homestead.piece.hearth_brick.name=lareira de tijolos
homestead.piece.hearth_brick.desc=Uma lareira de tijolos. Acesa, ela aquece o cômodo onde fica, afasta animais selvagens, assa pão e grelha carne.
homestead.piece.hearth_stone.name=lareira de pedra
homestead.piece.hearth_stone.desc=Uma lareira de pedra bruta. Acesa, ela aquece o cômodo onde fica, afasta animais selvagens, assa pão e grelha carne.
homestead.piece.cooking_pot.name=caldeirão
homestead.piece.cooking_pot.desc=Um caldeirão sobre brasas. Cozinha ensopados, frutinsossa e tortas de carne sem gastar energia alquímica.
homestead.piece.tanning_rack.name=cavalete de curtume
homestead.piece.tanning_rack.desc=Uma armação de madeira para curtir couro. Transforma couro cru em couro, devagar.
homestead.piece.forge.name=forja
homestead.piece.forge.desc=Uma forja de tijolos com fole. Acenda com toras ou carvão vegetal para transformar minério de ferro em ferragens. Ela não faz núcleos de obra-prima.
homestead.piece.quern.name=moinho de mão
homestead.piece.quern.desc=Duas mós e uma manivela. Mói milhotrigo e faz farinha.
homestead.piece.alchemy_pot.name=pote de alquimia
homestead.piece.alchemy_pot.desc=Um pote de alquimia só seu. Funciona como qualquer outro. Nada pode quebrá-lo, e o ouro não volta se você desmontá-lo.
homestead.piece.enchanting_pedestal.name=pedestal de encantamento
homestead.piece.enchanting_pedestal.desc=Um pedestal de encantamento só seu. Funciona como qualquer outro. Nada pode quebrá-lo, e o ouro não volta se você desmontá-lo.
homestead.stations.workbench.name=bancada
homestead.stations.workbench.desc=Uma bancada firme com serrote e martelo. Toque nela para ver o que faz.
homestead.stations.masonsbench.name=bancada de pedreiro
homestead.stations.masonsbench.desc=Uma bancada com tampo de pedra e um maço para lavrar pedra. Toque nela para ver o que faz.
homestead.stations.kiln.name=forno
homestead.stations.kiln.desc=Um forno de argila em cúpula. Só funciona com o fogo aceso. Toque nele para abastecer, acender e pôr para trabalhar.
homestead.stations.hearth.name=lareira
homestead.stations.hearth.desc=Uma lareira sob uma coifa. Enquanto queima, aquece o cômodo onde fica, afasta animais selvagens e cozinha o que for jogado no fogo. Toque nela para abastecer, acender e pôr para trabalhar.
homestead.stations.cookingpot.name=caldeirão
homestead.stations.cookingpot.desc=Um caldeirão num tripé sobre brasas que se mantêm acesas sozinhas. Toque nele para ver o que cozinha.
homestead.stations.tanningrack.name=cavalete de curtume
homestead.stations.tanningrack.desc=Uma armação de madeira para esticar e curtir couro. Toque nela para pôr para trabalhar.
homestead.stations.forge.name=forja
homestead.stations.forge.desc=Uma forja de tijolos sob uma coifa, com fole. Só funciona com o fogo aceso. Toque nela para abastecer, acender e pôr para trabalhar.
homestead.stations.quern.name=moinho de mão
homestead.stations.quern.desc=Duas mós e uma manivela. Toque nele para pôr para trabalhar.
