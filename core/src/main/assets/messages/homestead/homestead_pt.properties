items.food.flour.name=farinha
items.food.flour.desc=Um saco de farinha de milhotrigo, moída num moinho de mão. Asse numa lareira para fazer pão.
items.food.bread.name=pão
items.food.bread.desc=Um pão dourado, assado numa lareira. Sustenta tanto quanto uma ração e meia.
homestead.piece.watchtower.name=torre de vigia
homestead.piece.watchtower.desc=Uma torre alta de tábuas. Suba nela estando ao lado para ver 4 quadrados mais longe e avistar lobos e bandidos vindo atrás do seu lar a até 30 quadrados de distância. No terreno do seu lar, ela deixa o lar menos tentador para bandidos. É inflamável.
homestead.piece.alarm_bell.name=sino de alarme
homestead.piece.alarm_bell.desc=Um sino de ferro num poste. Enquanto você dorme ou descansa no terreno do seu lar, ele toca e acorda você quando algo hostil entra no terreno, e quando lobos ou bandidos vêm atrás do seu lar à noite. Sem um sino, você continua dormindo enquanto eles chegam. No terreno do seu lar, ele deixa o lar menos tentador para bandidos.
homestead.piece.spike_trap.name=armadilha de estacas
homestead.piece.spike_trap.desc=Uma armação de tábuas com estacas de ferro, colocada em terreno aberto. Fere e aleija monstros que pisam nela, nunca você ou seus aliados, e se rearma 20 turnos depois de disparar.
homestead.threats.notice.part_chests=Coisas nos baús
homestead.threats.notice.part_crops=Plantações
homestead.threats.notice.part_built=Tudo o que foi construído
homestead.threats.notice.part_light=Luz à noite
homestead.threats.notice.part_walls=Paredes de pedra e de tijolos
