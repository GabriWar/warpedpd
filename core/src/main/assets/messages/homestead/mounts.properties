###taming a wild horse
homestead.mounts.taming.shied=The wild horse bolts. Leave it something to eat and keep your distance while it eats.
homestead.mounts.taming.no_food=The wild horse eyes your empty hands. Thatch, a cornwheat shaft, an aprico or a raw blandfruit might win it over.
homestead.mounts.taming.eats=The wild horse eats the %s.
homestead.mounts.taming.trust_1=It eyes you a little less warily.
homestead.mounts.taming.trust_2=It lets you come closer.
homestead.mounts.taming.trust_3=It no longer shies from you. Feed it by hand.
homestead.mounts.taming.tamed=The horse eats from your hand and nuzzles you. It is yours now.

###the village stable
homestead.mounts.stables.closed=The stablehand has turned in for the night.
homestead.mounts.stables.offer=A sound horse, saddled and gentle, for %1$d gold. You have %2$d.
homestead.mounts.stables.do_buy=Buy it (%d gold)
homestead.mounts.stables.too_poor=Not enough gold (%d)
homestead.mounts.stables.bought=The horse is yours, saddle and all.
actors.mobs.npcs.overworldshopkeeper.name_12=stablehand
actors.mobs.npcs.overworldshopkeeper.talk_stable=Good horses here, all broken to the saddle. Tap the one you like. Saddles and hay are on the rail, and a horse eats thatch, cornwheat or fruit.

###the rope on a horse (homestead/animals/Roping)
homestead.animals.roping.too_wild=The wild horse shies from the rope. Win it over with food first.
homestead.animals.roping.not_yours=That horse belongs to the stablehand.
