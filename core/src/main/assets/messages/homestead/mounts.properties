###the horses and riding (actors/mobs/Horse, items/misc/Saddle, homestead/mounts)

###the horse
actors.mobs.horse.name=wild horse
actors.mobs.horse.name_tame=horse
actors.mobs.horse.desc=A horse of the open grass, quick and strong. Wild ones graze in small herds by day and bolt from anyone who comes near.
actors.mobs.horse.desc_trust_0=It eyes you warily. Leave it something to eat (thatch, a cornwheat shaft, an aprico or a raw blandfruit) and stand back while it eats.
actors.mobs.horse.desc_trust_1=It has eaten your food once and lets you come a little closer.
actors.mobs.horse.desc_trust_2=It has eaten your food twice and only bolts when you are right beside it.
actors.mobs.horse.desc_trust_3=It no longer shies from you. Feed it by hand and it is yours.
actors.mobs.horse.desc_tame=Your horse. It waits wherever you leave it. It has no saddle: put one on to ride it.
actors.mobs.horse.desc_saddled=Your horse, saddled. Tap it to ride it, or hold the tap for its menu.
actors.mobs.horse.desc_sale=The stablehand's horse, saddled and gentle. Tap it to buy it.
actors.mobs.horse.died=Your horse is dead.

###the saddle
items.misc.saddle.name=saddle
items.misc.saddle.desc=A riding saddle over a red blanket. Put it on a horse of yours, from the horse's menu or with this saddle, and you can ride it on the surface and up the mountains. A tanning rack makes one from two hides and a rope, and stablehands sell them.
items.misc.saddle.ac_saddle=SADDLE
items.misc.saddle.prompt=Choose your horse beside you

###on horseback
homestead.mounts.riding.name=On horseback
homestead.mounts.riding.desc=You are riding your %1$s. On the surface and the mountains you go twice as fast, so every step costs half the time and half the hunger. Your horse takes a third of every blow that hits you. Tap yourself to get down; striking a foe in melee gets you down first.\n\nYour horse's health: %2$d of %3$d.
homestead.mounts.riding.desc_none=You are on horseback.
homestead.mounts.riding.hurt=Your %s is badly hurt!

