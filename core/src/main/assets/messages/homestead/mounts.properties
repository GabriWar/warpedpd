homestead.mounts.mounts.no_drop=Your horse won't go over the edge.
homestead.mounts.mounts.not_a_horse=There is no horse there.
homestead.mounts.mounts.has_saddle=It is saddled already.
homestead.mounts.mounts.mounted=You swing up onto your %s. Tap yourself to get down.
homestead.mounts.mounts.dismounted=You get down from your %s.
homestead.mounts.mounts.at_door=You get down at the door. Your %s waits outside.
homestead.mounts.mounts.at_shore=You get down at the water's edge. Your %s waits on the shore.
homestead.mounts.mounts.jump_down=You jump down from your %s to fight.
homestead.mounts.mounts.waits=You leave your %s waiting outside.
