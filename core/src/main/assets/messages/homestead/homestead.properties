items.food.flour.name=flour
items.food.flour.desc=A sack of flour, ground from cornwheat at a quern. Bake it into bread at a hearth.
items.food.bread.name=bread
items.food.bread.desc=A golden loaf, baked at a hearth. As filling as a ration and a half.

###threats on homes: notice, sieges, raids, breaking in, defences, what happened while away (homestead/threats)
homestead.piece.watchtower.name=watchtower
homestead.piece.watchtower.desc=A tall plank tower. Climb it from beside it to see 4 cells farther and to spot wolves and bandits coming for your home from 30 cells away. On your home's ground it makes the home less tempting to bandits. It burns.
homestead.piece.alarm_bell.name=alarm bell
homestead.piece.alarm_bell.desc=An iron bell on a post. While you sleep or rest on your home's ground, it rings and wakes you when anything hostile comes onto it, and when wolves or bandits come for your home in the night. Without one you sleep through them. On your home's ground it makes the home less tempting to bandits.
homestead.piece.spike_trap.name=spike trap
homestead.piece.spike_trap.desc=A boarded frame of iron spikes, laid on open ground. It wounds and cripples monsters that step on it, never you or your allies, and resets 20 turns after it springs.
homestead.threats.notice.part_chests=Things in its chests
homestead.threats.notice.part_crops=Crops
homestead.threats.notice.part_built=Everything built
homestead.threats.notice.part_light=Light by night
homestead.threats.notice.part_walls=Stone and brick walls
homestead.threats.notice.part_barred=Barred doors
homestead.threats.notice.part_palisade=Palisade ring
homestead.threats.notice.part_watchtower=Watchtower
homestead.threats.notice.part_bell=Alarm bell
homestead.threats.wolfsiege.came=Wolves are howling at the edge of %1$s, coming from the %2$s!
homestead.threats.homeraider.came=Bandits are coming for %1$s from the %2$s!
homestead.threats.homeraider.grabbed=A bandit snatches %d things from your chest and runs for it!
homestead.threats.homeraider.desc=A bandit come by night for the things in your chests. It makes for the richest chest, breaks in where it has to, grabs what it can carry and runs. Cut it down to get back what it took.
homestead.threats.threatslice.siege_slain=Wolves besieged %1$s, and none of them lived to see the dawn.
homestead.threats.threatslice.siege_fought=Wolves besieged %1$s. You killed %2$d of them, and the rest slunk off at dawn.
homestead.threats.threatslice.siege_left=Wolves circled %1$s through the night and slunk off at dawn.
homestead.threats.threatslice.raid_stolen=Bandits raided %1$s and got away with %3$d things.
homestead.threats.threatslice.raid_slain=Bandits raided %1$s and were cut down to the last.
homestead.threats.threatslice.raid_driven=Bandits raided %1$s and were driven off empty-handed.
homestead.threats.threatslice.spotted_wolves=From the watchtower you see wolves coming from the %s!
homestead.threats.threatslice.spotted_raiders=From the watchtower you see bandits coming from the %s!
homestead.threats.threatsettler.raid_robbed=Bandits broke into %1$s on the night of day %2$d and emptied a chest: %3$d things gone (%4$s).
homestead.threats.threatsettler.raid_robbed_door=Bandits forced the %5$s of %1$s on the night of day %2$d and emptied a chest: %3$d things gone (%4$s).
homestead.threats.threatsettler.raid_nothing=Bandits came for %1$s on the night of day %2$d but found nothing worth taking.
homestead.threats.threatsettler.raid_again=Bandits came again on the night of day %d, but there was nothing more for them to take.
homestead.threats.threatsettler.and_more=, and more
homestead.threats.threatsettler.siege_gnawed=Wolves besieged %1$s on the night of day %2$d and gnawed at %3$d of its fences and gates.
homestead.threats.threatsettler.siege_circled=Wolves circled %1$s on the night of day %2$d and left at dawn.
homestead.threats.threatactions.ledger=Ledger
homestead.threats.watchtower.name=watchtower
homestead.threats.watchtower.desc=A tall plank tower with a lookout on top. Tap it from beside it to climb up.
homestead.threats.watchtower.ask=From the top you see %1$d cells farther, and you spot any wolves or bandits coming for a home within %2$d cells of the tower. Step off to climb down.
homestead.threats.watchtower.climb=Climb up
homestead.threats.watchtower.stay=Stay down
homestead.threats.watchtower.climbed=You climb up to the lookout.
homestead.threats.watchtower.already_up=You are already up the watchtower.
homestead.threats.watchtower.net_host_only=Only the host can climb the watchtower for now.
homestead.threats.alarmbell.name=alarm bell
homestead.threats.alarmbell.desc=An iron bell on a post. While you sleep or rest on your home's ground, it rings and wakes you when anything hostile comes onto it, and when wolves or bandits come for your home in the night. Tap it to ring it.
homestead.threats.alarmbell.rings=The alarm bell rings! Something hostile is on your land.
homestead.threats.alarmbell.rings_coming=The alarm bell rings! Something is coming for your home in the dark.
homestead.threats.spiketrap.name=spike trap
homestead.threats.spiketrap.desc=A boarded frame of iron spikes, laid in plain sight. Monsters that step on it are impaled and crippled; you and your allies walk over it safely. It resets 20 turns after it springs.
homestead.threats.lookout.name=Up the watchtower
homestead.threats.lookout.desc=You are on the watchtower's lookout. You see %1$d cells farther than usual, and you spot wolves and bandits coming for a home within %2$d cells of the tower.\n\nStep off to climb down.
