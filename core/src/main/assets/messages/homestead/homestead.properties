###the pieces (homestead/pieces/CorePieces)
homestead.piece.wall_log.name=log wall
homestead.piece.wall_log.desc=Logs stacked and notched together. Quick to raise, but fire takes it.
homestead.piece.wall_plank.name=plank wall
homestead.piece.wall_plank.desc=Boards nailed between beams. Sturdier than logs, and just as easy to burn.
homestead.piece.wall_stone.name=stone wall
homestead.piece.wall_stone.desc=Rough stone laid in courses. Strong, and it won't burn.
homestead.piece.wall_brick.name=brick wall
homestead.piece.wall_brick.desc=Fired brick set in clay. The strongest wall you can build, and it won't burn.
homestead.piece.window_log.name=window in a log wall
homestead.piece.window_log.desc=A glass pane set in logs. Light and sight pass through it, people don't.
homestead.piece.window_plank.name=window in a plank wall
homestead.piece.window_plank.desc=A glass pane set in boards. Light and sight pass through it, people don't.
homestead.piece.window_stone.name=window in a stone wall
homestead.piece.window_stone.desc=A glass pane set in stone. Light and sight pass through it, people don't.
homestead.piece.window_brick.name=window in a brick wall
homestead.piece.window_brick.desc=A glass pane set in brick. Light and sight pass through it, people don't.
homestead.piece.door.name=door
homestead.piece.door.desc=A plain wooden door. Anyone can open it, monsters included.
homestead.piece.door_barred.name=barred door
homestead.piece.door_barred.desc=A heavy door with an iron bar. Only you and your allies can open it. Monsters have to break it down.
homestead.piece.floor_plank.name=plank floor
homestead.piece.floor_plank.desc=Boards laid over the ground. Nothing breaks a floor.
homestead.piece.floor_stone.name=stone floor
homestead.piece.floor_stone.desc=Flagstones laid over the ground. Nothing breaks a floor.
homestead.piece.path.name=cobbled path
homestead.piece.path.desc=Stones set in the earth to make a path. Nothing breaks it.
homestead.piece.fence.name=fence
homestead.piece.fence.desc=Posts and rails. Animals can't get past it, but you can see over it.
homestead.piece.gate.name=gate
homestead.piece.gate.desc=A gate in a fence. You and your allies can open it, animals and monsters can't.
homestead.piece.palisade.name=palisade
homestead.piece.palisade.desc=Sharpened logs bound with rope. Blocks the way but not the view. It burns.
homestead.piece.bridge.name=plank bridge
homestead.piece.bridge.desc=Planks laid over water, shallow or deep, so you can cross on foot.
homestead.piece.roof_thatch.name=thatch roof
homestead.piece.roof_thatch.desc=Straw thatch over one cell. Cheap, but lightning can set it alight.
homestead.piece.roof_plank.name=plank roof
homestead.piece.roof_plank.desc=Boards over one cell. It burns, but lightning won't light it.
homestead.piece.roof_slate.name=slate roof
homestead.piece.roof_slate.desc=Cut stone slates over one cell. Hard wearing, and it won't burn.
homestead.piece.roof_tile.name=tile roof
homestead.piece.roof_tile.desc=Clay tiles over one cell. Hard wearing, and it won't burn.
homestead.piece.roof_glass.name=glass roof
homestead.piece.roof_glass.desc=Glass panes over one cell. The light comes through for the plants beneath.

