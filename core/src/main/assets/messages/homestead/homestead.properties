homestead.torches.standingtorch.name=standing torch
homestead.torches.standingtorch.desc=A torch set in the ground on its pole. It burns for good, lights the ground round it and keeps wild animals from settling within ten steps. Tap it to take it back.
homestead.torches.standingtorch.taken=You pull the torch out of the ground.
