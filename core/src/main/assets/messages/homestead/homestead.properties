homestead.travel.travel.refuse_not_beside=Stand next to the stone to travel.
homestead.travel.travel.refuse_levitating=You can't touch the rune while you float.
homestead.travel.travel.refuse_rooted=You can't travel while something holds you in place.
homestead.travel.travel.refuse_enemies=You can't travel with enemies in sight.
homestead.travel.travel.refuse_gone=You can no longer travel there.
