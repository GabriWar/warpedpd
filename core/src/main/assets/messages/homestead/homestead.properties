###gathering (homestead/gathering): felling, quarrying, digging and reaping, and their tools
homestead.gathering.gathering.guest=In a shared game, only the host can dig and reap with tools from the pack.
homestead.gathering.gathering.protected_chop=That isn't yours to cut down.
homestead.gathering.gathering.protected_quarry=That stone isn't yours to break.
homestead.gathering.gathering.protected_dig=This ground isn't yours to dig.
homestead.gathering.gathering.protected_reap=This grass isn't yours to cut.
homestead.gathering.gathering.villagers=The villagers would not take kindly to that.
homestead.gathering.gathering.no_axe=You need an axe for that.
homestead.gathering.gathering.no_pick=To break a boulder you need a pickaxe, a mining tool, or a mason's, war or Meister's hammer.
homestead.gathering.gathering.no_shovel=You need a shovel to dig.
homestead.gathering.gathering.no_sickle=You need a sickle to cut grass.
homestead.gathering.gathering.nothing_to_dig=There is nothing to dig there. A shovel tills grass and bare earth into farmland, digs clay from the bank of a swamp or a river and sand from a beach or a desert, and digs out stumps and saplings.
homestead.gathering.gathering.nothing_to_reap=Only tall grass can be cut for thatch.
homestead.gathering.gathering.frozen=The ground is frozen hard.
items.weapon.melee.shovel.dig_prompt=Choose a spot to dig
items.weapon.melee.sickle.ac_reap=REAP
items.weapon.melee.sickle.reap_prompt=Choose tall grass to cut
items.weapon.melee.woodcuttersaxe.name=woodcutter's axe
items.weapon.melee.woodcuttersaxe.desc=A felling axe with a long haft and a broad, keen blade. It cuts down a tree in 3 strokes, but it is clumsy in a fight.\n\nStand next to a tree and tap it to cut it down. Any axe will do the job: a hand axe takes 8 strokes, an axe 6, a battle axe 5 and a greataxe 4. An axe's Woodsman type takes some of these strokes off.
items.weapon.melee.masonshammer.name=mason's hammer
items.weapon.melee.masonshammer.desc=A heavy, square-headed hammer for breaking stone. It breaks a boulder into rough stone in 2 blows, where a pickaxe, a war hammer, a Meister's Hammer or a mining tool needs 3. With no pickaxe in your pack it breaks rock walls too, in 3 blows. A tool's Quarry type takes some of these blows off. It is clumsy in a fight.\n\nStand next to a boulder and tap it to break it.

###the materials (items/materials)
items.materials.log.name=oak log
items.materials.log.desc=A length of oak, cut from a felled tree. Builds log walls and palisades, and saws into planks.
items.materials.pinelog.name=pine log
items.materials.pinelog.desc=A length of pine, cut from a felled tree. It builds just as an oak log does.
items.materials.plank.name=plank
items.materials.plank.desc=Sawn boards. Used for plank walls, floors, roofs, doors, fences and furniture.
items.materials.resin.name=resin
items.materials.resin.desc=Sticky amber resin from a pine. A glue and a sealant.
items.materials.roughstone.name=rough stone
items.materials.roughstone.desc=A chunk of stone. Used for stone walls and floors and cobbled paths.
items.materials.cutstone.name=cut stone
items.materials.cutstone.desc=A squared stone block. Used for slate roofs and finer stonework.
items.materials.clay.name=clay
items.materials.clay.desc=Wet clay from a riverbank. Fired into bricks, and used as mortar in brick walls.
items.materials.firedbrick.name=fired brick
items.materials.firedbrick.desc=Hard red bricks. Used for brick walls, tile roofs, hearths and forges.
items.materials.sand.name=sand
items.materials.sand.desc=A handful of pale sand. It can be melted into glass.
items.materials.glasspane.name=glass pane
items.materials.glasspane.desc=A pane of clear glass. Used for windows and glass roofs.
items.materials.thatch.name=thatch
items.materials.thatch.desc=A sheaf of dry straw. Used for thatched roofs, straw beds and rope.
items.materials.rope.name=rope
items.materials.rope.desc=A coil of twisted rope. Used for gates and wells, and for leading an animal.
items.materials.hide.name=hide
items.materials.hide.desc=A raw animal hide. Tan it to make leather.
items.materials.leather.name=leather
items.materials.leather.desc=Tanned leather. Used for fur beds, rugs and warm clothes.
items.materials.charcoal.name=charcoal
items.materials.charcoal.desc=Lumps of charcoal. The hottest fuel for a kiln, a forge or a hearth.
items.materials.ironfittings.name=iron fittings
items.materials.ironfittings.desc=Hinges, bars and nails. Used for barred doors and alarm bells.
items.bags.builderssatchel.name=builder's satchel
items.bags.builderssatchel.desc=A sturdy canvas satchel for building materials, portable chests and the builder's tool. Logs, stone, planks, chests, the tool and the rest go in here instead of your backpack, and building takes from it first.

###rooms: what a room is, its comfort, beds and the rest they give (homestead/rooms, pieces/RoomPieces)
homestead.rooms.roomkinds.bedroom=Bedroom
homestead.rooms.roomkinds.bedroom_line=Bedroom: sleep in its bed. While every door is shut and no wall is broken, nothing finds you asleep.
homestead.rooms.roomkinds.kitchen=Kitchen
homestead.rooms.roomkinds.kitchen_line=Kitchen: a meal that leaves you well fed keeps you so half again as long when you eat it here.
homestead.rooms.roomkinds.storehouse=Storehouse
homestead.rooms.roomkinds.storehouse_line=Storehouse: each chest here holds 10 more items.
homestead.rooms.roomkinds.shrine=Shrine
homestead.rooms.roomkinds.shrine_line=Shrine: sleep the night here and you wake blessed, healing 10% faster for a day.
homestead.rooms.roomkinds.comfort=Comfort: %1$s (%2$d of %3$d).
homestead.rooms.comfort.bare=Bare
homestead.rooms.comfort.plain=Plain
homestead.rooms.comfort.cosy=Cosy
homestead.rooms.comfort.comfortable=Comfortable
homestead.rooms.comfort.fine=Fine
homestead.rooms.homebed.name_straw=straw bed
homestead.rooms.homebed.name_wood=wooden bed
homestead.rooms.homebed.name_fur=fur bed
homestead.rooms.homebed.desc_straw=A heap of straw under a rough blanket. Better than the bare ground.
homestead.rooms.homebed.desc_wood=A wooden frame with a straw mattress and a woollen blanket.
homestead.rooms.homebed.desc_fur=A wooden frame heaped with furs. Even on a cold night they keep you warm.
homestead.rooms.homebed.desc_heal=A night here gives back %1$d%% of your health. The room's comfort: %2$s.
homestead.rooms.homebed.menu_heal=A night here gives back %d%% of your health.
homestead.rooms.homebed.menu_sealed=The room is shut and whole: nothing will find you asleep.
homestead.rooms.homebed.menu_open=Nothing shuts this bed in, so something could find you in the night.
homestead.rooms.homebed.menu_open_fire=Nothing shuts this bed in, so something could find you in the night, though the fire makes that less likely.
homestead.rooms.homebed.menu_fur=The furs will keep you warm unless the room is bitterly cold.
homestead.rooms.homebed.blessed=You wake with a quiet blessing from the shrine.
homestead.rooms.homebed.not_tired=You are still well rested. You can't sleep again yet.
homestead.rooms.wellrested.name=well rested
homestead.rooms.wellrested.desc=You slept well in a proper bed. You gain 10%% more experience and heal 10%% faster.\n\nTurns remaining: %s.
homestead.rooms.shrineblessing.name=shrine's blessing
homestead.rooms.shrineblessing.desc=You slept in a shrine and woke with a quiet blessing. You heal 10%% faster.\n\nTurns remaining: %s.
items.food.food.kitchen_made=Cooked in a kitchen: it keeps you well fed half again as long.
homestead.piece.bed_straw.name=straw bed
homestead.piece.bed_straw.desc=A heap of straw under a blanket. A night here heals a quarter of your health, more in a comfortable room. It burns.
homestead.piece.bed_wood.name=wooden bed
homestead.piece.bed_wood.desc=A wooden frame with a straw mattress. A night here heals a third of your health, more in a comfortable room. It burns.
homestead.piece.bed_fur.name=fur bed
homestead.piece.bed_fur.desc=A wooden frame heaped with furs. A night here heals half your health, and the furs keep you warm unless the room is bitterly cold. It burns.
homestead.piece.rug.name=rug
homestead.piece.rug.desc=A leather rug laid on the floor. It makes a room more comfortable.
homestead.piece.bookshelf.name=bookshelf
homestead.piece.bookshelf.desc=An empty wooden bookshelf. It makes a room more comfortable. It needs open floor in front of it, so it can't stand right above a wall. It burns.
homestead.piece.statue.name=statue
homestead.piece.statue.desc=A carved stone figure. It makes a room more comfortable, and a room with one is a shrine.

###the stations (homestead/stations, homestead/pieces/StationPieces, windows/WndCraft)
homestead.piece.workbench.name=workbench
homestead.piece.workbench.desc=A bench with a saw and a hammer. Saws logs into planks, twists thatch into rope and makes torches. With another station in the same room, the room becomes a workshop where every station works a quarter faster.
homestead.piece.masons_bench.name=mason's bench
homestead.piece.masons_bench.desc=A stone-topped bench with a mallet. Dresses rough stone into cut stone.
homestead.piece.kiln.name=kiln
homestead.piece.kiln.desc=A domed clay oven. Light it with logs or charcoal to fire clay into bricks, melt sand into glass and char wood into charcoal.
homestead.piece.hearth_brick.name=brick hearth
homestead.piece.hearth_brick.desc=A brick fireplace. Lit, it warms the room it stands in, keeps wild animals away, bakes bread and grills meat.
homestead.piece.hearth_stone.name=stone hearth
homestead.piece.hearth_stone.desc=A fireplace of rough stone. Lit, it warms the room it stands in, keeps wild animals away, bakes bread and grills meat.
homestead.piece.cooking_pot.name=cooking pot
homestead.piece.cooking_pot.desc=A cauldron over embers. Cooks stews, blandfruit and meat pies without any alchemical energy.
homestead.piece.tanning_rack.name=tanning rack
homestead.piece.tanning_rack.desc=A wooden frame for curing hides. Slowly turns a hide into leather.
homestead.piece.forge.name=forge
homestead.piece.forge.desc=A brick forge with bellows. Light it with logs or charcoal to work iron ore into iron fittings. It can't make masterwork cores.
homestead.piece.quern.name=quern
homestead.piece.quern.desc=Two millstones and a handle. Grinds cornwheat into flour.
homestead.piece.alchemy_pot.name=alchemy pot
homestead.piece.alchemy_pot.desc=An alchemy pot of your own. Works like any other. Nothing can break it, and the gold is not given back if you take it down.
homestead.piece.enchanting_pedestal.name=enchanting pedestal
homestead.piece.enchanting_pedestal.desc=An enchanting pedestal of your own. Works like any other. Nothing can break it, and the gold is not given back if you take it down.

homestead.stations.workbench.name=workbench
homestead.stations.workbench.desc=A sturdy bench with a saw and a hammer. Tap it to see what it makes.
homestead.stations.masonsbench.name=mason's bench
homestead.stations.masonsbench.desc=A stone-topped bench and a mallet for dressing stone. Tap it to see what it makes.
homestead.stations.kiln.name=kiln
homestead.stations.kiln.desc=A domed clay oven. It only works while its fire is lit. Tap it to fuel it, light it and set it to work.
homestead.stations.hearth.name=hearth
homestead.stations.hearth.desc=A fireplace under a hood. While it burns it warms the room it stands in, keeps wild animals away and cooks anything dropped into its fire. Tap it to fuel it, light it and set it to work.
homestead.stations.cookingpot.name=cooking pot
homestead.stations.cookingpot.desc=A cauldron on a tripod over embers that keep themselves going. Tap it to see what it cooks.
homestead.stations.tanningrack.name=tanning rack
homestead.stations.tanningrack.desc=A wooden frame for stretching and curing hides. Tap it to set it to work.
homestead.stations.forge.name=forge
homestead.stations.forge.desc=A brick forge under a hood, with bellows. It only works while its fire is lit. Tap it to fuel it, light it and set it to work.
homestead.stations.quern.name=quern
homestead.stations.quern.desc=Two millstones and a handle. Tap it to set it to work.
