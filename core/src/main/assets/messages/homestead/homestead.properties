###travel (homestead/travel): hearthstones, waystones, travel for hunger, the map's marks
homestead.piece.hearthstone.name=hearthstone
homestead.piece.hearthstone.desc=A low stone carved with a rune. Where it stands is a home: wild animals keep 10 cells away from it, and from it you can travel to your other homes and to the waystones you have touched. You can keep three homes at most.
homestead.piece.hearthstone.remove_warning=Take down this hearthstone? The home goes with it, and you can no longer travel here.
homestead.travel.hearthstone.name=hearthstone
homestead.travel.hearthstone.name_of=hearthstone of %s
homestead.travel.hearthstone.desc=A low stone carved with a rune, the heart of a home. Wild animals keep %d cells away from it. Its rune glows after dark. Tap it to travel to your other homes and the waystones you have touched, or to rename this home.
homestead.travel.hearthstone.guest=This is the hearthstone of %s. Only the host can travel from it or rename the home in a shared game.
homestead.travel.hearthstone.founded=This is your home now: %s. Tap the hearthstone to travel from it or to rename it.
homestead.travel.hearthstone.lost=The hearthstone of %s is gone, and the home with it.
homestead.travel.waystone.name=waystone
homestead.travel.waystone.name_attuned=attuned waystone
homestead.travel.waystone.desc=A tall slate by the well of %s, cut with a sleeping rune. Touch it to attune it: then you can travel here from any of your homes and attuned waystones, and from here to them.
homestead.travel.waystone.desc_attuned=The waystone of %s. Its rune glows: you can travel here from any of your homes and attuned waystones, and from here to them.
homestead.travel.waystone.attuned=The waystone of %s wakes at your touch. You can travel here now.
homestead.travel.waystone.guest=Only the host can travel by the stones in a shared game.
homestead.travel.waystones.town=Dolyahaven
homestead.travel.travel.meals_1=about a quarter of a meal
