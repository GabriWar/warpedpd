###homesteads: the fields and the animals (homestead/farming, homestead/animals)

###the pieces (homestead/pieces/FarmPieces)
homestead.piece.farm_plot.name=farm plot
homestead.piece.farm_plot.desc=Ground dug over into farmland, ready to sow. Free, and you can dig a whole area at once. Sow a seed on it to grow a crop.
homestead.piece.channel.name=irrigation channel
homestead.piece.channel.desc=A ditch of water dug off a river, a pond, a well or another channel. Free, and you can dig it in a line. Crops beside water grow faster and wither less. Taking it down fills it back in.
homestead.piece.well.name=well
homestead.piece.well.desc=A stone well. Farmland within 2 tiles of it counts as watered, and a channel can be dug off it.
homestead.piece.compost_bin.name=compost bin
homestead.piece.compost_bin.desc=Put seeds, berries, crops and raw meat in. Every 5 things become a dose of plant food after 500 turns, even while you are away.
homestead.piece.tie_post.name=tie post
homestead.piece.tie_post.desc=A short post with an iron ring. Tie an animal you lead to it, as you would to a fence.

