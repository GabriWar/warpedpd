# Дополнение русского перевода: пакет 500 ключей
homestead.piece.farm_plot.desc=Вскопанная земля, готовая к посеву. Создавать грядки можно бесплатно, причём сразу на целой площади. Посадите семя, чтобы вырастить урожай.
homestead.piece.channel.desc=Канава, по которой вода поступает из реки, пруда, колодца или другого канала. Выкопать её можно бесплатно, сразу на целую линию. Растения возле воды растут быстрее и реже вянут. При демонтаже канаву засыпают.
homestead.piece.well.desc=Каменный колодец. Грядки в радиусе двух клеток считаются политыми. От колодца можно прорыть оросительный канал.
homestead.piece.compost_bin.desc=Складывайте сюда семена, ягоды, урожай и сырое мясо. Каждые пять предметов за 500 ходов превращаются в порцию удобрения, даже пока вас нет рядом.
homestead.piece.tie_post.desc=Невысокий столб с железным кольцом. К нему можно привязать животное, которое вы ведёте, — как и к забору.
homestead.farming.farmrooms.greenhouse_line=Не меньше половины помещения покрыто стеклом. Здесь растения круглый год растут с летней скоростью и не замерзают.
homestead.farming.farmsettler.frost_one=Заморозки погубили одну культуру на вашем поле.
homestead.farming.farmsettler.frost=Заморозки погубили %d культур на ваших полях.
homestead.farming.farmsettler.pests_one=Животные съели одну культуру на вашем поле.
homestead.farming.farmsettler.pests=Животные съели %d культур на ваших полях.
homestead.farming.farmsettler.withered=На ваших полях завяли или перезрели %d культур.
homestead.farming.compostbin.desc=Каждые %1$d заложенных предметов за %2$d ходов превращаются в порцию удобрения. Компост продолжает преть и в ваше отсутствие.
homestead.farming.compostbin.loose=Для следующей партии заложено предметов: %1$d из %2$d.
homestead.farming.compostbin.rotting=Созревает партий: %1$d. Ближайшая будет готова через %2$d ходов.
homestead.farming.compostbin.ready=Готово порций удобрения: %d.
homestead.farming.compostbin.add_prompt=Добавьте семена, ягоды, урожай или сырое мясо
homestead.farming.compostbin.how_many=Сколько положить? Каждые %d предметов дают порцию удобрения.
homestead.farming.compostbin.added=Вы кладёте в компостный ящик %1$d ед. (%2$s).
homestead.farming.compostbin.host_only=В совместной игре компостным ящиком может пользоваться только ведущий.
homestead.animals.tiepost.desc=Невысокий столб с железным кольцом, к которому можно привязать ведомое животное.
homestead.animals.tiepost.tap=Столб для привязи. Привязано животных: %d.
homestead.animals.roping.leash_prompt=Выберите животное, на которое хотите набросить верёвку
homestead.animals.roping.tie_prompt=Выберите забор или столб рядом с вами
homestead.animals.roping.not_animal=Привязать можно только мирное животное.
homestead.animals.roping.too_far=Верёвки хватает лишь на %d клеток, и между вами и целью не должно быть препятствий.
homestead.animals.roping.not_post=Привязать животное можно только к забору, частоколу или столбу для привязи.
homestead.animals.roping.host_only=В совместной игре водить животных может только ведущий.
homestead.animals.roping.not_here=Водить животных можно только на открытой местности.
homestead.animals.roping.too_many=Одновременно можно вести не больше %d животных.
homestead.animals.roping.leashed=Вы надеваете верёвку на животное: %s. Теперь оно следует за вами.
homestead.animals.roping.post_gone=%s освобождается: столб, к которому оно было привязано, исчез.
homestead.animals.roping.menu_led=Вы ведёте на верёвке животное: %s.
homestead.animals.roping.menu_penned=%s находится в загоне. Набросьте на него верёвку, чтобы вывести наружу.
homestead.animals.roping.butcher_confirm=Забить животное (%1$s)? Вы получите мясо (%2$d) и шкуру.
items.bombs.fusedtomato.desc=Помидор с фермерского куста, фитиль которого уже тлеет. При броске взрывается при приземлении, ранит всех на клетке попадания и вокруг неё и поджигает деревянные предметы.
items.bombs.fusedtomato.discover_hint=Срежьте спелый помидорный куст серпом на ферме.
