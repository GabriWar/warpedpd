items.artifacts.lloydsbeacon.creatures=A aura psíquica de criaturas próximas impedem você de usar o Transmissor de Lloyd neste momento.
items.artifacts.lloydsbeacon.return=O Transmissor de Lloyd está marcado na sua localização atual, agora você pode retornar aqui a qualquer momento.
items.artifacts.lloydsbeacon.desc=O Transmissor de Lloyd é um complexo dispositivo mágico que dá ao usuário o controle da magia de transmitir sua matéria. O transmissor pode ser usado para retornar a um local marcado, mas também pode atirar rajadas mágicas de teletransporte aleatórias se for devidamente equipado e carregado. Essa magia pode ser direcionada para um alvo ou para o próprio usuário.
items.artifacts.lloydsbeacon.desc_set=Este transmissor foi marcado em algum lugar no %d andar da masmorra.

items.artifacts.masterthievesarmband.name=braçadeira do mestre dos ladrões
items.artifacts.masterthievesarmband.ac_steal=ROUBAR
items.artifacts.masterthievesarmband.no_charge=Sua braçadeira não tem carga o suficiente.
items.artifacts.masterthievesarmband.cursed=Você não pode usar uma braçadeira amaldiçoada.
items.artifacts.masterthievesarmband.full=Sua braçadeira está totalmente carregada!
items.artifacts.masterthievesarmband.prompt=Escolha um inimigo como alvo
items.artifacts.masterthievesarmband.no_target=Você deve escolher um inimigo que esteja adjacente a você.
items.artifacts.masterthievesarmband.steal_shopkeeper=Você não pode roubar diretamente dos lojistas.
items.artifacts.masterthievesarmband.no_steal=Não há nada para roubar deste inimigo.
items.artifacts.masterthievesarmband.stole_item=Você roubou um item: %s.
items.artifacts.masterthievesarmband.failed_steal=Você não conseguiu roubar nada.
items.artifacts.masterthievesarmband.level_up=Sua braçadeira ficou mais poderosa!
items.artifacts.masterthievesarmband.desc=Esta braçadeira de veludo roxo tem a marca de um ladrão mestre. Ela não pertence a você, mas provavelmente também não pertencia ao seu último usuário.
items.artifacts.masterthievesarmband.desc_cursed=A braçadeira amaldiçoada está presa ao seu braço e, de alguma forma, sua bolsa de ouro parece estar lentamente ficando mais leve...
items.artifacts.masterthievesarmband.desc_worn=Você sente o poder aumentando na braçadeira em seu braço à medida que ganha experiência. Você pode usar esse poder para roubar lojas ou roubar inimigos!\n\nRoubar inimigos acontece instantaneamente, desorienta-os brevemente e dá a você a chance de obter qualquer item que eles tenham! Este poder é mais efetivo contra inimigos que não tenham percebido sua presença. Roubar o mesmo inimigo várias vezes não dá mais chances de saque.

items.artifacts.sandalsofnature.name=sandálias da natureza
items.artifacts.sandalsofnature.name_1=sapatos da natureza
items.artifacts.sandalsofnature.name_2=botas da natureza
items.artifacts.sandalsofnature.name_3=grevas da natureza
items.artifacts.sandalsofnature.ac_feed=ALIMENTAR
items.artifacts.sandalsofnature.ac_root=ENRAIZAR
items.artifacts.sandalsofnature.prompt=Selecione uma semente.
items.artifacts.sandalsofnature.levelup=Seus calçados cresceram em tamanho!
items.artifacts.sandalsofnature.absorb_seed=Seus calçados absorveram a semente, parecem mais saudáveis agora.
items.artifacts.sandalsofnature.no_effect=Você deve primeiro alimentar seus calçados com uma semente.
items.artifacts.sandalsofnature.low_charge=Seus calçados não têm energia suficiente para isto.
items.artifacts.sandalsofnature.prompt_target=Escolha um local
items.artifacts.sandalsofnature.out_of_range=Esse local está fora de alcance.
items.artifacts.sandalsofnature.desc_1=O que inicialmente pareciam duas sandálias feitas de vinhas são na verdade duas plantas! Elas parecem muito fracas e pálidas, talvez você tenha que lhes dar nutrientes?
items.artifacts.sandalsofnature.desc_2=Os calçados cresceram e agora mais se assemelham a dois sapatos sob medida. Um pouco de cor voltou a eles, talvez ainda possam crescer mais?
items.artifacts.sandalsofnature.desc_3=As plantas cresceram novamente e agora se assemelham a um par de botas sólidas feitas de casca de árvore. As plantas parecem ter recuperado a sua força, mas talvez ainda possam crescer mais?
items.artifacts.sandalsofnature.desc_4=As plantas parecem ter atingido seu tamanho máximo, assemelhando-se agora a um par de grevas encouraçadas. As grevas são de um marrom profundo e se aparentam a uma árvore muito robusta.
items.artifacts.sandalsofnature.desc_hint=Você se sente mais conectado com a natureza ao usar este artefato.
items.artifacts.sandalsofnature.desc_cursed=As sandálias amaldiçoadas estão bloqueando qualquer sintonia com a natureza.
items.artifacts.sandalsofnature.desc_ability=Linhas onduladas surgem nos calçados com a cor da última semente que você os alimentou. Eles podem enraizar-se brevemente no solo e produzir o efeito dessa planta em qualquer lugar em um raio de 3 quadrados.\nSemente: _%s_\nCarga necessária: _%d%%_
items.artifacts.sandalsofnature.desc_seeds=Você já alimentou os calçados com %d sementes.

items.artifacts.skeletonkey.name=chave de crânio
items.artifacts.skeletonkey.ac_insert=INSERIR
items.artifacts.skeletonkey.cursed=Você não pode usar uma chave de crânio amaldiçoada.
items.artifacts.skeletonkey.prompt=Escolha um alvo
items.artifacts.skeletonkey.invalid_target=Não há nada para trancar ou destrancar aqui.
items.artifacts.skeletonkey.lock_no_space=Você não pode trancar um personagem dentro de uma porta!
items.artifacts.skeletonkey.iron_charges=Abrir uma fechadura comum requer 1 carga.
items.artifacts.skeletonkey.gold_charges=Abrir uma fechadura dourada requer 2 cargas.
items.artifacts.skeletonkey.lock_charges=Trancar uma porta requer 2 cargas.
items.artifacts.skeletonkey.wall_charges=Criar uma parede temporária requer 2 cargas.
items.artifacts.skeletonkey.crystal_charges=Abrir uma fechadura de cristal requer 5 cargas.
items.artifacts.skeletonkey.wont_open=A chave se recusa a entrar nesta fechadura por algum motivo.
items.artifacts.skeletonkey.locked_with_key=Esta porta foi trancada pela sua chave de crânio.
items.artifacts.skeletonkey.force_lock=A fechadura ficou mais frágil sem a sua chave de crânio. Você consegue forçá-la para abrir.
items.artifacts.skeletonkey.discard=Você descarta as chaves em excesso.
items.artifacts.skeletonkey.levelup=Sua chave de crânio cresce em força!
items.artifacts.skeletonkey.desc=Uma chave de aparência importante, com a cabeça em formato de crânio. Seus dentes parecem diferentes a cada vez que olha para ela.
items.artifacts.skeletonkey.desc_worn=Esta chave mágica parece ganhar poder conforme você a usa em vez de usar as chaves comuns da masmorra. Ela pode ser inserida em quase todas as fechaduras da masmorra para abri-las ou fechá-las, incluindo portas que nunca foram trancadas antes.\n\nA chave pode até ser usada em um espaço vazio em uma direção cardinal ou diagonal para "trancar" o ar à sua frente, criando uma parede sólida de 3 quadrados de largura que dura 10 turnos. Travar o ar repelirá os inimigos se houver espaço para isso.
items.artifacts.skeletonkey.desc_cursed=A chave amaldiçoada parece estar deliberadamente evitando entrar em qualquer fechadura, e até mesmo dificultando (mas não impossibilitando) o uso de suas outras chaves.
items.artifacts.skeletonkey$keywall.desc=Uma parede mágica temporária foi colocada aqui pela chave de crânio.

items.artifacts.talismanofforesight.name=talismã da vidência
items.artifacts.talismanofforesight.ac_scry=REVELAR
items.artifacts.talismanofforesight.low_charge=O talismã requer pelo menos 5% de carga para revelar.
items.artifacts.talismanofforesight.prompt=Escolha um local para escanear.
items.artifacts.talismanofforesight.levelup=Seu Talismã ficou mais forte!
items.artifacts.talismanofforesight.full_charge=Seu Talismã está totalmente carregado!
items.artifacts.talismanofforesight.desc=Uma pedra lisa com gravuras estranhas. Você sente como se estivesse observando tudo à sua volta, vigiando tudo o que está escondido.
items.artifacts.talismanofforesight.desc_worn=Quando segura o talismã, você sente como se seus sentidos estivessem mais aguçados. O talismã está lentamente acumulando cargas à medida que o tempo passa e quando você descobre portas ou armadilhas escondidas.\n\nO talismã pode gastar sua carga para 'revelar' em forma de cone, fazendo com que todos os azulejos e segredos na área analisada sejam expostos. Também lhe concederá visão dos inimigos e itens por um curto período de tempo.
items.artifacts.talismanofforesight.desc_cursed=O talismã amaldiçoado está olhando fixamente para você, enfraquecendo os seus sentidos.
items.artifacts.talismanofforesight$foresight.name=vidência
items.artifacts.talismanofforesight$foresight.uneasy=Você se sente apreensivo.
items.artifacts.talismanofforesight$foresight.desc=Você se sente muito apreensivo, como se tivesse algum perigo por perto.

items.artifacts.timekeepershourglass.name=ampulheta do guardião do tempo
items.artifacts.timekeepershourglass.ac_activate=ATIVAR
items.artifacts.timekeepershourglass.deactivate=Você desativou o congelamento do tempo.
items.artifacts.timekeepershourglass.no_charge=Sua ampulheta ainda não recarregou o suficiente para ser usada.
items.artifacts.timekeepershourglass.cursed=Você não pode usar uma ampulheta amaldiçoada.
items.artifacts.timekeepershourglass.onstasis=O mundo parece mudar ao seu redor em um instante.
items.artifacts.timekeepershourglass.onfreeze=Tudo ao seu redor subitamente congela.
items.artifacts.timekeepershourglass.stasis=Coloque-me em estase
items.artifacts.timekeepershourglass.freeze=Pare o tempo ao meu redor
items.artifacts.timekeepershourglass.prompt=Como você gostaria de usar a magia da ampulheta?\n\nDurante a estase, o tempo correrá normalmente enquanto você fica congelado e completamente invulnerável, consumindo até 2 cargas por vez.\n\nQuando o tempo está congelado, você pode se mover como se suas ações não tomassem tempo. Isso pode ser desativado a qualquer momento usando a ampulheta ou atacando.
items.artifacts.timekeepershourglass.desc=Esta grande e ornamentada ampulheta parece relativamente modesta, mas você sente um grande poder em sua moldura finamente esculpida. Ao girar a ampulheta e ver a areia derramar você pode sentir a sua magia puxando você. Certamente, usar essa magia daria a você algum controle sobre o tempo.
items.artifacts.timekeepershourglass.desc_hint=A ampulheta parece ter perdido muita areia. Se você pudesse encontrar mais...
items.artifacts.timekeepershourglass.desc_cursed=A ampulheta amaldiçoada está presa ao seu corpo, você pode senti-la tentando manipular o seu fluxo de tempo.
items.artifacts.timekeepershourglass$timefreeze.name=Congelamento de tempo
items.artifacts.timekeepershourglass$timefreeze.desc=O tempo está congelado ao seu redor, permitindo que você execute ações instantaneamente. O efeito durará até que seja cancelado ou sua ampulheta fique sem carga. Atacar ou usar magia também quebrará esse efeito.\n\nTurnos até o uso de carga: %s.
items.artifacts.timekeepershourglass$sandbag.name=saco de areia mágica
items.artifacts.timekeepershourglass$sandbag.levelup=Você adicionou a areia a sua ampulheta.
items.artifacts.timekeepershourglass$sandbag.maxlevel=Sua ampulheta está cheia de areia mágica!
items.artifacts.timekeepershourglass$sandbag.no_hourglass=Você não tem uma ampulheta para colocar esta areia.
items.artifacts.timekeepershourglass$sandbag.desc=Esta pequena bolsa de areia mágica parece funcionar perfeitamente com sua ampulheta.\n\nParece muito conveniente que o lojista tenha especificamente este item bem quando você precisa...

items.artifacts.unstablespellbook.name=livro de feitiços instável
items.artifacts.unstablespellbook.ac_read=LER
items.artifacts.unstablespellbook.ac_add=ADICIONAR
items.artifacts.unstablespellbook.blinded=Você não pode ler o livro enquanto está cegado.
items.artifacts.unstablespellbook.no_charge=Seu livro de feitiços está sem energia agora.
items.artifacts.unstablespellbook.cursed=Você não pode ler o livro de feitiços amaldiçoado.
items.artifacts.unstablespellbook.prompt=Selecione um pergaminho
items.artifacts.unstablespellbook.infuse_scroll=Você infundiu a energia do pergaminho no livro.
items.artifacts.unstablespellbook.unable_scroll=Você é incapaz de adicionar este pergaminho ao livro.
items.artifacts.unstablespellbook.unknown_scroll=Você ainda não tem certeza de que tipo de pergaminho é este para adicionar ao livro.
items.artifacts.unstablespellbook.desc=Este livro está em surpreendentes boas condições dada a sua idade. Ele chia e estala conforme você move as páginas, brilhando com energia instável. Se ler deste livro, não há como dizer que feitiço você irá lançar.
items.artifacts.unstablespellbook.desc_cursed=O livro amaldiçoado se prendeu a você e está inibindo a sua habilidade de usar pergaminhos.
items.artifacts.unstablespellbook.desc_index=Este livro está incompleto. Seu índice está atualmente apontando para as seguintes folhas em branco:
items.artifacts.unstablespellbook.desc_empowered=Os pergaminhos que você adicionou ao livro estão brilhando com poder. Você poderá escolher a versão exótica dos efeitos desses pergaminhos, mas ao custo de uma carga adicional.
items.artifacts.unstablespellbook.read_empowered=O pergaminho que você adicionou ao livro de feitiços surge com energia. Você pode canalizar a versão regular ou exótica do efeito desse pergaminho.\n\nA escolha da variante exótica custará 2 cargas ao invés de 1.



###bags
items.bags.bag.name=mochila
items.bags.bag.discover_hint=Você pode comprar este item em uma loja.

items.bags.potionbandolier.name=bandoleira de poções
items.bags.potionbandolier.desc=Esta bandoleira grossa se encaixa em torno de seu peito como um cinto, ela tem várias tiras isoladas para armazenar frascos de poção, garrafas vazias, seu odre de água ou frascos de metal líquido.\n\nEnquanto estiverem dentro da bandoleira, suas poções estarão protegidas do frio.

items.bags.scrollholder.name=canudo de pergaminhos
items.bags.scrollholder.desc=Este recipiente tubular parece poder armazenar ferramentas e gráficos de um astrônomo, mas parece servir muito bem para guardar seus pergaminhos. Há até alguns compartimentos laterais os quais os seus cristais, suas canetas arcanas e resinas arcanas também parecem poder se ajustar bem.\n\nO suporte não parece ser inflamável, portanto seus pergaminhos devem estar seguros do fogo dentro dele.

items.bags.velvetpouch.name=bolsa de veludo
items.bags.velvetpouch.desc=Esta pequena bolsa de veludo pode armazenar muitos itens pequenos, como sementes, pedras rúnicas e alguns ingredientes de alquimia.
items.bags.velvetpouch.discover_hint=Um dos heróis inicia com este item.

items.bags.magicalholster.name=coldre mágico
items.bags.magicalholster.desc=Este coldre fino é feito de alguma pele de animal exótico e possui uma magia poderosa que permite armazenar uma grande quantidade de armas de longo alcance.\n\nVocê pode simplesmente colocar a mão no coldre e sempre pegar o item que estava procurando.\n\nDevido à magia do coldre, as varinhas carregam um pouco mais rápido e as armas de longo alcance duram um pouco mais dentro dele.



###bombs
items.bombs.arcanebomb.name=bomba arcana
items.bombs.arcanebomb.desc=Esta bomba foi imbuída com propriedades arcanas. Ela irá detonar em uma explosão poderosa semelhante ao ataque carregado de Goo, causando _%1$d-%2$d de dano mágico_ a qualquer coisa dentro de 2 quadrados.
items.bombs.arcanebomb.discover_hint=Você pode fabricar este item através de alquimia.

items.bombs.bomb.name=bomba
items.bombs.bomb.ac_lightthrow=ACENDER & JOGAR
items.bombs.bomb.snuff_fuse=Você rapidamente apaga o pavio da bomba.
items.bombs.bomb.ondeath=A explosão matou você...
items.bombs.bomb.rankings_desc=Morto por uma explosão
items.bombs.bomb.desc=Uma bomba de pólvora preta bem pesada. Uma explosão desta bomba causa _%1$d-%2$d de dano_ a qualquer coisa adjacente a ela e irá destruir itens ou terrenos adjacentes.
items.bombs.bomb.desc_fuse=Parece que o fusível levará algumas rodadas para queimar quando estiver aceso.
items.bombs.bomb.desc_burning=O fusível da bomba está queimando, mantenha distância ou apague-o!
items.bombs.bomb$doublebomb.name=duas bombas
items.bombs.bomb$doublebomb.desc=Um par de bombas pretas e pesadas. Parece que você vai ganhar uma de graça!

items.bombs.firebomb.name=bomba de fogo
items.bombs.firebomb.desc=Esta bomba foi modificada para explodir em uma área extensa, causando _%1$d-%2$d de dano_ e espalhando chamas de longa duração em 2 blocos.
items.bombs.firebomb.discover_hint=Você pode fabricar este item através de alquimia.

items.bombs.flashbangbomb.name=bomba de luz
items.bombs.flashbangbomb.desc=Esta bomba personalizada irá irromper em um clarão de luz, som e eletricidade quando explodir. Qualquer coisa dentro de 2 quadrados receberá _%1$d-%2$d de dano_ da explosão, um dano adicional de 25%% da eletricidade e ficará atordoado por 10 turnos.
items.bombs.flashbangbomb.discover_hint=Você pode fabricar este item através de alquimia.

items.bombs.frostbomb.name=bomba de gelo
items.bombs.frostbomb.desc=Esta bomba foi modificada para explodir em uma área extensa, causando _%1$d-%2$d de dano_ e espalhando uma rajada de ar congelante de longa duração dentro de 2 quadrados ao seu redor.
items.bombs.frostbomb.discover_hint=Você pode fabricar este item através de alquimia.

items.bombs.holybomb.name=bomba sagrada
items.bombs.holybomb.desc=Esta bomba foi modificada para produzir um clarão de luz sagrada em uma extensa área quando explode. Qualquer coisa dentro de 2 quadrados receberá _%1$d-%2$d de dano_ da explosão, e inimigos mortos-vivos ou demoníacos receberão 50%% de dano adicional da luz sagrada.
items.bombs.holybomb.discover_hint=Você pode fabricar este item através de alquimia.

items.bombs.noisemaker.name=barulhenta
items.bombs.noisemaker.desc=Esta bomba personalizada emitirá ruídos repetidamente quando o fusível queimar. Quando algo tocar na bomba, ela explodirá e causará _%1$d-%2$d de dano_ a qualquer coisa dentro de 2 quadrados!
items.bombs.noisemaker.desc_burning=A barulhenta está fazendo tic-toc. Ela vai explodir quando algo se aproximar!
items.bombs.noisemaker.discover_hint=Você pode fabricar este item através de alquimia.

items.bombs.smokebomb.name=Bomba de fumaça
items.bombs.smokebomb.desc=Esta bomba foi modificada para expelir uma espessa nuvem de gás ao mesmo tempo em que explode. Ela causará _%1$d-%2$d de dano_ e espalhará névoa dentro de 2 quadrados.
items.bombs.smokebomb.discover_hint=Você pode fabricar este item através de alquimia.

items.bombs.regrowthbomb.name=bomba de maturação
items.bombs.regrowthbomb.desc=Esta bomba personalizada irá espalhar líquido que dá vida a tudo dentro de 3 quadrados ao invés de explodir. A área atingida pelo impacto rapidamente brotará grama e plantas. Você e quaisquer aliados pegos na zona de impacto serão curados, como se tivessem tomado uma poção de cura.
items.bombs.regrowthbomb.discover_hint=Você pode fabricar este item através de alquimia.

items.bombs.shrapnelbomb.name=bomba de estilhaços
items.bombs.shrapnelbomb.desc=Esta bomba foi modificada com restos de metal do DM-300, que se fragmentarão e voarão para todos os lados quando explodirem, causando _%1$d-%2$d de dano_ em uma área muito extensa ao redor da bomba. É melhor se abrigar atrás de algo ao usá-la...
items.bombs.shrapnelbomb.discover_hint=Você pode fabricar este item através de alquimia.

items.bombs.woollybomb.name=bomb-á-á
items.bombs.woollybomb.desc=Esta bomba personalizada criará um extenso rebanho de ovelhas mágicas após explodir. A explosão causará _%1$d-%2$d de dano_ a qualquer coisa dentro de 2 quadrados. As ovelhas bloquearão o movimento e persistirão por muito tempo! Porém, as ovelhas não durarão muito na presença de inimigos poderosos. Podem ser dissipadas manualmente mais cedo interagindo-se com elas.
items.bombs.woollybomb.discover_hint=Você pode fabricar este item através de alquimia.

###food
items.food.berry.name=baga da masmorra
items.food.berry.eat_msg=A baga estava saborosa!
items.food.berry.desc=Esta pequena baga foi encontrada entre a vegetação da masmorra. Pode ser comida rapidamente, restaura uma pequena quantidade de saciedade e pode conter uma semente utilizável!
items.food.berry.discover_hint=Você pode encontrar este item usando um talento de herói específico.

items.food.blandfruit.name=frutinsossa
items.food.blandfruit.cooked=frutinsossa cozida
items.food.blandfruit.sunfruit=fruta-solar
items.food.blandfruit.rotfruit=podre-fruta
items.food.blandfruit.earthfruit=fruta-terra
items.food.blandfruit.blindfruit=fruta-cegante
items.food.blandfruit.firefruit=fruta-fogo
items.food.blandfruit.icefruit=fruta-gelo
items.food.blandfruit.fadefruit=fruta-fantasma
items.food.blandfruit.sorrowfruit=sofrifruta
items.food.blandfruit.stormfruit=fruta-tempestuosa
items.food.blandfruit.dreamfruit=fruta-magi
items.food.blandfruit.starfruit=fruta-estrela
items.food.blandfruit.swiftfruit=fruta-ligeira
items.food.blandfruit.raw=Você não suporta comer isto cru.
items.food.blandfruit.desc=Muito seca e sem gosto. Talvez cozinhá-la com outro ingrediente melhorasse o seu gosto.
items.food.blandfruit.desc_cooked=A fruta inchou no tempo em que ficou de molho no pote e até absorveu as propriedades da semente com a qual foi cozida. Terá o efeito de qualquer poção à qual a semente corresponda.
items.food.blandfruit.desc_eat=Parece pronto para comer!
items.food.blandfruit.desc_throw=Parece muito volátil, talvez seja melhor arremessar.
items.food.blandfruit$chunks.name=pedaços de frutinsossa
items.food.blandfruit$chunks.desc=A frutinsossa explodiu no impacto, deixando pedaços inertes para trás.\n\nApesar de um pouco sujos, estes grandes pedaços de frutinsossa cozida parecem perfeitamente comestíveis.

items.food.chargrilledmeat.name=carne grelhada
items.food.chargrilledmeat.desc=Tem a aparência de um bife decente.
items.food.chargrilledmeat.discover_hint=Você pode criar isto usando outro alimento.

items.food.food.name=ração
items.food.food.ac_eat=COMER
items.food.food.eat_msg=A comida estava deliciosa!
items.food.food.desc=Nada de mais aqui: carne seca, alguns biscoitos - coisas desse tipo.

items.food.frozencarpaccio.name=carpaccio congelado
items.food.frozencarpaccio.invis=Você vê suas mãos tornarem-se invisíveis!
items.food.frozencarpaccio.hard=Você sente sua pele endurecer!
items.food.frozencarpaccio.refresh=Revigorante!
items.food.frozencarpaccio.better=Você se sente melhor!
items.food.frozencarpaccio.desc=É um pedaço de carne crua congelada. A única maneira de comer é cortando em fatias bem finas. E desta forma, fica surpreendentemente bom.
items.food.frozencarpaccio.discover_hint=Você pode criar isto usando outro alimento.

items.food.meatpie.name=torta de carne
items.food.meatpie.eat_msg=A comida estava incrível!
items.food.meatpie.desc=Uma deliciosa torta recheada de carne saborosa. Isso vai saciá-lo muito mais do que qualquer outra refeição.
items.food.meatpie.discover_hint=Você pode fabricar este item através de alquimia.

items.food.mysterymeat.name=carne misteriosa
items.food.mysterymeat.eat_msg=A comida estava com um gosto... esquisito.
items.food.mysterymeat.hot=Ah! Está quente!
items.food.mysterymeat.legs=Você não sente suas pernas!
items.food.mysterymeat.not_well=Você não se sente bem.
items.food.mysterymeat.stuffed=Você está estufado.
items.food.mysterymeat.desc=Coma por sua própria conta e risco.
items.food.mysterymeat.discover_hint=Você pode obter este item como um saque de certos inimigos.
items.food.mysterymeat$placeholder.name=carne

items.food.phantommeat.name=carne fantasma
items.food.phantommeat.desc=Um grande e brilhante bife translúcido, cortado de uma piranha fantasma. Esta carne mágica não precisa ser cozida e concede uma série de benefícios defensivos, além de saciá-lo completamente. Quando comida, concede invisibilidade, pele arbórea, restaura certa quantidade de PV e cura muitos efeitos nocivos.
items.food.phantommeat.discover_hint=Você pode obter este item como um saque de certos inimigos.

items.food.pasty.name=salgado
items.food.pasty.fish_name=peixe ao vapor
items.food.pasty.amulet_name=amuleto de yendor?
items.food.pasty.egg_name=ovo de páscoa
items.food.pasty.rainbow_name=poção arco-íris
items.food.pasty.shattered_name=bolo verde
items.food.pasty.pie_name=torta de abóbora
items.food.pasty.vanilla_name=bolo azul
items.food.pasty.cane_name=bengala doce
items.food.pasty.sparkling_name=poção espumante
items.food.pasty.desc=Um autêntico salgado da Cornualha com um recheio tradicional de carne bovina e batata. Delicioso!
items.food.pasty.fish_desc=Um peixe inteiro cozido ao vapor, magicamente preservado em uma cama de verduras. É tradição guardar um pouco de peixe para mais tarde nesta época do ano, então você vai guardar algumas sobras em vez de comer tudo de uma vez.\n\nFeliz Ano Novo Lunar!
items.food.pasty.amulet_desc=Você finalmente o encontrou, o amuleto mágico de... espera um minuto, isto é apenas um chocolate embrulhado em papel alumínio feito para parecer o amuleto! Ele não irá dar a você poder ilimitado, mas pelo menos te deixará cheio e lhe dará uma pequena carga de artefato.\n\n1° de Abril!
items.food.pasty.egg_desc=Um ovo bem grande de chocolate, envolto em papel alumínio amarelo colorido. Há chocolate de sobra aqui para deixá-lo cheio e o açúcar pode dar aos seus artefatos um pouquinho de carga extra.\n\nFeliz Páscoa!
items.food.pasty.rainbow_desc=Esta poção colorida é uma espécie de alimento líquido. Além de satisfazer sua fome, contém um pouco de magia que acalmará um inimigo adjacente que não seja chefe, fazendo-o temporariamente hesitante em lutar contra você.\n\nFeliz Orgulho Gay!
items.food.pasty.shattered_desc=Esta fatia grande de bolo de baunilha tem granulados coloridos e cobertura verde. O bolo foi feito para comemorar anos de experiência e vai lhe conceder um pouco dessa experiência quando comido.\n\nWarped Pixel Dungeon foi lançado pela primeira vez em 5 de agosto de 2014. Feliz aniversário, Warped Pixel Dungeon!
items.food.pasty.pie_desc=Um pedaço bem grande de torta de abóbora! Seu sabor doce e apimentado irá deixar você cheio e lhe dará um pouco de cura.\n\nFeliz Dia das Bruxas!
items.food.pasty.vanilla_desc=Esta fatia grande de bolo de baunilha tem granulados coloridos e cobertura azul. O bolo foi feito para comemorar anos de experiência e vai lhe conceder um pouco dessa experiência quando comido.\n\nO Pixel Dungeon original foi lançado em 4 de dezembro de 2012. Feliz aniversário, Pixel Dungeon!
items.food.pasty.cane_desc=Uma enorme e açucarada bengala doce! É grande o suficiente para matar sua fome, e o açúcar pode dar à suas varinhas um pouquinho de carga extra também.\n\nFeliz Natal!
items.food.pasty.sparkling_desc=Esta poção espumante é uma espécie de alimento líquido. Sacia a fome e simula vinho espumante, mas na verdade não é alcoólico.  A sensação de calor na barriga lhe dará um pouco de proteção.\n\nFeliz Ano Novo!
items.food.pasty$fishleftover.name=Sobras de peixe
items.food.pasty$fishleftover.eat_msg=A comida estava razoável.
items.food.pasty$fishleftover.desc=Algum peixe que sobrou da sua refeição anterior. Você pode comer a qualquer momento para saciar um pouco de fome.

items.food.smallration.name=ração pequena
items.food.smallration.eat_msg=A comida estava razoável.
items.food.smallration.desc=Parece exatamente como uma ração comum, mas um pouco menor.
items.food.smallration.discover_hint=Você pode comprar este item em uma loja.

items.food.stewedmeat.name=carne cozida
items.food.stewedmeat.eat_msg=A comida estava razoável.
items.food.stewedmeat.desc=Ensopar a carne limpou-a de qualquer doença ou parasita. Deve ser seguro comer.
items.food.stewedmeat.discover_hint=Você pode fabricar este item através de alquimia.

items.food.supplyration.name=ração de suprimento
items.food.supplyration.desc=Esta ração foi deixada na masmorra por membros e para membros da guilda dos ladrões. Ela foi projetada especificamente para ser consumida em viagem e para ajudar em trapaças em geral.\n\nEmbora não o sacie tanto quanto uma ração normal, pode ser comida rapidamente, fornece um pouco de cura direta e restaurará uma carga da capa das sombras do Ladino.
items.food.supplyration.discover_hint=Você pode encontrar este item usando um talento de herói específico.



##journal items
items.journal.documentpage.name=página rasgada
items.journal.documentpage.desc=Uma página sólitaria, provavelmente rasgada de algum livro. Voce precisa pegar para poder lê-la.

items.journal.alchemypage.name=página do livro de alquimia rasgada
items.journal.alchemypage.desc=Uma página rasgada de um guia sobre alquimia.\n\nA maior parte do texto é pequeno demais para ler a distância, mas você pode ver o título da página:\n\n_"%s"_



items.journal.regionlorepage$sewers.name=carta deteriorada
items.journal.regionlorepage$sewers.desc=Parece ser uma carta, escrita em um pedaço de papel sujo de terra. Você precisa pegá-la para conseguir entender o que está escrito.

items.journal.regionlorepage$prison.name=página de diário desgastada
items.journal.regionlorepage$prison.desc=Uma nota, ou algum outro tipo de registro, escrita em um velho pedaço de papel. Parece ter sofrido menos do que as cartas que você encontrou nos esgotos, mas você ainda precisa pegá-la para ler o que está escrito.

items.journal.regionlorepage$caves.name=página de registro antiga
items.journal.regionlorepage$caves.desc=Parece ser uma página de um diário pertencente a algum explorador, incrivelmente bem preservada, apesar do quão antiga deva ser. Pegue-a para ler.

items.journal.regionlorepage$city.name=tabuleta enferrujada
items.journal.regionlorepage$city.desc=Uma pequena e enferrujada tabuleta de metal com uma mensagem magicamente entalhada nela. As letras ainda estão claras mesmo tendo sido escritas anos atrás, mas você precisa pegá-la para ler o que está escrito.

items.journal.regionlorepage$halls.name=tabuleta brilhante
items.journal.regionlorepage$halls.desc=Uma pequena tabuleta preta, com letras verdes brilhantes entalhadas nela. As brilhantes letras juntas formam um borrão quando vistas de longe. Você precisa pegar a tabuleta para lê-la.


###keys
items.keys.goldenkey.name=chave dourada
items.keys.goldenkey.desc=Os entalhes desta chave de ouro são pequenos e intrincados. Talvez ela abra um baú trancado?

items.keys.crystalkey.name=Chave de Cristal
items.keys.crystalkey.desc=As superfícies cortadas desta chave cristalina brilham na escuridão. Talvez abra algo feito de cristal?

items.keys.ironkey.name=chave de ferro
items.keys.ironkey.desc=Os entalhes nesta chave de ferro antiga estão bem desgastados; seu cordão de couro está desgastado pela idade. Que porta poderia abrir?

items.keys.wornkey.name=chave desgastada
items.keys.wornkey.desc=Esta chave está gasta e desbotada, mas parece importante. Provavelmente consegue abrir alguma porta importante por perto.



###potions
items.potions.potion.ac_drink=BEBER
items.potions.potion.turquoise=poção turquesa
items.potions.potion.crimson=poção escarlate
items.potions.potion.azure=poção azul
items.potions.potion.jade=poção verde
items.potions.potion.golden=poção dourada
items.potions.potion.magenta=poção magenta
items.potions.potion.charcoal=poção grafite
items.potions.potion.ivory=poção marfim
items.potions.potion.amber=poção âmbar
items.potions.potion.bistre=poção marrom
items.potions.potion.indigo=poção roxa
items.potions.potion.silver=poção prateada
items.potions.potion.unknown_desc=Este frasco contém um líquido borbulhante. Quem sabe o que irá provocar quando ingerido ou arremessado?
items.potions.potion.harmful=Poção prejudicial!
items.potions.potion.beneficial=Poção benéfica!
items.potions.potion.yes=Sim, sei o que faço
items.potions.potion.no=Não, mudei de ideia
items.potions.potion.sure_drink=Você tem certeza de que quer beber isso? Na maioria dos casos, você deve arremessar tais poções em seus inimigos.
items.potions.potion.sure_throw=Tem certeza de que quer jogar isso? Na maioria dos casos, faria mais sentido beber.
items.potions.potion.shatter=O frasco se despedaçou, e o líquido respinga inofensivamente.
items.potions.potion.discover_hint=Você pode encontrar este item aleatoriamente na masmorra ou criá-lo por meio de alquimia.
items.potions.potion$placeholder.name=poção
items.potions.potion$seedtopotion.name=Poção Aleatória

items.potions.potionofexperience.name=poção de experiência
items.potions.potionofexperience.desc=As experiências célebres de muitas batalhas reduzidas à forma líquida, este líquido vai aumentar instantaneamente o seu nível de experiência.

items.potions.potionoffrost.name=poção gélida
items.potions.potionoffrost.desc=O produto químico contido nesta poção evaporará em uma nuvem congelante após ser exposta ao ar.

items.potions.potionofhaste.name=poção da pressa
items.potions.potionofhaste.energetic=Você se sente enérgico!
items.potions.potionofhaste.desc=Beber este líquido estranhamente doce vai imbuir você com uma tremenda energia por um curto período de tempo, permitindo que você corra em alta velocidade.

items.potions.potionofhealing.name=poção da cura
items.potions.potionofhealing.heal=Suas feridas começam a fechar.
items.potions.potionofhealing.desc=Este elixir irá restaurar rapidamente sua vida e curar instantaneamente muitos efeitos negativos.

items.potions.potionofinvisibility.name=poção de invisibilidade
items.potions.potionofinvisibility.invisible=Você vê as suas mãos ficarem invisíveis!
items.potions.potionofinvisibility.desc=Beber esta poção irá torná-lo temporariamente invisível. Enquanto estiver invisível, os inimigos não serão capazes de enxergar você. Ataques físicos e efeitos mágicos (como pergaminhos e varinhas) irão imediatamente cancelar a invisibilidade.

items.potions.potionoflevitation.name=poção de levitação
items.potions.potionoflevitation.float=Você flutua no ar!
items.potions.potionoflevitation.desc=Beber este líquido curioso fará com que você flutue no ar, sendo capaz de pairar sem esforço sobre armadilhas e buracos. Jogar esta poção irá criar uma nuvem de gás bruto, desorientando qualquer coisa que for pego nela.

items.potions.potionofliquidflame.name=poção da chama líquida
items.potions.potionofliquidflame.desc=Este frasco contém um composto instável que vai estourar violentamente em chamas ao ser exposto ao ar.

items.potions.potionofmindvision.name=poção de visão mental
items.potions.potionofmindvision.see_mobs=De alguma forma, você consegue sentir a presença das mentes de outras criaturas!
items.potions.potionofmindvision.see_none=De alguma maneira, você tem certeza de que está sozinho neste nível no momento.
items.potions.potionofmindvision.desc=Após beber isto, sua mente se tornará sintonizada à assinatura psíquica de criaturas distantes, possibilitando a você pressentir presenças biológicas através de paredes. Além disso, esta poção te permitirá ver através de paredes e portas próximas.

items.potions.potionofparalyticgas.name=poção de gás paralítico
items.potions.potionofparalyticgas.desc=Após ser exposto ao ar, o líquido deste frasco irá vaporizar em uma névoa amarela entorpecente. Qualquer um que inale da nuvem será paralisado instantaneamente, incapaz de se mover por algum tempo. Este item pode ser jogado em inimigos distantes para envolvê-los no efeito do gás.

items.potions.potionofpurity.name=poção de pureza
items.potions.potionofpurity.freshness=Você sente um frescor incomum no ar.
items.potions.potionofpurity.protected=Uma película protetora te envolve!
items.potions.potionofpurity.desc=Este reagente mágico neutralizará rapidamente todos os efeitos nocivos em uma grande área. Beber isso lhe dará imunidade temporária a tais efeitos.

items.potions.potionofstrength.name=poção da força
items.potions.potionofstrength.msg=Uma nova força surge em seu corpo, agora você tem %d de força!
items.potions.potionofstrength.desc=Este líquido poderoso vai percorrer seus músculos, permanentemente aumentando sua força em um ponto.

items.potions.potionoftoxicgas.name=poção de gás tóxico
items.potions.potionoftoxicgas.desc=Removendo a rolha ou quebrando este vidro pressurizado irá fazer com que seu conteúdo exploda numa nuvem mortal de gás tóxico esverdeado. Você pode optar por arremessar esta poção em inimigos distantes em vez de abri-la manualmente.



###brews
items.potions.brews.brew.discover_hint=Você pode fabricar este item através de alquimia.

items.potions.brews.aquabrew.name=composto aquático
items.potions.brews.aquabrew.desc=Quando quebrado, este composto liberará uma explosão de água pressurizada no local. Só é forte o suficiente para causar danos a inimigos de fogo, mas também espalha água em terrenos próximos, desabilita armadilhas, apaga incêndios e arremessa personagens próximos à explosão.

items.potions.brews.blizzardbrew.name=composto nevado
items.potions.brews.blizzardbrew.desc=Quando quebrada, esta mistura desencadeará uma nevasca rodopiante que se espalhará rapidamente como um gás.

items.potions.brews.causticbrew.name=composto cáustico
items.potions.brews.causticbrew.desc=Esta mistura espalhará muco corrosivo em uma ampla área ao redor do local em que se estilhaçar. Qualquer coisa pega pelo muco derreterá lentamente se não puder lavá-lo na água.

items.potions.brews.infernalbrew.name=composto Infernal
items.potions.brews.infernalbrew.desc=Quando quebrada, esta mistura desencadeará um inferno em chamas que se espalhará rapidamente como um gás.

items.potions.brews.shockingbrew.name=composto eletrizado
items.potions.brews.shockingbrew.desc=Quando quebrada, esta mistura desencadeará uma tempestade elétrica em uma ampla área ao redor do local de impacto.

items.potions.brews.unstablebrew.name=composto instável
items.potions.brews.unstablebrew.desc=Este composto mágico brilha alternando entre as cores do arco-íris.\n\nQuando bebido ou jogado, ativará o efeito de uma poção aleatória. O efeito da poção sempre será benéfico se for bebida e sempre será prejudicial se for jogada.

###elixirs
items.potions.elixirs.elixir.discover_hint=Você pode fabricar este item através de alquimia.

items.potions.elixirs.elixirofarcanearmor.name=elixir de armadura arcana
items.potions.elixirs.elixirofarcanearmor.desc=Este elixir proporcionará, àquele que o beber, resistência duradoura a danos mágicos.

items.potions.elixirs.elixirofaquaticrejuvenation.name=elixir de rejuvenescimento aquático
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Este elixir contém os restos de Goo misturados junto com uma poção de cura. Embora não proporcione cura imediata, ela restaurará constantemente uma grande quantidade de vida enquanto você estiver na água.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=cura aquática
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Você ganhou temporariamente propriedades restauradoras semelhantes as de Goo.\n\nEnquanto estiver na água, você recuperará uma pequena quantidade de saúde por turno. O efeito é pausado quando você está com a saúde completa ou sem água.\n\nCura restante: %d.

items.potions.elixirs.elixirofdragonsblood.name=elixir de sangue de dragão
items.potions.elixirs.elixirofdragonsblood.desc=Quando consumido, este elixir enviará poder incendiário pelas veias daquele que o bebeu. Esse efeito deixará a pessoa imune ao fogo e permitirá que incendeie os inimigos com ataques físicos.

items.potions.elixirs.elixiroffeatherfall.name=elixir de queda suave
items.potions.elixirs.elixiroffeatherfall.light=Você se sente leve como uma pena!
items.potions.elixirs.elixiroffeatherfall.desc=Este elixir oferece um efeito de levitação mais fraco, porém mais controlado, permitindo àquele que bebe cair grandes distâncias sem sofrer danos por um curto período de tempo.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=queda suave
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Você está sob o efeito de um elixir de queda suave, permitindo com que caia de abismos sem sofrer danos!\n\nTurnos restantes: %s.

items.potions.elixirs.elixirofhoneyedhealing.name=elixir da cura com mel
items.potions.elixirs.elixirofhoneyedhealing.desc=Este elixir combina a cura com a doçura do mel. Quando ingerido, aplicará o mesmo efeito de uma poção de cura e irá satisfazer uma pequena quantidade de fome, também pode ser arremessado para curar um aliado.\n\nCriaturas com afinidade por mel podem ser pacificadas se este item for usado nelas.

items.potions.elixirs.elixiroficytouch.name=elixir do toque gelado
items.potions.elixirs.elixiroficytouch.desc=Quando consumido, este elixir permitirá àquele que o bebeu absorver o calor dos inimigos ao atacá-los. Esse efeito deixará o mesmo imune ao frio e permitirá que ele resfrie os inimigos com ataques físicos.

items.potions.elixirs.elixirofmight.name=elixir de poder
items.potions.elixirs.elixirofmight.msg=Uma nova força surge em seu corpo, agora você tem %d de força!
items.potions.elixirs.elixirofmight.desc=Este líquido poderoso irá correr pelos seus músculos, aumentando permanentemente a sua força em um ponto, aumentando também temporariamente a sua saúde máxima em %d pontos. O impulso de vida depende da sua vida máxima, mas diminuirá lentamente à medida em que você vai subindo de nível.
items.potions.elixirs.elixirofmight$htboost.name=aumento de saúde máximo
items.potions.elixirs.elixirofmight$htboost.desc=Você sente seu corpo anormalmente forte e saudável.\n\nA sua saúde máxima é aumentada por um longo período de tempo. À medida que você aumenta de nível, o impulso vai se dissipando constantemente.\n\nQuantidade de impulso atual: %d.\nNíveis restantes: %d.

items.potions.elixirs.elixiroftoxicessence.name=elixir da essência tóxica
items.potions.elixirs.elixiroftoxicessence.desc=Quando consumido, este elixir irá imbuir quem o bebe com energia tóxica. O mesmo espalhará continuamente gases tóxicos à medida que se move e ficará imune a gases tóxicos e venenos por um pouco mais tempo do que a duração do efeito.



###exotic potions
items.potions.exotic.exoticpotion.turquoise=poção turquesa exótica
items.potions.exotic.exoticpotion.crimson=poção carmesim exótica
items.potions.exotic.exoticpotion.azure=poção azul exótica
items.potions.exotic.exoticpotion.jade=poção de jade exótica
items.potions.exotic.exoticpotion.golden=poção dourada exótica
items.potions.exotic.exoticpotion.magenta=poção magenta exótica
items.potions.exotic.exoticpotion.charcoal=poção grafite exótica
items.potions.exotic.exoticpotion.ivory=poção marfim exótica
items.potions.exotic.exoticpotion.amber=poção âmbar exótico
items.potions.exotic.exoticpotion.bistre=poção marrom exótica
items.potions.exotic.exoticpotion.indigo=poção roxa exótica
items.potions.exotic.exoticpotion.silver=poção prata exótica
items.potions.exotic.exoticpotion.unknown_desc=Este frasco redondo contém um líquido borbulhante. Parece não ser desta terra, quem sabe o que pode fazer quando bebido ou jogado?
items.potions.exotic.exoticpotion.warning=Você realmente quer cancelar o uso desta poção? Ela será consumida de qualquer maneira.
items.potions.exotic.exoticpotion.yes=Sim, eu tenho certeza
items.potions.exotic.exoticpotion.no=Não, eu mudei de ideia
items.potions.exotic.exoticpotion.discover_hint=Você pode fabricar este item através de alquimia.

items.potions.exotic.potionofcleansing.name=poção da limpeza
items.potions.exotic.potionofcleansing.desc=Este poderoso reagente tornará aquele que o bebe imune a todos os efeitos prejudiciais por alguns turnos. Também pode ser jogado em um alvo para purificá-lo.
items.potions.exotic.potionofcleansing$cleanse.name=purificado
items.potions.exotic.potionofcleansing$cleanse.desc=Este personagem está temporariamente imune a todos os efeitos de status nocivos!\n\nTurnos restantes: %s.

items.potions.exotic.potionofcorrosivegas.name=poção de gás corrosivo
items.potions.exotic.potionofcorrosivegas.desc=Tirar a rolha ou quebrar este frasco pressurizado fará com que seu conteúdo exploda em uma nuvem mortal de gás corrosivo de cor ferrugem. O gás se espalha mais rápido do que o gás tóxico e é mais mortal, mas também não durará muito.

items.potions.exotic.potionofdragonsbreath.name=poção bafo de dragão
items.potions.exotic.potionofdragonsbreath.prompt=Escolha um local para queimar
items.potions.exotic.potionofdragonsbreath.desc=Este frasco contém um composto incomum que se inflama logo após a mistura com a saliva. Cuspir rapidamente o líquido permitirá que o usuário cuspa chamas de sua boca!

items.potions.exotic.potionofearthenarmor.name=poção da armadura de barro
items.potions.exotic.potionofearthenarmor.desc=Em vez de paralisar, este líquido tem um efeito endurecedor na pele, que a transforma em uma armadura natural temporária.

items.potions.exotic.potionofdivineinspiration.name=poção da inspiração divina
items.potions.exotic.potionofdivineinspiration.no_more_points=Você não pode mais ganhar pontos de bônus de talento.
items.potions.exotic.potionofdivineinspiration.select_tier=Escolha um tier de talento para ganhar dois pontos bônus nele. Você precisa ter desbloqueado o tier para ser capaz de gastar os pontos.
items.potions.exotic.potionofdivineinspiration.bonus=+2 Pontos de Talento!
items.potions.exotic.potionofdivineinspiration.desc=O poder da energia sagrada reduzido à forma líquida, este líquido irá imbuir aquele que o bebe com poder divino, concedendo-lhe dois pontos de talento bônus em um tier de sua escolha.\n\nEsta poção só pode ser usada uma vez por tier de talento.

items.potions.exotic.potionofmagicalsight.name=poção da visão mágica
items.potions.exotic.potionofmagicalsight.desc=Após tomar isto, seus sentidos serão brevemente elevados a níveis incríveis, permitindo que você veja através das paredes em um raio de 12 quadrados!

items.potions.exotic.potionofmastery.name=poção da maestria
items.potions.exotic.potionofmastery.prompt=Domine um Item
items.potions.exotic.potionofmastery.weapon_easier=Sua arma tornou-se mais fácil de empunhar!
items.potions.exotic.potionofmastery.armor_easier=Sua armadura tornou-se mais fácil de usar!
items.potions.exotic.potionofmastery.desc=Em vez de conceder força bruta, esta poção irá harmonizar os músculos do usuário a um item específico. Isso fará com que esse item fique mais fácil de usar, como se aquele que a bebeu tivesse praticado e construído memória muscular.\n\nA arma ou armadura escolhida exigirá menos 2 de força para ser usada. Esta poção só pode ser usada uma vez em cada item.

items.potions.exotic.potionofshielding.name=poção da blindagem
items.potions.exotic.potionofshielding.desc=Ao invés de curar, esta poção irá projetar um escudo durável ao redor do corpo do usuário, bloqueando uma quantidade considerável de dano.

items.potions.exotic.potionofshroudingfog.name=poção da neblina
items.potions.exotic.potionofshroudingfog.desc=Quando exposto ao ar, o líquido neste frasco irá produzir uma espessa névoa de fumaça que se espalhará rapidamente, bloqueando a visão dos seus inimigos.

items.potions.exotic.potionofsnapfreeze.name=poção do congelamento instantâneo
items.potions.exotic.potionofsnapfreeze.desc=A substância química contida nesta poção reagirá rapidamente com o ar, instantaneamente congelando e enraizando tudo dentro do seu efeito.

items.potions.exotic.potionofstamina.name=poção do vigor
items.potions.exotic.potionofstamina.desc=Beber este líquido estranhamente doce irá imbuir você com um aumento de energia de longa duração, permitindo que você corra em um ritmo acelerado por um longo período de tempo.

items.potions.exotic.potionofstormclouds.name=poção de nuvens tempestuosas
items.potions.exotic.potionofstormclouds.desc=Jogar esta poção criará uma nuvem de vapor concentrado que se espalhará rapidamente, a qual se condensará e precipitará no ambiente. A maior parte do terreno será convertida em água, inimigos de fogo sofrerão dano, o fogo será apagado e as armadilhas serão esmagadas e quebradas.



###quest items
items.quest.ceremonialcandle.name=vela cerimonial
items.quest.ceremonialcandle.desc=Um conjunto de velas, derretidas e fundidas pelo uso.\n\nSozinhas são inúteis, mas se usadas com outras velas em um padrão, podem canalizar a energia para um ritual de invocação.
items.quest.ceremonialcandle.discover_hint=Você pode encontrar este item durante uma missão especifica.

items.quest.corpsedust.name=pó de cadáver
items.quest.corpsedust.chill=Um frio desce pela sua espinha.
items.quest.corpsedust.desc=Esta bola de pó de cadáver não é muito diferente de uma bola de pó normal. Mas você pode sentir uma magia maligna pulsando dentro dela.\n\nLivrar-se disto o mais rápido possível é uma boa ideia.
items.quest.corpsedust.discover_hint=Você pode encontrar este item durante uma missão especifica.
items.quest.corpsedust&dustwraith.rankings_desc=Amaldiçoado pelo Pó de Cadáver

items.quest.darkgold.name=minério de ouro escuro
items.quest.darkgold.you_now_have=Agora você tem %d de minério de ouro escuro.
items.quest.darkgold.desc=Este metal não é chamado de escuro por causa de sua cor (que não é diferente de ouro normal), mas porque ele derrete na luz do sol, tornando-o inútil na superfície.
items.quest.darkgold.discover_hint=Você pode encontrar este item durante uma missão especifica.

items.quest.dwarftoken.name=insígnia do anão
items.quest.dwarftoken.discard=Você descarta as insígnias em excesso.
items.quest.dwarftoken.desc=Um pedaço de metal de formato estranho que estava sendo segurado por um habitante do cofre dos anões. Talvez faça parte da magia que o prendia ao cofre? É melhor guardá-lo, pode vir a ser útil.
items.quest.dwarftoken.desc_old=Muitos anões e algumas de suas criações maiores carregam estas pequenas peças de metal de propósito desconhecido. Talvez sejam algum tipo de joalheria ou um documento de identificação. Anões são um povo estranho.
items.quest.dwarftoken.discover_hint=Você pode encontrar este item durante uma missão especifica.

items.quest.embers.name=brasas elementais
items.quest.embers.desc=Brasas especiais que só podem ser obtidas de um elemental de fogo jovem. Elas irradiam energia térmica.
items.quest.embers.discover_hint=Você pode encontrar este item durante uma missão especifica.

items.quest.escapecrystal.name=cristal de escape
items.quest.escapecrystal.ac_use=USAR
items.quest.escapecrystal.prompt=Selecione um item
items.quest.escapecrystal.desc=Um cristal mágico fino que parece conter magia de teletransporte. Você pode usar o cristal a qualquer momento para sair do cofre dos anões, mas, se sair antes da hora, não receberá a recompensa inteira!
items.quest.escapecrystal.discover_hint=Você pode encontrar este item durante uma missão específica.
items.quest.escapecrystal.injure_warning_1=O tempo parece desacelerar e você ouve a voz do Imp:\n\n"Ei, você parece ter se ferido bastante, está tudo bem aí em baixo? Eu quero a minha estatueta, mas não a ponto de querer que você morra tentando consegui-la!"
items.quest.escapecrystal.injure_warning_2="Se você estiver preso em uma situação complicada, pode usar um daqueles _itens de teletransporte da sala inicial_ para escapar de volta para lá e tentar novamente."
items.quest.escapecrystal.injure_warning_3="Se a situação ficar realmente crítica, você pode _escapar usando aquele cristal que eu lhe dei_. Não vou dar a você a recompensa inteira, mas certamente é melhor do que morrer!"
items.quest.escapecrystal.leaving_start=O tempo parece desacelerar enquanto você ouve a voz do Imp:\n\n"Escute, eu entendo se você está nervoso, mas por favor, saia pelo menos da primeira sala!"\n\n"Você não precisa se preocupar com seu equipamento, eu sou um Imp de palavra, prometo que tudo estará esperando por você quando voltar. Também prometo que deixarei você usar o cristal para escapar se estiver realmente em perigo."
items.quest.escapecrystal.leaving_early=O tempo parece desacelerar quando você ouve a voz do Imp:\n\n"Sério, já está fugindo!? Você sabe que dá para escapar da maioria dos inimigos desse lugar, né?"\n\n"Olha, se a sua vida estiver em perigo, eu posso tirar você daí, mas não vou te deixar trazer nada de volta consigo. Eu esperava muito mais de você =("
items.quest.escapecrystal.leaving_partly_explored=O tempo parece desacelerar e você ouve a voz do Imp:\n\n"Ah, você já está indo embora? Bem, suponho que você tenha ajudado a mapear o lugar, e isso é melhor do que nada."\n\n"Mesmo assim, eu esperava mais de você =(. Claro que eu vou te tirar daí se precisar. Vou deixar você levar algo como uma poção ou um pergaminho, talvez."
items.quest.escapecrystal.leaving_fully_explored=O tempo parece desacelerar e você ouve a voz do Imp:\n\n"Precisa ir embora? Bom, pelo menos você explorou bastante o cofre. Eu esperava que você se saísse melhor saqueando-o, mas agora tenho uma ideia muito melhor de como o lugar funciona."\n\n"Vou deixar você levar alguma coisa, mas nada magicamente aprimorado!"
items.quest.escapecrystal.leaving_partial_victory=O tempo parece desacelerar e você ouve a voz do Imp:\n\n"Eu esperava que você conseguisse pegar a minha estatueta, mas fez um ótimo trabalho explorando e limpando a maior parte do cofre!"\n\n"Quer saber? Vou deixar você ficar com um item, contanto que ele não seja aprimorado além de +1, e ainda vou montar meu ponto de venda mais a fundo na masmorra. De qualquer forma, preciso de um tempo para planejar meus próximos passos."
items.quest.escapecrystal.leaving_victory=O tempo parece desacelerar e você ouve a voz do Imp:\n\n"Excelente trabalho!! Está pronto para ir embora? Pegarei a estatueta de você quando retornar."\n\n"Como prometido, montarei minha loja mais a fundo e deixarei que você leve o que quiser! Escolha com calma e leve o tempo que precisar, todo o resto ficará dentro do cofre."
items.quest.escapecrystal.leaving_item=Tem certeza de que este é o item que quer levar com você?
items.quest.escapecrystal.leaving_seal=_O Selo Quebrado afixado a esta armadura está vinculado ao espelho e não pode ser levado com você._ O selo será removido automaticamente da armadura. Isso reduzirá o nível da armadura em 1, mas não removerá nenhum glifo que ela possua.
items.quest.escapecrystal.leaving_staff=_Este Cajado do Mago está vinculado ao espelho e não pode ser levado com você, mas a varinha nele imbuída, sim. A varinha será removida automaticamente do cajado e entregue a você com o nível do cajado -1.
items.quest.escapecrystal.leaving_yes=Sair do Cofre
items.quest.escapecrystal.leaving_no=Ficar aqui
items.quest.escapecrystal.error_start=Parece que você não está no andar do Cofre! Isso pode ter acontecido devido a um bug ou falha.
items.quest.escapecrystal.error_no_items=Nenhum dos seus itens estão sendo armazenados, então o cristal foi removido do seu inventário.
items.quest.escapecrystal.error_with_items=Seus itens estão sendo armazenados no momento, então você deveria tentar descer ao cofre de novo para começar a missão. Seus itens armazenados serão devolvidos pra você quando a missão terminar.

items.quest.gooblob.name=bolha de gosma
items.quest.gooblob.desc=Um pedaço gelatinoso de gosma, separou-se de Goo enquanto ele morria. É quase como uma grande bola de geleia, apesar de você não se atrever a comê-la. \n\nPor si só não faz nada, mas pode ser útil se combinada com certas poções ou uma bomba. No mínimo, deve se converter em uma quantidade decente de energia.
items.quest.gooblob.discover_hint=Você pode obter este item como um saque de certos inimigos.

items.quest.impstatue.name=Estatueta de obsidiana
items.quest.impstatue.desc=Uma pequena estatueta negra como o azeviche, esculpida em obsidiana. Ela se parece com o Imp que o enviou para cá, tem até os mesmos olhos verdes brilhantes. Há uma inscrição na base da estatueta, em um idioma que você nunca viu antes.
items.quest.impstatue.discover_hint=Você pode encontrar este item durante uma missão específica.

items.quest.vaultbeacon.name=Sinalizador do Cofre
items.quest.vaultbeacon.desc=Este dispositivo de feitiço de retorno parece já ter um local definido, provavelmente a sala de entrada onde você o encontrou.\n\nVocê pode usá-lo para economizar tempo enquanto explora ou como uma forma de escapar caso esteja em perigo.
items.quest.vaultbeacon.discover_hint=Você pode encontrar este item durante uma missão específica.

items.quest.metalshard.name=pedaço de metal amaldiçoado
items.quest.metalshard.desc=Um fragmento de metal enferrujado amaldiçoado que se soltou do DM-300 quando foi destruído. Você consegue sentir uma magia malévola inativa dentro dele.\n\nPor si só não faz nada, mas pode ser útil quando combinado com certos pergaminhos ou uma bomba. No mínimo, pode ser convertido em uma quantidade decente de energia.
items.quest.metalshard.discover_hint=Você pode obter este item como um saque de certos inimigos.

items.quest.pickaxe.name=picareta
items.quest.pickaxe.ability_name=perfurar
items.quest.pickaxe.ability_desc=A Duelista pode _perfurar_ um inimigo com uma picareta. O ataque é garantido, aplica vulnerabilidade por 3 turnos e causa _%1$d-%2$d de dano aos inimigos com pele rígida.
items.quest.pickaxe.upgrade_ability_stat_name=Dano de Habilidade
items.quest.pickaxe.desc=Esta é uma ferramenta pesada e robusta, utilizada para quebrar pedras. Você não precisa equipar a picareta para minerar com ela, mas, provavelmente, pode ser usada como uma arma em caso de necessidade.
items.quest.pickaxe.discover_hint=Você pode encontrar este item durante uma missão especifica.



###remains
items.remains.remainsitem.ac_use=USAR
items.remains.remainsitem.discover_hint=Você pode encontrar este item nos restos mortais de um herói específico de uma partida anterior perdida.

items.remains.bowfragment.name=fragmento de arco
items.remains.bowfragment.desc=Este fragmento quebrado de madeira já foi parte do arco espiritual de uma Caçadora perdida. Ainda é possível sentir um pouco de energia da natureza restante no fragmento, você pode usar o fragmento para fazer crescer um pouco de grama alta ao seu redor. Fazer isso, no entanto, destruirá o fragmento.

items.remains.brokenhilt.name=Cabo quebrado
items.remains.brokenhilt.desc=Este cabo quebrado parece ter vindo da arma de uma Duelista derrotada. Ainda é possível sentir um pouco de poder marcial restante no cabo, você pode usá-lo para obter um pequeno dano bônus em seus próximos dois golpes corpo a corpo. Fazer isso, no entanto, destruirá o cabo.

items.remains.brokenstaff.name=Cajado quebrado
items.remains.brokenstaff.desc=Este Cajado de mago foi quebrado ao meio depois que seu dono encontrou seu fim. Ainda é possível sentir alguma energia mágica restante no cajado, você pode usá-la para dar um pequeno impulso de carga em suas varinhas. Fazer isso, no entanto, irá destruir o cajado.

items.remains.cloakscrap.name=retalho de tecido
items.remains.cloakscrap.desc=Este pedaço de tecido translúcido parece ter vindo da capa das sombras de um Ladino que já se foi. Ainda é possível sentir um pouco de energia mística nele, você pode usá-lo para dar um impulso de carga aos seus artefatos. Fazer isso, no entanto, irá destruir o tecido.

items.remains.sealshard.name=fragmentos de Selo
items.remains.sealshard.desc=Estes pequenos fragmentos de cera vermelha parecem ter vindo do selo de um guerreiro caído. Ainda é possível sentir um pouco de determinação agarrada ao selo, você pode usá-lo para ganhar um pouco de blindagem. Fazer isso, no entanto, irá destruir os fragmentos de selo.

items.remains.tornpage.name=página rasgada
items.remains.tornpage.desc=Esta página parece ter sido rasgada do tomo sagrado de um clérigo já falecido. Ainda há um pouco de energia divina agarrada a ela, você pode usá-la para recuperar um pouco de saúde. Entretanto, fazer isso destruirá a página.



###rings
items.rings.ring.diamond=anel de diamante
items.rings.ring.opal=anel de opala
items.rings.ring.garnet=anel de pedra granada
items.rings.ring.ruby=anel de rubi
items.rings.ring.amethyst=anel de ametista
items.rings.ring.topaz=anel de topázio
items.rings.ring.onyx=anel de ônix
items.rings.ring.tourmaline=anel de turmalina
items.rings.ring.emerald=anel de esmeralda
items.rings.ring.sapphire=anel de safira
items.rings.ring.quartz=anel de quartzo
items.rings.ring.agate=anel de ágata
items.rings.ring.equip_cursed=O anel se aperta ao redor do seu dedo dolorosamente!
items.rings.ring.unknown_desc=Este anel de metal está adornado com uma grande gema que reluz no escuro. Quem sabe qual efeito terá quando usado?
items.rings.ring.known=Isto é um %s
items.rings.ring.identify=Você agora está familiarizado o suficiente com o seu anel para identificá-lo.
items.rings.ring.cursed_worn=Este anel está amaldiçoado, e por causa disso você é incapaz de removê-lo.
items.rings.ring.curse_known=Você pode sentir uma magia malévola à espreita dentro deste anel.
items.rings.ring.not_cursed=Este anel está livre de magia malévola.

items.rings.ringofaccuracy.name=anel da precisão
items.rings.ringofaccuracy.stats=Quando usado, este anel aumentará sua precisão em _%s%%._
items.rings.ringofaccuracy.typical_stats=Quando usado, este anel normalmente aumentará sua precisão em _%s%%._
items.rings.ringofaccuracy.combined_stats=Seus anéis equipados estão combinando seus poderes, aumentando sua precisão para _%s%%_ no total.
items.rings.ringofaccuracy.upgrade_stat_name_1=Aumento de precisão
items.rings.ringofaccuracy.desc=Este anel aumenta o seu foco, fazendo com que fique mais fácil acertar seus inimigos. Um anel amaldiçoado dificultará o acerto dos ataques.

items.rings.ringofarcana.name=anel arcano
items.rings.ringofarcana.stats=Quando equipado, este anel aumentará o poder de encantamentos e glifos em _%s%%._
items.rings.ringofarcana.typical_stats=Quando equipado, esse anel normalmente aumentará a potência de encantamentos e glifos em _%s%%._
items.rings.ringofarcana.combined_stats=Seus anéis equipados estão combinando seus poderes, aumentando o poder de encantamentos e glifos para _%s%%_ no total.
items.rings.ringofarcana.upgrade_stat_name_1=Impulso Arcano
items.rings.ringofarcana.desc=Este anel aprimora encantamentos mágicos em armas e glifos em armaduras, incluindo maldições! Ele primeiro aumenta a chance de ativação e, em seguida, aumenta a força do efeito quando a chance de ativação é de 100%. Um anel amaldiçoado enfraquecerá encantamentos, glifos e maldições.

items.rings.ringofelements.name=anel dos elementos
items.rings.ringofelements.stats=Quando usado, este anel fornecerá _%s%%_ de resistência elementar.
items.rings.ringofelements.typical_stats=Quando usado, este anel normalmente fornecerá _%s%%_ de resistência elementar.
items.rings.ringofelements.combined_stats=Seus anéis equipados estão combinando seus poderes, fornecendo _%s%%_ de resistência elemental no total.
items.rings.ringofelements.upgrade_stat_name_1=Resistência
items.rings.ringofelements.desc=Este anel fornece resistência à maioria dos efeitos elementares e mágicos, diminuindo o dano e a duração de efeitos negativos. Naturalmente, um anel amaldiçoado irá piorar esses efeitos.

items.rings.ringofenergy.name=anel da energia
items.rings.ringofenergy.stats=Quando usado, este anel aumentará a velocidade de carregamento de varinhas, artefatos e armadura heroica em _%s%%._
items.rings.ringofenergy.typical_stats=Quando usado, este anel normalmente aumentará a velocidade de carregamento de varinhas, artefatos e armadura heroica em _%s%%._
items.rings.ringofenergy.combined_stats=Seus anéis equipados estão combinando seus poderes, aumentando a velocidade de recarga para _%s%%_ no total.
items.rings.ringofenergy.upgrade_stat_name_1=Impulso de carga
items.rings.ringofenergy.desc=Seu equipamento mágico recarregará mais rapidamente dentro do campo arcano que irradia deste anel. Um anel amaldiçoado, do contrário, irá tornar a recarga mais lenta.

items.rings.ringofevasion.name=anel da evasão
items.rings.ringofevasion.stats=Quando usado, este anel aumentará sua evasão em _%s%%._
items.rings.ringofevasion.typical_stats=Quando usado, este anel normalmente aumentará sua evasão em _%s%%._
items.rings.ringofevasion.combined_stats=Seus anéis equipados estão combinando seus poderes, aumentando sua evasão em _%s%%_ no total.
items.rings.ringofevasion.upgrade_stat_name_1=Aumento de evasão
items.rings.ringofevasion.desc=Este anel acelera as reações do usuário, tornando-o difícil de ser acertado por ataques inimigos. Um anel amaldiçoado, em vez disso, tornará o usuário mais fácil de atacar.

items.rings.ringofforce.name=anel da força
items.rings.ringofforce.stats=Quando desarmado, com a sua força atual, este anel causará _%1$d-%2$d de dano._ Com uma arma equipada, este anel aumentará o dano em _%3$d_
items.rings.ringofforce.typical_stats=Quando desarmado, com a sua força atual, normalmente este anel causará _%1$d-%2$d de dano._ Com uma arma equipada, normalmente este anel aumentará o dano em _%3$d._
items.rings.ringofforce.combined_stats=Seus anéis equipados estão combinando seus poderes, causando um total de _%1$d-%2$d_ de dano sem uma arma ou aumentado o dano em  _%3$d_ com uma arma.
items.rings.ringofforce.upgrade_stat_name_1=Dano desarmado
items.rings.ringofforce.upgrade_stat_name_2=Aumento de dano armado
items.rings.ringofforce.upgrade_stat_name_3=Dano de Habilidade
items.rings.ringofforce.ability_name=postura de luta
items.rings.ringofforce.typical_ability_desc=A Duelista pode adotar uma _postura de luta_ com este anel, fazendo com que seus ataques regulares sempre usem este anel mesmo com uma arma equipada.  Esses ataques normalmente causarão _%1$d-%2$d de dano_ e também aplicarão o encantamento e o melhorando da arma. Esta postura diminui a velocidade de recarga da arma em 50%%.
items.rings.ringofforce.ability_desc=A Duelista pode adotar uma _postura de luta_ com este anel, fazendo com que seus ataques regulares sempre usem este anel mesmo com uma arma equipada.  Esses ataques normalmente causarão _%1$d-%2$d de dano_ e também aplicarão o encantamento e o melhorando da arma. Esta postura diminui a velocidade de recarga da arma em 50%%.
items.rings.ringofforce.desc=Este anel aumenta a força dos golpes corpo a corpo do usuário. Este poder extra é bastante fraco quando empunhando armas, mas um ataque desarmado o fará muito mais forte. Um anel amaldiçoado enfraquecerá os golpes do usuário.
items.rings.ringofforce$brawlersstance.name=postura de luta
items.rings.ringofforce$brawlersstance.desc=Enquanto estiver nesta postura, os ataques regulares da Duelista usarão um anel de força equipado, mesmo quando ela estiver com uma arma equipada. Esses ataques ganham dano adicional e ainda usarão a melhoria e o encantamento da arma.\n\nNo entanto, manter essa postura exige foco, reduzindo a velocidade de recarga da habilidade da arma em 50%.\n\nEsta postura pode ser ativada ou desativada usando um anel de força, mas a redução na velocidade de carga persistirá por um tempo se a postura for ativada e desativada rapidamente.

items.rings.ringoffuror.name=anel da fúria
items.rings.ringoffuror.stats=Quando usado, este anel aumentará a velocidade de seus ataques em _%s%%._
items.rings.ringoffuror.typical_stats=Quando usado, este anel normalmente aumentará a velocidade de seus ataques em _%s%%._
items.rings.ringoffuror.combined_stats=Seus anéis equipados estão combinando seus poderes, aumentando a velocidade do seus ataques em _%s%%_ no total.
items.rings.ringoffuror.upgrade_stat_name_1=Aumento de velocidade de ataque
items.rings.ringoffuror.desc=Este anel concede ao usuário uma fúria interna, permitindo que ele ataque mais rapidamente. Um anel amaldiçoado diminuirá a velocidade de ataque do usuário.

items.rings.ringofhaste.name=anel da pressa
items.rings.ringofhaste.stats=Quando usado, este anel aumentará sua velocidade de movimento em _%s%%._
items.rings.ringofhaste.typical_stats=Quando usado, este anel normalmente aumentará sua velocidade de movimento em _%s%%._
items.rings.ringofhaste.combined_stats=Seus anéis equipados estão combinando seus poderes, aumentando a velocidade do seu movimento em _%s%%_ no total.
items.rings.ringofhaste.upgrade_stat_name_1=Aumento de velocidade de movimento
items.rings.ringofhaste.desc=Este anel reduz o impacto do movimento sobre o usuário, permitindo-lhe correr a velocidades sobre-humanas. Um anel amaldiçoado, em vez disso, tornara o usuário pesado e lento.

items.rings.ringofmight.name=anel do poder
items.rings.ringofmight.stats=Quando usado, este anel aumentará sua força em _%1$d_ e sua vida máxima em _%2$s%%._
items.rings.ringofmight.typical_stats=Quando usado, este anel normalmente aumentará sua força em _%1$d_ e sua vida máxima em _%2$s%%._
items.rings.ringofmight.combined_stats=Seus anéis equipados estão combinando seus poderes, aumentando sua força em _%1$d_ e seu PV máximo para _%2$s%%_ no total.
items.rings.ringofmight.upgrade_stat_name_1=Aumento de Força
items.rings.ringofmight.upgrade_stat_name_2=Aumento de vida máx
items.rings.ringofmight.desc=Este anel melhora as características físicas do portador, concedendo-lhe maior força física e constituição. Um anel amaldiçoado vai enfraquecer o portador.

items.rings.ringofsharpshooting.name=anel do tiro certeiro
items.rings.ringofsharpshooting.stats=Quando usado, este anel aumentará o dano de suas armas de arremesso como se o nível delas tivesse aumentado em _%1$d_, e aumentará sua durabilidade em _%2$s%%._
items.rings.ringofsharpshooting.typical_stats=Quando usado, este anel normalmente aumentará o dano de suas armas de arremesso como se o nível delas tivesse aumentado em _%1$d_ e aumentará sua durabilidade em _%2$s%%._
items.rings.ringofsharpshooting.combined_stats=Seus anéis equipados estão combinando seus poderes, aumentando o nível efetivo de armas de arremesso para _%1$d_ e aumentando sua durabilidade para _%2$s%%_ no total.
items.rings.ringofsharpshooting.upgrade_stat_name_1=Aumento de dano de nível
items.rings.ringofsharpshooting.upgrade_stat_name_2=Aumento de durabilidade
items.rings.ringofsharpshooting.desc=Este anel aumenta a precisão e a pontaria do usuário, fazendo com que os projéteis arremessados pelo portador sejam mais duráveis e causem mais dano. Um anel amaldiçoado terá o efeito oposto.

items.rings.ringoftenacity.name=anel da tenacidade
items.rings.ringoftenacity.stats=Quando usado, este anel reduz o dano que você recebe em até _%s%%._
items.rings.ringoftenacity.typical_stats=Quando usado, este anel normalmente reduz o dano que você recebe em até _%s%%._
items.rings.ringoftenacity.combined_stats=Seus anéis equipados estão combinando seus poderes, reduzindo o dano sofrido em _%s%%_ no total.
items.rings.ringoftenacity.upgrade_stat_name_1=Resistência Máx a Dano
items.rings.ringoftenacity.desc=Quando usado, este anel permitirá que o usuário resista a ataques outrora mortais. Quanto mais ferido o utilizador está, mais resistente  será a danos. Um anel amaldiçoado, em vez disso, o tornará mais fácil para os inimigos de executá-lo.

items.rings.ringofwealth.name=anel da fortuna
items.rings.ringofwealth.stats=Quando usado, este anel aumentará sua sorte por _%s%%._
items.rings.ringofwealth.typical_stats=Quando usado, este anel normalmente aumentará sua sorte em _%s%%._
items.rings.ringofwealth.combined_stats=Seus anéis equipados estão combinando seus poderes, aumentando sua sorte em _%s%%_ no total.
items.rings.ringofwealth.upgrade_stat_name_1=Aumento de sorte
items.rings.ringofwealth.desc=Este anel funciona como um ímã para tesouros, aumentando a probabilidade de que os inimigos e baús possuam itens valiosos. Um anel amaldiçoado, ao invés disso, reduzirá sua chance de receber tesouros.



###scrolls
items.scrolls.scroll.ac_read=LER
items.scrolls.scroll.kaunan=pergaminho de KAUNAN
items.scrolls.scroll.sowilo=pergaminho de SOWILO
