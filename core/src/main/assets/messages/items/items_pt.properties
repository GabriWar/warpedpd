items.weapon.melee.flute.typical_ability_desc=A Duelista pode tocar um _acalento_. Todo inimigo a até 3 quadrados fica lento normalmente por _%d turnos_ e sonolento, e logo depois cai no sono, a não ser que seja ferido. Não causa dano. Custa 2 cargas.
