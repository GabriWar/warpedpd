items.weapon.enchantments.ancient.elestrike_desc=O Golpe Elementar manda uma onda com 30% do dano da arma pelos inimigos no cone, menos o alvo principal. O poder ancestral soma as rolagens normais de dano bônus dele e conta as mortes para os autoaprimoramentos da arma. O nível do encantamento e os requisitos normais de ativação continuam valendo.
items.weapon.enchantments.aresleech.elestrike_desc=O Golpe Elementar manda uma onda com 30% do dano da arma pelos inimigos no cone, menos o alvo principal. Numa arma relíquia, Ares drena os inimigos próximos, recupera vida e acumula carga da relíquia a cada ativação. O nível do encantamento e os requisitos normais de ativação continuam valendo.
items.weapon.enchantments.buzzsaw.elestrike_desc=O Golpe Elementar manda uma onda com 30% do dano da arma pelos inimigos no cone, menos o alvo principal. Uma motosserra ligada faz ataques cortantes extras, gastando o combustível do odre como sempre. O nível do encantamento e os requisitos normais de ativação continuam valendo.
items.weapon.enchantments.cromluck.elestrike_desc=O Golpe Elementar manda uma onda com 30% do dano da arma pelos inimigos no cone, menos o alvo principal. Crom rerrola o dano de cada inimigo atingido e fica com o resultado mais forte. O nível do encantamento e os requisitos normais de ativação continuam valendo.
items.weapon.enchantments.holy.elestrike_desc=O Golpe Elementar manda uma onda com 30% do dano da arma pelos inimigos no cone, menos o alvo principal. O poder sagrado rola dano extra contra inimigos mortos-vivos e demoníacos. O nível do encantamento e os requisitos normais de ativação continuam valendo.
items.weapon.enchantments.horror.elestrike_desc=O Golpe Elementar manda uma onda com 30% do dano da arma pelos inimigos no cone, menos o alvo principal. Cada inimigo atingido tem a chance normal do encantamento de fugir aterrorizado. O nível do encantamento e os requisitos normais de ativação continuam valendo.
items.weapon.enchantments.hunting.elestrike_desc=O Golpe Elementar manda uma onda com 30% do dano da arma pelos inimigos no cone, menos o alvo principal. Presas vivas sofrem o dano extra do encantamento, e abates podem render carne. O nível do encantamento e os requisitos normais de ativação continuam valendo.
items.weapon.enchantments.jupitershorror.elestrike_desc=O Golpe Elementar manda uma onda com 30% do dano da arma pelos inimigos no cone, menos o alvo principal. Júpiter rola seu efeito normal de terror separadamente para cada inimigo atingido. O nível do encantamento e os requisitos normais de ativação continuam valendo.
items.weapon.enchantments.lokispoison.elestrike_desc=O Golpe Elementar manda uma onda com 30% do dano da arma pelos inimigos no cone, menos o alvo principal. Loki rola o veneno em cada inimigo atingido e o espalha para as criaturas próximas, como num acerto normal da arma. O nível do encantamento e os requisitos normais de ativação continuam valendo.
items.weapon.enchantments.luck.elestrike_desc=O Golpe Elementar manda uma onda com 30% do dano da arma pelos inimigos no cone, menos o alvo principal. A ventura rerrola o dano de cada inimigo atingido, fica com os resultados mais fortes e aplica o fortalecimento do encantamento. O nível do encantamento e os requisitos normais de ativação continuam valendo.
items.weapon.enchantments.midas.elestrike_desc=O Golpe Elementar manda uma onda com 30% do dano da arma pelos inimigos no cone, menos o alvo principal. Cada inimigo atingido pode render ouro; golpes fatais ativam a recompensa em ouro do encantamento. O nível do encantamento e os requisitos normais de ativação continuam valendo.
items.weapon.enchantments.neptuneshock.elestrike_desc=O Golpe Elementar manda uma onda com 30% do dano da arma pelos inimigos no cone, menos o alvo principal. Uma relíquia carregada gasta carga para soltar o relâmpago de Netuno, com o bônus normal de dano na água e a paralisia. O nível do encantamento e os requisitos normais de ativação continuam valendo.
items.weapon.enchantments.nomnom.elestrike_desc=O Golpe Elementar manda uma onda com 30% do dano da arma pelos inimigos no cone, menos o alvo principal. Cada inimigo atingido pode ser devorado, recuperando vida e matando a fome, com a chance normal do encantamento. O nível do encantamento e os requisitos normais de ativação continuam valendo.
items.weapon.enchantments.osmose.elestrike_desc=O Golpe Elementar manda uma onda com 30% do dano da arma pelos inimigos no cone, menos o alvo principal. Cada inimigo atingido pode recuperar mana pela absorção normal do encantamento, baseada no dano. O nível do encantamento e os requisitos normais de ativação continuam valendo.
items.weapon.enchantments.paralysis.elestrike_desc=O Golpe Elementar manda uma onda com 30% do dano da arma pelos inimigos no cone, menos o alvo principal. Cada inimigo atingido tem a chance normal do encantamento de ficar paralisado. O nível do encantamento e os requisitos normais de ativação continuam valendo.
items.weapon.enchantments.poison.elestrike_desc=O Golpe Elementar manda uma onda com 30% do dano da arma pelos inimigos no cone, menos o alvo principal. Cada inimigo atingido tem a chance normal do encantamento de ser envenenado. O nível do encantamento e os requisitos normais de ativação continuam valendo.
items.weapon.enchantments.slashing.elestrike_desc=O Golpe Elementar manda uma onda com 30% do dano da arma pelos inimigos no cone, menos o alvo principal. O encantamento retalhante rerrola o dano de cada inimigo atingido e aplica seu bônus de dano fortalecido. O nível do encantamento e os requisitos normais de ativação continuam valendo.
items.weapon.enchantments.vicious.elestrike_desc=O Golpe Elementar manda uma onda com 30% do dano da arma pelos inimigos no cone, menos o alvo principal. Cada inimigo atingido sofre o dano bônus cruel do encantamento, com o risco normal de ferir quem empunha a arma. O nível do encantamento e os requisitos normais de ativação continuam valendo.
items.scrolls.exotic.scrollofreforging.name=pergaminho da reforja
items.scrolls.exotic.scrollofreforging.desc=As runas deste pergaminho guardam todo o fogo de uma forja. Lido sobre uma arma ou armadura, ele remove qualquer maldição, aprimora o item e deixa você escolher entre três o encantamento ou glifo que a reforja vai deixar.
items.scrolls.exotic.scrollofreforging.inv_title=Reforjar um item
items.scrolls.exotic.scrollofreforging.weapon=Sua arma (%s) brilha no fogo. Que encantamento ela vai receber?
items.scrolls.exotic.scrollofreforging.armor=Sua armadura (%s) brilha no fogo. Que glifo ela vai receber?
items.scrolls.exotic.scrollofreforging.reforged=Item reforjado: %s!
items.scrolls.exotic.scrollofascension.name=pergaminho da ascensão
items.scrolls.exotic.scrollofascension.desc=A magia de aprimoramento deste pergaminho se espalha rala e por toda parte. Ao ser lido, ele purifica e aprimora duas vezes, de uma só vez, tudo o que você tem equipado, em vez de despejar cinco aprimoramentos num único item.
items.scrolls.exotic.scrollofascension.ascend=Seu equipamento ascende: %d itens foram aprimorados duas vezes.
items.scrolls.exotic.scrollofascension.nothing=Você não tem nada equipado que o pergaminho possa elevar.
items.scrolls.exotic.scrollofwildgrowth.name=pergaminho do crescimento selvagem
items.scrolls.exotic.scrollofwildgrowth.desc=Ler este pergaminho inunda o andar com água mágica e revela o mapa dele, como um pergaminho da maturação, mas a natureza selvagem não para por aí: grama alta brota em toda a sua volta, e plantas vivas nascem dela.
items.scrolls.exotic.scrollofwildgrowth.growth=A mata cresce ao seu redor, e %d plantas criam raízes.
items.treeseeds.treeseed.ac_plant=PLANTAR
items.treeseeds.treeseed.prompt=Escolha onde plantar
items.treeseeds.treeseed.not_here=Sementes só podem ser plantadas lá fora, no mundo aberto.
items.treeseeds.treeseed.too_far=Plante bem ao seu lado.
items.treeseeds.treeseed.protected=Nada pode ser plantado aí.
items.treeseeds.treeseed.wrong_ground=Precisa de grama ou terra nua.
items.treeseeds.treeseed.frozen=O chão está congelado e duro.
items.treeseeds.treeseed.occupied=Tem algo no caminho.
items.treeseeds.acorn.name=bolota
items.treeseeds.acorn.desc=A semente de um carvalho. Plantada em grama ou terra nua ao seu lado, ela vira uma muda e cresce até virar um carvalho depois de 14 dias de primavera ou verão.
items.treeseeds.pinecone.name=pinha
items.treeseeds.pinecone.desc=A semente de um pinheiro. Plantada em grama ou terra nua ao seu lado, ela vira uma muda e cresce até virar um pinheiro depois de 14 dias de primavera ou verão.
items.treeseeds.bushseed.name=semente de arbusto
items.treeseeds.bushseed.desc=A semente de um arbusto. Plantada em grama ou terra nua ao seu lado, ela vira um arbusto novo e encorpa depois de 6 dias de primavera ou verão.
