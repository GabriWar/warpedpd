items.weapon.melee.royalspork.typical_ability_desc=A Duelista pode dar uma _espetada real_: o alvo e quem estiver logo atrás dele são atravessados na mesma estocada, normalmente com _%1$d-%2$d de dano_ cada, acerto garantido, e os dois ficam com sangramento de _%3$d_.
items.weapon.melee.royalspork.ability_desc=A Duelista pode dar uma _espetada real_: o alvo e quem estiver logo atrás dele são atravessados na mesma estocada, com _%1$d-%2$d de dano_ cada, acerto garantido, e os dois ficam com sangramento de _%3$d_.
