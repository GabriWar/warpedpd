items.weapon.melee.dualknife.typical_ability_desc=A Duelista pode dar um _corte duplo_: as duas lâminas atingem um inimigo adjacente no tempo de um golpe, cada uma normalmente causando _%d%% de dano_, e nenhuma pode errar. Custa 1 carga.
items.weapon.melee.dualknife.ability_desc=A Duelista pode dar um _corte duplo_: as duas lâminas atingem um inimigo adjacente no tempo de um golpe, cada uma causando _%d%% de dano_, e nenhuma pode errar. Custa 1 carga.
