items.weapon.melee.spade.typical_ability_desc=A Duelista pode _escavar_ um pedregulho do chão e arremessá-lo num inimigo a até %3$d quadrados, causando %1$d-%2$d de dano e empurrando o alvo um quadrado para trás. Esta habilidade usa 2 cargas.
items.weapon.melee.spade.ability_desc=A Duelista pode _escavar_ um pedregulho do chão e arremessá-lo num inimigo a até %3$d quadrados, causando _%1$d-%2$d de dano_ e empurrando o alvo um quadrado para trás. Esta habilidade usa 2 cargas.
items.weapon.melee.minerstool.ability_name=desmoronar
items.weapon.melee.minerstool.typical_ability_desc=A Duelista pode fazer o teto _desmoronar_: todo inimigo a até %3$d quadrados é soterrado pelas pedras que caem, sofrendo %1$d-%2$d de dano, um quarto a mais se for inorgânico, e fica aleijado por 2 turnos. Esta habilidade usa 2 cargas.
items.weapon.melee.minerstool.ability_desc=A Duelista pode fazer o teto _desmoronar_: todo inimigo a até %3$d quadrados é soterrado pelas pedras que caem, sofrendo _%1$d-%2$d de dano_, um quarto a mais se for inorgânico, e fica _aleijado por 2 turnos_. Esta habilidade usa 2 cargas.
items.weapon.melee.stonecross.ability_name=santificar
items.weapon.melee.stonecross.prompt=Escolha um inimigo para santificar
items.weapon.melee.stonecross.typical_ability_desc=A Duelista pode _santificar_ um inimigo ao seu alcance: um golpe que não erra, com %1$d-%2$d de dano, dobrado contra mortos-vivos e demoníacos, e o chão em volta dele fica consagrado, abençoando todos os aliados que estiverem ali, ela inclusive, por %3$d turnos. Esta habilidade usa 2 cargas.
items.weapon.melee.stonecross.ability_desc=A Duelista pode _santificar_ um inimigo ao seu alcance: um golpe que não erra, com _%1$d-%2$d de dano_, dobrado contra mortos-vivos e demoníacos, e o chão em volta dele fica consagrado, _abençoando_ todos os aliados que estiverem ali, ela inclusive, por _%3$d turnos_. Esta habilidade usa 2 cargas.
items.wands.wandofamok.bmage_desc=Quando _o Mago de Batalha_ atinge um inimigo com um cajado da cólera, há uma chance de deixar o inimigo encolerizado.
items.wands.wandofslowness.bmage_desc=Quando _o Mago de Batalha_ atinge um inimigo com um cajado da lentidão, há uma chance de deixar o inimigo lento.
items.wands.wandofpoison.bmage_desc=Quando _o Mago de Batalha_ atinge um inimigo com um cajado do veneno, há uma chance de envenenar o inimigo.
items.wands.wandoffirebolt.bmage_desc=Quando _o Mago de Batalha_ atinge um inimigo com um cajado da seta de fogo, há uma chance de incendiar o inimigo.
items.wands.wandofavalanche.bmage_desc=Quando _o Mago de Batalha_ atinge um inimigo com um cajado da avalanche, há uma chance de paralisar o inimigo por um instante.
items.wands.wandofblink.bmage_desc=Para _o Mago de Batalha_, um cajado da translocação não tem efeito extra ao acertar.
items.wands.wandoftelekinesis.bmage_desc=Para _o Mago de Batalha_, um cajado da telecinese não tem efeito extra ao acertar.
