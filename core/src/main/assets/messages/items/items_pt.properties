items.weapon.melee.broadsword.typical_ability_desc=A Duelista pode girar a espada de lâmina larga num _arco amplo_. Isso normalmente causa _%1$d-%2$d de dano_, tem acerto garantido e também atinge os inimigos nos dois quadrados ao lado do alvo, se ela conseguir alcançá-los.
