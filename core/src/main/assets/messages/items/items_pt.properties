items.weapon.melee.assassinsknife.typical_ability_desc=A Duelista pode dar uma _punhalada_ num inimigo a até 4 quadrados: ela se teleporta para o outro lado dele e ataca na hora, sem errar, normalmente causando _%1$d-%2$d de dano_ a 150%%. Custa 2 cargas.
