items.weapon.melee.shovel.name=pá de aventureiro
items.weapon.melee.shovel.desc=Uma pá que exploradores costumam levar. Serve principalmente para cavar a grama em volta e achar mais sementes, mas também parece razoável como arma.\n\nNo mundo aberto, em vez disso, você cava um quadrado ao seu lado: grama ou terra nua vira canteiro, a margem de um pântano ou de um rio dá argila, uma praia ou um deserto dá areia, e um toco ou uma muda sai pela raiz.
items.weapon.melee.shovel.ac_dig=CAVAR
items.weapon.melee.shovel.no_grass=Não há grama por perto para cavar.
items.weapon.melee.spade.name=pá de combate
items.weapon.melee.spade.stats_desc=Esta é uma arma rápida.
items.weapon.melee.spade.desc=Uma arma versátil que também é uma pá, feita para o combate. O formato leve permite golpes mais rápidos.\n\nNo mundo aberto, ela cava como uma pá: canteiros, argila, areia, tocos e mudas.
items.weapon.melee.spade.ac_dig=CAVAR
items.weapon.melee.spade.no_grass=Não há grama por perto para cavar.
items.weapon.melee.minerstool.name=ferramenta de mineração
items.weapon.melee.minerstool.stats_desc=Esta é uma arma rápida.\nEsta arma causa mais dano a inimigos inorgânicos.
items.weapon.melee.minerstool.desc=Uma mistura de pá de campanha com picareta, feita para ser fácil de carregar.\n\nNo mundo aberto, ela cava como uma pá: canteiros, argila, areia, tocos e mudas.
items.weapon.melee.minerstool.ac_dig=CAVAR
items.weapon.melee.minerstool.no_grass=Não há grama por perto para cavar.
items.weapon.melee.bow.bowweapon.ac_shoot=ATIRAR
items.weapon.melee.bow.bowweapon.not_equipped=Você precisa equipá-lo para atirar.
items.weapon.melee.bow.bowweapon.no_arrow=Você não tem flechas.
items.weapon.melee.bow.bowweapon.bow_desc=As flechas deste arco causam _%1$d-%2$d_ de dano, e cada flecha disparada gasta 1 de munição.
items.weapon.melee.bow.bowweapon.bow_typical_desc=As flechas deste arco normalmente causam _%1$d-%2$d_ de dano, e cada flecha disparada gasta 1 de munição.
items.weapon.melee.bow.bowweapon.already_used=O tiro perfurante já está preparado.
items.weapon.melee.bow.bowweapon$arrowattached.name=flecha cravada
items.weapon.melee.bow.bowweapon$arrowattached.desc=_%1$d_ flechas estão cravadas neste personagem. Elas caem 50 turnos depois da última flecha cravada, ou quando o personagem morre.\n\nTurnos restantes: _%2$s_.
items.weapon.melee.bow.bowweapon$penetrationshotbuff.name=tiro perfurante
items.weapon.melee.bow.bowweapon$penetrationshotbuff.desc=A Duelista torce a corda do arco com uma força enorme, dando giro à flecha.\n\nA próxima flecha disparada causa dano extra, acerta sempre e atravessa a armadura do inimigo, a menos que ele esteja perto.
items.arrowitem.name=flecha
items.arrowitem.desc=Uma flecha que continua inteira, sem quebrar. Parece que dá para recuperar e usar de novo.
items.weapon.melee.bow.bow.name=arco
items.weapon.melee.bow.bow.desc=Um arco comum. Não é grande demais e tem o peso certo.
items.weapon.melee.bow.bow.ability_name=tiro perfurante
items.weapon.melee.bow.bow.typical_ability_desc=Com um arco, a Duelista pode usar o _tiro perfurante_. Com ele, a próxima flecha sempre acerta e atravessa a armadura do inimigo, normalmente causando _%1$d-%2$d_ de dano.
items.weapon.melee.bow.bow.ability_desc=Com um arco, a Duelista pode usar o _tiro perfurante_. Com ele, a próxima flecha sempre acerta e atravessa a armadura do inimigo, causando _%1$d-%2$d_ de dano.
items.weapon.melee.bow.bowweapon$bowfatigue.name=exaustão
items.weapon.melee.bow.bowweapon$bowfatigue.desc=Quando você dispara flechas demais em pouco tempo, seus braços enfraquecem.\n\nSe você disparar mais de 5 flechas seguidas, o dano de cada flecha a partir daí _cai 10%%_ por disparo. Parar de atirar por um tempo remove este efeito.\n\nFlechas disparadas: _%1$d_\nTurnos restantes: _%2$s_.
items.arrowbag.name=aljava mágica
items.arrowbag.desc=Uma aljava mágica que, enquanto equipada, liga o efeito de poções, sementes ou água benta aos ataques a distância. Funciona com arcos, armas de fogo, armas de arremesso e varinhas. O dano dos acertos infundidos sobe 10%, mais 2% por nível da aljava.\n\nGuarda até quatro efeitos diferentes. Cada acerto usa um efeito, escolhido ao acaso ou em ciclo, na ordem dos slots. Infundir o mesmo ingrediente de novo soma cargas ao slot que ele já ocupa. Gerenciar efeitos deixa você ver ou descartar um efeito guardado. Cada aprimoramento soma 10% à chance de poupar uma carga, até chegar a 100% com +10.\n\nPoções comuns dão 15 cargas e poções exóticas dão 5, seja qual for o nível da aljava. Sementes e água benta dão 15 cargas, mais 3 por nível. Poções da força e da maestria aprimoram a aljava na hora. Veja a descrição de cada ingrediente para saber o efeito exato.\n\nInfusões em varinhas ativam uma vez por alvo hostil a cada disparo; disparos utilitários que não atingem nenhum inimigo não gastam infusão. A força do efeito com varinhas usa o dano médio da varinha, ou o nível dela no caso de varinhas que não causam dano.
items.arrowbag.potion_desc=A aljava guarda _%1$s_, que vai passar o efeito para as próximas %2$d armas de arremesso.
items.arrowbag.ac_inject=INFUNDIR
items.arrowbag.select_title=Escolha uma poção, semente ou água benta para infundir
items.arrowbag.levelup=Os encaixes da sua aljava agora absorvem mais que antes.
items.arrowbag.seed_desc=A aljava guarda _%1$s_, cujo efeito vai agir nas próximas %2$d armas de arremesso.
items.arrowbag.holy_desc=A aljava guarda _água benta_, que vai abençoar as próximas %1$d armas de arremesso: cada uma cura você um pouco e explode no que atingir.
items.arrowbag.desc_healing=Flechas infundidas com poção da cura _curam o herói em 40% do dano causado_.
items.arrowbag.desc_mindvision=Flechas infundidas com poção de visão mental dão ao herói visão mental do inimigo atingido.
items.arrowbag.desc_frost=Flechas infundidas com poção gélida _têm 20% de chance de congelar o inimigo atingido_.
items.arrowbag.desc_liquidflame=Flechas infundidas com poção da chama líquida vão _incendiar o inimigo atingido_.
items.arrowbag.desc_toxicgas=Flechas infundidas com poção de gás tóxico causam _3 (+20% do dano) turnos de Veneno_ no inimigo atingido.
items.arrowbag.desc_haste=Flechas infundidas com poção da pressa dão _3 turnos de Aceleração_ ao herói.
items.arrowbag.desc_invisibility=Flechas infundidas com poção de invisibilidade causam _2 turnos de Cegueira_ no inimigo atingido.
items.arrowbag.desc_levitation=Flechas infundidas com poção de levitação causam _3 turnos de Vertigem_ no inimigo atingido.
items.arrowbag.desc_paralyticgas=Flechas infundidas com poção de gás paralítico causam _2 turnos de Paralisia_ no inimigo atingido.
items.arrowbag.desc_purity=Flechas infundidas com poção de pureza vão _remover os efeitos negativos_ do herói e dar a ele _2 turnos de imunidade a efeitos negativos_.
items.arrowbag.desc_experience=Flechas infundidas com poção de experiência causam _muito dano bônus contra mortos-vivos e demônios_.
items.arrowbag.desc_shielding=Flechas infundidas com poção da blindagem dão ao herói _5 (+10% da vida máxima) de blindagem_.
items.arrowbag.desc_magicalsight=Flechas infundidas com poção da visão mágica fazem o herói _descobrir tudo numa área de 13x13 ao redor dele_.
items.arrowbag.desc_snapfreeze=Flechas infundidas com poção do congelamento instantâneo vão _congelar o inimigo atingido por 5 turnos_.
items.arrowbag.desc_dragonsbreath=Flechas infundidas com poção bafo de dragão vão _incendiar o inimigo atingido_ e causar _dano de fogo extra_.
items.arrowbag.desc_corrosivegas=Flechas infundidas com poção de gás corrosivo causam _3 turnos de Corrosão com dano inicial de 2 (+10% do dano)_ no inimigo.
items.arrowbag.desc_stamina=Flechas infundidas com poção do vigor _removem toda a exaustão_ do herói.
items.arrowbag.desc_shroudingfog=Flechas infundidas com poção da neblina dão _2 turnos de Invisibilidade_ ao personagem atingido.
items.arrowbag.desc_stormclouds=Flechas infundidas com poção de nuvens tempestuosas soltam um _jato de água pressurizada_.
items.arrowbag.desc_earthenarmor=Flechas infundidas com poção da armadura de barro dão ao herói uma _armadura de pele arbórea igual a 50% do dano_, que diminui a cada turno.
items.arrowbag.desc_cleansing=Flechas infundidas com poção da limpeza dão _4 turnos de Imune à Magia_ ao herói.
items.arrowbag.desc_divineinspiration=Flechas infundidas com poção da inspiração divina dão ao herói os pontos de experiência do inimigo atingido.
items.arrowbag.desc_aqua=Flechas infundidas com composto aquático vão _soltar nuvens tempestuosas_ com cerca de metade do tamanho das nuvens da poção de nuvens tempestuosas.
items.arrowbag.desc_blizzard=Flechas infundidas com composto nevado vão _soltar uma nevasca_ com cerca de metade do tamanho da nevasca do composto.
items.arrowbag.desc_caustic=Flechas infundidas com composto cáustico vão _causar Muco Cáustico numa área de 5x5_.
items.arrowbag.desc_infernal=Flechas infundidas com composto Infernal vão _soltar um inferno_ com cerca de metade do tamanho do inferno do composto.
items.arrowbag.desc_shocking=Flechas infundidas com composto eletrizado causam _20%-60% a mais de dano_ como dano elétrico.
items.arrowbag.desc_unstable=Flechas infundidas com composto instável ativam um _efeito aleatório de infusão de poção_.
