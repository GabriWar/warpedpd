items.dewvial2.empty=Seu frasco de orvalho aprimorado está vazio!
items.dewvial2.full=Seu frasco de orvalho aprimorado está cheio!
items.dewvial2.collected=Você guardou uma gota de orvalho no seu frasco de orvalho aprimorado.
items.dewvial2.watered=A masmorra volta a brotar ao seu redor.
