items.potions.exotic.potionofabsolutezero.name=poção do zero absoluto
items.potions.exotic.potionofabsolutezero.desc=Este líquido super-resfriado congela tudo na área assim que é destampado, prendendo todos os inimigos do andar em gelo sólido.
items.potions.exotic.potionofabsolutezero.mobs_effected=%d inimigos congelam por completo!
items.potions.exotic.potionofabsolutezero.no_targets=Nenhum inimigo para congelar.
items.potions.exotic.potionofadrenalinesurge.name=poção do surto de adrenalina
items.potions.exotic.potionofadrenalinesurge.desc=Beber este líquido ardente inunda seu corpo de energia bruta, e você age com uma velocidade incrível por um momento breve, mas intenso.
items.potions.exotic.potionofadrenalinesurge.effect=Você sente uma onda poderosa de adrenalina!
items.potions.exotic.potionofalcohol.name=poção de álcool
items.potions.exotic.potionofalcohol.desc=Esta bebida fermentada é muito mais forte que um vinho comum. Bebê-la deixa você completamente embriagado, com reações mais lentas, mas com a dor amortecida.
items.potions.exotic.potionofalcohol.drunk=Você se sente muito bêbado!
items.potions.exotic.potionofallseeing.name=poção da onividência
items.potions.exotic.potionofallseeing.desc=Os vapores místicos deste frasco dão a quem bebe uma percepção extraordinária, revelando por completo o mapa do andar atual e todas as armadilhas e portas escondidas.
items.potions.exotic.potionofallseeing.layout=O mapa do andar é revelado para você!
items.potions.exotic.potionofarmor.name=poção da armadura
items.potions.exotic.potionofarmor.desc=Ao ser ingerido, este composto endurecedor cobre sua pele com uma rede cristalina e dá uma boa proteção contra ataques físicos.
items.potions.exotic.potionofash.name=poção das cinzas
items.potions.exotic.potionofash.desc=Quando destampado, o conteúdo incendiário deste frasco incendeia todos os inimigos do andar com chamas escaldantes.
items.potions.exotic.potionofash.mobs_effected=%d inimigos pegam fogo!
items.potions.exotic.potionofash.no_targets=Nenhum inimigo para incendiar.
items.potions.exotic.potionofathmosphericcompression.name=poção da compressão atmosférica
items.potions.exotic.potionofathmosphericcompression.desc=Este líquido de alta pressão se expande com violência quando destampado, evaporando toda a água do andar e esmagando com a força da compressão os inimigos que estiverem em poças.
items.potions.exotic.potionofathmosphericcompression.mobs_effected=%d inimigos são esmagados pela compressão!
items.potions.exotic.potionofathmosphericcompression.no_targets=A pressão do ar muda drasticamente, mas não há alvos.
items.potions.exotic.potionofautumn.name=poção do outono
items.potions.exotic.potionofautumn.desc=Derramar este composto terroso transforma a grama e a vegetação rasteira ao seu redor em solo fértil, pronto para o plantio.
items.potions.exotic.potionofautumn.grown=%d trechos de grama alta amadurecem e viram solo fértil.
items.potions.exotic.potionofautumn.no_tiles=Não há grama alta por perto para transformar.
items.potions.exotic.potionofballlightning.name=poção do raio globular
items.potions.exotic.potionofballlightning.desc=Este frasco crepitante contém uma esfera de pura energia elétrica. Destampado, ele explode em relâmpagos que saltam entre todos os inimigos do andar.
items.potions.exotic.potionofballlightning.mobs_effected=%d inimigos são atingidos pelo raio globular!
items.potions.exotic.potionofballlightning.no_targets=O relâmpago crepita, mas não encontra alvos.
items.potions.exotic.potionofbeacon.name=poção do farol
items.potions.exotic.potionofbeacon.desc=A luz radiante deste frasco cega todos os inimigos do andar quando liberada. Criaturas mortas-vivas são especialmente vulneráveis ao seu brilho sagrado.
items.potions.exotic.potionofbeacon.mobs_effected=%d inimigos ficam cegos com a luz!
items.potions.exotic.potionofbeacon.no_targets=A luz brilha forte, mas não há inimigos para cegar.
items.potions.exotic.potionofbee.name=poção da abelha
items.potions.exotic.potionofbee.desc=Arremessada, esta poção se quebra perto de um inimigo e solta um pote de mel grudento, de onde sai um enxame furioso de abelhas que persegue sem trégua o inimigo mais próximo.
items.potions.exotic.potionofbee.summoned_bee=Um enxame de abelhas sai do pote de mel!
items.potions.exotic.potionofbee.no_enemy=Não há inimigos por perto para as abelhas atacarem.
items.potions.exotic.potionofbleeding.name=poção do sangramento
items.potions.exotic.potionofbleeding.desc=Arremessar esta poção corrosiva faz todos os inimigos visíveis começarem a sangrar, perdendo vida aos poucos.
items.potions.exotic.potionofbleeding.mobs_effected=%d inimigos começam a sangrar!
items.potions.exotic.potionofbleeding.no_targets=Nenhum inimigo visível para atingir.
items.potions.exotic.potionofbrain.name=poção do cérebro
items.potions.exotic.potionofbrain.desc=Beber esta mistura de conhecimento destilado inunda sua mente de segredos arcanos, e um pergaminho aleatório se materializa nas suas mãos.
items.potions.exotic.potionofbrain.effect=O conhecimento inunda sua mente!
items.potions.exotic.potionofbutterbread.name=poção do pão com manteiga
items.potions.exotic.potionofbutterbread.desc=Este composto bem substancioso alimenta mais que a poção de orvalho comum, enchendo seu estômago por completo e mais um pouco.
