items.artifacts.etherealchains.desc=Estas grandes porém leves correntes brilham com energia espiritual. Elas podem ser usadas para puxar a si mesmo pelo terreno ou puxar inimigos até você. A natureza etérea dessas correntes as permitem até mesmo se estenderem através de paredes!
items.artifacts.etherealchains.desc_cursed=As correntes amaldiçoadas se prendem a você, constantemente deslizando ao seu redor, tentando amarrar você ou fazer com que tropece.
items.artifacts.etherealchains.desc_equipped=As correntes descansam ao seu lado, lentamente sugando a energia espiritual daqueles que você derrota. Cada carga é um elo na corrente, alongando-se exatamente um quadrado por elo.
items.artifacts.etherealchains$chainsrecharge.levelup=Suas correntes ficam mais fortes!

items.artifacts.holytome.name=Tomo sagrado
items.artifacts.holytome.ac_cast=LANÇAR
items.artifacts.holytome.no_spell=Você não é capaz de usar este feitiço agora.
items.artifacts.holytome.cursed=Você não pode usar um tomo amaldiçoado
items.artifacts.holytome.levelup=Seu tomo cresceu em força!
items.artifacts.holytome.desc=Um tomo sagrado que atua como foco para a magia divina do Clérigo. Usar o tomo permite ao Clérigo lançar uma variedade de feitiços mágicos.\n\nO tomo ficará cada vez mais poderoso à medida que o Clérigo o usar, dando ao Clérigo mais cargas máximas e aumentando ligeiramente a velocidade de recarga.
items.artifacts.holytome.discover_hint=Um dos heróis inicia com este item.

