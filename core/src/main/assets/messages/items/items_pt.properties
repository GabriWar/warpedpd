items.weapon.melee.axe.typical_ability_desc=A Duelista pode _talhar_ um inimigo com o machado. Isso normalmente causa _%1$d-%2$d de dano_ e tem acerto garantido. Contra um inimigo que já está com menos da metade da vida, o golpe entra duas vezes mais fundo, normalmente _%3$d-%4$d de dano_.
items.weapon.melee.axe.ability_desc=A Duelista pode _talhar_ um inimigo com o machado. Isso causa _%1$d-%2$d de dano_ e tem acerto garantido. Contra um inimigo que já está com menos da metade da vida, o golpe entra duas vezes mais fundo, _%3$d-%4$d de dano_.
