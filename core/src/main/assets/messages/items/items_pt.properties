items.weapon.melee.alchemy.sharpkatana.typical_ability_desc=Com uma Lâmina Afiada, a Duelista pode usar o _Corte Relâmpago_. Esta habilidade ativa na hora, não gasta turno e ataca um único inimigo. Se a habilidade derrotar o inimigo, você normalmente ganha _%s_ cargas de arma.
items.weapon.enchantments.midas.name=%s de Midas
items.weapon.enchantments.midas.desc=Este encantamento faz seus inimigos sangrarem ouro. Um corte de raspão pode soltar algumas moedas, mas para ficar rico de verdade você quer que eles sangrem muito.
items.weapon.enchantments.vicious.name=%s cruel
items.weapon.enchantments.vicious.desc=Esta arma é coberta de espinhos afiados como navalhas, que rasgam os inimigos e causam muito dano bônus. É difícil empunhá-la sem se cortar.
items.weapon.enchantments.vicious.backfire=Sua arma corta suas mãos!
items.weapon.enchantments.hunting.name=%s de caça
items.weapon.enchantments.hunting.desc=Esta arma foi afiada para abater criaturas vivas, rasgando carne e sangue para causar dano bônus. Às vezes, uma morte limpa deixa para trás uma carne que vale a pena cozinhar.
items.weapon.enchantments.holy.name=%s celestial
items.weapon.enchantments.holy.desc=Este encantamento causa uma dor terrível aos mortos-vivos e ao que é de fato demoníaco neste mundo. Não tem efeito em mais nada.
items.weapon.enchantments.ancient.name=%s ancestral
items.weapon.enchantments.ancient.desc=Esta arma é de uma idade incalculável e, aos poucos, se sintoniza com um portador digno. Matar inimigos suficientes com ela fortalece a arma por conta própria, mas a cada vez ela resiste mais.
items.weapon.enchantments.ancient.attune=%s se sintoniza com você!
