items.weapon.melee.trumpet.ability_name=fanfarra
items.weapon.melee.trumpet.typical_ability_desc=A Duelista pode tocar uma _fanfarra_. Leva um turno e 2 cargas: todo inimigo à vista num raio que normalmente é de _%d quadrados_ fica parado no lugar por um turno, e ela e todos os aliados nesse alcance ficam abençoados por 3 turnos.
items.weapon.melee.trumpet.ability_desc=A Duelista pode tocar uma _fanfarra_. Leva um turno e 2 cargas: todo inimigo à vista num raio de _%d quadrados_ fica parado no lugar por um turno, e ela e todos os aliados nesse alcance ficam abençoados por 3 turnos.
