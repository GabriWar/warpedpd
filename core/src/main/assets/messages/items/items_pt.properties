items.potions.potion$seedtopotion.bottle=Usa uma garrafa vazia ou uma garrafa de água da sua mochila.
items.potions.potionofmindvision.no_scrying=As mentes aqui embaixo estão ocultas para você.
items.potions.potionofoverhealing.name=poção da supercura
items.potions.potionofoverhealing.desc=Este elixir poderoso cura você por completo e enche você de uma onda de vitalidade mágica que leva sua vida, por um tempo, além dos limites normais.
items.potions.potionofmana.name=poção de mana
items.potions.potionofmana.mana_restored=Sua energia mágica é restaurada em %d pontos.
items.potions.potionofmana.mana_full=Sua energia mágica já está cheia.
items.potions.potionofmana.desc=Esta poção azul cintilante restaura toda a sua energia mágica.
items.potions.potionofmending.name=poção da recuperação
items.potions.potionofmending.desc=Este restaurador suave cura parte dos seus ferimentos e trata males comuns.
items.potions.potionofmight.name=poção do poder
items.potions.potionofmight.msg=Uma força nova percorre seu corpo.
items.potions.potionofmight.desc=Esta poção poderosa e incrivelmente rara aumenta para sempre sua força em um ponto e sua vida máxima em cinco.
items.potions.potionofball.name=poção da bola
items.potions.potionofball.desc=Quando bebida, esta mistura energética faz você girar como uma bola, desorientando os inimigos próximos. Ao quebrar, solta uma nuvem de gás rodopiante que afeta quem estiver dentro.
items.potions.potionofblessing.name=poção da bênção
items.potions.potionofblessing.desc=Beber este líquido dourado enche você de uma sensação de sorte. Você é abençoado com sorte, o que reduz a chance de coisas ruins acontecerem.
items.potions.potionofchilli.name=poção da malagueta
items.potions.potionofchilli.desc=Este líquido vermelho ardente incendeia sua alma e dá fogo da alma, que queima com chama azul e protege contra o calor. Ao quebrar, invoca um elemental da alma aliado.
items.potions.potionofchilli.summon=Um elemental da alma surge das chamas!
items.potions.potionofdew.name=poção de orvalho
items.potions.potionofdew.desc=Este líquido fresco impregna seu corpo de orvalho curativo, que restaura sua vida aos poucos. Ao quebrar, espalha gotas de orvalho revigorantes pela área.
items.potions.potionofeye.name=poção do olho
items.potions.potionofeye.desc=Beber este líquido transparente aguça muito sua visão e revela todas as armadilhas escondidas e portas secretas à vista.
items.potions.potionofglowing.name=poção do brilho
items.potions.potionofglowing.desc=Este líquido luminescente faz você brilhar forte quando bebido. Ao quebrar, solta um gás luminoso que faz tudo o que estiver nele emitir luz.
items.potions.potionofgrass.name=poção da erva
items.potions.potionofgrass.desc=Esta mistura verde deixa você numa névoa de embriaguez quando bebida. Ao quebrar, solta uma fumaça de erva espessa que entorpece todos que a respiram.
items.potions.potionofhoney.name=poção de mel
items.potions.potionofhoney.desc=Esta doce poção dourada inunda seu corpo de açúcar e dá uma onda de energia intensa e duradoura.
items.potions.potionoflantern.name=poção da lanterna
items.potions.potionoflantern.desc=Quando bebida, esta poção faz seu corpo arder com uma luz morna, iluminando a área ao seu redor por bastante tempo.
items.potions.potionofparasites.name=poção dos parasitas
items.potions.potionofparasites.desc=Este líquido estranho cria uma simbiose parasítica com seu corpo, que dá vários efeitos benéficos a um custo.
items.potions.potionofpeanuts.name=poção de amendoim
items.potions.potionofpeanuts.desc=Esta mistura de amendoim marca você com o poder da noz e dá efeitos extras ligados à sua marca da noz.
items.potions.potionofpepper.name=poção da pimenta
items.potions.potionofpepper.desc=Quando bebido, este líquido vermelho e picante envolve você numa aura de calor que queima qualquer inimigo que ouse atacar você.
items.potions.potionofprotection.name=poção da proteção
items.potions.potionofprotection.desc=Este líquido espesso endurece em volta de você como uma casca de coco, criando uma barreira protetora duradoura que absorve o dano recebido.
items.potions.potionofregrowth.name=poção da maturação
items.potions.potionofregrowth.desc=Quando bebida, esta poção terrosa faz crescerem antenas no seu corpo, que dão bônus. Ao quebrar, solta uma explosão de energia de maturação.
items.potions.potionofshadows.name=poção das sombras
items.potions.potionofshadows.desc=Este líquido escuro funde você profundamente com as sombras, deixando você quase invisível por bastante tempo e removendo efeitos negativos.
items.potions.potionofshield.name=poção do escudo
items.potions.potionofshield.desc=Quando bebido, este líquido rosado envolve você numa barreira de rosas, que protege contra dano por bastante tempo.
items.potions.potionofwine.name=poção de vinho
items.potions.potionofwine.desc=Esta bebida de uva embriagante deixa você bêbado, o que afeta seus movimentos e sua percepção.
items.potions.potionofwithering.name=poção do definhamento
items.potions.potionofwithering.desc=Quando bebido, este líquido escuro aflige você com a maldição do definhamento. Ao quebrar, solta uma nuvem de vapor de definhamento que enfraquece todos dentro dela.
items.potions.potionofbanana.name=poção da banana
items.potions.potionofbanana.desc=Esta mistura amarela estranha tem um leve cheiro de fruta tropical. Bebê-la dá uma onda de experiência proporcional ao andar atual da masmorra.
items.potions.potionofbanana.msg=A mistura de banana enche você de energia! Você se sente mais experiente.
items.potions.potionofegg.name=poção do ovo
items.potions.potionofegg.desc=Uma poção peculiar que irradia um calor suave. Bebê-la enche de novo as estantes vazias ao seu redor, para que possam ser vasculhadas outra vez.
items.potions.potionofegg.msg=A poção do ovo penetra nas paredes e restaura o conhecimento perdido.
items.potions.potionofegg.restocked=As estantes foram reabastecidas!
items.potions.potionofegg.nothing=O calor se espalha e não encontra nenhuma estante vazia para encher.
items.potions.potionofflora.name=poção da flora
items.potions.potionofflora.desc=Um líquido verde-vivo transbordando de energia botânica. Bebê-lo faz sementes brotarem de você e se plantarem no chão por perto.
items.potions.potionofflora.msg=Sementes irrompem de você e se enterram no chão!
items.potions.potionofhunger.name=poção da fome
items.potions.potionofhunger.desc=Uma mistura substanciosa que enche o estômago. Consumi-la sacia uma quantidade moderada de fome e mantém você bem alimentado por um tempo.
items.potions.potionofhunger.msg=A mistura nutritiva enche seu estômago.
items.potions.potionoflove.name=poção do amor
items.potions.potionoflove.desc=Um líquido rosado e doce, com um aroma irresistível. Quando bebido, todas as criaturas visíveis ficam apaixonadas por você e viram aliadas temporárias.
items.potions.potionoflove.msg=Todas as criaturas próximas ficam encantadas por você!
items.potions.potionofmuscle.name=poção do músculo
items.potions.potionofmuscle.desc=Uma mistura viscosa que faz seus músculos formigarem. Consumi-la aumenta para sempre sua força em um ponto.
items.potions.potionofmuscle.msg=Seus músculos se enchem de poder! Sua força agora é %d.
items.potions.potionofseed.name=poção da semente
items.potions.potionofseed.desc=Um líquido verde e turvo com cheiro de terra e raízes. Bebê-lo faz surgir uma semente aleatória aos seus pés.
items.potions.potionofseed.msg=Uma semente se materializa aos seus pés.
items.potions.potionoftime.name=poção do tempo
items.potions.potionoftime.desc=Um líquido cintilante que parece desacelerar o mundo ao redor. Quando bebido, todos os inimigos visíveis ficam congelados no tempo por uma duração que depende da sua força.
items.potions.potionoftime.msg=O tempo parou para seus inimigos!
items.potions.potionoftomatosoup.name=poção de sopa de tomate
items.potions.potionoftomatosoup.desc=Um caldo vermelho e quente com um cheiro delicioso. Bebê-lo sacia uma quantidade de fome igual à sua força atual.
items.potions.potionoftomatosoup.msg=A sopa quente enche sua barriga.
items.potions.potionoffirelightning.name=poção do relâmpago de fogo
items.potions.potionoffirelightning.zuzu=Você sempre foi fraco, Zuzu!
items.potions.potionoffirelightning.desc=Uma mistura instável que estala com eletricidade e calor. Bebê-la dispara raios de relâmpago flamejante em todos os inimigos visíveis, causando dano e incendiando-os.
items.potions.potionoflightning.name=poção do relâmpago
items.potions.potionoflightning.desc=Um líquido azul faiscante que zumbe com energia elétrica. Quando bebido, ele dispara raios em todos os inimigos visíveis, causando um dano considerável e fazendo o chão tremer.
items.potions.potionofdigesting.name=poção digestiva
items.potions.potionofdigesting.desc=Um líquido ácido e borbulhante com um cheiro forte e corrosivo. Bebê-lo causa corrosão por dentro. Ao quebrar, solta uma nuvem de ácido que corrói quem estiver dentro.
items.potions.potionoffirestorm.name=poção da tempestade de fogo
items.potions.potionoffirestorm.desc=Um líquido vermelho e volátil que estala de calor. Bebê-lo incendeia a área ao seu redor. Ao quebrar, explode numa tempestade de fogo que se espalha pelos quadrados próximos.
items.potions.potionofhydrogenfire.name=poção do fogo de hidrogênio
items.potions.potionofhydrogenfire.desc=Um líquido extremamente inflamável que queima com fúria intensa. Bebê-lo provoca um incêndio enorme ao seu redor. Ao quebrar, cria uma tempestade de fogo poderosa, muito mais intensa que o fogo comum.
items.potions.potionofhypno.name=poção hipnótica
items.potions.potionofhypno.desc=Um líquido iridescente e rodopiante que pulsa com energia hipnótica. Bebê-lo hipnotiza todos os inimigos próximos. Ao quebrar, todas as criaturas perto do impacto são corrompidas e viram aliadas.
items.potions.potionoficestorm.name=poção da tempestade de gelo
items.potions.potionoficestorm.desc=Uma nevasca rodopiante em forma líquida. Bebê-la desencadeia uma tempestade congelante ao seu redor. Ao quebrar, cria uma nevasca que se espalha e congela tudo por perto.
items.potions.potionofkiwi.name=poção de kiwi
items.potions.potionofkiwi.desc=Um líquido verde-vivo cheio de energia botânica. Bebê-lo inunda a área de plantas crescendo com vigor. Ao quebrar, provoca uma explosão de maturação que cobre todos os quadrados próximos.
items.potions.potionofslowness.name=poção da lentidão
items.potions.potionofslowness.desc=Um líquido espesso e viscoso que parece se arrastar pelo ar. Bebê-lo deixa seus movimentos mais lentos. Ao quebrar, solta uma nuvem que deixa lentos todos que a respiram.
items.potions.potionofsmoke.name=poção da fumaça
items.potions.potionofsmoke.desc=Um líquido cinza e turvo que fede a cinzas. Bebê-lo cria uma nuvem de fumaça ao seu redor. Ao quebrar, enche a área com uma cortina de fumaça espessa que bloqueia a visão.
items.potions.potionofsnowstorm.name=poção da tempestade de neve
items.potions.potionofsnowstorm.desc=Um líquido de um frio cortante que arde ao toque. Bebê-lo desencadeia uma nevasca e enraíza você no lugar. Ao quebrar, cria uma tempestade gelada que enraíza e gela todas as criaturas próximas.
items.potions.potionofsoda.name=poção de refrigerante
items.potions.potionofsoda.desc=Um líquido gaseificado sob pressão extrema, a ponto de explodir. Bebê-lo causa uma explosão imediata ao seu redor. Ao quebrar, detona com a força de uma bomba.
items.potions.potionofsteam.name=poção do vapor
items.potions.potionofsteam.desc=Um líquido morno e vaporoso que parece mais leve que o ar. Bebê-lo dá levitação. Ao quebrar, solta uma nuvem de vapor que faz todas as criaturas próximas flutuarem no ar.
items.potions.potionofultraviolett.name=poção ultravioleta
items.potions.potionofultraviolett.desc=Um líquido violeta brilhante que irradia uma intensa energia UV. Bebê-lo atinge os inimigos próximos com luz ultravioleta, cegando-os e queimando mortos-vivos. Ao quebrar, banha a área numa radiação UV abrasadora.
items.potions.potionofbutter.name=poção da manteiga
items.potions.potionofbutter.desc=Um líquido espesso e dourado com cheiro de grama fresca. Ao quebrar, cobre de vegetação os quadrados vazios próximos e os faz florescer.
items.potions.potionofdirt.name=poção da terra
items.potions.potionofdirt.desc=Um líquido lamacento e terroso, cheio de fertilidade. Ao quebrar, transforma os quadrados vazios e com grama da área em grama alta e viçosa.
items.potions.potionofgoo.name=poção da gosma
items.potions.potionofgoo.desc=Um líquido viscoso que pinga e parece vivo. Ao quebrar, cobre todas as criaturas próximas com uma gosma corrosiva.
items.potions.potionofharvest.name=poção da colheita
items.potions.potionofharvest.desc=Um líquido fértil com cheiro de chuva e terra. Ao quebrar, faz crescer rápido grama alta em todos os quadrados transitáveis próximos.
items.potions.potionofinfection.name=poção da infecção
items.potions.potionofinfection.desc=Um líquido escuro que se contorce, cheio de vida invisível. Ao quebrar, invoca um espírito hostil no quadrado alvo.
items.potions.potionofsun.name=poção da luz solar
items.potions.potionofsun.desc=Um líquido dourado radiante que parece brilhar por dentro. O clarão intenso dele destrói na hora todos os mortos-vivos do andar.
items.potions.potionofvine.name=poção da vinha
items.potions.potionofvine.desc=Um líquido verde-escuro e emaranhado que pulsa com energia selvagem. Ao quebrar, invoca um espírito hostil no quadrado alvo.
items.potions.potionofwater.name=garrafa de água
items.potions.potionofwater.desc=Uma garrafa transparente de água comum. Despeje num quadrado ao seu lado, ou em você mesmo, e fique com a garrafa: a água apaga o fogo, encharca quem estiver ali e deixa uma poça no chão descoberto. Arremessada, a garrafa quebra e faz o mesmo onde cair.\n\nEncha uma garrafa vazia em qualquer água ou num pote de alquimia.
items.potions.potionofwater.ac_pour=DESPEJAR
items.potions.potionofwater.pour_prompt=Escolha onde despejar a água
items.potions.potionofwater.too_far=Você só pode despejar água ao seu lado.
items.potions.potionofwater.poured=Você despeja a água.
items.potions.potionofwater.doused=As chamas se apagam com um chiado.
items.potions.brews.wickedbrew.name=composto perverso
items.potions.brews.wickedbrew.desc=Este composto imundo de gás tóxico e paralítico faz mais do que qualquer uma das duas poções sozinha. Quando arremessado, solta uma nuvem espessa dos dois gases, então quem estiver dentro fica imóvel enquanto o veneno o corrói. Quando bebido, deixa você imune a gás tóxico, paralítico e corrosivo por 40 turnos.
items.potions.brews.frigidbrew.name=composto gélido
items.potions.brews.frigidbrew.desc=Quando arremessado, este composto congela uma área 3x3 e desencadeia uma tempestade de gelo que se espalha a partir do impacto, congelando no lugar tudo o que alcança. Quando bebido, imbui você de gelo por 50 turnos: seus ataques gelam os inimigos e você não pode ser gelado nem congelado.
items.potions.brews.frostfirebrew.name=composto fogo-gélido
items.potions.brews.frostfirebrew.desc=Gelo e fogo brigam dentro deste composto. Quando arremessado, ele congela na hora tudo numa área 3x3 e enraíza quem for pego por 5 turnos, depois irrompe em chamas em volta deles. Quando bebido, imbui você de fogo e de gelo por 25 turnos, então seus ataques queimam e gelam, e você fica imune aos dois.
items.potions.brews.thunderheadbrew.name=composto trovejante
items.potions.brews.thunderheadbrew.desc=Quando arremessado, este composto solta uma nuvem 3x3 de vapor escaldante carregado de relâmpagos. Por 8 turnos, quem estiver na área carregada é atingido por um raio a cada turno. Quando bebido, deixa você imune a eletricidade por 40 turnos, e seus golpes corpo a corpo têm 30% de chance de fazer um raio saltar para outro inimigo ao lado do seu alvo.
items.potions.brews.blindingbrew.name=composto cegante
items.potions.brews.blindingbrew.desc=Quando arremessado, este composto explode num clarão cegante dentro de uma nuvem de fumaça luminosa. Toda criatura a até 2 quadrados, exceto você e seus aliados, fica cega por 6 turnos. Quando bebido, permite que você sinta criaturas próximas através das paredes por 15 turnos e deixa você imune a cegueira por 60 turnos.
items.potions.brews.overgrowthbrew.name=composto de super crescimento
items.potions.brews.overgrowthbrew.desc=Quando arremessado, este composto faz plantas brotarem a até 2 quadrados do impacto. Vinhas agarram todo inimigo que estiver nessa área e o enraízam por 4 turnos. Quando bebido, cobre você de pele arbórea equivalente a 2 mais um terço do seu nível, que perde 1 ponto a cada 4 turnos, e nada pode enraizar você enquanto ela durar.
items.potions.brews.hypnobrew.name=composto hipnótico
items.potions.brews.hypnobrew.desc=Quando arremessado, este composto solta uma névoa enlouquecedora. Todo inimigo a até 2 quadrados entra em cólera por 8 turnos e ataca o que estiver mais perto, inclusive outros monstros. Chefes resistem à loucura e só ficam encantados por 3 turnos. Quando bebido, a névoa sai de você e encanta todo inimigo ao seu lado por 5 turnos. Chefes não são afetados.
items.potions.brews.quicksandbrew.name=composto de areia movediça
items.potions.brews.quicksandbrew.desc=Quando arremessado, este composto transforma o chão numa lama que suga e solta uma nuvem que deixa lento numa área 3x3. Inimigos nessa área ficam aleijados por 6 turnos e lentos por 4 turnos. Quando bebido, deixa você com o pé firme: por 60 turnos, você não pode ser aleijado, deixado lento nem enraizado.
items.potions.elixirs.elixirofrestoration.name=elixir da restauração
items.potions.elixirs.elixirofrestoration.desc=Este elixir junta cura e recuperação numa só dose. Quando bebido, cura cerca de metade da vida máxima de quem bebe ao longo de pouco tempo e remove todos os efeitos negativos que o afligem. Quando arremessado, cura na hora você e seus aliados numa área 3x3 em um quarto da vida máxima de cada um e os purifica. Inimigos não são afetados.
items.potions.elixirs.elixirofvitality.name=elixir da vitalidade
items.potions.elixirs.elixirofvitality.desc=Quando bebido, este elixir cura cerca de metade da vida máxima de quem bebe ao longo de pouco tempo e trata males comuns, enquanto endurece a pele numa barreira equivalente a cerca de um terço da vida máxima. Quando arremessado, dá a você e aos seus aliados numa área 3x3 uma barreira equivalente a um quarto da vida máxima de cada um.
items.potions.elixirs.elixiroftheshade.name=elixir da sombra
items.potions.elixirs.elixiroftheshade.shade=Você se dissolve nas sombras.
items.potions.elixirs.elixiroftheshade.desc=Quando bebido, este elixir deixa quem bebe invisível por 20 turnos e o envolve em sombra viva. Os 3 primeiros ataques feitos enquanto invisível não quebram a invisibilidade. Quando arremessado, explode numa cortina de fumaça espessa a até 2 quadrados do impacto. Se você estiver dentro dela, também fica invisível por 3 turnos.
items.potions.elixirs.elixirofthehunt.name=elixir da caça
items.potions.elixirs.elixirofthehunt.desc=Este elixir aguça todos os sentidos. Quando bebido, por 20 turnos quem bebe sente criaturas próximas através das paredes, se move 20% mais rápido e ataca com 15% mais precisão. Quando arremessado, marca todo inimigo a até 3 quadrados do impacto, e você pode senti-los por 40 turnos.
items.potions.elixirs.elixirofwarmth.name=elixir do calor
items.potions.elixirs.elixirofwarmth.desc=Quando bebido, este elixir enche quem bebe de um calor interno constante. Por 60 turnos, essa criatura não pode ser gelada nem congelada, e cada golpe corpo a corpo dela tem 25% de chance de incendiar o alvo. Quando arremessado, descongela uma área 3x3, derretendo o gelo e livrando todos ali do congelamento e do frio, e incendeia um inimigo atingido em cheio.
items.potions.elixirs.elixirofbloom.name=elixir da florada
items.potions.elixirs.elixirofbloom.desc=Quando bebido, por 100 turnos brota grama no chão descoberto por onde quem bebe anda, e toda semente encontrada ao pisotear grama alta vem em dobro. Quando arremessado, plantas brotam a até 2 quadrados do impacto e uma semente aleatória cria raízes no quadrado livre mais próximo.
items.potions.elixirs.elixirofclarity.name=elixir da clareza
items.potions.elixirs.elixirofclarity.desc=Quando bebido, este elixir restaura toda a mana de quem bebe e clareia a mente. Os próximos 3 abates que dão experiência dão 50% a mais de experiência. Quando arremessado, tira dos inimigos numa área 3x3 os benefícios mágicos: aceleração, adrenalina, bênção, invisibilidade, pele arbórea, armadura arcana e blindagem.
items.potions.exotic.exoticpotion.teal=poção azul-petróleo exótica
items.quest.escapecrystal.injure_confirm=Ok (esta mensagem não vai aparecer de novo em partidas futuras)
items.quest.pickaxe.ac_dig=CAVAR
items.quest.pickaxe.dug_down=Você rompe o chão e desce pelo buraco.
items.diarypage.name=página de diário
items.diarypage.desc=Uma página arrancada do diário de um minerador, comprada da bibliotecária da cidade. Ela descreve o andar %d da masmorra com detalhes suficientes para mapear o andar inteiro: leia lá e você vai conhecer o mapa. Lida em qualquer outro lugar, é só uma história triste sobre uma mina.
items.diarypage.ac_read=LER
items.diarypage.wrong_floor=A página descreve o andar %d. Você não está nele.
items.diarypage.discover_hint=Você pode comprar estas páginas com a bibliotecária da cidade.
items.rings.ring.pearl=anel de pérola
items.rings.ringofmagic.name=anel da magia
items.rings.ringofmagic.stats=Quando usado, este anel aumenta sua mana máxima em _%s_ e a velocidade de regeneração de mana.
items.rings.ringofmagic.typical_stats=Quando usado, este anel normalmente aumenta sua mana máxima em _%s_ e a velocidade de regeneração de mana.
items.rings.ringofmagic.upgrade_stat_name_1=Mana máxima
items.rings.ringofmagic.desc=Este anel irradia poder arcano e aumenta suas reservas mágicas e a velocidade com que sua mana se regenera. Já um anel amaldiçoado drena sua energia mágica.
items.scrolls.scroll.ansuz=pergaminho de ANSUZ
items.scrolls.scroll.hagalaz=pergaminho de HAGALAZ
items.scrolls.scroll.thurisaz=pergaminho de THURISAZ
items.scrolls.scroll.wet_pages=A chuva encharcou o pergaminho: a tinta escorre e você não consegue ler as palavras!
items.scrolls.scrollofmagicmapping.no_scrying=Estas profundezas se recusam a mostrar sua forma a você.
items.scrolls.scrollofmagicalinfusion.name=pergaminho da infusão mágica
items.scrolls.scrollofmagicalinfusion.inv_title=Infundir um item
items.scrolls.scrollofmagicalinfusion.infuse=Você infunde energia mágica em %s!
items.scrolls.scrollofmagicalinfusion.desc=Este pergaminho infunde uma arma ou armadura com uma poderosa energia mágica, aprimorando-a e garantindo que ela tenha um encantamento ou glifo.
items.scrolls.scrollofmultiupgrade.name=pergaminho do multiaprimoramento
items.scrolls.scrollofmultiupgrade.inv_title=Multiaprimorar um item
items.scrolls.scrollofmultiupgrade.upgrade=Um poder incrível aprimora %s!
items.scrolls.scrollofmultiupgrade.desc=Este pergaminho raríssimo contém magia de aprimoramento concentrada. Usado em um item, ele o aprimora cinco vezes de uma vez e remove qualquer maldição.
items.scrolls.scrollofregrowth.name=pergaminho da maturação
items.scrolls.scrollofregrowth.layout=A água inunda o andar enquanto uma vegetação exuberante ganha vida!
items.scrolls.scrollofregrowth.desc=Ler este pergaminho inunda o andar inteiro com água mágica e faz brotar vegetação exuberante por toda parte. Ele também revela o mapa do andar e descobre todas as áreas escondidas.
items.scrolls.exotic.exoticscroll.ansuz=Pergaminho exótico ANSUZ
items.scrolls.exotic.exoticscroll.hagalaz=Pergaminho exótico HAGALAZ
items.scrolls.exotic.exoticscroll.thurisaz=Pergaminho exótico THURISAZ
items.spells.magicalporter.ported=Seu item foi levado para o próximo andar de chefe!
items.spells.aquablast.name=explosão aquática
items.spells.aquablast.desc=Este feitiço dispara uma rajada concentrada de água em um alvo. Os quadrados ao redor do alvo ficam inundados e o alvo fica aturdido por um breve momento.
items.spells.crimsonepithet.name=epíteto carmesim
items.spells.crimsonepithet.tele_fail=Essa criatura não pode ser teletransportada!
items.spells.crimsonepithet.desc=Este feitiço teletransporta você para um local escolhido ou troca sua posição com a de uma criatura alvo. Não dá para trocar de lugar com criaturas imóveis.
items.spells.doomcall.name=chamado da perdição
items.spells.doomcall.crushed=Algo esmaga %s num instante!
items.spells.doomcall.desc=Este feitiço sombrio invoca uma força misteriosa que destrói na hora um inimigo aleatório do andar atual. Não funciona em chefes nem em minichefes.
items.spells.enchantmentinfusion.name=infusão de encantamento
items.spells.enchantmentinfusion.inv_title=Escolha uma arma ou armadura
items.spells.enchantmentinfusion.desc=Este feitiço infunde uma arma ou armadura com um encantamento mágico à sua escolha. Três opções aparecem: um encantamento comum, um incomum e um aleatório.
items.spells.featherfall.name=queda suave
items.spells.featherfall.light=Você se sente leve como uma pena!
items.spells.featherfall.desc=Este feitiço dá a quem o lança uma breve sensação de flutuar, o que evita dano de queda em abismos por um curto período.
items.spells.forcefield.name=campo de força
items.spells.forcefield.desc=Este feitiço cria uma barreira mágica em volta de quem o lança, um escudo temporário contra o dano recebido.
items.spells.forcepush.name=empurrão de força
items.spells.forcepush.desc=Este feitiço libera uma poderosa onda cinética que lança todos os inimigos visíveis para longe, em direções aleatórias.
items.spells.holyblast.name=explosão sagrada
items.spells.holyblast.desc=Este feitiço canaliza energia sagrada purificadora, que remove todas as maldições dos seus itens e dissipa o debuff de fraqueza.
items.spells.natureslullaby.name=acalento da natureza
items.spells.natureslullaby.sleep=Suas plantas adormecem...
items.spells.natureslullaby.desc=Este feitiço toca uma melodia suave que faz todas as plantas vivas visíveis voltarem a ser sementes, em estado dormente.
items.spells.plantsummon.name=invocar planta
items.spells.plantsummon.awaken=Suas plantas despertam!
items.spells.plantsummon.desc=Este feitiço desperta a energia vital de todas as plantas visíveis, e cada uma faz brotar ao seu lado uma planta viva aliada. A planta original é consumida no processo.
items.spells.seasonchange.name=mudança de estação
items.spells.seasonchange.desc=Este feitiço acelera a troca das estações no local e faz todas as plantas visíveis soltarem suas sementes e murcharem.
items.spells.spontaneouscombustion.name=combustão espontânea
items.spells.spontaneouscombustion.catch_fire=Você pega fogo!
items.spells.spontaneouscombustion.desc=Este feitiço instável faz quem o lança pegar fogo do nada. É perigoso, mas as chamas podem ser usadas com estratégia.
items.trinkets.dimensionalsundial.ac_check=CONFERIR
items.trinkets.dimensionalsundial.ac_guide=GUIA DO HUD
items.trinkets.dimensionalsundial.moon_phase=A lua está na fase de %s.
items.wands.wandofamok.name=varinha da cólera
items.wands.wandofamok.staff_name=cajado da cólera
items.wands.wandofamok.nothing=Nada acontece.
items.wands.wandofamok.desc=Esta varinha pulsa com uma energia sombria e caótica. Disparada contra um inimigo, ela o leva a uma fúria cega, e ele passa a atacar qualquer coisa por perto.
items.wands.wandofamok.stats_desc=Esta varinha deixa inimigos encolerizados por %d turnos. Usar esta varinha em si mesmo causa uma breve vertigem.
items.wands.wandofavalanche.name=varinha da avalanche
items.wands.wandofavalanche.staff_name=cajado da avalanche
items.wands.wandofavalanche.desc=Esta pesada varinha de pedra retumba com poder tectônico. Ao ser disparada, ela libera uma onda de choque devastadora de terra e pedra no local escolhido.
items.wands.wandofavalanche.stats_desc=Esta varinha causa _%1$d-%2$d de dano_ em área e pode paralisar por um instante os inimigos pegos na explosão.
items.wands.wandofblink.name=varinha da translocação
items.wands.wandofblink.no_blink=A magia deste lugar não deixa você se translocar.
items.wands.wandofblink.staff_name=cajado da translocação
items.wands.wandofblink.desc=Esta varinha leve de cristal estala com energia espacial. Ao ser disparada, ela teletransporta o usuário na hora pelo caminho do raio.
items.wands.wandofblink.stats_desc=Esta varinha teletransporta o usuário até _%d quadrados_ na direção escolhida.
items.wands.wandoffirebolt.name=varinha da seta de fogo
items.wands.wandoffirebolt.staff_name=cajado da seta de fogo
items.wands.wandoffirebolt.desc=Esta varinha antiquada é feita de madeira carbonizada, com uma brasa acesa na ponta. Ela dispara uma seta concentrada de fogo que incendeia tudo pelo caminho.
items.wands.wandoffirebolt.stats_desc=Esta varinha dispara uma seta de fogo que causa _%1$d-%2$d de dano_ e deixa os inimigos em chamas.
items.wands.wandofflock.name=varinha do rebanho
items.wands.wandofflock.no_flock=As ovelhas daqui obedecem a outro poder.
items.wands.wandofflock.staff_name=cajado do rebanho
items.wands.wandofflock.nothing=Nada acontece.
items.wands.wandofflock.desc=Esta varinha extravagante é enfeitada com tufinhos de lã. Ao ser disparada, ela invoca um rebanho de ovelhas mágicas que podem bloquear o movimento dos inimigos.
items.wands.wandofflock.stats_desc=Esta varinha invoca até _%d ovelhas_ perto do local escolhido. As ovelhas são inofensivas, mas podem atrapalhar a passagem dos inimigos.
items.wands.wandofflock.bmage_desc=Um cajado do rebanho não tem efeito extra ao acertar para _o Mago de Batalha_.
items.wands.wandofpoison.name=varinha do veneno
items.wands.wandofpoison.staff_name=cajado do veneno
items.wands.wandofpoison.nothing=Nada acontece.
items.wands.wandofpoison.desc=Esta varinha tem um corpo cor de cinza de onde escorre uma gosma verde e tóxica. Disparada contra um inimigo, ela o envenena com uma toxina potente.
items.wands.wandofpoison.stats_desc=Esta varinha causa um envenenamento que dura _%d turnos._
items.wands.wandofslowness.name=varinha da lentidão
items.wands.wandofslowness.staff_name=cajado da lentidão
items.wands.wandofslowness.nothing=Nada acontece.
items.wands.wandofslowness.desc=Esta varinha azul-gelo irradia uma aura gelada. Disparada contra um inimigo, ela deixa os movimentos dele bem mais lentos.
items.wands.wandofslowness.stats_desc=Esta varinha deixa inimigos lentos por _%1$.1f turnos._
items.wands.wandoftelekinesis.name=varinha da telecinese
items.wands.wandoftelekinesis.staff_name=cajado da telecinese
items.wands.wandoftelekinesis.pickup=Sua varinha puxa %s até você!
items.wands.wandoftelekinesis.desc=Esta varinha canaliza um feixe concentrado de força cinética. Ela pode empurrar inimigos pelo caminho, pegar itens a distância e interagir com o terreno.
items.wands.wandoftelekinesis.stats_desc=Esta varinha empurra inimigos por um feixe de até _%d quadrados_, pegando itens e ativando armadilhas pelo caminho.
items.wands.wandofteleportation.name=varinha do teletransporte
items.wands.wandofteleportation.staff_name=cajado do teletransporte
items.wands.wandofteleportation.nothing=Nada acontece.
items.wands.wandofteleportation.desc=Esta varinha zumbe com energia espacial, pronta para mandar seu alvo para outro lugar da masmorra.
items.wands.wandofteleportation.stats_desc=Esta varinha teletransporta a criatura alvo para um local aleatório do andar atual. Não tem efeito em NPCs, e as restrições de teletransporte continuam valendo.
items.wands.wandofteleportation.bmage_desc=Quando _o Mago de Batalha_ atinge um inimigo com um cajado do teletransporte, há uma chance de teletransportar esse inimigo para longe. A chance aumenta com o nível da varinha.
items.weapon.enchantments.osmose.name=%s de osmose
items.weapon.enchantments.osmose.desc=Este encantamento drena mana dos inimigos a cada golpe e recupera os PM de quem empunha a arma.
items.weapon.enchantments.horror.name=%s eldritch
items.weapon.enchantments.horror.desc=Este encantamento enche os inimigos de um pavor indescritível e os faz fugir aterrorizados. Se usado contra o herói, causa uma vertigem desorientadora.
items.weapon.enchantments.luck.name=%s da ventura
items.weapon.enchantments.luck.desc=Este encantamento rola o dano várias vezes e fica com o maior resultado, o que aumenta a chance de causar o dano máximo.
items.weapon.enchantments.paralysis.name=%s atordoante
items.weapon.enchantments.paralysis.desc=Golpes com esta arma têm uma chance de paralisar o alvo por um instante, deixando-o sem poder agir.
items.weapon.enchantments.poison.name=%s pestilente
items.weapon.enchantments.poison.desc=Este encantamento cobre os golpes com uma toxina potente, com alta chance de envenenar os inimigos atingidos.
items.weapon.enchantments.cromluck.name=%s da sorte de Crom
items.weapon.enchantments.cromluck.desc=Uma versão melhorada do encantamento da ventura. Rola o dano várias vezes sem penalidade e fica sempre com o maior resultado de todos.
items.weapon.enchantments.jupitershorror.name=%s horripilante
items.weapon.enchantments.jupitershorror.desc=O encantamento de Júpiter enche os inimigos de um terror sobrenatural e os faz fugir em pânico. O efeito é mais intenso que o de um encantamento eldritch comum.
items.weapon.enchantments.lokispoison.name=%s da peste
items.weapon.enchantments.lokispoison.desc=O encantamento de Loki espalha uma praga devastadora. A cada golpe, os inimigos próximos também sofrem com um veneno potente que persiste e causa dano contínuo.
items.weapon.enchantments.nomnom.name=%s NHAMNHAM
items.weapon.enchantments.nomnom.desc=Este encantamento voraz tem uma chance de devorar um inimigo de uma vez, matando-o na hora; quem empunha a arma se cura e sacia a fome.
items.weapon.enchantments.slashing.name=%s retalhante
items.weapon.enchantments.slashing.desc=Este encantamento desfere golpes cortantes devastadores, rolando o dano várias vezes para achar o golpe mais forte.
items.weapon.enchantments.aresleech.name=%s drenante
items.weapon.enchantments.aresleech.desc=O encantamento de Ares drena vida dos inimigos próximos, cura quem empunha a arma e carrega a arma relíquia.
items.weapon.enchantments.aresleech.drains=A espada de Ares drena %d cargas dos inimigos próximos.
items.weapon.enchantments.neptuneshock.name=%s megachocante
items.weapon.enchantments.neptuneshock.desc=O encantamento de Netuno lança relâmpagos nos inimigos próximos, gastando carga da arma. O dano dobra contra inimigos que estão na água.
items.weapon.enchantments.buzzsaw.name=%s da sede de sangue
items.weapon.enchantments.buzzsaw.desc=Este encantamento deixa a motosserra frenética: ela desfere vários golpes e gasta como combustível o orvalho do seu odre.
items.weapon.enchantments.buzzsaw.vrr=Vrrrrrr!
items.weapon.enchantments.buzzsaw.no_fuel=Sua motosserra está sem combustível!
items.weapon.enchantments.buzzsaw.not_on=Sua motosserra não está ligada!
items.weapon.melee.meleeweapon.ability_bad_position=Você não alcança esse alvo de onde está.
items.weapon.melee.meleeweapon.ac_poison=ENVENENAR
items.weapon.melee.meleeweapon.inv_title=Escolha uma semente
items.weapon.melee.meleeweapon.poisoned=Você envenenou %s com %s!
items.weapon.melee.meleeweapon.wears_off=O veneno em %s perdeu o efeito.
items.weapon.melee.meleeweapon.poison_desc=A _%s_ foi usada para _envenenar_ esta arma. Restam _%s_ golpes.
items.weapon.melee.warscythe.ac_reap=CEIFAR
items.weapon.melee.assassinsknife.name=faca do assassino
items.weapon.melee.assassinsknife.stats_desc=Esta arma tem _velocidade de ataque ~50% maior_ que uma arma comum de tier 2, mas causa menos dano por golpe.
items.weapon.melee.assassinsknife.desc=Lâminas rápidas e mortais, feitas para atingir órgãos vitais. Por serem leves, permitem golpes ligeiros e repetidos.
items.weapon.melee.axe.name=machado
items.weapon.melee.axe.stats_desc=Esta arma tem _velocidade de ataque ~17% menor_ que uma arma comum de tier 4, mas causa mais dano por golpe.
items.weapon.melee.axe.desc=Um machado pesado de lâmina única. A cabeça pesada dá golpes devastadores, mas o machado é lento.
items.weapon.melee.broadsword.name=espada de lâmina larga
items.weapon.melee.broadsword.desc=Uma espada curta de lâmina pesada e larga. Bem equilibrada tanto para cortar quanto para estocar.
items.weapon.melee.magestaff.name=cajado mágico
items.weapon.melee.magestaff.stats_desc=Esta arma tem _velocidade de ataque ~33% menor_ que uma arma comum de tier 2, mas causa mais dano por golpe.
items.weapon.melee.magestaff.desc=Um cajado entalhado em madeira encantada. O golpe é lento, mas ele canaliza bem a energia mágica.
items.weapon.melee.spork.name=garfolher
items.weapon.melee.spork.stats_desc=Esta arma tem _velocidade de ataque 2x_ e _precisão 20% maior_ em comparação com uma arma comum de tier 3, mas causa menos dano por golpe.
items.weapon.melee.spork.desc=É uma colher? É um garfo? Não é nenhum dos dois e é os dois. É bom os monstros respeitarem!
items.weapon.melee.royalspork.name=garfolher real
items.weapon.melee.royalspork.stats_desc=Esta arma tem _velocidade de ataque ~6,7x_ em comparação com uma arma comum de tier 4, mas causa bem menos dano por golpe.
items.weapon.melee.royalspork.desc=É uma colher? É um garfo? Não é nenhum dos dois e é os dois. Este é de ouro e coberto de joias. Superespecial. É bom os monstros respeitarem!
items.weapon.melee.chainsaw.name=mão-motosserra
items.weapon.melee.chainsaw.ac_on=LIGAR
items.weapon.melee.chainsaw.ac_off=DESLIGAR
items.weapon.melee.chainsaw.turn_on=A motosserra ganha vida com um rugido!
items.weapon.melee.chainsaw.turn_off=A motosserra engasga e para.
items.weapon.melee.chainsaw.desc=Este aparelho anão se prende ao seu braço e não pode ser removido. O encantamento da sede de sangue dele funciona com o orvalho do seu odre.
items.weapon.melee.relic.relicmeleeweapon.status_ready=PRONTO
items.weapon.melee.relic.relicmeleeweapon.desc_charged=A carga está completa.
items.weapon.melee.relic.relicmeleeweapon.desc_charging=Tem %d de %d cargas.
items.weapon.melee.relic.aressword.name=espada de Ares
items.weapon.melee.relic.aressword.ac_regen=REGENERAR
items.weapon.melee.relic.aressword.activate=Sua espada enche você de energia restauradora!
items.weapon.melee.relic.aressword.charged=Sua espada brilha com um poder que dá vida.
items.weapon.melee.relic.aressword.desc=Uma lâmina lendária forjada nas chamas da guerra. Com a carga completa, ela dá uma regeneração poderosa a quem a empunha.
items.weapon.melee.relic.cromcruachaxe.name=machado de Crom Cruach
items.weapon.melee.relic.cromcruachaxe.ac_dispel=DISSIPAR
items.weapon.melee.relic.cromcruachaxe.activate=Uma energia anuladora envolve você!
items.weapon.melee.relic.cromcruachaxe.charged=Seu machado pulsa com poder anulador.
items.weapon.melee.relic.cromcruachaxe.desc=Um machado antigo de origem sombria, imbuído do poder de anular magia. Com a carga completa, ele dá imunidade a efeitos mágicos.
items.weapon.melee.relic.lokisflail.name=mangual de Loki
items.weapon.melee.relic.lokisflail.ac_stealth=FURTIVIDADE
items.weapon.melee.relic.lokisflail.activate=Você some de vista!
items.weapon.melee.relic.lokisflail.charged=Seu mangual está com a carga completa.
items.weapon.melee.relic.lokisflail.preventing=Todos os inimigos deste andar estão cegos. Não adianta ficar invisível.
items.weapon.melee.relic.lokisflail.desc=Uma arma de trapaceiro, envolta em sombras. Com a carga completa, ela deixa quem a empunha invisível.
items.weapon.melee.relic.neptunustrident.name=tridente de Netuno
items.weapon.melee.relic.neptunustrident.ac_flood=INUNDAR
items.weapon.melee.relic.neptunustrident.activate=Que venham as águas!
items.weapon.melee.relic.neptunustrident.charged=Seu tridente atrai as marés.
items.weapon.melee.relic.neptunustrident.desc=Um tridente poderoso que canaliza o poder dos mares. Com a carga completa, ele inunda de água a área ao redor e deixa lentos os inimigos próximos.
items.weapon.missiles.missileweapon.ac_heave=ARREMESSAR
items.weapon.missiles.skull.name=crânio
items.weapon.missiles.skull.desc=Um crânio surpreendentemente aerodinâmico, que dá uma boa arma de arremesso. As órbitas ocas assobiam de um jeito sinistro durante o voo.
items.weapon.missiles.wave.name=onda
items.weapon.missiles.wave.desc=Uma arma de arremesso em forma de lua crescente, que corta o ar com um zunido característico.
items.weapon.missiles.riceball.name=bolinho de arroz
items.weapon.missiles.riceball.stats_desc=Esta arma ataca muito rápido e teletransporta inimigos que não são chefes ao acertar.
items.weapon.missiles.riceball.desc=Uma bola de arroz encantado bem compacta. Apesar de macia, tem um impacto mágico que desorienta e desloca os alvos.
items.weapon.missiles.curareshuriken.name=shuriken de curare
items.weapon.missiles.curareshuriken.stats_desc=Esta arma paralisa o alvo por um curto período.
items.weapon.missiles.curareshuriken.desc=Estas shurikens são cobertas de curare, um veneno paralisante potente. Um único acerto deixa o alvo sem conseguir se mover.
items.weapon.missiles.incendiaryshuriken.name=shuriken incendiária
items.weapon.missiles.incendiaryshuriken.stats_desc=Esta arma incendeia o alvo.
items.weapon.missiles.incendiaryshuriken.desc=Estas shurikens levam um composto volátil que pega fogo no impacto e deixa o alvo em chamas.
items.weapon.missiles.forestdart.name=dardo da floresta
items.weapon.missiles.forestdart.stats_desc=Esta arma causa dano bônus contra inimigos comuns.
items.weapon.missiles.forestdart.desc=Estes dardos são infundidos com a energia primordial da floresta e brilham com uma luz verdejante. São especialmente mortais contra criaturas comuns. Dardos da floresta iguais, vindos de saques diferentes, podem ser empilhados juntos, até 60 por pilha.
items.weapon.missiles.jupiterswraith.name=ira de Júpiter
items.weapon.missiles.jupiterswraith.ac_explode=EXPLODIR
items.weapon.missiles.jupiterswraith.desc=Esta arma de arremesso é a encarnação da ira de Júpiter. Ela volta para quem a lançou como um bumerangue e ganha carga a cada turno que passa.
items.weapon.missiles.jupiterswraith.desc_charged=\nEstá com a carga completa e pronta para liberar uma explosão devastadora!
items.weapon.missiles.jupiterswraith.desc_charging=\nTem %d de %d cargas.
items.weapon.missiles.jupiterswraith.status_ready=PRONTO
items.weapon.missiles.jupiterswraith.activate=A ira de Júpiter libera sua fúria!
items.weapon.missiles.jupiterswraith.charged=A ira de Júpiter está cheia de energia!
items.weapon.weapon$enchantment.level_desc=Foi _fortalecido até o nível %d_ em um pedestal de encantamento. Cada nível soma _+40%% de força ao efeito_ e _+20%% de chance de ativar_ em relação ao encantamento base.
items.armor.armor$glyph.level_desc=Foi _fortalecido até o nível %d_ em um pedestal de encantamento. Cada nível soma _+40%% de força ao efeito_ e _+20%% de chance de ativar_ em relação ao glifo base.
items.yellowdewdrop.name=gota de orvalho amarela
items.yellowdewdrop.desc=Uma gota de orvalho amarela e morna, um pouco mais potente que uma gota comum. Cura o dobro de uma gota de orvalho normal.
items.reddewdrop.name=gota de orvalho vermelha
items.reddewdrop.desc=Uma gota de orvalho de um vermelho vivo, cheia de energia restauradora. Cura cinco vezes mais que uma gota de orvalho normal.
items.violetdewdrop.name=gota de orvalho violeta
items.violetdewdrop.desc=Uma gota de orvalho violeta e cintilante, imbuída de magia curativa concentrada. Cura três vezes mais que uma gota de orvalho normal.
items.leveldewdrop.name=gota de vida
items.leveldewdrop.desc=Uma gota de orvalho pulsando de vida.
items.mushroom.name=cogumelo chapéu-de-sapo
items.mushroom.desc=Um cogumelo chapéu-de-sapo! Crescendo aqui, nesta masmorra úmida! Quem poderia imaginar uma coisa dessas!
items.dewvial.name=frasco de orvalho
items.dewvial.ac_sip=BEBERICAR
items.dewvial.ac_drink=BEBER
items.dewvial.ac_water=REGAR
items.dewvial.ac_splash=BORRIFAR
items.dewvial.ac_bless=ABENÇOAR
