items.artifacts.driedrose.cursed=Você não pode usar uma rosa amaldiçoada.
items.artifacts.driedrose.no_space=Não há espaço suficiente ao seu redor.
items.artifacts.driedrose.charged=Sua rosa está totalmente carregada!
items.artifacts.driedrose.desc=É esta a rosa que o fantasma mencionou antes de desaparecer? Ela parece conter uma forma de poder espiritual, talvez possa ser usada para canalizar a energia daquela alma perdida.
items.artifacts.driedrose.desc_no_quest=Uma rosa seca envelhecida que de algum jeito ainda está inteira.\n\nEla parece ter algum poder espiritual, mas você não tem ideia de como usá-la agora.
items.artifacts.driedrose.desc_hint=Algumas pétalas parecem estar faltando. Talvez reanexá-las possa fortalecer a rosa.
items.artifacts.driedrose.desc_cursed=A rosa amaldiçoada está presa à sua mão, um frio incomum pode ser sentido dela.
