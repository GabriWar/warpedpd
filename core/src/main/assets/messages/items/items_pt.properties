items.dewvial2.blessed=Você sente o orvalho abençoando os itens da sua mochila.
items.dewvial2.procced=Sua mochila brilha com uma luz purificadora, e uma energia maligna se dissipa.
items.dewvial2.not_procced=Sua mochila brilha com uma luz purificadora, mas nenhuma maldição foi removida.
items.dewvial2.looks_better=Com certeza %s parece melhor agora.
items.dewvial2.desc=Um frasco de vidro aprimorado que pode guardar orvalho mágico. Ele precisa de mais orvalho para ativar seus poderes, mas sua bênção é forte.
items.puddingcup.name=copinho de pudim
items.puddingcup.pickup=Oba! Um copinho de pudim!
items.puddingcup.desc=Um copinho de pudim de chocolate.
items.stoneore.name=minério de pedra
items.stoneore.desc=Um pedaço de minério de pedra bruto. É valioso e pode ser vendido nas lojas por um bom preço.
items.adamantarmor.name=armadura de adamantita
items.adamantarmor.desc=Apesar do estado precário, dá para ver que estas placas de armadura guardam uma magia poderosa.
items.adamantring.name=anel de adamantita
items.adamantring.desc=Um anel velho sem a joia. É feito de um minério cinza e opaco.
items.adamantwand.name=varinha de adamantita
items.adamantwand.desc=Uma haste de minério opaco em forma de varinha.
items.adamantweapon.name=arma de adamantita
items.adamantweapon.desc=Uma lâmina de uma arma antiga, feita de um minério cinza e opaco.
items.inactivemrdestructo.name=sr. destructo inativo
items.inactivemrdestructo.desc=O Sr. Destructo ficou inativo. Talvez haja um jeito de recarregá-lo.
items.inactivemrdestructo2.name=sr. destructo 2.0 inativo
items.inactivemrdestructo2.desc=O Sr. Destructo ficou inativo. Talvez haja um jeito de recarregá-lo.
items.activemrdestructo.name=sr. destructo
items.activemrdestructo.ac_activate=ATIVAR
items.activemrdestructo.desc=Está escrito: SR. DESTRUCTO. Uma geringonça esquisita. Jogue-a para montar uma torreta fixa que dispara raios nos inimigos!
items.activemrdestructo2.name=sr. destructo 2.0
items.activemrdestructo2.ac_activate=ATIVAR
items.activemrdestructo2.desc=Está escrito: SR. DESTRUCTO 2.0. Uma geringonça melhorada. Jogue-a para montar uma torreta mais poderosa!
items.orbofzot.name=orbe de zot
items.orbofzot.ac_activate=ATIVAR
items.orbofzot.ac_break=QUEBRAR
items.orbofzot.break=Você quebra o orbe! Uma folha de diário cai de dentro dele.
items.orbofzot.desc=O orbe de Zot é uma fonte de poder ilimitado criada pelo mago Zot. Jogue-o para montá-lo como uma torreta devastadora que dispara raios nos inimigos.
items.orbofzot.discover_hint=A última sombra do deus morto deixa cair este item.
items.dwarfhammer.name=martelo anão dos demônios
items.dwarfhammer.ac_break=ROMPER SELO
items.dwarfhammer.preventing=Este não é o lugar para usar o martelo.
items.dwarfhammer.unseal=Você rompe o selo da entrada do próximo andar.
items.dwarfhammer.desc=Frágil demais para servir de arma, este martelo mágico foi usado para selar os demônios neste andar. Talvez ainda reste magia suficiente para romper o selo do próximo andar.
items.greaterstylus.name=caneta arcana superior
items.greaterstylus.prompt=Escolha uma armadura para gravar
items.greaterstylus.inscribed=Você gravou um glifo na armadura!
items.greaterstylus.desc=Esta caneta arcana é feita de uma pedra escura e muito dura. Com ela você pode gravar um glifo mágico na sua armadura, mas não tem como escolher qual glifo será: a caneta decide por você.
items.towel.name=toalha
items.towel.ac_apply=APLICAR
items.towel.ac_apply_pet=APLICAR NO MASCOTE
items.towel.apply=Você usa a toalha.
items.towel.end=Sua toalha se desfaz.
items.towel.desc=Não esqueça sua toalha! Esta toalha mágica pode estancar sangramentos e remover muco cáustico. Ela tem usos limitados antes de se desfazer.
items.smartbomb.name=bomba inteligente
items.smartbomb.desc=Este explosivo avançado foi feito para ferir só os inimigos, sem atingir quem o usa. A explosão causa mais dano que a de uma bomba comum.
items.clusterbomb.name=bomba de fragmentação
items.clusterbomb.desc=Esta bomba se divide em várias explosões menores ao detonar, cobrindo uma área maior com explosões em posições aleatórias ao redor do ponto de impacto.
items.dizzybomb.name=bomba tonteante
items.dizzybomb.desc=Esta bomba libera uma onda de choque desorientadora ao detonar. Além de causar algum dano, ela deixa em vertigem qualquer inimigo pego na explosão.
items.holyhandgrenade.name=santa granada de mão
items.holyhandgrenade.desc=Um explosivo abençoado que causa um dano enorme a criaturas mortas-vivas e as faz fugir aterrorizadas. Não tem efeito nos vivos.
items.dumplingbomb.name=bomba de bolinhos
items.dumplingbomb.desc=Esta bomba aromática libera uma nuvem de fragrância calmante que deixa os inimigos próximos sonolentos e os teletransporta para longe.
items.dumplingbomb.no_teleport=Um dos inimigos não pôde ser teletransportado.
items.bombs.fishingbomb.name=bomba de pesca
items.bombs.fishingbomb.desc=Um punhado pesado de bolinhos amassados juntos, usado para pescar. Agitado e jogado, ele teletransporta as piranhas gigantes albinas próximas para terra firme.
items.bombs.fishingbomb.teleported=A piranha gigante albina foi teletransportada para terra firme!
items.bombs.fishingbomb.no_teleport=Você deixou um peixe escapar!
items.rice.name=grão de arroz mágico
items.rice.ac_cook=COZINHAR
items.rice.ac_cookbomb=BOMBA
items.rice.cooked=Agora você tem %s.
items.rice.crumbles=Seu arroz mágico vira pó!
items.rice.cracking=Seu arroz mágico está rachando...
items.rice.dull=Seu arroz mágico começa a perder o brilho...
items.rice.oni=Os habitantes acordaram, e estão com fome! Lá vêm os oni!
items.rice.desc=Este grão de arroz mágico pode criar muitos bolinhos que enchem a barriga. Use-o para cozinhar bolinhos de arroz para arremessar, ou junte mais arroz para fazer uma bomba de bolinhos. Cuidado: o arroz tem usos limitados antes de virar pó.
items.builderstool.name=ferramenta do construtor
items.builderstool.desc=Um martelo e um cinzel resistentes para construir ao ar livre, no mundo aberto: paredes, pisos, portas, telhados, cercas e o que mais você tiver material para fazer. Construir abre o menu de construção. Demolir desmonta uma peça e devolve metade dos materiais, Consertar repara uma peça danificada por um quarto deles, e Examinar mostra informações sobre uma peça e o cômodo a que ela pertence.\n\nVocê constrói a até %d quadrados de onde está, em qualquer terreno livre da superfície, das montanhas e das cavernas, exceto na cidade e no que o próprio mundo construiu.
items.builderstool.ac_build=CONSTRUIR
items.builderstool.ac_demolish=DEMOLIR
items.builderstool.ac_repair=CONSERTAR
items.builderstool.ac_inspect=EXAMINAR
items.builderstool.not_here=Você só pode construir ao ar livre, no mundo aberto: na superfície, nas montanhas e nas cavernas.
items.builderstool.host_only=Só o anfitrião pode construir.
items.honeypot.discover_hint=Você pode encontrar isto em salas especiais, em lojas ou com um anel da fortuna.
items.item.mp_target_unsupported=%s: a ação %s precisa de uma etapa de mira que ainda não funciona no multijogador.
items.spidercharm.name=amuleto de aranha
items.spidercharm.ac_use=USAR
items.spidercharm.desc=Este acessório exótico é envolto em uma aura de mistério. Quem sabe o que pode acontecer com quem o usar?\n\nUsá-lo custa um quarto da sua vida máxima e chama uma aranha serva para o seu lado.
items.spidercharm.ondeath=O amuleto bebeu o que restava da sua vida.
items.torch.ac_place=FINCAR
items.torch.place_prompt=Escolha onde fincar a tocha
items.torch.place_not_here=Só dá para fincar uma tocha no chão, lá fora no mundo.
items.torch.place_too_far=Finque-a bem do seu lado.
items.torch.place_protected=Você não pode fincá-la aí.
items.torch.place_ground=Ela precisa de chão firme e livre.
items.torch.place_occupied=Tem algo no caminho.
items.wetlands.seashell.name=concha
items.wetlands.seashell.desc=Uma concha de berbigão com estrias, de uma poça de maré, lisa e rosada por dentro. Um comerciante paga um pouco por uma bonita.
items.wetlands.pearl.name=pérola
items.wetlands.pearl.desc=Uma pérola pequena e perfeitamente redonda, das poças de maré. Qualquer comerciante paga bem por uma.
items.wetlands.witchsremedy.name=remédio da bruxa
items.wetlands.witchsremedy.ac_drink=BEBER
items.wetlands.witchsremedy.desc=Uma bebida verde e amarga da bruxa do pântano. Ela tira de você o que o brejo põe, veneno, gosma e parasitas, e fecha uma ferida que sangra.
items.wetlands.witchsremedy.cured=A bebida amarga desce queimando, e a doença sai de você.
items.wetlands.witchsremedy.nothing=A bebida amarga desce queimando. Você não sente diferença nenhuma.
items.wetlands.boglantern.name=lanterna do brejo
items.wetlands.boglantern.ac_light=DESTAMPAR
items.wetlands.boglantern.desc=Um pote de vidro com alça de arame, com um fogo-fátuo preso dentro. Destampado, o brilho verde e frio dele ilumina o escuro em volta de você e atravessa a névoa do pântano, que deixa de diminuir sua visão até a luz se apagar. Não esquenta ninguém.
items.wetlands.boglantern.lit=Você destampa a lanterna. Uma luz verde e fria se espalha à sua volta.
items.wetlands.wadingbalm.name=bálsamo de travessia
items.wetlands.wadingbalm.ac_rub=PASSAR
