items.dewvial.empty=Seu frasco de orvalho está vazio!
items.dewvial.full=Seu frasco de orvalho está cheio!
items.dewvial.collected=Você guardou uma gota de orvalho no seu frasco de orvalho.
items.dewvial.watered=A masmorra volta a brotar ao seu redor.
items.dewvial.refreshed=Você borrifa o orvalho no rosto.
items.dewvial.float=Você flutua no ar!
items.dewvial.blessed=Você sente o orvalho abençoando os itens da sua mochila.
items.dewvial.procced=Sua mochila brilha com uma luz purificadora, e uma energia maligna se dissipa.
items.dewvial.not_procced=Sua mochila brilha com uma luz purificadora, mas nenhuma maldição foi removida.
items.dewvial.looks_better=Com certeza %s parece melhor agora.
items.dewvial.select_item=Escolha um item para aprimorar com a bênção do orvalho
items.dewvial.desc=Um pequeno frasco de vidro que pode guardar orvalho mágico. O engenhoqueiro pode melhorá-lo com habilidades especiais.
items.dewvial2.name=frasco de orvalho aprimorado
items.dewvial2.ac_drink=BEBER
