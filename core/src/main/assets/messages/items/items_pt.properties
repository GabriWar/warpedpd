items.weapon.melee.chainsaw.ability_name=rasgar
items.weapon.melee.chainsaw.prompt=Escolha um inimigo para rasgar
items.weapon.melee.chainsaw.typical_ability_desc=A Duelista pode _rasgar_ um inimigo ao seu alcance, mantendo a serra dentro da ferida: três mordidas num só golpe que não erram, cada uma causando %1$d-%2$d de dano e abrindo um sangramento de %3$d. Esta habilidade usa 2 cargas.
items.weapon.melee.chainsaw.ability_desc=A Duelista pode _rasgar_ um inimigo ao seu alcance, mantendo a serra dentro da ferida: três mordidas num só golpe que não erram, cada uma causando _%1$d-%2$d de dano_ e abrindo um _sangramento de %3$d_. Esta habilidade usa 2 cargas.
items.weapon.melee.harp.ability_name=réquiem
items.weapon.melee.harp.typical_ability_desc=A Duelista pode tocar um _réquiem_: todo inimigo à vista sofre %1$d-%2$d de dano ressonante e fica lento por %3$d turnos, e todo aliado à vista, ela inclusive, recupera %4$d de vida. Esta habilidade usa 2 cargas.
items.weapon.melee.harp.ability_desc=A Duelista pode tocar um _réquiem_: todo inimigo à vista sofre _%1$d-%2$d de dano ressonante_ e fica _lento por %3$d turnos_, e todo aliado à vista, ela inclusive, _recupera %4$d de vida_. Esta habilidade usa 2 cargas.
items.weapon.melee.spade.ability_name=escavar
