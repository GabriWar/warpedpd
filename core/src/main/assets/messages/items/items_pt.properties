items.journalpages.sokoban1.name=folha de treino do sokoban
items.journalpages.sokoban1.found=Você encontrou uma folha do diário de Otiluke!
items.journalpages.sokoban1.desc=Uma folha solta de diário com o título Treino do Sokoban.\n\nCriei um método para gerar espaços extraplanares onde esconder meus pertences.\n\nCuriosamente, raças estranhas de ovelhas surgiram nesses espaços. Talvez eu possa usar esses habitantes ovinos a meu favor.\n\n-Otiluke, 1345 LP.
items.journalpages.sokoban2.name=folha do castelo sokoban
items.journalpages.sokoban2.found=Você encontrou uma folha do diário de Otiluke!
items.journalpages.sokoban2.desc=Uma folha solta de diário com o título Castelo Sokoban.\n\nAgora que dominei os elementos necessários para criar meus espaços, decidi construir uma grande fortaleza onde esconder meus objetos de valor.\n\n-Otiluke, 1348 LP.
items.journalpages.sokoban3.name=folha dos portais sokoban
items.journalpages.sokoban3.found=Você encontrou uma folha do diário de Otiluke!
items.journalpages.sokoban3.desc=Uma folha solta de diário com o título Portais Sokoban.\n\nMeus poderes ficaram mais fortes desde que criei meu primeiro espaço.\n\nConsigo alterar o tempo e a posição de maneiras que nunca imaginei possíveis.\n\nMinhas atividades criaram ondulações na etosfera mágica. Em dias claros, consigo captar ecos de alguma perturbação voltada para a minha presença.\n\n-Otiluke, 1355 LP.
items.journalpages.sokoban4.name=folha dos enigmas sokoban
items.journalpages.sokoban4.found=Você encontrou uma folha do diário de Otiluke!
items.journalpages.sokoban4.desc=Uma folha solta de diário com o título Enigmas Sokoban.\n\nMeus esforços para deter meus perseguidores só atrasaram o avanço deles.\n\nAgora estou me lembrando dos espaços estranhos onde escondi alguns dos meus objetos de valor, séculos atrás.\n\nOs itens em si já não têm importância para mim, mas a origem do estranho poder que gera as ovelhas me escapou por anos.\n\nTalvez esse poder, uma vez compreendido, seja uma fonte de socorro. Temo que me restem poucas opções.\n\n-Otiluke, 1617 LP.
items.journalpages.town.name=folha da Cidade
items.journalpages.town.found=Você encontrou uma folha do diário de Otiluke! Nela está escrito: Cidade.
items.journalpages.town.desc=Uma folha solta de diário com o título Cidade.\n\nCom o pouco poder que me resta, venci Zot por um momento e tomei dele o seu orbe de poder.\n\nEmbora o poder do orbe esteja protegido contra mim, consigo transpor objetos deste mundo para o coração do orbe.\n\nOuço uma rajada de poder ao longe... Zot se aproxima!\n\nMeu último ato será voltar à Cidade, onde nasci, e selar este escrito dentro do orbe.\n\nZot vai precisar quebrar o orbe, a fonte do seu poder, para me seguir.\n\n-Otiluke, 1999 LP.
items.journalpages.vault.name=folha do cofre
items.journalpages.vault.found=Você encontrou uma folha do diário de Otiluke!
items.journalpages.vault.desc=Uma folha solta de diário com o título Cofre.\n\nEste anel da fortuna é mesmo um exagero.\n\nPreciso de um lugar para largar meu ouro.\n\n-Otiluke, 656 LP.
