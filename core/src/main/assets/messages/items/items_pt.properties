items.scrolls.scroll.cursed=O livro de feitiços amaldiçoado impede que você invoque a magia deste pergaminho! Um pergaminho de remoção de maldição, porém, talvez seja forte o suficiente para funcionar...
items.scrolls.scroll$placeholder.name=pergaminho

items.scrolls.inventoryscroll.warning=Você deseja realmente cancelar o uso deste pergaminho? Ele não foi identificado anteriormente, então será consumido de qualquer forma.
items.scrolls.inventoryscroll.yes=Sim, eu tenho certeza
items.scrolls.inventoryscroll.no=Não, eu mudei de ideia

items.scrolls.scrollofidentify.name=pergaminho de identificação
items.scrolls.scrollofidentify.inv_title=Identificar um item
items.scrolls.scrollofidentify.it_is=Seu item foi identificado: %s.
items.scrolls.scrollofidentify.desc=Este pergaminho revela todos os segredos de um único item permanentemente.

items.scrolls.scrolloflullaby.name=pergaminho do acalento
items.scrolls.scrolloflullaby.sooth=O pergaminho emite uma melodia suave. Você se sente muito sonolento.
items.scrolls.scrolloflullaby.desc=A leitura deste pergaminho emite uma melodia suave que irá colocar todos os que a ouvirem num profundo sono mágico. Para o leitor e seus aliados, o sono é restaurador.

items.scrolls.scrollofmagicmapping.name=pergaminho de mapeamento mágico
items.scrolls.scrollofmagicmapping.layout=Você agora sabe o formato deste andar.
items.scrolls.scrollofmagicmapping.desc=Quando este pergaminho for lido, uma imagem de clareza cristalina será entalhada em sua memória, alertando você sobre a configuração precisa deste nível e revelando todos os seus segredos ocultos. A localização de itens e de criaturas permanecerão desconhecidos.

items.scrolls.scrollofmirrorimage.name=pergaminho da imagem espelhada
items.scrolls.scrollofmirrorimage.copies=O pergaminho forma imagens espelhadas de você.
items.scrolls.scrollofmirrorimage.no_copies=O pergaminho tenta criar imagens espelhadas de você, mas elas não têm para aonde ir.
items.scrolls.scrollofmirrorimage.desc=O encantamento neste pergaminho criará dois gêmeos ilusórios do leitor. Essas imagens espelhadas agem como clones mais fracos do leitor e perseguem seus inimigos. No entanto, eles não têm durabilidade e irão desaparecer ao sofrer dano.

items.scrolls.scrollofretribution.name=pergaminho da retribuição
items.scrolls.scrollofretribution.blast=Uma poderosa energia mágica irrompe do pergaminho!
items.scrolls.scrollofretribution.desc=Este pergaminho contém energia destrutiva que canaliza o sofrimento do leitor para o exterior numa explosão de poder. Quanto mais fraco o leitor estiver, mais danos ele irá causar. Com a saúde muito baixa, este pergaminho pode matar a maioria dos inimigos instantaneamente.\n\nNo entanto, o uso do pergaminho afeta o usuário, cegando-o e enfraquecendo-o.

items.scrolls.scrollofrage.name=pergaminho da fúria
items.scrolls.scrollofrage.roar=O pergaminho emite um rugido enfurecedor que ecoa pela masmorra!
items.scrolls.scrollofrage.desc=Ao ser lido em voz alta, este pergaminho irá liberar um grande rugido que atrairá a atenção de todos os inimigos para o leitor, e colocará em estado de cólera aqueles que estiverem próximos.

items.scrolls.scrollofrecharging.name=pergaminho da recarga
items.scrolls.scrollofrecharging.surge=Um surto de energia percorre seu corpo, revigorando suas varinhas!
items.scrolls.scrollofrecharging.desc=O poder mágico bruto ligado a este pergaminho irá, quando liberado, carregar todas as varinhas do usuário ao longo do tempo.

items.scrolls.scrollofremovecurse.name=pergaminho de remover maldição
items.scrolls.scrollofremovecurse.inv_title=Purifique um item
items.scrolls.scrollofremovecurse.cleansed=O seu item brilha com uma luz purificante e a energia maléfica dissipa-se!
items.scrolls.scrollofremovecurse.not_cleansed=O seu item brilha com uma luz purificadora, mas nada acontece.
items.scrolls.scrollofremovecurse.spirit=Seu pergaminho liberta o espírito atormentado!
items.scrolls.scrollofremovecurse.desc=O encantamento neste pergaminho removerá instantaneamente quaisquer maldições de uma arma, anel, varinha, armadura ou artefato.

items.scrolls.scrollofteleportation.name=pergaminho de teletransportação
items.scrolls.scrollofteleportation.tele=Em um piscar de olhos, você foi teletransportado para outro lugar no andar.
items.scrolls.scrollofteleportation.no_tele=A magia de teletransporte falhou.
items.scrolls.scrollofteleportation.cant_reach=Você não pode se teletransportar para lá.
items.scrolls.scrollofteleportation.prompt=Escolha uma localização para se teletransportar
items.scrolls.scrollofteleportation.desc=O feitiço deste pergaminho transporta instantaneamente o leitor para um local diferente no andar da masmorra. O pergaminho prioriza áreas para as quais o leitor não esteve antes, porém não é capaz de se teletransportar através de portas trancadas ou barricadas. Ele pode, no entanto, revelar portas escondidas que levam a novas áreas.

items.scrolls.scrollofterror.name=pergaminho do terror
items.scrolls.scrollofterror.none=O pergaminho emite uma brilhante luz vermelha.
items.scrolls.scrollofterror.one=O pergaminho emite uma brilhante luz vermelha e %s foge!
items.scrolls.scrollofterror.many=O pergaminho emite uma brilhante luz vermelha e os monstros fogem!
items.scrolls.scrollofterror.desc=Quando lido, este pergaminho emitirá um flash de luz vermelho que irá envolver todos os inimigos em seu campo de visão com terror, fazendo-os fugir. Atacar um inimigo em fuga encurtará o efeito.

items.scrolls.scrolloftransmutation.name=pergaminho de transmutação
items.scrolls.scrolloftransmutation.inv_title=Transmutar um item
items.scrolls.scrolloftransmutation.nothing=Nada de interessante acontece.
items.scrolls.scrolloftransmutation.morph=Seu item se transforma em algo diferente!
items.scrolls.scrolloftransmutation.desc=Este pergaminho contém uma poderosa magia de transmutação. Quando usado em um item elegível, irá transformá-lo em um item diferente do mesmo tipo. A magia preservará até mesmo  aprimoramentos, encantamentos e glifos. Pergaminhos e poções serão transmutados em suas variantes exóticas e vice-versa.

items.scrolls.scrollofupgrade.name=Pergaminho do Aprimoramento
items.scrolls.scrollofupgrade.inv_title=Aprimorar um item
items.scrolls.scrollofupgrade.weaken_curse=O pergaminho de aprimoramento enfraquece a maldição em seu item.
items.scrolls.scrollofupgrade.remove_curse=O pergaminho de aprimoramento purificou seu item da maldição!
items.scrolls.scrollofupgrade.desc=Este pergaminho aprimorará um único item ou um conjunto de armas de arremesso. Varinhas aumentarão em poder e número de cargas, armas e armaduras causarão e bloquearão mais dano, conjuntos de armas de arremesso serão completamente reparados e serão mais duráveis e os efeitos dos anéis se intensificarão.\n\nSeu encantamento pode até enfraquecer ou às vezes dissipar totalmente maldições, embora não seja tão potente quanto um pergaminho de remover maldição. A magia do pergaminho, de forma inoportuna, também pode interferir e apagar encantamentos de armas e glifos nas armaduras de níveis altos.



###exotic scrolls
items.scrolls.exotic.exoticscroll.kaunan=Pergaminho exótico KAUNAN
items.scrolls.exotic.exoticscroll.sowilo=Pergaminho exótico SOWILO
items.scrolls.exotic.exoticscroll.laguz=Pergaminho exótico LAGUZ
items.scrolls.exotic.exoticscroll.yngvi=Pergaminho exótico YNGVI
items.scrolls.exotic.exoticscroll.gyfu=Pergaminho exótico GYFU
items.scrolls.exotic.exoticscroll.raido=Pergaminho exótico RAIDO
items.scrolls.exotic.exoticscroll.isaz=Pergaminho exótico ISAZ
items.scrolls.exotic.exoticscroll.mannaz=Pergaminho exótico MANNAZ
items.scrolls.exotic.exoticscroll.naudiz=Pergaminho exótico NAUDIZ
items.scrolls.exotic.exoticscroll.berkanan=Pergaminho exótico BERKANAN
items.scrolls.exotic.exoticscroll.odal=Pergaminho exótico ODAL
items.scrolls.exotic.exoticscroll.tiwaz=Pergaminho exótico TIWAZ
items.scrolls.exotic.exoticscroll.unknown_desc=Uma brilhante runa mágica indecifrável está escrita neste pergaminho preto. Parece não ser desta terra, quem sabe o que vai fazer quando lido em voz alta?
items.scrolls.exotic.exoticscroll.discover_hint=Você pode fabricar este item através de alquimia.

items.scrolls.exotic.scrollofsirenssong.name=Pergaminho do canto da sereia
items.scrolls.exotic.scrollofsirenssong.prompt=Escolha um alvo
items.scrolls.exotic.scrollofsirenssong.no_target=O pergaminho é ativado sem um alvo.
items.scrolls.exotic.scrollofsirenssong.cancel=Você deve escolher um alvo.
items.scrolls.exotic.scrollofsirenssong.desc=A leitura deste pergaminho emitirá uma melodia sedutora que dominará o inimigo visado, transformando-o permanentemente em um aliado! Outros inimigos que ouvirem serão encantados temporariamente.\n\nInimigos particularmente fortes podem resistir ao efeito de dominação e, em vez disso, ficarão encantados.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=dominado
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=Esta criatura foi enfeitiçada pela magia do pergaminho do canto da sereia.\n\nUm personagem dominado é seu aliado permanentemente e irá lutar com qualquer inimigo que encontre.

items.scrolls.exotic.scrollofantimagic.name=pergaminho antimagia
items.scrolls.exotic.scrollofantimagic.desc=O encantamento deste pergaminho irá envolver você com uma aura mágica que te deixará temporariamente imune a todos os efeitos mágicos, sejam prejudiciais ou benéficos. Isso inclui a maioria dos efeitos de itens mágicos, como varinhas, pergaminhos, anéis, artefatos, encantamentos e maldições. Mesmo assim, as habilidades de armadura heroica ainda são fortes o suficiente para funcionar.

items.scrolls.exotic.scrollofchallenge.name=Pergaminho do desafio
items.scrolls.exotic.scrollofchallenge.desc=Quando lido em voz alta, este pergaminho desencadeará um grande rugido que atrairá os inimigos até o usuário, ao mesmo tempo em que cria uma pequena arena em volta dele.\n\nEnquanto o leitor permanecer nesta arena, irá receber 33% a menos de dano de qualquer fonte (isso é aplicado antes de outras formas de redução de dano) e não irá perder saciedade.\n\nO tamanho da arena será dimensionado com a área em que o leitor se encontra. Será particularmente pequena em algumas áreas de chefões.
items.scrolls.exotic.scrollofchallenge$challengearena.name=arena de desafio
items.scrolls.exotic.scrollofchallenge$challengearena.desc=Uma arena mágica apareceu ao seu redor, indicada pela névoa vermelha ondulante.\n\nEnquanto estando nesta névoa, sua fome não aumentará e você receberá 33%% a menos de dano de todas as fontes. Se você tiver qualquer fonte de redução de dano (como uma armadura), ela será aplicada após a redução de 33%%. \n\nTurnos restantes: %d.

items.scrolls.exotic.scrollofdivination.name=pergaminho da adivinhação
items.scrolls.exotic.scrollofdivination.nothing_left=Não há mais nada para identificar!
items.scrolls.exotic.scrollofdivination.desc=Este pergaminho identificará aleatoriamente quatro tipos de itens que você não conhece atualmente. Os tipos identificados podem ser a cor de uma poção, a runa de um pergaminho ou a gema de um anel.  Os itens identificados não serão necessariamente aqueles que você está carregando.
items.scrolls.exotic.scrollofdivination$wnddivination.desc=Seu pergaminho de adivinhação identificou os seguintes itens:

items.scrolls.exotic.scrollofdread.name=Pergaminho do pavor
items.scrolls.exotic.scrollofdread.desc=Quando lido, este pergaminho emitirá um flash de luz vermelho que introduzirá um incrível terror em todos os inimigos no seu campo de visão. Tão grande é esse efeito que eles tentarão fugir rapidamente da masmorra inteira, para nunca mais serem vistos!\n\nAssim como o terror, este efeito pode expirar com o tempo ou quando o inimigo for atacado.\n\nInimigos obstinados, como os chefões, porém, serão afligidos com terror normal.

items.scrolls.exotic.scrollofenchantment.name=pergaminho do encantamento
items.scrolls.exotic.scrollofenchantment.inv_title=Encante um item
items.scrolls.exotic.scrollofenchantment.weapon=Selecione um encantamento para aplicar em sua arma.
items.scrolls.exotic.scrollofenchantment.armor=Selecione um glifo para aplicar à sua armadura.
items.scrolls.exotic.scrollofenchantment.cancel=cancelar
items.scrolls.exotic.scrollofenchantment.cancel_warn=O cancelamento ainda consumirá seu pergaminho de encantamento, tem certeza?
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Sim, tenho certeza.
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=Não, mudei de ideia
items.scrolls.exotic.scrollofenchantment.desc=Este pergaminho infundirá uma arma ou armadura com poderosa energia mágica. O leitor ainda tem algum grau de controle sobre qual mágica será imbuída.

items.scrolls.exotic.scrollofforesight.name=pergaminho da vidência
items.scrolls.exotic.scrollofforesight.desc=Após ler este pergaminho, os detalhes de terrenos próximos serão constantemente alimentados à mente do leitor com clareza cristalina. Este efeito dura por uma quantidade considerável de tempo e revelará todas as portas e armadilhas escondidas, fazendo a procura desnecessária.

items.scrolls.exotic.scrollofmetamorphosis.name=pergaminho da metamorfose
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Escolha um talento para metamorfosear.
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Escolha um novo talento para repor o seu talento metamorfoseado.
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=O cancelamento ainda consumirá seu pergaminho da metamorfose, tem certeza?
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=talento de metamorfose
items.scrolls.exotic.scrollofmetamorphosis.desc=Este pergaminho contém uma magia poderosa de transmutação, que será aplicada ao conjurador ao invés de a um item. A magia deste pergaminho permitirá que você selecione um talento e o substitua por um dos cinco talentos de mesmo tier de diferente classes de herói!\n\nEste efeito somente pode ser aplicado a talentos de classe e não a talentos ganhos de subclasses ou habilidades de armadura. Talentos que você não pode usar não serão dados como opções.

items.scrolls.exotic.scrollofmysticalenergy.name=pergaminho da energia mística
items.scrolls.exotic.scrollofmysticalenergy.desc=O poder mágico bruto ligado a este pergaminho irá, quando liberado, carregar os artefatos equipados do usuário ao longo do tempo.

items.scrolls.exotic.scrollofpassage.name=pergaminho da passagem
items.scrolls.exotic.scrollofpassage.desc=O feitiço deste pergaminho transporta instantaneamente o leitor para o primeiro andar da região mais próxima acima dele. Muito útil para chegar rapidamente a uma loja.

items.scrolls.exotic.scrollofprismaticimage.name=pergaminho da imagem prismática
items.scrolls.exotic.scrollofprismaticimage.desc=O encantamento neste pergaminho criará um gêmeo ilusório colorido do leitor. Esta imagem prismática atua como um clone mais fraco do leitor, com defesa semelhante, mas menos PV e dano.\n\nA imagem prismática se mostrará quando os inimigos estiverem presentes e tentará defender o leitor.\n\nSe uma imagem prismática já existir, o uso desse pergaminho irá curar a imagem.

items.scrolls.exotic.scrollofpsionicblast.name=pergaminho da explosão psiônica
items.scrolls.exotic.scrollofpsionicblast.ondeath=A Explosão Psiônica explode sua mente...
items.scrolls.exotic.scrollofpsionicblast.desc=Este pergaminho contém incrível energia destrutiva que pode ser canalizada para destruir as mentes de todas as criaturas visíveis.\n\nNo entanto, a leitura deste poderoso feitiço tem uma taxa sobre quem o lança e o leitor também sofrerá dano, será cegado e enfraquecido. Quanto mais alvos o pergaminho acertar, menor será o dano ao leitor.



###spells
items.spells.alchemize.name=alquimizar
items.spells.alchemize.prompt=Alquimizar um item
items.spells.alchemize.desc=Este feitiço contém poderes transmutativos semelhantes aos encontrados em um pote de alquimia. Cada uso permite ao usuário transformar um item (ou pilha de itens) em ouro ou energia alquímica. Transformar poções ou pergaminhos em energia irá até mesmo identificá-los!\n\nAlguns Alquimizar são vendidos em lojas, mas muitos mais podem ser feitos usando alquimia combinando uma semente, uma pedra rúnica e um pouco de energia alquímica.
items.spells.alchemize$wndalchemizeitem.sell=Torne em %d moedas
items.spells.alchemize$wndalchemizeitem.sell_1=Torne 1 em %d moedas
items.spells.alchemize$wndalchemizeitem.sell_all=Torne tudo em %d moedas
items.spells.alchemize$wndalchemizeitem.energize=Torne em %d energias
items.spells.alchemize$wndalchemizeitem.energize_1=Torne 1 em %d energias
items.spells.alchemize$wndalchemizeitem.energize_all=Torne tudo em %d energias

items.spells.beaconofreturning.name=sinalizador de retorno
items.spells.beaconofreturning.preventing=A forte aura mágica deste lugar impede você de usar o feitiço!
items.spells.beaconofreturning.creatures=A aura psíquica das criaturas vizinhas não permite que você se teletransporte neste momento.
items.spells.beaconofreturning.set=O sinalizador foi definido em sua localização atual.
items.spells.beaconofreturning.wnd_body=A configuração substituirá o local em que o sinalizador foi definido anteriormente.\n\nRetornar retornará ao seu último local definido e consumirá um uso do feitiço.
items.spells.beaconofreturning.wnd_set=Definir
items.spells.beaconofreturning.wnd_return=Retorna
items.spells.beaconofreturning.desc_set=Este sinalizador foi definido em algum lugar no chão %d.
items.spells.beaconofreturning.desc=Esta magia intrincada concede ao usuário a capacidade de retornar a um local definido, independentemente da distância. O feitiço só será consumido ao retornar, então ele pode ser definido quantas vezes quiser, mas ele só se lembrará do local mais recente para o qual ele foi definido.

items.spells.curseinfusion.name=infusão de maldição
items.spells.curseinfusion.inv_title=Amaldiçoar um item
items.spells.curseinfusion.desc=Este feitiço infunde um equipamento com a mesma magia maligna poderosa presente no DM-300. O item em que é usado será imediatamente amaldiçoado e qualquer encantamento ou glifo que possa ter será sobreposto.\n\nNo caso de armas, armaduras e varinhas, além de ser amaldiçoado, o item será aprimorado. Aprimoramentos por infusão de maldição não se acumulam e serão perdidos se o item se tornar não-amaldiçoado.\n\nMúltiplas infusões de maldição também podem ser usadas para alterar a maldição de uma arma ou armadura.

items.spells.spell.ac_cast=LANÇAR
items.spells.spell.no_magic=Você não pode lançar feitiços enquanto está imune à magia.
items.spells.spell.discover_hint=Você pode fabricar este item através de alquimia.

items.spells.magicalinfusion.name=infusão mágica
items.spells.magicalinfusion.inv_title=Infundir um item
items.spells.magicalinfusion.infuse=Seu item é infundido com energia arcana!
items.spells.magicalinfusion.desc=Este feitiço possui o mesmo poder mágico de um pergaminho de aprimoramento, mas em uma forma mais estável.\n\nAlém de aprimorar um item normalmente, nunca apagará um encantamento, glifo ou maldição.

items.spells.magicalporter.name=transportador mágico
items.spells.magicalporter.inv_title=Transportar um item
items.spells.magicalporter.nowhere=Não há nenhum lugar para que você possa transportar um item.
items.spells.magicalporter.desc=Este feitiço irá magicamente transportar qualquer item em que for lançado. Ao contrário do transmissor de um comerciante, no entanto, os itens serão transportados para a entrada do próximo andar de chefão.

items.spells.phaseshift.name=mudança de fase
items.spells.phaseshift.no_target=Não há nada para teleportar aqui.
items.spells.phaseshift.desc=Este feitiço caótico irá teleportar qualquer personagem para um local aleatório no andar atual e atordoá-lo por um período significativo de tempo. Inimigos poderosos serão capazes de resistir ao efeito atordoante. Este feitiço pode ser direcionado a um alvo ou ao próprio usuário.

items.spells.reclaimtrap.name=armazenar armadilha
items.spells.reclaimtrap.no_trap=Não há armadilha lá.
items.spells.reclaimtrap.desc_trap=O feitiço está atualmente pronto para ativar uma _%s._
items.spells.reclaimtrap.desc=Esta magia contém resquícios da energia mecânica do DM-300. Quando lançado em uma armadilha ativa, o poder da armadilha será preso a você, permitindo que você use o feitiço de novo para expelir esse poder e ativar o efeito da armadilha em qualquer lugar que queira.\n\nNo entanto, algumas armadilhas podem não funcionar em todos os lugares, e apenas uma armadilha por vez pode ser armazenada.

items.spells.recycle.name=reciclar
items.spells.recycle.inv_title=Reciclar um item
items.spells.recycle.recycled=Seu item foi reciclado para: %s.
items.spells.recycle.desc=Este feitiço possui uma forma inferior de magia de transmutação. Embora não funcione em equipamentos, este feitiço irá transformar pergaminhos, poções, sementes, pedras rúnicas ou dardos embebidos em um item aleatório do mesmo tipo.

items.spells.summonelemental.name=invocar elemental
items.spells.summonelemental.ac_imbue=IMBUIR
items.spells.summonelemental.imbue_prompt=Imbuir um item
items.spells.summonelemental.desc=Este feitiço canaliza a energia das brasas elementais e permite que você invoque um elemental para lutar ao seu lado! Apenas um elemental pode ser invocado por vez, mas o feitiço pode ser relançado, retornando o elemental para você sem nenhum custo.
items.spells.summonelemental.desc_newborn=Este feitiço não está atualmente imbuído e irá invocar um _elemental recém-invocado_ sem habilidade de ataque a distância. Você pode imbuir uma poção identificada de chama líquida, poção gélida, pergaminho de recarga ou pergaminho de transmutação para aumentar o poder do feitiço, fazendo com que futuras invocações sejam um elemental de poder total!
items.spells.summonelemental.desc_fire=O feitiço está quente ao toque, irá invocar um _elemental de fogo_. Você pode imbuir um item diferente, mas o feitiço perderá seu elemento atual.
items.spells.summonelemental.desc_frost=O feitiço está gelado ao toque, irá invocar um _elemental de gelo_. Você pode imbuir um item diferente, mas o feitiço perderá seu elemento atual.
items.spells.summonelemental.desc_shock=O feitiço está irradiando energia estática, irá invocar um _elemental elétrico_. Você pode imbuir um item diferente, mas o feitiço perderá seu elemento atual.
items.spells.summonelemental.desc_chaos=O feitiço está irradiando energia caótica, irá invocar um _elemental caótico_. Você pode imbuir um item diferente, mas o feitiço perderá seu elemento atual.

items.spells.targetedspell.prompt=Escolha um alvo
items.spells.targetedspell.inv_title=Infundir um item

items.spells.telekineticgrab.name=pegar telecinético
items.spells.telekineticgrab.cant_grab=Você não pode pegar isso.
items.spells.telekineticgrab.no_target=Não há nada para pegar aqui.
items.spells.telekineticgrab.desc=Este feitiço permite que o conjurador pegue remotamente todos os itens em um local ou todas as armas lançadas presas a um inimigo!\n\nNão pode ser usado para pegar itens que pertencem a outros ou para pegar recipientes como baús.

items.spells.unstablespell.name=feitiço instável
items.spells.unstablespell.desc=Este pequeno cristal quadrado preto possui símbolos rúnicos em constante mudança em cada uma de suas superfícies.\n\nQuando ativado, irá desencadear o efeito de um pergaminho aleatório. O efeito do pergaminho sempre será focado em combate se houver inimigos no seu campo de visão e, do contrário, sempre será focado em efeitos de não-combate.

items.spells.wildenergy.name=energia selvagem
items.spells.wildenergy.desc=Este feitiço contém uma porção da energia amaldiçoada que alimentava o DM-300. Quando lançado, ele recarregará suas varinhas e artefatos usados, ao mesmo tempo em que acionará um efeito de varinha amaldiçoada aleatório. No entanto, você pode escolher a direção para onde atirar esta magia amaldiçoada.


###runestones
items.stones.inventorystone.ac_use=USAR

items.stones.runestone$placeholder.name=pedra rúnica
items.stones.runestone.discover_hint=Você pode encontrar este item aleatoriamente na masmorra ou criá-lo por meio de alquimia.

items.stones.stoneofaggression.name=pedra da agressão
items.stones.stoneofaggression.desc=Quando esta pedra é jogada em um aliado ou inimigo, todos os inimigos próximos preferirão atacar esse personagem por um curto período.\n\nNo entanto, chefões não podem ser afetados por esse efeito diretamente, mas ele funciona nos seus lacaios
items.stones.stoneofaggression$aggression.name=Alvo
items.stones.stoneofaggression$aggression.desc=A magia manipuladora está fazendo com que todos os inimigos próximos prefiram atacar este personagem.\n\nTurnos restantes: %s.

items.stones.stoneofaugmentation.name=pedra de alteração
items.stones.stoneofaugmentation.inv_title=Alterar um item
items.stones.stoneofaugmentation.desc=Esta pedra rúnica possui magia potente que pode alterar o equipamento para melhorar uma propriedade à custa de outra.\n\nUsar em uma arma permitirá aumentar a velocidade ou o dano. Armas de arremesso também ganharão ou perderão durabilidade em proporção a sua velocidade.\n\nUsar em uma armadura permitirá que você aprimore a defesa ou a evasão.
items.stones.stoneofaugmentation.discover_hint=Você pode comprar este item em uma loja ou criá-lo por meio de alquimia.
items.stones.stoneofaugmentation$wndaugment.choice=Aumentar uma propriedade reduzirá a outra. Qual propriedade você gostaria de aumentar?
items.stones.stoneofaugmentation$wndaugment.already=Este item já teve uma propriedade aumentada, você pode trocar o aumento ou removê-lo.
items.stones.stoneofaugmentation$wndaugment.speed=+Velocidade -Dano
items.stones.stoneofaugmentation$wndaugment.damage=+Dano -Velocidade
items.stones.stoneofaugmentation$wndaugment.evasion=+Evasão -Defesa
items.stones.stoneofaugmentation$wndaugment.defense=+Defesa -Evasão
items.stones.stoneofaugmentation$wndaugment.none=Remover alteração
items.stones.stoneofaugmentation$wndaugment.cancel=Deixa pra lá

items.stones.stoneofblast.name=pedra de explosão
items.stones.stoneofblast.desc=Esta pedra rúnica explodirá instantaneamente no local para onde for lançada. Assim como uma bomba, a explosão causará dano a qualquer coisa próxima.

items.stones.stoneofblink.name=pedra de teletransporte
items.stones.stoneofblink.desc=Esta pedra rúnica irá teletransportar o usuário para o local onde for lançada.

items.stones.stoneofclairvoyance.name=pedra da clarividência
items.stones.stoneofclairvoyance.desc=Esta pedra revelará instantaneamente todos os quadrados em uma área muito extensa em torno de onde for jogada. Seu efeito alcançará até mesmo através das paredes.

items.stones.stoneofdeepsleep.name=pedra do sono profundo
items.stones.stoneofdeepsleep.desc=Quando esta pedra for atirada em um inimigo, irá colocá-lo em um sono mágico profundo. Inimigos dormindo magicamente dormirão para sempre até que sejam perturbados.

items.stones.stoneofdetectmagic.name=pedra de detecção mágica
items.stones.stoneofdetectmagic.inv_title=Detectar um item
items.stones.stoneofdetectmagic.detected_none=Você não detecta nenhuma magia afetando este item.
items.stones.stoneofdetectmagic.detected_both=Você detecta magia benéfica e maléfica afetando este item!
items.stones.stoneofdetectmagic.detected_good=Você detecta magia benéfica afetando este item!
items.stones.stoneofdetectmagic.detected_bad=Você detecta magia maléfica afetando este item!
items.stones.stoneofdetectmagic.desc=Esta pedra rúnica é capaz de detectar magia afetando um item. Usar esta pedra em um item não identificado dirá se ele é afetado por uma maldição maléfica e se ele é afetado por magia benéfica, como um encantamento ou melhorias.

items.stones.stoneofdisarming.name=pedra de desarmar
items.stones.stoneofdisarming.desc=Esta pedra rúnica contém magia que pode desabilitar armadilhas maliciosas escondidas em toda a masmorra. Desarmará até 9 armadilhas ao redor da área em que for lançada.

items.stones.stoneofenchantment.name=pedra de encantamento
items.stones.stoneofenchantment.inv_title=Encante um item
items.stones.stoneofenchantment.weapon=Sua arma brilha na escuridão!
items.stones.stoneofenchantment.armor=Sua armadura brilha na escuridão!
items.stones.stoneofenchantment.desc=Esta pedra rúnica contém poder de encantamento. Ao contrário de um pergaminho de aprimoramento, não aumentará o poder direto de um item, em vez disso, imbuirá uma arma ou armadura com um encantamento, concedendo-lhes um novo poder.

items.stones.stoneoffear.name=pedra do medo
items.stones.stoneoffear.desc=Quando esta pedra for atirada em um personagem, irá envolvê-lo com um terror avassalador, fazendo-o fugir de você. Atacar um inimigo em fuga irá encurtar o efeito.

items.stones.stoneofflock.name=pedra do rebanho
items.stones.stoneofflock.desc=Esta pedra rúnica invoca ovelhas mágicas por um curto período de tempo em torno do local onde é lançada.

items.stones.stoneofintuition.name=pedra de intuição
items.stones.stoneofintuition.inv_title=Selecione um item
items.stones.stoneofintuition.desc=Esta pedra rúnica contém uma versão mais fraca da magia encontrada em pergaminhos da identificação. Ao invés de identificar um item diretamente, ela irá trabalhar usando sua intuição, permitindo que você tente identificar o tipo de um pergaminho, anel ou poção através da adivinhação.
items.stones.stoneofintuition.break_info=Você pode usar pedras de intuição duas vezes antes que elas quebrem. _Seu próximo uso não consumirá a pedra_.
items.stones.stoneofintuition.break_warn=Você já usou a pedra de intuição anteriormente, então _seu próximo uso irá consumi-la_.
items.stones.stoneofintuition$wndguess.text=Adivinhe que tipo o item não identificado é. Se você acertar corretamente, ele será identificado!
items.stones.stoneofintuition$wndguess.correct=Correto. O tipo de item foi identificado!
items.stones.stoneofintuition$wndguess.incorrect=Seu palpite está incorreto.
items.stones.stoneofintuition$wndguess.break=Sua pedra de intuição se desintegra e vira pó...

items.stones.stoneofshock.name=pedra de choque
items.stones.stoneofshock.desc=Esta pedra rúnica desencadeia uma explosão de energia elétrica que atordoa brevemente todos os alvos próximos e concede carga às varinhas do lançador para cada alvo atingido.


###trinkets
items.trinkets.chaoticcenser.name=incensário caótico
items.trinkets.chaoticcenser.spew=Seu incensário está prestes a liberar: %s.
items.trinkets.chaoticcenser.desc=Depois de algum tempo no pote de alquimia, este incensário parece estar produzindo fumaça sozinho! Os gases se acumulam e serão expelidos do incensário em direção aos inimigos em intervalos semi-aleatórios. Parece capaz de produzir todos os tipos de gases, mas você receberá um momento de aviso antes de o incensário ser ativado.
items.trinkets.chaoticcenser.typical_stats_desc=Normalmente, este acessório gerará um gás nocivo próximo a um inimigo a cada _%d_ turnos. O gás apenas aparece quando inimigos estão presentes. Em níveis mais altos, os gases têm mais probabilidade de serem exóticos e poderosos.
items.trinkets.chaoticcenser.stats_desc=No nível atual, este acessório gerará um gás nocivo próximo a um inimigo a cada _%d_ turnos. O gás apenas aparece quando inimigos estão presentes. Em níveis mais altos, os gases têm mais probabilidade de serem exóticos e poderosos.

items.trinkets.crackedspyglass.name=luneta trincada
items.trinkets.crackedspyglass.desc=Este telescópio de mão seria a demonstração de um formidável e preciso trabalho artesanal, não fosse sua lente frontal trincada. A luneta parece estar ajudando você, revelando novos itens na masmorra, mas devido à sua falha, os itens revelados são bastante difíceis de enxergar!
items.trinkets.crackedspyglass.typical_stats_desc=Normalmente, este acessório tem uma _chance de %1$s%%_ de criar um item oculto extra em cada andar que não seja de chefe.
items.trinkets.crackedspyglass.stats_desc=No nível atual, este acessório tem uma _chance de %1$s%%_ de criar um item oculto extra em cada andar que não seja de chefe.
items.trinkets.crackedspyglass.stats_desc_upgraded=No nível atual, este acessório tem _100%%_ de chance de criar um item oculto extra em cada andar que não seja de chefe, e _%1$s%% de chance_ de criar um segundo item oculto extra.

items.trinkets.dimensionalsundial.name=relógio de sol dimensional
items.trinkets.dimensionalsundial.warning=Seu relógio de sol não está projetando sombra, você se sente apreensivo.
items.trinkets.dimensionalsundial.desc=Este pequeno relógio de sol de mão é de alguma forma capaz de projetar uma sombra nas profundezas da masmorra, mesmo se você não o estiver segurando na posição vertical.  Ainda mais estranho é que a posição da sombra parece não ter relação com o sol deste mundo. Quando nenhuma sombra é projetada, o relógio de sol parece atrair o perigo.
items.trinkets.dimensionalsundial.typical_stats_desc=Normalmente, este acessório reduzirá a taxa de geração de inimigos em _%1$d%%_ durante o dia na vida real (8h-20h) e aumentará a taxa de geração de inimigos em _%2$d%%_ durante a noite (20h-8h).
items.trinkets.dimensionalsundial.stats_desc=No nível atual, este acessório reduzirá a taxa de geração de inimigos em _%1$d%%_ durante o dia na vida real (8h-20h) e aumentará a taxa de geração de inimigos em _%2$d%%_ durante a noite (20h-8h).

items.trinkets.exoticcrystals.name=cristais exóticos
items.trinkets.exoticcrystals.desc=Estes pequenos cristais rosa têm o mesmo formato dos cristais de energia alquímica. Embora eles não possam ser usados diretamente para obter energia, eles parecem estar influenciando de alguma forma as poções e pergaminhos que você encontra.
items.trinkets.exoticcrystals.typical_stats_desc=Normalmente, este acessório substituirá _%s%%_ das poções ou dos pergaminhos dropados por seus equivalentes exóticos. Este efeito não afeta poções de força, pergaminhos de aprimoramento ou itens que são gerados para ajudar a resolver salas puzzles.
items.trinkets.exoticcrystals.stats_desc=No nível atual, este acessório substituirá _%s%%_ das poções ou dos pergaminhos dropados por seus equivalentes exóticos. Este efeito não afeta poções de força, pergaminhos de aprimoramento ou itens que são gerados para ajudar a resolver salas puzzles.

items.trinkets.eyeofnewt.name=Olho de salamandra
items.trinkets.eyeofnewt.desc=Este olho de salamandra dourado e preto é um ingrediente comum, agora transformado em um acessório. O olho parece estar reduzindo a sua visão em troca de permitir que você veja as coisas de outras maneiras.
items.trinkets.eyeofnewt.typical_stats_desc=Normalmente, este acessório reduzirá seu alcance de visão em _%1$s%%_, mas também lhe concederá visão mental de inimigos dentro de _%2$d_ quadrados.
items.trinkets.eyeofnewt.stats_desc=No nível atual, este acessório reduzirá seu alcance de visão em _%1$s%%_, mas também lhe concederá visão mental de inimigos dentro de _%2$d_ quadrados.

items.trinkets.ferrettuft.name=tufo de furão
items.trinkets.ferrettuft.desc=Um tufo de pelo branco e sedoso de furão, preso por uma fita verde-limão amarrada em um laço. Os furões são conhecidos por sua agilidade, travessura e falta de integridade. Parte desse poder parece irradiar do acessório, aumentando a capacidade de evasão de qualquer coisa por perto.
items.trinkets.ferrettuft.typical_stats_desc=Normalmente, este acessório aumentará a evasão de todos os personagens em _%1$s%%_.
items.trinkets.ferrettuft.stats_desc=No seu nível atual, este acessório aumentará a evasão de todos os personagens em _%1$s%%_.

items.trinkets.mimictooth.name=dente de mímico
items.trinkets.mimictooth.desc=Este grande dente afiado deve ter sido arrancado de um mímico muito infeliz. Parece estar influenciando os mímicos da masmorra, tornando-os mais frequentes e perigosos.
items.trinkets.mimictooth.typical_stats_desc=Normalmente, este acessório tornará todos os tipos de mímicos _%1$sx_ mais comuns e muito mais difíceis de detectar, mas também aumentará a quantidade de itens que eles dropam. Cada andar de masmorra também terá uma chance de _%2$s%%_ conter um mímico de ébano furtivo extra.
items.trinkets.mimictooth.stats_desc=No nível atual, este acessório tornará todos os tipos de mímicos _%1$sx_ mais comuns e muito mais difíceis de detectar, mas também aumentará a quantidade de itens que eles dropam. Cada andar de masmorra também terá uma chance de _%2$s%%_ de conter um mímico de ébano furtivo extra.

items.trinkets.mossyclump.name=moita de musgo
items.trinkets.mossyclump.desc=Este aglomerado de musgo úmido parece reter sua umidade, não importa o quão forte você o aperte. Parece estar magicamente ligado à própria masmorra, tornando mais provável o aparecimento de grama e água.
items.trinkets.mossyclump.typical_stats_desc=Normalmente, este acessório fará com que _%d%%_ dos andares comuns fiquem cheios de água ou grama.\n\nEste acessório custa uma quantidade grande de energia para aprimorar.
items.trinkets.mossyclump.stats_desc=No nível atual, este acessório fará com que _%d%%_ dos andares comuns fiquem cheios de água ou grama.\n\nEste acessório custa uma quantidade grande de energia para aprimorar.

items.trinkets.parchmentscrap.name=pedaço de papiro
items.trinkets.parchmentscrap.desc=Este pequeno pedaço de papiro parece ter saído de um pergaminho.  Ele manteve um pouco de sua magia e parece estar influenciando as armas e armaduras encontradas na masmorra.
items.trinkets.parchmentscrap.typical_stats_desc=Normalmente, este acessório tornará encantamentos e glifos _%dx_ mais comuns e maldições em armas e armaduras _%sx_ mais comuns. Maldições em varinhas, anéis ou artefatos não são afetados.\n\nEste acessório custa uma quantidade grande de energia para aprimorar.
items.trinkets.parchmentscrap.stats_desc=No nível atual, este acessório tornará encantamentos e glifos _%dx_ mais comuns, e maldições em armas e armaduras _%sx_ mais comuns. Maldições em varinhas, anéis ou artefatos não são afetados.\n\nEste acessório custa uma quantidade grande de energia para aprimorar.

items.trinkets.petrifiedseed.name=semente petrificada
items.trinkets.petrifiedseed.desc=Esta semente foi fossilizada, seja por processos geológicos lentos ou seja por magia. A semente parece estar influenciando magicamente a flora da masmorra, ocasionalmente substituindo sementes de plantas por pedras rúnicas.
items.trinkets.petrifiedseed.typical_stats_desc=Normalmente, este acessório fará com que a grama pisoteada drope runas em vez de sementes _%1$s%%_ das vezes, e também fará com que a grama alta drope itens com _%2$s%%_ mais frequência.
items.trinkets.petrifiedseed.stats_desc=No nível atual, este acessório fará com que a grama pisoteada drope runas em vez de sementes _%1$s%%_ das vezes, e também fará com que a grama alta drope itens com _%2$s%%_ mais frequência.

items.trinkets.ratskull.name=crânio de rato
items.trinkets.ratskull.desc=Este acessório macabro não é muito maior que o crânio de um rato normal, o que é de alguma forma uma raridade nesta masmorra. A influência mágica da caveira parece atrair os habitantes mais raros da masmorra, fazendo-os aparecer com muito mais frequência.
items.trinkets.ratskull.typical_stats_desc=Normalmente, este acessório fará com que inimigos exóticos raros tenham _%dx_ mais probabilidade de aparecer. No entanto, o crânio tem apenas metade da eficácia em atrair mímicos de cristal e estátuas encouraçadas.
items.trinkets.ratskull.stats_desc=No nível atual, este acessório fará com que inimigos exóticos raros tenham _%dx_ mais probabilidade de aparecer. No entanto, o crânio tem apenas metade da eficácia em atrair mímicos de cristal e estátuas encouraçadas.

items.trinkets.saltcube.name=cubo de sal
items.trinkets.saltcube.desc=Este grande cristal de sal foi cortado em um formato de cubo quase perfeito, e de alguma forma conseguiu drenar metade da água do pote de alquimia em vez de dissolver. Parece estar magicamente desidratando e preservando a comida que você come, estendendo a saciedade que você obtém, mas também diminuindo sua regeneração de vida quando não está morrendo de fome.
items.trinkets.saltcube.typical_stats_desc=Normalmente, este acessório aumentará o tempo até que fique com fome em _%1$s%%_, mas também reduzirá sua taxa de regeneração de vida em _%2$s%%_, a não ser que o andar esteja trancado.
items.trinkets.saltcube.stats_desc=No nível atual, este acessório aumentará o tempo até que fique com fome em _%1$s%%_, mas também reduzirá sua taxa de regeneração de vida em _%2$s%%_, a não ser que o andar esteja trancado.

items.trinkets.shardofoblivion.name=fragmento do esquecimento
items.trinkets.shardofoblivion.desc=Depois de cozinhar no pote de alquimia, este pequeno fragmento de metal amaldiçoado mudou para ser feito de... nada? A luz parece se curvar ao redor dele, e ele flutua estático no lugar quando você não o está segurando. O fragmento parece estar magicamente extraindo poder da sua ignorância, então provavelmente é melhor não pensar muito sobre isso.
items.trinkets.shardofoblivion.typical_stats_desc=Normalmente, este acessório aumentará a taxa que os inimigos dropam loot em 20%% para cada equipamento não identificado que você equipou ou usou recentemente, até um máximo de _%d item(ns)_. O fragmento também impedirá que você identifique equipamentos, mas pode ser usado para identificar manualmente os itens que estão prontos para isso.
items.trinkets.shardofoblivion.stats_desc=No nível atual, este acessório aumentará a taxa que os inimigos dropam loot em 20%% para cada equipamento não identificado que você equipou ou usou recentemente, até um máximo de _%d item(ns)_. O fragmento também impedirá que você identifique equipamentos, mas pode ser usado para identificar manualmente os itens que estão prontos para isso.
items.trinkets.shardofoblivion.ac_identify=IDENTIFICAR
items.trinkets.shardofoblivion.identify_prompt=Identificar um item
items.trinkets.shardofoblivion.identify_ready=Um item está pronto para ser identificado: %s. Use seu Fragmento do Esquecimento para identificá-lo.
items.trinkets.shardofoblivion.identify_ready_worn=Seus itens equipados estão prontos para serem identificados, use seu Fragmento do Esquecimento neles para identificá-los.
items.trinkets.shardofoblivion.identify_not_yet=Este item ainda não está pronto para ser identificado.
items.trinkets.shardofoblivion.identify=Você identifica o item!
items.trinkets.shardofoblivion$wandusetracker.name=Varinha não identificada utilizada
items.trinkets.shardofoblivion$wandusetracker.desc=Você usou recentemente uma varinha não identificada, que por um período de tempo conta como uma peça de equipamento não identificada usada para o fragmento do esquecimento.\n\nTurnos restantes: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=Arma de arremesso não identificada usada
items.trinkets.shardofoblivion$thrownusetracker.desc=Você usou recentemente uma arma de arremesso não identificada, que conta, por um tempo, como uma peça de equipamento não identificado usada para o Fragmento do Esquecimento.\n\nTurnos restantes: %s.

items.trinkets.thirteenleafclover.name=Trevo de treze folhas
items.trinkets.thirteenleafclover.desc=De alguma forma, cozinhar no pote de alquimia fez com que este trevo crescesse um monte de folhas extras!  Não está muito claro se este acessório dá sorte ou azar, talvez torne sua sorte mais caótica?
items.trinkets.thirteenleafclover.typical_stats_desc=Normalmente, este acessório fará com que você cause dano máximo _%1$d%%_ do tempo e dano mínimo _%2$d%%_ do tempo.
items.trinkets.thirteenleafclover.stats_desc=No nível atual, este acessório fará com que você cause dano máximo _%1$d%%_ do tempo e dano mínimo _%2$d%%_ do tempo.

items.trinkets.trapmechanism.name=mecanismo de armadilha
items.trinkets.trapmechanism.desc=O mecanismo central de uma das armadilhas de queda da masmorra, cuidadosamente escavado do chão para que possa ser carregado. Parece estar magicamente ligado à própria masmorra, tornando os terrenos perigosos mais comuns, mas também aumentando a sua afinidade com eles.
items.trinkets.trapmechanism.typical_stats_desc=Normalmente, este acessório fará com que _%1$d%%_ dos andares comuns fiquem cheios de armadilhas ou abismos. Além disso, _%2$d%%_ das armadilhas escondidas da masmorra estarão visíveis.
items.trinkets.trapmechanism.stats_desc=No nível atual, este acessório fará com que _%1$d%%_ dos andares comuns fiquem cheios de armadilhas ou abismos. Além disso, _%2$d%%_ das armadilhas escondidas da masmorra estarão visíveis.

items.trinkets.vialofblood.name=frasco de sangue
items.trinkets.vialofblood.desc=Este frasco fino contém o sangue de algum habitante da masmorra, ele se move lentamente conforme você gira o frasco. Parece estar magicamente aumentando efeitos de cura mais fortes, mas também os retardando.
items.trinkets.vialofblood.typical_stats_desc=Normalmente, este acessório aumentará a vida geral que você ganha ao beber poções de cura, odres de água ou de poços de saúde em _%1$s%%_. No entanto, esses efeitos de cura também ocorrerão mais lentamente, regenerando um máximo de _%2$s_ PV por turno (aumentando de acordo com o nível do herói).
items.trinkets.vialofblood.stats_desc=No nível atual, este acessório aumentará a saúde geral que você ganha ao beber poções de cura, odres de água ou poços de saúde em _%1$s%%_. No entanto, esses efeitos de cura também ocorrerão mais lentamente, regenerando um máximo de _%2$s_ PV por turno (a quantidade aumenta com o nível do herói).

items.trinkets.wondrousresin.name=resina maravilhosa
items.trinkets.wondrousresin.desc=Esta resina azul cintilante parece ter a essência destilada da magia de uma varinha amaldiçoada. A magia do pote de alquimia parece ter estabilizado essa essência e ela agora está afetando suas varinhas.
items.trinkets.wondrousresin.typical_stats_desc=Normalmente, este acessório forçará os efeitos de varinha amaldiçoada a se tornarem neutros ou positivos _%1$s%%_ do tempo, e fará com que as varinhas não amaldiçoadas façam um disparo amaldiçoado neutro ou positivo adicional _%2$s%%_ do tempo.\n\nEste acessório custa uma quantidade grande de energia para aprimorar.
items.trinkets.wondrousresin.stats_desc=No nível atual, este acessório forçará os efeitos de varinha amaldiçoada a se tornarem neutros ou positivos _%1$s%%_ do tempo, e fará com que as varinhas não amaldiçoadas façam um disparo amaldiçoado neutro ou positivo adicional _%2$s%%_ do tempo.\n\nEste acessório custa uma quantidade grande de energia para aprimorar.

items.trinkets.trinketcatalyst.name=catalisador mágico
items.trinkets.trinketcatalyst.window_title=criar acessório
items.trinkets.trinketcatalyst.window_text=A água começa a brilhar conforme você adiciona o catalisador.  Existem alguns itens próximos que você pode imbuir com energia para transformá-los em um acessório mágico.
items.trinkets.trinketcatalyst.desc=Esta bola de pó dourado mágico brilha na escuridão da masmorra.  Este catalisador pode ser usado em um pote de alquimia com um pouco de energia alquímica para produzir um acessório único.\n\nOs acessórios fornecem vários efeitos diferentes que alteram ligeiramente a masmorra ou seus habitantes. Os acessórios podem ser aprimorados com mais energia para tornar seus efeitos mais poderosos ou descartados para renunciar totalmente ao efeito.
items.trinkets.trinketcatalyst$randomtrinket.name=Acessório aleatório
items.trinkets.trinketcatalyst$randomtrinket.desc=Um item próximo está preso dentro de uma bolsa que você não consegue abrir.\n\nO processo de alquimia dissolverá a bolsa, mas você não saberá qual acessório receberá até fazê-lo!

items.trinkets.trinket.discover_hint=Este item tem a chance de ser uma opção sempre que você criar um acessório por meio de alquimia.
items.trinkets.trinket$placeholder.name=acessório

