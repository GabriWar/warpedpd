items.potions.exotic.potionofcontrol.name=poção do controle
items.potions.exotic.potionofcontrol.desc=Destampar este líquido escuro libera um miasma de vapores que distorcem a mente e corrompem a vontade de todos os inimigos do andar, colocando-os do seu lado.
items.potions.exotic.potionofcontrol.mobs_effected=%d inimigos ficam sob seu controle!
items.potions.exotic.potionofcontrol.no_targets=Nenhum inimigo para corromper.
items.potions.exotic.potionofdeath.name=poção da morte
items.potions.exotic.potionofdeath.desc=Este frasco negro guarda a essência do esquecimento. Destampá-lo libera uma onda de energia necrótica que destrói na hora todos os inimigos visíveis que não sejam chefes.
items.potions.exotic.potionofdeath.mobs_effected=%d inimigos são mortos pela onda da morte!
items.potions.exotic.potionofdeath.no_targets=A onda da morte varre o andar, mas não há inimigos.
items.potions.exotic.potionofflower.name=poção da flor
items.potions.exotic.potionofflower.desc=Este composto verdejante solta sementes de plantas mágicas quando arremessado, ativando efeitos de plantas aleatórias em todos os inimigos visíveis.
items.potions.exotic.potionofflower.mobs_effected=%d inimigos são presos pela flora mágica!
items.potions.exotic.potionofflower.no_targets=Nenhum inimigo visível para as plantas afetarem.
items.potions.exotic.potionofgloop.name=poção da meleca
items.potions.exotic.potionofgloop.desc=Esta gosma negra e viscosa cobre todos os inimigos do andar com um lodo cáustico que corrói armadura e pele.
items.potions.exotic.potionofgloop.mobs_effected=%d inimigos são cobertos de muco cáustico!
items.potions.exotic.potionofgloop.no_targets=Nenhum inimigo para cobrir.
items.potions.exotic.potionofhail.name=poção do granizo
items.potions.exotic.potionofhail.desc=Esta mistura ártica explode em uma chuva de estilhaços de gelo quando arremessada, castigando todos os inimigos visíveis com vários golpes de frio congelante.
items.potions.exotic.potionofhail.mobs_effected=%d inimigos são atingidos pelo granizo!
items.potions.exotic.potionofhail.no_targets=O granizo cai, mas não há alvos.
items.potions.exotic.potionofhellstorm.name=poção da tempestade infernal
items.potions.exotic.potionofhellstorm.desc=Quebrar este frasco espalha um incêndio de fogo infernal sobrenatural, que queima muito mais quente e por mais tempo que uma chama comum.
items.potions.exotic.potionofhighgrass.name=poção da grama alta
items.potions.exotic.potionofhighgrass.desc=Derramar esta poção de crescimento transforma grama e solo comuns em grama alta e selvagem, que dá cobertura e esconderijo.
items.potions.exotic.potionofhighgrass.grown=%d quadrados de grama viram grama alta e densa.
items.potions.exotic.potionofhighgrass.no_tiles=Não há grama por perto para fazer crescer.
items.potions.exotic.potionofholy.name=poção sagrada
items.potions.exotic.potionofholy.desc=Ao ser bebida, a água abençoada deste frasco sagrado remove todas as maldições dos itens que você carrega e das pilhas próximas no chão.
items.potions.exotic.potionofholy.uncursed=%d itens são purificados!
items.potions.exotic.potionofholy.no_objects=Não há itens amaldiçoados para purificar.
items.potions.exotic.potionofholyfuror.name=poção do furor sagrado
items.potions.exotic.potionofholyfuror.desc=Beber esta mistura abençoada enche você de favor divino e dá uma bênção duradoura que melhora sua sorte e seu desempenho em combate.
items.potions.exotic.potionofhotness.name=poção do calorão
items.potions.exotic.potionofhotness.desc=Este líquido escaldante eleva a temperatura corporal de todos os inimigos visíveis a níveis perigosos, deixando-os desidratados e enfraquecidos.
items.potions.exotic.potionofhotness.mobs_effected=%d inimigos são tomados por um calor intenso!
items.potions.exotic.potionofhotness.no_targets=Nenhum inimigo visível para superaquecer.
items.potions.exotic.potionofimmortality.name=poção da imortalidade
items.potions.exotic.potionofimmortality.desc=Este líquido cheio de vida enche seu frasco de orvalho com uma boa quantidade de orvalho da manhã restaurador, completando-o em proporção à sua força.
items.potions.exotic.potionofimmortality.filled=Seu frasco de orvalho se enche de orvalho vivificante!
items.potions.exotic.potionofimmortality.no_vial=Você não tem um frasco de orvalho para encher!
items.potions.exotic.potionofironskin.name=poção da pele de ferro
items.potions.exotic.potionofironskin.desc=Beber esta mistura rica em minerais deixa sua pele dura como metal por um tempo, reduzindo cada golpe que você recebe a um único ponto de dano.
items.potions.exotic.potionoflaserbeam.name=poção do raio laser
items.potions.exotic.potionoflaserbeam.desc=Arremessar esta poção dispara um raio concentrado de energia destrutiva contra cada inimigo visível, queimando tudo que estiver no caminho.
items.potions.exotic.potionoflaserbeam.mobs_effected=%d inimigos são incinerados por raios laser!
items.potions.exotic.potionoflaserbeam.no_targets=Nenhum inimigo visível para mirar.
items.potions.exotic.potionofmagicfire.name=poção do fogo mágico
items.potions.exotic.potionofmagicfire.desc=Quebrar este frasco cria uma poça de fogo mágico que se espalha e queima com intensidade encantada, atingindo até criaturas que normalmente resistem a chamas.
items.potions.exotic.potionofnuts.name=poção das nozes
items.potions.exotic.potionofnuts.desc=Ao ser bebida, esta mistura peculiar faz surgir amendoins em todos os quadrados adjacentes, espalhando os petiscos nutritivos pela área.
items.potions.exotic.potionofnuts.peanuts=%d amendoins aparecem ao seu redor!
items.potions.exotic.potionofnuts.no_peanuts=Não há espaço para amendoins aqui.
items.potions.exotic.potionoforb.name=poção do orbe
items.potions.exotic.potionoforb.desc=Quebrar este recipiente mágico libera um orbe flutuante de energia destrutiva que revida contra todos os inimigos à vista quando é atingido.
items.potions.exotic.potionofplague.name=poção da peste
items.potions.exotic.potionofplague.desc=Abrir esta mistura fétida libera uma peste virulenta que envenena depressa todos os inimigos do andar.
items.potions.exotic.potionofplague.mobs_effected=%d inimigos são infectados pela peste!
items.potions.exotic.potionofplague.no_targets=Nenhum inimigo para infectar.
items.potions.exotic.potionofplague.effect=Uma peste virulenta se espalha pelo andar!
items.potions.exotic.potionofpressure.name=poção da pressão
items.potions.exotic.potionofpressure.desc=Abrir este líquido de alta pressão libera uma enorme onda de choque que causa dano físico a todos os inimigos do andar, proporcional à sua força.
items.potions.exotic.potionofpressure.mobs_effected=%d inimigos são esmagados pela onda de pressão!
items.potions.exotic.potionofpressure.no_targets=Nenhum inimigo ao alcance da onda de pressão.
items.potions.exotic.potionofprotain.name=poção da proteína
items.potions.exotic.potionofprotain.desc=Esta mistura rica em proteína fortalece seus músculos para sempre, aumentando sua força em um ponto.
items.potions.exotic.potionofprotain.effect=Seus músculos ficam mais fortes!
items.potions.exotic.potionofquantumsoup.name=poção da sopa quântica
items.potions.exotic.potionofquantumsoup.desc=Ao abrir o frasco, as partículas quânticas emaranhadas desta poção teleportam na hora todos os inimigos do andar para lugares aleatórios.
items.potions.exotic.potionofquantumsoup.mobs_effected=%d inimigos são espalhados pelo andar!
items.potions.exotic.potionofquantumsoup.no_targets=Nenhum inimigo para espalhar.
items.potions.exotic.potionofradiation.name=poção da radiação
items.potions.exotic.potionofradiation.desc=Beber esta mistura brilhante satura você de radiação arcana, aumentando o poder do seu próximo ataque mágico.
items.potions.exotic.potionofradiation.spell=Você se enche de radiação arcana!
items.potions.exotic.potionofrelativity.name=poção da relatividade
items.potions.exotic.potionofrelativity.desc=Quando consumida, a substância deste frasco dilata o tempo: ela curva o fluxo temporal ao seu redor e congela temporariamente tudo, menos você.
items.potions.exotic.potionofrelativity.time=O tempo se arrasta ao seu redor!
items.potions.exotic.potionofreproduction.name=poção da reprodução
items.potions.exotic.potionofreproduction.desc=Esta mistura estranha cria cópias espelhadas de você em quadrados próximos, e cada uma pode lutar por você por um curto tempo.
items.potions.exotic.potionofsleepparalysis.name=poção da paralisia do sono
items.potions.exotic.potionofsleepparalysis.desc=Arremessar este frasco amaldiçoado invoca um demônio da paralisia do sono perto do ponto de impacto, uma entidade espectral que paralisa qualquer herói que encostar nela.
items.potions.exotic.potionofslime.name=poção do slime
items.potions.exotic.potionofslime.desc=Esta mistura verde e grudenta cobre todos os inimigos do andar com uma gosma imobilizante, aleijando o movimento deles por bastante tempo.
items.potions.exotic.potionofslime.mobs_effected=%d inimigos ficam lentos com a gosma!
items.potions.exotic.potionofslime.no_targets=Nenhum inimigo para deixar lento.
items.potions.exotic.potionofsoil.name=poção do solo
items.potions.exotic.potionofsoil.desc=Quebrar esta poção terrosa libera um vento de energia de colheita que enriquece o solo por todo o andar.
items.potions.exotic.potionofsowing.name=poção da semeadura
items.potions.exotic.potionofsowing.desc=Quebrar esta poção libera um vento que espalha sementes pelo andar, plantando vegetação em cada trecho de terra.
items.potions.exotic.potionofspiral.name=poção da espiral
items.potions.exotic.potionofspiral.desc=Ao abrir o frasco, os vapores estonteantes lá dentro causam uma vertigem desnorteante em todos os inimigos do andar, que cambaleiam e perdem o senso de direção.
items.potions.exotic.potionofspiral.mobs_effected=%d inimigos são tomados pela vertigem!
items.potions.exotic.potionofspiral.no_targets=Nenhum inimigo para desorientar.
items.potions.exotic.potionofstarving.name=poção da inanição
items.potions.exotic.potionofstarving.desc=Este dreno de vitalidade enfraquece todos os inimigos do andar, definhando os músculos deles e fazendo seus ataques vacilarem.
items.potions.exotic.potionofstarving.mobs_effected=%d inimigos são enfraquecidos pela fome!
items.potions.exotic.potionofstarving.no_targets=Nenhum inimigo para enfraquecer.
items.potions.exotic.potionofstomach.name=poção do estômago
items.potions.exotic.potionofstomach.desc=Esta mistura moderadamente nutritiva sustenta tanto quanto uma refeição razoável quando consumida.
items.potions.exotic.potionofstomach.munch=Você sente uma saciedade agradável.
items.potions.exotic.potionofstrung.name=poção da amarra
items.potions.exotic.potionofstrung.desc=Arremessar esta poção dispara um raio de vinhas contra todos os inimigos visíveis, enraizando-os no lugar e causando dano com gavinhas que chicoteiam.
items.potions.exotic.potionofstrung.mobs_effected=%d inimigos são presos por vinhas!
items.potions.exotic.potionofstrung.no_targets=Nenhum inimigo visível para prender.
items.potions.exotic.potionofsugar.name=poção do açúcar
items.potions.exotic.potionofsugar.desc=Esta mistura hiperdoce inunda seu sangue de energia e dá uma longa euforia do açúcar que acelera suas ações por muitos turnos.
items.potions.exotic.potionofsuperdew.name=poção do superorvalho
items.potions.exotic.potionofsuperdew.desc=Quando você bebe esta mistura, os poderosos hormônios de crescimento dela pisoteiam toda a grama alta do andar, abrindo caminho e soltando as sementes que havia nela.
items.potions.exotic.potionofsuperdew.tiles_trampled=%d trechos de grama alta são pisoteados!
items.potions.exotic.potionofsuperdew.no_tiles=Não há grama alta para pisotear.
items.potions.exotic.potionofsupernova.name=poção da supernova
items.potions.exotic.potionofsupernova.desc=Abrir esta mistura instável dispara uma cascata de explosões centradas em cada inimigo do andar, devastando tudo que for pego nelas.
items.potions.exotic.potionofsupernova.boom=O andar irrompe em explosões em cadeia!
items.potions.exotic.potionofswelling.name=poção do inchaço
items.potions.exotic.potionofswelling.desc=As propriedades cáusticas desta mistura fazem todos os inimigos do andar começarem a sangrar sem controle quando o frasco é aberto.
items.potions.exotic.potionofswelling.mobs_effected=%d inimigos começam a sangrar!
items.potions.exotic.potionofswelling.no_targets=Nenhum inimigo para afligir.
items.potions.exotic.potionoftears.name=poção das lágrimas
items.potions.exotic.potionoftears.desc=As propriedades purificantes desta mistura livram você na hora de toda queimadura, corrosão, veneno, sangramento e muco cáustico quando consumida.
items.potions.exotic.potionoftears.cleansed=Você se sente livre de todos os males!
items.potions.exotic.potionofterror.name=poção do terror
items.potions.exotic.potionofterror.desc=Ao ser aberta, esta mistura perturbadora libera uma aura de medo primitivo que faz todos os inimigos do andar fugirem em pânico cego.
items.potions.exotic.potionofterror.mobs_effected=%d inimigos são tomados pelo terror!
items.potions.exotic.potionofterror.no_targets=Nenhum inimigo para aterrorizar.
items.potions.exotic.potionoftsunami.name=poção do tsunami
items.potions.exotic.potionoftsunami.desc=Arremessar este frasco invoca um maremoto que inunda o andar inteiro, transformando o terreno em água, apagando incêndios e arrastando tudo que estiver no caminho.
items.potions.exotic.potionofworm.name=poção do verme
items.potions.exotic.potionofworm.desc=Arremessar esta poção dispara raios carregados de parasitas contra todos os inimigos visíveis, causando dano e infectando-os com um veneno virulento.
items.potions.exotic.potionofworm.mobs_effected=%d inimigos são infectados por parasitas!
items.potions.exotic.potionofworm.no_targets=Nenhum inimigo visível para infectar.
items.coffee.name=xícara de café
items.coffee.ac_drink=BEBER
items.coffee.energized=O café amargo desperta você de um tranco!
items.coffee.desc=Uma xícara fumegante de café forte, preparado na própria masmorra. Um gole amargo leva embora um dia e meio de cansaço.
items.weapon.melee.triangolo.name=triângulo
items.weapon.melee.triangolo.desc=Um instrumento de percussão feito de barras finas de aço dobradas em triângulo. Bater nele produz uma ressonância nítida e melodiosa que atinge tudo ao redor do alvo. O alcance aumenta com os aprimoramentos.
items.weapon.melee.flute.name=flauta
items.weapon.melee.flute.desc=Um instrumento de sopro fino. Cada golpe soa uma nota aguda, e a ressonância fere tudo ao redor do alvo.
items.weapon.melee.wardrum.name=tambor de guerra
items.weapon.melee.wardrum.desc=Um tambor pesado feito para o campo de batalha. Sua ressonância retumbante castiga tudo ao redor do alvo, deixando todos tontos e aterrorizados.
items.weapon.melee.trumpet.name=trompete
items.weapon.melee.trumpet.desc=Um instrumento de metal com uma voz forte e estridente. Sua ressonância arrasa tudo ao redor do alvo.
items.weapon.melee.magebook.name=livro mágico
items.weapon.melee.magebook.desc=Um livro mágico de uma torre distante. É difícil de ler, mas pesado o bastante para deixar inimigos zonzos.
items.weapon.melee.fightgloves.name=luvas de luta
items.weapon.melee.fightgloves.desc=Uma arma feita de couro simples com pontas de metal. Um golpe firme pode deixar o inimigo aturdido.
items.weapon.melee.nunchakus.name=nunchakus
items.weapon.melee.nunchakus.desc=Dois bastões de madeira dura ligados por uma corda. Seus golpes giratórios podem aturdir inimigos.
items.weapon.melee.dualknife.name=faca dupla
items.weapon.melee.dualknife.desc=Duas lâminas afiadíssimas usadas como uma só, fazendo cada ataque acertar duas vezes.
items.weapon.melee.tricksand.name=areia estranha
items.weapon.melee.tricksand.desc=Um punhado de areia traiçoeira que golpeia a uma distância surpreendente. Cega o que atinge, castiga inimigos que não a veem chegando e rasga blindagem mágica.
items.weapon.melee.mirrordoll.name=espelho da boneca
items.weapon.melee.mirrordoll.desc=Uma boneca segurando um espelho polido num cabo longo. O reflexo cintilante cega os inimigos, bate mais forte nos que já estão ofuscados e despedaça blindagem mágica.
items.weapon.melee.windbottle.name=cabaça de vento
items.weapon.melee.windbottle.desc=Uma cabaça tampada com um vendaval preso dentro. Cada golpe solta uma rajada que empurra os inimigos para trás e os cega com a poeira levantada, e ela atravessa direto a blindagem mágica.
items.weapon.melee.handlight.name=lâmpada-punho
items.weapon.melee.handlight.desc=Uma lâmpada mágica em forma de punho fechado. Seu clarão ofuscante cega por um instante o que atinge, esmaga os que ficam cambaleando e queima blindagem mágica.
items.weapon.melee.harp.name=harpa
items.weapon.melee.harp.desc=Um instrumento de cordas tocadas com os dedos. Cada golpe o faz ressoar com violência, atingindo com ondas sonoras tudo o mais ao redor do alvo.
items.weapon.melee.harp.stats_desc=Sua ressonância causa dano a todas as outras criaturas adjacentes ao alvo.
items.weapon.missiles.holywater.name=água benta
items.weapon.missiles.holywater.desc=Um frasco frágil de água abençoada. Ele se quebra onde cair, molhando tudo por perto e deixando no chão uma poça abençoada que escalda quem estiver nela (mortos-vivos e demônios em dobro). Acertar uma criatura em cheio também cura um pouco quem arremessou.\n\nAprimoramentos aumentam o respingo e fazem a poça durar mais, e no _+6_ a bênção fica forte o bastante para o frasco se refazer magicamente depois de cada arremesso.
items.weapon.missiles.holywater.stats_desc=Este frasco se quebra no impacto, respingando e abençoando a área.
items.weapon.melee.prayerwheel.name=roda de oração
items.weapon.melee.prayerwheel.desc=Uma roda de oração simples. Cada golpe gira a roda e acumula poder espiritual, até liberar tudo de uma vez em um único golpe devastador.
items.weapon.melee.prayerwheel.stats_desc=A cada 18 golpes, o último causa 5x de dano.
items.weapon.melee.prayerwheel.charge=Carga atual: %1$d/%2$d.
items.weapon.melee.stonecross.name=cruz de pedra
items.weapon.melee.stonecross.desc=Uma cruz enorme talhada em pedra. Acumula poder sagrado aos poucos a cada golpe, até liberar tudo de uma vez em um único golpe devastador.
items.weapon.melee.stonecross.stats_desc=A cada 21 golpes, o último causa 5x de dano.
items.weapon.melee.stonecross.charge=Carga atual: %1$d/%2$d.
items.weapon.missiles.brick.name=tijolo
items.weapon.missiles.brick.desc=Um tijolo comum de barro. Um acerto firme pode aturdir o alvo por um instante, e de vez em quando um deles se quebra no impacto e solta as moedas que quem o fez escondeu lá dentro.
items.weapon.missiles.hugeshuriken.name=shuriken enorme
items.weapon.missiles.hugeshuriken.desc=Enormes peças de metal em forma de estrela com lâminas afiadíssimas, que causam bastante dano quando acertam o alvo.
items.weapon.missiles.smallchakram.name=chakram pequeno
items.weapon.missiles.smallchakram.desc=Nas mãos de alguém habilidoso, este pequeno disco afiado parece saltar de volta para a mão que o arremessou.
items.weapon.missiles.bottlefire.name=fogo na garrafa
items.weapon.missiles.bottlefire.desc=Um molotov tosco. Incendeia os inimigos que atinge e, se quebrar no chão, põe fogo em tudo ao redor.
items.weapon.missiles.bottlefire.stats_desc=Esta garrafa se quebra no impacto, queimando o alvo ou a área ao redor.
items.weapon.missiles.empbola.name=boleadeira PEM
items.weapon.missiles.empbola.desc=Boleadeiras com uma carga eletromagnética crepitante. Aleijam e paralisam por um instante o que prendem, e fazem um estrago em constructos inorgânicos.
items.weapon.missiles.empbola.stats_desc=Esta arma aleija e aturde por um instante o alvo, e é devastadora contra constructos.
items.weapon.missiles.honeyarrow.name=flecha de abelha
items.weapon.missiles.honeyarrow.desc=Uma flecha com uma cápsula frágil de mel na ponta e uma abelha muito brava, que fica solta onde a flecha cair.
items.weapon.missiles.honeyarrow.stats_desc=Esta flecha solta uma abelha brava onde cair.
items.weapon.missiles.mindarrow.name=flecha mental
items.weapon.missiles.mindarrow.desc=Uma flecha cintilante que fere a mente tanto quanto o corpo, causando dano psíquico extra e enchendo o alvo de pavor.
items.weapon.missiles.mindarrow.stats_desc=Esta flecha causa dano psíquico adicional e enche o alvo de pavor.
items.weapon.missiles.throwingwave.name=lâmina de onda
items.weapon.missiles.throwingwave.desc=Uma lâmina curva de água solidificada. Quem é atingido cai num frenesi confuso e ataca amigos e inimigos.
items.weapon.missiles.throwingwave.stats_desc=Esta arma joga o alvo num frenesi encantado e esmaga um quarto da vida que lhe resta.
items.weapon.missiles.throwingskull.name=crânio de arremesso
items.weapon.missiles.throwingskull.desc=Uma arma maligna esculpida em osso amaldiçoado. As almas que ela atinge ficam marcadas, com a vida e a essência expostas.
items.weapon.missiles.throwingskull.stats_desc=Esta arma marca a alma do alvo.
items.armor.lifearmor.name=armadura de folhas
items.armor.lifearmor.desc=Uma armadura de outro mundo, e ela está viva. Absorve a dor dos golpes que não consegue parar e, se quem a veste passar um tempo sem se ferir, devolve a vida guardada.
items.armor.soldierarmor.name=colete de soldado
items.armor.soldierarmor.desc=Um colete de combate resistente. Levar um golpe pode pôr quem o veste em foco de combate, abençoado por um curto tempo.
items.armor.performerarmor.name=jaqueta de artista
items.armor.performerarmor.desc=Uma jaqueta chamativa feita para o palco. Inimigos que a atingem podem ficar encantados com a apresentação.
items.armor.asceticarmor.name=faixas de asceta
items.armor.asceticarmor.desc=Faixas simples usadas por ascetas. A dor ensina: ser atingido pode acelerar quem as veste por um instante.
items.armor.followerarmor.name=sobretudo de seguidor
items.armor.followerarmor.desc=Um sobretudo usado pelos fiéis. Golpes contra ele às vezes são respondidos com um pouco de cura.
items.armor.ceramicsarmor.name=armadura de cerâmica
items.armor.ceramicsarmor.desc=Armadura feita de barro e fogo. Suas placas cozidas bloqueiam muito bem, mas a fragilidade limita o quanto os aprimoramentos podem melhorá-la.
items.armor.machinearmor.name=armadura mecânica
items.armor.machinearmor.desc=É uma máquina, não uma simples armadura. Bloqueia uma quantidade enorme de dano, mas o volume deixa a esquiva muito mais difícil.
items.armor.bulletarmor.name=armadura antibala
items.armor.bulletarmor.desc=Um colete antiestilhaços pesado. Protege mais que uma armadura de placas comum, ao custo de um pouco de mobilidade.
items.weapon.missiles.boomerang.stats_desc=Esta arma única sempre volta para quem a arremessou e, às vezes, derruba uma gota de orvalho do que atinge.
items.weapon.melee.elfbow.name=arco élfico
items.weapon.melee.elfbow.ac_shoot=ATIRAR
items.weapon.melee.elfbow.ac_drink=BEBER
items.weapon.melee.elfbow.desc=O arco curto usado pelos elfos. Seus disparos ficam mais fortes com o poder mágico de quem o empunha. Também há um pouco de água de mana guardada no punho. Não beba demais.
items.weapon.melee.elfbow.stats=Os disparos deste arco causam _%1$d-%2$d de dano_ e exigem _%3$d de força_ para usar direito. O dano aumenta com a varinha mais forte que você carrega.
items.weapon.melee.elfbow.charge_info=Água de mana bebida: %1$d/%2$d.
items.weapon.melee.elfbow.need_equip=Você precisa equipar o arco primeiro.
items.weapon.melee.elfbow.transform=O arco élfico se retorce em algo mais sombrio!
items.weapon.melee.elfbow.prompt=Escolha um alvo
items.weapon.melee.taurcenbow.name=arco kuranta
items.weapon.melee.taurcenbow.ac_shoot=ATIRAR
items.weapon.melee.taurcenbow.ac_break=FLECHA DE RUPTURA
items.weapon.melee.taurcenbow.ac_fire=FLECHA DE FOGO
items.weapon.melee.taurcenbow.ac_ice=FLECHA DE GELO
items.weapon.melee.taurcenbow.ac_poison=FLECHA VENENOSA
items.weapon.melee.taurcenbow.ac_ele=FLECHA PEM
items.weapon.melee.taurcenbow.desc=Um arco de centauro usado pelos kuranta. Depois de disparos comuns suficientes, ele dispara sozinho uma flecha especial. O tipo de flecha pode ser trocado a qualquer momento.
items.weapon.melee.taurcenbow.stats=Os disparos deste arco causam _%1$d-%2$d de dano_ e exigem _%3$d de força_ para usar direito.
items.weapon.melee.taurcenbow.charge_info=Carga: %1$d/%2$d.
items.weapon.melee.taurcenbow.prompt=Escolha um alvo
items.weapon.melee.minigun.name=minigun
items.weapon.melee.minigun.ac_shoot=ATIRAR
items.weapon.melee.minigun.ac_reload=RECARREGAR
items.weapon.melee.minigun.desc=Uma arma rotativa que despeja balas, acertando disparos extras nos inimigos agrupados em volta do alvo. Golpear diretamente com ela empurra os inimigos para trás.
items.weapon.melee.minigun.stats=Os disparos desta arma causam _%1$d-%2$d de dano_ e exigem _%3$d de força_ para usar direito.
items.weapon.melee.minigun.charge_info=Munição: %1$d/%2$d.
items.weapon.melee.minigun.reloading=recarregando...
items.weapon.melee.minigun.full=O pente já está cheio.
items.weapon.melee.minigun.prompt=Escolha um alvo
items.weapon.melee.shootgun.name=escopeta tecnológica
items.weapon.melee.shootgun.ac_shoot=ATIRAR
items.weapon.melee.shootgun.ac_endshoot=TIRO SEM FIM
items.weapon.melee.shootgun.ac_reload=RECARREGAR
items.weapon.melee.shootgun.desc=Uma escopeta modificada com uma tecnologia estranha. Seus disparos deixam os alvos vulneráveis, e dá para despejar o pente inteiro de uma vez numa rajada devastadora que não pode ser evitada.
items.weapon.melee.shootgun.stats=Os disparos desta arma causam _%1$d-%2$d de dano_ e exigem _%3$d de força_ para usar direito.
items.weapon.melee.shootgun.charge_info=Munição: %1$d/%2$d.
items.weapon.melee.shootgun.reloading=recarregando...
items.weapon.melee.shootgun.full=O pente já está cheio.
items.weapon.melee.shootgun.prompt=Escolha um alvo
items.weapon.melee.megacannon.name=canhão de braço
items.weapon.melee.megacannon.ac_shoot=ATIRAR
items.weapon.melee.megacannon.desc=Um canhão de braço anão. Ele se prende ao braço de quem o empunha e não pode ser removido. Carrega a cada turno enquanto equipado e descarrega toda a carga guardada em um único disparo que não erra.
items.weapon.melee.megacannon.stats=Os disparos deste canhão causam _%1$d-%2$d de dano_ por carga e exigem _%3$d de força_ para usar direito.
items.weapon.melee.megacannon.charge_info=Carga: %1$d/%2$d.
items.weapon.melee.megacannon.prompt=Escolha um alvo
items.weapon.enchantments.surging.name=%s pulsante
items.weapon.enchantments.surging.desc=Este encantamento se alimenta do embalo: cada golpe acumula uma carga elétrica que soma dano extra aos golpes seguintes por um curto tempo.
items.weapon.enchantments.surging.elestrike_desc=O Golpe Elementar manda uma onda com 30% do dano da arma pelos inimigos no cone, menos o alvo principal. Cada inimigo atingido pode ganhar acúmulos de surto e sofrer o bônus de surto guardado no encantamento. O nível do encantamento e os requisitos normais de ativação continuam valendo.
items.weapon.enchantments.parasitic.name=%s parasita
items.weapon.enchantments.parasitic.desc=Este encantamento planta uma semente parasita nos inimigos, que drena a vida deles por vários turnos e a passa para os inimigos deles que estiverem ao lado.
items.weapon.enchantments.parasitic.elestrike_desc=O Golpe Elementar manda uma onda com 30% do dano da arma pelos inimigos no cone, menos o alvo principal. Cada inimigo atingido tem a chance normal do encantamento de receber uma semente parasita. O nível do encantamento e os requisitos normais de ativação continuam valendo.
items.weapon.enchantments.parasitic$parasiticseed.name=Semente parasita
items.weapon.enchantments.parasitic$parasiticseed.desc=Uma semente parasita está crescendo aqui, drenando vida e passando-a para os inimigos do hospedeiro que estiverem por perto.\n\nDano por turno: %d.\n\nTurnos restantes: %s.
items.armor.glyphs.adaptation.name=%s de adaptação
items.armor.glyphs.adaptation.desc=Este glifo sintoniza quem o veste com o ambiente. Quando quem o veste é atingido, o glifo pode tirar poder do terreno embaixo dele: força da terra na grama, rapidez na água, ocultação na grama alta, vingança ardente nas cinzas ou energia mágica de armadilhas desarmadas.
items.armor.glyphs.crystal.name=%s de cristal
items.armor.glyphs.crystal.desc=Este glifo reage a golpes pesados, cristalizando a superfície da armadura e dando uma barreira protetora proporcional ao dano recebido.
items.armor.glyphs.siphoning.name=%s de drenagem
items.armor.glyphs.siphoning.desc=Este glifo sombrio drena a força vital dos atacantes e passa a vitalidade deles para quem o veste.
items.armor.glyphs.purity.name=%s de pureza
items.armor.glyphs.purity.desc=Quando quem o veste é atingido, este glifo sagrado tem chance de lavar todos os efeitos negativos que o afligem e de afastar novos efeitos por um instante.
items.portablechest.name=baú portátil
items.portablechest.name_golden=baú portátil dourado
items.portablechest.name_crystal=baú portátil de cristal
items.portablechest.ac_place=COLOCAR
items.portablechest.desc=Um baú pessoal que vem desmontado em peças planas. Dá para montá-lo em qualquer chão livre lá fora no mundo, longe da cidade, e desmontar de novo depois sem derrubar um único item.\n\nCapacidade: %d itens. Guardados agora: %d.
items.portablechest.only_world=O baú só pode ser montado lá fora, no mundo aberto.
items.portablechest.bad_spot=Você precisa de um lugar livre para colocar o baú.
items.portablechest.prompt=Escolha um lugar para o baú
items.portablechest.placed=Você monta o baú.
items.portablechest.discover_hint=Você pode comprar este baú numa loja.
items.fertilizer.name=adubo
items.fertilizer.ac_apply=APLICAR
items.fertilizer.prompt=Escolha uma plantação em crescimento para adubar
items.fertilizer.applied=Você aduba a plantação. Ela dá um salto de crescimento.
items.fertilizer.no_crop=Não há plantação crescendo aí.
items.fertilizer.no_effect=Esta plantação já está adiantada demais para aproveitar mais adubo.
items.fertilizer.desc=Um saco cheio de adubo. Aplicado numa plantação em crescimento, apressa o crescimento, mas cada dose ajuda bem menos que a anterior: uma plantação quase madura mal reage. Vendido na loja da cidade.
items.fertilizer.discover_hint=Você pode comprar este item na loja da cidade.
items.magicworldmap.name=mapa-múndi mágico
items.magicworldmap.ac_read=LER
items.magicworldmap.no_surface=O mapa só mostra a superfície, lá em cima, sob o céu aberto.
items.magicworldmap.desc=Um mapa encantado da superfície, sempre centrado em quem o carrega. Toque em qualquer ponto dele para marcar um ponto de referência: seus pés vão saber o caminho.
items.starfragment.name=fragmento de estrela
items.starfragment.desc=Um caco de uma estrela caída, escuro como ferro e ainda morno, com uma luz se mexendo em algum lugar lá dentro.\n\nO metal estelar aceita o trabalho do ferreiro como nada que se tira do chão: o Troll Ferreiro da cidade bate dois destes até virarem um núcleo de obra-prima. Qualquer mercador também paga bem por um.
items.roamertrophy.name_wolf=pele de %s
items.roamertrophy.name_yeti=presa de %s
items.roamertrophy.name_scorpion=ferrão de %s
items.roamertrophy.desc_wolf=A pele de pontas prateadas de %s, o lobo enorme. Prova da caçada, e qualquer mercador paga bem por ela.
items.roamertrophy.desc_yeti=Uma presa de %s, o yeti ancião, do tamanho de uma adaga. Prova da caçada, e qualquer mercador paga bem por ela.
items.roamertrophy.desc_scorpion=O ferrão de %s, o escorpião gigante, ainda pingando veneno. Prova da caçada, e qualquer mercador paga bem por ele.
items.ore.ore.prised=Você arranca um pedaço de %s da rocha.
items.ore.ore.prised_two=Você arranca dois pedaços de %s da rocha.
items.ore.ore.prised_n=Você arranca %2$d pedaços de %1$s da rocha.
items.ore.ore.you_now_have=Agora você tem %1$d pedaços de %2$s.
items.ore.ore.smith=\n\nO Troll Ferreiro da cidade funde %d destes em um núcleo de obra-prima, um cadinho por dia.
items.ore.ore.smith_bonus=\n\nO Troll Ferreiro da cidade funde %1$d destes em um núcleo de obra-prima, um cadinho por dia, e ainda paga %2$d de ouro pela limalha.
items.ore.ore.energy=\n\nUm alquimista consegue tirar %d de energia de cada pedaço.
items.ore.copperore.name=minério de cobre
items.ore.copperore.desc=Um pedaço de rocha cheio de veios de cobre, esverdeado onde o ar chegou. É o primeiro achado de todo mineiro e vale mais ou menos o que você imagina.
items.ore.ironore.name=minério de ferro
items.ore.ironore.desc=Rocha pesada e clara, com ferrugem nas rachaduras. Tem ferro bom aí dentro, depois que um ferreiro queimar o resto.
items.ore.silverore.name=minério de prata
items.ore.silverore.desc=Fios brilhantes de prata nativa correm por esta rocha, frios e limpos ao toque.
items.ore.goldore.name=minério de ouro
items.ore.goldore.desc=Rocha cinzenta com ouro reluzindo nas rachaduras. Ao contrário do ouro escuro das minas dos anões, este ouro não tem briga com a luz do dia.
items.ore.deepsilver.name=prata-profunda
items.ore.deepsilver.desc=Um metal encontrado só na rocha mais funda, onde nunca chegou luz. Tem um leve brilho próprio, verde-mar.
items.ore.skyiron.name=ferro-celeste
items.ore.skyiron.desc=Ferro que ficou azul-claro com o frio e o ar rarefeito dos picos mais altos, e mais duro por causa disso. Nunca esquenta na mão.
items.ore.gem.found=O cristal se abre e revela %s em estado bruto!
items.ore.gem.shattered=O golpe estilhaça os cristais ao redor, junto com as gemas que eles guardavam.
items.ore.gem.uses=\n\nQualquer mercador compra esta pedra, e um alquimista pode decompô-la em %d de energia.
items.ore.amethyst.name=ametista
items.ore.amethyst.desc=Um aglomerado de pontas de cristal violeta, a gema mais comum das cavernas rasas.
items.ore.garnet.name=granada
items.ore.garnet.desc=Uma pedra vermelho-escura, bruta e redonda como uma semente.
items.ore.emerald.name=esmeralda
items.ore.emerald.desc=Uma coluna de cristal verde de seis lados, turva por dentro como as boas esmeraldas são.
items.ore.sapphire.name=safira
items.ore.sapphire.desc=Uma pedra azul bruta, mais escura no centro. É nas cavernas mais fundas que elas crescem.
items.ore.diamond.name=diamante
items.ore.diamond.desc=Duro o bastante para riscar qualquer coisa que você tenha, e brilhante mesmo sem lapidação. Só os veios mais profundos os entregam.
items.weapon.melee.bible.name=Bíblia
items.weapon.melee.bible.stats_desc=Esta arma dá efeitos benéficos a quem a empunha.
items.weapon.melee.bible.ability_name=Bênção do Anjo
items.weapon.melee.bible.ability_desc=A Duelista empunhando a Bíblia pode usar _Bênção do Anjo_. Esta habilidade é ativada na hora e, pelos próximos _%d_ turnos, faz quem a empunha recuperar vida proporcional ao dano causado ao atacar inimigos corpo a corpo.
items.weapon.melee.bible.typical_ability_desc=A Duelista empunhando a Bíblia pode usar _Bênção do Anjo_. Esta habilidade é ativada na hora e, normalmente pelos próximos _%d_ turnos, faz quem a empunha recuperar vida proporcional ao dano causado ao atacar inimigos corpo a corpo.
items.weapon.melee.bible.desc=Um livro sagrado com a palavra de Deus. Quando um herói o empunha para atacar inimigos, o poder sagrado do livro fortalece você e, se você estiver forte o bastante, pode até recuperar sua vida.
items.weapon.melee.bible$angel.name=Bênção do Anjo
items.weapon.melee.bible$angel.desc=Um anjo cuida de você e guia sua lâmina. Enquanto a bênção durar, cada ataque corpo a corpo que você acertar recupera vida proporcional ao dano causado.\n\nTurnos restantes: %s.
items.weapon.melee.knife.name=Faca de Cozinha
items.weapon.melee.knife.stats_desc=Esta arma faz os inimigos sangrarem.
items.weapon.melee.knife.ability_name=Corte Profundo
items.weapon.melee.knife.ability_desc=A Duelista empunhando uma Faca de Cozinha pode usar _Corte Profundo_. Este ataque sempre acerta e causa _%1$d-%2$d_ turnos de sangramento. Esta habilidade consome 3 cargas. Inimigos poderosos podem resistir a este efeito.
items.weapon.melee.knife.typical_ability_desc=A Duelista empunhando uma Faca de Cozinha pode usar _Corte Profundo_. Este ataque sempre acerta e normalmente causa _%1$d-%2$d_ turnos de sangramento. Esta habilidade consome 3 cargas. Inimigos poderosos podem resistir a este efeito.
items.weapon.melee.knife.desc=Uma faca de cozinha. Parece fácil fazer um alvo esfaqueado sangrar, mas é difícil causar dano direto aos inimigos. O que ela está fazendo aqui?
items.weapon.melee.largesword.name=Montante
items.weapon.melee.largesword.stats_desc=Esta arma é muito lenta.
items.weapon.melee.largesword.ability_name=Investida
items.weapon.melee.largesword.ability_desc=A Duelista empunhando um Montante pode usar _Investida_. Ela gasta 1 turno para carregar, aumentando o nível de carga do Montante em _%d_ turnos.
items.weapon.melee.largesword.typical_ability_desc=A Duelista empunhando um Montante pode usar _Investida_. Ela gasta 1 turno para carregar, aumentando o nível de carga do Montante normalmente em _%d_ turnos.
items.weapon.melee.largesword.desc=Uma espada enorme e pesada, de lâmina larga. Demora muito para golpear, mas, erguendo-a antes de atacar, você pode bloquear ataques inimigos e, com carga suficiente, causar dano devastador.
items.weapon.melee.largesword$largeswordbuff.name=Investida
items.weapon.melee.largesword$largeswordbuff.desc=Você está erguendo o Montante e preparando sua força. Graças à lâmina larga do Montante, o dano que você recebe cai muito, e quanto mais você carrega, maior o dano do próximo golpe. A longa concentração também deixa mais fácil acertar os inimigos.\n\nCom poder suficiente acumulado, você também causa dano aos inimigos perto do alvo atacado.\n\nTurnos carregados: _%1$s_.\nMultiplicador de dano atual: _+%2$s%%_/_+%3$s%%_.\nMultiplicador de acerto atual: _+%4$s%%_/_+%5$s%%_.\nDano recebido: _-%6$s%%_.
items.weapon.melee.alchemy.sharpkatana.name=Lâmina Afiada
items.weapon.melee.alchemy.sharpkatana.stats_desc=Esta arma tem poder de ataque mínimo muito baixo, mas máximo um pouco maior.
items.weapon.melee.alchemy.sharpkatana.ability_name=Corte Relâmpago
items.weapon.melee.alchemy.sharpkatana.ability_desc=A Duelista empunhando uma Lâmina Afiada pode usar _Corte Relâmpago_. Esta habilidade é ativada na hora, não gasta turnos e ataca um único inimigo. Se a habilidade derrotar o inimigo, você ganha _%s_ cargas de arma.
items.weapon.melee.alchemy.sharpkatana.desc=Uma espada tão afiada que corta tudo que o fio dela roçar.
items.weapon.melee.alchemy.truerunicblade.name=Verdadeira Lâmina Rúnica
items.weapon.melee.alchemy.truerunicblade.ability_name=corte rúnico
items.weapon.melee.alchemy.truerunicblade.ability_desc=A Duelista pode dar um _corte rúnico_ com uma lâmina rúnica. Este ataque tem acerto garantido e _+%d%% de poder de encantamento._
items.weapon.melee.alchemy.truerunicblade.typical_ability_desc=A Duelista pode dar um _corte rúnico_ com uma lâmina rúnica. Este ataque tem acerto garantido e normalmente _+%d%% de poder de encantamento._
items.weapon.melee.alchemy.truerunicblade.desc=Esta lâmina rúnica dourada, agora restaurada ao seu poder original, pode liberar a verdadeira magia que guarda, ampliando muito as propriedades mágicas dadas a ela.
items.weapon.melee.alchemy.chainwhip.name=Chicote de Correntes
items.weapon.melee.alchemy.chainwhip.stats_desc=Esta arma tem um alcance de ataque excepcionalmente longo.
items.weapon.melee.alchemy.chainwhip.ability_name=chicotear
items.weapon.melee.alchemy.chainwhip.ability_desc=A Duelista pode _chicotear_ todos os inimigos ao redor dela com um chicote. Esta habilidade causa _%1$d-%2$d de dano_, atinge todos os inimigos dentro do alcance de ataque e tem acerto garantido.
items.weapon.melee.alchemy.chainwhip.typical_ability_desc=A Duelista pode _chicotear_ todos os inimigos ao redor dela com um chicote. Esta habilidade normalmente causa _%1$d-%2$d de dano_, atinge todos os inimigos dentro do alcance de ataque e tem acerto garantido.
items.weapon.melee.alchemy.chainwhip.desc=Uma arma feita só de correntes. Com as correntes mais compridas que as de um chicote comum, dá para atacar inimigos distantes. O peso do metal das correntes dificulta o uso para quem tem pouca força, mas o impacto delas pode aturdir inimigos.
items.weapon.melee.alchemy.obsidianshield.name=Escudo de Obsidiana
items.weapon.melee.alchemy.obsidianshield.typical_stats_desc=Normalmente, esta arma reduz o dano físico e mágico em 0-%d. Esta redução aumenta com aprimoramentos.
items.weapon.melee.alchemy.obsidianshield.ability_name=defender
items.weapon.melee.alchemy.obsidianshield.ability_desc=A Duelista pode se _defender_ com um escudo redondo, anulando completamente todos os ataques físicos ou mágicos feitos contra ela por _%d turnos_. Depois que a Duelista bloquear um ataque, revidar ou usar magia encerra a defesa.
items.weapon.melee.alchemy.obsidianshield.typical_ability_desc=A Duelista pode se _defender_ com um escudo redondo, anulando completamente todos os ataques físicos ou mágicos feitos contra ela normalmente por _%d turnos_. Depois que a Duelista bloquear um ataque, revidar ou usar magia encerra a defesa.
items.weapon.melee.alchemy.obsidianshield.stats_desc=Esta arma reduz o dano físico e mágico em 0-%d. Esta redução aumenta com aprimoramentos.
items.weapon.melee.alchemy.obsidianshield.desc=Este escudo, incrustado de obsidiana e imbuído de poder mágico, cria uma resistência à magia ao seu redor. Mas, nesse processo, o desempenho dele contra ataques físicos parece ter caído.
items.weapon.melee.alchemy.lance.name=Lança de Justa
items.weapon.melee.alchemy.lance.stats_desc=Esta arma causa mais dano quanto mais você se move.\nEsta arma pode atacar inimigos caídos.
items.weapon.melee.alchemy.lance.ability_name=investida
items.weapon.melee.alchemy.lance.ability_desc=A Duelista empunhando uma Lança de Justa pode fazer uma _Investida_. A investida normalmente permite se mover até _%d_ quadrados sem gastar turno e ganhar embalo na hora, conforme a distância percorrida.
items.weapon.melee.alchemy.lance.typical_ability_desc=A Duelista empunhando uma Lança de Justa pode fazer uma _Investida_. A investida permite se mover até _%d_ quadrados sem gastar turno e ganhar embalo na hora, conforme a distância percorrida.
items.weapon.melee.alchemy.lance.ability_bad_position=Você não pode avançar até essa posição.
items.weapon.melee.alchemy.lance.desc=Uma lança de justa toda de metal, feita para combate montado. Pelo comprimento, ela alcança inimigos distantes, e ao se mover você ganha embalo para causar mais dano.
items.weapon.melee.alchemy.lance$lancebuff.name=Investida
items.weapon.melee.alchemy.lance$lancebuff.desc=Você começou uma investida com a lança firme à frente, ganhando embalo sem parar. Quanto mais longa a investida, maior o dano do próximo golpe, mas ele diminui aos poucos com o tempo. O embalo acumula mais rápido com maior velocidade de movimento.\n\nMultiplicador de dano atual: %sx
items.weapon.melee.alchemy.lancenshield.name=Lança de Justa e Escudo
items.weapon.melee.alchemy.lancenshield.ac_change=Mudar postura
items.weapon.melee.alchemy.lancenshield.typical_stats_desc_attack=Esta arma causa mais dano quanto mais você se move.\nEsta arma pode atacar inimigos caídos.
items.weapon.melee.alchemy.lancenshield.stats_desc_attack=Esta arma causa mais dano quanto mais você se move.\nEsta arma pode atacar inimigos caídos.
items.weapon.melee.alchemy.lancenshield.typical_stats_desc_defense=Normalmente, esta arma reduz o dano físico e mágico em 0-%d. Esta redução aumenta com aprimoramentos.
items.weapon.melee.alchemy.lancenshield.stats_desc_defense=Esta arma reduz o dano físico e mágico em 0-%d. Esta redução aumenta com aprimoramentos.
items.weapon.melee.alchemy.lancenshield.ability_name=investida / defender
items.weapon.melee.alchemy.lancenshield.ability1_desc=A Duelista empunhando uma Lança de Justa pode fazer uma _Investida_. A investida permite se mover até _%d_ quadrados sem gastar turno e ganhar embalo na hora, conforme a distância percorrida.
items.weapon.melee.alchemy.lancenshield.typical_ability1_desc=A Duelista empunhando uma Lança de Justa pode fazer uma _Investida_. A investida normalmente permite se mover até _%d_ quadrados sem gastar turno e ganhar embalo na hora, conforme a distância percorrida.
items.weapon.melee.alchemy.lancenshield.ability2_desc=A Duelista pode se _defender_ com um escudo redondo, anulando completamente todos os ataques físicos ou mágicos feitos contra ela por _%d turnos_. Depois que a Duelista bloquear um ataque, revidar ou usar magia encerra a defesa.
items.weapon.melee.alchemy.lancenshield.typical_ability2_desc=A Duelista pode se _defender_ com um escudo redondo, anulando completamente todos os ataques físicos ou mágicos feitos contra ela normalmente por _%d turnos_. Depois que a Duelista bloquear um ataque, revidar ou usar magia encerra a defesa.
items.weapon.melee.alchemy.lancenshield.desc=Uma versão melhorada da Lança de Justa e Escudo, que permite usar cada arma na hora, conforme a necessidade. \n\nNa _Postura de Ataque_, você usa a habilidade da _Lança de Justa_.\nNa _Postura de Defesa_, você usa a habilidade do _Escudo de Obsidiana_.
items.weapon.melee.alchemy.lancenshield.change_attack=Você mudou sua postura de combate para ataque.
items.weapon.melee.alchemy.lancenshield.change_defense=Você mudou sua postura de combate para defesa.
items.weapon.melee.alchemy.lancenshield.not_equipped=Você precisa equipar a arma antes de mudar a postura de combate.
items.weapon.melee.alchemy.chainflail.name=Mangual de Corrente
items.weapon.melee.alchemy.chainflail.stats_desc=Esta arma pode atacar inimigos distantes.\nEsta arma tem precisão um pouco menor.\nNão pode realizar ataques surpresa.
items.weapon.melee.alchemy.chainflail.desc=Uma arma feita para atacar inimigos distantes estendendo a corrente do mangual. É preciso bastante força para gerar o impulso centrífugo necessário para atacar com a corrente estendida.
items.weapon.melee.alchemy.chainflail.ability_name=Girar
items.weapon.melee.alchemy.chainflail.spin_warn=Você não pode girar mais o mangual.
items.weapon.melee.alchemy.chainflail.ability_desc=A Duelista pode _girar_ um mangual para acumular poder por um curto tempo. A cada turno girando, o mangual causa _+%d de dano_, até no máximo 3 vezes. Um mangual girando também tem acerto garantido. Só começar a girar o mangual custa uma carga.
items.weapon.melee.alchemy.chainflail.typical_ability_desc=A Duelista pode _girar_ um mangual para acumular poder por um curto tempo. A cada turno girando, o mangual normalmente causa _+%d de dano_, até no máximo 3 vezes. Um mangual girando também tem acerto garantido. Só começar a girar o mangual custa uma carga.
items.weapon.melee.alchemy.chainflail$spinabilitytracker.name=Girando
items.weapon.melee.alchemy.chainflail$spinabilitytracker.desc=Você está girando o mangual, juntando força para o próximo ataque. Cada turno girando consome 1 carga, mas dá +20%% adicional de dano. E o ataque giratório sempre acerta.\n\nDano adicional atual: %1$d%%.\nTurnos restantes: %2$s.
items.weapon.melee.alchemy.unformedblade.name=Lâmina Disforme
items.weapon.melee.alchemy.unformedblade.stats_desc=Esta arma é mais eficaz contra inimigos desatentos.
items.weapon.melee.alchemy.unformedblade.ability_name=furtivo
items.weapon.melee.alchemy.unformedblade.ability_desc=A Duelista pode entrar em modo _furtivo_ enquanto empunha uma lâmina disforme. Esta habilidade permite que a Duelista se teletransporte na hora até 2 quadrados de distância e dá a ela _%d turnos de invisibilidade._
items.weapon.melee.alchemy.unformedblade.typical_ability_desc=A Duelista pode entrar em modo _furtivo_ enquanto empunha uma lâmina disforme. Esta habilidade permite que a Duelista se teletransporte na hora até 2 quadrados de distância e normalmente dá a ela _%d turnos de invisibilidade._
items.weapon.melee.alchemy.unformedblade.desc=Uma lâmina de forma sempre mutável, em parte transparente. Ela acumula energia sombria ao emboscar inimigos e, quando essa energia é liberada, tem chance de atingir os inimigos com o efeito do encantamento _Mortal_, como se os emboscasse.
items.weapon.melee.alchemy.unformedblade.not_equipped=Você precisa equipar a arma primeiro.
items.weapon.melee.alchemy.unformedblade.ac_use=Descarregar
items.weapon.melee.alchemy.unformedblade.no_charge=Ainda não há energia sombria carregada na arma!
items.weapon.melee.alchemy.unformedblade.power_on=A energia sombria começa a se descarregar da arma!
items.weapon.melee.alchemy.unformedblade.power_off=A energia sombria que saía da arma se dissipou.
items.weapon.melee.alchemy.unformedblade.energy=Esta arma acumula energia sombria ao emboscar inimigos e, com ela, pode atingir os inimigos emboscados com o efeito do encantamento _Mortal_.\n\nCada emboscada carrega _%1$d%%_ de energia, e cada ataque de emboscada durante a descarga consome _%2$d%%_ de energia. Se o inimigo for emboscado durante a descarga, mais _%2$d%%_ de energia são consumidos.\n\nEnergia guardada: _%3$d%%_/_%4$d%%_.
items.weapon.melee.alchemy.spearnshield.name=Lança e Escudo
items.weapon.melee.alchemy.spearnshield.ac_change=Mudar postura
items.weapon.melee.alchemy.spearnshield.typical_stats_desc_attack=Esta arma é mais lenta que as outras.\nEsta arma pode atacar inimigos caídos.
items.weapon.melee.alchemy.spearnshield.stats_desc_attack=Esta arma é mais lenta que as outras.\nEsta arma pode atacar inimigos caídos.
items.weapon.melee.alchemy.spearnshield.typical_stats_desc_defense=Normalmente, esta arma reduz _0-%d_ de dano físico. Esta redução aumenta com aprimoramentos.
items.weapon.melee.alchemy.spearnshield.stats_desc_defense=Esta arma reduz _0-%d_ de dano físico. Esta redução aumenta com aprimoramentos.
items.weapon.melee.alchemy.spearnshield.ability_name=espetar / defender
items.weapon.melee.alchemy.spearnshield.ability1_desc=A Duelista pode usar a ponta de uma lança para _espetar_ um inimigo que esteja no alcance, mas não adjacente. Isso causa _%1$d-%2$d_ de dano, empurra o inimigo para trás e tem acerto garantido.
items.weapon.melee.alchemy.spearnshield.typical_ability1_desc=A Duelista pode usar a ponta de uma lança para _espetar_ um inimigo que esteja no alcance, mas não adjacente. Isso normalmente causa _%1$d-%2$d_ de dano, empurra o inimigo para trás e tem acerto garantido.
items.weapon.melee.alchemy.spearnshield.ability2_desc=A Duelista pode se _defender_ com um escudo redondo, anulando completamente todos os ataques físicos ou mágicos feitos contra ela por _%d turnos_. Depois que a Duelista bloquear um ataque, revidar ou usar magia encerra a defesa.
items.weapon.melee.alchemy.spearnshield.typical_ability2_desc=A Duelista pode se _defender_ com um escudo redondo, anulando completamente todos os ataques físicos ou mágicos feitos contra ela normalmente por _%d turnos_. Depois que a Duelista bloquear um ataque, revidar ou usar magia encerra a defesa.
items.weapon.melee.alchemy.spearnshield.desc=Uma arma com uma lança e um escudo redondo empunhados separadamente, que permite usar cada um na hora, conforme a necessidade.\n\nNa _postura de ataque_, usa a _lança_.\nNa _postura de defesa_, usa o _escudo redondo_.
items.weapon.melee.alchemy.spearnshield.change_attack=Você mudou para a postura de ataque.
items.weapon.melee.alchemy.spearnshield.change_defense=Você mudou para a postura de defesa.
items.weapon.melee.alchemy.spearnshield.not_equipped=Você precisa equipar a arma primeiro.
items.weapon.melee.alchemy.assassinsspear.name=Lança do Assassino
items.weapon.melee.alchemy.assassinsspear.stats_desc=Esta arma é mais lenta que as outras.\nEsta arma pode atacar inimigos caídos.\nEsta arma é mais eficaz contra inimigos sem armadura.
items.weapon.melee.alchemy.assassinsspear.ability_name=Estocada do Assassino
items.weapon.melee.alchemy.assassinsspear.ability_desc=A Duelista empunhando uma lança do assassino pode usar a _Estocada do Assassino_. Este ataque poderoso, porém previsível, tem -75%% de precisão, mas causa _%1$d-%2$d_ de dano se acertar. A Estocada do Assassino pode ser usada em ataques de emboscada, até contra inimigos fora de vista.
items.weapon.melee.alchemy.assassinsspear.typical_ability_desc=A Duelista empunhando uma lança do assassino pode usar a _Estocada do Assassino_. Este ataque poderoso, porém previsível, tem -75%% de precisão, mas normalmente causa _%1$d-%2$d_ de dano se acertar. A Estocada do Assassino pode ser usada em ataques de emboscada, até contra inimigos fora de vista.
items.weapon.melee.alchemy.assassinsspear.desc=Uma arma modificada que troca a lâmina do gládio pela de uma adaga de assassino, para causar mais dano a inimigos sem armadura. O comprimento deixou o ataque mais lento, mas agora ela alcança inimigos distantes.
items.weapon.melee.alchemy.dualgreatsword.name=Espada Larga Dupla
items.weapon.melee.alchemy.dualgreatsword.ability_name=Cortar
items.weapon.melee.alchemy.dualgreatsword.ability_desc=A Duelista pode _cortar_ um inimigo com uma espada longa. Isso causa _%1$d-%2$d de dano_ e tem acerto garantido. Se a habilidade matar um inimigo, a ação é instantânea e a Duelista pode usar cortar de novo em até 5 turnos sem custo.
items.weapon.melee.alchemy.dualgreatsword.typical_ability_desc=A Duelista pode _cortar_ um inimigo com uma espada longa. Isso normalmente causa _%1$d-%2$d de dano_ e tem acerto garantido. Se a habilidade matar um inimigo, a ação é instantânea e a Duelista pode usar cortar de novo em até 5 turnos sem custo.
items.weapon.melee.alchemy.dualgreatsword.desc=Uma arma muito pesada, empunhada com as duas mãos para desferir ataques poderosos em sequência. Bem usada, pode ser uma arma incrivelmente forte, mas exige muita força.
items.weapon.melee.alchemy.dualgreatsword.stats_desc=Esta arma pode atacar muito rápido.\nEsta arma é muito pesada.
items.weapon.melee.alchemy.forceglove.name=Luva de Força
items.weapon.melee.alchemy.forceglove.stats_desc=Esta arma pode arremessar para longe inimigos próximos.\n\nEsta arma pode atacar um inimigo a distância.
items.weapon.melee.alchemy.forceglove.desc=Uma luva imbuída de magia de força, que ataca inimigos distantes com uma força invisível. A força imensa da luva basta para causar um pouco de dano a inimigos próximos enquanto os arremessa para longe.
items.weapon.melee.alchemy.forceglove.no_target=Nenhum alvo encontrado.
items.weapon.melee.alchemy.forceglove.immovable=O alvo não pode ser puxado.
items.weapon.melee.alchemy.forceglove.does_nothing=Nada acontece.
items.weapon.melee.alchemy.forceglove.ability_bad_position=Você não pode puxar o alvo nessa posição!
items.weapon.melee.alchemy.forceglove.ability_name=Onda de choque
items.weapon.melee.alchemy.forceglove.ability_desc=A Duelista empunhando uma Luva de Força pode usar _Onda de choque_. Esta habilidade puxa os inimigos a até _%d_ quadrados na direção do herói, causando dano proporcional à distância percorrida e aturdindo-os.
items.weapon.melee.alchemy.forceglove.typical_ability_desc=A Duelista empunhando uma Luva de Força pode usar _Onda de choque_. Esta habilidade puxa os inimigos num raio que normalmente é de _%d_ quadrados na direção do herói, causando dano proporcional à distância percorrida e aturdindo-os.
items.weapon.melee.alchemy.unholybible.name=Bíblia Profana
items.weapon.melee.alchemy.unholybible.stats_desc=Esta arma causa efeitos negativos nos inimigos.
items.weapon.melee.alchemy.unholybible.ability_name=Demonização
items.weapon.melee.alchemy.unholybible.ability_desc=A Duelista empunhando a Bíblia Profana pode se _demonizar_ por um tempo, ganhando +33%% de poder de ataque e acertos garantidos por _%d_ turnos, mas sofre -50%% de evasão pelo foco intenso no ataque. A Demonização não gasta turno.
items.weapon.melee.alchemy.unholybible.typical_ability_desc=A Duelista empunhando a Bíblia Profana pode se _demonizar_ por um tempo, ganhando +33%% de poder de ataque e acertos garantidos normalmente por _%d_ turnos, mas sofre -50%% de evasão pelo foco intenso no ataque. A Demonização não gasta turno.
items.weapon.melee.alchemy.unholybible.desc=Imbuída de energia maligna, a Bíblia Profana dá a quem a empunha o poder de causar efeitos negativos aleatórios nos inimigos atingidos e, às vezes, levá-los à ruína.
items.weapon.melee.alchemy.unholybible$demon.name=Demonização
items.weapon.melee.alchemy.unholybible$demon.desc=A malícia de um demônio tomou conta de você. Seus ataques causam 33%% mais dano e nunca erram, mas seu ataque imprudente deixa você com metade da evasão de costume.\n\nTurnos restantes: %s.
items.weapon.melee.alchemy.holysword.name=Espada Pesada
items.weapon.melee.alchemy.holysword.true_name=Espada Sagrada
items.weapon.melee.alchemy.holysword.stats_desc=A força necessária desta arma não diminui com aprimoramentos.
items.weapon.melee.alchemy.holysword.true_ability_name=Proteção Divina
items.weapon.melee.alchemy.holysword.ability_name=???
items.weapon.melee.alchemy.holysword.true_ability_desc=A Duelista empunhando a Espada Sagrada pode usar _Proteção Divina_. Esta habilidade é ativada na hora e dá a quem a usa uma blindagem igual a 20% da vida máxima. Esta habilidade consome 2 cargas.
items.weapon.melee.alchemy.holysword.ability_desc=Sem força suficiente para liberar seu verdadeiro poder, as habilidades da arma continuam inacessíveis.
items.weapon.melee.alchemy.holysword.true_desc=Uma espada gigante imbuída de poder sagrado. Com sua verdadeira força recuperada, a Espada Sagrada desfere ataques rápidos e recupera a vida de quem a empunha a cada golpe.
items.weapon.melee.alchemy.holysword.normal_desc=Uma espada pesada que parece guardar um poder adormecido. Se ao menos houvesse força suficiente...
items.weapon.melee.alchemy.hugesword.name=Espada Enorme
items.weapon.melee.alchemy.hugesword.ability_name=Cortar
items.weapon.melee.alchemy.hugesword.ability_desc=A Duelista pode _cortar_ um inimigo com uma espada larga. Isso causa _%1$d-%2$d de dano_ e tem acerto garantido. Se a habilidade matar um inimigo, a ação é instantânea e a Duelista pode usar cortar de novo em até 5 turnos sem custo.
items.weapon.melee.alchemy.hugesword.typical_ability_desc=A Duelista pode _cortar_ um inimigo com uma espada larga. Isso normalmente causa _%1$d-%2$d de dano_ e tem acerto garantido. Se a habilidade matar um inimigo, a ação é instantânea e a Duelista pode usar cortar de novo em até 5 turnos sem custo.
items.weapon.melee.alchemy.hugesword.stats_desc=Esta arma é muito pesada.
items.weapon.melee.alchemy.hugesword.desc=Uma arma comum aprimorada ainda mais por magia. Muito pesada, garante um poder de ataque formidável a quem souber empunhá-la bem. Os golpes da espada larga às vezes enfraquecem os inimigos.
items.weapon.melee.alchemy.meisterhammer.name=Martelo do Mestre
items.weapon.melee.alchemy.meisterhammer.stats_desc=Esta arma é mais precisa que as outras.
items.weapon.melee.alchemy.meisterhammer.ability_name=Golpe pesado
items.weapon.melee.alchemy.meisterhammer.ability_desc=A Duelista pode realizar um _golpe pesado_ com um martelo do mestre. Este ataque concentrado causa _%1$d-%2$d de dano_ se pegar o inimigo de surpresa e o atordoa por 5 turnos, reduzindo a precisão e a evasão em 50%%. O golpe pesado sempre acerta, mas causa dano normal se não pegar o inimigo de surpresa.
items.weapon.melee.alchemy.meisterhammer.typical_ability_desc=A Duelista pode realizar um _golpe pesado_ com um martelo do mestre. Este ataque concentrado normalmente causa _%1$d-%2$d de dano_ se pegar o inimigo de surpresa e o atordoa por 5 turnos, reduzindo a precisão e a evasão em 50%%. O golpe pesado sempre acerta, mas causa dano normal se não pegar o inimigo de surpresa.
items.weapon.melee.alchemy.meisterhammer.desc=Um martelo grande de aparência familiar. O peso facilita acertar os inimigos, e um golpe bem dado aturde o inimigo por um instante.
items.weapon.melee.alchemy.beamsaber.name=Sabre de Luz
items.weapon.melee.alchemy.beamsaber.stats_desc=Esta arma pode atacar muito rápido.
items.weapon.melee.alchemy.beamsaber.ability_name=combinação de ataques
items.weapon.melee.alchemy.beamsaber.ability_desc=A Duelista pode realizar uma _combinação de ataques_ com luvas cravejadas. Este ataque tem acerto garantido e causa _+%d de dano_ para cada vez que a Duelista acertou recentemente um ataque com arma corpo a corpo ou de arremesso. Passar 5 turnos sem acertar um ataque zera a combinação.
items.weapon.melee.alchemy.beamsaber.typical_ability_desc=A Duelista pode realizar uma _combinação de ataques_ com luvas cravejadas. Este ataque tem acerto garantido e normalmente causa _+%d de dano_ para cada vez que a Duelista acertou recentemente um ataque com arma corpo a corpo ou de arremesso. Passar 5 turnos sem acertar um ataque zera a combinação.
items.weapon.melee.alchemy.beamsaber.desc=O auge da tecnologia óptica: a lâmina deste sabre é feita de luz, por isso ele é rápido de manejar. Às vezes o brilho intenso cega os inimigos por um instante.
items.spells.evolution.name=evolução instável
items.spells.evolution.inv_title=Escolha uma arma para evoluir
items.spells.evolution.nothing=Nada parece ter mudado.
items.spells.evolution.evolve=Sua arma evoluiu!
items.spells.evolution.desc=Este feitiço instável contém uma magia parecida com a do pergaminho de transmutação, mas só funciona em armas. A arma evoluída tem chance de virar uma arma do tier seguinte.\n\nO nível de aprimoramento e o encantamento da arma evoluída são mantidos, e armas acima do tier 5 não evoluem: viram uma arma aleatória de tier 5. Modificações em armas de fogo não são mantidas.
items.spells.upgradedust.name=Pó de Aprimoramento
items.spells.upgradedust.desc=Este pó dourado imbuído de poder místico costuma ser usado na alquimia de armas, mas também pode ser usado direto para melhorar por um tempo o desempenho da arma e da armadura que você está usando.
items.spells.upgradedust.ac_cast=Polvilhar
items.spells.upgradedust.empower=Ao espalhar o pó ao seu redor, seu equipamento começa a brilhar!
items.weapon.missiles.alchemy.cross.name=Cruz
items.weapon.missiles.alchemy.cross.desc=Esta cruz não parece ter sido feita para arremesso, mas causa dano considerável quando arremessada. Depois de alguns turnos, a cruz volta para a posição original. Demônios e mortos-vivos são queimados pelo poder sagrado da cruz e sofrem dano extra.
items.armor.glyphs.satisfying.name=%s saciante
items.armor.glyphs.satisfying.desc=Quando quem o veste é atacado, este glifo poderoso tem chance de saciar a fome dele.
items.armor.glyphs.mirrorimage.name=%s da imagem espelhada
items.armor.glyphs.mirrorimage.desc=Este glifo tem chance de invocar uma cópia espelhada aliada quando quem o veste é atacado.
items.armor.glyphs.afterimage.name=%s de pós-imagem
items.armor.glyphs.afterimage.desc=Este glifo reduz bastante a defesa da armadura, mas aumenta muito a evasão de quem a veste.
items.weapon.melee.saber.name=sabre
items.weapon.melee.saber.stats_desc=Esta arma pode bloquear _0-1_ de dano.
items.weapon.melee.saber.ability_name=estocada
items.weapon.melee.saber.typical_ability_desc=A Duelista pode dar uma _estocada_ com um sabre num inimigo a 1 quadrado de distância. Isso a move até o inimigo, normalmente causa _%1$d-%2$d de dano_ e tem acerto garantido.
items.weapon.melee.saber.ability_desc=A Duelista pode dar uma _estocada_ com um sabre num inimigo a 1 quadrado de distância. Isso a move até o inimigo, causa _%1$d-%2$d de dano_ e tem acerto garantido.
items.weapon.melee.saber.desc=Símbolo de um cavaleiro da escolta real, este sabre pode bloquear parte dos ataques inimigos para proteger você.
items.weapon.melee.deathsword.name=espada da morte
items.weapon.melee.deathsword.desc=Uma espada agourenta imbuída da aura da morte. Cada vez que o Cavaleiro da Morte a empunha e mata um inimigo, ele absorve a alma do inimigo e ganha um pouco de vida máxima. O aumento de vida máxima zera quando o herói morre de vez.
items.weapon.melee.deathsword.desc_hero=Uma espada agourenta imbuída da aura da morte. Cada vez que o Cavaleiro da Morte a empunha e mata um inimigo, ele absorve a alma do inimigo e ganha um pouco de vida máxima. O aumento de vida máxima zera quando o herói morre de vez.\n\nGanho atual de vida máxima: _%1$d/%2$d_.
items.weapon.melee.scalpel.name=bisturi
items.weapon.melee.scalpel.stats_desc=Esta arma faz o inimigo sangrar.
items.weapon.melee.scalpel.ability_name=ceifar
items.weapon.melee.scalpel.typical_ability_desc=A Duelista pode _ceifar_ um inimigo com um bisturi. Este ataque devastador tem acerto garantido e normalmente causa _%d de dano._ Esse dano é aplicado como sangramento se o alvo não for imune.
items.weapon.melee.scalpel.ability_desc=A Duelista pode _ceifar_ um inimigo com um bisturi. Este ataque devastador tem acerto garantido e causa _%d de dano._ Esse dano é aplicado como sangramento se o alvo não for imune.
items.weapon.melee.scalpel.desc=Uma ferramenta cirúrgica curta e afiada. Mal causa dano direto, mas parece boa para machucar inimigos.
items.weapon.missiles.alchemy.potothunder.name=pote de trovão
items.weapon.missiles.alchemy.potothunder.desc=Um raio dentro de um pequeno pote. Pequenos relâmpagos não param de sair do pote pontudo e, com um impacto, ele solta um relâmpago enorme que causa dano.
items.weapon.missiles.alchemy.potothunder.magic_damage=o relâmpago causa _%1$d-%2$d_ e paralisa o alvo.
items.weapon.melee.quick.quickweapon.cannot_reach=Você não alcança isso com esta arma.
items.weapon.melee.quick.quickweapon.no_enemy=Não há inimigo para atacar.
items.weapon.melee.quick.quickweapon.ac_slash=CORTAR
items.weapon.melee.quick.pocketknife.name=kris de bolso
items.weapon.melee.quick.pocketknife.desc=Uma pequena faca de bolso. Pode não causar muito dano aos inimigos, mas ajuda bastante a se proteger em emergências. Aprimorar esta arma permite consumi-la para aprimorar outra arma corpo a corpo.
items.weapon.melee.quick.pocketknife.stats_desc=Esta arma precisa ser usada pelos slots rápidos; não pode ser equipada do jeito normal.
items.weapon.melee.quick.pocketknife.upgraded=Você aprimorou esta arma e pode reforjá-la para aprimorar outra arma corpo a corpo.
items.weapon.melee.quick.pocketknife.ac_forge=REFORJAR
items.weapon.melee.quick.pocketknife.select_item=Escolha um item para aprimorar
items.item.discover_hint_alchemy_one=Este item pode ser obtido pela receita que usa _%s_.
items.item.discover_hint_alchemy_two=Este item pode ser obtido pela receita que usa _%1$s_ e _%2$s_.
items.gunsmithingtool.name=Ferramenta de Armeiro
items.gunsmithingtool.desc=Um conjunto de ferramentas para modificar armas de fogo de vários jeitos. Some depois de um uso, mas você pode usar várias ferramentas de armeiro para fazer modificações diferentes.
items.gunsmithingtool.inv_title=Escolha uma arma de fogo para modificar
items.gunsmithingtool.ac_use=Usar
items.gunsmithingtool.mod_select=Escolha o que modificar na arma de fogo
items.gunsmithingtool.cancel=Cancelar
items.gunsmithingtool.barrel=Modificação do cano
items.gunsmithingtool$wndmod.normal_barrel=Remover modificação do cano
items.gunsmithingtool$wndmod.short_barrel=Cano curto
items.gunsmithingtool$wndmod.long_barrel=Cano longo
items.gunsmithingtool.barrel_desc=A _Modificação do cano_ ajusta a _precisão das balas_ mudando o comprimento do cano.\n\n_Cano curto:_\n- Precisão a longa distância _x0,5_\n- Precisão a curta distância _x1,5_\n\n_Cano longo:_\n- Precisão a longa distância _x1,25_\n- Precisão a curta distância _x0,75_
items.gunsmithingtool.magazine=Modificação do pente
items.gunsmithingtool$wndmod.normal_magazine=Remover modificação do pente
items.gunsmithingtool$wndmod.large_magazine=Pente grande
items.gunsmithingtool$wndmod.quick_magazine=Pente de saque rápido
items.gunsmithingtool.magazine_desc=A _Modificação do pente_ ajusta a _munição máxima_ e o _tempo de recarga_ mudando o tamanho do pente.\n\n_Pente grande:_\n- Munição máxima _x1,5_\n- Tempo de recarga _+1 turno_\n\n_Pente de saque rápido:_\n- Munição máxima _x0,5_\n- Tempo de recarga _-1 turno_
items.gunsmithingtool.bullet=Modificação de munição
items.gunsmithingtool$wndmod.normal_bullet=Remover modificação de munição
items.gunsmithingtool$wndmod.hp_bullet=Munição de ponta oca
items.gunsmithingtool$wndmod.ap_bullet=Munição perfurante
items.gunsmithingtool.bullet_desc=A _Modificação de munição_ ajusta o _dano_ e a _penetração de armadura_ das balas mudando o tipo delas.\n\n_Munição de ponta oca:_\n- Dano da bala _x1,3_\n- Penetração de armadura _x2_\n\n_Munição perfurante:_\n- Dano da bala _x0,8_\n- Penetração de armadura _x0_
items.gunsmithingtool.weight=Modificação de peso
items.gunsmithingtool$wndmod.normal_weight=Remover modificação de peso
items.gunsmithingtool$wndmod.light_weight=Leve
items.gunsmithingtool$wndmod.heavy_weight=Pesado
items.gunsmithingtool.weight_desc=A _Modificação de peso_ ajusta o _tier da arma de fogo_ mudando por completo o desempenho dela.\n\n_Leve: -1 tier_\n\n_Pesado: +1 tier_
items.gunsmithingtool.attach=Modificação de acessório
items.gunsmithingtool$wndmod.normal_attach=Remover modificação de acessório
items.gunsmithingtool$wndmod.laser_attach=Mira laser
items.gunsmithingtool$wndmod.flash_attach=Lanterna
items.gunsmithingtool.attach_desc=A _Modificação de acessório_ reforça os _efeitos especiais_ prendendo dispositivos ópticos à arma de fogo.\n\n_Mira laser:_\n- Precisão das balas _x1,25_\n- Chance de ser detectado pelos inimigos _+1 nível_\n\n_Lanterna:_\n- Ao acertar um ataque, tem _50%-10%*(distância até o alvo)_ de chance de causar _cegueira breve_ no inimigo\n- Chance de ser detectado pelos inimigos _+2 níveis_
items.gunsmithingtool.enchant=Modificação mágica
items.gunsmithingtool$wndmod.normal_enchant=Remover modificação mágica
items.gunsmithingtool$wndmod.amp_enchant=Amplificação
items.gunsmithingtool$wndmod.sup_enchant=Supressão
items.gunsmithingtool.enchant_desc=A _Modificação mágica_ ajusta o _dano das balas_ e o _desempenho mágico_ aplicado a elas, mudando o mecanismo que aplica magia na arma de fogo.\n\n_Amplificação:_\n- Dano da bala _x0,75_\n- Desempenho mágico _x2_\n\n_Supressão:_\n- Dano da bala _x1,25_\n- Desempenho mágico _x0,5_
items.bulletitem.name=Munição
items.bulletitem.desc=Munição em geral para armas de fogo ou armas a distância. Não ocupa espaço no inventário e é usada sempre que você precisa de munição.
items.bulletbelt.name=Cartucheira
items.bulletbelt.desc=Feita para carregar com facilidade várias balas presas juntas. Usar a cartucheira dá a você uma grande quantidade de munição.
items.bulletbelt.ac_use=Usar
items.weapon.melee.gun.gun.ondeath=Uma explosão te engoliu e você morreu...
items.weapon.melee.gun.gun.ac_shoot=Atirar
items.weapon.melee.gun.gun.ac_reload=Recarregar
items.weapon.melee.gun.gun.ability_name=Recarga Rápida
items.weapon.melee.gun.gun.ability_desc=Quem luta com armas de fogo pode usar a _Recarga Rápida_. Esta habilidade recarrega na hora a arma de fogo equipada, sem gastar turno nem munição. Se a arma já estiver com a munição no máximo, recarrega até o dobro da capacidade máxima. Esta habilidade consome 2 cargas.
items.weapon.melee.gun.gun.overloaded=Um pente extra já está carregado.
items.weapon.melee.gun.gun.not_equipped=Você precisa equipar uma arma de fogo para usar isso.
items.weapon.melee.gun.gun.already_loaded=Toda a munição já está carregada.
items.weapon.melee.gun.gun.reload=Você recarregou a arma de fogo.
items.weapon.melee.gun.gun.less_bullet=Munição insuficiente para recarregar.
items.weapon.melee.gun.gun.gun_desc=Esta arma de fogo dispara _%1$s_ balas por tiro, cada uma causando _%2$s_-_%3$s_ de dano. No momento, _%4$s_/_%5$s_ balas estão carregadas. Dá para recarregar depois de usar _%6$s_ cargas e gastar _%7$s_ de munição.
items.weapon.melee.gun.gun.gun_typical_desc=Esta arma de fogo dispara _%1$s_ balas por tiro, cada uma normalmente causando _%2$s_-_%3$s_ de dano. No momento, _%4$s_/_%5$s_ balas estão carregadas. Dá para recarregar depois de usar _%6$s_ cargas e gastar _%7$s_ de munição.
