items.armor.clericarmor.name=Vestimenta do herói
items.armor.clericarmor.desc=Enquanto estiver usando esta mistura de pano e placa, o Clérigo pode realizar uma habilidade especial.

items.armor.clotharmor.name=armadura de pano
items.armor.clotharmor.desc=Esta leve armadura oferece uma proteção básica.
items.armor.clotharmor.discover_hint=Um dos heróis inicia com este item.

items.armor.duelistarmor.name=peitoral do herói
items.armor.duelistarmor.desc=Enquanto estiver usando esta armadura de placa e capa, a Duelista pode realizar uma habilidade especial.

items.armor.huntressarmor.name=capa do herói
items.armor.huntressarmor.no_enemies=Nenhum inimigo à vista
items.armor.huntressarmor.desc=Enquanto estiver usando esta capa, a Caçadora poderá executar uma habilidade especial.

items.armor.leatherarmor.name=armadura de couro
items.armor.leatherarmor.desc=Armadura feita de couro de monstro curtido. Não é tão leve quanto uma armadura de pano, mas oferece uma melhor proteção.

items.armor.magearmor.name=túnica do herói
items.armor.magearmor.desc=Enquanto estiver usando esta esplendorosa túnica, o Mago poderá executar uma habilidade especial.

items.armor.mailarmor.name=armadura de malha
items.armor.mailarmor.desc=Elos de metal interligados criam uma armadura resistente, mas flexível.

items.armor.platearmor.name=armadura de placa
items.armor.platearmor.desc=Enormes placas de metal unidas em um traje que fornece proteção inigualável a qualquer aventureiro forte o suficiente para suportar seu peso descomunal.

items.armor.roguearmor.name=traje do herói
items.armor.roguearmor.desc=Enquanto estiver usando este traje escuro, o Ladino poderá executar uma habilidade especial.

items.armor.scalearmor.name=armadura de escamas
items.armor.scalearmor.desc=Escamas de metal foram costuradas em um colete de couro para formar uma armadura flexível e reforçada.

items.armor.warriorarmor.name=armadura de placa do herói
items.armor.warriorarmor.desc=Enquanto estiver usando esta armadura de placa pesada, o Guerreiro poderá executar uma habilidade especial.



###artifacts
items.artifacts.alchemiststoolkit.name=kit de ferramentas do alquimista
items.artifacts.alchemiststoolkit.ac_brew=MISTURAR
items.artifacts.alchemiststoolkit.ac_energize=ENERGIZAR
items.artifacts.alchemiststoolkit.not_ready=Seu kit de ferramentas ainda não terminou de se aquecer.
items.artifacts.alchemiststoolkit.cursed=Seu kit de ferramentas amaldiçoado impede que você use alquimia!
items.artifacts.alchemiststoolkit.need_energy=Você precisa de pelo menos 6 energias para isso.
items.artifacts.alchemiststoolkit.energize_desc=Cada 6 cristais de energia darão ao kit de ferramentas energia suficiente para ganhar um nível, o que aumenta a taxa com que o kit de ferramentas gera energia ao longo do tempo e a rapidez com que aquece.\n\nQuanta energia você gostaria de usar?
items.artifacts.alchemiststoolkit.energize_1=6 energias: +1 nível
items.artifacts.alchemiststoolkit.energize_all=%1$d energias: +%2$d níveis
items.artifacts.alchemiststoolkit.desc=Este kit de ferramentas contém um número de reagentes e ervas, junto com um frasco pequeno de mistura, permitindo a alquimia em movimento. O frasco contém o que parece ser cristais de energia alquímica em forma líquida.
items.artifacts.alchemiststoolkit.desc_cursed=O kit de ferramentas amaldiçoado se prendeu ao seu corpo e se recusa a deixar você praticar alquimia.
items.artifacts.alchemiststoolkit.desc_warming=O kit de ferramentas está aquecendo e ficará pronto para uso depois de um tempo.
items.artifacts.alchemiststoolkit.desc_hint=O kit de ferramentas equipado está lentamente gerando energia alquímica à medida que você ganha experiência. Parece que a mistura no frasco pode ser melhorada adicionando-se cristais de energia.

items.artifacts.artifact.cannot_wear_two=Você não pode usar dois artefatos iguais.
items.artifacts.artifact.equip_cursed=Este artefato se prendeu dolorosamente a você.
items.artifacts.artifact.curse_known=Você sente uma magia maligna pulsando deste artefato.
items.artifacts.artifact.not_cursed=Este artefato está livre de magia maléfica.
items.artifacts.artifact.need_to_equip=Você precisa equipar o seu artefato para fazer isso.

items.artifacts.capeofthorns.name=capa dos espinhos
items.artifacts.capeofthorns.desc=Estas chapas de metal colapsadas do DM-300 formaram uma rígida capa. Elas parece armazenar uma energia profunda, talvez tenha algum poder do DM-300?
items.artifacts.capeofthorns.desc_inactive=Você sente a capa tranquilamente pesada em seus ombros, parece estar ganhando energia com os danos que você recebe.
items.artifacts.capeofthorns.desc_active=A capa parece estar liberando energia armazenada, ela está irradiando um poder protetor.
items.artifacts.capeofthorns$thorns.inert=Sua Capa se torna inerte novamente.
items.artifacts.capeofthorns$thorns.radiating=Sua Capa começa a irradiar energia, você se sente protegido!
items.artifacts.capeofthorns$thorns.levelup=Sua Capa se torna mais forte!
items.artifacts.capeofthorns$thorns.name=espinhos
items.artifacts.capeofthorns$thorns.desc=Sua capa está irradiando energia, cercando você com um campo de força defletora!\n\nTodo o dano recebido é reduzido enquanto o efeito dos espinhos esta ativado. Adicionalmente, se o atacante está próximo a você, o dano reduzido é defletido de volta ao atacante!\n\nTurnos de espinhos restantes: %s.

items.artifacts.chaliceofblood.name=cálice de sangue
items.artifacts.chaliceofblood.ac_prick=FURAR
items.artifacts.chaliceofblood.yes=Sim, sei o que faço
items.artifacts.chaliceofblood.no=Não, eu mudei de ideia
items.artifacts.chaliceofblood.prick_warn=A cada vez que usa o cálice, ele drena mais da sua energia vital, mas, em troca, potencializa mais sua regeneração natural de vida.\n\nAtualmente, espetar-se causará _%1$d-%2$d de dano_, embora esse dano possa ser reduzido por _bloqueios tanto físicos quanto mágicos, ou por redução de dano. Sem considerar os efeitos de redução de dano, espetar-se tem uma chance de _%3$s%%_ de drenar completamente sua energia vital.\n\nTem certeza de que deseja oferecer mais energia vital ao cálice?
items.artifacts.chaliceofblood.onprick=Você se fura e sua essência vital é drenada para dentro do cálice.
items.artifacts.chaliceofblood.ondeath=O Cálice drenou completamente a sua essência vital...
items.artifacts.chaliceofblood.desc=Este reluzente cálice de prata é estranhamente adornado com gemas preciosas afiadas na borda.
items.artifacts.chaliceofblood.desc_cursed=O cálice amaldiçoado se prendeu à sua mão e está inibindo a sua habilidade de regenerar vida.
items.artifacts.chaliceofblood.desc_1=Enquanto segura o cálice, você se sente estranhamente compelido a se furar nas gemas afiadas.
items.artifacts.chaliceofblood.desc_2=Um pouco do seu sangue está acumulado dentro do cálice, você sente o cálice sutilmente nutrindo você com energia vital, potencializando sua regeneração natural de vida. Você ainda quer se cortar no cálice, mesmo sabendo que irá doer.
items.artifacts.chaliceofblood.desc_3=O cálice está cheio até a borda com a sua essência vital. Você pode sentir o cálice transbordando energia vital de volta para você.

items.artifacts.cloakofshadows.name=capa das sombras
items.artifacts.cloakofshadows.ac_stealth=INVISÍVEL
items.artifacts.cloakofshadows.cooldown=Sua capa precisa de mais %d para se reenergizar.
items.artifacts.cloakofshadows.cursed=Você não pode usar uma capa amaldiçoada.
items.artifacts.cloakofshadows.no_charge=Sua capa ainda não carregou o suficiente para ser utilizada.
items.artifacts.cloakofshadows.desc=Uma capa mágica de valor inestimável, roubada do arsenal real há muitos anos pelo Ladino. Quando usada, ela se torna completamente invisível por um curto período de tempo .\n\nQuanto mais for usada, mais forte ela se tornará, permitindo ao ladino se tornar invisível mais frequentemente e por períodos maiores.
items.artifacts.cloakofshadows.discover_hint=Um dos heróis inicia com este item.
items.artifacts.cloakofshadows$cloakstealth.no_charge=A capa ficou sem energia
items.artifacts.cloakofshadows$cloakstealth.levelup=Sua capa cresceu em força
items.artifacts.cloakofshadows$cloakstealth.name=encoberto
items.artifacts.cloakofshadows$cloakstealth.desc=Sua capa das sombras está lhe garantindo invisibilidade enquanto você está encoberto por ela. Você permanecerá invisível até que a invisibilidade seja interrompida ou sua capa fique sem carga.\n\nEnquanto você estiver invisível, inimigos são incapazes de atacar ou segui-lo . Ataques físicos e efeitos mágicos (tais como pergaminhos e varinhas) irão interromper imediatamente a invisibilidade.\n\nTurnos até o uso de carga: %d.

items.artifacts.driedrose.name=rosa murcha
items.artifacts.driedrose.ac_summon=INVOCAR
items.artifacts.driedrose.ac_direct=LIDERAR
items.artifacts.driedrose.ac_outfit=EQUIPAMENTO
items.artifacts.driedrose.spawned=Você já invocou o fantasma.
