items.arrowbag.mode_desc=Ciclo usa um efeito guardado por acerto, na ordem dos slots. Aleatório escolhe um efeito guardado por acerto. Slots vazios são pulados.
items.arrowbag.empty=Nenhum efeito guardado. Infunda uma poção, semente ou água benta para preencher um slot.
items.arrowbag.manage_desc=Escolha um efeito para descartá-lo, ou toque no botão de informação para ver o que ele faz. Infunda o mesmo ingrediente de novo para somar cargas, mesmo com os quatro slots cheios.
items.arrowbag.remove_desc=Descartar este efeito e as %d cargas que restam? O ingrediente não é devolvido.
items.arrowbag.remove=Descartar efeito
items.arrowbag.cancel=Cancelar
items.arrowbag.holy_effect=Cada acerto infundido cura você um pouco e explode em energia sagrada contra o alvo.
items.arrowbag.settings=Efeitos: %1$d/%2$d. Modo: %3$s. Chance de poupar uma carga: %4$d%%.
