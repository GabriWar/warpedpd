items.weapon.melee.magestaff.typical_ability_desc=A Duelista pode dar uma _estocada arcana_ em linha reta de até 3 quadrados. Ela atinge como um raio de força, ignorando armadura, causando normalmente _%1$d-%2$d de dano_, não erra e empurra o alvo um quadrado para trás. Custa 1 carga.
