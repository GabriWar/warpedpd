items.armor.armor.cursed=Você consegue sentir uma magia malévola se esgueirando por dentro desta armadura.
items.armor.armor.weak_cursed=Apesar da maldição, você é capaz de remover esta armadura.
items.armor.armor.not_cursed=Esta armadura está livre de magia maléfica
items.armor.armor.seal_attached=O selo quebrado do Guerreiro está fixado a esta armadura. Quando ele estiver prestes a ser ferido para menos da metade da sua vida, será concedido-lhe _%d de blindagem_.
items.armor.armor.seal_transfer=O selo quebrado do Guerreiro deve ser afixado à armadura que ele está usando para beneficiá-lo. Você gostaria de desprender automaticamente o selo da armadura que está retirando e afixá-lo à armadura que está equipando?
