items.artifacts.candleofmindvision.ac_snuff=APAGAR
items.artifacts.candleofmindvision.lit=Você acende a vela, e as paredes param de esconder o que há atrás delas.
items.artifacts.candleofmindvision.snuffed=Você apaga a vela.
items.artifacts.candleofmindvision.spent=A vela queimou até não sobrar nada.
items.artifacts.candleofmindvision.burnt_out=Sua vela bruxuleia e se apaga.
