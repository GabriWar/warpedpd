items.weapon.melee.mirrordoll.typical_ability_desc=A Duelista pode erguer o espelho da boneca e _trocar_ de lugar com qualquer inimigo à vista. O inimigo sai do espelho cego normalmente por _%d turnos_. Inimigos imóveis não podem ser trocados. Custa 2 cargas.
