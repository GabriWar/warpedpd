items.weapon.melee.prayerwheel.ability_name=girar a roda
items.weapon.melee.prayerwheel.typical_ability_desc=A Duelista pode _girar a roda_. Isso não gasta tempo: ela fica abençoada normalmente por _%d turnos_, uma aflição sobre ela é removida e a contagem da própria roda avança três.
items.weapon.melee.prayerwheel.ability_desc=A Duelista pode _girar a roda_. Isso não gasta tempo: ela fica abençoada por _%d turnos_, uma aflição sobre ela é removida e a contagem da própria roda avança três.
