items.weapon.melee.fightgloves.typical_ability_desc=A Duelista pode soltar uma _rajada_ de três jabs que não erram num inimigo adjacente, cada um normalmente causando _%d%% de dano_. Se os três acertarem, o inimigo fica aturdido por um turno. Custa 2 cargas.
items.weapon.melee.fightgloves.ability_desc=A Duelista pode soltar uma _rajada_ de três jabs que não erram num inimigo adjacente, cada um causando _%d%% de dano_. Se os três acertarem, o inimigo fica aturdido por um turno. Custa 2 cargas.
