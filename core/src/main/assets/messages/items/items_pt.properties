items.weapon.melee.sword.name=espada
items.weapon.melee.sword.ability_name=cortar
items.weapon.melee.sword.typical_ability_desc=A Duelista pode _cortar_ um inimigo com uma espada. Isso normalmente causa _%1$d-%2$d de dano_ e tem acerto garantido. Se a habilidade matar um inimigo, a ação é instantânea e a Duelista pode usar cortar novamente em 5 turnos sem custo.
items.weapon.melee.sword.ability_desc=A Duelista pode _cortar_ um inimigo com uma espada. Isso causa _%1$d-%2$d de dano_ e tem acerto garantido. Se a habilidade matar um inimigo, a ação é instantânea e a Duelista pode usar cortar novamente em 5 turnos sem custo.
items.weapon.melee.sword.desc=Uma espada bem balanceada. Não é muito grande, mas ainda é notavelmente maior do que uma espada curta.
items.weapon.melee.sword$cleavetracker.name=cortar
items.weapon.melee.sword$cleavetracker.desc=A Duelista está pronta para dar continuidade ao seu corte anterior. O próximo uso de cortar não custará nenhuma carga de habilidade de arma.\n\nTurnos restantes: %s.

items.weapon.melee.warhammer.name=martelo de guerra
items.weapon.melee.warhammer.stats_desc=Esta é uma arma precisa.
items.weapon.melee.warhammer.ability_name=Golpe pesado
items.weapon.melee.warhammer.typical_ability_desc=A Duelista pode realizar um _golpe pesado_ com um martelo de guerra. Esse ataque concentrado normalmente causa _%1$d-%2$d de dano_ se acertar o inimigo de surpresa e atordoa por 5 turnos, reduzindo a precisão e evasão em 50%%. Golpe pesado tem acerto garantido, mas causa dano regular se o inimigo não for pego de surpresa.
items.weapon.melee.warhammer.ability_desc=A Duelista pode realizar um _golpe pesado_ com um martelo de guerra. Esse ataque concentrado causa _%1$d-%2$d de dano_ se acertar o inimigo de surpresa e atordoa por 5 turnos, reduzindo a precisão e evasão em 50%%. Golpe pesado tem acerto garantido, mas causa dano regular se o inimigo não for pego de surpresa.
items.weapon.melee.warhammer.desc=Poucas criaturas conseguem suportar o golpe esmagador desta massa imponente de chumbo e aço, mas é preciso muita força para usá-la com eficiência.

items.weapon.melee.warscythe.name=foice de guerra
items.weapon.melee.warscythe.stats_desc=Esta é uma arma pouco precisa.
items.weapon.melee.warscythe.ability_name=ceifar
items.weapon.melee.warscythe.typical_ability_desc=A Duelista pode _ceifar_ um inimigo com uma foice de guerra. Este ataque devastador tem garantia de acerto e normalmente causa _ %d de dano_. Esse dano é aplicado como sangramento se o alvo não for imune.
items.weapon.melee.warscythe.ability_desc=A Duelista pode _ceifar_ um inimigo com uma foice de guerra. Este ataque devastador tem garantia de acerto e causa _ %d de dano_. Esse dano é aplicado como sangramento se o alvo não for imune.
items.weapon.melee.warscythe.desc=Esta ferramenta grande e pesada foi reforçada para torná-la melhor em cortar inimigos do que colheitas.

items.weapon.melee.whip.name=chicote
items.weapon.melee.whip.stats_desc=Esta arma possui um tremendo alcance.
items.weapon.melee.whip.ability_name=chicotear
items.weapon.melee.whip.typical_ability_desc=A Duelista pode _chicotear_ todos os inimigos envolta dela com o chicote. Essa habilidade normalmente causa _%1$d-%2$d de dano_, atinge todos os inimigos na área de alcance e tem acerto garantido.
items.weapon.melee.whip.ability_desc=A Duelista pode _chicotear_ todos os inimigos envolta dela com o chicote. Essa habilidade causa _%1$d-%2$d de dano_, atinge todos os inimigos na área de alcance e tem acerto garantido.
items.weapon.melee.whip.desc=Embora o comprimento de corda farpado no fim desta arma inflija pouco dano, nada se compara ao seu alcance.

items.weapon.melee.wornshortsword.name=espada curta desgastada
items.weapon.melee.wornshortsword.ability_name=cortar
items.weapon.melee.wornshortsword.typical_ability_desc=A Duelista pode _cortar_ um inimigo com uma espada curta desgastada. Isso normalmente causa _%1$d-%2$d de dano_ e tem acerto garantido. Se a habilidade matar um inimigo, a ação é instantânea e a Duelista pode usar cortar novamente em 5 turnos sem custo.
items.weapon.melee.wornshortsword.ability_desc=A Duelista pode _cortar_ um inimigo com uma espada curta desgastada. Isso causa _%1$d-%2$d de dano_ e tem acerto garantido. Se a habilidade matar um inimigo, a ação é instantânea e a Duelista pode usar cortar novamente em 5 turnos sem custo.
items.weapon.melee.wornshortsword.desc=Uma espada levemente curta, um pouco deteriorada por muito uso. É fraca e mais leve que uma espada curta em melhores condições.
items.weapon.melee.wornshortsword.discover_hint=Um dos heróis inicia com este item.


###missile weapons
items.weapon.missiles.darts.adrenalinedart.name=dardo de adrenalina
items.weapon.missiles.darts.adrenalinedart.desc=Estes dardos são embebidos num composto à base de cardo-ligeiro que aumentará a velocidade de movimento e ataque dos aliados ou diminuirá brevemente a velocidade de movimento dos inimigos. O dardo em si ainda é prejudicial aos inimigos, mas não prejudicará os aliados.

items.weapon.missiles.darts.blindingdart.name=dardo cegante
items.weapon.missiles.darts.blindingdart.desc=Estes dardos são embebidos em um composto à base de ceguerva que irá cegar seu alvo por um curto período de tempo. Eles não desorientam, portanto, um inimigo ainda saberá onde viu você pela última vez.

items.weapon.missiles.darts.chillingdart.name=dardo congelante
items.weapon.missiles.darts.chillingdart.desc=Estes dardos são embebidos em um composto à base de muda-de-gelo que irá esfriar significativamente o seu alvo.

items.weapon.missiles.darts.cleansingdart.name=Dardo da limpeza
items.weapon.missiles.darts.cleansingdart.desc=Estes dardos são embebidos num composto à base de magi-real que tornará temporariamente os aliados imunes a todos os efeitos negativos ou limpará os efeitos positivos dos inimigos. Os inimigos podem até esquecer brevemente que estão atacando ou fugindo de você. O dardo em si ainda é prejudicial aos inimigos, mas não prejudicará os aliados.

items.weapon.missiles.darts.dart.name=dardo
items.weapon.missiles.darts.dart.ac_tip=EMBEBER
items.weapon.missiles.darts.dart.prompt=selecione uma semente.
items.weapon.missiles.darts.dart.tip_title=Dardos Embebidos
items.weapon.missiles.darts.dart.tip_desc=Uma semente pode ser combinada com um ou dois dardos para embebê-los. Cada tipo de semente produz seu próprio tipo de dardo embebido, com um efeito especial de uso único.\n\nEmbeber dardos com este tipo de semente produzirá _%s._
items.weapon.missiles.darts.dart.tip_all=embeber %1$d dardos com %2$d sementes
items.weapon.missiles.darts.dart.tip_two=embeber 2 dardos com 1 semente
items.weapon.missiles.darts.dart.tip_one=embeber 1 dardo com 1 semente
items.weapon.missiles.darts.dart.tip_cancel=cancelar
items.weapon.missiles.darts.dart.desc=Estes pedaços simples de madeira pontiaguda são feitos para voar e ferir suas presas com um movimento do pulso. Eles podem ser embebidos com sementes para ganhar efeitos bônus quando lançados.
items.weapon.missiles.darts.dart.unlimited_uses=Devido a sua construção simples, os dardos duram para sempre.

items.weapon.missiles.darts.displacingdart.name=dardos de deslocamento
items.weapon.missiles.darts.displacingdart.desc=Estes dardos são embebidos em um composto à base de folha-fantasma que irá teletransportar seu alvo a uma curta distância.

items.weapon.missiles.darts.healingdart.name=dardo de cura
items.weapon.missiles.darts.healingdart.desc=Estes dardos são embebidos com um composto à base de grama-solar que concede uma explosão de cura ao seu alvo. O dardo em si ainda é prejudicial aos inimigos, mas não irá prejudicar aliados.

items.weapon.missiles.darts.holydart.name=dardo sagrado
items.weapon.missiles.darts.holydart.desc=Estes dardos são embebidos num composto à base de flor-estrela que infunde energia sagrada em seu alvo. Aliados e inimigos normais serão abençoados, mas inimigos mortos-vivos ou demoníacos sofrerão grandes danos. O dardo em si ainda é prejudicial aos inimigos, mas não prejudicará os aliados.

items.weapon.missiles.darts.incendiarydart.name=dardo incendiário
items.weapon.missiles.darts.incendiarydart.desc=Estes dardos são embebidos com um composto à base de flor-de-fogo que explodirá em chamas brilhantes no impacto.

items.weapon.missiles.darts.paralyticdart.name=dardo paralítico
items.weapon.missiles.darts.paralyticdart.desc=Estes dardos são embebidos com um composto à base de terraíz que paralisará seu alvo por um curto período de tempo.

items.weapon.missiles.darts.poisondart.name=dardo envenenado
items.weapon.missiles.darts.poisondart.desc=Estes dardos são embebidos com um composto à base de sofrimusgo que envenenará seu alvo.

items.weapon.missiles.darts.rotdart.name=dardo corrosivo
items.weapon.missiles.darts.rotdart.desc=Estes perversos dardos são embebidos com um composto ácido à base de putrifruta, que corroerá agressivamente qualquer coisa com que o dardo entre em contato. Inimigos poderosos resistirão à maior parte do efeito, mas a corrosão é forte o suficiente para matar facilmente a maioria dos inimigos padrão. Duram mais do que outros dardos embebidos, mas sua durabilidade não pode ser aumentada.
items.weapon.missiles.darts.rotdart.discover_hint=Você pode criar este item usando uma semente de uma missão específica.

items.weapon.missiles.darts.shockingdart.name=dardo chocante
items.weapon.missiles.darts.shockingdart.desc=Estes dardos são embebidos com um composto à base de vinha-tempestuosa que irá causar um choque desagradável ao seu alvo.

items.weapon.missiles.darts.tippeddart.ac_clean=LIMPAR
items.weapon.missiles.darts.tippeddart.clean_title=Dardos Limpos
items.weapon.missiles.darts.tippeddart.clean_desc=Esta ação removerá o efeito das sementes nos seus dardos, revertendo-os de volta a dardos normais.
items.weapon.missiles.darts.tippeddart.clean_all=limpar tudo
items.weapon.missiles.darts.tippeddart.clean_one=limpar um
items.weapon.missiles.darts.tippeddart.cancel=cancelar
items.weapon.missiles.darts.tippeddart.uses_left=Esta pilha de dardos tem _%d/%d_ usos antes de expirar.
items.weapon.missiles.darts.tippeddart.unlimited_uses=_Mas estes são de tal qualidade que duram para sempre._
items.weapon.missiles.darts.tippeddart.about_to_break=A ponta do seu dardo está prestes a expirar.
items.weapon.missiles.darts.tippeddart.has_broken=A ponta do seu dardo expirou.
items.weapon.missiles.darts.tippeddart.discover_hint=Você pode comprar este item em uma loja ou criá-lo usando uma semente.


items.weapon.missiles.bolas.name=boleadeiras
items.weapon.missiles.bolas.stats_desc=Esta arma causa aleijamento no alvo.
items.weapon.missiles.bolas.desc=Estas armas de arremesso incomuns não causam muito dano, mas fazem um excelente trabalho ao retardar seu alvo.

items.weapon.missiles.boomerang.name=bumerangue
items.weapon.missiles.boomerang.desc=Ao ser jogado no inimigo, este projétil de madeira curvada irá retornar às mãos do jogador.
items.weapon.missiles.boomerang.durability=Devido à sua construção sólida, este bumerangue não vai quebrar com o uso.

items.weapon.missiles.fishingspear.name=lança de pesca
items.weapon.missiles.fishingspear.desc=Pequenas lanças de arremesso que funcionam bem como armas improvisadas, apesar de terem sido projetadas para pesca.

items.weapon.missiles.forcecube.name=cubo de força
items.weapon.missiles.forcecube.ondeath=Você se matou com o seu próprio Cubo de Força...
items.weapon.missiles.forcecube.stats_desc=Esta arma espalha a força do seu impacto sobre uma pequena área, atingindo tudo o que estiver por perto.
items.weapon.missiles.forcecube.desc=Estes cubos mágicos de formato estranho são pequenos o suficiente para segurar na mão, mas são incrivelmente pesados.

items.weapon.missiles.heavyboomerang.name=bumerangue pesado
items.weapon.missiles.heavyboomerang.stats_desc=Esta arma retorna ao local de onde foi arremessada após cinco turnos.
items.weapon.missiles.heavyboomerang.desc=Este bumerangue grande é difícil de manejar efetivamente, mas causará danos consideráveis.

items.weapon.missiles.javelin.name=javelin
items.weapon.missiles.javelin.desc=Estas grandes lanças de arremesso têm seu peso balanceado para manterem a sua ponta de ferro à frente enquanto viajam pelo ar.

items.weapon.missiles.kunai.name=kunai
items.weapon.missiles.kunai.stats_desc=Esta arma é mais forte contra inimigos distraídos.
items.weapon.missiles.kunai.desc=Estas facas pequenas são muito poderosas nas mãos de um usuário habilidoso.

items.weapon.missiles.missileweapon.stats_known=Este conjunto de armas de arremesso de _tier-%1$d_ causa _%2$d-%3$d de dano_ e requer _ %4$d de força_ para serem usadas.
items.weapon.missiles.missileweapon.stats_unknown=Normalmente, este conjunto de armas de arremesso de _tier-%1$d_ causa _%2$d-%3$d de dano_ e requer _%4$d de força_ para serem usadas.
items.weapon.missiles.missileweapon.stats_desc=
items.weapon.missiles.missileweapon.probably_too_heavy=Esta arma provavelmente é muito pesada para você.
items.weapon.missiles.missileweapon.distance=Armas de arremesso são mais precisas a distância, mas menos precisas de perto.
items.weapon.missiles.missileweapon.durability=Armas arremessadas se desgastam e quebram quando são usadas.
items.weapon.missiles.missileweapon.uses_left=Este conjunto de armas de arremesso tem _%d/ %d_ usos restantes antes que uma delas se quebre.
items.weapon.missiles.missileweapon.unlimited_uses=_Este conjunto é de tal qualidade que dura para sempre._
items.weapon.missiles.missileweapon.unknown_uses=Normalmente, este conjunto de armas de arremesso terá _%d_ usos antes de uma quebrar.
items.weapon.missiles.missileweapon.curse_discover=Esta arma de arremesso está amaldiçoada!
items.weapon.missiles.missileweapon.about_to_break=Sua arma de arremesso está prestes a quebrar.
items.weapon.missiles.missileweapon.has_broken=Uma de suas armas de arremesso quebrou.
items.weapon.missiles.missileweapon.dust=A arma de arremesso vira pó quando você a toca.
items.weapon.missiles.missileweapon.break_upgraded_warn_desc=Se a última arma de arremesso do seu conjunto de armas de arremesso aprimoradas quebrar, o conjunto será perdido permanentemente. Tem certeza de que deseja arremessá-la?
items.weapon.missiles.missileweapon.break_upgraded_warn_yes=Sim
items.weapon.missiles.missileweapon.break_upgraded_warn_no=Não
items.weapon.missiles.missileweapon$placeholder.name=arma de arremesso

items.weapon.missiles.shuriken.name=shuriken
items.weapon.missiles.shuriken.stats_desc=Shurikens podem ser lançadas instantaneamente com um tempo de recarga de 20 turnos.
items.weapon.missiles.shuriken.desc=Estas peças de metal em formato de estrela com lâminas afiadas podem ser arremessadas rapidamente em movimento.
items.weapon.missiles.shuriken$shurikeninstanttracker.name=Tempo de recarga da Shuriken
items.weapon.missiles.shuriken$shurikeninstanttracker.desc=Você lançou uma shuriken instantaneamente recentemente e deve esperar antes de fazê-lo novamente. Shurikens ainda podem ser lançadas, mas na velocidade normal da arma.\n\nTurnos Restantes: %s.

items.weapon.missiles.throwingclub.name=bastão de arremesso
items.weapon.missiles.throwingclub.stats_desc=Esta arma não se prende aos inimigos e pode ser coletada instantaneamente.
items.weapon.missiles.throwingclub.desc=Uma arma de arremesso relativamente simples, mas durável, essencialmente uma grande rocha presa a um bastão.

items.weapon.missiles.throwinghammer.name=martelo de arremesso
items.weapon.missiles.throwinghammer.stats_desc=Esta arma não se prende aos inimigos e pode ser coletada instantaneamente.
items.weapon.missiles.throwinghammer.desc=Estes martelos pesados são projetados para serem jogados em um inimigo. Sua construção lisa toda em metal significa que são bastante duráveis.

items.weapon.missiles.throwingknife.name=faca de arremesso
items.weapon.missiles.throwingknife.stats_desc=Esta arma é mais forte contra inimigos distraídos.
items.weapon.missiles.throwingknife.desc=Estas facas leves são balanceadas para cortar o ar diretamente até o alvo.
items.weapon.missiles.throwingknife.discover_hint=Um dos heróis inicia com este item.

items.weapon.missiles.throwingspear.name=lança de arremesso
items.weapon.missiles.throwingspear.desc=Estas lanças leves têm armações finas que são projetadas para serem lançadas e não empunhadas.

items.weapon.missiles.throwingspike.name=agulha de arremesso
items.weapon.missiles.throwingspike.desc=Estas agulhas pontiagudas de metal duráveis são feitas para serem arremessadas em inimigos distantes.
items.weapon.missiles.throwingspike.discover_hint=Um dos heróis inicia com este item.

items.weapon.missiles.throwingstone.name=pedra de arremesso
items.weapon.missiles.throwingstone.desc=Estas pedras são lixadas para que possam ser jogadas com mais força do que uma pedra comum.
items.weapon.missiles.throwingstone.discover_hint=Um dos heróis inicia com este item.

items.weapon.missiles.tomahawk.name=tomahawk
items.weapon.missiles.tomahawk.stats_desc=Esta arma causa _%1$d-%2$d de sangramento_ ao seu alvo.
items.weapon.missiles.tomahawk.typical_stats_desc=Esta arma normalmente causa _%1$d-%2$d de sangramento_ ao seu alvo.
items.weapon.missiles.tomahawk.desc=Estes machados de arremesso têm lâminas serrilhadas que vão rasgando o inimigo quando se cravam nele.

items.weapon.missiles.trident.name=tridente
items.weapon.missiles.trident.desc=Lanças de arremesso maciças com três dentes mortais na ponta. Elas são poderosas, mas bem pesadas.


items.weapon.spiritbow.name=arco espiritual
items.weapon.spiritbow.ac_shoot=ATIRAR
items.weapon.spiritbow.prompt=Escolha um alvo
items.weapon.spiritbow.stats=O arco não pode ser aprimorado diretamente, ele ficará mais forte à medida que você sobe de nível. No seu nível atual, as flechas disparadas do arco causarão _%1$d-%2$d de dano_ e exige _%3$d de força_ para ser usado apropriadamente.
items.weapon.spiritbow.desc=Um arco feito de madeira mágica antiga. As cordas e gravuras do arco brilham com uma luz azul clara. Quando a corda é puxada, este arco irá conjurar uma flecha mágica que pode ser disparada contra um inimigo.
items.weapon.spiritbow.discover_hint=Um dos heróis inicia com este item.

items.weapon.weapon.identify=Você agora está suficientemente familiarizado com a sua arma para poder identificá-la.
items.weapon.weapon.too_heavy=Devido à sua força inadequada, a sua velocidade, precisão e habilidade de ataque surpresa serão menores enquanto usar esta arma.
items.weapon.weapon.excess_str=Por causa do seu excesso de força, você causará _0-%d de dano extra_ com esta arma.
items.weapon.weapon.hardening_gone=O endurecimento desta arma acabou!
items.weapon.weapon.incompatible=A interação de diferentes tipos de magia anulou o encantamento desta arma!
items.weapon.weapon.cursed_worn=Esta arma está amaldiçoada, você é incapaz de removê-la.
items.weapon.weapon.cursed=Você sente uma magia maligna à espreita dentro desta arma.
items.weapon.weapon.weak_cursed=Apesar da maldição, você consegue desequipar esta arma.
items.weapon.weapon.not_cursed=Esta arma está livre de magia malévola.
items.weapon.weapon.faster=Possui alteração para aumentar a _velocidade._
items.weapon.weapon.stronger=Possui alteração para aumentar o _dano._
items.weapon.weapon.enchanted=Está com _%s._
items.weapon.weapon.enchant_hardened=Foi _endurecido._
items.weapon.weapon.hardened_no_enchant=Esta arma foi _endurecida_, mas não está encantada no momento.
items.weapon.weapon$enchantment.enchant=encantamento
items.weapon.weapon$enchantment.rankings_desc=Morto por um encantamento
items.weapon.weapon$enchantment.discover_hint=Você pode encontrar um item com este efeito aleatoriamente na masmorra ou tentar aplicá-lo a um item você mesmo.


###misc items
items.amulet.name=amuleto de yendor
items.amulet.ac_end=TERMINAR O JOGO
items.amulet.desc=O Amuleto de Yendor é o artefato mais poderoso conhecido por humanos ou anões. Seus cristais reluzentes contêm um incrível e assombroso poder.
items.amulet.desc_origins=As origens do amuleto são desconhecidas. A história diz que o Rei dos Anões se gabou de ter descoberto o artefato pouco antes de a civilização anã cortar todo o contato. Como ele encontrou? Como Yog-Dzewa tomou dele? Perguntas para outro momento talvez, tudo o que importa agora é que o amuleto é seu!
items.amulet.desc_ascent=As origens do amuleto são desconhecidas, mas claramente foi fortemente influenciada pelo poder de Yog-Dzewa. A masmorra parece estar se submetendo à vontade de Yog conforme você se move por ela, tornando os inimigos muito mais abundantes e poderosos! Você também não pode mais ativar ou descartar o amuleto, quase como se estivesse amaldiçoado.
items.amulet.ascent_title=Ascensão
items.amulet.ascent_desc=Você começa a sentir o grande e terrível poder de Yog-Dzewa irradiando do amuleto. Subir de volta pela masmorra como um mortal pode ser mais difícil do que você pensava!\n\nSe você continuar subindo com o amuleto, a masmorra se tornará mais perigosa, os teletransportes entre os andares serão desativados e você só poderá vencer o jogo derrotando os inimigos enquanto sobe pela masmorra!\n\nVocê pode deixar o amuleto aqui por enquanto se quiser subir sem iniciar este desafio, ou ativar o amuleto antes de subir para terminar o jogo normalmente.
items.amulet.ascent_yes=Continuar!
items.amulet.ascent_no=Parar por agora
items.amulet.discover_hint=Você pode encontrar este item no fundo da masmorra...

items.ankh.name=ankh
items.ankh.ac_bless=ABENÇOAR
items.ankh.bless=Você abençoa o ankh com água mágica.
items.ankh.desc=Este antigo símbolo de imortalidade concede a habilidade de retornar à vida após a morte. A maioria de seus itens serão deixados onde você morreu, mas poderão ser recuperados se você os pegar. Utilizando um odre cheio, o ankh pode ser abençoado com força adicional.
items.ankh.desc_blessed=Este antigo símbolo de imortalidade concede a habilidade de retornar da vida-após-a-morte. Este ankh foi abençoado com força extra e é agora muito mais forte. Agora o ankh irá se sacrificar para salvar você em um momento de perigo mortal.
items.ankh.discover_hint=Você pode comprar este item em uma loja.

items.arcaneresin.name=resina arcana
items.arcaneresin.prompt=Selecione uma varinha
items.arcaneresin.ac_apply=APLICAR
items.arcaneresin.level_too_high=Esta varinha é muito poderosa para ser melhorada pela resina.
items.arcaneresin.not_enough=Você não tem resina suficiente para isso!
items.arcaneresin.apply=Você reveste sua varinha com resina, aumentando seu poder!
items.arcaneresin.desc=Este fino pó reluz entre tons de branco e roxo. Ele pode agir como um amplificador de energia mágica, melhorando o nível de suas varinhas quando aplicado a elas!\n\nAprimorar uma varinha custa 1, 2 ou 3 de resina dependendo do nível inicial dela. Resina pode melhorar varinhas para um máximo de +3.\n\nEntretanto, os aprimoramentos através da resina são _sobrescritos por outras fontes de aprimoramento_ (como pergaminhos do aprimoramento) e não se aplicam quando a varinha é imbuída ao cajado do Mago.
items.arcaneresin.discover_hint=Você pode fabricar este item através de alquimia.

items.brokenseal.name=selo quebrado
items.brokenseal.ac_affix=AFIXAR
items.brokenseal.prompt=Escolha uma armadura
items.brokenseal.unknown_armor=Você deve primeiro identificar se a armadura está ou não amaldiçoada.
items.brokenseal.cursed_armor=O selo não se aplica a armaduras amaldiçoadas.
items.brokenseal.affix=Você equipa o selo na armadura!
items.brokenseal.desc=Um selo de cera, afixado à armadura como símbolo de valor. Possui uma runa desbotada de proteção gravada no centro e está rachado ao meio.\n\nUma lembrança de seu lar, o selo ajuda o guerreiro a seguir em frente. Enquanto estiver usando o selo, o guerreiro ganhará blindagem instantaneamente quando estiver prestes a sofrer dano para metade da sua vida ou menos..\n\nO selo pode ser _afixado à armadura_ e movido entre armaduras. Pode levar um único aprimoramento consigo, desde que o aprimoramento tenha sido aplicado à armadura enquanto o selo estava afixado nela.
items.brokenseal.inscribed=O selo está inscrito com _%s._
items.brokenseal.choose_title=Escolha um Glifo
items.brokenseal.choose_desc=Tanto esta armadura quanto o selo quebrado carregam um glifo. Escolha qual glifo deve ser mantido.\n\nGlifo da armadura: %1$s\nGlifo do Selo Quebrado: %2$s\n\nObserve que se você escolher o glifo que está atualmente na armadura, o selo não poderá transferi-lo depois.
items.brokenseal.discover_hint=Um dos heróis inicia com este item.
items.brokenseal$warriorshield.name=Blindagem do Guerreiro
items.brokenseal$warriorshield.desc_active=O selo quebrado do Guerreiro está atualmente ajudando-o a perseverar, concedendo-lhe escudo além de sua vida. Antes de poder ser usado novamente, há um tempo de recarga após a blindagem ter sido inicialmente ativada.\n\nEsta blindagem não se deteriora com o tempo, mas terminará se não houver inimigos por perto por alguns turnos. Quando acabar, qualquer unidade de blindagem não utilizada reduzirá o tempo de recarga, até um máximo de 50%%.\n\nBlindagem restante: %1$d.\n\nTempo de recarga atual: %2$d.
items.brokenseal$warriorshield.desc_cooldown=O Guerreiro ganhou recentemente blindagem de seu selo quebrado e deve esperar até que possa se beneficiar de seu efeito de proteção novamente.\n\nTurnos restantes: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=O tempo de recarga de blindagem do Guerreiro está atualmente negativo, significando que, quando seu escudo é ativado, o tempo de recarga será menor que os 150 turnos usuais. O tempo de recarga de blindagem pode ser reduzido para até -150 turnos, o que significa que estará disponível imediatamente após ser ativada.\n\nTempo de recarga atual: %d.

items.dewdrop.name=gota de orvalho
items.dewdrop.already_full=Você já está com a vida cheia.
items.dewdrop.desc=Uma gota de orvalho clara como cristal.\n\nGraças à magia deste lugar, a água pura tem um pouco de propriedades curativas.

items.equipableitem.curse_detected=Você sentiu que o item estava amaldiçoado assim que ia equipá-lo!
items.equipableitem.unequip_cursed=Você não pode remover um item amaldiçoado!
items.equipableitem.ac_equip=EQUIPAR
items.equipableitem.ac_unequip=DESEQUIPAR

items.energycrystal.name=cristal de energia
items.energycrystal.desc=Uma coleção de pequenos cristais mágicos, cheios de energia alquímica.\n\nEstes cristais são os ingredientes mais comuns em receitas alquímicas e podem ser produzidos em um pote de alquimia reciclando itens consumíveis.

items.gold.name=ouro
items.gold.desc=Uma pilha de moedas de ouro. Colete moedas de ouro para gastá-las mais tarde em uma loja.

items.heap.for_sale=%1$dg: %2$s
items.heap.chest=Baú
items.heap.chest_desc=Você não conseguirá saber o que tem dentro até abri-lo!
items.heap.locked_chest=Baú trancado
items.heap.locked_chest_desc=Você não vai saber o que tem dentro enquanto não abrir! Mas para abrir é necessário uma chave dourada.
items.heap.crystal_chest=Baú de cristal
items.heap.crystal_chest_desc=Você pode ver _%s_ dentro, mas para abrir o baú você precisa de uma chave de cristal.
items.heap.artifact=um artefato
items.heap.wand=uma varinha
items.heap.ring=um anel
items.heap.tomb=Tumba
items.heap.tomb_desc=Esta tumba antiga pode conter algo útil, mas seu dono certamente irá se opor à sua perturbação.
items.heap.skeleton=Restos de esqueleto
items.heap.skeleton_desc=Isto é tudo o que resta de algum aventureiro desafortunado. Talvez valha a pena verificar se há alguma coisa de valor.
items.heap.remains=Restos de um herói
items.heap.remains_desc=Isto é tudo o que resta de algum de seus predecessores. Talvez valha a pena verificar se há algo de valor.

items.honeypot.name=pote de mel
items.honeypot.ac_shatter=QUEBRAR
items.honeypot.desc=Este grande pote de mel, na verdade, só é revestido com mel e abriga uma abelha gigante! Esse tipo de abelha enorme costuma ficar em sua colmeia. Será que esse pote é uma espécie de gaiola feita por um caçador especializado? A abelha parece bastante feliz dentro do pote com seu mel, mas zuni com desconfiança quando você olha dentro dele.
items.honeypot$shatteredpot.name=pote rachado
items.honeypot$shatteredpot.desc=Este pote está rachado, e apenas o mel grudento que o reveste está segurando sua estrutura. Ele está se despedaçando aos poucos\n\nApesar de suas rachaduras irreparáveis, a abelha ainda parece querer proteger o pote.

items.item.prompt=Selecione uma direção para jogar.
items.item.ac_drop=DESCARTAR
items.item.ac_throw=JOGAR
items.item.rankings_desc=Morto por: %s
items.item.curse=maldição
items.item.custom_note_type=Este tipo de item tem uma anotação personalizada: "_%s_"
items.item.custom_note=Este item possui uma anotação personalizada: "_%s_"
items.item.discover_hint=Você pode encontrar este item aleatoriamente na masmorra.

items.kindofmisc.unequip_title=Desequipe um item
items.kindofmisc.unequip_message=Você deve desequipar um desses itens primeiro. Selecione um item com o qual deseja trocar.

items.kindofweapon.swift_equip=Você rapidamente equipa sua arma.
items.kindofweapon.equip_cursed=Involuntariamente, você agarra a arma com mais força.
items.kindofweapon.which_equip_msg=Em qual slot de arma você gostaria de equipar este item?\n\nA Campeã ataca diretamente com sua arma primária, mas pode usar a habilidade de qualquer uma das armas. Ambas as armas compartilham a mesma contagem de carga.\n\nA Campeã também pode trocar sua arma primária e secundária instantaneamente.
items.kindofweapon.which_equip_primary=Primária (%s)
items.kindofweapon.which_equip_secondary=Secundária (%s)
items.kindofweapon.empty=vazio

items.kingscrown.name=Coroa do Rei Anão
items.kingscrown.ac_wear=VESTIR
items.kingscrown.naked=Infelizmente, a coroa não pode transformar suas roupas de baixo.
items.kingscrown.upgraded=A coroa emite um brilho forte e se desintegra enquanto a sua armadura se transforma!
items.kingscrown.ratgraded=As patas do Rei Rato brilham enquanto sua armadura se transforma!
items.kingscrown.desc=A coroa do último rei dos anões, ela brilha com tremenda energia mágica.\n\nQuando colocada, a magia da coroa irá fluir para a armadura que você esta vestindo, transformando-a em uma _épica armadura única com habilidades especiais._ A nova armadura vai manter todas as propriedades da armadura original.
items.kingscrown.discover_hint=Você pode obter este item como um saque de certos inimigos.

items.liquidmetal.name=metal líquido
items.liquidmetal.ac_apply=APLICAR
items.liquidmetal.prompt=Selecione uma arma de arremesso
items.liquidmetal.already_fixed=Esta arma de arremesso já está em perfeitas condições!
items.liquidmetal.apply=Você utiliza %d metal líquido para reparar sua arma de arremesso.
items.liquidmetal.desc=Este líquido mágico pode preencher rachaduras e trincados em uma arma de arremesso, restaurando-a à condição perfeita! Se um conjunto de armas estiver com armas a menos, mas totalmente reparado, o metal líquido pode até ser usado para substituir uma arma faltante do conjunto!\n\nUma arma de tier 1 requer 10 de metal líquido para ser totalmente reparada, uma arma de tier 5 requer 30. Cada aprimoramento também aumenta a quantidade de metal necessária em 35%.\n\nO metal líquido não pode ser usado para reparar as pontas de dardos embebidos.
items.liquidmetal.discover_hint=Você pode fabricar este item através de alquimia.

items.lostbackpack.name=mochila perdida
items.lostbackpack.desc=Este é o seu inventário perdido. Colete-o para recuperar todos os itens que você perdeu!

items.merchantsbeacon.name=transmissor do mercante
items.merchantsbeacon.ac_use=USAR
items.merchantsbeacon.desc=Esta velha peça de tecnologia permite a você se comunicar a grandes distancias.\n\nAo ser ativado, esse farol irá permitir que você venda itens para a Loja Pixel Mart em qualquer lugar da masmorra.\n\nPorém a magia dentro do transmissor só vai durar uma sessão, então use sabiamente.

items.stylus.name=caneta arcana
items.stylus.ac_inscribe=GRAVAR
items.stylus.prompt=Escolha uma armadura
items.stylus.identify=Primeiro você deve identificar se essa armadura está amaldiçoada.
items.stylus.cursed=A magia da caneta não funciona em armaduras amaldiçoadas.
items.stylus.inscribed=Você inscreveu a sua armadura com a caneta arcana.
items.stylus.desc=Esta caneta arcana é feito de alguma pedra escura e muito dura. Através dela você pode inscrever um glifo mágico em sua armadura, mas você não terá nenhum poder para escolher que glifo será, a caneta vai decidir isso por você.

items.tengusmask.name=Máscara do Tengu
items.tengusmask.ac_wear=VESTIR
items.tengusmask.used=A máscara se desintegra e seu poder flui para você!
items.tengusmask.desc=Esta máscara caiu do rosto de Tengu quando ele morreu, você pode sentir um grande poder mágico emanando dela. Seria a máscara a fonte do poder de Tengu?\n\nQuando usada, seu tremendo poder vai ser transferido para você, permitindo a _escolha de uma subclasse para seu herói._\n\nQual subclasse você irá escolher?
items.tengusmask.discover_hint=Você pode obter este item como um saque de certos inimigos.

items.torch.name=tocha
items.torch.ac_light=ACENDER
items.torch.desc=Uma dica básica para aventureiros, quando a masmorra fica escura, uma tocha pode ajudar a mostrar o caminho.

items.waterskin.name=odre
items.waterskin.ac_drink=BEBER
items.waterskin.collected=Você bota a gota de orvalho em seu odre.
items.waterskin.full=Seu odre está cheio!
items.waterskin.empty=Seu odre está vazio!
items.waterskin.desc=Um recipiente para líquido, feito de couro e corda, fechado com uma rolha.
items.waterskin.desc_water=No momento, o odre contém apenas um pouco de água potável. Certamente há algo na masmorra que o odre poderia armazenar.
items.waterskin.desc_heal=O odre está sendo usado para armazenar água curativa. Quanto mais cheio o odre estiver, mais você será curado imediatamente quando beber dele. Você só irá beber a quantia que precisar.
items.waterskin.desc_full=O odre cheio parece irradiar energia, talvez ele possa abençoar outro item de sobrevivência?
items.waterskin.discover_hint=Um dos heróis inicia com este item.

###Warped Pixel Dungeon
items.armor.glyphs.bounce.name=%s de ricochete
items.armor.glyphs.bounce.desc=Este glifo repele os atacantes com uma explosão de força, empurrando-os para trás quando atingem o usuário.
items.armor.glyphs.phasing.name=%s de desfase
items.armor.glyphs.phasing.desc=Este glifo protege o usuário quando ele está gravemente ferido, teleportando-o para um lugar seguro e deixando-o invisível por um breve momento. Não ativa em andares de chefe.
items.armor.glyphs.mirroring.name=%s de espelhamento
items.armor.glyphs.mirroring.desc=Este glifo cria uma cópia espelhada do usuário quando ele é atingido, um aliado útil em combate.
items.armor.armor.thermal_offset=Mantém você cerca de _%s°_ mais quente.
items.armor.armor.thermal_none=Não dá nenhum aquecimento extra.
items.armor.armor.thermal_retain_very=Seu volume retém a temperatura com muita força e resiste a variações tanto de calor quanto de frio.
items.armor.armor.thermal_retain=Retém bem a temperatura.
items.armor.armor.thermal_neutral=Reage rápido à temperatura ambiente.
items.armor.armor.thermal_conduct=Conduz a temperatura ambiente rapidamente.
items.artifacts.ringofdisintegration.name=anel da desintegração
items.artifacts.ringofdisintegration.ac_blast=DISPARAR
items.artifacts.ringofdisintegration.ac_add=ADICIONAR
items.artifacts.ringofdisintegration.not_equipped=Você precisa equipar o anel para fazer isso.
items.artifacts.ringofdisintegration.not_charged=O anel ainda não está totalmente carregado.
items.artifacts.ringofdisintegration.blast=Rajada!
items.artifacts.ringofdisintegration.prompt=Escolha um pergaminho identificado para consumir
items.artifacts.ringofdisintegration.consumed=O anel consome o poder do pergaminho! Ele está com %d pontos!
items.artifacts.ringofdisintegration.looks_better=Seu anel com certeza parece melhor!
items.artifacts.ringofdisintegration.desc=O anel da desintegração vibra com poder destrutivo. Quando está totalmente carregado, ele dispara raios devastadores em várias direções.\n\nConsuma pergaminhos identificados para fortalecê-lo ainda mais.
items.artifacts.ringofdisintegration.desc_restrained=Por enquanto, o poder dele está contido.
items.artifacts.ringofdisintegration.desc_ready=Ele brilha com um poder prestes a se libertar!
items.artifacts.ringoffrost.name=anel da geada
items.artifacts.ringoffrost.ac_blast=DISPARAR
items.artifacts.ringoffrost.ac_add=ADICIONAR
items.artifacts.ringoffrost.not_equipped=Você precisa equipar o anel para fazer isso.
items.artifacts.ringoffrost.not_charged=O anel ainda não está totalmente carregado.
items.artifacts.ringoffrost.blast=Rajada!
items.artifacts.ringoffrost.prompt=Escolha um pergaminho identificado para consumir
items.artifacts.ringoffrost.consumed=O anel consome o poder do pergaminho! Ele está com %d pontos!
items.artifacts.ringoffrost.looks_better=Seu anel com certeza parece melhor!
items.artifacts.ringoffrost.desc=O anel da geada gela o ar com poder glacial. Quando está totalmente carregado, ele congela todos os inimigos próximos.\n\nConsuma pergaminhos identificados para fortalecê-lo ainda mais.
items.artifacts.ringoffrost.desc_restrained=Por enquanto, o poder dele está contido.
items.artifacts.ringoffrost.desc_ready=O poder dele está prestes a se libertar!
items.misc.autopotion.name=amuleto de autopoção
items.misc.autopotion.desc=Usar este amuleto faz você beber automaticamente uma poção da cura quando sua vida cai abaixo de 10%.
items.misc.autopotion.auto_heal=Seu amuleto usa uma poção da cura automaticamente!
items.misc.spectacles.name=óculos
items.misc.spectacles.desc=Estes óculos misteriosos dão a quem os usa uma visão mágica aguçada.
items.bags.keyring.name=argola de chaves
items.bags.keyring.desc=Esta argola de metal resistente guarda todo tipo de chave. Ela as mantém organizadas e fáceis de achar quando você precisa.
items.bags.ankhchain.name=corrente de ankhs
items.bags.ankhchain.desc=Esta corrente abençoada guarda ankhs, anéis, chaves de todo tipo e tudo mais que leva você a algum lugar: as chaves de portal, os livros, a moeda, o osso e a concha, a sanchikarah, os faróis. Os elos brilham com uma leve luz sagrada.
items.bags.foodpouch.name=bolsa de comida
items.bags.foodpouch.desc=Esta bolsa de couro espaçosa é perfeita para guardar comida. Ela mantém suas provisões frescas e organizadas.
items.bombs.clusterbomb.name=bomba de fragmentação
items.bombs.clusterbomb.desc=Este feixe volátil de explosivos detona com uma explosão principal e espalha explosões secundárias a até 2 quadrados de distância. A cadeia de explosões o torna imprevisível, mas devastador.
items.bombs.dizzybomb.name=bomba tonteante
items.bombs.dizzybomb.desc=Esta bomba tem produtos químicos que desorientam. A explosão causa dano num raio de 1 quadrado e deixa os inimigos atingidos cambaleando com vertigem.
items.bombs.dumplingbomb.name=bomba de bolinhos
items.bombs.dumplingbomb.no_teleport=Não havia para onde teleportar!
items.bombs.dumplingbomb.desc=Uma bomba que não explode, recheada de bolinhos que dão sono. Inimigos pegos na explosão que não sejam chefes são tomados pela sonolência e teleportados para um lugar aleatório do andar.
items.bombs.holyhandgrenade.name=santa granada de mão
items.bombs.holyhandgrenade.desc=Um explosivo abençoado que canaliza poder divino contra os mortos-vivos. Ao detonar, aterroriza e fere inimigos mortos-vivos a até 2 quadrados, sem machucar os vivos.
items.bombs.smartbomb.name=bomba inteligente
items.bombs.smartbomb.desc=Um explosivo de precisão feito para detonar só ao redor de inimigos. Causa dano aos inimigos próximos num raio de 1 quadrado, mas é esperto o bastante para não ferir quem o usa.
items.food.blackberry.name=baga negra da masmorra
items.food.blackberry.eat_msg=Suculenta!
items.food.blackberry.trippy=Que viagem!
items.food.blackberry.sense_others=De algum jeito, você sente a presença da mente de outras criaturas!
items.food.blackberry.sense_alone=De algum jeito, você sabe que está sozinho neste andar no momento.
items.food.blackberry.energy=A baga libera energia no seu corpo!
items.food.blackberry.desc=Uma baga deliciosa encontrada nas profundezas da masmorra. Essas bagas absorvem o orvalho mágico ao redor para crescer saudáveis.
items.food.bluemilk.name=cogumelo leite-azul
items.food.bluemilk.eat_msg=Nhac nhac.
items.food.bluemilk.preventing=Algo lhe diz que isso não seria uma boa ideia aqui!
items.food.bluemilk.effect=Você está escorregando pelo éter!
items.food.bluemilk.desc=Este cogumelo verte uma substância azul e leitosa. Você sente seus sentidos escapando.
items.food.blueberry.name=baga azul da masmorra
items.food.blueberry.eat_msg=Suculenta!
items.food.blueberry.preventing=A magia deste lugar impede esse tipo de vidência!
items.food.blueberry.knowledge=A baga azul enche sua mente de conhecimento sobre o andar atual.
items.food.blueberry.energy=A baga libera energia no seu corpo!
items.food.blueberry.desc=Uma misteriosa baga azul encontrada nas profundezas da masmorra. Como essas bagas crescem devagar ao longo de vários anos, elas absorvem o conhecimento da masmorra.
items.food.cloudberry.name=baga-nuvem da masmorra
items.food.cloudberry.eat_msg=Suculenta!
items.food.cloudberry.haste=Você está se movendo muito mais rápido!
items.food.cloudberry.float=Você flutua no ar!
items.food.cloudberry.energy=A baga libera energia no seu corpo!
items.food.cloudberry.desc=Uma baga deliciosa e leve encontrada nas profundezas da masmorra. Ela parece flutuar na sua mão e vibra com uma certa energia.
items.food.deathcap.name=cogumelo chapéu-da-morte
items.food.deathcap.eat_msg=Nhac nhac.
items.food.deathcap.preventing=Algo lhe diz que isso não seria uma boa ideia aqui!
items.food.deathcap.effect=Uma energia sombria enche suas veias. Tudo o que você vê são seus ossos brilhando!
items.food.deathcap.desc=Um fungo de aparência mortal que cresce na masmorra. Coma por sua conta e risco.
items.food.earthstar.name=cogumelo estrela-da-terra
items.food.earthstar.eat_msg=Nhac nhac.
items.food.earthstar.preventing=Algo lhe diz que isso não seria uma boa ideia aqui!
items.food.earthstar.effect=O poder de um mundo alienígena investe contra você!
items.food.earthstar.desc=Um pedacinho de um mundo desconhecido cresce neste cogumelo. Não parece um lugar que você gostaria de visitar...
items.food.eagleegg.name=ovo de águia
items.food.eagleegg.eat_msg=Nutritivo e farto. As águias não aprovariam.
items.food.eagleegg.desc=Um ovo grande, branco com manchas marrom-ferrugem, tirado de um ninho de águia. Dá uma boa refeição, se você conseguiu escapar com ele.
items.food.fullmoonberry.name=baga da lua cheia da masmorra
items.food.fullmoonberry.eat_msg=Suculenta!
items.food.fullmoonberry.fury=A baga lunar enche seu corpo de uma temível força mágica.
items.food.fullmoonberry.barkskin=A masmorra abençoa sua pele com armadura.
items.food.fullmoonberry.desc=Nas horas mais escuras da noite cresce a baga da lua cheia. Os desejos da masmorra se concentram na magia forte dela. Basta uma cheirada e você já sente uma fúria mágica crescer dentro de você.
items.food.food.ac_spice=TEMPERAR
items.food.food.spiced_with=com tempero de
items.food.food.inv_title=Escolha um tempero
items.food.fish.name=peixe
items.food.fish.name_spring=truta da desova
items.food.fish.name_summer=perca de rio
items.food.fish.name_autumn=enguia defumada
items.food.fish.name_winter=pesca do buraco no gelo
items.food.fish.desc_spring=Uma truta pega enquanto subia o rio, gorda de ovas. O pescador jura que a piracema da primavera é a comida mais gostosa do ano, e dessa vez ninguém discute.
items.food.fish.desc_summer=Uma perca das águas rasas e mornas, escamada e limpa no parapeito da ponte enquanto você esperava. Ainda fria da água.
items.food.fish.desc_autumn=Uma enguia pendurada sobre um fogo de amieiro até a pele ficar preta e a carne ficar dourada. Não estraga, aguenta viagem e é muito difícil parar de comer.
items.food.fish.desc_winter=O que quer que tenha subido pelo buraco no gelo. Magro, meio congelado e barato, porque o pescador não tem ilusões sobre o que está vendendo.
items.food.goldenjelly.name=cogumelo geleia-dourada
items.food.goldenjelly.eat_msg=Nhac nhac.
items.food.goldenjelly.preventing=Algo lhe diz que isso não seria uma boa ideia aqui!
items.food.goldenjelly.effect=O chão da masmorra brilha com esporos grudentos! Para onde eu estou indo? O que são sapatos?
items.food.goldenjelly.desc=Um fungo gelatinoso coberto de uma gosma grudenta. Parece que pode causar algum estrago se for comido.
items.food.goldennut.name=noz dourada da masmorra
items.food.goldennut.eat_msg=Derrete na boca. Tem gosto de Nutella.
items.food.goldennut.blessing=Você recebeu a bênção da masmorra.
items.food.goldennut.highest_blessing=Você recebeu a maior bênção da masmorra.
items.food.goldennut.desc=Uma noz única da masmorra, dourada por um encantamento.
items.food.goldennut.discover_hint=Volte pela chave antiga da cidade depois de derrotar 100 ladrões de ouro, esqueletos, piranhas gigantes albinas e gnolls arqueiros.
items.food.jackolantern.name=cogumelo lanterna
items.food.jackolantern.eat_msg=Nhac nhac.
items.food.jackolantern.preventing=Algo lhe diz que isso não seria uma boa ideia aqui!
items.food.jackolantern.effect=As sombras estão pegando fogo!
items.food.jackolantern.desc=Um calor estranho emana deste cogumelo. Libertar o fogo que há dentro dele pode ser perigoso.
items.food.monstermeat.name=carne de monstro
items.food.monstermeat.eat_msg=Você engoliu a carne de monstro a muito custo.
items.food.monstermeat.not_well=Você não está se sentindo bem.
items.food.monstermeat.desc=Restos frescos de um inimigo derrotado. Mata a fome, mas há uma pequena chance de não cair bem.
items.food.moonberry.name=baga lunar da masmorra
items.food.moonberry.eat_msg=Suculenta!
items.food.moonberry.fury=A baga lunar enche seu corpo de uma força temível.
items.food.moonberry.barkskin=A masmorra abençoa sua pele com armadura.
items.food.moonberry.desc=Uma baga verde-azulada e nutritiva encontrada nas profundezas da masmorra. Ela tem um endocarpo duro e irradia uma magia poderosa. Basta uma cheirada e você já sente uma fúria mágica crescer dentro de você.
items.food.nut.name=noz da masmorra
items.food.nut.eat_msg=Crec crec.
items.food.nut.blessing=Você sente a masmorra abençoando você.
items.food.nut.desc=Uma noz comum da masmorra.
items.food.pixieparasol.name=cogumelo sombrinha-de-fada
items.food.pixieparasol.eat_msg=Nhac nhac.
items.food.pixieparasol.preventing=Algo lhe diz que isso não seria uma boa ideia aqui!
items.food.pixieparasol.effect=Você está flutuando no seu sonho!
items.food.pixieparasol.desc=Esses cogumelos parecem girar diante dos seus olhos. Você ouve risadas passageiras.
items.food.potionofconstitution.name=mel
items.food.potionofconstitution.eat_msg=Você sente sua vida se estendendo.
items.food.potionofconstitution.desc=Néctar que dá vida.
items.food.aprico.name=damasco
items.food.aprico.eat_msg=Esse damasco estava doce!
items.food.aprico.desc=Uma fruta estranha, parecida com uma maçã. Restaura um pouco de saciedade.
items.food.grape.name=uva
items.food.grape.eat_msg=Suculenta!
items.food.grape.desc=Uma uva gorducha da masmorra. Enche bastante para o tamanho dela.
items.food.plantegg.name=ovo vegetal
items.food.plantegg.eat_msg=Surpreendentemente gostoso!
items.food.plantegg.desc=Um ovo liso encontrado dentro de uma flor-de-ovo. Enche bastante.
items.food.peanut.name=amendoim
items.food.peanut.eat_msg=Crec crec!
items.food.peanut.desc=Um amendoim pequeno de uma pétala-de-amendoim. Um lanche leve, mas que satisfaz.
items.food.cornwheatshaft.name=espiga de milhotrigo
items.food.cornwheatshaft.eat_msg=Duro de mastigar, mas nutritivo!
items.food.cornwheatshaft.desc=Uma espiga de milhotrigo recém-colhida. Restaura um pouco de saciedade.
items.food.toastednut.name=noz da masmorra tostada
items.food.toastednut.eat_msg=Crec crec. HMMM, que gosto de noz!
items.food.toastednut.blessing=Você sente a masmorra abençoando você.
items.food.toastednut.desc=Uma noz comum da masmorra, tostada no ponto.
items.journal.descentpage.name=página de diário rasgada
items.journal.descentpage.desc=Uma página arrancada do diário de um explorador morto, esperando sobre a pedra como se soubesse que você viria.\n\nA tinta treme quando você olha para ela. Dá para distinguir o título:\n\n_"%s"_
items.journal.descentpage.unlocked=A página se acomoda no seu Guia da Descida: "%s".
items.journal.descentpage.already_found=Seu Guia da Descida já tem esta página.
items.keys.skeletonkey.name=chave de crânio
items.keys.skeletonkey.desc=Esta chave universal é feita de osso. Seus dentes toscos abrem qualquer fechadura deste andar.
items.keys.goldenskeletonkey.name=chave de crânio dourada
items.keys.goldenskeletonkey.desc=Esta chave dourada e reluzente irradia uma luz morna. Seus dentes elaborados passam por qualquer fechadura, em qualquer lugar da masmorra, e ela parece guardar algum poder mágico.
items.keys.goldenskeletonkey.confirm=Esta chave dourada pode forçar qualquer fechadura, mas vai se gastar. Usar aqui?
items.keys.goldenskeletonkey.confirm_yes=Usar a chave dourada
items.keys.goldenskeletonkey.confirm_no=Agora não
items.nornstone.nornstone.name=pedra norn
items.nornstone.nornstone.desc=Uma gema vistosa imbuída de um poder antigo. Leve três a um altar e talvez você ganhe algo especial.
items.nornstone.greennornstone.name=pedra norn verde
items.nornstone.greennornstone.desc=Uma poderosa gema verde que pulsa com energia natural. Leve três pedras norn a um altar para liberar o verdadeiro potencial delas.
items.nornstone.bluenornstone.name=pedra norn azul
items.nornstone.bluenornstone.desc=Uma poderosa gema azul que cintila com gelo arcano. Leve três pedras norn a um altar para liberar o verdadeiro potencial delas.
items.nornstone.orangenornstone.name=pedra norn laranja
items.nornstone.orangenornstone.desc=Uma poderosa gema laranja que irradia um calor ardente. Leve três pedras norn a um altar para liberar o verdadeiro potencial delas.
items.nornstone.purplenornstone.name=pedra norn roxa
items.nornstone.purplenornstone.desc=Uma poderosa gema roxa que lateja com energia sombria. Leve três pedras norn a um altar para liberar o verdadeiro potencial delas.
items.nornstone.yellownornstone.name=pedra norn amarela
items.nornstone.yellownornstone.desc=Uma poderosa gema amarela que estala com relâmpagos. Leve três pedras norn a um altar para liberar o verdadeiro potencial delas.
