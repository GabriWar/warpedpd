items.weapon.melee.shovel.typical_ability_desc=A Duelista pode _jogar terra_ na cara de um inimigo a até 3 quadrados, cegando-o normalmente por _%d turnos_. Um inimigo sobre grama ou na água também fica atolado na terra e enraizado por 2 turnos. Custa 1 carga.
items.weapon.melee.shovel.ability_desc=A Duelista pode _jogar terra_ na cara de um inimigo a até 3 quadrados, cegando-o por _%d turnos_. Um inimigo sobre grama ou na água também fica atolado na terra e enraizado por 2 turnos. Custa 1 carga.
