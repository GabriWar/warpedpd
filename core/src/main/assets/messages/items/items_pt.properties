items.rings.ring.jade=anel de jade
items.rings.ringofsating.name=anel da saciedade
items.rings.ringofsating.stats=Quando usado, este anel faz sua comida render mais, e você fica com fome _%s%%_ mais devagar.
items.rings.ringofsating.typical_stats=Quando usado, este anel normalmente faz você ficar com fome _%s%%_ mais devagar.
items.rings.ringofsating.combined_stats=Seus anéis equipados estão combinando seus poderes, fazendo você ficar com fome _%s%%_ mais devagar no total.
items.rings.ringofsating.upgrade_stat_name_1=Saciedade
items.rings.ringofsating.desc=Este anel deixa quem o usa passar muito mais tempo sem comer, tirando até o último pedaço de sustento de uma refeição. Um anel amaldiçoado vai deixar você morrendo de fome.
items.rings.ringofsearching.name=anel da busca
items.rings.ringofsearching.stats=Quando usado, este anel faz as coisas fora do lugar entrarem em foco, ampliando suas buscas deliberadas em _%d_ quadrados.
items.rings.ringofsearching.typical_stats=Quando usado, este anel normalmente amplia suas buscas deliberadas em _%d_ quadrados.
items.rings.ringofsearching.combined_stats=Seus anéis equipados estão combinando seus poderes, ampliando suas buscas deliberadas em _%d_ quadrados no total.
items.rings.ringofsearching.upgrade_stat_name_1=Raio de busca
items.rings.ringofsearching.desc=Usar este anel facilita notar coisas escondidas e permite varrer uma área maior ao procurar. Um anel amaldiçoado vai fazer você deixar passar o que está bem na sua frente.
items.keys.icekey.name=chave de gelo
items.keys.icekey.desc=Uma chave de ferro negro coberta por uma geada que não derrete. Algo no gelo profundo a carregava.
items.artifacts.candleofmindvision.name=vela da visão mental
items.artifacts.candleofmindvision.desc=Uma vela fina de cera violeta num pequeno castiçal de latão. Acesa, ela mostra todos os seres vivos ao seu redor e vai se consumindo enquanto isso.
items.artifacts.candleofmindvision.desc_lit=Ela está acesa agora e não vai durar para sempre.
items.artifacts.candleofmindvision.desc_unlit=Ela está apagada e recupera a cera aos poucos.
