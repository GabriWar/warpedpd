items.weapon.melee.magebook.typical_ability_desc=A Duelista pode arrancar uma _página de feitiço_ e lê-la contra um inimigo a até 3 quadrados. A página atinge como magia, ignorando armadura, causando normalmente _%1$d-%2$d de dano_, não erra e devolve 1 de mana. Custa 1 carga.
