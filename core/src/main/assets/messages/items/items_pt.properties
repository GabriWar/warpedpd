items.weapon.melee.wardrum.ability_name=batida de guerra
items.weapon.melee.wardrum.typical_ability_desc=A Duelista pode tocar uma _batida de guerra_ no tambor. Leva um turno: ela e todos os aliados à vista ficam acelerados normalmente por _%d turnos_, e todo inimigo a até dois quadrados fica aterrorizado por 2 turnos.
items.weapon.melee.wardrum.ability_desc=A Duelista pode tocar uma _batida de guerra_ no tambor. Leva um turno: ela e todos os aliados à vista ficam acelerados por _%d turnos_, e todo inimigo a até dois quadrados fica aterrorizado por 2 turnos.
