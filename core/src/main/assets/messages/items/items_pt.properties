items.weapon.melee.nunchakus.typical_ability_desc=A Duelista pode fazer um _rodopio_ com os nunchakus contra um inimigo: dois golpes num só movimento, o primeiro normalmente causando _%1$d-%2$d de dano_, o segundo três quartos disso. Nenhum dos dois erra, e cada um pode aturdir como a arma costuma fazer.
items.weapon.melee.nunchakus.ability_desc=A Duelista pode fazer um _rodopio_ com os nunchakus contra um inimigo: dois golpes num só movimento, o primeiro causando _%1$d-%2$d de dano_, o segundo três quartos disso. Nenhum dos dois erra, e cada um pode aturdir como a arma costuma fazer.
