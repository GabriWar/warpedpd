items.weapon.melee.triangolo.ability_name=badalar
items.weapon.melee.triangolo.typical_ability_desc=A Duelista pode _badalar_ uma nota clara que deixa todo inimigo a até 2 quadrados cambaleando de vertigem normalmente por _%d turnos_ e causa a cada inimigo um quarto do dano de um golpe. Custa 1 carga.
