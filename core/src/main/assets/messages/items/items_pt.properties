items.potions.potionofwithering.infuse_desc=Infusão da aljava: cada acerto a distância infundido solta nuvens de definhamento em volta do impacto.
items.potions.brews.aquabrew.infuse_desc=Cada acerto solta nuvens de trovoada em volta do impacto. Usa as cargas normais de infusão.
items.potions.brews.blizzardbrew.infuse_desc=Acertos a distância infundidos com composto nevado vão _soltar uma nevasca_ com cerca de metade do tamanho da nevasca do composto. Usa as cargas normais de infusão da aljava.
items.potions.brews.causticbrew.infuse_desc=Acertos a distância infundidos com composto cáustico vão _causar Muco Cáustico numa área de 5x5_. Usa as cargas normais de infusão da aljava.
items.potions.brews.infernalbrew.infuse_desc=Acertos a distância infundidos com composto Infernal vão _soltar um inferno_ com cerca de metade do tamanho do inferno do composto. Usa as cargas normais de infusão da aljava.
items.potions.brews.shockingbrew.infuse_desc=Acertos a distância infundidos com composto eletrizado causam _20%-60% a mais de dano_ como dano elétrico. Usa as cargas normais de infusão da aljava.
items.potions.brews.unstablebrew.infuse_desc=Acertos a distância infundidos com composto instável ativam um _efeito aleatório de infusão de poção_. Usa as cargas normais de infusão da aljava.
items.potions.brews.wickedbrew.infuse_desc=Infusão da aljava: cada acerto a distância infundido solta gás tóxico e paralítico no impacto.
items.potions.brews.frigidbrew.infuse_desc=Infusão da aljava: cada acerto a distância infundido congela a área em volta do impacto e solta uma tempestade de gelo.
items.potions.brews.frostfirebrew.infuse_desc=Infusão da aljava: cada acerto a distância infundido congela, enraíza e depois queima a área em volta do impacto.
items.potions.brews.thunderheadbrew.infuse_desc=Infusão da aljava: cada acerto a distância infundido solta vapor carregado que dá choque em tudo que estiver dentro dele.
items.potions.brews.blindingbrew.infuse_desc=Infusão da aljava: cada acerto a distância infundido cega os inimigos perto do impacto e enche a área de fumaça luminosa.
items.potions.brews.overgrowthbrew.infuse_desc=Infusão da aljava: cada acerto a distância infundido faz plantas crescerem perto do impacto e enraíza os inimigos ali.
items.potions.brews.hypnobrew.infuse_desc=Infusão da aljava: cada acerto a distância infundido encoleriza os inimigos perto do impacto.
items.potions.brews.quicksandbrew.infuse_desc=Infusão da aljava: cada acerto a distância infundido aleija e deixa lentos os inimigos perto do impacto.
items.potions.elixirs.elixirofaquaticrejuvenation.infuse_desc=Infusão da aljava: cada acerto a distância infundido dá a você uma reserva de cura enquanto estiver na água.
items.potions.elixirs.elixirofarcanearmor.infuse_desc=Infusão da aljava: cada acerto a distância infundido dá a você proteção temporária contra magia.
items.potions.elixirs.elixirofdragonsblood.infuse_desc=Infusão da aljava: cada acerto a distância infundido imbui você com fogo e aquece seu corpo.
items.potions.elixirs.elixiroffeatherfall.infuse_desc=Infusão da aljava: cada acerto a distância infundido protege você de dano de queda.
items.potions.elixirs.elixirofhoneyedhealing.infuse_desc=Infusão da aljava: cada acerto a distância infundido cura você, trata seus males e restaura saciedade.
items.potions.elixirs.elixiroficytouch.infuse_desc=Infusão da aljava: cada acerto a distância infundido imbui você com gelo e esfria seu corpo.
items.potions.elixirs.elixirofmight.infuse_desc=Infusão da aljava: cada acerto a distância infundido dá força permanente e um aumento temporário de vida máxima.
items.potions.elixirs.elixiroftoxicessence.infuse_desc=Infusão da aljava: cada acerto a distância infundido imbui você com toxinas.
items.potions.elixirs.elixirofrestoration.infuse_desc=Infusão da aljava: cada acerto a distância infundido cura você e remove seus efeitos negativos.
items.potions.elixirs.elixirofvitality.infuse_desc=Infusão da aljava: cada acerto a distância infundido cura você, trata seus males e dá uma barreira.
items.potions.elixirs.elixiroftheshade.infuse_desc=Infusão da aljava: cada acerto a distância infundido deixa você invisível, e seus próximos ataques não quebram a invisibilidade.
items.potions.elixirs.elixirofthehunt.infuse_desc=Infusão da aljava: cada acerto a distância infundido dá a você visão mental, velocidade e precisão.
items.potions.elixirs.elixirofwarmth.infuse_desc=Infusão da aljava: cada acerto a distância infundido protege você do frio e faz seus ataques corpo a corpo queimarem.
items.potions.elixirs.elixirofbloom.infuse_desc=Infusão da aljava: cada acerto a distância infundido faz a grama crescer por onde você pisa.
items.potions.elixirs.elixirofclarity.infuse_desc=Infusão da aljava: cada acerto a distância infundido restaura sua mana e aumenta a experiência das próximas criaturas que você matar.
items.potions.exotic.potionofabsolutezero.infuse_desc=Infusão da aljava: cada acerto a distância infundido congela e gela muito as criaturas por todo o andar.
items.potions.exotic.potionofadrenalinesurge.infuse_desc=Infusão da aljava: cada acerto a distância infundido aumenta sua força por um tempo.
items.potions.exotic.potionofalcohol.infuse_desc=Infusão da aljava: cada acerto a distância infundido embriaga você por mais tempo.
items.potions.exotic.potionofallseeing.infuse_desc=Infusão da aljava: cada acerto a distância infundido mapeia o andar e revela os segredos dele.
items.potions.exotic.potionofarmor.infuse_desc=Infusão da aljava: cada acerto a distância infundido dá um escudo a você.
items.potions.exotic.potionofash.infuse_desc=Infusão da aljava: cada acerto a distância infundido incendeia e esquenta as criaturas por todo o andar.
items.potions.exotic.potionofathmosphericcompression.infuse_desc=Infusão da aljava: cada acerto a distância infundido seca a água do andar e causa dano às criaturas que estão nela.
items.potions.exotic.potionofautumn.infuse_desc=Infusão da aljava: cada acerto a distância infundido transforma a grama alta à vista em solo de milhotrigo.
items.potions.exotic.potionofballlightning.infuse_desc=Infusão da aljava: cada acerto a distância infundido encadeia relâmpagos por todo o andar.
items.potions.exotic.potionofbeacon.infuse_desc=Infusão da aljava: cada acerto a distância infundido solta um clarão cegante por todo o andar, que fere ainda mais os mortos-vivos.
items.potions.exotic.potionofbee.infuse_desc=Infusão da aljava: cada acerto a distância infundido solta uma abelha contra um inimigo à vista, ou dá a você euforia do açúcar se não sobrar nenhum.
items.potions.exotic.potionofbleeding.infuse_desc=Infusão da aljava: cada acerto a distância infundido faz os inimigos à vista sangrarem.
items.potions.exotic.potionofbrain.infuse_desc=Infusão da aljava: cada acerto a distância infundido cria um pergaminho aleatório ao seu lado.
items.potions.exotic.potionofbutterbread.infuse_desc=Infusão da aljava: cada acerto a distância infundido restaura 1000 da sua saciedade.
items.potions.exotic.potionofcleansing.infuse_desc=Acertos a distância infundidos com poção da limpeza dão _4 turnos de Imune à Magia_ ao herói. Usa as cargas normais de infusão da aljava.
items.potions.exotic.potionofcontrol.infuse_desc=Infusão da aljava: cada acerto a distância infundido corrompe as criaturas por todo o andar.
items.potions.exotic.potionofcorrosivegas.infuse_desc=Cada acerto aplica corrosão por 3 turnos, com força inicial de 2 mais 15% da força do acerto. Usa as cargas normais de infusão.
items.potions.exotic.potionofdeath.infuse_desc=Infusão da aljava: cada acerto a distância infundido mata os inimigos à vista que não sejam chefes nem minichefes.
items.potions.exotic.potionofdivineinspiration.infuse_desc=Cada acerto dá a recompensa de experiência do alvo, se ele tiver uma e você estiver abaixo do limite de nível de experiência dele. Usa as cargas normais de infusão.
items.potions.exotic.potionofdragonsbreath.infuse_desc=Cada acerto explode numa labareda de 3x3: os inimigos próximos sofrem dano de fogo extra igual a 35% da força do acerto e pegam fogo. As chamas ficam no chão e podem queimar quem pisar nelas. Usa as cargas normais de infusão da aljava.
items.potions.exotic.potionofearthenarmor.infuse_desc=Cada acerto dá pele arbórea com força igual à metade do seu nível, diminuindo a cada 3 turnos. Usa as cargas normais de infusão.
items.potions.exotic.potionofflower.infuse_desc=Infusão da aljava: cada acerto a distância infundido aplica um efeito aleatório de revestimento de semente em cada inimigo à vista.
items.potions.exotic.potionofgloop.infuse_desc=Infusão da aljava: cada acerto a distância infundido cobre as criaturas por todo o andar com muco cáustico.
items.potions.exotic.potionofhail.infuse_desc=Infusão da aljava: cada acerto a distância infundido congela, gela e fere os inimigos à vista.
items.potions.exotic.potionofhellstorm.infuse_desc=Infusão da aljava: cada acerto a distância infundido solta uma nuvem de fogo infernal no impacto.
items.potions.exotic.potionofhighgrass.infuse_desc=Infusão da aljava: cada acerto a distância infundido faz a grama à vista crescer até virar grama alta.
items.potions.exotic.potionofholy.infuse_desc=Infusão da aljava: cada acerto a distância infundido remove as maldições dos seus pertences e dos itens no andar.
items.potions.exotic.potionofholyfuror.infuse_desc=Infusão da aljava: cada acerto a distância infundido abençoa você.
items.potions.exotic.potionofhotness.infuse_desc=Infusão da aljava: cada acerto a distância infundido desidrata os inimigos à vista e esquenta o lugar em volta deles.
items.potions.exotic.potionofimmortality.infuse_desc=Infusão da aljava: cada acerto a distância infundido enche de novo o seu odre.
items.potions.exotic.potionofironskin.infuse_desc=Infusão da aljava: cada acerto a distância infundido dá a você pele de ferro.
items.potions.exotic.potionoflaserbeam.infuse_desc=Infusão da aljava: cada acerto a distância infundido dispara raios destrutivos através dos inimigos à vista.
items.potions.exotic.potionofmagicfire.infuse_desc=Infusão da aljava: cada acerto a distância infundido solta uma nuvem de fogo mágico no impacto.
items.potions.exotic.potionofmagicalsight.infuse_desc=Cada acerto dá a você vidência. Usa as cargas normais de infusão.
items.potions.exotic.potionofmastery.infuse_desc=É consumida na hora para aprimorar a aljava mágica em um nível, até o nível 10.
items.potions.exotic.potionofnuts.infuse_desc=Infusão da aljava: cada acerto a distância infundido espalha amendoins à sua volta.
items.potions.exotic.potionoforb.infuse_desc=Infusão da aljava: cada acerto a distância infundido invoca um orbe mágico perto do impacto, num quadrado adjacente livre, quando houver.
items.potions.exotic.potionofplague.infuse_desc=Infusão da aljava: cada acerto a distância infundido dá a você uma aura da peste.
items.potions.exotic.potionofpressure.infuse_desc=Infusão da aljava: cada acerto a distância infundido esmaga os inimigos comuns por todo o andar.
items.potions.exotic.potionofprotain.infuse_desc=Infusão da aljava: cada acerto a distância infundido dá 1 de força permanente, mas reduz seus valores de ataque e defesa.
items.potions.exotic.potionofquantumsoup.infuse_desc=Infusão da aljava: cada acerto a distância infundido teleporta as criaturas pelo andar.
items.potions.exotic.potionofradiation.infuse_desc=Infusão da aljava: cada acerto a distância infundido cria um feitiço aleatório ao seu lado.
items.potions.exotic.potionofrelativity.infuse_desc=Infusão da aljava: cada acerto a distância infundido congela o tempo para você.
items.potions.exotic.potionofreproduction.infuse_desc=Infusão da aljava: cada acerto a distância infundido invoca oito cópias espelhadas suas.
items.potions.exotic.potionofshielding.infuse_desc=Acertos a distância infundidos com poção da blindagem dão _5 (+10% da vida máxima) de blindagem_ ao herói. Usa as cargas normais de infusão da aljava.
items.potions.exotic.potionofshroudingfog.infuse_desc=Cada acerto dá a você 1 turno de invisibilidade depois do ataque. Usa as cargas normais de infusão.
items.potions.exotic.potionofsleepparalysis.infuse_desc=Infusão da aljava: cada acerto a distância infundido invoca um demônio da paralisia do sono perto do impacto, num quadrado adjacente livre, quando houver.
items.potions.exotic.potionofslime.infuse_desc=Infusão da aljava: cada acerto a distância infundido espalha manchas aleatórias de slime em volta das criaturas por todo o andar.
items.potions.exotic.potionofsnapfreeze.infuse_desc=Acertos a distância infundidos com poção do congelamento instantâneo vão _congelar o inimigo atingido por 5 turnos_. Usa as cargas normais de infusão da aljava.
items.potions.exotic.potionofsoil.infuse_desc=Infusão da aljava: cada acerto a distância infundido solta um vento de colheita no impacto.
items.potions.exotic.potionofsowing.infuse_desc=Infusão da aljava: cada acerto a distância infundido solta um vento semeador no impacto.
items.potions.exotic.potionofspiral.infuse_desc=Infusão da aljava: cada acerto a distância infundido causa vertigem por todo o andar.
items.potions.exotic.potionofstamina.infuse_desc=Cada acerto dá a você 3 turnos de vigor. Usa as cargas normais de infusão.
items.potions.exotic.potionofstarving.infuse_desc=Infusão da aljava: cada acerto a distância infundido aflige as criaturas por todo o andar com inanição.
items.potions.exotic.potionofstomach.infuse_desc=Infusão da aljava: cada acerto a distância infundido restaura 200 da sua saciedade.
items.potions.exotic.potionofstormclouds.infuse_desc=Acertos a distância infundidos com poção de nuvens tempestuosas soltam um _jato de água pressurizada_. Usa as cargas normais de infusão da aljava.
items.potions.exotic.potionofstrung.infuse_desc=Infusão da aljava: cada acerto a distância infundido dispara raios de energia vegetal através dos inimigos à vista.
items.potions.exotic.potionofsugar.infuse_desc=Infusão da aljava: cada acerto a distância infundido dá a você uma longa euforia do açúcar.
items.potions.exotic.potionofsuperdew.infuse_desc=Infusão da aljava: cada acerto a distância infundido pisoteia a grama alta por todo o andar para soltar as gotas dela.
items.potions.exotic.potionofsupernova.infuse_desc=Infusão da aljava: cada acerto a distância infundido detona explosões em volta dos inimigos à vista e de você.
items.potions.exotic.potionofswelling.infuse_desc=Infusão da aljava: cada acerto a distância infundido faz as criaturas por todo o andar sangrarem.
items.potions.exotic.potionoftears.infuse_desc=Infusão da aljava: cada acerto a distância infundido livra você dos males que a sombra remove.
items.potions.exotic.potionofterror.infuse_desc=Infusão da aljava: cada acerto a distância infundido prolonga o terror das criaturas já aterrorizadas por todo o andar.
items.potions.exotic.potionoftsunami.infuse_desc=Infusão da aljava: cada acerto a distância infundido solta uma enorme nuvem de tempestade no impacto.
items.potions.exotic.potionofworm.infuse_desc=Infusão da aljava: cada acerto a distância infundido dispara raios de energia em forma de verme através dos inimigos à vista.
items.arrowbag.ac_effects=EFEITOS
