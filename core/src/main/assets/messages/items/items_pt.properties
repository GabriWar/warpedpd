items.weapon.melee.windbottle.ability_nothing=A rajada não encontra nada para mover.
items.weapon.melee.windbottle.typical_ability_desc=A Duelista pode destampar a cabaça numa _rajada de vento_ na direção de um quadrado. Tudo no cone de dois quadrados à frente dela é empurrado normalmente _%d quadrado_ para trás e fica cego por 2 turnos. Leva um turno e não precisa de nenhum alvo ao alcance.
items.weapon.melee.windbottle.ability_desc=A Duelista pode destampar a cabaça numa _rajada de vento_ na direção de um quadrado. Tudo no cone de dois quadrados à frente dela é empurrado _%d quadrado_ para trás e fica cego por 2 turnos. Leva um turno e não precisa de nenhum alvo ao alcance.
