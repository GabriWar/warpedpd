items.weapon.melee.deathsword.ability_desc=A Duelista pode _segar_ um inimigo com a espada. Isso causa _%1$d-%2$d de dano_, tem acerto garantido e um quarto do dano causado volta para ela como vida. Custa 2 cargas.
items.weapon.melee.handlight.ability_name=chamuscar
items.weapon.melee.handlight.prompt=Escolha um alvo
items.weapon.melee.handlight.typical_ability_desc=A Duelista pode _chamuscar_ um inimigo com a luz. Isso normalmente causa _%1$d-%2$d de dano_, tem acerto garantido, deixa o alvo queimando e brilha tanto que todo inimigo ao lado dele fica cego por 3 turnos.
items.weapon.melee.handlight.ability_desc=A Duelista pode _chamuscar_ um inimigo com a luz. Isso causa _%1$d-%2$d de dano_, tem acerto garantido, deixa o alvo queimando e brilha tanto que todo inimigo ao lado dele fica cego por 3 turnos.
