items.item.mp_target_unsupported=%s: действие «%s» требует прицеливания, которое пока не поддерживается в сетевой игре.
items.ore.sapphire.desc=Необработанный синий камень, почти чёрный в сердцевине. Сапфиры встречаются глубоко в пещерах.
items.potions.exotic.potionofsoil.infuse_desc=Пропитка колчана: каждый усиленный дальний удар вызывает урожайный ветер в месте попадания.
items.potions.potionofflora.infuse_desc=Пропитка колчана: каждый усиленный дальний удар высаживает случайные семена в месте попадания.
items.potions.potionofparasites.infuse_desc=Пропитка колчана: каждый усиленный дальний удар наделяет владельца паразитическим симбиозом.
items.potions.potionofpeanuts.infuse_desc=Пропитка колчана: каждый усиленный дальний удар накладывает на владельца Ореховую метку.
items.potions.potionofshadows.infuse_desc=Пропитка колчана: каждый усиленный дальний удар укрывает владельца защитной тенью.
items.potions.potionofvine.infuse_desc=Пропитка колчана: каждый усиленный дальний удар призывает хлещущую лозу рядом с местом попадания.
items.scrolls.scroll.wet_pages=Дождь промочил свиток: чернила расплылись, и теперь слова не разобрать!
items.weapon.melee.spork.desc=Это ложка? Или вилка? И то и другое — и ни то ни другое. Врагам лучше не смеяться!
items.easteregg.desc=Яйцо неизвестного существа. Большое, с прочной скорлупой. Кто знает, что скрывается внутри?
items.egg.desc=Яйцо неизвестного существа. Большое, с прочной скорлупой. Кто знает, что скрывается внутри?
items.ore.gem.uses=\n\nЕго купит любой торговец, а алхимик сможет переработать в %d единиц энергии.
items.potions.brews.aquabrew.infuse_desc=Каждое попадание создаёт грозовые облака в месте удара. Расходует обычные заряды пропитки.
items.potions.exotic.potionofallseeing.infuse_desc=Пропитка колчана: каждый усиленный дальний удар раскрывает карту этажа и его тайны.
items.potions.exotic.potionofswelling.infuse_desc=Пропитка колчана: каждый усиленный дальний удар вызывает кровотечение у существ на всём этаже.
items.potions.potionofglowing.infuse_desc=Пропитка колчана: каждый усиленный дальний удар выпускает светящийся газ в месте попадания.
items.caveskey.desc=Древний ключ с мрачной аурой. Открывает портал в тайную область пещер.
items.conchshell.desc=От этой раковины исходит жуткая сила. Трубный зов перенесёт вас к Крабовому королю.
items.potions.elixirs.elixiroffeatherfall.infuse_desc=Пропитка колчана: каждый усиленный дальний удар защищает владельца от урона при падении.
items.rings.ringofsearching.typical_stats=Это кольцо обычно расширяет область тщательного поиска на _%d клеток_.
items.weapon.melee.quick.pocketknife.upgraded=Вы улучшили это оружие. Теперь его можно перековать, чтобы усилить другое оружие ближнего боя.
items.wetlands.pearl.desc=Маленькая идеально круглая жемчужина из приливной заводи. Торговцы охотно платят за такие.
items.potions.exotic.potionofadrenalinesurge.infuse_desc=Пропитка колчана: каждый усиленный дальний удар временно повышает силу владельца.
items.potions.exotic.potionofhellstorm.infuse_desc=Пропитка колчана: каждый усиленный дальний удар выпускает облако адского пламени в месте попадания.
items.potions.exotic.potionofradiation.infuse_desc=Пропитка колчана: каждый усиленный дальний удар создаёт случайное заклинание рядом с владельцем.
items.potions.potionoflightning.infuse_desc=Пропитка колчана: каждый усиленный дальний удар поражает видимых врагов цепной молнией.
items.potions.potionoflove.infuse_desc=Пропитка колчана: каждый усиленный дальний удар очаровывает существ, видящих место попадания.
items.potions.potionofmuscle.infuse_desc=Пропитка колчана: каждый усиленный дальний удар навсегда повышает силу владельца на 1.
items.prisonkey.desc=Древний ключ с бледным свечением. Открывает портал в тайную часть тюрьмы.
items.weapon.melee.minerstool.stats_desc=Это довольно быстрое оружие.\nОно наносит больше урона неорганическим врагам.
items.arrowbag.desc_shocking=Стрелы с грозовым варевом наносят _на 20–60% больше урона_ электричеством.
items.arrowbag.holy_effect=Каждый усиленный удар немного исцеляет вас и поражает цель вспышкой святой энергии.
items.builderstool.not_here=Строить можно только в открытом мире: на поверхности, в горах и в пещерах.
items.ore.silverore.desc=В этой породе блестят светлые жилки самородного серебра — холодного и чистого на ощупь.
items.potions.exotic.potionofbrain.infuse_desc=Пропитка колчана: каждый усиленный дальний удар создаёт случайный свиток рядом с владельцем.
items.potions.exotic.potionofpressure.infuse_desc=Пропитка колчана: каждый усиленный дальний удар сокрушает обычных врагов на всём этаже.
items.potions.exotic.potionofreproduction.infuse_desc=Пропитка колчана: каждый усиленный дальний удар призывает восемь зеркальных копий владельца.
items.potions.exotic.potionofsowing.infuse_desc=Пропитка колчана: каждый усиленный дальний удар поднимает ветер, разбрасывающий семена.
items.potions.potionofbanana.infuse_desc=Пропитка колчана: каждый усиленный дальний удар даёт владельцу опыт с учётом глубины этажа.
items.potions.potionofslowness.infuse_desc=Пропитка колчана: каждый усиленный дальний удар выпускает замедляющие облака в месте попадания.
items.item.discover_hint_alchemy_two=Этот предмет можно изготовить по рецепту с использованием _%1$s_ и _%2$s_.
items.potions.brews.quicksandbrew.infuse_desc=Пропитка колчана: каждый усиленный дальний удар калечит и замедляет врагов у места попадания.
items.potions.elixirs.elixirofbloom.infuse_desc=Пропитка колчана: каждый усиленный дальний удар заставляет траву расти по следам владельца.
items.potions.potionofhypno.infuse_desc=Пропитка колчана: каждый усиленный дальний удар подчиняет существ, видящих место попадания.
items.potions.potionofmending.desc=Это мягкое целебное зелье залечивает часть ран и избавляет от распространённых недугов.
items.armor.glyphs.mirrorimage.desc=Эта руна при получении удара может вызвать на помощь зеркальную копию владельца.
items.potions.potionofmindvision.infuse_desc=Каждое попадание позволяет видеть цель сквозь стены в течение 50 ходов. Расходует обычные заряды пропитки.
items.potions.potionofwithering.infuse_desc=Пропитка колчана: каждый усиленный дальний удар выпускает иссушающие облака в месте попадания.
items.rings.ringofmagic.stats=Это кольцо увеличивает максимальную ману на _%s_ и ускоряет её восстановление.
items.weapon.melee.minigun.stats=Выстрелы этой пушки наносят _%1$d–%2$d ед. урона_. Для эффективного использования нужно _%3$d силы_.
items.weapon.melee.shootgun.stats=Выстрелы этой пушки наносят _%1$d–%2$d ед. урона_. Для эффективного использования нужно _%3$d силы_.
items.weapon.melee.taurcenbow.stats=Стрелы этого лука наносят _%1$d–%2$d ед. урона_. Для эффективного использования нужно _%3$d силы_.
homestead.legacy.saferoommigration.page_tool=Страница безопасного убежища исчезает: комнаты больше нет. Взамен вы получаете инструмент строителя.
items.arrowbag.desc_mindvision=Стрелы с зельем ясновидения позволяют герою видеть мысли поражённого врага.
items.arrowbag.remove_desc=Удалить этот эффект и оставшиеся заряды (%d)? Потраченный ингредиент не вернётся.
items.potions.exotic.potionofash.infuse_desc=Пропитка колчана: каждый усиленный дальний удар поджигает и нагревает существ на всём этаже.
items.potions.exotic.potionofhail.infuse_desc=Пропитка колчана: каждый усиленный дальний удар замораживает, охлаждает и ранит видимых врагов.
items.potions.exotic.potionofmagicfire.infuse_desc=Пропитка колчана: каждый усиленный дальний удар выпускает облако волшебного огня в месте попадания.
items.potions.exotic.potionoftsunami.infuse_desc=Пропитка колчана: каждый усиленный дальний удар создаёт огромное грозовое облако в месте попадания.
items.potions.potionofball.infuse_desc=Пропитка колчана: каждый усиленный дальний удар выпускает газ с прыгающими шарами в месте попадания.
items.spellbook.desc=Ваш верный гримуар. Вкладывайте страницы, чтобы изучать заклинания, и расходуйте ману для их сотворения.
items.wands.wandoffirebolt.stats_desc=Эта палочка выпускает огненный снаряд, наносящий _%1$d–%2$d ед. урона_ и поджигающий врагов.
items.wands.wandofteleportation.desc=Эта палочка гудит от пространственной энергии, готовая отправить цель в другую часть подземелья.
items.weapon.melee.broadsword.desc=Короткий меч с широким тяжёлым клинком. Удобен и для рубящих, и для колющих ударов.
items.arrowbag.desc_stormclouds=Стрелы с зельем грозовых туч выпускают _мощную струю воды под давлением_.
items.food.goldenjelly.effect=Пол подземелья усыпан липкими спорами! Куда я иду? И зачем вообще нужна обувь?!
items.waterskin.desc_splash=В бурдюке достаточно росы, чтобы _плеснуть_ ею себе в лицо и получить ускорение и невидимость.
items.weapon.melee.axe.desc=Тяжёлый однолезвийный топор. Мощно рубит, но замахивается медленно.
items.weapon.melee.nunchakus.desc=Две палки из твёрдой древесины, соединённые верёвкой. Вращающимися ударами можно оглушить врага.
items.arrowbag.desc_levitation=Стрелы с зельем левитации вызывают у поражённого врага _головокружение на 3 хода_.
items.potions.brews.wickedbrew.infuse_desc=Пропитка колчана: каждый усиленный дальний удар выпускает ядовитый и парализующий газ в месте попадания.
items.potions.exotic.potionoflaserbeam.infuse_desc=Пропитка колчана: каждый усиленный дальний удар поражает видимых врагов разрушительными лучами.
items.stoneore.desc=Кусок каменной руды. Его можно выгодно продать торговцу.
items.upgradeblobyellow.desc=В этом комке жёлтой слизи заключена слабая магия. При использовании улучшает снаряжение на +1.
items.adamantarmor.desc=Даже в таком плачевном состоянии эти бронепластины явно хранят могущественную магию.
items.potions.elixirs.elixirofhoneyedhealing.infuse_desc=Пропитка колчана: каждый усиленный дальний удар исцеляет владельца, снимает недуги и восполняет сытость.
items.potions.elixirs.elixirofvitality.infuse_desc=Пропитка колчана: каждый усиленный дальний удар исцеляет владельца, снимает недуги и создаёт барьер.
items.potions.exotic.potionofalcohol.infuse_desc=Пропитка колчана: каждый усиленный дальний удар надолго опьяняет владельца.
items.potions.exotic.potionofautumn.infuse_desc=Пропитка колчана: каждый усиленный дальний удар превращает видимую высокую траву в почву для кукурузопшеницы.
items.potions.exotic.potionofstrung.infuse_desc=Пропитка колчана: каждый усиленный дальний удар поражает видимых врагов лучами растительной энергии.
items.potions.potionoffirestorm.infuse_desc=Пропитка колчана: каждый усиленный дальний удар вызывает пламя преисподней и нагревает окружающих существ.
items.potions.potionoftomatosoup.infuse_desc=Пропитка колчана: каждый усиленный дальний удар восстанавливает сытость на величину силы владельца.
items.upgradeblobred.desc=В этом комке красной слизи заключена сильная магия. При использовании улучшает снаряжение на +3.
items.weapon.melee.alchemy.forceglove.stats_desc=Это оружие отбрасывает ближайших врагов.\n\nИм можно атаковать на расстоянии.
items.weapon.melee.alchemy.sharpkatana.stats_desc=Это оружие наносит очень слабый минимальный урон, но его максимальный урон немного повышен.
items.weapon.missiles.empbola.stats_desc=Это оружие калечит и ненадолго оглушает цель, а против механизмов особенно разрушительно.
items.arrowbag.desc_cleansing=Стрелы с зельем очищения дают герою _4 хода невосприимчивости к магии_.
items.arrowbag.desc_shielding=Стрелы с зельем защиты дают герою _щит на 5 ед. (+10% от максимального здоровья)_.
items.bookoftranscendence.desc=Исходящий от книги свет пронизывает вас насквозь. Рядом с ней становится не по себе.
items.citykey.desc=Древний ключ с золотым свечением. Открывает портал в тайную часть города дворфов.
items.emptybottle.any_desc=Пустая бутылка или бутылка воды. При приготовлении зелья из семян одна такая расходуется из рюкзака.
items.food.jackolantern.desc=Этот гриб излучает странное тепло. Выпустить заключённый в нём огонь может быть опасно.
items.hallskey.desc=Древний ключ с багровым свечением. Открывает портал в тайную часть чертогов демонов.
items.potions.elixirs.elixirofdragonsblood.infuse_desc=Пропитка колчана: каждый усиленный дальний удар наделяет владельца огненной силой и согревает его.
items.potions.exotic.potionofgloop.infuse_desc=Пропитка колчана: каждый усиленный дальний удар покрывает существ на всём этаже едкой слизью.
items.potions.exotic.potionoftears.infuse_desc=Пропитка колчана: каждый усиленный дальний удар очищает владельца от недугов, снимаемых теневой магией.
items.potions.potionofdigesting.infuse_desc=Пропитка колчана: каждый усиленный дальний удар выпускает облака разъедающей кислоты в месте попадания.
items.potions.potionoffirelightning.infuse_desc=Пропитка колчана: каждый усиленный дальний удар поражает видимых врагов цепной огненной молнией.
items.potions.potionoficestorm.infuse_desc=Пропитка колчана: каждый усиленный дальний удар вызывает ледяную бурю и охлаждает ближайших существ.
items.potions.potionofsoda.infuse_desc=Пропитка колчана: каждый усиленный дальний удар выпускает пузырящийся взрывчатый газ в месте попадания.
items.sewerskey.desc=Древний ключ с зелёным свечением. Открывает портал в тайную часть канализации.
items.townreturnbeacon.creatures=Психическая аура ближайших существ не позволяет сейчас использовать маяк.
items.food.goldenjelly.desc=Желатиновый гриб, покрытый липкой слизью. Если его съесть, наверняка начнётся веселье.
items.keys.skeletonkey.desc=Универсальный ключ, вырезанный из кости. Грубые зубцы позволяют открыть любой замок на этом этаже.
items.potions.elixirs.elixirofthehunt.infuse_desc=Пропитка колчана: каждый усиленный дальний удар дарует владельцу ясновидение, скорость и меткость.
items.potions.exotic.potionofstomach.desc=Это питательное варево вполне заменит обычный обед.
items.weapon.melee.alchemy.holysword.normal_desc=Тяжёлый меч, в котором дремлет огромная сила. Эх, если бы хватало сил ею воспользоваться...
items.weapon.melee.alchemy.spearnshield.stats_desc_defense=Это оружие снижает физический урон на _0–%d_. С улучшением защита возрастает.
items.ancientcoin.desc=От этой монеты исходит жуткая сила. Прочитайте надпись, чтобы попасть к Королю разбойников.
items.arrowbag.desc_invisibility=Стрелы с зельем невидимости _ослепляют поражённого врага на 2 хода_.
items.potions.elixirs.elixiroficytouch.infuse_desc=Пропитка колчана: каждый усиленный дальний удар наделяет владельца морозной силой и охлаждает его.
items.potions.elixirs.elixirofrestoration.infuse_desc=Пропитка колчана: каждый усиленный дальний удар исцеляет владельца и снимает вредные эффекты.
items.potions.exotic.potionofworm.infuse_desc=Пропитка колчана: каждый усиленный дальний удар поражает видимых врагов червеобразными лучами энергии.
items.rings.ringofsating.stats=Это кольцо помогает экономить припасы, замедляя наступление голода на _%s%%_.
items.weapon.melee.fightgloves.desc=Боевые перчатки из кожи с металлическими накладками. Хороший удар может оглушить врага.
items.armor.asceticarmor.desc=Простые обмотки отшельников. Боль учит: получив удар, владелец может ненадолго ускориться.
items.armor.performerarmor.desc=Броский сценический жакет. Враги, ударившие владельца, могут попасть под очарование его выступления.
items.arrowbag.desc_paralyticgas=Стрелы с зельем парализующего газа _парализуют поражённого врага на 2 хода_.
items.potions.exotic.potionofstarving.infuse_desc=Пропитка колчана: каждый усиленный дальний удар насылает голод на существ всего этажа.
items.potions.potionofgrass.infuse_desc=Пропитка колчана: каждый усиленный дальний удар выпускает дурманящий травяной дым в месте попадания.
items.potions.potionofkiwi.infuse_desc=Пропитка колчана: каждый усиленный дальний удар вызывает обильный рост растений в месте попадания.
items.weapon.melee.magestaff.desc=Посох из зачарованного дерева. Медленно наносит удары, зато отлично проводит магическую энергию.
items.armor.glyphs.siphoning.desc=Эта мрачная руна вытягивает жизненную силу атакующих и передаёт её владельцу доспеха.
items.mushroom.desc=Настоящий гриб-поганка! И вырос прямо в этом сыром подземелье! Кто бы мог подумать?
items.potions.brews.overgrowthbrew.infuse_desc=Пропитка колчана: каждый усиленный дальний удар выращивает растения и опутывает корнями врагов у места попадания.
items.potions.elixirs.elixirofarcanearmor.infuse_desc=Пропитка колчана: каждый усиленный дальний удар даёт владельцу временную защиту от магии.
items.potions.exotic.potionofprotain.desc=Это богатое белком варево навсегда укрепляет мышцы, увеличивая силу на 1.
items.potions.potionofsnowstorm.infuse_desc=Пропитка колчана: каждый усиленный дальний удар вызывает снежный вихрь и охлаждает ближайших существ.
items.weapon.enchantments.poison.desc=Эти чары насыщают удары сильным ядом, значительно повышая вероятность отравить цель.
items.weapon.melee.bow.bowweapon.bow_desc=Каждая стрела из этого лука наносит _%1$d–%2$d ед. урона_ и расходует _1 стрелу_.
items.activemrdestructo2.desc=Надпись гласит: «МИСТЕР РАЗРУШИТЕЛЬ 2.0». Усовершенствованный механизм! Бросьте его, чтобы установить более мощную турель.
items.armor.glyphs.afterimage.desc=Эта руна значительно ослабляет защиту доспеха, но сильно повышает уклонение владельца.
items.arrowbag.desc_infernal=Стрелы с адским варевом вызывают _поток адского пламени_ примерно вдвое слабее самого варева.
items.arrowbag.potion_desc=Сейчас в колчане хранится эффект _%1$s_: он сработает при следующих %2$d бросках метательного оружия.
items.arrowitem.desc=Эта стрела осталась целой. Её можно подобрать и использовать ещё раз.
items.misc.autopotion.desc=Этот амулет автоматически расходует зелье исцеления, если здоровье падает ниже 10%.
items.potions.brews.thunderheadbrew.infuse_desc=Пропитка колчана: каждый усиленный дальний удар выпускает заряженный пар, поражающий током всех внутри.
items.potions.elixirs.elixirofaquaticrejuvenation.infuse_desc=Пропитка колчана: каждый усиленный дальний удар даёт владельцу запас исцеления во время пребывания в воде.
items.ore.ore.smith=\n\nГородской кузнец-тролль переплавит %d таких кусков в превосходный сердечник — по одному тиглю в день.
items.potions.exotic.potionofabsolutezero.infuse_desc=Пропитка колчана: каждый усиленный дальний удар замораживает и сильно охлаждает существ на всём этаже.
items.potions.exotic.potionofdeath.infuse_desc=Пропитка колчана: каждый усиленный дальний удар убивает видимых врагов, кроме боссов и мини-боссов.
items.potions.potionofwine.desc=Это виноградное варево опьяняет, меняя вашу походку и восприятие окружающего мира.
items.rings.ringofsating.combined_stats=Надетые кольца объединяют свою силу и в сумме замедляют наступление голода на _%s%%_.
items.weapon.melee.scalpel.desc=Короткий острый хирургический инструмент. Серьёзно ранить им трудно, но причинять боль — самое то.
items.armor.bulletarmor.desc=Тяжёлый бронежилет. Защищает лучше обычных лат, но немного сковывает движения.
items.armor.glyphs.bounce.desc=Эта руна отбрасывает нападающих всплеском силы, когда те бьют владельца доспеха.
items.arrowbag.desc_blizzard=Стрелы с метельным варевом вызывают _снежную бурю_ примерно вдвое слабее самого варева.
items.arrowbag.seed_desc=Сейчас в колчане хранится эффект семени _%1$s_: он сработает при следующих %2$d бросках метательного оружия.
items.dewvial.desc=Небольшой стеклянный флакон для волшебной росы. Изобретатель может улучшить его особыми свойствами.
items.potions.exotic.potionofhotness.infuse_desc=Пропитка колчана: каждый усиленный дальний удар иссушает видимых врагов и нагревает местность вокруг них.
items.potions.exotic.potionofshroudingfog.infuse_desc=Каждое попадание даёт владельцу 1 ход невидимости после атаки. Расходует обычные заряды пропитки.
items.waterskin.desc_water_action=Росы в бурдюке хватит, чтобы _полить_ землю вокруг и пробудить буйную растительность.
items.weapon.melee.alchemy.lance.stats_desc=Чем дальше вы прошли перед атакой, тем сильнее удар.\nМожно атаковать поверженных врагов.
items.weapon.melee.alchemy.lancenshield.stats_desc_attack=Чем дальше вы прошли перед атакой, тем сильнее удар.\nМожно атаковать поверженных врагов.
items.weapon.melee.alchemy.lancenshield.typical_stats_desc_attack=Чем дальше вы прошли перед атакой, тем сильнее удар.\nМожно атаковать поверженных врагов.
items.weapon.melee.magebook.desc=Магическая книга из далёкой башни. Читать её нелегко, зато достаточно тяжёлая, чтобы оглушать врагов.
items.weapon.melee.relic.lokisflail.desc=Оружие хитреца, окутанное тенями. При полном заряде дарует владельцу невидимость.
items.weapon.missiles.wave.desc=Метательное оружие в форме полумесяца. Рассекает воздух с характерным свистом.
homestead.legacy.saferoommigration.delivered=Все вещи из безопасной комнаты перенесли в город: они лежат в сундуке у площади.
items.potions.brews.frostfirebrew.infuse_desc=Пропитка колчана: каждый усиленный дальний удар замораживает, опутывает корнями и поджигает область попадания.
items.potions.potionofbutter.infuse_desc=Пропитка колчана: каждый усиленный дальний удар оставляет случайные скользкие пятна масла в месте попадания.
items.potions.potionofultraviolett.infuse_desc=Пропитка колчана: каждый усиленный дальний удар обрушивает опасный нефильтрованный солнечный свет в месте попадания.
items.weapon.enchantments.paralysis.desc=Удары этого оружия могут ненадолго парализовать врага, лишив его возможности действовать.
items.weapon.missiles.throwingwave.stats_desc=Это оружие вводит цель в зачарованное исступление и отнимает четверть её оставшегося здоровья.
items.arrowbag.desc_divineinspiration=Стрелы с зельем божественного вдохновения дают герою опыт за поражённого врага.
items.bookoflife.preventing2=Книгу намертво оплели лозы. Чтобы её открыть, нужно отыскать выходной пьедестал с Санчикарахом...
items.potions.exotic.potionofsuperdew.infuse_desc=Пропитка колчана: каждый усиленный дальний удар приминает высокую траву на всём этаже, высвобождая росу.
items.rings.ringofmagic.typical_stats=Это кольцо обычно увеличивает максимальную ману на _%s_ и ускоряет её восстановление.
items.seekingclusterbombitem.desc=Мощная разрушительная бомба с волшебным механизмом наведения. После запуска сама преследует врагов.
items.wands.wandofavalanche.stats_desc=Эта палочка наносит по области _%1$d–%2$d ед. урона_ и может ненадолго парализовать попавших под удар.
items.wands.wandofpoison.bmage_desc=Когда _боевой маг_ бьёт врага посохом яда, тот может отравиться.
items.wands.wandofslowness.bmage_desc=Когда _боевой маг_ бьёт врага посохом замедления, тот может замедлиться.
items.arrowbag.desc_shroudingfog=Стрелы с зельем укрывающего тумана делают поражённого персонажа _невидимым на 2 хода_.
items.arrowbag.desc_toxicgas=Стрелы с зельем ядовитого газа накладывают на врага _яд на 3 хода (+20% урона)_.
items.food.monstermeat.desc=Свежее мясо поверженного врага. Сытное, но желудок может воспротивиться такому угощению.
items.keys.icekey.desc=Ключ из чёрного железа, покрытый нетающим инеем. Кто-то носил его глубоко среди вечных льдов.
items.ore.diamond.desc=Твёрже любого вашего снаряжения и сверкает даже без огранки. Алмазы находят в самых глубоких жилах.
items.potions.exotic.potionofflower.infuse_desc=Пропитка колчана: каждый усиленный дальний удар накладывает на видимых врагов случайный эффект семенного покрытия.
items.potions.exotic.potionofsupernova.infuse_desc=Пропитка колчана: каждый усиленный дальний удар вызывает взрывы вокруг видимых врагов и владельца.
items.potions.potionoftomatosoup.desc=Ароматный горячий томатный бульон. Утоляет голод на величину вашей текущей силы.
items.weapon.melee.megacannon.stats=Заряды этой пушки наносят _%1$d–%2$d ед. урона_ каждый. Для эффективного использования нужно _%3$d силы_.
items.arrowbag.desc_aqua=Стрелы с водным варевом выпускают _грозовые облака_ примерно вдвое слабее действия зелья грозовых туч.
items.arrowbag.desc_experience=Стрелы с зельем опыта наносят _огромный дополнительный урон нежити и демонам_.
items.bone.desc=От этой кости исходит жуткая сила. Прочитайте надпись, чтобы открыть портал к Королю скелетов.
items.potions.potionofpeanuts.desc=Ореховое варево наделяет вас силой ореха, усиливая эффекты, связанные с Ореховой меткой.
items.potions.potionofseed.desc=Мутно-зелёная жидкость с запахом земли и корней. Выпив её, вы получите случайное семя у ног.
items.spells.forcepush.desc=Заклинание выпускает мощную кинетическую волну, разбрасывая всех видимых врагов в случайных направлениях.
items.weapon.enchantments.aresleech.desc=Чары Ареса вытягивают жизнь из ближайших врагов, исцеляют владельца и заряжают реликтовое оружие.
items.weapon.missiles.incendiaryshuriken.desc=Эти сюрикены покрыты летучей смесью: при попадании она воспламеняется и поджигает цель.
items.potions.brews.frigidbrew.infuse_desc=Пропитка колчана: каждый усиленный дальний удар замораживает область попадания и вызывает ледяную бурю.
items.potions.elixirs.elixirofwarmth.infuse_desc=Пропитка колчана: каждый усиленный дальний удар защищает владельца от холода и позволяет поджигать врагов в ближнем бою.
items.potions.exotic.potionofathmosphericcompression.infuse_desc=Пропитка колчана: каждый усиленный дальний удар осушает воду на этаже и ранит стоящих в ней существ.
items.weapon.melee.alchemy.spearnshield.typical_stats_desc_defense=Обычно это оружие снижает физический урон на _0–%d_. С улучшением защита возрастает.
items.weapon.melee.assassinsknife.stats_desc=Это оружие атакует _примерно на 50% быстрее_ обычного оружия 2-го ранга, но наносит меньше урона за удар.
items.weapon.melee.axe.stats_desc=Это оружие атакует _примерно на 17% медленнее_ обычного оружия 4-го ранга, но наносит больше урона за удар.
items.weapon.melee.magestaff.stats_desc=Это оружие атакует _примерно на 33% медленнее_ обычного оружия 2-го ранга, но наносит больше урона за удар.
items.weapon.melee.trumpet.desc=Медный духовой инструмент с громким, резким звуком. Его гул поражает всех вокруг цели.
items.weapon.missiles.throwingskull.desc=Зловещее оружие из проклятой кости. Оно метит поражённые души, обнажая их жизненную силу и сущность.
items.potions.potionofdirt.infuse_desc=Пропитка колчана: каждый усиленный дальний удар превращает подходящую почву в случайные поля с посевами.
items.potions.potionofharvest.infuse_desc=Пропитка колчана: каждый усиленный дальний удар превращает проходимую почву в случайные поля с посевами.
items.potions.potionofmight.infuse_desc=Пропитка колчана: каждый усиленный дальний удар навсегда даёт владельцу 1 силу и 5 максимального здоровья.
items.returnbeacon.desc=Маяк возвращения — сложный магический прибор, который переносит вас в уже посещённое место.
items.roamertrophy.desc_wolf=Шкура великого волка %s с серебристыми кончиками меха. Доказательство победы, за которое торговцы хорошо заплатят.
items.townreturnbeacon.desc=Маяк возвращения — сложный магический прибор, который переносит вас в уже посещённое место.
items.upgradeblobviolet.desc=В этом комке фиолетовой слизи заключена невероятно сильная магия. При использовании улучшает снаряжение на +5.
items.potions.elixirs.elixirofmight.infuse_desc=Пропитка колчана: каждый усиленный дальний удар навсегда повышает силу владельца и временно увеличивает его максимальное здоровье.
items.potions.exotic.potionofslime.infuse_desc=Пропитка колчана: каждый усиленный дальний удар разбрасывает случайные лужицы слизи вокруг существ на всём этаже.
items.potions.exotic.potionofsoil.desc=Разбив это землистое зелье, вы выпустите плодородный ветер, который обогатит почву на всём этаже.
items.rings.ringofsearching.combined_stats=Надетые кольца объединяют свою силу и в сумме расширяют область тщательного поиска на _%d клеток_.
items.weapon.melee.alchemy.lancenshield.stats_desc_defense=Это оружие снижает физический и магический урон на 0–%d. С улучшением защита возрастает.
items.weapon.melee.alchemy.obsidianshield.stats_desc=Это оружие снижает физический и магический урон на 0–%d. С улучшением защита возрастает.
items.weapon.melee.bow.bowweapon.bow_typical_desc=Обычно каждая стрела из этого лука наносит _%1$d–%2$d ед. урона_ и расходует _1 стрелу_.
items.wetlands.seashell.desc=Ребристая раковина сердцевидки из приливной заводи, внутри гладкая и розовая. За такую безделушку торговец даст немного денег.
items.armor.glyphs.mirroring.desc=Эта руна создаёт при получении удара зеркальную копию владельца, помогающую ему в бою.
items.armor.soldierarmor.desc=Прочный армейский жилет. Получив удар, владелец может войти в боевой настрой и ненадолго обрести благословение.
items.potions.exotic.potionofplague.desc=Стоит открыть эту зловонную склянку, как смертоносная чума быстро отравит всех врагов на этаже.
items.potions.potionofhydrogenfire.infuse_desc=Пропитка колчана: каждый усиленный дальний удар вспыхивает галогенметановым пламенем и сильно нагревает окружающих существ.
items.reddewdrop.desc=Ярко-красная капля росы, полная целебной энергии. Исцеляет в пять раз сильнее обычной капли.
items.weapon.melee.alchemy.holysword.ability_desc=Вам не хватает силы, чтобы пробудить истинную мощь этого оружия. Его способности пока недоступны.
items.armor.followerarmor.desc=Плащ верующего. Иногда полученный удар пробуждает в нём исцеляющую силу.
items.arrowbag.desc_dragonsbreath=Стрелы с зельем драконьего дыхания _поджигают поражённого врага_ и наносят _дополнительный урон огнём_.
items.food.earthstar.desc=В этом грибе растёт крохотный кусочек неведомого мира. И почему-то совсем не хочется там оказаться...
items.ore.ironore.desc=Тяжёлый светлый камень с ржавчиной в трещинах. Кузнец выплавит из него хорошее железо, удалив всё лишнее.
items.potions.exotic.potionofterror.infuse_desc=Пропитка колчана: каждый усиленный дальний удар продлевает страх напуганных существ на всём этаже.
items.potions.potionofhoney.desc=Это сладкое золотистое зелье наполняет тело сахаром и надолго дарует мощный прилив энергии.
items.wands.wandofamok.bmage_desc=Когда _боевой маг_ бьёт врага посохом безумия, тот может впасть в ярость.
items.wands.wandoffirebolt.bmage_desc=Когда _боевой маг_ бьёт врага посохом огненного снаряда, тот может загореться.
items.weapon.missiles.honeyarrow.desc=Стрела с хрупкой капсулой мёда и одной очень сердитой пчелой, которая вырвется наружу в месте попадания.
items.arrowbag.desc_magicalsight=Стрелы с зельем магического зрения позволяют герою _раскрыть всё в области 13×13 клеток вокруг себя_.
items.potions.exotic.potionofash.desc=Если открыть этот флакон, его горючее содержимое охватит всех врагов на этаже испепеляющим пламенем.
items.weapon.melee.assassinsknife.desc=Смертоносные быстрые клинки для ударов по жизненно важным органам. Лёгкий вес позволяет наносить удары один за другим.
items.bags.foodpouch.desc=Просторный кожаный мешок для еды. Помогает держать припасы в порядке и сохранять их свежими.
items.bookofdead.preventing2=Стоит вам начать читать, как тьма застилает глаза! Найдите выходной пьедестал с Санчикарахом...
items.food.goldennut.discover_hint=Вернитесь через городской ключ после победы над 100 золотыми ворами, скелетами, пираньями-альбиносами и гноллами-лучниками.
items.potions.elixirs.elixiroftheshade.infuse_desc=Пропитка колчана: каждый усиленный дальний удар делает владельца невидимым, и следующие атаки не нарушают невидимость.
items.potions.exotic.potionofholy.infuse_desc=Пропитка колчана: каждый усиленный дальний удар снимает проклятия с вещей владельца и предметов на этаже.
items.rings.ringofsearching.stats=Это кольцо помогает замечать необычные детали и расширяет область тщательного поиска на _%d клеток_.
items.roamertrophy.desc_yeti=Клык старого йети %s длиной с кинжал. Доказательство победы, за которое торговцы хорошо заплатят.
items.spells.seasonchange.desc=Заклинание быстро сменяет местные времена года: все видимые растения сбрасывают семена и увядают.
items.weapon.melee.bow.bowweapon$penetrationshotbuff.desc=Дуэлянт с невероятной силой закручивает тетиву, придавая стреле вращение.\n\nСледующая стрела нанесёт дополнительный урон и непременно попадёт в цель. Если враг не стоит вплотную, стрела также пробьёт его броню.
items.weapon.melee.royalspork.stats_desc=Это оружие атакует _примерно в 6,7 раза быстрее_ обычного оружия 4-го ранга, но наносит гораздо меньше урона за удар.
items.weapon.melee.saber.desc=Символ рыцаря королевской охраны. Эта сабля позволяет отбивать часть вражеских атак и защищать себя.
items.potions.potionofgoo.desc=Густая тягучая жидкость, будто живая. При разбивании покрывает ближайших существ едкой слизью.
items.potions.potionofmuscle.desc=Густое варево заставляет мышцы покалывать. Выпив его, вы навсегда увеличите силу на 1.
items.potions.potionofpepper.desc=Острая красная жидкость после употребления окружает вас жаркой аурой, обжигающей всякого, кто осмелится напасть.
items.spells.featherfall.desc=Заклинание ненадолго дарует чувство невесомости и защищает от урона при падении в пропасть.
items.wands.wandofflock.stats_desc=Эта палочка призывает до _%d овец_ у выбранного места. Овцы безобидны, но могут преграждать врагам путь.
items.weapon.missiles.hugeshuriken.desc=Огромные металлические звёзды с острыми лезвиями. При попадании наносят серьёзный урон.
items.nornstone.nornstone.desc=Изысканный самоцвет с древней силой. Отнесите три таких камня к алтарю — возможно, получите особую награду.
items.potions.brews.blindingbrew.infuse_desc=Пропитка колчана: каждый усиленный дальний удар ослепляет врагов у места попадания и наполняет местность светящимся дымом.
items.potions.potionofsun.infuse_desc=Пропитка колчана: каждый усиленный дальний удар уничтожает нежить, поражаемую обычным солнечным эффектом этого зелья.
items.wands.wandofamok.stats_desc=Эта палочка на _%d ходов_ повергает врагов в ярость. Если применить её к себе, ненадолго закружится голова.
items.spells.forcefield.desc=Заклинание создаёт вокруг заклинателя магический барьер — временный щит от входящего урона.
items.bags.keyring.desc=Прочное металлическое кольцо для самых разных ключей. С ним они всегда под рукой и не теряются в вещах.
items.potions.exotic.potionofbeacon.infuse_desc=Пропитка колчана: каждый усиленный дальний удар озаряет весь этаж ослепляющей вспышкой, особенно опасной для нежити.
items.potions.exotic.potionofgloop.desc=Густая чёрная жижа покрывает всех врагов на этаже едкой слизью, разъедающей броню и плоть.
items.potions.exotic.potionofradiation.desc=Выпив светящееся варево, вы наполняетесь магическим излучением, усиливающим следующую магическую атаку.
items.potions.potionofshield.desc=После употребления эта розоватая жидкость окружает вас розовым барьером, надолго защищающим от урона.
items.wands.wandofavalanche.bmage_desc=Когда _боевой маг_ бьёт врага посохом лавины, тот может ненадолго оказаться парализован.
items.wands.wandofslowness.desc=Ледяная голубая палочка источает холодную ауру. Её луч значительно замедляет движения врага.
items.ore.deepsilver.desc=Этот металл добывают лишь в глубине, куда никогда не проникал свет. Он испускает слабое зеленовато-морское сияние.
items.wands.wandoftelekinesis.stats_desc=Эта палочка отталкивает врагов лучом длиной до _%d клеток_, подбирая по пути предметы и активируя ловушки.
items.weapon.melee.relic.aressword.desc=Легендарный клинок, выкованный в пламени войны. При полном заряде дарует владельцу мощную регенерацию.
items.potions.elixirs.elixirofclarity.infuse_desc=Пропитка колчана: каждый усиленный дальний удар восполняет ману владельца и увеличивает опыт за следующие убийства.
items.potions.potionofhaste.infuse_desc=Каждое попадание даёт владельцу 3 хода ускорения и снимает усталость от стрельбы из лука. Расходует обычные заряды пропитки.
items.spells.holyblast.desc=Заклинание призывает очищающую святую энергию: снимает проклятия с вещей и устраняет эффект слабости.
items.weapon.melee.alchemy.chainflail.stats_desc=Это оружие достаёт до удалённых врагов.\nЕго точность немного снижена.\nИм нельзя наносить скрытные удары.
items.food.fish.desc_summer=Окунь из тёплого мелководья, очищенный и выпотрошенный прямо на перилах моста. До сих пор прохладный от воды.
items.weapon.melee.alchemy.lancenshield.typical_stats_desc_defense=Обычно это оружие снижает физический и магический урон на 0–%d. С улучшением защита возрастает.
items.weapon.melee.alchemy.obsidianshield.typical_stats_desc=Обычно это оружие снижает физический и магический урон на 0–%d. С улучшением защита возрастает.
items.weapon.missiles.curareshuriken.desc=Эти сюрикены пропитаны кураре — сильным парализующим ядом. Одно попадание лишит цель возможности двигаться.
items.yellowdewdrop.desc=Тёплая жёлтая капля росы, более действенная, чем обычная. Исцеляет вдвое сильнее простой капли.
items.activemrdestructo.desc=Надпись гласит: «МИСТЕР РАЗРУШИТЕЛЬ». Странный механизм! Бросьте его, чтобы установить неподвижную турель, стреляющую лучами по врагам.
items.armor.machinearmor.desc=Это целый механизм, а не обычная броня. Он поглощает огромный урон, но тяжесть сильно мешает уклоняться.
items.potions.brews.causticbrew.infuse_desc=Дальние удары с едким варевом _покрывают область 5×5 клеток едкой слизью_. Расходуют обычные заряды колчана.
items.potions.exotic.potionoforb.infuse_desc=Пропитка колчана: каждый усиленный дальний удар призывает волшебную сферу на свободную соседнюю клетку у места попадания.
items.potions.potionofhealing.infuse_desc=Каждое попадание восстанавливает владельцу 1 ед. здоровья плюс 40% силы удара, если лечение не запрещено. Расходует обычные заряды пропитки.
items.potions.potionofinfection.desc=В тёмной шевелящейся жидкости кишит невидимая жизнь. Разбившись, флакон призывает враждебного духа в выбранную клетку.
items.potions.potionofparasites.desc=Странная жидкость устанавливает с вашим телом паразитический симбиоз, даруя полезные эффекты, но требуя за них плату.
items.bookoftranscendence.preventing2=Стоит вам начать читать, как пронзительный свет слепит глаза! Найдите выходной пьедестал с Санчикарахом...
items.nornstone.orangenornstone.desc=Могущественный оранжевый камень, излучающий огненное тепло. Отнесите три норнских камня к алтарю, чтобы раскрыть их силу.
items.potions.exotic.potionofbleeding.desc=Брошенное едкое зелье вызывает у всех видимых врагов сильное кровотечение: они постепенно теряют здоровье.
items.spells.spontaneouscombustion.desc=Нестабильное заклинание самопроизвольно поджигает заклинателя. Это опасно, но пламя можно использовать с умом.
items.waterskin.desc_bless=Бурдюк переполнен энергией! Теперь вы можете _благословлять_ вещи, снимать с них проклятия и иногда улучшать их.
items.weapon.missiles.bottlefire.desc=Примитивный коктейль Молотова. Поджигает поражённого врага, а если разобьётся о землю — воспламенит всё вокруг.
items.arrowbag.mode_desc=При циклическом режиме эффекты расходуются по очереди, по одному на удар. При случайном — выбираются наугад. Пустые ячейки пропускаются.
items.food.eagleegg.desc=Большое белое яйцо с ржаво-коричневыми пятнами, украденное из орлиного гнезда. Отличный обед — если удалось унести ноги.
items.potions.exotic.potionofsowing.desc=Разбитое зелье выпускает ветер, который разносит семена по всему этажу и засеивает ими участки почвы.
items.potions.potionofeye.desc=Прозрачная жидкость необычайно обостряет зрение, открывая все видимые ловушки и потайные двери.
items.violetdewdrop.desc=Мерцающая фиолетовая капля росы, насыщенная целебной магией. Исцеляет втрое сильнее обычной капли.
items.weapon.missiles.boomerang.stats_desc=Это необычное оружие всегда возвращается к метателю и иногда выбивает каплю росы из поражённой цели.
items.weapon.missiles.smallchakram.desc=В умелых руках этот небольшой диск с острыми краями словно сам прыгает обратно в ладонь после броска.
items.dumplingbomb.desc=Ароматная бомба выпускает успокаивающее облако: ближайшие враги засыпают на ходу и телепортируются далеко прочь.
items.nornstone.purplenornstone.desc=Могущественный фиолетовый камень, пульсирующий тёмной энергией. Отнесите три норнских камня к алтарю, чтобы раскрыть их силу.
items.nornstone.yellownornstone.desc=Могущественный жёлтый камень, потрескивающий молниями. Отнесите три норнских камня к алтарю, чтобы раскрыть их силу.
items.ore.skyiron.desc=Железо с высоких пиков, где холод и разреженный воздух сделали его голубоватым и особенно прочным. В ладони оно не согревается.
items.potions.exotic.potionofbee.infuse_desc=Пропитка колчана: каждый усиленный дальний удар выпускает пчелу на видимого врага, а если врагов нет — дарует сахарный прилив сил.
items.potions.exotic.potionofcorrosivegas.infuse_desc=Каждое попадание вызывает коррозию на 3 хода с начальной силой 2 плюс 15% силы удара. Расходует обычные заряды пропитки.
items.potions.exotic.potionofflower.desc=Брошенное изумрудное варево высвобождает семена волшебных растений, накладывая случайные растительные эффекты на всех видимых врагов.
items.potions.exotic.potionofnuts.desc=Выпитое странное варево создаёт арахис на всех соседних клетках, усыпая землю питательными орешками.
items.roamertrophy.desc_scorpion=Жало гигантского скорпиона %s, на котором ещё блестит яд. Доказательство победы, за которое торговцы хорошо заплатят.
homestead.legacy.saferoommigration.waiting=Безопасная комната исчезла. Всё, что вы в ней оставили, перенесли в город и сложили в сундук у площади.
items.nornstone.bluenornstone.desc=Могущественный синий камень, мерцающий магическим инеем. Отнесите три норнских камня к алтарю, чтобы раскрыть их силу.
items.potions.exotic.potionofprotain.infuse_desc=Пропитка колчана: каждый усиленный дальний удар навсегда повышает силу владельца на 1, но снижает навыки атаки и защиты.
items.potions.potionoffrost.infuse_desc=Каждое попадание охлаждает цель на 4 хода, а после атаки может с вероятностью 20% заморозить её. Расходует обычные заряды пропитки.
items.potions.potionoflantern.desc=Выпив это зелье, вы надолго озарите тело тёплым светом, освещающим всё вокруг.
items.potions.potionofvine.desc=Тёмно-зелёная густая жидкость, пульсирующая дикой силой. Разбившись, флакон призывает враждебного духа в выбранную клетку.
items.weapon.enchantments.slashing.desc=Эти чары наносят сокрушительные рубящие удары, несколько раз пересчитывая урон и выбирая самый сильный результат.
items.weapon.missiles.skull.desc=Удивительно обтекаемый череп, пригодный для метания. Во время полёта его пустые глазницы жутко свистят.
items.food.blackberry.desc=Восхитительная ягода из глубин подземелья. Чтобы созреть, ежевика впитывает волшебную росу вокруг себя.
items.nornstone.greennornstone.desc=Могущественный зелёный камень, пульсирующий природной энергией. Отнесите три норнских камня к алтарю, чтобы раскрыть их силу.
items.potions.exotic.potionofstarving.desc=Эта вытягивающая жизненные силы смесь ослабляет всех врагов на этаже: их мышцы чахнут, а удары слабеют.
items.potions.potionofchilli.infuse_desc=Пропитка колчана: каждый усиленный дальний удар призывает элементаля душ на свободную клетку рядом с местом попадания.
items.potions.potionofharvest.desc=Плодородная жидкость с запахом дождя и земли. Разбившись, быстро выращивает высокую траву на всех подходящих клетках рядом.
items.dewvial2.desc=Улучшенный стеклянный флакон для волшебной росы. Для активации требуется больше росы, но благословение сильнее.
items.potions.exotic.potionofhighgrass.desc=Это зелье роста превращает обычную траву и почву в высокие заросли, где можно укрыться от чужих глаз.
items.potions.potionofliquidflame.infuse_desc=Дальние удары с зельем жидкого пламени _поджигают поражённого врага_. Расходуют обычные заряды колчана.
items.potions.potionofmight.desc=Невероятно редкое и могущественное зелье. Навсегда увеличивает вашу силу на 1, а максимальное здоровье — на 5.
items.arrowbag.desc_earthenarmor=Стрелы с зельем земляной брони дают герою _дубовую кожу прочностью в 50% нанесённого урона_, ослабевающую каждый ход.
items.coffee.desc=Чашка крепкого горячего кофе, сваренного в подземелье. Один горький глоток снимает усталость за полтора дня.
items.potions.exotic.potionofbutterbread.desc=Это невероятно сытное варево питательнее обычного зелья росы: утоляет голод полностью и даже с избытком.
items.potions.potionofhunger.desc=Сытное варево, которым можно хорошо подкрепиться. Утоляет заметную часть голода и надолго оставляет чувство сытости.
items.potions.exotic.potionofearthenarmor.infuse_desc=Каждое попадание дарует дубовую кожу прочностью в половину уровня владельца, ослабевающую каждые 3 хода. Расходует обычные заряды пропитки.
items.weapon.enchantments.holy.desc=Эти чары причиняют огромный урон нежити и истинным демонам, но совершенно бесполезны против остальных.
items.weapon.missiles.mindarrow.desc=Мерцающая стрела ранит не только тело, но и разум: наносит дополнительный психический урон и внушает ужас.
items.potions.exotic.potionofhellstorm.desc=Разбитая склянка порождает растущее море сверхъестественного адского пламени, которое горит куда жарче и дольше обычного.
items.steelhoneypot$steelshatteredpot.desc=Горшочек разбит. Его удерживает лишь липкий мёд на стенках, но и тот постепенно поддаётся.
items.weapon.enchantments.buzzsaw.desc=Эти чары разгоняют цепную пилу до безумной скорости, позволяя наносить множество ударов. Топливом служит роса из бурдюка.
items.potions.exotic.potionofsnapfreeze.infuse_desc=Дальние удары с зельем мгновенной заморозки _замораживают врага на 5 ходов_. Расходуют обычные заряды колчана.
items.weapon.enchantments.luck.desc=Эти чары несколько раз пересчитывают урон и выбирают лучший результат, повышая шанс нанести максимальный урон.
items.weapon.missiles.riceball.desc=Плотный шарик зачарованного риса. Несмотря на мягкость, обладает магическим ударом, дезориентирующим и перемещающим цели.
homestead.legacy.saferoommigration.refund=Алхимические котлы и зачарованные пьедесталы из безопасной комнаты перенести не удалось. Потраченные на них %d золота лежат в сундуке.
items.potions.brews.unstablebrew.infuse_desc=Дальние удары с нестабильным варевом вызывают _случайный эффект пропитки зельем_. Расходуют обычные заряды колчана.
items.wands.wandofblink.desc=Лёгкая хрустальная палочка искрится пространственной энергией. Её луч мгновенно телепортирует владельца вдоль своей траектории.
items.weapon.melee.alchemy.truerunicblade.ability_desc=Дуэлянт может нанести руническим клинком _рунический удар_. Он всегда попадает в цель и имеет _+%d%% к силе зачарования_.
items.weapon.melee.chainsaw.desc=Дворфский механизм крепится к руке, и снять его нельзя. Его чары кровожадности питаются росой из бурдюка.
items.weapon.missiles.throwingwave.desc=Изогнутый клинок из застывшей воды. Поражённые им впадают в смятение и яростно набрасываются и на друзей, и на врагов.
items.arrowbag.desc_corrosivegas=Стрелы с зельем разъедающего газа накладывают на врага _коррозию на 3 хода с начальным уроном 2 (+10% урона)_.
items.holyhandgrenade.desc=Освящённая граната наносит огромный урон нежити и обращает её в паническое бегство. На живых существ не действует.
items.potions.exotic.potionofsleepparalysis.infuse_desc=Пропитка колчана: каждый усиленный дальний удар призывает демона сонного паралича на свободную клетку рядом с местом попадания.
items.potions.exotic.potionofswelling.desc=Стоит открыть это едкое варево, как все враги на этаже начинают истекать кровью, не в силах остановить кровотечение.
items.potions.exotic.potionofterror.desc=Открытая склянка источает первобытный ужас: все враги на этаже в панике разбегаются кто куда.
items.potions.potionofsun.desc=Золотая светящаяся жидкость. Её ослепительная вспышка мгновенно уничтожает всю нежить на этаже.
items.weapon.melee.relic.cromcruachaxe.desc=Древний топор тёмного происхождения, способный подавлять магию. При полном заряде дарует владельцу невосприимчивость к магическим эффектам.
items.artifacts.candleofmindvision.desc=Тонкая фиолетовая свеча в латунном подсвечнике. Зажжённая, она показывает всех живых существ поблизости и постепенно сгорает.
items.potions.exotic.potionofautumn.desc=Это землистое варево превращает траву и заросли вокруг в плодородную почву, готовую к посеву.
items.potions.exotic.potionofhotness.desc=Обжигающая жидкость опасно повышает температуру тела всех видимых врагов, обезвоживая и ослабляя их.
items.potions.exotic.potionofslime.desc=Это липкое зелёное варево покрывает всех врагов на этаже сковывающей слизью, надолго затрудняя движение.
items.potions.exotic.potionofstrung.desc=Брошенное зелье выпускает в каждого видимого врага луч, подобный лозе. Хлещущие побеги ранят и приковывают врагов корнями.
items.potions.potionofprotection.desc=Густая жидкость затвердевает вокруг тела, словно скорлупа кокоса, надолго создавая щит от входящего урона.
items.potions.potionofwater.infuse_desc=Пропитка колчана: каждый усиленный дальний удар обливает цель водой, тушит пламя, промачивает её и оставляет лужу на голой земле.
items.weapon.melee.alchemy.assassinsspear.stats_desc=Это оружие атакует медленнее обычного.\nИм можно атаковать поверженных врагов.\nОно особенно эффективно против врагов без брони.
items.weapon.melee.spork.stats_desc=Это оружие атакует _вдвое быстрее_ обычного оружия 3-го ранга и имеет _на 20% больше точности_, но наносит меньше урона за удар.
items.arrowbag.desc_purity=Стрелы с зельем чистоты _снимают с героя вредные эффекты_ и даруют _2 хода невосприимчивости к ним_.
items.potions.exotic.potionofholy.desc=Выпитая святая вода из этой склянки снимает все проклятия с ваших вещей и предметов, лежащих рядом.
items.potions.exotic.potionofreproduction.desc=Странное варево создаёт вокруг вас зеркальные копии, способные некоторое время сражаться на вашей стороне.
items.potions.exotic.potionoftears.desc=Это очищающее варево сразу избавляет от горения, коррозии, отравления, кровотечения и едкой слизи.
items.potions.potionofblessing.desc=Выпив золотистую жидкость, вы ощущаете благосклонность удачи. Благословение снижает вероятность неудачного исхода.
items.ore.goldore.desc=Серая порода с золотыми прожилками. В отличие от мрачного золота дворфских шахт, это золото не боится дневного света.
items.potions.brews.shockingbrew.infuse_desc=Дальние удары с грозовым варевом наносят _на 20–60% больше урона электричеством_. Расходуют обычные заряды колчана.
items.potions.exotic.potionoflaserbeam.desc=Брошенное зелье выпускает разрушительный луч по каждому видимому врагу, прожигая всё на пути.
items.potions.exotic.potionofworm.desc=Брошенное зелье поражает видимых врагов лучами с паразитами: наносит урон и заражает опасным ядом.
items.towel.desc=Не забудьте полотенце! Это волшебное полотенце останавливает кровотечение и стирает едкую слизь. После нескольких применений оно распадётся.
items.wands.wandofpoison.desc=Серое тело этой палочки источает ядовитую зелёную слизь. Её луч отравляет врага сильнейшим ядом.
items.weapon.melee.flute.desc=Изящный духовой инструмент. Каждый удар сопровождается пронзительной нотой, а звуковые волны ранят всех вокруг цели.
items.potions.potionofbutter.desc=Густая золотистая жидкость с запахом свежей травы. Разбившись, оживляет пустые соседние клетки буйной растительностью.
items.wands.wandofflock.desc=Причудливая палочка украшена клочками шерсти. Её луч вызывает стадо волшебных овец, способных преградить врагам дорогу.
items.weapon.enchantments.parasitic.desc=Эти чары внедряют во врагов паразитическое семя. Оно несколько ходов вытягивает из них здоровье и передаёт его соседним существам.
items.potions.exotic.potionofabsolutezero.desc=Стоит открыть склянку, как переохлаждённая жидкость мгновенно заморозит всех врагов на этаже, заковав их в лёд.
items.potions.potionofdirt.desc=Грязная землистая жидкость полна плодородной силы. Разбившись, превращает пустые и травянистые клетки вокруг в густые заросли.
items.scrolls.scrollofmagicalinfusion.desc=Этот свиток наполняет оружие или броню мощной магией: улучшает предмет и гарантированно наделяет его чарами или руной.
items.treeseeds.bushseed.desc=Семя куста. Посадите рядом на траве или голой земле — появится молодой побег, а через 6 весенних или летних дней вырастет куст.
items.armor.ceramicsarmor.desc=Доспех из обожжённой глины. Пластины превосходно держат удар, но хрупкость ограничивает пользу от улучшений.
items.journalpages.vault.desc=Вырванная страница дневника с заголовком «Хранилище».\n\nЭто кольцо богатства — явный перебор.\n\nНадо куда-нибудь сложить золото.\n\n— Отилюк, 656 г. ЭП.
items.potions.exotic.potionofadrenalinesurge.desc=Огненное зелье наполняет тело необузданной энергией, позволяя ненадолго двигаться с невероятной скоростью.
items.potions.exotic.potionoforb.desc=Разбитый магический сосуд выпускает парящую разрушительную сферу. Если её атаковать, она ударит по всем видимым врагам.
items.spells.natureslullaby.desc=Заклинание напевает успокаивающую мелодию, превращая все видимые живые растения обратно в семена и погружая их в спячку.
items.armor.glyphs.purity.desc=При получении удара эта священная руна может очистить владельца от всех вредных эффектов и ненадолго защитить от новых.
items.potions.exotic.potionofquantumsoup.desc=Когда склянка открывается, квантово-связанные частицы мгновенно телепортируют всех врагов на этаже в случайные места.
items.potions.exotic.potionofstormclouds.infuse_desc=Дальние удары с зельем грозовых туч выпускают _мощную струю воды под давлением_. Расходуют обычные заряды колчана.
items.potions.potionoflevitation.infuse_desc=Дальние удары с зельем левитации вызывают у врага _головокружение на 3 хода_. Расходуют обычные заряды колчана.
items.weapon.melee.royalspork.desc=Это ложка? Или вилка? И то и другое — и ни то ни другое! К тому же золотая и в драгоценных камнях. Особенная! Врагам лучше уважать!
items.potions.exotic.potionofarmor.desc=Выпитое укрепляющее зелье покрывает кожу кристаллической сеткой, значительно защищая от физических ударов.
items.potions.potionofegg.desc=Это странное тёплое зелье снова наполняет пустые книжные полки вокруг вас — теперь их можно обыскать ещё раз.
items.weapon.enchantments.surging.desc=Эти чары набирают силу с каждым ударом: электрический заряд накапливается и ненадолго увеличивает урон следующих атак.
items.weapon.melee.alchemy.truerunicblade.typical_ability_desc=Обычно дуэлянт может нанести руническим клинком _рунический удар_, который всегда попадает в цель и имеет _+%d%% к силе зачарования_.
items.weapon.missiles.jupiterswraith.desc=Это метательное оружие — воплощение гнева Юпитера. Оно возвращается к владельцу, как бумеранг, и заряжается с каждым ходом.
items.potions.exotic.potionofcleansing.infuse_desc=Дальние удары с зельем очищения дают герою _4 хода невосприимчивости к магии_. Расходуют обычные заряды колчана.
items.potions.exotic.potionofhail.desc=Брошенное арктическое варево взрывается градом ледяных осколков, многократно поражая всех видимых врагов лютым холодом.
items.potions.exotic.potionofshielding.infuse_desc=Дальние удары с зельем защиты дают герою _щит на 5 ед. (+10% максимального здоровья)_. Расходуют обычные заряды колчана.
items.weapon.melee.relic.neptunustrident.desc=Могучий трезубец, проводящий силу морей. При полном заряде затапливает местность вокруг и замедляет ближайших врагов.
items.food.fish.desc_autumn=Угорь, закопчённый над ольховым костром до чёрной кожицы и золотистой мякоти. Долго хранится, удобно брать в путь — и невозможно оторваться.
items.magicworldmap.desc=Зачарованная карта поверхности, на которой вы всегда в центре. Коснитесь любого места, чтобы поставить отметку, — ноги сами приведут туда.
items.potions.exotic.potionofbrain.desc=Выпив эту смесь из концентрированных знаний, вы познаете магические тайны, и случайный свиток материализуется прямо в руках.
items.potions.exotic.potionofsugar.desc=Невероятно сладкая смесь наполняет кровь энергией и надолго дарует сахарный прилив сил, ускоряющий ваши действия.
items.potions.potionofshadows.desc=Эта тёмная жидкость окутывает вас глубокими тенями, надолго делая почти невидимым и снимая вредные эффекты.
items.spells.crimsonepithet.desc=Заклинание телепортирует вас в выбранное место или меняет местами с выбранным существом. Неподвижные существа обменять местами нельзя.
items.treeseeds.acorn.desc=Жёлудь дуба. Посадите рядом на траве или голой земле — вырастет саженец, а через 14 весенних или летних дней он станет дубом.
items.treeseeds.pinecone.desc=Сосновая шишка. Посадите рядом на траве или голой земле — вырастет саженец, а через 14 весенних или летних дней он станет сосной.
items.wands.wandofavalanche.desc=Тяжёлая каменная палочка гудит тектонической мощью. Её луч вызывает в выбранном месте сокрушительную ударную волну из земли и камней.
items.potions.exotic.potionofdivineinspiration.infuse_desc=Каждое попадание даёт опыт за цель, если он предусмотрен и владелец ещё не достиг предельного для неё уровня. Расходует обычные заряды пропитки.
items.potions.potionofflora.desc=Ярко-зелёная жидкость, полная растительной силы. Выпив её, вы выпустите семена, которые сами упадут в землю вокруг.
items.potions.potionofinvisibility.infuse_desc=Дальние удары с зельем невидимости _ослепляют поражённого врага на 2 хода_. Расходуют обычные заряды колчана.
items.sanchikarah.desc=Загадка решена. Санчикарах откроет портал к последнему боссу. Как только портал появится, вас сразу перенесёт к нему.
items.spells.aquablast.desc=Заклинание выпускает в цель сжатый поток воды. Клетки вокруг затапливаются, а цель ненадолго оглушается.
items.weapon.enchantments.cromluck.desc=Усиленная версия чар удачи. Несколько раз пересчитывает урон без штрафов и всегда выбирает наивысший результат.
items.weapon.enchantments.neptuneshock.desc=Чары Нептуна выпускают молнии в ближайших врагов, расходуя заряд оружия. По врагам в воде урон удваивается.
items.weapon.melee.alchemy.meisterhammer.desc=Большой молот знакомой конструкции. Благодаря тяжести легко поражает врагов, а точный удар ненадолго оглушает.
items.weapon.melee.elfbow.stats=Выстрелы этого лука наносят _%1$d–%2$d ед. урона_. Нужно _%3$d силы_ для эффективного использования. Урон возрастает от самой мощной палочки в рюкзаке.
items.weapon.melee.knife.desc=Кухонный нож. Им легко пустить врагу кровь, но серьёзный прямой урон нанести трудно. И что он здесь делает?
items.weapon.melee.wardrum.desc=Тяжёлый боевой барабан. Его громовой звук ранит всех вокруг цели, вызывая головокружение и ужас.
items.armor.glyphs.crystal.desc=При сильном ударе эта руна заставляет поверхность доспеха кристаллизоваться, создавая защитный барьер, прочность которого зависит от полученного урона.
items.ore.copperore.desc=Кусок породы с медными прожилками, позеленевшими на воздухе. Первая находка любого рудокопа — и стоит она примерно столько же, сколько вы думаете.
items.potions.exotic.potionofholyfuror.desc=Это благословенное варево дарует божественное покровительство: длительное благословение повышает удачу и эффективность в бою.
items.potions.exotic.potionofrelativity.desc=Выпив содержимое этой склянки, вы искривите течение времени вокруг себя и ненадолго остановите весь мир, кроме самого себя.

# Russian localization: batch 500 no. 8
items.potions.exotic.potionofsleepparalysis.desc=Если бросить этот проклятый флакон, возле места падения появится демон сонного паралича — призрачная сущность, которая обездвиживает любого героя, прикоснувшегося к ней.
items.potions.potionofparalyticgas.infuse_desc=Попадания оружием, пропитанным зельем парализующего газа, накладывают на цель _паралич на 2 хода_. Расходуются обычные заряды пропитки колчана.
items.arrowbag.holy_desc=Сейчас колчан наполнен _святой водой_. Следующие %1$d метательных снарядов будут освящены: каждый немного исцелит вас и разольёт святую воду при попадании.
items.food.cloudberry.desc=Восхитительно вкусная и лёгкая ягода из глубин подземелья. Кажется, она парит у вас на ладони и подрагивает от скрытой энергии.
items.ore.ore.smith_bonus=\n\nГородской кузнец-тролль может переплавить %1$d таких кусков руды в сердцевину превосходного качества — не больше одной плавки в день. За оставшиеся опилки он дополнительно заплатит %2$d золота.
items.potions.exotic.potionofsupernova.desc=Стоит откупорить эту нестабильную смесь, как вокруг каждого врага на этаже прогремит целая череда взрывов, уничтожающая всё в зоне поражения.
items.weapon.enchantments.nomnom.desc=Это прожорливое зачарование иногда мгновенно пожирает противника, убивая его на месте. При этом владелец оружия исцеляется и утоляет голод.
items.weapon.enchantments.parasitic$parasiticseed.desc=Здесь прорастает паразитическое семя. Оно вытягивает здоровье хозяина и передаёт его ближайшим противникам.\n\nУрон за ход: %d.\n\nОсталось ходов: %s.
items.weapon.melee.prayerwheel.desc=Простое молитвенный барабан. С каждым ударом оно вращается и накапливает духовную силу, чтобы затем высвободить её в одном сокрушительном ударе.
items.weapon.melee.saber.ability_desc=Дуэлянт может совершить с саблей _выпад_ по врагу на расстоянии 1 клетки. Он сближается с противником, наносит _%1$d–%2$d урона_ и гарантированно попадает.
items.weapon.melee.stonecross.desc=Огромный крест, высеченный из камня. С каждым ударом он медленно накапливает священную силу, чтобы затем высвободить её одним сокрушительным ударом.
items.potions.brews.infernalbrew.infuse_desc=Дальние атаки с пропиткой адским варевом _извергают пламя преисподней_ примерно вдвое меньшего размера, чем само варево. Расходуются обычные заряды пропитки колчана.
items.potions.potionofregrowth.desc=Если выпить это землистое зелье, из вашего тела вырастут усики, дающие полезные эффекты. Разбитый флакон высвобождает волну энергии роста.
items.wetlands.witchsremedy.desc=Горькая зелёная настойка болотной ведьмы. Она выводит яд, слизь и паразитов, подцепленных в трясине, а заодно останавливает кровотечение.
items.food.fish.desc_winter=Эту рыбу вытащили из проруби. Тощая, полузамёрзшая и дешёвая: рыбак прекрасно понимает, какой товар продаёт.
items.potions.exotic.potionofironskin.desc=Этот насыщенный минералами отвар на время делает кожу твёрдой, как металл: каждый полученный удар наносит всего 1 единицу урона.
items.potions.exotic.potionofsuperdew.desc=Мощные вещества, стимулирующие рост, при выпивании заставляют всю высокую траву на этаже примяться к земле, освобождая дорогу и рассыпая семена.
items.weapon.melee.taurcenbow.desc=Лук кентавров, которым пользуются куранта. После нескольких обычных выстрелов он автоматически выпускает особую стрелу. Её тип можно сменить в любой момент.
items.clusterbomb.desc=При взрыве эта бомба распадается на несколько меньших зарядов, накрывая большую область взрывами в случайных точках вокруг места падения.
items.gunsmithingtool.weight_desc=_Изменение массы_ меняет _класс огнестрельного оружия_, полностью перестраивая его характеристики.\n\n_Облегчение: −1 класс_\n\n_Утяжеление: +1 класс_
items.potions.brews.blizzardbrew.infuse_desc=Дальние атаки с пропиткой метельным варевом _вызывают метель_ примерно вдвое меньшего размера, чем само варево. Расходуются обычные заряды пропитки колчана.
items.wands.wandoftelekinesis.desc=Эта палочка испускает сфокусированный луч кинетической силы. Им можно отталкивать врагов, подбирать предметы на расстоянии и воздействовать на окружение.
items.bombs.fishingbomb.desc=Тяжёлая связка слипшихся пельменей, которую используют для рыбалки. Если потревожить её и бросить, ближайшие пираньи-альбиносы телепортируются на сушу.
items.journalpages.fadedsafespotpage.desc=Когда-то эта страница дневника вела в безопасную комнату, которой больше нет. Прочитайте её, чтобы обменять на инструмент строителя, а если он уже есть — на золото.
items.potions.exotic.potionofcontrol.desc=Если откупорить эту тёмную жидкость, вырвутся дурманящие испарения. Они подчинят волю всех врагов на этаже, заставив их сражаться на вашей стороне.
items.potions.potionofbanana.desc=От этой странной жёлтой настойки слегка пахнет тропическими фруктами. Выпив её, вы получите порцию опыта, зависящую от глубины подземелья.
items.smartbomb.desc=Эта усовершенствованная бомба поражает только врагов, не причиняя вреда тому, кто её бросил. Её взрыв наносит больше урона, чем у обычной бомбы.
items.spells.doomcall.desc=Это тёмное заклинание призывает таинственную силу, которая мгновенно уничтожает случайного врага на текущем этаже. На боссов и мини-боссов оно не действует.
items.food.blueberry.desc=Таинственная синяя ягода, растущая глубоко в подземелье. Созревая годами, эти ягоды словно впитывают знания о своём окружении.
items.food.fish.desc_spring=Форель, пойманная во время нерестового хода вверх по реке, — жирная, с икрой. Рыбак клянётся, что весенний улов вкуснее всего. И на этот раз никто не спорит.
items.orbofzot.desc=Сфера Зота — источник неиссякаемой силы, созданный волшебником Зотом. Бросьте её, чтобы развернуть разрушительную турель, стреляющую по врагам лучами.
items.weapon.melee.largesword.ability_desc=Дуэлянт с палашом может использовать _Зарядку_. Потратив 1 ход на подготовку, она увеличит уровень заряда палаша на _%d ходов_.
items.dizzybomb.desc=При взрыве эта бомба испускает дезориентирующую ударную волну. Помимо небольшого урона, она вызывает головокружение у всех врагов в зоне поражения.
items.potions.exotic.potionofbeacon.desc=Сияние внутри флакона при высвобождении ослепляет всех врагов на этаже. Нежить особенно уязвима к его святому свету.
items.potions.potionoftoxicgas.infuse_desc=Дальние атаки с пропиткой зельем ядовитого газа отравляют цель на _3 хода (+20% к урону)_. Расходуются обычные заряды пропитки колчана.
items.potions.potionofwithering.desc=Выпив эту тёмную жидкость, вы навлечёте на себя проклятие увядания. Разбитый флакон выпускает облако испарений, ослабляющих всех, кто окажется внутри.
items.scrolls.scrollofmultiupgrade.desc=В этом чрезвычайно редком свитке заключена концентрированная магия улучшения. Он сразу повышает уровень выбранного предмета на пять ступеней и снимает все проклятия.
items.wands.wandofamok.desc=Палочка пульсирует хаотичной тёмной энергией. Если направить её на врага, тот впадёт в безумную ярость и начнёт нападать на всех вокруг.
items.bulletbelt.desc=Этот патронташ позволяет удобно носить сразу много боеприпасов. Использовав его, вы получите большой запас патронов.
items.potions.exotic.potionofimmortality.desc=Наполненная жизненной силой жидкость добавит значительное количество целебной утренней росы во флакон. Объём росы зависит от вашей силы.
items.potions.potionofexperience.infuse_desc=Дальние атаки с пропиткой зельем опыта наносят _значительно больше урона нежити и демонам_. Расходуются обычные заряды пропитки колчана.
items.armor.armor$glyph.level_desc=Руна _усилена до %d уровня_ на зачарованном пьедестале. Каждый уровень добавляет _+40%% к силе эффекта_ и _+20%% к шансу срабатывания_ относительно обычной руны.
items.potions.exotic.potionofpressure.desc=Если откупорить эту жидкость под огромным давлением, возникнет мощная ударная волна. Она наносит всем врагам на этаже физический урон, зависящий от вашей силы.
items.rings.ringofsating.desc=Это кольцо позволяет дольше обходиться без пищи, извлекая из неё каждую крупицу питательных веществ. Проклятое кольцо, наоборот, вызывает зверский голод.
items.weapon.enchantments.lokispoison.desc=Чары Локи распространяют смертоносную заразу. При попадании они отравляют и ближайших врагов сильным ядом, который продолжает наносить урон со временем.
items.weapon.missiles.brick.desc=Обычный глиняный кирпич. Хороший удар ненадолго оглушает цель, а иногда кирпич разбивается и высыпает припрятанные изготовителем монеты.
items.potions.exotic.potionofbee.desc=Разбившись возле врага, это зелье выпускает из липкого горшка разъярённый рой пчёл, который неотступно преследует ближайшего противника.
items.weapon.missiles.empbola.desc=Болас с потрескивающим электромагнитным зарядом. Она калечит и ненадолго парализует пойманную цель, а механизмам и другим неорганическим созданиям наносит особый вред.
items.artifacts.ringoffrost.desc=Кольцо мороза наполняет воздух ледяной силой. Полностью зарядившись, оно замораживает всех ближайших врагов.\n\nПоглощайте опознанные свитки, чтобы ещё сильнее укрепить кольцо.
items.potions.exotic.potionofalcohol.desc=Эта перебродившая настойка намного крепче обычного вина. Выпив её, вы сильно опьянеете: реакция замедлится, зато боль будет ощущаться слабее.
items.potions.exotic.potionofmagicfire.desc=Разбившись, флакон разливает по земле магическое пламя. Оно разрастается и обжигает с зачарованной силой даже тех существ, которые обычно устойчивы к огню.
items.potions.potionofglowing.desc=Если выпить эту светящуюся жидкость, вы начнёте ярко сиять. Разбитый флакон выпускает газ, заставляющий всё, что попадёт в облако, излучать свет.
items.potions.potionoftime.desc=Кажется, мерцающая жидкость замедляет ход времени вокруг себя. Выпив её, вы на некоторое время остановите время для всех видимых врагов. Длительность зависит от вашей силы.
items.wands.wandofteleportation.stats_desc=Эта палочка переносит выбранное существо в случайную точку текущего этажа. На NPC не действует; все обычные ограничения телепортации сохраняются.
items.weapon.enchantments.horror.desc=Зачарование вселяет в противников невыразимый ужас, заставляя их бежать в панике. Если его действие обращено против героя, вместо этого возникает дезориентирующее головокружение.
items.weapon.melee.saber.typical_ability_desc=Дуэлянт может совершить с саблей _выпад_ по врагу на расстоянии 1 клетки. Он сближается с противником, обычно наносит _%1$d–%2$d урона_ и гарантированно попадает.
items.keys.goldenskeletonkey.desc=Этот сияющий золотой ключ излучает тёплый свет. Его искусно вырезанная бородка открывает любой замок в подземелье, а сам ключ, похоже, обладает магической силой.
items.potions.potionofdew.desc=Свежая жидкость насыщает тело целебной росой, постепенно восстанавливая здоровье. Разбитый флакон рассыпает по округе освежающие капли росы.
items.potions.potionofgrass.desc=Выпив эту зелёную смесь, вы погрузитесь в дурман. Разбитый флакон выпускает густой травяной дым, от которого пьянеет любой, кто им надышится.
items.potions.potionoflove.desc=Эта сладкая розовая жидкость источает неотразимый аромат. Выпив её, вы очаруете всех видимых существ, и они на время станут вашими союзниками.
items.potions.potionofoverhealing.desc=Мощный эликсир полностью восстанавливает здоровье и наполняет вас магической жизненной силой, временно повышая запас здоровья сверх обычного предела.
items.wands.wandoffirebolt.desc=Эта старомодная палочка вырезана из обугленного дерева, а её наконечник тлеет ярким угольком. Она выпускает сосредоточенный сгусток пламени, поджигающий всё на пути.
items.waterskin.desc_measure=Изобретатель снабдил бурдюк мерным носиком: выберите действие _Отмерить_, чтобы выпить ровно столько капель, сколько нужно. Каждая капля восстанавливает 5% максимального здоровья и 5% максимальной маны.
items.weapon.enchantments.midas.desc=Эти чары заставляют врагов истекать золотом. От лёгкой царапины выпадет несколько монет, но по-настоящему разбогатеть можно лишь на обильной кровопотере противника.
items.potions.exotic.potionoftsunami.desc=Брошенный флакон вызывает гигантскую приливную волну, которая затопляет весь этаж, превращает местность в воду, тушит пожары и сметает всё на своём пути.
items.weapon.melee.alchemy.truerunicblade.desc=Этот золотой рунический клинок обрёл былую силу. Теперь он способен пробудить заключённую в нём истинную магию, значительно усиливая все наложенные на него волшебные свойства.
items.potions.exotic.potionofballlightning.desc=В потрескивающем флаконе заключён шар чистой электрической энергии. Стоит откупорить его, как между всеми врагами на этаже начнут перескакивать разряды молний.
items.weapon.melee.elfbow.desc=Короткий лук эльфов. Чем сильнее магия владельца, тем мощнее выстрелы. В рукояти также хранится немного манной воды. Главное — не пить слишком много.
items.weapon.melee.tricksand.ability_desc=Дуэлянт может поднять _песчаную бурю_ в доступной клетке. Все враги на ней и соседних клетках будут ослеплены на _%d ходов_. Урона приём не наносит. Стоимость: 1 заряд.
items.weapon.missiles.alchemy.potothunder.desc=Молния, заключённая в маленьком сосуде. Из острого носика то и дело выскакивают разряды, а при ударе вырывается мощная молния, наносящая урон.
items.weapon.weapon$enchantment.level_desc=Зачарование _усилено до %d уровня_ на зачарованном пьедестале. Каждый уровень добавляет _+40%% к силе эффекта_ и _+20%% к шансу срабатывания_ относительно исходного зачарования.
items.weapon.enchantments.jupitershorror.desc=Чары Юпитера наполняют врагов сверхъестественным ужасом и обращают их в бегство. Этот страх сильнее, чем от обычного потустороннего зачарования.
items.weapon.melee.largesword.typical_ability_desc=Дуэлянт с палашом может использовать _Зарядку_: за 1 ход он накапливает силу, обычно увеличивая уровень заряда палаша на _%d ходов_.
items.dwarfhammer.desc=Этот волшебный молот слишком хрупок, чтобы служить оружием. Им запечатали демонов на этом этаже. Возможно, в нём осталось достаточно магии, чтобы снять печать со следующего этажа.
items.potions.potionoffirelightning.desc=Нестабильное варево искрит электричеством и пышет жаром. Выпив его, вы обрушите на всех видимых врагов огненные молнии, которые наносят урон и поджигают цели.
items.potions.potionofslowness.desc=Густая тягучая жидкость словно цепляется за воздух. Выпив её, вы замедлитесь. Разбитый флакон выпускает облако, замедляющее каждого, кто им надышится.
items.weapon.melee.alchemy.holysword.true_desc=Огромный меч, наполненный священной силой. Восстановив истинное могущество, Святой меч способен наносить быстрые удары и восстанавливать здоровье владельца при каждом попадании.
items.weapon.melee.dualknife.ability_desc=Дуэлянт может выполнить _двойной порез_: оба клинка ударят соседнего врага за время одного удара. Каждый нанесёт _%d%% урона_, и оба гарантированно попадут. Стоимость: 1 заряд.
items.weapon.melee.handlight.desc=Волшебный светильник в форме сжатого кулака. Его вспышка ненадолго ослепляет поражённых врагов, удары сокрушают ошеломлённых, а свет пробивает магические щиты.
items.bulletitem.desc=Это общий запас боеприпасов для огнестрельного и другого дальнобойного оружия. Он не занимает места в рюкзаке и расходуется автоматически, когда нужны патроны.
items.armor.glyphs.phasing.desc=Руна спасает владельца при критическом ранении: телепортирует его в безопасное место и ненадолго делает невидимым. На этажах боссов не срабатывает.
items.arrowbag.manage_desc=Выберите эффект, чтобы удалить его, или нажмите значок информации и узнайте, что он делает. Повторно добавив тот же ингредиент, вы пополните заряды даже при всех четырёх занятых ячейках.
items.bombs.dizzybomb.desc=Бомба начинена веществами, вызывающими головокружение. Взрыв наносит урон в радиусе 1 клетки и заставляет всех задетых врагов шататься от дезориентации.
items.weapon.melee.prayerwheel.ability_desc=Дуэлянт может _повернуть колесо_. Это не занимает времени: на _%d ходов_ она получает благословение, избавляется от одного негативного эффекта, а счётчик колеса увеличивается на три.
items.potions.exotic.potionofspiral.desc=Дурманящие испарения из флакона при откупоривании вызывают головокружение у всех врагов на этаже. Противники начинают шататься и теряют ориентацию.
items.potions.potionoffirestorm.desc=Нестабильная красная жидкость пышет жаром. Выпив её, вы воспламените пространство вокруг себя. Разбитый флакон вызовет огненную бурю, распространяющуюся по соседним клеткам.
items.weapon.enchantments.hunting.desc=Это оружие создано для охоты на живую добычу: оно рвёт плоть и наносит дополнительный урон. После удачного убийства иногда остаётся мясо, которое можно приготовить.
items.bombs.smartbomb.desc=Бомба направленного действия, поражающая только врагов. Она наносит урон противникам в радиусе 1 клетки, но не задевает того, кто её бросил.
items.wands.wandofteleportation.bmage_desc=Когда _Боевой маг_ ударяет врага посохом телепортации, есть шанс перенести противника в другое место. Чем выше уровень палочки, тем больше шанс.
items.weapon.enchantments.vicious.desc=Оружие покрыто острейшими шипами, которые разрывают врагов и наносят огромный дополнительный урон. Правда, пользоваться им, не поранившись самому, непросто.
items.potions.exotic.potionofdeath.desc=В чёрном флаконе заключена сама сущность забвения. При откупоривании из него вырывается волна некротической энергии, мгновенно уничтожающая всех видимых врагов, кроме боссов.
items.potions.potionofchilli.desc=Эта жгучая красная жидкость воспламеняет душу, даруя душевный огонь — синее пламя, защищающее от жара. Разбитый флакон призывает на вашу сторону элементаля души.
items.weapon.melee.alchemy.chainwhip.ability_desc=Дуэлянт может _хлестнуть_ кнутом всех окружающих врагов. Приём наносит _%1$d–%2$d урона_ всем противникам в пределах досягаемости оружия и гарантированно попадает.
items.weapon.melee.alchemy.unformedblade.ability_desc=С несформированным клинком Дуэлянт может выполнить _скрытный шаг_: мгновенно переместиться на расстояние до 2 клеток и стать невидимой на _%d ходов_.
items.weapon.melee.minerstool.desc=Складной инструмент, совмещающий походную лопатку и кирку.\n\nВ открытом мире он копает как лопата: обрабатывает землю, добывает глину и песок, выкорчёвывает пни и саженцы.
items.weapon.melee.mirrordoll.desc=Кукла с отполированным зеркалом на длинной ручке. Отблеск зеркала слепит врагов, удары больнее бьют уже ослеплённых и разбивают магические щиты.
items.potions.exotic.potionofallseeing.desc=Мистические испарения из флакона даруют необычайную проницательность: открывают весь план текущего этажа, включая скрытые двери и ловушки.
items.weapon.melee.tricksand.typical_ability_desc=Дуэлянт может поднять _песчаную бурю_ в доступной клетке. Все враги на ней и соседних клетках обычно будут ослеплены на _%d ходов_. Урона приём не наносит. Стоимость: 1 заряд.
items.weapon.melee.bow.bowweapon$arrowattached.desc=В этом персонаже застряло _%1$d_ стрел. Они выпадут через 50 ходов после попадания последней стрелы или при смерти персонажа.\n\nОсталось ходов: _%2$s_.
items.weapon.melee.triangolo.ability_desc=Дуэлянт может извлечь из треугольника один чистый _звон_: все враги в радиусе 2 клеток ощутят головокружение на _%d ходов_ и получат урон в размере четверти обычного удара. Стоимость: 1 заряд.
items.bombs.dumplingbomb.desc=Вместо пороха эта бомба начинена пельменями со снотворным. Враги в зоне действия, кроме боссов, начинают засыпать и телепортируются в случайную точку этажа.
items.potions.exotic.potionofathmosphericcompression.desc=Жидкость под огромным давлением при откупоривании резко расширяется. Вся вода на этаже испаряется, а враги, стоящие в лужах, получают сокрушительный удар силой сжатия.
items.potions.potionofsmoke.desc=Мутная серая жидкость пахнет золой. Выпив её, вы создадите вокруг себя облако дыма. Разбитый флакон застилает местность густой дымовой завесой, ограничивающей обзор.
items.rings.ringofmagic.desc=Кольцо источает тайную магию, увеличивая запас маны и скорость её восстановления. Проклятое кольцо, напротив, истощает магические силы владельца.
items.weapon.melee.dualknife.typical_ability_desc=Дуэлянт может выполнить _двойной порез_: оба клинка ударят соседнего врага за время одного удара. Каждый обычно наносит _%d%% урона_, и оба гарантированно попадут. Стоимость: 1 заряд.
items.weapon.melee.tricksand.desc=Горсть волшебного песка, разлетающегося на удивительно большое расстояние. Он ослепляет поражённых врагов, особенно жестоко карает тех, кто не заметил атаку, и пробивает магические щиты.
items.gunsmithingtool.desc=Набор приспособлений для изменения огнестрельного оружия. Инструмент исчезает после одного использования, но несколько наборов позволят внести разные улучшения.
items.weapon.melee.harp.desc=Струнный инструмент, на котором играют пальцами. От каждого удара он яростно вибрирует, поражая звуковыми волнами всех врагов вокруг основной цели.
items.weapon.melee.alchemy.unholybible.desc=Пропитанная злобной энергией Нечестивая Библия позволяет владельцу накладывать на поражённых врагов случайные вредоносные эффекты и порой обрекать их на гибель.
items.weapon.melee.prayerwheel.typical_ability_desc=Дуэлянт может _повернуть колесо_. Это не занимает времени: обычно на _%d ходов_ она получает благословение, избавляется от одного негативного эффекта, а счётчик колеса увеличивается на три.
items.spells.enchantmentinfusion.desc=Это заклинание накладывает на оружие или доспех выбранные вами чары. На выбор предлагаются три варианта: обычное зачарование, необычное и случайное.
items.weapon.melee.alchemy.beamsaber.desc=Шедевр оптических технологий. Лезвие этого светового меча создано из света, поэтому им легко и быстро взмахивать. Иногда ослепительное сияние на мгновение ослепляет врагов.
items.weapon.melee.assassinsknife.ability_desc=Дуэлянт может нанести _удар в спину_ по врагу в пределах 4 клеток: мгновенно переместиться за него и гарантированно нанести _%1$d–%2$d урона_ с множителем 150%%. Стоимость: 2 заряда.
items.weapon.melee.fightgloves.ability_desc=Дуэлянт может провести _серию ударов_ из трёх безошибочных выпадов по соседнему врагу. Каждый наносит _%d%% урона_. Если все три попадут, враг будет оглушён на 1 ход. Стоимость: 2 заряда.
items.weapon.melee.spork.ability_desc=Дуэлянт может _пронзание_ врага ложковилкой, глубоко вонзив её и провернув. Приём гарантированно наносит _%1$d–%2$d урона_ и вызывает кровотечение на _%3$d ходов_.
items.armor.lifearmor.desc=Живой доспех из другого мира. Он впитывает боль от ударов, которые не смог остановить. Если владелец какое-то время не получает урон, запасённая жизненная сила возвращается к нему.
items.spells.plantsummon.desc=Заклинание пробуждает жизненную силу всех видимых растений. Рядом с каждым вырастает живое растение-союзник, а исходное растение при этом исчезает.
items.bombs.holyhandgrenade.desc=Освящённый заряд, направляющий божественную силу против нежити. Взрыв пугает и ранит всех мертвецов в радиусе 2 клеток, не причиняя вреда живым.
items.weapon.melee.alchemy.spearnshield.ability1_desc=Дуэлянт может _укол_ наконечником копья врага в пределах досягаемости, но не вплотную. Приём гарантированно наносит _%1$d–%2$d урона_ и отталкивает цель.
items.weapon.melee.megacannon.desc=Дворфская ручная пушка. Она намертво крепится к руке владельца, и снять её невозможно. Каждый ход с пушкой на руке накапливается заряд, который затем высвобождается одним неотразимым выстрелом.
items.weapon.melee.alchemy.chainwhip.typical_ability_desc=Дуэлянт может _хлестнуть_ кнутом всех окружающих врагов. Приём обычно наносит _%1$d–%2$d урона_ всем противникам в пределах досягаемости оружия и гарантированно попадает.
items.weapon.melee.alchemy.unformedblade.typical_ability_desc=С несформированным клинком Дуэлянт может выполнить _скрытный шаг_: мгновенно переместиться на расстояние до 2 клеток и обычно стать невидимым на _%d ходов_.
items.weapon.melee.bow.bow.ability_desc=Дуэлянт с луком может выполнить _пронзающий выстрел_. Следующая стрела гарантированно попадёт, пробьёт броню врага и нанесёт _%1$d–%2$d урона_.
items.weapon.melee.alchemy.lance.typical_ability_desc=Дуэлянт с рыцарским копьём может выполнить _Таран_: бесплатно переместиться на расстояние до _%d_ клеток и сразу накопить импульс в зависимости от пройденного расстояния.
items.weapon.melee.alchemy.lancenshield.ability1_desc=Дуэлянт с рыцарским копьём может выполнить _Таран_: бесплатно переместиться на расстояние до _%d_ клеток и сразу накопить импульс в зависимости от пройденного расстояния.
items.potions.potionoficestorm.desc=В жидком виде заключена целая метель. Если выпить зелье, вокруг вас разразится ледяная буря. Разбитый флакон вызывает разрастающуюся метель, замораживающую всё поблизости.
items.potions.potionoflightning.desc=Искрящаяся синяя жидкость тихо гудит от электрической энергии. Выпив её, вы поразите всех видимых врагов мощными молниями, наносящими большой урон и сотрясающими землю.
items.weapon.melee.alchemy.lance.desc=Цельнометаллическое рыцарское копьё для боя верхом. Благодаря длине оно достаёт дальних врагов, а движение позволяет накопить импульс для особенно сильного удара.
items.weapon.melee.triangolo.typical_ability_desc=Дуэлянт может извлечь из треугольника один чистый _звон_: все враги в радиусе 2 клеток обычно ощутят головокружение на _%d ходов_ и получат урон в размере четверти обычного удара. Стоимость: 1 заряд.
items.wetlands.wadingbalm.desc=Жир угря, смешанный с болотным восковником. Если натереть им сапоги и ноги, вязкая грязь перестанет к ним липнуть: болотная вода ещё долго не будет замедлять ваши шаги.
items.journal.descentpage.desc=Страница, вырванная из дневника погибшего исследователя. Она лежит на камне, будто дожидаясь вас.\n\nПри взгляде на неё чернила словно дрожат. Заголовок едва различим:\n\n_«%s»_
items.potions.potionofpurity.infuse_desc=Дальние атаки с пропиткой зельем очищения _снимают с героя негативные эффекты_ и дают _2 хода невосприимчивости к ним_. Расходуются обычные заряды пропитки колчана.
items.potions.potionofsoda.desc=До предела насыщенная газом жидкость готова взорваться. Если выпить её, рядом с вами немедленно прогремит взрыв. Разбитый флакон взрывается с силой бомбы.
items.weapon.melee.bible$angel.desc=Ангел оберегает вас и направляет ваш клинок. Пока действует благословение, каждый успешный удар в ближнем бою восстанавливает здоровье пропорционально нанесённому урону.\n\nОсталось ходов: %s.
items.bombs.clusterbomb.desc=Эта нестабильная связка зарядов взрывается сначала в одной точке, а затем разбрасывает дополнительные взрывы на расстояние до 2 клеток. Цепная реакция непредсказуема, но разрушительна.
items.potions.potionofdigesting.desc=Пузырящаяся кислотная жидкость источает едкий запах. Выпив её, вы начнёте разъедаться изнутри. Разбитый флакон выпускает кислотное облако, разъедающее всех внутри.
items.weapon.melee.windbottle.desc=Тыква-горлянка, запечатавшая внутри порыв ветра. Каждый взмах выпускает шквал, отбрасывающий врагов и ослепляющий их пылью. Ветер с лёгкостью пробивает магические щиты.
items.weapon.melee.spade.typical_ability_desc=Дуэлянт может _выкопать_ из земли валун и метнуть его во врага на расстоянии до %3$d клеток. Валун наносит %1$d–%2$d урона и отталкивает цель на одну клетку. Стоимость способности — 2 заряда.
items.rings.ringofsearching.desc=В этом кольце легче замечать скрытое: при поиске вы осматриваете более широкую область. Проклятое кольцо заставляет не замечать даже то, что находится прямо перед носом.
items.weapon.melee.assassinsknife.typical_ability_desc=Дуэлянт может нанести _удар в спину_ по врагу в пределах 4 клеток: мгновенно переместиться за него и гарантированно нанести обычно _%1$d–%2$d урона_ с множителем 150%%. Стоимость: 2 заряда.
items.weapon.melee.fightgloves.typical_ability_desc=Дуэлянт может провести _серию ударов_ из трёх безошибочных выпадов по соседнему врагу. Каждый обычно наносит _%d%% урона_. Если все три попадут, враг будет оглушён на 1 ход. Стоимость: 2 заряда.
items.weapon.melee.scalpel.ability_desc=Дуэлянт может _жатва_ врага скальпелем. Этот разрушительный приём гарантированно попадает и наносит _%d урона_. Если у цели нет иммунитета, урон наносится в виде кровотечения.
items.weapon.melee.spork.typical_ability_desc=Дуэлянт может _пронзание_ врага ложковилкой, глубоко вонзив её и провернув. Приём обычно наносит _%1$d–%2$d урона_, гарантированно попадает и вызывает кровотечение на _%3$d ходов_.
items.potions.potionofsteam.desc=Тёплая дымящаяся жидкость кажется легче воздуха. Выпив её, вы начнёте левитировать. Разбитый флакон выпускает пар, поднимающий в воздух всех поблизости.
items.weapon.melee.alchemy.dualgreatsword.desc=Очень тяжёлое оружие, которым наносят мощные последовательные удары, держа его обеими руками. В умелых руках оно невероятно опасно, но требует огромной силы.
items.weapon.melee.spade.ability_desc=Дуэлянт может _выкопать_ из земли валун и бросить его во врага на расстоянии до %3$d клеток. Валун наносит _%1$d–%2$d урона_ и отталкивает цель на одну клетку. Стоимость — 2 заряда.
items.artifacts.ringofdisintegration.desc=Кольцо распада дрожит от разрушительной силы. Полностью зарядившись, оно выпускает сокрушительные лучи сразу в нескольких направлениях.\n\nПоглощайте опознанные свитки, чтобы ещё сильнее укрепить кольцо.
items.weapon.melee.alchemy.spearnshield.typical_ability1_desc=Дуэлянт может _укол_ наконечником копья врага в пределах досягаемости, но не вплотную. Приём обычно наносит _%1$d–%2$d урона_ и гарантированно отталкивает цель.
items.fertilizer.desc=Мешок питательного удобрения. Оно ускоряет созревание растений, но каждая следующая порция помогает всё меньше — почти спелые посевы едва реагируют. Продаётся в городской лавке.
items.scrolls.exotic.scrollofascension.desc=Этот свиток распределяет магию улучшения между всеми предметами. Прочитав его, вы сразу дважды улучшите и очистите от проклятий всё надетое снаряжение вместо того, чтобы пять раз улучшить один предмет.
items.weapon.melee.alchemy.unholybible$demon.desc=Вами овладела демоническая злоба. Ваши атаки наносят на 33%% больше урона и никогда не промахиваются, но безрассудное наступление вдвое снижает уклонение.\n\nОсталось ходов: %s.
items.weapon.melee.bow.bow.typical_ability_desc=Дуэлянт с луком может выполнить _пробивающий выстрел_. Следующая стрела гарантированно попадёт, пробьёт броню врага и обычно нанесёт _%1$d–%2$d урона_.
items.weapon.melee.flute.ability_desc=Дуэлянт может сыграть _колыбельную_. Все враги в радиусе 3 клеток замедлятся на _%d ходов_ и начнут засыпать. Вскоре они уснут, если не получат урон. Урона приём не наносит. Стоимость: 2 заряда.
items.weapon.melee.wardrum.ability_desc=Дуэлянт может отбить на барабане _боевой ритм_. Это займёт 1 ход: она и все видимые союзники получат ускорение на _%d ходов_, а враги в радиусе 2 клеток будут напуганы на 2 хода.
items.food.fullmoonberry.desc=Ягода полной луны созревает в самые тёмные часы ночи. В её могучей магии воплощены желания подземелья. От одного запаха внутри вас разгорается магическая ярость.
items.weapon.melee.alchemy.lance.ability_desc=Дуэлянт с рыцарским копьём может выполнить _Таран_: обычно бесплатно переместиться на расстояние до _%d_ клеток и сразу накопить импульс в зависимости от пройденного расстояния.
items.weapon.melee.alchemy.lancenshield.typical_ability1_desc=Дуэлянт с рыцарским копьём может выполнить _Таран_: обычно бесплатно переместиться на расстояние до _%d_ клеток и сразу накопить импульс в зависимости от пройденного расстояния.
items.weapon.melee.deathsword.ability_desc=Дуэлянт может _провести жатву_ мечом по врагу. Приём гарантированно наносит _%1$d–%2$d урона_, четверть которого возвращается в виде здоровья. Стоимость: 2 заряда.
items.weapon.melee.spade.desc=Универсальное боевое оружие, которое служит и лопатой. Благодаря малому весу им можно быстро размахивать.\n\nВ открытом мире оно копает как лопата: обрабатывает землю, добывает глину и песок, выкорчёвывает пни и саженцы.
items.potions.potionofkiwi.desc=Ярко-зелёная жидкость переполнена растительной энергией. Выпив её, вы вызовете бурный рост растений вокруг себя. Разбитый флакон высвобождает волну роста на всех соседних клетках.
items.food.moonberry.desc=Сытная сине-зелёная ягода из глубин подземелья. Под твёрдой оболочкой скрыта могущественная магия. Стоит вдохнуть её аромат, как внутри разгорается магическая ярость.
items.scrolls.scrollofregrowth.desc=Прочитанный свиток затопляет весь этаж магической водой, вызывая повсюду буйный рост растений. Он также открывает план уровня и все скрытые области.
items.potions.potionofhypno.desc=Переливающаяся жидкость пульсирует гипнотической энергией. Выпив её, вы загипнотизируете ближайших врагов. Разбитый флакон обращает всех существ возле места падения в ваших союзников.
items.potions.potionofsnowstorm.desc=Обжигающе холодная жидкость жалит кожу при касании. Выпив её, вы вызовете метель, но сами окажетесь прикованы к месту. Разбитый флакон поднимает ледяную бурю, охлаждающую и обездвиживающую всех поблизости.
items.potions.potionofhydrogenfire.desc=Чрезвычайно горючая жидкость бушует неистовым пламенем. Выпив её, вы устроите вокруг себя огромный пожар. Разбитый флакон вызовет огненную бурю, намного сильнее обычного огня.
items.weapon.melee.scalpel.typical_ability_desc=Дуэлянт может _жатва_ врага скальпелем. Этот разрушительный приём гарантированно попадает и обычно наносит _%d урона_. Если у цели нет иммунитета, урон наносится в виде кровотечения.
items.potions.potionofball.desc=Эта бодрящая смесь заставит выпившего вращаться, словно шар, дезориентируя ближайших врагов. Разбитый флакон выпускает вращающееся облако газа, от которого все внутри теряют ориентацию.
items.weapon.melee.alchemy.chainflail.desc=Оружие на длинной цепи позволяет поражать противников на расстоянии. Однако, чтобы как следует раскрутить тяжёлое навершие, требуется немалая сила.
items.weapon.melee.flute.typical_ability_desc=Дуэлянт может сыграть _колыбельную_. Все враги в радиусе 3 клеток обычно замедлятся на _%d ходов_ и начнут засыпать. Вскоре они уснут, если не получат урон. Урона приём не наносит. Стоимость: 2 заряда.
items.weapon.melee.wardrum.typical_ability_desc=Дуэлянт может отбить на барабане _боевой ритм_. Это займёт 1 ход: она и все видимые союзники обычно получат ускорение на _%d ходов_, а враги в радиусе 2 клеток будут напуганы на 2 хода.
items.spells.upgradedust.desc=Этот золотистый порошок, пропитанный мистической силой, обычно применяют в оружейной алхимии. Но его можно использовать и напрямую, чтобы временно усилить надетое оружие и броню.
items.weapon.melee.broadsword.ability_desc=Дуэлянт может провести широким мечом _широкий замах_. Он гарантированно наносит _%1$d–%2$d урона_ основной цели и, если позволяет досягаемость, поражает врагов на двух соседних с ней клетках.
items.weapon.melee.alchemy.holysword.true_ability_desc=Дуэлянт со Святым мечом может использовать _Божественную защиту_. Способность срабатывает мгновенно и создаёт щит прочностью 20% максимального здоровья. Стоимость: 2 заряда.
items.weapon.melee.handlight.ability_desc=Дуэлянт может _испепеление_ врага светом. Приём гарантированно наносит _%1$d–%2$d урона_ и поджигает цель, а яркая вспышка ослепляет всех врагов рядом с ней на 3 хода.
items.weapon.melee.knife.ability_desc=Дуэлянт с кухонным ножом может использовать _Глубокий порез_. Атака всегда попадает и вызывает кровотечение на _%1$d–%2$d ходов_. Стоимость: 3 заряда. Сильные враги могут сопротивляться эффекту.
items.weapon.melee.alchemy.forceglove.ability_desc=Дуэлянт с силовой перчаткой может вызвать _Ударную волну_. Она притягивает к герою врагов в радиусе _%d_ клеток, наносит урон в зависимости от расстояния перемещения и оглушает их.
items.weapon.melee.largesword.desc=Массивный тяжёлый меч с широким клинком. Замах занимает много времени, зато поднятым перед атакой мечом можно блокировать удары и, накопив достаточно заряда, наносить сокрушительный урон.
items.weapon.melee.mirrordoll.ability_desc=Дуэлянт может поднять зеркало куклы и _выполнить подмену_ с любым видимым врагом. Выйдя из зеркала, враг будет ослеплён на _%d ходов_. Неподвижные цели не подходят. Стоимость: 2 заряда.
items.weapon.melee.shovel.ability_desc=Дуэлянт может _бросок земли_ в лицо врагу в пределах 3 клеток, ослепив его на _%d ходов_. Если цель стоит в траве или воде, она ещё и увязнет на 2 хода. Стоимость: 1 заряд.
items.weapon.melee.alchemy.obsidianshield.desc=Щит с обсидиановыми вставками, пропитанный магией. Он создаёт вокруг владельца защиту от заклинаний, но, похоже, ради этого пришлось пожертвовать стойкостью против обычных ударов.
items.weapon.melee.gun.gun.gun_desc=Оружие выпускает _%1$s_ пуль за выстрел, каждая наносит от _%2$s_ до _%3$s_ урона. Сейчас заряжено _%4$s_/_%5$s_ патронов. Для перезарядки потребуется израсходовать _%6$s_ зарядов и _%7$s_ боеприпасов.
items.weapon.melee.alchemy.hugesword.desc=Обычное оружие, усиленное магией до невероятной степени. Оно чрезвычайно тяжёлое, но при умелом обращении обладает устрашающей мощью. Иногда удары двуручного меча ослабляют противников.
items.weapon.melee.royalspork.ability_desc=Дуэлянт может выполнить _королевское пронзание_: одним выпадом пронзить цель и врага прямо за ней. Обоим гарантированно наносится _%1$d–%2$d урона_ и кровотечение на _%3$d ходов_.
items.weapon.melee.trumpet.ability_desc=Дуэлянт может протрубить _фанфары_. За 1 ход и 2 заряда все видимые враги в пределах _%d клеток_ застывают на 1 ход, а Дуэлянт и союзники в этой области получают благословение на 3 хода.
items.weapon.enchantments.ancient.desc=Это оружие древнее, чем можно представить, и медленно привыкает к достойному владельцу. После достаточного числа убийств оно само становится сильнее, хотя каждое следующее улучшение даётся ему всё труднее.
items.weapon.melee.axe.ability_desc=Дуэлянт может _выполнить рубящий удар_ врага топором, гарантированно нанеся _%1$d–%2$d урона_. Если у противника осталось меньше половины здоровья, удар вдвое сильнее: _%3$d–%4$d урона_.
items.weapon.melee.bible.desc=Священная книга, несущая слово Божье. Когда герой сражается ею, её святая сила укрепляет владельца, а при достаточном могуществе способна даже восстанавливать здоровье.
items.weapon.melee.magebook.ability_desc=Дуэлянт может вырвать _страницу заклинаний_ и прочесть её, направив на врага в пределах 3 клеток. Магический удар игнорирует броню, гарантированно наносит _%1$d–%2$d урона_ и возвращает 1 ману. Стоимость: 1 заряд.
items.weapon.melee.alchemy.sharpkatana.ability_desc=Дуэлянт с острой катаной может использовать _Молниеносный разрез_. Приём выполняется мгновенно и не тратит ход, поражая одного врага. Если удар убьёт цель, вы восстановите _%s_ зарядов оружия.
items.journalpages.sokoban2.desc=Отдельная страница дневника с надписью «Замок Сокобан».\n\nЯ освоил стихии, необходимые для создания собственных пространств, и теперь собираюсь возвести огромную крепость, где спрячу все свои ценности.\n\n— Отилук, 1348 г. Л. П.
items.weapon.melee.broadsword.typical_ability_desc=Дуэлянт может провести широким мечом _широкий замах_. Он обычно наносит _%1$d–%2$d урона_ основной цели и гарантированно поражает врагов на двух соседних с ней клетках, если позволяет досягаемость.
items.weapon.melee.harp.typical_ability_desc=Дуэлянт может сыграть _реквием_: все видимые враги получают %1$d–%2$d звукового урона и замедляются на %3$d ходов, а все видимые союзники, включая самого Дуэлянта, восстанавливают %4$d здоровья. Стоимость: 2 заряда.
items.scrolls.exotic.scrollofreforging.desc=Руны этого свитка хранят жар целой кузницы. Если прочитать его над оружием или доспехом, он снимет проклятие, улучшит предмет и позволит выбрать из трёх чар или рун, которые останутся после перековки.
items.weapon.melee.handlight.typical_ability_desc=Дуэлянт может _испепеление_ врага светом. Приём гарантированно наносит обычно _%1$d–%2$d урона_ и поджигает цель, а яркая вспышка ослепляет всех врагов рядом с ней на 3 хода.
items.weapon.melee.knife.typical_ability_desc=Дуэлянт с кухонным ножом может использовать _Глубокий порез_. Атака всегда попадает и обычно вызывает кровотечение на _%1$d–%2$d ходов_. Стоимость: 3 заряда. Сильные враги могут сопротивляться эффекту.
items.weapon.melee.magestaff.ability_desc=Дуэлянт может нанести _чародейский выпад_ по прямой на расстояние до 3 клеток. Силовой удар игнорирует броню, гарантированно наносит _%1$d–%2$d урона_ и отталкивает цель на 1 клетку. Стоимость: 1 заряд.
items.weapon.melee.windbottle.ability_desc=Дуэлянт может открыть сосуд и направить _порыв ветра_ в выбранную клетку. Все существа в конусе шириной 2 клетки перед героем будут отброшены на _%d клетку_ и ослеплены на 2 хода. Приём занимает 1 ход и не требует близкой цели.
items.greaterstylus.desc=Этот волшебный стилус изготовлен из очень твёрдого тёмного камня. Им можно начертать магическую руну на доспехе, но выбрать её не получится: стилус сам решит, какая руна появится.
items.potions.potionofultraviolett.desc=Сияющая фиолетовая жидкость излучает мощное ультрафиолетовое излучение. Выпив её, вы ослепите ближайших врагов и обожжёте нежить. Разбитый флакон заливает округу обжигающим УФ-светом.
items.weapon.melee.alchemy.forceglove.typical_ability_desc=Дуэлянт с силовой перчаткой может вызвать _Ударную волну_. Она обычно притягивает к герою врагов в радиусе _%d клеток_, наносит урон в зависимости от расстояния перемещения и оглушает их.
items.weapon.melee.mirrordoll.typical_ability_desc=Дуэлянт может поднять зеркало куклы и _выполнить подмену_ с любым видимым врагом. Выйдя из зеркала, враг обычно будет ослеплён на _%d ходов_. Неподвижные цели не подходят. Стоимость: 2 заряда.
items.weapon.melee.shovel.typical_ability_desc=Дуэлянт может _бросок земли_ в лицо врагу в пределах 3 клеток, обычно ослепив его на _%d ходов_. Если цель стоит в траве или воде, она ещё и увязнет на 2 хода. Стоимость: 1 заряд.
items.rice.desc=Эта волшебная рисинка поможет приготовить множество сытных пельменей. Из неё можно сделать рисовые шарики для метания или соединить несколько рисинок в пельменную бомбу. Осторожно: после нескольких применений рисинка рассыплется.
items.weapon.melee.gun.gun.gun_typical_desc=Оружие выпускает _%1$s_ пуль за выстрел, каждая обычно наносит от _%2$s_ до _%3$s_ урона. Сейчас заряжено _%4$s_/_%5$s_ патронов. Для перезарядки потребуется израсходовать _%6$s_ зарядов и _%7$s_ боеприпасов.
items.weapon.melee.triangolo.desc=Ударный музыкальный инструмент из тонкого стального прута, согнутого треугольником. При ударе он издаёт чистый мелодичный звон, который поражает всё вокруг цели. С улучшением увеличивается дальность его действия.
items.scrolls.exotic.scrollofwildgrowth.desc=Свиток затопляет этаж магической водой и открывает план, как свиток возрождения природы. Но на этом буйство стихий не заканчивается: вокруг вас вырастает высокая трава, а из неё появляются живые растения.
items.weapon.melee.harp.ability_desc=Дуэлянт может сыграть _реквием_: все видимые враги получают _%1$d–%2$d звукового урона_ и _замедляются на %3$d ходов_, а все видимые союзники, включая самого Дуэлянта, _восстанавливают %4$d здоровья_. Стоимость: 2 заряда.
items.weapon.melee.royalspork.typical_ability_desc=Дуэлянт может выполнить _королевское пронзание_: одним выпадом пронзить цель и врага прямо за ней. Обоим гарантированно наносится обычно _%1$d–%2$d урона_ и кровотечение на _%3$d ходов_.
items.weapon.melee.trumpet.typical_ability_desc=Дуэлянт может протрубить _фанфары_. За 1 ход и 2 заряда все видимые враги в пределах обычно _%d клеток_ застывают на 1 ход, а сам Дуэлянт и союзники в этой области получают благословение на 3 хода.
items.weapon.melee.chainsaw.typical_ability_desc=Дуэлянт может _потрошение_ врага, до которого достаёт пила: за один взмах нанести три гарантированных удара по %1$d–%2$d урона, каждый из которых вызывает кровотечение на %3$d. Стоимость: 2 заряда.
items.weapon.melee.nunchakus.ability_desc=Дуэлянт может _вихрь_ нунчаки и дважды ударить врага одним движением. Первый удар наносит _%1$d–%2$d урона_, второй — три четверти от этого. Оба гарантированно попадают и могут оглушить цель, как обычные удары нунчак.
items.weapon.melee.alchemy.lancenshield.desc=Усовершенствованная комбинация копья и щита, позволяющая мгновенно менять оружие по необходимости.\n\nВ _атакующей стойке_ используется способность _Кавалерийского копья_.\nВ _защитной стойке_ — способность _Обсидианового щита_.
items.weapon.melee.alchemy.spearnshield.desc=Оружейная комбинация из копья и круглого щита, которые можно использовать по отдельности.\n\nВ _атакующей стойке_ используется _копьё_.\nВ _защитной стойке_ — _круглый щит_.
items.weapon.melee.magebook.typical_ability_desc=Дуэлянт может вырвать _страницу заклинаний_ и прочесть её, направив на врага в пределах 3 клеток. Магический удар игнорирует броню, гарантированно наносит обычно _%1$d–%2$d урона_ и возвращает 1 ману. Стоимость: 1 заряд.
items.portablechest.desc=Складной личный сундук. Его можно поставить на любой свободной земле вне города, а позже снова сложить, не потеряв ни одного предмета.\n\nВместимость: %d предметов. Сейчас внутри: %d.
items.weapon.melee.alchemy.dualgreatsword.ability_desc=Дуэлянт может _нанести рассекающий удар_ врага длинным мечом, гарантированно нанеся _%1$d–%2$d урона_. Если удар убьёт цель, он не займёт времени, а в следующие 5 ходов приём можно будет бесплатно повторить.
items.weapon.melee.alchemy.forceglove.desc=Перчатка, наполненная магией силы, позволяет поражать дальних врагов невидимым ударом. Колоссальный импульс отбрасывает их далеко назад, попутно слегка повреждая окружающих противников.
items.weapon.melee.alchemy.sharpkatana.typical_ability_desc=Дуэлянт с острой катаной может использовать _Молниеносный разрез_. Приём выполняется мгновенно и не тратит ход, поражая одного врага. Если удар убьёт цель, вы обычно восстановите _%s_ зарядов оружия.
items.weapon.melee.alchemy.hugesword.ability_desc=Дуэлянт может _нанести рассекающий удар_ врага огромным мечом, гарантированно нанеся _%1$d–%2$d урона_. Если удар убьёт цель, он не займёт времени, а в следующие 5 ходов приём можно будет бесплатно повторить.
items.weapon.melee.chainsaw.ability_desc=Дуэлянт может _потрошение_ врага, до которого достаёт пила: за один взмах нанести три гарантированных удара по _%1$d–%2$d урона_, каждый из которых вызывает _кровотечение на %3$d_. Стоимость: 2 заряда.
items.weapon.melee.magestaff.typical_ability_desc=Дуэлянт может выполнить _чародейский выпад_ по прямой на расстояние до 3 клеток. Силовой удар игнорирует броню, гарантированно наносит обычно _%1$d–%2$d урона_ и отталкивает цель на 1 клетку. Стоимость: 1 заряд.
items.weapon.melee.minigun.desc=Скорострельное оружие с вращающимся блоком стволов. Пули поражают и врагов, столпившихся вокруг цели. Удар самим оружием отталкивает противника. Стрелять можно только с экипированным пулемётом, а при перезарядке расходуется по одному патрону на каждую пулю.
items.weapon.melee.windbottle.typical_ability_desc=Дуэлянт может открыть сосуд и направить _порыв ветра_ в выбранную клетку. Все существа в конусе шириной 2 клетки перед героем обычно будут отброшены на _%d клетку_ и ослеплены на 2 хода. Приём занимает 1 ход и не требует близкой цели.
items.weapon.melee.alchemy.unformedblade.desc=Полупрозрачный клинок, непрерывно меняющий форму. Устраивая засады, он накапливает тёмную энергию. При её высвобождении есть шанс поразить врага действием зачарования _Мрачности_, словно при внезапной атаке.
items.weapon.melee.quick.pocketknife.desc=Маленький складной нож. Он наносит мало урона, но может выручить в опасную минуту. Если улучшить нож, его можно будет израсходовать, чтобы усилить улучшение другого оружия.
items.weapon.melee.axe.typical_ability_desc=Дуэлянт может _рубануть_ врага топором, обычно нанеся _%1$d–%2$d урона_. Удар гарантированно попадает. Если у противника осталось меньше половины здоровья, удар вдвое сильнее: обычно _%3$d–%4$d урона_.
items.weapon.melee.nunchakus.typical_ability_desc=Дуэлянт может _вихрь_ нунчаки и дважды ударить врага одним движением. Первый удар обычно наносит _%1$d–%2$d урона_, второй — три четверти от этого. Оба гарантированно попадают и могут оглушить цель, как обычные удары нунчак.
items.weapon.melee.minerstool.typical_ability_desc=Дуэлянт может вызвать _обвал_: все враги в радиусе %3$d клеток попадут под камнепад, получат %1$d–%2$d урона (неорганические — на четверть больше) и будут покалечены на 2 хода. Стоимость: 2 заряда.
items.weapon.melee.alchemy.dualgreatsword.typical_ability_desc=Дуэлянт может _нанести рассекающий удар_ врага длинным мечом, гарантированно нанеся обычно _%1$d–%2$d урона_. Если удар убьёт цель, он не займёт времени, а в следующие 5 ходов приём можно будет бесплатно повторить.
items.bags.ankhchain.desc=Освящённая цепочка для анкхов, колец, любых ключей и всего, что открывает путь куда-либо: портальных ключей, книг, монеты, кости и раковины, СанЧикара, маяков. Её звенья слабо мерцают святым светом.
items.weapon.melee.alchemy.hugesword.typical_ability_desc=Дуэлянт может _нанести рассекающий удар_ врага огромным мечом, гарантированно нанеся обычно _%1$d–%2$d урона_. Если удар убьёт цель, он не займёт времени, а в следующие 5 ходов приём можно будет бесплатно повторить.
items.weapon.melee.alchemy.spearnshield.ability2_desc=Дуэлянт может _защищаться_ круглым щитом, полностью отражая физические и магические атаки в течение _%d ходов_. После блокирования первой атаки любая ответная атака или использование магии прервут защиту.
items.weapon.melee.alchemy.assassinsspear.desc=Модифицированная глефа с клинком кинжала убийцы. Она наносит больше урона незащищённым врагам и достаёт цели на расстоянии, однако из-за длинного древка замах стал медленнее.
items.weapon.melee.alchemy.lancenshield.ability2_desc=Дуэлянт может _защищаться_ круглым щитом, полностью отражая физические и магические атаки в течение _%d ходов_. После блокирования первой атаки любая ответная атака или использование магии прервут защиту.
items.weapon.melee.alchemy.obsidianshield.ability_desc=Дуэлянт может _защищаться_ круглым щитом, полностью отражая физические и магические атаки в течение _%d ходов_. После блокирования первой атаки любая ответная атака или использование магии прервут защиту.
items.weapon.missiles.forestdart.desc=Эти дротики светятся зеленью: в них заключена первозданная сила леса. Особенно смертоносны против обычных существ. Дротики, найденные в разных местах, можно складывать в стопки по 60 штук.
items.emptybottle.desc=Чистая пустая бутылка. Чтобы наполнить её водой, встаньте в воду или рядом с ней либо положите бутылку в алхимический котёл.\n\nКаждое зелье из семян требует бутылку, а после выпитого зелья пустая бутылка остаётся.
items.weapon.melee.minerstool.ability_desc=Дуэлянт может вызвать _обвал_: все враги в радиусе %3$d клеток попадут под камнепад, получат _%1$d–%2$d урона_ (неорганические — на четверть больше) и будут _покалечены на 2 хода_. Стоимость: 2 заряда.
items.potions.exotic.potionofdragonsbreath.infuse_desc=Каждое попадание вызывает огненную вспышку размером 3×3 клетки: враги поблизости получают дополнительный урон огнём в размере 35% силы удара и воспламеняются. Пламя остаётся на земле и обжигает вступивших в него. Расходуются обычные заряды пропитки колчана.
items.weapon.melee.shootgun.desc=Дробовик, модифицированный странной технологией. Выстрелы делают врагов уязвимыми, а весь магазин можно выпустить разом в виде сокрушительного залпа, от которого невозможно увернуться. Стреляет только в руках владельца; при перезарядке каждый патрон расходуется отдельно.
items.weapon.melee.alchemy.chainflail.ability_desc=Дуэлянт может _раскручивать цепной кистень_, постепенно усиливая следующий удар. Каждый ход раскручивания добавляет _+%d урона_, максимум трижды. Удар раскрученным кистенём гарантированно попадёт в цель. Заряд расходуется только при начале раскручивания.
items.weapon.melee.bible.ability_desc=Дуэлянт с Библией может использовать _Благословение ангела_. Приём активируется мгновенно и на следующие _%d ходов_ позволяет восстанавливать здоровье в зависимости от урона, наносимого врагам в ближнем бою.
items.wetlands.boglantern.desc=Стеклянная банка с болотным огоньком, подвешенная на проволочной ручке. Откройте её, и холодный зелёный свет разгонит тьму и болотный туман, который больше не будет ограничивать обзор, пока огонёк не погаснет. Но согреться им не получится.
items.armorkit.desc=Этот набор инструментов и материалов позволяет превратить любой доспех в эпический классовый. Он сохраняет все свойства исходной брони и даёт владельцу особую способность, зависящую от класса героя.
items.weapon.melee.alchemy.lancenshield.typical_ability2_desc=Дуэлянт может _защищаться_ круглым щитом, полностью отражая физические и магические атаки обычно в течение _%d ходов_. После блокирования первой атаки любая ответная атака или использование магии прервут защиту.
items.weapon.melee.alchemy.obsidianshield.typical_ability_desc=Дуэлянт может _защищаться_ круглым щитом, полностью отражая физические и магические атаки обычно в течение _%d ходов_. После блокирования первой атаки любая ответная атака или использование магии прервут защиту.
items.weapon.melee.alchemy.spearnshield.typical_ability2_desc=Дуэлянт может _защищаться_ круглым щитом, полностью отражая физические и магические атаки обычно в течение _%d ходов_. После блокирования первой атаки любая ответная атака или использование магии прервут защиту.
items.weapon.melee.alchemy.unholybible.ability_desc=Дуэлянт с Нечестивой Библией может на время _принять демонический облик_: на _%d ходов_ получить +33%% к силе атаки и гарантированные попадания, но потерять 50%% уклонения из-за безрассудного натиска. Превращение не тратит ход.
items.gunsmithingtool.magazine_desc=_Модификация магазина_ изменяет _максимальный боезапас_ и _время перезарядки_ за счёт размера магазина.\n\n_Увеличенный магазин:_\n- Боезапас _×1,5_\n- Перезарядка _+1 ход_\n\n_Быстросъёмный магазин:_\n- Боезапас _×0,5_\n- Перезарядка _−1 ход_
items.diarypage.desc=Страница шахтёрского дневника, купленная у городского библиотекаря. Здесь подробно описан %d-й этаж подземелья. Если прочесть её на этом этаже, откроется вся карта; в другом месте это всего лишь печальная история о шахте.
items.gunsmithingtool.barrel_desc=_Замена ствола_ изменяет _точность стрельбы_ за счёт длины ствола.\n\n_Короткий ствол:_\n- Точность на дальнем расстоянии _×0,5_\n- Точность вблизи _×1,5_\n\n_Длинный ствол:_\n- Точность на дальнем расстоянии _×1,25_\n- Точность вблизи _×0,75_
items.weapon.enchantments.holy.elestrike_desc=Стихийный удар поражает врагов в конусе волной, наносящей 30% урона оружия, кроме основной цели. Святая сила дополнительно рассчитывает урон по нежити и демонам. Уровень зачарования и обычные условия его срабатывания сохраняются.
items.weapon.melee.deathsword.desc=Зловещий меч, окружённый аурой смерти. Каждый раз, когда Рыцарь смерти убивает им врага, он поглощает душу жертвы и немного повышает максимальное здоровье. После окончательной смерти героя этот прирост обнуляется.
items.weapon.enchantments.poison.elestrike_desc=Стихийный удар поражает врагов в конусе волной, наносящей 30% урона оружия, кроме основной цели. На каждого поражённого врага яд может подействовать с обычным шансом зачарования. Уровень чар и условия их срабатывания сохраняются.
items.weapon.melee.alchemy.chainflail.typical_ability_desc=Дуэлянт может _применить вращение_ цеп, ненадолго накапливая силу. Каждый ход раскручивания обычно добавляет _+%d урона_, максимум трижды. Раскрученный цеп гарантированно попадает. Заряд расходуется только при начале раскручивания.
items.weapon.melee.bible.typical_ability_desc=Дуэлянт с Библией может использовать _Благословение ангела_. Приём активируется мгновенно и обычно на следующие _%d ходов_ позволяет восстанавливать здоровье в зависимости от урона, наносимого врагам в ближнем бою.
items.spidercharm.desc=Эту необычную безделушку окутывает таинственная аура. Кто знает, что случится с тем, кто её наденет?\n\nПрименение отнимает четверть максимального здоровья и призывает на вашу сторону паука-слугу. Если это убило бы вас, амулет не сработает.
items.weapon.enchantments.paralysis.elestrike_desc=Стихийный удар поражает врагов в конусе волной, наносящей 30% урона оружия, кроме основной цели. Каждый враг может быть парализован с обычным шансом зачарования. Уровень чар и условия их срабатывания сохраняются.
items.weapon.enchantments.cromluck.elestrike_desc=Стихийный удар поражает врагов в конусе волной, наносящей 30% урона оружия, кроме основной цели. Для каждого врага Кром повторно рассчитывает урон и оставляет наибольший результат. Уровень чар и условия их срабатывания сохраняются.
items.weapon.enchantments.horror.elestrike_desc=Стихийный удар поражает врагов в конусе волной, наносящей 30% урона оружия, кроме основной цели. Каждый враг может в ужасе обратиться в бегство с обычным шансом зачарования. Уровень чар и условия их срабатывания сохраняются.
items.weapon.enchantments.jupitershorror.elestrike_desc=Стихийный удар поражает врагов в конусе волной, наносящей 30% урона оружия, кроме основной цели. Для каждого врага отдельно рассчитывается обычный эффект ужаса Юпитера. Уровень чар и условия их срабатывания сохраняются.
items.weapon.melee.alchemy.chainflail$spinabilitytracker.desc=Вы раскручиваете цеп, готовя следующий удар. Каждый ход раскручивания расходует 1 заряд, но добавляет +20%% урона. Раскрученная атака также гарантированно попадает.\n\nДополнительный урон: %1$d%%.\nОсталось ходов: %2$s.
items.weapon.enchantments.hunting.elestrike_desc=Стихийный удар поражает врагов в конусе волной, наносящей 30% урона оружия, кроме основной цели. Живая добыча получает дополнительный урон, а после убийства может остаться мясо. Уровень чар и условия их срабатывания сохраняются.
items.gunsmithingtool.bullet_desc=_Замена боеприпасов_ изменяет _урон_ и _бронепробитие_ пуль в зависимости от их типа.\n\n_Экспансивные пули:_\n- Урон пули _×1,3_\n- Бронепробитие _×2_\n\n_Бронебойные пули:_\n- Урон пули _×0,8_\n- Бронепробитие _×0_
items.weapon.melee.alchemy.unholybible.typical_ability_desc=Дуэлянт с Нечестивой Библией может на время _принять демонический облик_: обычно на _%d ходов_ получить +33%% к силе атаки и гарантированные попадания, но потерять 50%% уклонения из-за безрассудного натиска. Превращение не тратит ход.
items.weapon.melee.alchemy.assassinsspear.ability_desc=Дуэлянт с копьём убийцы может выполнить _Смертельный выпад_. У этой мощной, но предсказуемой атаки точность снижена на 75%%, зато при попадании она наносит _%1$d–%2$d урона_. Выпад можно применять для атак из засады даже по врагам вне поля зрения.
items.potions.elixirs.elixirofbloom.desc=Выпитый эликсир на 100 ходов заставляет траву расти на голой земле под ногами героя, а количество семян, найденных при вытаптывании высокой травы, удваивается. Брошенный флакон вызывает рост растений в радиусе 2 клеток; на ближайшей свободной клетке прорастает случайное семя.
items.weapon.enchantments.parasitic.elestrike_desc=Стихийный удар поражает врагов в конусе волной, наносящей 30% урона оружия, кроме основной цели. Каждый враг может получить паразитическое семя с обычным шансом зачарования. Уровень чар и условия их срабатывания сохраняются.
items.potions.brews.frigidbrew.desc=Брошенное варево замораживает область 3×3 и вызывает расходящуюся от точки падения ледяную бурю, которая сковывает всё на пути. Выпитое наделяет вас силой мороза на 50 ходов: удары охлаждают врагов, а вас нельзя охладить или заморозить.
items.weapon.enchantments.buzzsaw.elestrike_desc=Стихийный удар поражает врагов в конусе волной, наносящей 30% урона оружия, кроме основной цели. Активная бензопила наносит дополнительные режущие удары, расходуя топливо из бурдюка как обычно. Уровень чар и условия их срабатывания сохраняются.
items.weapon.enchantments.slashing.elestrike_desc=Стихийный удар поражает врагов в конусе волной, наносящей 30% урона оружия, кроме основной цели. Режущие чары повторно рассчитывают урон каждой цели и добавляют усиленный бонус урона. Уровень чар и условия их срабатывания сохраняются.
items.weapon.enchantments.midas.elestrike_desc=Стихийный удар поражает врагов в конусе волной, наносящей 30% урона оружия, кроме основной цели. Каждый враг может принести золото, а добивающий удар даёт денежную награду зачарования. Уровень чар и условия их срабатывания сохраняются.
items.weapon.melee.alchemy.assassinsspear.typical_ability_desc=Дуэлянт с копьём убийцы может выполнить _Смертельный выпад_. Этот предсказуемый мощный удар имеет штраф к точности −75%%, но при попадании обычно наносит _%1$d–%2$d урона_. Укол позволяет атаковать из засады даже невидимых вам врагов.
items.weapon.enchantments.surging.elestrike_desc=Стихийный удар поражает врагов в конусе волной, наносящей 30% урона оружия, кроме основной цели. На поражённых целях накапливаются заряды всплеска, которые затем наносят запасённый дополнительный урон. Уровень чар и условия их срабатывания сохраняются.
items.potions.brews.quicksandbrew.desc=Брошенное варево превращает землю в засасывающую грязь и заполняет область 3×3 замедляющим облаком. Враги внутри получают увечье на 6 ходов и замедление на 4 хода. Выпитое позволяет твёрдо стоять на ногах: 60 ходов вас нельзя покалечить, замедлить или обездвижить.
items.potions.elixirs.elixirofthehunt.desc=Эликсир обостряет все чувства. Выпив его, на 20 ходов вы сможете ощущать существ сквозь стены, будете двигаться на 20% быстрее и атаковать с точностью на 15% выше. Брошенный флакон помечает всех врагов в радиусе 3 клеток, позволяя ощущать их 40 ходов.
items.weapon.enchantments.osmose.elestrike_desc=Стихийный удар поражает врагов в конусе волной, наносящей 30% урона оружия, кроме основной цели. Каждый поражённый враг может восстановить владельцу ману за счёт обычного поглощения, зависящего от урона. Уровень чар и условия их срабатывания сохраняются.
items.weapon.melee.alchemy.beamsaber.ability_desc=Дуэлянт может выполнить _комбинированный удар_ лучевым мечом. Атака гарантированно попадает в цель и добавляет _+%d урона_ за каждое недавнее успешное попадание оружием ближнего боя или метательным оружием. Если в течение 5 ходов не попадать по врагам, комбо сбрасывается.
items.weapon.missiles.alchemy.cross.desc=Этот крест не предназначен для метания, но при броске способен нанести врагам большой урон. Через несколько ходов он возвращается на прежнее место. Демоны и нежить получают дополнительный урон от священной силы креста.
items.armor.glyphs.adaptation.desc=Руна помогает владельцу приспосабливаться к окружению. При ударе она может почерпнуть силу из поверхности под ногами: стойкость из обычной травы, скорость из воды, скрытность из высокой травы, огненное возмездие из углей или магию из обезвреженных ловушек.
items.weapon.enchantments.ancient.elestrike_desc=Стихийный удар поражает врагов в конусе волной, наносящей 30% урона оружия, кроме основной цели. Древняя сила добавляет обычные проверки дополнительного урона, а убийства идут в счёт самостоятельного улучшения оружия. Уровень чар и условия их срабатывания сохраняются.
items.weapon.melee.alchemy.beamsaber.typical_ability_desc=Дуэлянт может выполнить _комбинированный удар_ лучевым мечом. Атака гарантированно попадает в цель и обычно добавляет _+%d урона_ за каждое недавнее успешное попадание оружием ближнего боя или метательным оружием. Если в течение 5 ходов не попадать по врагам, комбо сбрасывается.
items.weapon.melee.bow.bowweapon$bowfatigue.desc=Если выпускать слишком много стрел подряд, руки начинают слабеть.\n\nПосле 5 выстрелов подряд урон каждой следующей стрелы будет _уменьшаться на 10%%_. Небольшая передышка снимает этот эффект.\n\nВыпущено стрел: _%1$d_\nОсталось ходов: _%2$s_.
items.weapon.melee.stonecross.typical_ability_desc=Дуэлянт может _провести освящение_ врага в пределах досягаемости: гарантированно нанести %1$d–%2$d урона, вдвое больше нежити и демонам. Земля вокруг цели станет освящённой и даст благословение стоящим на ней союзникам, включая Дуэлянта, на %3$d ходов. Стоимость: 2 заряда.
items.weapon.enchantments.lokispoison.elestrike_desc=Стихийный удар поражает врагов в конусе волной, наносящей 30% урона оружия, кроме основной цели. Локи проверяет шанс отравления каждой цели и распространяет яд на соседних существ, как при обычном ударе. Уровень чар и условия их срабатывания сохраняются.
items.weapon.enchantments.aresleech.elestrike_desc=Стихийный удар поражает врагов в конусе волной, наносящей 30% урона оружия, кроме основной цели. На реликтовом оружии Арес вытягивает силы из ближайших врагов, восстанавливает здоровье и накапливает заряд реликвии при каждом срабатывании. Уровень чар и условия их срабатывания сохраняются.
items.weapon.enchantments.luck.elestrike_desc=Стихийный удар поражает врагов в конусе волной, наносящей 30% урона оружия, кроме основной цели. Удача повторно рассчитывает урон для каждого врага, оставляет лучшие результаты и учитывает усиление зачарования. Уровень чар и условия их срабатывания сохраняются.
items.weapon.melee.gun.gun.ability_desc=Бойцы с огнестрельным оружием могут использовать _Быструю перезарядку_. Приём мгновенно пополняет магазин без траты хода и патронов. Если магазин уже полон, он заполняется до двойной ёмкости. Стоимость: 2 заряда.
items.potions.brews.wickedbrew.desc=Эта мерзкая смесь токсичного и парализующего газов действует сильнее, чем каждый из них по отдельности. Брошенное варево создаёт густое облако, обездвиживая врагов, пока яд разъедает их. Выпитое на 40 ходов даёт иммунитет к токсичному, парализующему и едкому газу.
items.journalpages.sokoban1.desc=Отдельная страница дневника с надписью «Упражнения в сокобане».\n\nЯ разработал способ создавать пространства за пределами нашего мира, чтобы прятать там свои вещи.\n\nКак ни странно, в них появились какие-то необычные породы овец. Возможно, эти обитатели смогут мне пригодиться.\n\n— Отилук, 1345 г. Л. П.
items.starfragment.desc=Осколок упавшей звезды, тёмный как железо и всё ещё тёплый. Внутри него движется некий свет.\n\nЗвёздный металл поддаётся ковке лучше любой земной руды: городской кузнец-тролль выкует из двух осколков сердцевину превосходного качества. Да и любой торговец щедро заплатит за один.
items.weapon.melee.stonecross.ability_desc=Дуэлянт может _провести освящение_ врага в пределах досягаемости: гарантированно нанести _%1$d–%2$d урона_, вдвое больше нежити и демонам. Земля вокруг цели станет освящённой и даст _благословение_ стоящим на ней союзникам, включая Дуэлянта, на _%3$d ходов_. Стоимость: 2 заряда.
items.gunsmithingtool.enchant_desc=_Магическая модификация_ изменяет _урон пуль_ и _силу магических эффектов_ за счёт механизма наложения магии на боеприпасы.\n\n_Усиление:_\n- Урон пуль _×0,75_\n- Сила магии _×2_\n\n_Подавление:_\n- Урон пуль _×1,25_\n- Сила магии _×0,5_
items.weapon.enchantments.neptuneshock.elestrike_desc=Стихийный удар поражает врагов в конусе волной, наносящей 30% урона оружия, кроме основной цели. Заряженная реликвия тратит заряд на молнии Нептуна с обычным бонусом урона в воде и параличом. Уровень чар и условия их срабатывания сохраняются.
items.weapon.enchantments.vicious.elestrike_desc=Стихийный удар поражает врагов в конусе волной, наносящей 30% урона оружия, кроме основной цели. Каждая цель получает особый дополнительный урон жестоких чар, при этом владелец рискует ранить себя. Уровень чар и условия их срабатывания сохраняются.
items.weapon.melee.alchemy.chainwhip.desc=Оружие, целиком состоящее из цепей. Их длина позволяет доставать противников дальше, чем обычным кнутом. Тяжёлые металлические звенья требуют силы, зато могут оглушить врага при ударе.
items.weapon.enchantments.nomnom.elestrike_desc=Стихийный удар поражает врагов в конусе волной, наносящей 30% урона оружия, кроме основной цели. Каждая цель может быть пожрана с обычным шансом зачарования, восстанавливая здоровье и утоляя голод владельца. Уровень чар и условия их срабатывания сохраняются.
items.weapon.melee.alchemy.lance$lancebuff.desc=Вы начали разгоняться с выставленным вперёд рыцарским копьём и продолжаете накапливать импульс. Чем дольше разгон, тем сильнее следующий удар, но со временем бонус постепенно уменьшается. На высокой скорости движения импульс копится быстрее.\n\nТекущий множитель урона: %sx
items.weapon.melee.deathsword.desc_hero=Зловещий меч, окружённый аурой смерти. Каждый раз, когда Рыцарь смерти убивает им врага, он поглощает душу жертвы и немного повышает максимальное здоровье. После окончательной смерти героя этот прирост обнуляется.\n\nТекущий прирост максимального здоровья: _%1$d/%2$d_.
items.potions.brews.blindingbrew.desc=Брошенное варево вспыхивает слепящим светом посреди облака сияющего дыма. Все существа в радиусе 2 клеток, кроме вас и союзников, будут ослеплены на 6 ходов. Выпитое позволяет 15 ходов ощущать существ сквозь стены и даёт иммунитет к ослеплению на 60 ходов.
items.potions.elixirs.elixirofclarity.desc=Выпитый эликсир полностью восстанавливает ману и проясняет разум. За следующие 3 убийства, приносящие опыт, вы получите на 50% больше опыта. Брошенный флакон снимает с врагов в области 3×3 все магические усиления: ускорение, адреналин, благословение, невидимость, дубовую кожу, магическую броню и щиты.
items.weapon.melee.alchemy.meisterhammer.ability_desc=Дуэлянт может нанести молотом мастера _мощный удар_. При внезапной атаке он наносит _%1$d–%2$d урона_ и ошеломляет цель на 5 ходов, снижая её точность и уклонение на 50%%. Тяжёлый удар всегда попадает, но без эффекта неожиданности наносит обычный урон.
items.potions.brews.overgrowthbrew.desc=Брошенное варево вызывает рост растений в радиусе 2 клеток. Лозы опутывают всех врагов в области, обездвиживая их на 4 хода. Выпитое даёт дубовую кожу прочностью 2 плюс треть уровня героя; каждые 4 хода прочность падает на 1. Пока она действует, обездвижить вас нельзя.
items.potions.brews.frostfirebrew.desc=Внутри варева борются мороз и пламя. Брошенное зелье мгновенно замораживает область 3×3, обездвиживая врагов на 5 ходов, а затем воспламеняет всё вокруг. Выпитое на 25 ходов дарует силы огня и льда: удары поджигают и охлаждают, а вы получаете иммунитет к обеим стихиям.
items.potions.potionofwater.desc=Обычная чистая вода в бутылке. Вылейте её на соседнюю клетку или на себя, сохранив бутылку: она тушит огонь, обливает существ и оставляет лужу на сухой земле. Если бросить бутылку, она разобьётся и сделает то же самое при падении.\n\nПустую бутылку можно наполнить в любом водоёме или алхимическом котле.
items.weapon.melee.alchemy.meisterhammer.typical_ability_desc=Дуэлянт может нанести молотом мастера _мощный удар_. При внезапной атаке он обычно наносит _%1$d–%2$d урона_ и ошеломляет цель на 5 ходов, снижая её точность и уклонение на 50%%. Тяжёлый удар всегда попадает, но без эффекта неожиданности наносит обычный урон.
items.potions.elixirs.elixirofvitality.desc=Выпитый эликсир за короткое время исцеляет примерно половину максимального здоровья и снимает обычные недуги, одновременно создавая защитный барьер прочностью примерно треть максимального здоровья. Брошенный флакон даёт вам и союзникам в области 3×3 барьер прочностью четверть их максимального здоровья.
items.steelhoneypot.desc=В этом большом медовом горшке мёдом лишь смазаны стенки: внутри живёт огромная стальная пчела! Обычно эти гиганты не покидают улья. Возможно, горшок — особая ловушка пчеловода? Пчела, похоже, вполне довольна мёдом и лишь настороженно жужжит, когда вы заглядываете внутрь.
items.potions.elixirs.elixiroftheshade.desc=Выпитый эликсир на 20 ходов делает героя невидимым и окутывает живой тенью. Первые 3 атаки из невидимости не раскроют его. Брошенный флакон создаёт густую дымовую завесу в радиусе 2 клеток. Если вы стоите в ней, то тоже становитесь невидимым на 3 хода.
items.potions.elixirs.elixirofwarmth.desc=Выпитый эликсир согревает тело изнутри: 60 ходов вас нельзя охладить или заморозить, а каждый удар в ближнем бою имеет 25% шанс поджечь врага. Брошенный флакон оттаивает область 3×3, растапливает лёд, освобождает всех от охлаждения и заморозки и поджигает врага при прямом попадании.
items.potions.brews.thunderheadbrew.desc=Брошенное варево создаёт облако обжигающего пара с электрическими разрядами размером 3×3. На протяжении 8 ходов молнии бьют по всем в облаке каждый ход. Выпитое на 40 ходов даёт иммунитет к электричеству, а удары в ближнем бою с шансом 30% поражают молнией ещё одного врага рядом с целью.
items.potions.brews.hypnobrew.desc=Брошенное варево выпускает туман безумия. Все враги в радиусе 2 клеток на 8 ходов сходят с ума и атакуют ближайших, даже других чудовищ. Боссы сопротивляются безумию и получают лишь очарование на 3 хода. Выпитое окружает вас туманом, очаровывающим соседних врагов на 5 ходов. На боссов это не действует.
items.gunsmithingtool.attach_desc=_Установка обвесов_ усиливает _особые свойства_ оружия за счёт оптических устройств.\n\n_Лазерный прицел:_\n- Точность пуль _×1,25_\n- Заметность для врагов _+1 класс_\n\n_Фонарь:_\n- При попадании даёт _кратковременное ослепление_ с вероятностью _50%-10%*(расстояние до цели)_\n- Заметность для врагов _+2 класса_
items.potions.elixirs.elixirofrestoration.desc=Эликсир сочетает лечение и очищение. Выпитый, он за короткое время восстанавливает примерно половину максимального здоровья и снимает все вредоносные эффекты. Брошенный флакон мгновенно лечит вас и союзников в области 3×3 на четверть их максимального здоровья и очищает их. На врагов не действует.
items.journalpages.sokoban3.desc=Отдельная страница дневника с надписью «Порталы сокобана».\n\nС тех пор как я создал первое пространство, мои силы значительно возросли.\n\nТеперь я могу изменять время и положение вещей способами, о которых прежде и мечтать не мог.\n\nМои занятия вызвали колебания в магической эфиросфере. В ясные дни я улавливаю отголоски какого-то возмущения, сосредоточенного вокруг меня.\n\n— Отилук, 1355 г. Л. П.
items.weapon.melee.shovel.desc=Обычная лопата путешественника. Ею главным образом раскапывают траву ради семян, но и в бою она неплоха.\n\nВ открытом мире копайте соседнюю клетку: трава и голая земля превращаются в грядку, на берегу болота или реки добывается глина, на пляже и в пустыне — песок, а пни и саженцы можно выкорчевать.
items.spells.evolution.desc=Это нестабильное заклинание действует подобно свитку превращения, но только на оружие. При эволюции оружие может перейти на следующую ступень качества.\n\nУровень улучшения и зачарование сохраняются. Оружие выше 5-й ступени не эволюционирует, а превращается в случайное оружие 5-й ступени. Модификации огнестрельного оружия при этом теряются.
items.weapon.melee.alchemy.unformedblade.energy=Этот клинок накапливает тёмную энергию при нападении из засады, а затем может поражать врагов эффектом _Зловещей магии_ во время внезапных атак.\n\nОдна атака из засады даёт _%1$d%%_ энергии. Во время высвобождения за каждую внезапную атаку тратится _%2$d%%_, а если враг снова застигнут врасплох, дополнительно тратится ещё _%2$d%%_.\n\nЗапас энергии: _%3$d%%_/_%4$d%%_.
items.weapon.missiles.holywater.desc=Хрупкий флакон освящённой воды. При падении он разбивается, окропляя всех поблизости и оставляя благословенную лужу, обжигающую стоящих в ней существ. Нежить и демоны получают двойной урон. Прямое попадание также немного исцеляет метателя.\n\nУлучшения увеличивают радиус брызг и время существования лужи, а на уровне _+6_ благословение становится настолько сильным, что флакон волшебным образом восстанавливается после каждого броска.
items.journalpages.sokoban4.desc=Отдельная страница дневника с надписью «Загадки сокобана».\n\nПопытки остановить преследователей лишь замедлили их.\n\nЯ снова вспомнил странные пространства, где столетия назад спрятал свои ценности.\n\nСами вещи давно ничего для меня не значат, но загадочная сила, порождающая овец, долгие годы не давала мне покоя.\n\nВозможно, если я раскрою её природу, она станет моим спасением. Боюсь, других надежд почти не осталось.\n\n— Отилук, 1617 г. Л. П.
items.journalpages.town.desc=Отдельная страница дневника с надписью «Город».\n\nСобрав остатки сил, я на миг одолел Зота и завладел его сферой могущества.\n\nХотя её сила закрыта для меня, я могу перемещать предметы из этого мира в самое сердце сферы.\n\nВдали я слышу нарастающий гул энергии... Зот приближается!\n\nПоследним моим деянием станет возвращение в Город, где я родился, и заключение этой записи внутрь сферы.\n\nЧтобы последовать за мной, Зоту придётся разбить собственную сферу — источник его силы.\n\n— Отилук, 1999 г. Л. П.
items.builderstool.desc=Прочный молот и зубило для строительства в открытом мире: стен, полов, дверей, крыш, заборов и всего, на что хватает материалов. Действие «Строить» открывает меню строительства. «Снести» разбирает объект и возвращает половину материалов, «Починить» восстанавливает повреждённый объект за четверть материалов, а «Осмотреть» сообщает об объекте и комнате, к которой он относится.\n\nСтроить можно в радиусе %d клеток от себя на свободной земле поверхности, в горах и пещерах — но не в городе и не на сооружениях, созданных самим миром.
items.weapon.melee.largesword$largeswordbuff.desc=Вы поднимаете палаш, готовясь к удару. Широкий клинок значительно снижает получаемый урон, а чем дольше вы накапливаете заряд, тем сильнее будет следующая атака. Благодаря сосредоточенности также повышается точность ударов.\n\nПри достаточном заряде вы сможете поражать и врагов рядом с основной целью.\n\nХодов зарядки: _%1$s_.\nТекущий множитель урона: _+%2$s%%_/_+%3$s%%_.\nТекущий бонус точности: _+%4$s%%_/_+%5$s%%_.\nПолучаемый урон: _−%6$s%%_.
items.arrowbag.desc=Волшебный колчан, позволяющий пропитывать дальние атаки эффектами зелий, семян и святой воды, пока он надет. Действует с луками, огнестрельным и метательным оружием, а также палочками. Пропитанные попадания наносят на 10% больше урона и ещё на 2% за каждый уровень колчана.\n\nВ нём помещается до четырёх разных эффектов. Каждое попадание расходует один эффект — случайный или выбранный по порядку ячеек. Повторное добавление ингредиента пополняет заряды соответствующей ячейки. Через «Управление эффектами» можно прочитать описание или удалить эффект. Каждый уровень улучшения даёт 10% шанс сохранить заряд, вплоть до 100% на уровне +10.\n\nОбычные зелья дают 15 зарядов, экзотические — 5 независимо от уровня колчана. Семена и святая вода дают 15 зарядов плюс 3 за каждый уровень. Зелья силы и мастерства мгновенно улучшают колчан. Точные эффекты указаны в описании ингредиентов.\n\nПропитка палочки срабатывает один раз на каждую враждебную цель за применение; действия без попадания по врагу заряды не расходуют. Сила эффекта зависит от среднего урона палочки, а у не наносящих урон палочек — от их уровня.
