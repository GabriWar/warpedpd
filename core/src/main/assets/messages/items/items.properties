items.weapon.melee.megacannon.name=arm cannon
items.weapon.melee.megacannon.ac_shoot=SHOOT
items.weapon.melee.megacannon.desc=A dwarven arm cannon. It bolts itself onto the wielder's arm and cannot be removed. It charges each turn while equipped, dumping all stored charge into one unmissable blast.
items.weapon.melee.megacannon.stats=This cannon's blasts deal _%1$d-%2$d damage_ per charge and require _%3$d strength_ to use properly.
items.weapon.melee.megacannon.charge_info=Charge: %1$d/%2$d.
items.weapon.melee.megacannon.prompt=Choose a target
items.weapon.enchantments.surging.name=surging %s
items.weapon.enchantments.surging.desc=This enchantment feeds on momentum: each strike builds an electric charge which adds bonus damage to subsequent strikes for a short time.
items.weapon.enchantments.surging.elestrike_desc=Elemental strikes will build extra surge charge.
items.weapon.enchantments.parasitic.name=parasitic %s
items.weapon.enchantments.parasitic.desc=This enchantment plants a parasitic seed in enemies, which saps their health over several turns and feeds it to their adjacent foes.
items.weapon.enchantments.parasitic.elestrike_desc=Elemental strikes plant parasitic seeds in all targets hit.
items.weapon.enchantments.parasitic$parasiticseed.name=Parasitic Seed
items.weapon.enchantments.parasitic$parasiticseed.desc=A parasitic seed is growing here, sapping health and feeding it to nearby enemies of its host.\n\nDamage per turn: %d.\n\nTurns remaining: %s.
items.armor.glyphs.adaptation.name=%s of adaptation
items.armor.glyphs.adaptation.desc=This glyph attunes the wearer to their surroundings. When the wearer is struck, it can draw power from the terrain beneath them: earthen power from grass, swiftness from water, concealment from tall grass, fiery vengeance from embers, or magical energy from disarmed traps.
items.armor.glyphs.crystal.name=%s of crystal
items.armor.glyphs.crystal.desc=This glyph reacts to heavy blows, causing the armor's surface to crystallize and grant a protective barrier proportional to the damage taken.
items.armor.glyphs.siphoning.name=%s of siphoning
items.armor.glyphs.siphoning.desc=This dark glyph drains the life force of attackers, transferring their vitality to the wearer.
items.armor.glyphs.purity.name=%s of purity
items.armor.glyphs.purity.desc=This holy glyph has a chance to wash away all harmful effects afflicting the wearer when they are struck, briefly warding off new ones.

items.portablechest.name=portable chest
items.portablechest.name_golden=golden portable chest
items.portablechest.name_crystal=crystal portable chest
items.portablechest.ac_place=PLACE
items.portablechest.desc=A flat-packed personal storage chest. With a builder's tool in hand it can be assembled anywhere in the safe zone, and packed back up later without spilling a single item.\n\nCapacity: %d items. Currently inside: %d.
items.portablechest.only_safe=The chest can only be assembled in the safe zone.
items.portablechest.need_tool=You need a builder's tool to assemble the chest.
items.portablechest.bad_spot=You need a clear adjacent spot to place the chest.
items.portablechest.prompt=Choose an adjacent spot
items.portablechest.placed=You assemble the chest.


items.fertilizer.name=plant food
items.fertilizer.ac_apply=APPLY
