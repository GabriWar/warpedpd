items.dewvial2.watered=The dungeon regrows around you.
items.dewvial2.refreshed=You splash the dew on your face.
items.dewvial2.blessed=You feel the dew blessing items in your backpack.
items.dewvial2.procced=Your pack glows with a cleansing light, and a malevolent energy disperses.
items.dewvial2.not_procced=Your pack glows with a cleansing light, but nothing was uncursed.
items.dewvial2.looks_better=Your %s certainly looks better now.
items.dewvial2.desc=An enhanced glass vial that can hold magical dew. It requires more dew to activate its powers, but its blessing is potent.

items.puddingcup.name=pudding cup
items.puddingcup.pickup=Oh boy! A pudding cup!
items.puddingcup.desc=A chocolate pudding cup.

items.stoneore.name=stone ore
items.stoneore.desc=A chunk of raw stone ore. It's valuable and can be sold to shopkeepers for a good price.

items.adamantarmor.name=adamantite armor
items.adamantarmor.desc=Despite its state of disrepair, you can tell these armor plates contain a powerful magic.

items.adamantring.name=adamantite ring
items.adamantring.desc=An old ring missing its jewel. It's made of a dull grey ore.

items.adamantwand.name=adamantite wand
items.adamantwand.desc=A rod of dull ore in the shape of a wand.

items.adamantweapon.name=adamantite weapon
items.adamantweapon.desc=A blade from an ancient weapon made of a dull grey ore.

items.inactivemrdestructo.name=inactive mr destructo
items.inactivemrdestructo.desc=Mr Destructo has gone inactive. Maybe there is a way to recharge him.

items.inactivemrdestructo2.name=inactive mr destructo 2.0
items.inactivemrdestructo2.desc=Mr Destructo has gone inactive. Maybe there is a way to recharge him.

items.activemrdestructo.name=mr destructo
items.activemrdestructo.ac_activate=ACTIVATE
items.activemrdestructo.desc=It reads, MR DESTRUCTO. An odd contraption. Throw it to deploy a stationary turret that fires beams at hostile mobs!

items.activemrdestructo2.name=mr destructo 2.0
items.activemrdestructo2.ac_activate=ACTIVATE
items.activemrdestructo2.desc=It reads, MR DESTRUCTO 2.0. An upgraded contraption. Throw it to deploy a more powerful turret!

items.orbofzot.name=orb of zot
items.orbofzot.ac_activate=ACTIVATE
items.orbofzot.ac_break=BREAK OPEN
items.orbofzot.break=You break the orb open! A journal page falls out.
items.orbofzot.desc=The Orb of Zot is a source of unlimited power created by the wizard Zot. Throw it to deploy it as a devastating turret that fires beams at enemies.

items.dwarfhammer.name=dwarf demon hammer
items.dwarfhammer.ac_break=BREAK SEAL
items.dwarfhammer.preventing=This is not the place to use the hammer.
items.dwarfhammer.unseal=You unseal the entrance to the next level.
items.dwarfhammer.desc=Too fragile to use as a weapon, this magic hammer was used to seal the demons in this level. Perhaps there is just enough magic left to unseal the next level.

items.greaterstylus.name=greater arcane stylus
items.greaterstylus.prompt=Select an armor to inscribe on
items.greaterstylus.inscribed=You inscribed a glyph onto the armor!
items.greaterstylus.desc=This arcane stylus is made of some dark, very hard stone. Using it you can inscribe a magical glyph on your armor, but you have no power over choosing what glyph it will be, the stylus will decide it for you.

items.towel.name=towel
items.towel.ac_apply=APPLY
items.towel.ac_apply_pet=APPLY TO PET
items.towel.apply=You apply the towel.
items.towel.end=Your towel disintegrates.
items.towel.desc=Don't forget your towel! This magical towel can stop bleeding and remove caustic ooze. It has limited uses before it disintegrates.

items.smartbomb.name=smart bomb
items.smartbomb.desc=This advanced explosive is designed to only harm enemies, leaving its user unscathed. Its blast deals increased damage compared to a regular bomb.

items.clusterbomb.name=cluster bomb
items.clusterbomb.desc=This bomb splits into multiple smaller explosions upon detonation, covering a wider area with blasts at random positions around the impact point.

items.dizzybomb.name=dizzy bomb
items.dizzybomb.desc=This bomb releases a disorienting shockwave on detonation. In addition to dealing some damage, it causes vertigo in any enemies caught in the blast.

items.holyhandgrenade.name=holy hand grenade
items.holyhandgrenade.desc=A blessed explosive that deals massive damage to undead creatures and sends them fleeing in terror. Has no effect on the living.

items.dumplingbomb.name=dumpling bomb
items.dumplingbomb.desc=This aromatic bomb releases a cloud of soothing fragrance that makes nearby enemies drowsy and teleports them far away.
items.dumplingbomb.no_teleport=One of the enemies could not be teleported.

items.bombs.fishingbomb.name=fishing bomb
items.bombs.fishingbomb.desc=A weighty bundle of dumplings smashed together, used for catching fish. When agitated and thrown, it teleports nearby albino piranhas to dry land.
items.bombs.fishingbomb.teleported=The albino piranha was teleported to dry land!
items.bombs.fishingbomb.no_teleport=You missed a fish!

items.rice.name=grain of magic rice
items.rice.ac_cook=COOK
items.rice.ac_cookbomb=BOMB
items.rice.cooked=You now have %s.
items.rice.crumbles=Your magic rice crumbles to dust!
items.rice.cracking=Your magic rice is cracking...
items.rice.dull=Your magic rice begins to look dull...
items.rice.oni=The denizens awake and they are hungry! Here come the Oni!
items.rice.desc=This magic grain of rice can create many satisfying dumplings. Use it to cook rice balls for throwing, or combine more rice into a dumpling bomb. Be careful — the rice has limited uses before it crumbles away.

items.equipableitem.curse_detected=You sense that the item is cursed just before you equip it!
items.equipableitem.unequip_cursed=You can't remove a cursed item!
items.equipableitem.ac_equip=EQUIP
items.equipableitem.ac_unequip=UNEQUIP

items.energycrystal.name=energy crystal
items.energycrystal.desc=A collection of small magical crystals, filled with alchemical energy.\n\nThese crystals are the most common ingredient in alchemy recipes and can be produced at an alchemy pot by scrapping consumable items.

items.gold.name=gold
items.gold.desc=A pile of gold coins. Collect gold coins to spend them later in a shop.

items.builderstool.name=builder's tool
items.builderstool.desc=A sturdy hammer and chisel enchanted for use within the safe room. Use it to reshape walls, lay floors, dig water channels, or install doors.
items.builderstool.ac_build=BUILD
items.builderstool.not_safe=This tool only works in the safe room.
