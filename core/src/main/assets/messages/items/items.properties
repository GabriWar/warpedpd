items.potions.exotic.potionofalcohol.name=potion of alcohol
items.potions.exotic.potionofalcohol.desc=This fermented brew is far more potent than regular wine. Drinking it will leave you thoroughly inebriated, slowing your reactions but dulling any pain.
items.potions.exotic.potionofalcohol.drunk=You feel very drunk!

items.potions.exotic.potionofallseeing.name=potion of all-seeing
items.potions.exotic.potionofallseeing.desc=The mystical vapors within this vial grant the drinker extraordinary perception, fully revealing the current floor's layout and uncovering all hidden traps and doors.
items.potions.exotic.potionofallseeing.layout=The floor's layout is revealed to you!

items.potions.exotic.potionofarmor.name=potion of armor
items.potions.exotic.potionofarmor.desc=This hardening compound coats your skin in a crystalline lattice when consumed, granting significant protection against physical attacks.

items.potions.exotic.potionofash.name=potion of ash
items.potions.exotic.potionofash.desc=The incendiary contents of this vial will ignite all enemies on the floor in scorching flame when uncorked.
items.potions.exotic.potionofash.mobs_effected=%d enemies are set ablaze!
items.potions.exotic.potionofash.no_targets=No enemies to ignite.

items.potions.exotic.potionofathmosphericcompression.name=potion of atmospheric compression
items.potions.exotic.potionofathmosphericcompression.desc=This high-pressure liquid violently expands when uncorked, vaporizing all water on the floor and crushing any enemies caught in pools with the force of the compression.
items.potions.exotic.potionofathmosphericcompression.mobs_effected=%d enemies are crushed by the compression!
items.potions.exotic.potionofathmosphericcompression.no_targets=The air pressure shifts dramatically, but there are no targets.

items.potions.exotic.potionofautumn.name=potion of autumn
items.potions.exotic.potionofautumn.desc=Pouring out this earthy brew will transform the grass and undergrowth around you into rich agricultural soil, ready for planting.
items.potions.exotic.potionofautumn.grown=%d patches of high grass ripen into fertile soil.
items.potions.exotic.potionofautumn.no_tiles=There is no high grass nearby to transform.

items.potions.exotic.potionofballlightning.name=potion of ball lightning
items.potions.exotic.potionofballlightning.desc=This crackling vial contains a sphere of pure electrical energy. When uncorked it erupts into arcing lightning that chains between all enemies on the floor.
items.potions.exotic.potionofballlightning.mobs_effected=%d enemies are struck by ball lightning!
items.potions.exotic.potionofballlightning.no_targets=The lightning crackles but finds no targets.

items.potions.exotic.potionofbeacon.name=potion of beacon
items.potions.exotic.potionofbeacon.desc=The radiant light within this vial blinds all enemies on the floor when released. Undead creatures are especially vulnerable to its holy brilliance.
items.potions.exotic.potionofbeacon.mobs_effected=%d enemies are blinded by the light!
items.potions.exotic.potionofbeacon.no_targets=The light shines brightly, but there are no enemies to blind.

items.potions.exotic.potionofbee.name=potion of bee
items.potions.exotic.potionofbee.desc=Throwing this potion will shatter near an enemy, releasing an angry swarm of bees from a sticky honeypot that will relentlessly pursue the nearest foe.
items.potions.exotic.potionofbee.summoned_bee=A swarm of bees emerges from the honeypot!
items.potions.exotic.potionofbee.no_enemy=There are no nearby enemies for the bees to target.

items.potions.exotic.potionofbleeding.name=potion of bleeding
items.potions.exotic.potionofbleeding.desc=Hurling this corrosive potion will cause all visible enemies to begin hemorrhaging, losing health steadily over time.
items.potions.exotic.potionofbleeding.mobs_effected=%d enemies start bleeding!
items.potions.exotic.potionofbleeding.no_targets=No visible enemies to afflict.

items.potions.exotic.potionofbrain.name=potion of brain
items.potions.exotic.potionofbrain.desc=Imbibing this concoction of distilled knowledge floods your mind with arcane secrets, causing a random scroll to materialize in your hands.
items.potions.exotic.potionofbrain.effect=Knowledge floods your mind!

items.potions.exotic.potionofbutterbread.name=potion of butterbread
items.potions.exotic.potionofbutterbread.desc=This richly satisfying brew is more nourishing than the standard dew potion, completely filling your stomach and then some.
items.potions.exotic.potionofbutterbread.yummy=Mmm, delicious! You feel completely full!

items.potions.exotic.potionofcontrol.name=potion of control
items.potions.exotic.potionofcontrol.desc=Uncorking this dark liquid releases a miasma of mind-bending vapors that corrupt the will of all enemies on the floor, turning them to your cause.
items.potions.exotic.potionofcontrol.mobs_effected=%d enemies fall under your control!
items.potions.exotic.potionofcontrol.no_targets=No enemies to corrupt.

items.potions.exotic.potionofdeath.name=potion of death
items.potions.exotic.potionofdeath.desc=The essence of oblivion is contained within this black vial. Uncorking it unleashes a wave of necrotic energy that instantly destroys all visible non-boss enemies.
items.potions.exotic.potionofdeath.mobs_effected=%d enemies are slain by the wave of death!
items.potions.exotic.potionofdeath.no_targets=The death wave washes over the floor, but there are no enemies.

items.potions.exotic.potionofflower.name=potion of flower
items.potions.exotic.potionofflower.desc=This verdant brew releases seeds of magical plants when thrown, triggering random plant effects on all visible enemies.
items.potions.exotic.potionofflower.mobs_effected=%d enemies are ensnared by magical flora!
items.potions.exotic.potionofflower.no_targets=No visible enemies for the plants to affect.

items.potions.exotic.potionofgloop.name=potion of gloop
items.potions.exotic.potionofgloop.desc=This viscous black ooze coats all enemies on the floor in a caustic slime, burning through their armor and skin.
items.potions.exotic.potionofgloop.mobs_effected=%d enemies are coated in caustic ooze!
items.potions.exotic.potionofgloop.no_targets=No enemies to coat.

items.potions.exotic.potionofhail.name=potion of hail
items.potions.exotic.potionofhail.desc=This arctic concoction erupts into a barrage of ice shards when thrown, pelting all visible enemies with multiple blasts of freezing cold.
items.potions.exotic.potionofhail.mobs_effected=%d enemies are pelted by hail!
items.potions.exotic.potionofhail.no_targets=The hail falls, but there are no targets.

items.potions.exotic.potionofhellstorm.name=potion of hellstorm
items.potions.exotic.potionofhellstorm.desc=Smashing this vial creates a spreading inferno of supernatural hellfire that burns far hotter and longer than ordinary flame.

items.potions.exotic.potionofhighgrass.name=potion of high grass
items.potions.exotic.potionofhighgrass.desc=Pouring this growth potion transforms ordinary grass and soil into tall, wild high grass, providing cover and concealment.
items.potions.exotic.potionofhighgrass.grown=%d grass tiles shoot up into dense high grass.
items.potions.exotic.potionofhighgrass.no_tiles=There is no grass nearby to grow.

items.potions.exotic.potionofholy.name=potion of holy
items.potions.exotic.potionofholy.desc=The blessed water within this sacred vial will purge all curses from items in your possession and nearby floor heaps when quaffed.
items.potions.exotic.potionofholy.uncursed=%d items are purified!
items.potions.exotic.potionofholy.no_objects=There are no cursed items to purify.

items.potions.exotic.potionofholyfuror.name=potion of holy furor
items.potions.exotic.potionofholyfuror.desc=Drinking this blessed brew fills you with divine favor, granting a long-lasting blessing that improves your luck and effectiveness in combat.

items.potions.exotic.potionofhotness.name=potion of hotness
items.potions.exotic.potionofhotness.desc=This searing liquid raises the body temperature of all visible enemies to dangerous levels, leaving them dehydrated and weakened.
items.potions.exotic.potionofhotness.mobs_effected=%d enemies are overcome by intense heat!
items.potions.exotic.potionofhotness.no_targets=No visible enemies to overheat.

items.potions.exotic.potionofimmortality.name=potion of immortality
items.potions.exotic.potionofimmortality.desc=This life-infused liquid will fill your dew vial with a significant amount of restorative morning dew, topping it up proportionally to your strength.
items.potions.exotic.potionofimmortality.filled=Your dew vial fills with life-giving dew!
items.potions.exotic.potionofimmortality.no_vial=You have no dew vial to fill!

items.potions.exotic.potionofironskin.name=potion of iron skin
items.potions.exotic.potionofironskin.desc=Drinking this mineral-dense brew temporarily hardens your skin to a metallic toughness, reducing every hit you take to a single point of damage.

items.potions.exotic.potionoflaserbeam.name=potion of laserbeam
items.potions.exotic.potionoflaserbeam.desc=Hurling this potion releases a concentrated ray of destructive energy at every visible enemy, burning through anything in its path.
items.potions.exotic.potionoflaserbeam.mobs_effected=%d enemies are incinerated by laser beams!
items.potions.exotic.potionoflaserbeam.no_targets=No visible enemies to target.

items.potions.exotic.potionofmagicfire.name=potion of magic fire
items.potions.exotic.potionofmagicfire.desc=Shattering this vial creates a spreading pool of magical fire that burns with enchanted intensity, affecting even creatures normally resistant to flame.

items.potions.exotic.potionofnuts.name=potion of nuts
items.potions.exotic.potionofnuts.desc=This peculiar brew manifests peanuts in all adjacent tiles when quaffed, littering the area with the nutritious snacks.
items.potions.exotic.potionofnuts.peanuts=%d peanuts appear around you!
items.potions.exotic.potionofnuts.no_peanuts=There is no room for peanuts here.

items.potions.exotic.potionoforb.name=potion of orb
items.potions.exotic.potionoforb.desc=Shattering this magical vessel releases a floating orb of destructive energy that retaliates against all enemies in sight when struck.

items.potions.exotic.potionofplague.name=potion of plague
items.potions.exotic.potionofplague.desc=Uncorking this fetid concoction releases a virulent plague that rapidly poisons all enemies on the floor.
items.potions.exotic.potionofplague.mobs_effected=%d enemies are infected by the plague!
items.potions.exotic.potionofplague.no_targets=No enemies to infect.
items.potions.exotic.potionofplague.effect=A virulent plague spreads through the floor!

items.potions.exotic.potionofpressure.name=potion of pressure
items.potions.exotic.potionofpressure.desc=Uncorking this high-pressure liquid releases a massive shockwave that deals physical damage to all enemies on the floor proportional to your strength.
items.potions.exotic.potionofpressure.mobs_effected=%d enemies are crushed by the pressure wave!
items.potions.exotic.potionofpressure.no_targets=No enemies in range of the pressure wave.

items.potions.exotic.potionofprotain.name=potion of protain
items.potions.exotic.potionofprotain.desc=This protein-rich brew permanently builds your muscles, increasing your strength by one point.
items.potions.exotic.potionofprotain.effect=Your muscles grow stronger!

items.potions.exotic.potionofquantumsoup.name=potion of quantum soup
items.potions.exotic.potionofquantumsoup.desc=When uncorked, the quantum-entangled particles in this potion cause all enemies on the floor to instantly teleport to random locations.
items.potions.exotic.potionofquantumsoup.mobs_effected=%d enemies are scattered across the floor!
items.potions.exotic.potionofquantumsoup.no_targets=No enemies to scatter.

items.potions.exotic.potionofradiation.name=potion of radiation
items.potions.exotic.potionofradiation.desc=Drinking this glowing brew saturates you with arcane radiation, enhancing the power of your next magical attack.
items.potions.exotic.potionofradiation.spell=You feel charged with arcane radiation!

items.potions.exotic.potionofrelativity.name=potion of relativity
items.potions.exotic.potionofrelativity.desc=The time-dilating compound within this vial bends the flow of time around you when consumed, temporarily freezing everything except yourself.
items.potions.exotic.potionofrelativity.time=Time slows to a crawl around you!

items.potions.exotic.potionofreproduction.name=potion of reproduction
items.potions.exotic.potionofreproduction.desc=This strange brew creates mirror copies of yourself in nearby cells, each one capable of fighting on your behalf for a short time.

items.potions.exotic.potionofsleepparalysis.name=potion of sleep paralysis
items.potions.exotic.potionofsleepparalysis.desc=Throwing this cursed vial summons a sleep paralysis demon near the point of impact, a spectral entity that paralyzes any hero who touches it.

items.potions.exotic.potionofslime.name=potion of slime
items.potions.exotic.potionofslime.desc=This sticky green brew coats all enemies on the floor in immobilizing slime, crippling their movement for a significant duration.
items.potions.exotic.potionofslime.mobs_effected=%d enemies are slowed by slime!
items.potions.exotic.potionofslime.no_targets=No enemies to slow.

items.potions.exotic.potionofsoil.name=potion of soil
items.potions.exotic.potionofsoil.desc=Shattering this earthy potion releases a wind of harvest energy that enriches the soil across the floor.

items.potions.exotic.potionofsowing.name=potion of sowing
items.potions.exotic.potionofsowing.desc=Breaking this potion releases a wind that scatters seeds across the floor, planting vegetation in every patch of soil.

items.potions.exotic.potionofspiral.name=potion of spiral
items.potions.exotic.potionofspiral.desc=The dizzying vapors in this vial cause disorienting vertigo in all enemies on the floor when uncorked, causing them to stagger and lose their sense of direction.
items.potions.exotic.potionofspiral.mobs_effected=%d enemies are struck with vertigo!
items.potions.exotic.potionofspiral.no_targets=No enemies to disorient.

items.potions.exotic.potionofstarving.name=potion of starving
items.potions.exotic.potionofstarving.desc=This drain of vitality weakens all enemies on the floor, causing their muscles to waste away and their attacks to falter.
items.potions.exotic.potionofstarving.mobs_effected=%d enemies are weakened by hunger!
items.potions.exotic.potionofstarving.no_targets=No enemies to weaken.

items.potions.exotic.potionofstomach.name=potion of stomach
items.potions.exotic.potionofstomach.desc=This moderately nourishing brew provides a decent meal's worth of sustenance when consumed.
items.potions.exotic.potionofstomach.munch=You feel pleasantly full.

items.potions.exotic.potionofstrung.name=potion of strung
items.potions.exotic.potionofstrung.desc=Hurling this potion fires a vine-like ray at all visible enemies, rooting them in place and dealing damage with lashing tendrils.
items.potions.exotic.potionofstrung.mobs_effected=%d enemies are ensnared by vines!
items.potions.exotic.potionofstrung.no_targets=No visible enemies to ensnare.

items.potions.exotic.potionofsugar.name=potion of sugar
items.potions.exotic.potionofsugar.desc=This hypersweet concoction floods your bloodstream with energy, providing an extended sugar rush that quickens your actions for many turns.

items.potions.exotic.potionofsuperdew.name=potion of superdew
items.potions.exotic.potionofsuperdew.desc=The powerful growth hormones within this brew trample all high grass on the floor when quaffed, clearing the way and releasing the seeds within.
items.potions.exotic.potionofsuperdew.tiles_trampled=%d patches of high grass are trampled!
items.potions.exotic.potionofsuperdew.no_tiles=There is no high grass to trample.

items.potions.exotic.potionofsupernova.name=potion of supernova
items.potions.exotic.potionofsupernova.desc=Uncorking this volatile brew triggers a cascade of explosions centered on every enemy on the floor, devastating anything caught in the blasts.
items.potions.exotic.potionofsupernova.boom=The floor erupts in a chain of explosions!

items.potions.exotic.potionofswelling.name=potion of swelling
items.potions.exotic.potionofswelling.desc=The caustic properties of this brew cause all enemies on the floor to begin hemorrhaging uncontrollably when the vial is opened.
items.potions.exotic.potionofswelling.mobs_effected=%d enemies begin to bleed!
items.potions.exotic.potionofswelling.no_targets=No enemies to afflict.

items.potions.exotic.potionoftears.name=potion of tears
items.potions.exotic.potionoftears.desc=The purifying properties of this brew immediately cleanse you of all burning, corrosion, poison, bleeding, and ooze when consumed.
items.potions.exotic.potionoftears.cleansed=You feel cleansed of all ailments!

items.potions.exotic.potionofterror.name=potion of terror
items.potions.exotic.potionofterror.desc=This unsettling brew, when uncorked, releases an aura of primal fear that sends all enemies on the floor fleeing in blind panic.
items.potions.exotic.potionofterror.mobs_effected=%d enemies are overwhelmed with terror!
items.potions.exotic.potionofterror.no_targets=No enemies to terrify.

items.potions.exotic.potionoftsunami.name=potion of tsunami
items.potions.exotic.potionoftsunami.desc=Throwing this vial summons a massive tidal wave that floods the entire floor, converting terrain to water, dousing fires, and overwhelming all in its path.

items.potions.exotic.potionofworm.name=potion of worm
items.potions.exotic.potionofworm.desc=Hurling this potion fires parasite-carrying beams at all visible enemies, dealing damage and infecting them with a virulent poison.
items.potions.exotic.potionofworm.mobs_effected=%d enemies are infected by parasites!
items.potions.exotic.potionofworm.no_targets=No visible enemies to infect.

items.coffee.name=cup of coffee
items.coffee.ac_drink=DRINK
items.coffee.energized=The bitter brew jolts you wide awake!
items.coffee.desc=A steaming cup of powerful dungeon-brewed coffee. Drinking it washes away a day and a half of tiredness in one bitter gulp.

items.weapon.melee.triangolo.name=triangolo
items.weapon.melee.triangolo.desc=A percussion instrument made of thin steel bars bent into a triangle. Striking it produces a crisp, melodious resonance that lashes out at everything surrounding its target. Its reach extends as it is upgraded.
items.weapon.melee.flute.name=flute
items.weapon.melee.flute.desc=A slender woodwind instrument. Each blow rings out with a piercing note, and the resonance harms everything surrounding its target.
items.weapon.melee.wardrum.name=war drum
items.weapon.melee.wardrum.desc=A heavy drum built for the battlefield. Its booming resonance batters everything surrounding its target, leaving them dizzied and terrified.
items.weapon.melee.trumpet.name=trumpet
items.weapon.melee.trumpet.desc=A brass instrument with a bold, blaring voice. Its resonance blasts everything surrounding its target.
items.weapon.melee.magebook.name=magic book
items.weapon.melee.magebook.desc=A magic book from a distant tower. It is hard to read, but heavy enough to strike foes senseless.
items.weapon.melee.fightgloves.name=fight gloves
items.weapon.melee.fightgloves.desc=A weapon formed from simple leather and metal tips. A solid blow can leave an enemy stunned.
items.weapon.melee.nunchakus.name=nunchakus
items.weapon.melee.nunchakus.desc=Two hardwood sticks joined by a connection rope. Its whirling strikes can stun enemies.
items.weapon.melee.dualknife.name=dual knife
items.weapon.melee.dualknife.desc=Two razor sharp blades wielded as one, letting every attack strike twice.
items.weapon.melee.tricksand.name=weird sand
items.weapon.melee.tricksand.desc=A handful of trick sand that lashes out at surprising range. It blinds whatever it strikes, punishes foes who cannot see it coming, and tears through magical shielding.
items.weapon.melee.mirrordoll.name=doll's mirror
items.weapon.melee.mirrordoll.desc=A doll clutching a polished mirror on a long handle. Its flashing reflection blinds enemies, strikes harder at those already dazzled, and shatters magical shielding.
items.weapon.melee.windbottle.name=wind gourd
items.weapon.melee.windbottle.desc=A gourd stoppered around a captive gale. Each swing releases a gust that knocks enemies back and blinds them with whipped-up dust, and it blows straight through magical shielding.
items.weapon.melee.handlight.name=punch lamp
items.weapon.melee.handlight.desc=A magic lamp shaped like a clenched fist. Its dazzling flare briefly blinds whatever it hits, crushes those left reeling, and burns through magical shielding.
items.weapon.melee.harp.name=harp
items.weapon.melee.harp.desc=A stringed instrument whose strings are plucked with the fingers. Each strike makes it resonate violently, lashing everything else around its target with waves of sound.
items.weapon.melee.harp.stats_desc=Its resonance damages all other creatures adjacent to its target.
items.weapon.missiles.holywater.name=holy water
items.weapon.missiles.holywater.desc=A fragile vial of blessed water. It shatters wherever it lands, splashing everything nearby and soaking the ground in a blessed pool that scalds whatever stands in it - undead and demons doubly so. Striking a creature directly also mends the thrower a little.\n\nUpgrades widen the splash and make the pool linger longer - and at _+6_ the blessing grows strong enough that the vial magically reconstitutes itself after every throw.
items.weapon.missiles.holywater.stats_desc=This vial shatters on impact, splashing and blessing the area.
items.weapon.melee.prayerwheel.name=prayer wheel
items.weapon.melee.prayerwheel.desc=A simple prayer wheel. Each strike spins the wheel and accumulates spiritual power, eventually unleashing it all in a single devastating blow.
items.weapon.melee.prayerwheel.stats_desc=Every 18th strike deals 5x damage.
items.weapon.melee.prayerwheel.charge=Current charge: %1$d/%2$d.
items.weapon.melee.stonecross.name=stone cross
items.weapon.melee.stonecross.desc=A huge cross hewn from stone. It slowly accumulates sacred power with every strike, eventually unleashing it all in a single devastating blow.
items.weapon.melee.stonecross.stats_desc=Every 21st strike deals 5x damage.
items.weapon.melee.stonecross.charge=Current charge: %1$d/%2$d.

items.weapon.missiles.brick.name=brick
items.weapon.missiles.brick.desc=A common brick made of clay. A solid hit can briefly stun a target, and every so often one shatters on impact, spilling its maker's hidden coin stash.
items.weapon.missiles.hugeshuriken.name=huge shuriken
items.weapon.missiles.hugeshuriken.desc=Huge star-shaped pieces of metal with razor-sharp blades, these do significant damage when they hit a target.
items.weapon.missiles.smallchakram.name=small chakram
items.weapon.missiles.smallchakram.desc=In the hands of a skilled user, this small razor-edged disc seems to leap back into the hand from which it was thrown.
items.weapon.missiles.bottlefire.name=fire in a bottle
items.weapon.missiles.bottlefire.desc=A crude molotov. Enemies it strikes are set aflame, and if it shatters on the ground it ignites everything around it.
items.weapon.missiles.bottlefire.stats_desc=This bottle shatters on impact, burning its target or the surrounding area.
items.weapon.missiles.empbola.name=EMP bola
items.weapon.missiles.empbola.desc=Bolas fitted with a crackling electromagnetic charge. They cripple and briefly paralyze whatever they ensnare, and wreak havoc on inorganic constructs.
items.weapon.missiles.empbola.stats_desc=This weapon cripples and briefly stuns its target, and is devastating against constructs.
items.weapon.missiles.honeyarrow.name=bee arrow
items.weapon.missiles.honeyarrow.desc=An arrow tipped with a fragile capsule of honey and one very angry bee, released wherever the arrow lands.
items.weapon.missiles.honeyarrow.stats_desc=This arrow releases an angry bee where it lands.
items.weapon.missiles.mindarrow.name=mind arrow
items.weapon.missiles.mindarrow.desc=A shimmering arrow that wounds the mind as much as the body, dealing extra psychic damage and filling its target with dread.
items.weapon.missiles.mindarrow.stats_desc=This arrow deals bonus psychic damage and fills its target with dread.
items.weapon.missiles.throwingwave.name=wave blade
items.weapon.missiles.throwingwave.desc=A curling blade of solidified water. Those struck by it are washed into a confused frenzy, lashing out at friend and foe alike.
items.weapon.missiles.throwingwave.stats_desc=This weapon drives its target into a charmed frenzy and crushes a quarter of its remaining health.
items.weapon.missiles.throwingskull.name=throwing skull
items.weapon.missiles.throwingskull.desc=An evil weapon carved from cursed bone. Souls it strikes are marked, their life and essence laid bare.
items.weapon.missiles.throwingskull.stats_desc=This weapon marks the soul of its target.
items.armor.lifearmor.name=leaf armor
items.armor.lifearmor.desc=An armor from another world, and it is alive. It absorbs the pain of blows it fails to stop, and if its wearer avoids harm for a time, the stored life flows back into them.
items.armor.soldierarmor.name=soldier vest
items.armor.soldierarmor.desc=A rugged combat vest. Taking a hit can snap its wearer into combat focus, blessing them for a short time.
items.armor.performerarmor.name=performer jacket
items.armor.performerarmor.desc=A flashy jacket made for the stage. Enemies that strike it may be charmed by the performance.
items.armor.asceticarmor.name=ascetic wraps
items.armor.asceticarmor.desc=Simple wraps worn by ascetics. Pain is a teacher: being struck may briefly hasten the wearer.
items.armor.followerarmor.name=follower overcoat
items.armor.followerarmor.desc=An overcoat worn by the faithful. Blows against it are sometimes answered with a small measure of healing.
items.armor.ceramicsarmor.name=ceramic armor
items.armor.ceramicsarmor.desc=Armor made of clay and fire. Its fired plates block exceptionally well, but their brittleness limits how much upgrades can improve it.
items.armor.machinearmor.name=machine armor
items.armor.machinearmor.desc=It is a machine, not a simple armor. It blocks tremendous amounts of damage, but its bulk makes dodging much harder.
items.armor.bulletarmor.name=bullet armor
items.armor.bulletarmor.desc=A heavy flak jacket. It offers extra protection over regular plate, at the cost of some mobility.
items.weapon.missiles.boomerang.name=boomerang
items.weapon.missiles.boomerang.desc=Thrown to the enemy this flat curved wooden missile will return to the hands of its thrower.
items.weapon.missiles.boomerang.stats_desc=This unique weapon always flies back to its thrower, and occasionally shakes a dewdrop loose from whatever it strikes.
items.weapon.melee.elfbow.name=elf bow
items.weapon.melee.elfbow.ac_shoot=SHOOT
items.weapon.melee.elfbow.ac_drink=DRINK
items.weapon.melee.elfbow.desc=The short bow used by elves, its shots grow stronger with the wielder's magic power. There is also some mana water stored in the grip. Don't drink too much.
items.weapon.melee.elfbow.stats=This bow's shots deal _%1$d-%2$d damage_ and require _%3$d strength_ to use properly. Damage improves with the strongest wand being carried.
items.weapon.melee.elfbow.charge_info=Mana water drunk: %1$d/%2$d.
items.weapon.melee.elfbow.need_equip=You need to equip the bow first.
items.weapon.melee.elfbow.transform=The elf bow twists into something darker!
items.weapon.melee.elfbow.prompt=Choose a target
items.weapon.melee.taurcenbow.name=kuranta bow
items.weapon.melee.taurcenbow.ac_shoot=SHOOT
items.weapon.melee.taurcenbow.ac_break=BREAK ARROW
items.weapon.melee.taurcenbow.ac_fire=FIRE ARROW
items.weapon.melee.taurcenbow.ac_ice=ICE ARROW
items.weapon.melee.taurcenbow.ac_poison=POISON ARROW
items.weapon.melee.taurcenbow.ac_ele=EMP ARROW
items.weapon.melee.taurcenbow.desc=A centaur bow used by the kuranta. After enough regular shots it automatically fires a special arrow. The arrow type can be changed at any time.
items.weapon.melee.taurcenbow.stats=This bow's shots deal _%1$d-%2$d damage_ and require _%3$d strength_ to use properly.
items.weapon.melee.taurcenbow.charge_info=Charge: %1$d/%2$d.
items.weapon.melee.taurcenbow.prompt=Choose a target
items.weapon.melee.minigun.name=minigun
items.weapon.melee.minigun.ac_shoot=SHOOT
items.weapon.melee.minigun.ac_reload=RELOAD
items.weapon.melee.minigun.desc=A rotary gun that sprays bullets, striking extra shots against enemies clustered around its target. Striking with it directly knocks enemies back.
items.weapon.melee.minigun.stats=This gun's shots deal _%1$d-%2$d damage_ and require _%3$d strength_ to use properly.
items.weapon.melee.minigun.charge_info=Ammo: %1$d/%2$d.
