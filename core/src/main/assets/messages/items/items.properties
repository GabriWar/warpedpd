items.potions.exotic.potionofadrenalinesurge.name=potion of adrenaline surge
items.potions.exotic.potionofadrenalinesurge.desc=Drinking this fiery liquid floods your body with raw energy, enabling you to act with incredible speed for a brief but powerful burst.
