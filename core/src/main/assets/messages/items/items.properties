###journal pages
items.journalpages.journalpage.name=journal page
items.journalpages.journalpage.found=You found a page to Otiluke's Journal!
items.journalpages.journalpage.desc=A loose journal page.

items.journalpages.safespotpage.name=safe spot page
items.journalpages.safespotpage.found=You found a page to Otiluke's Journal!
items.journalpages.safespotpage.desc=A loose journal page labeled safe spot.

items.journalpages.sokoban1.name=sokoban practice page
items.journalpages.sokoban1.found=You found a page to Otiluke's Journal!
items.journalpages.sokoban1.desc=A loose journal page labeled Sokoban Practice.\n\nI have devised a method for creating extra-planar spaces in which to hide my belongings.\n\nOddly, strange breeds of sheep have materialized in these spaces. Maybe I can use these ovine denizens to my advantage.\n\n-Otiluke, 1345 LP.

items.journalpages.sokoban2.name=sokoban castle page
items.journalpages.sokoban2.found=You found a page to Otiluke's Journal!
items.journalpages.sokoban2.desc=A loose journal page labeled Sokoban Castle.\n\nHaving mastered the elements required for creating my spaces, I am now set out to build a grand fortress in which to hide my valuables.\n\n-Otiluke, 1348 LP.

items.journalpages.sokoban3.name=sokoban portals page
items.journalpages.sokoban3.found=You found a page to Otiluke's Journal!
items.journalpages.sokoban3.desc=A loose journal page labeled Sokoban Portals.\n\nMy powers have grown stronger since I created my first space.\n\nI find myself able to alter time and position in ways I have never thought possible.\n\nMy activities have created ripples in the magical ethosphere. On clear days I am able to capture echoes of some disturbance focused on my presence.\n\n-Otiluke, 1355 LP.

items.journalpages.sokoban4.name=sokoban puzzles page
items.journalpages.sokoban4.found=You found a page to Otiluke's Journal!
items.journalpages.sokoban4.desc=A loose journal page labeled Sokoban Puzzles.\n\nMy efforts to stop my pursuers have only slowed their progress.\n\nI am now remembering the strange spaces where I hid some of my valuables centuries ago.\n\nThe items themselves are no longer of importance to me, but the source of the odd power generating the sheep eluded me for years.\n\nPerhaps this power, once illuminated, will be a source of succor. I fear I have little options left.\n\n-Otiluke, 1617 LP.

items.journalpages.town.name=Town page
items.journalpages.town.found=You found a page to Otiluke's Journal! It reads, Town.
items.journalpages.town.desc=A loose journal page labeled Town.\n\nWith what little power I have left I have momentarily bested Zot and obtained his orb of power.\n\nAlthough its power is warded against me, I can transpose objects from this world into the heart of the orb.\n\nI hear a rushing of power in the distance... Zot approaches!\n\nMy last act will be to return to Town, my birthplace and seal this script into the orb.\n\nZot will need to break the orb and source of his power to follow me.\n\n-Otiluke, 1999 LP.

items.journalpages.vault.name=vault page
items.journalpages.vault.found=You found a page to Otiluke's Journal!
items.journalpages.vault.desc=A loose journal page labeled Vault.\n\nThis ring of wealth really is overkill.\n\nI need a place to drop my gold.\n\n-Otiluke, 656 LP.

items.journalpages.dragoncave.name=dragon cave page
items.journalpages.dragoncave.found=You found a page to Otiluke's Journal!
items.journalpages.dragoncave.desc=A loose journal page labeled Dragon Cave.

