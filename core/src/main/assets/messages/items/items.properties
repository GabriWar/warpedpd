items.arrowbag.name=archer's quiver
items.arrowbag.desc=A specialized quiver carried on the Archer's back.\n\nIts unique mechanism allows potions to be infused into arrows, granting them additional effects based on the potion type and rarity. The number of affected arrows varies depending on the potion used, however.\n\nWhen the quiver is infused with Potion of Strength or Mastery, it will be upgraded, increasing amount of arrows per potion and giving a damage boost to infused arrows.
items.arrowbag.potion_desc=The quiver currently has a _%1$s_ infused, which will trigger additional effects on the next %2$d arrows.
items.arrowbag.ac_inject=INFUSE
items.arrowbag.select_title=Select a potion to infuse
items.arrowbag.desc_healing=Arrows infused with potion of healing will _heal hero for 40% of damage done_.
items.arrowbag.desc_mindvision=Arrows infused with potion of mind vision will give hero the mind vision on hit enemy.
items.arrowbag.desc_frost=Arrows infused with potion of frost have _20% chance to freeze the hit enemy_.
items.arrowbag.desc_liquidflame=Arrows infused with potion of liquid flame will _light hit enemy on fire_.
items.arrowbag.desc_toxicgas=Arrows infused with potion of toxic gas will inflict _3 (+20% damage) turns of Poison_ to hit enemy.
items.arrowbag.desc_haste=Arrows infused with potion of haste will give _3 turns of Haste_ to hero.
items.arrowbag.desc_invisibility=Arrows infused with potion of invisibility will inflict _2 turns of Blindness_ to hit enemy.
items.arrowbag.desc_levitation=Arrows infused with potion of levitation will inflict _3 turns of Vertigo_ to hit enemy.
items.arrowbag.desc_paralyticgas=Arrows infused with potion of paralytic gas will inflict _2 turns of Paralysis_ to hit enemy.
items.arrowbag.desc_purity=Arrows infused with potion of purity will _remove negative effects_ from hero and give them _2 turns of negative effect immunity_.
items.arrowbag.desc_experience=Arrows infused with potion of experience will deal _a lot of bonus damage against undead and demons_.
items.arrowbag.desc_shielding=Arrows infused with potion of shielding will give _5 (+10% max health) shielding_ to hero.
items.arrowbag.desc_magicalsight=Arrows infused with potion of magical sight will make hero _discover everything in 13x13 area around them_.
items.arrowbag.desc_snapfreeze=Arrows infused with potion of snap freeze will _freeze hit enemy for 5 turns_.
items.arrowbag.desc_dragonsbreath=Arrows infused with potion of dragon's breath will _light hit enemy on fire_ and deal _extra fire damage_.
items.arrowbag.desc_corrosivegas=Arrows infused with potion of corrosive gas will inflict _3 turns of Corrosion with initial damage of 2 (+10% damage)_ to enemy.
items.arrowbag.desc_stamina=Arrows infused with potion of stamina will _remove all exhaustion_ from hero.
items.arrowbag.desc_shroudingfog=Arrows infused with potion of shrouding fog will inflict _2 turns of Invisibility_ to hit character.
items.arrowbag.desc_stormclouds=Arrows infused with potion of storm clouds will release a _burst of pressurized water_.
items.arrowbag.desc_earthenarmor=Arrows infused with potion of earthen armor will grant hero _barkskin armor equal to 50% of damage_, that fades every turn.
items.arrowbag.desc_cleansing=Arrows infused with potion of cleansing will inflict _4 turns of Immune to Magic_ to hero.
items.arrowbag.desc_divineinspiration=Arrows infused with potion of divine inspiration will give hero the experience points of hit enemy.
items.arrowbag.desc_aqua=Arrows infused with aqua brew will _spew storm clouds_ about half as large as potion of storm clouds.
items.arrowbag.desc_blizzard=Arrows infused with blizzard brew will _spew blizzard_ about half as large as corresponding brew.
items.arrowbag.desc_caustic=Arrows infused caustic brew will _inflict Caustic Ooze in 5x5 area_.
items.arrowbag.desc_infernal=Arrows infused with inferno brew will _spew inferno_ about half as large as corresponding brew.
items.arrowbag.desc_shocking=Arrows infused with shocking brew will do _20%-60% more damage_ as electric damage.
items.arrowbag.desc_unstable=Arrows infused with unstable brew will trigger a _random potion infuse effect_.
