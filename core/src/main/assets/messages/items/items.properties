items.weapon.melee.shootgun.ac_shoot=SHOOT
items.weapon.melee.shootgun.ac_endshoot=ENDLESS SHOOT
items.weapon.melee.shootgun.ac_reload=RELOAD
items.weapon.melee.shootgun.desc=A shotgun modified with strange technology. Its shots leave targets vulnerable, and the entire magazine can be dumped at once for a devastating unavoidable blast.
items.weapon.melee.shootgun.stats=This gun's shots deal _%1$d-%2$d damage_ and require _%3$d strength_ to use properly.
items.weapon.melee.shootgun.charge_info=Ammo: %1$d/%2$d.
items.weapon.melee.shootgun.reloading=reloading...
items.weapon.melee.shootgun.full=The magazine is already full.
