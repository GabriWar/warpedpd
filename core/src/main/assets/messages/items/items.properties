items.armor.leatherarmor.name=leather armor
items.armor.leatherarmor.desc=Armor made from tanned monster hide. Not as light as cloth armor but provides better protection.

items.armor.magearmor.name=hero's robe
items.armor.magearmor.desc=While wearing this gorgeous robe, the Mage can perform a special ability.

items.armor.mailarmor.name=mail armor
items.armor.mailarmor.desc=Interlocking metal links make for a tough but flexible suit of armor.

items.armor.platearmor.name=plate armor
items.armor.platearmor.desc=Enormous plates of metal are joined together into a suit that provides unmatched protection to any adventurer strong enough to bear its staggering weight.

items.armor.roguearmor.name=hero's garb
items.armor.roguearmor.desc=While wearing this dark garb, the Rogue can perform a special ability.

items.armor.scalearmor.name=scale armor
items.armor.scalearmor.desc=The metal scales sewn onto a leather vest create a flexible, yet protective armor.

items.armor.warriorarmor.name=hero's platemail
items.armor.warriorarmor.desc=While wearing this heavy plated armor, the Warrior can perform a special ability.



###artifacts
items.artifacts.alchemiststoolkit.name=alchemist's toolkit
items.artifacts.alchemiststoolkit.ac_brew=BREW
items.artifacts.alchemiststoolkit.ac_energize=ENERGIZE
items.artifacts.alchemiststoolkit.not_ready=Your toolkit has not finished warming up.
items.artifacts.alchemiststoolkit.cursed=Your cursed toolkit prevents you from using alchemy!
items.artifacts.alchemiststoolkit.need_energy=You need at least 6 energy for that.
items.artifacts.alchemiststoolkit.energize_desc=Every 6 energy crystals will give the toolkit enough energy to gain a level, which increases the rate that the toolkit generates energy over time, and how quickly it warms up.\n\nHow much energy would you like to use?
items.artifacts.alchemiststoolkit.energize_1=6 energy: +1 level
items.artifacts.alchemiststoolkit.energize_all=%1$d energy: +%2$d levels
items.artifacts.alchemiststoolkit.desc=This toolkit contains a number of reagents and herbs along with a small mixing vial, allowing for alchemy on-the-go. The vial contains what looks like alchemical energy crystals in liquid form.
items.artifacts.alchemiststoolkit.desc_cursed=The cursed toolkit has bound itself to your side, and refuses to let you use alchemy.
items.artifacts.alchemiststoolkit.desc_warming=The toolkit is currently warming up, and will be ready to use after a little while.
items.artifacts.alchemiststoolkit.desc_hint=The equipped toolkit is slowly generating alchemical energy as you gain experience. It looks like the mixture in the vial could be enhanced by adding energy crystals to it.

items.artifacts.artifact.cannot_wear_two=You cannot wear two of the same artifact.
items.artifacts.artifact.equip_cursed=The artifact painfully binds itself to you.
items.artifacts.artifact.curse_known=You can feel a malevolent magic lurking within the artifact.
items.artifacts.artifact.not_cursed=This artifact is free of malevolent magic.
items.artifacts.artifact.need_to_equip=You need to equip your artifact to do that.

items.artifacts.capeofthorns.name=cape of thorns
items.artifacts.capeofthorns.desc=These collapsed sheets of metal from the DM-300 have formed together into a rigid cape. It seems to store a deep energy, perhaps it has some of the DM-300's power?
items.artifacts.capeofthorns.desc_inactive=The cape feels reassuringly heavy on your shoulders, it seems to be gaining energy from the damage you take.
items.artifacts.capeofthorns.desc_active=The cape seems to be releasing stored energy, it is radiating a protective power.
items.artifacts.capeofthorns$thorns.inert=Your Cape becomes inert again.
items.artifacts.capeofthorns$thorns.radiating=Your Cape begins radiating energy, you feel protected!
items.artifacts.capeofthorns$thorns.levelup=Your Cape grows stronger!
items.artifacts.capeofthorns$thorns.name=thorns
items.artifacts.capeofthorns$thorns.desc=Your cape is radiating energy, surrounding you in a field of deflective force!\n\nAll damage you receive is reduced while the thorns effect is active. Additionally, if the attacker is next to you, the reduced amount is deflected back at the attacker.\n\nTurns of thorns remaining: %s.

items.artifacts.chaliceofblood.name=chalice of blood
items.artifacts.chaliceofblood.ac_prick=PRICK
items.artifacts.chaliceofblood.yes=Yes, I know what I'm doing
items.artifacts.chaliceofblood.no=No, I changed my mind
items.artifacts.chaliceofblood.prick_warn=Each time you use the chalice it will drain more of your life energy, but will further enhance your natural health regeneration in exchange.\n\nCurrently pricking yourself will deal _%1$d-%2$d damage_, although this damage can be reduced by _both physical and magical blocking or damage reduction._ Without considering damage reduction effects, pricking yourself currently has a _%3$s%% chance_ to drain your life force completely.\n\nAre you sure you want to offer the chalice more life energy?
items.artifacts.chaliceofblood.onprick=You prick yourself, and your life essence drains into the chalice.
items.artifacts.chaliceofblood.ondeath=The Chalice sucks your life essence dry...
items.artifacts.chaliceofblood.desc=This shining silver chalice is oddly adorned with sharp gems at the rim.
items.artifacts.chaliceofblood.desc_cursed=The cursed chalice has bound itself to your hand, and is inhibiting your ability to regenerate health.
items.artifacts.chaliceofblood.desc_1=As you hold the chalice, you feel oddly compelled to prick yourself on the sharp gems.
items.artifacts.chaliceofblood.desc_2=Some of your blood is pooled into the chalice, you can subtly feel the chalice feeding life energy into you, increasing your natural health regeneration. You still want to cut yourself on the chalice, even though you know it will hurt.
items.artifacts.chaliceofblood.desc_3=The chalice is filled to the brim with your life essence. You can feel the chalice pouring life energy back into you.

items.artifacts.cloakofshadows.name=cloak of shadows
items.artifacts.cloakofshadows.ac_stealth=STEALTH
items.artifacts.cloakofshadows.cooldown=Your cloak needs %d more rounds to re-energize.
items.artifacts.cloakofshadows.cursed=You cannot use a cursed cloak.
items.artifacts.cloakofshadows.no_charge=Your cloak hasn't recharged enough to be usable yet.
items.artifacts.cloakofshadows.desc=A priceless magical cloak, stolen from the royal armory many years ago by the Rogue. When worn, it can be used to turn completely invisible for a short time.\n\nThe more the cloak is used, the stronger it will become, allowing the Rogue to become invisible more frequently and for longer durations.
items.artifacts.cloakofshadows.discover_hint=One of the heroes starts with this item.
items.artifacts.cloakofshadows$cloakstealth.no_charge=Your cloak has run out of energy.
items.artifacts.cloakofshadows$cloakstealth.levelup=Your cloak grows stronger!
items.artifacts.cloakofshadows$cloakstealth.name=cloaked
items.artifacts.cloakofshadows$cloakstealth.desc=Your cloak of shadows is granting you invisibility while you are shrouded by it. You will remain cloaked until it is cancelled or your cloak runs out of charge.\n\nWhile you are invisible enemies are unable to attack or follow you. Physical attacks and magical effects (such as scrolls and wands) will immediately cancel invisibility.\n\nTurns until charge use: %d.

items.artifacts.driedrose.name=dried rose
items.artifacts.driedrose.ac_summon=SUMMON
items.artifacts.driedrose.ac_direct=DIRECT
items.artifacts.driedrose.ac_outfit=OUTFIT
items.artifacts.driedrose.spawned=You have already summoned the ghost.
items.artifacts.driedrose.no_charge=Your rose isn't fully charged yet.
items.artifacts.driedrose.cursed=You cannot use a cursed rose.
items.artifacts.driedrose.no_space=There is no free space near you.
items.artifacts.driedrose.charged=Your rose is fully charged!
items.artifacts.driedrose.desc=Is this the rose that the ghost mentioned before disappearing? It seems to hold some spiritual power, perhaps it can be used to channel the energy of that lost warrior.
items.artifacts.driedrose.desc_no_quest=A dried aged rose that is somehow still holding together despite its age.\n\nIt seems to have some spiritual power, but you have no idea how to use it right now.
items.artifacts.driedrose.desc_hint=It seems to be missing some petals. Perhaps reattaching them will strengthen the rose.
items.artifacts.driedrose.desc_cursed=The cursed rose is bound to your hand, it feels eerily cold.
items.artifacts.driedrose.desc_weapon=Ghost's weapon: %s
items.artifacts.driedrose.desc_armor=Ghost's armor: %s
items.artifacts.driedrose.desc_strength=Ghost's strength: %s
items.artifacts.driedrose$petal.name=dried petal
items.artifacts.driedrose$petal.no_rose=You have no rose to add this petal to.
items.artifacts.driedrose$petal.no_room=There is no room left for this petal, so you discard it.
items.artifacts.driedrose$petal.maxlevel=The rose is completed!
items.artifacts.driedrose$petal.levelup=You add the petal to the rose.
items.artifacts.driedrose$petal.desc=A frail dried up petal, which has somehow survived this far into the dungeon.
items.artifacts.driedrose$wndghosthero.title=Ghost's Equipment
items.artifacts.driedrose$wndghosthero.desc=The ghost is weak on their own, but their form is solid enough to be equipped with a weapon and armor. They will be able to use these items just like you do.\n\nThe ghost can currently equip items requiring up to _%d strength._
items.artifacts.driedrose$wndghosthero.weapon_prompt=Select a weapon
items.artifacts.driedrose$wndghosthero.armor_prompt=Select an armor
items.artifacts.driedrose$wndghosthero.cant_unique=The ghost can't use unique items.
items.artifacts.driedrose$wndghosthero.cant_cursed=The ghost can only use equipment that you're sure isn't cursed.
items.artifacts.driedrose$wndghosthero.cant_strength_unknown=The ghost may not be strong enough to use that.
items.artifacts.driedrose$wndghosthero.cant_strength=The ghost is not strong enough to use that.

##ghost hero
items.artifacts.driedrose$ghosthero.name=sad ghost
items.artifacts.driedrose$ghosthero.def_verb=dodged
items.artifacts.driedrose$ghosthero.discover_hint=You can find this character with a specific artifact.

items.artifacts.driedrose$ghosthero.hello=Hello again %s.
items.artifacts.driedrose$ghosthero.introduce=My spirit is bound to this rose, it was very precious to me, a gift from my love whom I left on the surface.\n\nI cannot return to him, but thanks to you I have a second chance to complete my journey. When I am able I will respond to your call and fight with you.\n\nAs long as you have the rose I can hear your voice, so you can use it to direct me from afar.\n\nHopefully you may succeed where I failed...

items.artifacts.driedrose$ghosthero.dialogue_sewers_1=These sewers used to be safe, people even lived here in the winter.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=I wonder what happened to the guard patrols, did they give up?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=I had family on the surface, I hope they're safe.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=The guards couldn't defeat these monsters, but maybe we can.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=If even the sewers are this dangerous, I wonder what's below...
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=What could have caused these rats and crabs to grow so large?
items.artifacts.driedrose$ghosthero.dialogue_prison_1=I've heard stories about this place, nothing good.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=This place was always more of a dungeon than a prison.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=I can't imagine what went on when this place was abandoned.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=It seems both the prisoners and guards have been turned into monsters.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=What could be responsible for all these skeletons?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=These people didn't have to end up like this...
items.artifacts.driedrose$ghosthero.dialogue_caves_1=No human or dwarf has been here for a very long time.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=What would cause the dwarves to abandon a gold mine?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=It's a shame all the gold here is useless on the surface.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=The creatures here are twisted, just like in the sewers.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Even the bats are bloodthirsty here.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=No sign of any mining equipment, did the dwarves reclaim it all?
items.artifacts.driedrose$ghosthero.dialogue_city_1=The dwarves were industrious, but greedy.
items.artifacts.driedrose$ghosthero.dialogue_city_2=So the dwarven metropolis really has fallen.
items.artifacts.driedrose$ghosthero.dialogue_city_3=I hope the surface never ends up like this place.
items.artifacts.driedrose$ghosthero.dialogue_city_4=Dwarves aren't supposed to look so pale.
items.artifacts.driedrose$ghosthero.dialogue_city_5=I don't know what's worse, the dwarves, or their creations.
items.artifacts.driedrose$ghosthero.dialogue_city_6=It seems the dwarves are mindless monsters now as well.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=What is this place?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=This place is terrifying...
items.artifacts.driedrose$ghosthero.dialogue_halls_3=What were the dwarves thinking, toying with power like this?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=The monsters here are otherworldly, where did they come from?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Can you feel it? It's like something is watching us.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=Thank goodness there are torches, it's so dark here!
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=Why is this happening, I thought we succeeded?
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=How is that thing still able to influence this world?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=I hope you know what you're doing with that amulet.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=I suppose we're not done just yet.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=We've come so far already, we can finish this!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=Just a little further, we can make it out of here!

items.artifacts.driedrose$ghosthero.seen_goo_1=Beware Goo!
items.artifacts.driedrose$ghosthero.seen_goo_2=Many of my friends died to this thing, time for vengeance!
items.artifacts.driedrose$ghosthero.seen_goo_3=Such an abomination cannot be allowed to live!
items.artifacts.driedrose$ghosthero.seen_tengu_1=The one prisoner left is a deadly assassin. Of course...
items.artifacts.driedrose$ghosthero.seen_tengu_2=He's trapped us!
items.artifacts.driedrose$ghosthero.seen_tengu_3=I've heard horror stories about that mask...
items.artifacts.driedrose$ghosthero.seen_dm300_1=Only dwarves would build a mining machine that kills intruders.
items.artifacts.driedrose$ghosthero.seen_dm300_2=That thing is huge...
items.artifacts.driedrose$ghosthero.seen_dm300_3=How has this thing stayed active for so long?
items.artifacts.driedrose$ghosthero.seen_king_1=When people say power corrupts, this is what they mean.
items.artifacts.driedrose$ghosthero.seen_king_2=He's more of a lich than a king now.
items.artifacts.driedrose$ghosthero.seen_king_3=Even in death the dwarves obey their master.
items.artifacts.driedrose$ghosthero.seen_yog_1=Oh, this doesn't look good.
items.artifacts.driedrose$ghosthero.seen_yog_2=So that's what a god looks like?
items.artifacts.driedrose$ghosthero.seen_yog_3=This is going to hurt...

items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Good luck...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Tired... for now...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=I will return...
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=I'm sorry... good luck...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Finish it off... without me...
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=No... I can't...
items.artifacts.driedrose$ghosthero.blessed_ankh_1=How did you survive that?
items.artifacts.driedrose$ghosthero.blessed_ankh_2=I wish I had one of those...
items.artifacts.driedrose$ghosthero.blessed_ankh_3=Oh my! You're still alive!
items.artifacts.driedrose$ghosthero.player_killed_1=No!...
items.artifacts.driedrose$ghosthero.player_killed_2=I couldn't help them...
items.artifacts.driedrose$ghosthero.player_killed_3=Not like this...

items.artifacts.driedrose$ghosthero.direct_prompt=What should I do?
items.artifacts.driedrose$ghosthero.directed_follow_1=Okay, I'll follow you.
items.artifacts.driedrose$ghosthero.directed_follow_2=I'll fall in behind you.
items.artifacts.driedrose$ghosthero.directed_follow_3=Following you...
items.artifacts.driedrose$ghosthero.directed_follow_4=Okay, let's go!
items.artifacts.driedrose$ghosthero.directed_follow_5=I've got your back.
items.artifacts.driedrose$ghosthero.directed_attack_1=Okay, I'll attack that one.
items.artifacts.driedrose$ghosthero.directed_attack_2=I'll get that one.
items.artifacts.driedrose$ghosthero.directed_attack_3=Engaging...
items.artifacts.driedrose$ghosthero.directed_attack_4=Let's get them!
items.artifacts.driedrose$ghosthero.directed_attack_5=I've got that one.
items.artifacts.driedrose$ghosthero.directed_position_1=Okay, I'll hold that position.
items.artifacts.driedrose$ghosthero.directed_position_2=I'll go there and defend.
items.artifacts.driedrose$ghosthero.directed_position_3=Repositioning...
items.artifacts.driedrose$ghosthero.directed_position_4=On my way!
items.artifacts.driedrose$ghosthero.directed_position_5=I'll head over there.

items.artifacts.driedrose$ghosthero.desc=A frail looking ethereal figure with a humanoid shape. Their power seems tied to the rose you have.\n\nThis ghost may not be much, they seem to be your only true friend down here.

##back to artifacts
items.artifacts.etherealchains.name=ethereal chains
items.artifacts.etherealchains.ac_cast=CAST
items.artifacts.etherealchains.rooted=Your chains cannot pull you while you are rooted.
items.artifacts.etherealchains.no_charge=Your chains do not have enough charge.
items.artifacts.etherealchains.cursed=You can't use cursed chains.
items.artifacts.etherealchains.does_nothing=That won't do anything.
items.artifacts.etherealchains.cant_pull=Your chains cannot pull that target.
items.artifacts.etherealchains.cant_reach=Your chains can't reach there.
items.artifacts.etherealchains.inside_wall=Your chains can only pull you through walls, not into them.
items.artifacts.etherealchains.nothing_to_grab=There is nothing to grab there.
items.artifacts.etherealchains.prompt=Choose a location to target.
items.artifacts.etherealchains.desc=These large yet lightweight chains glow with spiritual energy. They can be used to pull you towards terrain, or pull enemies toward you. The ethereal nature of the chains even allows them to extend through walls!
items.artifacts.etherealchains.desc_cursed=The cursed chains are locked to your side, constantly swinging around, trying to trip or bind you.
items.artifacts.etherealchains.desc_equipped=The chains rest around your side, slowly siphoning the spiritual energy of those you defeat. Each charge is a link in the chain, which will extend out exactly one tile.
items.artifacts.etherealchains$chainsrecharge.levelup=Your chains grow stronger!

items.artifacts.holytome.name=holy tome
items.artifacts.holytome.ac_cast=CAST
items.artifacts.holytome.no_spell=You're not able to cast that spell right now.
items.artifacts.holytome.cursed=You cannot use a cursed tome.
items.artifacts.holytome.levelup=Your tome grows stronger!
items.artifacts.holytome.desc=A holy tome that acts as a focus for the Cleric's divine magic. Using the tome lets the Cleric cast a variety of magical spells.\n\nThe tome will steadily get more powerful as the Cleric uses it, giving the Cleric more maximum charges and slightly increasing the recharging speed.
items.artifacts.holytome.discover_hint=One of the heroes starts with this item.

items.artifacts.hornofplenty.name=horn of plenty
items.artifacts.hornofplenty.ac_snack=SNACK
items.artifacts.hornofplenty.ac_eat=EAT
items.artifacts.hornofplenty.ac_store=STORE
items.artifacts.hornofplenty.eat=You eat from the horn.
items.artifacts.hornofplenty.prompt=Select some food
items.artifacts.hornofplenty.no_food=Your horn has no food in it to eat!
items.artifacts.hornofplenty.full=Your horn is full of food!
items.artifacts.hornofplenty.reject=Your horn rejects the uncooked blandfruit.
items.artifacts.hornofplenty.maxlevel=Your horn has consumed all the food it can!
items.artifacts.hornofplenty.levelup=The horn consumes your food offering and grows in strength!
items.artifacts.hornofplenty.feed=The horn consumes your food offering.
items.artifacts.hornofplenty.desc=This horn can't be blown into, but instead seems to fill up with food as you adventure and gain experience. You can consume each charge individually as a snack, or eat until you're full.
items.artifacts.hornofplenty.desc_hint=Perhaps there is a way to increase the horn's power by giving it food energy.
items.artifacts.hornofplenty.desc_cursed=The cursed horn has bound itself to your side, it seems to be eager to take food rather than produce it.

items.artifacts.lloydsbeacon.name=lloyd's beacon
items.artifacts.lloydsbeacon.ac_zap=ZAP
items.artifacts.lloydsbeacon.ac_set=SET
items.artifacts.lloydsbeacon.ac_return=RETURN
items.artifacts.lloydsbeacon.no_charge=Your beacon does not have enough energy right now.
items.artifacts.lloydsbeacon.tele_fail=The teleportation magic fails.
items.artifacts.lloydsbeacon.prompt=Choose a location to zap.
items.artifacts.lloydsbeacon.levelup=Your beacon grows stronger!
items.artifacts.lloydsbeacon.preventing=Strong magic aura of this place prevents you from using the lloyd's beacon!
items.artifacts.lloydsbeacon.creatures=Psychic aura of neighbouring creatures doesn't allow you to use the lloyd's beacon at this moment.
items.artifacts.lloydsbeacon.return=The lloyd's beacon is successfully set at your current location, now you can return here anytime.
items.artifacts.lloydsbeacon.desc=Lloyd's beacon is an intricate magical device which grants the user control of teleportation magics. The beacon can be used to return to a set location, but can also expel bursts of random teleportation magic once it has charged from being equipped. This magic can be directed at a target or at the user themselves.
items.artifacts.lloydsbeacon.desc_set=This beacon was set somewhere on the level %d of Pixel Dungeon.

items.artifacts.masterthievesarmband.name=master thieves' armband
items.artifacts.masterthievesarmband.ac_steal=STEAL
items.artifacts.masterthievesarmband.no_charge=Your armband does not have enough charge.
items.artifacts.masterthievesarmband.cursed=You can't use a cursed armband.
items.artifacts.masterthievesarmband.full=Your armband is fully charged!
items.artifacts.masterthievesarmband.prompt=Choose an enemy to target
items.artifacts.masterthievesarmband.no_target=You must target an enemy that is adjacent to you.
items.artifacts.masterthievesarmband.steal_shopkeeper=You can't steal from shopkeepers directly.
items.artifacts.masterthievesarmband.no_steal=That enemy has nothing to steal.
items.artifacts.masterthievesarmband.stole_item=You stole an item: %s.
items.artifacts.masterthievesarmband.failed_steal=You didn't manage to steal anything.
items.artifacts.masterthievesarmband.level_up=Your armband grows stronger!
items.artifacts.masterthievesarmband.desc=This purple velvet armband bears the mark of a master thief. This doesn't belong to you, but it probably didn't belong to its last user either.
items.artifacts.masterthievesarmband.desc_cursed=The cursed armband is bound to your wrist, and somehow your pouch of gold seems to be slowly getting lighter...
items.artifacts.masterthievesarmband.desc_worn=You feel power building in the armband on your wrist as you gain experience. You can use this power to steal from shops, or to rob enemies!\n\nRobbing enemies happens instantly, briefly disorients them, and gives you a chance to get whatever loot they have! This power is more effective against unaware enemies. Robbing the same enemy multiple times does not give more chances at loot.

items.artifacts.sandalsofnature.name=sandals of nature
items.artifacts.sandalsofnature.name_1=shoes of nature
items.artifacts.sandalsofnature.name_2=boots of nature
items.artifacts.sandalsofnature.name_3=greaves of nature
items.artifacts.sandalsofnature.ac_feed=FEED
items.artifacts.sandalsofnature.ac_root=ROOT
items.artifacts.sandalsofnature.prompt=Select a seed
items.artifacts.sandalsofnature.levelup=Your footwear surges in size!
items.artifacts.sandalsofnature.absorb_seed=The footwear absorbs the seed, they seem healthier.
items.artifacts.sandalsofnature.no_effect=You must feed a seed to your footwear first.
items.artifacts.sandalsofnature.low_charge=Your footwear don't have enough energy for that.
items.artifacts.sandalsofnature.prompt_target=Select a location
items.artifacts.sandalsofnature.out_of_range=That location is out of range.
items.artifacts.sandalsofnature.desc_1=What initially seem like sandals made of twine are actually two plants! They seem very weak and pale, perhaps they need to be given nutrients?
items.artifacts.sandalsofnature.desc_2=The footwear has grown and now more closely resemble two tailored shoes. Some colour has returned to them, perhaps they can still grow further?
items.artifacts.sandalsofnature.desc_3=The plants have grown again and now resembles a pair of solid boots made from bark. The plants seem to have regained their strength, but perhaps they can still grow further?
items.artifacts.sandalsofnature.desc_4=The plants seem to have reached their maximum size, they resemble a pair of armored greaves. The greaves are a deep brown and resemble a very sturdy tree.
items.artifacts.sandalsofnature.desc_hint=You feel more attuned with nature while wearing this artifact.
items.artifacts.sandalsofnature.desc_cursed=The cursed sandals are blocking any attunement with nature.
items.artifacts.sandalsofnature.desc_ability=The footwear ripples with the color of the last seed you fed them. They can briefly root into the ground and produce that plant's effect anywhere in a 3 tile radius.\nSeed: _%s_\nCharge needed: _%d%%_
items.artifacts.sandalsofnature.desc_seeds=You have fed the footwear %d seeds.

items.artifacts.skeletonkey.name=skeleton key
items.artifacts.skeletonkey.ac_insert=INSERT
items.artifacts.skeletonkey.cursed=You can't use a cursed skeleton key.
items.artifacts.skeletonkey.prompt=Choose a target
items.artifacts.skeletonkey.invalid_target=There's nothing to lock or unlock there.
items.artifacts.skeletonkey.lock_no_space=You can't lock a character inside of a door!
items.artifacts.skeletonkey.iron_charges=Opening a regular lock requires 1 charge.
items.artifacts.skeletonkey.gold_charges=Opening a gold lock requires 2 charges.
items.artifacts.skeletonkey.lock_charges=Locking a door requires 2 charges.
items.artifacts.skeletonkey.wall_charges=Creating a temporary wall requires 2 charges.
items.artifacts.skeletonkey.crystal_charges=Opening a crystal lock requires 5 charges.
items.artifacts.skeletonkey.wont_open=The key refuses to fit into this lock for some reason.
items.artifacts.skeletonkey.locked_with_key=That door was locked by your skeleton key.
items.artifacts.skeletonkey.force_lock=The lock has weakened without your skeleton key. You manage to force it open.
items.artifacts.skeletonkey.discard=You discard your excess keys.
items.artifacts.skeletonkey.levelup=Your skeleton key grows stronger!
items.artifacts.skeletonkey.desc=An important-looking key with a head shaped like a skull. Its teeth seem to be different every time you look at them.
items.artifacts.skeletonkey.desc_worn=This magical key seems to gain power as you use it instead of the dungeon's regular keys. It can be inserted into almost any of the dungeon's locks to either open or close them, including doors that were never locked previously.\n\nThe key can even be used on empty space in a cardinal or diagonal direction to 'lock' the air in front of you, creating a 3 tile wide solid wall that lasts for 10 turns. Locking will push away enemies if there is space to do so.
items.artifacts.skeletonkey.desc_cursed=The cursed key seems to be actively avoiding fitting into any lock, and is even making it difficult (but not impossible) for you to use your other keys.
items.artifacts.skeletonkey$keywall.desc=A temporary magical wall has been placed here by the skeleton key.

items.artifacts.talismanofforesight.name=talisman of foresight
items.artifacts.talismanofforesight.ac_scry=SCRY
items.artifacts.talismanofforesight.low_charge=The talisman requires at least 5% charge to scry.
items.artifacts.talismanofforesight.prompt=Choose a location to scan.
items.artifacts.talismanofforesight.levelup=Your Talisman grows stronger!
items.artifacts.talismanofforesight.full_charge=Your Talisman is fully charged!
items.artifacts.talismanofforesight.desc=A smooth stone with strange engravings on it. You feel like it's watching everything around you, keeping an eye out for anything hidden.
items.artifacts.talismanofforesight.desc_worn=When you hold the talisman you feel like your senses are heightened. The talisman is slowly building charge as time passes and when you discover hidden doors or traps.\n\nThe talisman can expend its charge to 'scry' in a cone shape, which reveals all tiles and secrets in the scanned area, and will grant you vision of enemies and items for a short time.
items.artifacts.talismanofforesight.desc_cursed=The cursed talisman is intently staring into you, dulling your senses.
items.artifacts.talismanofforesight$foresight.name=foresight
items.artifacts.talismanofforesight$foresight.uneasy=You feel uneasy.
items.artifacts.talismanofforesight$foresight.desc=You feel very nervous, as if there is nearby unseen danger.

items.artifacts.timekeepershourglass.name=timekeeper's hourglass
items.artifacts.timekeepershourglass.ac_activate=ACTIVATE
items.artifacts.timekeepershourglass.deactivate=You deactivate the time freeze.
items.artifacts.timekeepershourglass.no_charge=Your hourglass hasn't recharged enough to be usable yet.
items.artifacts.timekeepershourglass.cursed=You cannot use a cursed hourglass.
items.artifacts.timekeepershourglass.onstasis=The world seems to shift around you in an instant.
items.artifacts.timekeepershourglass.onfreeze=Everything around you suddenly freezes.
items.artifacts.timekeepershourglass.stasis=Put myself in stasis
items.artifacts.timekeepershourglass.freeze=Freeze time around me
items.artifacts.timekeepershourglass.prompt=How would you like to use the hourglass's magic?\n\nWhile in stasis, time will move normally while you are frozen and completely invulnerable, consumes up to 2 charges at a time.\n\nWhen time is frozen, you can move as if your actions take no time. This can be deactivated at any time by using the hourglass or attacking.
items.artifacts.timekeepershourglass.desc=This large ornate hourglass looks fairly unassuming, but you feel a great power in its finely carved frame. As you rotate the hourglass and watch the sand pour you can feel its magic tugging at you, surely using this magic would give you some control over time.
items.artifacts.timekeepershourglass.desc_hint=The hourglass seems to have lost some sand, if only you could find some...
items.artifacts.timekeepershourglass.desc_cursed=The cursed hourglass is locked to your side, you can feel it trying to manipulate your flow of time.
items.artifacts.timekeepershourglass$timefreeze.name=Time Freeze
items.artifacts.timekeepershourglass$timefreeze.desc=Time is frozen around you, allowing you to perform actions instantly. The effect will last until it is cancelled or your hourglass runs out of charge. Attacking or using magic will break this effect as well.\n\nTurns until charge use: %s.
items.artifacts.timekeepershourglass$sandbag.name=bag of magic sand
items.artifacts.timekeepershourglass$sandbag.levelup=You add the sand to your hourglass.
items.artifacts.timekeepershourglass$sandbag.maxlevel=Your hourglass is filled with magical sand!
items.artifacts.timekeepershourglass$sandbag.no_hourglass=You have no hourglass to place this sand into.
items.artifacts.timekeepershourglass$sandbag.desc=This small bag of fine sand should work perfectly with your hourglass.\n\nIt seems odd that the shopkeeper would have this specific item right when you need it...

items.artifacts.unstablespellbook.name=unstable spellbook
items.artifacts.unstablespellbook.ac_read=READ
items.artifacts.unstablespellbook.ac_add=ADD
items.artifacts.unstablespellbook.blinded=You cannot read from the book while blinded.
items.artifacts.unstablespellbook.no_charge=Your spellbook is out of energy for now.
items.artifacts.unstablespellbook.cursed=You cannot read from a cursed spellbook.
items.artifacts.unstablespellbook.prompt=Select a scroll
items.artifacts.unstablespellbook.infuse_scroll=You infuse the scroll's energy into the book.
items.artifacts.unstablespellbook.unable_scroll=You are unable to add this scroll to the book.
items.artifacts.unstablespellbook.unknown_scroll=You're not sure what type of scroll this is yet.
items.artifacts.unstablespellbook.desc=This Tome is in surprising good condition given its age. It fizzes and crackles as you move the pages, surging with unstable energy. If you read from this book, there's no telling what spell you might cast.
items.artifacts.unstablespellbook.desc_cursed=The cursed book has bound itself to you, it is inhibiting your ability to use most scrolls.
items.artifacts.unstablespellbook.desc_index=The book is incomplete. Its index is currently pointing to the following blank pages:
items.artifacts.unstablespellbook.desc_empowered=The scrolls that you've added to the book are glowing with power. You will be able to choose the exotic version of these scroll's effects, but at the cost of an additional charge.
items.artifacts.unstablespellbook.read_empowered=The scroll you added to the spellbook surges with energy. You are able to channel either the regular, or exotic version of this scroll's effect.\n\nChoosing the exotic variant will cost 2 charges instead of 1.

items.artifacts.ringofdisintegration.name=ring of disintegration
items.artifacts.ringofdisintegration.ac_blast=BLAST
items.artifacts.ringofdisintegration.ac_add=ADD
items.artifacts.ringofdisintegration.not_equipped=You need to equip your ring to do that.
items.artifacts.ringofdisintegration.not_charged=Your ring isn't fully charged yet.
items.artifacts.ringofdisintegration.blast=Blast!
items.artifacts.ringofdisintegration.prompt=Select an identified scroll to consume
items.artifacts.ringofdisintegration.consumed=Your ring consumes the power from the scroll! It is at %d points!
items.artifacts.ringofdisintegration.looks_better=Your ring certainly looks better!
items.artifacts.ringofdisintegration.desc=The ring of disintegration vibrates with destructive power. When fully charged, it fires devastating beams in multiple directions.\n\nConsume identified scrolls to empower it further.
items.artifacts.ringofdisintegration.desc_restrained=Its power is restrained for now.
items.artifacts.ringofdisintegration.desc_ready=It is glowing with power at the brink of being unleashed!

items.artifacts.ringoffrost.name=ring of frost
items.artifacts.ringoffrost.ac_blast=BLAST
items.artifacts.ringoffrost.ac_add=ADD
items.artifacts.ringoffrost.not_equipped=You need to equip your ring to do that.
items.artifacts.ringoffrost.not_charged=Your ring isn't fully charged yet.
items.artifacts.ringoffrost.blast=Blast!
items.artifacts.ringoffrost.prompt=Select an identified scroll to consume
items.artifacts.ringoffrost.consumed=Your ring consumes the power from the scroll! It is at %d points!
items.artifacts.ringoffrost.looks_better=Your ring certainly looks better!
items.artifacts.ringoffrost.desc=The ring of frost chills the air with icy power. When fully charged, it freezes all nearby enemies.\n\nConsume identified scrolls to empower it further.
items.artifacts.ringoffrost.desc_restrained=Its power is restrained for now.
items.artifacts.ringoffrost.desc_ready=Its power is at the brink of being unleashed!



###misc equipment
items.misc.autopotion.name=auto potion charm
items.misc.autopotion.desc=Wearing this charm will automatically use a potion of healing when your health drops below 25%.
items.misc.autopotion.auto_heal=Your charm automatically uses a healing potion!

items.misc.spectacles.name=spectacles
items.misc.spectacles.desc=These mysterious spectacles grant the wearer enhanced magical sight.



###bags
items.bags.bag.name=backpack
items.bags.bag.discover_hint=You can buy this item in a shop.

items.bags.potionbandolier.name=potion bandolier
items.bags.potionbandolier.desc=This thick bandolier fits around your chest like a sash, it has many insulated straps on it to hold potion vials, your waterskin, or liquid metal vials.\n\nWhile inside the bandolier, your potions should be protected from the cold.

items.bags.scrollholder.name=scroll holder
items.bags.scrollholder.desc=This tubular container looks like it would hold an astronomer's tools and charts, but your scrolls will fit just as well. There's even a few side compartments which would nicely fit spell crystals, arcane styli, and arcane resin.\n\nThe holder doesn't look very flammable, so your scrolls should be safe from fire inside it.

items.bags.velvetpouch.name=velvet pouch
items.bags.velvetpouch.desc=This small velvet pouch can store many small items in it, such as seeds, runestones, and some alchemy ingredients.
items.bags.velvetpouch.discover_hint=One of the heroes starts with this item.

items.bags.magicalholster.name=magical holster
items.bags.magicalholster.desc=This slim holster is made from some exotic animal hide, and possesses powerful magic which lets it store a massive amount of ranged weapons.\n\nYou can simply reach into the bag and will always grab the item you were looking for.\n\nDue to the holster's magic, wands will charge slightly faster and thrown weapons will last slightly longer inside of it.

items.bags.keyring.name=key ring
items.bags.keyring.desc=This sturdy metal ring can hold all manner of keys. It keeps them organized and easy to find when you need them.

items.bags.ankhchain.name=ankh chain
items.bags.ankhchain.desc=This blessed chain can hold ankhs and rings. The links shimmer with a faint holy light.

items.bags.foodpouch.name=food pouch
items.bags.foodpouch.desc=This spacious leather pouch is perfect for storing food items. It keeps your provisions fresh and organized.



###bombs
items.bombs.arcanebomb.name=arcane bomb
items.bombs.arcanebomb.desc=This bomb has been imbued with arcane properties. It will explode into a powerful blast similar to Goo's pumped up attack, dealing _%1$d-%2$d magical damage_ to anything within 2 tiles.
items.bombs.arcanebomb.discover_hint=You can craft this item via alchemy.

items.bombs.bomb.name=bomb
items.bombs.bomb.ac_lightthrow=LIGHT & THROW
items.bombs.bomb.snuff_fuse=You quickly snuff the bomb's fuse.
items.bombs.bomb.ondeath=The explosion kills you...
items.bombs.bomb.rankings_desc=Killed by an explosion
items.bombs.bomb.desc=A fairly hefty black powder bomb. An explosion from this bomb deals _%1$d-%2$d damage_ to anything adjacent to it, and will destroy some adjacent terrain or items.
items.bombs.bomb.desc_fuse=It looks like the fuse will take a couple rounds to burn down once it is lit.
items.bombs.bomb.desc_burning=The bomb's fuse is burning away, keep your distance or put it out!
items.bombs.bomb$doublebomb.name=two bombs
items.bombs.bomb$doublebomb.desc=A stack of two hefty black powder bombs, looks like you get one free!

items.bombs.firebomb.name=firebomb
items.bombs.firebomb.desc=This bomb has been modified to explode in a larger area, dealing _%1$d-%2$d damage_ and spreading sustained flame within 2 tiles.
items.bombs.firebomb.discover_hint=You can craft this item via alchemy.

items.bombs.flashbangbomb.name=flashbang
items.bombs.flashbangbomb.desc=This customized bomb will erupt into a blast of light, sound, and electricity when it explodes. Anything within 2 tiles will take _%1$d-%2$d damage_ from the explosion, an additional 25%% damage from the electricity, and be stunned for 10 turns.
items.bombs.flashbangbomb.discover_hint=You can craft this item via alchemy.

items.bombs.frostbomb.name=frost bomb
items.bombs.frostbomb.desc=This bomb has been modified to explode in a larger area, dealing _%1$d-%2$d damage_ and spreading a sustained gust of freezing air within 2 tiles.
items.bombs.frostbomb.discover_hint=You can craft this item via alchemy.

items.bombs.holybomb.name=holy bomb
items.bombs.holybomb.desc=This bomb has been modified to flash holy light in a larger area when it explodes. Anything within 2 tiles will take _%1$d-%2$d damage_ from the explosion, and undead or demonic enemies will take an additional 50%% damage from the holy light.
items.bombs.holybomb.discover_hint=You can craft this item via alchemy.

items.bombs.noisemaker.name=noisemaker
items.bombs.noisemaker.desc=This customized bomb will repeatedly make noise when its fuse runs out. When something touches the bomb, it will explode and deal _%1$d-%2$d damage_ to anything within 2 tiles!
items.bombs.noisemaker.desc_burning=The noisemaker is ticking away, it'll explode when something gets near!
items.bombs.noisemaker.discover_hint=You can craft this item via alchemy.

items.bombs.smokebomb.name=smoke bomb
items.bombs.smokebomb.desc=This bomb has been modified to spew a thick cloud of gas at the same time as exploding. It will deal _%1$d-%2$d damage_ and spread shrouding fog within 2 tiles.
items.bombs.smokebomb.discover_hint=You can craft this item via alchemy.

items.bombs.regrowthbomb.name=regrowth bomb
items.bombs.regrowthbomb.desc=This customized bomb will splash life-giving liquid everywhere within 3 tiles instead of exploding. The area caught in the blast will rapidly sprout grass and plants. Yourself and any allies caught in the blast will be healed as if they had drank a potion of healing.
items.bombs.regrowthbomb.discover_hint=You can craft this item via alchemy.

items.bombs.shrapnelbomb.name=shrapnel bomb
items.bombs.shrapnelbomb.desc=This bomb has been modified with scraps of DM-300's metal, which will fragment and fly everywhere when it explodes, dealing _%1$d-%2$d damage_ in a huge range around the bomb. You had better hide behind something when using it...
items.bombs.shrapnelbomb.discover_hint=You can craft this item via alchemy.

items.bombs.woollybomb.name=woolly bomb
items.bombs.woollybomb.desc=This customized bomb will create a wide field of magical sheep after exploding. The explosion will deal _%1$d-%2$d damage_ to anything within 2 tiles. The sheep will block movement and persist for a very long time! The sheep will not last as long in the presence of powerful enemies though, and can be manually dispelled sooner by interacting with them.
items.bombs.woollybomb.discover_hint=You can craft this item via alchemy.

items.bombs.clusterbomb.name=cluster bomb
items.bombs.clusterbomb.desc=This volatile bundle of explosives detonates with a primary blast and scatters secondary explosions up to 2 tiles away. The chain of blasts makes it unpredictable but devastating.

items.bombs.dizzybomb.name=dizzy bomb
items.bombs.dizzybomb.desc=This bomb is laced with disorienting chemicals. The explosion deals damage in a 1-tile radius and leaves any enemies caught in the blast stumbling with vertigo.

items.bombs.dumplingbomb.name=dumpling bomb
items.bombs.dumplingbomb.no_teleport=There was nowhere to teleport!
items.bombs.dumplingbomb.desc=A non-explosive bomb stuffed with sleep-inducing dumplings. Non-boss enemies in the blast are overcome with drowsiness and teleported to a random location on the floor.

items.bombs.holyhandgrenade.name=holy hand grenade
items.bombs.holyhandgrenade.desc=A blessed explosive that channels divine power against the undead. When detonated, it terrorizes and damages undead enemies within 2 tiles while leaving the living unharmed.

items.bombs.smartbomb.name=smart bomb
items.bombs.smartbomb.desc=A precision explosive designed to detonate around enemies only. It deals damage to nearby foes in a 1-tile radius, but is smart enough to leave its user unharmed.

###food
items.food.berry.name=dungeon berry
items.food.berry.eat_msg=That berry was tasty!
items.food.berry.desc=This small berry was found by the Huntress among the dungeon's vegetation. It can be eaten quickly, restores a small amount of satiety, and might contain a usable seed!
items.food.berry.discover_hint=You can find this item using a specific hero talent.

items.food.blackberry.name=dungeon black berry
items.food.blackberry.eat_msg=Juicy!
items.food.blackberry.trippy=Trippy!
items.food.blackberry.sense_others=You can somehow feel the presence of other creatures' minds!
items.food.blackberry.sense_alone=You can somehow tell that you are alone on this level at the moment.
items.food.blackberry.energy=The berry releases energy into your body!
items.food.blackberry.desc=A delectable berry found in the depths of the dungeon. These berries harvest the magical dew around them to grow healthy.

items.food.blandfruit.name=blandfruit
items.food.blandfruit.cooked=cooked blandfruit
items.food.blandfruit.sunfruit=sunfruit
items.food.blandfruit.rotfruit=rotfruit
items.food.blandfruit.earthfruit=earthfruit
items.food.blandfruit.blindfruit=blindfruit
items.food.blandfruit.firefruit=firefruit
items.food.blandfruit.icefruit=icefruit
items.food.blandfruit.fadefruit=fadefruit
items.food.blandfruit.sorrowfruit=sorrowfruit
items.food.blandfruit.stormfruit=stormfruit
items.food.blandfruit.dreamfruit=magefruit
items.food.blandfruit.starfruit=starfruit
items.food.blandfruit.swiftfruit=swiftfruit
items.food.blandfruit.raw=You can't bear to eat it raw.
items.food.blandfruit.desc=So dry and insubstantial, perhaps stewing it with another ingredient would improve it.
items.food.blandfruit.desc_cooked=The fruit has plumped up from its time soaking in the pot and has even absorbed the properties of the seed it was cooked with. It will have the effect of whatever potion the seed corresponded to.
items.food.blandfruit.desc_eat=It looks ready to be eaten!
items.food.blandfruit.desc_throw=It seems pretty volatile, it might be best to throw it.
items.food.blandfruit$chunks.name=blandfruit chunks
items.food.blandfruit$chunks.desc=The blandfruit has exploded on impact, leaving inert chunks behind.\n\nDespite a bit of dirt, these large chunks of cooked blandfruit seem perfectly edible.

items.food.bluemilk.name=blue milk mushroom
items.food.bluemilk.eat_msg=Munch munch.
items.food.bluemilk.preventing=Something tells you that wouldn't be a good idea here!
items.food.bluemilk.effect=You are slipping through the ether!
items.food.bluemilk.desc=This mushroom oozes a milky blue substance. You feel your senses slipping.

items.food.blueberry.name=dungeon blue berry
items.food.blueberry.eat_msg=Juicy!
items.food.blueberry.preventing=The magic of this place prevents this kind of scrying!
items.food.blueberry.knowledge=The blueberry floods your mind with knowledge about the current floor.
items.food.blueberry.energy=The berry releases energy into your body!
items.food.blueberry.desc=A mysterious blue berry found in the depths of the dungeon. As these berries grow slowly over several years, they soak in knowledge of the dungeon.

items.food.chargrilledmeat.name=chargrilled meat
items.food.chargrilledmeat.desc=It looks like a decent steak.
items.food.chargrilledmeat.discover_hint=You can create this using another food item.

items.food.cloudberry.name=dungeon cloud berry
items.food.cloudberry.eat_msg=Juicy!
items.food.cloudberry.haste=You are moving much faster!
items.food.cloudberry.float=You float into the air!
items.food.cloudberry.energy=The berry releases energy into your body!
items.food.cloudberry.desc=A delectable and light berry found in the depths of the dungeon. This berry seems to float in your hand and it vibrates with a certain energy.

items.food.deathcap.name=death cap mushroom
items.food.deathcap.eat_msg=Munch munch.
items.food.deathcap.preventing=Something tells you that wouldn't be a good idea here!
items.food.deathcap.effect=Dark energy fills your veins. All you can see is your bones glowing!
items.food.deathcap.desc=A deadly-looking fungus found growing in the dungeon. Eat at your own risk.

items.food.earthstar.name=earthstar mushroom
items.food.earthstar.eat_msg=Munch munch.
items.food.earthstar.preventing=Something tells you that wouldn't be a good idea here!
items.food.earthstar.effect=Power from an alien world lashes out at you!
items.food.earthstar.desc=A tiny bit of an unknown world grows in this mushroom. It doesn't feel like a place you'd like to visit...

items.food.fullmoonberry.name=dungeon full moon berry
items.food.fullmoonberry.eat_msg=Juicy!
items.food.fullmoonberry.fury=The moon berry fills your body with fearsome magical strength.
items.food.fullmoonberry.barkskin=The dungeon blesses your skin with armor.
items.food.fullmoonberry.desc=In the darkest hours of night a full moon berry grows. The wishes of the dungeon are concentrated into its strong magic. Just a whiff of it and you feel a magical fury build within you.

items.food.food.name=ration of food
items.food.food.ac_eat=EAT
items.food.food.ac_spice=SPICE
items.food.food.eat_msg=That food tasted delicious!
items.food.food.desc=Nothing fancy here: dried meat, some biscuits - things like that.
items.food.food.spiced_with=spiced with
items.food.food.inv_title=Select a Spice

items.food.fish.name=fish
items.food.fish.name_spring=spawning trout
items.food.fish.name_summer=river perch
items.food.fish.name_autumn=smoked eel
items.food.fish.name_winter=ice-hole catch
items.food.fish.desc_spring=A trout taken on its way upriver, fat with roe. The fisherman swears the spring run is the sweetest eating of the year, and for once nobody argues.
items.food.fish.desc_summer=A perch out of the warm shallows, scaled and gutted on the bridge rail while you waited. Still cool from the water.
items.food.fish.desc_autumn=An eel hung over an alder fire until the skin went black and the flesh went gold. It keeps, it travels, and it is very hard to stop eating.
items.food.fish.desc_winter=Whatever came up through the hole in the ice. Lean, half-frozen and cheap, because the fisherman is under no illusions about what he is selling.

items.food.frozencarpaccio.name=frozen carpaccio
items.food.frozencarpaccio.invis=You see your hands turn invisible!
items.food.frozencarpaccio.hard=You feel your skin harden!
items.food.frozencarpaccio.refresh=Refreshing!
items.food.frozencarpaccio.better=You feel better!
items.food.frozencarpaccio.desc=It's a piece of frozen raw meat. The only way to eat it is by cutting thin slices of it. And this way it's surprisingly good.
items.food.frozencarpaccio.discover_hint=You can create this using another food item.

items.food.goldenjelly.name=golden jelly mushroom
items.food.goldenjelly.eat_msg=Munch munch.
items.food.goldenjelly.preventing=Something tells you that wouldn't be a good idea here!
items.food.goldenjelly.effect=The floor of the dungeon glitters with sticky spores! Where am I going? What are shoes?
items.food.goldenjelly.desc=A gelatinous fungi covered in a sticky ooze. Looks like it might cause some havoc if eaten.

items.food.goldennut.name=golden dungeon nut
items.food.goldennut.eat_msg=Melts in your mouth. Tastes like Nutella.
items.food.goldennut.blessing=You have received the dungeon's blessing.
items.food.goldennut.highest_blessing=You have received the dungeon's highest blessing.
items.food.goldennut.desc=Unique dungeon nut gilded with enchantment.

items.food.jackolantern.name=jack o' lantern mushroom
items.food.jackolantern.eat_msg=Munch munch.
items.food.jackolantern.preventing=Something tells you that wouldn't be a good idea here!
items.food.jackolantern.effect=The shadows are on fire!
items.food.jackolantern.desc=A strange heat emanates from this mushroom. Unleashing the fire within could be dangerous.

items.food.meatpie.name=meat pie
items.food.meatpie.eat_msg=That food was incredible!
items.food.meatpie.desc=A delicious pie filled with savoury meat. This will satiate you far more than any other meal.
items.food.meatpie.discover_hint=You can craft this item via alchemy.

items.food.monstermeat.name=monster meat
items.food.monstermeat.eat_msg=You choked down the monster meat.
items.food.monstermeat.not_well=You are not feeling well.
items.food.monstermeat.desc=Fresh remains of a defeated foe. Satisfying, but there's a small chance it might not agree with you.

items.food.mysterymeat.name=mystery meat
items.food.mysterymeat.eat_msg=That food tasted... strange.
items.food.mysterymeat.hot=Oh it's hot!
items.food.mysterymeat.legs=You can't feel your legs!
items.food.mysterymeat.not_well=You are not feeling well.
items.food.mysterymeat.stuffed=You are stuffed.
items.food.mysterymeat.desc=Eat at your own risk!
items.food.mysterymeat.discover_hint=You can get this item as a drop from certain enemies.
items.food.mysterymeat$placeholder.name=meat

items.food.moonberry.name=dungeon moon berry
items.food.moonberry.eat_msg=Juicy!
items.food.moonberry.fury=The moon berry fills your body with fearsome strength.
items.food.moonberry.barkskin=The dungeon blesses your skin with armor.
items.food.moonberry.desc=A hearty blue-green berry found in the depths of the dungeon. This berry has a tough endocarp and radiates powerful magic. Just a whiff of it and you feel a magical fury build within you.

items.food.nut.name=dungeon nut
items.food.nut.eat_msg=Crunch Crunch.
items.food.nut.blessing=You feel the dungeon blessing you.
items.food.nut.desc=Common dungeon nut.

items.food.pixieparasol.name=pixie parasol mushroom
items.food.pixieparasol.eat_msg=Munch munch.
items.food.pixieparasol.preventing=Something tells you that wouldn't be a good idea here!
items.food.pixieparasol.effect=You are floating in your dream!
items.food.pixieparasol.desc=These mushrooms seem to spin in front of your eyes. You hear fleeting laughter.

items.food.potionofconstitution.name=honey
items.food.potionofconstitution.eat_msg=You feel your life extending.
items.food.potionofconstitution.desc=Life giving nectar.

items.food.phantommeat.name=phantom meat
items.food.phantommeat.desc=A large glistening translucent steak, cut from a phantom piranha. This magical meat doesn't need to be cooked and grants a number of defensive benefits in addition to fully satiating you. When eaten it will grant invisibility, barkskin, some healing, and cures many harmful effects.
items.food.phantommeat.discover_hint=You can get this item as a drop from certain enemies.

items.food.pasty.name=pasty
items.food.pasty.fish_name=steamed fish
items.food.pasty.amulet_name=amulet of yendor?
items.food.pasty.egg_name=easter egg
items.food.pasty.rainbow_name=rainbow potion
items.food.pasty.shattered_name=green cake
items.food.pasty.pie_name=pumpkin pie
items.food.pasty.vanilla_name=blue cake
items.food.pasty.cane_name=candy cane
items.food.pasty.sparkling_name=sparkling potion
items.food.pasty.desc=An authentic Cornish pasty with a traditional filling of beef and potato. Delicious!
items.food.pasty.fish_desc=A whole steamed fish, magically preserved on a bed of greens. It's tradition to save some fish for later around this time of year, so you'll keep some leftovers instead of eating it all at once.\n\nHappy Lunar New Year!
items.food.pasty.amulet_desc=You've finally found it, the magical amulet of - wait a minute, this is just a foil-wrapped chocolate made to look like the amulet! It won't grant you limitless power, but at least it'll fill you up and give you a little artifact charge.\n\nApril Fools!
items.food.pasty.egg_desc=A great big chocolate egg, wrapped in colorful yellow foil. There's easily enough chocolate here to fill you up, and the sugar might give your artifacts a tiny bit of extra charge.\n\nHappy Easter!
items.food.pasty.rainbow_desc=This colorful potion is a kind of liquid food. In addition to satisfying your hunger, it has a little magic in it which will calm an adjacent non-boss enemy, making them temporarily hesitant to fight you.\n\nHappy Pride!
items.food.pasty.shattered_desc=This large slice of vanilla cake has colorful sprinkles and green frosting. The cake was made to celebrate years of experience, and will grant a small amount of that experience to you when eaten.\n\nShattered Pixel Dungeon was first released on August 5th 2014. Happy birthday Warped Pixel Dungeon!
items.food.pasty.pie_desc=A great big slice of pumpkin pie. Its sweet and spicy flavor will fill you up and give you a tiny bit of healing.\n\nHappy Halloween!
items.food.pasty.vanilla_desc=This large slice of vanilla cake has colorful sprinkles and blue frosting. The cake was made to celebrate years of experience, and will grant a small amount of that experience to you when eaten.\n\nThe original Pixel Dungeon was first released on December 4th 2012. Happy birthday Pixel Dungeon!
items.food.pasty.cane_desc=A huge sugary sweet candy cane. It's big enough to fill you up, and the sugar might give your wands a tiny bit of extra charge too.\n\nHappy Holidays!
items.food.pasty.sparkling_desc=This sparkling potion is a kind of liquid food. It satisfies hunger and simulates sparkling wine, but isn't actually alcoholic. The warm feeling in your belly will grant a little bit of shielding.\n\nHappy New Year!
items.food.pasty$fishleftover.name=fish leftovers
items.food.pasty$fishleftover.eat_msg=That food tasted ok.
items.food.pasty$fishleftover.desc=Some surplus fish from your previous meal. You can eat it any time you like to restore a little hunger.

items.food.smallration.name=small food ration
items.food.smallration.eat_msg=That food tasted ok.
items.food.smallration.desc=It looks exactly like a standard ration of food but smaller.
items.food.smallration.discover_hint=You can buy this item in a shop.

items.food.aprico.name=aprico
items.food.aprico.eat_msg=That aprico tasted sweet!
items.food.aprico.desc=A strange, apple-like fruit. Restores a modest amount of satiety.

items.food.grape.name=grape
items.food.grape.eat_msg=Juicy!
items.food.grape.desc=A plump dungeon grape. Quite filling for its size.

items.food.plantegg.name=plant egg
items.food.plantegg.eat_msg=Surprisingly tasty!
items.food.plantegg.desc=A smooth egg found inside an eggbloom flower. It's quite filling.

items.food.peanut.name=peanut
items.food.peanut.eat_msg=Crunch crunch!
items.food.peanut.desc=A small peanut from a peanutpetal plant. A light but satisfying snack.

items.food.cornwheatshaft.name=cornwheat shaft
items.food.cornwheatshaft.eat_msg=Chewy, but nutritious!
items.food.cornwheatshaft.desc=A freshly harvested cornwheat shaft. Restores a modest amount of satiety.

items.food.stewedmeat.name=stewed meat
items.food.stewedmeat.eat_msg=That food tasted ok.
items.food.stewedmeat.desc=Stewing the meat has cleansed it of any disease or parasites. It should be safe to eat.
items.food.stewedmeat.discover_hint=You can craft this item via alchemy.

items.food.supplyration.name=supply ration
items.food.supplyration.desc=This ration was left in the dungeon by and for members of the thieves guild. It's specifically designed to be eaten on the go, and aid with general skullduggery.\n\nWhile it doesn't fill you up as much as a regular ration, it can be eaten quickly, provides a little direct healing, and will restore a charge to the Rogue's cloak of shadows.
items.food.supplyration.discover_hint=You can find this item using a specific hero talent.

items.food.toastednut.name=toasted dungeon nut
items.food.toastednut.eat_msg=Crunch Crunch. MMMM--Nutty!
items.food.toastednut.blessing=You feel the dungeon blessing you.
items.food.toastednut.desc=Common dungeon nut toasted to perfection.



##journal items
items.journal.documentpage.name=torn page
items.journal.documentpage.desc=A lone page, probably torn from a book of some sort. You'll need to pick it up to read it.

items.journal.alchemypage.name=torn alchemy book page
items.journal.alchemypage.desc=A torn page from a guidebook on alchemy.\n\nMost of the text is too small to read at a distance, but you can make out the title of the page:\n\n_"%s"_

items.journal.guidebook.name=tome of dungeon mastery
items.journal.guidebook.hint_mobile=Your guidebook has advice for you! Tap the flashing journal button on the top-right to read it.
items.journal.guidebook.hint_desktop=Your guidebook has advice for you! Select the flashing journal button (%s) on the top-right to read it.
items.journal.guidebook.hint_status=Guidebook
items.journal.guidebook.desc=An adventurer's guidebook, left here by someone who decided adventuring wasn't for them! This particular book is magical, and can prompt adventurers to read a page at the right moment.\n\nDespite that functionality, the book is most popular because of the big words "Don't Panic!" written in large friendly letters on the cover.

items.journal.guidepage.name=torn guidebook page
items.journal.guidepage.desc=A torn page from an adventuring guidebook.\n\nMost of the text is too small to read at a distance, but you can make out the title of the page:\n\n_"%s"_

items.journal.descentpage.name=torn journal page
items.journal.descentpage.desc=A page torn from a dead delver's journal, waiting on the stone as if it knew you were coming.\n\nThe ink shivers when you look at it. You can just make out the heading:\n\n_"%s"_
items.journal.descentpage.unlocked=The page settles into your Descent Guide: "%s".
items.journal.descentpage.already_found=Your Descent Guide already holds this page.

items.journal.regionlorepage$sewers.name=worn letter
items.journal.regionlorepage$sewers.desc=What looks to be a letter, written on a dirt-stained piece of paper. You'll need to pick it up to be able to make out what's written on it.

items.journal.regionlorepage$prison.name=worn journal entry
items.journal.regionlorepage$prison.desc=A journal entry, or some other kind of record, written on an old piece of paper. It seems to have fared better than the letters you found in the sewers, but you'll still need to pick it up to read it.

items.journal.regionlorepage$caves.name=old log entry
items.journal.regionlorepage$caves.desc=What looks to be an entry in an explorer's logbook, preserved surprisingly well despite how old it must be. Pick it up to read it.

items.journal.regionlorepage$city.name=rusted tablet
items.journal.regionlorepage$city.desc=A small rusted metal tablet with a message magically etched into it. The letters are still clear despite the tablet's age, but you'll have to pick it up to read it.

items.journal.regionlorepage$halls.name=glowing tablet
items.journal.regionlorepage$halls.desc=A small black tablet with glowing green letters etched into it. The glowing letters blur together into a haze at a distance, you'll have to pick it up to read it.


###keys
items.keys.goldenkey.name=golden key
items.keys.goldenkey.desc=The notches on this golden key are tiny and intricate. Perhaps it will open a locked chest?

items.keys.crystalkey.name=Crystal key
items.keys.crystalkey.desc=The cut surfaces of this crystalline key shimmer in the darkness. Perhaps it will open something made of crystal?

items.keys.ironkey.name=iron key
items.keys.ironkey.desc=The notches on this ancient iron key are well worn; its leather lanyard is battered by age. What door might it open?

items.keys.wornkey.name=worn key
items.keys.wornkey.desc=This key is worn and discolored, but looks serious. Probably it can open some serious door nearby.

items.keys.skeletonkey.name=skeleton key
items.keys.skeletonkey.desc=This universal key is fashioned from bone. Its crude teeth can open any lock on this floor.

items.keys.goldenskeletonkey.name=golden skeleton key
items.keys.goldenskeletonkey.desc=This gleaming golden key radiates a warm light. Its intricate teeth can bypass any lock anywhere in the dungeon, and it seems to hold some magical power.
items.keys.goldenskeletonkey.confirm=This golden key can force open any lock, but it will be spent. Use it here?
items.keys.goldenskeletonkey.confirm_yes=Use the golden key
items.keys.goldenskeletonkey.confirm_no=Not now



###nornstones
items.nornstone.nornstone.name=norn stone
items.nornstone.nornstone.desc=A fancy gem imbued with ancient power. Bring three to an alter and you may be rewarded with something special.

items.nornstone.greennornstone.name=green norn stone
items.nornstone.greennornstone.desc=A powerful green gem that pulses with natural energy. Bring three norn stones to an alter to unlock their true potential.

items.nornstone.bluenornstone.name=blue norn stone
items.nornstone.bluenornstone.desc=A powerful blue gem that shimmers with arcane frost. Bring three norn stones to an alter to unlock their true potential.

items.nornstone.orangenornstone.name=orange norn stone
items.nornstone.orangenornstone.desc=A powerful orange gem that radiates fiery warmth. Bring three norn stones to an alter to unlock their true potential.

items.nornstone.purplenornstone.name=purple norn stone
items.nornstone.purplenornstone.desc=A powerful purple gem that thrums with dark energy. Bring three norn stones to an alter to unlock their true potential.

items.nornstone.yellownornstone.name=yellow norn stone
items.nornstone.yellownornstone.desc=A powerful yellow gem that crackles with lightning. Bring three norn stones to an alter to unlock their true potential.



