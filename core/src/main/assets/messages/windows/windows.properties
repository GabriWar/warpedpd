windows.wndsupporterthanks.title_1=Thank you!
windows.wndsupporterthanks.title_2=Thank you so much!
windows.wndsupporterthanks.title_3=You are incredible!
windows.wndsupporterthanks.tier_line=_%s_ - a monthly supporter
windows.wndsupporterthanks.body_1=You just chose to pay for a game you could have kept playing for free, and that is what keeps it being made.\n\nYour pledge covers the servers that connect distant players, so _online co-op is yours now_ - open a room, share the code, and go down together from anywhere.\n\nYou also get a vote on what gets built next, your bug reports jump the queue, and new builds reach you first.
windows.wndsupporterthanks.body_2=You went further than you had to, and I noticed. Pledges like yours are what turn a weekend project into something that keeps growing month after month.\n\n_Online co-op is yours now_: open a room, share the code, and go down together from anywhere. Your vote counts on what gets built next, your bug reports jump the queue, and new builds reach you first.\n\nThe silver heart in the corner is small, but what it stands for is not.
windows.wndsupporterthanks.body_3=The top tier. There is nothing above this, and there are very few people here. You have just paid for whole days of work on this game, and every one of them will show.\n\n_Online co-op is yours now_: open a room, share the code, and go down together from anywhere. Your voice weighs the most on what gets built next and how it should feel, your bug reports go straight to the top of the pile, and every new build reaches you first.\n\nWear the crown. You earned it, and I will not forget it.
windows.wndsupporterthanks.signature_1=- GabriWar
windows.wndsupporterthanks.signature_2=- GabriWar, grateful
windows.wndsupporterthanks.signature_3=- GabriWar, with all my heart
windows.wndsupporterthanks.close_1=Let's play
windows.wndsupporterthanks.close_2=Onward!
windows.wndsupporterthanks.close_3=Let's play, hero

