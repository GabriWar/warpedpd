windows.wndblacksmith.prompt=Okay, a deal's a deal. Here's what I can do for you. I only work with identified and uncursed items.\n\n_Current Favor: %d_
windows.wndblacksmith.pickaxe=_Pickaxe (%d favor):_ I guess I can give you the pickaxe back if you want. I've got plenty more.
windows.wndblacksmith.pickaxe_verify=You sure you want dis old thing? The rock around here isn't soft like in the mine, so you won't be able to do any more digging with it.
windows.wndblacksmith.pickaxe_free=Eh, you did a pretty good job, I'll give it to you for free.
windows.wndblacksmith.pickaxe_yes=Yes, I want it.
windows.wndblacksmith.pickaxe_no=Nevermind.
windows.wndblacksmith.reforge=_Reforge (%d favor):_ I can reforge two of the same type of item into one of a higher quality.
windows.wndblacksmith.harden=_Harden (%d favor):_ I can harden a weapon or armor, so it's easier to keep an enchantment or glyph.
windows.wndblacksmith.upgrade=_Upgrade (%d favor):_ If you've got an item below +2 I can upgrade it for you.
windows.wndblacksmith.smith=_Smith (%d favor):_ I can try forging a weapon or armor for you from scratch. It'll be higher tier and probably upgraded, and you'll get some choice over what you get.
windows.wndblacksmith.smith_verify=Alright, I'll get the forge warmed up and then you can pick what you want.
windows.wndblacksmith.smith_yes=Okay, warm the forge.
windows.wndblacksmith.smith_no=Nevermind.
windows.wndblacksmith.cashout=_Cash Out (all favor):_ I can just give you some regular gold I've got lyin' around. 1 for each point of favor.
windows.wndblacksmith.cashout_verify=Okay so that's %d gold. I'm not doin' any more work for you after dis though!
windows.wndblacksmith.cashout_yes=Give me the gold.
windows.wndblacksmith.cashout_no=Nevermind.
windows.wndblacksmith.remote_unavailable=Come 'ere yerself if ye want me services — I don't shout me trade across the dungeon. (Blacksmith services for other players aren't wired up yet — use the host.)
windows.wndblacksmith$wndreforge.message=Okay, I can reforge two identified items of the same type. The weaker one will be destroyed to give the stronger one an upgrade. If they're the same level, I'll keep the one on the left.
windows.wndblacksmith$wndreforge.prompt=Reforge an item
windows.wndblacksmith$wndreforge.reforge=Reforge them
windows.wndblacksmith$hardenselector.prompt=Harden an item
windows.wndblacksmith$upgradeselector.prompt=Upgrade an item
windows.wndblacksmith$wndsmith.prompt=Okay, here's what I can make. I've already got the forge fired up so choose quickly.

windows.wndblacksmith2.prompt=I can reinforce an item with adamantite. Reinforced items can be upgraded to extreme levels. You need the right kind of adamantite, and it'll cost you 50 dark gold.
windows.wndblacksmith2.select_item=Select an item to reinforce
windows.wndblacksmith2.select_adamant=Select your adamantite
windows.wndblacksmith2.reinforce=Reinforce it!

windows.wndotilukemessage.message=The power of the Palantir has caused Zot to lose his mind. I have managed to trap him inside and set guardians. I will now sacrifice myself to create a powerful stone golem that will protect the Palantir, Zot's prison.
windows.wndotilukemessage.okay=Okay

windows.wndtinkerer.message=Thanks for the Toadstool Mushroom! I can rework your waterskin. I can fit it with a condenser that pulls dew out of humid air, or fit it with a measured spout so you drink exactly the drops you choose and the dew restores your mana as well as your health.
windows.wndtinkerer.condenser=Dew Condenser
windows.wndtinkerer.measure=Measured Draught
windows.wndtinkerer.info=Tell me more
windows.wndtinkerer.farewell_condenser=Good luck in your quest, %s! Keep that skin out in the damp.
windows.wndtinkerer.farewell_measure=Good luck in your quest, %s! Not a drop wasted.

windows.wndtinkerer2.message_inactive=Thanks for the Toadstool Mushroom! In return, I can upgrade your mr destructo for you, or I can recharge your old one and give you another.
windows.wndtinkerer2.message_active=Thanks for the Toadstool Mushroom! In return, I can upgrade your mr destructo for you. You can also have this other one I've managed to fix up.
windows.wndtinkerer2.message_new=Thanks for the Toadstool Mushroom! In return, you can have this Mr Destructo if you like.
windows.wndtinkerer2.upgrade=Upgrade my Mr Destructo
windows.wndtinkerer2.recharge=Recharge my Mr Destructo
windows.wndtinkerer2.take_new=I'll take the new Mr Destructo
windows.wndtinkerer2.farewell=Good luck in your quest, %s!
windows.wndtinkerer2.you_now_have=You now have %s

windows.wndtinkerer3.message=Thanks for the Toadstool Mushroom! I can give your waterskin the remaining upgrades: triple capacity, and whichever of the condenser and the measured spout you don't have yet.
windows.wndtinkerer3.upgrade=Triple the capacity
windows.wndtinkerer3.farewell=Good luck in your quest, %s!

windows.wndtinkererinfo.condenser=_Dew Condenser:_ your waterskin fills itself from the air. Nothing happens in dry air, but the damper it gets the faster it fills, about one drop every hundred turns when the air is saturated, a little faster in rain. Fog and rain help, deserts and hot floors do not.
windows.wndtinkererinfo.measure=_Measured Draught:_ a new _measure_ action on the waterskin opens a slider. Pick how many drops to drink and it tells you exactly what you get: every drop restores 5% of your max health _and_ 5% of your max mana. Sip and drink still work as before.
windows.wndtinkererinfo.okay=Okay! Thanks for that!

