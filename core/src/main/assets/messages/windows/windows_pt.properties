windows.wndtinkerer.message=Obrigado pelo cogumelo chapéu-de-sapo! Posso modificar seu odre. Posso colocar nele um condensador que tira orvalho do ar úmido, ou um bico dosador para você beber exatamente as gotas que escolher, e aí o orvalho restaura sua mana além da sua vida.
