windows.wndtinkererinfo.condenser=_Condensador de Orvalho:_ seu odre se enche sozinho com o ar. No ar seco nada acontece, mas quanto mais úmido, mais rápido ele enche: cerca de uma gota a cada cem turnos com o ar saturado, um pouco mais rápido na chuva. Neblina e chuva ajudam; desertos e andares quentes, não.
windows.wndtinkererinfo.measure=_Dose Medida:_ uma nova ação no odre, _dosar_, abre um controle deslizante. Escolha quantas gotas beber e ele mostra exatamente o que você ganha: cada gota restaura 5% da sua vida máxima _e_ 5% da sua mana máxima. Bebericar e beber continuam funcionando como antes.
windows.wndtinkererinfo.okay=Certo! Obrigado!
