windows.wndsupporterthanks.title_1=Obrigado!
windows.wndsupporterthanks.title_2=Muito obrigado!
windows.wndsupporterthanks.title_3=Você é incrível!
windows.wndsupporterthanks.tier_line=_%s_, apoio mensal
windows.wndsupporterthanks.body_1=Você acabou de escolher pagar por um jogo que podia continuar jogando de graça, e é isso que faz ele continuar sendo feito.\n\nSeu apoio paga os servidores que conectam jogadores distantes, então _o co-op online agora é seu_: abra uma sala, compartilhe o código e desçam juntos de qualquer lugar.\n\nVocê também ganha voto no que vai ser feito a seguir, seus relatos de bug furam a fila, e as versões novas chegam primeiro para você.
windows.wndsupporterthanks.body_2=Você foi além do que precisava, e eu reparei. É apoio como o seu que transforma um projeto de fim de semana em algo que continua crescendo mês após mês.\n\n_O co-op online agora é seu_: abra uma sala, compartilhe o código e desçam juntos de qualquer lugar. Seu voto conta no que vai ser feito a seguir, seus relatos de bug furam a fila, e as versões novas chegam primeiro para você.\n\nO coração prateado no canto é pequeno, mas o que ele representa não é.
windows.wndsupporterthanks.body_3=O nível mais alto. Não existe nada acima deste, e pouquíssima gente chegou aqui. Você acabou de pagar por dias inteiros de trabalho neste jogo, e cada um deles vai aparecer.\n\n_O co-op online agora é seu_: abra uma sala, compartilhe o código e desçam juntos de qualquer lugar. Sua voz é a que mais pesa no que vai ser feito a seguir e na sensação que o jogo deve passar, seus relatos de bug vão direto para o topo da pilha, e cada versão nova chega primeiro para você.\n\nUse a coroa. Você mereceu, e eu não vou esquecer.
windows.wndsupporterthanks.signature_1=- GabriWar
windows.wndsupporterthanks.signature_2=- GabriWar, grato
windows.wndsupporterthanks.signature_3=- GabriWar, de todo o coração
windows.wndsupporterthanks.close_1=Vamos jogar
windows.wndsupporterthanks.close_2=Avante!
windows.wndsupporterthanks.close_3=Vamos jogar, herói
