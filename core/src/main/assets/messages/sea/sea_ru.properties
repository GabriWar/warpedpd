# Дополнение русского перевода: пакет 500 ключей
sea.seafaring.launch_surface=Лодки можно спускать на воду только на поверхности под открытым небом.
sea.seafaring.launch_swimming=Пока вы плывёте вплавь, спустить лодку на воду нельзя.
sea.seafaring.launch_one=Ваша другая лодка ещё на воде. Сначала вытащите её на берег.
sea.seafaring.launch_left=Ваша другая лодка осталась на воде в недоступном месте. Вы оставляете её морю.
sea.seafaring.launch_shore=Чтобы спустить лодку, встаньте на берегу рядом с открытой водой.
sea.seafaring.launch_raft=Вы сталкиваете плот на воду.
sea.seafaring.launch_sail=Вы спускаете парусную лодку на воду.
sea.seafaring.hauled=Вы вытаскиваете лодку из воды и убираете её в рюкзак.
sea.seafaring.ashore_raft=Вы сходите на берег. Плот остаётся пришвартованным на воде.
sea.seafaring.ashore_sail=Вы сходите на берег. Парусная лодка остаётся пришвартованной на воде.
sea.seafaring.swimming=Вы плывёте по глубокой воде! Доберитесь до мелководья или берега.
sea.seafaring.overboard=Вы оказались за бортом, а лодку уносит течением.
sea.seafaring.beached=Лодка садится на мель.
sea.seafaring.storm_raft=Поднялся шторм, море волнуется. Плот здесь долго не выдержит — скорее к берегу!
sea.seafaring.storm_sail=Поднялся шторм. Даже парусной лодке приходится тяжело на таких волнах.
sea.seafaring.wave=Волна перехлёстывает через борт и окатывает вас водой.
sea.seafaring.wave_hull=Волна обрушивается на лодку. Деревянный корпус жалобно скрипит.
sea.seafaring.leaking_raft=Плот набирает воду. Половина креплений разрушена.
sea.seafaring.leaking_sail=Парусная лодка течёт. Половина корпуса разрушена.
sea.seafaring.sinking_raft=Плот разваливается прямо под вами! Немедленно к берегу!
sea.seafaring.sinking_sail=Парусная лодка тонет! Немедленно к берегу!
sea.seafaring.capsized_raft=Плот распадается на части и сбрасывает вас в море!
sea.seafaring.capsized_sail=Парусная лодка идёт ко дну вместе с вами!
sea.seafaring.moored_ask=Ваша лодка стоит на швартовке. Прочность корпуса: %1$d/%2$d.
sea.afloat.desc_raft=Вы стоите на плоту из связанных брёвен. Он идёт и по мелководью, и по глубине со скоростью обычного шага. Чтобы высадиться, сойдите на соседнюю клетку суши. Плот останется пришвартованным.\n\nПлот низко сидит в воде. Дождь и сильный ветер поднимают волны, которые промачивают вас и изнашивают крепления. Шторм может вовсе разорвать плот на части. Предупреждение появится при потере половины прочности корпуса, а затем при потере трёх четвертей.\n\nПрочность корпуса: %1$d/%2$d.
sea.afloat.desc_sail=Вы на парусной лодке. Она ходит и по мелководью, и по глубине в полтора раза быстрее пешего шага, а с попутным ветром — вдвое быстрее. Чтобы высадиться, сойдите на соседнюю клетку суши. Лодка останется пришвартованной.\n\nДождь лодке не страшен. Только шторм понемногу повреждает её корпус. Предупреждение появится при потере половины прочности, а затем при потере трёх четвертей.\n\nПрочность корпуса: %1$d/%2$d.
sea.swimming.tiring=Руки наливаются свинцом. Море отнимает последние силы!
sea.swimming.desc=Вы плывёте в глубокой воде, не доставая до дна. Скорость движения вдвое ниже обычной, а одежда постоянно мокрая.\n\nКакое-то время вы можете держаться на плаву, но затем море начнёт отнимать немного здоровья каждый второй ход. Доберитесь до мелководья или берега и следите за плавниками: акулы нападают на всех в воде.\n\nХодов до начала усталости: %d.
sea.lanternglare.desc=Яркий свет морского фонаря и едкий дым его масла отпугивают акул.
items.sea.boat.no_planks=Для починки корпуса нужны доски.
items.sea.boat.repaired=Вы чините корпус, расходуя доски (%1$d). Прочность: %2$d/%3$d.
items.sea.raft.desc=Брёвна, связанные верёвками. Такой плот можно сделать на верстаке усадьбы из четырёх брёвен и двух верёвок или купить у рыбака в приморской деревне. _Спустите_ его на воду с берега, и сможете переплывать озёра, идти вдоль побережья и добираться до островов.\n\nПлот медленный и низко сидит в воде. Дождь и ветер изнашивают его, а шторм может потопить. Чините его досками, когда уберёте обратно в рюкзак.
items.sea.sailboat.desc=Дощатый корпус, мачта и парус из сшитых шкур. Такую лодку можно построить у зажжённой кузницы в усадьбе или купить у рыбака в приморской деревне. _Спустите_ её на воду с берега. Под парусом она идёт в полтора раза быстрее пешего шага, а с попутным ветром — вдвое быстрее.\n\nДождь ей не страшен. Только шторм понемногу повреждает корпус. Когда лодка в рюкзаке, его можно починить досками.
items.sea.seachart.desc=Морская карта смотрителя маяка с отметками всех островов в водах вокруг %s.\n\n_Прочитайте_ её под открытым небом, чтобы перенести острова на карту мира. После использования морская карта исчезнет.
items.sea.seachart.desc_plain=Морская карта близлежащих вод с отмеченными островами.\n\n_Прочитайте_ её под открытым небом, чтобы перенести острова на карту мира. После использования морская карта исчезнет.
items.sea.seachart.no_surface=Читайте морскую карту под открытым небом, когда доступна карта мира.
items.sea.seachart.charted=Вы переносите сведения с морской карты на свою: новых островов — %d.
items.sea.seachart.nothing_new=Все места с этой карты вам уже известны.
items.sea.sealantern.desc=Штормовой фонарь из латуни и толстого стекла, наполненный маслом смотрителя маяка.\n\nЗажжённый фонарь горит вдвое дольше факела, освещает путь и немного согревает. Пока он горит, его яркий свет и едкий дым отпугивают акул.
items.sea.sealantern.lit=Вы зажигаете фонарь. Его свет разливается по воде.
actors.mobs.shark.desc=Серая морская хищница длиннее человеческого роста. Держится глубины и нападает на всех, кто оказался в воде или на воде: пловцов, тех, кто зашёл на край глубоководья, и даже на лодки. Её зубы способны расколоть плот.\n\nЗажжённый морской фонарь отпугивает акул.
actors.mobs.npcs.lighthousekeeper.desc=Старый моряк в пропахшем солью плаще, каждую ночь поддерживающий свет маяка. Продаёт карты островов вокруг маяка и фонари для плавания в открытом море.
actors.mobs.npcs.lighthousekeeper.talk_0=На моих картах отмечены все острова до самого края света. Ну, во всяком случае, все, что мне довелось видеть.
actors.mobs.npcs.lighthousekeeper.talk_1=Сегодня за мелководьем видны плавники. Если соберёшься туда, обязательно зажги фонарь.
actors.mobs.npcs.lighthousekeeper.talk_2=Шторм разнесёт плот в щепки. Если небо потемнеет — держи курс к ближайшему берегу.
actors.mobs.npcs.lighthousekeeper.talk_3=У этих берегов немало кораблекрушений. Море всегда возвращает хоть часть того, что забрало.
actors.mobs.npcs.lighthousekeeper.flee=Смотритель убегает. Маяк продолжает светить без него.
actors.mobs.npcs.villagefisher.desc=Деревенская рыбачка в непромокаемом плаще и шляпе. Между уловами она строит лодки на продажу: плоты для побережья и парусные лодки для открытого моря.
actors.mobs.npcs.villagefisher.talk_spring=С тёплой водой возвращаются косяки рыбы. Самое время купить лодку!
actors.mobs.npcs.villagefisher.talk_summer=В это время года море спокойное. Даже на плоту можно добраться до островов.
actors.mobs.npcs.villagefisher.talk_autumn=Следи за небом. Осенний шторм налетает внезапно, и плот его не переживёт.
actors.mobs.npcs.villagefisher.talk_winter=Холодная вода, холодные руки... А акулам, кажется, всё равно.
levels.overworld.seaworld.found_light=Над морем возвышается маяк: %s.
levels.overworld.seaworld.deep_water_desc=Здесь дно резко уходит вниз, бродом не пройти. Пешком можно пересечь лишь прибрежное мелководье, но на лодке вы пройдёте и здесь.
levels.overworld.seaworld.wreck_desc=Остов разбитого корабля. Доски выбелены солнцем и покрыты ракушками.
levels.overworld.seaworld.wreck_hold_desc=Корпус здесь расколот. Внутри может остаться что-то от груза, который не забрало море.
levels.overworld.seaworld.wreck_shore_desc=Влажный песок, взрыхлённый приливом. Здесь можно пробраться в трюм затонувшего судна.
levels.overworld.seaworld.lighthouse_desc=Белая башня с красной полосой и фонарной комнатой наверху. По ночам её свет обегает море.
levels.overworld.seaworld.apron_desc=Каменные плиты перед дверью маяка отполированы сапогами смотрителя.
levels.overworld.seaworld.dig_spot_desc=Кто-то начертил на песке крест и обложил его ракушками. Под ним наверняка что-то зарыто. Пора взяться за лопату.
levels.overworld.seaworld.moored_raft_desc=Ваш плот на швартовке. Ступите на него, чтобы подняться на борт.
levels.overworld.seaworld.moored_sail_desc=Ваша парусная лодка на швартовке. Ступите на неё, чтобы подняться на борт.
levels.overworld.seaworld.treasure=Лопата ударяется о дерево: старый сундук с морскими сокровищами!
