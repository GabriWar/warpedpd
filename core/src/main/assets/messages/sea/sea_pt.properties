levels.overworld.seaworld.wreck=Naufrágio
levels.overworld.seaworld.wreck_desc=O casco quebrado de um navio, a madeira desbotada pelo sol e coberta de cracas.
levels.overworld.seaworld.wreck_hold=Porão do naufrágio
levels.overworld.seaworld.wreck_hold_desc=O casco está rachado aqui. O que o mar deixou da carga está lá dentro.
levels.overworld.seaworld.wreck_shore=Margem
levels.overworld.seaworld.wreck_shore_desc=Areia molhada revirada pela maré, onde fica a entrada para o porão do naufrágio.
levels.overworld.seaworld.lighthouse=Farol
levels.overworld.seaworld.lighthouse_desc=Uma torre branca com uma faixa vermelha e a sala da lâmpada no alto. A luz dele varre o mar a noite toda.
levels.overworld.seaworld.apron=Calçada de pedra
levels.overworld.seaworld.apron_desc=Lajes diante da porta do farol, gastas pelas botas do faroleiro.
levels.overworld.seaworld.dig_spot=Areia marcada
levels.overworld.seaworld.dig_spot_desc=Alguém riscou um X na areia aqui e juntou conchas em volta. Deve ter alguma coisa enterrada embaixo. Uma pá tiraria a dúvida.
levels.overworld.seaworld.moored_raft=Jangada atracada
levels.overworld.seaworld.moored_raft_desc=Sua jangada, atracada. Pise nela para subir a bordo.
levels.overworld.seaworld.moored_sail=Veleiro atracado
levels.overworld.seaworld.moored_sail_desc=Seu veleiro, atracado. Pise nele para subir a bordo.
levels.overworld.seaworld.treasure=A pá bate em madeira: um baú de marinheiro, enterrado há muito tempo!
