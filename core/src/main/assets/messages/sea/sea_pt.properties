sea.seafaring.overboard=Você está fora do barco, e ele fica à deriva onde está.
sea.seafaring.beached=Seu barco encalha e fica parado na areia.
sea.seafaring.storm_raft=Uma tempestade chegou e o mar está bravo. Uma jangada não aguenta muito tempo aqui: vá para terra firme!
sea.seafaring.storm_sail=Uma tempestade chegou. Até um veleiro apanha com um mar desses.
