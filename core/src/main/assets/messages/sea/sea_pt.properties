###um barco na água (sea/Afloat)
sea.afloat.name_raft=A bordo de uma jangada
sea.afloat.name_sail=A bordo de um veleiro
sea.afloat.desc_raft=Você está numa jangada de toras amarradas. Ela te leva pelo raso e pelo fundo no passo de quem anda. Pise em terra ao lado dela para desembarcar; ela fica atracada onde está.\n\nA jangada vai rente à água. Chuva ou vento forte mandam ondas por cima dela, que te encharcam e gastam as amarras, e uma tempestade pode despedaçá-la. Você será avisado quando metade do casco tiver ido embora, e de novo com três quartos.\n\nCasco: %1$d/%2$d.
sea.afloat.desc_sail=Você está num veleiro. Ele te leva pelo raso e pelo fundo uma vez e meia mais rápido que andando, e duas vezes mais rápido com o vento a favor. Pise em terra ao lado dele para desembarcar; ele fica atracado onde está.\n\nUm veleiro aguenta a chuva. Só uma tempestade gasta o casco, e devagar. Você será avisado quando metade dele tiver ido embora, e de novo com três quartos.\n\nCasco: %1$d/%2$d.

###natação (sea/Swimming)
sea.swimming.name=Nadando
sea.swimming.heromsg=Você está em águas fundas!
sea.swimming.tiring=Seus braços pesam. O mar está te vencendo!
sea.swimming.ondeath=Você se afogou...
sea.swimming.rankings_desc=Afogado no mar
sea.swimming.desc=Você está nadando em águas fundas, sem nada embaixo. Você se move na metade do seu ritmo e fica encharcado.\n\nDá para manter a cabeça fora da água por um tempo, mas depois o mar começa a te desgastar um pouco a cada dois turnos. Vá para o raso ou para a margem, e fique de olho nas barbatanas: tubarões atacam qualquer um que esteja na água.\n\nTurnos até você cansar: %d.

###o clarão de uma lanterna do mar (sea/LanternGlare)
sea.lanternglare.name=Clarão da lanterna
sea.lanternglare.desc=O clarão de uma lanterna do mar acesa e a fumaça amarga do óleo mantêm os tubarões longe de você.

###os barcos (items/sea), e do que as estações da propriedade os fazem (homestead/stations/StationRecipes)
homestead.stations.stationrecipe.raft_logs=tora de carvalho ou pinho
homestead.stations.stationrecipe.sail_hides=couro cru ou curtido

items.sea.boat.ac_launch=LANÇAR
items.sea.boat.ac_repair=CONSERTAR
items.sea.boat.no_planks=Você precisa de tábuas para consertar o casco.
items.sea.boat.repaired=Você conserta o casco com %1$d tábua(s). Casco: %2$d/%3$d.
items.sea.boat.hull=Casco: %1$d/%2$d.
items.sea.raft.name=jangada
items.sea.raft.desc=Toras amarradas com corda: a bancada de uma propriedade faz uma com quatro toras e duas cordas, e os pescadores das vilas à beira-mar vendem. _Lance_ a jangada da margem, ao lado de águas abertas, e vá aonde a água for: atravessando lagos, seguindo a costa, até as ilhas.\n\nA jangada é lenta e vai rente à água. Chuva e vento a desgastam, e uma tempestade pode afundá-la. Conserte com tábuas quando ela estiver de volta na mochila.
items.sea.sailboat.name=veleiro
items.sea.sailboat.desc=Um casco de tábuas com mastro e uma vela de couro costurado, construído na forja acesa de uma propriedade ou comprado de uma pescadora numa vila à beira-mar. _Lance_ o veleiro da margem, ao lado de águas abertas. Ele navega uma vez e meia mais rápido que você anda, e duas vezes mais rápido com o vento a favor.\n\nEle aguenta a chuva. Só uma tempestade gasta o casco, e devagar. Conserte com tábuas quando ele estiver de volta na mochila.

###as mercadorias do faroleiro (items/sea)
items.sea.seachart.name=carta náutica
items.sea.seachart.ac_read=LER
items.sea.seachart.desc=A carta de um faroleiro das águas em volta do %s, com todas as ilhas marcadas.\n\n_Leia_ a céu aberto para passar essas ilhas para o seu mapa do mundo. A carta se gasta.
items.sea.seachart.desc_plain=A carta de um navegante das águas próximas, com todas as ilhas marcadas.\n\n_Leia_ a céu aberto para passar essas ilhas para o seu mapa do mundo. A carta se gasta.
items.sea.seachart.no_surface=Leia a céu aberto, onde está o seu mapa do mundo.
items.sea.seachart.charted=Você passa a carta para o seu mapa: %d ilha(s) que você não conhecia.
items.sea.seachart.nothing_new=A carta não mostra nada que o seu mapa já não tenha.
items.sea.sealantern.name=lanterna do mar
items.sea.sealantern.ac_light=ACENDER
items.sea.sealantern.desc=Uma lanterna de tempestade de latão e vidro grosso, cheia do óleo de um faroleiro.\n\nAcesa, ela queima o dobro de uma tocha, ilumina o caminho e te aquece um pouco. O clarão e a fumaça amarga do óleo mantêm os tubarões longe de você enquanto ela queima.
items.sea.sealantern.lit=Você acende a lanterna. O clarão se espalha pela água.

###o tubarão (actors/mobs/Shark)
actors.mobs.shark.name=tubarão
actors.mobs.shark.desc=Um caçador cinzento do mar aberto, mais comprido que um homem é alto. Ele fica nas águas fundas e ataca qualquer coisa dentro ou em cima delas: quem nada, quem anda na beira do fundo, até um barco. Os dentes dele estilhaçam uma jangada.\n\nUma lanterna do mar acesa o mantém longe.
actors.mobs.shark.fin=Uma barbatana corta a água por perto!
actors.mobs.shark.rams_raft=O tubarão se joga contra a sua jangada!
actors.mobs.shark.rams_sail=O tubarão bate no casco!

###o guardião de um farol (actors/mobs/npcs/LighthouseKeeper)
actors.mobs.npcs.lighthousekeeper.name=faroleiro
actors.mobs.npcs.lighthousekeeper.desc=Um velho marinheiro de casaco manchado de sal que mantém a lâmpada acesa toda noite. Ele vende cartas das ilhas em volta do farol e lanternas para o mar aberto.
actors.mobs.npcs.lighthousekeeper.talk_0=Toda ilha daqui até a beira do mundo está nas minhas cartas. Pelo menos as que eu vi.
actors.mobs.npcs.lighthousekeeper.talk_1=Tem barbatana passando do raso hoje. Leve uma lanterna acesa se for navegar lá fora.
actors.mobs.npcs.lighthousekeeper.talk_2=Uma tempestade desmancha uma jangada. Se o céu escurecer, vá para a terra mais próxima.
actors.mobs.npcs.lighthousekeeper.talk_3=Tem muito naufrágio nessas praias. O mar sempre devolve um pouco do que leva.
actors.mobs.npcs.lighthousekeeper.flee=O faroleiro foge. A lâmpada continua acesa sem ele.

###a pescadora de uma vila (actors/mobs/npcs/VillageFisher)
actors.mobs.npcs.villagefisher.name=pescadora da vila
actors.mobs.npcs.villagefisher.desc=Uma pescadora da vila, de capa e chapéu de oleado. Ela vende os barcos que constrói entre uma pescaria e outra: uma jangada para a costa, um veleiro para o mar aberto.
actors.mobs.npcs.villagefisher.talk_spring=Os cardumes estão voltando com a água quente. Boa hora para comprar um barco!
actors.mobs.npcs.villagefisher.talk_summer=Mar calmo nessa época do ano. Até uma jangada te leva até as ilhas.
actors.mobs.npcs.villagefisher.talk_autumn=Fique de olho no céu. As tempestades de outono chegam rápido, e uma jangada não aguenta.
actors.mobs.npcs.villagefisher.talk_winter=Água fria, mão fria. Os tubarões nem ligam, pelo jeito.

