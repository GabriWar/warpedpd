###the sea: boats, sailing, swimming, islands, wrecks, lighthouses and sharks (docs/sea.md)

###sailing (sea/Seafaring)
sea.seafaring.launch_surface=Boats float on the surface's water, under the open sky.
sea.seafaring.launch_aboard=You are already aboard.
sea.seafaring.launch_swimming=You can't launch a boat while you swim.
sea.seafaring.launch_one=Your other boat is still afloat. Haul it out before you launch another.
sea.seafaring.launch_left=Your other boat lies afloat where you can't walk to it. You leave it to the sea.
sea.seafaring.launch_shore=Stand on the shore beside open water to launch it.
sea.seafaring.launch_raft=You push the raft into the water.
sea.seafaring.launch_sail=You run the sailboat out into the water.
sea.seafaring.hauled=You haul your boat out of the water and pack it away.
sea.seafaring.ashore_raft=You step ashore. The raft stays moored where it floats.
sea.seafaring.ashore_sail=You step ashore. The sailboat stays moored where it floats.
sea.seafaring.aboard=You climb aboard.
sea.seafaring.swimming=You are swimming in deep water! Make for the shallows or the shore.
sea.seafaring.overboard=You are out of your boat, and it drifts where it floats.
sea.seafaring.beached=Your boat runs aground and lies beached.
sea.seafaring.storm_raft=A storm is up and the sea runs high. A raft won't last long out here: make for land!
sea.seafaring.storm_sail=A storm is up. Even a sailboat takes a beating in this sea.
sea.seafaring.wave=A wave breaks over the side and soaks you.
sea.seafaring.wave_hull=A wave crashes over the boat. The timbers groan.
sea.seafaring.leaking_raft=The raft is taking on water. Half its lashings are gone.
sea.seafaring.leaking_sail=The sailboat is leaking. Half its hull is gone.
sea.seafaring.sinking_raft=The raft is coming apart under you! Get to shore now!
sea.seafaring.sinking_sail=The sailboat is sinking! Get to shore now!
sea.seafaring.capsized_raft=The raft breaks apart and throws you into the sea!
sea.seafaring.capsized_sail=The sailboat goes down under you!
sea.seafaring.moored_ask=Your boat rides at its mooring. Hull: %1$d/%2$d.
sea.seafaring.opt_board=Climb aboard
sea.seafaring.opt_haul=Haul it out

###a boat afloat (sea/Afloat)
sea.afloat.name_raft=Aboard a raft
sea.afloat.name_sail=Aboard a sailboat
sea.afloat.desc_raft=You are on a raft of lashed logs. It carries you over the shallows and the deep alike at a walker's pace. Step onto land beside it to go ashore; it stays moored where it floats.\n\nA raft rides low. Rain or a strong wind sends waves over it that soak you and wear its lashings, and a storm can tear it apart. You will be warned when half its hull is gone, and again at three quarters.\n\nHull: %1$d/%2$d.
sea.afloat.desc_sail=You are on a sailboat. It carries you over the shallows and the deep alike, half again as fast as walking, and twice as fast with the wind behind it. Step onto land beside it to go ashore; it stays moored where it floats.\n\nA sailboat rides out the rain. Only a storm wears its hull, slowly. You will be warned when half of it is gone, and again at three quarters.\n\nHull: %1$d/%2$d.

###swimming (sea/Swimming)
sea.swimming.name=Swimming
sea.swimming.heromsg=You are in deep water!
sea.swimming.tiring=Your arms grow heavy. The sea is wearing you down!
sea.swimming.ondeath=You drowned...
sea.swimming.rankings_desc=Drowned at sea
sea.swimming.desc=You are swimming in deep water with nothing under you. You move at half your pace and stay soaked through.\n\nYou can keep your head up for a while, but then the sea starts to wear you down a little every other turn. Make for the shallows or the shore, and watch for fins: sharks go for anyone in the water.\n\nTurns before you tire: %d.

###a sea lantern's glare (sea/LanternGlare)
sea.lanternglare.name=Lantern glare
sea.lanternglare.desc=The glare of a lit sea lantern and the bitter smoke of its oil keep the sharks away from you.

###the boats (items/sea), and what the homestead's stations build them from (homestead/stations/StationRecipes)
homestead.stations.stationrecipe.raft_logs=oak or pine log
homestead.stations.stationrecipe.sail_hides=hide or leather
items.sea.boat.ac_launch=LAUNCH
items.sea.boat.ac_repair=REPAIR
items.sea.boat.no_planks=You need planks to mend the hull.
items.sea.boat.repaired=You mend the hull with %1$d plank(s). Hull: %2$d/%3$d.
items.sea.boat.hull=Hull: %1$d/%2$d.
items.sea.raft.name=raft
items.sea.raft.desc=Logs lashed together with rope: a homestead's workbench makes one from four logs and two rope, and a fisher in a village by the sea sells them. _Launch_ it from the shore beside open water and you can go anywhere the water does: across lakes, along the coast, out to the islands.\n\nA raft is slow and rides low. Rain and wind wear it, and a storm can sink it. Mend it with planks when it is back in your pack.
items.sea.sailboat.name=sailboat
items.sea.sailboat.desc=A planked hull with a mast and a sail of stitched hides, built at a homestead's lit forge or bought from a fisher in a village by the sea. _Launch_ it from the shore beside open water. It sails half again as fast as you walk, and twice as fast with the wind behind it.\n\nIt rides out the rain. Only a storm wears its hull, and slowly. Mend it with planks when it is back in your pack.

###the keeper's goods (items/sea)
items.sea.seachart.name=sea chart
items.sea.seachart.ac_read=READ
items.sea.seachart.desc=A lighthouse keeper's chart of the waters around %s, every island marked.\n\n_Read_ it under the open sky to copy those islands onto your world map. The chart is used up.
items.sea.seachart.desc_plain=A sailor's chart of the nearby waters, every island marked.\n\n_Read_ it under the open sky to copy those islands onto your world map. The chart is used up.
items.sea.seachart.no_surface=Read it under the open sky, where your world map is.
items.sea.seachart.charted=You copy the chart onto your map: %d island(s) you didn't know of.
items.sea.seachart.nothing_new=The chart shows nothing your map doesn't already.
items.sea.sealantern.name=sea lantern
items.sea.sealantern.ac_light=LIGHT
items.sea.sealantern.desc=A storm lantern of brass and thick glass, full of a lighthouse keeper's oil.\n\nLit, it burns twice as long as a torch, lights your way and warms you a little. Its glare and the bitter smoke of the oil keep sharks away from you while it burns.
items.sea.sealantern.lit=You light the lantern. Its glare spreads over the water.

###the shark (actors/mobs/Shark)
actors.mobs.shark.name=shark
actors.mobs.shark.desc=A grey hunter of the open sea, longer than a man is tall. It keeps to the deep water and goes for anything in it or on it: a swimmer, someone wading at the edge of the deep, even a boat. Its teeth can splinter a raft.\n\nA lit sea lantern keeps it away.
actors.mobs.shark.fin=A fin cuts the water nearby!
actors.mobs.shark.rams_raft=The shark slams into your raft!
actors.mobs.shark.rams_sail=The shark rams the hull!

###a lighthouse's keeper (actors/mobs/npcs/LighthouseKeeper)
actors.mobs.npcs.lighthousekeeper.name=lighthouse keeper
actors.mobs.npcs.lighthousekeeper.desc=An old sailor in a salt-stained coat who keeps the lamp burning every night. He sells charts of the islands around his light and lanterns for the open sea.
actors.mobs.npcs.lighthousekeeper.talk_0=Every island from here to the edge of the world is on my charts. Every one I've seen, anyway.
actors.mobs.npcs.lighthousekeeper.talk_1=Fins out past the shallows today. Keep a lantern lit if you sail out there.
actors.mobs.npcs.lighthousekeeper.talk_2=A storm will take a raft apart. If the sky goes dark, head for the nearest land.
actors.mobs.npcs.lighthousekeeper.talk_3=Plenty of wrecks on these shores. The sea always gives back something of what it takes.
actors.mobs.npcs.lighthousekeeper.flee=The keeper runs off. The lamp burns on without him.

###a village's fisher (actors/mobs/npcs/VillageFisher)
actors.mobs.npcs.villagefisher.name=village fisher
actors.mobs.npcs.villagefisher.desc=A fisher from the village, in an oilskin coat and hat. She sells the boats she builds between catches: a raft for the coast, a sailboat for the open sea.
actors.mobs.npcs.villagefisher.talk_spring=The shoals are coming back with the warm water. Good time to buy a boat!
actors.mobs.npcs.villagefisher.talk_summer=Calm seas this time of year. Even a raft gets you out to the islands.
actors.mobs.npcs.villagefisher.talk_autumn=Watch the sky. Autumn storms come in fast, and a raft won't ride one out.
actors.mobs.npcs.villagefisher.talk_winter=Cold water, cold hands. The sharks don't seem to mind, though.

###the sea's places (levels/overworld/SeaWorld)
levels.overworld.seaworld.wreck_name=the wreck of the %s
levels.overworld.seaworld.light_name=%s Light
levels.overworld.seaworld.found_island=You sight an island: %s.
levels.overworld.seaworld.found_wreck=A wreck lies on the shore: %s.
levels.overworld.seaworld.found_light=A lighthouse stands over the sea: %s.
levels.overworld.seaworld.deep_water_desc=The bottom drops away here, too deep to wade. On foot, only the shallows by the shore can be crossed, but a boat carries you over it.
levels.overworld.seaworld.wreck=Shipwreck
levels.overworld.seaworld.wreck_desc=The broken hull of a ship, its timbers bleached by the sun and crusted with barnacles.
levels.overworld.seaworld.wreck_hold=Wreck's hold
levels.overworld.seaworld.wreck_hold_desc=The hull is split open here. Whatever the sea left of the cargo is inside.
levels.overworld.seaworld.wreck_shore=Shore
levels.overworld.seaworld.wreck_shore_desc=Wet sand churned by the tide, where the way into the wreck's hold lies.
levels.overworld.seaworld.lighthouse=Lighthouse
levels.overworld.seaworld.lighthouse_desc=A white tower with a red band and a lamp room on top. Its light sweeps the sea all night.
levels.overworld.seaworld.apron=Stone apron
levels.overworld.seaworld.apron_desc=Flagstones before the lighthouse's door, worn smooth by the keeper's boots.
levels.overworld.seaworld.dig_spot=Marked sand
levels.overworld.seaworld.dig_spot_desc=Someone scratched a cross into the sand here and piled shells around it. Something must be buried underneath. A shovel would find out.
levels.overworld.seaworld.moored_raft=Moored raft
levels.overworld.seaworld.moored_raft_desc=Your raft, riding at its mooring. Step onto it to climb aboard.
levels.overworld.seaworld.moored_sail=Moored sailboat
levels.overworld.seaworld.moored_sail_desc=Your sailboat, riding at its mooring. Step onto it to climb aboard.
levels.overworld.seaworld.treasure=The shovel strikes wood: a sea chest, buried long ago!
