challenges.no_food=На диете
challenges.no_food_desc=Еды и так мало, а вам надо еще и следить за вашими порциями питания!\n\n- Еда и рог изобилия имеют лишь треть голодоутоляющего эффекта.\n- Другие источники насыщения работают без изменений.
challenges.no_armor=Эксгибиционизм
challenges.no_armor_desc=Вам необходимо будет иметь веру в себя, так как от брони мало толку!\n\n- Базовая оборона снижена для любой брони, кроме тканевой.\n- Улучшение любой брони по факту мало что дает.\n- Защитные свойства земляного стража также значительно снижены.
challenges.no_healing=Фармакофобия
challenges.no_healing_desc=Разумеется, зелье исцеления - полезная штука, но, к сожалению, у вас аллергия!\n\n- Зелье исцеления и все предметы, сделанные из него, а также солнцефрукт отравляют героя вместо того, чтобы его исцелять.\n- Нестабильные экстракты не могут, в зависимости от случая, отравлять или исцелять героя.\n- Эти предметы будут работать нормально для других персонажей.
challenges.no_herbalism=Бесплодная земля
challenges.no_herbalism_desc=Похоже, в этом проклятом подземелье не осталось ни капли чистой воды...\n\n- Удалена роса\n- Удалены растения\n- Семена не будут прорастать
challenges.swarm_intelligence=Единый разум
challenges.swarm_intelligence_desc=Осторожнее, монстры в подземелье стали умнее!\n\n- Пока враги видят вас или ваших союзников, они будут привлекать к вашему местоположению других врагов, находящихся поблизости.\n- Дальность действия этого эффекта начинается всего с 2 клеток, но увеличивается на 2 за каждый ход, в течение которого противник видит вас, вплоть до 12 клеток.\n- Потеря зрительного контакта сбрасывает дальность привлечения, даже если это происходит на короткое время, например, при открытии двери.
challenges.darkness=Во тьме
challenges.darkness_desc=Это же всё-таки подземелье!\n\n- Дальность зрения сильно снижена\n- На каждом этаже можно найти факел\n- Другие источники света эффективны на 1/5
challenges.no_scrolls=Неграмотность
challenges.no_scrolls_desc=Одну из рун стало сложнее найти. И, разумеется, самую полезную из них.\n\n- Удалена половина свитков улучшения
challenges.champion_enemies=Вражеские чемпионы
challenges.champion_enemies_desc=Не только вы можете становиться сильнее!\n\nОбычные враги могут появляться с усилением _чемпиона_. На первом этаже вероятность составляет 1/8, а к 21-му возрастает до 1/6.\n\n- Если чемпион появился спящим, он сразу просыпается\n- Герой узнаёт о появлении чемпиона\n- Чемпионов нельзя превратить в союзников\n\nСуществует шесть типов чемпионов:\n_Пылающий (оранжевый):_ +25% урона в ближнем бою, поджигает при ударе, распространяет огонь после смерти, но не может поджечь клетки с водой\n_Проецирующий (фиолетовый):_ +25% урона в ближнем бою и +3 клетки к дальности атаки\n_Антимагический (зелёный):_ получает на 50% меньше урона, невосприимчив к магическим эффектам\n_Гигантский (синий):_ получает на 80% меньше урона, атакует на 1 клетку дальше, но не может проходить в узкие коридоры\n_Благословлённый (жёлтый):_ точность и уклонение увеличены в 4 раза\n_Растущий (красный):_ точность, уклонение, урон и эффективное здоровье увеличены на 20%. Каждые 4 хода бонус возрастает ещё на 1%.
challenges.stronger_bosses=Злые боссы
challenges.stronger_bosses_desc=В этом испытании боссы становятся гораздо опаснее!\n\n_Слизень:_ +20% здоровья\n_-_ Исцеление в воде увеличивается со временем, до 3/ход\n_-_ Накачивается за 1 ход вместо 2\n_Тенгу:_ +25% здоровья\n_-_ Фаза 1: ловушки гораздо смертоноснее\n_-_ Фаза 2: способности противника используются чаще\n_DM-300:_ +33% здоровья\n_-_ Активируются 3 усиленные вышки\n_-_ Способности противника чаще и сильнее\n_-_ DM-300 ещё быстрее, пока сверх-заряжен\n_-_ Открытые провода встречаются вдвое чаще\n_Король Дворфов:_ +50% здоровья\n_-_ Приспешники сильнее во всех фазах\n_-_ Фаза 1: более быстрые способности противника и призыв приспешников\n_-_ Фаза 2: ещё 2 приспешника за раунд \n_-_ Фаза 3: удвоенное здоровье и более быстрый призыв\n_Йог-Джева:_\n_-_ Две Длани вызываются одновременно\n_-_ +60% урона лазером\n_-_ Более сильные личинки

