###Warped Pixel Dungeon

###os lugares (levels/overworld/Drylands, DrylandsLife, OverworldLevel.enterTemple)
levels.overworld.drylands.found_oasis=Você encontra um oásis: água fresca, sombra e palmeiras no meio da areia.
levels.overworld.drylands.found_temple=O topo de um templo soterrado aparece entre as dunas. Uma escadaria desce para dentro dele.
levels.overworld.drylands.temple_desc=Degraus gastos descem para um templo que o deserto enterrou, de nível %1$d. Seus %2$d andares estão cheios de armadilhas e os mortos ainda andam por eles, mas lá não há poção da força nem pergaminho do aprimoramento. Um guardião protege a relíquia lá no fundo.
levels.overworld.drylands.temple_cleared_desc=Sua bandeira tremula sobre a escadaria: o guardião foi destruído e a relíquia, levada. Os andares estão como você os deixou.
levels.overworld.drylands.temple_yes=Descer
levels.overworld.drylands.temple_no=Agora não

