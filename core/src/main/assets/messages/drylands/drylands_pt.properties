###o que se vê neles (tiles/DrylandsArt)
tiles.drylandsart.palm=Tamareira
tiles.drylandsart.palm_desc=Uma tamareira com as raízes na água do oásis. A cada dois dias caem tâmaras maduras ao pé dela.
tiles.drylandsart.rug=Tapete do mercador
tiles.drylandsart.rug_desc=Um tapete tecido estendido na sombra, onde o mercador do oásis se senta com as mercadorias.
tiles.drylandsart.stair=Escadaria do templo
tiles.drylandsart.stair_desc=Degraus de arenito descem para a escuridão do templo soterrado.
tiles.drylandsart.obelisk=Obelisco
tiles.drylandsart.obelisk_desc=Uma agulha de arenito entalhado. A ponta continua dourada depois de tantos anos ao sol.
tiles.drylandsart.statue=Estátua de chacal
tiles.drylandsart.statue_desc=Um chacal de pedra negra, sentado no pedestal, vigia a escadaria.
tiles.drylandsart.slab=Telhado do templo
tiles.drylandsart.slab_desc=O telhado de um templo que o deserto enterrou. A areia se acumula sobre as lajes entalhadas.

###a tempestade de areia (actors/Sandstorm)
actors.buffs.sandblown.name=Tempestade de areia
actors.buffs.sandblown.desc=O vento joga a areia do deserto contra você. Você enxerga %1$d%% menos longe, anda %2$d%% mais devagar, e a areia pode entrar nos seus olhos e te cegar por um instante (%3$d%% de chance a cada turno).\n\nAbrigue-se atrás de algo sólido do lado de onde vem o vento, ou entre num lugar fechado. Óculos de areia ou um lenço do deserto na mochila mantêm a areia longe.
actors.buffs.sandblown.desc_lee=Está soprando uma tempestade de areia, mas algo sólido do lado de onde vem o vento segura a areia. Saia desse abrigo e ela te atinge.
actors.buffs.sandblown.desc_worn=Está soprando uma tempestade de areia, mas seus óculos ou seu lenço mantêm a areia longe dos olhos e da boca: ela não te cega nem te atrasa, e você enxerga tão longe quanto antes.
actors.buffs.sandblown.onset=Tempestade de areia! A areia arde nos olhos e te empurra para trás.
actors.buffs.sandblown.onset_lee=Uma tempestade de areia varre o deserto, mas você está abrigado dela.
actors.buffs.sandblown.onset_worn=Uma tempestade de areia varre o deserto. Você cobre o rosto contra ela.
actors.buffs.sandblown.blinded=A areia entra nos seus olhos!
ui.sundialindicator.w_sandstorm=Tempestade de areia

###as mercadorias (items/misc/DesertWear, items/food/Dates, items/trinkets/SunScarab)
items.food.dates.name=tâmaras
items.food.dates.desc=Tâmaras doces de uma palmeira do oásis. Comem-se num instante e seguram a fome por um tempo.
items.food.dates.discover_hint=Tâmaras maduras caem sob as palmeiras de um oásis no deserto, e os mercadores dos oásis vendem.
items.misc.sandgoggles.name=óculos de areia
items.misc.sandgoggles.desc=Lentes cor de âmbar em aros de latão, presas numa tira de couro. Com eles na mochila, uma tempestade de areia não te cega, não te atrasa e nem encurta a sua visão: você os coloca quando a areia chega.\n\nOs mercadores dos oásis vendem, e uma bancada de trabalho faz um par com uma vidraça e um pedaço de couro.
items.misc.sandgoggles.discover_hint=Os mercadores dos oásis vendem, e uma bancada de trabalho faz um par com uma vidraça e um pedaço de couro.
items.misc.desertscarf.name=lenço do deserto
items.misc.desertscarf.desc=Um pano tecido para enrolar sobre a boca e os olhos. Com ele na mochila, uma tempestade de areia não te cega, não te atrasa e nem encurta a sua visão.\n\nOs mercadores dos oásis vendem, e uma bancada de trabalho tece um com três feixes de palha.
items.misc.desertscarf.discover_hint=Os mercadores dos oásis vendem, e uma bancada de trabalho tece um com três feixes de palha.
items.trinkets.sunscarab.name=escaravelho solar
items.trinkets.sunscarab.desc=Um escaravelho dourado rolando um sol vermelho à sua frente: a relíquia que o guardião de um templo soterrado protegia. Os mortos dos templos foram enterrados sob esse sol, e ele ainda arde contra eles.
items.trinkets.sunscarab.typical_stats_desc=Normalmente, este acessório deixa seus golpes contra mortos-vivos _%d%%_ mais fortes.
items.trinkets.sunscarab.stats_desc=No nível atual, este acessório deixa seus golpes contra mortos-vivos _%d%%_ mais fortes.
items.trinkets.sunscarab.discover_hint=O guardião de um templo soterrado no deserto guarda um no andar mais fundo do templo.

###quem vive lá (actors/mobs)
actors.mobs.mummy.name=múmia
actors.mobs.mummy.desc=Um dos mortos de um templo soterrado, ainda enrolado no seu linho. É tão forte quanto é fundo o andar por onde anda, o aperto dele pode te deixar fraco, e as faixas secas pegam fogo fácil demais.
actors.mobs.mummy.discover_hint=Você encontra este inimigo nos templos soterrados sob as dunas do deserto.
actors.mobs.npcs.oasistrader.name=mercador do oásis
actors.mobs.npcs.oasistrader.desc=Um mercador de manto azul descansando na sombra, perto da água. O tapete enrolado nas costas dele já viu todos os desertos daqui até a beira do mundo.
actors.mobs.npcs.oasistrader.discover_hint=Você encontra este personagem no tapete dele, perto da água de um oásis no deserto.
actors.mobs.npcs.oasistrader.talk=Sente aí e beba: aqui a água não custa nada. Se vai atravessar a areia, arrume uns óculos ou um lenço antes de o vento subir.
actors.mobs.npcs.oasistrader.temple=Dizem que tem um templo debaixo das dunas %1$s a %2$s daqui. Os mortos de lá não dormem.
actors.mobs.npcs.oasistrader.no_temple=Não sei de nenhum templo soterrado perto desta água. Pergunte no próximo oásis.

