# Дополнение русского перевода: пакет 500 ключей
levels.overworld.drylands.found_oasis=Вы находите оазис: среди песков вас ждут пресная вода, тень и пальмы.
levels.overworld.drylands.found_temple=Над дюнами виднеется верхушка погребённого храма. Вниз ведёт лестница.
levels.overworld.drylands.temple_desc=Старые ступени ведут в погребённый песками храм, уровень %1$d. На его %2$d этажах полно ловушек, а мертвецы всё ещё бродят по коридорам. Здесь нет ни зелий силы, ни свитков улучшения. На самом дне страж охраняет реликвию.
levels.overworld.drylands.temple_cleared_desc=Над входом в храм развевается ваш флаг: страж повержен, реликвия добыта. Остальные этажи остались такими, какими вы их покинули.
levels.delves.temple_cleared=%s: страж рассыпается на части. Реликвия храма теперь ваша, а над его лестницей будет развеваться ваш флаг.
tiles.drylandsart.palm_desc=Финиковая пальма, питающаяся водой оазиса. Раз в два дня к её корням падают спелые финики.
tiles.drylandsart.rug_desc=Тканый ковёр расстелен в тени. Здесь торговец оазиса раскладывает товары.
tiles.drylandsart.stair_desc=Ступени из песчаника уходят во тьму погребённого храма.
tiles.drylandsart.obelisk_desc=Высокий резной обелиск из песчаника. Даже спустя долгие годы под солнцем его верхушка всё ещё позолочена.
tiles.drylandsart.statue_desc=Чёрный каменный шакал восседает на постаменте, охраняя вход на лестницу.
tiles.drylandsart.slab_desc=Крыша храма, погребённого под песками. По её резным плитам гуляет песок.
actors.buffs.sandblown.desc=Ветер хлещет вас пустынным песком. Дальность обзора уменьшается на %1$d%%, скорость передвижения — на %2$d%%. Песок может попасть в глаза и ненадолго ослепить вас (вероятность %3$d%% каждый ход).\n\nУкройтесь за прочной преградой с наветренной стороны или зайдите в помещение. Песчаные очки или пустынный шарф в рюкзаке защитят от бури.
actors.buffs.sandblown.desc_lee=В пустыне бушует песчаная буря, но вы укрыты за прочной преградой с наветренной стороны. Стоит выйти из укрытия — песок обрушится на вас.
actors.buffs.sandblown.desc_worn=В пустыне бушует песчаная буря, но очки или шарф защищают ваши глаза и рот. Песок не ослепляет, не замедляет и не ограничивает обзор.
actors.buffs.sandblown.onset=Песчаная буря! Песок режет глаза, а ветер мешает идти.
actors.buffs.sandblown.onset_lee=Песчаная буря накрывает пустыню, но вы стоите под защитой укрытия.
actors.buffs.sandblown.onset_worn=Песчаная буря накрывает пустыню. Вы закрываете лицо от песка.
items.food.dates.desc=Сладкие финики с пальмы в оазисе. Их можно быстро съесть и ненадолго притупить голод.
items.food.dates.discover_hint=Спелые финики падают с пальм в пустынных оазисах. Их также продают местные торговцы.
items.misc.sandgoggles.desc=Янтарные стёкла в латунной оправе на кожаном ремешке. Пока очки при вас, песчаная буря не ослепит вас, не замедлит и не сократит обзор: при сильном ветре вы автоматически надеваете их.\n\nОчки продают торговцы в оазисах. Их также можно изготовить на верстаке из стеклянной панели и куска кожи.
items.misc.sandgoggles.discover_hint=Песчаные очки продаются в оазисах. Для изготовления на верстаке потребуются стеклянная панель и кусок кожи.
items.misc.desertscarf.desc=Полоса тканого полотна, которой можно закрыть рот и глаза. Пока шарф при вас, песчаная буря не сможет ослепить вас, замедлить или ограничить обзор.\n\nШарфы продают торговцы в оазисах. На верстаке такой можно соткать из трёх связок соломы.
items.misc.desertscarf.discover_hint=Пустынные шарфы продаются в оазисах. Для изготовления на верстаке нужны три связки соломы.
items.trinkets.sunscarab.desc=Золотой скарабей катит перед собой красное солнце — реликвия, которую охранял страж погребённого храма. Под этим солнцем хоронили храмовых мертвецов, и его свет по-прежнему обжигает нежить.
items.trinkets.sunscarab.typical_stats_desc=Обычно этот талисман увеличивает урон по нежити на _%d%%_.
items.trinkets.sunscarab.stats_desc=На текущем уровне этот талисман увеличивает урон по нежити на _%d%%_.
items.trinkets.sunscarab.discover_hint=Хранится у стража на самом глубоком этаже погребённого в пустыне храма.
actors.mobs.mummy.desc=Один из мертвецов погребённого храма, всё ещё закутанный в погребальные ткани. Его сила растёт с глубиной этажа, прикосновение может ослабить вас, а сухие бинты прекрасно горят.
actors.mobs.mummy.discover_hint=Этот враг обитает в погребённых храмах под пустынными дюнами.
actors.mobs.npcs.oasistrader.desc=Торговец в синем халате отдыхает в тени у воды. Ковёр за его спиной, кажется, побывал во всех пустынях до самого края света.
actors.mobs.npcs.oasistrader.discover_hint=Этого персонажа можно встретить у воды в пустынном оазисе, где он торгует на расстеленном ковре.
actors.mobs.npcs.oasistrader.talk=Садись, попей воды — здесь за неё денег не берут. Если собрался через пески, купи очки или шарф, пока не поднялся ветер.
actors.mobs.npcs.oasistrader.temple=Говорят, под дюнами %1$s %2$s отсюда лежит храм. Его мертвецы не знают покоя.
actors.mobs.npcs.oasistrader.no_temple=Не слыхал я о погребённых храмах возле этого оазиса. Спроси в следующем.
