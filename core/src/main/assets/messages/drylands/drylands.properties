###their props (tiles/DrylandsArt)
tiles.drylandsart.palm=Date palm
tiles.drylandsart.palm_desc=A date palm with its roots in the oasis' water. Every other day ripe dates drop at its foot.
tiles.drylandsart.rug=Trader's rug
tiles.drylandsart.rug_desc=A woven rug spread in the shade, where the oasis trader sits with his wares.
tiles.drylandsart.stair=Temple stairwell
tiles.drylandsart.stair_desc=Sandstone steps go down into the dark of the buried temple.
tiles.drylandsart.obelisk=Obelisk
tiles.drylandsart.obelisk_desc=A needle of carved sandstone. Its tip is still gilded after all these years in the sun.
tiles.drylandsart.statue=Jackal statue
tiles.drylandsart.statue_desc=A black stone jackal sits on its plinth and watches over the stairwell.
tiles.drylandsart.slab=Temple roof
tiles.drylandsart.slab_desc=The roof of a temple the desert has buried. Sand drifts over its carved slabs.

###the sandstorm (actors/Sandstorm)
actors.buffs.sandblown.name=Sandstorm
actors.buffs.sandblown.desc=The wind drives the desert's sand into you. You see %1$d%% less far, you move %2$d%% slower, and the sand can get in your eyes and blind you for a moment (a %3$d%% chance each turn).\n\nShelter behind something solid on the side the wind comes from, or go indoors. Sand goggles or a desert scarf in your pack keep it off.
actors.buffs.sandblown.desc_lee=A sandstorm is blowing, but something solid on the side the wind comes from keeps the sand off you. Step out of its shelter and the sand will hit you.
actors.buffs.sandblown.desc_worn=A sandstorm is blowing, but your goggles or your scarf keep the sand out of your eyes and mouth: it does not blind you or slow you, and you see as far as ever.
actors.buffs.sandblown.onset=A sandstorm! The sand stings your eyes and pushes you back.
actors.buffs.sandblown.onset_lee=A sandstorm sweeps over the desert, but you stand in shelter from it.
actors.buffs.sandblown.onset_worn=A sandstorm sweeps over the desert. You cover your face against it.
actors.buffs.sandblown.blinded=Sand gets in your eyes!
ui.sundialindicator.w_sandstorm=Sandstorm

###the wares (items/misc/DesertWear, items/food/Dates, items/trinkets/SunScarab)
items.food.dates.name=dates
items.food.dates.desc=Sweet dates from an oasis palm. They are eaten in a moment and keep hunger off for a while.
items.food.dates.discover_hint=Ripe dates drop under the palms of a desert oasis, and oasis traders sell them.
items.misc.sandgoggles.name=sand goggles
items.misc.sandgoggles.desc=Amber lenses in brass rims on a leather strap. Carry them and a sandstorm cannot blind you, slow you or cut your sight: you pull them on when the sand comes.\n\nOasis traders sell them, and a workbench makes a pair from a glass pane and a piece of leather.
items.misc.sandgoggles.discover_hint=Oasis traders sell them, and a workbench makes a pair from a glass pane and a piece of leather.
items.misc.desertscarf.name=desert scarf
items.misc.desertscarf.desc=A length of woven cloth to wind over your mouth and eyes. Carry it and a sandstorm cannot blind you, slow you or cut your sight.\n\nOasis traders sell them, and a workbench weaves one from three bundles of thatch.
items.misc.desertscarf.discover_hint=Oasis traders sell them, and a workbench weaves one from three bundles of thatch.
items.trinkets.sunscarab.name=sun scarab
items.trinkets.sunscarab.desc=A golden scarab rolling a red sun before it: the relic a buried temple's guardian kept. The temples' dead were laid to rest under that sun, and it still burns against them.
items.trinkets.sunscarab.typical_stats_desc=Typically this trinket makes your blows against the undead _%d%%_ stronger.
items.trinkets.sunscarab.stats_desc=At its current level this trinket makes your blows against the undead _%d%%_ stronger.
items.trinkets.sunscarab.discover_hint=The guardian of a buried temple in the desert keeps one on the temple's deepest floor.

###who lives there (actors/mobs)
actors.mobs.mummy.name=mummy
actors.mobs.mummy.desc=One of a buried temple's dead, still wound in its linen. It is as strong as the floor it walks is deep, its grip can leave you weak, and its dry wrappings burn all too well.
actors.mobs.mummy.discover_hint=You can find this enemy in the buried temples under the desert's dunes.
actors.mobs.npcs.oasistrader.name=oasis trader
actors.mobs.npcs.oasistrader.desc=A trader in a blue robe, resting in the shade by the water. The rug rolled on his back has seen every desert from here to the edge of the world.
actors.mobs.npcs.oasistrader.discover_hint=You can find this character on his rug by the water of a desert oasis.
actors.mobs.npcs.oasistrader.talk=Sit, drink: the water costs nothing here. If you are crossing the sand, get goggles or a scarf before the wind rises.
actors.mobs.npcs.oasistrader.temple=They say a temple lies under the dunes %1$s %2$s of here. Its dead do not sleep.
actors.mobs.npcs.oasistrader.no_temple=I know of no buried temple near this water. Ask at the next oasis.

