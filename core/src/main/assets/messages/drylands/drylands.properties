###the desert: its oasis and buried temples, the sandstorm and their wares (levels/overworld/Drylands)

###the places (levels/overworld/Drylands, DrylandsLife, OverworldLevel.enterTemple)
levels.overworld.drylands.found_oasis=You find an oasis: fresh water, shade and palms in the middle of the sand.
levels.overworld.drylands.found_temple=The top of a buried temple sticks out of the dunes. A stairwell leads down into it.
levels.overworld.drylands.temple_desc=Worn steps lead down into a temple the desert buried, level %1$d. Its %2$d floors are trapped and its dead still walk them, but no potion of strength or scroll of upgrade lies in them. A guardian keeps its relic at the bottom.
levels.overworld.drylands.temple_cleared_desc=Your flag flies over its stairwell: its guardian is broken and its relic taken. Its floors are as you left them.
levels.overworld.drylands.temple_yes=Descend
levels.overworld.drylands.temple_no=Not now

