items.rarity.quality.header=This is a _%1$s_ item of type _%2$s_.
items.rarity.quality.unknown=What its rarity and type do for it stays hidden until it is identified.
items.rarity.quality.unknown_lines=Its bonus lines and how strong they rolled stay hidden until it is identified.
items.rarity.quality.unknown_perk=What this type does for it stays hidden until it is identified.
items.rarity.quality.potency=Its rarity alone adds _%d%%_ to its own damage, block or power.
items.rarity.quality.masterwork=Masterwork _%1$d/%2$d_: every bonus line is lifted by 15%% a step. It has slain _%3$d_ enemies.
items.rarity.quality.masterwork_full=_Fully masterworked._ Every bonus line is doubled, and each kill it makes restores you (health for weapons, a charge for wands, a barrier from armor). It has slain _%3$d_ enemies.

items.rarity.masterworkcore.name=masterwork core
items.rarity.masterworkcore.desc=A dense knot of the dungeon's own power, cut from the heart of a boss. The troll blacksmith in town works it into a weapon, armor, thrown weapon or wand: each core is one step of masterwork, and he will melt an item's rarity down and spin it anew on his wheel, better odds the more cores you stake, up to ten.\n\nThere are five steps: each of the first four lifts every rarity bonus the item carries by 15%, and the fifth, which takes only a legendary or exotic base, doubles them.
items.rarity.masterworkcore.not_enough=This step needs %d cores.
items.rarity.masterworkcore.already=Your %s is already fully masterworked.
items.rarity.masterworkcore.needs_legendary=Only a legendary or exotic %s can take the final step.
items.rarity.masterworkcore.done=Your %1$s is now masterwork %2$d/%3$d.
items.rarity.masterworkcore.done_full=Your %1$s is fully masterworked!
items.rarity.masterworkcore.rerolled=Your %1$s comes out of the forge %2$s.
items.rarity.masterworkcore.opt_masterwork=Masterwork an item
items.rarity.masterworkcore.opt_reroll=Reroll a rarity (1-%d cores)
items.rarity.masterworkcore.pick_masterwork=Choose an item to masterwork
items.rarity.masterworkcore.pick_reroll=Choose an item to reroll

items.rarity.typeshifter.name=type shifter
items.rarity.typeshifter.desc=A sliver of shifting metal that settles into whatever it touches. Applied to a weapon, armor, thrown weapon or wand it raises the item's type one step: gamma to beta for one shifter, beta to alpha for two. It never lowers a type.
items.rarity.typeshifter.ac_shift=SHIFT
items.rarity.typeshifter.prompt=Choose an item to shift
items.rarity.typeshifter.already_alpha=Your %s is already alpha, the highest type.
items.rarity.typeshifter.not_enough=Raising to %2$s needs %1$d shifters.
items.rarity.typeshifter.shifted=Your %1$s is now type %2$s!

items.rarity.quality.tab_rarity=_%1$s_ rarity, with _%2$d_ bonus lines:
items.rarity.quality.tab_type=Type _%s_:
items.rarity.quality.tab_type_current=Type _%s_ (this item's type):
items.rarity.quality.tab_type_cost=Reaching this type takes _%d_ type shifters from where it is now.
items.rarity.quality.masterwork_next=The next step costs _%d_ masterwork core.
items.rarity.quality.tab_rarity_other=_%1$s_ items add _%6$d%%_ to their own damage, block or power, and carry _%2$d_ bonus lines rolled between _%3$d%%_ and _%4$d%%_ of maximum. They can drop from depth _%5$d_.
items.rarity.quality.tab_rarity_other_gear=_%1$s_ items carry _%2$d_ bonus lines rolled between _%3$d%%_ and _%4$d%%_ of maximum. They can drop from depth _%5$d_.
items.rarity.quality.tab_vestige=It also carries a _vestigial enchantment_, a faint echo of a magic it never quite took:
items.rarity.quality.tab_rarity_other_vestige= Their weapons also carry a _vestigial enchantment_ that fires only a fraction as often as a real one.
items.rarity.quality.tab_vestige_glyph=It also carries a _vestigial glyph_, a faint echo of a magic it never quite took:
items.rarity.quality.tab_rarity_other_vestige_glyph=Their armor also carries a _vestigial glyph_ that answers only a fraction as often as a real one.
items.rarity.quality.slot_common=Its line is a plain bonus.
items.rarity.quality.slot_uncommon=Its line is a trait: %s.
items.rarity.quality.slot_rare=One line is a trait (%s), the other a plain bonus.

items.rarity.weaponperk.tile=%d tile
items.rarity.weaponperk.tiles=%d tiles
items.rarity.weaponperk.gun_name=Gunner
items.rarity.weaponperk.gun=_%1$s:_ shots at enemies _three or more tiles away_ deal up to _%2$s_ more damage, and _%3$s_ of reloads take no time.
items.rarity.weaponperk.gun_twist=One shot in five _spends no round_.
items.rarity.weaponperk.boomerang_name=Arc
items.rarity.weaponperk.boomerang=_%1$s:_ the throw flies on through up to _%2$s_ more enemies, and on its way back it strikes every enemy in its path for _%3$s_ of a hit.
items.rarity.weaponperk.boomerang_twist=It comes back after _2 turns_ instead of 5.
items.rarity.weaponperk.scythe_name=Reaper
items.rarity.weaponperk.scythe=_%1$s:_ every hit also _sweeps_ the other enemies beside you for _%2$s_ of the blow, and carried, it gives a _second seed_ from _%3$s_ of the crops and tall grass you cut.
items.rarity.weaponperk.scythe_twist=Swept enemies _bleed_.
items.rarity.weaponperk.shot_name=Marksman
items.rarity.weaponperk.shot=_%1$s:_ shots at enemies _three or more tiles away_ deal up to _%2$s_ more damage, and the further the shot the more it gains.
items.rarity.weaponperk.shot_twist=Shots from _%1$s or more tiles away_ never miss and cut straight through part of the target's armor.
items.rarity.weaponperk.guard_name=Guard
items.rarity.weaponperk.guard=_%1$s:_ while held, every blow you take is softened by _%2$s_, growing with the weapon's tier and level.
items.rarity.weaponperk.guard_twist=Hold your ground for two turns and the next blow is _turned aside whole_, with _%1$s_ of it dealt straight back.
items.rarity.weaponperk.reach_name=Reach
items.rarity.weaponperk.reach=_%1$s:_ hits from _two or more tiles away_ deal _%2$s_ more damage.
items.rarity.weaponperk.reach_twist=The weapon strikes _one tile further_ than its length allows.
items.rarity.weaponperk.swift_name=Flurry
items.rarity.weaponperk.swift=_%1$s:_ you attack up to _%2$s_ faster, building while your blows keep landing and lost the moment one misses.
items.rarity.weaponperk.swift_twist=Every _fifth hit that lands_ takes no time at all.
items.rarity.weaponperk.crush_name=Crush
items.rarity.weaponperk.crush=_%1$s:_ every hit deals _%2$s_ more damage and ignores _%3$s_ of the target's armor.
items.rarity.weaponperk.crush_twist=Hits _sunder_ what armor is left, stacking three times on the same enemy.
items.rarity.weaponperk.wild_name=Wild
items.rarity.weaponperk.wild=_%1$s:_ _%2$s_ of hits come out _wild_ and deal _%3$s_ more damage.
items.rarity.weaponperk.wild_twist=Wild hits open a _bleed_.
items.rarity.weaponperk.keen_name=Ambush
items.rarity.weaponperk.keen=_%1$s:_ _surprise attacks_ deal _%2$s_ more damage and ignore _%3$s_ of the target's armor. While you hold it you _sense enemies_ within _%4$s_, even through walls.
items.rarity.weaponperk.keen_twist=A surprise attack _executes_ anything already near death, and that blow takes no time.
items.rarity.weaponperk.siphon_name=Siphon
items.rarity.weaponperk.siphon=_%1$s:_ every hit restores _%2$s_ of your maximum mana, 3 at most.
items.rarity.weaponperk.siphon_twist=With the pool already full the mana becomes _shielding_ instead of being thrown away.
items.rarity.weaponperk.momentum_name=Momentum
items.rarity.weaponperk.momentum=_%1$s:_ each hit in a row on the same enemy deals _%3$s_ more damage, from the first hit, stacking four times for _%2$s_ in all. A miss starts it over.
items.rarity.weaponperk.momentum_twist=A kill at three stacks or more refunds the attack's time and _carries the stacks_ to your next enemy.
items.rarity.weaponperk.dart_name=Tips
items.rarity.weaponperk.dart=_%1$s:_ dart hits deal more damage the more the target already suffers, up to _%2$s_, and a tipped dart keeps its tip on _%3$s_ of hits.
items.rarity.weaponperk.dart_twist=The struck target is _rooted_, and the heavier the dart the longer it holds.
items.rarity.weaponperk.throw_name=Keen
items.rarity.weaponperk.throw=_%1$s:_ _%2$s_ of throws land keen and deal _%3$s_ more damage, and a keen throw that does not break _flies back to your hand_.
items.rarity.weaponperk.throw_twist=Your throws reach an enemy _through walls_ up to 3 tiles away.
items.rarity.weaponperk.impact_name=Heave
items.rarity.weaponperk.impact=_%1$s:_ _heave_ it instead of throwing: the throw takes _two turns_ and deals _%2$s_ more damage.
items.rarity.weaponperk.impact_twist=A heave lands with a _shockwave_ that hits every enemy beside the target for _%1$s_ of the blow.
items.rarity.weaponperk.woodsman_name=Woodsman
items.rarity.weaponperk.woodsman=_%1$s:_ every hit on the same enemy _splinters its armor_, ignoring _%2$s_ more of it, three times over. Felling and chopping take _%3$s_ fewer strokes, and _%4$s_ of felled trees give an extra log.
items.rarity.weaponperk.woodsman_twist=Every third hit on the same enemy is a _felling blow_ that knocks it back two tiles.
items.rarity.weaponperk.quarry_name=Quarry
items.rarity.weaponperk.quarry=_%1$s:_ _%2$s_ of hits _daze_ the enemy for 2 turns. As a tool it breaks stone or digs in _%3$s_ fewer strokes, and _%4$s_ of the stone and ore it breaks out come with one more.
items.rarity.weaponperk.quarry_twist=A dazing blow _cracks the floor_, crippling the enemy and every enemy beside it.
items.rarity.weaponperk.bard_name=Bard
items.rarity.weaponperk.bard=_%1$s:_ every hit plays a note, and every _fourth note_ a chord, in turn: a _rally_ that blesses you and your allies within 3 tiles for _%2$s turns_, then a _dread_ that terrifies the enemies within 2 tiles for as long.
items.rarity.weaponperk.bard_twist=Each chord also _charms_ the weakest enemy within 3 tiles for 5 turns.
items.rarity.weaponperk.lash_name=Lash
items.rarity.weaponperk.lash=_%1$s:_ hits from two or more tiles away deal _%2$s_ more damage, and _%3$s_ of them _drag_ the enemy a tile toward you, crippled for 2 turns.
items.rarity.weaponperk.lash_twist=One hit in five _disarms_ the enemy: its next blow that lands deals half damage.

items.rarity.gearperk.mending_name=Mending
items.rarity.gearperk.mending=_%1$s:_ you regenerate health _%2$s_ faster.
items.rarity.gearperk.mending_twist=At full health the healing is _banked as shielding_ instead of wasted, up to _%1$s_ of your max health.
items.rarity.gearperk.nimble_name=Nimble
items.rarity.gearperk.nimble=_%1$s:_ the armor grants _%2$s_ more evasion.
items.rarity.gearperk.nimble_twist=Each dodge stacks _%1$s_ more evasion, three times over, until a blow finally lands.
items.rarity.gearperk.bulwark_name=Bulwark
items.rarity.gearperk.bulwark=_%1$s:_ blows are softened by up to _%2$s_ while you stand your ground; it takes two turns without stepping to set, and swinging in place keeps it.
items.rarity.gearperk.bulwark_twist=The wall never fully drops, and the damage it stops is _banked into your next attack_.
items.rarity.gearperk.stalwart_name=Stalwart
items.rarity.gearperk.stalwart=_%1$s:_ the armor's minimum block is never less than _%2$s_ of its maximum.
items.rarity.gearperk.stalwart_twist=_%1$s_ points of missing strength are ignored, for both your footing and your evasion.
items.rarity.gearperk.striker_name=Striker
items.rarity.gearperk.striker=_%1$s:_ your attacks deal _%2$s_ more damage.
items.rarity.gearperk.striker_twist=Your blows find the gaps, ignoring _%1$s_ of the target's armor.
items.rarity.gearperk.ward_name=Ward
items.rarity.gearperk.ward=_%1$s:_ _%2$s_ of debuffs slide off you as they land, the more readily the more you already suffer.
items.rarity.gearperk.ward_twist=Whatever you shrug off cannot touch you again for _%1$s turns_.
items.rarity.gearperk.attune_name=Attunement
items.rarity.gearperk.attune=_%1$s:_ your wands and artifacts recharge _%2$s_ faster, and your mana pool grows with them.
items.rarity.gearperk.attune_twist=The first zap after a wand fills is cast _%1$s levels higher_.
items.rarity.gearperk.provision_name=Provision
items.rarity.gearperk.provision=_%1$s:_ you find _%2$s_ more gold, deeper floors paying better, and grow hungry _%3$s_ slower.
items.rarity.gearperk.provision_twist=The coin is a meal: every pile you pick up _feeds you_ a little.
items.rarity.gearperk.resonance_name=Resonance
items.rarity.gearperk.resonance=_%1$s:_ _%2$s_ of zaps do not spend a charge, more as the wand is upgraded.
items.rarity.gearperk.resonance_twist=A free zap leaves the wand humming, and the next one is cast _%1$s levels higher_.
items.rarity.gearperk.binding_name=Binding
items.rarity.gearperk.binding=_%1$s:_ zapped enemies have a _%2$s_ chance to be _crippled_, longer as the wand levels.
items.rarity.gearperk.binding_twist=The bind _spreads_ to the nearest other enemy at half its length.
items.rarity.gearperk.wellspring_name=Wellspring
items.rarity.gearperk.wellspring=_%1$s:_ the wand recharges _%2$s_ faster, more as it is upgraded.
items.rarity.gearperk.wellspring_twist=Zapping at full charge no longer wastes the bar: it holds up to _%1$s charges above its maximum_.
items.rarity.gearperk.legion_name=Legion
items.rarity.gearperk.legion=_%1$s:_ the wand works _%2$s_ levels higher, more as it is upgraded.
items.rarity.gearperk.legion_twist=Its zaps _shield your allies in sight_ for _%1$s_ of their own max health.
items.rarity.gearperk.fortune_name=Fortune
items.rarity.gearperk.fortune=_%1$s:_ while you carry it you find _%2$s_ more gold, more as it is upgraded.
items.rarity.gearperk.fortune_twist=Shops sell to you cheaper, and _%1$s_ of gold piles come up _twice as heavy_.
items.rarity.gearperk.omen_name=Omen
items.rarity.gearperk.omen=_%1$s:_ while you carry it you gain _%2$s_ more evasion, more as it is upgraded.
items.rarity.gearperk.omen_twist=It works _one level higher_, up to its limit.
items.rarity.gearperk.vitality_name=Vitality
items.rarity.gearperk.vitality=_%1$s:_ while you carry it you regenerate health _%2$s_ faster, more as it is upgraded.
items.rarity.gearperk.vitality_twist=Below a third of your health, each tick of healing also _washes out a bleed or a poison_.
items.rarity.gearperk.escape_name=Escape
items.rarity.gearperk.escape=_%1$s:_ the artifact charges faster and you move _%2$s_ faster.
items.rarity.gearperk.escape_twist=For a few turns after a blow lands on you that speed is _%1$s_ greater.
items.rarity.gearperk.assault_name=Assault
items.rarity.gearperk.assault=_%1$s:_ the artifact charges faster and your attacks deal _%2$s_ more damage.
items.rarity.gearperk.assault_twist=Attacking on consecutive turns stacks _%1$s_ more damage, three times over.
items.rarity.gearperk.insight_name=Insight
items.rarity.gearperk.insight=_%1$s:_ the artifact charges faster and your attacks are _%2$s_ more accurate.
items.rarity.gearperk.insight_twist=After any attack of yours misses, the next one _cannot miss_.
items.rarity.gearperk.sustain_name=Sustain
items.rarity.gearperk.sustain=_%1$s:_ while worn you regenerate health _%2$s_ faster and grow hungry _%3$s_ slower.
items.rarity.gearperk.sustain_twist=The first time a blow leaves you under a third of your health, your body _spends its reserves to heal you_.
items.rarity.gearperk.warden_name=Warden
items.rarity.gearperk.warden=_%1$s:_ while worn you gain _%2$s_ more evasion, and blows against you are softened.
items.rarity.gearperk.warden_twist=_%1$s_ of the damage it turns aside is _dealt straight back to the attacker_.
