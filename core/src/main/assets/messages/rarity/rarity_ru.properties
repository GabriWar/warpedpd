items.rarity.rarityline.vestige_silent_glyph=отголосок эффекта «%1$s»: не действует, пока на броне есть полноценный эффект
items.rarity.rarityline.warm_grip=+%s°C тепла на холоде, пока предмет в руках
items.rarity.rarityline.executioner=+%d%% к урону по врагам, у которых меньше половины здоровья
items.rarity.rarityline.moonlit=Ночью +%1$d%% к урону и точности; на рассвете и закате эффект вдвое слабее, а около полудня урон и точность снижаются на %2$d%%
items.rarity.rarityline.stormborn=+%d%% к урону, когда на вас падает дождь, снег или град
items.rarity.rarityline.defiant=+%d%% к урону, если у вас осталось меньше половины здоровья
items.rarity.rarityline.hunter=%d%% шанс получить мясо с убитого зверя
items.rarity.rarityline.steady=Ветер ухудшает вашу точность на %d%% меньше
items.rarity.rarityline.hushed=+%s к скрытности; мокрая обувь не издаёт звуков
items.rarity.rarityline.rainproof=Дождь промачивает вас за %1$d ходов; лужи промачивают обувь на %2$d%% реже
items.rarity.quality.header=Редкость предмета — _%1$s_, тип — _%2$s_.
items.rarity.quality.unknown=Свойства редкости и типа откроются после опознания предмета.
items.rarity.quality.unknown_lines=Дополнительные свойства и их величины откроются после опознания предмета.
items.rarity.quality.unknown_perk=Свойства этого типа откроются после опознания предмета.
items.rarity.quality.potency=Одна только редкость увеличивает собственный урон, блокирование или мощь предмета на _%d%%_.
items.rarity.quality.masterwork=Мастерская работа _%1$d/%2$d_: каждый шаг усиливает все дополнительные свойства на 15%%. Убито врагов этим предметом: _%3$d_.
items.rarity.quality.masterwork_full=_Мастерская работа завершена._ Все дополнительные свойства удвоены, а каждое убийство этим предметом восстанавливает вам ресурс: здоровье для оружия, заряд для палочек и барьер для брони. Убито врагов: _%3$d_.
items.rarity.masterworkcore.desc=Плотный сгусток силы самого подземелья, извлечённый из сердца босса. Городской кузнец-тролль использует его для доводки оружия, брони, метательного оружия или волшебной палочки. Одно ядро даёт одну ступень мастерской работы. Кузнец также может переплавить редкость предмета и назначить её заново на своём колесе: чем больше ядер поставите, тем выше шанс хорошего результата, максимум — десять.\n\nВсего пять ступеней. Каждая из первых четырёх усиливает все бонусы редкости на 15%. Пятая удваивает их, но доступна лишь предметам легендарной или экзотической редкости.
items.rarity.masterworkcore.already=%s уже доведён до высшей ступени мастерской работы.
items.rarity.masterworkcore.needs_legendary=Для последней ступени подходит только легендарный или экзотический предмет: %s.
items.rarity.masterworkcore.done=Предмет «%1$s» теперь имеет ступень мастерской работы %2$d/%3$d.
items.rarity.masterworkcore.rerolled=После перековки предмет «%1$s» получил редкость «%2$s».
items.rarity.typeshifter.desc=Осколок изменчивого металла, принимающего форму всего, к чему прикасается. Примените его к оружию, броне, метательному оружию или волшебной палочке, чтобы повысить тип предмета на одну ступень: с гаммы до беты за один преобразователь, с беты до альфы — за два. Тип никогда не понижается.
items.rarity.typeshifter.already_alpha=Предмет «%s» уже имеет наивысший тип — альфа.
items.rarity.typeshifter.not_enough=Для повышения до типа «%2$s» нужно преобразователей: %1$d.
items.rarity.quality.tab_rarity=Редкость: _%1$s_. Дополнительных свойств: _%2$d_:
items.rarity.quality.tab_type_cost=Чтобы повысить предмет до этого типа, понадобится _%d_ преобразователей.
items.rarity.quality.masterwork_next=Следующая ступень потребует ядер мастерской работы: _%d_.
items.rarity.quality.tab_rarity_other=Предметы редкости «_%1$s_» получают _%6$d%%_ к собственному урону, блокированию или мощи и имеют _%2$d_ дополнительных свойств силой от _%3$d%%_ до _%4$d%%_ максимума. Начинают встречаться с глубины _%5$d_.
items.rarity.quality.tab_rarity_other_gear=Предметы редкости «_%1$s_» имеют _%2$d_ дополнительных свойств силой от _%3$d%%_ до _%4$d%%_ максимума. Начинают встречаться с глубины _%5$d_.
items.rarity.quality.tab_vestige=Также имеется _отголосок зачарования_ — слабый след магии, которая не сумела раскрыться полностью:
items.rarity.quality.tab_rarity_other_vestige= Их оружие также несёт _отголосок зачарования_, который срабатывает гораздо реже полноценного.
items.rarity.quality.tab_vestige_glyph=Также имеется _отголосок руны_ — слабый след магии, которая не сумела раскрыться полностью:
items.rarity.quality.tab_rarity_other_vestige_glyph= Их броня также несёт _отголосок руны_, которая срабатывает гораздо реже полноценной.
items.rarity.quality.slot_rare=Одно свойство — особенность (%s), второе — обычный бонус.
items.rarity.weaponperk.gun=_%1$s:_ выстрелы по врагам на расстоянии _от трёх клеток_ наносят до _%2$s_ больше урона, а _%3$s_ перезарядок происходят мгновенно.
items.rarity.weaponperk.gun_twist=Каждый пятый выстрел _не расходует патрон_.
items.rarity.weaponperk.boomerang=_%1$s:_ бросок может поразить ещё до _%2$s_ врагов насквозь, а на обратном пути снаряд бьёт каждого на пути с силой _%3$s_ обычного попадания.
items.rarity.weaponperk.boomerang_twist=Снаряд возвращается через _2 хода_ вместо 5.
items.rarity.weaponperk.scythe=_%1$s:_ каждый удар также _задевает_ других врагов рядом с вами, нанося _%2$s_ урона от основного удара. Если носить это оружие, _%3$s_ срезанных растений и высокой травы дадут _дополнительное семя_.
items.rarity.weaponperk.shot=_%1$s:_ выстрелы по врагам на расстоянии _от трёх клеток_ наносят до _%2$s_ больше урона. Чем дальше цель, тем сильнее выстрел.
items.rarity.weaponperk.shot_twist=Выстрелы с расстояния _от %1$s клеток_ никогда не промахиваются и частично пробивают броню цели.
items.rarity.weaponperk.guard=_%1$s:_ пока оружие в руках, входящий урон от каждого удара снижается на _%2$s_. Защита растёт с рангом и уровнем оружия.
items.rarity.weaponperk.guard_twist=Постойте на месте два хода: следующий удар будет _полностью отражён_, а _%1$s_ его урона вернётся нападающему.
items.rarity.weaponperk.reach=_%1$s:_ удары с расстояния _от двух клеток_ наносят на _%2$s_ больше урона.
items.rarity.weaponperk.reach_twist=Оружие бьёт _на одну клетку дальше_ обычной дальности.
items.rarity.weaponperk.swift=_%1$s:_ скорость ваших атак повышается вплоть до _%2$s_, пока удары попадают в цель. Первый промах сбрасывает бонус.
items.rarity.weaponperk.swift_twist=Каждый _пятый успешный удар_ не занимает времени.
items.rarity.weaponperk.crush=_%1$s:_ каждый удар наносит _%2$s_ дополнительного урона и игнорирует _%3$s_ брони цели.
items.rarity.weaponperk.crush_twist=Попадания _раскалывают оставшуюся броню_ цели. Эффект суммируется до трёх раз.
items.rarity.weaponperk.wild=_%1$s:_ _%2$s_ ваших ударов становятся _неистовыми_ и наносят _%3$s_ дополнительного урона.
items.rarity.weaponperk.keen=_%1$s:_ _внезапные атаки_ наносят _%2$s_ дополнительного урона и игнорируют _%3$s_ брони цели. Пока оружие в руках, вы _чувствуете врагов_ в радиусе _%4$s_, даже сквозь стены.
items.rarity.weaponperk.keen_twist=Внезапная атака _добивает_ врага при смерти и не занимает времени.
items.rarity.weaponperk.siphon=_%1$s:_ каждый удар восстанавливает _%2$s_ максимального запаса маны, но не более 3 единиц.
items.rarity.weaponperk.siphon_twist=При полном запасе маны её излишек превращается в _щит_, а не пропадает.
items.rarity.weaponperk.momentum=_%1$s:_ каждый последовательный удар по одному врагу увеличивает урон на _%3$s_, начиная с первого. Эффект суммируется до четырёх раз, достигая _%2$s_. Промах обнуляет серии.
items.rarity.weaponperk.momentum_twist=Убийство при трёх и более накопленных усилениях возвращает время атаки и _сохраняет усиления_ для следующего врага.
items.rarity.weaponperk.dart=_%1$s:_ попадания дротиков наносят тем больше урона, чем сильнее ранена цель, вплоть до _%2$s_. Обработанный дротик сохраняет покрытие с вероятностью _%3$s_ при попадании.
items.rarity.weaponperk.dart_twist=Попадание _пригвождает_ цель к месту. Чем тяжелее дротик, тем дольше длится эффект.
items.rarity.weaponperk.throw=_%1$s:_ _%2$s_ бросков становятся особенно меткими и наносят _%3$s_ дополнительного урона. Такой бросок, если снаряд не сломался, _возвращает его в руку_.
items.rarity.weaponperk.throw_twist=Ваши снаряды могут поражать врагов _сквозь стены_ на расстоянии до трёх клеток.
items.rarity.weaponperk.impact=_%1$s:_ вместо обычного броска можно _швырнуть с размаху_. Это занимает _два хода_, но наносит _%2$s_ дополнительного урона.
items.rarity.weaponperk.impact_twist=Бросок с размаху создаёт _ударную волну_, которая задевает всех врагов рядом с целью с силой _%1$s_ основного удара.
items.rarity.weaponperk.woodsman=_%1$s:_ каждый удар по одному врагу _расщепляет его броню_, дополнительно игнорируя _%2$s_ защиты, до трёх раз. Валка и рубка дерева требуют на _%3$s_ меньше ударов, а _%4$s_ срубленных деревьев дают дополнительное бревно.
items.rarity.weaponperk.woodsman_twist=Каждый третий удар по одному врагу становится _сокрушительным_ и отбрасывает его на две клетки.
items.rarity.weaponperk.quarry=_%1$s:_ _%2$s_ попаданий _оглушают_ врага на 2 хода. Как инструмент, предмет требует на _%3$s_ меньше ударов при дроблении камня и копании; _%4$s_ добытого камня и руды дают дополнительную единицу материала.
items.rarity.weaponperk.quarry_twist=Оглушающий удар _раскалывает землю_, накладывая увечье на цель и всех соседних врагов.
items.rarity.weaponperk.bard=_%1$s:_ каждый удар звучит нотой, а каждая _четвёртая нота_ — аккордом. Аккорды чередуются: _ободряющий_ благословляет вас и союзников в радиусе трёх клеток на _%2$s ходов_, затем _устрашающий_ обращает врагов в радиусе двух клеток в бегство на то же время.
items.rarity.weaponperk.bard_twist=Каждый аккорд также _очаровывает_ самого слабого врага в радиусе трёх клеток на 5 ходов.
items.rarity.weaponperk.lash=_%1$s:_ удары с расстояния от двух клеток наносят на _%2$s_ больше урона, а _%3$s_ из них _притягивают_ врага на одну клетку к вам и калечат его на 2 хода.
items.rarity.weaponperk.lash_twist=Каждый пятый удар _обезоруживает_ врага: его следующее успешное попадание наносит вдвое меньше урона.
items.rarity.gearperk.mending=_%1$s:_ вы восстанавливаете здоровье на _%2$s_ быстрее.
items.rarity.gearperk.mending_twist=При полном здоровье лишнее лечение _накапливается как щит_ вплоть до _%1$s_ от максимального здоровья.
items.rarity.gearperk.nimble=_%1$s:_ броня повышает уклонение на _%2$s_.
items.rarity.gearperk.nimble_twist=Каждое уклонение дополнительно повышает шанс уклонения на _%1$s_, до трёх раз. Первый полученный удар сбрасывает эффект.
items.rarity.gearperk.bulwark=_%1$s:_ пока вы стоите на месте, входящий урон снижается на величину до _%2$s_. Для накопления полной защиты нужно не двигаться два хода; атаки на месте её не сбрасывают.
items.rarity.gearperk.bulwark_twist=Защита никогда не исчезает полностью, а поглощённый урон _переходит в вашу следующую атаку_.
items.rarity.gearperk.stalwart=_%1$s:_ минимальное блокирование брони всегда составляет не меньше _%2$s_ от максимального.
items.rarity.gearperk.stalwart_twist=_Недостающая сила_ в размере _%1$s_ единиц не учитывается при расчёте устойчивости и уклонения.
items.rarity.gearperk.striker=_%1$s:_ ваши атаки наносят на _%2$s_ больше урона.
items.rarity.gearperk.striker_twist=Ваши удары находят бреши и игнорируют _%1$s_ брони цели.
items.rarity.gearperk.ward=_%1$s:_ _%2$s_ отрицательных эффектов не закрепляются на вас. Шанс выше, если вы уже страдаете от других эффектов.
items.rarity.gearperk.ward_twist=Отражённый отрицательный эффект не сможет подействовать на вас снова в течение _%1$s ходов_.
items.rarity.gearperk.attune=_%1$s:_ волшебные палочки и артефакты перезаряжаются на _%2$s_ быстрее, а запас маны увеличивается.
items.rarity.gearperk.attune_twist=Первое применение полностью заряженной палочки действует так, словно её уровень выше на _%1$s_.
items.rarity.gearperk.provision=_%1$s:_ вы находите на _%2$s_ больше золота, особенно на глубоких этажах, а голод наступает на _%3$s_ медленнее.
items.rarity.gearperk.provision_twist=Монеты теперь словно еда: каждая подобранная кучка золота _немного насыщает вас_.
items.rarity.gearperk.resonance=_%1$s:_ _%2$s_ применений палочки не расходуют заряд. Шанс растёт с уровнем палочки.
items.rarity.gearperk.resonance_twist=Бесплатное применение оставляет палочку заряженной энергией, и следующее действует на _%1$s_ уровней сильнее.
items.rarity.gearperk.binding=_%1$s:_ поражённые палочкой враги с вероятностью _%2$s_ получают _увечье_. Длительность растёт с уровнем палочки.
items.rarity.gearperk.binding_twist=Эффект _перекидывается_ на ближайшего другого врага, но длится вдвое меньше.
items.rarity.gearperk.wellspring=_%1$s:_ палочка перезаряжается на _%2$s_ быстрее. Бонус растёт с её уровнем.
items.rarity.gearperk.wellspring_twist=Применение палочки при полном заряде больше не теряет энергию: можно накопить до _%1$s зарядов сверх максимума_.
items.rarity.gearperk.legion=_%1$s:_ палочка действует на _%2$s_ уровней выше. Бонус растёт с её улучшением.
items.rarity.gearperk.legion_twist=Разряды палочки _создают щит на видимых союзниках_ силой _%1$s_ от их максимального здоровья.
items.rarity.gearperk.fortune=_%1$s:_ пока предмет при вас, вы находите на _%2$s_ больше золота. Бонус растёт с его уровнем.
items.rarity.gearperk.fortune_twist=В магазинах вам делают скидку, а _%1$s_ кучек золота оказываются _вдвое больше_.
items.rarity.gearperk.omen=_%1$s:_ пока предмет при вас, уклонение повышается на _%2$s_. Бонус растёт с его уровнем.
items.rarity.gearperk.omen_twist=Предмет действует _на один уровень выше_, но не сверх предела.
items.rarity.gearperk.vitality=_%1$s:_ пока предмет при вас, здоровье восстанавливается на _%2$s_ быстрее. Бонус растёт с его уровнем.
items.rarity.gearperk.vitality_twist=Если здоровье падает ниже трети, каждое восстановление также _снимает кровотечение или отравление_.
items.rarity.gearperk.escape=_%1$s:_ артефакт заряжается быстрее, а вы передвигаетесь на _%2$s_ быстрее.
items.rarity.gearperk.escape_twist=Несколько ходов после полученного удара бонус к скорости дополнительно увеличивается на _%1$s_.
items.rarity.gearperk.assault=_%1$s:_ артефакт заряжается быстрее, а ваши атаки наносят на _%2$s_ больше урона.
items.rarity.gearperk.assault_twist=Атаки в последовательные ходы дополнительно увеличивают урон на _%1$s_, до трёх раз.
items.rarity.gearperk.insight=_%1$s:_ артефакт заряжается быстрее, а точность атак повышается на _%2$s_.
items.rarity.gearperk.insight_twist=После любого промаха ваша следующая атака _обязательно попадёт в цель_.
items.rarity.gearperk.sustain=_%1$s:_ пока предмет надет, здоровье восстанавливается на _%2$s_ быстрее, а голод наступает на _%3$s_ медленнее.
items.rarity.gearperk.sustain_twist=Когда полученный удар впервые опускает здоровье ниже трети, организм _использует накопленные силы, чтобы подлечить вас_.
items.rarity.gearperk.warden=_%1$s:_ пока предмет надет, уклонение повышается на _%2$s_, а получаемый урон уменьшается.
items.rarity.gearperk.warden_twist=_%1$s_ отражённого бронёй урона _возвращается нападающему_.
