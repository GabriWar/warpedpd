items.rarity.quality.header=Esta é uma peça _%1$s_ do tipo _%2$s_.
items.rarity.quality.unknown=O que a raridade e o tipo fazem pela peça fica oculto até ela ser identificada.
items.rarity.quality.unknown_lines=As linhas de bônus e a força com que rolaram ficam ocultas até a peça ser identificada.
items.rarity.quality.unknown_perk=O que este tipo faz pela peça fica oculto até ela ser identificada.
items.rarity.quality.potency=Só a raridade já soma _%d%%_ ao próprio dano, bloqueio ou poder da peça.
items.rarity.quality.masterwork=Obra-prima _%1$d/%2$d_: cada etapa aumenta todas as linhas de bônus em 15%%. Ela já matou _%3$d_ inimigos.
items.rarity.quality.masterwork_full=_Obra-prima completa._ Todas as linhas de bônus são dobradas, e cada morte que ela causa restaura você (vida nas armas, uma carga nas varinhas, uma barreira nas armaduras). Ela já matou _%3$d_ inimigos.
items.rarity.masterworkcore.name=núcleo de obra-prima
items.rarity.masterworkcore.desc=Um nó denso do próprio poder da masmorra, arrancado do coração de um chefe. O Troll Ferreiro da cidade usa o núcleo numa arma, armadura, arma de arremesso ou varinha: cada núcleo é uma etapa de obra-prima. Ele também derrete a raridade de um item e a gira de novo na roda dele, com chances melhores quanto mais núcleos você apostar, até dez.\n\nSão cinco etapas: cada uma das quatro primeiras aumenta em 15% todos os bônus de raridade do item, e a quinta, que só aceita uma base lendária ou exótica, dobra todos eles.
items.rarity.masterworkcore.not_enough=Esta etapa precisa de %d núcleos.
items.rarity.masterworkcore.already=O item %s já é uma obra-prima completa.
items.rarity.masterworkcore.needs_legendary=A última etapa só aceita %s de raridade lendária ou exótica.
items.rarity.masterworkcore.done=O item %1$s agora é obra-prima %2$d/%3$d.
items.rarity.masterworkcore.done_full=O item %1$s agora é uma obra-prima completa!
items.rarity.masterworkcore.rerolled=O item %1$s sai da forja com raridade %2$s.
items.rarity.masterworkcore.opt_masterwork=Fazer obra-prima num item
items.rarity.masterworkcore.opt_reroll=Rerrolar uma raridade (1-%d núcleos)
items.rarity.masterworkcore.pick_masterwork=Escolha um item para a obra-prima
items.rarity.masterworkcore.pick_reroll=Escolha um item para rerrolar
items.rarity.typeshifter.name=mutador de tipo
items.rarity.typeshifter.desc=Uma lasca de metal mutável que se acomoda em tudo o que toca. Aplicada a uma arma, armadura, arma de arremesso ou varinha, ela sobe o tipo do item em um passo: de gama para beta com um mutador, de beta para alfa com dois. Ela nunca baixa um tipo.
items.rarity.typeshifter.ac_shift=MUDAR
items.rarity.typeshifter.prompt=Escolha um item para mudar de tipo
items.rarity.typeshifter.already_alpha=O item %s já é alfa, o tipo mais alto.
items.rarity.typeshifter.not_enough=Subir para %2$s exige %1$d mutadores.
items.rarity.typeshifter.shifted=O item %1$s agora é do tipo %2$s!
items.rarity.quality.tab_rarity=Raridade _%1$s_, com _%2$d_ linhas de bônus:
items.rarity.quality.tab_type=Tipo _%s_:
items.rarity.quality.tab_type_current=Tipo _%s_ (o tipo desta peça):
items.rarity.quality.tab_type_cost=Chegar a este tipo a partir do atual exige _%d_ mutadores de tipo.
items.rarity.quality.masterwork_next=A próxima etapa custa _%d_ núcleo de obra-prima.
items.rarity.quality.tab_rarity_other=Uma peça _%1$s_ soma _%6$d%%_ ao próprio dano, bloqueio ou poder e tem _%2$d_ linhas de bônus, roladas entre _%3$d%%_ e _%4$d%%_ do máximo. Pode cair a partir do andar _%5$d_.
items.rarity.quality.tab_rarity_other_gear=Uma peça _%1$s_ tem _%2$d_ linhas de bônus, roladas entre _%3$d%%_ e _%4$d%%_ do máximo. Pode cair a partir do andar _%5$d_.
items.rarity.quality.tab_vestige=Ela também tem um _encantamento vestigial_, um eco fraco de uma magia que nunca chegou a pegar:
items.rarity.quality.tab_rarity_other_vestige= As armas dessa raridade também têm um _encantamento vestigial_, que ativa só uma fração das vezes que um verdadeiro ativaria.
items.rarity.quality.tab_vestige_glyph=Ela também tem um _glifo vestigial_, um eco fraco de uma magia que nunca chegou a pegar:
items.rarity.quality.tab_rarity_other_vestige_glyph=As armaduras dessa raridade também têm um _glifo vestigial_, que responde só uma fração das vezes que um verdadeiro responderia.
items.rarity.quality.slot_common=A linha dela é um bônus simples.
items.rarity.quality.slot_uncommon=A linha dela é um traço: %s.
items.rarity.quality.slot_rare=Uma linha é um traço (%s), a outra um bônus simples.
items.rarity.weaponperk.tile=%d quadrado
items.rarity.weaponperk.tiles=%d quadrados
items.rarity.weaponperk.gun_name=Artilheiro
items.rarity.weaponperk.gun=_%1$s:_ tiros em inimigos a _três quadrados ou mais de distância_ causam até _%2$s_ a mais de dano, e _%3$s_ das recargas não gastam tempo.
items.rarity.weaponperk.gun_twist=Um tiro em cada cinco _não gasta bala_.
items.rarity.weaponperk.boomerang_name=Curva
items.rarity.weaponperk.boomerang=_%1$s:_ o arremesso segue voando através de até _%2$s_ inimigos a mais e, na volta, atinge cada inimigo no caminho com _%3$s_ de um golpe.
items.rarity.weaponperk.boomerang_twist=Ele volta depois de _2 turnos_ em vez de 5.
items.rarity.weaponperk.scythe_name=Ceifador
items.rarity.weaponperk.scythe=_%1$s:_ todo golpe também _varre_ os outros inimigos ao seu lado com _%2$s_ do golpe e, se você carrega a arma, ela dá uma _segunda semente_ em _%3$s_ das plantações e da grama alta que você corta.
items.rarity.weaponperk.scythe_twist=Inimigos varridos _sangram_.
items.rarity.weaponperk.shot_name=Atirador
items.rarity.weaponperk.shot=_%1$s:_ tiros em inimigos a _três quadrados ou mais de distância_ causam até _%2$s_ a mais de dano, e quanto mais longe o tiro, mais ele ganha.
items.rarity.weaponperk.shot_twist=Tiros a _%1$s quadrados ou mais de distância_ nunca erram e atravessam direto parte da armadura do alvo.
items.rarity.weaponperk.guard_name=Guarda
items.rarity.weaponperk.guard=_%1$s:_ com a arma em mãos, todo golpe que você recebe é amortecido em _%2$s_, valor que cresce com o tier e o nível da arma.
items.rarity.weaponperk.guard_twist=Fique firme por dois turnos e o próximo golpe é _desviado por inteiro_, com _%1$s_ dele devolvido direto.
items.rarity.weaponperk.reach_name=Alcance
items.rarity.weaponperk.reach=_%1$s:_ golpes a _dois quadrados ou mais_ de distância causam _%2$s_ a mais de dano.
items.rarity.weaponperk.reach_twist=A arma golpeia _um quadrado mais longe_ do que o comprimento dela permite.
items.rarity.weaponperk.swift_name=Rajada
items.rarity.weaponperk.swift=_%1$s:_ você ataca até _%2$s_ mais rápido; o bônus cresce enquanto seus golpes continuam acertando e some assim que um erra.
items.rarity.weaponperk.swift_twist=Todo _quinto golpe que acerta_ não gasta tempo nenhum.
items.rarity.weaponperk.crush_name=Esmagamento
items.rarity.weaponperk.crush=_%1$s:_ todo golpe causa _%2$s_ a mais de dano e ignora _%3$s_ da armadura do alvo.
items.rarity.weaponperk.crush_twist=Os golpes _rompem_ o que sobrou da armadura, acumulando até três vezes no mesmo inimigo.
items.rarity.weaponperk.wild_name=Selvagem
items.rarity.weaponperk.wild=_%1$s:_ _%2$s_ dos golpes saem _selvagens_ e causam _%3$s_ a mais de dano.
items.rarity.weaponperk.wild_twist=Golpes selvagens abrem um _sangramento_.
items.rarity.weaponperk.keen_name=Emboscada
items.rarity.weaponperk.keen=_%1$s:_ _ataques surpresa_ causam _%2$s_ a mais de dano e ignoram _%3$s_ da armadura do alvo. Com a arma em mãos, você _sente inimigos_ a até _%4$s_, mesmo através das paredes.
items.rarity.weaponperk.keen_twist=Um ataque surpresa _executa_ qualquer coisa que já esteja perto da morte, e esse golpe não gasta tempo.
items.rarity.weaponperk.siphon_name=Sifão
items.rarity.weaponperk.siphon=_%1$s:_ todo golpe restaura _%2$s_ da sua mana máxima, 3 no máximo.
items.rarity.weaponperk.siphon_twist=Com a reserva já cheia, a mana vira _blindagem_ em vez de ser desperdiçada.
items.rarity.weaponperk.momentum_name=Embalo
items.rarity.weaponperk.momentum=_%1$s:_ cada golpe seguido no mesmo inimigo causa _%3$s_ a mais de dano, já a partir do primeiro, acumulando quatro vezes, até _%2$s_ no total. Um erro recomeça a contagem.
items.rarity.weaponperk.momentum_twist=Matar com três acúmulos ou mais devolve o tempo do ataque e _leva os acúmulos_ para o seu próximo inimigo.
items.rarity.weaponperk.dart_name=Pontas
items.rarity.weaponperk.dart=_%1$s:_ acertos de dardo causam mais dano quanto mais o alvo já sofre, até _%2$s_, e um dardo embebido mantém a ponta em _%3$s_ dos acertos.
items.rarity.weaponperk.dart_twist=O alvo atingido fica _enraizado_, e quanto mais pesado o dardo, mais tempo dura.
items.rarity.weaponperk.throw_name=Afiado
items.rarity.weaponperk.throw=_%1$s:_ _%2$s_ dos arremessos saem afiados e causam _%3$s_ a mais de dano, e um arremesso afiado que não quebra _volta para a sua mão_.
items.rarity.weaponperk.throw_twist=Seus arremessos alcançam um inimigo _através das paredes_ a até 3 quadrados.
items.rarity.weaponperk.impact_name=Arremesso Pesado
items.rarity.weaponperk.impact=_%1$s:_ _arremesse com força_ em vez de jogar: o arremesso leva _dois turnos_ e causa _%2$s_ a mais de dano.
items.rarity.weaponperk.impact_twist=Um arremesso com força cai com uma _onda de choque_ que atinge todo inimigo ao lado do alvo com _%1$s_ do golpe.
items.rarity.weaponperk.woodsman_name=Lenhador
items.rarity.weaponperk.woodsman=_%1$s:_ cada golpe no mesmo inimigo _lasca a armadura dele_ e ignora mais _%2$s_ dela, até três vezes. Derrubar e cortar árvores leva _%3$s_ menos machadadas, e _%4$s_ das árvores derrubadas dão uma tora extra.
items.rarity.weaponperk.woodsman_twist=Todo terceiro golpe no mesmo inimigo é um _golpe de derrubada_ que o empurra dois quadrados para trás.
items.rarity.weaponperk.quarry_name=Pedreira
items.rarity.weaponperk.quarry=_%1$s:_ _%2$s_ dos golpes _atordoam_ o inimigo por 2 turnos. Como ferramenta, quebra pedra ou cava com _%3$s_ menos golpes, e _%4$s_ da pedra e do minério que ela tira vêm com um a mais.
items.rarity.weaponperk.quarry_twist=Um golpe atordoante _racha o chão_, aleijando o inimigo e todos os inimigos ao lado dele.
items.rarity.weaponperk.bard_name=Bardo
items.rarity.weaponperk.bard=_%1$s:_ todo golpe toca uma nota, e toda _quarta nota_ toca um acorde, alternando: um _brado_ que abençoa você e seus aliados a até 3 quadrados por _%2$s turnos_, depois um _pavor_ que aterroriza os inimigos a até 2 quadrados pelo mesmo tempo.
items.rarity.weaponperk.bard_twist=Cada acorde também _encanta_ o inimigo mais fraco a até 3 quadrados por 5 turnos.
items.rarity.weaponperk.lash_name=Açoite
items.rarity.weaponperk.lash=_%1$s:_ golpes a dois quadrados ou mais de distância causam _%2$s_ a mais de dano, e _%3$s_ deles _puxam_ o inimigo um quadrado na sua direção, aleijado por 2 turnos.
items.rarity.weaponperk.lash_twist=Um golpe em cada cinco _desarma_ o inimigo: o próximo golpe dele que acertar causa metade do dano.
items.rarity.gearperk.mending_name=Restauração
items.rarity.gearperk.mending=_%1$s:_ você regenera vida _%2$s_ mais rápido.
items.rarity.gearperk.mending_twist=Com a vida cheia, a cura é _guardada como blindagem_ em vez de desperdiçada, até _%1$s_ da sua vida máxima.
items.rarity.gearperk.nimble_name=Agilidade
items.rarity.gearperk.nimble=_%1$s:_ a armadura dá _%2$s_ a mais de evasão.
items.rarity.gearperk.nimble_twist=Cada esquiva acumula _%1$s_ a mais de evasão, no máximo três vezes, até que um golpe enfim acerte.
items.rarity.gearperk.bulwark_name=Baluarte
items.rarity.gearperk.bulwark=_%1$s:_ os golpes são amortecidos em até _%2$s_ enquanto você fica firme; leva dois turnos sem dar um passo para firmar, e atacar sem sair do lugar mantém o efeito.
items.rarity.gearperk.bulwark_twist=A muralha nunca cai por inteiro, e o dano que ela segura é _guardado para o seu próximo ataque_.
items.rarity.gearperk.stalwart_name=Firmeza
items.rarity.gearperk.stalwart=_%1$s:_ o bloqueio mínimo da armadura nunca fica abaixo de _%2$s_ do máximo dela.
items.rarity.gearperk.stalwart_twist=_%1$s_ pontos de força que faltam são ignorados, tanto no seu movimento quanto na sua evasão.
items.rarity.gearperk.striker_name=Golpeador
items.rarity.gearperk.striker=_%1$s:_ seus ataques causam _%2$s_ a mais de dano.
items.rarity.gearperk.striker_twist=Seus golpes acham as brechas e ignoram _%1$s_ da armadura do alvo.
items.rarity.gearperk.ward_name=Proteção
items.rarity.gearperk.ward=_%1$s:_ _%2$s_ dos debuffs escorregam de você assim que chegam, com mais facilidade quanto mais você já sofre.
items.rarity.gearperk.ward_twist=O que você repele não pode afetar você de novo por _%1$s turnos_.
items.rarity.gearperk.attune_name=Sintonia
items.rarity.gearperk.attune=_%1$s:_ suas varinhas e artefatos recarregam _%2$s_ mais rápido, e sua reserva de mana cresce junto.
items.rarity.gearperk.attune_twist=O primeiro disparo depois que uma varinha enche sai _%1$s níveis acima_.
items.rarity.gearperk.provision_name=Provisão
items.rarity.gearperk.provision=_%1$s:_ você encontra _%2$s_ a mais de ouro, mais ainda nos andares fundos, e fica com fome _%3$s_ mais devagar.
items.rarity.gearperk.provision_twist=Moeda é comida: cada pilha que você pega _alimenta você_ um pouco.
items.rarity.gearperk.resonance_name=Ressonância
items.rarity.gearperk.resonance=_%1$s:_ _%2$s_ dos disparos não gastam carga, mais conforme a varinha é aprimorada.
items.rarity.gearperk.resonance_twist=Um disparo grátis deixa a varinha zumbindo, e o próximo sai _%1$s níveis acima_.
items.rarity.gearperk.binding_name=Amarra
items.rarity.gearperk.binding=_%1$s:_ inimigos atingidos pela varinha têm _%2$s_ de chance de ficar _aleijados_, por mais tempo conforme a varinha sobe de nível.
items.rarity.gearperk.binding_twist=A amarra _se espalha_ para o outro inimigo mais próximo, com metade da duração.
items.rarity.gearperk.wellspring_name=Nascente
items.rarity.gearperk.wellspring=_%1$s:_ a varinha recarrega _%2$s_ mais rápido, mais conforme é aprimorada.
items.rarity.gearperk.wellspring_twist=Disparar com a carga cheia não desperdiça mais a barra: ela guarda até _%1$s cargas acima do máximo_.
items.rarity.gearperk.legion_name=Legião
items.rarity.gearperk.legion=_%1$s:_ a varinha funciona _%2$s_ níveis acima, mais conforme é aprimorada.
items.rarity.gearperk.legion_twist=Os disparos dela _dão blindagem aos aliados à vista_, igual a _%1$s_ da vida máxima de cada um.
items.rarity.gearperk.fortune_name=Fortuna
items.rarity.gearperk.fortune=_%1$s:_ enquanto você o carrega, encontra _%2$s_ a mais de ouro, mais conforme ele é aprimorado.
items.rarity.gearperk.fortune_twist=As lojas vendem mais barato para você, e _%1$s_ das pilhas de ouro vêm _com o dobro_.
items.rarity.gearperk.omen_name=Presságio
items.rarity.gearperk.omen=_%1$s:_ enquanto você o carrega, ganha _%2$s_ a mais de evasão, mais conforme ele é aprimorado.
items.rarity.gearperk.omen_twist=Ele funciona _um nível acima_, até o limite dele.
items.rarity.gearperk.vitality_name=Vitalidade
items.rarity.gearperk.vitality=_%1$s:_ enquanto você o carrega, regenera vida _%2$s_ mais rápido, mais conforme ele é aprimorado.
items.rarity.gearperk.vitality_twist=Abaixo de um terço da vida, cada tique de cura também _limpa um sangramento ou um veneno_.
items.rarity.gearperk.escape_name=Fuga
items.rarity.gearperk.escape=_%1$s:_ o artefato carrega mais rápido e você anda _%2$s_ mais rápido.
items.rarity.gearperk.escape_twist=Por alguns turnos depois que um golpe acerta você, essa velocidade fica _%1$s_ maior.
items.rarity.gearperk.assault_name=Ofensiva
items.rarity.gearperk.assault=_%1$s:_ o artefato carrega mais rápido e seus ataques causam _%2$s_ a mais de dano.
items.rarity.gearperk.assault_twist=Atacar em turnos seguidos acumula _%1$s_ a mais de dano, até três vezes.
items.rarity.gearperk.insight_name=Intuição
items.rarity.gearperk.insight=_%1$s:_ o artefato carrega mais rápido e seus ataques ficam _%2$s_ mais precisos.
items.rarity.gearperk.insight_twist=Depois que um ataque seu erra, o próximo _não pode errar_.
items.rarity.gearperk.sustain_name=Sustento
items.rarity.gearperk.sustain=_%1$s:_ enquanto equipado, você regenera vida _%2$s_ mais rápido e fica com fome _%3$s_ mais devagar.
items.rarity.gearperk.sustain_twist=Na primeira vez que um golpe deixa você abaixo de um terço da vida, seu corpo _gasta as reservas para curar você_.
items.rarity.gearperk.warden_name=Sentinela
items.rarity.gearperk.warden=_%1$s:_ enquanto equipado, você ganha _%2$s_ a mais de evasão, e os golpes contra você são amortecidos.
items.rarity.gearperk.warden_twist=_%1$s_ do dano que ele desvia é _devolvido direto ao atacante_.
