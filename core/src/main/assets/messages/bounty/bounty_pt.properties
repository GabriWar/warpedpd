bounty.bounties.guard_rank1_1=Ah, você é quem dá uma mão por aqui. Seja bem-vindo de volta.
bounty.bounties.guard_rank1_2=Dia tranquilo. Dê uma olhada no quadro, sempre tem serviço.
bounty.bounties.guard_rank2_0=Amigo de %s! Precisando de alguma coisa, é só falar.
bounty.bounties.guard_rank2_1=Que bom que você anda por aqui. As estradas ficam mais seguras.
bounty.bounties.guard_rank2_2=Os anciãos falam bem de você. Eu também.
bounty.bounties.guard_rank3_0=Abram caminho, pessoal: um herói de %s!
