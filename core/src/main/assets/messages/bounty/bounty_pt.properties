bounty.bounties.hint_prey_albino_rat=Os ratos albinos saem à noite nas planícies e nos prados, e a qualquer hora na neve.
bounty.bounties.hint_prey_gray_wolf=Os lobos cinzentos caçam em matilha depois que escurece, na tundra, nos campos de neve e no sopé das montanhas.
bounty.bounties.hint_prey_brown_wolf=Os lobos marrons caçam nas florestas à noite, de dois ou três.
bounty.bounties.hint_prey_bat=Os morcegos-vampiros voam no fim da tarde e à noite sobre as florestas e o sopé das montanhas.
bounty.bounties.hint_prey_yeti=Os yetis andam pelos campos de neve, pela tundra e pelas montanhas. São poucos, e batem forte.
bounty.bounties.hint_prey_snake=As cobras ficam nos pântanos a qualquer hora, e no deserto depois que escurece.
bounty.bounties.hint_prey_scorpio=Os escorpiões caçam no deserto durante o dia.
bounty.bounties.hint_prey_slime=Os slimes se arrastam pelos pântanos a qualquer hora.
bounty.bounties.hint_prey_bananaspider=As aranhas-banana ficam à espreita nos pântanos a qualquer hora.
bounty.bounties.hint_prey_crab=Os caranguejos correm pelas praias durante o dia.
bounty.bounties.hunt_reach=Só contam as mortes a até %d passos do poço da vila. Volte a este quadro para receber.

