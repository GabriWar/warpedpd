bounty.bounties.hint_beast=Uma grande fera com nome próprio anda a até %1$d setores desta vila, por mais umas %2$d horas. Mate ela onde a encontrar e depois volte a este quadro para receber.
bounty.bounties.beast_gone=A caçada de %s acabou: a fera foi embora.
