bounty.bounties.hint_good_hide=Todo cervo deixa um couro. Lobos, cabras e yetis às vezes deixam.
bounty.bounties.hint_good_log=Derrube um carvalho com um machado. Os carvalhos crescem nas florestas, nos prados e nos pântanos.
bounty.bounties.hint_good_pine_log=Derrube um pinheiro com um machado. Os pinheiros crescem nas florestas e nos campos de neve.
bounty.bounties.hint_good_stone=Quebre pedregulhos ou rocha com uma picareta ou um martelo de pedreiro.
bounty.bounties.hint_good_thatch=Corte o capim alto com uma foice.
bounty.bounties.hint_good_clay=Cave a margem de um rio ou o chão de um pântano com uma pá.
bounty.bounties.hint_good_sand=Cave uma praia ou o deserto com uma pá.
bounty.bounties.hint_good_copper=Os veios de cobre brilham na rocha das cavernas debaixo do mundo. Tire com uma picareta.
bounty.bounties.hint_good_iron=Os veios de ferro brilham na rocha das cavernas debaixo do mundo. Tire com uma picareta.
bounty.bounties.hint_good_fish=Os pescadores que trabalham nas pontes dos rios vendem o que pescam, e qualquer peixe cru que você pegar com a vara também vale.
bounty.bounties.hint_good_seeds=O capim alto pisoteado solta sementes de todo tipo. Qualquer semente serve.
bounty.bounties.gather_hand_in=Entregue tudo neste quadro.

bounty.bounties.hint_deliver=Leve a encomenda a um ancião de %1$s, que fica do lado %2$s daqui, a %3$d passos de um poço ao outro, em umas %4$d horas. Os anciãos ficam sentados na frente de casa durante o dia e vão dormir cedo. As estradas e as pedras do caminho encurtam a viagem.

