bounty.bounties.parcel_late=The parcel for %s is overdue. Its elder will still take it, but pay nothing.
bounty.bounties.parcel_arrived=This is %1$s. The parcel goes to its elder, whose house stands %2$s of the well.
bounty.bounties.delivered_late=You hand over the parcel for %s, too late for any pay.

bounty.bounties.villager_elder_way=That's for our elder. Their house is the one %s of the well.
bounty.bounties.elder_thanks=A parcel from %s? Bless you, traveller. Here's your fee.
bounty.bounties.elder_late=From %s? This was due long ago. I'll take it, but there's no fee for a late parcel.
bounty.bounties.villager_thanks=Our elder isn't about. I'll see they get it. From %s, is it? Here's your fee.
bounty.bounties.villager_late=Our elder isn't about, and this is late besides. I'll pass it on, but there's no fee for it.

bounty.bounties.guard_parcel=That parcel's for our elder. Their house is the one %s of the well.
bounty.bounties.guard_rank1_0=Good to see you again. %s owes you one.
bounty.bounties.guard_rank1_1=Ah, the one who helps out round here. Welcome back.
bounty.bounties.guard_rank1_2=Quiet day. Have a look at the board, there's always work.
bounty.bounties.guard_rank2_0=Friend of %s! Anything you need, just ask.
bounty.bounties.guard_rank2_1=Glad you're about. The roads feel safer when you are.
bounty.bounties.guard_rank2_2=The elders speak well of you. So do I.
bounty.bounties.guard_rank3_0=Make way, everyone: a hero of %s!
bounty.bounties.guard_rank3_1=Your name's on everyone's lips here. Welcome home.
bounty.bounties.guard_rank3_2=There's a seat by the well with your name on it.
bounty.bounties.guard_prey=Looking for %1$s? I saw some %2$d paces to the %3$s just now.
bounty.bounties.guard_prey_none=No %s about just now. Try again later, or further out.
