bounty.bounties.beast_yeti=elder yeti
bounty.bounties.beast_scorpion=giant scorpion
bounty.bounties.hint_beast=A great beast with a name of its own roams within %1$d sectors of this village, for about %2$d more hours. Kill it wherever you find it, then come back to this board for your pay.
bounty.bounties.beast_gone=The hunt for %s is over: the beast is gone.
bounty.bounties.guard_beast=Looking for %1$s? It was seen %2$d paces to the %3$s just now.
bounty.bounties.guard_beast_none=No sign of %s about just now. The folk say it roams these parts.

