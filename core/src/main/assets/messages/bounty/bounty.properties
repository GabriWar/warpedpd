bounty.parcel.desc=A parcel wrapped in paper and tied with twine.
bounty.parcel.desc_due=A parcel from %1$s, wrapped in paper and tied with twine, for an elder of %2$s. It is due in about %3$d hours.
bounty.parcel.desc_late=A parcel from %1$s for an elder of %2$s. It is overdue: its elder will still take it, but pay nothing for it.
bounty.parcel.desc_forgotten=A parcel from %1$s for %2$s. Nobody is waiting for it any more.

