bounty.bounties.hint_prey_albino_rat=Albino rats come out at night on the plains and the meadows, and at any hour in the snow.
bounty.bounties.hint_prey_gray_wolf=Gray wolves hunt in packs after dark on the tundra, the snowfields and the foothills.
bounty.bounties.hint_prey_brown_wolf=Brown wolves hunt the forests at night, two or three together.
bounty.bounties.hint_prey_bat=Vampire bats fly at dusk and by night over the forests and the foothills.
bounty.bounties.hint_prey_yeti=Yetis roam the snowfields, the tundra and the mountains. They are few, and they hit hard.
bounty.bounties.hint_prey_snake=Snakes keep to the swamps at any hour, and to the desert after dark.
bounty.bounties.hint_prey_scorpio=Scorpios hunt the desert by day.
bounty.bounties.hint_prey_slime=Slimes ooze about the swamps at any hour.
bounty.bounties.hint_prey_bananaspider=Bananaspiders lurk in the swamps at any hour.
bounty.bounties.hint_prey_crab=Crabs scuttle along the beaches by day.
bounty.bounties.hunt_reach=Kills count within %d paces of the village's well. Come back to this board for your pay.

bounty.bounties.good_hide=hides
bounty.bounties.good_log=oak logs
bounty.bounties.good_pine_log=pine logs
bounty.bounties.good_stone=rough stones
bounty.bounties.good_thatch=bundles of thatch
bounty.bounties.good_clay=lumps of clay
bounty.bounties.good_sand=handfuls of sand
bounty.bounties.good_copper=lumps of copper ore
bounty.bounties.good_iron=lumps of iron ore
bounty.bounties.good_fish=fish
bounty.bounties.good_seeds=seeds

bounty.bounties.hint_good_hide=Deer always leave a hide. Wolves, goats and yetis sometimes do.
bounty.bounties.hint_good_log=Fell an oak with an axe. Oaks grow in the forests, on the meadows and in the swamps.
bounty.bounties.hint_good_pine_log=Fell a pine with an axe. Pines grow in the forests and on the snowfields.
bounty.bounties.hint_good_stone=Break boulders or rock with a pickaxe or a mason's hammer.
bounty.bounties.hint_good_thatch=Cut tall grass with a sickle.
bounty.bounties.hint_good_clay=Dig a river bank or swamp ground with a shovel.
bounty.bounties.hint_good_sand=Dig a beach or the desert with a shovel.
bounty.bounties.hint_good_copper=Copper veins glint in the rock of the caves under the world. Mine them with a pickaxe.
bounty.bounties.hint_good_iron=Iron veins glint in the rock of the caves under the world. Mine them with a pickaxe.
bounty.bounties.hint_good_fish=The fishermen who work the river bridges sell their catch, and any raw fish you catch on a rod counts too.
bounty.bounties.hint_good_seeds=Trampled tall grass gives up seeds of every kind. Any seeds will do.
bounty.bounties.gather_hand_in=Hand them in at this board.

bounty.bounties.hint_deliver=Carry the parcel to an elder of %1$s, %2$s of here, %3$d paces from well to well, within about %4$d hours. Elders sit outside their houses by day and turn in early. The roads and the waystones get you there faster.

