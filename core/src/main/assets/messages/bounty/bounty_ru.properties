### Additional reviewed Russian localization
bounty.bounties.hint_prey_albino_rat=Крысы-альбиносы появляются ночью на равнинах и лугах, а в снегах встречаются в любое время.
bounty.bounties.hint_prey_gray_wolf=Серые волки охотятся стаями после наступления темноты в тундре, на снежных полях и в предгорьях.
bounty.bounties.hint_prey_brown_wolf=Бурые волки по ночам рыщут по лесам, обычно по двое или трое.
bounty.bounties.hint_prey_bat=Летучие мыши-вампиры летают над лесами и предгорьями в сумерках и ночью.
bounty.bounties.hint_prey_yeti=Йети бродят по снежным полям, тундре и горам. Встречаются редко, но бьют очень сильно.
bounty.bounties.hint_prey_snake=Змеи встречаются в болотах в любое время, а в пустыне — после заката.
bounty.bounties.hint_prey_slime=Слизни ползают по болотам в любое время суток.
bounty.bounties.hint_prey_bananaspider=Банановые пауки скрываются в болотах в любое время суток.
bounty.bounties.hint_prey_crab=Днём крабы снуют по пляжам.
bounty.bounties.hunt_reach=Учитываются убийства в радиусе %d шагов от деревенского колодца. Вернитесь к этой доске за наградой.
bounty.bounties.hint_good_hide=С оленей всегда можно добыть шкуру. Иногда шкуры остаются также от волков, коз и йети.
bounty.bounties.hint_good_log=Срубите дуб топором. Дубы растут в лесах, на лугах и болотах.
bounty.bounties.hint_good_pine_log=Срубите сосну топором. Сосны растут в лесах и на снежных полях.
bounty.bounties.hint_good_stone=Разбейте валун или скалу киркой либо молотом каменщика.
bounty.bounties.hint_good_clay=Выкопайте глину лопатой на берегу реки или в болоте.
bounty.bounties.hint_good_sand=Накопайте песка лопатой на пляже или в пустыне.
bounty.bounties.hint_good_copper=Медные жилы поблёскивают в скалах подземных пещер. Добывайте руду киркой.
bounty.bounties.hint_good_iron=Железные жилы поблёскивают в скалах подземных пещер. Добывайте руду киркой.
bounty.bounties.hint_good_fish=Рыбаки на речных мостах продают улов. Подойдёт и любая сырая рыба, которую вы поймаете удочкой.
bounty.bounties.hint_good_seeds=Если примять высокую траву, из неё выпадут разные семена. Подойдут любые.
bounty.bounties.rank_up_1=Теперь в %1$s вас знают: торговцы дают скидку %2$d%%, а стражники встречают как друга.
bounty.bounties.rank_up_2=Теперь в %1$s вам доверяют: торговцы дают скидку %2$d%%, а стражники подсказывают, где в последний раз видели вашу добычу.
bounty.bounties.rank_up_3=Теперь в %1$s вас почитают: торговцы дают скидку %2$d%%.
bounty.bounties.full=У вас уже есть %d объявлений о награде. Сначала выполните одно из заданий или откажитесь от него.

# Дополнение русского перевода: пакет 500 ключей
bounty.bounties.hint_deliver=Отнесите посылку старейшине деревни %1$s. Направление — %2$s, расстояние от колодца до колодца — %3$d шагов. На доставку около %4$d ч. Днём старейшины сидят возле своих домов, а спать ложатся рано. По дорогам и с помощью путевых камней вы доберётесь быстрее.
bounty.bounties.paid_bonus=%1$s выдаёт вам %2$d золотых и %3$s.
bounty.bounties.hunt_count=Заказ деревни %2$s: убито %3$d из %4$d (%1$s).
bounty.bounties.hunt_done=Охотничий заказ деревни %s выполнен. Заберите награду с доски объявлений.
bounty.bounties.gather_ready=Для деревни %2$s собрано всё необходимое: %1$s. Заберите награду с доски объявлений.
bounty.bounties.parcel_due=Посылку для %1$s нужно доставить примерно за %2$d ч.
bounty.bounties.parcel_late=Срок доставки посылки для %s истёк. Старейшина всё ещё примет её, но награды не даст.
bounty.bounties.parcel_arrived=Вы прибыли в деревню %1$s. Посылку нужно отдать старейшине, чей дом находится в направлении %2$s от колодца.
bounty.bounties.delivered_late=Вы отдаёте посылку для %s, но срок доставки уже истёк. Награды не будет.
bounty.bounties.villager_elder_way=Это для нашего старейшины. Его дом находится в направлении %s от колодца.
bounty.bounties.elder_thanks=Посылка из %s? Спасибо тебе, путник! Вот твоя награда.
bounty.bounties.elder_late=Из %s? Её давно должны были доставить. Я приму посылку, но за просрочку не заплачу.
bounty.bounties.villager_thanks=Старейшины сейчас нет. Я передам ему посылку. Из %s, говоришь? Вот твоя награда.
bounty.bounties.villager_late=Старейшины сейчас нет, а посылка к тому же опоздала. Я её передам, но награды не будет.
bounty.bounties.guard_parcel=Эта посылка для нашего старейшины. Его дом находится в направлении %s от колодца.
bounty.bounties.guard_rank1_0=Снова рад тебя видеть! %s перед тобой в долгу.
bounty.bounties.guard_rank1_1=А, вот и наш помощник! С возвращением.
bounty.bounties.guard_rank1_2=Сегодня спокойно. Загляни на доску объявлений — работа всегда найдётся.
bounty.bounties.guard_rank2_0=Друг деревни %s! Если что понадобится — только скажи.
bounty.bounties.guard_rank2_1=Рад, что ты здесь. С тобой дороги кажутся безопаснее.
bounty.bounties.guard_rank2_2=Старейшины о тебе хорошо отзываются. И я тоже.
bounty.bounties.guard_rank3_0=Расступитесь! Герой деревни %s идёт!
bounty.bounties.guard_rank3_1=Здесь все только о тебе и говорят. С возвращением домой!
bounty.bounties.guard_rank3_2=У колодца для тебя всегда найдётся место.
bounty.bounties.guard_prey=Ищешь %1$s? Я только что видел их в %2$d шагах на %3$s.
bounty.bounties.guard_prey_none=Сейчас поблизости нет никого из тех, кого ты ищешь: %s. Загляни позже или поищи подальше.
bounty.bounties.hint_beast=В пределах %1$d секторов от деревни бродит могучий зверь с собственным именем. Он будет в этих краях ещё около %2$d ч. Найдите и убейте его, а затем вернитесь к этой доске за наградой.
bounty.bounties.beast_gone=Охота на %s закончилась: зверь исчез.
bounty.bounties.guard_beast=Ищешь %1$s? Его видели в %2$d шагах на %3$s.
bounty.bounties.guard_beast_none=Свежих следов нет: %s поблизости не появлялся. Но местные говорят, что он бродит по этим землям.
bounty.bounties.board_empty=Все объявления сняты.
bounty.bounties.board_guest=В совместной игре только ведущий может брать задания с доски и получать награды.
bounty.noticeboard.desc=Доска объявлений деревни %s под небольшим навесом. Здесь жители оставляют поручения: охотиться на зверей, собирать припасы и доставлять посылки. Подойдите, чтобы прочитать объявления.
bounty.parcel.desc=Посылка, завёрнутая в бумагу и перевязанная бечёвкой.
bounty.parcel.desc_due=Посылка из %1$s для старейшины деревни %2$s, завёрнутая в бумагу и перевязанная бечёвкой. На доставку осталось около %3$d ч.
bounty.parcel.desc_late=Посылка из %1$s для старейшины деревни %2$s. Срок доставки истёк: старейшина примет её, но ничего не заплатит.
bounty.parcel.desc_forgotten=Посылка из %1$s для %2$s. Её уже никто не ждёт.
bounty.wndnoticeboard.stranger=В деревне %s вас пока никто не знает. Выполняйте местные поручения, чтобы заслужить доверие жителей.
bounty.wndnoticeboard.standing=Ваша репутация в деревне %1$s: %2$s (выполнено заданий: %3$d). Местные торговцы дают вам скидку %4$d%%.
bounty.wndnoticeboard.bare=Все объявления сняты.
bounty.wndnoticeboard.gather_ready=Всё собрано. Сдайте добычу здесь.
bounty.wndnoticeboard.not_ready=Вы ещё не выполнили это поручение.
