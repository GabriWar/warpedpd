buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
    }
}

allprojects {

    ext {
        appName = 'Warped Pixel Dungeon'
        appPackageName = 'xyz.gabriwar.warpedpixeldungeon'

        //CI passes the commit count. Play already holds code 9410 from a branch whose
        //history was later rewritten, so the raw count (9393 on master) would go
        //backwards and Play refuses lower codes. Every build adds this offset; raise
        //it again if history is ever rewritten below the highest code on Play.
        appVersionCodeBump = 20
        appVersionCode = (project.hasProperty('appVersionCode') ? project.appVersionCode.toInteger() : 894) + appVersionCodeBump
        //versionName auto-bumps +1 per commit, each slot rolling 0-9 with carry
        //(commit 9127 -> 3.4.0, 9128 -> 3.4.1, ..., 9129 -> 3.4.2, 9139 -> 3.5.2).
        def _vv = appVersionCode - 8787
        appVersionName = _vv > 0 ? "${_vv.intdiv(100)}.${_vv.intdiv(10) % 10}.${_vv % 10}" : '3.4.0'

        appJavaCompatibility = JavaVersion.VERSION_11

        appAndroidCompileSDK = 36   //Android 16
        appAndroidMinSDK = 21       //Android 5.0
        appAndroidTargetSDK = 36    //Android 16

        gdxVersion = '1.14.0'
        gdxControllersVersion = '2.2.4'
        robovmVersion = '2.3.24'
    }
    version = appVersionName

    repositories {
        google()
        mavenCentral()
        maven { url 'https://central.sonatype.com/repository/maven-snapshots/' }
    }

}

//single source of truth for CI: `./gradlew -q printVersionName -PappVersionCode=N`
//prints the exact versionName the build uses, so release/feed naming can't drift
tasks.register('printVersionName') {
    doLast { println appVersionName }
}
tasks.register('printVersionCode') {
    doLast { println appVersionCode }
}