apply plugin: 'com.android.application'

android {
    namespace 'xyz.gabriwar.warpedpixeldungeon.android'
    compileSdk appAndroidCompileSDK
    compileOptions.sourceCompatibility = compileOptions.targetCompatibility = appJavaCompatibility

    sourceSets.main.assets.srcDirs = [new File(project(':core').projectDir, "/src/main/assets")]

    defaultConfig {
        manifestPlaceholders = [appName:appName]
        applicationId appPackageName

        versionCode appVersionCode
        versionName appVersionName

        minSdkVersion appAndroidMinSDK
        targetSdkVersion appAndroidTargetSDK
        resourceConfigurations += ['en_US', 'cs', 'de', 'el', 'es', 'fr', 'hu', 'in', 'it', 'ja', 'ko', 'nl', 'pl', 'pt', 'ru', 'tr', 'uk', 'vi', 'zh_CN']

    }

    flavorDimensions += 'store'
    productFlavors {
        github {
            dimension 'store'
        }
        playstore {
            dimension 'store'
            //Play Billing 8+ requires minSdk 23; scoped to this flavor so github
            //builds still install on Android 5.x
            minSdkVersion 23
        }
    }

    signingConfigs {
        release {
            //reads ~/.android/warped-release-keystore.properties (gitignored), or the
            //file pointed at by RELEASE_KEYSTORE_PROPS on CI
            def propsFile = file("${System.getProperty('user.home')}/.android/warped-release-keystore.properties")
            if (System.getenv("RELEASE_KEYSTORE_PROPS") != null) {
                propsFile = file(System.getenv("RELEASE_KEYSTORE_PROPS"))
            }
            if (propsFile.exists()) {
                def props = new Properties()
                propsFile.withInputStream { props.load(it) }
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
        debug {
            def ks = file("${System.getProperty('user.home')}/.android/debug.keystore")
            if (System.getenv("CI_KEYSTORE") != null) {
                ks = file(System.getenv("CI_KEYSTORE"))
            }
            if (ks.exists()) {
                storeFile ks
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            applicationIdSuffix ".indev"
            versionNameSuffix '-INDEV'
            dependencies {
                debugImplementation project(':services:updates:debugUpdates')
                //debug builds are what CI actually ships to players, so they read the real
            //gh-pages changelog feed too (debugNews serves canned articles; swap it back
            //in locally when testing the parser)
            debugImplementation project(':services:news:shatteredNews')
            }
        }
        release {

            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }

            //package native symbol tables (libgdx .so libs) into the bundle, so Play
            //can symbolicate native crashes and ANRs
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }

            //These lines enable R8, which is a code shrinker/optimizer/obfuscator.
            //This makes release APKs smaller and more efficient, but also makes debugging trickier
            //as the information produced in stack traces must be de-obfuscated.
            //See here: https://developer.android.com/studio/build/shrink-code#decode-stack-trace
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            dependencies {
                //the update service is per flavor, see the dependencies block below
                releaseImplementation project(':services:news:shatteredNews')
            }
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
}

configurations { natives }

dependencies {
    implementation project(':core')

    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86_64"
    implementation "com.badlogicgames.gdx-controllers:gdx-controllers-android:$gdxControllersVersion"
}

// called every time gradle gets executed, takes the native dependencies of
// the natives configuration, and extracts them to the proper libs/ folders
// so they get packed with the APK.
task copyAndroidNatives() {
    doFirst {
        file("libs/armeabi-v7a/").mkdirs()
        file("libs/arm64-v8a/").mkdirs()
        file("libs/x86/").mkdirs()
        file("libs/x86_64/").mkdirs()

        configurations.natives.copy().files.each { jar ->
            def outputDir = null
            if (jar.name.endsWith("natives-armeabi-v7a.jar")) outputDir = file("libs/armeabi-v7a")
            if (jar.name.endsWith("natives-arm64-v8a.jar")) outputDir = file("libs/arm64-v8a")
            if (jar.name.endsWith("natives-x86.jar")) outputDir = file("libs/x86")
            if (jar.name.endsWith("natives-x86_64.jar")) outputDir = file("libs/x86_64")
            if (outputDir != null) {
                copy {
                    from zipTree(jar)
                    into outputDir
                    include "*.so"
                }
            }
        }
    }
}

tasks.matching { it.name.contains("merge") && it.name.contains("JniLibFolders") }.configureEach { packageTask ->
    packageTask.dependsOn 'copyAndroidNatives'
}

//release update checker per flavor: github builds fetch releases from GitHub; Play
//builds must never point players outside the store, so they get a no-op. The
//flavor+buildType configurations only exist once the variants are computed.
afterEvaluate {
    dependencies {
        githubReleaseImplementation project(':services:updates:githubUpdates')
        playstoreReleaseImplementation project(':services:updates:playUpdates')
    }
}

dependencies {
    playstoreImplementation 'com.android.billingclient:billing:8.3.0'
    //Play Games Services v2 SDK (Play Store builds only); required before wiring up
    //Play Games sign-in and any leaderboard/achievement APIs.
    //PINNED: '+' silently picked up 22.0.0, which needs minSdk 24 while this flavor
    //is minSdk 23 - the manifest merger then fails a build that nothing here changed.
    //21.0.0 is the last release that still declares minSdk 21. Moving to 22 means
    //dropping Android 6 (API 23) devices, which is a release decision, not a build one
    playstoreImplementation 'com.google.android.gms:play-services-games-v2:21.0.0'
    //billing pulls kotlin-stdlib 1.8 while other deps still reference the pre-1.8
    //jdk7/jdk8 split artifacts; from 1.8 those are merged into the main stdlib, so
    //aligning them resolves the duplicate-class check
    constraints {
        playstoreImplementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        playstoreImplementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}
